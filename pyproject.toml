[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vicinitideals"
version = "0.1.0"
description = "Real estate financial modeling platform"
requires-python = ">=3.12"
dependencies = [
    # Core async DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # PostGIS column types for the flats.* schema. Pure Python — the heavy GIS
    # stack (shapely, rasterio, pyproj) stays in the `gis` extra.
    "geoalchemy2>=0.15",
    # Config / validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Financial math
    "pyxirr>=0.10",
    # Address normalization
    "usaddress>=0.5.10",
    "nicknames>=1.0.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "fastapi-mcp>=0.4",
    "mcp>=1.10,<2",  # fastapi-mcp 0.4.x breaks on mcp 2.0 (Server.__init__ signature)
    "celery[redis]>=5.3",
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyxirr>=0.10",
    "usaddress>=0.5.10",
    "openpyxl>=3.1",
    "instructor>=1.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
    # Sensitivity engine returns pandas.DataFrame tables.
    "pandas>=2.2",
]
worker = [
    "celery[redis]>=5.3",
    "instructor>=1.3",
    "openpyxl>=3.1",
    "markitdown[all]>=0.0.1",
    "flower>=2.0",
    # Browser automation for ASP.NET WebForms scrapers (Oregon eLicense and
    # future per-firm contact-info adapters). Plain httpx can't trigger the
    # CurrentFilter/UpdatePanel JS that Cavu-based ASP.NET sites require.
    "playwright>=1.44",
    "curl-cffi>=0.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyxirr>=0.10",
    "usaddress>=0.5.10",
    "httpx>=0.27",
]
tools = [
    "httpx>=0.27",
    "pyshp>=2.3",
]
# FLATS screening. Geometry and rule evaluation only — deliberately lighter than
# `gis`, which also carries the reprojection and raster stack that county data
# ingest needs and the screen does not. The FLATS web views will run against
# this set, so it stays installable without rasterio.
flats = [
    "shapely>=2.0",
    "numpy>=1.26",
    "pyyaml>=6",
    # Oregon codifiers publish zoning chapters as PDF, not HTML — Portland's
    # Title 33 included. Reading the source means reading PDFs.
    "pypdf>=5.1",
]
# Offline geospatial analysis ("Lot Analysis/quadfit") — not used by the app runtime.
gis = [
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "pyarrow>=16",
    "pandas>=2.2",
    "pyyaml>=6",
    "rasterio>=1.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    # Hard per-test timeout so a single hung integration test can't
    # burn the entire CI job (see Integration tests step in ci.yml).
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "anyio>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "celery[redis]>=5.3",
    # aiosqlite kept until legacy inline-SQLite test files (test_scenario,
    # test_scraper, test_dedup, test_benchmark_fixtures, the two tower_ap
    # script tests, test_routers) migrate to the Postgres conftest.
    "aiosqlite>=0.20",
    "openpyxl>=3.1",
    "ruff>=0.11",
    # Sync Postgres driver used only by tests/conftest.py for CREATE/DROP
    # DATABASE around the test session — those steps must run outside any
    # asyncio loop. asyncpg handles every other interaction.
    "psycopg2-binary>=2.9",
    # Excel COM bridge for the investor-export formula-conversion parity
    # tests (docs/feature-plans/investor-excel-formula-conversion.md §8).
    # Used to force Excel to recalc a workbook so openpyxl can read the
    # cached computed values via ``data_only=True``. Windows-only; CI
    # gates the parity tests on platform so non-Windows runs skip them.
    'pywin32>=306; platform_system == "Windows"',
]
e2e = [
    "pytest-playwright>=0.4",
    "playwright>=1.44",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "Lot Analysis/quadfit/tests", "flats/tests"]
pythonpath = ["."]
markers = [
    "unit: pure logic tests — no DB, no network (fast, <5s total)",
    "integration: tests that use the in-memory DB or the ASGI app",
    "slow: tests that are intentionally slow (scenario sweeps, benchmark fixtures)",
    "e2e: end-to-end browser tests via Playwright (requires live app)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*", "app/tasks/celery_app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]

[dependency-groups]
dev = [
    "pytest-playwright>=0.7.2",
]
