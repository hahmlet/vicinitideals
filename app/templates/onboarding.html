<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Up Your Organization — Viciniti Deals</title>
  <link rel="stylesheet" href="/static/app.css">
  <!-- TODO: self-host htmx at /static/htmx.min.js to avoid CDN dependency (matches base.html pattern) -->
  <script src="https://unpkg.com/htmx.org@2.0.9/dist/htmx.min.js" integrity="sha384-ESlCao+z/oasnu2Uc/5K1LQTI7YCF2KKO4xakCPQCFuiHhCh8Oa/R5NwHY6guZ3m" crossorigin="anonymous" defer></script>
  <style>
    body { justify-content: center; align-items: flex-start; background: var(--bg); padding-top: 60px; }
    .wizard-shell { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .wizard-header {
      width: 100%; max-width: 560px;
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 20px;
    }
    .wizard-brand { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
    .wizard-brand span { color: var(--accent); }
    .wizard-steps {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-muted);
    }
    .wizard-step-dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      background: var(--border); color: var(--text-muted);
    }
    .wizard-step-dot.active { background: var(--accent); color: #fff; }
    .wizard-step-dot.done { background: var(--accent-light, #dbeafe); color: var(--accent); }
    .wizard-step-label { font-size: 11px; color: var(--text-muted); }
    .wizard-step-connector { width: 32px; height: 1px; background: var(--border); }
    .wizard-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      width: 100%; max-width: 560px;
      display: flex; flex-direction: column;
      max-height: calc(100vh - 160px);
    }
    .wizard-body { padding: 32px 36px; overflow-y: auto; flex: 1; }
    .wizard-footer {
      padding: 16px 36px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface);
      position: sticky; bottom: 0;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .wizard-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .wizard-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    .field-group { margin-bottom: 18px; }
    .field-group label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 5px;
    }
    .field-group input { width: 100%; }
    .slug-row { display: flex; align-items: center; gap: 8px; }
    .slug-prefix { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
    .slug-indicator { font-size: 12px; min-width: 110px; }
    .auth-error { background: var(--danger-light); border: 1px solid #fca5a5; border-radius: var(--radius-sm); color: var(--danger); font-size: 13px; padding: 10px 12px; margin-bottom: 16px; }
    .invite-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .invite-row input { flex: 1; }
    .add-btn {
      background: none; border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--accent); font-size: 13px; font-weight: 600;
      padding: 6px 12px; cursor: pointer; white-space: nowrap;
    }
    .add-btn:hover { background: var(--bg); }
    .skip-link { font-size: 13px; color: var(--text-muted); cursor: pointer; text-decoration: underline; }
    .skip-link:hover { color: var(--text); }
  </style>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ request.state.csrf_token }}"}'>
  {% include "partials/onboarding_wizard.html" %}

  <script>
    var slugEdited = false;

    function autoSlug(name) {
      if (slugEdited) return;
      var slug = name.toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/[\s]+/g, '-')
        .replace(/-+/g, '-')
        .substring(0, 100);
      var slugInput = document.getElementById('org_slug');
      if (slugInput) {
        slugInput.value = slug;
        htmx.trigger(slugInput, 'keyup');
      }
    }

    function showRow(n) {
      var row = document.getElementById('invite-row-' + n);
      if (row) {
        row.style.display = 'flex';
        row.querySelector('input').focus();
      }
      var prevBtn = document.getElementById('add-btn-' + (n - 1));
      if (prevBtn) prevBtn.style.display = 'none';
    }

    // After HTMX swaps in a new step, re-attach JS that may reference new DOM elements
    document.body.addEventListener('htmx:afterSwap', function() {
      slugEdited = false;
    });

  </script>
</body>
</html>
