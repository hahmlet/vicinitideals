<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ deal_name }} — Shared Projects</title>
  <style>
    :root {
      --bg: #f6f7f9; --surface: #fff; --border: #e2e5ea; --text: #1f2430;
      --text-muted: #6b7280; --primary: #2563eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
    .h-title { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
    .h-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
    .p-grid { display: grid; gap: 12px; }
    .p-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
      text-decoration: none; color: var(--text); transition: border-color .12s, box-shadow .12s; }
    .p-card:hover { border-color: var(--primary); box-shadow: 0 1px 6px rgba(37,99,235,.12); }
    .p-icon { font-size: 26px; }
    .p-name { font-weight: 600; font-size: 15px; flex: 1; }
    .p-meta { color: var(--text-muted); font-size: 12px; }
    .p-arrow { color: var(--text-muted); font-size: 18px; }
    .p-empty { text-align: center; padding: 48px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="h-title">📁 {{ deal_name }}</div>
    <div class="h-sub">Shared deal — pick a project to view, download, and upload documents.</div>

    {% if projects %}
    <div class="p-grid">
      {% for p in projects %}
      <a class="p-card" href="{{ p.url }}">
        <span class="p-icon">📂</span>
        <span class="p-name">{{ p.name }}</span>
        <span class="p-meta">{{ p.doc_count }} document{{ '' if p.doc_count == 1 else 's' }}</span>
        <span class="p-arrow">→</span>
      </a>
      {% endfor %}
    </div>
    {% else %}
    <div class="p-empty">This deal has no projects yet.</div>
    {% endif %}
  </div>
</body>
</html>
