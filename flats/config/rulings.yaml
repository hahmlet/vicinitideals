# The rulings register: every decision Steph (the owner) has made that changes
# how a lot is judged, with where it came from and where it is built.
#
# HUMAN-OWNED. An agent records a ruling here only when it cites a real
# source -- Steph's words in a dated doc, a jurisdiction file, a config file
# or a commit. A ruling that replaces an earlier one does not delete it: the
# earlier entry stays and names its successor in `superseded_by`.
#
# Shape (validated exactly by the loader; unknown keys are errors, and
# flats/tests/test_rulings_register.py checks the file):
#   id            unique slug, date first
#   kind          ruling | adopted_change
#   date          the day the decision was made
#   effective     adopted_change only
#   scope         county / city / zones / tlids; empty = statewide
#   question      what was asked
#   ruling        Steph's words where they exist
#   effect        what the screen does because of it
#   source        where the ruling is written down
#   encoded_in    optional: the files that build it
#   superseded_by optional: the id of the ruling that replaced it
#
# City slugs and zone codes are spelled exactly as the jurisdiction files
# under flats/config/jurisdictions/or/<county>/<city>.yaml spell them.

# ---------------------------------------------------------------------------
# Statewide
# ---------------------------------------------------------------------------

- id: 2026-08-26-parking-rules-when-none-required
  kind: ruling
  date: 2026-08-26
  scope: {}
  question: >-
    Where a city requires no parking stalls (Fairview's minimum is zero), does
    the screen still read the city's parking rules?
  ruling: >-
    "I understand that parking isn't required, but we want to know what we
    would have to do if we do parking (which we will)."
  effect: >-
    A code that requires zero stalls is not the end of the reading: its aisle
    width, parking placement, driveway approach and court landscaping rules
    are still read and applied to the pod's parking.
  source: Steph 2026-08-26 (memory feedback_required_vs_regulated.md)

- id: 2026-08-31-unstated-aisle-can-be-green
  kind: ruling
  date: 2026-08-31
  scope: {}
  question: >-
    Where a city writes no aisle width down anywhere, may a lot whose parking
    court is drawn to the national minimum aisle be GREEN, or must it wait
    for review?
  ruling: >-
    An assumption can be GREEN: a standard the city never wrote cannot be
    clear and objective (ORS 197A.400), so the city has no lawful basis to
    refuse a court drawn to the national minimum.
  effect: >-
    A court resting on the assumed aisle is screened like any other; the
    assumption rides along as a provenance column (geometry_assumed), not a
    verdict. A real miss on the assumed court is still red.
  source: Steph's call 2026-08-31, commit f5129f49 (memory project_flats_parking.md)
  encoded_in: [Lot Analysis/quadfit/config/footprints.yaml]

- id: 2026-09-03-coarse-elevation-may-grade-green
  kind: ruling
  date: 2026-09-03
  scope: {}
  question: May the coarser elevation map grade a lot green where the fine map is missing?
  ruling: "Yes."
  effect: >-
    The coarse elevation map may answer the slope check; a slope_source
    column records which map answered on every lot.
  source: docs/HUMAN_TODO.md item 2, "DECIDED YES, BUILT AND RUN 2026-09-03"

- id: 2026-09-08-charge-parking-aisle
  kind: ruling
  date: 2026-09-08
  scope: {}
  question: Does the fit charge the lot for the ground the parked cars and their aisle stand on?
  ruling: '"we need to incorporate parking aisle width"'
  effect: >-
    The rear parking court (stall depth plus aisle) is charged as lot depth
    in the fit and the screen, from the zone's stated stall and aisle where
    it has them, else the design's assumption.
  source: Steph 2026-09-08 (memory project_flats_parking.md)
  encoded_in: [flats/score/paper.py]

- id: 2026-09-10-height-is-a-variable
  kind: ruling
  date: 2026-09-10
  scope: {}
  question: Is the pod's 26 ft height a fact to confirm?
  ruling: >-
    "That is variable at this stage. Eventually it will be set at one height,
    but part of the purpose of this exercise is to find our bounding
    variables. ... This should be a machine solvable problem."
  effect: >-
    Height is answered as a curve (lots won or lost at each height across the
    design range), not asked as a yes/no question.
  source: Steph 2026-09-10 (memory project_flats_height_dial.md)
  encoded_in: [flats/encode/height.py]

- id: 2026-09-18-four-stalls-enough
  kind: ruling
  date: 2026-09-18
  scope: {}
  question: Should the screen insist on room for six cars (1.5 a home) or four (one a home)?
  ruling: '"Same as the county map. 4 is enough to sell."'
  effect: >-
    Four stalls is the floor and sets the colour; six is the target and
    eight the preferred; the count the lot seats is reported beside the
    colour, never inside it. A city cap below four is a refusal.
  source: Steph 2026-09-18, docs/HUMAN_TODO.md item 18 (memory feedback_flats_stall_bands.md)
  encoded_in: [flats/config/pods/pod56x36.yaml]

- id: 2026-09-19-orientation-choice-order
  kind: ruling
  date: 2026-09-19
  scope: {}
  question: >-
    On a corner lot where the city leaves the choice of front to the owner
    and both ways park, which way is taken?
  ruling: >-
    "In order of priority 1) which orientation turns the lot green 2) if both
    green, which gets us to preferred parking amount 3) if both preferred
    parking amount OR both reach minimum parking amount, the side that has
    the least exposure to street. ... 'We can fit more parking' isn't
    necessarily a good thing."
  effect: >-
    Owner-choice cities screen each street as the front and keep green
    first, then the preferred parking band, then the least street exposure.
    More parking is not a goal.
  source: Steph 2026-09-19, docs/HUMAN_TODO.md item 21 (memory feedback_flats_stall_bands.md)
  encoded_in: [flats/geom/corner.py]

- id: 2026-09-20-read-every-zone-code-once
  kind: ruling
  date: 2026-09-20
  scope: {}
  question: What happens to the zone codes on the county map that the screen does not encode?
  ruling: >-
    Every zone code on the county map is read once, its reason written down,
    and never shown again; the only thing worth flagging is a code appearing
    for the first time.
  effect: >-
    Each jurisdiction file carries a zone_rulings block naming every
    unencoded code and its reason.
  source: docs/HUMAN_TODO.md item 22 ("You ruled on 2026-09-20 ...")

- id: 2026-09-22-new-zone-code-warns
  kind: ruling
  date: 2026-09-22
  scope: {}
  question: >-
    When a city invents a zone code never seen before, does the whole county
    copy wait, or only those lots?
  ruling: Option A, the new code warns but does not block.
  effect: >-
    A never-seen code is warn-only on a refresh; only those lots sit at
    UNKNOWN (ZONE_NOT_ENCODED) while the rest of the county goes live.
  source: docs/HUMAN_TODO.md item 22, "DECIDED 2026-09-22" (memory feedback_flats_data_source.md)

- id: 2026-09-25-tight-fit-green
  kind: ruling
  date: 2026-09-25
  scope: {}
  question: What colour is a pod that fits, or misses, by less than half a foot?
  ruling: >-
    "plus or minus 6 in it goes into the green category. Every acquisition is
    going to have a survey anyways. However, some sort of flag"
  effect: >-
    A fit within the 0.5 ft tolerance either way is GREEN with the FIT-TIGHT
    flag (below the yellow line).
  source: Steph 2026-09-25 (flats/config/slack.yaml; memory project_quadfit_alley_access.md)
  encoded_in: [flats/config/slack.yaml, flats/config/flags.yaml, flats/score/screen.py]

- id: 2026-09-28-partial-alley
  kind: ruling
  date: 2026-09-28
  scope: {}
  question: >-
    When an alley runs along only part of a lot line, does the alley's setback
    allowance and back-out lane apply to the whole line?
  ruling: >-
    "careful reading agreed. And we can use the portion the alley abuts for
    our travel lane only if the lane is actually long enough to accomodate"
  effect: >-
    The alley setback applies only to the stretch the alley covers; the rest
    of the line keeps the ordinary setback. A partial alley counts as the
    court's travel lane only when the covered run is long enough.
  source: Steph 2026-09-28 (memory feedback_partial_alley_ruling.md), commit 59533da1

- id: 2026-09-29-stated-number-governs
  kind: ruling
  date: 2026-09-29
  scope: {}
  question: >-
    When a code states a figure that looks odd (Hillsboro MU-C's 45 ft
    minimum height), does it govern?
  ruling: >-
    "Assume it's real and if we don't have an express exception, it
    governs." Where the code does state an exception (Hillsboro SCC-SC
    beyond 800 ft of a light-rail station), the exception counts.
  effect: >-
    A stated number is applied as written; an express exception in the code
    is measured and applied. Cities are not asked whether a figure is a
    misprint.
  source: Steph 2026-09-29, docs/HUMAN_TODO.md item 25C (memory feedback_flats_reading_rules_2026_09_29.md)

- id: 2026-09-29-no-minimum-stated-sets-none
  kind: ruling
  date: 2026-09-29
  scope: {}
  question: >-
    When a table prints no side or rear yard (Washington County's Transit
    Oriented Middle Housing table), is there a minimum?
  ruling: '"Table literally says None": a table that states no minimum sets none.'
  effect: A dimension a table does not state is not charged.
  source: >-
    Steph 2026-09-29, docs/HUMAN_TODO.md item 25C;
    flats/config/jurisdictions/or/washington/_unincorporated.yaml (TO zones)
  encoded_in: [flats/config/jurisdictions/or/washington/_unincorporated.yaml]

- id: 2026-09-29-definitions-literal
  kind: ruling
  date: 2026-09-29
  scope: {}
  question: >-
    Is the four-unit pod "multi-dwelling" where a code (Washington County CDC
    106-143) starts multi-dwelling at five units?
  ruling: Four units are not five.
  effect: >-
    Definitions are applied literally: the pod is not multi-dwelling where
    the code starts that at five, so multi-dwelling-only zones do not admit
    it.
  source: >-
    Steph 2026-09-29, docs/HUMAN_TODO.md item 25C;
    flats/config/jurisdictions/or/washington/_unincorporated.yaml (R-25+ NB)
  encoded_in: [flats/config/jurisdictions/or/washington/_unincorporated.yaml]

- id: 2026-09-29-post-2027-world
  kind: ruling
  date: 2026-09-29
  scope: {}
  question: Should the screen apply the middle-housing law as it stands now, or as HB 2138 makes it from 2027?
  ruling: >-
    "Behave as if this has already happened because we won't realistically
    be buying lots until after that point" ("design the system for a
    post-2027 world").
  effect: >-
    The state layer is built to HB 2138 and Division 46 as adopted, applied
    across the corpus wherever it reaches.
  source: >-
    Steph 2026-09-29, docs/HUMAN_TODO.md item 25D;
    flats/config/jurisdictions/or/_state.yaml (FOLLOWUPS 21)
  encoded_in: [flats/config/jurisdictions/or/_state.yaml]

- id: 2026-09-29-front-design-rules-held
  kind: ruling
  date: 2026-09-29
  scope: {}
  question: What happens to rules about how the front of the building looks?
  ruling: >-
    Record and encode them all, systematically, well enough to hand to an
    architect. The pod's design does not exist yet, so districts with those
    rules stay held back until it does.
  effect: Districts with front-design rules were held back from a plain yes.
  source: docs/HUMAN_TODO.md item 25B (answered 2026-09-29)
  superseded_by: 2026-10-14-unchecked-design-details

- id: 2026-09-30-through-lots
  kind: ruling
  date: 2026-09-30
  scope: {}
  question: On a through lot, which street does the parking come off?
  ruling: >-
    "If the city doesn't govern which street parking should be on, and we
    truly don't care either way, then pick one. If the city does govern, use
    that one. If it can't fit, then we're red/yellow. If the city doesn't
    govern and one fits and the other doesn't, use the one that fits."
  effect: >-
    A city rule naming the access street governs (conservatively where its
    fact is unmeasured); a free choice keeps whichever end fits.
  source: Steph 2026-09-30 (memory feedback_access_rulings_2026_09_30.md)

- id: 2026-09-30-private-roads
  kind: ruling
  date: 2026-09-30
  scope: {}
  question: Is a private road a street?
  ruling: >-
    "Treat private roads as streets for purpose of where parking should be.
    But we shouldn't use it for governing setbacks etc unless that's how the
    city handles it."
  effect: >-
    A private road is a way in for parking everywhere; it sets setbacks only
    where the city's code counts it.
  source: Steph 2026-09-30 (memory feedback_access_rulings_2026_09_30.md), commit dbc2cc40

- id: 2026-09-30-state-middle-housing-path
  kind: ruling
  date: 2026-09-30
  scope: {}
  question: >-
    Where a residential zone allows a detached house but refuses a quadplex,
    does the state middle-housing law open it, and in which places?
  ruling: >-
    Option A (Steph: "the 'larger cities' is important"). Inside Metro every
    city over 1,000 people; outside Metro 25,000+ for every type and
    2,500-25,000 duplexes only; county land only where "urban
    unincorporated".
  effect: >-
    A state_middle_housing relief path opens those zones in the places the
    size cutoff reaches; a path that turns on an unmeasured fact is UNKNOWN,
    not RED.
  source: docs/FOLLOWUPS.md item 21(b), "DECIDED A 2026-09-30"
  encoded_in: [flats/config/jurisdictions/or/_state.yaml]

- id: 2026-09-30-transit-show-not-screen
  kind: ruling
  date: 2026-09-30
  scope: {}
  question: >-
    Near frequent transit the state parking reform allows fewer stalls;
    should the screen accept a fewer-than-four-stall pod there?
  ruling: '"Show it, don''t screen it."'
  effect: >-
    The lot page shows transit distances and the reform's reach; the pod
    keeps four stalls and the screen never reads the reach.
  source: Steph 2026-09-30 (memory feedback_transit_distance.md)

- id: 2026-10-01-fire-access-150ft-red
  kind: ruling
  date: 2026-10-01
  scope: {}
  question: >-
    What colour is a lot whose building lies past 150 ft of hose route from a
    fire road (OFC 503.1.1)?
  ruling: '"Red". No sprinkler relief is assumed.'
  effect: >-
    A lot past the 150 ft hose route is RED; Portland's 250 ft sprinklered
