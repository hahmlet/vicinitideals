- id: 2026-10-02-no-variances
  kind: ruling
  date: 2026-10-02
  scope: {}
  question: Is a lot that needs a variance shown as a possibility (yellow) or a miss (red)?
  ruling: >-
    "We aren't accepting variances at all at this time. We need to log
    these, but for now, items requiring variance go red. Later we can review
    variances."
  effect: >-
    Any confirmed miss is RED; the way round it the code offers is logged on
    the bind for a later review.
  source: Steph 2026-10-02 (flats/config/colour.yaml; memory feedback_flats_flag_plan_rulings.md)
  encoded_in: [flats/config/colour.yaml]

- id: 2026-10-02-flag-below-three-stays-green
  kind: ruling
  date: 2026-10-02
  scope: {}
  question: Does a low-risk flag move a lot off green?
  ruling: '"items with risk < 3 (or whatever we decide) are still green"'
  effect: >-
    yellow_at_severity is 3: a flag below it rides along on a GREEN lot.
  source: Steph 2026-10-02 (flats/config/colour.yaml)
  encoded_in: [flats/config/colour.yaml, flats/config/flags.yaml]

- id: 2026-10-02-colour-as-if-signed
  kind: ruling
  date: 2026-10-02
  scope: {}
  question: Is the colour shown before or after the readings are signed?
  ruling: The colour shown stays "as if signed".
  effect: The map shows each lot's colour as though its readings were signed.
  source: Steph 2026-10-02, FOLLOWUPS 37 (memory feedback_flats_flag_plan_rulings.md)

- id: 2026-10-02-near-miss-one-foot-red
  kind: ruling
  date: 2026-10-02
  scope: {}
  question: What colour is a pod that misses the fit by a small amount?
  ruling: >-
    "everything 1-20' goes to red ... Let's put them all to red except short
    by under 1'". Asked on 2026-10-03 whether exactly one foot counts:
    "Exactly 1 foot is red".
  effect: >-
    A fit short by 1 ft or more is RED; short by under 1 ft is YELLOW
    (near_miss fit_ft 1.0, strict comparison). Inside half a foot the fit is
    already GREEN with FIT-TIGHT.
  source: Steph 2026-10-02 and 2026-10-03 (flats/config/colour.yaml)
  encoded_in: [flats/config/colour.yaml]

- id: 2026-10-02-minimum-density-a-flag
  kind: ruling
  date: 2026-10-02
  scope: {}
  question: What happens when a lot is big enough that the city wants more than four homes on it?
  ruling: '"a flag, maybe a 2" -- minimum density missed is a flag, never a bind.'
  effect: >-
    The DENSITY-MIN flag is proposed at severity 2, below the yellow line.
  source: Steph 2026-10-02 (flats/config/flags.yaml DENSITY-MIN; memory feedback_flats_flag_plan_rulings.md)
  encoded_in: [flats/config/flags.yaml]

- id: 2026-10-02-existing-lot-dedicates-nothing
  kind: ruling
  date: 2026-10-02
  scope: {}
  question: >-
    Where a density or lot-size rule is read per net acre, what does an
    existing lot deduct?
  ruling: Option A -- an existing lot dedicates nothing.
  effect: >-
    Net area is the lot less the constrained land the code lists; no road
    or tract dedication is deducted from an existing lot.
  source: Steph 2026-10-02, FOLLOWUPS 30 (memory project_flats_net_area.md), commit 995f0007

- id: 2026-10-02-corner-access-side-street
  kind: ruling
  date: 2026-10-02
  scope: {}
  question: On a corner lot, which street does the parking come in from?
  ruling: >-
    "it's actually safer to say that when there are multiple streets, it's
    the side line, not the front. Cities typically require the housing to
    face the busier street, so they want the parking entrance on another
    side."
  effect: >-
    Where a code says lowest_class, the parking entrance is the side street
    and no front-street lane is planned when a side street exists.
  source: Steph 2026-10-02 (memory feedback_corner_side_street_access.md)
  superseded_by: 2026-10-05-corner-access-quieter-front

- id: 2026-10-02-three-point-turn
  kind: ruling
  date: 2026-10-02
  scope: {}
  question: May a car leaving the parking court use a three-point turn?
  ruling: '"THREE POINT is acceptable for now"'
  effect: >-
    A stall is usable nose-in with a three-point turn out, or backed in and
    driven out.
  source: Steph 2026-10-02, FOLLOWUPS 36 (memory project_flats_parking_queue_36.md)
  encoded_in: [flats/config/court_turns.json]

- id: 2026-10-03-dead-end-last-resort
  kind: ruling
  date: 2026-10-03
  scope: {}
  question: Which fix to a court cars cannot turn in is tried first?
  ruling: '"the 13 foot dead end should be almost a last-resort"'
  effect: >-
    The menu of court fixes is ordered least paving first, with the dead-end
    extension near the end.
  source: Steph 2026-10-03, FOLLOWUPS 36 (memory project_flats_parking_queue_36.md), commit 1723db45
  encoded_in: [flats/config/court_turns.json]

- id: 2026-10-04-planted-strips-yellow
  kind: ruling
  date: 2026-10-04
  scope: {}
  question: >-
    A planted strip between the parking and the lot line may not survive the
    state's rule against stricter-than-house standards; how is a lot treated
    that fits only without the strip?
  ruling: '"Let''s have strips be a flag for yellow at this time"'
  effect: >-
    A plan that binds only on the strip is re-screened without it and, if it
    then binds nothing, is YELLOW with PARKING-STRIP-UNCONFIRMED (severity 5).
  source: Steph 2026-10-04 (memory project_flats_parking_queue_36.md), commit 1d3c89cb

- id: 2026-10-04-slope-grade-bands
  kind: ruling
  date: 2026-10-04
  scope: {}
  question: How steep may the ground under the building and its parking be?
  ruling: >-
    Pad grade 5% or less is green; 5% to 15% is a closer look; over 15% is
    red.
  effect: >-
    site_grade_pct: up to 5% GREEN, 5-15% the SLOPE-GRADE flag (severity 4,
    YELLOW), over 15% RED.
  source: Steph 2026-10-04 (flats/config/slope.yaml; memory project_flats_slope.md)
  encoded_in: [flats/config/slope.yaml]

- id: 2026-10-04-steep-ground-before-placement
  kind: ruling
  date: 2026-10-04
  scope: {}
  question: Is steep ground judged after the pod is placed, or before?
  ruling: '"slope-based lot elimination should happen before pod placement"'
  effect: >-
    Ground over 15% comes off the envelope and court ground before the fit;
    a fit lost to it is steep_ground, RED, with no zoning relief.
  source: Steph 2026-10-04 (flats/config/slope.yaml)
  encoded_in: [flats/config/slope.yaml]

- id: 2026-10-04-ignore-short-banks
  kind: ruling
  date: 2026-10-04
  scope: {}
  question: Does a short steep bank (a raised front yard, a terrace) count as steep ground?
  ruling: '"Ignore banks under 4 ft"'
  effect: A steep patch falling under 4 ft top to bottom inside the lot is regraded, not lost.
  source: Steph 2026-10-04 (flats/config/slope.yaml)
  encoded_in: [flats/config/slope.yaml]

- id: 2026-10-05-fire-hose-from-curb
  kind: ruling
  date: 2026-10-05
  scope: {}
  question: Where does the 150 ft fire hose route start from?
  ruling: >-
    "Let's go with stricter" -- 10 ft out from the near curb, "with a flag to
