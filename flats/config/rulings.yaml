  source: Steph 2026-10-05, FOLLOWUPS 29 (memory project_flats_fire_curb.md; flats/config/pipeline.yaml)
  encoded_in: [flats/config/pipeline.yaml, flats/config/flags.yaml]

- id: 2026-10-05-unmeasured-street-narrow
  kind: ruling
  date: 2026-10-05
  scope: {}
  question: Where a street's width is not measured, how wide is it taken to be for the fire hose?
  ruling: '"Assume narrow"'
  effect: >-
    A street with no measured width is the narrowest a fire truck may use
    (20 ft, OFC 503.2.1).
  source: Steph 2026-10-05 (memory project_flats_fire_curb.md; flats/config/pipeline.yaml)
  encoded_in: [flats/config/pipeline.yaml]

- id: 2026-10-05-corner-access-quieter-front
  kind: ruling
  date: 2026-10-05
  scope: {}
  question: >-
    Now that street class is measured, what if a corner lot's named front is
    the quieter street?
  ruling: >-
    On a corner lot whose named front ranks strictly below every side
    street, access comes off that quieter front; the side-street rule is the
    fallback when class is unknown or tied.
  effect: >-
    measured_access sets corner_access_street to front (why front_quieter)
