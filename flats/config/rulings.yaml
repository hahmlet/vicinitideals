- id: 2026-10-01-pod-ground-floor-12ft
  kind: ruling
  date: 2026-10-01
  scope: {}
  question: Is the pod's ground floor at least 12 ft (Tigard TMU's first-storey minimum)?
  ruling: '"Yes, 12 ft or more."'
  effect: >-
    The pod design carries ground_story_ft 12; a zone's ground-storey
    minimum of 12 ft or less is met.
