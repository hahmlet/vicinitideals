- id: 2026-10-01-gravel-roads-not-fire-roads
  kind: ruling
  date: 2026-10-01
  scope: {}
  question: Does a gravel or unimproved road (RLIS type 2000) count as a fire truck road?
  ruling: Gravel and unimproved roads are not truck roads.
