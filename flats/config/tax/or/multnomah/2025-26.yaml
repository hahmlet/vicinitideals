# Multnomah County property-tax rates, tax year 2025-26 -- the City of Gresham's
# tax code areas only. Read by flats/tax/rates.py for the tax-impact snapshot
# (scripts/flats_tax_snapshot.py). Rates are dollars per $1,000 of assessed value.
#
# Where each number comes from:
#   * levies per code area: Multnomah A&T, "Table of Consolidated Tax Rates for
#     Levy Code Areas 2025-2026" -- the billing rate of every district in each
#     code area, "limited" (inside the Measure 5 limit) and "bond" columns. Every
#     code area below reconciles to the table's own education / general
#     government / total columns to the ten-thousandth.
#   * the permanent vs local-option split inside a "limited" column: Multnomah
#     A&T, "Summary of Assessments and Taxes 2025-2026" (certified 10/03/25):
#     City of Gresham LOC OPT 1.3500, Metro LOC OPT 0.0960, Multnomah County Hist
#     Soc LOC OPT 0.0500. All three were approved after 2001-10-06, so urban
#     renewal division of tax never reduces them (the table's reduced Gresham,
#     Metro and County columns in the renewal-affected code areas are the
#     permanent rate x the same division factor plus these unreduced options --
#     checked for every code area below).
#   * urban renewal: the table carries Gresham's division of tax as one
#     general-government "URBAN RENEWAL" column. It is split here by the
#     category of the levy it was divided from (published permanent rate minus
#     the billed rate, per levy), so Measure 5 limits each category's real
#     amount. The two parts sum to the table's column exactly in every code area.
#   * residential CPR: Multnomah A&T, "Changed Property Ratios by Property
#     Class", 2025-2026, GRESHAM, (1XX) Residential = 0.540. Gresham defines
#     "area" as the city under ORS 308.151, so it has its own ratios.
#
# Only permanent rates, local options, bonds and urban renewal are here: no
# special assessments, exemptions, or partial-exemption programmes.

