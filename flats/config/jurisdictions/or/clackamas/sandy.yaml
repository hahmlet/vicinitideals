label: Sandy
kind: city
eligible: true
notes: >-
  DRAFT, 2026-10-07. Read from the Sandy Development Code (Title 17 of the
  Sandy Municipal Code) as Municode publishes it, one document per chapter,
  stored whole. Every value is draft. Lots reach this layer by the taxlots'
  JURIS_CITY SANDY. Their zoning comes from the Oregon City regional zoning
  layer (CITY 'Sandy'), which spells the districts without the hyphen. Three
  districts admit the pod: R-1 (row houses, "more than two attached units
  ... on individual lots", 17.10 and 17.36.10 A.4, so only the
  townhouse-on-its-own-lot path), R-2 (row houses and multi-family
  dwellings, 17.38.10) and R-3 (the same, 17.40.10). Each is outright; every
  new multi-family, row-house or commercial building goes through design
  review (17.36.50, 17.38.50, 17.40.50 A: "required for all uses"), which
  the code runs as a Type II Director's review for multi-family development
  that complies with its standards (17.90.40 B). Steph ruled 2026-10-08 that a
  review is not by-right and the three zones were refused; the review rule of
  2026-10-14 replaces that: the Director may elevate the review to a Type III
  hearing where the Planning Commission may attach conditions (17.12), so all
  three zones are screened on their standards and flagged REVIEW-CONDITIONS
  (YELLOW). SFR allows a single detached
  dwelling, a duplex and a small single-room-occupancy building and no row
  house or multi-family; the commercial districts allow housing only above a
  commercial business (C-1 also keeps row houses and duplexes that existed
  before the code); the industrial districts allow no dwelling; Parks and
  Open Space is parks only. A fourplex is a multi-family dwelling here
  ("at least three dwelling units in any vertical or horizontal
  arrangement", 17.10). Conservative readings taken: the 20-foot setback
  that 17.80.20 puts on every collector and arterial street is the base
  figure on the front and street-side yards and the 10 feet the zone prints
  is the relief on a local street, and no Sandy street-class map exists yet,
  so 20 feet is charged on every street (a lot on a local street can
  therefore read RED where it is not); the parking aisle is held at 25 feet
  both ways; the R-2 landscaping figure for multi-family (25 percent) is
  read as binding the pod. Density rounding (17.30.20 D) and the
  flood-and-slope density transfer (17.30.20 B) are not applied.

ingest:
  geoid: null
  juris_city_codes:
  - SANDY
  zoning_layer: zoning_sandy
  zone_field: ZONE
  strip_lowercase_suffix: false

