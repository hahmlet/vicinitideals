    # So the pod is allowed on the townhouse-on-its-own-lot path only.
    quadplex_allowed:
      value: false
      cite: Sandy SDC 17.36.10 (A), the outright list has single detached, zero lot line, duplex, row houses, manufactured dwelling parks, SRO and residential home; no multi-family dwelling
