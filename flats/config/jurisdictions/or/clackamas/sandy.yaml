      quote: "or/clackamas/sandy/17.40/17.40.30.txt#L12"
    setback_side_ft:
      value: 5
      cite: Sandy SDC 17.40.30, interior side yard 5 ft minimum
      quote: "or/clackamas/sandy/17.40/17.40.30.txt#L13"
    notes: >-
      YELLOW, RE-RULED 2026-10-14 (Steph's review rule, replacing the by-right-only ruling of 2026-10-08, which made this zone red): the use is permitted here after a Type II Director's design review (17.90.40 B; the zone chapter says design review "is required for all uses") on clear and objective standards, which the Director may elevate to a Type III hearing where the Planning Commission may attach conditions (17.12); so the lot is screened on the standards below and flagged REVIEW-CONDITIONS.
      DRAFT. Multi-family dwellings and row houses outright. No minimum
      lot area, no maximum coverage; frontage 20; density 10 to 20 units a
      net acre; front and street side 20 on a collector or arterial and 10
      on a local street (charged everywhere for now); rear 15; side 5; 35
      ft; landscaping 25 percent. Design review is a Type II review that may be elevated to a Type III hearing with conditions: YELLOW (Steph 2026-10-14).
