      variants:
        - value: true
          when: [unit_lots]
          cite: Sandy SDC 17.36.10 (A)(4), row houses permitted outright
          quote: "or/clackamas/sandy/17.36/17.36.10.txt#L22"
    min_roof_pitch_in_12:
      # FOLLOWUPS 109 chunk 3. 17.90.160 binds "Multi-family residential
      # developments in residential zones" -- the "more than six units"
      # that follows is about single room occupancies, the same split
      # 17.90.150 makes ("single room occupancies with up to six units") --
      # and A.1 is a number: "Roofs shall be gabled or hip type roofs
      # (minimum pitch 3:12)". The pod is a multi-family dwelling here on
      # both paths, the reading 17.90.160 F's parking cap already takes
      # (see the layer's defaults). 17.90.10 B holds residential
      # development to the chapter's clear and objective standards, and
      # this is one; the Design Deviation is relief on a finding about
      # neighbouring roofs. The pod's roof is flat (rulings.yaml 2026-10-21-pod-roof-flat).
      value: 3
      cite: Sandy SDC 17.90.160 A.1, multi-family roofs gabled or hip, minimum pitch 3:12
      quote: "or/clackamas/sandy/17.90/17.90.160.txt#L1,L4,L7,L11-L12"
      variants:
        # Steph 2026-10-22 (rulings.yaml 2026-10-22-sandy-row-houses-not-multi-family):
        # four townhomes on their own lots are row houses, a building type
        # 17.10 lists apart from the multi-family dwelling, so 17.90.160 does
        # not reach them.
        - exempt: true
          when: [unit_lots]
          cite: Sandy SDC 17.10 building types, row house (own lots) apart from multi-family dwelling
          quote: "or/clackamas/sandy/17.10/17.10.30.txt#L162,L166-L168"
