definitions:
  # Read 2026-10-07 from SDC 17.10, on disk chapter by chapter.
  #
  # THE NOUN. "Multi-family dwelling: At least three dwelling units in any
  # vertical or horizontal arrangement, located on a lot or development
  # site" (17.10.30.txt L166-L168). The pod, four units in one building, is a
  # multi-family dwelling. "Row house: More than two attached units, often
  # with two stories and with ground floor access, on individual lots" (L719)
  # is the unit-lot path, and the only one R-1 allows.
  #
  # CORNER LOT. "A lot situated at the intersection of two streets, the
  # interior angle of such intersection not exceeding 135 degrees" (L553).
  #
  # FRONT LOT LINE ON A CORNER LOT. "In the case of a corner lot with
  # frontage on one transit street, the lot line abutting the transit street
  # shall be the front lot line ... For all other corner lots, the applicant
  # or property owner can choose which lot line is to be the front" (L563).
  # The zone tables charge the same 10 feet on the front and on the street
  # side, so the choice moves nothing but the rear and side yards.
  corner_lot:
    test: intersecting_frontages
    max_intersection_angle_deg: 135.0
    quote: "or/clackamas/sandy/17.10/17.10.30.txt#L572"
    cite: "Sandy SDC 17.10, Lot, corner"

private_drives:
  street: true
  quote: "or/clackamas/sandy/17.10/17.10.30.txt#L403-L404"
  says: "abuts a public or private street"
  cite: "Sandy SDC 17.10, Frontage (a public or private street)"
  note: >-
    "Frontage: That portion of a development site that abuts a public or
    private street" (L404) and the yards on a corner lot run along "all sides
    of a lot adjacent to a street". "Street" itself is defined by the 2023
    Transportation System Plan classes (L775), which print no private class.
    A private drive the lot abuts is held to be a street for the yards: the
    reading that does not shrink a yard. A doubt.

defaults:
  # PARKING COUNT. 17.98.40 table: single family detached/attached 2 per
  # dwelling unit (L157); multi-family 1.5 per studio or one-bedroom unit and
  # 2.0 per two-bedroom unit or greater (L160). The catalog holds no bedroom
  # count, so the largest printed rate is encoded: 2.0 a unit, eight stalls
  # for the pod.
  parking_min_per_unit:
    value: 2
    cite: Sandy SDC 17.98.40, minimum off-street vehicle parking (2 per dwelling unit for single family attached; multi-family 2.0 per two-bedroom unit or greater)
    url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.98PALOACRE
    retrieved: '2026-10-07'
    quote: "or/clackamas/sandy/17.98/17.98.20.txt#L40,L43"
  # THE STALL. 17.98.60 A: "A standard parking space shall be a minimum of
  # nine feet wide by 18 feet in length" (L276).
  parking_stall_width_ft:
    value: 9
    cite: Sandy SDC 17.98.60 (A), a standard parking space nine feet wide by 18 feet in length
    url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.98PALOACRE
    retrieved: '2026-10-07'
    quote: "or/clackamas/sandy/17.98/17.98.60.txt#L15"
  parking_stall_depth_ft:
    value: 18
    cite: Sandy SDC 17.98.60 (A), a standard parking space nine feet wide by 18 feet in length
    url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.98PALOACRE
    retrieved: '2026-10-07'
    quote: "or/clackamas/sandy/17.98/17.98.60.txt#L15"
  # THE AISLE. 17.98.60 C, the 90 degree row: 20 feet single sided one-way,
  # 22 single sided two-way, 25 double sided either way (L302-L303). The
  # court the pod draws may have stalls on both sides, so the double-sided 25
  # is held for both directions.
  parking_aisle_two_way_ft:
    value: 25
    cite: Sandy SDC 17.98.60 (C), aisle width at 90 degrees (25 ft double sided two-way; 22 single sided)
    url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.98PALOACRE
    retrieved: '2026-10-07'
    quote: "or/clackamas/sandy/17.98/17.98.60.txt#L43-L44"
  parking_aisle_one_way_ft:
    value: 25
    cite: Sandy SDC 17.98.60 (C), aisle width at 90 degrees (25 ft double sided one-way; 20 single sided; the larger is held)
    url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.98PALOACRE
    retrieved: '2026-10-07'
    quote: "or/clackamas/sandy/17.98/17.98.60.txt#L43-L44"
  # DRIVEWAY. 17.98.100 A: "a minimum width of 20 feet for a two-way drive or
  # 12 feet for a one-way drive" (L440).
  driveway_min_width_two_way_ft:
    value: 20
    cite: Sandy SDC 17.98.100 (A), a driveway to an off-street parking area a minimum 20 feet for a two-way drive
    url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.98PALOACRE
    retrieved: '2026-10-07'
    quote: "or/clackamas/sandy/17.98/17.98.100.txt#L6"
  driveway_min_width_one_way_ft:
    value: 12
    cite: Sandy SDC 17.98.100 (A), a driveway to an off-street parking area a minimum 12 feet for a one-way drive
    url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.98PALOACRE
    retrieved: '2026-10-07'
    quote: "or/clackamas/sandy/17.98/17.98.100.txt#L6"
  front_lot_line_corner:
    value: owner
    cite: Sandy SDC 17.10, Lot line, front, on a corner lot the applicant or property owner can choose which lot line is the front (the transit-street exception is not mapped)
    url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.10DE
    retrieved: '2026-10-07'
    quote: "or/clackamas/sandy/17.10/17.10.30.txt#L583-L585"
  # WHICH STREET THE DRIVEWAY USES. Nothing in the zone chapters says; Steph's
  # rule of 2026-10-02 (more than one street: the side street) is carried by
  # the lowest-class rule.
  corner_access_street:
    value: lowest_class
    cite: Sandy SDC 17.98.100, driveway approaches are reviewed against the street they join (no street is required for the drive; the lower-class street is used)
    url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.98PALOACRE
    retrieved: '2026-10-07'
    quote: "or/clackamas/sandy/17.98/17.98.100.txt#L6"
  # PARKING SHARE OF EVERY STREET FRONTAGE (FOLLOWUPS 84). 17.90.160 binds
  # "Multi-family residential developments in residential zones" (L2224), and
  # its F. is a number, not a design menu item: "Parking lots in
  # multi-family developments shall not occupy more than 50 percent of the
  # frontage of any public street abutting the lot or building" (L2291).
  # 17.90.10 B holds residential development to the clear and objective
  # standards of the chapter (L126), and this is one. The pod is a
  # multi-family dwelling here ("at least three dwelling units ... located
  # on a lot or development site", 17.10); four row houses on one
  # development site ("one or more adjacent ... lots", 17.10 L289) were read
  # the same way until Steph's ruling below. "Parking lot" is not defined; the court of stalls and its
  # aisle is read as one. "Any public street abutting the lot": every street
  # the lot has, the shape Steph read into the model code's half-frontage
  # cap (2026-10-14, FOLLOWUPS 80(a)). A court behind the building on a lot
  # with no street behind it is not reached.
  # Steph 2026-10-22 settled the overlap: row houses on their own lots are
  # not multi-family (rulings.yaml 2026-10-22-sandy-row-houses-not-multi-family),
  # so the cap reaches the one-lot path only.
  parking_area_max_frontage_pct:
    value: 50
    cite: Sandy SDC 17.90.160 F, parking lots in multi-family developments no more than 50 percent of the frontage of any public street abutting the lot or building
    url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.90DEST
    retrieved: '2026-10-07'
    quote: "or/clackamas/sandy/17.90/17.90.160.txt#L1,L4,L74,L76"
    variants:
      - exempt: true
        when: [unit_lots]
        cite: Sandy SDC 17.10 building types, row house (own lots) apart from multi-family dwelling
        quote: "or/clackamas/sandy/17.10/17.10.30.txt#L162,L166-L168"
  parking_area_frontage_any_street:
    value: true
    cite: "Sandy SDC 17.90.160 F, parking lots no more than 50 percent of the frontage of any public street abutting the lot or building (any street frontage: front, side and rear streets)"
    url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.90DEST
    retrieved: '2026-10-07'
    quote: "or/clackamas/sandy/17.90/17.90.160.txt#L1,L4,L74,L76"

# NOT ENCODED, read 2026-10-07:
# - Design review (17.90, a Type II Director's review for multi-family
#   development, 17.90.40 B), and the multi-family design menu of 17.90.160
#   (roofs, entries, facade offsets, 48 sq ft private outdoor areas,
#   recreation areas above five units): the menu is clear and objective
#   (17.90, L126) and nothing checks it; Steph 2026-10-14, an unchecked
#   design checklist does not block green. Its F., the parking lots' share
#   of every street frontage, is a measured standard and IS encoded above
#   (FOLLOWUPS 84). The review's elevation to a Type III hearing with
#   conditions is the zones' REVIEW-CONDITIONS flag.
# - Garage setbacks in the zone tables (20 or 22 ft to a garage door, 15 ft
#   perpendicular, 5 ft alley): the pod carries no garage.
# - R-1, R-2 and R-3 "lots with 40 feet or less of street frontage shall be
#   accessed by a rear alley or a shared private driveway" (17.36.50 B,
#   17.38.50 B, 17.40.50 B): the screen draws one drive for the pod.
# - The 20-foot setback on collector and arterial streets on a REAR or SIDE
#   yard (17.80.20): only a lot whose rear line runs along such a street (a
#   through lot) is touched. The front and street-side yards carry it.
# - Density rounding (17.30.20 D) and the 1.5 times density transfer from
#   flood and slope restricted areas (17.30.20 B).
# - Vision clearance (17.74.30, 17.98.110), measured from curb lines.
# - Overlays: Specific Area Plan (Bornstedt Village), Flood Slope Hazard,
#   Cultural and Historic Resource: not held by FLATS for Sandy.

