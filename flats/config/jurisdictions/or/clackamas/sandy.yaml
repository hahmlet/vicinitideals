      cite: Sandy SDC 17.80.20, a minimum setback of 20 ft on a collector or arterial street (the zone prints 10 ft on the side abutting the street)
      quote: "or/clackamas/sandy/17.80/17.80.20.txt#L4-L5"
      variants:
        - value: 10
