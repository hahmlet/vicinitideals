      # elevate an application to a Type III review", where the Planning
      # Commission "may attach certain development or use conditions beyond
      # those warranted for compliance with the standards". A path the
      # applicant cannot force onto the standards alone is the yellow tier.
      value: conditions
      cite: Sandy SDC 17.90 design review "is required for all uses" (17.36.50, 17.38.50, 17.40.50), a Type II Director's review (17.90.40 B) the Director "may elevate ... to a Type III review" (17.12), where the Planning Commission "may attach certain development or use conditions beyond those warranted for compliance with the standards" (17.12); Steph 2026-10-14, a review that may add conditions is YELLOW
      quote: "or/clackamas/sandy/sdc.17.12.txt#L67,L112"
