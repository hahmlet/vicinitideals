      cite: Sandy SDC 17.40.30, landscaping 25% minimum
      quote: "or/clackamas/sandy/17.40/17.40.30.txt#L20"
    setback_front_ft:
      value: 20
      cite: Sandy SDC 17.80.20, a minimum setback of 20 ft from the property line on a collector or arterial street (the zone prints 10 ft front yard)
      quote: "or/clackamas/sandy/17.80/17.80.20.txt#L4-L5"
      variants:
        - value: 10
          when: [local_street]
          cite: Sandy SDC 17.40.30, front yard 10 ft minimum
          quote: "or/clackamas/sandy/17.40/17.40.30.txt#L11"
    parking_street_setback_ft:
      same_as: setback_front_ft
      cite: Sandy SDC 17.40.30, front yard (17.80.20 on a collector or arterial)
      url: https://api.municode.com/CodesContent?jobId=480528&productId=15896&nodeId=TIT17DECO_CH17.40HIDERER-
      quote: "or/clackamas/sandy/17.40/17.40.30.txt#L11"
    setback_street_side_ft:
