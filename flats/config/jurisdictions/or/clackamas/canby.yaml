definitions:
  # Read 2026-10-07 from CMC 16.04, on disk section by section.
  #
  # THE NOUN. "Multi-family dwelling means a building containing three or
  # more dwelling units located on the same lot or parcel" (16.04.180,
  # cmc.16.04.180.txt L3). The pod, four units in one building, is a
  # multi-family dwelling, and is also R-1.5's own "four-family dwelling,
  # one fourplex on each lot" (cmc.16.18.010.txt L11). A townhouse is
  # "single-family attached common wall dwellings with each dwelling unit
  # located on a separate lot ... no more than six attached townhouse
  # dwelling units in a row, and the combined single-family units shall not
  # exceed 120 feet in length" (16.04.195, cmc.16.04.195.txt L3): the
  # unit-lot path.
  #
  # CORNER LOT. "a lot abutting two intersecting streets other than an
  # alley, provided that the streets do not intersect at an angle greater
  # than one hundred thirty-five degrees" (16.04.310, L3).
  #
  # FRONT LOT LINE ON A CORNER LOT. The code names none. The yards speak of
  # "twenty feet on side with driveway; fifteen feet for all other street
  # sides" (cmc.16.18.030.txt L39), so a corner lot has a driveway street
  # side and other street sides and no front. Both are held at the larger
  # figure in every zone.
  corner_lot:
    test: intersecting_frontages
    max_intersection_angle_deg: 135.0
    quote: "or/clackamas/canby/cmc.16.04.310.txt#L3"
    cite: "Canby CMC 16.04.310, Lot, corner"

private_drives:
  street: false
  quote: "or/clackamas/canby/cmc.16.10.070.txt#L118"
  says: "All ingress and egress shall connect directly with public streets"
  cite: "Canby CMC 16.10.070 (B)(3) (access shall connect directly with public streets)"
  note: >-
    The stored sections define no "street", and the one access rule that
    names them says all ingress and egress "shall connect directly with
    public streets" (16.10.070 (B)(3), L118). A private drive the lot abuts
    is not held to be a street for the yards. A doubt; the reading that
    does not shrink a yard.

defaults:
  # PARKING COUNT. 16.10.050 (A): single-family and two-family dwellings 2.00
  # spaces per dwelling unit (L14, L17); multi-family dwellings in complexes
  # with private internal driveways one space per studio or one-bedroom unit
  # and 2.00 per two-bedroom or larger unit, plus a guest space for every
  # five units in a development of ten or more (L20). The catalog holds no
  # bedroom count, so the largest printed rate is encoded (the corpus
  # convention): 2.0 a unit, eight stalls for the pod.
  parking_min_per_unit:
    value: 2
    cite: Canby CMC 16.10.050 (A), residential parking requirements (2.00 spaces per dwelling unit; multi-family 2.00 per two-bedroom or larger unit)
    url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38258
    retrieved: '2026-10-07'
    quote: "or/clackamas/canby/cmc.16.10.050.txt#L14,L17,L20"
  # THE STALL AND AISLE. 16.10.070 (A) table, the 90 degree row: stall width
  # 8'6", stall depth 18'0", aisle 24'0" (L105-L108).
  parking_stall_width_ft:
    value: 8.5
    cite: Canby CMC 16.10.070 (A), parking space dimensions at 90 degrees (8 ft 6 in)
    url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38276
    retrieved: '2026-10-07'
    quote: "or/clackamas/canby/cmc.16.10.070.txt#L105-L106"
  parking_stall_depth_ft:
    value: 18
    cite: Canby CMC 16.10.070 (A), parking space dimensions at 90 degrees (18 ft)
    url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38276
    retrieved: '2026-10-07'
    quote: "or/clackamas/canby/cmc.16.10.070.txt#L105,L107"
  parking_aisle_two_way_ft:
    value: 24
    cite: Canby CMC 16.10.070 (A), aisle width at 90 degrees (24 ft)
    url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38276
    retrieved: '2026-10-07'
    quote: "or/clackamas/canby/cmc.16.10.070.txt#L105,L108"
  parking_aisle_one_way_ft:
    value: 24
    cite: Canby CMC 16.10.070 (A), aisle width at 90 degrees (24 ft; the table prints one figure for the angle)
    url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38276
    retrieved: '2026-10-07'
    quote: "or/clackamas/canby/cmc.16.10.070.txt#L105,L108"
  # DRIVEWAY. 16.10.070 (B)(8): minimum access width, one access, 12 feet
  # for one or two dwelling units and 20 feet for 3 to 19 (L140-L146).
  driveway_min_width_two_way_ft:
    value: 20
    cite: Canby CMC 16.10.070 (B)(8), minimum access width for 3 to 19 dwelling units (20 feet)
    url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38276
    retrieved: '2026-10-07'
    quote: "or/clackamas/canby/cmc.16.10.070.txt#L136-L138,L144-L146"
  driveway_min_width_one_way_ft:
    value: 20
    cite: Canby CMC 16.10.070 (B)(8), minimum access width for 3 to 19 dwelling units (20 feet; the table prints one figure)
    url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38276
    retrieved: '2026-10-07'
    quote: "or/clackamas/canby/cmc.16.10.070.txt#L136-L138,L144-L146"
  front_lot_line_corner:
    value: shortest
    cite: Canby CMC 16.18.030 (D)(1), no front is named on a corner lot; the narrower street side is held as the front (both street sides are charged 20 ft in every zone)
    url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38523
    retrieved: '2026-10-07'
    quote: "or/clackamas/canby/cmc.16.18.030.txt#L39"
  # WHICH STREET THE DRIVEWAY USES. The street yard is larger "on side with
  # driveway" (L39) and nothing says which street takes the drive; Steph's
  # rule of 2026-10-02 (more than one street: the side street) is carried by
  # the lowest-class rule.
  corner_access_street:
    value: lowest_class
    cite: Canby CMC 16.18.030 (D)(1), the street yard is larger on the side with the driveway (no street is required for the drive; the lower-class street is used)
    url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38523
    retrieved: '2026-10-07'
    quote: "or/clackamas/canby/cmc.16.18.030.txt#L39"

# NOT ENCODED, read 2026-10-07:
# - 16.49.030, site and design review (a Type III process) for new
#   multi-family buildings, and the points menu in 16.21.070: treated as an
#   outright path and put to Steph.
# - R-2 16.20.030 (D)(1), a multifamily street yard that must match the
#   front yards of the R-1 or R-1.5 lots on the same side; (E)(4), a
#   building length of 120 feet; (G)(4), 150 sq ft of recreation space a
#   dwelling above ten units. None reaches a four-unit pod on an ordinary lot.
# - Vision clearance (ten feet from a street to an alley or driveway, thirty
#   from a street to another street), measured from curb lines.
# - Infill standards (16.21.050): they reach single-family, two-family and
#   triplex homes only (16.04.255), not a four-unit pod. Compact stalls.
# - The Planning Commission's discretion to modify density, lot area, width
#   and frontage: no variances are assumed.

neighbours:
  abuts_lower_density_zone:
    true_for: [R-1, R-1.5]
    false_for: [R-2, C-R, C-1, C-2, C-M, M-1, M-2]
    quote: "or/clackamas/canby/cmc.16.20.030.txt#L21,L43"
    cite: Canby CMC 16.20.030 (D)(5) and (E)(3), multifamily development adjacent to an R-1 or R-1.5 zone
    note: >-
      Only R-2 turns on it. 16.20.030 (D)(5) asks multifamily development
      (three or more units on a property) adjacent to an R-1 or R-1.5 zone
      for a 15-foot buffer, and (E)(3) holds the building's height to one
      foot for each foot of distance from the R-1 or R-1.5 property line.
      The true side is those two districts and the false side is every other
      district of Chapter 16. A lot with an R-1 or R-1.5 neighbour across
      any line takes the buffer on its side and rear yards, the tightening
      answer.

zones:
  R-1.5:
    cite_default:
      cite: Canby CMC Chapter 16.18 (R-1.5 Medium Density Residential)
      url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38514
      retrieved: '2026-10-07'
    quadplex_allowed:
      value: true
      cite: Canby CMC 16.18.010 (D), four-family dwellings, one fourplex on each lot (and (C), townhouses in groups of up to six)
      quote: "or/clackamas/canby/cmc.16.18.010.txt#L9,L11"
    # No lot area is printed for a four-family dwelling: 16.18.030 (A)(1)
    # prints 5,000 to 6,500 for single-family dwellings and (A)(2) 3,000 for
    # townhouse lots. The single-family minimum is held for the fourplex, the
    # stricter; the density cap below sets the real floor (13 units an acre,
    # about 13,400 sq ft for four units).
    min_lot_sqft:
      value: 5000
      cite: Canby CMC 16.18.030 (A)(1), five thousand square feet minimum (single family; no figure is printed for a four-family dwelling)
      quote: "or/clackamas/canby/cmc.16.18.030.txt#L7"
      variants:
        - value: 3000
          when: [unit_lots]
          cite: Canby CMC 16.18.030 (A)(2)(a), townhouse dwelling units, 3,000 square foot minimum lot size
          quote: "or/clackamas/canby/cmc.16.18.030.txt#L9,L11"
    min_lot_width_ft:
      value: 40
      cite: Canby CMC 16.18.030 (C), minimum width and frontage forty feet
      quote: "or/clackamas/canby/cmc.16.18.030.txt#L35"
      variants:
        - value: 20
          when: [unit_lots]
          cite: Canby CMC 16.18.030 (C), twenty feet is permitted for single family attached (common wall) housing
          quote: "or/clackamas/canby/cmc.16.18.030.txt#L35"
    min_density_du_per_acre:
      value: 6
      cite: Canby CMC 16.18.030 (A)(3), minimum density 6 units per acre for two, three and four family dwellings
      quote: "or/clackamas/canby/cmc.16.18.030.txt#L15"
      measured_on:
        fact: net_developable_area
        cite: Canby CMC 16.18.030 (A)(3), the area in acres minus the area required for street right-of-way and public park/open space areas
        quote: "or/clackamas/canby/cmc.16.18.030.txt#L15"
        less: []
        assumed_none:
          - "street right-of-way"
          - "public park and open space areas"
    max_density_du_per_acre:
      value: 13
      cite: Canby CMC 16.18.030 (A)(3), maximum of 13 units per acre for two, three and four family dwellings (held on the townhouse path too, the stricter)
      quote: "or/clackamas/canby/cmc.16.18.030.txt#L15"
    max_height_ft:
      value: 35
      cite: Canby CMC 16.18.030 (E)(1), principal building thirty-five feet
      quote: "or/clackamas/canby/cmc.16.18.030.txt#L51"
    max_impervious_pct:
      value: 70
      cite: Canby CMC 16.18.030 (F), impervious surface 70 percent of the lot area
      quote: "or/clackamas/canby/cmc.16.18.030.txt#L65"
    # YARDS, 16.18.030 (D). Street yard 20 on the side with the driveway, 15
    # on other street sides, 10 for covered porches only (L39). The pod's
    # drive may be on either street, so 20 is held for the front and the
    # street side. Rear 15 single-story, 20 two-story; on a corner lot 10 and
    # 15 (L41). The pod is two storeys, so the two-story figures are held.
    # Interior yard 7 ft "except as otherwise provided for zero-lot line
    # housing" (L43): that pointer names no figure, so a townhouse's common
    # wall keeps the seven feet (silence; no attached_wall variant).
    setback_front_ft:
      value: 20
      cite: Canby CMC 16.18.030 (D)(1), street yard twenty feet on the side with the driveway
      quote: "or/clackamas/canby/cmc.16.18.030.txt#L39"
    parking_street_setback_ft:
      same_as: setback_front_ft
      cite: Canby CMC 16.18.030 (D)(1), street yard
      url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38523
      quote: "or/clackamas/canby/cmc.16.18.030.txt#L39"
    setback_street_side_ft:
      value: 20
      cite: Canby CMC 16.18.030 (D)(1), street yard twenty feet on the side with the driveway (fifteen on other street sides; the larger is held)
      quote: "or/clackamas/canby/cmc.16.18.030.txt#L39"
    setback_rear_ft:
      value: 20
      cite: Canby CMC 16.18.030 (D)(2), rear yard twenty feet for two-story building components
      quote: "or/clackamas/canby/cmc.16.18.030.txt#L41"
      variants:
        - value: 15
          when: [corner_lot]
          cite: Canby CMC 16.18.030 (D)(2), corner lots fifteen feet for two-story building components
          quote: "or/clackamas/canby/cmc.16.18.030.txt#L41"
    setback_side_ft:
      value: 7
      cite: Canby CMC 16.18.030 (D)(3), interior yard seven feet
      quote: "or/clackamas/canby/cmc.16.18.030.txt#L43"
    notes: >-
      DRAFT. Fourplex permitted outright, one to a lot; townhouses up to six
      in a row. 5,000 sq ft lot (3,000 for a townhouse lot), 40 wide (20
      townhouse), 6 to 13 units an acre; front 20, street side 20, side 7,
      rear 20 (15 on a corner); 35 ft; impervious 70 percent; two stalls a
      unit. The multi-family site and design review is treated as outright
      (a question for Steph).
  R-2:
    cite_default:
      cite: Canby CMC Chapter 16.20 (R-2 High Density Residential)
      url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38567
      retrieved: '2026-10-07'
    quadplex_allowed:
      value: true
      cite: Canby CMC 16.20.010 (D), multi-family dwelling (and (A), the R-1.5 uses; (B), townhouses)
      quote: "or/clackamas/canby/cmc.16.20.010.txt#L5,L7,L11"
    # No lot area is printed for R-2 (16.20.030 prints density, width, yards,
    # height and impervious surface); (B) puts a townhouse on a maximum
    # 3,000 sq ft lot to meet the density.
    min_lot_sqft:
      exempt: true
      cite: Canby CMC 16.20.030 (A)-(G), the R-2 development standards, print no minimum lot area (density, width, yards, height only)
      quote: "or/clackamas/canby/cmc.16.20.030.txt#L5,L7,L9"
    min_lot_width_ft:
      value: 20
      cite: Canby CMC 16.20.030 (C), minimum width and frontage twenty feet
      quote: "or/clackamas/canby/cmc.16.20.030.txt#L9"
    min_density_du_per_acre:
      value: 14
      cite: Canby CMC 16.20.030 (A), minimum density 14 units per acre
      quote: "or/clackamas/canby/cmc.16.20.030.txt#L5"
      measured_on:
        fact: net_developable_area
        cite: Canby CMC 16.20.030 (A), the area in acres minus the area required for street right-of-way and public park/open space areas
        quote: "or/clackamas/canby/cmc.16.20.030.txt#L5"
        less: []
        assumed_none:
          - "street right-of-way"
          - "public park and open space areas"
    max_height_ft:
      value: 35
      cite: Canby CMC 16.20.030 (E)(1), principal building thirty-five feet
      quote: "or/clackamas/canby/cmc.16.20.030.txt#L31"
    max_impervious_pct:
      value: 70
      cite: Canby CMC 16.20.030 (F), impervious surface 70 percent of the lot area
      quote: "or/clackamas/canby/cmc.16.20.030.txt#L47"
    setback_front_ft:
      value: 20
      cite: Canby CMC 16.20.030 (D)(1), street yard twenty feet on the side with the driveway
      quote: "or/clackamas/canby/cmc.16.20.030.txt#L13"
    parking_street_setback_ft:
      same_as: setback_front_ft
      cite: Canby CMC 16.20.030 (D)(1), street yard
      url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38582
      quote: "or/clackamas/canby/cmc.16.20.030.txt#L13"
    setback_street_side_ft:
      value: 20
      cite: Canby CMC 16.20.030 (D)(1), street yard twenty feet on the side with the driveway (fifteen on other street sides; the larger is held)
      quote: "or/clackamas/canby/cmc.16.20.030.txt#L13"
    # Beside an R-1 or R-1.5 lot (D)(5): a 15-foot buffer; (E)(3): the
    # building's height may not exceed one foot for each foot of distance
    # from that property line, so the yard is the building's height, never
    # under 15.
    setback_rear_ft:
      value: 20
      cite: Canby CMC 16.20.030 (D)(2), rear yard twenty feet for two-story building components
      quote: "or/clackamas/canby/cmc.16.20.030.txt#L15"
      variants:
        - value: 15
          when: [corner_lot]
          cite: Canby CMC 16.20.030 (D)(2), corner lots fifteen feet for two-story building components
          quote: "or/clackamas/canby/cmc.16.20.030.txt#L15"
        - value: 15
          when: [abuts_lower_density_zone]
