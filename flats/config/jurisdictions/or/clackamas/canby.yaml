# American Legal Publishing, Canby Municipal Code (Title 16, Planning and
# Zoning), the codifier's live current page, one document per section
# because that is how the publisher serves it: a chapter's own page holds
# only its table of contents. Every section page carries about 3,500
# characters of site chrome ahead of the text, so each entry opens at the
# section's own heading line (the second printing of it, after the page's
# breadcrumb) and closes at the publisher's disclaimer. The city's own
# per-chapter PDFs were read and set aside: they are the October 2019
# edition and the codifier's page is current through Ordinance 1634 (2024).
# allow_thin on every entry: each document is ONE section, short by
# construction, and the thin-text check reads a short section as a landing
# page. All of them were read whole on 2026-10-07 (the 16.08.xx and 16.10.xx
# sections are plain prose with few dimensions).
