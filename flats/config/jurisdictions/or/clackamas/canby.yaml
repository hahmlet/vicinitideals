    notes: >-
      DRAFT. Refuses: housing only as part of a mixed-use development
      (with commercial, office or public use).
      DOUBT: the Downtown Canby Overlay (16.41.030 A) lets the Transitional
      Commercial sub-area -- two small nodes between 3rd and 4th, Fir to
