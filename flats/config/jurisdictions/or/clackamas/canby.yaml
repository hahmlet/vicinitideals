label: Canby
kind: city
eligible: true
notes: >-
  DRAFT, 2026-10-07. Read from the Canby Municipal Code, Title 16 (Planning
  and Zoning), as American Legal Publishing serves it: one document per
  section, stored whole. Every value is draft. Lots reach this layer by the
  taxlots' JURIS_CITY CANBY. Their zoning comes from the Oregon City
  regional zoning layer (CITY 'Canby'), which spells the districts without
  the hyphen and in places by the city's older plan names. Three districts
  admit the pod: R-1.5 (a four-family dwelling, one per lot, outright,
  16.18.010 (D)), R-2 (multi-family dwelling outright, 16.20.010 (D)) and
  C-R (the R-1.5 uses on R-1.5 standards, 16.24.010 (A)). R-1 admits
  townhouses only inside a planned unit development and no fourplex; the
  commercial districts allow housing only as part of a mixed-use development
  (C-1) or not at all; the industrial districts allow a caretaker's dwelling.
  A fourplex is a multi-family dwelling here (16.04.180: three or more
  units on a lot). Every new multi-family building also goes through site
  and design review (16.49.030, a Type III process), which the screen treats
  as an outright path; a question for Steph. Conservative readings taken:
  the 20-foot street yard on the side with the driveway is held on every
  street side (the 15-foot relief on other street sides is not encoded); the
  townhouse path carries the 13-units-an-acre cap the multi-family path
  states; C-R takes the stricter of its own and R-1.5's figures; parking is
  two stalls a dwelling, the largest rate printed for any size of unit.
ingest:
  geoid: null
  juris_city_codes:
  - CANBY
  zoning_layer: zoning_canby
  zone_field: ZONE
  strip_lowercase_suffix: false
