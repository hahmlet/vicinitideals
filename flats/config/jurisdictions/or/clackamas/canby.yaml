          when: [corner_lot, abuts_lower_density_zone]
          cite: Canby CMC 16.20.030 (D)(5) and (E)(3), a 15-foot buffer beside an R-1 or R-1.5 lot, and the building no taller than one foot for each foot of distance from that lot line (a 26 ft building therefore stands 26 ft off)
          quote: "or/clackamas/canby/cmc.16.20.030.txt#L21,L43"
          step_back:
            height_ft: 15
            rise_per_ft: 1
            cite: Canby CMC 16.20.030 (E)(3), building height not greater than one foot for each foot of distance from the R-1 and/or R-1.5 property line (15 ft of height at the 15 ft buffer line)
            quote: "or/clackamas/canby/cmc.16.20.030.txt#L21,L43"
    setback_side_ft:
      value: 7
      cite: Canby CMC 16.20.030 (D)(3), interior yard seven feet
      quote: "or/clackamas/canby/cmc.16.20.030.txt#L17"
      variants:
        - value: 15
          when: [abuts_lower_density_zone]
          cite: Canby CMC 16.20.030 (D)(5) and (E)(3), a 15-foot buffer beside an R-1 or R-1.5 lot, and the building no taller than one foot for each foot of distance from that lot line (a 26 ft building therefore stands 26 ft off)
          quote: "or/clackamas/canby/cmc.16.20.030.txt#L21,L43"
          step_back:
            height_ft: 15
            rise_per_ft: 1
            cite: Canby CMC 16.20.030 (E)(3), building height not greater than one foot for each foot of distance from the R-1 and/or R-1.5 property line (15 ft of height at the 15 ft buffer line)
            quote: "or/clackamas/canby/cmc.16.20.030.txt#L21,L43"
    notes: >-
      DRAFT. Multi-family dwelling permitted outright (a fourplex is
      multi-family, 16.04.180). No lot minimum printed; 20 wide; at least 14
      units an acre; front 20, street side 20, side 7, rear 20 (15 on a
      corner); 35 ft; impervious 70 percent. Beside an R-1 or R-1.5 lot the
      15-foot buffer and the one-foot-of-height-per-foot-of-distance rule
      (16.20.030 (D)(5), (E)(3)) are carried as variants on the side and rear
      yards.
  C-R:
    like:
      zone: R-1.5
      cite: Canby CMC 16.24.010 (A), uses permitted outright in the R-1.5 zone, conforming to the development standards of the R-1.5 zone
      quote: "or/clackamas/canby/cmc.16.24.010.txt#L5"
    cite_default:
      cite: Canby CMC Chapter 16.24 (C-R Residential/Commercial)
      url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38796
      retrieved: '2026-10-07'
    quadplex_allowed:
      value: true
      cite: Canby CMC 16.24.010 (A), uses permitted outright in the R-1.5 zone, conforming to the development standards of the R-1.5 zone
      quote: "or/clackamas/canby/cmc.16.24.010.txt#L5"
    min_lot_width_ft:
      value: 60
      cite: Canby CMC 16.24.030 (B), minimum width and frontage sixty feet (stricter than R-1.5's forty)
      quote: "or/clackamas/canby/cmc.16.24.030.txt#L7"
    max_coverage_pct:
      value: 60
      cite: Canby CMC 16.24.030 (E), maximum lot coverage sixty percent
      quote: "or/clackamas/canby/cmc.16.24.030.txt#L23"
    notes: >-
      DRAFT. The R-1.5 uses are permitted "conforming to the development
      standards of the R-1.5 zone", so R-1.5's figures hold and C-R's own
      stricter ones are laid over them: 60 wide, 60 percent lot coverage.
      C-R's 45 ft height is looser than R-1.5's 35, which is kept.
  # ------------------------------------------------------------------
  # THE OTHER DISTRICTS. Refused, each on its own use list.
  # ------------------------------------------------------------------
  R-1:
    cite_default:
      cite: Canby CMC Chapter 16.16 (R-1 Low Density Residential)
      url: https://codelibrary.amlegal.com/codes/canby/latest/canby_or/0-0-0-38428
      retrieved: '2026-10-07'
    quadplex_allowed:
      value: false
      cite: Canby CMC 16.16.010 (A)-(C) (single-family, duplex, cottage cluster) and (N)(1) (townhouses only as part of a planned unit development); no three- or four-family dwelling is listed
      quote: "or/clackamas/canby/cmc.16.16.010.txt#L3,L5,L7,L57,L59"
    notes: >-
      DRAFT. Refuses: a single-family dwelling, a duplex or a cottage cluster
      outright; townhouses of up to six only inside an approved planned unit
      development; no fourplex.
  C-1:
    cite_default:
