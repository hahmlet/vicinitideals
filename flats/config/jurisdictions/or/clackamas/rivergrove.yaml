label: Rivergrove
kind: city
eligible: false
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.'
ingest:
  geoid: null
  juris_city_codes:
  - RIVERGROVE
  zoning_layer: zoning_metro
  zone_field: ZONE
  strip_lowercase_suffix: false
definitions:
  # "Corner Lot" means a lot at least two adjacent sides of which abut streets
  # other than alleys, provided the angle of the intersection of the adjacent
  # streets does not exceed 135 degrees."
  #
  # The only ceiling in the corpus. A fork meeting at 150 degrees is a corner
  # lot in Portland, Gresham and Oregon City and is not one here, and there is
  # no reading of the other four codes that produces that answer.
  #
  # "streets other than alleys" states the alley exclusion outright rather than
  # leaving it to the front lot line definition, which is why this is the
  # jurisdiction to quote when asked whether an alley is ever frontage.
  corner_lot:
    test: adjacent_frontages
    max_intersection_angle_deg: 135.0
    quote: "or/clackamas/rivergrove/rldo.composite.txt#L326-L328"
    cite: "RLDO, Lot, Corner Lot"

code:
# The city posts the RLDO as one composite PDF ("compilation of Rivergrove
# enactments"). Setbacks are 5.080, lot size 5.010/5.075.
- id: rldo.composite
  url: https://www.cityofrivergrove.org/s/RLDOComposite-with-cover.pdf
  title: Rivergrove Land Development Ordinance (composite compilation)
  # Section 1.050, "Definitions", runs to Section 2.010. The city posts one
  # composite PDF for the whole ordinance, so there is no document named
  # for definitions to find.
  definitions_at: L284-L409
zones:
  R10:
    section:
    - '5.010'
    - '5.075'
    - '5.080'
    cite_default:
      cite: Rivergrove Land Development Ordinance (RLDO, Ord. 54-89); Metro RLIS Zoning layer
      url: https://www.cityofrivergrove.org/zoning
      retrieved: '2026-07-28'
    quadplex_allowed:
      # 5.050 lists what may be built -- one single-family detached dwelling,
      # one duplex, or one triplex per lot -- and closes the list: "Uses not
      # listed here are prohibited." A quadplex is not on it. Rivergrove is
      # under a thousand people and outside Tillamook County, so ORS
      # 197A.420(4)(a)(A) leaves the middle housing mandate off it.
      value: false
      quote: "or/clackamas/rivergrove/rldo.composite.txt#L863-L866"
    setback_front_ft:
      value: 25
      quote: "or/clackamas/rivergrove/rldo.composite.txt#L1023-L1026,L1038-L1039"
    setback_side_ft:
      value: 10
      quote: "or/clackamas/rivergrove/rldo.composite.txt#L1033,L1038-L1039"
    setback_rear_ft:
      # "from the rear lot line or the ordinary high water mark - whichever is
      # greater". On a lot fronting the Tualatin the binding line may be the
      # water rather than the boundary, which is a measurement this screen
      # does not make; 25 ft from the lot line is the floor under it.
      value: 25
      quote: "or/clackamas/rivergrove/rldo.composite.txt#L1035-L1036,L1038-L1039"
    setback_street_side_ft:
      value: 15
      quote: "or/clackamas/rivergrove/rldo.composite.txt#L1034"
    min_lot_sqft:
      value: 10000
      quote: "or/clackamas/rivergrove/rldo.composite.txt#L844-L846"
    notes: 'quadfit confidence: needs_verification | NOT subject to HB 2001 — city pop <=1,000 exempt.
      Single SFR district; no middle-housing code. Metro ZONE ''R10'' verified (ZONE_CLASS SFR1). ~half
      the city is floodplain (0.5 ac min there).'
