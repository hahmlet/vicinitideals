      these words in it. WHAT THE LINES ACTUALLY SAY does not reach this building either.
      36.410(2)(b) lets the RML minimum lot size for detached houses, duplexes, triplexes and
      quadplexes drop to 3,000 square feet -- a relaxation, and one bought with four conditions
      that describe a subdivision rather than a lot: the site must be at least one acre, five
      percent of gross site area must be platted as open space, at least twenty percent of the
      dwelling units must be townhomes, duplexes, triplexes or quadplexes, and no more than
      seventy percent of the single-family building permits may issue before the other housing
      types are finished. That is a phasing plan for a developer building a neighbourhood. This
      project screens whether one pod fits one existing lot, so the relaxation is unavailable and
      the conditions are unmeasurable, and both facts point the same way.
    fingerprint: c64092d96a69c6ab
  "36.400-420.lot-dimensions.txt#36.420":
