label: Tualatin
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  PARKING READ 2026-08-30, and it answers the question Clackamas County could not. TDC 73C.030(1)
  states no dimension of its own — off-street parking lot design "must comply with the dimensional
  standards set forth in Figure 73-1" — and Figure 73-1 is in Appendix B at the back of the code.
  That is the same sentence as ZDO 1015.02(A)(4) pointing at Standard Drawing P100, and the opposite
  outcome, because this drawing carries its numbers as a table and they extract whole. Ten values in
  `defaults`, the tenth city the site plan can dimension.


  Three readings sit under those numbers and each is written out beside the value it produced.
  WHICH GRID: Figure 73-1 prints two of them and the captions are drawn into the image, so the
  larger is taken — 9 by 18.5 with a 24-foot aisle is the stricter rectangle, and a lot that lays
  out on it lays out on either. THE BUILDING IS NAMED: 73C.090(1)(a) reaches "single-family
  residential uses and middle housing types (duplexes, triplexes quadplexes, townhouses, and cottage
  clusters)", so for once no noun had to be argued and no table row chosen. AND FIVE IS THE LINE:
  73C.220 would set parking ten feet off every property line and ten feet off the building, which
  takes a rear court apart, but it governs "Multi-family residential uses (as defined in TDC
  31.060)" and TDC 31.060 defines a Multi-Family Structure as five or more dwelling units on one
  lot.


  Four refusals came out of the same reading and all four are recorded beside the numbers rather
  than here. Three are landscaping — a five-foot planted perimeter that the side yard already
  clears, landscape islands at the aisle ends, and thirty percent tree canopy over the court. The
  fourth is the one to know about: RML states a ten-foot setback between parking and ANY lot line
  and the model holds only a setback from a street, so the side and rear half is refused, and that
  refusal is the first in this corpus that is not inert. Every one of Tualatin''s 653 lots in the
  parcel universe is RL, where the same ten feet is confined to the Conditional Uses row and a
  quadplex is permitted outright. The day an RML lot appears, this city comes off the laid-out list.'
ingest:
  geoid: null
  juris_city_codes:
  - TUALATIN
  zoning_layer: zoning_tualatin
  zone_field: PLANDIST.CZONE
  strip_lowercase_suffix: false
crossrefs:

  # --- two use-table rows that are not this building -----------------------
  "34.400":
    outcome: other_building
    note: >-
      "Retirement Housing Facility C Subject to TDC 34.400" -- a conditional use with its own
      chapter, and a different building from four dwelling units. The pod''s own row is named
      separately in 73C.030(1), which is what this layer''s parking geometry is read from.
  "73A.170":
    outcome: other_building
    note: >-
      "Accessory Dwelling Unit P Subject to TDC 73A.170." A subordinate unit beside a house.
  "35":
    outcome: other_path
    note: >-
      Nonconforming Situations. Every mention routes an existing situation that already fails the
      code into the chapter governing how it may continue. This screen places a new building on a
      lot that has to pass the standards as written.

definitions:
  # "Corner Lot. A lot abutting two intersecting streets other than an alley."
  #
  # The shortest definition in the corpus and the same shape as Oregon City's,
  # with the alley exclusion stated in the sentence rather than left to the
  # front lot line rule. No angle, so a curving street is read the way silence
  # is read everywhere else: a non-collinear frontage is an intersection.
  # Clackamas County, whose land surrounds Tualatin, says the opposite -- and
  # the county's rule does not reach inside the city.
  corner_lot:
    test: intersecting_frontages
    count: 2
    quote: "or/clackamas/tualatin/31.definitions.txt#L2"
    cite: "TDC 31, Lot Types, Corner Lot"

code:
  # Municode client 4668, publication 1818 (updated 2026-05-21). The zoning
  # lives in the separately-published Development Code, not the City Charter
  # and Municipal Code (publication 1817). The library renders in JavaScript;
  # this endpoint returns the adopted PDF.
  # TDC 31 is the Development Code's definitions. Same publication as the
  # residential chapters, cut to the definitions chapter.
  - id: "31.definitions"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "TDC Chapter 31 - Definitions"
    start: "Lot Types:"
    end: "TDC 32."
    extraction: plain
    # Prose about words, so almost nothing in it is a dimensioned standard.
    # Read 2026-08-18: the slice opens on the lot types and states corner,
    # double frontage and flag lot.
    allow_thin: true
  - id: "40-41.residential"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "Chapters 40-41 - Low and Medium Low Density Residential (RL, RML)"
    start: "TDC 40.100."
    end: "TDC 42.100."
    # Layout-mode extraction fuses this PDF's words ("areasintheCity...");
    # plain mode reads it cleanly. Tables 40-1/40-2 lose their geometry, which
    # is the declared trade until the grid matters more than the prose.
    extraction: plain
  # The two chapters both residential tables point at. Fetched because the
  # cross-reference ledger ranked TDC 36.410 the loudest unread reference in
  # this corpus -- eighteen mentions, fifteen of them beside a number this
  # screen uses -- and a reference that loud is either a standard we are
  # missing or a question we can close in writing. It was the second.
  - id: "36.400-420.lot-dimensions"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "TDC 36.400-36.420 - Lot Dimensions, Flexible Lot Subdivisions"
    start: "TDC 36.400.  Lot Dimensions."
    end: "TDC 36.500.  Enforcement"
    extraction: plain
  # Named for the span it holds, not for the chapter. 73A runs to .130 and
  # this is .020 through .060; a document called "73A" would answer for
  # 73A.170, the accessory-dwelling standards, which is not in it.
  - id: "73A.020-060.residential-design"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "TDC 73A.020-73A.060 - Residential Design Standards"
    start: "TDC 73A.020.  Residential Design Standards Applicability"
    end: "TDC 73A.070.  Clear and Objective (Type I) Cottage Cluster"
    extraction: plain
    # Six of 147 lines read like regulation, which trips the plausibility
    # guard and is the correct reading of the chapter: it is written in
    # design elements rather than dimensions. "At least three Residential
    # Roof Design Elements", "windows that occupy at least 12 percent of the
    # wall plane", a three-foot walkway. Read 2026-08-20; nothing in it moves
    # a wall, so nothing cites it. It is held so the reference stops being
    # unread rather than so a value can quote it.
    allow_thin: true
  # The parking chapter, and the reference the residential tables point at
  # eleven times over -- "must be sufficient to comply with at least the
  # minimum access requirements in TDC 73C". Ordinance 1486-24 repealed the
  # old chapter and enacted this one whole on 10 June 2024, which is why every
  # subsection carries the same citation.
  - id: "73C.parking"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "TDC Chapter 73C - Parking Standards"
    start: "TDC 73C.010.  Off-Street Parking and Loading Purpose and Applicability."
    end: "TDC 73D.010. Applicability and Objectives."
    extraction: plain
  # 73C.030(1) states no dimension of its own. It says off-street parking lot
  # design "must comply with the dimensional standards set forth in Figure
  # 73-1", and the figures live in Appendix B at the back of the code rather
  # than in the chapter. This is the second time this corpus has followed a
  # parking chapter into a drawing; unlike Clackamas County's Standard Drawing
  # P100, this one carries its numbers as a table and they extract.
  #
  # The slice opens on the line of Appendix B's figure list that names Figure
  # 73-1 and runs to the end of the appendix, because the captions on the
  # figure pages themselves are images. What identifies the two dimension
  # tables as Figure 73-1 is therefore in the document: the list order, the
  # page numbering that puts them on TDB:5 and TDB:6 between Figure 71-1 on
  # TDB:4 and Figure 73-3 after them, and the ordinance -- 1486-24 § 17, the
  # same June 2024 ordinance that enacted 73C.
  - id: "appendix-b.figures"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "TDC Appendix B - Figures, incl. Figure 73-1 Parking Space Design Standards"
    start: "Figure 73-1: Parking Space Design Standards"
    end: "TABLE OF OMITTED FIGURES"
    extraction: plain
    # Read 2026-08-30, and the plausibility guard is right to be surprised:
    # zero of its 73 lines carry a section number or a dimensioned standard.
    # A figure appendix has neither. What it has is two grids of bare decimals
    # -- "Stall Width A 8.0 9.0 9.0 9.0 9.0" -- whose units and column angles
    # sit in a diagram the extractor cannot see, so a table that is nothing
    # BUT dimensions reads as a page with none. Declared thin rather than
    # forced through at a prompt, because the override belongs where the next
    # reader will find it.
    allow_thin: true
  # ---- The two environmental chapters, read 2026-09-03 ----
  #
  # Tualatin was the last name on quadfit's UNSCREENED list and it came off the
  # same day as Gladstone. The reason it sat there was never that the city
  # publishes nothing -- it publishes the best environmental data in the corpus,
  # the adopted overlay itself rather than a regional proxy for it -- but that
  # the note recording the service pointed at a folder path that answers "Token
  # Required". The layers are at the root of the same server. "The city does not
  # publish it" and "our path is wrong" look identical from a screen, and only
  # one of them is a coverage gap.
  #
  # Both chapters are stored because the screening decision quotes them; the
  # decision lives beside the layers in Lot Analysis/quadfit/config/overlays.yaml.
  # Neither states a dimension this layer's fields could hold: 72's widths are
  # measured from a creek centreline or a top of bank and 71's 40 feet from a
  # wetland boundary, and no field here anchors a setback to a resource.
  #
  # Worth flagging for whoever reads Chapter 71 next: TDC 71.020 says the
  # district boundaries "are hereby fixed and established as shown on Map 71-1".
  # No other city in this corpus says that about its map. Milwaukie calls its
  # map a general indicator, Gladstone adopts one it does not publish, West Linn
  # publishes centrelines and makes the code supply the width. A sentence that
  # makes the map the boundary is the strongest thing a screen can stand on.
  - id: "71.wetlands-protection"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "TDC Chapter 71 - Wetlands Protection District (WPD)"
    start: "TDC 71.010. Purpose."
    # Ends on the next chapter's banner rather than its first section, which
    # would leave three lines of Chapter 72's heading on the end of this one.
    end: "CHAPTER 72."
    nth: 2
    extraction: plain
  - id: "72.natural-resource-overlay"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "TDC Chapter 72 - Natural Resource Protection Overlay District (NRPO)"
    start: "TDC 72.010. Purpose."
    end: "CHAPTER 73A"
    nth: 2
    extraction: plain
defaults:
  # PARKING, read 2026-08-30. Tualatin is the second city in this corpus whose
  # parking chapter states no dimension of its own and sends the reader to a
  # drawing -- and the first where the drawing answers. TDC 73C.030(1) says
  # off-street parking lot design "must comply with the dimensional standards
  # set forth in Figure 73-1", and Figure 73-1 is two grids of numbers in
  # Appendix B at the back of the code. Clackamas County's Standard Drawing
  # P100 is the same sentence with a CAD sheet at the end of it, and that one
  # is still refused.
  #
  # WHICH GRID IS THE STANDARD SPACE IS NOT IN THE TEXT, because the two
  # captions are drawn into the figures. The larger is encoded and the reason
  # is the direction of the error, not confidence: nine by eighteen and a half
  # with a 24-foot aisle is the stricter rectangle, so a lot that lays out on
  # it lays out on either grid. The corroboration is good anyway -- 73C.030(8)
  # regulates "sub-compact vehicles", the smaller grid's parallel stall is 20
  # feet where a standard parallel space is 24, and a US sub-compact stall is
  # about eight by sixteen, which is the smaller grid exactly.
  #
  # NOTHING IS REQUIRED AND NOTHING IS CAPPED. Table 73C-1 has no minimum
  # column for vehicles at all -- its heading is MAXIMUM PERMITTED VEHICLE
  # PARKING, with minimums stated only for bicycles -- and the Middle Housing
  # row, which lists Quadplexes by name, prints None in both maximum columns.
  # Ordinance 1486-24 rewrote this chapter whole in June 2024, which is when
  # Oregon's parking-mandate rules came due. Checked against the whole
  # publication and not just the chapter: the only "spaces per unit" figures
  # anywhere in 21,780 lines are Table 73C-1's multi-family maximums of 1.2
  # and 2.0 and the bicycle minimums beside them.
  parking_min_per_unit:
    value: 0
    cite: TDC 73C.040 Table 73C-1(a)(ii)(c), Quadplexes; no minimum vehicle parking column exists
    url: https://api.municode.com/PublicationPdfDownload/1818
    retrieved: '2026-08-30'
    quote: "or/clackamas/tualatin/73C.parking.txt#L130,L132,L137,L154,L157,L160"
  parking_max_per_unit:
    exempt: true
    cite: TDC 73C.040 Table 73C-1(a)(ii)(c), Quadplexes, None in both maximum columns
    url: https://api.municode.com/PublicationPdfDownload/1818
    retrieved: '2026-08-30'
    quote: "or/clackamas/tualatin/73C.parking.txt#L130,L132,L137,L154,L157,L160"
  # Figure 73-1, first grid, 90-degree column. The stored figures document
  # opens on the line of Appendix B's list that names Figure 73-1 and keeps
  # the page numbering, because the figure captions themselves are images:
  # the list puts 73-1 between 71-1 and 73-3, the grids sit on TDB:5 and TDB:6
  # between Figure 71-1's caption on TDB:4 and Figure 73-3's after them, and
  # they carry Ord. 1486-24 section 17 -- the same June 2024 ordinance.
  parking_stall_width_ft:
    value: 9
    cite: TDC 73C.030(1) and Figure 73-1 (Appendix B), standard space, 90 degrees
    url: https://api.municode.com/PublicationPdfDownload/1818
    retrieved: '2026-08-30'
    quote: "or/clackamas/tualatin/appendix-b.figures.txt#L21,L26-L27"
  parking_stall_depth_ft:
    value: 18.5
    cite: TDC 73C.030(1) and Figure 73-1 (Appendix B), standard space, 90 degrees
    url: https://api.municode.com/PublicationPdfDownload/1818
    retrieved: '2026-08-30'
    quote: "or/clackamas/tualatin/appendix-b.figures.txt#L21,L26,L28"
  # One aisle figure per angle, not split by direction -- the fourth layer in
  # this corpus to state it that way. 24 feet ties Fairview, Gladstone, Happy
  # Valley and Oregon City; only Troutdale and unincorporated Multnomah ask
  # more.
  parking_aisle_one_way_ft:
    value: 24
    cite: TDC 73C.030(1) and Figure 73-1 (Appendix B), standard space, 90 degrees
    url: https://api.municode.com/PublicationPdfDownload/1818
    retrieved: '2026-08-30'
    quote: "or/clackamas/tualatin/appendix-b.figures.txt#L21,L26,L29"
  parking_aisle_two_way_ft:
    value: 24
    cite: TDC 73C.030(1) and Figure 73-1 (Appendix B), standard space, 90 degrees
    url: https://api.municode.com/PublicationPdfDownload/1818
    retrieved: '2026-08-30'
    quote: "or/clackamas/tualatin/appendix-b.figures.txt#L21,L26,L29"
  # THE DRIVE AND THE APPROACH ARE TWO DIFFERENT RULES HERE, and the code
  # says which is which. Figure 73-1's last two rows dimension the driveway
  # inside a parking lot: 12 feet one way, 22 feet two way, the same in both
  # grids. 73C.090(1)(a) dimensions what meets the street, and says so --
  # "driveway widths must be measured at the right-of-way line". So the side
  # lane takes the figure and the curb cut takes 73C.090.
  driveway_min_width_one_way_ft:
    value: 12
    cite: TDC 73C.030(1) and Figure 73-1 (Appendix B), Driveway One Way
    url: https://api.municode.com/PublicationPdfDownload/1818
    retrieved: '2026-08-30'
    quote: "or/clackamas/tualatin/appendix-b.figures.txt#L32"
  driveway_min_width_two_way_ft:
    value: 22
    cite: TDC 73C.030(1) and Figure 73-1 (Appendix B), Driveway Two Way
    url: https://api.municode.com/PublicationPdfDownload/1818
    retrieved: '2026-08-30'
    quote: "or/clackamas/tualatin/appendix-b.figures.txt#L33"
  # 73C.090(1)(a) names the building. "Ingress and egress for single-family
  # residential uses and middle housing types (duplexes, triplexes quadplexes,
  # townhouses, and cottage clusters) must be paved to a minimum width of ten
  # feet. Maximum widths for new or expanded driveways must not exceed 24
  # feet." No noun has to be argued for and no row has to be chosen: the pod
  # is listed. The multi-family table underneath it starts at five units and
  # asks 24 feet, and it is not this building's row.
  driveway_approach_min_width_ft:
    value: 10
    cite: TDC 73C.090(1)(a), middle housing types incl. quadplexes
    url: https://api.municode.com/PublicationPdfDownload/1818
    retrieved: '2026-08-30'
    quote: "or/clackamas/tualatin/73C.parking.txt#L530,L532-L537"
  driveway_approach_max_width_ft:
    value: 24
    cite: TDC 73C.090(1)(a), maximum width for new or expanded driveways
    url: https://api.municode.com/PublicationPdfDownload/1818
    retrieved: '2026-08-30'
    quote: "or/clackamas/tualatin/73C.parking.txt#L530,L532-L537"
  #
  # NOT ENCODED: the five-foot perimeter. 73C.210(3) requires landscaping a
  # "Minimum five feet in width in all off-street parking and vehicular
  # circulation areas", under a section that opens "All development where new
  # parking is provided", so it reaches the pod. It is a strip between the
  # parking and everything around it and no field in this model holds one.
  # Inert on the numbers this screen already carries: five feet is exactly the
  # side yard in both RL and RML, and both rear yards and both front yards are
  # larger, so the envelope the court is drawn in is already cut back at least
  # this far on every line. Recorded because the day a zone here states a side
  # yard under five feet it stops being inert.
  # (or/clackamas/tualatin/73C.parking.txt#L672-L673,L684-L685)
  #
  # NOT ENCODED: the landscape islands, and this one is not inert. 73C.210(4)
  # asks a "Minimum 25 square feet per parking space" of landscape island --
  # 100 square feet for the pod's four -- and (c) puts them "at aisle ends",
  # which is inside the court rather than around it, and (e) adds one
  # deciduous shade tree for every four spaces. A hundred square feet at the
  # end of a 24-foot aisle is a real claim on the same ground the court needs
  # and this model has no field for a reserve inside a parking area. The
  # eight-space separation rule in (d) does not reach a row of four.
  # (or/clackamas/tualatin/73C.parking.txt#L695-L696,L705-L707,L711-L712)
  #
  # NOT ENCODED: 30 percent tree canopy over the parking area, 73C.030(12)(a),
  # for lots whose parking is under half an acre, which is all of them here. A
  # canopy is measured at fifteen years and sits above a car rather than in
  # its way, so unlike the islands it takes no ground the stall needs; it is a
  # planting schedule this screen cannot check and does not have to.
  # (or/clackamas/tualatin/73C.parking.txt#L79-L83)
  #
  # READ AND DOES NOT REACH. 73C.220 states the two numbers that would have
  # hurt -- a 10-foot landscape setback between parking and every property
  # line, and a 10-foot landscaped transition between parking and the building
  # -- but it governs "Multi-family residential uses (as defined in TDC
  # 31.060)", and TDC 31.060 defines a Multi-Family Structure as "A structure
  # containing five or more dwelling units on one lot". The pod is four. That
  # its transition rule then excepts duplexes and townhouses by name is the
  # only thing arguing the other way, and a numbered definition beats an
  # exception list. 73C.030(4)(b)'s no-backing-into-the-street rule reaches
  # "groups of more than four parking spaces" and the pod parks four exactly;
  # 73C.210(5)'s access landscaping starts at twelve spaces; 73C.030(11)'s
  # parking coverage cap starts at 65,000 square feet of floor area; and
  # 73C.030(13)'s solar-or-canopy choice starts at half an acre of parking.
  # (or/clackamas/tualatin/31.definitions.txt#L250-L252,
  #  or/clackamas/tualatin/73C.parking.txt#L44-L46,L728-L731,L737,L746-L747)
zones:
  RL:
    max_density_du_per_acre:
      # Table 40-3, MAXIMUM DENSITY. The table states a ceiling per
      # housing type and prints "None" against Quadplex, which is the pod on
      # one lot. Exempt rather than a large number: the code states no maximum
      # here.
      exempt: true
      quote: "or/clackamas/tualatin/40-41.residential.txt#L140,L146"
      variants:
        # The same table's Townhouse row, which is the split-plat path.
        - value: 25
          when: [unit_lots]
          quote: "or/clackamas/tualatin/40-41.residential.txt#L140,L144"
    section: ["40."]
    cite_default:
      cite: TDC 40.220 Table (Minimum Lot Size, Lot Width, Setbacks, Height, Coverage); quadplex permitted
        outright per TDC 40.210
      url: https://api.municode.com/PublicationPdfDownload/1818
      retrieved: '2026-08-14'
    quadplex_allowed:
      value: true
      quote: "or/clackamas/tualatin/40-41.residential.txt#L120"
    setback_front_ft:
      value: 15
      quote: "or/clackamas/tualatin/40-41.residential.txt#L211"
    # NO PARKING SETBACK IN RL, and it is worth saying where the ten feet
    # went. Table 40.300 does state one -- "Parking and vehicular circula-
    # tion areas must be set back a minimum of ten feet from any public
    # right-of-way or property line" -- but the sentence sits inside the
    # MINIMUM SETBACKS table's Conditional Uses row, beside "As determined
    # through Architectural Review process", and a quadplex is permitted
    # outright here by TDC 40.210. RML states the same ten feet as a row of
    # its own, which is what makes the placement in RL a choice rather than
    # an accident. All 653 of Tualatin's lots that reach the site plan are
    # RL. (or/clackamas/tualatin/40-41.residential.txt#L225-L233)
    setback_side_ft:
      value: 5
      quote: "or/clackamas/tualatin/40-41.residential.txt#L220"
    setback_rear_ft:
      value: 15
      quote: "or/clackamas/tualatin/40-41.residential.txt#L224"
    setback_street_side_ft:
      value: 10
      quote: "or/clackamas/tualatin/40-41.residential.txt#L213-L214"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/clackamas/tualatin/40-41.residential.txt#L219"
    min_lot_sqft:
      value: 6500
      quote: "or/clackamas/tualatin/40-41.residential.txt#L171"
      variants:
        # The same table's townhouse row. Four of these is 5,600 sq ft against
        # the quadplex row's 6,500 — the split plat buys a smaller lot here.
        - value: 1400
          when: [unit_lots]
          quote: "or/clackamas/tualatin/40-41.residential.txt#L166"
    min_lot_width_ft:
      value: 50
      quote: "or/clackamas/tualatin/40-41.residential.txt#L190-L191"
      variants:
        # "T ownhouse None" — the table states no minimum lot width for a
        # townhouse. Encoded as zero rather than left out, because left out
        # would inherit the 50 ft quadplex row, which is the opposite of what
        # the row says.
        - value: 0
          when: [unit_lots]
          quote: "or/clackamas/tualatin/40-41.residential.txt#L196"
    max_coverage_pct:
      value: 60
      quote: "or/clackamas/tualatin/40-41.residential.txt#L248"
      variants:
        - value: 75
          when: [unit_lots]
          quote: "or/clackamas/tualatin/40-41.residential.txt#L246"
    max_height_ft:
      value: 35
      quote: "or/clackamas/tualatin/40-41.residential.txt#L237"
    notes: 'Every value is now read off the adopted Development Code rather than an aggregator, and
      every one is the quadplex row where the table states standards by housing type — the single-family
      rows differ (45% coverage, and a 6,500 sq ft lot stated as a subdivision average). min_frontage_ft
      50 is dropped: the table states a minimum lot WIDTH, not a frontage, and the two are not the same
      test on a flag or cul-de-sac lot. Relief the table states and this file does not encode: front
      12 ft to an unenclosed porch, lot width 30 ft on a cul-de-sac, zero side setback where townhouse
      units attach, height to 50 ft through Type II Architectural Review. Corner-lot street side is 10
      ft measured from the secondary frontage, which the code determines by where the front door faces.
      TDC 36.410 is read and ruled: it reduces the RL minimum lot to 5,000 sq ft in a Flexible Lot
      Subdivision, and the chapter opens by putting itself under "the discretionary subdivision
      standards in TDC 36.120 and not the Housing Clear and Objective Standards". A discretionary
      path that only ever loosens a standard cannot turn this screen red and must not be allowed to
      turn it green, so it stays out of the encoding rather than being carried as relief. TDC 36.400
      is lot creation — double frontage, side lot lines at right angles, and a public-street frontage
      requirement on lots created after 1 September 1979 — none of which bind development on a lot
      that already exists.'
