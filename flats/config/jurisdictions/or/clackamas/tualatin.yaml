  "36.400-420.lot-dimensions.txt#36.125":
    queue: chapter
    outcome: nothing_here
    note: >-
      THE LINES ON THIS CARD ARE NOT 36.125. They are TDC 36.410, Flexible Lot Subdivisions for RL
      and RML Zones, pulled onto a card headed 36.125 by the cross-reference in 36.410's own first
      paragraph, which says the flexible-lot provisions are "subject to the discretionary
      subdivision standards in TDC 36.120 and not the Housing Clear and Objective Standards in TDC
      36.125". Nearest-heading-above picked the mention rather than the section -- the same
      attribution slip as the Wilsonville church lines and the hoisted use table, and worth naming
