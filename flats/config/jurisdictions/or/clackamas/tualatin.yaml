label: Tualatin
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  PARKING READ 2026-08-30, and it answers the question Clackamas County could not. TDC 73C.030(1)
  states no dimension of its own — off-street parking lot design "must comply with the dimensional
  standards set forth in Figure 73-1" — and Figure 73-1 is in Appendix B at the back of the code.
  That is the same sentence as ZDO 1015.02(A)(4) pointing at Standard Drawing P100, and the opposite
  outcome, because this drawing carries its numbers as a table and they extract whole. Ten values in
  `defaults`, the tenth city the site plan can dimension.


  Three readings sit under those numbers and each is written out beside the value it produced.
  WHICH GRID: Figure 73-1 prints two of them and the captions are drawn into the image, so the
  larger is taken — 9 by 18.5 with a 24-foot aisle is the stricter rectangle, and a lot that lays
  out on it lays out on either. THE BUILDING IS NAMED: 73C.090(1)(a) reaches "single-family
  residential uses and middle housing types (duplexes, triplexes quadplexes, townhouses, and cottage
  clusters)", so for once no noun had to be argued and no table row chosen. AND FIVE IS THE LINE:
  73C.220 would set parking ten feet off every property line and ten feet off the building, which
  takes a rear court apart, but it governs "Multi-family residential uses (as defined in TDC
  31.060)" and TDC 31.060 defines a Multi-Family Structure as five or more dwelling units on one
  lot.


  Four refusals came out of the same reading and all four are recorded beside the numbers rather
  than here. Three are landscaping — a five-foot planted perimeter that the side yard already
  clears, landscape islands at the aisle ends, and thirty percent tree canopy over the court. The
  fourth is the one to know about: RML states a ten-foot setback between parking and ANY lot line
  and the model holds only a setback from a street, so the side and rear half is refused, and that
  refusal is the first in this corpus that is not inert. Every one of Tualatin''s 653 lots in the
  parcel universe is RL, where the same ten feet is confined to the Conditional Uses row and a
  quadplex is permitted outright. The day an RML lot appears, this city comes off the laid-out list.'
ingest:
  geoid: null
  juris_city_codes:
  - TUALATIN
  zoning_layer: zoning_tualatin
  zone_field: PLANDIST.CZONE
  strip_lowercase_suffix: false
