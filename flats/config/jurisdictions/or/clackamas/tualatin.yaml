  "31.definitions.txt#31.060":
    queue: chapter
    outcome: nothing_here
    note: >-
      Tualatin's definition of NET ACRES, and it is this corpus's clearest example of why the
      denominator ledger exists. The area proposed for development after deducting sensitive land
      -- 100-year floodplain preserved in a tract, land exceeding 25 percent slope, drainage ways,
      wetlands and their buffers -- plus land dedicated for parks and for rights-of-way and
      stormwater. And then the line that makes it a definition unlike any other in this corpus:
      "when actual information is not available, the following formulas MAY be used: single-family
      development, allocate 20 percent of gross acres; multi-family including apartments,
      condominiums and townhouses, allocate 15 percent." A city that lets an applicant substitute
      a flat percentage for a measurement, at the applicant's option. It closes here for the same
      reason Gladstone's net acre does: net acres is the base for maximum DENSITY, units per acre,
      and this screen never asks how many units fit an acre -- it asks whether one pod fits one
      lot, and measures lot area, setbacks, coverage and the court. Recorded because seven cities
      in this corpus define net acre seven ways, and this is the one that also defines it two ways
      within itself.
    fingerprint: ee6393ef335c1903
  "71.wetlands-protection.txt#71":
