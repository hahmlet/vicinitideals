      the legal description of the Tualatin wetlands protected area boundary: a surveyor's
      traverse recorded in the code so the map has words. Every number on this card is a bearing
      or a distance along that traverse and none of them is a standard anybody complies with. This
      chapter is also where one of this project's reader-blindness findings came from -- the
      half-inch iron rod whose fraction character was stored as a NUL byte, which no grep could
      find -- so these lines are worth keeping in view rather than filtering out of the corpus:
      they are the shape that proves the extractor is reading what is actually on the page. The
      chapter queue has no button for "this is not a sentence", which the reading-queue design
      gives to the no-field lane instead; closing it here with the reason written out is the
      nearest honest thing, and the boundary the traverse describes is held by the overlay layer,
