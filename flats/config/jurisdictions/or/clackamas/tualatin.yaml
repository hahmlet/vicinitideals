label: Tualatin
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.'
ingest:
  geoid: null
  juris_city_codes:
  - TUALATIN
  zoning_layer: zoning_tualatin
  zone_field: PLANDIST.CZONE
  strip_lowercase_suffix: false
definitions:
  # "Corner Lot. A lot abutting two intersecting streets other than an alley."
  #
  # The shortest definition in the corpus and the same shape as Oregon City's,
  # with the alley exclusion stated in the sentence rather than left to the
  # front lot line rule. No angle, so a curving street is read the way silence
  # is read everywhere else: a non-collinear frontage is an intersection.
  # Clackamas County, whose land surrounds Tualatin, says the opposite -- and
  # the county's rule does not reach inside the city.
  corner_lot:
    test: intersecting_frontages
    count: 2
    quote: "or/clackamas/tualatin/31.definitions.txt#L2"
    cite: "TDC 31, Lot Types, Corner Lot"

code:
  # Municode client 4668, publication 1818 (updated 2026-05-21). The zoning
  # lives in the separately-published Development Code, not the City Charter
  # and Municipal Code (publication 1817). The library renders in JavaScript;
  # this endpoint returns the adopted PDF.
  # TDC 31 is the Development Code's definitions. Same publication as the
  # residential chapters, cut to the definitions chapter.
  - id: "31.definitions"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "TDC Chapter 31 - Definitions"
    start: "Lot Types:"
    end: "TDC 32."
    extraction: plain
    # Prose about words, so almost nothing in it is a dimensioned standard.
    # Read 2026-08-18: the slice opens on the lot types and states corner,
    # double frontage and flag lot.
    allow_thin: true
  - id: "40-41.residential"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "Chapters 40-41 - Low and Medium Low Density Residential (RL, RML)"
    start: "TDC 40.100."
    end: "TDC 42.100."
    # Layout-mode extraction fuses this PDF's words ("areasintheCity...");
    # plain mode reads it cleanly. Tables 40-1/40-2 lose their geometry, which
    # is the declared trade until the grid matters more than the prose.
    extraction: plain
  # The two chapters both residential tables point at. Fetched because the
  # cross-reference ledger ranked TDC 36.410 the loudest unread reference in
  # this corpus -- eighteen mentions, fifteen of them beside a number this
  # screen uses -- and a reference that loud is either a standard we are
  # missing or a question we can close in writing. It was the second.
  - id: "36.400-420.lot-dimensions"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "TDC 36.400-36.420 - Lot Dimensions, Flexible Lot Subdivisions"
    start: "TDC 36.400.  Lot Dimensions."
    end: "TDC 36.500.  Enforcement"
    extraction: plain
  # Named for the span it holds, not for the chapter. 73A runs to .130 and
  # this is .020 through .060; a document called "73A" would answer for
  # 73A.170, the accessory-dwelling standards, which is not in it.
  - id: "73A.020-060.residential-design"
    url: https://api.municode.com/PublicationPdfDownload/1818
    title: "TDC 73A.020-73A.060 - Residential Design Standards"
    start: "TDC 73A.020.  Residential Design Standards Applicability"
    end: "TDC 73A.070.  Clear and Objective (Type I) Cottage Cluster"
    extraction: plain
    # Six of 147 lines read like regulation, which trips the plausibility
    # guard and is the correct reading of the chapter: it is written in
    # design elements rather than dimensions. "At least three Residential
    # Roof Design Elements", "windows that occupy at least 12 percent of the
    # wall plane", a three-foot walkway. Read 2026-08-20; nothing in it moves
    # a wall, so nothing cites it. It is held so the reference stops being
    # unread rather than so a value can quote it.
    allow_thin: true
zones:
  RL:
    max_density_du_per_acre:
      # Table 40-3, MAXIMUM DENSITY. The table states a ceiling per
      # housing type and prints "None" against Quadplex, which is the pod on
      # one lot. Exempt rather than a large number: the code states no maximum
      # here.
      exempt: true
      quote: "or/clackamas/tualatin/40-41.residential.txt#L140,L146"
      variants:
        # The same table's Townhouse row, which is the split-plat path.
        - value: 25
          when: [unit_lots]
          quote: "or/clackamas/tualatin/40-41.residential.txt#L140,L144"
    section: ["40."]
    cite_default:
      cite: TDC 40.220 Table (Minimum Lot Size, Lot Width, Setbacks, Height, Coverage); quadplex permitted
        outright per TDC 40.210
      url: https://api.municode.com/PublicationPdfDownload/1818
      retrieved: '2026-08-14'
    quadplex_allowed:
      value: true
      quote: "or/clackamas/tualatin/40-41.residential.txt#L120"
    setback_front_ft:
      value: 15
      quote: "or/clackamas/tualatin/40-41.residential.txt#L211"
    setback_side_ft:
      value: 5
      quote: "or/clackamas/tualatin/40-41.residential.txt#L220"
    setback_rear_ft:
      value: 15
      quote: "or/clackamas/tualatin/40-41.residential.txt#L224"
    setback_street_side_ft:
      value: 10
      quote: "or/clackamas/tualatin/40-41.residential.txt#L213-L214"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/clackamas/tualatin/40-41.residential.txt#L219"
    min_lot_sqft:
      value: 6500
      quote: "or/clackamas/tualatin/40-41.residential.txt#L171"
      variants:
        # The same table's townhouse row. Four of these is 5,600 sq ft against
        # the quadplex row's 6,500 — the split plat buys a smaller lot here.
        - value: 1400
          when: [unit_lots]
          quote: "or/clackamas/tualatin/40-41.residential.txt#L166"
    min_lot_width_ft:
      value: 50
      quote: "or/clackamas/tualatin/40-41.residential.txt#L190-L191"
      variants:
        # "T ownhouse None" — the table states no minimum lot width for a
        # townhouse. Encoded as zero rather than left out, because left out
        # would inherit the 50 ft quadplex row, which is the opposite of what
        # the row says.
        - value: 0
          when: [unit_lots]
          quote: "or/clackamas/tualatin/40-41.residential.txt#L196"
    max_coverage_pct:
      value: 60
      quote: "or/clackamas/tualatin/40-41.residential.txt#L248"
      variants:
        - value: 75
          when: [unit_lots]
          quote: "or/clackamas/tualatin/40-41.residential.txt#L246"
    max_height_ft:
      value: 35
      quote: "or/clackamas/tualatin/40-41.residential.txt#L237"
    notes: 'Every value is now read off the adopted Development Code rather than an aggregator, and
      every one is the quadplex row where the table states standards by housing type — the single-family
      rows differ (45% coverage, and a 6,500 sq ft lot stated as a subdivision average). min_frontage_ft
      50 is dropped: the table states a minimum lot WIDTH, not a frontage, and the two are not the same
      test on a flag or cul-de-sac lot. Relief the table states and this file does not encode: front
      12 ft to an unenclosed porch, lot width 30 ft on a cul-de-sac, zero side setback where townhouse
      units attach, height to 50 ft through Type II Architectural Review. Corner-lot street side is 10
      ft measured from the secondary frontage, which the code determines by where the front door faces.
      TDC 36.410 is read and ruled: it reduces the RL minimum lot to 5,000 sq ft in a Flexible Lot
      Subdivision, and the chapter opens by putting itself under "the discretionary subdivision
      standards in TDC 36.120 and not the Housing Clear and Objective Standards". A discretionary
      path that only ever loosens a standard cannot turn this screen red and must not be allowed to
      turn it green, so it stays out of the encoding rather than being carried as relief. TDC 36.400
      is lot creation — double frontage, side lot lines at right angles, and a public-street frontage
      requirement on lots created after 1 September 1979 — none of which bind development on a lot
      that already exists.'
  RML:
    max_density_du_per_acre:
      # Table 41-3, MAXIMUM DENSITY. The table states a ceiling per
      # housing type and prints "None" against Quadplex, which is the pod on
      # one lot. Exempt rather than a large number: the code states no maximum
      # here.
      exempt: true
      quote: "or/clackamas/tualatin/40-41.residential.txt#L445,L450"
      variants:
        # The same table's Townhouse row, which is the split-plat path.
        - value: 25
          when: [unit_lots]
          quote: "or/clackamas/tualatin/40-41.residential.txt#L445,L448"
    section: ["41."]
    cite_default:
      cite: TDC 41.220 Table (Minimum Lot Size, Average Lot Width, Setbacks, Height, Coverage); quadplex
        permitted outright per TDC 41.210
      url: https://api.municode.com/PublicationPdfDownload/1818
      retrieved: '2026-08-14'
    quadplex_allowed:
      value: true
      quote: "or/clackamas/tualatin/40-41.residential.txt#L417"
    setback_front_ft:
      value: 10
      quote: "or/clackamas/tualatin/40-41.residential.txt#L532"
    setback_side_ft:
      value: 5
      quote: "or/clackamas/tualatin/40-41.residential.txt#L534"
    setback_rear_ft:
      value: 10
      quote: "or/clackamas/tualatin/40-41.residential.txt#L537"
    setback_street_side_ft:
      value: 10
      quote: "or/clackamas/tualatin/40-41.residential.txt#L548-L553"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/clackamas/tualatin/40-41.residential.txt#L533"
    min_lot_sqft:
      value: 4500
      quote: "or/clackamas/tualatin/40-41.residential.txt#L478"
      variants:
        - value: 1400
          when: [unit_lots]
          quote: "or/clackamas/tualatin/40-41.residential.txt#L475"
    max_coverage_pct:
      value: 60
      quote: "or/clackamas/tualatin/40-41.residential.txt#L586"
      variants:
        - value: 75
          when: [unit_lots]
          quote: "or/clackamas/tualatin/40-41.residential.txt#L584"
    max_height_ft:
      value: 35
      quote: "or/clackamas/tualatin/40-41.residential.txt#L577"
    notes: 'The RML quadplex minimum lot is 4,500 sq ft, which this file did not carry at all — the
      prior note guessed 3,000 sq ft off the flexible-lot subdivision standard and said to verify it.
      min_lot_width_ft is deliberately absent: RML states a minimum AVERAGE lot width (50 ft for
      duplex, triplex, quadplex and cottage cluster), which is a subdivision-wide test and not a
      standard any single lot passes or fails. Street side comes from the corner-lot rule, which sets
      the front-yard setback on any street-facing side except for duplexes, triplexes and quadplexes,
      where it is 10 ft. Relief not encoded: lot size and width reductions for Flexible Lot
      Subdivisions under TDC 36.410, width 30 ft on a cul-de-sac, zero side setback where townhouse
      units attach, height to 50 ft where setbacks are 1.5x the height. TDC 36.410 is read: 3,000 sq
      ft in RML, discretionary, and conditioned on a one-acre site, five percent open space and a
      unit mix — a loosening this screen has no business claiming. One error found in reading it.
      TDC 41.300(1) sends the reader to "TDC 36.410(2)(b)" for the lot size, lot width, building
      coverage and setbacks that apply in small lot subdivisions; Ord. 1463-21 repealed that section
      and enacted a new 36.410 that states lot size and nothing else. The cross-reference points at a
      rule that no longer exists, so there is nothing behind it to encode.'
