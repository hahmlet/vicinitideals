    outcome: nothing_here
    note: >-
      TDC 36.420, Increased Density for Greenway and Natural Area Dedications in the RL zone -- a
      trade made at subdivision, not a standard on a lot. One small lot is permitted for each
      6,500 square foot greenway or natural area lot created in the plat, and the small lots so
