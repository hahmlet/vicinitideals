  # captions are drawn into the figures. The larger is encoded and the reason
  # is the direction of the error, not confidence: nine by eighteen and a half
  # with a 24-foot aisle is the stricter rectangle, so a lot that lays out on
  # it lays out on either grid. The corroboration is good anyway -- 73C.030(8)
  # regulates "sub-compact vehicles", the smaller grid's parallel stall is 20
  # feet where a standard parallel space is 24, and a US sub-compact stall is
