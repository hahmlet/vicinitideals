      # 25 is encoded, not 27. The 27 is the taller half of a split that
      # needs the lake's surface elevation cut against the lot, which nothing
      # here measures, and a pod is 26 ft: the difference between the two
      # halves is the difference between RED and GREEN. This is the only zone
      # in the corpus whose height standard the design cannot meet outright.
      value: 25
      cite: LOC 50.04.001.3 Table 50.04.001-11 note 5
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1436,L1438"
