    setback_street_side_ft:
      # Table 50.04.001-13 prints no street-side column at all, and every
      # setback cell in Table 50.04.001-11's R-2 column points here, so the
      # side standard is what governs a street-facing side yard. Same reading
      # as R-0 and R-3, where the attached block prints no street-side row.
      value: 7
      cite: LOC 50.04.001.3.e.ii Table 50.04.001-13
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1586,L1590"
    min_lot_sqft:
      value: 7000
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1246,L1252"
      variants:
