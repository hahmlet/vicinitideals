          quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1455"
    max_height_ft:
      # R-W is the waterway zone and its height is not measured from the
      # ground. The Flat Lot, sloping-topography and sloped-footprint rows
      # are all em dashes in this column; the only height the table states is
      # in the row "From Oswego Lake Surface Elevation", and the cell reads
      # "25/27 [5]". Note 5 splits it: 25 ft for any portion of the lot above
      # the lake surface elevation, 27 ft above the lake surface for any
      # portion at or below it.
