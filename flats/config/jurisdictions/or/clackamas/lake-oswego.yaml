    notes: 'Encoded 2026-08-21, from the gap the use table exposed. R-W is the residential
      waterway zone and it is the loosest zone in the corpus on every standard but one: no
      setbacks, no coverage limit, 7,000 sq ft of lot. The exception is height, and it is the
      one that binds - 25 ft measured from the Oswego Lake surface elevation, against a 26 ft
      pod. A lot in this zone screens RED on height while clearing everything else, which is
      the right answer and would have been invisible while the zone was missing. Note 5 also
      states 27 ft for any portion of the lot at or below the lake surface; that half is not
      encoded, because it needs the lake surface elevation cut against the parcel and the
      difference between the two halves is the difference between RED and GREEN.'
