label: Lake Oswego
kind: city
eligible: false
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  SIX ZONES ADDED 2026-08-21. The port brought over four residential zones — R-0, R-3, R-5 and
  R-7.5 — and the citywide use table permits a quadplex by right in ten. R-15, R-10, R-6, R-DD,
  R-W and R-2 were not in the funnel at all. Nothing reported it: the coverage ledger finds zones
  that are missing a required field, and a zone nobody encoded has no fields to be missing, so a
  gap in the LIST of zones is a shape no ledger here was looking for. It surfaced sideways —
  every one of this layer''s unread notes turned out to govern a region no encoded value quoted,
  which is what a layer looks like when the tables it is missing are the tables the notes belong
  to.


  The six were read off the same four tables the ported four came from, one column over:
  50.04.001-1 and -2 for R-15 and R-10, -3, -5 and -8 for R-6, -3 and -9 for R-DD, -11 for R-W,
  and -11, -12 and -13 for R-2. R-W is the one that changes an answer rather than adding one: its
  height is not measured from the ground at all but from the Oswego Lake surface elevation, and
  the 25 ft it allows is under the 26 ft the pod stands, so a lot there is RED on height while
  clearing every other standard in the zone. `flats/tests/test_lake_oswego_zones.py` now reads
  the use table and requires a zone for each column the pod is permitted in, which is the check
  that would have caught this.


  STILL MISSING, and recorded here so it is not found sideways a second time: the same use table
  has a second half, sixteen commercial, mixed use and industrial columns beginning at L557, and
  its first residential row — "Residential use at R-5 density or greater", L617 — is P in eleven
  of them. None of those zones are encoded. That is a bigger read than this one (Table
  50.04.001-14 alone carries nineteen notes, and WLG and EC have tables of their own), and it is
  the reason every one of this layer''s thirty-three remaining unread notes governs a region
  nothing quotes.'
ingest:
  geoid: null
  juris_city_codes:
  - LAKE OSWEGO
  zoning_layer: zoning_lake_oswego
  zone_field: LAYER
  strip_lowercase_suffix: false
crossrefs:
  "50.02.002.2": >-
    How a lot with two zonings is read: "If lot has multiple zones, e.g., R-0/EC, see LOC
    50.02.002.2.e", footnote 3 under the use table, repeated in seven of its rows. It ranked
    binding because the footnote hangs off the row that says whether a fourplex is allowed, and
    that is exactly what a split zoning puts in doubt. It is ruled rather than fetched because
    this screen does not answer the question either way: quadfit carries a `split_zone` column and
    a lot with more than one zoning is taken out before it is measured, in every jurisdiction, on
    the ground that a screen cannot say which half a building lands on. So the section states how
    a city resolves a case this system declines. Lake Oswego is `eligible: false` besides, by the
    owner's decision, and its rows are carried here for reference only.
  "46A":
    outcome: read
    note: >-
      The citing line states what the section holds: "Height Limitation: see Charter Section 46A
      for 50 ft. Maximum Height of Structures in Residential Areas." A city charter ceiling of 50
      ft, quoted in four of the dimensional table's cross-reference blocks. The pod is 26 ft, and
      every Lake Oswego height standard already encoded caps lower than the charter does.
  "50.04.003.4":
    outcome: narrows_only
    note: >-
      "General Exception to Structure Height Limitations", cited in the same blocks as the charter
      reference and again in two table footnotes that call it "maximum height exception". A
      section granting exceptions to a height limit can only let a building stand taller than the
      table allows, so reading it could only admit lots this screen already rejects on height.
  "50.04.003.10":
    outcome: narrows_only
    note: >-
      "Exceptions to the Minimum Density Requirement for All Zones", cited by the minimum-density
      sentence in the R-2/R-0 and R-5/R-6 blocks. It relieves a floor, and a floor relieved can
      only admit.
  "50.03.003.2":
    outcome: other_building
    note: >-
      "Conditional Use Standards for Residential Uses - Group and Institutional Housing." Both
      mentions are conditional-use cross-references printed under the R-2/R-6 dimensional block.
      Group and institutional housing is not a four-unit attached dwelling, and the companion
      reference beside it, 50.03.003.1.b, is the conditional list for those same zones.
  "50.06.001.5":
    outcome: fetch
    note: >-
      LOC 50.06.001.5.b is cited as a Height Limitation "for non-single-family dwellings" in five
      of the dimensional table's cross-reference blocks, including the WLG and EC zones. The pod
      is a non-single-family dwelling and the encoded Lake Oswego heights leave two to four feet
      of slack over 26 ft, so a design-chapter qualifier on height is exactly the Gresham 7.0420
      shape. Chapter 50.06 is not held.

code:
  # The city left Code Publishing for General Code's eCode360 (code LA4508);
  # the old codepublishing.com index is a 272-character redirect notice. The
  # reader-facing pages are a JavaScript shell, but /print/<code>?guid=<node>
  # returns the node and its children as server-rendered HTML. guid 43076426
  # is article LOC 50.04 (Dimensional Standards, incl. Table 50.04.001-11);
  # guid 43076334 is section 50.03.002 (Use Table).
  - id: "50.04.dimensional"
    url: https://ecode360.com/print/LA4508?guid=43076426
    title: "LOC 50.04 - Dimensional Standards"
  - id: "50.03.002.use-table"
    url: https://ecode360.com/print/LA4508?guid=43076334
    title: "LOC 50.03.002 - Use Table"
    # A use table is P/C marks, not dimensions; the plausibility gate reads
    # that as thin. Read 2026-08-13: it is the real section.
    allow_thin: true
zones:
  R-0:
    section: ["50.04.", "50.03.002"]
    cite_default:
      cite: LOC 50.04.001.3 Table 50.04.001-11; LOC 50.03.002 Table 50.03.002-1
      url: https://ecode360.com/43076426
      retrieved: '2026-07-28'
    quadplex_allowed:
      value: true
      quote: "or/clackamas/lake-oswego/50.03.002.use-table.txt#L193"
    max_height_ft:
      # Table 50.04.001-11, "MAX. BASE HEIGHT (FT.)", the R-0 column of the Flat Lot
      # row: 28 ft. The table prints one cell per line, so the row label is
      # quoted with the cell and position is what names the column
      # -- R-W, R-3, R-2, R-0.
      #
      # The Flat Lot row is the one encoded. The two rows under it are not
      # looser numbers for the same measure, they are different measures:
      # "Lot with Sloping Topography" sets a flat plane 28 ft above the
      # highest natural grade and lets the building reach 32 where the ground
      # falls away, and "Footprint, Sloped" is 35. Both need a
      # topography this screen does not read, and the flat-lot 28 is what a
      # lot is held to until someone reads it.
      #
      # Two feet of margin on a 26 ft pod -- the tightest any standard in this
      # corpus leaves it, and the reason this number is worth carrying rather
      # than assuming.
      value: 28
      cite: LOC 50.04.001.3 Table 50.04.001-11; 50.04.001.3.f
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1418,L1423"
    max_density_du_per_acre:
      # Table 50.04.001-11 note 3: middle housing is exempt from maximum
      # density. The table's Maximum row reads [3] for R-3 and an em dash for
      # R-0, so there is no ceiling printed for either.
      exempt: true
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1454-L1455"
    setback_front_ft:
      value: 10
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1344"
    setback_side_ft:
      value: 10
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1351"
    setback_rear_ft:
      value: 10
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1357"
    setback_street_side_ft:
      value: 10
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1351"
    min_lot_sqft:
      value: 7000
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1253"
      variants:
        - value: 1500
          when: [unit_lots]
          quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1261"
    max_coverage_pct:
      value: 55
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1306"
    notes: "Read against LOC Table 50.04.001-11 on 2026-08-14: the quadplex minimum lot area (7,000, L1253, the \"Cottage Clusters and Quadplexes\" row), lot coverage (55, L1306) and the front (10, L1344) and rear (10, L1357) setbacks under the table's \"Primary Dwelling (Attached)\" block, which is the pod's block — the \"(Detached)\" block above it states 20/5/20 and is not this building. Note [6] on the R-0 column reads \"Site-specific dimensional standards, see LOC 50.02.002.2.c\", so every standard here is subject to a per-parcel check. Side and street side read 2026-08-15. The R-0 column of the attached block's Side row states one number, 10 (L1351) — the two-number exterior/attached-wall form appears only in the R-3 column beside it, so R-0 has no variant to lose. The attached block prints no street-side row at all, so the side standard governs it; the detached block above states 10 for the same zone (L1324), so the number is 10 under either reading and the citation is the side cell that actually governs. quadfit confidence: verified | Attached-dwelling setbacks (detached SFD is 20/5/20). Quadplex min lot 7,000 sf. R-0 carries site-specific limitations per LOC 50.02.002.2.c — per-parcel check flagged."
  R-2:
