    max_coverage_pct:
      # Table 50.04.001-9, three rows of one column, and the pod's row is
      # "Middle Housing" -- 45 percent. Oregon defines middle housing to
      # include a quadplex (ORS 197.758), and the table's other two rows are
      # single-family detached and multi-family, neither of which this is.
      value: 45
      cite: LOC 50.04.001.2.f.iii Table 50.04.001-9
      quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1066,L1068"
    notes: 'Encoded 2026-08-21, from the gap the use table exposed. R-DD is the downtown design
      district and the only residential zone in the city with no setback table of its own: LOC
      50.04.001.2.e.iii states one ten-foot setback for the whole zone, which is what all four
      setback fields carry. The street-side figure is a floor, not a ceiling - the code adds
      "or such greater distance required to accommodate off-street parking" without stating how
      much more, so a lot that clears 10 ft here has not necessarily cleared the standard. That
      is an unencoded condition and it is recorded rather than guessed at. Table 50.04.001-3
      prints R-DD''s primary structure height as one figure, 28 ft, with em dashes in the three
      rows the other two columns split it across. READ AND NOT ENCODED: 50.04.001.2.b allows a
      25 percent density bonus for public agency rental housing, elective and loosening;
      50.04.001.2.g.iv(1) raises average height to 40 ft on half-acre constrained sites, which
      loosens; 50.04.001.2.e.iii(2) requires a five-foot landscaped buffer where R-DD abuts EC
      or R-0/EC, which needs the neighbour''s zoning; the Durham Street exception at
      50.04.001.2.e.iii(1)(b)(i) reduces the front setback to three ft on a named street.'
