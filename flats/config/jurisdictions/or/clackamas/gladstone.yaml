label: Gladstone
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  READ AND NOT ENCODED (1) GMC 17.62.070(4), the loudest unfetched reference in the county at ten
  mentions, all ten of them binding. It is one sentence, printed once and spanned by rowspan over
  every setback row of both dimensional tables: "setbacks for manufactured homes in a mobile home
  park are subject to the standards in GMC Section 17.62.070(4)." A mobile home park is a use this
  screen does not place — the pod is factory-built but it is not a manufactured dwelling on a rented
  space — so the sentence names a building and a tenure that are both somebody else''s, and the
  chapter is not fetched.


  (2) SUPERSEDED, and worth leaving legible. This slot used to hold a reason for not fetching GMC
  Chapter 17.48: the state caps middle-housing parking at one space per unit, so the chapter "can
  only bind at or below the figure already screened against". Every word of that is about HOW MANY.
  A parking chapter also says how big a stall is, how wide the drive between two rows of them has to
  be, and how far back from the property line the first one may sit, and none of those is capped by
  anything. The chapter was fetched and read on 2026-08-29 and it is now the source of seven values in
  `defaults`, including the widest stall in this corpus. The refusals it produced are recorded there
  rather than here, beside the numbers they sit next to.'
ingest:
  geoid: null
  juris_city_codes:
  - GLADSTONE
  zoning_layer: zoning_gladstone
  zone_field: ZONE
  strip_lowercase_suffix: false
definitions:
  # "'Corner lot' means the total area of a lot abutting on two or more streets,
  # other than an alley, at their intersection."
  #
  # Two or more, so `count: 2` is a floor and not a target. Alleys are named out,
  # and the streets have to meet — "at their intersection" is the same clause
  # Milwaukie, Tualatin and Oregon City write, and like them Gladstone states no
  # angle at which the meeting stops counting.
  corner_lot:
    test: intersecting_frontages
    count: 2
    quote: "or/clackamas/gladstone/17.06.definitions.txt#L841"
    cite: "Gladstone Municipal Code 17.06.270, Lot, corner"

crossrefs:
  "17.38":
    outcome: other_path
    note: >-
      Planned Unit Development. Two of the three mentions open a zone's dimensional standards --
      "Except as provided in GMC Chapters 17.38 (Planned Unit Development), 17.72 (Variances) and
      17.76 (Exceptions), the following dimensional standards shall apply" -- so it stands in the
      same sentence as the setbacks and lot area this screen reads, which is why it ranked binding
      beside a minimum lot area. It is the exception clause, and every limb of it RELAXES: a PUD,
      a variance and an exception are three ways of being let off a standard. Reading it could
      admit lots this screen rejects and can never reject one it admits, which is `narrows_only`
      pointing the other way. 17.72 is already ruled here on that reasoning. The third mention
      settles it further: 17.06's definition of a residential PUD requires "at least 80,000 square
      feet in any zoning district", and anything smaller "must be approved by Planning Commission
      per GMC 17.38.020". A discretionary approval on a two-acre assembly is not a by-right screen.
  "17.70":
    outcome: other_path
    note: >-
      Conditional Uses. Every mention is the header of a zone's conditional list — "the following
      uses and their accessory uses are allowed subject to GMC Chapter 17.70" — and a fourplex is
      not on any of them. What is on the R-7.2 list is a "multi-household dwelling, five- to
      eight-unit building on a collector or minor arterial", beside churches, fire stations and
      nursing homes. Four units is one below the bottom of that range.
  "17.62.070": >-
    Setbacks for manufactured homes in a mobile home park. One sentence, printed once in each
    dimensional table and spanned by rowspan over every setback row, which is why it counts ten
    times. The pod is factory-built and is neither a manufactured dwelling nor sited on a rented
    space in a park, so the standard is about somebody else's building and 17.62 is not fetched.
  # A ruling on "17.48" used to stand here and the ledger now calls it stale, which is the right
  # answer: the chapter is fetched, so nothing points at an unfetched 17.48 any more. What it said
  # -- that the state cap on middle-housing parking disposed of the reference -- is an argument
  # about how many spaces and it answered nothing the geometry asks. The reading that replaced it
  # is in `defaults`, beside the numbers it produced.
  "17.80":
    outcome: procedure
    note: >-
      Design Review, named in the opening sentence of both 17.48.030 and 17.48.040. It is the
      process a development goes through, not a dimension it has to meet, and the reading of which
      developments those sections reach is recorded in `defaults` rather than settled by fetching a
      procedure chapter. Nothing in 17.80 could add a number to a stall.
  "17.80.090":
    outcome: procedure
    note: >-
      Minor exception, the other half of 17.48.030(2)(e) and the only binding reference the parking
      chapter opened: an exception to a minimum or maximum parking ratio of 25 percent or less is
      granted through it, anything larger through the variance chapter. It stands beside the
      parking minimum and maximum because it can move both, and it moves them for an applicant who
      asks -- which is a thing a person does at a counter, not a thing a parcel is. A screen that
      granted itself exceptions would be reporting what could be argued for rather than what the
      code says.
  "17.52.060":
    outcome: procedure
    note: >-
      On-site traffic control sign standards, reached from 17.48.050(2)(c): a bicycle parking area
      not visible from the street needs a sign conforming to them. A specification for a sign, and
      the bicycle standards it hangs off are themselves refused in `defaults` for want of a field.
  "17.72":
    outcome: procedure
    note: >-
      Variances, reached from 17.48.030(2)(e): an exception to a minimum or maximum parking ratio
      above 25 percent goes through this chapter, below it through the minor exception at
      17.80.090. Both are ways of asking to be let off a standard this screen holds the applicant
      to, so neither can make a lot fit that does not.
  "17.54":
    outcome: narrows_only
    note: >-
      Clear Vision, reached from 17.48.040(1)(b): screening between a parking area and an abutting
      residential property "shall not conflict with GMC Chapter 17.54". A ceiling on how tall a
      hedge may be near a corner, which cannot take ground from a rear court -- the screen it
      qualifies is itself a fence or a hedge and this model gives it no width.
  "17.50.020":
    outcome: other_building
    note: >-
      Pedestrian circulation, reached from 17.48.030(1)(i): a development with more than half an
      acre of new off-street surface parking must file a circulation plan, a tree canopy plan and a
      climate mitigation action. The pod's whole court is four stalls and their aisle, around two
      thousand square feet, so the threshold is an order of magnitude away from this building.
  "3.14":
    outcome: other_building
    note: >-
      Commercial parking lots, reached from 17.48.030(1)(m). A lot operated as a parking business,
      which is a use, not a residential court serving the dwellings on its own lot.
  "17.94.060":
    outcome: other_path
    note: >-
      Reached from 17.48.030(1)(j), the review path for converting an existing underused parking
      area to another use. It runs the other way from this screen, which places new buildings on
      lots rather than repurposing parking already built.

code:
  # Code Publishing serves each chapter as its own server-rendered HTML page;
  # no slicing needed. The host refuses newer Chrome fingerprints — fetch
  # escalates to chrome124 automatically. R-10 has no chapter of its own
  # (Title 17 defines only R-7.2 and R-5); its standards mirror 17.10.
  - id: "17.06.definitions"
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1706.html
    title: "Chapter 17.06 - Definitions"
    # A chapter about words: 1,500 lines of prose and barely a dimension in it,
    # which the thinness guard reads as a landing page. Read 2026-08-18; it
    # carries the lot-type definitions, including 17.06.270 Lot, corner.
    allow_thin: true
  - id: "17.10.r-7.2"
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1710.html
    title: "Chapter 17.10 - Low Density Residential District (R-7.2)"
  - id: "17.12.r-5"
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1712.html
    title: "Chapter 17.12 - Medium Density Residential District (R-5)"
  # The chapter both dimensional tables point at and nothing else in this
  # layer states: "Off-Street Parking -- See GMC Chapter 17.48, Off-Street
  # Parking and Loading", printed twice in each table with no figure beside
  # it. 2,371 lots here fit the pod and none is drawn on.
  - id: "17.48.parking"
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1748.html
    title: "Chapter 17.48 - Off-Street Parking and Loading"
defaults:
  # ---- GMC Chapter 17.48, Off-Street Parking and Loading, read 2026-08-29 ----
  #
  # A city that requires almost no parking and regulates all of it. 17.48.010 is
  # headed Applicability and opens "Off-street parking and loading standards
  # shall apply to all development permits, except:", and the exception is not
  # to the standards but to the mandate: parking "is not required within" the
  # Town Center boundary, a quarter mile of it, or half a mile of McLoughlin
  # Boulevard. Then (3) states the split in the code's own words -- "Parking may
  # be provided at the discretion of the property owner within the mandate
  # exception areas ... Any off-street parking provided within these and other
  # areas within the city must meet the standards of this chapter."
  # (or/clackamas/gladstone/17.48.parking.txt#L19,L21,L23-L29,L33)
  #
  # WHICH SECTION REACHES THIS BUILDING is the question that decides the city,
  # the way 8.120.C.1.b.ii decided Troutdale. 17.48.030 is headed "Standards for
  # developments subject to design review" and 17.48.040 opens "All structures
  # and developments subject to design review shall provide required permanent
  # off-street parking and loading as follows". Between them sits 17.48.020,
  # headed "Single-household and middle housing residential standards", a
  # one-sentence bridge sending middle housing to 17.48.030 by name for the
  # QUANTITY -- with no matching sentence for 17.48.040's dimensions.
  #
  # The chapter's own applicability section is broader than either, and it is
  # the encoding: the standards apply to all development permits, and anything
  # built anywhere in the city must meet the standards of this chapter. It is
  # also the safe reading in both directions. A stall drawn to 17.48.040 is the
  # largest rectangle in this corpus, so a lot that fits one could not fail a
  # looser rule; and the alternative is no geometry at all, which leaves 2,371
  # pod-fitting lots undrawable and stuck at REVIEW.
  # (or/clackamas/gladstone/17.48.parking.txt#L39,L41,L47,L49,L444,L446)
  #
  # The pod is middle housing here without argument. 17.06.149: "'Middle
  # housing' means duplex, triplex, quadplex, cottage cluster, or townhouse in
  # the R-5 or R-7.2 zone", and 17.06.145 defines a quadplex as "four attached
  # or detached dwelling units on a single lot in any configuration". Both zones
  # this layer holds are named in the definition, so the bridge in 17.48.020
  # reaches this building and Table 1 names it again in its own row.
  # (or/clackamas/gladstone/17.06.definitions.txt#L587,L589,L611,L613)
  #
  # NOT ENCODED: the parking mandate exception. 17.48.010(1) waives the
  # requirement entirely inside the Town Center boundary, within a quarter mile
  # of it, and within half a mile of McLoughlin Boulevard, "measured using a
  # straight line" off the Gladstone Parking Mandate Exception Map. Table 1's
  # own Zone A column agrees -- "Min: None / Max: None" against the row this
  # building takes. No parcel record here carries a distance to a boundary or a
  # corridor, so every Gladstone lot is screened against the outside-Zone-A
  # figure. Conservative, and on the lots it is wrong about it charges the pod
  # four stalls it does not owe. Same shape as Troutdale's CFEC waiver.
  # (or/clackamas/gladstone/17.48.parking.txt#L23-L31,L159,L171,L174-L175)
  parking_min_per_unit:
    value: 1
    cite: GMC 17.48.030 Table 1(1)(b), Duplex, Triplex, Quadplex, Townhouse, Cottage
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1748.html
    retrieved: '2026-08-29'
    quote: "or/clackamas/gladstone/17.48.parking.txt#L141,L156,L158,L171-L173"
  # And no ceiling. The maximum machinery in this chapter is fully built --
  # 17.48.030(2)(b) splits the city into Zone A and Zone B for the purpose,
  # (2)(c) lists five kinds of space exempt from the maxima, (2)(d) governs what
  # happens when an existing development already exceeds one, and (2)(e) gives a
  # variance path out of one -- and then Table 1 prints "Max: None" for this row
  # in Zone A and "Not Applicable" for it in Zone B. A column that was read and
  # left empty on purpose, so `exempt` rather than absence: a maximum has to
  # beat the broader layers rather than fall through them.
  # (or/clackamas/gladstone/17.48.parking.txt#L119,L121-L131,L133-L139)
  parking_max_per_unit:
    exempt: true
    cite: GMC 17.48.030 Table 1(1)(b), Zone A and Zone B maximum columns
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1748.html
    retrieved: '2026-08-29'
    quote: "or/clackamas/gladstone/17.48.parking.txt#L141,L156,L159-L160,L171-L172,L174-L176"
  # HOW BIG. 17.48.040(2)(f) sends every parking space and access aisle to the
  # chapter's dimension tables, and the 90-degree row of the standard table
  # reads 9.5 by 18.0 with a 24.0 aisle.
  #
  # NINE AND A HALF FEET IS THE WIDEST STALL IN THIS CORPUS. Fairview, Happy
  # Valley, Oregon City, West Linn and Troutdale all ask 9; Gresham and Portland
  # ask 8.5. Four of them across a rear court is two feet of lot width nobody
  # else charges. The aisle ties Fairview at 24 -- one figure, not split by
  # direction, so a one-way court is dimensioned off it too, and 18 + 24 + 18 is
  # a 60-foot court before a driveway reaches it.
  #
  # The table has no number of its own: both tables are captioned "17.48.040
  # Table" with the name on the next line, while (2)(f) calls them "Tables 2 and
  # 3". Standard is 2 and compact is 3 in the only order they appear, and the
  # chapter has exactly one other table, Table 1, which is numbered.
  #
  # NOT ENCODED: 17.48.040(2)(g), "up to 50 percent of required parking spaces
  # may be provided for compact cars", and the compact table's 8.5 by 16 that
  # goes with it. A loosening elected on a plan rather than read off a parcel,
  # and the same cut Fairview, Gresham and Troutdale take.
  parking_stall_width_ft:
    value: 9.5
    cite: GMC 17.48.040, Standard Parking Dimensions in Feet, 90 degrees
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1748.html
    retrieved: '2026-08-29'
    quote: "or/clackamas/gladstone/17.48.parking.txt#L444,L446,L468,L484-L485,L488"
  parking_stall_depth_ft:
    value: 18
    cite: GMC 17.48.040, Standard Parking Dimensions in Feet, 90 degrees
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1748.html
    retrieved: '2026-08-29'
    quote: "or/clackamas/gladstone/17.48.parking.txt#L444,L446,L468,L484-L485,L488"
  parking_aisle_one_way_ft:
    value: 24
    cite: GMC 17.48.040, Standard Parking Dimensions in Feet, 90 degrees, aisle width
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1748.html
    retrieved: '2026-08-29'
    quote: "or/clackamas/gladstone/17.48.parking.txt#L444,L446,L468,L484-L485,L488"
  parking_aisle_two_way_ft:
    value: 24
    cite: GMC 17.48.040, Standard Parking Dimensions in Feet, 90 degrees, aisle width
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1748.html
    retrieved: '2026-08-29'
    quote: "or/clackamas/gladstone/17.48.parking.txt#L444,L446,L468,L484-L485,L488"
  # WHERE IT MAY SIT. 17.48.040(2)(e): "Parking spaces along the outer
  # boundaries of a parking lot shall be contained by a curb at least four
  # inches high and set back a minimum of five feet from the property line."
  # Five feet of real ground off the line, and unlike Happy Valley's or
  # Portland's it is not a street-only rule -- it says property line and means
  # every one of them.
  #
  # NOT ENCODED: the side and rear halves of that same sentence. This model has
  # one parking setback field and it is measured from a street lot line; nothing
  # holds a parking setback from an interior or rear line. Inert here, and
  # stated so it stays inert on purpose: R-7.2 asks 7.5 feet of side yard and 15
  # of rear, R-5 asks 5 and 15, and every one of those is already larger than
  # the five feet the curb owes. If a Gladstone zone ever carries a side setback
  # under five, this refusal starts costing something.
  # (or/clackamas/gladstone/17.48.parking.txt#L456,L466)
  parking_street_setback_ft:
    value: 5
    cite: GMC 17.48.040(2)(e), parking spaces set back five feet from the property line
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1748.html
    retrieved: '2026-08-29'
    quote: "or/clackamas/gladstone/17.48.parking.txt#L444,L446,L456,L466"
  # NO DRIVEWAY WIDTH, and read rather than unlooked-for. Chapter 17.48 states
  # every dimension of a parking space and none of a driveway: the word appears
  # five times in the chapter and each is about something else -- a half-acre
  # tree canopy plan, a school's passenger loading lane, or the sentence below.
  # Neither dimensional chapter states one either. So a pod here is drawn with
  # the design lane, and no curb-cut ceiling narrows it.
  #
  # NOT ENCODED: 17.48.040(2)(d), "groups of more than four parking spaces shall
  # be ... served by driveways that their use will require no backing movements
  # or other maneuvering within a street right-of-way other than an alley". The
  # forward-access rule Gresham writes for everybody, and it stops one stall
  # short of this building: the pod owes exactly four spaces and four is not
  # more than four. It binds the moment a plan seats a fifth, which the
  # marketability tiers reach at 1.5 per unit -- so the site plan draws a rear
  # court with forward egress here anyway, and the standard is satisfied by a
  # layout chosen for other reasons rather than by a rule this layer holds.
  #
  # NOT ENCODED, three loosenings that all move the same way: 17.48.030(1)(f)
  # credits on-street parking against the requirement where 22 feet of
  # uninterrupted curb fronts the site; (1)(o) reduces the mandate by a space
  # per three kilowatts of solar, per car-share stall, per two EV chargers and
  # per two accessible units, "cumulative and not capped"; and (1)(h) allows the
  # required spaces to sit on another parcel within 2,000 feet walking distance.
  # Each subtracts from a requirement this screen already satisfies on site, and
  # none can make a lot that does not fit fit.
  #
  # NOT ENCODED: 17.48.050, bicycle parking, and it does reach this building --
  # by a parenthetical that overrides a definition. The standards apply to
  # "multi-household residential (four units and larger)", and 17.06.141 defines
  # a multi-household dwelling as "a building, designed for occupancy by five or
  # more households". Four is not five or more, so the noun excludes the pod and
  # the parenthetical after it puts the pod back; 17.48.050(1)(c)(C) says "four
  # units and more" a second time, so the four is meant. Two long-term spaces,
  # each six feet by two, with a five-foot maneuvering aisle. No field in this
  # model holds a bicycle space, and the code lets every one of them sit inside
  # the building, under an overhang or in a locker, so nothing is subtracted
  # from the court by refusing it.
  #
  # That same definition is why the pod takes Table 1 row (b) and not row (c):
  # "Duplex, Triplex, Quadplex, Townhouse, Cottage" names it, and
  # "Multi-Household Dwelling" starts one unit above it. Troutdale settled the
  # same word the same way two days ago, off a definition worded almost
  # identically. Both rows ask one space per unit here, so nothing turns on it
  # for the count -- but the bicycle section is the place where it would have.
  # (or/clackamas/gladstone/17.06.definitions.txt#L557,L559)
  #
  # NOT ENCODED: 17.48.040(1)(b), screening between the court and an abutting
  # residential property -- six feet of "building placement, a landscaped earth
  # berm or a sight-obscuring fence or hedge". A performance standard with three
  # alternatives, one of which is the building itself, and the model gives a
  # fence no width.
  # (or/clackamas/gladstone/17.48.parking.txt#L452,L464,L63,L67,L105-L113)
zones:
  R7.2:
    max_density_du_per_acre:
      # GMC 17.10.030, Maximum Density. The rows are by housing type and the
      # one against "Middle housing" prints None. That also disposes of the
      # minimum: the chapter asks subdivisions and PUDs for eighty percent of
      # the maximum density per net acre, and eighty percent of a ceiling the
      # code does not state has no operand. The other minimum-density sentence
      # in the chapter is the cottage cluster's four units per acre, a housing
      # type this screen does not place.
      #
      # R-5 gets no such value: chapter 17.12 prints no maximum density row at
      # all, and borrowing this one across chapters would be citing a sentence
      # about another district.
      exempt: true
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L209,L213-L214"
    max_units:
      # The same block: "this code does not allow for the creation of more
      # than four dwelling units on a lot, including accessory dwelling units.
      # Cottage clusters and townhomes are exempt." The pod is four units with
      # no ADU, so it sits exactly on the ceiling.
      value: 4
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L209,L212"
      variants:
        # "Townhomes are exempt", and the split plat is the townhouse path.
        - exempt: true
          when: [unit_lots]
          quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L209,L212"
    section: ["17.10."]
    cite_default:
      cite: Gladstone Municipal Code 17.10.020 (middle housing allowed outright), 17.10.050 (dimensional
        standards), 17.10.065 (garage setback)
      url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1710.html
      retrieved: '2026-07-28'
    quadplex_allowed:
      # GMC 17.10.020, "Uses allowed outright": "(1) Single-household dwelling
      # ... (2) Middle housing." Middle housing is the statutory class -- ORS
      # 197A.420 and OAR 660-046 -- and a quadplex is in it. The city states no
      # list of its own, so the class is the whole of the answer.
      value: true
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L33-L39"
    setback_front_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L169"
    setback_side_ft:
      # GMC 17.10.050 prints two side rows and no housing type against either:
      # "Side setback | 7.5 ft or 5 ft due to irregular shaped lots", and two
      # rows below it "Interior side setback | 5 ft". Chapter 17.12 prints one
      # side row of 5 ft for R-5, which reads like the middle-housing
      # amendment restating the side yard once and 17.10 keeping both. Nothing
      # on the page says that, and where two rows of one table both reach this
      # building the larger of them binds — so 7.5 is the encoding, 5 is the
      # reading a signature may settle it to, and the file was carrying 5
      # against the interior row with no note that the other row existed. The
      # irregular-lot relief in the same cell is unmeasured and only loosens.
      value: 7.5
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L175-L176"
      variants:
        # The third column spans all five setback rows, and one of its five
        # sentences is a zero: "townhouse projects are allowed a zero-foot
        # side setback for lot lines where townhouse units are attached."
        # Both halves are conditions — the project has to be the townhouse
        # path, and the line has to be one a party wall stands on. Neither is
        # set today, so screening uses 7.5.
        - value: 0
          when: [attached_wall, unit_lots]
          quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L179"
    setback_rear_ft:
      value: 15
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L197"
    setback_street_side_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L183"
    min_lot_sqft:
      value: 3600
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L161"
    notes: 'quadfit confidence: needs_verification | GIS literal ''R7.2'' (code writes ''R-7.2''). Height
      35 ft. NO max lot coverage, NO min lot width in code. Middle housing (incl. quadplex) permitted
      outright. min_lot is the middle-housing minimum (17.10.050); the detached-SFD row is 7,200. Street-side setback read via mirror; confirm 17.10.050.


