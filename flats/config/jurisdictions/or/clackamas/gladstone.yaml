label: Gladstone
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  READ AND NOT ENCODED (1) GMC 17.62.070(4), the loudest unfetched reference in the county at ten
  mentions, all ten of them binding. It is one sentence, printed once and spanned by rowspan over
  every setback row of both dimensional tables: "setbacks for manufactured homes in a mobile home
  park are subject to the standards in GMC Section 17.62.070(4)." A mobile home park is a use this
  screen does not place — the pod is factory-built but it is not a manufactured dwelling on a rented
  space — so the sentence names a building and a tenure that are both somebody else''s, and the
  chapter is not fetched.


  (2) GMC Chapter 17.48, Off-Street Parking and Loading, which both dimensional tables point at
  without stating a number. Nothing is lost by not holding it: OAR 660-046-0220(2)(e)(B)(iv) caps
  what any Oregon city may require of middle housing at one space per unit and the state layer
  carries that as `preempts: cap`, so 17.48 can only bind at or below the figure already screened
  against. Worth fetching the day this corpus screens a use the middle-housing rules do not reach.'
ingest:
  geoid: null
  juris_city_codes:
  - GLADSTONE
  zoning_layer: zoning_gladstone
  zone_field: ZONE
  strip_lowercase_suffix: false
definitions:
  # "'Corner lot' means the total area of a lot abutting on two or more streets,
  # other than an alley, at their intersection."
  #
  # Two or more, so `count: 2` is a floor and not a target. Alleys are named out,
  # and the streets have to meet — "at their intersection" is the same clause
  # Milwaukie, Tualatin and Oregon City write, and like them Gladstone states no
  # angle at which the meeting stops counting.
  corner_lot:
    test: intersecting_frontages
    count: 2
    quote: "or/clackamas/gladstone/17.06.definitions.txt#L841"
    cite: "Gladstone Municipal Code 17.06.270, Lot, corner"

crossrefs:
  "17.70":
    outcome: other_path
    note: >-
      Conditional Uses. Every mention is the header of a zone's conditional list — "the following
      uses and their accessory uses are allowed subject to GMC Chapter 17.70" — and a fourplex is
      not on any of them. What is on the R-7.2 list is a "multi-household dwelling, five- to
      eight-unit building on a collector or minor arterial", beside churches, fire stations and
      nursing homes. Four units is one below the bottom of that range.
  "17.62.070": >-
    Setbacks for manufactured homes in a mobile home park. One sentence, printed once in each
    dimensional table and spanned by rowspan over every setback row, which is why it counts ten
    times. The pod is factory-built and is neither a manufactured dwelling nor sited on a rented
    space in a park, so the standard is about somebody else's building and 17.62 is not fetched.
  "17.48": >-
    Off-street Parking and Loading, pointed at by both dimensional tables without a number beside
    it. OAR 660-046-0220(2)(e)(B)(iv) caps what any Oregon city may require of middle housing at one
    space per unit and the state layer carries that as `preempts: cap`, so this chapter can only
    bind at or below the figure already screened against. Worth fetching the day this corpus screens
    a use the middle-housing rules do not reach.

code:
  # Code Publishing serves each chapter as its own server-rendered HTML page;
  # no slicing needed. The host refuses newer Chrome fingerprints — fetch
  # escalates to chrome124 automatically. R-10 has no chapter of its own
  # (Title 17 defines only R-7.2 and R-5); its standards mirror 17.10.
  - id: "17.06.definitions"
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1706.html
    title: "Chapter 17.06 - Definitions"
    # A chapter about words: 1,500 lines of prose and barely a dimension in it,
    # which the thinness guard reads as a landing page. Read 2026-08-18; it
    # carries the lot-type definitions, including 17.06.270 Lot, corner.
    allow_thin: true
  - id: "17.10.r-7.2"
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1710.html
    title: "Chapter 17.10 - Low Density Residential District (R-7.2)"
  - id: "17.12.r-5"
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1712.html
    title: "Chapter 17.12 - Medium Density Residential District (R-5)"
zones:
  R7.2:
    max_density_du_per_acre:
      # GMC 17.10.030, Maximum Density. The rows are by housing type and the
      # one against "Middle housing" prints None. That also disposes of the
      # minimum: the chapter asks subdivisions and PUDs for eighty percent of
      # the maximum density per net acre, and eighty percent of a ceiling the
      # code does not state has no operand. The other minimum-density sentence
      # in the chapter is the cottage cluster's four units per acre, a housing
      # type this screen does not place.
      #
      # R-5 gets no such value: chapter 17.12 prints no maximum density row at
      # all, and borrowing this one across chapters would be citing a sentence
      # about another district.
      exempt: true
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L209,L213-L214"
    max_units:
      # The same block: "this code does not allow for the creation of more
      # than four dwelling units on a lot, including accessory dwelling units.
      # Cottage clusters and townhomes are exempt." The pod is four units with
      # no ADU, so it sits exactly on the ceiling.
      value: 4
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L209,L212"
      variants:
        # "Townhomes are exempt", and the split plat is the townhouse path.
        - exempt: true
          when: [unit_lots]
          quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L209,L212"
    section: ["17.10."]
    cite_default:
      cite: Gladstone Municipal Code 17.10.020 (middle housing allowed outright), 17.10.050 (dimensional
        standards), 17.10.065 (garage setback)
      url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1710.html
      retrieved: '2026-07-28'
    quadplex_allowed:
      # GMC 17.10.020, "Uses allowed outright": "(1) Single-household dwelling
      # ... (2) Middle housing." Middle housing is the statutory class -- ORS
      # 197A.420 and OAR 660-046 -- and a quadplex is in it. The city states no
      # list of its own, so the class is the whole of the answer.
      value: true
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L33-L39"
    setback_front_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L169"
    setback_side_ft:
      # GMC 17.10.050 prints two side rows and no housing type against either:
      # "Side setback | 7.5 ft or 5 ft due to irregular shaped lots", and two
      # rows below it "Interior side setback | 5 ft". Chapter 17.12 prints one
      # side row of 5 ft for R-5, which reads like the middle-housing
      # amendment restating the side yard once and 17.10 keeping both. Nothing
      # on the page says that, and where two rows of one table both reach this
      # building the larger of them binds — so 7.5 is the encoding, 5 is the
      # reading a signature may settle it to, and the file was carrying 5
      # against the interior row with no note that the other row existed. The
      # irregular-lot relief in the same cell is unmeasured and only loosens.
      value: 7.5
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L175-L176"
      variants:
        # The third column spans all five setback rows, and one of its five
        # sentences is a zero: "townhouse projects are allowed a zero-foot
        # side setback for lot lines where townhouse units are attached."
        # Both halves are conditions — the project has to be the townhouse
        # path, and the line has to be one a party wall stands on. Neither is
        # set today, so screening uses 7.5.
        - value: 0
          when: [attached_wall, unit_lots]
          quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L179"
    setback_rear_ft:
      value: 15
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L197"
    setback_street_side_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L183"
    min_lot_sqft:
      value: 3600
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L161"
    notes: 'quadfit confidence: needs_verification | GIS literal ''R7.2'' (code writes ''R-7.2''). Height
      35 ft. NO max lot coverage, NO min lot width in code. Middle housing (incl. quadplex) permitted
      outright. min_lot is the middle-housing minimum (17.10.050); the detached-SFD row is 7,200. Street-side setback read via mirror; confirm 17.10.050.


      OPEN QUESTION, and the one a signature should settle first: 17.10.050 prints a "Side setback"
      row of 7.5 ft and an "Interior side setback" row of 5 ft, with a "Street side setback" row of
      20 between them and no housing type against any of the three. R-5''s table prints one side row
      of 5. The file carried 5 against the interior row; it now carries 7.5, because two rows of one
      table that both reach this building leave the larger binding. Five feet of side yard either
      side is five feet of lot width — the pod is 56 ft across — so the reading is worth an hour of
      somebody''s time at the counter.'
    max_height_ft:
      value: 35
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L204"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L381"
  R5:
    section: ["17.12."]
    cite_default:
      cite: Gladstone Municipal Code 17.12.020 (middle housing allowed outright), 17.12.050 (dimensional
        standards), 17.12.065 (garage setback)
      url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1712.html
      retrieved: '2026-07-28'
    quadplex_allowed:
      # GMC 17.12.020, "Uses allowed outright": "(1) Single-household dwelling
      # ... (2) Middle housing." Middle housing is the statutory class -- ORS
      # 197A.420 and OAR 660-046 -- and a quadplex is in it. The city states no
      # list of its own, so the class is the whole of the answer.
      value: true
      quote: "or/clackamas/gladstone/17.12.r-5.txt#L31-L37"
    setback_front_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.12.r-5.txt#L182"
    setback_side_ft:
      # One side row here, unlike 17.10, and it is the smaller number.
      value: 5
      quote: "or/clackamas/gladstone/17.12.r-5.txt#L189-L190"
      variants:
        # Same footnote column, spanning all four setback rows of this table.
        - value: 0
          when: [attached_wall, unit_lots]
          quote: "or/clackamas/gladstone/17.12.r-5.txt#L193"
    setback_rear_ft:
      value: 15
      quote: "or/clackamas/gladstone/17.12.r-5.txt#L205"
    setback_street_side_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.12.r-5.txt#L197"
    min_lot_sqft:
      # GMC 17.12.050, Minimum Lot Area. The rows are by housing type and the
      # quadplex has one of its own — 7,000, against 5,000 for a detached
      # house and 5,000 for a duplex or triplex.
      value: 7000
      quote: "or/clackamas/gladstone/17.12.r-5.txt#L167-L168"
      variants:
        # The townhouse path is a different row and a smaller one, stated
        # twice: 5,000 sq ft for the project, and "the average minimum lot
        # area for a townhouse dwelling shall be 1,500 sf". Four dwellings
        # want 6,000 of that, which is the larger of the two and therefore the
        # one that binds. 17.12.050 prints 6,000 nowhere, so the file states
        # the 1,500 a reader will find and the multiplication is done in the
        # loader — the same bargain `per_dwelling` strikes on a base value.
        - per_dwelling: 1500
          when: [unit_lots]
          quote: "or/clackamas/gladstone/17.12.r-5.txt#L171-L173"
    notes: 'quadfit confidence: needs_verification | GIS literal ''R5'' (code writes ''R-5''). Height
      35 ft. NO max lot coverage, NO min lot width. Middle housing outright. min_lot is the quadplex
      row (17.12.050); detached is 5,000 and a townhouse project 5,000 with a 1,500 sq ft average per
      dwelling, encoded as the `unit_lots` variant. Street-side read via mirror; confirm 17.12.050.


      READ AND NOT ENCODED (1) Gladstone Town Center. 17.12.050 states a second figure inside it for
      three rows this screen uses — front setback 10 ft (L183) and street side 10 ft (L198) against
      20 outside it, and 2,500 sq ft of lot against 5,000 (L164), though that last row is the detached
      house and does not reach a quadplex. It is a boundary drawn inside the zone rather than a zone
      of its own, nothing here cuts it against a parcel, and both figures loosen — so the encoding is
      the outside-the-district half and lots inside the Town Center screen tighter than the code
      holds them.


      (2) No maximum-units ceiling. R-7.2''s table carries "this code does not allow for the creation
      of more than four dwelling units on a lot", and its wording ("this code") reads wider than its
      chapter — but it is printed in 17.10''s Maximum Density block and 17.12 prints no such block at
      all, so borrowing it here would cite another district''s table. R-10 borrows it because R-10
      has no chapter to borrow from; R-5 does.


      (3) Minimum Vegetation, 20 percent of the lot (L214-L217). The row is against "multi-household
      dwelling", and 17.12.040(1) sizes that use at "five to eight units on one parcel" (L129). A
      quadplex is middle housing and does not reach it.'
    max_height_ft:
      value: 35
      quote: "or/clackamas/gladstone/17.12.r-5.txt#L212"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.12.r-5.txt#L388"
  R10:
    max_density_du_per_acre:
      # GMC 17.10.030, Maximum Density. The rows are by housing type and the
      # one against "Middle housing" prints None. That also disposes of the
      # minimum: the chapter asks subdivisions and PUDs for eighty percent of
      # the maximum density per net acre, and eighty percent of a ceiling the
      # code does not state has no operand. The other minimum-density sentence
      # in the chapter is the cottage cluster's four units per acre, a housing
      # type this screen does not place.
      #
      # R-5 gets no such value: chapter 17.12 prints no maximum density row at
      # all, and borrowing this one across chapters would be citing a sentence
      # about another district.
      exempt: true
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L209,L213-L214"
    max_units:
      # The same block: "this code does not allow for the creation of more
      # than four dwelling units on a lot, including accessory dwelling units.
      # Cottage clusters and townhomes are exempt." The pod is four units with
      # no ADU, so it sits exactly on the ceiling.
      value: 4
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L209,L212"
      variants:
        # "Townhomes are exempt", and the split plat is the townhouse path.
        - exempt: true
          when: [unit_lots]
          quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L209,L212"
    section: ["17.10."]
    cite_default:
      cite: Gladstone MC Title 17 (no R-10 chapter; standards mirror R-7.2, the lowest-density defined
        SFD district)
      url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1710.html
      retrieved: '2026-07-28'
    quadplex_allowed:
      # There is no R-10 chapter in Title 17 -- this zone's block says so and
      # mirrors R-7.2, the lowest-density district Gladstone does define. The
      # use flag comes from R-7.2's sentence for the same reason its dimensions
      # do, and this quote is the honest version of that: GMC 17.10.020, not a
      # section that does not exist.
      value: true
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L33-L39"
    setback_front_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L169"
    setback_side_ft:
      # GMC 17.10.050 prints two side rows and no housing type against either:
      # "Side setback | 7.5 ft or 5 ft due to irregular shaped lots", and two
      # rows below it "Interior side setback | 5 ft". Chapter 17.12 prints one
      # side row of 5 ft for R-5, which reads like the middle-housing
      # amendment restating the side yard once and 17.10 keeping both. Nothing
      # on the page says that, and where two rows of one table both reach this
      # building the larger of them binds — so 7.5 is the encoding, 5 is the
      # reading a signature may settle it to, and the file was carrying 5
      # against the interior row with no note that the other row existed. The
      # irregular-lot relief in the same cell is unmeasured and only loosens.
      value: 7.5
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L175-L176"
      variants:
        # The third column spans all five setback rows, and one of its five
        # sentences is a zero: "townhouse projects are allowed a zero-foot
        # side setback for lot lines where townhouse units are attached."
        # Both halves are conditions — the project has to be the townhouse
        # path, and the line has to be one a party wall stands on. Neither is
        # set today, so screening uses 7.5.
        - value: 0
          when: [attached_wall, unit_lots]
          quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L179"
    setback_rear_ft:
      value: 15
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L197"
    setback_street_side_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L183"
    min_lot_sqft:
      value: 3600
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L161"
    notes: 'quadfit confidence: needs_verification | DISCREPANCY: Gladstone''s adopted code defines only
      R-7.2 and R-5 single-household districts — there is NO R-10 district in Title 17. Exactly one layer
      polygon carries ZONE=''R10''. SFD zone, so HB 2001 attaches. Standards are placeholders copied from
      R-7.2 pending verification, including the two-side-rows question R-7.2''s notes set out.'
    max_height_ft:
      value: 35
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L204"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L381"
