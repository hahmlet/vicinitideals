label: Gladstone
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.'
ingest:
  geoid: null
  juris_city_codes:
  - GLADSTONE
  zoning_layer: zoning_gladstone
  zone_field: ZONE
  strip_lowercase_suffix: false
code:
  # Code Publishing serves each chapter as its own server-rendered HTML page;
  # no slicing needed. The host refuses newer Chrome fingerprints — fetch
  # escalates to chrome124 automatically. R-10 has no chapter of its own
  # (Title 17 defines only R-7.2 and R-5); its standards mirror 17.10.
  - id: "17.10.r-7.2"
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1710.html
    title: "Chapter 17.10 - Low Density Residential District (R-7.2)"
  - id: "17.12.r-5"
    url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1712.html
    title: "Chapter 17.12 - Medium Density Residential District (R-5)"
zones:
  R7.2:
    section: ["17.10."]
    cite_default:
      cite: Gladstone Municipal Code 17.10.020 (middle housing allowed outright), 17.10.050 (dimensional
        standards), 17.10.065 (garage setback)
      url: https://www.codepublishing.com/OR/Gladstone/html/Gladstone17/Gladstone1710.html
      retrieved: '2026-07-28'
    quadplex_allowed:
      # GMC 17.10.020, "Uses allowed outright": "(1) Single-household dwelling
      # ... (2) Middle housing." Middle housing is the statutory class -- ORS
      # 197A.420 and OAR 660-046 -- and a quadplex is in it. The city states no
      # list of its own, so the class is the whole of the answer.
      value: true
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L33-L39"
    setback_front_ft:
      value: 20
      quote: "or/clackamas/gladstone/17.10.r-7.2.txt#L169"
    setback_side_ft:
