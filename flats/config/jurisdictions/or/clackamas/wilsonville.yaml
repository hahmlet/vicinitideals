  "4.planning.txt#4.610":
    queue: nofield
    outcome: other_stage
    note: >-
      "The site is at least 30,000 square feet" -- a threshold in the tree preservation or
      site-development provisions, above which a plan is required. A site more than three times
      the size of a lot holding one pod, and what it triggers is a submission rather than a
      standard.
