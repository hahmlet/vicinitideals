      the prose above them -- "as provided in Section 4.184" -- is the nearest thing to a heading
      the sectioning rule could find. The real home is Section 4.120, the Future Development
      Agricultural-Holding zone, which begins three hundred lines earlier at line 4279. Thirty
      thousand square feet of lot, thirty feet front and rear, ten feet side, and forty-five feet
