          quote: "or/clackamas/wilsonville/4.planning.txt#L3013"
        - value: 0
          when: [attached_wall]
          band: {measure: lot_sqft, more_than: 10000}
          quote: "or/clackamas/wilsonville/4.planning.txt#L3032"
        - value: 0
          when: [attached_wall]
          band: {measure: lot_sqft, at_most: 10000}
          quote: "or/clackamas/wilsonville/4.planning.txt#L3059-L3060"
    setback_rear_ft:
