      what is already there. This screen places a new building on a lot; it has no existing
      development to measure a 50 percent addition against.
    fingerprint: 0d459988ff658e78
  "4.planning.txt#4.514":
    queue: nofield
    outcome: other_building
    note: >-
      "Related uses, shall be set back a minimum of 75 feet upland from the top of each bank" -- a
      stream-bank setback in the Willamette River Greenway provisions. Corridor geometry measured
      from a water feature, the same 75 feet the SROZ card states, and held by the
      natural-resource overlay layer rather than by a yard field.
