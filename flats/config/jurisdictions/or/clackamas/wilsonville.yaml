label: Wilsonville
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  SETBACKS COME FROM LOT SIZE, NOT FROM THE ZONE. Section 4.113(.02) states one
  set of setbacks for residential development in any zone, and PDR Table 2''s
  Setbacks column says only "Per Section 4.113 (.02)" — so all nine zones carry
  the same banded encoding. Lots over 10,000 sq ft take 20/10/20; lots not
  exceeding 10,000 take 15/5/15, with the side and rear numbers rising to 7 and
  20 at two storeys or more. The split is exact: the ''over'' band excludes
  10,000 sq ft and the other includes it, so no lot sits in both or in neither.
  A pod is two storeys, so on a small lot it is bound by 15/7/20.


  NOT ENCODED: on a lot over 10,000 sq ft the corner-lot street side setback is
  20 percent of the lot width with a ten-foot floor (4.113(.02)A.2). That is a
  function of the lot, not a number, and setback_street_side_ft carries the
  ten-foot floor from the small-lot column (A.2/B.2) instead. Wide corner lots
  are therefore screened against a setback smaller than the code requires —
  worth a rule shape that can hold a percentage-of-width standard.


  ALSO NOT ENCODED: the key-lot front setback (half the sum of two neighbouring
  yards), the future-street reservation, and the cottage-cluster/ADU and
  attached-townhouse setback exceptions, none of which apply to a four-unit pod
  on its own lot.


  READ AND NOT ENCODED: Section 4.137.2''s Maximum Shade Point Height Standard
  would refuse this building outright wherever it reaches. Table 2 allows a
  shade point of 14 ft where the shade reduction line sits five feet off the
  northern lot line, and the pod is 26. It reaches only land inside the "S"
  (solar access) Overlay Zone, which 4.137(.01)B applies by Council zone change
  and only where protecting solar access is "specifically requested by the
  developer or owner of the site". The overlay travels in the zone label — the
  code''s own examples are PDR-S and R-S — and no Wilsonville label in this
  corpus carries the suffix. Guarded by a test rather than asserted here,
  because the premise is about what the zoning layer emits and not about what
  the ordinance says.


  If an S-suffixed label ever does arrive, none of the fields here can hold the
  standard: it caps a building''s height as a function of the lot''s
  north-south dimension and where its ridge sits, which is a shape this
  registry has no room for. The right answer then is a refusal, not a setback.


  ALSO READ: 4.132''s requirement that buildings over three storeys step the
  facade back six feet at the fourth is a Town Center standard, and neither
  that zone nor a third storey is in reach.


  HEIGHT, read 2026-08-20. Seven of this layer''s zones permitted a quadplex and stated no height at
  all, so the screen was placing a 26 ft building against no ceiling in each of them. The numbers were
  not unknown -- "height 35ft" sat in the note each zone was ported with -- but a number with nothing
  pointing at a page is a number this project does not have, so they were correctly not encoded and
  incorrectly left alone. R takes 35 from 4.122(.05)E, which states it in a sentence. PDR-1 through
  PDR-6 take 35 from Table 2, whose height column is a single merged cell spanning all seven PDR rows.


  That merged cell is why the table was misread rather than unread. The stored text is the plain
  extraction -- declared, because layout mode fuses this PDF''s prose -- and flattening the grid prints
  the merged cell once, after the PDR-1 row, where it reads as PDR-1''s own number and leaves five zones
  looking silent. Re-extracting the same PDF in layout mode shows both merged cells, Setbacks and
  Height, rendered together at the table''s vertical midpoint on the PDR-3 row: "60 4.113 (.02)35".
  This layer already reads the Setbacks cell as spanning every PDR row. The Height cell is the same
  shape in the same rendering.


  OTR is deliberately still without one, and should stay that way until somebody fetches the book:
  4.123(.06)A hands height to the Old Town Residential Design Standards Book by name. There is no
  citywide fallback to borrow -- 4.113(.03) "Height Guidelines" is discretionary, a list of things the
  Development Review Board MAY regulate, and states no number. A zone that reports no height is the
  ledger working.


  THE TWO MISSING ZONES ARE CLOSED, 2026-09-01. They were named here because nothing else in this
  system could see them: Wilsonville contributes no observed lots to the coverage ledger, so there
  is no zone_missing row to raise a hand -- a missing zone is invisible to a ledger that counts
  fields, which is how Lake Oswego went six residential zones short. This layer now holds R, OTR,
  PDR-1 through PDR-6, RN, V and TC.

  Section 4.125, the V Village Zone, is Villebois, and it was not a footnote-sized gap: 2,508 lots,
  the largest zone in the city and the biggest block of land the screen was dropping. Table V-1 has
  no middle-housing row at all and the way in is 4.125(.23)(B), which sends a quadplex to the
  single-family row with one change, a 7,000 sq ft minimum lot. Held at needs_verification on two
  open questions, both written into the zone.

  Section 4.132, the Town Center Zone, is 59 lots and a decided RED rather than a gap. Its only
  residential permitted use is Multiple-family Dwelling Units, which 4.001(96) defines as excluding
  middle housing. The eight Town Center footnotes ruled on 2026-08-22 were dismissed on the zone
  being absent and have been reopened and re-ruled on the prohibition instead. The fourteen Table 8B
  and 8C notes are untouched -- they belong to RN, which this layer has always held.


  PARKING, read 2026-08-22 and now on the defaults block above: no minimum and no maximum, both
  cited, both exempt rather than absent. Section 4.155 Table 5 is a maximums-and-bicycles table with
  no auto-minimum column, its middle housing row reads "No Limit", and 4.154(F) speaks of minimum
  parking requirements only in the past tense. The Village Zone''s Table V-2 says NR on the same row,
  so the two tables agree.'
ingest:
  geoid: null
  juris_city_codes:
  - WILSONVILLE
  zoning_layer: zoning_wilsonville
  zone_field: ZONE_CODE
  strip_lowercase_suffix: false
definitions:
  # "157. Lot, Corner: A lot either (1) where two intersecting lot lines each
  # abut a street or private drive or (2) where the shortest lot line abuts a
  # tract with a non-vehicular pathway and an intersecting lot line abuts a
  # street or private drive. Private drives which are bounded on two opposite
  # sides by a single lot shall not be considered in determining if a lot is a
  # corner lot."
  #
  # The widest frontage test of the five: a private drive counts, so a lot on
  # an internal drive is a corner here and an interior lot in the other four.
  #
  # Clause (2) turns on whether an abutting tract carries a non-vehicular
  # pathway. No layer we hold records that, so the definition is marked
  # incomplete: it may answer yes, and it may never answer no, because the
  # clause it cannot see could make the answer yes. A lot that fails clause (1)
  # comes back unknown rather than "not a corner".
  #
  # The final sentence -- a private drive bounded on two opposite sides by a
  # single lot is disregarded -- is not encoded either. It can only narrow the
  # answer, so leaving it out keeps more lots in the corner class, which is the
  # conservative direction for a standard that adds a second front setback.
  corner_lot:
    test: intersecting_frontages
    drives_count: true
    incomplete: >-
      clause (2), a shortest lot line abutting a tract with a non-vehicular
      pathway, is unmeasurable from any layer held
    quote: "or/clackamas/wilsonville/4.planning.txt#L795-L798"
    cite: "Wilsonville Planning and Land Development Ordinance 4.001(157), Lot, Corner"

code:
  # Municode client 4976, publication 1951. The library page is a JavaScript
  # frame; PublicationPdfDownload returns the adopted code as one PDF, and the
  # unsigned endpoint is declared because the blob URL it resolves to carries a
  # signature that expires in minutes.
  - id: "4.planning"
    url: https://api.municode.com/PublicationPdfDownload/1951
    title: "Chapter 4 — Planning and Land Development"
    start: "PLANNING AND LAND DEVELOPMENT"
    end: "Chapter 5"
    # Layout-mode extraction fuses 2.2% of this PDF's words, silently hiding
    # standards from every subject phrase; plain mode reads them.
    extraction: plain
    # Section 4.001, "Definitions", opens the chapter and runs to Section
    # 4.002. The chapter is named for planning rather than for words, so
    # the glossary inside it was invisible.
    definitions_at: L232-L1674
  # THE MANUAL THE AISLE REFUSAL POINTED AT, fetched 2026-09-01. Section
  # 4.113(.14)D.4.c.ii is the only sentence in Chapter 4 that sends this
  # building to the Public Works Standards, and the layer's parking note had
  # been carrying it as an open question for a week: a dimension in an
  # engineering manual no jurisdiction file in this corpus declared.
  #
  # It is declared now, and what it settles is the shape of the refusal rather
  # than the number. 201.2.23 is where Wilsonville keeps its driveway
  # standards, and it holds two figures the Development Code does not -- a
  # 12-foot one-way and 20-foot two-way access driveway minimum, and a
  # 50-foot clear drive aisle at the mouth of a parking lot with no stalls in
  # it. Neither is encoded, because the route the code opens is narrow and
  # conditional; the reading is in this layer's parking note.
  #
  # Sliced to the driveway subsection. The manual is 224 pages of pavement
  # sections, water mains and trench backfill, and nothing else in it is about
  # a lot. `nth: 2` skips the table of contents, which lists every section
  # number before the standards start.
  - id: "pws.201.2.23"
    url: https://www.wilsonvilleoregon.gov/sites/default/files/fileattachments/engineering/page/11761/public_works_construction_standards_2017.pdf
    title: "Public Works Standards (2017) 201.2.23, Driveways"
    start: "201.2.23 Driveways"
    end: "201.2.24 Curbs and Grading"
    nth: 2
    extraction: plain
defaults:
  # PARKING, read 2026-08-22 off Table 5 and the two notes under it, which were
  # the last unread footnotes in this layer. Wilsonville held no parking field
  # at all before today, so the screen was placing a four-unit building against
  # no stall demand and no stall ceiling and recording neither fact. Both
  # answers below are "the code asks nothing here", and both are cited, because
  # an absence nobody has read is not the same object as an absence somebody
  # has.
  #
  # Table 5 is citywide: it sits in Section 4.155, General Regulations, and
  # every zone chapter in this code sends its parking question there in one
  # sentence -- "Off-Street Parking Requirements: As provided in Section 4.155."
  # So these are layer defaults rather than per-zone values.
  parking_max_per_unit:
    # Row a.1 of Table 5 is "Single-family dwelling units, middle housing" and
    # its maximum reads "No Limit". 4.001(181) defines Middle Housing as the
    # class containing quadplexes and townhouses, and 4.001(251) defines a
    # quadplex as four attached dwelling units on a single lot, which is this
    # product exactly.
    #
    # The quote carries row a.3 as well -- "Multiple-family dwelling units",
    # 1.2 spaces per studio and 2 per non-studio -- because that is the row a
    # reader might otherwise reach for, and the choice between them should be
    # visible rather than asserted. It does not change the answer: the catalog
    # pod asks 1.5 stalls per unit and 2.0 is above it either way.
    exempt: true
    cite: Wilsonville Development Code 4.155(.04) Table 5, row a.1 + 4.001(181), (251)
    url: https://library.municode.com/or/wilsonville/codes/code_of_ordinances?nodeId=CH4PLLADE_ZO_S4.155GERE
    retrieved: '2026-08-22'
    quote: "or/clackamas/wilsonville/4.planning.txt#L13405-L13414,L13416-L13420"
  parking_min_per_unit:
    # Not a minimum of zero -- there is no minimum, and Table 5's own shape is
    # the evidence. Its two columns are PARKING MAXIMUMS and BICYCLE MINIMUMS;
    # there is no auto-minimum column for any of the thirty-odd uses it lists.
    # 4.154(C) names what the table produces and names only two things, "vehicle
    # parking maximums or bicycle parking requirements".
    #
    # 4.154(F) is the sentence that dates it: the Board may not deny a
    # redevelopment based on the area's "previous designation to meet minimum
    # vehicle parking requirements", or because a use "previously approved
    # subject to minimum parking requirements" would fall below them. A code
    # that still had minimums would not talk about them in the past tense.
    exempt: true
    cite: Wilsonville Development Code 4.155(.04) Table 5 (columns) + 4.154(C), (F)
    url: https://library.municode.com/or/wilsonville/codes/code_of_ordinances?nodeId=CH4PLLADE_ZO_S4.155GERE
    retrieved: '2026-08-22'
    quote: "or/clackamas/wilsonville/4.planning.txt#L13093-L13095,L13102-L13107,L13405-L13410"
  # STALL GEOMETRY, read 2026-08-26 after Steph pointed out that "no minimum"
  # answers the wrong question: this product gets built with parking whatever
  # a city requires, so what matters here is what a stall has to measure once
  # we put one in. Wilsonville requires none and caps none -- both values
  # above are `exempt` -- and it still dimensions every space in the city.
  #
  # The dimensions are in the definitions, not in the parking chapter.
  # 4.001(220) defines a Parking Space as "a permanently surfaced and marked
  # area not less than nine feet wide and 18 feet long, excluding paved area
  # necessary for access". A definition is a citywide standard by another
  # name, which is why these are layer defaults: Table 5 in 4.155 counts
  # spaces and never measures one.
  parking_stall_width_ft:
    value: 9
    cite: Wilsonville Development Code 4.001(220), Parking Space
    url: https://library.municode.com/or/wilsonville/codes/code_of_ordinances?nodeId=CH4PLLADE_ZO_S4.001DE
    retrieved: '2026-08-26'
    quote: "or/clackamas/wilsonville/4.planning.txt#L1019-L1020"
  parking_stall_depth_ft:
    value: 18
    cite: Wilsonville Development Code 4.001(220), Parking Space
    url: https://library.municode.com/or/wilsonville/codes/code_of_ordinances?nodeId=CH4PLLADE_ZO_S4.001DE
    retrieved: '2026-08-26'
    quote: "or/clackamas/wilsonville/4.planning.txt#L1019-L1020"
  #
  # NOT ENCODED: the aisle. Chapter 4 dimensions a standard space, a compact
  # space (7 ft 6 in by 15 ft, 4.001(222)) and a motorcycle space, and states
  # no drive-aisle width anywhere -- the only aisle sentences in the chapter
  # say where an aisle may go, never how wide it is. So this layer holds a
  # stall and no aisle, which is not the same as an aisle of zero, and the
  # screen should be read as having no Wilsonville answer for that dimension
  # rather than a permissive one. Where the number lives is a live question:
  # 4.113(.14)D.4.c.ii sends access on collector and arterial frontages to
  # "the access standards in the Wilsonville Public Works Standards", which is
  # the Gresham 9.0200 shape -- a dimension in an engineering manual no
  # jurisdiction file in this corpus declares.
  #
  # WHERE THE NUMBER WENT, 2026-08-31. This refusal stands -- the code states
  # no aisle and this layer holds none. What changed is downstream: quadfit's
  # site-plan generator now draws this city to an ASSUMED 24 ft aisle (ULI /
  # National Parking Association via Iowa SUDAS 8B-1 Table 8B-1.02, 90 degrees,
  # 85th-percentile design vehicle) rather than declining to draw it at all,
  # and grades those lots normally, green included -- ORS 197A.400 lets a city
  # apply only clear and objective standards to housing, and a width nobody
  # wrote down is not one, so there is nothing here for a court to fail
  # against. The lots stay filterable through `geometry_assumed`. The search
  # that
  # licensed the assumption ran through OAR 660-046-0220(2)(e)(E), which sends
  # middle housing to the single-family standards "in the same zone" -- and
  # Chapter 4 files residential standards by structure type and the "all
  # residential structures" block is facade and articulation only.
  #
  # The distinction to keep: the corpus records what the code says, and says
  # nothing here. The generator records what it had to draw with. Neither
  # borrows from the other.
  #
  # THE MANUAL WAS FETCHED 2026-09-01, and the aisle is not in it either. This
  # is the paragraph that closes the question the note above left open.
  #
  # Wilsonville's Public Works Standards run 224 pages. The word "aisle"
  # appears in them seven times and every one of the seven is in 201.2.23(m),
  # which is not the dimension this screen wanted: a CLEAR drive aisle is the
  # throat at the mouth of a parking lot, "containing no parking spaces or
  # intersecting drive aisles", required for 50 feet back from the sidewalk on
  # a driveway under 100 average daily trips. It says how far in the first
  # stall may sit, not how wide the lane between two rows of stalls has to be.
  # So the city that dimensions a parking space in its DEFINITIONS section and
  # states no aisle in its code states no aisle in its engineering manual
  # either, and the assumption the site-plan generator draws with now rests on
  # a search rather than on nobody having looked.
  #
  # DETAIL RD-1105 IS NAMED "PARKING LOT DRIVEWAY AISLE" and it is the
  # Clackamas P100 outcome, one step worse. 201.2.23(m) sends the clear drive
  # aisle to it by number, so the citation chain does run to a drawing -- and
  # the drawing is a raster scan with no text layer at all, where P100 at
  # least published its stall size in a title block. Nothing was read off it.
  #
  # THE MANUAL DOES HOLD TWO NUMBERS THE CODE DOES NOT, and neither is
  # encoded, because of the route rather than the reading. 201.2.23(l):
  # "Access driveways shall have a minimum width of 12 feet for one-way
  # traffic and 20 feet for two way traffic." 201.2.23(e): residential
  # driveway access shall be at least 50 feet from the nearest intersection.
  # A 20-foot two-way minimum is the size of number that moves lots -- Happy
  # Valley's is the only driveway figure in this corpus that ever has.
  #
  # Chapter 4 sends this building to the Public Works Standards in exactly one
  # sentence, and it is doubly conditional. Section 4.113(.14)D.4.c is
  # prefaced "lots or parcels with more than one frontage must comply with the
  # following", and c.ii reads "Lots or parcels with frontages ONLY on
  # collectors and/or arterial streets must meet the access standards in the
  # Wilsonville Public Works Standards." Two conditions, both about the
  # streets a lot touches, and the inventory knows the streets a lot touches
  # for no lot in Oregon. The other six routes to the manual in Chapter 4 are
  # grading, stormwater sizing, low impact development and construction in the
  # right-of-way; a whole-document search found no seventh.
  #
  # The sentence is also the argument. If the manual governed every private
  # driveway in Wilsonville, naming the collector-and-arterial case would be
  # redundant -- a code does not carve out what it already covers. And
  # 201.2.23(j) settles what the manual thinks it is doing: "The City's
  # authorized representative shall make the final determination of maximum
  # driveway width on a case-by-case basis", which is discretion, not a clear
  # and objective standard, and ORS 197A.400 keeps discretion off housing.
  # (or/clackamas/wilsonville/pws.201.2.23.txt#L1-L3,L18-L20,L73-L78,L84-L95)
  #
  # DRIVEWAY, APPROACH AND PARKING PLACEMENT. Section 4.113(.14) is where
  # Wilsonville says what a quadplex's parking may look like, and subsection D
  # is titled "Standards applicable to Triplexes and Quadplexes" -- this
  # building, named. Transcribed here on 2026-08-26 as the fifth jurisdiction
  # with nowhere to put it; encoded 2026-08-27.
  #
  # D.4, Driveway Approach: "The total width of all driveway approaches must
  # not exceed 32 feet per frontage, as measured at the property line" -- the
  # same 32 feet as Fairview FMC 19.30.040(F)(1) and Clackamas ZDO 845.02,
  # because all three are the state middle-housing model code. Wilsonville
  # states no ceiling on a single opening the way Fairview does, so the
  # frontage total is the only limit and it is the one encoded.
  #
  # NOT ENCODED from the rest of D.4: on a lot with more than one frontage
  # access must be taken from the street with the lowest transportation
  # classification, and from the alley instead if a paved alley abuts; a lot
  # fronting only local streets may have either two approaches totalling 32
  # feet on one frontage or one 16-foot approach per frontage. Street class,
  # alley presence and frontage count are three site facts nothing measures.
  driveway_approach_max_width_ft:
    value: 32
    cite: Wilsonville Development Code 4.113(.14)D.4, total width of all driveway approaches per frontage
    url: https://api.municode.com/PublicationPdfDownload/1951
    retrieved: '2026-08-27'
    quote: "or/clackamas/wilsonville/4.planning.txt#L3545-L3567"
  # D.3, Garages and Off-Street Parking Areas: "The combined width of all
  # garages (measured from the interior of the garage door frame) and outdoor
  # on-site parking and maneuvering areas shall not exceed a total of 50
  # percent of any street frontage (other than an alley)." The model-code
  # figure, and note "any street frontage" -- on a corner lot it binds twice.
  parking_area_max_frontage_pct:
    value: 50
    cite: Wilsonville Development Code 4.113(.14)D.3, combined width of garages and outdoor parking and maneuvering areas as a share of any street frontage
    url: https://api.municode.com/PublicationPdfDownload/1951
    retrieved: '2026-08-27'
    quote: "or/clackamas/wilsonville/4.planning.txt#L3538-L3541"
  # Exempt rather than true: D.3 caps front-yard parking at half the frontage
  # and does not ban it. The ban is E.5.c, on the townhouse path, and reached
  # only by a project that fails the four standards at E.5.b.
  parking_front_prohibited:
    exempt: true
    cite: Wilsonville Development Code 4.113(.14)D.3, which caps outdoor parking and maneuvering at half of any street frontage rather than prohibiting it
    url: https://api.municode.com/PublicationPdfDownload/1951
    retrieved: '2026-08-27'
    quote: "or/clackamas/wilsonville/4.planning.txt#L3538-L3541"
  # Subsection E is "Standards applicable to Townhouses", which under state
  # law is this building on four unit lots rather than one -- the `unit_lots`
  # lever, said in Wilsonville's words. E.5.a requires access from a paved
  # abutting alley. E.5.b lets parking sit in the front yard only if each lot
  # has 20 feet of local-street frontage, takes at most one driveway approach
  # per townhouse, keeps outdoor on-site parking and maneuvering areas to 12
  # feet wide on any lot, and keeps the garage to 12 feet. E.5.c is what
  # applies when b is not met: off-street parking accessed on the back facade
  # or in the rear yard, none in the front or side yard, a corner-lot project
  # taking a single approach on the side street, and a non-corner project
  # consolidating access into one driveway that may not run between any
  # townhouse's front facade and its front lot line.
  #
  # Twelve feet is the number that decides this. A 9-foot stall inside a
  # 12-foot cap leaves three feet of manoeuvring, which is a single-file
  # driveway and not a court -- so on the split plat Wilsonville does not
  # permit the parking arrangement the site-plan generator draws. On the whole
  # lot D.3 caps a share of the frontage and states no width, so there is
  # nothing for this field to hold there.
  parking_maneuvering_max_width_ft:
    exempt: true
    cite: Wilsonville Development Code 4.113(.14)D.3, which caps a share of the frontage and states no maneuvering-area width
    url: https://api.municode.com/PublicationPdfDownload/1951
    retrieved: '2026-08-27'
    quote: "or/clackamas/wilsonville/4.planning.txt#L3538-L3541"
    variants:
      - value: 12
        when: [unit_lots]
        cite: Wilsonville Development Code 4.113(.14)E.5.b, outdoor on-site parking and maneuvering areas on a townhouse lot
        quote: "or/clackamas/wilsonville/4.planning.txt#L3622-L3658"
  #
  # NOT ENCODED: any private open space standard. Wilsonville states one and
  # it is not this building's. Section 4.125(.08), Open Space, sits inside
  # Section 4.125, "V -- Village Zone", and the Village is Villebois; the
  # definitions chapter routes the term there and only there ("Open Space
  # Area: A specific measurement. See Section 4.125(.08), Open Space").
  # Nothing in 4.113 or in the R, RA-H or PDR zones states a private open
  # space minimum, so a Wilsonville site plan outside the Village reserves
  # none -- the code as read, not an omission. (or/clackamas/wilsonville/4.planning.txt#L997-L1002)

zones:
  R:
    section: ["4.122", "4.113", "4.001"]
    cite_default:
      cite: Wilsonville Development Code 4.122 (R Zone) + 4.113(.02) setbacks; Ord. 841 (middle housing)
      url: https://library.municode.com/or/wilsonville/codes/code_of_ordinances?nodeId=CH4PLLADE_ZO_S4.122REZO
      retrieved: '2026-07-28'
    quadplex_allowed:
      # 4.122(.04)B permits "Middle Housing"; 4.001(181) is where that term is
      # defined as the class containing quadplexes. The quote reads both, so
      # the citation names both -- a reviewer sent only to 4.122 finds a
      # permitted use whose meaning is somewhere else entirely.
      cite: Wilsonville Development Code 4.122(.04)B (R Zone permitted uses) + 4.001(181) definition of Middle Housing; Ord. 841
      value: true
      quote: "or/clackamas/wilsonville/4.planning.txt#L874-L875,L4408-L4412"
    max_height_ft:
      # 4.122(.05)E, the R zone's own lot standards, states it in a sentence
      # of its own: "Maximum building or structure height: 35 feet." No
      # footnote, no housing-type split, no delegation. The number was sitting
      # in the note this zone was ported with -- "height 35ft" -- with nothing
      # pointing at a page, which is a number that does not exist for this
      # project's purposes. Now it points at one.
      value: 35
      cite: Wilsonville Development Code 4.122(.05)E (R Zone lot standards)
      quote: "or/clackamas/wilsonville/4.planning.txt#L4457"
    setback_front_ft:
      value: 15
      quote: "or/clackamas/wilsonville/4.planning.txt#L3035-L3036"
      variants:
