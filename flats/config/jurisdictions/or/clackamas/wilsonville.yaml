    notes: 'quadfit confidence: needs_verification | RN allows detached SFD so the HB 2001 mandate attaches
      BY STATE PREEMPTION, BUT the adopted Frog Pond West master plan caps attached units at 2 and bars
      multi-family — a 4-plex is likely NOT locally permitted. Kept true+needs_verification (preemption
      is a real legal argument); confirm before relying. Setbacks = FPW R-5 small-lot sub-district.
      min_lot 7,000 is the QUADPLEX minimum (Table 2 note C, R-5/R-7 sub-districts) — the registry basis
      is fourplex-on-one-lot; the prior 4,000 was the R-5 SFD base tier, wrong denominator for the pod.
      R-10 sub-district states no quadplex minimum (SFD base 8,000 would govern there). KNOWN differs:
      max_coverage_pct 60 vs doc 90 — the 90 is the Commercial Main Street block, which shares section
      4.127 with RN and cannot be scoped out until fetch-layer geometry; the 60 is FPW R-5 residential,
      now quoted at the Table 8A row it was read from. REMOVED: setback_front_max_ft 20, which cited
      L7965-L7968 — that is Table 23A, Commercial Main Street Development Standards, the same wrong
      half of section 4.127 the 90 came from. Table 8A states no maximum front setback for any Frog
      Pond West sub-district, and a maximum front setback is not harmless: it pushes every building to
      within twenty feet of the street and would fail detached-house lots that comply perfectly well.
      Table 8B (Frog Pond East and South) is unread; if it states one for RN, it belongs here with its
      own quote.

      TABLE 8A IS READABLE AFTER ALL (2026-08-16). The old note here said its columns could not be
      settled by position, nine bare numbers against ten headers. The tenth header is "Side Min
      (note)", which prints no number: nine numbers, nine numeric columns, in order, and all three
      sub-district rows share the shape. REMOVED on the strength of that: min_frontage_ft 35, which
      was the R-5 Min Lot WIDTH column wearing the wrong field name. Table 8A states no street
      frontage at all, and frontage is not width — a flag lot has width and almost none of it — so
      the pod''s access would have been checked against a number the code never wrote. Lot width and
      lot depth are now encoded from their own columns.

      THE ONE DECISION THIS ZONE NEEDS. Table 8A is three rows, one per Frog Pond West sub-district,
      and the GIS zone literal is "RN" with no sub-district on it. The three rows disagree: coverage
      40 / 45 / 60 percent, width 40 / 35 / 35, front setback 20 / 15 / 12, lot size 8,000 / 6,000 /
      4,000. Width and depth above take the binding row, which is the rule everywhere else in this
      file. Coverage 60 and min lot 7,000 do NOT — they are the R-5 row and note C, encoded before
      this was understood, and the loose end of a 40-to-60 spread is exactly the shape that turns a
      lot green by mistake. Fixing that honestly is not a number edit: it wants either the
      sub-district carried through from the GIS, or three registered sub-district conditions with no
      assumed answer, so an RN lot resolves as unknown until somebody says which row it is in.
      Neither is a five-minute change, so it is written here rather than guessed at.

      Setbacks continue to come from 4.113(.02) rather than Table 8A: the citywide section states
      them per lot size with the townhouse zero, which is more of the answer than Table 8A''s single
      front/rear pair, and the cite now names both chapters.'
