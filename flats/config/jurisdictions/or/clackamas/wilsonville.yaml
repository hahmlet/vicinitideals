  "4.planning.txt#4":
    queue: condition
    outcome: applies
    note: >-
      The residue card: 285 measuring lines that belong to no subsection the sectioner could name,
      spread from line 251 to line 18,869 of a 19,000-line development code, touching ten fields.
      It is the largest card in the queue and most of it is other people's buildings. One line in
      it was the biggest single omission in this layer. THE FIND. 4.176(.03): "Not less than 15
      percent of the total lot area, shall be landscaped with vegetative plant materials."
      Wilsonville held no landscaping field at all, so the screen was handing the pod and its
      parking court the whole lot minus setbacks. Now encoded as a layer default of 15 percent
      against total lot area. It was not obvious and the argument is worth keeping. Two sentences
      read as though 4.176 were a commercial standard -- 4.113(.12)9 makes a bed and breakfast
      home, a use in a residential zone, "comply with the landscaping standards for commercial
      development found in Section 4.176", and 4.420(.01)B.1 exempts "landscaping on residential
      lots in residential zones" from Site Design Review. Neither survives. The first has an exact
      twin one line above it sending the same use to "the off-street parking standards for
      commercial development found in Section 4.155", and 4.155 plainly does reach residential --
      its Table 5 opens with a middle-housing row -- so the phrase names a portion of a section
