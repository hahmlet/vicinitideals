  "4.planning.txt#4.113":
    queue: condition
    outcome: applies
    note: >-
      Section 4.113 is titled "Standards Applying to Residential Developments in any Zone" and it
      is in the section list of every Wilsonville zone a quadplex may be built in, so this card
      had to be worked rather than scoped away. Most of it is already ours. Subsection (.02) is a
      banded setback schedule -- one set for lots over 10,000 square feet and one for lots not
      exceeding it -- and both bands are encoded on every zone that takes them, with the storey
      split carried as a `multi_story` variant (side 5 becoming 7, rear 15 becoming 20, and the
      pod is two storeys so the tighter limb is the one that binds), the party wall as
      `attached_wall`, and the four-foot alley garage as `abuts_alley`. Nothing there is missed.
      THE CARD STAYS OPEN ON ONE SENTENCE, and it is a tightening on a condition this layer can
      already measure. 4.113(.02)A.2: "In the case of a corner lot less than 100 feet in width,
      abutting more than one street or tract with a private drive, the side yard on the street or
      private drive side of such lot shall be not less than 20 percent of the width of the lot,
      but not less than ten feet." All three gates are measured here -- `corner_lot` is computed
      in this layer from intersecting frontages rather than left unmeasured, lot area decides the
      band, and lot width is held. What is not held is the VALUE. A setback stated as a share of
      the lot's own width has no form in this registry; the nearest thing it has is per_height_ft,
      which is the same idea about a different measurement. Encoded, this zone charges ten feet at
      the street side. On a corner lot over 10,000 square feet and eighty feet wide the code
      charges sixteen, and at ninety-nine feet it charges nearly twenty. That is a false-green
      shape rather than a rounding difference, and it cannot be approximated into bands without
      inventing numbers the page does not print. Two more sentences on the card are unencodable
      for reasons already on the record. (.02)A.3 and B.3 set a key lot's front setback at
      "one-half the sum of" the adjacent corner lot's yard and the adjacent interior lot's setback
      -- the offset-from-another-standard shape, which nothing in the model can hold and which
      also needs "key lot" as a geometry nobody computes. (.02)A.4 and B.4 forbid any structure
      inside the setback for a FUTURE street shown on the adopted Transportation System Plan,
      which is a map this project does not have and a prohibition rather than a number. Everything
      else was read and does not move a verdict. (.03) Height Guidelines states no number at all
      -- it is a list of things the Development Review Board MAY do, and the one limb with a
      threshold reaches "buildings more than two stories in height", which a two-storey pod is
      not. (.05) is stormwater facility widths in tracts and planters. (.14), Design Standards for
      Detached Single-family and Middle Housing, does name this building and was read in full for
      that reason: articulation by a 20 percent width difference or a five-foot horizontal offset,
      20 percent of a facade in a different material, a 15 percent paint reflectance difference,
      transparency at 12.5 or 10 percent depending on how many menu items are used, a 25 square
      foot porch, an entrance within 45 degrees of the street, windows over 15 percent of each
      public-facing facade. Every one of them is a facade treatment or a menu, and none changes
      the rectangle the pod occupies. (.15) is Design Standards for Multi-Family Housing and
      4.001(96) puts middle housing outside that term. (.10) is accessory dwelling units, (.12)
      bed and breakfasts, (.07) fences, (.11) a reduced-setback agreement between neighbours,
      which relaxes. THE OPEN SPACE SENTENCE IS THE FIND. (.01)C requires open space "equal to 25
      percent of the size of the Gross Development Area", and this layer's standing note said in
      as many words that nothing in 4.113 states an open space minimum. That claim has been
      corrected in the layer rather than left standing, because a claim of silence is the one kind
      nobody re-reads. It still does not reach a build on a lot of record, but for a reason about
      the denominator: 4.001(84) defines Gross Development Area as the area of a Stage I Master
      Plan, or where none is required a Tentative Plat, and a quadplex on an existing lot files
      neither. (.01)B.2 fixes the amount at Stage II Final Plan review, (.01)D.2 counts only land
      owned by the City, a homeowners' association or a Multi-family owner, and (.01)D.1 wants
      each counted piece at 1,000 square feet or more. The split plat is the live question and is
      written into the layer note rather than guessed at here. Last, five statements on this card
      are not 4.113 at all -- the 10,000 square foot lot, 100 feet of frontage, 50 percent
      coverage, 50-foot height and 125-foot depth at lines 15997 to 16001 are Section 4.184(.04),
      Conditional Use Regulations for Churches, pulled onto this card by the cross-reference two
      paragraphs above them that sends private parks to 4.113. Worth naming as an attribution slip
      of the same family as the hoisted table: the citation is right about the lines and wrong
      about whose section they are.
    fingerprint: 3155334d2066315a
  "4.planning.txt#4.127":
    queue: condition
    outcome: cant_tell
    note: >-
      Section 4.127 is the Residential Neighborhood zone, Frog Pond, and it governs exactly one
      zone in this layer -- RN, and no other zone's section list names it. RN holds
      `quadplex_allowed: false` on a sentence that could not be plainer, 4.127(.02)B.1.a.ii:
      "triplexes are permitted only on corner lots, and quadplexes are not permitted." So nothing
      on this card can change a verdict today. It is filed as depending on the site rather than
      closed because RN's refusal is the one in this corpus that is explicitly flagged rather than
      settled. The Town Center note two zones down says why in its own words: the state mandate at
      ORS 197A.420 and OAR 660-046 makes a city allow middle housing wherever it allows detached
      single-family dwellings, Town Center allows no detached house so nothing attaches there, and
      RN "is the opposite case: it allows detached houses and bans the quadplex in the same
      section." That is why RN's dimensional standards are encoded in full underneath a false use
      flag, and it is why closing this card as never would be wrong -- a section closed as never
      is a section nobody reads again, and this one has a live argument standing over it. WHAT IS
      ON THE CARD IF IT EVER OPENS. Two real tightenings, both turning on a mapped sub-area nobody
      holds. 4.127's Table 8B note E: "In Urban Form 3, buildings or portions thereof greater than
      either 2 stories or 25 feet in height shall have a minimum front setback of 20 feet" -- and
      the pod is two storeys and twenty-six feet, so it crosses the height limb by a foot and
      takes the twenty. And the note above it: where the minimum front setback is six feet it
      exists to hold a public utility easement, and "if the City requires a wider PUE the minimum
      setback shall increase to accommodate the PUE", which is a setback defined by another
      authority's number and the same shape the offset gap already names. Both need the Urban Form
      Type, and the Urban Form Types are drawn in prose as distances from streets -- the east
      boundary "between 480 and 520 feet east of SW 60th Avenue", the west "between 360 and 400
      feet west", the south "between 300 and 340 feet north of SW Kruse Road" -- with the exact
      line left to the developer to propose. That is not a boundary a screen can compute; it is a
      boundary an applicant negotiates. It also compounds a gap this zone already carries: RN
      covers Frog Pond West, East and South and nothing published says which neighbourhood a lot
      is in, which is why every dimension here was taken from the binding R-10 column rather than
      the one that fits. The rest of the card is scope. The subdistrict descriptions at 6606 and
      7112 to 7148 are map boundaries, not standards. The Table 6B reduction ratio, the 60 percent
      unit-type cap on Net Development Area and the five-units-or-20-percent affordability
      calculation are master-plan mix rules that operate on a Stage I area, not on a lot. The
      transparency percentages at 7800 to 7808, the 50 percent projecting facade element and the
      entrance-orientation rule are design menus. The 50 percent of building frontage on SW
      Brisband Street belongs to a ground-floor commercial requirement in A-7. Note H's ten-foot
      rear setback names cottage clusters and accessory dwelling units, and note I's coverage
      ladder names lots holding only "Other Detached Units".
    fingerprint: 1199fdf38d80318b
  "4.planning.txt#4.132":
    queue: condition
    outcome: never
    note: >-
      Section 4.132 is the Town Center Zone and TC is the only zone in this layer whose section
      list names it. TC is a decided RED and the argument was made the way this corpus requires
      rather than off the use list alone: 4.132 runs 953 lines and never says quadplex, middle
      housing, townhouse or duplex once; its single residential permitted use is Multiple-family
      Dwelling Units; and 4.001(96) defines that term to exclude middle housing while 4.001(181)
      puts the quadplex inside it. The state mandate does not reopen it either, because Town
      Center permits no detached single-family dwelling for middle housing to attach to. So every
      measurement on this card is a standard for a building that may not be built here. They are
      also, read on their own terms, standards for a different building. The four sub-district
      columns set a minimum front setback of zero and a MAXIMUM of ten to twenty feet, a maximum
      side yard of twenty, and a minimum building height of TWO STORIES -- a build-to street wall
      with active ground floors, which is the opposite of a detached pod with a parking court
      behind it. The rest is block structure and streetscape: a 400-foot maximum block length, a
      250-foot maximum to a mid-block crossing, 100-foot minimum block dimensions, street trees
      every 30 feet of frontage, one seat per 250 square feet of plaza and one tree per 800. Two
      more are height relaxations -- elevator machinery may rise 16 feet above the limit, and
      roofs over 35 feet need integrated drainage. One is a parking placement rule, 50 percent of
      the street frontage where parking may sit beside the building. The 12- and 13.5- and
      16.5-foot figures at 8493 to 8503 are sidewalk and frontage-zone widths per the
      Transportation System Plan, on the far side of the property line. Nothing here is a number
      this screen would take even if the use were permitted, and the use is not.
    fingerprint: 188869297c83d212
  "4.planning.txt#4.137.2":
    queue: condition
    outcome: never
    note: >-
      Section 4.137.2, Solar Balance Point Standards, and this layer already carries the reading
