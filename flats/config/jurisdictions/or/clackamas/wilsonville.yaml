label: Wilsonville
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  SETBACKS COME FROM LOT SIZE, NOT FROM THE ZONE. Section 4.113(.02) states one
  set of setbacks for residential development in any zone, and PDR Table 2''s
  Setbacks column says only "Per Section 4.113 (.02)" — so all nine zones carry
  the same banded encoding. Lots over 10,000 sq ft take 20/10/20; lots not
  exceeding 10,000 take 15/5/15, with the side and rear numbers rising to 7 and
  20 at two storeys or more. The split is exact: the ''over'' band excludes
  10,000 sq ft and the other includes it, so no lot sits in both or in neither.
  A pod is two storeys, so on a small lot it is bound by 15/7/20.


  NOT ENCODED: on a lot over 10,000 sq ft the corner-lot street side setback is
  20 percent of the lot width with a ten-foot floor (4.113(.02)A.2). That is a
  function of the lot, not a number, and setback_street_side_ft carries the
  ten-foot floor from the small-lot column (A.2/B.2) instead. Wide corner lots
  are therefore screened against a setback smaller than the code requires —
  worth a rule shape that can hold a percentage-of-width standard.


  ALSO NOT ENCODED: the key-lot front setback (half the sum of two neighbouring
  yards), the future-street reservation, and the cottage-cluster/ADU and
  attached-townhouse setback exceptions, none of which apply to a four-unit pod
  on its own lot.


  READ AND NOT ENCODED: Section 4.137.2''s Maximum Shade Point Height Standard
  would refuse this building outright wherever it reaches. Table 2 allows a
  shade point of 14 ft where the shade reduction line sits five feet off the
  northern lot line, and the pod is 26. It reaches only land inside the "S"
  (solar access) Overlay Zone, which 4.137(.01)B applies by Council zone change
  and only where protecting solar access is "specifically requested by the
  developer or owner of the site". The overlay travels in the zone label — the
  code''s own examples are PDR-S and R-S — and no Wilsonville label in this
  corpus carries the suffix. Guarded by a test rather than asserted here,
  because the premise is about what the zoning layer emits and not about what
  the ordinance says.


  If an S-suffixed label ever does arrive, none of the fields here can hold the
  standard: it caps a building''s height as a function of the lot''s
  north-south dimension and where its ridge sits, which is a shape this
  registry has no room for. The right answer then is a refusal, not a setback.


  ALSO READ: 4.132''s requirement that buildings over three storeys step the
  facade back six feet at the fourth is a Town Center standard, and neither
  that zone nor a third storey is in reach.


  HEIGHT, read 2026-08-20. Seven of this layer''s zones permitted a quadplex and stated no height at
  all, so the screen was placing a 26 ft building against no ceiling in each of them. The numbers were
  not unknown -- "height 35ft" sat in the note each zone was ported with -- but a number with nothing
  pointing at a page is a number this project does not have, so they were correctly not encoded and
  incorrectly left alone. R takes 35 from 4.122(.05)E, which states it in a sentence. PDR-1 through
  PDR-6 take 35 from Table 2, whose height column is a single merged cell spanning all seven PDR rows.


  That merged cell is why the table was misread rather than unread. The stored text is the plain
  extraction -- declared, because layout mode fuses this PDF''s prose -- and flattening the grid prints
  the merged cell once, after the PDR-1 row, where it reads as PDR-1''s own number and leaves five zones
  looking silent. Re-extracting the same PDF in layout mode shows both merged cells, Setbacks and
  Height, rendered together at the table''s vertical midpoint on the PDR-3 row: "60 4.113 (.02)35".
  This layer already reads the Setbacks cell as spanning every PDR row. The Height cell is the same
  shape in the same rendering.


  OTR is deliberately still without one, and should stay that way until somebody fetches the book:
  4.123(.06)A hands height to the Old Town Residential Design Standards Book by name. There is no
  citywide fallback to borrow -- 4.113(.03) "Height Guidelines" is discretionary, a list of things the
  Development Review Board MAY regulate, and states no number. A zone that reports no height is the
  ledger working.


  THE TWO MISSING ZONES ARE CLOSED, 2026-09-01. They were named here because nothing else in this
  system could see them: Wilsonville contributes no observed lots to the coverage ledger, so there
  is no zone_missing row to raise a hand -- a missing zone is invisible to a ledger that counts
  fields, which is how Lake Oswego went six residential zones short. This layer now holds R, OTR,
  PDR-1 through PDR-6, RN, V and TC.

  Section 4.125, the V Village Zone, is Villebois, and it was not a footnote-sized gap: 2,508 lots,
  the largest zone in the city and the biggest block of land the screen was dropping. Table V-1 has
  no middle-housing row at all and the way in is 4.125(.23)(B), which sends a quadplex to the
  single-family row with one change, a 7,000 sq ft minimum lot. Held at needs_verification on two
  open questions, both written into the zone.

  Section 4.132, the Town Center Zone, is 59 lots and a decided RED rather than a gap. Its only
  residential permitted use is Multiple-family Dwelling Units, which 4.001(96) defines as excluding
  middle housing. The eight Town Center footnotes ruled on 2026-08-22 were dismissed on the zone
  being absent and have been reopened and re-ruled on the prohibition instead. The fourteen Table 8B
  and 8C notes are untouched -- they belong to RN, which this layer has always held.


  PARKING, read 2026-08-22 and now on the defaults block above: no minimum and no maximum, both
  cited, both exempt rather than absent. Section 4.155 Table 5 is a maximums-and-bicycles table with
  no auto-minimum column, its middle housing row reads "No Limit", and 4.154(F) speaks of minimum
  parking requirements only in the past tense. The Village Zone''s Table V-2 says NR on the same row,
  so the two tables agree.'
ingest:
  geoid: null
  juris_city_codes:
  - WILSONVILLE
  zoning_layer: zoning_wilsonville
  zone_field: ZONE_CODE
  strip_lowercase_suffix: false
