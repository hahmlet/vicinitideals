          band: {measure: lot_sqft, at_most: 10000}
          quote: "or/clackamas/wilsonville/4.planning.txt#L3051"
        - value: 20
          band: {measure: lot_sqft, more_than: 10000}
          quote: "or/clackamas/wilsonville/4.planning.txt#L3025"
    setback_street_side_ft:
      value: 10
      quote: "or/clackamas/wilsonville/4.planning.txt#L3038-L3039"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/clackamas/wilsonville/4.planning.txt#L3047"
      variants:
        - value: 4
          when: [abuts_alley]
          quote: "or/clackamas/wilsonville/4.planning.txt#L3049-L3050"
    min_lot_sqft:
      value: 7000
      quote: "or/clackamas/wilsonville/4.planning.txt#L4450-L4453"
      variants:
        # 4.122(.06)C.4. R states a per-lot townhouse minimum and, unlike
        # OTR, no cumulative figure for a row of them.
        - value: 1250
          when: [unit_lots]
          quote: "or/clackamas/wilsonville/4.planning.txt#L4455"
    min_lot_width_ft:
      value: 60
      quote: "or/clackamas/wilsonville/4.planning.txt#L4440-L4442"
      variants:
        - value: 20
          when: [unit_lots]
          quote: "or/clackamas/wilsonville/4.planning.txt#L4440-L4442"
    min_lot_depth_ft:
      value: 70
      quote: "or/clackamas/wilsonville/4.planning.txt#L4456"
    min_frontage_ft:
      value: 30
      quote: "or/clackamas/wilsonville/4.planning.txt#L4443-L4446"
      variants:
        - value: 20
          when: [unit_lots]
          quote: "or/clackamas/wilsonville/4.planning.txt#L4443-L4446"
    max_coverage_pct:
      # 4.122(.06)F is five rows on lot area, and the file held the loosest
      # of them as the zone's figure. Each row prints two numbers, largest
      # building over all buildings -- 50/60 at the small end. The pod is one
      # building, so the largest-building column is the one it is measured
      # against, and it is also the tighter of the two.
      #
      # Base is the tightest row rather than the commonest, so a lot whose
      # area we somehow do not have cannot come back looser than the code
      # allows anywhere. Every other row is an explicit band, and the screen
      # always knows lot area, so the base is a backstop rather than an
      # answer.
      value: 20
      quote: "or/clackamas/wilsonville/4.planning.txt#L4458-L4467"
      variants:
        - value: 50
          band: {measure: lot_sqft, at_most: 7000}
          quote: "or/clackamas/wilsonville/4.planning.txt#L4458-L4467"
        - value: 45
          band: {measure: lot_sqft, more_than: 7000, at_most: 8000}
          quote: "or/clackamas/wilsonville/4.planning.txt#L4458-L4467"
        - value: 40
          band: {measure: lot_sqft, more_than: 8000, at_most: 12000}
          quote: "or/clackamas/wilsonville/4.planning.txt#L4458-L4467"
        # The code writes this row "more than 12,000 sf and less than 20,000
        # sf" and the band grammar has no exclusive upper bound. 19,999 is
        # the last whole square foot in it; a lot measured between 19,999 and
        # 20,000 falls through to the base 20, which is the stricter side and
        # the right way to miss.
        - value: 25
          band: {measure: lot_sqft, more_than: 12000, at_most: 19999}
          quote: "or/clackamas/wilsonville/4.planning.txt#L4458-L4467"
    notes: 'quadfit confidence: verified | Permits Middle Housing outright. Setbacks per 4.113(.02): lots
      <=10,000sf get 15/5/15 (2-story side=7, rear=20); lots >10,000sf get 20/10/20. Quadplex min lot
