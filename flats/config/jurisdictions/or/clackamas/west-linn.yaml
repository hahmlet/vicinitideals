      line 45 ft" is what min_lot_width_ft carries; three rows below it "Average minimum lot width
      80 ft" sits unheld, and a lot has to satisfy both. Checked across every West Linn zone file:
      R-40 150/150, R-20 100/100, R-7, R-5, R-4.5 and R-2.1 all 35/35, R-3 prints no average row
      at all -- so exactly two zones state a stricter average than their front-line figure, this
      one by thirty-five feet and R-10 by fifteen. The zone's own notes line has said "45 ft at
      front line / 80 ft avg" since the quadfit import, which is where the choice was recorded and
      why no ledger has ever seen it. Left as ordered work rather than silently raised to 80: the
      field is called min_lot_width_ft with no measurement attached, so writing 80 into it would
      refuse a lot forty-five feet wide at the street and ninety feet wide behind, which meets
      both standards the city wrote. The two rows want two measurements. Both rows carry "Does not
      apply to townhouses or cottage clusters", so the split-plat path escapes them and the
      single-lot quadplex does not. The other two statements on this card are a cottage-cluster
      setback and the Type I/II lands carve-out from the floor area ratio; neither reaches this
      building.
