    note: >-
      The Willamette Historic District's general standards do reach this building, and reading the
      card found that only two of the nine West Linn zones had been qualified for them. 25.070(C)
      states four yards and a height for new construction inside the district: the front yard is
      the average of the adjacent homes on the block face, the side is five feet, the side street
