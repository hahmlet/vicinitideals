      Compared zone by zone against what this layer holds, the side and side street are looser
      everywhere, so they can be read and left. The front is unbounded in both directions -- an
      average of two buildings the code does not describe -- and R-10 and R-5 were qualified on it
      when the district was first read; the other seven zones were not, and have been now. The
      rear is the sharper find: 25.070(C)(4) requires twenty feet and R-3 and R-2.1 both print
      fifteen, which is the one place in West Linn where the district is stricter than the
      underlying zone, and those two now carry the qualifier as well. The district is a boundary
      on the zoning map rather than a list of base zones, so no zone could be ruled out. The
      28-foot height is deliberately not encoded: the pod is 26 feet, so the limit cannot bind it,
      and a qualifier on a standard that cannot change an answer would cap the verdict on every
      West Linn lot for nothing. The 18-inch projection allowance is a relaxation. Left open
      because the height line is still unquoted and that is a decision worth being able to find
      again.
