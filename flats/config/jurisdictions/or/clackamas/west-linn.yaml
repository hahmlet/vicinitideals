label: West Linn
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml, then re-cited value by value against the adopted CDC (2026-08-14):
  every zone now quotes its own chapter and no value cites an aggregator. Two readings apply to all nine
  zones. (1) min_lot_sqft is the base "Minimum lot size" row. A quadplex is permitted outright in every
  one of these zones and is not one of the dwelling types the lot-size row is broken out by — the rows
  are detached, attached, multifamily and a townhouse-project average — so the base figure is what a
  quadplex is held to, which is the conservative reading of the three. (2) min_frontage_ft is replaced
  by min_lot_width_ft: what the code states is "Minimum lot width at front lot line", the "Average
  minimum lot width" printed beneath it is a subdivision average and not encoded, and no chapter states
  a frontage standard as such. UNPORTED: orientation_constraint=''entrance_only''. quadfit justified this
  in a YAML comment with no citation; it needs its own encoding rather than invented provenance.
  (3) READ AND NOT ENCODED — CDC Chapter 43, the sidewall provisions every dimensional table points at.
  It applies to "all new single-family attached and detached construction", and CDC 02.030 defines
  single-family attached as "two or more dwelling units attached side by side ... on separate lots or
  parcels. This may be further defined as a duplex, triplex, or quadplex" — so it reaches this pod in
  the unit-lot configuration and not on a single lot, where the same building is a "quadplex residential
  unit" by a different definition. What it then requires is that a side elevation over 700 sq ft be
  divided into distinct planes of 700 sq ft or less. The pod''s side elevation is 36 ft by 26 ft, about
  936 sq ft, so the standard would reach it and two of the seven exemptions might not: 20 ft from the
  side lot line, and a sidewall no more than 22 ft from grade to the eaves. It is not encoded because
  no field in this system can hold it — it constrains how a wall is articulated, not how far the wall
  stands from the line — and inventing a setback to stand in for it would produce a number no reviewer
  could find on the page. It is written here so the next reader starts from the reading rather than
  from the reference.
  (4) max_far is read against CDC 02.030''s own definition, at 02.definitions.txt#L440: "the FAR is that
  percentage of the total lot size that can be built as habitable space ... on a 10,000-square-foot lot,
  an FAR of 0.45 will allow a 4,500-square-foot house". Habitable floor area over lot area, which is
  what the screen computes; the definition excludes attached and detached garages, accessory dwellings
  and basements predominantly below grade, none of which this pod has.


  (5) And the denominator is not the lot. The same one sentence is printed in all nine zone chapters:
  "Type I and II lands shall not be counted toward lot area when determining allowable floor area
  ratio, except that a minimum floor area ratio of 0.30 shall be allowed regardless of the
  classification of lands within the property." Type I and II lands are the city''s habitat
  classification and nothing here holds their boundaries, so the four encoded FARs carry
  `measured_on` and the screen treats the lot''s own area as a bound: a pod already over the ceiling
  on the whole lot is over it on any part of it and still fails, and a pod that clears it is not
  certified. The 0.30 guarantee is a floor under what is allowed, on the whole property, so it can
  only loosen — read, and not encoded.


  (6) The Willamette Historic District, read and partly encoded. Two zone chapters hang an exception
  off the setback row -- "Except as specified in CDC 25.070(C)(1) through (4) for the Willamette
  Historic District" -- and the chapter it points at was the top of this jurisdiction''s
  cross-reference queue. Fetched and read 2026-08-20. It does three different things to this building
  and only one of them is a setback.


  The four subsections the row cites are looser than the base zone everywhere they differ: side five
  feet against R-10''s seven and a half, side street ten against fifteen, rear twenty against twenty.
  A qualifier that can only loosen is read and not encoded, which is the same reading item (5) takes
  of the 0.30 FAR floor. The front yard is the exception. 25.070(C)(1)(a) sets it to "the average of
  the front setbacks of adjacent homes on the block face", which is not a number and could land either
  side of the zone''s twenty feet, so R-10''s and R-5''s front setback carries `qualified_by` on the
  district rather than a figure.


  What the setback row does NOT cite is 25.070(C)(8): "No building shall exceed 35 feet in overall
  width." That subsection stands on 25.070(C)''s own applicability sentence rather than on the zone
  table, and it is the first standard in this corpus the pod fails on its own dimensions rather than
  on where it sits -- 56 ft by 36 ft is over 35 whichever way the building is turned, on a lot of any
  size. Encoded as `max_building_width_ft`: exempt outside the district, because 25.070(C) says in
  terms that it applies only inside it, and 35 ft within. The height cap in the same subsection, 28
  feet at 25.070(C)(7)(a), the pod clears at 26.


  READ AND NOT ENCODED, the narrative half. 25.070(B), "Standards for new construction", reaches new
  construction anywhere in a historic district and states no figure at all: massing, scale,
  proportion, form, siting, floor area ratio, window patterns, building divisions and height "shall
  correspond to the contributing buildings within the district". That is design review, decided by an
  approval authority against the block rather than against a number, and a screen that scored it would
  be inventing the finding. Its existence is the reason a district lot is a review lot even where the
  figures clear.


  READ AND NOT ENCODED from subsection (C), because no field holds them: (C)(5) orients new
  construction on a corner lot to the majority of homes on the longest block frontage; (C)(9) requires
  a roof pitch of at least 6:12, which a flat-roofed factory pod does not have; (C)(10)(a) requires
  garage access from an alley wherever one is present. And the relief path is not the usual one --
  25.080(A), "The provisions of Chapter 75 CDC, Variance, shall not apply to the standards in this
  chapter." A modification under 25.080(B) is discretionary and turns on historical records, which is
  a harder ask than a variance and a different one.'
ingest:
  geoid: null
  juris_city_codes:
  - WEST LINN
  zoning_layer: zoning_west_linn
  zone_field: DESIGNATION
  strip_lowercase_suffix: false
definitions:
  # "Corner lot. A lot or parcel abutting on two intersecting streets other
  # than an alley, excluding lots or parcels with boundary line angles greater
  # than 135 degrees."
  #
  # The fourth code in the corpus to state 135 degrees and the fourth wording
  # of it. "Excluding ... angles greater than 135" excludes the angles above
  # 135 and keeps 135 itself, which puts West Linn with Happy Valley,
  # Rivergrove and Troutdale, and against Multnomah County's "less than 135".
  #
  # It measures the *boundary line* angle rather than the angle of the streets,
  # which is the same vertex read from the lot instead of the right-of-way and
  # is how the angle is taken here anyway.
  corner_lot:
    test: intersecting_frontages
    count: 2
    max_intersection_angle_deg: 135.0
    quote: "or/clackamas/west-linn/02.definitions.txt#L177"
    cite: "West Linn CDC 2.030, Corner lot"

crossrefs:
  "54.020": >-
    Parking area landscaping, and it does not reach this building on two counts. The sentence is a
    CREDIT rather than a requirement -- "Trees planted or preserved to meet parking area
    landscaping requirements in CDC 54.020 may count toward the tree canopy cover percentage" --
    so it lets one planting satisfy two standards and can only mean fewer trees, never more. And
    the subsection it sits in is gated: 46.150.F opens "The following requirements apply to any
    new development that includes more than one-half acre of new off-street surface parking". The
    pod's whole court is four stalls and their aisle, on the order of two thousand square feet,
    which is an order of magnitude under the threshold. It ranked binding because it sits eight
    lines below the angle-parking table this layer draws its stall and aisle from -- proximity,
    not content. What is NOT settled here is Chapter 54 itself: it may well ask a parking area for
    landscaping somewhere, and this reference is simply not where it says so.
  "34": >-
    Accessory Structures, Accessory Dwelling Units, and Accessory Uses, and the twenty-two mentions
    are two sentences. Every zone chapter says "Accessory uses are allowed in this zone as provided by
    Chapter 34 CDC" and every zone chapter lists the chapter first among its related procedures. A
    quadplex is a primary use here -- "c. Quadplex residential units", a row under uses permitted
    outright in all nine chapters -- so nothing this screen places is an accessory anything, and the
    chapter is not fetched.
  "58": >-
    Willamette Falls Drive Commercial Design District. Its one binding mention is the second sentence
    of CDC 25.070(C), which sends the buildings that subsection does not reach there: "This subsection
    applies only to ... residential and historically residential properties in the Willamette Historic
    District. Other buildings are subject to the requirements in Chapter 58 CDC." This pod is four
    dwellings, so it is the residential half of that sentence and Chapter 58 is the branch it does not
    take. Not fetched for that reason and not for the usual one -- if the catalog ever holds a
    ground-floor-commercial design, this becomes a real gap.
  "60.070": >-
    Conditional-use lot sizing: "the appropriate lot or parcel size for a conditional use shall be
    determined by the approval authority at the time of consideration of the application". Its eight
    binding mentions are the body of each chapter''s own section headed DIMENSIONAL REQUIREMENTS,
    CONDITIONAL USES. A quadplex is permitted outright in every one of these zones, so the
    conditional-use path is not the path this building takes and the section never reaches it.
  "75": >-
    Variance. Every mention is an item in a zone chapter''s list of related procedures, beside Chapters
    34, 44 and 66 -- declined relief rather than a standard. Relief is modelled in the score stage, not
    encoded here: a pod one foot over a setback is a lot with an application attached. Worth recording
    that the historic district removes even that. CDC 25.080(A): "The provisions of Chapter 75 CDC,
    Variance, shall not apply to the standards in this chapter", and what stands in its place is a
    discretionary modification turning on historical records.
  "60.090": >-
    Type II transportation facilities -- "those which are not designated in the adopted TSP or part of
    an approved, active development order ... allowed in all zoning districts subject to conditional
    use approval and the additional criteria of CDC 60.090". A road, not a dwelling. Both binding
    mentions are inside Chapter 2''s definition of a transportation facility.
  "28.040": >-
    An exemption inside the definition of Development: within the Willamette and Tualatin River
    Protection Areas the term also reaches change of use, grading and vegetation removal "unless
    specifically exempted per CDC 28.040". An exemption list can only narrow what counts as
    development, so reading it cannot add a standard to this building. What Chapter 28 states about
    building inside a protection area is a separate gap and a real one -- the areas are boundaries
    nothing here holds, which is why the river chapters are unencoded. This reference is not what
    would close it.
  "66": >-
    Non-conforming Structures, and every one of the nineteen mentions is one of two sentences. Eight
    are the zone chapters' own list of related procedures ("2. Chapter 66 CDC, Non-conforming
    Structures"); the rest are the tail of the Type I and II lands sentence, which lets an existing
    house over the FAR be rebuilt to its prior dimensions after damage without a non-conforming
    structures permit. Neither reaches a new building on a lot, which is the only thing this screen
    places, so the chapter is not fetched.

code:
  # The CDC gives every residential zone its own chapter, and Code
  # Publishing serves each chapter as one server-rendered HTML page —
  # nine small documents instead of one code-sized one. Section numbers
  # inside chapter NN are NN.xxx, so each zone declares its chapter as
  # its section prefix. Host takes chrome124, refuses newer Chrome.
  - id: "25.willamette-historic"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC25.html
    title: "CDC Chapter 25 - Willamette and Willamette Falls Drive Historic Districts"
  - id: "02.definitions"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC02.html
    title: CDC Chapter 2 - Definitions
    # Prose about words: almost nothing dimensioned, which the thinness guard
    # reads as a landing page. Read 2026-08-18.
    allow_thin: true
  # Cited by the definition of "developable net area" in Chapter 2 and by
  # nothing this corpus had fetched: "the square footage subject to the
  # maximum and minimum density calculations in CDC 05.025". A density
  # calculation is a standard, and a standard nobody has read is not a
  # standard that passes.
  - id: "05.density"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC05.html
    title: "CDC Chapter 05 - Public Facility and Density Requirements"
    # Table 05.020 is where the nine maxima below come from. What this chapter
    # also states and this layer does NOT encode is the floor: 05.025.A.3,
    # "minimum density is determined by multiplying the maximum density by
    # 0.70". Every one of those nine minima is a product the code does not
    # print, and typing 6.09 against R-5 would cite a sentence for a number
    # the sentence does not contain. `reduce_pct` reduces a value the document
    # states and there is no stated minimum to reduce; a second derived key
    # for "a percentage OF another field" is the change that would encode
    # this, and it is not being made for one city. Left off, which is the
    # conservative direction: an unencoded floor is a check that does not run
    # rather than a lot wrongly called RED.
  # Every zone chapter hangs the same sentence off its height row: "Except
  # for steeply sloped lots, in which case the provisions of Chapter 41 CDC
  # shall apply." Nineteen mentions across nine chapters, ten of them beside
  # a number this screen uses, and it was the loudest unread reference in the
  # county. Fetched and read 2026-08-20: 41.005 is how height is measured on a
  # slope, 41.010 drops the garage front setback to three feet on a site
  # averaging 25 percent or steeper and holds everything else to the
  # underlying zone, and 41.020 lets a building on a slope exceed the zone's
  # height. Relief in all three directions and no new ceiling, so no value
  # cites it — it is held so the reference is read rather than open.
  # "A. The sidewall provisions of Chapter 43 CDC shall apply", printed under
  # every dimensional table in all nine chapters. Fetched and read 2026-08-20;
  # see the reading recorded in this layer's notes.
  - id: "43.sidewall"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC43.html
    title: "CDC Chapter 43 - Single-Family Residential Side-Yard Transitions"
    # Sixty-five lines of design prose with five numbers in it, which is what
    # the chapter is rather than a bad fetch. Read before declaring.
    allow_thin: true
  - id: "41.steep-lots"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC41.html
    title: "CDC Chapter 41 - Building Height, Structures on Steep Lots, Exceptions"
  - id: "08.r-40"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC08.html
    title: "CDC Chapter 08 - Low Density Residential R-40"
  - id: "09.r-20"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC09.html
    title: "CDC Chapter 09 - Low Density Residential R-20"
  - id: "10.r-15"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC10.html
    title: "CDC Chapter 10 - Low Density Residential R-15"
  - id: "11.r-10"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC11.html
    title: "CDC Chapter 11 - Low Density Residential R-10"
  - id: "12.r-7"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC12.html
    title: "CDC Chapter 12 - Low Density Residential R-7"
  - id: "13.r-5"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC13.html
    title: "CDC Chapter 13 - Medium Density Residential R-5"
  - id: "14.r-4.5"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC14.html
    title: "CDC Chapter 14 - Medium Density Residential R-4.5"
  - id: "15.r-3"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC15.html
    title: "CDC Chapter 15 - Medium High Density Residential R-3"
  - id: "16.r-2.1"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC16.html
    title: "CDC Chapter 16 - Medium High Density Residential R-2.1"
  # Every one of the nine zone chapters ends with the same list under "OTHER
  # APPLICABLE DEVELOPMENT STANDARDS": "The following standards apply to all
  # development including permitted uses", and item 7 is "Chapter 46 CDC,
  # Off-Street Parking, Loading and Reservoir Areas." Nine mentions, no
  # exceptions, no conditions. 6,791 lots here fit the pod -- the largest count
  # in the corpus behind Portland, Gresham and unincorporated Clackamas -- and
  # the site-plan generator lays out none of them, because a city that has not
  # stated a stall cannot be drawn on.
  - id: "46.parking"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC46.html
    title: "CDC Chapter 46 - Off-Street Parking, Loading and Reservoir Areas"
  # Item 8 of the same unconditional list, fetched in the same pass as item 7
  # and for the same reason. Chapter 46 states the stall and the aisle and says
  # nothing at all about how wide the drive reaching them may be; 48 is titled
  # Access, Egress and Circulation and is the only place left for it. Fetching
  # one without the other would encode a court nothing can be driven into.
  - id: "48.access"
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC48.html
    title: "CDC Chapter 48 - Access, Egress and Circulation"
defaults:
  # PARKING AND VEHICLE ACCESS, read 2026-08-27 out of Chapters 46 and 48,
  # which every one of the nine zone chapters lists under "OTHER APPLICABLE
  # DEVELOPMENT STANDARDS -- The following standards apply to all development
  # including permitted uses" as items 7 and 8. No conditions on either.
  #
  # One question decides most of this file, and West Linn never answers it:
  # IS A QUADPLEX ON ONE LOT "MULTIFAMILY" HERE? The word carries the stall
  # size, the parking ceiling and the driveway width, and it appears nowhere
  # in Chapter 2. What Chapter 2 does define is three neighbouring categories:
  # "Quadplex residential units. Four attached or detached dwelling units on a
  # lot or parcel in any configuration"; "Single-family attached residential
  # units ... attached side by side ... at a common property line ON SEPARATE
  # LOTS OR PARCELS. This may be further defined as a duplex, triplex, or
  # quadplex"; and single-family detached, one freestanding unit. A pod on one
  # undivided lot is the first and is neither of the others -- single-family
  # attached is defined by the property line running between the units, which
  # is the plat path, not this one.
  #
  # So it is multifamily by elimination, and two things confirm it rather than
  # leaving it an inference. Chapter 46 sets the two categories against each
  # other twice -- "Except for single-family attached and detached residences"
  # in (A)(6), and (A)(8) requiring a paved surface for single-family attached
  # and detached and then, separately, "All parking for multifamily
  # residential development shall be paved" -- so multifamily is the residual
  # residential category, not a fifth-and-up-unit one. And the maximum table
  # in 46.090(A) prints exactly two residential rows, multifamily studio and
  # multifamily non-studio; a reading that put quadplexes outside it would
  # leave the most ordinary housing in the city with no row at all.
  #
  # The reading fails the pod OUT wherever the two branches differ: it takes
  # the 24-foot multifamily service drive over the 14-foot one for "two to
  # four single-family residential homes". If the land is ever divided first,
  # the pod becomes single-family attached and the looser branch is the one
  # that applies -- worth knowing, because the plat path is already modelled.
  # (or/clackamas/west-linn/02.definitions.txt#L800,L947,L949,
  #  or/clackamas/west-linn/46.parking.txt#L241,L245)

  # NO MINIMUM. Not stated as an exemption anywhere -- West Linn simply
  # deleted the machinery. CDC 46.080, Computation of Required Parking Spaces
  # and Loading Area: "Repealed by Ord. 1754." CDC 46.100, Parking
  # Requirements for Unlisted Uses: "Repealed by Ord. 1754." What is left
  # under the heading OFF-STREET PARKING SPACE REQUIREMENTS is subsection A,
  # "Maximum parking", and two subsections about carpool striping and transit
  # redevelopment. Every remaining "minimum" in the chapter belongs to
  # something else: bicycle spaces, accessible-space ratios, reservoir depth
  # for drive-in service, the stall itself. No zone chapter states a parking
  # quantity either -- the whole-corpus grep returns nothing.
  #
  # This is Fairview's shape and Wilsonville's: a city that requires zero
  # stalls and still regulates every one you build. Encoding the zero is what
  # keeps the screen from inventing a requirement out of the fact that a
  # parking chapter exists.
  parking_min_per_unit:
    value: 0
    cite: West Linn CDC 46.080 (repealed), 46.090 (maximum only) and 46.100 (repealed)
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC46.html
    retrieved: '2026-08-27'
    quote: "or/clackamas/west-linn/46.parking.txt#L127,L129,L131,L133,L162,L164"
  # And a real maximum, which is the unusual half. 46.090(A): "Parking spaces
  # shall not exceed the following amounts", Multifamily non-studio, 2.0
  # spaces per unit. Eight stalls for this building, which is far above
  # anything a rear court would draw, so it never binds -- but it is a stated
  # ceiling and `exempt: true` would say the city has none.
  parking_max_per_unit:
    value: 2
    cite: West Linn CDC 46.090(A), Maximum parking, Multifamily non-studio row
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC46.html
    retrieved: '2026-08-27'
    quote: "or/clackamas/west-linn/46.parking.txt#L133,L135,L137"
  # THE STALL, from 46.150(A)(1), which packs three sizes into four sentences.
  # Eight by 16 is named "compact"; "to accommodate larger cars, 50 percent of
  # the parking spaces shall have a minimum dimension of nine feet in width
  # and 18 feet in length". Half the stalls must be the larger size, so the
  # larger size is what a court is dimensioned to -- a lot that seats four
  # 9 by 18 stalls seats any lawful mix, a lot sized to 8 by 16 throughout
  # seats none. Same direction of error as unincorporated Clackamas, and for
  # the same reason.
  #
  # The third size is the one that had to be argued. "When multifamily parking
  # stalls back onto a driveway, as opposed to a drive aisle within a parking
  # lot, the stalls shall be nine feet by 20 feet." Multifamily is settled
  # above, so the whole clause turns on which side of that contrast the pod's
  # court sits, and the answer is not a guess: the site-plan generator draws a
  # side driveway and, separately, a rear court of 90-degree stalls served by
  # its own aisle, and counts the two as separate pavement. Stalls there back
  # onto a drive aisle within a parking lot, which is the branch the sentence
  # excludes. West Linn's own text expects that court to exist -- (A)(6) makes
  # a multifamily development stripe its spaces and sign "all interior drives
  # and access aisles", and (A)(11) speaks of "the boundaries of a parking
  # lot". If the catalog ever draws a plan whose stalls back straight onto the
  # entry drive, the depth here is 20 and the citation is the same line.
  #
  # Figure 2 checks the reading from the other side: at 90 degrees drive-in
  # with a 9.0' stall width it prints dimension 'A' -- the stall depth -- as
  # 18.0', and dimension 'B' as 9.0'. The table and the sentence agree.
  parking_stall_width_ft:
    value: 9
    cite: West Linn CDC 46.150(A)(1), and Figure 2 (90 degrees, drive-in, 9.0' stall)
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC46.html
    retrieved: '2026-08-27'
    quote: "or/clackamas/west-linn/46.parking.txt#L231,L376-L378,L383"
  parking_stall_depth_ft:
    value: 18
    cite: West Linn CDC 46.150(A)(1), and Figure 2 dimension 'A' (90 degrees, drive-in, 9.0' stall)
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC46.html
    retrieved: '2026-08-27'
    quote: "or/clackamas/west-linn/46.parking.txt#L231,L376-L378,L383"
  # THE AISLE, from the same figure, and West Linn states it by angle and by
  # how the car enters rather than by which way traffic runs: 90 degrees
  # drive-in, 23.0'; 90 degrees back-in, 22.0'. Both columns of stall width
  # give 23.0 at drive-in, so the figure does not move with the stall. There
  # is no one-way and no two-way row anywhere in the chapter, so one number
  # answers for both -- Fairview's shape, where 24 is the answer to both
  # questions because only one was asked. Twenty-three is Gresham's aisle.
  #
  # Drive-in rather than back-in because a car that drives in leaves in
  # reverse and needs the wider aisle to do it, and nothing in the catalog
  # obliges a resident to back into a stall. The larger of the two, either
  # way.
  parking_aisle_one_way_ft:
    value: 23
    cite: West Linn CDC 46.150(E), Figure 2, Minimum Distance for Parking Stalls (90 degrees, drive-in)
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC46.html
    retrieved: '2026-08-27'
    quote: "or/clackamas/west-linn/46.parking.txt#L370,L374,L376-L378,L383"
  parking_aisle_two_way_ft:
    value: 23
    cite: West Linn CDC 46.150(E), Figure 2, Minimum Distance for Parking Stalls (90 degrees, drive-in)
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC46.html
    retrieved: '2026-08-27'
    quote: "or/clackamas/west-linn/46.parking.txt#L370,L374,L376-L378,L383"
  # THE DRIVE THAT REACHES IT, from Chapter 48, which Chapter 46 never
  # mentions and every zone chapter requires. 48.030(E): "Access and/or
  # service drives for multifamily dwellings shall be fully improved with hard
  # surface pavement: 1. With a minimum of 24-foot width when accommodating
  # two-way traffic; or 2. With a minimum of 15-foot width when accommodating
  # one-way traffic."
  #
  # Twenty-four is the figure that binds, because a single side lane into a
  # rear court carries traffic both ways unless a loop is drawn, and no loop
  # fits beside a 56-foot pod. It is Happy Valley's 20 plus four, and it is
  # wider than the side yard on a great many of these lots -- which is the
  # honest answer, not a discouraging one. The alternative branch for "two to
  # four single-family residential homes" asks 14 to 20 feet, and the
  # definitions above are why this file does not take it.
  driveway_min_width_two_way_ft:
    value: 24
    cite: West Linn CDC 48.030(E)(1) (access and service drives for multifamily dwellings)
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC48.html
    retrieved: '2026-08-27'
    quote: "or/clackamas/west-linn/48.access.txt#L129,L131"
  driveway_min_width_one_way_ft:
    value: 15
    cite: West Linn CDC 48.030(E)(2) (access and service drives for multifamily dwellings)
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC48.html
    retrieved: '2026-08-27'
    quote: "or/clackamas/west-linn/48.access.txt#L129,L133"
  # THE CURB CUT, from 48.060, and it is the rare pair stated flatly with no
  # use, no zone and no street attached: "A. Minimum curb cut width shall be
  # 16 feet. B. Maximum curb cut width shall be 36 feet." The floor is the
  # interesting one -- most cities in this corpus state only a ceiling, and a
  # 16-foot minimum means a pod cannot economise its approach down to a
  # single-car width to save a side yard.
  #
  # The Highway 43 exception raises the ceiling to 40 and applies to one
  # highway; a looser number on one frontage cannot fail a lot the 36 passes,
  # so it is left out rather than carried as a variant nothing could select.
  driveway_approach_min_width_ft:
    value: 16
    cite: West Linn CDC 48.060(A)
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC48.html
    retrieved: '2026-08-27'
    quote: "or/clackamas/west-linn/48.access.txt#L173,L175"
  driveway_approach_max_width_ft:
    value: 36
    cite: West Linn CDC 48.060(B)
    url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC48.html
    retrieved: '2026-08-27'
    quote: "or/clackamas/west-linn/48.access.txt#L173,L177"
  #
  # NOT ENCODED: curb cut spacing, 48.060(C) and (D). Eleven numbers between
  # them and every one is selected by a street classification -- 150 feet from
  # an intersecting arterial, 100 from a collector, 35 on a local street, 30
  # between two cuts on the same lot. This corpus holds no street
  # classification for any parcel, and the local-street figures are the small
  # ones, so guessing "local" would be the permissive guess on exactly the
  # lots where it is wrong. The same shape as Oregon City's refused driveway
  # spacing, in a city that states it in more detail.
  # (or/clackamas/west-linn/48.access.txt#L179,L193)
  #
  # NOT ENCODED: the alley-first rule, 48.025(B)(3)(a). "Option 1. Access is
  # from an existing or proposed alley or mid-block lane. If a property has
  # access to an alley or lane, direct access to a public street is not
  # permitted." Not a width and not a setback -- it moves the driveway to the
  # other side of the lot, which changes the whole plan. Gresham's is refused
  # for the same reason and it is the same missing fact: nothing here knows
  # whether a parcel abuts an alley.
  # (or/clackamas/west-linn/48.access.txt#L55)
  #
  # NOT ENCODED: grade limits on the vehicle areas, of which West Linn states
  # three. The driveway centerline is held to 15 percent, stated twice -- CDC
  # 46.150(A)(15) and 48.030(B)(3) -- with the last 18 feet before a garage
  # held to 12; and 46.150(A)(17) holds the stalls themselves to "less than a
  # five percent grade". Slope is measured per parcel by the pipeline that
  # consumes this file, so this is not a missing measurement so much as a
  # missing carrier: no field holds a grade limit, and the two that matter
  # apply to shapes that do not exist until a plan is drawn -- a driveway
  # centerline and a court floor, not the lot. The five percent is the
  # sharper of the two. A rear court is a single graded plane roughly 40 by
  # 60 feet, and five percent across it is a fall of three feet; a hillside
  # lot in West Linn can pass every dimension in this file and still need the
  # court benched into the slope before a stall can sit on it.
  # (or/clackamas/west-linn/46.parking.txt#L261,L265, or/clackamas/west-linn/48.access.txt#L113)
  #
  # NOT ENCODED: the horizontal clearance beside a one-way drive, 48.030(E)(2)
  # -- "two and one-half feet wide on either side of the driveway", which
  # makes a 15-foot one-way drive a 20-foot corridor. The field carries
  # pavement width and adding five feet to it would misstate the pavement for
  # anything that sums area. It does not bind the layout drawn here, whose
  # side lane is two-way, and it would bind a one-way loop.
  # (or/clackamas/west-linn/48.access.txt#L133)
  #
  # Read and NOT a constraint, recorded so the next reader does not re-open
  # them: 46.150(A)(8) requires 20 feet of driveway between the back of
  # sidewalk and the garage or the end of the parking pad, which a rear court
  # clears by the depth of the building; 46.150(B) applies the accessible
  # parking table only "if any parking is provided for the public or
  # visitors", and four residents' stalls are neither; 46.150(F) applies tree
  # canopy and landscaping to "more than one-half acre of new off-street
  # surface parking", roughly twenty times this court; and 48.020(A) stands
  # the whole chapter down where the Transportation System Plan or the land
  # division chapter "set forth different standards", which is a door this
  # screen cannot see through and which can only be opened by an application.
