  "02.definitions.txt#02.030":
    queue: condition
    outcome: never
    note: >-
      West Linn's definitions chapter, and eight statements that define words rather than state
      standards. The cottage cluster definition (at least four detached units per acre, each under
      a stated footprint) describes a housing type this screen does not place. The flag lot
      definition names a lot that does not meet the minimum street frontage, which is a shape the
      parcel data can hold but not a rule the pod must meet -- whatever standard applies to a flag
      lot lives in the development code, not in the glossary entry. The FAR definition explains
