      # Table 05.020's third column, headed "Dwelling Units per Net
      # Acre". The header is quoted with the row because the table puts
      # one zones on one line and the number alone would not say which
      # column it came from.
      #
      # 05.025.A.2 is the operative sentence and the table restates it:
      # "Maximum density is determined by dividing the developable net
      # area square footage by the zoning district minimum lot size square
      # footage" -- here 40,000 sq ft. What is NOT carried is the rest of
      # that sentence, "where a maximum density calculation results in a
      # fraction it is rounded down to the next whole number", which is a
      # rounding this screen has nowhere to put. Rounding down is the
      # stricter direction, so the encoded rate is the looser reading and
      # a lot near the boundary can pass here and fail at the counter.
      #
      # On the whole-building path the state cancels this outright --
      # OAR 660-046-0220(2)(b), and West Linn is inside Metro. It is
      # encoded because it still governs the split plat, where the pod is
      # townhouses and the state stands down.
      value: 1.1
      # 05.025.A.1: developable net area is the gross less Type I and II
      # lands, land dedicated for parks, public rights-of-way and proposed
      # private streets -- and optionally heritage and significant trees.
      # Nothing measures any of those, so the lot's own acre is a bound
      # rather than the denominator.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list: a definition that defers -- "the square footage subject to the
      # maximum and minimum density calculations in CDC 05.025". The
      # subtractions are in that section rather than in the glossary, and
      # the gross figure beside it is the bound.
        cite: CDC 02.030 "Developable net area"; CDC 05.025
        quote: "or/clackamas/west-linn/02.definitions.txt#L197,L199"
      cite: "West Linn CDC 05.020 (classifications of zones) and CDC 05.025.A (density calculations)"
      url: https://www.codepublishing.com/OR/WestLinn/html/WestLinnCDC/WestLinnCDC05.html
      retrieved: '2026-08-19'
      quote: "or/clackamas/west-linn/05.density.txt#L29,L31"
    min_lot_width_ft:
      value: 150
      quote: "or/clackamas/west-linn/08.r-40.txt#L140"
    max_coverage_pct:
      value: 25
      quote: "or/clackamas/west-linn/08.r-40.txt#L167"
    notes: 'quadfit confidence: verified | Detached SFD + quadplex outright. Coverage 25% applies to quadplex
      (only cottage clusters exempt). Corner side-yard read as 30 ft.'
    max_far:
      # This zone's FAR row exempts cottage clusters and nobody else, so the
      # 0.45 is the pod's ceiling: 4,032 sq ft of floor over two storeys wants
      # 8,960 sq ft of lot. That clears the zone's own minimum comfortably and
      # binds only on an undersized lot, which is what a screen over existing
      # parcels mostly sees.
      value: 0.45
      quote: "or/clackamas/west-linn/08.r-40.txt#L175,L176"
      measured_on:
        fact: net_developable_area
        # Not the density net area: this chapter's own subtraction, one item
        # long. "Type I and II lands shall not be counted toward lot area when
        # determining allowable floor area ratio" — the city's habitat
        # classification, which nothing here holds. The lot's own area is a
        # bound on it, so a FAR that already exceeds the ceiling on the whole
        # lot exceeds it on any part, and a FAR that clears it does not settle.
        #
        # The same sentence guarantees "a minimum floor area ratio of 0.30
        # ... regardless of the classification of lands within the property",
        # based on the whole property. That is a floor under what is allowed
        # and can only loosen, so it is read and not encoded.
        cite: 'West Linn CDC 08.070, Type I and II lands'
        quote: "or/clackamas/west-linn/08.r-40.txt#L178"
    max_height_ft:
      value: 40
      quote: "or/clackamas/west-linn/08.r-40.txt#L163"
