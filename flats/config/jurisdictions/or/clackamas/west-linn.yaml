      sentence beside it -- basements exempt from FAR where less than 50 percent is exposed above
      grade -- subtracts from counted floor area, so it can only lower a ratio and never raise it.
      A definition that makes a standard looser is still a definition.
    fingerprint: c74f285bb0e1a663
  "41.steep-lots.txt#41.020":
