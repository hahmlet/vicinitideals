definitions:
  # Read 2026-10-07 from EMC 16.08, on disk.
  #
  # THE NOUN. "Fourplex means a single building on its own lot with four
  # dwelling units" (emc.16.08.txt L136); "Multi-family dwelling means a single
  # building, or a portion thereof, on its own lot, that contains five or more
  # dwelling units" (L148). So the pod is a fourplex, never a multi-family
  # dwelling, and the "multi-family" lines of the use tables do not reach it.
  # "Commonwall dwelling means a dwelling on its own lot which shares at least
  # one wall ... with another dwelling on an abutting lot" (L130) is the
  # unit-lot path.
  #
  # CORNER LOT. "A lot abutting on two or more streets ... if straight lines
  # ... meet at an interior angle of less than 135 degrees" (L240).
  #
  # FRONT LOT LINE ON A CORNER LOT. "In the case of a corner lot, the shortest
  # property line along a street, other than an alley" (L250). "All sides of a
  # lot adjacent to a street other than an alley shall be considered frontage,
  # and setbacks shall be provided as indicated" (L244): the street side takes
  # the front setback.
  corner_lot:
    test: intersecting_frontages
    max_intersection_angle_deg: 135.0
    quote: "or/clackamas/estacada/emc.16.08.txt#L240"
    cite: "Estacada EMC 16.08.010, Lot, corner"

private_drives:
  street: true
  quote: "or/clackamas/estacada/emc.16.08.txt#L390"
  says: "a public or private way created to provide ingress to, or egress from"
  cite: "Estacada EMC 16.08.010, Road (the terms street, access drive and highway are synonymous with road)"
  note: >-
    "Road" is "a public or private way ... The terms street, access drive and
    highway ... shall be synonymous with the term road" (L390), so a private
    drive the lot abuts is a street for the yards. A doubt.

defaults:
  # PARKING COUNT. 16.76.010 table: triplex and fourplex 1.5 for each dwelling
  # unit rounded up (L77-L78); commonwall 2 for each commonwall dwelling
  # (L80-L81). The one-building pod is six stalls; four townhouse lots eight.
  parking_min_per_unit:
    value: 1.5
    cite: Estacada EMC 16.76.010, triplex and fourplex 1.5 for each dwelling unit, rounded up
    url: https://estacada.municipalcodeonline.com/book/print?type=ordinances&name=Title_16_DEVELOPMENT
    retrieved: '2026-10-07'
    quote: "or/clackamas/estacada/emc.16.76.txt#L77,L78"
    variants:
      - value: 2
        when: [unit_lots]
        cite: Estacada EMC 16.76.010, commonwall dwellings 2 for each dwelling
        quote: "or/clackamas/estacada/emc.16.76.txt#L80,L81"
  # THE STALL. 16.08.010: "not less than eighteen (18) feet by eight (8) feet,
  # exclusive of maneuvering and access area" (L318). The code prints no aisle
  # or driveway width for a dwelling court, so none is stated here.
  parking_stall_width_ft:
    value: 8
    cite: Estacada EMC 16.08.010, Parking space, not less than eighteen feet by eight feet
    url: https://estacada.municipalcodeonline.com/book/print?type=ordinances&name=Title_16_DEVELOPMENT
    retrieved: '2026-10-07'
    quote: "or/clackamas/estacada/emc.16.08.txt#L318"
  parking_stall_depth_ft:
    value: 18
    cite: Estacada EMC 16.08.010, Parking space, not less than eighteen feet by eight feet
    url: https://estacada.municipalcodeonline.com/book/print?type=ordinances&name=Title_16_DEVELOPMENT
    retrieved: '2026-10-07'
    quote: "or/clackamas/estacada/emc.16.08.txt#L318"
  front_lot_line_corner:
    value: shortest
    cite: Estacada EMC 16.08.010, Lot line, front, in the case of a corner lot the shortest property line along a street
    url: https://estacada.municipalcodeonline.com/book/print?type=ordinances&name=Title_16_DEVELOPMENT
    retrieved: '2026-10-07'
    quote: "or/clackamas/estacada/emc.16.08.txt#L250"
  # WHICH STREET THE DRIVEWAY USES. 16.116.020 (C): a lot on two or more
  # streets of different classes connects its access point to "the road of
  # the lesser classification", unless topography or natural features make
  # that impractical.
  corner_access_street:
    value: lowest_class
    cite: Estacada EMC 16.116.020 (C), the access point shall connect with the road of the lesser classification
    url: https://estacada.municipalcodeonline.com/book/print?type=ordinances&name=Title_16_DEVELOPMENT
    retrieved: '2026-10-07'
    quote: "or/clackamas/estacada/emc.16.116.txt#L31"

# NOT ENCODED, read 2026-10-07:
# - Minimum residential density (16.60.070): it binds residential
#   subdivisions and new multi-family (five or more units) development. A
#   one-lot fourplex is neither. The unit-lot path is a land division, where
#   half the maximum density applies; the screen draws a one-lot plat.
# - The 20 ft garage-door front setback (C-2, R-3, CMU): the pod carries no
#   garage.
# - Public-utility-easement width on a side line (greater than 5 ft when an
#   easement exists on the side line): the screen does not know the width.
# - Geotechnical analysis at 33 percent slope or a mapped hazard (16.68.030).
# - The Airport Safety and Compatibility overlay (16.54), Historic
#   Resources (16.48) and Wetlands Resources (16.56) overlays: not held by
#   FLATS for Estacada beyond the statewide flood and wetland layers.
# - Planning-staff and conditional-use procedure (16.88, 16.132): the
#   outright uses carry no hearing; the pod is treated as outright where the
#   use table lists it.

