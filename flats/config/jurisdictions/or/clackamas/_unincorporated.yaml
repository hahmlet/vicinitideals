    quadplex_allowed:
      # Table 315-1, Quadplexes row, fifth column. A bare P: no note 7, no
      # note 8. The absence of note 8 does not take Section 845 away -- 845
      # states its own scope and states no district limitation, which is
      # checked below at `min_lot_sqft` -- it just means this cell does not
      # signpost it.
      value: true
