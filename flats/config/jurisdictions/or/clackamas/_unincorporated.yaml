  # --- Table 315-4: PMD, MR-1, MR-2 and VA ---------------------------------
  #
  # One table, seven districts, seven cells in every row. The county writes
  # this one as an HTML flow table -- each cell on its own line -- and it is
  # the shape that loses blanks, so every row was counted before any of it was
  # read: eight rows, seven cells each, no ragged row anywhere in it. Position
  # is therefore load-bearing and safe, and each value below quotes its whole
  # row so a reviewer can count to the column rather than trust that I did.
  #
  # THREE THINGS THIS TABLE DOES THAT TABLE 315-2 DOES NOT.
  #
  # It states no height. PMD, MR-1 and MR-2 print "None" in the Maximum
  # Building Height row, and Section 845 -- which governs how a quadplex is
  # designed here -- states no height either. So the ceiling that binds a pod
  # in every R zone in this county simply does not exist in these three, and
  # `exempt: true` is the honest encoding rather than a number withheld.
  #
  # DENSITY: the county states one here and it is NOT ENCODED, for two
  # independent reasons, and the first is a gap in this model rather than a
  # judgement about the code.
  #
  # ZDO 1012.04(A) is the county exempting a quadplex from district land area,
  # and it lists the districts it reaches: "in the R-5, R-7, R-8.5, R-10,
  # R-15, R-20, R-30, VR-4/5, or VR-5/7 District". None of these four is on
  # that list. So by the county's own text the DLA row of Table 315-4 governs
  # this building: 3,630 square feet per dwelling unit in PMD and MR-1, 2,420
  # in MR-2, 1,500 in VA, and 1012.05 divides net site area by it to get a
  # maximum unit count. In MR-1 four units would want 14,520 square feet of
  # net site area against the 7,000 Section 845.01 asks -- twice the lot size
  # standard, and the number that would decide.
  #
  # THE FIRST REASON IT IS NOT ENCODED. This model has one density field,
  # `max_density_du_per_acre`, and the county does not print a density. It
  # prints a lot area per dwelling unit. 43,560 / 3,630 = 12 is arithmetic we
  # would be doing, not a figure on the page, and the column ledger refuses it
  # in those words -- "encoded 12.0, its own column reads '3,630 square feet'"
  # -- which is the ledger working. A field for a minimum lot area per
  # dwelling unit is the thing missing, and inventing the conversion instead
  # would put a number in the corpus that no Clackamas document contains.
  #
  # THE SECOND. It could not bind even if it were held: OAR 660-046-0220(2)(b)
  # forbids applying a density maximum to a quadplex, `preempts: always`, and
  # this layer is inside that rule. That was nearly called wrong here.
  # -0010(1) states the division's reach in one sentence -- "A local
  # government that is a Medium City or Large City must comply with this
  # division" -- and an unincorporated county is neither, which is the answer
  # the applicability rule gives and it is the wrong one. The definition is in
  # -0020: "A Large City includes unincorporated areas of counties within a
  # metropolitan service district that are provided with sufficient urban
  # services." Urban unincorporated Clackamas is inside Metro.
  #
  # So the refusal costs nothing today and would cost everything if Oregon
  # changed its mind. It is written into each zone's notes with the cell
  # quoted, which is where this corpus keeps a standard it read and cannot
  # hold.
  #
  # Parking is per bedroom, not per unit. Table 1015-2's Quadplex row sends
  # every one of these districts to the Multifamily Dwelling rows, which price
  # a studio or one-bedroom at 1, a two-bedroom at 1.25 and a three-bedroom at
  # 1.5. The design catalog holds no bedroom count -- a Design has units,
  # storeys, footprint and parking geometry and no room schedule -- so the
  # discriminator is unmeasured and the largest of the three printed figures
  # is the one encoded.
  #
  # This is the first place in the corpus where the state parking cap actually
  # bites. OAR 660-046-0220(2)(e)(B) caps a quadplex at four spaces in total
  # with `preempts: cap`, and in every R zone in this county the county's own
  # figure is 1 per unit, which is the cap -- the two land on the same number
  # and nothing is being held back. Here the county asks six spaces for four
  # units and the state allows four, so the resolved 1.0 is the state's number
  # overriding the county's, not the county's own. Six stalls against four is
  # roughly 200 square feet of court, which is the difference between a pod
  # that fits and one that does not on a small lot.
