label: Clackamas Unincorporated
kind: unincorporated
eligible: true
notes: 'Table 315-2 (R-2.5 through R-30) read against the adopted ZDO on 2026-08-14: front 15,
  garage/carport vehicle entry 20, side 5, rear 20, coverage 50%, identical in all eight districts,
  each value quoted to its own cell. The front setback cell states two standards at once ("15 feet,
  except 20 feet to garage and carport motor vehicle entries") and both are now encoded. The
  footnotes on those cells are alternate regimes, not conditions on these numbers: a planned unit
  development has no minimum rear or side setback and 65% coverage (fn 6, 11), a zero-lot-line
  development none either (fn 11), a middle housing lot measures coverage on the parent lot (fn 5)
  and setbacks from the parent lot lines (fn 9), and a lot of record of 6,000 sq ft or less created
  before the district applied gets rear 10 / side 5 total (fn 10). None of those is encoded.
  VR45 and VR57 are quoted as of 2026-08-16. Table 315-3 does merge cells across its three zone
  columns, but how many values a row prints settles what can be read from it: a three-value row is
  positional and nothing is merged (front, maximum front, side), and a two-value row whose values
  are identical gives the same answer whichever column the merge covers (rear 15 and 15, coverage
  50 and 50). The one row that is genuinely two DIFFERENT values under three columns -- minimum lot
  size -- is left unencoded in both zones and the reading is written out in their notes. UNPORTED:
  orientation_constraint=''entrance_only'', which quadfit justified in a YAML comment with no citation.

  HEIGHT, read 2026-08-20. All nine of this layer''s zones permitted a quadplex and stated no height,
  so the screen was placing a 26 ft building against no ceiling in every one of them. Table 315-2
  answers seven and Table 315-3 answers two, all at 35 feet. Section 845, which governs how a
  quadplex here is designed, states no height of its own, so the district table is the whole of it.

  Table 315-2''s height row prints TWO cells per district and only the second reaches this building:
  accessory buildings over 500 square feet take 20 feet or the primary dwelling, and "All other
  buildings, including accessory dwelling units" take 35. Neither sub-line carries a footnote marker.
  Table 315-3''s three cells each carry note 9, which relieves one platted subdivision (Sieben Creek
  Estates) of the standard and expressly excludes middle housing developed under Section 845 from
  that relief. A quadplex is middle housing under 845, so the note cannot loosen this ceiling.

  That note had to be read by hand, because when the heights were encoded nothing could read it.
  zdo.315.txt was the corpus''s worst unreconciled document -- 305 footnote markers and ZERO bodies
  -- so the footnote gate governed nothing in this layer and would have let every value here certify
  under notes nobody had read. It was silent because it was blind, not because the notes were clean.

  FOOTNOTES, read 2026-08-21. All 77 notes ruled in
  flats/config/footnotes/or/clackamas/_unincorporated.yaml. Four readers were blind in series here.
  The county writes each table''s notes as an HTML ordered list, whose numbers the browser draws and
  the text never carries, so ten bodies were stored stripped of the only thing tying them to a
  marker. The notes that did keep their numbers arrived as "9 Except for middle housing", one space
  and no heading, which is the one run shape the census declined. Table 315-1''s note 1 introduces
  its own criteria and they restart at 1, so the block headed where the inner list did and read four
  sub-criteria as notes 1 to 4, stopping short of notes 7 and 8. And those two are the notes printed
  on the Quadplexes cell itself -- which arrives from an HTML table as the four characters "P7,8",
  one permission code on a line of its own, below the bar the marker reader sets for believing a
  line is a table row. The permission for this building in all nine districts was governed by a pair
  of notes nobody had read. The gate now governs 64 values here and blocks none of them.

  Nothing in those 77 notes moved a number. The relief in this chapter is for other housing types
  (the lot-of-record exceptions name detached dwellings, duplexes, manufactured homes, prefabricated
  structures and single room occupancies -- a quadplex is none of them), for other application paths
  (a planned unit development or a zero-lot-line development), or for the split plat. One note is
  worth carrying forward, and one nearly went the other way. Table 315-3 note 12 ends "do not apply
  to cottage clusters developed pursuant to Section 845, Triplexes, Quadplexes, Townhouses, and
  Cottage Clusters", which reads as four building types and would lift the 18 ft maximum front
  setback off this pod. Those four are the TITLE of Section 845, printed that way nine times in this
  document; the relief runs to cottage clusters alone and the maximum binds. Note 15 makes frontage on an accessway a front lot line, which turns a 5 ft side into
  a 10 ft front on whichever face it lands; an accessway is not a street and no layer here answers
  it, so it is `unmeasured` against the `abuts_accessway` condition and caps the VR zones.


  PARKING, read 2026-08-27, and the reason it was read first: 18,662 lots here fit the pod, the
  third largest count in the corpus, and the site-plan generator lays out none of them, because a
  city that has not stated a stall and an aisle cannot be drawn on. Four of the five numbers are
  now in. The fifth is not gettable.

  Table 1015-2 asks a quadplex for one space per dwelling unit in both of the columns this layer
  reads -- "R-5 through R-30" and "VR-4/5 & VR-5/7" -- and the Quadplex row fills all nine of its
  columns, so it is positional and nothing is merged. Section 845, which Table 315-1''s note 8 sends
  this building to for everything, states no parking quantity and no stall of its own; the general
  chapter governs, and the county shows it knows how to say otherwise, because the bicycle table
  three subsections down excepts "quadplexes not developed pursuant to Section 845" by name.

  That cell is why the extractor is at flats-html-text/7. The county marks it `1<sup>3</sup>`, and
  until the extractor learned to hold a superscript apart from the text beneath it, the store held
  "13" -- thirteen spaces per dwelling unit. The marker that would have shown the join was the thing
  that got eaten, so nothing downstream could have caught it. Six hundred and twenty-four numeric
  superscripts across the corpus, every one a footnote marker and not one an exponent.

  The stall is 9 by 18 and the ZDO says 8.5 by 16, and both are true. 1015.02(A)(2) states a floor;
  (A)(4) immediately hands curb length, stall depth and aisle width to the Roadway Standards, whose
  320.5(a) requires dimensions to "meet the ZDO and Roadway Standard Drawing P100 or P200". P100 is
  titled "(9'' x 18'')" and P200 "(8.5'' x 16'')", so the county publishes two stalls and the ZDO''s
  floor is the smaller. (A)(3) settles which is which by requiring at least a quarter of the spaces
  to be no larger than 8.5 by 16 -- a compact rule. Four spaces, at least one compact, and no rule
  choosing the size of the other three, so the larger is encoded: a lot holding four 9-by-18 stalls
  holds any lawful mix, and the error runs toward calling a lot too tight rather than calling one
  buildable that is not.

  The aisle is the one that cannot be had, and it is a refusal shape this corpus has not carried.
  The chain is complete and it terminates in a picture: the ZDO points at the Roadway Standards, the
  Roadway Standards point at Standard Drawings P100 and P200, and both sheets are now declared,
  fetched and stored -- three lines each, because a CAD sheet''s only extractable text is its title
  block. The stall survives in that title. Every other dimension on those sheets, the drive aisle
  above all, is drawn. Somebody with the sheet open closes this in five seconds; nothing here can.
  Until then unincorporated Clackamas produces no site plan, which is the honest outcome rather than
  a failure.


  COMMERCIAL AND MIXED USE, read 2026-09-08 out of ZDO Section 510, and it is the loosest
  land this layer holds rather than the tightest. Table 510-1 marks the Quadplexes row P in
  nine of the eleven urban commercial and mixed-use districts. The pod is a listed, permitted
  use on most of this land, which is the opposite of what the rural half said one commit
  earlier and worth saying out loud: a chapter is not read to confirm a refusal.

  Three districts are encoded and all three are refusals, because they are the three the
  table itself closes. NC and C-2 read X, and 510.03(2) makes an X mean it -- "If a use is
  identified in Table 510-1 as prohibited, it is prohibited even if it also falls within a
  broader use description that is permitted". OA reads L[15], which is a permission for a
  quadplex inside somebody else''s building and not for one standing on its own lot: "L"
  means a limited use developed concurrently with or after a primary use, note 15 says
  quadplexes "may be developed in the same building as a primary use", and the OA column
  head carries notes 2 and 3, which require 60 percent of a site''s building floor area to
  be primary uses and cap limited uses at 40. Sixty-six lots between the three.

  The door that had to be checked before any of that could be believed is note 11, and
  nothing but the row walk finds it. It is printed on the group heading "Dwellings[11],
  including:", two rows above the quadplex cells, and it says a dwelling "not otherwise
  permitted in the applicable zoning district may nonetheless be permitted if they are
  developed as affordable housing" under Section 846. That is a real way back into NC and
  C-2, and it turns on what is built rather than on the lot; this product is market rate, so
  the prohibition is the answer for it. Every marker in Table 510-1 was resolved to its row
  the same way: of forty-four notes, six reach a dwelling row and thirty-eight are printed on
  drive-thrus, hotels, manufacturing, parking structures and the like.

  The same walk found the note that had gone quietly wrong. Note 11 is word for word Section
  315''s note 6, and a ruling binds to the sentence, so Section 315''s reason was already
  answering it -- and that reason was "a quadplex is already permitted outright in all nine
  districts, so the door is one this building has no need of". True there, false here. Four
  shared reasons in the footnote register were rewritten to be about the sentence rather than
  about one table.

  THE OTHER EIGHT DISTRICTS ARE NOT REFUSED AND ARE NOT YET ENCODED, and the reason is one
  sentence printed twice. Table 510-1 notes 12 and 14 say that a freestanding quadplex "(as
  opposed to ... quadplexes in a mixed-use building)" takes the development and dimensional
  standards of the RCHDR District (RCC, RCO) or of the HDR District (RTL, CC, C-3, OC).
  Freestanding is the only kind this building is. So 896 lots of commercial land depend on
  two residential districts this layer has never encoded, and encoding them is the whole of
  the remaining work here. SCMU is a third shape: Table 510-2 omits it from the header while
  every data row carries eleven cells, and its eighth cell is not a number but "See
  Subsection 1005.09", the Fuller Road Station Community standards. PMU is a fourth -- Table
  510-3 states its requirements site by site, six sites with six different minimum lot sizes.

  ZDO Section 1005 is fetched and declared for that reason, and it holds a shape the value
  model cannot express. Subsection 1005.02(L), which governs in exactly the HDR, RCHDR and
  SHD Districts the two notes point at, sets the distance from a building to a site area line
  by drawing an angle from the top of the building: 60 degrees to the north, 15 degrees east
  and west, the second printed as a formula -- "Separation = b x .267 (tan 15 degrees)". A
  setback that is a function of building height AND of which way a lot line points is not a
  number, and it needs the bearing of every line, which nothing here measures. 1005.02(L)(4)
  closes the obvious escape: these standards are not modifiable under Section 904, Height
  Exceptions. That is the same missing measurement the HDR and VTH districts were already
  waiting on, now with its source read rather than guessed at.

  Tables 510-2 and 510-3 are captured and their twenty-seven notes are deliberately left
  UNREAD. Nothing is encoded from either, so neither block governs a value, and eleven of
  them are live site conditions on a setback or a height -- "If the rear lot line abuts a
  residential zoning district, the minimum shall be 15 feet." Dismissing those today would
  be an amnesty collected by whoever encodes a dimension here tomorrow. Unread blocks, which
  is what unread is for.'
ingest:
  geoid: null
  juris_city_codes:
  - UNINCORPORATED
  - ''
  zoning_layer: zoning_metro
  zone_field: ZONE
  strip_lowercase_suffix: false
readings:
  "zdo.1015.txt#1015.03":
    queue: missed
    outcome: not_here
    note: >-
      Two blocks, neither ours. The first is bicycle parking design -- seventy-five percent of
      spaces within fifty feet of a public entrance, half of them covered when more than seven are
      required, half of the covered ones enclosed when more than fifteen are required, all of them
      illuminated. Quadplexes are named there, in the sentence requiring all their bicycle spaces
      to be covered, and that is still a rule about a rack rather than about the lot. The second
      is the non-residential half of Table 1015-3: one space per 2,500 square feet of retail up to
      fifty thousand, one per additional five thousand, one per forty theatre seats, one per ten
      thousand square feet of warehouse. The residential rows of the same table are already quoted
      by this file's parking encoding. The footnote that minimums outside the UGB are twenty
      percent of the listed requirement is a relaxation, and this county's screened land is inside
      the boundary in any case.
    fingerprint: 6cac6559d4cb7925

  "zdo.1012.txt#1012.07":
    queue: missed
    outcome: not_here
    note: >-
      The section heading answers it: 1012.07 is "Maximum Density For Duplexes In The RA-1
      District", and the 43,560 square feet per dwelling unit on the line is the acre that a
      duplex approved as a conditional use in RA-1 is measured against. Wrong building, wrong
      district and wrong approval path all at once. It reached a minimum-lot-size field only
      because the sentence spells out a square footage per dwelling unit.
    fingerprint: 462b55b7fa3566c1
  "zdo.1012.txt#1012.05":
    queue: condition
    outcome: never
    note: >-
      The net-developable-area subtractions -- how much of a site is deducted for steep slopes,
      floodplain, wetland and right of way before density is computed. It is a real and careful
      piece of code and it cannot change a number this screen holds, for a reason worth writing
      down: a net-area rule is arithmetic in service of a density standard, and no density
      standard survives in the quadplex zones of this county. Every zone here that permits a
      quadplex either states no maximum density or has it struck out by OAR 660-046-0220(2)(b),
      which the state layer encodes as exempt and preempting always; and no zone in this layer
      states a minimum density at all. Verified against the loaded corpus rather than assumed:
      thirteen quadplex-permitting zones, none with a density number of either kind left standing.
      Subtracting acreage from a denominator that feeds no numerator changes nothing.
    fingerprint: 06d414ac372fd07f
  "zdo.1012.txt#1012.08":
    queue: condition
    outcome: never
    note: >-
      Density bonuses -- the increases a proposal may earn for stated site or design commitments.
      Two independent reasons this cannot move a verdict. A bonus raises a ceiling, and reading a
      ceiling raise can only let more building through, never less, so leaving it unread fails
      lots in rather than out. And the ceiling it would raise is not there: no zone in this county
      layer that permits a quadplex has a maximum density left standing, because the state
      preemption strikes it, and none states a minimum. A bonus on a standard that does not apply
      is a number with nothing to modify.
    fingerprint: 86bd9c953e2c10f7
  "zdo.845.txt#845.04":
    queue: condition
    outcome: never
    note: >-
      Every statement on this card sits inside 845.04, Cottage Clusters, and the section's own
      text says so from several directions: a maximum ground floor area of 900 square feet per
      dwelling, a maximum average of 1,400, a six-foot minimum separation between dwellings,
      courtyard orientation for at least half of them, and a parking rule written for developments
      of "16 or more cottages". The 10-foot front and rear and five-foot side minimums at line 137
      are the cottage cluster's yard set, not the quadplex's. The one line worth flagging in
      passing is the parking placement rule -- no off-street space within 10 feet of a rear or
      side lot line, and none within 10 feet of a front lot line or in front of the nearest
      dwelling's facade -- because a rule of that shape would take real area out of a small lot.
      It governs cottage clusters. The quadplex's own standards are in 845.02, a different
      subsection with a different card.
    fingerprint: 6b0bc42a6d70b10c
  "zdo.510.txt#510.05":
    queue: condition
    outcome: applies
    note: >-
      Kept open deliberately: this is ordered work, not a question. Section 510 governs eleven
      urban commercial and mixed-use districts -- NC, C-2, RCC, RTL, CC, C-3, PMU, SCMU, OA, OC
      and RCO -- and notes 12 and 14 to Table 510-1 put freestanding quadplexes in them on the
      dimensional standards of the RCHDR and HDR districts respectively. Of those eleven, only NC,
      C-2 and OA exist in this layer at all and none of the three carries a dimension from this
      table, so the whole of 510 is unencoded land. The conditions on this card are the shape that
      has produced two real fixes this week: notes 10 through 20 to Table 510-2 are neighbour-zone
      step-ups, and they are steep. Note 12 makes a zero rear setback 15 feet plus one foot for
      every foot of height over 35 where the rear lot line abuts a residential district; note 14
      makes it 35 feet plus the same ratio; note 13 asks 10 feet up to 25 feet of height and 20
      above it where the neighbour is Urban Low Density Residential, VR-4/5 or VR-5/7; notes 15 to
      18 do the same on the side, from 15 feet to 35; note 19 caps building height at 35 feet
      where the property abuts a residential district. A zero setback that becomes 35 feet on the
      neighbour's zoning is not a footnote, it is the standard, and `abuts_residential_zone`
      already exists to carry it. Two things have to happen before any of it can be encoded.
      First, the districts themselves: SCMU's dimensions are stated by reference to Subsection
      1005.09 and PMU's by Table 510-3, both of which are separate reading jobs already on the
      queue. Second, and found on this card: Table 510-2's stored header prints ten district names
      for eleven columns of cells, having dropped SCMU from between PMU and OA. Counting into that
      header read SCMU's "100 feet" minimum street frontage as OA's -- a number for a district
      whose own cell is blank, with a citation pointing at exactly the right line. The table
      reader now refuses a row wider than its header rather than shifting it, so nothing can be
      encoded off this table by counting until the header is repaired at the source. Encoding
      these eleven districts by hand, against the applicability clause in 510.02 rather than
      against the header, is the job this card is holding open.
    fingerprint: 859334521615ea1b
  "zdo.316.txt#316.04":
    queue: condition
    outcome: never
    note: >-
      Table 316-2's dimensional standards -- 30-foot front and rear setbacks, 10-foot sides, a 40
      percent coverage cap in one column -- belong to the five rural residential districts of ZDO
      316, and all five were read on 2026-09-08 and all five REFUSE this use. The refusals are
      encoded rather than omitted, which is what makes this card answerable: a dimension for a
      district that prohibits the building cannot change a verdict the use table has already
      decided. Worth recording why the whole chapter was read rather than skipped on the instinct
      that it is rural land: OAR 660-046 does not reach unincorporated county territory, so
      "inside the Metro UGB" is the test that comes to mind first and it is the wrong one. The
      3,676 lots behind those five districts were the largest unread block in either county and
      they are closed on the use, not on the geography.
    fingerprint: 56cf49d8f7a390cd
  "zdo.1015.txt#1015.02":
    queue: condition
    outcome: never
    note: >-
      Nothing here changes a number this file holds, because the chain it belongs to was followed
      to the end on 2026-08-27 and read off the drawing on 2026-09-03. ZDO 1015.02(A)(2) sets a
      floor of 8.5 feet by 16 for an automobile parking space and 8.5 by 22 for a parallel one;
      (A)(3) requires at least 25 percent of required spaces to be no larger than 8.5 by 16;
      (A)(4) sends curb length, stall depth and aisle width to the Clackamas County Roadway
      Standards, which at 320.3(a) send them on to Standard Drawings P100 and P200. Both sheets
      are stored, both yield only their title blocks, and those title blocks are where the two
      stall sizes are written rather than drawn: P100 is 9 by 18 and P200 is 8.5 by 16. This layer
      already encodes 9 by 18 and a 24-foot aisle, with the reasoning stated in the file -- four
      spaces, at least one of them compact, and no rule anywhere choosing the size of the other
      three, so the larger is taken and the error runs toward a lot called too tight rather than a
      lot called buildable that is not. The remaining statements on the card are operational
      rather than dimensional: the carpool space, the four-inch tire stop, the ban on parking
      directly onto a circulation aisle in a lot over an acre, the ground-cover planting in front
      of a tire stop. None of them sizes a stall or a court.
    fingerprint: 8e2d95a3ac62fd3b
  "zdo.315.txt#315.04":
    queue: condition
    outcome: cant_tell
    note: >-
      Forty-two statements and exactly one of them is a tightening that reaches this building.
      Table 315-4 is seven districts wide -- PMD, MR-1, MR-2, HDR, VA, SHD, RCHDR -- and four of
      them are held. Sorted by column and row rather than by keyword, because the notes on this
      page are attached to cells and reading them off the page order would put a swimming pool's
      setback on a quadplex. The Minimum Side Setback cells for MR-1 and MR-2 both read "One
      story: five feet; two stories: seven feet; three stories: 15 feet" and carry markers 5, 10,
      11, 12, 14, 15 and 5, 10, 14, 15. The pod is two storeys, so the encoded 7 is the right
      cell, and Note 14 is the one that moves it: "If the side lot line abuts an Urban Low Density
      Residential, VR-5/7, or VR-4/5 District, the minimum side setback for a two-story building
      is 10 feet." Three feet on each side, six feet of lot width, on the two zones in this layer
      a pod can actually be built in. It is already carried the safe way -- caps.json holds
      setback_side_ft for both MR1 and MR2 against abuts_lower_density_zone, so no lot can go
      green on the seven-foot figure while the neighbour's zoning is unanswered. That is why this
      is filed as depending on the site rather than closed: the condition is real, it tightens,
      and it is answerable by data rather than by more reading. Neighbour-zone adjacency was moved
      onto the computable list on 2026-09-08 and this is another 959 lots' worth of reason to
      compute it. Everything else on the card is one of four other things. Other building types:
      the swimming pool setbacks at notes 3, 7 and 11; the accessory-building setback tables at
      lines 1275-1276, 1386-1393 and note 12, and note 24's height for accessory buildings over
      100 square feet -- this project has no accessory structure, settled on 2026-09-08; note 1's
      ten-foot rear setback, which names detached single-family dwellings, duplexes, manufactured
      homes, prefabricated structures and single room occupancy and stops there; and note 5, which
      sends detached single-family dwellings to Table 315-2 and no one else. Other districts: the
      lot-size ladders at lines 1152-1159 and 1292-1295 and the district land area figures at
      1463-1468 belong to the Urban Low Density Residential tables. The split-plat path: notes 4
      and 15 and the 3,630 and 2,420 square foot townhouse lot sizes at line 1086, and note 15 in
      particular is looser than what we hold -- five feet on a townhouse's unshared side against
      the seven this layer charges. And relaxations, which the conservative default declines: note
      10 removes rear and side setbacks inside a planned unit development except on the plat
      perimeter, note 19 exempts a dwelling on a lot with less than 35 feet of street frontage
      from the maximum front setback, and note 8's "there shall be no maximum setback" sits on
      RCHDR, which this layer does not hold. Note 13 and note 16 are the same neighbour-zone shape
      as note 14 and would matter a great deal, but both sit on RCHDR's cells -- rear and side
      respectively -- and RCHDR is one of the two districts still blocked on Subsection
      1005.02(L)'s solar angle, which needs the bearing of every lot line.
    fingerprint: b2b56838b7f350ae
  "zdo.1005.txt#1005.04":
    queue: chapter
    outcome: nothing_here
    note: >-
      Clackamas County's outdoor lighting standards. Two measuring lines and both are about the
      light fixture rather than the building: pole-mounted fixtures are capped in height and must
      be "compatible with the scale and intensity of uses they are serving", and entrance lighting
      "may not exceed a height of 12 feet and must be directed downward". A pole is not a
      structure this screen places and its height competes with nothing -- it does not take
      footprint, it does not take setback, and no verdict in this project turns on it. The
      subsection's own exemption list at 1005.04(A)(2) was read for the same reason the rest was
      and adds nothing either way.
    fingerprint: 38fedbacbbcbe927
  "zdo.1005.txt#1005.05":
    queue: chapter
    outcome: nothing_here
    note: >-
      ZDO 1005.05, Additional Requirements, and its first sentence is the whole ruling:
      "Development shall comply with a minimum of one of the following techniques per 20,000
      square feet of site area. Regardless of site size, a minimum of one and a maximum of five
      techniques are required." Twenty-four techniques follow and the applicant picks. That is the
      design-menu shape this corpus already catalogues as a false positive, and it is the
      strongest instance of it yet -- a lot under 20,000 square feet owes exactly one technique
      out of twenty-four, and the list includes items that cost a pod nothing at all: deciduous
      vines on a fence or trellis, deciduous trees for summer shade, high-albedo roof material,
      skylights or clerestory windows. THE ITEMS THAT WOULD HAVE BOUND ARE THE REASON THIS NEEDED
      READING RATHER THAN SCOPING. Technique 22 asks that "a minimum of 75 percent of the street
      frontage of the development site shall have buildings located at the minimum front setback
      line" inside the UGB -- the frontage-occupancy shape that is a live model gap elsewhere in
      this project and that forces a building's long axis parallel to the street. Technique 24
      asks buildings to sit at the minimum side setback line or within ten feet of the side lot
      line. Technique 6 asks that 75 percent of parking spaces be porous pavement. Every one of
      them would tighten this building; none of them binds, because each is one option on a menu
      and cheaper options sit beside it. The three that could not be chosen away are worth naming
      for the same reason -- there are none. Do not read this card as saying 75 percent frontage
      occupancy never applies in this county: 1005.02(E) states a 50 percent version of it as a
      requirement rather than an option, and that card is ruled separately today as work to do.
    fingerprint: b150e4d993d1ebf9
  "zdo.1005.txt#1005.02":
    queue: chapter
    outcome: read_it
    note: >-
      ZDO 1005.02, General Site Design Standards, and this one is work rather than a dismissal. It
      states two things this project would take and cannot currently hold, on 31,451 lots. THE
      FIRST IS FRONTAGE OCCUPANCY AS A REQUIREMENT. 1005.02(E): "Inside the UGB, except for
      industrial developments, a minimum of 50 percent of the street frontage of the development
      site shall have buildings located at the minimum front setback line." Unlike the
      twenty-four-item menu in 1005.05, this is a shall with one exception and it is not
      industrial. It is the same shape Gresham states at 7.0420(J)(1) and that this project
      carries there as orientation_constraint axis_required, so there is a form for it -- what is
      missing is the reading that decides whether it reaches a quadplex here. Two sentences bear
      on that and pull in opposite directions: 1005.03(I)(6) exempts "middle housing developed
      pursuant to Section 845, Triplexes, Quadplexes, Townhouses, and Cottage Clusters" from the
      additional BUILDING DESIGN requirements, which is an exemption written in exactly our name
      and pointedly attached to 1005.03 rather than to 1005.02; and 1005.02 itself opens with "the
      following site design standards apply" and names no use at all. Section 845 has to be read
      before either reading is safe, and that is the errand this card orders. THE SECOND IS THE
      SOLAR SEPARATION FORMULA at 1005.02(L), which this project already knows about from the
