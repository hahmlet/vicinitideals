label: Clackamas Unincorporated
kind: unincorporated
eligible: true
notes: 'Table 315-2 (R-2.5 through R-30) read against the adopted ZDO on 2026-08-14: front 15,
  garage/carport vehicle entry 20, side 5, rear 20, coverage 50%, identical in all eight districts,
  each value quoted to its own cell. The front setback cell states two standards at once ("15 feet,
  except 20 feet to garage and carport motor vehicle entries") and both are now encoded. The
  footnotes on those cells are alternate regimes, not conditions on these numbers: a planned unit
  development has no minimum rear or side setback and 65% coverage (fn 6, 11), a zero-lot-line
  development none either (fn 11), a middle housing lot measures coverage on the parent lot (fn 5)
  and setbacks from the parent lot lines (fn 9), and a lot of record of 6,000 sq ft or less created
  before the district applied gets rear 10 / side 5 total (fn 10). None of those is encoded.
  VR45 and VR57 are quoted as of 2026-08-16. Table 315-3 does merge cells across its three zone
  columns, but how many values a row prints settles what can be read from it: a three-value row is
  positional and nothing is merged (front, maximum front, side), and a two-value row whose values
  are identical gives the same answer whichever column the merge covers (rear 15 and 15, coverage
  50 and 50). The one row that is genuinely two DIFFERENT values under three columns -- minimum lot
  size -- is left unencoded in both zones and the reading is written out in their notes. UNPORTED:
  orientation_constraint=''entrance_only'', which quadfit justified in a YAML comment with no citation.

  HEIGHT, read 2026-08-20. All nine of this layer''s zones permitted a quadplex and stated no height,
  so the screen was placing a 26 ft building against no ceiling in every one of them. Table 315-2
  answers seven and Table 315-3 answers two, all at 35 feet. Section 845, which governs how a
  quadplex here is designed, states no height of its own, so the district table is the whole of it.

  Table 315-2''s height row prints TWO cells per district and only the second reaches this building:
  accessory buildings over 500 square feet take 20 feet or the primary dwelling, and "All other
  buildings, including accessory dwelling units" take 35. Neither sub-line carries a footnote marker.
  Table 315-3''s three cells each carry note 9, which relieves one platted subdivision (Sieben Creek
  Estates) of the standard and expressly excludes middle housing developed under Section 845 from
  that relief. A quadplex is middle housing under 845, so the note cannot loosen this ceiling.

  That note had to be read by hand, because when the heights were encoded nothing could read it.
  zdo.315.txt was the corpus''s worst unreconciled document -- 305 footnote markers and ZERO bodies
  -- so the footnote gate governed nothing in this layer and would have let every value here certify
  under notes nobody had read. It was silent because it was blind, not because the notes were clean.

  FOOTNOTES, read 2026-08-21. Both causes fixed, and all 41 notes ruled in
  flats/config/footnotes/or/clackamas/_unincorporated.yaml. The county writes each table''s notes as
  an HTML ordered list, whose numbers the browser draws and the text never carries, so ten bodies
  were stored stripped of the only thing tying them to a marker; the notes that did keep their
  numbers arrived as "9 Except for middle housing", one space and no heading, which is the one run
  shape the census declined. The gate now governs 64 values here and blocks none of them.

  Nothing in those 41 notes moved a number. The relief in this chapter is for other housing types
  (the lot-of-record exceptions name detached dwellings, duplexes, manufactured homes, prefabricated
  structures and single room occupancies -- a quadplex is none of them), for other application paths
  (a planned unit development or a zero-lot-line development), or for the split plat. Two notes are
  worth carrying forward. Table 315-3 note 12 states that the MAXIMUM setback standards do not apply
  to quadplexes developed under Section 845, so the 18 ft maximum front setback encoded on both
  village zones does not bind this building at all -- declined rather than taken, because holding a
  maximum nobody enforces can only ever refuse a lot the county would pass, never pass one it would
  refuse. And note 15 makes frontage on an accessway a front lot line, which turns a 5 ft side into
  a 10 ft front on whichever face it lands; an accessway is not a street and no layer here answers
  it, so it is `unmeasured` against the `abuts_accessway` condition and caps the VR zones.'
ingest:
  geoid: null
  juris_city_codes:
  - UNINCORPORATED
  - ''
  zoning_layer: zoning_metro
  zone_field: ZONE
  strip_lowercase_suffix: false
definitions:
  # "LOT, CORNER: A lot with street frontage on two streets intersecting at a
  # corner of the lot. A lot within the radius curve of a single street is not
  # a corner lot. A lot may be both a corner lot and a through lot."
  #
  # The one code in the corpus that rules a curve out. Portland turns a street
  # curving at 120 degrees or less into two intersecting streets and Gresham
  # writes the same bend as a 60-degree delta; Clackamas County says a lot on
  # the radius curve of a single street is not a corner, however tight the
  # bend. Oregon City is a third answer again -- it states no angle at all, so
  # a non-collinear frontage reads as an intersection.
  #
  # "A lot may be both a corner lot and a through lot" is not a further
  # condition, it is the county closing off the reading under which a street
  # front and back disqualifies a lot from also being a corner.
  corner_lot:
    test: intersecting_frontages
    count: 2
    curve_is_one_street: true
    quote: "or/clackamas/_unincorporated/zdo.202.definitions.txt#L275"
    cite: "Clackamas County ZDO 202, Lot, Corner"

code:
# The county publishes each ZDO section as inline page text; the slice cuts
# the site navigation off both ends.
# ZDO Section 202 is the county's definitions. It is the one code in the
# corpus that rules a curve *out*: "A lot within the radius curve of a single
# street is not a corner lot", where Portland and Gresham both write a curve
# tight enough into being two streets.
- id: "zdo.202.definitions"
  url: https://www.clackamas.us/planning/zdo202
  title: ZDO Section 202 Definitions
  # Prose about words: 740 lines, almost none of them dimensioned, which
  # the thinness guard reads as a landing page. Read 2026-08-18 -- it is
  # the definitions section itself, LOT CORNER through LOT THROUGH and the
  # front/side/rear lot line rules that hang off them.
  allow_thin: true
- id: zdo.315
  url: https://www.clackamas.us/planning/zdo315
  title: Clackamas County ZDO Section 315 - Low Density Residential Districts (Tables 315-1/2/3)
  start: "315.01 Purpose"
  end: "Return to the Zoning and Development Ordinance main page"
  # Table 315-1's ~1,900 use-name lines dilute the density ratio. Read 2026-08-12.
  allow_thin: true
# Table 315-2 states the pod's dimensions and points somewhere else for two
# standards that decide whether it fits at all. "District Land Area (DLA) for
# Calculating Density Pursuant to Section 1012" is the density row, and
# "Minimum Density: See Section 1012" is the whole of the floor. A table that
# cites another section for its number has not stated one.
- id: zdo.1012
  url: https://www.clackamas.us/planning/zdo1012
  title: Clackamas County ZDO Section 1012 - Lot Size and Density
  # Read before encoding anything else out of this section. 1012.01 states
  # what it applies to, and it is a list of applications rather than a list
  # of buildings: subdivisions, partitions, Type II replats, design review
  # for dwellings, and conditional uses for dwellings. A quadplex on a lot
  # nobody divides reaches that list only through "design review", and
  # whether one is required is not a fact any parcel here carries. That is
  # why 1012.08's minimum density is not encoded on top of being underived
  # -- two reasons, and either alone would be enough.
  start: "1012.01"
  end: "Return to the Zoning and Development Ordinance main page"
# Table 315-1 marks every Quadplexes cell P7,8, and note 8 is this section:
# "The development of a triplex, quadplex, townhouse, or cottage cluster is
# subject to Section 845." It carries the one minimum lot size that governs
# the pod anywhere in unincorporated Clackamas.
- id: zdo.845
  url: https://www.clackamas.us/planning/zdo845
  title: Clackamas County ZDO Section 845 - Triplexes, Quadplexes, Townhouses, and Cottage Clusters
  start: "845.01"
  end: "Return to the Zoning and Development Ordinance main page"
zones:
  R5:
    cite_default:
      cite: Clackamas ZDO-282 (quadplex by-right); ZDO Section 315 Table 315-2 (dwelling front 15, garage
        20, side 5, rear 20, coverage 50%)
      url: https://www.clackamas.us/planning/zdo315
      retrieved: '2026-07-28'
    quadplex_allowed:
      # Table 315-1, Quadplexes row, first column: "R-5 - R-30" reads P7,8 --
      # permitted, subject to note 7 (a lot of record may hold only one of the
      # listed dwelling types) and note 8 (Section 845 governs the design).
      value: true
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L41,L43-L54,L295-L306,L1076,L1078"
    min_lot_sqft:
      # Section 845.01, and the only minimum lot size that reaches this pod.
      # Table 315-2's own row prints a pair -- "5,000/4,000 square feet" in
      # R-5 -- but that is district land area over the district minimum for a
      # detached dwelling, and 1012.02(H) waives the district figure for a
      # middle housing land division anyway. What 845 states is a floor on the
      # subject lot for the building itself: "7,000 square feet for a quadplex
      # or a cottage cluster", the same number in every district. The triplex
      # line above it carries the VR exception; the quadplex line carries none.
      value: 7000
      cite: "Clackamas ZDO 845.01 (general standards, minimum lot size)"
      url: https://www.clackamas.us/planning/zdo845
      retrieved: '2026-08-19'
      quote: "or/clackamas/_unincorporated/zdo.845.txt#L3,L7"
    max_density_du_per_acre:
      # 1012.04, the county saying in its own words what OAR 660-046-0220(2)(b)
      # requires of it: "for a duplex, triplex, quadplex, or cottage cluster in
      # the R-5, R-7, R-8.5, R-10, R-15, R-20, R-30, VR-4/5, or VR-5/7
      # District, and for accessory dwelling units, DLA is not the minimum lot
      # area required per dwelling unit". DLA is the whole of the density
      # standard here -- 1012.05 divides net site area by it -- so a building
      # DLA does not measure has no maximum density.
      #
      # `unless: [unit_lots]` because that sentence lists four housing types
      # and townhouses is not among them. Table 315-3's notes give townhouses
      # a third and a quarter of the DLA instead, so the split plat is
      # governed and this layer must not say otherwise.
      exempt: true
      unless: [unit_lots]
      cite: "Clackamas ZDO 1012.04 (general density provisions)"
      url: https://www.clackamas.us/planning/zdo1012
      retrieved: '2026-08-19'
      quote: "or/clackamas/_unincorporated/zdo.1012.txt#L73"
    max_height_ft:
      # Table 315-2, the "Maximum Building Height" row. It prints two cells per
      # district, not one: an accessory-building line capped at 20 feet or the
      # primary dwelling, and "All other buildings, including accessory
      # dwelling units: 35 feet". Four attached primary dwellings are not an
      # accessory building, so this pod is measured against the second, and the
      # quote takes the row label with the cell so a reviewer can see which of
      # the two is being read.
      #
      # Quoted to the district's own cell, following this layer's convention
      # for Table 315-2 -- position is what names the column, because all eight
      # districts print the same sentence. The row carries no footnote marker
      # in either sub-line.
      value: 35
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1169,L1173"
    setback_front_ft:
      value: 15
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1188"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1188"
    setback_side_ft:
      value: 5
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1206"
    setback_rear_ft:
      value: 20
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1197"
    max_coverage_pct:
      value: 50
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1162"
    notes: 'quadfit confidence: verified | Adopted ZDO 315 Table 315-2 (amended 9/9/2024). Base SFD min
      lot 5,000 sf, but middle-housing land division waives min lot (Section 845). Coverage computed on
      the parent lot.'
