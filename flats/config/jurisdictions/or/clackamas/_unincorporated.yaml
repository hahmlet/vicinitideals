  # ------------------------------------------------------------------
  # The rural half of the county, read 2026-09-08 from ZDO Section 316.
  #
  # Five districts, 3,676 lots on 6,798 acres -- the largest block of
  # unencoded land left in either county -- and all five are the same answer.
  # Section 316 governs six districts; RR is the sixth and carries no lots in
  # the parcel layer, so it is ruled in the district ledger rather than
  # encoded here.
  #
  # The refusal rests on three sentences and is corroborated by a fourth from
  # a different chapter:
  #
  #   316.03(A)(1)  "Uses not listed are prohibited."  (L11)
  #   Table 316-1   has rows for Detached Single-Family Dwellings, Duplexes,
  #                 Manufactured Dwellings, Prefabricated Structures, Single
  #                 Room Occupancies, ADUs, Accessory Historic Dwellings and
  #                 Recreational Vehicles as Second Dwellings -- and no
  #                 triplex, quadplex, townhouse, cottage cluster or
  #                 multifamily row of any kind. A whole-document sweep for
  #                 every one of those words returns three hits, all of them
  #                 the word "duplex".
  #   Note [8]      states it affirmatively rather than by omission: "each lot
  #                 of record may be developed with only ONE of the following:
  #                 detached single-family dwelling, duplex (only if approved
  #                 as a conditional use in the RA-1 District), manufactured
  #                 dwelling, prefabricated structure, or single room
  #                 occupancy."  (L628)
  #
  # The fourth is ZDO 1012, which is where this county writes its middle
  # housing relief and which names the districts it reaches twice over:
  # 1012.02(H) waives minimum lot size for a middle housing land division "In
  # the R-5, R-7, R-8.5, R-10, R-15, R-20, R-30, VR-4/5, or VR-5/7 District"
  # (zdo.1012.txt#L57), and 1012.04(A) exempts "a duplex, triplex, quadplex,
  # or cottage cluster" from DLA in that identical list (L73). Nine urban
  # districts, named the same way in both places, and not one of these five
  # among them. The county is not silent about where middle housing goes; it
  # said, and it said somewhere else.
  #
  # THE STATE DOES NOT REACH HERE, and this is the limb worth checking rather
  # than assuming, because everywhere else in this corpus OAR 660-046 is the
  # thing that overrides a local refusal. Two independent reasons:
  #
  #   -0010(1) binds "a Medium City or Large City" (oar.660-046-0010.txt#L25),
  #   and -0020's definition of Large City reaches county land only where it
  #   is "provided with sufficient urban services as defined in ORS 195.065.
  #   Sufficient urban services means areas that are within an urban service
  #   district boundary" (oar.660-046-0020.txt#L72). Rural residential land
  #   outside an urban service district is the definition's own exclusion.
  #
  #   -0010(2)(c) excuses, separately and by name, "Lots or Parcels that are
  #   not incorporated and that are zoned under an interim zoning designation
  #   that maintains the land's potential for planned urban development"
  #   (#L36-L37). That sentence was written for a district like FU-10.
  #
  # The second reason matters because the first is weakest exactly where the
  # lots are: some of this land IS inside the Portland Metropolitan Urban
  # Growth Boundary -- ZDO 1012.02(A) sets a 20-acre minimum lot size "inside
  # the Portland Metropolitan Urban Growth Boundary ... in the FF-10, RA-1,
  # RA-2, RC, RI, and RRFF-5 Districts" (zdo.1012.txt#L19), and Table 316-2
  # note [3] says the same. Inside a UGB is not the test the division states,
  # but it is close enough to it that resting the whole refusal on "rural"
  # would have been resting it on the wrong word.
  #
  # NOTHING DIMENSIONAL IS ENCODED, the same way Oregon City's six refusals
  # encode only the use gate. Table 316-2 is complete and readable and every
  # figure in it is moot while the building may not be built: minimum lot
  # sizes of one to ten acres, front 30, rear 30 and side 10 in all five of
  # the districts encoded here, and no maximum lot coverage in any of them.
  # (RR is the exception on every row -- 15, 15, 5 and 40 percent -- which is
  # the recreational district up above 3,500 feet where the same table sets a
  # 20 foot separation "between buildings with contiguous snow slide areas".)
  # If the county ever admits middle housing to these districts the table is
  # at L708-L714 and its thirteen notes at L716-L740.
