    notes: 'Adopted ZDO 315 Table 315-3 (layer literal ''VR45'' = ZDO ''VR-4/5''). Quoted 2026-08-16 the
      same way as VR57 — row label plus every value under it, so the count of values can be checked
      against the three column headers. VR-4/5 carries no garage-door setback: unlike the VR-5/7 cell,
      its front and maximum-front cells are plain numbers.

      THE ALLOWANCE IS SETTLED, 2026-08-16. It stood as needs_verification because the county Middle
      Housing FAQ listed VR-5/7 and omitted VR-4/5. The FAQ is not the code. Table 315-1 puts both
      village zones in one cell -- the column header reads "VR-4/5 & VR-5/7" -- and the Quadplexes row
      reads P7,8 in it. Permitted, subject to note 7 (one dwelling type per lot of record) and note 8
      (Section 845 design standards). Quoted.

      NOT ENCODED: minimum lot size, for the same reason as VR57 — the row prints "4,000/2,000" under
      a two-part label, so the stated minimum is 2,000 and the 4,000 is the density figure, and
      Section 845 waives it for a middle housing land division besides.'
