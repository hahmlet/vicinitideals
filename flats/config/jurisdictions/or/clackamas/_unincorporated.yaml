      zone in either county before this commit.

      THE SHAPE OF THIS DISTRICT IS THE OPPOSITE OF THE R ZONES ON PAPER AND
      LOOSER THAN THEM ONCE THE STATE IS READ. There is no height ceiling
      where every R zone has 35 feet, and there is a district land area the R
      zones are excused from -- but OAR 660-046-0220(2)(b) forbids applying a
      density maximum to a quadplex, so what actually binds is a lot size
      floor, three setbacks and parking. That is looser than any R zone in the
      county, which is the honest summary and not the one the table reads
      like.

