    min_lot_sqft:
      # Table 315-4 prints "None" and Section 845.01 prints 7,000, and 7,000
      # is the one that binds. 845.01 states "the subject lot shall be a
      # minimum of ... 7,000 square feet for a quadplex or a cottage cluster"
      # with no district qualifier anywhere in the section: the whole document
      # names a district exactly twice, once for the VR triplex exception and
