definitions:
  # "LOT, CORNER: A lot with street frontage on two streets intersecting at a
  # corner of the lot. A lot within the radius curve of a single street is not
  # a corner lot. A lot may be both a corner lot and a through lot."
  #
  # The one code in the corpus that rules a curve out. Portland turns a street
  # curving at 120 degrees or less into two intersecting streets and Gresham
  # writes the same bend as a 60-degree delta; Clackamas County says a lot on
  # the radius curve of a single street is not a corner, however tight the
  # bend. Oregon City is a third answer again -- it states no angle at all, so
  # a non-collinear frontage reads as an intersection.
  #
  # "A lot may be both a corner lot and a through lot" is not a further
  # condition, it is the county closing off the reading under which a street
  # front and back disqualifies a lot from also being a corner.
  corner_lot:
    test: intersecting_frontages
    count: 2
    curve_is_one_street: true
    quote: "or/clackamas/_unincorporated/zdo.202.definitions.txt#L275"
    cite: "Clackamas County ZDO 202, Lot, Corner"

code:
# The county publishes each ZDO section as inline page text; the slice cuts
# the site navigation off both ends.
# ZDO Section 202 is the county's definitions. It is the one code in the
# corpus that rules a curve *out*: "A lot within the radius curve of a single
# street is not a corner lot", where Portland and Gresham both write a curve
# tight enough into being two streets.
- id: "zdo.202.definitions"
  url: https://www.clackamas.us/planning/zdo202
  title: ZDO Section 202 Definitions
  # Prose about words: almost none of it dimensioned, which the thinness
  # guard reads as a landing page. Read 2026-08-18 -- it is the definitions
  # section itself, LOT CORNER through LOT THROUGH and the front/side/rear
  # lot line rules that hang off them.
  allow_thin: true
  # The one document in this layer that was declared without an `end`, and
  # the only one that drifted every week. Below the definitions the county
  # prints an upcoming-meetings panel: "Planning Commission - Aug. 24,
  # 2026" ages out, a hearing three weeks away takes its place, and the
  # stored text changes with no amendment behind it. A watch that fires on
  # a calendar is a watch nobody reads, and this one had been crying wolf
  # since 2026-08-18. Its five siblings already cut here.
  end: Return to the Zoning and Development Ordinance main page
- id: zdo.315
  url: https://www.clackamas.us/planning/zdo315
  title: Clackamas County ZDO Section 315 - Low Density Residential Districts (Tables 315-1/2/3)
  start: "315.01 Purpose"
  end: "Return to the Zoning and Development Ordinance main page"
  # Table 315-1's ~1,900 use-name lines dilute the density ratio. Read 2026-08-12.
  allow_thin: true
# The rural half of the county's residential land, and the largest block of
# unencoded lots left anywhere in the corpus: RRFF-5 (2,082 lots), FU-10
# (693), RA-2 (491), RA-1 (329) and FF-10 (81) together carry 3,676 lots on
# 6,798 acres. Section 315 is the URBAN low-density chapter and says nothing
# about any of them, which is why the coverage ledger has had five
# `zone_missing` rows here since it could first see this county.
- id: zdo.316
  url: https://www.clackamas.us/planning/zdo316
  title: Clackamas County ZDO Section 316 - Rural Residential Districts (RA-1, RA-2, RR, RRFF-5, FF-10, FU-10)
  start: "316.01"
  end: "Return to the Zoning and Development Ordinance main page"
  # Same shape as 315: a long use table whose use names dilute the ratio.
  allow_thin: true
# The commercial and mixed-use half of the urban county: eleven districts on
# one use table, and the loosest land in this layer. Table 510-1 marks the
# Quadplexes row P in nine of the eleven -- the pod is a listed, permitted use
# in most of the commercial land here -- so this chapter is not read to find a
# refusal. Two of the eleven refuse it outright (NC, C-2), one permits it only
# inside somebody else's building (OA), and the other eight hand their
# dimensional standards to a residential district this layer has not yet encoded.
- id: zdo.510
  url: https://www.clackamas.us/planning/zdo510
  title: Clackamas County ZDO Section 510 - Urban Commercial and Mixed-Use Zoning Districts (Tables 510-1/2/3)
  start: "510.01"
  end: "Return to the Zoning and Development Ordinance main page"
  # Table 510-1 runs eleven hundred lines of use names against eleven columns.
  allow_thin: true
# Where eight of those eleven districts' standards actually live. Table 510-1
# notes 12 and 14 send a FREESTANDING quadplex -- which is the only kind this
# building is -- to "the development and dimensional standards applicable to
# ... quadplexes in the RCHDR District" and "in the HDR District", and Table
# 510-2's eighth column is not a number at all but "See Subsection 1005.09".
# So this section is the terminus of the commercial half, and it holds a shape
# the value model has never carried: 1005.02(L) sets the distance to the site
# area line by drawing an angle from the top of the building, 60 degrees to
# the north and 15 to the east and west, and prints the second as a formula --
# "Separation = b x .267 (tan 15 degrees)". A setback that is a function of
# height and of which way a lot line points is not a number; it needs the
# bearing of every lot line, which nothing here measures. 1005.02(L)(4) closes
# the obvious escape by saying these standards are not modifiable under
# Section 904, Height Exceptions.
- id: zdo.1005
  url: https://www.clackamas.us/planning/zdo1005
  title: Clackamas County ZDO Section 1005 - Design Standards (Subsection 1005.02(L) separation, 1005.09 Fuller Road Station Community)
  start: "1005.01"
  end: "Return to the Zoning and Development Ordinance main page"
  allow_thin: true
# Table 315-2 states the pod's dimensions and points somewhere else for two
# standards that decide whether it fits at all. "District Land Area (DLA) for
# Calculating Density Pursuant to Section 1012" is the density row, and
# "Minimum Density: See Section 1012" is the whole of the floor. A table that
# cites another section for its number has not stated one.
- id: zdo.1012
