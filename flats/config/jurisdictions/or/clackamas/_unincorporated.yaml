label: Clackamas Unincorporated
kind: unincorporated
eligible: true
notes: 'Table 315-2 (R-2.5 through R-30) read against the adopted ZDO on 2026-08-14: front 15,
  garage/carport vehicle entry 20, side 5, rear 20, coverage 50%, identical in all eight districts,
  each value quoted to its own cell. The front setback cell states two standards at once ("15 feet,
  except 20 feet to garage and carport motor vehicle entries") and both are now encoded. The
  footnotes on those cells are alternate regimes, not conditions on these numbers: a planned unit
  development has no minimum rear or side setback and 65% coverage (fn 6, 11), a zero-lot-line
  development none either (fn 11), a middle housing lot measures coverage on the parent lot (fn 5)
  and setbacks from the parent lot lines (fn 9), and a lot of record of 6,000 sq ft or less created
  before the district applied gets rear 10 / side 5 total (fn 10). None of those is encoded.
  VR45 and VR57 are quoted as of 2026-08-16. Table 315-3 does merge cells across its three zone
  columns, but how many values a row prints settles what can be read from it: a three-value row is
  positional and nothing is merged (front, maximum front, side), and a two-value row whose values
  are identical gives the same answer whichever column the merge covers (rear 15 and 15, coverage
  50 and 50). The one row that is genuinely two DIFFERENT values under three columns -- minimum lot
  size -- is left unencoded in both zones and the reading is written out in their notes. UNPORTED:
  orientation_constraint=''entrance_only'', which quadfit justified in a YAML comment with no citation.

  HEIGHT, read 2026-08-20. All nine of this layer''s zones permitted a quadplex and stated no height,
  so the screen was placing a 26 ft building against no ceiling in every one of them. Table 315-2
  answers seven and Table 315-3 answers two, all at 35 feet. Section 845, which governs how a
  quadplex here is designed, states no height of its own, so the district table is the whole of it.

  Table 315-2''s height row prints TWO cells per district and only the second reaches this building:
  accessory buildings over 500 square feet take 20 feet or the primary dwelling, and "All other
  buildings, including accessory dwelling units" take 35. Neither sub-line carries a footnote marker.
  Table 315-3''s three cells each carry note 9, which relieves one platted subdivision (Sieben Creek
  Estates) of the standard and expressly excludes middle housing developed under Section 845 from
  that relief. A quadplex is middle housing under 845, so the note cannot loosen this ceiling.

  That note had to be read by hand, because when the heights were encoded nothing could read it.
  zdo.315.txt was the corpus''s worst unreconciled document -- 305 footnote markers and ZERO bodies
  -- so the footnote gate governed nothing in this layer and would have let every value here certify
  under notes nobody had read. It was silent because it was blind, not because the notes were clean.

  FOOTNOTES, read 2026-08-21. All 77 notes ruled in
  flats/config/footnotes/or/clackamas/_unincorporated.yaml. Four readers were blind in series here.
  The county writes each table''s notes as an HTML ordered list, whose numbers the browser draws and
  the text never carries, so ten bodies were stored stripped of the only thing tying them to a
  marker. The notes that did keep their numbers arrived as "9 Except for middle housing", one space
  and no heading, which is the one run shape the census declined. Table 315-1''s note 1 introduces
  its own criteria and they restart at 1, so the block headed where the inner list did and read four
  sub-criteria as notes 1 to 4, stopping short of notes 7 and 8. And those two are the notes printed
  on the Quadplexes cell itself -- which arrives from an HTML table as the four characters "P7,8",
  one permission code on a line of its own, below the bar the marker reader sets for believing a
  line is a table row. The permission for this building in all nine districts was governed by a pair
  of notes nobody had read. The gate now governs 64 values here and blocks none of them.

  Nothing in those 77 notes moved a number. The relief in this chapter is for other housing types
  (the lot-of-record exceptions name detached dwellings, duplexes, manufactured homes, prefabricated
  structures and single room occupancies -- a quadplex is none of them), for other application paths
  (a planned unit development or a zero-lot-line development), or for the split plat. One note is
  worth carrying forward, and one nearly went the other way. Table 315-3 note 12 ends "do not apply
  to cottage clusters developed pursuant to Section 845, Triplexes, Quadplexes, Townhouses, and
  Cottage Clusters", which reads as four building types and would lift the 18 ft maximum front
  setback off this pod. Those four are the TITLE of Section 845, printed that way nine times in this
  document; the relief runs to cottage clusters alone and the maximum binds. Note 15 makes frontage on an accessway a front lot line, which turns a 5 ft side into
  a 10 ft front on whichever face it lands; an accessway is not a street and no layer here answers
  it, so it is `unmeasured` against the `abuts_accessway` condition and caps the VR zones.


  PARKING, read 2026-08-27, and the reason it was read first: 18,662 lots here fit the pod, the
  third largest count in the corpus, and the site-plan generator lays out none of them, because a
  city that has not stated a stall and an aisle cannot be drawn on. Four of the five numbers are
  now in. The fifth is not gettable.

  Table 1015-2 asks a quadplex for one space per dwelling unit in both of the columns this layer
  reads -- "R-5 through R-30" and "VR-4/5 & VR-5/7" -- and the Quadplex row fills all nine of its
  columns, so it is positional and nothing is merged. Section 845, which Table 315-1''s note 8 sends
  this building to for everything, states no parking quantity and no stall of its own; the general
  chapter governs, and the county shows it knows how to say otherwise, because the bicycle table
  three subsections down excepts "quadplexes not developed pursuant to Section 845" by name.

  That cell is why the extractor is at flats-html-text/7. The county marks it `1<sup>3</sup>`, and
  until the extractor learned to hold a superscript apart from the text beneath it, the store held
  "13" -- thirteen spaces per dwelling unit. The marker that would have shown the join was the thing
  that got eaten, so nothing downstream could have caught it. Six hundred and twenty-four numeric
  superscripts across the corpus, every one a footnote marker and not one an exponent.

  The stall is 9 by 18 and the ZDO says 8.5 by 16, and both are true. 1015.02(A)(2) states a floor;
  (A)(4) immediately hands curb length, stall depth and aisle width to the Roadway Standards, whose
  320.5(a) requires dimensions to "meet the ZDO and Roadway Standard Drawing P100 or P200". P100 is
  titled "(9'' x 18'')" and P200 "(8.5'' x 16'')", so the county publishes two stalls and the ZDO''s
  floor is the smaller. (A)(3) settles which is which by requiring at least a quarter of the spaces
  to be no larger than 8.5 by 16 -- a compact rule. Four spaces, at least one compact, and no rule
  choosing the size of the other three, so the larger is encoded: a lot holding four 9-by-18 stalls
  holds any lawful mix, and the error runs toward calling a lot too tight rather than calling one
  buildable that is not.

  The aisle is the one that cannot be had, and it is a refusal shape this corpus has not carried.
  The chain is complete and it terminates in a picture: the ZDO points at the Roadway Standards, the
  Roadway Standards point at Standard Drawings P100 and P200, and both sheets are now declared,
  fetched and stored -- three lines each, because a CAD sheet''s only extractable text is its title
  block. The stall survives in that title. Every other dimension on those sheets, the drive aisle
  above all, is drawn. Somebody with the sheet open closes this in five seconds; nothing here can.
  Until then unincorporated Clackamas produces no site plan, which is the honest outcome rather than
  a failure.'
ingest:
  geoid: null
  juris_city_codes:
  - UNINCORPORATED
  - ''
  zoning_layer: zoning_metro
  zone_field: ZONE
  strip_lowercase_suffix: false
crossrefs:
  # --- the last eight references in this layer standing beside a standard --
  # Three of them are division headings rather than sections -- the county
  # serves one page per section and 800, 1000 and 1100 all 404 -- so what they
  # name is a container whose contents this layer already holds.
  "800":
    outcome: other_building
    note: >-
      Special Use Requirements, and it is a division heading rather than a section: the county
      serves one page per section and /planning/zdo800 is a 404. Its own citing sentence is gated
      on a use this pod is not -- "If a minimum lot size for the conditional use is established by
      Section 800, Special Use Requirements, it remains applicable" -- and Table 315-1 marks every
      Quadplexes cell P7,8, permitted rather than conditional. What the division contains is
      already here: note 8 sends this building to Section 845, which is stored, and 845 carries the
      one minimum lot size that governs the pod anywhere in unincorporated Clackamas.
  "1000":
    outcome: other_building
    note: >-
      Development Standards, the other division heading, cited beside 1100 in a bare list --
      "Section 1000, Development Standards; and Section 1100, Development Review Process." Also a
      404 as a page. The two sections in it this pod is measured by are both stored and encoded:
      1012, Lot Size and Density, and 1015, Parking and Loading. A container is not a chapter
      nobody read; it is the name of the shelf.
  "1100":
    outcome: procedure
    note: >-
      Development Review Process, the second half of that same list. It is how an application is
      filed, noticed and decided -- Type I through Type IV -- and it states no dimension a building
      has to meet. A lot does not fail this screen because of it.
  "106":
    outcome: procedure
    note: >-
      Authorizations of Similar Uses, cited twice and both times for uses the table does NOT name:
      "In the PMD District, uses similar to one or more of the listed uses for the PMD District may
      be authorized pursuant to Section 106", and the same for the HDR, SHD and RCHDR Districts.
      Table 315-1 has a Quadplexes row, so this pod is a listed use and the similar-use path is not
      available to it or needed by it. The four districts named are also not ones it occupies.
  "839":
    outcome: other_building
    note: >-
      Accessory Dwelling Units, the section the ADU row of the use table points at: "Accessory
      Dwelling Units, subject to Section 839". A subordinate second unit on a lot with a house, and
      this screen places four attached primary ones. Its other mention is the same shape -- "Except
      as allowed by Section 839, Accessory Dwelling Units, or Section 1204, Temporary Permits, each
      lot of record may be developed with only one of the following" -- where 839 is named as an
      exception that ADDS a unit.
  "846":
    outcome: narrows_only
    note: >-
      Affordable Housing, and it points the opposite way from a standard: "Dwellings not otherwise
      permitted in the applicable zoning district may nonetheless be permitted if they are
      developed as affordable housing, as defined in ORS 197A.445(1), and subject to Section 846."
      Reading it could only admit lots this screen rejects on the use flag -- it cannot reject one
      it admits. That is the same reasoning applied to variances elsewhere in this corpus, and it
      holds a fortiori here because the permission is granted by statute rather than discretion.
  "847":
    outcome: other_building
    note: >-
      Recreational Vehicles as Second Dwellings: "P P P Recreational Vehicles as Second Dwellings,
      subject to Section 847", and "unless the vehicle is approved as a temporary dwelling pursuant
      to Section 1204, Temporary Permits, or as a second dwelling pursuant to Section 847". A
      vehicle, and a second one at that. Not four attached factory-built units on a foundation.
  "1105":
    outcome: later
    note: >-
      "Subdivisions, Partitions, Replats, Middle Housing Land Divisions." Both mentions are ZDO
      Table 1012 footnotes permitting a middle housing land division as an exception to a lot
      standard, and the parent-lot standards this layer already encodes are the ones that govern
      while the pod sits on one lot. Parked rather than closed: no pod in flats/config/pods
      declares plat: unit_lots, so this screen never creates a lot. The day one does, this is a
      fetch.
  "1204":
    outcome: other_path
    note: >-
      Temporary Permits, cited by ZDO 315's one-dwelling-per-lot rule as an exception alongside
      Section 839, Accessory Dwelling Units. A temporary permit is not a path to a permanent
      four-unit building.

definitions:
  # "LOT, CORNER: A lot with street frontage on two streets intersecting at a
  # corner of the lot. A lot within the radius curve of a single street is not
  # a corner lot. A lot may be both a corner lot and a through lot."
  #
  # The one code in the corpus that rules a curve out. Portland turns a street
  # curving at 120 degrees or less into two intersecting streets and Gresham
  # writes the same bend as a 60-degree delta; Clackamas County says a lot on
  # the radius curve of a single street is not a corner, however tight the
  # bend. Oregon City is a third answer again -- it states no angle at all, so
  # a non-collinear frontage reads as an intersection.
  #
  # "A lot may be both a corner lot and a through lot" is not a further
  # condition, it is the county closing off the reading under which a street
  # front and back disqualifies a lot from also being a corner.
  corner_lot:
    test: intersecting_frontages
    count: 2
    curve_is_one_street: true
    quote: "or/clackamas/_unincorporated/zdo.202.definitions.txt#L275"
    cite: "Clackamas County ZDO 202, Lot, Corner"

code:
# The county publishes each ZDO section as inline page text; the slice cuts
# the site navigation off both ends.
# ZDO Section 202 is the county's definitions. It is the one code in the
# corpus that rules a curve *out*: "A lot within the radius curve of a single
# street is not a corner lot", where Portland and Gresham both write a curve
# tight enough into being two streets.
- id: "zdo.202.definitions"
  url: https://www.clackamas.us/planning/zdo202
  title: ZDO Section 202 Definitions
  # Prose about words: almost none of it dimensioned, which the thinness
  # guard reads as a landing page. Read 2026-08-18 -- it is the definitions
  # section itself, LOT CORNER through LOT THROUGH and the front/side/rear
  # lot line rules that hang off them.
  allow_thin: true
  # The one document in this layer that was declared without an `end`, and
  # the only one that drifted every week. Below the definitions the county
  # prints an upcoming-meetings panel: "Planning Commission - Aug. 24,
  # 2026" ages out, a hearing three weeks away takes its place, and the
  # stored text changes with no amendment behind it. A watch that fires on
  # a calendar is a watch nobody reads, and this one had been crying wolf
  # since 2026-08-18. Its five siblings already cut here.
  end: Return to the Zoning and Development Ordinance main page
- id: zdo.315
  url: https://www.clackamas.us/planning/zdo315
  title: Clackamas County ZDO Section 315 - Low Density Residential Districts (Tables 315-1/2/3)
  start: "315.01 Purpose"
  end: "Return to the Zoning and Development Ordinance main page"
  # Table 315-1's ~1,900 use-name lines dilute the density ratio. Read 2026-08-12.
  allow_thin: true
# Table 315-2 states the pod's dimensions and points somewhere else for two
# standards that decide whether it fits at all. "District Land Area (DLA) for
# Calculating Density Pursuant to Section 1012" is the density row, and
# "Minimum Density: See Section 1012" is the whole of the floor. A table that
# cites another section for its number has not stated one.
- id: zdo.1012
  url: https://www.clackamas.us/planning/zdo1012
  title: Clackamas County ZDO Section 1012 - Lot Size and Density
  # Read before encoding anything else out of this section. 1012.01 states
  # what it applies to, and it is a list of applications rather than a list
  # of buildings: subdivisions, partitions, Type II replats, design review
  # for dwellings, and conditional uses for dwellings. A quadplex on a lot
  # nobody divides reaches that list only through "design review", and
  # whether one is required is not a fact any parcel here carries. That is
  # why 1012.08's minimum density is not encoded on top of being underived
  # -- two reasons, and either alone would be enough.
  start: "1012.01"
  end: "Return to the Zoning and Development Ordinance main page"
# Table 315-1 marks every Quadplexes cell P7,8, and note 8 is this section:
# "The development of a triplex, quadplex, townhouse, or cottage cluster is
# subject to Section 845." It carries the one minimum lot size that governs
# the pod anywhere in unincorporated Clackamas.
- id: zdo.845
  url: https://www.clackamas.us/planning/zdo845
  title: Clackamas County ZDO Section 845 - Triplexes, Quadplexes, Townhouses, and Cottage Clusters
  start: "845.01"
  end: "Return to the Zoning and Development Ordinance main page"
# Where the parking number is. Section 845 governs how this building is
# designed and states no parking quantity and no stall of its own, so the
# quadplex falls to the general chapter, and Table 1015-2 names it in a row of
# its own. It is named a second time three subsections down -- "quadplexes not
# developed pursuant to Section 845" have to designate short- and long-term
# bicycle parking -- so the county knows how to hold an 845 quadplex out of a
# parking standard, and did not do it in the table that counts spaces.
# The sentence directly under Tables 315-2 through 315-4: "Except in the HDR,
# SHD, and RCHDR Districts, modifications to the standards in these tables also
# are established by Section 903, Setback Exceptions." The tables it modifies
# are the ones this layer's setbacks are read from, and the districts it is
# withheld from are three the pod does not occupy. A section that modifies the
# numbers a screen measures with has to be read before the numbers can be
# trusted, whichever way it points.
- id: zdo.903
  url: https://www.clackamas.us/planning/zdo903
  title: Clackamas County ZDO Section 903 - Setback Exceptions
  start: "903.01"
  end: "Return to the Zoning and Development Ordinance main page"
- id: zdo.1015
  url: https://www.clackamas.us/planning/zdo1015
  title: Clackamas County ZDO Section 1015 - Parking and Loading
  start: "1015.01"
  end: "Return to the Zoning and Development Ordinance main page"
# 1015.02(A)(4) hands curb length, stall depth and aisle width to the Roadway
# Standards, so the chain leaves the ZDO here. Section 320 is the parking
# section of the June 2020 edition. The February 2013 edition it replaced
# stated "24 feet of back up maneuvering room" for 90-degree spaces and pointed
# back at "ZDO Section 1007.07", which today is Transportation Facilities
# Concurrency; both the number and the pointer were dropped, and a superseded
# standard is not this county's standard.
- id: roadway.320
  url: https://dochub.clackamas.us/documents/drupal/fc5951b3-7eab-424c-a4d2-b484220a3ffb
  title: Clackamas County Roadway Standards Section 320 - Parking Areas
  start: "320.1 Maximum Slopes and Grades"
  # The chapter prints its own section headings in the contents first.
  nth: 2
  end: "SECTION 330 - COMMERCIAL, INDUSTRIAL AND MULTIFAMILY DRIVEWAYS"
  # 71 lines: one section of a 300-page manual, sliced to the parking part.
  allow_thin: true
# And Section 320 hands them on again, to two CAD sheets. Both are stored and
# both store three lines, because a drawing's only extractable text is its
# title block. That title block is not nothing -- it carries the stall size,
# and it is the only place either number is written rather than drawn -- but
# the aisle the sheets are named for is geometry. See `parking_stall_width_ft`
# below, and the aisle refusal beside it.
#
# Not recorded in `crossrefs:`, which would be the obvious place: that ledger
# keys on section numbers it finds in stored text, and "Standard Drawing P100"
# is not one. A redirect into a drawing is a shape it cannot see, so a row for
# it would point at nothing and read as stale. The refusal carries it instead.
- id: roadway.p100
  url: https://dochub.clackamas.us/documents/drupal/6dab9eb0-a4d6-44bc-8246-bc4465676fbd
  title: Clackamas County Roadway Standard Drawing P100 - Parking and Aisle Layout Details (9' x 18')
  allow_thin: true
- id: roadway.p200
  url: https://dochub.clackamas.us/documents/drupal/2d34b4ce-c522-41a2-96a1-e194fde00d58
  title: Clackamas County Roadway Standard Drawing P200 - Parking and Aisle Layout Details (8.5' x 16')
  allow_thin: true
defaults:
  # DRIVEWAY AND PARKING PLACEMENT, read 2026-08-27 out of Section 845, which
  # is the section Table 315-1's note 8 sends this building to for everything.
  # Unincorporated Clackamas is Fairview's shape almost word for word, because
  # both are the state middle-housing model code, and it is the layer that
  # first showed this corpus the gap -- ZDO 845.02 was transcribed as an
  # unencodable rule before any of the six cities were.
  #
  # 845.02, Driveway Entries: "The total width of all driveway entries shall
  # not exceed 32 feet." The same 32 feet as Fairview FMC 19.30.040(F)(1) and
  # Wilsonville 4.113(.14)D.4. Entries may be separated on a local street
  # subject to the Roadway Standards' spacing, and a lot of record with more
  # than one street frontage takes access from the lowest-classified street --
  # street class again, and unmeasured.
  driveway_approach_max_width_ft:
    value: 32
    cite: Clackamas ZDO 845.02, Driveway Entries, total width of all driveway entries
    url: https://www.clackamas.us/planning/zdo845
    retrieved: '2026-08-27'
    quote: "or/clackamas/_unincorporated/zdo.845.txt#L19,L43-L49"
  # 845.02, Garages and Off-Street Parking Areas: they "shall not be located
  # between a building and a public street (other than an improved alley...),
  # except in compliance with Subsections 845.02(1) and (2)", and (2) is "the
  # combined width of all garages and off-street parking areas located between
  # a building and a public street does not exceed a total of 50 percent of
  # the street frontage".
  parking_area_max_frontage_pct:
    value: 50
    cite: Clackamas ZDO 845.02, combined width of garages and off-street parking areas between a building and a public street
    url: https://www.clackamas.us/planning/zdo845
    retrieved: '2026-08-27'
    quote: "or/clackamas/_unincorporated/zdo.845.txt#L19,L51-L55"
  # Exempt rather than true, and READ THE APPLICABILITY BEFORE COPYING THIS.
  # Section 845 states a flat prohibition -- "Off-street motor vehicle parking
  # spaces and motor vehicle maneuvering areas, except driveways, shall not be
  # located ... between a front lot line and the front facade of the
  # dwelling(s)" -- and it is in 845.04, Cottage Clusters. What 845.02 gives a
  # quadplex is the conditional allowance above: parking between the building
  # and the street is permitted where a dwelling screens it or where it stays
  # inside half the frontage. Encoding the cottage cluster ban here would have
  # been a number this county does not apply to this building, out of the same
  # document, four subsections down.
  parking_front_prohibited:
    exempt: true
    cite: Clackamas ZDO 845.02, which permits parking between a building and a public street subject to two conditions; the flat prohibition at 845.04 governs cottage clusters
    url: https://www.clackamas.us/planning/zdo845
    retrieved: '2026-08-27'
    quote: "or/clackamas/_unincorporated/zdo.845.txt#L19,L51-L55,L121,L193-L197"
  # 845.03(E)(1)(c), on unit lots: "Driveways and off-street parking areas
  # shall not exceed 12 feet wide." Twelve again -- Gresham, Fairview,
  # Wilsonville and Oregon City all say twelve and Milwaukie says ten. Fail
  # any of the four standards at 845.03(E)(1) and (E)(2) sends parking out of
  # the strip between the townhouse and the street and consolidates every lot
  # onto a single driveway. On one lot 845.02 caps a share of the frontage and
  # states no width.
  parking_maneuvering_max_width_ft:
    exempt: true
    cite: Clackamas ZDO 845.02, which caps a share of the street frontage and states no maneuvering-area width
    url: https://www.clackamas.us/planning/zdo845
    retrieved: '2026-08-27'
    quote: "or/clackamas/_unincorporated/zdo.845.txt#L19,L51-L55"
    variants:
      - value: 12
        when: [unit_lots]
        cite: Clackamas ZDO 845.03(E)(1)(c), driveways and off-street parking areas on a townhouse lot
        quote: "or/clackamas/_unincorporated/zdo.845.txt#L57,L99-L109"
  #
  # PARKING, read 2026-08-27. Four spaces, nine by eighteen feet each, and no
  # aisle -- which is the whole of why this layer still does not lay out.
  #
  # Table 1015-2, Minimum Automobile Parking Space Requirements for Dwellings,
  # prints a Quadplex row against nine district columns and fills all nine, so
  # the row is positional and nothing is merged. The first two columns are
  # "R-5 - R-30" and "VR-4/5 & VR-5/7", which between them are all nine zones
  # in this layer -- R-8.5 is not named because it sits inside the range -- and
  # both cells read "1" under note 3. Note 3 is about
  # converting a detached dwelling to middle housing and adds nothing to a new
  # build. Note 1 supplies the unit: "expressed as number of spaces per
  # dwelling unit, unless otherwise stated."
  #
  # That cell is the reason this file's extractor is at flats-html-text/7. The
  # county marks it `1<sup>3</sup>`, and until the extractor learned to hold a
  # superscript apart from the text under it, the store held "13" -- thirteen
  # spaces per dwelling unit, in a corpus where nothing would have questioned
  # it, because the marker that would have shown the join was the thing that
  # got eaten.
  parking_min_per_unit:
    value: 1
    cite: Clackamas ZDO Table 1015-2, Quadplex row, R-5 through R-30 and VR-4/5 & VR-5/7 columns
    url: https://www.clackamas.us/planning/zdo1015
    retrieved: '2026-08-27'
    quote: "or/clackamas/_unincorporated/zdo.1015.txt#L218,L220-L222,L334-L336,L356,L360"
  # Worth knowing what this changes today, which is nothing, and why it is
  # still worth having. The state layer caps a quadplex at four spaces in
  # total under OAR 660-046-0220(2)(e)(B), `preempts: cap`, so on a large lot
  # the ceiling and the county's four land on the same number and the resolved
  # value cites the state. On a small lot the state's band drops to two or one
  # and the cap binds below the county. Either way the screen counted the right
  # number before this was encoded -- because the cap was standing in for a
  # requirement nobody had read. Now the requirement is read, and if Oregon
  # ever loosens the cap the county's own figure is here to take over.
  # NINE BY EIGHTEEN, AND THE ZDO SAYS 8.5 BY 16. Both are true and the larger
  # is the one to screen on.
  #
  # 1015.02(A)(2) states a floor -- "Automobile parking spaces shall be a
  # minimum of 8.5 feet wide and 16 feet long" -- and (A)(4) immediately hands
  # curb length, stall depth and aisle width to the Roadway Standards, whose
  # 320.5(a) requires that dimensions "meet the ZDO and Roadway Standard
  # Drawing P100 or P200". P100 is titled "(9' x 18')" and P200 "(8.5' x 16')",
  # so the county publishes two stalls and the ZDO's floor is the smaller of
  # them. (A)(3) settles which is which: "a minimum of 25 percent of required
  # parking spaces shall be no larger than 8.5 feet wide and 16 feet long" is a
  # rule requiring compact spaces, which only makes sense if 8.5 by 16 is the
  # compact one.
  #
  # Four spaces, at least one of them compact, and the code names no rule
  # choosing the size of the other three. A lot that holds four 9 by 18 stalls
  # holds any lawful mix of the two; a lot sized to 8.5 by 16 throughout may
  # hold none. So the larger is encoded, and the direction of the error is a
  # lot called too tight rather than a lot called buildable that is not.
  parking_stall_width_ft:
    value: 9
    cite: Clackamas County Roadway Standard Drawing P100, Parking and Aisle Layout Details (9' x 18'), required by Roadway Standards 320.5(a) and ZDO 1015.02(A)(4)
    url: https://dochub.clackamas.us/documents/drupal/6dab9eb0-a4d6-44bc-8246-bc4465676fbd
    retrieved: '2026-08-27'
    quote: "or/clackamas/_unincorporated/roadway.p100.txt#L2"
  parking_stall_depth_ft:
    value: 18
    cite: Clackamas County Roadway Standard Drawing P100, Parking and Aisle Layout Details (9' x 18'), required by Roadway Standards 320.5(a) and ZDO 1015.02(A)(4)
    url: https://dochub.clackamas.us/documents/drupal/6dab9eb0-a4d6-44bc-8246-bc4465676fbd
    retrieved: '2026-08-27'
    quote: "or/clackamas/_unincorporated/roadway.p100.txt#L2"
  #
  # NOT ENCODED: the drive aisle, and this is a new shape of refusal. It is not
  # that the county states no aisle -- ZDO 1015.02(A)(4) says parking areas
  # "shall comply with minimum dimensions for curb length, stall depth, and
  # aisle width established by the Clackamas County Roadway Standards", and
  # Roadway Standards 320.3(a) says "for dimensions of parking spaces and drive
  # aisles refer to Standard Drawings P100 and P200". The chain is complete and
  # it terminates in a picture. Both sheets were fetched and both extract three
  # lines of title block; every dimension on them is drawn. The aisle is the
  # one number in this layer that a person with the sheet open could read in
  # five seconds and no reader here can reach, and it is why unincorporated
  # Clackamas -- 18,662 lots the pod fits, the third largest count in the
  # corpus -- still produces no site plan. `exempt: true` would be a lie: the
  # standard exists.
  #
  # MEASURED 2026-08-30 rather than assumed, so nobody re-probes it. Both
  # sheets were pulled again and read with pypdf directly: P100 is 145,533
  # bytes and yields 69 characters of text, P200 is 148,575 and yields 71, and
  # in both cases every one of those characters is the title block. It is not
  # that our extractor is losing the callouts -- there are no text objects on
  # the sheet to lose. The car aisle appears nowhere in the words of the
  # chapter either: `aisle` occurs eleven times across ZDO 1015 and Roadway
  # Standards 320 and the only one carrying a figure is the FIVE-FOOT BICYCLE
  # aisle at 1015.07(B)(2). Closing this needs a person to read a drawing, or
  # a decision to let OCR be evidence -- which would change what a `quote:`
  # means everywhere in this corpus, and is not a decision an encoding makes.
  #
  # What it costs, measured on the 2026-08-30 site-plan run: 598 green and
  # 16,888 review lots here are graded with no parking laid out, and those
  # 16,888 are HALF the corpus's entire 33,626-lot review queue. No other open
  # question in this project is worth as many lots.
  # (or/clackamas/_unincorporated/zdo.1015.txt#L29,
  #  or/clackamas/_unincorporated/roadway.320.txt#L18,L23,L40,L42-L43)
  #
  # NOT ENCODED: covered parking above 3,500 feet. Table 1015-2 note 2 requires
  # that "on land above 3,500 feet in elevation, covered parking shall be
  # provided for structures containing three or more dwelling units", which the
  # pod is. A roof over four stalls is a second structure on the lot and it
  # would compete with the pod for the same ground, so this is a fitment
  # standard and not a paperwork one. It is refused rather than carried as
  # `unmeasured` because there is nothing to cap: no field here holds whether a
  # stall is covered, so the note has no encoded value to attach to. Worth
  # writing down because unlike most conditions this corpus refuses, it is
  # genuinely reachable -- unincorporated Clackamas runs from the Willamette up
  # to Mount Hood, and the county has residential districts above the line.
  # (or/clackamas/_unincorporated/zdo.1015.txt#L358)
  #
  # NOT ENCODED: parking maximums, and deliberately left to inherit rather than
  # marked exempt. Table 1015-1's Dwellings row states no number and defers to
  # Table 1015-2, and 1015-2 is titled "Minimum" and states a maximum only in
  # its note 4, which is about townhouses. So the county caps nothing on a
  # quadplex -- but the state does, under OAR 660-046-0220, and writing
  # `exempt: true` here would resolve over the state layer and delete a cap
  # that binds. Absence inherits; exempt overrides.
  # (or/clackamas/_unincorporated/zdo.1015.txt#L71,L73-L76,L98,L218,L362)
  #
  # NOT ENCODED: 845.04's ten-foot setbacks -- parking and maneuvering out of
  # the first ten feet from a front lot line, and parking spaces (though not
  # maneuvering) out of ten feet from rear or side lot lines. A ten-foot rear
  # and side standoff would reshape a rear court, and it is the only place in
  # this corpus a lot-line setback is stated of a STALL rather than a
  # building. It is not encoded because it is stated of cottage clusters, in
  # the subsection this file's `parking_front_prohibited` note is about, and
  # 845.02 states no equivalent for a quadplex. (or/clackamas/_unincorporated/zdo.845.txt#L121,L193-L199)
  #
  # READ AND DOES NOT REACH: Section 903, Setback Exceptions, fetched 2026-09-02
  # because the sentence citing it sits directly under the tables this layer's
  # setbacks are read from -- "Except in the HDR, SHD, and RCHDR Districts,
  # modifications to the standards in these tables also are established by
  # Section 903, Setback Exceptions." A section that modifies those numbers has
  # to be read whichever way it points, and this one only ever points one way.
  # 903.02 REDUCES a front setback where an adjoining lot is lawfully
  # nonconforming, and separately for additions to an existing structure; 903.03
  # is public dedications against existing structures; 903.04 exempts
  # underground structures, ground-mounted solar, rainwater collection and bus
  # shelters from rear and side setbacks; 903.05 lets architectural features
  # project into a setback; 903.06 gives an uncovered deck under 30 inches its
  # own smaller setbacks; 903.07 is fences; 903.08 relabels the lot lines of a
  # flag lot. Nothing in the section adds a foot to what Table 315-2 states, so
  # the encoded setbacks are the binding ones and every relief it offers is left
  # unclaimed, which is the conservative side.
  # (or/clackamas/_unincorporated/zdo.903.txt#L1-L69)

