      a reading of a prohibition, so it is the one in this section most worth
      arguing with.

      What the table says is L[15]. "L" is defined in 510.03 as a limited use
      that "shall be developed concurrently with, or after, a primary use", and
      note 15 says what that means here: "Duplexes, triplexes, quadplexes, and
      multifamily dwellings, subject to the density standards of the MR-2
      District, may be developed in the same building as a primary use." A
      quadplex is permitted in OA. It is permitted inside somebody else's
      building.

      This product is a fixed-dimension factory-built four-unit attached
      townhome placed on a lot of its own. It is not floor area inside an
      office building, and it cannot become floor area inside one. The column
      head carries the arithmetic that settles it even if the sentence did not:
      OA reads OA[2,3], and those two notes require a minimum of 60 percent of
      a site's total building floor area to be primary uses and cap all limited
      uses at 40 percent.

      The county's own vocabulary is the corroboration. Notes 12 and 14 exist
      precisely to tell "freestanding quadplexes" apart from "quadplexes in a
      mixed-use building", and they send the freestanding kind somewhere else
      for its standards. A code that draws that line in two other notes has
      drawn it here too.
