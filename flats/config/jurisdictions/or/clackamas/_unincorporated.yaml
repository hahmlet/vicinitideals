# Map codes this layer does not hold as zone blocks, ruled once (2026-09-20,
# Steph's rule: read every code, write the reason down, never show it again;
# only a code nobody has seen warns). A ruled code gates ZONE_POCKET,
# ZONE_UNENCODABLE or ZONE_TO_READ in the copy instead of ZONE_NOT_ENCODED,
# and folds away on the County copy page. The refusals -- districts whose use
# table says no -- are zone blocks above, not rulings, because a refusal is a
# rule the screen answers RED with.
# Which of this county's districts are the "Urban Low Density Residential,
# VR-5/7, or VR-4/5 District" that ZDO Table 315-4 note 14 charges an MR-1 or
# MR-2 lot ten feet of side yard against -- the fact quadfit's s4 reads off
# the taxlot fabric across every non-street lot line (neighbour_zones_json),
# turned into `abuts_lower_density_zone` by flats/geom/neighbour.py against
# these lists. Only that condition is declared: `abuts_residential_zone` and
# `abuts_nonresidential_zone` turn nothing in this layer.
neighbours:
  abuts_lower_density_zone:
    true_for: [R2.5, R5, R7, R8.5, R10, R15, R20, R30, VR57, VR45]
    false_for: [MR1, MR2, PMD, VA, HDR, SHD, RCHDR, VTH, NC, C2, C3, OA, CC, RTL,
                RCC, RCO, OC, SCMU, PMU1, PMU2, PMU3, VCS, BP, LI, GI, RI, OSM,
                RRFF5, FU10, RA1, RA2, FF10, AGF, EFU, TBR, RC]
    quote: "or/clackamas/_unincorporated/zdo.315.txt#L7,L1566"
    cite: Clackamas ZDO 315.01 (the districts Section 315 applies to, by name and
      code); ZDO Table 315-4 note 14; ZDO 316.01 and Table 316-1 (the rural and
      future urban residential districts); ZDO 510 Table 510-1 (the urban commercial
      and mixed-use districts)
    note: >-
      The note names its own trigger and 315.01 spells the names out:
      "Urban Low Density Residential (R-2.5, R-5, R-7, R-8.5, R-10, R-15,
      R-20, and R-30), Village Standard Lot Residential (VR-5/7), Village
      Small Lot Residential (VR-4/5)" -- ten districts, the true_for side,
      spelled the way Metro's fabric prints the county's codes (R10, VR57).
      Everything else the county zones is the false_for side because the
      note is a closed list and a district it does not name is not on it:
      the rest of 315.01's urban residential roster (VTH, PMD, MR-1, MR-2,
      HDR, VA, SHD, RCHDR), the urban commercial and mixed-use districts of
      Section 510, the industrial and open-space districts, and the rural
      districts of Sections 316, 401, 406, 407 and 513 -- Section 316 calls
      its own "Rural Residential and Future Urban Residential", not Urban
      Low Density, so an MR lot at the growth boundary abutting RRFF-5 keeps
      the seven. Codes the fabric carries as another city's pocket (R-10,
      R-15, R-MD, IPU, MG, RC-ME) and the rural codes this layer never
      reaches (RR, HR, MRR, RTC) are on neither list, so a line against one
      is unresolved and the lot stays UNKNOWN on the fact. The condition is
      true of a lot when ANY non-street line has a true_for-side lot across
      it, which is the tightening answer (ten feet where seven was offered);
      false needs every line fully read with nothing on the true_for side
      across any of them. Note 14 speaks of the side lot line and the fact
      is per lot, so a rear neighbour in R-7 charges the sides ten as well
      -- coarse in the direction that never buys a GREEN.

zone_rulings:
  # --- four residential districts read and not holdable ---------------------
  HDR:
    outcome: unencodable
    note: >-
      High Density Residential, 251 lots. Quadplexes P in Table 315-1, and
      Table 315-4 answers rear setback, side setback and building separation
      with "See Subsection 1005.02(L)": a separation drawn as an angle from
      the top of the building -- 60 degrees to the north, 15 degrees east and
      west, "Separation = b x .267 (tan 15 degrees)" -- which needs the
      bearing of every lot line, a measurement this system does not take.
      Not modifiable under Section 904 (1005.02(L)(4)). Expires the day
      lot-line bearing is measured; the districts ledger holds the same
      ruling as `encode`.
  SHD:
    outcome: unencodable
    note: >-
      Special High Density, one lot (4400 SE Naef Rd). Quadplexes P in Table
      315-1; setbacks deferred to Subsection 1005.02(L), the same bearing
      planes as HDR, and 1005.02(L)(4) closes Section 904 relief.
  RCHDR:
    outcome: unencodable
    note: >-
      Regional Center High Density Residential, 29 lots. Quadplexes P in
      Table 315-1; setbacks deferred to Subsection 1005.02(L), read
      2026-09-08 and blocked on lot-line bearings. RCC and RCO below wait on
      it through Table 510-1 note 12.
  VTH:
    outcome: unencodable
    note: >-
      Village Townhouse, 114 lots. Quadplexes P in Table 315-1, but its
      standards are in Table 315-3, which prints two cells under three
      district headings in several rows: the extractor drops empty cells, so
      lot size, coverage and rear setback are a column question before they
      are a reading (HUMAN_TODO 15). Also blocked on 1005.02(L) with HDR.
  # --- six commercial districts that permit the building and send it to HDR
  # or RCHDR for its standards (Table 510-1 notes 12 and 14, "freestanding
  # ... quadplexes (as opposed to ... quadplexes in a mixed-use building)") --
  RTL:
    outcome: unencodable
    note: >-
      Retail Commercial, 59 lots. P[14] on the Quadplexes row of Table 510-1;
      note 14 sends a freestanding quadplex to the HDR District for its
      development and dimensional standards, and HDR is blocked on
      1005.02(L)'s bearing planes. Unencodable until HDR is.
  CC:
    outcome: unencodable
    note: >-
      Corridor Commercial, 128 lots. P[14] on the Quadplexes row; the same
      referral to HDR as RTL, and the same block.
  C3:
    outcome: unencodable
    note: >-
      General Commercial, 447 lots, the largest commercial district in this
      layer. P[14] on the Quadplexes row; note 14 sends a freestanding
      quadplex to HDR, which 1005.02(L) blocks.
  OC:
    outcome: unencodable
    note: >-
      Office Commercial, 82 lots. P[14], the same referral to HDR. (510.02
      misprints its abbreviation as OA; Table 510-1's column heads print OA
      and OC as separate columns 9 and 10.)
  RCC:
    outcome: unencodable
    note: >-
      Regional Center Commercial, 103 lots. P[12] on the Quadplexes row; note
      12 sends a freestanding quadplex to the RCHDR District for its
      standards, and RCHDR is blocked on 1005.02(L).
  RCO:
    outcome: unencodable
    note: >-
      Regional Center Office, 37 lots. P[12], the same referral to RCHDR as
      RCC. Table 510-2 gives it the largest minimum lot in the section at
      2 1/2 acres, which would bind first if the district were ever held.
  # --- four to read --------------------------------------------------------
  SCMU:
    outcome: to_read
    note: >-
      Station Community Mixed Use, 34 lots. P on the Quadplexes row with no
      note. Table 510-2 omits SCMU from its header while every data row
      carries eleven cells, and its cell in each setback row reads "See
      Subsection 1005.09" -- Fuller Road Station Community standards, 365
      lines in the store since 2026-09-08 and unread. Reading 1005.09 against
      the SCMU column is the whole job.
  PMU1:
    outcome: to_read
    note: >-
      Planned Mixed Use site 1, 14 lots. P on the Quadplexes row, no note;
      its dimensions are site-specific -- Table 510-2 prints six minimum lot
      sizes under one column head (PMU1 none) and Table 510-3 states the
      rest per site. To encode per site from Table 510-3.
  PMU2:
    outcome: to_read
    note: >-
      Planned Mixed Use site 2, 2 lots. Same shape as PMU1: Table 510-2 gives
      it a 2-acre minimum lot and Table 510-3 the rest, per site, unread.
  PMU3:
    outcome: to_read
    note: >-
      Planned Mixed Use site 3, 1 lot. Same shape as PMU1: Table 510-2 gives
      it a 3-acre minimum lot and Table 510-3 the rest, per site, unread.
