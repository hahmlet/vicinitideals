      corner lot developed with a townhouse), 5 (nonconforming detached
      dwellings), 11 (a swimming pool's side and rear), 12 (accessory
      buildings by area and height) and 15 (a townhouse with no common wall)
      are ruled in the footnote file against other buildings. Note 10 is the
      planned unit development path. Note 14 was `unmeasured` and capped the
      side setback until 2026-09-22; it is now the variant at that field,
      answered per lot by the zone s4 read across each lot line.
