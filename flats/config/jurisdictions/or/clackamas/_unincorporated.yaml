    max_coverage_pct:
      value: 50
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1297-L1299"
    notes: 'Adopted ZDO 315 Table 315-3 (layer literal ''VR57'' = ZDO ''VR-5/7''). Quoted 2026-08-16 per
      row, each quote spanning the row label and every value printed under it so a reviewer can count
      values against the three column headers. Front, maximum front and side are three-value rows and
      read positionally; rear and coverage are two-value rows whose values are identical, so the merge
      cannot change the answer.

      Side is 0 on one side and 5 on all others, modelled as a uniform 5. The zero is real but it is
      not the pod''s: it is one lot line''s worth, and the field holds one number for both sides. A
      pod that wants the zero needs the site plan to claim which side, which is a fitment question
      rather than a rules one.

      NOT ENCODED: minimum lot size. The row is "District Land Area for Calculating Density Pursuant
      to Section 1012/Minimum Lot Size" and prints "5,000/4,000" — two labels, two numbers, so the
      stated minimum lot size is 4,000 and the 5,000 is the density figure. Section 845 also waives
      the minimum for a middle housing land division. Encoding 4,000 would be the looser of two
      readings on a row that decides whether a lot qualifies at all, so it waits for a person.'
