    note: >-
      ZDO 1005.12, and the single line the reader caught -- a 10-foot-wide sidewalk fronting
      Government Camp Loop, with covered walkways at a minimum of 8 feet -- is the whole of what
      it holds. This is the Government Camp design section: mountain architecture in the
      Cascadian, Oregon Rustic and National Park styles, no composition shingles, no exposed
