    setback_front_max_ft:
      value: 18
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1328-L1331"
    setback_garage_entrance_ft:
      # The VR-5/7 cell is two standards in one sentence: 10 ft to a dwelling
      # with a recessed garage or none, 19.5 ft to the garage door where the
      # garage is not recessed. The front setback holds the first; this holds
      # the second, so a pod with a street-facing garage is measured against
      # what the code actually asks rather than against the shorter half.
      value: 19.5
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1324-L1327"
    setback_side_ft:
      value: 5
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1335-L1338"
    setback_rear_ft:
