      # Same reading, same quote and same number as the eight R zones above.
      value: 7000
      cite: "Clackamas ZDO 845.01 (general standards, minimum lot size)"
      url: https://www.clackamas.us/planning/zdo845
      retrieved: '2026-09-08'
      quote: "or/clackamas/_unincorporated/zdo.845.txt#L3,L7"
    max_height_ft:
      # "None". Not a number we failed to find -- the cell is printed and it
      # is empty of any ceiling, in a table whose other rows print numbers
      # freely and whose VA column prints 45. Section 904 offers height
      # EXCEPTIONS, which presuppose a standard to except from and cannot
      # create one, and Section 845 states no height for a quadplex.
      exempt: true
      cite: Clackamas ZDO Table 315-4, Maximum Building Height row, PMD column ("None"); Section 845 states no height for a quadplex
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1518-L1525"
    setback_front_ft:
      value: 15
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1486-L1493"
    orientation_constraint:
      # ZDO 1005.02(E): "Inside the UGB, except for industrial developments, a
      # minimum of 50 percent of the street frontage of the development site
      # shall have buildings located at the minimum front setback line."
      #
      # This district's Maximum Front Setback cell in Table 315-4 is not a
      # number -- it reads "See Subsections 1005.02(E) and (H)" -- so that
      # sentence IS this district's maximum front setback standard, and the
      # county wrote it as a share of frontage rather than as a depth.
      #
      # ENCODED THE WAY GRESHAM'S IDENTICAL STANDARD IS ENCODED, and for the
      # identical reason. Gresham 7.0420(J)(1)(a) asks for "a minimum of 50
      # percent of the site's frontage" to "be occupied by buildings oriented
      # to the abutting street", and the note beside that value says half a
      # frontage built out in a band a few feet deep is only reachable with
      # the long axis parallel to the street. One sentence, two counties, one
      # consequence the fit stage can actually use.
      #
      # WHY THIS REACHES A QUADPLEX, checked in three places rather than
      # assumed. Section 845 is the middle-housing section and says nothing
      # about Section 1005 in either direction -- ZDO 315 note 8 makes 845
      # additive ("subject to Section 845") and Table 315-3 note 23 says its
      # standards "apply in addition to" the table's. 1005.02 opens "The
      # following site design standards apply" and names no use; its only
      # carve-outs are industrial and warehouse. The one exemption written in
      # middle housing's name is 1005.03(I)(6), and it is attached to a list
      # of additional BUILDING DESIGN requirements -- balconies per four
      # units, window placement -- in a different subsection from this one.
      # Table 315-3 note 12 then exempts cottage clusters, and only cottage
      # clusters, from maximum setback standards: a drafter who meant to
      # release a quadplex had the sentence to hand and did not write it.
      #
      # WHAT IS NOT ENCODED, because no field holds it. The percentage is also
      # a ceiling on frontage: one pod is one building, so it can only occupy
      # half of a frontage up to twice its own width, and past that no
      # placement satisfies (E) at all. The registry has `min_frontage_ft` and
      # `parking_area_max_frontage_pct` and nothing for a building's share of
      # a frontage. That is the same hole Gresham's reading left open, and it
      # is a floor on what this encoding claims rather than a reason to
      # withhold it.
      #
      # Also not encoded, deliberately: 1005.02(E)(1) lets a front setback
      # under 20 feet be increased to 20 where pedestrian amenities are
      # developed in the setback area, which is a relaxation bought with
      # amenities; and Subsection (H), cited by the same cell, reaches "new
      # retail, office, mixed use, multifamily, and institutional buildings
      # located at a major transit stop" and turns on sitting within a
      # 200-foot radius of one, which is on this project's unmeasured
      # site-facts list.
      value: axis_required
      cite: "Clackamas ZDO 1005.02(E), general site design standards -- frontage occupancy, cited as this district's maximum front setback by Table 315-4"
      url: https://www.clackamas.us/planning/zdo1005
      retrieved: '2026-09-08'
      quote: "or/clackamas/_unincorporated/zdo.1005.txt#L25,L61"
    setback_garage_entrance_ft:
      # The same cell, second clause: "15 feet, except 20 feet to garage and
      # carport motor vehicle entries". Encoded although the 2026-09-08 ruling
      # is that this pod has no garage, for the same reason the R zones carry
      # it: the standard is real and the field is what declares that we read
      # it and decided it does not reach us.
      value: 20
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1486-L1493"
    setback_rear_ft:
      # Thirty feet, and PMD is the only district in this table that asks it.
      value: 30
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1502-L1509"
    setback_side_ft:
      # Thirty feet on each side as well, which is the whole reason PMD is
      # nine lots of interest rather than nine lots of opportunity: sixty feet
      # of side yard on a district whose name is "medium density".
      value: 30
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1510-L1517"
    min_building_separation_ft:
      value: 10
      quote: "or/clackamas/_unincorporated/zdo.315.txt#L1526-L1533"
    parking_min_per_unit:
      # Table 1015-2, Quadplex row, ninth column ("All Other Zoning
      # Districts"): "Same as multifamily dwelling". The multifamily rows are
      # per bedroom and the ninth column reads 1, 1.25 and 1.5 down them. The
      # quote takes the table title, all nine column heads, the three
      # multifamily bedroom rows and the Quadplex row, because the value is
      # reached by two hops and both have to be countable.
      value: 1.5
      cite: Clackamas ZDO Table 1015-2, Quadplex row, All Other Zoning Districts column, by way of the Multifamily Dwelling rows
      url: https://www.clackamas.us/planning/zdo1015
      retrieved: '2026-09-08'
      quote: "or/clackamas/_unincorporated/zdo.1015.txt#L218,L220-L229,L303,L324-L333,L334,L343,L356"
    notes: >-
      Encoded 2026-09-08 from Table 315-4, the first reading of this table in
      this layer. Nine lots.

      NOT ENCODED, with reasons. DENSITY: Table 315-4 gives PMD a district
      land area of 3,630 square feet per dwelling unit
      (zdo.315.txt#L1462-L1469), which ZDO 1012.04(A) does not waive for a
      quadplex in this district, so four units want 14,520 square feet of net
      site area. Held out because this model has no field for a lot area per
      dwelling unit and converting it to 12 units per acre would put a number
      in the corpus that the county never printed -- and because OAR
      660-046-0220(2)(b) forbids applying it in any case. Written out at the
      head of this block. Maximum front setback reads "See Subsections
      1005.02(E) and (H)". READ AND NOW ENCODED, 2026-09-09: ZDO 1005 was
      fetched 2026-09-08 and this sentence is no longer a withheld refusal.
      (E) is a frontage-occupancy rule rather than a depth -- half the site's
      frontage must carry buildings at the minimum front setback line -- and
      it is carried on this zone as `orientation_constraint: axis_required`,
      the same encoding Gresham's identical 7.0420(J)(1)(a) has. See the note
      beside that value for why it reaches a quadplex and for the part of it
      no field can hold. (H) is not encoded: it reaches buildings at a major
      transit stop and turns on a 200-foot radius nothing here measures.
      Minimum density is "See Section 1012" and is not a standard this screen
      reads.

      Note 10 (a planned unit development has no interior rear or side
      setback) is the only footnote on any PMD cell and is ruled in the
      footnote file as another application path, the same treatment the R
      zones give the identical sentence in Table 315-2.
