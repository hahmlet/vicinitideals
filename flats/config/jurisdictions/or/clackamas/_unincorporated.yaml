  # === Table 315-4 and the R-2.5 refusal, encoded 2026-09-08 ================
  #
  # This layer held nine zones and the parcel corpus assigns thirty-one. The
  # nine were the ones Table 315-2 and Table 315-3 answer; the county's medium
  # and high density districts sat unencoded and unranked, because the ledger
  # that ranks encoding work was built from a Multnomah-only parcel file and
  # counted no lot in this county at all. It counts them now, and MR-1 is the
  # largest single unencoded zone in either county: 839 lots.
  #
  # Five zones are added here and three are deliberately not.
  #
  # HDR (253 lots), RCHDR (32) and SHD (1) print "See Subsection 1005.02(L)"
  # where their rear and side setbacks belong. ZDO 1005 was fetched on
  # 2026-09-08 and 1005.02(L) is now READ -- and it is worse than a missing
  # document. It sets a north-south separation as a function of building
  # height and the BEARING of the northern lot line ("Separation = b x .267
  # (tan 15 degrees)"), which is a measurement nothing in this system takes;
  # lot-line bearing is on the computable half of the unmeasured-site-facts
  # list but is not computed yet. So these three stay `zone_missing` for a
  # reason that has changed under them: not "we have not read it" but "we have
  # read it and cannot hold it". They remain a queue entry with a lot count.
  #
  # VTH (115) is refused for a different and more uncomfortable reason: its
  # column in Table 315-3 cannot be read by position. The extractor drops empty
  # table cells, so a row with a blank in it arrives shorter than its header
  # and every cell after the blank shifts left. Table 315-3's rear setback row
  # prints two cells under three district headings. Either VTH has no rear
  # setback or VTH's cell was eaten, and the stored text cannot tell which.
  # That is HUMAN_TODO item 15 in one row, and it is why the item exists.
  R2.5:
