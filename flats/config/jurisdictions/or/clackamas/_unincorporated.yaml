  "zdo.1005.txt#1005.09":
    queue: chapter
    outcome: read_it
    note: >-
      ZDO 1005.09, the design standards for the county's mixed-use districts, and it is queued for
      encoding rather than closed because SCMU is one of the districts this project has never
      encoded and this section is where its dimensions live. What is in it is unusual enough to be
      worth naming now, because it is the reason the district cannot simply be ported from a
      table. THREE OF THE STANDARDS ARE MINIMUMS ON THE BUILDING ITSELF, which is the direction
      this registry is weakest in. "Minimum Building Height: 20 feet, measured to top of parapet
      or roof." "Minimum Ground Floor Height: The ground floor of the building shall measure a
      minimum of 15 feet from floor to ceiling." "Minimum Building Depth: Buildings shall be a
      minimum of 40 feet deep." A two-storey pod at 26 feet clears the first and would fail the
      second outright -- a fifteen-foot ground floor inside a twenty-six-foot building leaves
      eleven feet for the storey above it and the roof -- so this is not a formality. The
      minimum-building-height gap is already on the standing list of things the model cannot hold
      across seven jurisdictions; a minimum ground-floor height and a minimum building depth are
      two more of the same family and are recorded here as such. THE SETBACKS ARE BUILD-TO BANDS,
      not minimums: "the street-facing facade of the building shall be set back a minimum of 10
      feet and a maximum of 15 feet" in one sub-district and "a minimum of five feet and a maximum
      of 15 feet" in another, which the model does hold, as a minimum plus a maximum. And the
      entrance standard asks primary building entrances to face the street and be at least ten
      percent transparent. None of this is encoded today and none of it should be guessed from the
      sections around it: the errand is to read 1005.09 against the SCMU use table first, because
      a district that does not permit the building makes every number above moot, and that
      question has not been asked yet.
