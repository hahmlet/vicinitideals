      area per dwelling unit (zdo.315.txt#L1462-L1469), not waived here by ZDO
      1012.04(A), so four units want 14,520 square feet of net site area
      against the 7,000 Section 845 asks. Twice the lot size standard on 839
      lots, and held out of the corpus for the two reasons written at the head
      of this block: no field can hold a lot area per dwelling unit, and the
      state forbids the standard anyway. If a field is ever added this is the
      first zone that needs it. Maximum front setback is "See Subsections
      1005.02(E) and (H)" -- read 2026-09-09 and now carried as
      `orientation_constraint: axis_required`; see the note beside that
      value. Minimum density is
