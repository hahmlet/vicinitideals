  #
  # THE DRIVE AISLE, READ OFF THE DRAWING 2026-09-03. Twenty-four feet at 90
  # degrees, and it is the first value in this corpus whose evidence is a
  # picture rather than a sentence.
  #
  # The chain of authority was never in doubt and is worth restating, because
  # the flag on these two values is not a shortcut around it. ZDO 1015.02(A)(4)
  # says parking areas "shall comply with minimum dimensions for curb length,
  # stall depth, and aisle width established by the Clackamas County Roadway
  # Standards"; Roadway Standards 320.3(a) says "for dimensions of parking
  # spaces and drive aisles refer to Standard Drawings P100 and P200". The
  # chain is complete and it terminates in a picture. Both sheets were fetched,
  # stored, and re-read with pypdf directly on 2026-08-30 to be sure the fault
  # was not ours: P100 is 145,533 bytes and yields 69 characters, P200 is
  # 148,575 and yields 71, and in both cases every character is the title
  # block. There are no text objects on the sheet to lose. The word `aisle`
  # occurs eleven times across ZDO 1015 and Roadway Standards 320 and the only
  # one carrying a figure is the FIVE-FOOT BICYCLE aisle at 1015.07(B)(2).
  #
  # So it was closed the way the drawing allows: a person opened P100 and read
  # the dimension. `drawn: true` records that, with the name and the date, and
  # `quote:` is absent because there is no line of text to point at -- the
  # model refuses to let a drawn figure carry one. This is weaker evidence than
  # every other number in this file and the difference is repeatability, not
  # effort: a second reviewer cannot re-read a quote that does not exist, so
  # the readiness ledger keeps reporting these two forever rather than clearing
  # them. What was NOT done is letting OCR stand as evidence, which would
  # change what `quote:` means everywhere in this corpus.
  #
  # NOT ENCODED: the 45, 60 and parallel rows on the same sheet. One refusal
  # closes here and another opens in its place, which is the honest bookkeeping
  # -- the sheet dimensions four parking angles and this corpus carries one.
  #
  # 90 degrees is the only row the screen can use today, because it lays out a
  # single typology: a rear court with stalls square to the drive. The angled
  # rows are not a smaller version of that. They buy a narrower aisle in
  # exchange for a deeper stall module and one-way circulation, and on a lot
  # too shallow for 18 + 24 + 18 that trade is the difference between a plan
  # and no plan. Encoding them without a layout that can draw them would put
  # four numbers in the file that nothing reads, and the field registry has no
  # way to say which angle a value is for -- `parking_aisle_two_way_ft` is one
  # field, not four. So the numbers stay on the sheet, and this note is here so
  # the next person knows they exist on a drawing we already hold rather than
  # re-deriving that they might.
  #
  # What it was costing, measured on the 2026-08-30 site-plan run: 598 green
  # and 16,888 review lots graded with no parking laid out, those 16,888 being
  # HALF the corpus's entire 33,626-lot review queue. No other open question in
  # this project was worth as many lots.
  # (or/clackamas/_unincorporated/zdo.1015.txt#L29,
  #  or/clackamas/_unincorporated/roadway.320.txt#L18,L23,L40,L42-L43)
  parking_aisle_two_way_ft:
