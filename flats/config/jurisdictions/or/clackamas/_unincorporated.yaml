      510.03 offers the same similar-use door Section 316 does -- "uses similar
      to one or more of the listed uses ... may be authorized pursuant to
      Section 106" -- but a quadplex is not an unlisted use here. It is a
      listed use with an X against it, and 510.03(2) says an X survives being
      inside a broader permitted description.
