      housing, as defined in ORS 197A.445(1), and subject to Section 846,
      Affordable Housing." That is a real route to a quadplex on this land, and
      it turns on what is built rather than on anything about the lot: this
      product is market rate, so the prohibition is the answer for it. A
      screen that answered otherwise would be answering a different question
      than the one it is asked.

