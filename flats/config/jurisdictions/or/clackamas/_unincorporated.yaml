  "21":
    outcome: other_building
    note: >-
      OAR 660 Division 21, urban reserves. Section 316 cites it three times and never about a
      dwelling we build: note 6 (L624) and note 7 (L626) both gate Recreational Vehicles as Second
      Dwellings and Accessory Historic Dwellings on whether the land is in a reserve. The reserve
      rules are about which land may urbanise and when, not about what a building must measure.
  "27":
    outcome: other_building
    note: >-
      OAR 660 Division 27, urban and rural reserves, cited by the same three notes as Division 21
      plus note 28 (L684). Same answer for the same reason: every citing sentence in this layer
      gates a use that is not this pod -- an RV as a second dwelling, an accessory historic
      dwelling -- and none of them states a dimension.
  "1002.02":
    outcome: fetch
    note: >-
      Tree removal, and the one reference here that is genuinely about our building on land we
      would buy. Table 316-1 note 12 (L636), printed on the Forest Practices row: "For land
      inside the Portland Metropolitan Urban Growth Boundary, refer to Subsection 1002.02
      regarding a development restriction that may apply if excessive tree removal occurs." The
      row it sits on is why the footnote itself is dismissed and this reference is not: a note
      about forestry cannot move a use gate, but the subsection it points at is a development
      restriction and says nothing about who is doing the clearing. A development restriction
      triggered by clearing is
      the same shape as Portland's Title 11, which is encoded as fee_in_lieu and cost real ground
      before it was read -- and this cannot be ruled the way it is tempting to rule it, namely
      that Section 316's own districts refuse the pod so the note is moot. That is a reason that
      argues about OUR corpus rather than about the page, and it goes stale the moment anybody
      reads 1002 for the urban districts. Section 1002 is not in the store. `fetch` keeps the row
      in the queue, which is where it belongs.
  # --- and five more, arriving with ZDO Sections 510 and 1005 on 2026-09-08 -
  # Four close and one does not, and the one that does not is the shape §30
  # taught: a section this county cites for what it MAKES a site hold, not for
  # what it lets a site do. A permission ignored is a lot wrongly refused; a
  # requirement ignored is a lot wrongly passed.
  "1203":
    outcome: other_path
    note: >-
      Conditional Uses, and it is the key to the letter "C" in all three of this layer's use
      tables -- '"C" means the use is a conditional use, approval of which is subject to Section
      1203, Conditional Uses' (ZDO 315 L25, 316 L19, 510 L21, the last of which loses its opening
      quotation mark in extraction). Those key lines are quoted by every zone encoded from those
      tables, which is why it binds. It is the branch this screen never takes: a conditional use
      is a discretionary approval of an application, and this project reads a use table by asking
      whether the use is permitted outright rather than whether it is imaginable -- the reasoning
      already written into RA-1, whose Duplexes cell reads C[8] and is encoded false. Its two
      other mentions run the other way and are closed by the same argument as Section 846: ZDO
      1012 notes 2 and 6 waive a minimum lot size for something approved under 1203, which can
      only admit a lot this screen rejects.
  "822":
    outcome: other_building
    note: >-
      Home Occupations. In every use table this layer holds it is printed on a Home Occupations
      row -- "Home Occupations, including bed and breakfast homestays, subject to Section 822"
      (ZDO 315 L451, 316 L326, 510 L413) -- and its two footnote mentions say one thing twice:
      "A use may be permitted as a home occupation, subject to Section 822, Home Occupations, even
      if such use is also identified in another use listing in Table 315-1." A business run out of
      somebody's house is not four attached dwellings built new, and the sentence hands out a
      permission rather than stating a standard.
  "1307":
    outcome: procedure
    note: >-
      Procedures. Both citing sentences name it as the track an application runs on, and neither
      states anything the application must measure: '"Type II" means the use requires review of a
      Type II application, pursuant to Section 1307, Procedures' (ZDO 316 L25) and "Replats
      reviewed as a Type II application pursuant to Section 1307, Procedures" (ZDO 1012 L9). The
      replat limb is the land-division path, parked under Section 1105 on its own reasoning and
      not reached twice.
  "827":
    outcome: other_building
    note: >-
      Drive-Thru Window Services, and the reference is the use row itself: "Drive-Thru Window
      Services, subject to Section 827" (ZDO 510 L197). A window a car stops at, and one of the
      thirty-eight markers in Table 510-1 that resolve to a row this building is not on.
  "1021":
    outcome: fetch
    note: >-
      Solid Waste and Recyclable Material Collection, and the second reference in this layer that
      a chapter's arrival turned from a name into a requirement. Table 510-1 note 8 (ZDO 510 L67):
      "In the SCMU District, outdoor displays, processes, or storage, except for the storage of
      solid waste and recyclables either as required by Section 1021, Solid Waste and Recyclable
      Material Collection, or as an accessory use to a townhouse, are prohibited." The three words
      that matter are "as required by": the sentence is a prohibition on outdoor storage, and it
      carves out the collection area because the county requires one somewhere else. A collection
      area is ground. It is the same family as the parking court, which took between twelve and
      forty-two feet of depth off every quadplex zone in this corpus the day somebody measured it
