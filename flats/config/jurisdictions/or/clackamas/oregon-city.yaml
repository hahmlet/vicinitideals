  # ------------------------------------------------------------------
  # THE MIXED-USE AND COMMERCIAL SIDE OF OREGON CITY, read 2026-09-08.
  #
  # Twelve districts held 1,162 lots that this file had never heard of, and
  # they are the whole of what is left in this city. Eleven are read here,
  # 1,150 lots; the twelfth is "County", twelve lots on seven acres that the
  # parcel layer labels with the county's zoning rather than the city's, and
  # it is a join question rather than a reading. They are read here in one
  # pass because they are one reading: Chapters 17.24 through 17.39 print the
  # same nine-paragraph dimensional standard over and over with the numbers
  # changed, so the interesting part is never the number -- it is which
  # paragraph applies to a four-unit building, and that turns out to differ
  # district by district in ways no table would show.
  #
  # FOUR THINGS CAME BACK THAT THE ERRAND WAS NOT FOR.
  #
  # (1) The setback in every one of these districts is stated twice, on a
  # hinge this corpus had no name for: "Minimum required setbacks if not
  # abutting a residential zone: None", then twenty feet where it does abut
  # one. `abuts_lower_density_zone` was the closest condition we held and it
  # is the wrong question -- it compares two residential districts by
  # intensity, and this one asks which side of the residential line the
  # neighbour is on. `abuts_residential_zone` is registered for it. Nothing
  # measures it, so every zone below leans on an unobserved fact and cannot
  # certify GREEN until an adjacency layer exists. That is the correct answer
  # and not a defect: the alternative was encoding twenty feet flat and
  # rejecting every mixed-use lot in the city that happens to sit among
  # commercial neighbours.
  #
  # (2) A four-unit building is exempt from the maximum front setback in
  # MUC-1 and MUD, and is not in C and MUC-2. OCMC 17.29.050.I and 17.34.060.K
  # both read "Standalone residential development of fewer than five units are
  # exempt from maximum setbacks" -- our pod is four -- and the identical
  # paragraph is simply absent from 17.32.050 and 17.29.060. So the five-foot
  # maximum front setback, which would push a pod to the street line, binds in
  # two districts and not in the other two, and the difference is a paragraph
  # somebody did not copy. MUC-1's version of it exempts minimum density too;
  # MUD's exempts only the setbacks, which is why 17.4 units per acre is
  # encoded in MUD and absent from MUC-1.
  #
  # (3) HC prohibits this building in as many words, and a keyword search
  # would have said the opposite. 17.26.020.C permits "conversions of an
  # existing single-family detached residential unit or duplex into a triplex
  # or quadplex" -- the word is there and the use is not, because a
  # factory-built pod on a bare lot converts nothing. 17.26.035.B settles it:
  # "Triplexes and quadplexes" are prohibited outright. The conversion
  # sentence is the exception that proves the rule and it is quoted in the
  # refusal so the next reader does not have to find it twice.
  #
  # (4) THE LAYER'S OWN PARKING DEFAULTS ARE RESIDENTIAL-ONLY AND ARE APPLIED
  # HERE ANYWAY. OCMC 17.16.060.D opens "In residential zones", and its two
  # limbs -- forty feet of parking width, fifty percent of frontage -- are in
  # this file's `defaults:` with no such limit. In the five districts below
  # that permit the pod they are over-strict rather than wrong-headed, which
  # is the safe
  # direction, so they are left inherited and named here instead of unset. The
  # paragraph that DOES reach these districts is 17.16.060.E, "In mixed-use
  # and commercial zones, parking aisles or areas shall be located behind the
  # building facade that is closest to the street, below buildings, or on one
  # or both sides of buildings" -- so `parking_front_prohibited` is `true`
  # here against `exempt` citywide, and each district says so.
  #
  # WHAT IS REFUSED AND WHY IT IS SAFE TO REFUSE IT. MUE, I, GI and CI list no
  # residential use at all, and OCMC 17.06.010.A is the sentence that turns
  # silence into a prohibition: no land may "be used or designated to be used
  # for any use other than is permitted in the district". GI says it twice --
  # caretaker dwellings are permitted and "all other residential uses are
  # prohibited". CI says it for six named tax lots and single-family only.
  #
  # THE STATE PREEMPTION DOES NOT REACH ANY OF THESE DISTRICTS, and this is
  # the case or/_state.yaml warned about in writing. OAR 660-046-0010(2)(a)
  # excuses a Large City for "Lots or Parcels that are not zoned for
  # residential use, including but not limited to Lots or Parcels zoned
  # primarily for commercial, industrial, agricultural, or public uses", and
  # (b) for residential lots that do not allow a detached house. MUD prohibits
  # detached houses outright (17.34.040.D); MUC-1, MUC-2 and C never permit
  # one, and 17.06.010.A makes that a prohibition; WFD's use list reaches
  # residential only at 17.35.020.R, "Residential units--Multi-family,
  # triplexes and quadplexes", with no detached house anywhere in the
  # chapter. So all five sit outside the
  # division. The state file predicted that the gap "moves no verdict" because
  # the only commercial zones then encoded prohibited the quadplex; these are
  # the first that do not, and the gap moves two things:
  #
  #   * `max_density_du_per_acre: exempt` is inherited and cancels nothing --
  #     none of these districts states a density maximum. Harmless.
  #   * `parking_min_per_unit` is inherited as the state's four-spaces-total
  #     cap, and if the division does not reach here then Oregon City's own
  #     Table 17.52.020 governs unrelieved. This file already refuses that row
  #     in writing, in `defaults:`, because it states no unit: read as totals
  #     it asks two spaces, read per unit it asks eight. Four is the middle
  #     reading and it is the one the screen now uses in a district where the
  #     ceiling that justified it may not apply. It is written here rather
  #     than fixed because fixing it needs the adopted ordinance text, and it
  #     is the thing to read first at signing.
  MUC-1:
