    min_density_du_per_acre:
      # Table 17.08.050 row "Minimum net density". Note B.2 lets total
      # dwelling units count toward the floor, so the pod counts as the
      # four it is. 17.65.070.D.4 puts it out of reach of an adjustment:
      # "minimum density for residential sites may not be reduced".
      value: 3.5
      quote: "or/clackamas/oregon-city/17.zoning.txt#L4184-L4186"
      # 17.04.808 divides by NET developable area, which its own worked
      # example takes as eighty percent of the site -- twenty percent
      # for right-of-way, slopes and the rest. Nothing here surveys
      # that, so the lot's own area serves as the bound it is.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list, OCMC 17.04.810, six items: the
        # 100-year floodplain, the Natural Resource Overlay District, slopes
        # over thirty-five percent (with a discretionary adjustment down to
        # twenty-five), open space, public facilities and rights-of-way, and
        # -- on the director's approval -- land an easement bars a building
        # from. Close to Milwaukie's list and nothing like Fairview's.
        #
        # 17.04.808 works the arithmetic through an example: 4.84 gross acres
        # to 3.87, annotated "80% is developable, 20% is right-of-way, slopes,
        # etc." An illustration is not a standard and the 80 percent is not
        # encoded, but it is the only figure this Code offers for how much of
        # a lot survives the deduction.
        cite: OCMC 17.04.810 "Net developable area"; 17.04.808 "Net density"
        quote: "or/clackamas/oregon-city/17.zoning.txt#L2441-L2443,L2468-L2491"
    notes: 'quadfit confidence: verified | Height 35 ft. Front 15 ft for a porch. Rear 10 ft for ADU/cottage
      cluster. No FAR. Quadplex uses base-zone dimensions per 17.16.060.A; >=1 street-facing main entrance
      req''d (17.16.060.C). Coverage 45% only with an ADU.'
