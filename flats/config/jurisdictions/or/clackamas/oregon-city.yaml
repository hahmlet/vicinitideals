label: Oregon City
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml, then re-read value by value against Title 17 itself (2026-08-14):
  every value quotes the row of Table 17.08.040 or 17.10.040 it comes from. Three things changed. (1)
  R-5 and R-3.5 coverage was the single-family detached row (50%/55%); the quadplex is on the triplex/quadplex/townhouse
  row at 70%/80%, and the low figure was rejecting lots the code allows. (2) min_frontage_ft becomes
  min_lot_width_ft — what the tables state is a minimum lot width, and no chapter states a frontage standard.
  (3) max_height_ft 35 is encoded for all five zones; it was in the notes and in no field. Relief the
  tables state and this file does not encode: the porch exceptions to the front setback, the 10 ft rear
  for an ADU or cottage cluster, the 0 ft attached side for townhouses, the 25 ft height for a cottage
  cluster unit, and coverage +5% with an ADU. OCMC 17.16.155 adds standards inside the Thimble Creek
  Concept Plan Area of R-5 that supersede the zone; they are geographic and not encoded. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance. open_space_min_pct 75 is dropped from all five zones: it quoted OCMC 17.16''s cottage cluster
  courtyard rule, which caps IMPERVIOUS cover at seventy-five percent of a COURTYARD belonging to a housing
  type this screen does not model. As a minimum private open space of 75% of the lot it was wrong three
  ways and would have rejected every lot in the city. Title 17 states no private open space standard for a
  quadplex; if one exists it needs finding, not approximating. The townhouse rows of Tables 17.08.040 and
  17.10.040 (1,500 sq ft, and 20 ft of width in R-5/R-3.5) are encoded as `when: [unit_lots]` variants.'
ingest:
  geoid: null
  juris_city_codes:
  - OREGON CITY
  zoning_layer: zoning_oregon_city
  zone_field: ZONE
  strip_lowercase_suffix: false
crossrefs:
  "16.08.065":
    outcome: narrows_only
    note: >-
      "For land divisions, lot sizes may be reduced pursuant to OCMC 16.08.065", note 1 under two
      dimensional tables. It lowers a minimum and only in a land division, so reading it could
      only admit lots this screen already rejects.
  "16.08":
    outcome: misread
    note: >-
      The same citation, read twice. Extraction spaces one of the two occurrences into "OCMC 16.08
      . 065", which breaks the dotted form and leaves the abbreviation branch matching the chapter
      alone. Ruled with 16.08.065, which is where it points.
  "16.1":
    outcome: misread
    note: >-
      Not a chapter. 17.52.030.A sends parking access to "OCMC 16.1 2. 035" and extraction has put
      two spaces inside 16.12.035, which leaves the abbreviation branch matching "16.1" and the
      dotted branch matching nothing. Same shape as 16.08 above, and this one lands somewhere the
      store already holds: 16.12.035 Driveways is inside the 16.12.streets slice, its approach
      widths are encoded as `driveway_approach_min_width_ft` and
      `driveway_approach_max_width_ft`, and its spacing table is ruled NOT ENCODED in this file
      with reasons. Nothing to fetch and nothing left to read.
  "13.12":
    outcome: other_path
    note: >-
      Stormwater and grading. Seven mentions across Title 17 and every one is drainage: the design
      standards a parking surface drains to (17.52.030.C), stormwater quality and quantity
      treatment, the erosion control that goes with a grading permit. It is a public works
      engineering title, and the numbers in it are pipe and pond sizes rather than distances on a
      lot. A quadplex here is built to it and no lot fails this screen because of it -- the
      standard applies to the development, not to whether the development fits.

definitions:
  # "Corner lot" means a lot abutting upon two or more streets at their
  # intersection."
  #
  # Same shape as Portland without the curve clause. Oregon City states no
  # angle at which a curving street becomes two, so a bend is one street here
  # however tight, and the only corner is a real intersection.
  corner_lot:
    test: intersecting_frontages
    quote: "or/clackamas/oregon-city/17.zoning.txt#L2081-L2083"
    cite: "OCMC 17.04.665, Lot, corner"

code:
  # Municode client 3708, publication 1377 (updated 2026-06-16). One product:
  # zoning is Title 17 inside the Municipal Code. The library renders in
  # JavaScript; this endpoint returns the adopted PDF.
  # Fetched 2026-08-27. OCMC 17.16.040 sends every townhouse driveway to
  # "OCMC 16.12.035", which is in Title 16 and so outside the 17.zoning slice
  # -- the same publication, a different part of it. It turned out to hold
  # what Title 17 does not: the approach width table this building is
  # dimensioned by.
  - id: "16.12.streets"
    url: https://api.municode.com/PublicationPdfDownload/1377
    title: "Title 16, Chapter 16.12 - Streets, Sidewalks and Public Places"
    start: "16.12.030"
    end: "16.16"
    extraction: plain
    spaced: true
  - id: "17.zoning"
    url: https://api.municode.com/PublicationPdfDownload/1377
    title: "Title 17 - Zoning"
    start: "ZONING"
    end: "STATUTORY"
    # This publication is a scan with OCR text; layout mode shreds it into
    # padded fragments ("authori z ed"). Plain mode reads it, OCR noise and all.
    extraction: plain
    # ...and OCR noise here means letter-spacing: "1 0 , 000 squ are f eet"
    # for ten thousand square feet. Declared rather than detected — see
    # CodeDocument.spaced.
    spaced: true
    # Chapter 17.04, "DEFINITIONS", runs from 17.04.005 to the head of
    # Chapter 17.08. Oregon City publishes no separate definitions
    # document, so nothing keyed on a document's name could find the 334
    # terms in here and the city read as a code that defines no words.
    # 17.04.808 "Net density" is one of them, and it is the sentence the
    # five density values in this file are measured on.
    #
    # Ends at 17.04.1530 "Yard, side, corner", the last entry, rather than at
    # the head of Chapter 17.08 -- Chapter 17.06 sits between them, and read
    # as glossary its section list and its zoning-map paragraph came back as
    # four defined terms this city never defined.
    definitions_at: L834-L3883
defaults:
  # PARKING, read 2026-08-27 -- the whole of Chapter 17.52 plus the middle
  # housing chapter that overrides parts of it. What Oregon City has to say
  # about this building's parking splits cleanly in two, and the seam is
  # OCMC 17.52.010, Applicability:
  #
  #   "The construction of a new structure or parking lot, or alterations to
  #    the size or use of an existing structure, parking lot or property use
  #    shall require site plan review approval and compliance with this
  #    chapter. This chapter does not apply to single-family detached
  #    residential dwellings, duplexes, townhouses, and cottage clusters."
  #
  # Triplexes and quadplexes are the two middle-housing types NOT on that
  # list. So on one lot the pod is a quadplex and the parking chapter binds
  # it in full; split onto four lots it is townhouses and Chapter 17.52 does
  # not reach it at all. Every value below therefore stands down under
  # `unit_lots`, which is the first time in this corpus that a city's stall
  # dimensions depend on how the land is divided rather than what is built.
  # (or/clackamas/oregon-city/17.zoning.txt#L14791-L14797)
  #
  # The stall and the aisle are the 90-degree standard row of the unnumbered
  # "Parking Standard / Parking Angle Space Dimensions" table in OCMC
  # 17.52.030.D.1. Its columns are A Parking Angle, B Stall Width, C Stall to
  # Curb, D Aisle Width, E Curb Length, F Overhang, and the row reads
  # "90 degrees Standard 9' 19.0' 24' 9' 1.5" -- so a 9 by 19 stall off a 24
  # ft aisle, which is Fairview's geometry exactly and the widest aisle in
  # this corpus. This publication is a scan, and the zero in 19.0 was OCR'd
  # as a letter o; the figure is legible from the column and from the 45- and
  # 60-degree rows around it, and a reader opening the line sees the same
  # thing. Compact stalls are allowed for up to 35 percent of the MINIMUM
  # required parking, so the standard row is what a placement is screened
  # against. One aisle figure, not two -- the table does not distinguish
  # one-way from two-way -- so both fields carry it.
  #
  # The quote is the whole of 17.52.030 A through D rather than the two lines
  # that hold the figures, and that is forced rather than lazy. The attribution
  # check reads a section back off the page furniture, and the running header
  # on this page is OCR'd as "17.5 2 .030", which matches nothing; the only
  # section-shaped string above the table is the page number, 402.123. Quoting
  # from the section heading down through the table gives the check a real
  # marker to find. A reader opening it lands on "17.52.030 Standards for
  # automobile parking" and reads to the table, which is the right place to be.
  parking_stall_width_ft:
    value: 9
    unless: [unit_lots]
    cite: OCMC 17.52.030.D.1, Parking Angle Space Dimensions, 90 degrees standard
    url: https://api.municode.com/PublicationPdfDownload/1377
    retrieved: '2026-08-27'
    quote: "or/clackamas/oregon-city/17.zoning.txt#L15070-L15131"
  parking_stall_depth_ft:
    value: 19
    unless: [unit_lots]
    cite: OCMC 17.52.030.D.1, Parking Angle Space Dimensions, 90 degrees standard (Stall to Curb)
    url: https://api.municode.com/PublicationPdfDownload/1377
    retrieved: '2026-08-27'
    quote: "or/clackamas/oregon-city/17.zoning.txt#L15070-L15131"
  parking_aisle_one_way_ft:
    value: 24
    unless: [unit_lots]
    cite: OCMC 17.52.030.D.1, Parking Angle Space Dimensions, 90 degrees standard
    url: https://api.municode.com/PublicationPdfDownload/1377
    retrieved: '2026-08-27'
    quote: "or/clackamas/oregon-city/17.zoning.txt#L15070-L15131"
  parking_aisle_two_way_ft:
    value: 24
    unless: [unit_lots]
    cite: OCMC 17.52.030.D.1, Parking Angle Space Dimensions, 90 degrees standard
    url: https://api.municode.com/PublicationPdfDownload/1377
    retrieved: '2026-08-27'
    quote: "or/clackamas/oregon-city/17.zoning.txt#L15070-L15131"
  #
  # NOT ENCODED: how many spaces. This is a refusal about a unit, not about a
  # number, and it is the sharpest one in the corpus so far. Table 17.52.020
  # is introduced by "The parking requirements are based on spaces per one
  # thousand square feet net leasable area unless otherwise stated", and its
  # residential rows read:
  #
  #     Land Use                     Minimum          Maximum
  #     Multi-family residential     1.00 per unit    2.5 per unit
  #     Triplex and quadplex         2.00             4
  #
  # The row above ours states its unit. Ours does not, and three readings
  # follow from that, each giving a different building:
  #
  #   (a) the table's own default -- per 1,000 sq ft of net leasable area --
  #       which is what the header literally directs, and which asks about
  #       ten spaces of a four-unit building while using a commercial term of
  #       art no dwelling has;
  #   (b) per unit, by proximity to the line above it, which is eight spaces
  #       minimum and sixteen maximum;
  #   (c) spaces in total, which is two and four -- and which is the only one
  #       of the three that Oregon City is allowed to enforce, because OAR
  #       660-046-0220(2)(e)(B) caps what a Large City may require of a
  #       quadplex at four spaces IN TOTAL and Oregon City is a Large City.
  #
  # Reading (c) is almost certainly what the drafters meant. It is not what
  # they printed, and a reading arrived at by working out which of three
  # meanings would be lawful is an argument, not a citation. Encoding it
  # would put 0.5 and 1.0 into this file with a quote that says neither.
  #
  # Left out, `parking_min_per_unit` inherits the state cap, which is the
  # conservative direction: on a lot of 7,000 sq ft or more the screen holds
  # this building to four stalls, which is at least as many as any of the
  # three readings survives preemption with. `parking_max_per_unit` is left
  # out too, and THAT is the exposure a reviewer needs to see: if the row
  # means totals, Oregon City caps this building at four spaces and this
  # screen does not know it. Resolving it needs the adopted ordinance text
  # rather than the scanned publication -- Ord. No. 18-1009 rewrote Chapter
  # 17.52 in its entirety, and Ord. No. 22-1001 is what added middle housing
  # to it. (or/clackamas/oregon-city/17.zoning.txt#L14887-L14896)
  #
  # WHERE THE PARKING MAY SIT AND HOW WIDE THE DRIVEWAY IS, transcribed
  # 2026-08-27 and encoded the same day. Stated twice over, for the two halves
  # of the `unit_lots` seam this file already runs on.
  #
  # Table 16.12.035.D, "Driveway Approach Size Standards", is the piece that
  # was missing until Title 16 was fetched. Its rows:
  #
  #     Property Use                          Min. Approach   Max. Approach
  #     Single-Family Detached and Duplexes   10 feet         24 feet
  #     Townhouses                            10 feet         24 feet
  #     Triplexes, quadplexes and cottage     10 feet         36 feet
  #     Multi-Family                          18 feet         30 feet
  #
  # Thirty-six feet is the widest approach any city in this corpus allows this
  # building, and it is a third wider than a townhouse gets on the row above
  # -- the same split, in the same direction, as the stall dimensions in this
  # file. 16.12.035.J adds that "driveway widths shall match the width of the
  # driveway approach where the driveway meets sidewalk or property line but
  # may be widened onsite", so the approach figure is a floor on nothing and a
  # ceiling on the curb cut only.
  driveway_approach_min_width_ft:
    value: 10
    cite: OCMC Table 16.12.035.D, minimum driveway approach width, triplexes/quadplexes/cottage clusters row
    url: https://api.municode.com/PublicationPdfDownload/1377
    retrieved: '2026-08-27'
    quote: "or/clackamas/oregon-city/16.12.streets.txt#L1092-L1104"
  driveway_approach_max_width_ft:
    value: 36
    cite: OCMC Table 16.12.035.D, maximum driveway approach width, triplexes/quadplexes/cottage clusters row
    url: https://api.municode.com/PublicationPdfDownload/1377
    retrieved: '2026-08-27'
    quote: "or/clackamas/oregon-city/16.12.streets.txt#L1092-L1104"
    variants:
      - value: 24
        when: [unit_lots]
        cite: OCMC Table 16.12.035.D, maximum driveway approach width, Townhouses row
        quote: "or/clackamas/oregon-city/16.12.streets.txt#L1092-L1104"
  # On one lot, OCMC 17.16.060.D, Triplex and quadplex development
  # requirements: "In residential zones, garages on the front facade and
  # off-street parking areas in the front yard, are permitted in compliance
  # with the following standards: 1. Outdoor on-site parking and maneuvering
  # areas shall not exceed a total of forty feet wide or fifty percent of the
  # lot frontage, whichever is less; and 2. The combined width of all garages
  # shall not exceed forty feet or fifty percent of the lot frontage,
  # whichever is less." Fifty percent of the frontage is Wilsonville's number
  # and Milwaukie's number; the forty-foot ceiling on top of it is Oregon
  # City's own, and on a frontage wider than eighty feet it is the limb that
  # binds. Both limbs are encoded, in the two fields that hold them, and the
  # screen takes the lesser -- which is what "whichever is less" says.
  parking_area_max_width_ft:
    value: 40
    cite: OCMC 17.16.060.D.1, outdoor on-site parking and maneuvering areas, width limb
    url: https://api.municode.com/PublicationPdfDownload/1377
    retrieved: '2026-08-27'
    quote: "or/clackamas/oregon-city/17.zoning.txt#L5417-L5432"
  parking_area_max_frontage_pct:
    value: 50
    cite: OCMC 17.16.060.D.1, outdoor on-site parking and maneuvering areas, share-of-frontage limb
    url: https://api.municode.com/PublicationPdfDownload/1377
    retrieved: '2026-08-27'
    quote: "or/clackamas/oregon-city/17.zoning.txt#L5417-L5432"
  # Exempt rather than true: 17.16.060.D opens "garages on the front facade
  # and off-street parking areas in the front yard, are permitted in
  # compliance with the following standards". Oregon City permits front-yard
  # parking on a quadplex lot and caps it; it does not ban it. The ban is
  # 17.16.040.B on the townhouse path, reached by a project that fails the
  # four standards at 17.16.040.A.
  parking_front_prohibited:
    exempt: true
    cite: OCMC 17.16.060.D, which permits front-facade garages and front-yard parking subject to two width standards
    url: https://api.municode.com/PublicationPdfDownload/1377
    retrieved: '2026-08-27'
    quote: "or/clackamas/oregon-city/17.zoning.txt#L5417-L5432"
  # On four lots, OCMC 17.16.040, Townhouse driveway access and parking, and
  # it is the state model code again: front-facade garages, front-yard parking
  # and driveways in front of a townhouse are permitted only where outdoor
  # on-site parking and maneuvering areas are no wider than twelve feet on any
  # lot, the garage is no wider than twelve feet, every lot fronts a local
  # street, and all driveways meet OCMC 16.12.035 -- which is now fetched and
  # is the table above. Twelve feet around a nine-foot stall is a driveway,
  # not a court, the same finding as Wilsonville's twelve and Milwaukie's ten.
  # Fail those and 17.16.040.B sends parking to the rear yard or the back
  # facade, a corner-lot project to a single side-street driveway, and any
  # other project to one consolidated driveway.
  #
  # On one lot the cap is the pair of figures above, stated as a width and a
  # share and not as a maneuvering-area width, so there is nothing here for
  # this field to hold.
  parking_maneuvering_max_width_ft:
    exempt: true
    cite: OCMC 17.16.060.D.1, which states the limit as a total width and a share of frontage rather than a maneuvering-area width
    url: https://api.municode.com/PublicationPdfDownload/1377
    retrieved: '2026-08-27'
    quote: "or/clackamas/oregon-city/17.zoning.txt#L5417-L5432"
    variants:
      - value: 12
        when: [unit_lots]
        cite: OCMC 17.16.040.A, outdoor on-site parking and maneuvering areas on a townhouse lot
        quote: "or/clackamas/oregon-city/17.zoning.txt#L5323-L5345"
  #
  # NOT ENCODED: 17.16.060.E, which puts parking behind the facade in
  # mixed-use and commercial zones unless the site is on a local street, is
  # not a corner lot, and has a topographic constraint -- three site facts,
  # two of them registered and none of them measured. (or/clackamas/oregon-city/17.zoning.txt#L5417-L5432)
  #
  # NOT ENCODED: driveway spacing. Table 16.12.035.A asks 175 feet from a
  # street corner and between driveways on an arterial, 100 on a collector and
  # 25 on a local street "for all uses other than detached single-family
  # dwellings, duplexes, triplexes, quadplexes and townhouses" -- so the table
  # excludes this building, and 16.12.035.B puts it back under the
  # corner-distance standard alone "except when the lot size is smaller than
  # the minimum distance required". A distance from an intersection, on a
  # street whose classification is unmeasured, with an escape keyed to lot
  # size. 16.12.035.D allows one driveway per local-street frontage and never
  # more than two; 16.12.035.E.1 allows a middle housing property with one
  # building "one driveway for every two units", which is two for this pod and
  # more than it draws. (or/clackamas/oregon-city/16.12.streets.txt#L978-L1091)
  #
  # NOT ENCODED: the driveway's own offset from a lot line. Note 2 under Table
  # 16.12.035.A is one sentence and it is not conditioned on anything -- "All
  # driveways, except for shared driveways, shall be placed a minimum of five
  # feet from the property line." No street classification, no lot-size
  # escape, no use exemption: unlike the spacing rows above it, this one
  # reaches the pod. It is refused because no field holds it. The registry has
  # `parking_street_setback_ft`, which is a parking area's distance from the
  # STREET, and Gladstone's five-foot rule went in there honestly because
  # GMC 17.48.040(2)(e) is about parking spaces. This is about the driveway,
  # measured from whichever lot line it runs beside, and the site plan draws
  # Oregon City's drive hard against the side line. Worth stating plainly:
  # this is a live gap, not a dismissal. Five feet off the side line is five
  # feet of frontage the layout does not currently spend, and closing it needs
  # a field and a geometry change rather than a reading.
  # (or/clackamas/oregon-city/16.12.streets.txt#L1020-L1021)
  #
  # NOT ENCODED: any private open space standard, and this is a positive
  # finding rather than a gap. The notes at the head of this file record why
  # the 75 percent that quadfit carried was dropped: it quoted a cottage
  # cluster courtyard rule about IMPERVIOUS cover. Chapter 17.16's triplex and
  # quadplex requirements state none, and neither does Table 17.08.040 or
  # 17.10.040. An Oregon City site plan reserves no open space, which is why
  # the field is absent here -- and it was the single largest thing Gresham's
  # 15 percent was being applied to that Oregon City never asked for.

zones:
  R-10:
    section: ["17.08.", "17.16."]
    cite_default:
