        17.16.060
      url: https://library.municode.com/or/oregon_city/codes/municipal_code?nodeId=TIT17ZO_CH17.08LODEREDI
      retrieved: '2026-08-14'
    quadplex_allowed:
      value: true
      quote: "or/clackamas/oregon-city/17.zoning.txt#L4053"
    setback_front_ft:
      value: 20
