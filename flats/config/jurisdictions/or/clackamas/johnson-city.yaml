notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.'
ingest:
  geoid: null
  juris_city_codes:
  - JOHNSON CITY
  zoning_layer: zoning_metro
  zone_field: ZONE
  strip_lowercase_suffix: false
code:
# The city publishes no zoning ordinance — no code library, no documents page,
# a city hall open three days a week. The one encoded value rests on state
# law: ORS 197A.420's middle-housing mandate stops at cities of 1,000 or
# fewer outside Tillamook County, and no local allowance exists to override.
- id: ors.197a.420
  url: https://oregon.public.law/statutes/ors_197a.420
  title: ORS 197A.420 Duplexes; middle housing (mandate + small-city exemption)
  # Statute prose: few dimensioned standards per line. Read 2026-08-13.
  allow_thin: true
zones:
  MR1:
    cite_default:
      cite: Metro RLIS Zoning layer (no published municipal code found); HB 2001 Sec 4(a) exemption
      url: https://www.clackamas.us/planning
      retrieved: '2026-07-28'
    notes: 'NOTHING IS ENCODED HERE, and that is the finding. The zone carried
      quadplex_allowed=false until 2026-08-19 on an argument rather than a citation: ORS
      197A.420(4)(a)(A) exempts cities of 1,000 or fewer outside Tillamook County from the
      middle housing mandate (or/clackamas/johnson-city/ors.197a.420.txt#L77-L81), so nothing
      obliges Johnson City to allow a quadplex — which is not the same sentence as Johnson
      City prohibiting one, and no municipal ordinance has been found saying either. A lot
      here screens UNKNOWN, which is our queue, rather than RED, which would be a decision
      nobody wrote down.

      What a human searcher needs to find: any published Johnson City land use ordinance.
      Checked 2026-08-13 — no code library, no documents page, city hall open three days a
      week. The city limits are the Johnson Mobile Estates manufactured home park, so the
      inventory behind this is close to zero splittable lots and the search is low priority
      rather than urgent.

      quadfit confidence: needs_verification | Metro ZONE ''MR1'' (ZONE_CLASS MFR1 —
      multi-family, not SFR).'
