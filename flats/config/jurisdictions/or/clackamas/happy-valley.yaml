      value: 20
      cite: HV LDC 16.42.030(B)(1)
      url: https://ecode360.com/print/HA4934?guid=43529965
      retrieved: '2026-08-20'
      quote: "or/clackamas/happy-valley/16.42.landscaping.txt#L89,L93"
    notes: 'quadfit confidence: verified | Setbacks/coverage from City Model Home Application form (LDC
      eff 3/19/2024). Height 45 ft front elev / 49 ft side+rear. Covered porch >=20% of bldg line cuts
      front to 15 ft. Quadplex by-right per HV Middle Housing amendments. min_lot is the nominal density
      basis (verify Table 16.22.020-2).'
