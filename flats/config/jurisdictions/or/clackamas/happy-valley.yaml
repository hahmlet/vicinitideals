      cite: HV LDC 16.22.050 (VTH, Village Townhome); Table 16.22.050-1 permitted uses, Table 16.22.050-2 development standards
      url: https://ecode360.com/print/HA4934?guid=43529907
      retrieved: '2026-08-20'
    quadplex_allowed:
      # Table 16.22.050-1, row "Four-family dwelling (quadplex)": P in all
      # three attached districts, with no footnote on the cell and no
      # child-lot note over this table -- that note is printed over the
      # three lower-density use tables only.
      value: true
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L775,L778"
    min_lot_sqft:
      value: 2000
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L950,L953"
    min_lot_width_ft:
      # The cell reads "None". A stated absence is an answered standard,
      # not a missing one.
      exempt: true
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L954,L957"
    min_lot_depth_ft:
      exempt: true
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L958,L961"
    max_coverage_pct:
      # 65 percent, and unlike the other two columns it carries no note 12.
      value: 65
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L962,L965"
    setback_front_ft:
      value: 10
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L967,L970"
    setback_rear_ft:
      value: 15
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L971,L974"
    setback_side_ft:
      value: 5
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L975,L978"
      variants:
        # Note 5: "Side yard building setbacks for attached single-family
        # (townhouse) may be reduced to zero in compliance with applicable
        # sections of the adopted Uniform Building Code." A townhouse in
        # 16.12 is a dwelling "located on its own lot" sharing walls with
        # dwellings "on another lot", so the zero is relief for a party wall
        # that runs along a property line. Four units on one lot have no
        # interior lot line for it to apply to.
        - value: 0
          when: [attached_wall, unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L975,L978,L1022"
    setback_street_side_ft:
      value: 5
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L979,L982"
    # 16.43.030.E.4, stated as equal to the building setback -- see the note
    # in `defaults:`. `same_as` resolves against the row above, the printed
    # ten-foot floor is the only figure the sentence carries, and neither
    # number is typed here.
    parking_street_setback_ft:
      same_as: setback_front_ft
      floor_ft: 10
      cite: HV LDC 16.43.030.E.4, parking set back from a street lot line by the required building setback
      url: https://ecode360.com/print/HA4934?guid=43529966
      retrieved: '2026-08-27'
      quote: "or/clackamas/happy-valley/16.43.parking.txt#L511,L527"
    setback_front_max_ft:
      # A maximum, not a minimum: "Setback (maximum from street
      # right-of-way or designated accessway) -- 18 feet". SFA and MUR-A
      # print "None" in the same row. This is the standard a village
      # townhome district uses to hold the street wall, and it is the one
      # dimension here that a deep-setback site plan fails.
      value: 18
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L998,L1001"
    setback_garage_entrance_ft:
      # "Garage and carport entrances -- entrances not facing an alley: 22
      # feet." The alley row is a two-part standard (22 feet to the base
      # floor, 6 to upper floors) that this field cannot hold, and it only
      # ever applies to a lot with an alley, which nothing measures.
      value: 22
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L985,L986,L989"
    min_building_separation_ft:
      value: 10
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L994,L997"
    max_height_ft:
      # 35 feet flat. Note 8's 45-foot front elevation allowance is marked
      # on the SFA and MUR-A cells only.
      value: 35
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L1002,L1005"
    max_density_du_per_acre:
      # VTH states density as an area per primary unit rather than units
      # per acre, and note 2's quadplex exemption is marked on the SFA and
      # MUR-A cells only -- this column carries note 9 instead. So the
      # pod is held to it: at most one unit per 2,000 sq ft, which is a
      # floor of 8,000 sq ft of net developable area for four. The lot
      # minimum two rows down is 2,000. The density is the binding half,
      # and reading the lot row alone would have missed it fourfold.
      sqft_per_unit: 2000
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L942,L945,L1014"
      # Stated per NET acre, which 16.12 defines as "one acre of developable
      # land, as calculated pursuant to Section 16.63.020(F)" -- a survey of
      # the parcel rather than an attribute of it.
      measured_on:
        fact: net_developable_area
        cite: HV LDC 16.63.020(F)(1), by way of 16.12 "Net acre"
        quote: "or/clackamas/happy-valley/16.63.land-divisions.txt#L133,L137,L141,L145,L149,L153"
    min_density_du_per_acre:
      # And at least one unit per 3,000 sq ft, so four units need no more
      # than 12,000 sq ft of net developable area. The pair is a band.
      sqft_per_unit: 3000
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L946,L949,L1014"
      # Stated per NET acre, which 16.12 defines as "one acre of developable
      # land, as calculated pursuant to Section 16.63.020(F)" -- a survey of
      # the parcel rather than an attribute of it.
      measured_on:
        fact: net_developable_area
        cite: HV LDC 16.63.020(F)(1), by way of 16.12 "Net acre"
        quote: "or/clackamas/happy-valley/16.63.land-divisions.txt#L133,L137,L141,L145,L149,L153"
    min_landscaped_pct:
      # Citywide by housing type, not a district standard: 16.42.030(B)(1)
      # names "single-family attached dwellings, duplexes, triplexes and
      # fourplexes: 20%", and 16.42.020's exemption list for quadplexes
      # covers (D), (F), (G), (H), (J) and (K) but not (B).
      value: 20
      cite: HV LDC 16.42.030(B)(1)
      url: https://ecode360.com/print/HA4934?guid=43529965
      retrieved: '2026-08-20'
      quote: "or/clackamas/happy-valley/16.42.landscaping.txt#L89,L93"
    notes: >-
      The one district in the chapter whose density is stated as an area per
      unit, and the one where reading the lot-size row alone would mislead by
      four times: 2,000 sq ft of lot minimum, 8,000 sq ft of net developable
      area to carry four units at the maximum density. It is also the only
      Happy Valley district with a maximum street setback -- 18 feet -- so a
      site plan that pushes the building back to gain parking depth fails here
      on a standard no other zone in the city has.


      NOT ENCODED, on purpose. (1) Note 11 lets one of the two required front
      setbacks on a corner lot drop to 8 feet "when abutting a local or
      connector street". It is optional relief conditioned on a street
      classification nothing here holds, and declining relief is the
      conservative half. (2) Note 10 sends preexisting dwellings and their
      accessory structures to Clackamas County VR-4/5 standards, which is a
      rule for a building already there. (3) Note 9's 3,000 sq ft maximum and
      2,500 average on townhouse lots, as in SFA.
  MURM:
    section:
    - '16.22.060'
    cite_default:
      cite: HV LDC 16.22.060 (MUR-M, Mixed Use Residential-Multifamily); Table 16.22.060-1 permitted uses
      url: https://ecode360.com/print/HA4934?guid=43529907
      retrieved: '2026-08-20'
    quadplex_allowed:
      # Table 16.22.060-1 "identifies the land uses that are allowed in the
      # MUR-M and MUR-X Districts" and is a closed list -- unlike the three
      # attached districts it carries no "uses similar to those upon
      # administrative determination" row. Its residential rows are "Attached
      # dwellings, (townhouses, attached duplex, rowhouses)" and "Multifamily
      # dwellings", low, medium and high.
      #
      # Neither reaches four units on one lot. 16.12 defines multifamily as
      # "five or more families" and the parenthetical after attached dwellings
      # enumerates three types a quadplex is not. This chapter names
      # "Four-family dwelling (quadplex)" as its own row in every other use
      # table it appears in, so its absence here is a distinction the code is
      # drawing rather than an omission.
      value: false
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L1225,L1229,L1232,L1233"
      variants:
        # Split the units onto their own lots and the same table says yes:
        # townhouses and rowhouses are permitted outright. That is the whole
        # of what changes -- the dimensions stay unencodable, see the note.
        - value: true
          when: [unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L1229,L1232"
    max_height_ft:
      value: 65
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L1306,L1315"
    notes: >-
      A zone the screen cannot clear and should not pretend to. Table
      16.22.060-2 prints "Variable" for lot size, lot width, lot depth, lot
      coverage and every building setback, and note 2 says why: "Standards are
      flexible and shall be determined through the master plan process or
      design review application." There is no by-right envelope to test a
      building against. Height and density are the only fixed figures, and
      density does not reach a four-unit building.


      So the missing required fields in this zone are not encoding debt. They
      are the answer: a site here is a design-review question, not a screening
      one. The four-family permission is settled false regardless, which is
      what actually decides the pod today; the unit-lot variant is what makes
      the dimensions matter, and it is the variant that cannot be dimensioned.
      A lot in MUR-M reaching the fit stage under a unit-lot design should come
      back REVIEW, and it will.


      Table 16.22.060-2 splits the district into MUR-M1, MUR-M2 and MUR-M3 by
      density -- 24.99, 34.99 and 50 du per net acre at the maximum, 15, 25 and
      35 at the minimum -- while the use table that decides this building
      treats MUR-M as one district. Those three codes are not carried as zones
      here: nothing confirms the zoning layer prints them, and a zone whose
      base was inferred rather than read is a gap the ledger cannot close by
      reading a code. If the layer does print them, they are three `like`
      entries and this note is the reading behind them.
  MURX:
    section:
    - '16.22.060'
    cite_default:
      cite: HV LDC 16.22.060 (MUR-X, Mixed Use Buildings with Residential Emphasis); Table 16.22.060-1 permitted uses
      url: https://ecode360.com/print/HA4934?guid=43529907
      retrieved: '2026-08-20'
    quadplex_allowed:
      # The second column of the same closed list, and it answers the same way.
      # MUR-X permits "attached dwellings, (townhouses, attached duplex,
      # rowhouses)" and multifamily low, medium and high, and names no
      # four-family dwelling anywhere.
      value: false
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L1225,L1229,L1232,L1233"
      variants:
        - value: true
          when: [unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L1229,L1232"
    notes: >-
      Stated from its own column rather than borrowed from MUR-M, because the
      two districts part company below the use table: 16.22.060-2 is headed
      MUR-M1, MUR-M2 and MUR-M3 and carries no MUR-X column at all. So MUR-X
      has no printed dimensional standards in the chapter that governs it --
      not "Variable", not deferred, absent -- which is the strongest form of
      the same finding as MUR-M. There is nothing here for a by-right screen
      to measure a building against, and the permission is what decides the
      pod regardless.


      Height is deliberately not carried across from MUR-M's 65 feet. That
      figure is printed in a table this district is not named in.
  R20CC:
    section:
    - '16.22.020'
    cite_default:
      cite: Assumed R-20 variant (unexplained 'CC' suffix in layer)
      url: https://ecode360.com/print/HA4934?guid=43529907
      retrieved: '2026-07-28'
    like: R20
    notes: 'A zoning-layer code, not a zone in LDC 16.22 — Happy Valley''s own chapter names R-40,
      R-20 and R-15 and nothing called R20CC, and what the CC suffix means is unconfirmed. The six
      standards here were a hand copy of R-20 carrying no citation, which is every Happy Valley row
      in the gap ledger. Adopted by reference instead, so each value cites the Table 16.22.020-2 cell
      R-20 was read from and an amendment to the table moves this code with it. The inference that
      the base is R-20 is the part that still needs a person, which is why it stays in the cite where
      a reviewer meets it rather than dissolved into six numbers that look sourced. If CC turns out
      to modify a standard, that standard belongs here as a local value over the reference.
      quadfit confidence: needs_verification.'
