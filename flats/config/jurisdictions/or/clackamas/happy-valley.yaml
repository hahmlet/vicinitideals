label: Happy Valley
kind: city
eligible: true
notes: >-
  Ported from quadfit rules.yaml. Every value is `draft` -- quadfit's verification was against a coarser
  standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint='entrance_only'.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  READ AND NOT ENCODED.


  (1) 16.42.080, shared outdoor recreation areas. Every residential table in 16.22 prints "400 sq.
  ft./unit provided in accordance with Section 16.42.080" against every district, which made it the
  loudest unfetched reference in the whole corpus -- eleven mentions, eight of them beside a number this
  screen uses. Fetched and read 2026-08-20. 16.42.080(A): "The standards of this section apply to
  subdivisions of 30 or more units." Four units is not thirty, so the row reaches somebody else's
  development. (B) excuses PUDs and multifamily of five or more as well, a second door out of the same
  standard and not the one this building uses. Sixteen hundred square feet of recreation tract that the
  tables appear to demand of a fourplex, and do not.


  (2) 16.42.030(B) is the part of that chapter that does reach the pod, and it is now encoded on every
  zone as min_landscaped_pct. Worth saying why the two land differently: 16.42.020 excuses quadplexes
  from 16.42.030(D), (F), (G), (H), (J) and (K), and (B) is not on the list.


  (4) The attached districts, now encoded. Table 16.22.050-2 states the standards for SFA, MUR-A and
  VTH and Table 16.22.060-1 the uses for MUR-M and MUR-X. A quadplex is permitted by right in all
  three attached districts -- "Four-family dwelling (quadplex): P, P, P" -- and they are the densest
  residential land in the city, with lot minimums of 2,000 and 3,000 square feet against R-40's
  40,000. The fifteen footnotes dismissed as scoped to those tables are back in scope and were
  already ruled on; nothing in this layer blocks.


  Two things in that slice are worth carrying forward. VTH is the only district in the chapter whose
  density is stated as an area per primary unit rather than units per acre, and it is the one place
  where reading the lot-size row alone misleads by four times: 2,000 square feet of lot minimum
  against 8,000 square feet of net developable area for four units at the maximum density. It is
  also the only Happy Valley district with a maximum street setback.


  And MUR-M and MUR-X refuse the building rather than dimension it. Their use table is a closed list
  -- no "uses similar to" row, unlike the three attached districts -- and its residential rows are
  attached dwellings (townhouses, attached duplex, rowhouses) and multifamily, which 16.12 defines as
  five or more families. A four-family dwelling on one lot is neither, and this chapter names
  "Four-family dwelling (quadplex)" as its own row in every other use table it appears in. On unit
  lots the same table says yes, and that is carried as a variant -- which is when Table 16.22.060-2's
  "Variable" dimensions start to matter, and they are the one thing here that cannot be encoded at
  all: "Standards are flexible and shall be determined through the master plan process or design
  review application."


  (5) The townhome column. Every residential table in 16.22 prints a townhome row beside the row a
  quadplex is named in, and the townhome row is looser in four standards at once -- 1,500 square
  feet of lot against R-40's 40,000, no lot width at all, twenty feet of frontage against a
  hundred, and a zero interior side yard. All four are now carried as `unit_lots` variants. Before
  this pass the file held a lot the code permits this building on to a minimum twenty-six times the
  real one.


    (3) 16.63.020(F), density calculations. Fetched with 16.42 and read for the same reason -- 16.12's
  "net acre" and "floor area ratio" both defer to it, so the subtraction behind every measured_on in
  this layer lived in an unfetched chapter. Now cited directly. (F)(3) also lets dedicated right-of-way
  count toward minimum lot size, but only "in the case of a partition, where the City is requiring the
  dedication", which is a land-division proceeding rather than a lot fact and is not encoded.


  READ AND NOT ENCODED: 16.32, Steep Slopes Development Overlay, and 16.34, Natural Resources
  Overlay. The pair the density rows point at -- "No density is allowed within constrained land
  except for the reduced rate within the Steep Slopes Development Overlay Zone and the Natural
  Resources Overlay Zone per LDC Section 16.32.090 and/or Section 16.34.050" -- fetched and read
  2026-08-26. Both bite hard, and neither is encodable with the fields this engine has.

  16.32 is a slope threshold, not a map lookup. 16.32.010(B) sets the classes: a CONSERVATION
  slope area is slopes of 25% or more in a contiguous extent of at least 1,000 square feet, plus
  land within 25 feet of the top or toe of such a slope where a geotechnical engineer identifies
  it, plus DOGAMI potentially rapidly moving landslide areas -- and "development activities on
  conservation slope areas are prohibited". A TRANSITION slope area is 15 to 24.99 percent on the
  same 1,000 square foot test. 16.32.020 applies the overlay to any existing lot of record meeting
  those tests, and says it "will take precedence in density calculations over the base zoning
  district". 16.32.090 then caps density at one dwelling unit per acre on conservation slope and
  DOGAMI land and two per acre on transition slope, one in the very low density zones, most
  restrictive winning. Four units at two per acre is two acres. That is not a trim, it is a kill.

  16.32.040(C) is a second constraint on top: within a transition slope area only a sliding
  fraction is buildable at all -- 50% of it if half or more of the parcel is sloped, 40% at 20 to
  49.99 percent, 30% below that.

  16.34.050(B) does the same for the resource overlay by a different route: inside a high value
  habitat conservation area or a water quality resource, only 10% of the area counts toward
  density and the cap is one unit per acre; inside a moderate HCA, 20% and the same cap. Read
  with 16.34.050(A)(1), which lets the base zone setback drop to anywhere between the minimum and
  zero to avoid a resource -- the only part of either chapter that loosens.

  Not encoded because the binding form is a buildable-area mask, not a number. 16.32.045(A)
  excepts outright "an activity that avoids conservation slope areas and transition slope areas",
  so the real question for this pod is whether 56 by 36 feet plus its parking and access fits on
  the part of the lot under 15%, not what the density cap says. No field in the registry can
  express "the building must avoid ground steeper than X", and this layer has no overlay
  mechanism -- the Clackamas quadfit run carried slope data but no overlay geometry. Writing
  `max_density_du_per_acre: 2` here would be wrong in both directions: wrong on a lot whose slope
  sits in a corner the pod misses, and far too generous on one where it does not.

  HALF LIFTED 2026-09-01. The sentence above -- "this layer has no overlay mechanism" -- was
  true of the FLATS value model and is no longer true of the screen. Both maps are now wired
  into quadfit as `happy_valley_nroz` and `happy_valley_slope`, and both are FLAGS rather than
  carves, because 16.34.060 says what its own map is for: it "did not include specific field
  observations of every individual property" and "is designed to be specific enough to determine
  whether further environmental review of a development proposal is necessary". A lot touching
  either overlay now goes to REVIEW, which is exactly where the paragraph below says it belongs.
  What is still NOT ENCODED is everything this refusal was actually about: the density caps of
  16.32.090 and 16.34.050(B), the sliding buildable fraction of 16.32.040(C), and the setback
  relief in 16.34.050(A)(1). A flag routes a lot to a human; it does not do the arithmetic.
  Known limit carried forward: 16.34.060 lets development at least 100 ft from the NROZ proceed
  without verification, so 100 ft is the code's own no-review distance, and a touch-only flag
  under-reports lots that are near the overlay without meeting it.

  Two smaller readings kept for whoever encodes it. 16.32.020 carves out lots created between
  April 21, 1999 and April 21, 2009 entirely, per ORS 92.040. And the same subsection ends
  "actual site specific conditions shall take precedence over any aerial topography mapping or
  other non-survey specific datum" -- which is the code saying in advance that a DEM-derived
  slope is not the last word, and is the reason a lot this rule touches belongs in REVIEW rather
  than RED even once it is encoded.
ingest:
  geoid: null
  juris_city_codes:
  - HAPPY VALLEY
  zoning_layer: zoning_happy_valley
  zone_field: ZONE
  strip_lowercase_suffix: false
crossrefs:

  # --- two accessory-use references out of the district use table ----------
  "16.44.050":
    outcome: other_building
    note: >-
      Accessory dwelling units: "As an accessory use, there may be the customary outbuildings and
      no more than one accessory dwelling unit, complying with the requirements of Section
      16.44.050." A subordinate second unit on a lot with a house. This screen places four attached
      primary units, and the chapter would at most permit a fifth.
  "16.69.020":
    outcome: other_building
    note: >-
      Home occupations: "A business activity that is carried out on the same site as a dwelling
      unit, and which is accessory to the residential use on the site." A use conducted inside a
      dwelling somebody already lives in. It sets no dimension the building has to meet.
  "16.62.020-1":
    outcome: other_building
    note: >-
      A relief for CONVERSIONS, reached from 16.43's parking chapter: "The provision of additional
      parking spaces is not required for housing type conversions (e.g., conversion of a
      single-family detached dwelling to triplex), per LDC 16.62.020-1." It ranked binding beside
      the maximum parking per unit because it sits in that table's notes, and it points the other
      way from a standard: it EXCUSES parking rather than requiring it. The building this screen
      places is new construction on a lot, not a house being cut into units, so the excuse is not
      available to it and its absence costs nothing. Worth being exact about what is not being
      claimed: this rules the REFERENCE, not LDC 16.62.020. That section is cited nowhere else in
      the corpus and nothing here has read it -- what is known is that 16.43's note points at its
      note 1 for a conversion relief, and a conversion is not what this screen places.
  "1012":
    outcome: preempted
    note: >-
      Clackamas County ZDO Section 1012, Density and Minimum Lot Size, reached from HVMC
      16.22's townhouse lot-size paragraph: "Lots created for congregate care facilities, two-
      and three-family dwellings, or multifamily dwellings are not subject to minimum, maximum,
      or average lot size standards. However, the density provisions of Section 1012 are
      applicable." A city citing a county section with no chapter prefix, which is not a
      mistake -- 16.22 says of the VTH district that it "is based on the Village Townhouse
      District in the Clackamas County Zoning and Development Ordinance", and the same chapter
      sends garages to "Clackamas County ZDO Subsection 1604.06(F)" and preexisting dwellings to
      "the Clackamas County VR-4/5 setback standards". Happy Valley annexed the districts and
      kept the county's numbering.
      The chapter was already in this store, filed under or/clackamas/_unincorporated, because
      the county layer reads it for its own land. The ledger could not see that and was right
      not to: a "1012" in a Portland document is not this section, and resolving section numbers
      across jurisdictions would invent references rather than find them. It took a person
      noticing that the neighbour holds the page.
      Both limbs are answered. The MAXIMUM density of 1012.05, applied to the VTH districts by
      1012.06, is a density cap on middle housing and OAR 660-046-0220(2)(b) strikes it out --
      the same preemption this corpus applies to every other maximum density it has read. The
      MINIMUM density of 1012.08 does not reach at all: it "applies in the Urban Low Density
      Residential, HDR, MR-1, MR-2, PMD, RCHDR, SHD, and VA Districts", and SFA, VTH and MUR-A
      are none of them. That second half is the one worth writing down, because this pipeline
      now routes a lot too big for its zone's density floor to REVIEW, and these zones have no
      floor to be short of.
      What remains in 1012 is subdivisions, partitions and replats -- a land division this screen
      does not draw. 1012.02(G) waives the minimum lot size for townhouses in the county's R and
      VR districts, and 16.22's own sentence waives it for lots CREATED for multifamily dwellings;
      neither reaches a fourplex built on a lot that already exists.
  "16.69.010":
    outcome: other_building
    note: >-
      "Temporary buildings for uses incidental to construction work ... Such buildings shall be
      removed upon completion." A construction trailer.
  "16.65":
    outcome: narrows_only
    note: >-
      Lot Size Averaging -- "single-family residential lot size may be averaged to allow lots less
      than the minimum lot size in residential districts." It lowers a minimum, so reading it
      could only admit lots this screen rejects on size. Chapter 16.65 is Master Planned
      Developments, which is also a discretionary path this screen does not take.
  "16.50.080":
    outcome: procedure
    note: >-
      Landscaping bond and timing: "final public infrastructure inspection and authorization to
      submit building permits may occur prior to the landscaping requirements having been met",
      subject to security. It sets when the landscaping has to be in the ground, not how much of
      the lot it takes.
  "16.61":
    outcome: other_path
    note: >-
      Middle housing land divisions, and the sentence citing it is the parent-lot rule restated:
      "If a duplex, triplex, fourplex, or cottage cluster has been divided by a middle housing
      land division, per LDC 16.61, the development standards that are applicable to the lot shall
      apply to the middle housing parent lot, not to the middle housing child lot." That is what
      this layer already encodes as land_division_parent_standards, from these same table notes.
      The chapter behind it governs how the split is approved, which is a path no pod declares.
  "16.44.080":
    outcome: other_path
    note: >-
      Neighborhood commercial uses. All three mentions are the same table note attached to a
      neighborhood commercial row of a residential zone's use table, which is why they land beside
      the dimensional standards printed above. This screen places a dwelling.

definitions:
  # "Corner lot. A lot bounded entirely by streets, or a lot which adjoins the
  # point of intersection of two or more streets and which the interior angle
  # formed by the extensions of the street lines in the direction which they
  # take at their intersections with lot lines other than street lines, forms
  # an angle of 135 degrees or less. In the event that any street line is a
  # curve at its point of intersection with a lot line other than street line,
  # the tangent to the curve at that point shall be considered the direction
  # of the street line."
  #
  # A 135-degree ceiling stated "or less", so it includes 135 -- the same
  # number Multnomah County writes as "less than 135" and excludes. Two
  # jurisdictions, one number, opposite answers on the boundary lot.
  #
  # The tangent sentence is not an extra rule for us, it is a measurement
  # convention we already follow: the angle is taken from each boundary side's
  # own bearing where it meets the next, which for a curved street line is its
  # tangent at that point.
  #
  # "Bounded entirely by streets" needs no separate encoding -- a lot with a
  # street on every side has intersecting frontages by any reading.
  corner_lot:
    test: intersecting_frontages
    count: 2
    max_intersection_angle_deg: 135.0
    quote: "or/clackamas/happy-valley/16.12.definitions.txt#L907-L908"
    cite: "HV LDC 16.12.030, Corner lot"

code:
- id: 16.12.definitions
  url: https://ecode360.com/print/HA4934?guid=43529904
  title: HV LDC Chapter 16.12 - Definitions
  # Prose about words, so almost nothing in it is a dimensioned standard and
  # the thinness guard reads it as a landing page. Read 2026-08-18: it is
  # 16.12.030, the definitions themselves, lot types set as a numbered list.
  allow_thin: true
- id: 16.22.residential
  url: https://ecode360.com/print/HA4934?guid=43529907
  title: HV LDC Chapter 16.22 - Residential Land Use Districts
# The constrained-land pair. Table 16.22's density rows carry the sentence "No
# density is allowed within constrained land except for the reduced rate within
# the Steep Slopes Development Overlay Zone and the Natural Resources Overlay
# Zone per LDC Section 16.32.090 and/or Section 16.34.050" -- a rule that can
# take a lot to zero rather than trim it -- and 16.32 is also where the code
# says what the slope of a lot is: "The 'slope' of a lot is calculated pursuant
# to Chapter 16.32." Clackamas slope data already exists from the quadfit run,
# so these are readable now rather than waiting on data.
#
# eCode360 hides its table of contents behind JavaScript, so a chapter's guid
# looks unreachable. The print view of the whole title returns every chapter
# with its id embedded: ecode360.com/print/HA4934?guid=43523935 is Title 16 and
# names all forty. Cheaper than guessing, and it is one request.
- id: 16.32.steep-slopes
  url: https://ecode360.com/print/HA4934?guid=43529950
  title: HV LDC Chapter 16.32 - Steep Slopes Development Overlay Zone
- id: 16.34.natural-resources
  url: https://ecode360.com/print/HA4934?guid=43529952
  title: HV LDC Chapter 16.34 - Natural Resources Overlay Zone
- id: 16.42.landscaping
  url: https://ecode360.com/print/HA4934?guid=43529965
  title: HV LDC Chapter 16.42 - Landscaping, Fences and Walls, Recreation Areas
- id: 16.63.land-divisions
  url: https://ecode360.com/print/HA4934?guid=43529977
  title: HV LDC Chapter 16.63 - Land Divisions and Property Line Adjustments
- id: 16.41.access
  url: https://ecode360.com/print/HA4934?guid=43529957
  title: HV LDC Chapter 16.41 - Access and Circulation
  # Fetched 2026-08-27, ordered the day before by 16.43's own silence: every
  # other city in this corpus keeps its driveway widths in the chapter of this
  # name, and 16.43 states none. It holds a driveway minimum and no approach
  # maximum, which is the reverse of every other layer here.
- id: 16.43.parking
  url: https://ecode360.com/print/HA4934?guid=43529966
  title: HV LDC Chapter 16.43 - Parking and Loading
  # Fetched 2026-08-27. Chapter 16.22 never points here -- the residential
  # chapter mentions parking twice, once inside a traffic study and once for
  # garages in the VTH district -- so nothing in this corpus would have found
  # it. The guid came from the Title 16 print view, the same route 16.32 and
  # 16.34 came in on.

defaults:
  # PARKING, read 2026-08-27. Happy Valley is the first city in this corpus to
  # answer the whole question in one chapter: it requires parking, dimensions
  # it, and says where it may not go, all in LDC 16.43.030.
  #
  # Table 16.43.030-1 puts this building on the row "Single-family attached
  # (townhome), duplex, triplex, quadplex, cottage cluster" and asks 1 space
  # per dwelling -- four for the pod -- against a maximum column reading "None
  # required". The row is the same whether the pod sits on one lot or four, so
  # nothing here turns on `unit_lots`, which makes Happy Valley the opposite
  # of Oregon City two files over.
  parking_min_per_unit:
    value: 1
    cite: HV LDC 16.43.030.B.12, Table 16.43.030-1, Residential row (townhome/duplex/triplex/quadplex/cottage cluster)
    url: https://ecode360.com/print/HA4934?guid=43529966
    retrieved: '2026-08-27'
    quote: "or/clackamas/happy-valley/16.43.parking.txt#L215-L216"
  # The maximum column of the same row. Its header says so twice over --
  # "Maximum Parking Spaces (if nothing is noted, there is no maximum)" -- and
  # footnote 4 confirms it from the other side: maximums "apply only to
  # multifamily units in town centers, regional centers, and the transit
  # areas", which is a different row of this table and a place this building
  # is not.
  parking_max_per_unit:
    exempt: true
    cite: HV LDC Table 16.43.030-1, Maximum Parking Spaces column, and footnote 4
    url: https://ecode360.com/print/HA4934?guid=43529966
    retrieved: '2026-08-27'
    quote: "or/clackamas/happy-valley/16.43.parking.txt#L192-L196,L215-L217,L456-L457"
  # Table 16.43.030-2, "Off-Street Parking Matrix Required Space and Aisle
  # Dimensions in Feet", standard-size vehicles at 90 degrees: stall width
  # 9.0, stall depth 18.5, aisle width 24.0, module width 61.0, bumper
  # overhang 2.5. The module figure is the check on the reading -- 18.5 plus
  # 24 plus 18.5 is 61 -- which matters because the extraction publishes this
  # table one cell per line with no row structure left in it. Twenty-four feet
  # is Fairview's aisle and Oregon City's, and the widest anyone asks.
  # Compact stalls (8.0 by 16.0, aisle 20.0) are capped at 35 percent of the
  # stalls Table 16.43.030-1 requires, so the standard row is what a placement
  # is screened against. One aisle figure, not two.
  parking_stall_width_ft:
    value: 9
    cite: HV LDC 16.43.030.F.2, Table 16.43.030-2, standard vehicle at 90 degrees
    url: https://ecode360.com/print/HA4934?guid=43529966
    retrieved: '2026-08-27'
    quote: "or/clackamas/happy-valley/16.43.parking.txt#L563-L568,L618-L623"
  parking_stall_depth_ft:
    value: 18.5
    cite: HV LDC 16.43.030.F.2, Table 16.43.030-2, standard vehicle at 90 degrees
    url: https://ecode360.com/print/HA4934?guid=43529966
    retrieved: '2026-08-27'
    quote: "or/clackamas/happy-valley/16.43.parking.txt#L563-L568,L618-L623"
  parking_aisle_one_way_ft:
    value: 24
    cite: HV LDC 16.43.030.F.2, Table 16.43.030-2, standard vehicle at 90 degrees
    url: https://ecode360.com/print/HA4934?guid=43529966
    retrieved: '2026-08-27'
    quote: "or/clackamas/happy-valley/16.43.parking.txt#L563-L568,L618-L623"
  parking_aisle_two_way_ft:
    value: 24
    cite: HV LDC 16.43.030.F.2, Table 16.43.030-2, standard vehicle at 90 degrees
    url: https://ecode360.com/print/HA4934?guid=43529966
    retrieved: '2026-08-27'
    quote: "or/clackamas/happy-valley/16.43.parking.txt#L563-L568,L618-L623"
  #
  # NOT ENCODED, and this is the one that would change a site plan: LDC
  # 16.43.030.E.4, Parking Location. "Parking areas shall be set back from a
  # lot line adjoining a street the same distance as the required building
  # setbacks. Regardless of other provisions, a minimum setback of ten feet
  # shall be provided along the property fronting on a public street." A
  # parking setback equal to the building setback is not a placement rule this
  # screen has a field for, and in Happy Valley's residential zones the front
  # setback is twenty feet, so the effect is that no stall may sit in the
  # front yard at all -- not capped at half of it the way Milwaukie and
  # Wilsonville cap it, banned. E.1 adds "No off-street parking shall be
  # allowed in the landscaped yard areas of any lot", and E.3 sends a parking
  # area abutting a residential district to that district's setback, which is
  # a neighbour's standard applying to our lot. (or/clackamas/happy-valley/16.43.parking.txt#L515,L523,L527)
  #
  # NOT ENCODED: LDC 16.43.030.F.5, Backing and Maneuvering. "Except for a
  # single-family dwelling or two-family dwelling, groups of more than three
  # parking spaces shall be provided with adequate aisles or turnaround areas
  # so that all vehicles enter the right-of-way (except for alleys) in a
  # forward manner." Four stalls is more than three and a quadplex is neither
  # exception, so forward entry is required on every Happy Valley lot without
  # an alley -- the third city to state it (Milwaukie 19.607.1.E.2, Gresham's
  # hard-coded rear court) and the first to state it as a flat rule rather
  # than one conditioned on street class. F.3 adds that no vehicle may project
  # over a property line or right-of-way, and allows a five-foot-clear
  # overhang across an internal sidewalk. (or/clackamas/happy-valley/16.43.parking.txt#L632,L640)
  #
  # NOT ENCODED: three ways the minimum above can fall to zero, all of them
  # site facts nothing measures. 16.43.030.B.12 exempts a lot within
  # three-quarters of a mile of a rail transit stop, within half a mile of a
  # frequent transit corridor as defined by OAR 660-012-0710, or within a
  # quarter mile of the Clackamas Regional Center or Happy Valley Town Center.
  # Footnote 5 exempts "residential units smaller than 750 square feet",
  # affordable housing under OAR 660-039-0010 and publicly supported housing
  # under ORS 456.250 -- this pod's units are about a thousand square feet
  # each, so the size limb does not reach it, and affordability is elective.
  # Footnote 3 exempts housing-type conversions, which is not new
  # construction. Encoding any of them would forgive a requirement that
  # really applies. (or/clackamas/happy-valley/16.43.parking.txt#L155-L181,L454-L459)
  #
  # DRIVEWAY, read 2026-08-27 out of Chapter 16.41 once it was fetched.
  # 16.41.030.B.1: "A driveway to an off-street parking area shall be improved
  # from the public roadway to the parking area a minimum width of 20 feet for
  # a two-way drive or 12 feet for a one-way drive but in either case not less
  # than the full width of the standard approach for the first 20 feet of the
  # driveway."
  #
  # Twenty feet is the hardest number this family has found. Every other city
  # here either states nine feet (Portland) or states nothing, and Happy
  # Valley asks a rear court reached by a single drive to give up twenty feet
  # of side yard for the length of the building -- which on a lot narrow
  # enough is the whole difference between a site plan and none. It is a
  # MINIMUM, so it cannot be traded down the way a maximum can be traded up.
  #
  # The one-way figure is real and is not this design's: a one-way drive means
  # a loop, which means two curb cuts, and 16.41.030.A.3 allows a site abutting
  # an arterial or collector only one access point. Both figures are encoded
  # because the layout is a design choice and the screen should hold the right
  # number when it changes.
  driveway_min_width_two_way_ft:
    value: 20
    cite: HV LDC 16.41.030.B.1, minimum improved driveway width, two-way drive
    url: https://ecode360.com/print/HA4934?guid=43529957
    retrieved: '2026-08-27'
    quote: "or/clackamas/happy-valley/16.41.access.txt#L27,L53-L59"
  driveway_min_width_one_way_ft:
    value: 12
    cite: HV LDC 16.41.030.B.1, minimum improved driveway width, one-way drive
    url: https://ecode360.com/print/HA4934?guid=43529957
    retrieved: '2026-08-27'
    quote: "or/clackamas/happy-valley/16.41.access.txt#L27,L53-L59"
  #
  # NOT ENCODED: a driveway approach width, because Happy Valley states none.
  # The sentence above ends "not less than the full width of the standard
  # approach for the first 20 feet of the driveway", and the standard approach
  # is a public works drawing, not a code dimension -- 16.41.030.B.3 says the
  # same of the residential cases it does dimension ("Driveway approaches and
  # vehicular maneuvering areas must be constructed in accordance with
  # applicable City standards"). So this is a document read and a rule the
  # city keeps elsewhere, not a gap in the reading. The rest of 16.41.030.B is
  # site facts nothing measures: 12 feet of vertical clearance, a 12 percent
  # slope ceiling for a driveway (15 with a design exception), vision
  # clearance, and shared driveways where the City Engineer requires them.
  # (or/clackamas/happy-valley/16.41.access.txt#L60-L105)
  #
  # ENCODED PER ZONE, not here: LDC 16.43.030.E.4, Parking Location. "Parking
  # areas shall be set back from a lot line adjoining a street the same
  # distance as the required building setbacks. Regardless of other
  # provisions, a minimum setback of ten feet shall be provided along the
  # property fronting on a public street."
  #
  # The sentence states no number of its own. It points at a number, and the
  # number it points at is different in every district -- twenty-two in the
  # six lower-density zones, twenty in R-5 and MUR-S, ten in the three
  # attached ones. Ten is the only figure on the page and it is the LOOSE
  # limb, so a file holding the ten alone would be half the standard and wrong
  # in the permissive direction, which is the one direction this corpus does
  # not go. This was refused for exactly that reason until `same_as` existed
  # to carry it; the whole of what changed is that a value may now name the
  # standard it equals, and the loader resolves the pair against the setback
  # row sitting three lines above it in the same zone with its own citation.
  # Nobody types twenty-two.
  #
  # It lives on the zones rather than here because the answer is per zone. The
  # two districts with no setbacks to lend -- MUR-M and MUR-X, whose Table
  # 16.22.060-2 dimensions read "Variable ... determined through the master
  # plan process" -- state no answer and get none. R20CC gets it through
  # `like: R20`, which is what adoption by reference is for.
  #
  # What the rule comes to for this building: nothing. Every district that
  # permits a quadplex sets a building back at least twenty feet from a
  # street, the site plan is drawn inside that envelope, and a court twenty
  # feet back from the frontage clears a parking setback of twenty. It is
  # encoded because it is the law and because the next city may print a bigger
  # number, not because it moves a lot here.
  #
  # Two neighbours in the same subsection stay refused, and for the old
  # reason. E.1, "No off-street parking shall be allowed in the landscaped
  # yard areas of any lot" -- a landscaped yard AREA is not a yard, no field
  # holds where a lot's landscaping is, and min_landscaped_pct is a share of
  # the lot rather than a place on it. E.3 sends a parking area abutting a
  # residential district to "the setback of the most restrictive adjoining
  # residential zoning district", which is the NEIGHBOUR'S standard applying
  # to our lot: `same_as` reaches another field in this zone, not another
  # zone's field, and what would answer it is the zoning of the parcel next
  # door. (or/clackamas/happy-valley/16.43.parking.txt#L515,L523)
  #
  # NOT ENCODED: any private open space standard, and the trail runs cold in a
  # way worth writing down. Two of the zone tables in Chapter 16.22 carry a
  # footnote reading "Pursuant to Section 16.42.030, 20% of the net developable
  # area must be usable open space" -- but it hangs on the building-height row
  # of the higher-density tables, the phrase "usable open space" appears
  # nowhere in Chapter 16.42 as fetched, and 16.42.010 excepts "single-family
  # detached, single-family attached dwellings, duplexes, triplexes,
  # quadplexes, or cottage clusters" from Section 16.42.030(D), (F), (G), (H),
  # (J) and (K) by name. A footnote pointing at a section that does not
  # contain it, in a table this building is not on, under a chapter that
  # excludes this building from most of the section: three reasons not to
  # encode twenty percent, and no reason to. (or/clackamas/happy-valley/16.22.residential.txt#L679,L1320 and
  # or/clackamas/happy-valley/16.42.landscaping.txt#L25)

zones:
  R40:
    section:
    - '16.22.020'
    cite_default:
      cite: HV LDC 16.22.020 Table 16.22.020-2 (Very Low Density)
      url: https://ecode360.com/print/HA4934?guid=43529907
      retrieved: '2026-07-28'
    quadplex_allowed:
      value: true
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L160"
      variants:
        # The note over this use table, in every one of the three it appears
        # in: "Applies to a parent lot. Duplexes, triplexes, quadplexes, and
        # cottage clusters are not permitted on a child lot (i.e., previously
        # subdivided lot from a middle housing land division)."
        #
        # The permission itself is qualified, which is the strongest kind of
        # condition there is -- on a child lot this building is not a smaller
        # building, it is no building. The fact is assumed false because a
        # middle housing land division is rare and the answer is in the plat
        # record; the assumption comes back with the answer rather than
        # disappearing into it.
        - value: false
          when: [middle_housing_child_lot]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L271"
    max_height_ft:
      # Table 16.22.020-2, the "Building height (maximum)" row: 45 feet in all
      # three columns. The quote carries the column header line as well as the
      # row, because the row prints the same figure three times and on its own
      # it does not say which zone is being read.
      #
      # Note 5 is the marker on the cell: "The single-family residential
      # building height maximum is 45 feet at the front elevation; side and
      # rear elevations may not exceed 49 feet." It grants single-family
      # residential four extra feet at the back and sides. This building is
      # four attached dwellings, so the relief is not available to it and the
      # cell figure stands unqualified. Either way 26 feet clears.
      value: 45
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L278,L298"
    max_density_du_per_acre:
      # Table 16.22.020-2 prints no ceiling against the quadplex row -- the
      # standard there is "Lot size (minimum and maximum density)", a lot area
      # rather than a rate, and it is already carried as min_lot_sqft. What the
      # table does state for a rate is one row lower: "Townhome maximum density
      # (units per net acre)", 4.4 du/net acre in R-40.
      #
      # So the base is exempt and the townhouse figure is the variant, the same
      # shape R-5 carries. The header row is quoted with the density row
      # because the table puts three districts on one printed line and 4.4
      # alone does not say which column it came from.
      #
      # 4.4 and not the 25 in R-5's table: each column states its own, and
      # reading one district's number across would put four times the real
      # ceiling on R-40.
      exempt: true
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L278,L281"
      # The acre this rate is per is a net one.
      # 16.12 defines a net acre as "one acre of developable land, as
      # calculated pursuant to Section 16.63.020(F)". That calculation is a
      # survey of the parcel, not an attribute of it.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list, and it took two documents to
        # reach. 16.12 defines a net acre as "one acre of developable land,
        # as calculated pursuant to Section 16.63.020(F)" -- a glossary entry
        # that names the quantity and sends the reader somewhere else, which
        # is not a definition of what comes off.
        #
        # 16.63.020(F)(1) is where it is actually said. Constrained land is
        # public facilities in a tract including stormwater treatment, public
        # and private right-of-way, land under the Steep Slopes Overlay
        # (16.32), land under the Natural Resources Overlay (16.34), and
        # easement land the Planning Official finds similar. The quote is
        # that list rather than the glossary line, because the glossary line
        # answers no question a screen can ask.
        cite: HV LDC 16.63.020(F)(1), by way of 16.12 "Net acre"
        quote: "or/clackamas/happy-valley/16.63.land-divisions.txt#L133,L137,L141,L145,L149,L153"
      variants:
        - value: 4.4
          when: [unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L278,L281"
    setback_front_ft:
      value: 22
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L290"
    setback_side_ft:
      value: 15
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L292"
      variants:
        # The cell prints `15/04` -- 15 feet, or zero, the trailing 4 being
        # footnote 4 run up against the number. The footnote is quoted with
        # the row because the row alone does not say what the zero is for.
        - value: 0
          # The footnote says townhomes, and a townhome in this code sits on
          # its own lot -- the table gives it a lot minimum two rows above the
          # one this setback belongs to. A party wall alone is not the
          # condition; the pair is, which is also how the other five zones and
          # Gladstone read the same sentence.
          when: [attached_wall, unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L292,L305"
    setback_rear_ft:
      value: 22
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L291"
    setback_street_side_ft:
      value: 15
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L293"
    # 16.43.030.E.4, stated as equal to the building setback -- see the note
    # in `defaults:`. `same_as` resolves against the row above, the printed
    # ten-foot floor is the only figure the sentence carries, and neither
    # number is typed here.
    parking_street_setback_ft:
      same_as: setback_front_ft
      floor_ft: 10
      cite: HV LDC 16.43.030.E.4, parking set back from a street lot line by the required building setback
      url: https://ecode360.com/print/HA4934?guid=43529966
      retrieved: '2026-08-27'
      quote: "or/clackamas/happy-valley/16.43.parking.txt#L511,L527"
    min_lot_sqft:
      value: 40000
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L279"
      variants:
        # The row under the one this value comes from: "Lot size (minimum):
        # Townhome1 -- 1,500 sq. ft." Four of them is 6,000, a figure the
        # table prints nowhere and the one that binds when the pod is platted
        # as townhouses. Encoded as the printed figure so the citation check
        # still compares against 1,500.
        #
        # The gap this closes is not small: 40,000 square feet against 6,000 is
        # the difference between a lot this city will never permit a
        # four-unit building on and one it will.
        - per_dwelling: 1500
          when: [unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L280"
    min_lot_width_ft:
      value: 100
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L282"
      variants:
        # Footnote 2 on the row: "Townhomes are exempt from the lot width
        # requirements." An exemption, not a smaller number -- the code
        # switches the standard off for this building rather than loosening it.
        - exempt: true
          when: [unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L282,L303"
    min_lot_depth_ft:
      value: 200
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L283"
    min_frontage_ft:
      # L286 is the "All other lots" row. The row above it is a cul-de-sac
      # exception, which is not encoded: whether a lot fronts a cul-de-sac is
      # not a fact this screen measures, and reading the looser row across
      # would pass lots the code holds to 100.
      value: 100
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L284,L286"
      variants:
        # The row below the general one: townhomes, twenty feet, in every
        # column of every residential table in this chapter. The comment this
        # replaces called it "a standard for a different product than the pod"
        # -- but the pod platted as townhouses is that product, which is how
        # the townhome density row three fields up is already read.
        - value: 20
          when: [unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L287"
    max_coverage_pct:
      value: 20
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L288"
    min_landscaped_pct:
      # LDC 16.42.030(B) states the landscaping requirement by housing type,
      # and (B)(1) names this building: "Single-family detached, single-family
      # attached dwellings, duplexes, triplexes and fourplexes: 20%."
      #
      # Not a zone standard and not in the district tables at all -- it is
      # citywide, in the design-standards chapter, which is why nine zones
      # carry the same figure from the same sentence.
      #
      # It reaches a quadplex. 16.42.020 excuses "quadplexes" from Section
      # 16.42.030(D), (F), (G), (H), (J) and (K); (B) is not on that list, and
      # naming the exceptions is how a code says the rest applies.
      #
      # The denominator is "gross developable lot area of the greater proposed
      # development", which is not the lot and is defined nowhere in 16.12 --
      # the glossary's two developable-area terms both defer to 16.63.020(F).
      # Left on the lot's own area deliberately: developable area is never more
      # than the lot, so twenty percent of it is never more square feet than
      # twenty percent of the lot, and the check as run asks for at least as
      # much as the code does. The screen already flags this one optimistic for
      # a bigger reason -- 16.42.030(A)(8) says driveways and parking do not
      # count as landscaped area and nothing here knows how much of the
      # leftover they take.
      value: 20
      cite: HV LDC 16.42.030(B)(1)
      url: https://ecode360.com/print/HA4934?guid=43529965
      retrieved: '2026-08-20'
      quote: "or/clackamas/happy-valley/16.42.landscaping.txt#L89,L93"
    notes: 'quadfit confidence: verified | Setbacks/coverage from City Model Home Application form (LDC
      eff 3/19/2024). Height 45 ft front elev / 49 ft side+rear. Covered porch >=20% of bldg line cuts
      front to 15 ft. Quadplex by-right per HV Middle Housing amendments. min_lot is the nominal density
      basis (verify Table 16.22.020-2).'
