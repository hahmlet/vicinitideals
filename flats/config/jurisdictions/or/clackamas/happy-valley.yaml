label: Happy Valley
kind: city
eligible: true
notes: >-
  Ported from quadfit rules.yaml. Every value is `draft` -- quadfit's verification was against a coarser
  standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint='entrance_only'.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  READ AND NOT ENCODED.


  (1) 16.42.080, shared outdoor recreation areas. Every residential table in 16.22 prints "400 sq.
  ft./unit provided in accordance with Section 16.42.080" against every district, which made it the
  loudest unfetched reference in the whole corpus -- eleven mentions, eight of them beside a number this
  screen uses. Fetched and read 2026-08-20. 16.42.080(A): "The standards of this section apply to
  subdivisions of 30 or more units." Four units is not thirty, so the row reaches somebody else's
  development. (B) excuses PUDs and multifamily of five or more as well, a second door out of the same
  standard and not the one this building uses. Sixteen hundred square feet of recreation tract that the
  tables appear to demand of a fourplex, and do not.


  (2) 16.42.030(B) is the part of that chapter that does reach the pod, and it is now encoded on every
  zone as min_landscaped_pct. Worth saying why the two land differently: 16.42.020 excuses quadplexes
  from 16.42.030(D), (F), (G), (H), (J) and (K), and (B) is not on the list.


  (4) The attached districts, now encoded. Table 16.22.050-2 states the standards for SFA, MUR-A and
  VTH and Table 16.22.060-1 the uses for MUR-M and MUR-X. A quadplex is permitted by right in all
  three attached districts -- "Four-family dwelling (quadplex): P, P, P" -- and they are the densest
  residential land in the city, with lot minimums of 2,000 and 3,000 square feet against R-40's
  40,000. The fifteen footnotes dismissed as scoped to those tables are back in scope and were
  already ruled on; nothing in this layer blocks.


  Two things in that slice are worth carrying forward. VTH is the only district in the chapter whose
  density is stated as an area per primary unit rather than units per acre, and it is the one place
  where reading the lot-size row alone misleads by four times: 2,000 square feet of lot minimum
  against 8,000 square feet of net developable area for four units at the maximum density. It is
  also the only Happy Valley district with a maximum street setback.


  And MUR-M and MUR-X refuse the building rather than dimension it. Their use table is a closed list
  -- no "uses similar to" row, unlike the three attached districts -- and its residential rows are
  attached dwellings (townhouses, attached duplex, rowhouses) and multifamily, which 16.12 defines as
  five or more families. A four-family dwelling on one lot is neither, and this chapter names
  "Four-family dwelling (quadplex)" as its own row in every other use table it appears in. On unit
  lots the same table says yes, and that is carried as a variant -- which is when Table 16.22.060-2's
  "Variable" dimensions start to matter, and they are the one thing here that cannot be encoded at
  all: "Standards are flexible and shall be determined through the master plan process or design
  review application."


  (5) The townhome column. Every residential table in 16.22 prints a townhome row beside the row a
  quadplex is named in, and the townhome row is looser in four standards at once -- 1,500 square
  feet of lot against R-40's 40,000, no lot width at all, twenty feet of frontage against a
  hundred, and a zero interior side yard. All four are now carried as `unit_lots` variants. Before
  this pass the file held a lot the code permits this building on to a minimum twenty-six times the
  real one.


    (3) 16.63.020(F), density calculations. Fetched with 16.42 and read for the same reason -- 16.12's
  "net acre" and "floor area ratio" both defer to it, so the subtraction behind every measured_on in
  this layer lived in an unfetched chapter. Now cited directly. (F)(3) also lets dedicated right-of-way
  count toward minimum lot size, but only "in the case of a partition, where the City is requiring the
  dedication", which is a land-division proceeding rather than a lot fact and is not encoded.
ingest:
  geoid: null
  juris_city_codes:
  - HAPPY VALLEY
  zoning_layer: zoning_happy_valley
  zone_field: ZONE
  strip_lowercase_suffix: false
crossrefs:
  "16.61":
    outcome: other_path
    note: >-
      Middle housing land divisions, and the sentence citing it is the parent-lot rule restated:
      "If a duplex, triplex, fourplex, or cottage cluster has been divided by a middle housing
      land division, per LDC 16.61, the development standards that are applicable to the lot shall
      apply to the middle housing parent lot, not to the middle housing child lot." That is what
      this layer already encodes as land_division_parent_standards, from these same table notes.
      The chapter behind it governs how the split is approved, which is a path no pod declares.
  "16.44.080":
    outcome: other_path
    note: >-
      Neighborhood commercial uses. All three mentions are the same table note attached to a
      neighborhood commercial row of a residential zone's use table, which is why they land beside
      the dimensional standards printed above. This screen places a dwelling.

definitions:
  # "Corner lot. A lot bounded entirely by streets, or a lot which adjoins the
  # point of intersection of two or more streets and which the interior angle
  # formed by the extensions of the street lines in the direction which they
  # take at their intersections with lot lines other than street lines, forms
  # an angle of 135 degrees or less. In the event that any street line is a
  # curve at its point of intersection with a lot line other than street line,
  # the tangent to the curve at that point shall be considered the direction
  # of the street line."
  #
  # A 135-degree ceiling stated "or less", so it includes 135 -- the same
  # number Multnomah County writes as "less than 135" and excludes. Two
  # jurisdictions, one number, opposite answers on the boundary lot.
  #
  # The tangent sentence is not an extra rule for us, it is a measurement
  # convention we already follow: the angle is taken from each boundary side's
  # own bearing where it meets the next, which for a curved street line is its
  # tangent at that point.
  #
  # "Bounded entirely by streets" needs no separate encoding -- a lot with a
  # street on every side has intersecting frontages by any reading.
  corner_lot:
    test: intersecting_frontages
    count: 2
    max_intersection_angle_deg: 135.0
    quote: "or/clackamas/happy-valley/16.12.definitions.txt#L907-L908"
    cite: "HV LDC 16.12.030, Corner lot"

code:
- id: 16.12.definitions
  url: https://ecode360.com/print/HA4934?guid=43529904
  title: HV LDC Chapter 16.12 - Definitions
  # Prose about words, so almost nothing in it is a dimensioned standard and
  # the thinness guard reads it as a landing page. Read 2026-08-18: it is
  # 16.12.030, the definitions themselves, lot types set as a numbered list.
  allow_thin: true
- id: 16.22.residential
  url: https://ecode360.com/print/HA4934?guid=43529907
  title: HV LDC Chapter 16.22 - Residential Land Use Districts
- id: 16.42.landscaping
  url: https://ecode360.com/print/HA4934?guid=43529965
  title: HV LDC Chapter 16.42 - Landscaping, Fences and Walls, Recreation Areas
- id: 16.63.land-divisions
  url: https://ecode360.com/print/HA4934?guid=43529977
  title: HV LDC Chapter 16.63 - Land Divisions and Property Line Adjustments
zones:
  R40:
    section:
    - '16.22.020'
    cite_default:
      cite: HV LDC 16.22.020 Table 16.22.020-2 (Very Low Density)
      url: https://ecode360.com/print/HA4934?guid=43529907
      retrieved: '2026-07-28'
    quadplex_allowed:
      value: true
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L160"
      variants:
        # The note over this use table, in every one of the three it appears
        # in: "Applies to a parent lot. Duplexes, triplexes, quadplexes, and
        # cottage clusters are not permitted on a child lot (i.e., previously
        # subdivided lot from a middle housing land division)."
        #
        # The permission itself is qualified, which is the strongest kind of
        # condition there is -- on a child lot this building is not a smaller
        # building, it is no building. The fact is assumed false because a
        # middle housing land division is rare and the answer is in the plat
        # record; the assumption comes back with the answer rather than
        # disappearing into it.
        - value: false
          when: [middle_housing_child_lot]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L271"
    max_height_ft:
      # Table 16.22.020-2, the "Building height (maximum)" row: 45 feet in all
      # three columns. The quote carries the column header line as well as the
      # row, because the row prints the same figure three times and on its own
      # it does not say which zone is being read.
      #
      # Note 5 is the marker on the cell: "The single-family residential
      # building height maximum is 45 feet at the front elevation; side and
      # rear elevations may not exceed 49 feet." It grants single-family
      # residential four extra feet at the back and sides. This building is
      # four attached dwellings, so the relief is not available to it and the
      # cell figure stands unqualified. Either way 26 feet clears.
      value: 45
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L278,L298"
    max_density_du_per_acre:
      # Table 16.22.020-2 prints no ceiling against the quadplex row -- the
      # standard there is "Lot size (minimum and maximum density)", a lot area
      # rather than a rate, and it is already carried as min_lot_sqft. What the
      # table does state for a rate is one row lower: "Townhome maximum density
      # (units per net acre)", 4.4 du/net acre in R-40.
      #
      # So the base is exempt and the townhouse figure is the variant, the same
      # shape R-5 carries. The header row is quoted with the density row
      # because the table puts three districts on one printed line and 4.4
      # alone does not say which column it came from.
      #
      # 4.4 and not the 25 in R-5's table: each column states its own, and
      # reading one district's number across would put four times the real
      # ceiling on R-40.
      exempt: true
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L278,L281"
      # The acre this rate is per is a net one.
      # 16.12 defines a net acre as "one acre of developable land, as
      # calculated pursuant to Section 16.63.020(F)". That calculation is a
      # survey of the parcel, not an attribute of it.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list, and it took two documents to
        # reach. 16.12 defines a net acre as "one acre of developable land,
        # as calculated pursuant to Section 16.63.020(F)" -- a glossary entry
        # that names the quantity and sends the reader somewhere else, which
        # is not a definition of what comes off.
        #
        # 16.63.020(F)(1) is where it is actually said. Constrained land is
        # public facilities in a tract including stormwater treatment, public
        # and private right-of-way, land under the Steep Slopes Overlay
        # (16.32), land under the Natural Resources Overlay (16.34), and
        # easement land the Planning Official finds similar. The quote is
        # that list rather than the glossary line, because the glossary line
        # answers no question a screen can ask.
        cite: HV LDC 16.63.020(F)(1), by way of 16.12 "Net acre"
        quote: "or/clackamas/happy-valley/16.63.land-divisions.txt#L133,L137,L141,L145,L149,L153"
      variants:
        - value: 4.4
          when: [unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L278,L281"
    setback_front_ft:
      value: 22
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L290"
    setback_side_ft:
      value: 15
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L292"
      variants:
        # The cell prints `15/04` -- 15 feet, or zero, the trailing 4 being
        # footnote 4 run up against the number. The footnote is quoted with
        # the row because the row alone does not say what the zero is for.
        - value: 0
          # The footnote says townhomes, and a townhome in this code sits on
          # its own lot -- the table gives it a lot minimum two rows above the
          # one this setback belongs to. A party wall alone is not the
          # condition; the pair is, which is also how the other five zones and
          # Gladstone read the same sentence.
          when: [attached_wall, unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L292,L305"
    setback_rear_ft:
      value: 22
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L291"
    setback_street_side_ft:
      value: 15
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L293"
    min_lot_sqft:
      value: 40000
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L279"
      variants:
        # The row under the one this value comes from: "Lot size (minimum):
        # Townhome1 -- 1,500 sq. ft." Four of them is 6,000, a figure the
        # table prints nowhere and the one that binds when the pod is platted
        # as townhouses. Encoded as the printed figure so the citation check
        # still compares against 1,500.
        #
        # The gap this closes is not small: 40,000 square feet against 6,000 is
        # the difference between a lot this city will never permit a
        # four-unit building on and one it will.
        - per_dwelling: 1500
          when: [unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L280"
    min_lot_width_ft:
      value: 100
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L282"
      variants:
        # Footnote 2 on the row: "Townhomes are exempt from the lot width
        # requirements." An exemption, not a smaller number -- the code
        # switches the standard off for this building rather than loosening it.
        - exempt: true
          when: [unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L282,L303"
    min_lot_depth_ft:
      value: 200
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L283"
    min_frontage_ft:
      # L286 is the "All other lots" row. The row above it is a cul-de-sac
      # exception, which is not encoded: whether a lot fronts a cul-de-sac is
      # not a fact this screen measures, and reading the looser row across
      # would pass lots the code holds to 100.
      value: 100
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L284,L286"
      variants:
        # The row below the general one: townhomes, twenty feet, in every
        # column of every residential table in this chapter. The comment this
        # replaces called it "a standard for a different product than the pod"
        # -- but the pod platted as townhouses is that product, which is how
        # the townhome density row three fields up is already read.
        - value: 20
          when: [unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L287"
    max_coverage_pct:
      value: 20
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L288"
    min_landscaped_pct:
      # LDC 16.42.030(B) states the landscaping requirement by housing type,
      # and (B)(1) names this building: "Single-family detached, single-family
      # attached dwellings, duplexes, triplexes and fourplexes: 20%."
      #
      # Not a zone standard and not in the district tables at all -- it is
