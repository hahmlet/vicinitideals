      # row, because the row prints the same figure three times and on its own
      # it does not say which zone is being read.
      #
      # Note 5 is the marker on the cell: "The single-family residential
      # building height maximum is 45 feet at the front elevation; side and
      # rear elevations may not exceed 49 feet." It grants single-family
      # residential four extra feet at the back and sides. This building is
      # four attached dwellings, so the relief is not available to it and the
      # cell figure stands unqualified. Either way 26 feet clears.
      value: 45
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L278,L298"
    max_density_du_per_acre:
      # Table 16.22.020-2 prints no ceiling against the quadplex row -- the
      # standard there is "Lot size (minimum and maximum density)", a lot area
      # rather than a rate, and it is already carried as min_lot_sqft. What the
      # table does state for a rate is one row lower: "Townhome maximum density
      # (units per net acre)", 11.6 du/net acre in R-15.
