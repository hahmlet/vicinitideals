        # 16.63.020(F)(1) is where it is actually said. Constrained land is
        # public facilities in a tract including stormwater treatment, public
        # and private right-of-way, land under the Steep Slopes Overlay
        # (16.32), land under the Natural Resources Overlay (16.34), and
        # easement land the Planning Official finds similar. The quote is
        # that list rather than the glossary line, because the glossary line
        # answers no question a screen can ask.
        cite: HV LDC 16.63.020(F)(1), by way of 16.12 "Net acre"
        quote: "or/clackamas/happy-valley/16.63.land-divisions.txt#L133,L137,L141,L145,L149,L153"
      variants:
        - value: 11.6
          when: [unit_lots]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L278,L281"
    setback_front_ft:
      value: 22
      quote: "or/clackamas/happy-valley/16.22.residential.txt#L290"
