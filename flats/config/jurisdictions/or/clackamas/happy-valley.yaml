        # footnote 4 run up against the number. The footnote is quoted with
        # the row because the row alone does not say what the zero is for.
        - value: 0
          when: [attached_wall]
          quote: "or/clackamas/happy-valley/16.22.residential.txt#L292,L305"
    setback_rear_ft:
