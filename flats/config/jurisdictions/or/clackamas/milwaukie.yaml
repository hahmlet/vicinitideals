  "19.500.supplementary.txt#19.505.3":
    queue: condition
    outcome: applies
    note: >-
      This one reaches the pod, and the applicability clause says so in its own words: the design
      elements in Table 19.505.3.D "apply, as described below, to all multi-unit developments and
      residential care facilities with 3 or more dwelling units on a single lot". Four units on
      one lot is inside that, and the exemption beside it is for cottage clusters and rowhouses on
      their own lots. What is already handled: D.1's private open space is encoded as 96 square
      feet per ground-floor dwelling with the unit-lot exemption; D.2's common open space is
      already recorded in this file as NOT ENCODED because it is triggered by "buildings with more
      than 5 dwelling units" and four is not more than five; D.4.b's 50 percent of the linear
      frontage OF THAT SIDE is already recorded as a different denominator from every other city's
      street-frontage rule; and D.4.c, garages set 4 feet behind the front facade, needs a garage
      this design does not have. What is left is D.5.c and D.5.d, and they are a standard nothing
      here can hold. "For sites not on an arterial street, at least 50% of a site's street
      frontage, excluding driveways, shall be occupied by buildings that are located no further
      than 10 ft from the required setback line", and 20 feet where the site is on an arterial.
      That is two rules in one sentence. The first is a maximum front setback, and it is
      computable -- both Milwaukie zones that permit a quadplex state a 20-foot front minimum, so
      the building must stand between 20 and 30 feet of the front lot line -- but the 30 is
      arithmetic and appears nowhere on the page, and this model has no form for a standard stated
      as an offset from another standard the way it has `per_height_ft` for one stated as a ratio.
      Writing 30 would be inventing a number. The second is a minimum share of frontage the
      building itself must cover, which no field in this registry states: it binds a fixed-width
      pod on a wide lot, where half the frontage is more building than the pod is long. Both are
      recorded here rather than encoded, and this card stays open as the standing request for the
      offset form and the frontage-occupation field.
