  # === The September 2026 map's eleven codes, ruled 2026-09-20 =============
  #
  # Steph's rule: every code the county map carries is read once, its reason
  # written down, and never shown again. Milwaukie's map carried eleven codes
  # this layer did not hold. Seven refuse the building at their use table or
  # use list and are the use-gate refusals below, each quoting Chapter 19.300
  # the way R-MD quotes its own row, and each with nothing dimensional
  # encoded because nothing dimensional matters while the building may not
  # be built. The other four -- the three commercial mixed-use zones and the
  # Downtown Mixed Use zone -- permit the building in one form or another;
  # they were read and encoded as zone blocks on 2026-10-08 (GMU and DMU by
  # right on unit lots only; NMU and SMU RED BY RULING).
  #
  # One definition does most of the work. MMC 19.200 defines "Quadplex" as
  # "4 dwelling units on a lot or parcel in any configuration"
  # (19.200.definitions.txt#L731-L732) and "Multi-unit development" as "a
  # structure that contains 5 or more dwelling units" (L723-L724); the
  # residential tables list Quadplex and Multi-unit housing as separate rows.
  # So a table whose only housing row is multifamily has no row a four-unit
  # building could be, and a table with a Townhouse row admits it only split
  # onto unit lots.
