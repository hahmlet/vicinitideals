label: Milwaukie
kind: city
eligible: true
notes: Ported from quadfit rules.yaml. Every value is `draft` — quadfit's verification was against a coarser
  standard (one citation per row) and does not carry over.
ingest:
  geoid: null
  juris_city_codes:
  - MILWAUKIE
  zoning_layer: zoning_milwaukie
  zone_field: ZONE
  strip_lowercase_suffix: false
definitions:
  # "Corner lot" means a lot abutting 2 or more streets, other than an alley,
  # at their intersection."
  #
  # Oregon City's and Tualatin's shape, with the alley exclusion stated in the
  # sentence. No angle, so a bending street is read the way silence is read
  # elsewhere: a non-collinear frontage is an intersection.
  #
  # 19.200 is where Milwaukie's lot-line rules live too -- "in the case of a
  # corner lot, a line separating the lot from the street" -- which is the
  # second front setback this term is load-bearing for.
  corner_lot:
    test: intersecting_frontages
    count: 2
    quote: "or/clackamas/milwaukie/19.200.definitions.txt#L434-L435"
    cite: "MMC 19.200, Definitions, Corner lot"

code:
  # eCode360 (code MI4969); /print/<code>?guid=<node> returns server-rendered
  # HTML. guid 43860500 is Chapter 19.300 Base Zones — both residential zones
  # (19.301 R-MD, 19.302 R-HD) in one document.
  - id: "19.200.definitions"
    url: https://ecode360.com/print/MI4969?guid=43860165
    title: "Chapter 19.200 - Definitions and Measurements"
    # Prose about words: almost no dimensioned standards, which the thinness
    # guard reads as a landing page. Read 2026-08-18 -- it is the definitions
    # chapter, and its lot types are set as a lettered list.
    allow_thin: true
  - id: "19.300.base-zones"
    url: https://ecode360.com/print/MI4969?guid=43860500
    title: "MMC Chapter 19.300 - Base Zones"
    # Table 19.304.1 prints its footnote markers hard against the numbers:
    # "Street side yard 154" is fifteen feet with note 4. Read 2026-08-19
    # against the stored text, and declared rather than guessed -- see
    # CodeDocument.glued_markers.
    glued_markers: true
  - id: "19.500.supplementary"
    url: https://ecode360.com/print/MI4969?guid=43861924
    title: "MMC Chapter 19.500 - Supplementary Development Regulations"
    # Fetched 2026-08-20 because the cross-reference ledger found every one of
    # Milwaukie's fifteen unfetched references pointing into this chapter, and
    # fourteen of the fifteen standing beside a number this screen already
    # uses. 19.301.4 and 19.302.4 -- the two tables the zones are read from --
    # do not state the whole standard: each row carries a "cross references"
    # column pointing here for the exceptions.
    #
    # 19.501.3, "Building Height and Side Yard Height Plane Exceptions", is
    # the Gresham shape exactly and the reason this is first in the queue.
zones:
  R-MD:
    section: ["19.301"]
    cite_default:
      cite: MMC 19.301 Moderate Density Residential, Table 19.301.4; use table 19.301.2
      url: https://ecode360.com/43860500
      retrieved: '2026-07-28'
    quadplex_allowed:
      value: true
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L35"
      variants:
        # Note 3: "Townhouses are not permitted on flag lots." The pod on one
        # lot is a quadplex and unaffected; split onto four it is townhouses,
        # and on a flag lot that path closes.
        - value: false
          when: [unit_lots, flag_lot]
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L282"
    setback_front_ft:
      value: 20
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L184"
    setback_side_ft:
      # 5 ft is what row C.1 prints. It is not the side yard this building
      # gets. Four rows below it the same table prints a side yard height
      # plane: 20 ft of height allowed at the minimum side yard depth, rising
      # at 45 degrees. A 26 ft wall is six feet over that plane and buys them
      # one-for-one, so it stands at 11 ft.
      #
      # 19.200 is what makes the arithmetic readable: "The starting point of
      # the side yard height plane is horizontally offset from the side lot
      # line by the required side yard depth, and set at specified vertical
      # distance above the grade ... From the starting point, the side yard
      # height plane slopes up at a specified angle until it reaches the
      # maximum allowed building height" -- MMC 19.200, Definitions, "Side
      # yard height plane", at 19.200.definitions.txt#L813-L814. The plane
      # starts at the required yard, not at the lot line, which is the
      # difference between 11 ft and 6.
      #
      # 19.501.3 is titled Exceptions and grants two: objects not used for
      # human occupancy (chimneys, spires, elevator housings) and eaves
      # projecting up to 30 in past the plane. Neither reaches a wall. There
      # is no exception for middle housing, and 19.505.1, .3 and .5 -- the
      # design sections for one-to-four-unit, multi-unit and townhouse
      # development -- state articulation and entries, not yards.
      value: 5
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L194"
      step_back:
        height_ft: 20
        slope_degrees: 45
        cite: MMC Table 19.301.4 row C.3, Side yard height plane limit
        quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L229,L231,L232,L236,L237"
    setback_rear_ft:
      value: 20
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L215"
      variants:
        - value: 15
          band: {measure: lot_sqft, at_least: 1500, at_most: 2999}
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L214"
    setback_street_side_ft:
      value: 20
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L207"
      variants:
        - value: 5
          band: {measure: lot_sqft, at_least: 1500, at_most: 2999}
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L204"
        - value: 15
          band: {measure: lot_sqft, at_least: 3000, at_most: 4999}
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L205"
        - value: 15
          band: {measure: lot_sqft, at_least: 5000, at_most: 6999}
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L206"
    min_lot_sqft:
      value: 3000
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L120"
      variants:
        - value: 1500
          when: [unit_lots]
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L119-L130"
    min_lot_width_ft:
      value: 60
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L145"
      variants:
        - value: 20
          band: {measure: lot_sqft, at_least: 1500, at_most: 2999}
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L142"
        - value: 30
          band: {measure: lot_sqft, at_least: 3000, at_most: 4999}
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L143"
        - value: 50
          band: {measure: lot_sqft, at_least: 5000, at_most: 6999}
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L144"
    max_coverage_pct:
      value: 30
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L245"
      variants:
        - value: 45
          band: {measure: lot_sqft, at_least: 1500, at_most: 2999}
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L242"
        - value: 35
          band: {measure: lot_sqft, at_least: 3000, at_most: 4999}
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L243"
        - value: 35
          band: {measure: lot_sqft, at_least: 5000, at_most: 6999}
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L244"
    max_height_ft:
      value: 35
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L224"
    max_density_du_per_acre:
      # Table 19.301.4 row "b. Maximum" reads 25 / 8.7 / 8.7 / 6.2 across the
      # four lot-size bands, and note 4 does two things to it: it exempts
      # duplexes, triplexes, quadplexes and cottage clusters outright, and it
      # holds townhouses to four times the single-detached figure or 25 du per
      # acre, whichever is less. Exempt at the base is the pod on one lot; the
      # variants are the same building split onto four.
      exempt: true
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L283"
      # The acre this rate is per is a net one.
      # 19.202.4.D.1 and .E.1 both subtract floodways, right-of-way
      # dedications and public open space from the gross area before
      # dividing by 43,560. The lot's own square footage is an upper bound
      # on that quantity and nothing more.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list: the longest list in this corpus -- rights-of-way, floodplains,
      # protected water features and their vegetated corridors, Goal 5
      # resources, slopes over 25 percent, and publicly owned park, open
      # space and resource land. Land carrying a density bonus or a
      # transfer right is expressly not deducted.
        cite: MMC 19.200 "Net acre"
        quote: "or/clackamas/milwaukie/19.200.definitions.txt#L529-L530"
      variants:
        # 25 is the number the note prints, and it governs in three of the
        # four bands: four times 25, 8.7 and 8.7 are all above it. In the
        # 7,000 sq ft band four times 6.2 is 24.8 and would bind instead --
        # but 24.8 appears nowhere in the document, and typing it would cite
        # a sentence for a number the sentence does not contain. What that
        # costs is two tenths of a unit per acre in one band: sixty square
        # feet of lot under a four-unit building.
        - value: 25
          when: [unit_lots]
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L283"
    notes: 'Table 19.301.4 is one zone in four columns, split by how big the lot already is: 1,500-2,999
      sq ft, 3,000-4,999, 5,000-6,999, and 7,000 and up. The base value here is the last column and the
      variants are the other three, so a lot FLATS has not measured comes back ambiguous rather than
      taking the standards written for the largest lots. min_lot_sqft 3,000 is read off the Permitted
      Dwelling Type row, not a stated minimum: the 1,500-2,999 column permits townhouses only, and a
      quadplex first appears in the 3,000-4,999 column. Minimum lot depth (70 ft, then 80) has no field.
      quadplex_allowed is by-right: middle housing is permitted on any lot meeting its column.


      READ AND NOT ENCODED: 19.301.5.A makes the side yards asymmetric above 7,000 sq ft — "one side
      yard shall be at least 5 ft and one side yard shall be at least 10 ft" (L291) — for a cumulative
      15. An earlier note here said a single setback_side_ft could not express that and that encoding 5
      was the cautious reading. Both halves were wrong: setback_side_total_ft is the field for a
      cumulative yard, and 5 either side reserves 10 ft of width where the code demands 15, which passes
      a pod five feet too wide rather than refusing a legal one. It is left unencoded now for a
      different reason: the side yard height plane on this same table puts every side yard of a 26 ft
      building at 11 ft, so the pair is 22 and the cumulative 15 cannot bind. If the plane is ever
      relieved for this building, the 15 has to be encoded before the 5 can be trusted again.'
  R-HD:
    section: ["19.302"]
    cite_default:
      cite: MMC 19.302 High Density Residential, Table 19.302.4
      url: https://ecode360.com/43860500
      retrieved: '2026-07-28'
    quadplex_allowed:
      value: true
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L404"
    setback_front_ft:
      value: 20
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L495"
    setback_side_ft:
      # Same plane, five feet higher: Table 19.302.4 allows 25 ft at the
      # minimum side yard and the same 45 degrees. A 26 ft wall is one foot
      # over and stands at 6 ft. See the R-MD note above for the definition
      # that fixes where the plane starts and for what 19.501.3 exempts.
      #
      # Table 19.302.4's side yard row prints no number at all -- it reads
      # "See Subsection 19.302.5.A" -- and 19.302.5.A is two paragraphs, not
      # one. A.1 is the 5 ft, and it says "for development other than a
      # townhouse". A.2 is the townhouse rule: no side yard where two common
      # walls are shared, and for an exterior townhouse with one common wall,
      # zero at the wall and 5 ft on the opposite side. Both are quoted
      # because both readings of this building exist. On one lot it is a
      # quadplex -- 19.505.5 applies only to a dwelling on its own lot
      # sharing a common wall across a side LOT line -- so A.1 governs and
      # the yard is 5 ft either side. Split onto four unit lots the two end
      # units are exterior townhouses and owe 5 ft on their outer side, which
      # is the same envelope. The number does not change; the sentence that
      # was cited for it did not cover the case, which is the whole reason
      # for quoting the pair.
      value: 5
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L526,L530"
      step_back:
        height_ft: 25
        slope_degrees: 45
        cite: MMC Table 19.302.4, Side yard height plane limit
        quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L500-L502"
    setback_rear_ft:
      value: 15
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L498"
    setback_street_side_ft:
      value: 15
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L497"
      variants:
        - value: 5
          when: [unit_lots]
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L512"
    min_lot_sqft:
      value: 3000
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L476"
      variants:
        - value: 1500
          when: [unit_lots]
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L475"
    min_lot_width_ft:
      value: 20
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L486"
    max_height_ft:
      value: 45
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L499"
    max_coverage_pct:
      value: 50
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L503"
    max_density_du_per_acre:
      # Table 19.302.4 caps R-HD at 32 du per acre, and note 2 is the same
      # sentence Table 19.301.4 prints: middle housing is exempt, townhouses
      # are held to four times the single-detached figure or 25, whichever is
      # less. Four times 32 is 128, so here the 25 governs -- the townhouse
      # path is capped tighter than the zone.
      exempt: true
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L510"
      # The acre this rate is per is a net one.
      # 19.202.4.D.1 and .E.1 both subtract floodways, right-of-way
      # dedications and public open space from the gross area before
      # dividing by 43,560. The lot's own square footage is an upper bound
      # on that quantity and nothing more.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list: the longest list in this corpus -- rights-of-way, floodplains,
      # protected water features and their vegetated corridors, Goal 5
      # resources, slopes over 25 percent, and publicly owned park, open
      # space and resource land. Land carrying a density bonus or a
      # transfer right is expressly not deducted.
        cite: MMC 19.200 "Net acre"
        quote: "or/clackamas/milwaukie/19.200.definitions.txt#L529-L530"
      variants:
        - value: 25
          when: [unit_lots]
          quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L510"
    notes: 'Re-read against the adopted Table 19.302.4; the ported quadfit row disagreed with it on four
      standards and is replaced. Front was 5 and is 20: the 5 ft front yard applies only to properties
      identified in Figure 19.302.4, a mapped subset this screen cannot evaluate, so the general standard
      is what a lot is held to and the exception is relief a specific address may turn out to have. Rear
      was 20 and is 15. Minimum lot size was 5,000, which is the "all other uses" figure — the table
      minimum is 1,500 and the permitted-dwelling-type list is what binds: a quadplex first appears in
      the 3,000-4,999 sq ft band, a townhouse in 1,500-2,999, which is the unit_lots variant. Street side
      is 15 with a townhouse exception of 5 (footnote 4). CHECKER NOTE: the extracted table cell reads
      "154" — 15 with its footnote marker run onto it — so the quote check reports this value as
      misquoted. The number is right; the stored text is mangled, and a reviewer looking at the line can
      see both. UNENCODED: side yards for townhouses are zero on a shared wall and 5 ft on an exterior
      one (19.302.5.A.2), which for a four-unit attached building still leaves 5 ft on each outer wall,
      so the encoded 5 is what the building needs either way. Minimum lot depth (70 ft) has no field.
      Minimum density is 25 units/acre and maximum 32, but quadplexes are exempt from the maximum
      (footnote 2).'
