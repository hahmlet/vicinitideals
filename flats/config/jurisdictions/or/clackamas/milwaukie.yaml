  # === The four mixed-use zones, encoded 2026-10-08 =========================
  #
  # DMU (117 lots), NMU (51), GMU (45) and SMU (5) were `zone_rulings` waiting
  # on their dimensions. Read now: Tables 19.303.2 / 19.303.3 and 19.303.4-5
  # for the three commercial mixed-use zones, Tables 19.304.2 / 19.304.4 and
  # 19.304.3 / 19.304.5 for the downtown zone, plus the sections each points
  # at (19.504.4 transition measures, 19.505.5 townhouses, 19.508 downtown
  # design standards).
  #
  # THE USE ANSWER, by Steph's by-right-only ruling of 2026-10-08.
  # MMC 19.200 defines "Quadplex" as "4 dwelling units on a lot or parcel in
  # any configuration" and "Multi-unit development" as five or more, so
  #   - NMU and SMU: every dwelling row of Table 19.303.2 reads CU in their
  #     columns (single detached, townhouses, duplex/triplex/quadplex,
  #     multi-unit, cottage cluster). The only P rows are mixed use and
  #     live/work, and a four-unit pod is neither. The way in is a
  #     conditional use (Type III hearing, 19.905): RED BY RULING.
  #   - GMU: Townhouses P (note 1 lifts the four-in-a-row limit),
  #     Duplex/Triplex/Quadplex CU, Multi-unit housing P. Four units on one
  #     lot is the CU row, so the base is false; split onto four unit lots it
  #     is townhouses, permitted outright: a `unit_lots` variant.
  #   - DMU: Townhouse P, Multifamily P, and NO duplex/triplex/quadplex row,
  #     so a four-unit building on one lot is "not listed" and prohibited
  #     (19.304.2.D). On unit lots it is townhouses, permitted outright --
  #     except "Live/work units and townhouses are not permitted on Main
  #     Street" (19.304.3.A.1.c) and south of Scott Street no ground-floor
  #     dwelling at all (A.1.a). Those limits are drawn on Figure 19.304-2,
  #     an image, so the townhouse variant is held behind
  #     `inside_mapped_use_area`, a fact nothing measures yet (Cornelius GMU
  #     shape). The lot can therefore never be GREEN until the figure is traced.
  #
  # Downtown design review is NOT a bar to the DMU townhouse path:
  # 19.508.3.A says an applicant "may elect to meet all of the applicable
  # design standards ... Such projects can be reviewed through an
  # administrative Type I downtown design review" (19.907, not stored); only a
  # project that does NOT meet every standard goes to the discretionary Type
  # II or III (B). The Type I path is the by-right one and the standards are
  # objective. This is the one place the ruling "design review = red" was
  # read as not applying, and it is the sentence to come back to if Steph
  # rules otherwise.
