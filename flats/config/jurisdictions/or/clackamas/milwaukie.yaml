      different reason: the side yard height plane on this same table puts every side yard of a 26 ft
      building at 11 ft, so the pair is 22 and the cumulative 15 cannot bind. If the plane is ever
      relieved for this building, the 15 has to be encoded before the 5 can be trusted again.'
