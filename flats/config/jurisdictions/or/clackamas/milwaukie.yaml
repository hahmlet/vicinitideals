defaults:
  # PARKING, read 2026-08-27. Milwaukie states no vehicle-parking minimum for
  # a quadplex, caps one at four spaces, dimensions the space, and dimensions
  # no aisle it is allowed to use. Every part of that is in Chapter 19.600
  # and none of it was in this file until today.
  #
  # Section 19.605 is titled "Vehicle Parking Quantity Requirements" and its
  # only quantity subsection is 19.605.1, "Parking Maximums". Table 19.605.1
  # is headed "Minimum To Maximum Off-Street Parking Requirements" and prints
  # exactly one column, "Maximum Allowed". The minimum is not zero by
  # omission -- footnote 1 states the only vehicle minimum in the chapter, and
  # states it as a condition on the street:
  #
  #   "For middle housing developments located on streets classified as
  #    Arterials or Collectors in the Transportation System Plan, 0.5
  #    off-street parking spaces per dwelling unit are required."
  #
  # So the requirement is half a space per unit -- two for this pod -- unless
  # the frontage is a local street, and nothing measures street classification
  # yet. Arterial is therefore the base, the same way Lake Oswego's 20 ft
  # street side yard is the base and its 7.5 ft local-street figure is the
  # variant: it is the half that cannot turn a RED lot green by mistake.
  #
  # NOT ENCODED: the local-street relief. It is a real exception and it has no
  # citable figure. A zero is encodable where a code prints "None" or says "no
  # minimum"; Milwaukie says neither, it simply publishes a table with no
  # minimum column, and inventing a quotable zero out of a missing column is
  # the kind of thing this system exists to refuse. It costs nothing today --
  # `local_street` is assumed unknown, so a variant would never fire -- and it
  # is what a reader has to be told before anyone wires the street layer up.
  parking_min_per_unit:
    value: 0.5
    cite: MMC 19.605.1, Table 19.605.1 footnote 1 (Middle Housing)
    url: https://ecode360.com/print/MI4969?guid=43862935
    retrieved: '2026-08-27'
    quote: "or/clackamas/milwaukie/19.600.parking.txt#L292"
  # And a ceiling of one space per unit, which is four for this building and
  # the tightest cap in the corpus outside Portland. Row A.3.c of Table
  # 19.605.1 is "Quadplexes -- 1 space per dwelling unit", under the heading
  # "Maximum Allowed", and the row above it gives Multi-Unit Dwellings two per
  # unit while single detached dwellings get "No maximum." The cap is real and
  # it is aimed at exactly this housing type. A rear court drawn at the
  # generator's stall count would not be permitted here.
  parking_max_per_unit:
    value: 1
    cite: MMC 19.605.1, Table 19.605.1, row A.3.c Quadplexes
    url: https://ecode360.com/print/MI4969?guid=43862935
    retrieved: '2026-08-27'
    quote: "or/clackamas/milwaukie/19.600.parking.txt#L245-L246,L253"
  # The stall, from Section 19.607, "Off-Street Parking Standards for
  # Residential Areas". 19.607.1 names the building: "The provisions of
  # Subsection 19.607.1 apply to passenger vehicles and off-street parking
  # areas for single detached dwellings, duplexes, triplexes, quadplexes,
  # townhouses, cottage clusters, and residential homes in all zones." Its
  # subsection A is one sentence long -- "Off-street parking space dimensions
  # for parking spaces are 9 ft wide x 18 ft deep" -- and that is the whole of
  # what Milwaukie dimensions for a quadplex.
  parking_stall_width_ft:
    value: 9
    cite: MMC 19.607.1.A (Residential Driveways and Vehicle Parking Areas)
    url: https://ecode360.com/print/MI4969?guid=43862935
    retrieved: '2026-08-27'
    quote: "or/clackamas/milwaukie/19.600.parking.txt#L919,L925"
  parking_stall_depth_ft:
    value: 18
    cite: MMC 19.607.1.A (Residential Driveways and Vehicle Parking Areas)
    url: https://ecode360.com/print/MI4969?guid=43862935
    retrieved: '2026-08-27'
    quote: "or/clackamas/milwaukie/19.600.parking.txt#L919,L925"
  #
  # NOT ENCODED: the drive aisle, and the reason is a sentence that has to be
  # read before Table 19.606.1 is believed. Table 19.606.1 does state aisles
  # -- at 90 degrees, a 9 ft space 18 ft deep with a 22 ft aisle one-way or
  # two -- and it does not apply to this building. The purpose paragraph of
  # Section 19.606 carries the exclusion: "The requirements in Subsection
  # 19.606.4 apply to all types of development where a new quarter-acre
  # parking lot or larger is provided. All other standards apply to all types
  # of development where parking is provided, EXCEPT FOR MIDDLE HOUSING,
  # single detached dwellings, and adult foster/care homes." Table 19.605.1
  # files quadplexes under Middle Housing, so the whole of 19.606 -- the
  # dimensions table, the landscaping, the wheel stops, the paving, the
  # 19.606.1.D rule that a parking area over 5 spaces must have an aisle --
  # is off this building, and 19.607 is the entire standard.
  # (19.600.parking.txt#L459, L469-L475, L489)
  #
  # 19.607 dimensions no aisle. Its nearest sentence is 19.607.1.E.2:
  # "Properties that take access from streets other than local streets and
  # neighborhood routes shall provide a turnaround area on site that allows
  # vehicles to enter the right-of-Way in a forward motion." A turnaround with
  # no width, on the same unmeasured street classification as the parking
  # minimum above. So this layer holds a stall and no aisle -- Wilsonville's
  # shape a second time -- and that is not an aisle of zero. Anything drawing
  # a court in Milwaukie is drawing it against a number Milwaukie has not
  # published. (19.600.parking.txt#L1001)
  #
  # WHERE THE NUMBER WENT, 2026-08-31. This refusal stands -- the code states
  # no aisle and this layer holds none. What changed is downstream: quadfit's
  # site-plan generator now draws this city to an ASSUMED 24 ft aisle (ULI /
  # National Parking Association via Iowa SUDAS 8B-1 Table 8B-1.02, 90 degrees,
  # 85th-percentile design vehicle) rather than declining to draw it at all,
  # and grades those lots normally, green included -- ORS 197A.400 lets a city
  # apply only clear and objective standards to housing, and a width nobody
  # wrote down is not one, so there is nothing here for a court to fail
  # against. The lots stay filterable through `geometry_assumed`. The search
  # that
  # licensed the assumption ran through OAR 660-046-0220(2)(e)(E), which sends
  # middle housing to the single-family standards "in the same zone" -- and
  # 19.607.1's own scope sentence names "single detached dwellings, duplexes,
  # triplexes, quadplexes, townhouses, cottage clusters" together, so the
  # redirect lands back on the section already read.
  #
  # The distinction to keep: the corpus records what the code says, and says
  # nothing here. The generator records what it had to draw with. Neither
  # borrows from the other.
  #
  # WHERE THE PARKING MAY SIT, transcribed 2026-08-27 as the sixth
  # jurisdiction with nowhere to put it and encoded the same day once the
  # registry grew the field family. Two sets of rules, and which one applies
  # is the `unit_lots` lever.
  #
  # 19.607.1.D, Parking Area Limitations: "Uncovered parking spaces and
  # maneuvering areas cannot exceed 50% of the front yard area." An AREA
  # share, which is Portland's shape and not the share-of-frontage every other
  # city in this corpus states, and it is the reason those are two fields.
  # The same subsection caps the street side yard at 30 percent -- a
  # street-side standard this screen holds no field for.
  parking_front_yard_max_pct:
    value: 50
    cite: MMC 19.607.1.D, uncovered parking spaces and maneuvering areas as a share of the front yard area
    url: https://ecode360.com/print/MI4969?guid=43862935
    retrieved: '2026-08-27'
    quote: "or/clackamas/milwaukie/19.600.parking.txt#L931,L975"
  # 19.505.3.D.4.a, and it is a flat prohibition rather than a cap:
  # "On-site surface parking areas, garages, and vehicle maneuvering areas
  # shall not be located directly between the facade of a primary building(s)
  # and an abutting street right-of-way." It reaches this pod because
  # 19.505.3.B applies Table 19.505.3.D "to all multi-unit developments and
  # residential care facilities with 3 or more dwelling units on a single
  # lot", and it stops reaching it on unit lots because the same sentence
  # continues "Cottage cluster housing and rowhouses on their own lots are
  # subject to separate standards and are therefore exempt from Subsection
  # 19.505.3."
  #
  # Milwaukie therefore says both things at once and they do not contradict:
  # 19.607.1.D allows uncovered parking across half the front yard, and
  # 19.505.3.D.4.a keeps it out of the strip directly in front of the
  # building. A drive down one side to a rear court satisfies both. A
  # front-yard court in line with the facade satisfies neither.
  parking_front_prohibited:
    value: true
    unless: [unit_lots]
    cite: MMC 19.505.3.D.4.a, surface parking, garages and maneuvering areas not directly between a primary building facade and an abutting street; applicability at 19.505.3.B
    url: https://ecode360.com/print/MI4969?guid=43861924
    retrieved: '2026-08-27'
    quote: "or/clackamas/milwaukie/19.500.supplementary.txt#L1379,L1485"
  # 19.505.5.F, on four unit lots, and it is tighter than anything above.
  # Front-facade garages, front-yard parking and driveways in front of a
  # townhouse are prohibited outright UNLESS all four of: "development of 4
  # townhouses has 2 shared accesses"; outdoor on-site parking and maneuvering
  # areas no wider than 10 ft on any lot; garage width no more than 12 ft; and
  # shared accesses at least 24 ft apart. Ten feet around a nine-foot stall is
  # a single-file driveway, and it is the tightest figure in the corpus --
  # Gresham, Fairview, Wilsonville and Oregon City all say twelve. Fail any of
  # them and 19.505.5.F.2 applies instead: parking accessed on the back facade
  # or in the rear yard, a corner-lot development taking a single driveway on
  # the side street, a non-corner one consolidating into one driveway that may
  # not run between any townhouse's front facade and its front lot line.
  #
  # On one lot 19.607.1.D caps a share of an area and states no width, so
  # there is nothing for this field to hold there.
  parking_maneuvering_max_width_ft:
    exempt: true
    cite: MMC 19.607.1.D, which caps a share of the front yard area and states no maneuvering-area width
    url: https://ecode360.com/print/MI4969?guid=43862935
    retrieved: '2026-08-27'
    quote: "or/clackamas/milwaukie/19.600.parking.txt#L931,L975"
    variants:
      - value: 10
        when: [unit_lots]
        cite: MMC 19.505.5.F.1, outdoor on-site parking and maneuvering areas on a townhouse lot
        quote: "or/clackamas/milwaukie/19.500.supplementary.txt#L2288-L2330"
  # Table 19.505.3.D.1, Private Open Space, objective standard: "For each
  # dwelling unit located on the ground floor, or within 5 ft of finished
  # grade, a minimum of 96 sq ft of private open space, with a minimum
  # dimension of 5 ft." Every unit of a two-storey attached fourplex is a
  # ground-floor unit, so the pod owes four of them -- 384 square feet, the
  # largest open space requirement in this corpus after Gresham's percentage.
  # The upper-floor figure of 48 sq ft is not used because no unit here is
  # more than five feet above grade.
  #
  # Applicability and the exemption on unit lots are 19.505.3.B, quoted with
  # the standard above.
  #
  # NOT ENCODED, from the row below it: the common open space of Table
  # 19.505.3.D.2, "For buildings with more than 5 dwelling units, a minimum of
  # 10% of the gross site area, or 750 sq ft, whichever is greater". Four
  # units is not more than five.
  open_space_min_sqft:
    per_dwelling: 96
    unless: [unit_lots]
    cite: MMC Table 19.505.3.D.1, private open space per ground-floor dwelling unit; applicability at 19.505.3.B
    url: https://ecode360.com/print/MI4969?guid=43861924
    retrieved: '2026-08-27'
    quote: "or/clackamas/milwaukie/19.500.supplementary.txt#L1379,L1458-L1462"
  #
  # NOT ENCODED: 19.505.3.D.4.b, "Parking located to the side of a dwelling
  # structure shall be limited to 50% of the linear frontage of that side."
  # The 50 percent every other city in this corpus states is measured along
  # the STREET frontage; this one is measured along the side of the building,
  # which is a different denominator and would be a different rule in the same
  # field. D.4.c, garages in the same structure as the dwellings set at least
  # 4 ft behind the front facade, needs a garage this design does not have.
  # (or/clackamas/milwaukie/19.500.supplementary.txt#L1486-L1487)
  #
  # 19.607.1.E.1 holds the driveway to the width of the approved approach
  # within 5 ft of the right-of-way, or a 1:1 widening to the 10-ft point
  # starting 2 ft behind it. It is a rule about the SHAPE of a driveway whose
  # width is fixed somewhere else.
  #
  # CORRECTED 2026-09-04. This note used to end: "Milwaukie states that width
  # nowhere in this chapter -- 'the approved approach' is a public works
  # decision, not a code dimension. So Milwaukie has no encodable driveway
  # approach width, which is why the field is absent rather than exempt."
  #
  # The first half is right and the conclusion does not follow from it. The
  # width is not in this chapter; it is in Chapter 12.16, Access Management,
  # which is a Title 12 chapter and was not in the store. Three sentences in
  # Title 19 point at it by name, one of them in the parking chapter itself
  # (19.600.parking.txt#L656), and the crossref ledger had been reporting it
  # as BINDING beside "max. maneuvering-area width" the whole time. "Nowhere
  # in this chapter" was true; "nowhere in Milwaukie" is what the note went on
  # to claim, and nobody had looked. Same shape as Portland's aisle, where
  # 33.266.120 states a stall and no aisle and 33.266.120.B.1 routes parking
  # in a tract to 33.266.130, which states one: the sentence that answers the
  # question is one cross-reference out of the section being read. What is new
  # here is that the cross-reference leaves the zoning title altogether, so
  # grepping every document held for this city would still have missed it.
  #
  # 12.16.040.E.3 states it as a use-class row, and plex development is named:
  #
  #   "Plex development, cottage cluster developments with up to four (4)
  #    units, or townhouse developments comprised of up to four (4) units,
  #    must have a minimum driveway apron width of twelve (12) feet on local
  #    or neighborhood streets and sixteen (16) feet on collector or arterial
  #    streets, and a maximum driveway apron width of twenty (20) feet on all
  #    streets."
  #
  # The 16 is the base and the 12 is the variant, for the same reason the
  # parking minimum above takes arterial as its base: street classification is
  # not measured for any parcel in this corpus, and of the two figures the
  # wider minimum is the one that cannot turn a RED lot green by mistake.
  driveway_approach_min_width_ft:
    value: 16
    cite: MMC 12.16.040.E.3, minimum driveway apron width for plex development on collector or arterial streets
    url: https://ecode360.com/print/MI4969?guid=43857228
    retrieved: '2026-09-04'
    quote: "or/clackamas/milwaukie/12.16.access-management.txt#L260"
    variants:
      - value: 12
        when: [local_street]
        cite: MMC 12.16.040.E.3, minimum driveway apron width for plex development on local or neighborhood streets
        quote: "or/clackamas/milwaukie/12.16.access-management.txt#L260"
  # Twenty feet on all streets, so no variant. It is the tightest approach
  # ceiling in this corpus -- Oregon City allows 36 for the same building and
  # West Linn 36 -- and it is a ceiling on the curb cut only: 19.607.1.E.1
  # lets the drive widen at 1:1 once it is 2 ft inside the line, which is what
  # makes a 24 ft on-site aisle compatible with a 20 ft apron.
  driveway_approach_max_width_ft:
    value: 20
    cite: MMC 12.16.040.E.3, maximum driveway apron width for plex development, all streets
    url: https://ecode360.com/print/MI4969?guid=43857228
    retrieved: '2026-09-04'
    quote: "or/clackamas/milwaukie/12.16.access-management.txt#L260"
  #
  # NOT ENCODED: 12.16.040.B.4, "The nearest edge of the driveway apron must
  # be at least five (5) feet from the side property line in residential
  # districts." This is a real constraint on this design and there is no field
  # that can hold it: it sets a clearance between a driveway and a lot line,
  # and every driveway field in the registry is a width. A pod that runs its
  # drive up the side of the lot loses 5 ft of it to a rule nothing in the
  # screen is measuring. Recorded here rather than encoded, and it needs a
  # field before it can bind.
  # (or/clackamas/milwaukie/12.16.access-management.txt#L138)
  #
  # NOT ENCODED: 12.16.040.B.5.a, 45 ft from the nearest intersecting face of
  # curb to the nearest edge of the apron, quadplexes named explicitly. It
  # cannot fail a lot, because the same sentence ends "Where the distance
  # cannot be met on existing lots, the driveway apron must be located as far
  # from the nearest intersection street face of curb as practicable; in such
  # cases a formal modification is not required." A standard whose own text
  # excuses every existing lot from meeting it is not a standard this screen
  # can fail anybody on.
  # (or/clackamas/milwaukie/12.16.access-management.txt#L148)
  #
  # NOT ENCODED: 12.16.040.B.1, accessway spacing of 600 ft on arterials and
  # 300 ft on collectors, and 12.16.040.C.3, one accessway per plex property.
  # The spacing figures are selected by a street classification this corpus
  # does not hold -- West Linn's CDC 48.060(C) is refused on the same ground
  # -- and the one-accessway rule costs a four-unit pod nothing, since it
  # needs one.
  # (or/clackamas/milwaukie/12.16.access-management.txt#L116,L120,L182)
  #
  # NOT ENCODED: the clear vision area, MMC 12.24.030 and 12.24.040. It bans
  # any structure over 3 ft in a triangle at every driveway and every corner,
  # it cannot be varied ("The provisions of this chapter relate to safety.
  # They shall not be modified by variance and are not subject to appeal"),
  # and it never says how big the triangle is: 12.24.040.A defers to "the most
  # recent edition of the 'AASHTO Policy on Geometric Design of Highways and
  # Streets'". A rule with no number in it is not a rule this screen can
  # apply, and the number is in a manual, behind a per-intersection design
  # speed nothing here measures. Every corner lot in Milwaukie loses some
  # unknown wedge to this, and the honest form of that is a refusal rather
  # than a guess at a triangle.
  # (or/clackamas/milwaukie/12.24.clear-vision.txt#L48,L52,L60,L70)
  #
  # NOT ENCODED: 12.16.040.D.3, "Accessways must be designed to contain all
  # vehicle backing movements on the site, except for detached or attached
  # single detached residential uses on local streets and neighborhood
  # routes." A quadplex is not a single detached use, so the exception does
  # not reach it and the pod must turn around on its own lot. That is a
  # layout requirement, not a dimension, and it is the reason the assumed
  # aisle matters here: it is the thing the aisle is for, stated by the city.
  # (or/clackamas/milwaukie/12.16.access-management.txt#L242)
  #
  # 19.607.1.B forbids any part of a space in a right-of-way, access easement
  # or over a public sidewalk; 19.607.1.C requires a durable, dust-free,
  # all-weather surface in a required front, street-side or side yard.
  # (or/clackamas/milwaukie/19.600.parking.txt#L931-L999)
  #
  # NOT ENCODED: the front-yard SPACE COUNT of 19.607.1.D -- "No more than 3
  # residential parking spaces are allowed within the required front yard...
  # Quadplexes are permitted a fourth parking space within the required front
  # yard." The code counts them by fitting non-overlapping 9 x 18 rectangles
  # inside the required front yard, which is a measurement no field holds, and
  # it is moot anyway wherever 19.505.3.D.4.a keeps parking out of the strip
  # in front of the building. (or/clackamas/milwaukie/19.600.parking.txt#L931-L999)

zones:
