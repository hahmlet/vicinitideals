      sq ft, 3,000-4,999, 5,000-6,999, and 7,000 and up. The base value here is the last column and the
      variants are the other three, so a lot FLATS has not measured comes back ambiguous rather than
      taking the standards written for the largest lots. min_lot_sqft 3,000 is read off the Permitted
      Dwelling Type row, not a stated minimum: the 1,500-2,999 column permits townhouses only, and a
      quadplex first appears in the 3,000-4,999 column. Minimum lot depth (70 ft, then 80) has no field.
