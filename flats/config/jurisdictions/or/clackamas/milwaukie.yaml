      value: 35
      quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L224"
    max_density_du_per_acre:
      # Table 19.301.4 row "b. Maximum" reads 25 / 8.7 / 8.7 / 6.2 across the
      # four lot-size bands, and note 4 does two things to it: it exempts
      # duplexes, triplexes, quadplexes and cottage clusters outright, and it
      # holds townhouses to four times the single-detached figure or 25 du per
      # acre, whichever is less. Exempt at the base is the pod on one lot; the
      # variants are the same building split onto four.
