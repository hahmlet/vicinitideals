      feet of the property, the 0-to-100 and 101-to-150 foot bands, whether the site is within 300
      feet of a river or surface stream, and which combination makes a band HCA or not HCA. Every
      number is part of drawing a boundary on the ground. That boundary is exactly what the
      natural-resource overlay layer holds for this county -- the screening that did not exist for
      Clackamas at all until 2026-09-03 -- and this jurisdiction file holds the zoning dimensions
      that stand beside it. Two systems, one authority, and the split is deliberate: a corridor is
      measured from a feature the parcel data locates, never from a lot line, so it carves
      buildable area rather than becoming a Value. The verification options in the same subsection
      are how an applicant argues the map is wrong, which is a hearing rather than a standard.
