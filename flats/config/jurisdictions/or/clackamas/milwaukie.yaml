      # height plane slopes up at a specified angle until it reaches the
      # maximum allowed building height" -- MMC 19.200, Definitions, "Side
      # yard height plane", at 19.200.definitions.txt#L813-L814. The plane
      # starts at the required yard, not at the lot line, which is the
      # difference between 11 ft and 6.
