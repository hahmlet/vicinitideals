  "19.500.supplementary.txt#19.505.4":
    queue: missed
    outcome: not_here
    note: >-
      Cottage Cluster Housing, and the whole of 19.505.4 is written for a housing type this screen
      does not place. Milwaukie says what one is: a minimum of 3 and a maximum of 12 cottages
      round a common courtyard at least 15 ft wide at its narrowest, each cottage under a 900 sq
      ft footprint and the cluster averaging no more than 1,400 sq ft a unit, with 6 ft of
      separation between detached units. Four attached units on one lot is none of that. The card
      is the longest in this layer because the section is a complete parallel dimensional regime
      -- 25 feet or two storeys of height, 15 feet within five to ten feet of a rear lot line, six
      feet between structures, five foot side and rear setbacks, a ten foot minimum and twenty
      foot maximum front setback, ten feet between clusters, sixty and sixty-five percent
      impervious caps -- and every number of it is switched on by the housing type rather than by
      the zone. The table's own zone tables say so from the other side: 19.302.4 opens with "the
      standards in Subsection 19.302.4 are not applicable to cottage cluster development". The
      parking geometry in the same section is worth one note in passing, since it is the only
      place in Milwaukie's code that says where stalls may not go -- not within 20 ft of a street
      property line except an alley, not within 10 ft of any other property line with driveways
      and drive aisles expressly permitted there, parking clusters separated from everything else
      by 4 ft of landscaping, garages capped at four spaces and 10 ft from a cottage, garage doors
      no wider than 20 ft. All of it is cottage-cluster-only, and this project has already ruled
      the pod carries no garage.
