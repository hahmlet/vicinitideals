    notes: 'Table 19.301.4 is one zone in four columns, split by how big the lot already is: 1,500-2,999
      sq ft, 3,000-4,999, 5,000-6,999, and 7,000 and up. The base value here is the last column and the
      variants are the other three, so a lot FLATS has not measured comes back ambiguous rather than
      taking the standards written for the largest lots. min_lot_sqft 3,000 is read off the Permitted
      Dwelling Type row, not a stated minimum: the 1,500-2,999 column permits townhouses only, and a
      quadplex first appears in the 3,000-4,999 column. UNENCODED: side yards are asymmetric above 7,000
      sq ft — one side 5 ft and the other 10 — and a single setback_side_ft cannot say that, so 5 is
      encoded and a pod sized against it consumes 5 ft less width than the code allows on a large lot.
      Minimum lot depth (70 ft, then 80) has no field. quadplex_allowed is by-right: middle housing is
      permitted on any lot meeting its column.'
