label: Troutdale
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  NSA is read and deliberately not encoded. TDC 3.050 says Multnomah County holds zoning authority over
  certain lots inside incorporated Troutdale that fall within the Columbia River Gorge National Scenic
  Area, and that those lots keep their COUNTY zoning district designation under Chapters 38 and 39 of
  the Multnomah County Code. The 74 lots the GIS labels NSA are therefore not governed by a Troutdale
  district at all, and writing one here would invent a rule the city does not claim to make. They stay
  in the coverage ledger as unencoded, which is the true answer, until the county Gorge chapters are in
  this corpus.


  The Troutdale zoning layer also reports one lot as UPAR-10, which is a Multnomah County label rather
  than a city district and appears nowhere in the Development Code. Left alone for the same reason.'
ingest:
  geoid: null
  juris_city_codes:
  - TROUTDALE
  zoning_layer: zoning_troutdale
  zone_field: zonecode
  strip_lowercase_suffix: false
readings:
  "8.development-standards.txt#8":
    queue: missed
    outcome: not_here
    note: >-
      Two unrelated fragments that share a card only because the nearest heading above them is the
      chapter number. The first is the six-foot screening wall for garbage and recycling
      enclosures, which regulates a screen and not a building. The rest, from line 1313 to 1353,
      is the manufactured home park section: four-foot pathways, twenty-four foot interior street
      pavement, cul-de-sacs serving no more than eighteen manufactured home sites with a
      forty-foot turning radius, resident parking within a hundred feet of the dwelling it serves,
      and a six-foot sight-obscuring fence round recreational vehicle storage. A manufactured home
      park is a different development type with its own internal street network, and none of its
      geometry is a standard the pod's lot has to clear.
    fingerprint: 367b6c59dff4a1ac

  "8.development-standards.txt#8.140":
    queue: missed
    outcome: not_here
    note: >-
      Troutdale's cottage cluster section, complete and self-contained: 1,400 square feet maximum
      average floor area, zero parking spaces per unit under a thousand square feet and one over,
      cottages within ten feet of the common courtyard, a courtyard fifteen feet wide at its
      narrowest, four-foot pedestrian paths, parking clusters of no more than eight contiguous
      spaces separated by four feet of landscaping, no parking within twenty feet of a street
      property line or ten feet of any other, three-foot screening between parking and courtyards,
      attached garages to two hundred square feet exempt from the footprint calculation, detached
      garages capped at four hundred, garage doors at twenty feet. Every number is switched on by
      the cottage cluster type. The parking location rules read as though they could travel --
      twenty feet from a street line is a real constraint -- but they are written inside the
      cottage cluster standards and Troutdale states its own general parking setbacks elsewhere.
      This project has also already ruled that the pod carries no garage.
    fingerprint: e04f88d0e9121a54
  "3.zoning-districts.txt#3.430":
    queue: missed
    outcome: not_here
    note: >-
      Section 3.430 is "Dimensional Standards for Industrial Zoning Districts" and its three
      columns are IP, LI and GI. All three refuse a quadplex, so the whole table is inert here: a
      hundred and fifty foot minimum lot width in IP and none in the other two, twenty-foot front
      yards throughout, fifteen and ten foot side and street side yards in IP and LI and none in
      GI, ten-foot rear in IP, and heights of thirty-five and forty-five feet with GI sent to
      3.430.B.2. The card routed as a missed standard because six of our fields matched at once,
      which is what an industrial dimensional table looks like from the outside.
    fingerprint: 9398cb1c8ded806a
  "9.parking.txt#9.010":
    queue: missed
    outcome: not_here
    note: >-
      The residential rows of Table 1 are already encoded and banded by lot size -- one space
      total under 3,000 square feet, two under 5,000, three between 5,000 and 6,999, four per
      quadplex at 7,000 and above -- so what is left uncited is the rest of the table and the
      off-site allowance. The uncited residential rows are the cottage cluster and multi-family
      lines, neither of which is this building. Everything from line 116 down is non-residential:
      retail per thousand square feet, kiosks, medical and dental, drive-through banks, service
      stations per thousand square feet of gross lot area, bowling alleys per lane, benches by the
      foot, schools by student and staff, hospitals by bed. The two remaining statements are
      relaxations -- required parking may sit off-site within two thousand feet, and disabled
      parking within two hundred feet of an accessible entrance -- both of which let a site do
      less on its own land than the strict reading assumes.
    fingerprint: 290c90a04bcd637d
  "9.parking.txt#9.115":
    queue: missed
    outcome: not_here
    note: >-
      The alternatives in Troutdale's parking geometry, none of which this screen takes. The
      standard stall of nine by eighteen is already held, and so is the twenty-five foot aisle at
      ninety degrees, in both directions. What is uncited is the compact space at eight by sixteen
      with up to thirty-five percent of required spaces allowed to use it, the twenty-two foot
      parallel space, and the aisle widths for angled layouts -- twenty feet at sixty degrees,
      twenty at forty-five, twelve for parallel on one side, sixteen on both. Each is an option a
      designer may choose, and each would let the court fit on a narrower strip than the
      ninety-degree standard layout needs. Taking the strict branch is deliberate: the pod's court
      is drawn square, and a lot that passes at twenty-five feet of aisle passes at twenty.
    fingerprint: 2b6bbaf24e5dc7fe
  "8.development-standards.txt#8.060":
    queue: missed
    outcome: not_here
    note: >-
      Landscaping specification, and the one line with a threshold excludes us by a unit.
      Recreation areas at two hundred square feet per dwelling are required "for development
      containing more than five (5) dwelling units" and the pod has four. The rest is nursery
      stock: trees with a mature crown spread over fifteen feet and five feet of clear wood, seven
      feet tall or an inch and a half in caliper at planting, shrubs a gallon in size or two feet
      high. These describe the plants, not the land they stand on.
    fingerprint: 40eb34dbbd44913c
  "8.development-standards.txt#8.170":
    queue: missed
    outcome: not_here
    note: >-
      Accessory dwelling unit size: no more than eight hundred square feet or half the primary
      dwelling's floor area, whichever is smaller, except that an interior conversion of a whole
      floor may exceed it. An ADU is a second, subordinate dwelling on a lot with a house on it,
      and the pod is four primary units built at once.
    fingerprint: f955be60cf492fb1
  "8.development-standards.txt#8.230":
    queue: missed
    outcome: encode
    note: >-
      A MINIMUM BUILDING HEIGHT, in a district that permits our building, and no field in the
      registry can hold it. Section 8.230 is "Standards in the MU-3 (Urban Mixed-Use) Zoning
      District" and its subsection A reads "Middle housing dwelling units shall have a minimum
      building height of twenty-five (25) feet." This file holds MU-3 at quadplex_allowed true, so
      the standard reaches. The pod is about twenty-six feet over two storeys and therefore clears
      it, which is why this is ordered work rather than an alarm, and MU-3 is three lots in
      Troutdale. The reason to keep the card open is that the gap is not local: unincorporated
      Clackamas states twenty feet to the top of parapet in ZDO 1005, Milwaukie twenty-five feet
      along all street frontages for a depth of at least twenty-five, Oregon City twenty-five feet
      or two storeys in several districts and "two entire stories" in another, Wood Village
      eighteen feet in NC, and Gresham and Wilsonville each state one in their corridor and
      town-centre tables. A minimum height can only refuse -- it is the one direction where an
      unheld standard produces a false GREEN on a single-storey design -- so the field is worth
      adding before the next city is encoded, not after. Subsection D of the same section, office
      uses of fifteen thousand square feet or less being required to sit in a multi-storey
      structure, is not ours.
    fingerprint: bb54a8e0ee45b453
  "8.development-standards.txt#8.130":
    queue: condition
    outcome: never
    note: >-
      A requirement that a primary entrance be located within eight feet of the street-facing
      facade or its equivalent. It is a design standard about where a door goes on a wall,
      conditioned on the wall's orientation, and it constrains neither the footprint, the height,
      the setbacks nor the parking. A factory-built pod's entrance placement is a matter for the
      elevation drawing and cannot make a lot too small. Nothing measurable about the lot changes.
    fingerprint: 67e870aede8bfe93
  "3.zoning-districts.txt#3.130":
    queue: condition
    outcome: never
    note: >-
      Subsection E of Troutdale's High Density Residential standards, which states its own scope:
      it governs multi-family development of five or more dwelling units. Four units is below the
      threshold in the city's own words, so the subsection's height and street-side setback
      figures do not reach this building. The district itself is in any case encoded with
      quadplex_allowed false. Two independent closures, and the first of them -- the unit-count
      threshold written into the subsection -- is the one that would still hold if the use table
      changed.
    fingerprint: e0003de0d40ecdff
  "3.zoning-districts.txt#3":
    queue: condition
    outcome: never
    note: >-
      Twelve statements out of Troutdale's district chapter, and the two that matter are the table
      notes under the triplex and quadplex table -- front yard setback 20 feet if driveway access
      is taken from the front yard, street side yard 20 feet if taken from the street side. This
      pod parks off a driveway at the front, so if those notes reached our zones they would double
      the front setback on every Troutdale lot, and that is the kind of finding this queue exists
      for. They do not reach them, and the reason is which cells carry the marker. Read across the
      table row by row: LDR-1, LDR-2 and MDR all print a flat "10" for the triplex and quadplex
      front yard with no note reference. Only the MDR (TC) and HDR (TC) columns print "10 or 20
      see note 1", and the street-side note 2 appears only in HDR (TC). Neither Town Center column
      is a mapped zone in the parcel data -- Troutdale's zones there are LDR-1, LDR-2, MDR, HDR,
      MU-1, MU-2, MU-3, CC, GC, IP, LI, GI, OS and NSA -- so no lot this screen touches is
      measured against a cell those notes govern. If a Town Center zone is ever added, this ruling
      is the note to read first. The rest of the card is elsewhere: the duplex rear-yard notes
      above our table, the townhouse table's front yard, a 5,400 square foot minimum for "all
      other uses", and, at the far end of the file, the 50-foot buffer and the floor-area caps of
      Section 3.430, which is the industrial districts -- IP, LI and GI, all of which prohibit
      this dwelling.
    fingerprint: 39fa3b6dad7d853e
  "1.020.definitions.txt#1.020":
    queue: nofield
    outcome: other_building
    note: >-
      Seven lines of Troutdale's definitions, and each number is inside a definition of something
      the pod is not. A six-foot measuring distance for a building's adjacent grade; a 90-degree
      sight test for a screen of living plants; a basement defined as a floor 4 feet or more below
      adjacent grade; a temporary stand of up to 100 square feet; the story test (a floor more
      than 12 feet above grade at any point, or more than 6 feet over half the perimeter, or
      opposite walls not more than 2 feet above the floor); and a windscreen, "a fence-like
      structure, not to exceed six (6) feet in height, on the north or east side of" something.
      The story definition is worth one sentence because it is the same rule Portland's 33.930 and
      the county's MCC 39.2000 state and it reaches nothing here: no height this layer holds is
      expressed in storeys, so a definition that decides when a space counts as one has no number
      to change. The windscreen is a fence.
    fingerprint: 58c12280c11d116a
  "1.020.definitions.txt#1.030":
    queue: nofield
    outcome: other_building
    note: >-
      "Above the airport elevation), and upward extending to a height of three hundred fifty (350)
      feet above" -- part of Troutdale's definition of an airport imaginary surface, the cone of
      protected airspace around Troutdale Airport. Three hundred and fifty feet is thirteen times
      the pod's height and the surface it describes rises away from the runway, so no two-storey
      building anywhere in the city can reach it. Recorded rather than skipped because an airport
      overlay is exactly the kind of thing that WOULD bind if it were a height cap, and it is not
      one -- it is a floor beneath which nothing is affected.
    fingerprint: fa619ce2fb541295
  "1.020.definitions.txt#1.040":
    queue: nofield
    outcome: other_building
    note: >-
      Three more definitional numbers: a basement whose interior grade is not more than 2 feet
      below the lowest adjacent exterior grade, a 4-foot ceiling on something at any point, and
      "four hundred (400) square feet or less when measured at the largest horizontal projection",
      which is Troutdale's accessory-structure test and the same sentence Gresham's 3.0120 states.
      Definitions of a basement and a shed. Neither is the building this screen places, and
      neither changes a number this layer holds.
    fingerprint: ca52ac0ebf23b77d
  "3.zoning-districts.txt#3.235":
    queue: nofield
    outcome: other_building
    note: >-
      A SETBACK-FOR-HEIGHT TRADE, and it is worth reading properly because it is the shape that
      has bound this pod elsewhere. "Reduced by as much as five (5) feet", and then "for each one
      (1) foot reduction in the minimum setback, the building height ceiling shall be reduced by
      two (2) feet. Thus, a building that is set back the maximum five (5) feet closer to the
      common property line has a building height ceiling that is ten (10) feet lower than the
      maximum." That is a RELAXATION with a price: the applicant may buy up to 5 feet of setback
      and pays 2 feet of height per foot bought. The conservative default declines relief, which
      leaves the base setback and the base height, both encoded from this district's table -- so
      the trade changes nothing the screen tests. It is also a menu rather than a requirement:
      nobody has to take it, and a screen that assumed the trade would report a pod fitting on a
      lot whose owner never applied for it. The pod's 26 feet against a 35-foot ceiling would in
      fact leave room to buy about 4 feet of setback, which is worth knowing if the fit stage is
      ever given permission to trade -- but that is a design decision for a person, not a value
      for a layer.
    fingerprint: 7d10c3424721a981
  "3.zoning-districts.txt#3.325":
    queue: nofield
    outcome: other_building
    note: >-
      "Shall not be located within three hundred (300) feet of a residentially zoned property" --
      a separation requirement on a use in one of Troutdale's non-residential districts. A buffer
      measured from OUR kind of land outward, protecting houses from something else; the pod is
      the residential use being protected, not the use being kept away. Nothing here dimensions a
      dwelling.
    fingerprint: 92482b03b0780c12
  "3.zoning-districts.txt#3.330":
    queue: nofield
    outcome: other_building
    note: >-
      "Trict, but in no case shall be less than fifteen (15) feet" -- the tail of a sentence
      setting a floor on a setback that otherwise matches an adjoining district's standard. A
      setback-matching rule of this kind lives in the non-residential districts, where a building
      next to residential land inherits the neighbour's yard; the pod is on the residential side
      of that line. The line as captured is also a fragment with its own subject cut off at
      "trict", so the district it names cannot be read from it.
    fingerprint: bd6a37cdc09d8b78
  "3.zoning-districts.txt#3.440":
    queue: nofield
    outcome: other_building
    note: >-
      Retail and service floorplates capped at 5,000 square feet with a 20,000-square-foot limb,
      and two marijuana separation distances at 1,000 feet from an existing facility and from an
      existing processor. Commercial use rationing and a state-mandated buffer between cannabis
      businesses. Neither reaches a dwelling.
    fingerprint: 68694676f20e30cb
  "8.development-standards.txt#8.040":
    queue: nofield
    outcome: design
    note: >-
      Transit-oriented design: a building within 30 feet of a transit street must have an entrance
      for pedestrians, and where a stop lies within 500 feet of the building entrance the building
      must be set back no more than some distance. A door rule and a maximum front setback, both
      gated on proximity to transit -- and whether a lot is near a transit street is on this
      project's standing list of site facts nothing measures, which is the same reason Portland's
      Table 120-4 maximum front setback is a recorded refusal in all six RM zones. A maximum front
      setback is the shape that HAS bound this pod, in Portland's commercial zones, so this is
      filed with its teeth described rather than waved past.
    fingerprint: 740faf32e7fa2af6
  "8.development-standards.txt#8.120":
    queue: nofield
    outcome: design
    note: >-
      Eighteen lines of Troutdale's residential design standards and they divide three ways, all
      of them design. THE ENTRANCE FAMILY: within 8 feet of the longest street-facing wall, or at
      up to 45 degrees from the street, with a porch of at least 25 square feet -- word for word
      Portland's 33.110.230 and 33.120.231, ruled the same way three times in this pass. THE
      FACADE MENU: a roof dormer at least 4 feet wide, a balcony at least 2 by 4, a bay window
      projecting at least 2 feet, a facade offset of at least 2 feet, an entryway recessed at
      least 3, a covered entryway at least 4 deep -- six items, and the code asks for some of
      them, which is the design-menu false positive by its clearest tell. THE DRIVEWAY LIMB: two
      approaches not exceeding 32 feet in total width, or one approach of at most 16 feet, both of
      them MAXIMA on a way in rather than minima. Two lines want naming separately. A minimum lot
      size band, "in zones with a minimum lot size between 5,000 and 6,999 square feet" and "7,000
      square feet or more", is the gate on a standard rather than a standard, and the lot sizes it
      gates on are already encoded from the district table. And "each townhouse lot has a street
      frontage of at least fifteen (15) feet on a local" street is a TOWNHOUSE lot standard
      reached at land division -- a different building on a different plat.
    fingerprint: 43d816eadd114914
  "8.development-standards.txt#8.150":
    queue: nofield
    outcome: design
    note: >-
      Fourteen lines of multi-family design standards, and the reason this card is design rather
      than a gap is that every number describes the shape of a wall, a roof or a private balcony.
      Buildings at least 15 feet from one another; no wall longer than 50 feet without a
      foundation offset of at least 4 feet for at least 16 feet; roofline offsets at intervals of
      40 feet or less with at least a 4-foot variation; garages set back at least 5 feet behind
      the front door or detached and at least 50 feet from the front line; a porch at least 5 feet
      deep that may encroach 5 feet into the front setback. TWO OF THEM DESERVE A SECOND LOOK AND
      BOTH SURVIVE IT. The 15-foot separation between buildings is a rule about two structures on
      one site; the pod is one 56-foot structure, so nothing separates from anything. And the
      60-square-foot private outdoor area required for each unit, stated twice on this card (once
      as ground-level area with a 6-foot sight-obscuring screen, once as a balcony), is a PER-UNIT
      amount at 240 square feet for four units -- which is smaller than the open space this layer
      would carry anyway and is satisfiable on balconies, so it takes no ground. The garage limbs
      are closed by the standing ruling that the pod has no garage. The last line, accessory
      structures over 10 feet high complying with the district setbacks, is a shed.
    fingerprint: f534e77e22045ad8
  "8.development-standards.txt#8.160":
    queue: nofield
    outcome: other_building
    note: >-
      Twelve lines of MANUFACTURED HOME PARK standards -- a 100-foot minimum park street frontage,
      a 150-foot minimum park depth, a 20-foot perimeter setback and buffer, a 3-foot berm or a
      6-foot masonry wall to screen the park, front and rear yards of 10 and 20 feet inside it, 15
      feet between dwellings, fire hydrants within 500 feet, and a 100-square-foot accessory
      storage building per space. A manufactured home park is a single site rented in spaces, and
      its dimensions belong to the park rather than to any lot in it. This project places one
      attached four-unit structure on one existing parcel; the two share no geometry. The 15-foot
      separation between dwellings is the only number that could have been borrowed sideways and
      it cannot -- it separates two manufactured homes on adjacent rented spaces, not two walls of
      one building.
    fingerprint: e82156d99e436536
  "8.development-standards.txt#8.165":
    queue: nofield
    outcome: design
    note: >-
      "Than a nominal three (3) feet in height for each twelve (12) feet in width" -- part of
      Troutdale's standard on wall articulation or on a retaining wall's stepping, expressed as a
      ratio of height to width. A ratio of this kind shapes an elevation rather than reserving
      ground, and it is stated as a nominal rather than an absolute, which is the code conceding
      it is a look rather than a limit.
    fingerprint: 038012beeef96b93
  "8.development-standards.txt#8.180":
    queue: nofield
    outcome: design
    note: >-
      "General storage area spaces at a minimum of ten (10) square feet within each unit" --
      interior storage, INSIDE the dwelling. It is the same requirement West Linn states for
      senior and handicapped housing at the same 10 square feet, and it takes no land at all: it
      is a closet. A screen that measures whether a building fits on a lot cannot see inside the
      building, and a minimum on a room does not change the footprint.
    fingerprint: eb4a31da626c1d0b
  "8.development-standards.txt#8.510":
    queue: nofield
    outcome: other_stage
    note: >-
      Four lines of frontage improvements on one named street: a 9-foot sidewalk on 257th Avenue,
      a 5-foot landscape strip beside it, trees separated by at least 15 feet exempt from a height
      standard, and street trees every 40 feet with the developer responsible for them.
      Right-of-way improvements on a specific arterial, delivered at the permit stage as a
      condition on the frontage rather than as a standard on the building. The sidewalk and the
      strip are outside the lot line; the trees are the city's.
    fingerprint: dda1705e17cd3b4a
  "9.parking.txt#9.040":
    queue: nofield
    outcome: other_building
    note: >-
      "Hundred (100) square feet of transit amenity space provided above and beyond the minimum"
      -- a parking reduction bought by building a transit amenity. A bonus, and an earned one: the
      developer gives a shelter or a plaza and takes stalls off the requirement. The conservative
      default declines relief throughout this corpus, and this one is gated on being near transit,
      which is a site fact nothing here measures.
    fingerprint: 125fe735a94add66
  "9.parking.txt#9.090":
    queue: nofield
    outcome: other_building
    note: >-
      "Seven (7) feet. An access aisle of at least five (5) feet wide shall be provided and" --
      the vertical clearance and access aisle of an ACCESSIBLE parking space. The standing answer
      on this project is that a four-unit two-storey pod with no elevator owes no accessible
      stall, under OSSC 1108.7.2, and all fourteen cities here defer the count to it. A city
      stating the geometry of a stall it does not require of us states nothing about our lot.
    fingerprint: 7946c0303e66416b
  "9.parking.txt#9.095":
    queue: nofield
    outcome: design
    note: >-
      "(80%) opaque when viewed horizontally from between two (2) and eight (8) feet above" grade
      -- the opacity test for a screen or fence around a parking area. A screening standard says
      what a barrier must look through, not where it stands; the same sentence appears in Happy
      Valley's 16.42.060 at six feet and 80 percent and is ruled the same way in this pass. A
      fence takes no setback and nothing in this screen measures one.
    fingerprint: 9dde0a5c60118239
  "9.parking.txt#9.120":
    queue: nofield
    outcome: other_building
    note: >-
      Loading areas: 250 square feet for buildings of 5,000 to 19,999 square feet of gross floor
      area, 500 square feet from 20,000 to 49,999, and a loading berth with an unobstructed height
      of 14 feet. Loading docks, keyed to floorplates the pod is a fraction of -- the smallest
      gate here is 5,000 square feet and opens on a commercial or industrial building. Portland's
      33.266.310 states the same family at 20,000 square feet and was ruled the same way on the
      chapter card.
    fingerprint: e45d616577d987a8
crossrefs:

  # --- the conditional use chapter, which is not the pod''s path -----------
  "6.300":
    outcome: other_building
    note: >-
      Conditional uses: "Uses that require conditional use approval in accordance with Section
      6.300 of this Code are..." -- the sentence that introduces the C column of each district''s
      use list. Troutdale''s Quadplex row reads P in five of its six residential districts and N in
      the sixth, with its own standards at 8.120. The pod is never on a C row, so the chapter does
      not reach it.
      (or/multnomah/troutdale/3.zoning-districts.txt#L232)
  "5.030":
    outcome: narrows_only
    note: >-
      "Exceptions to the building height limit are listed in Section 5.030 of this Code", printed
      under a zone's height standard. Exceptions to a height limit can only permit a taller
      building.
  "11":
    outcome: narrows_only
    note: >-
      Landscaping and Screening, reached from 9.055(C): "Parking area setbacks shall be
      landscaped with major trees, shrubs, and groundcover as specified in Chapter 11." The
      reference is about what GROWS in the band, not how wide the band is -- 9.095(D) sets the
      width, by borrowing the building setback, and it is encoded. The one landscape standard
      that could have taken area away from this building is void by name: 8.120.B.1.b makes
      "maximum lot coverage, minimum landscape area, or minimum open space standards" invalid
      for triplexes and quadplexes. So the chapter can only govern planting inside ground the
      pod already gives up, and reading it could not move a lot.
  "46":
    outcome: preempted
    note: >-
      Not a Troutdale chapter. The mention is the preamble to Table 1 -- "ADU standards are per
      OAR Division 46" -- pointing at the state middle-housing rule, which this corpus already
      holds at `or/oar.660-046-0010.txt`, `-0020` and `-0220` in the state layer. Two reasons
      it closes: the sentence is about accessory dwelling units, and the division it names is
      the same one whose parking bands Table 1 copies and whose cap already sits over this
      layer as `preempts: cap`.

definitions:
  # "Lot, Corner. A lot at least two (2) adjacent sides of which abut streets
  # other than alleys provided the angle of intersection of the adjacent
  # streets does not exceed one hundred thirty-five (135) degrees."
  #
  # Word for word Rivergrove's, down to the 135-degree ceiling and the
  # "streets other than alleys" exclusion. Two cities twenty-five miles apart
  # adopting the same model language is not an argument for a shared default:
  # each is quoted from its own code, and if Troutdale amends its ceiling
  # tomorrow only Troutdale moves.
  #
  # Not encoded: TDC 1.020 also illustrates "Corner Lots with Continuously
  # Curved Front Lot Lines", which is a figure rather than a stated rule --
  # there is no text saying what a continuous curve does to the angle test.
  corner_lot:
    test: adjacent_frontages
    max_intersection_angle_deg: 135.0
    quote: "or/multnomah/troutdale/1.020.definitions.txt#L522-L523"
    cite: "TDC 1.020, Lot, Corner"

code:
  # Municode client 4663, publication 1813 (updated 2025-11-17). The zoning
  # lives in the separately-published Development Code, not the Code of
  # Ordinances (publication 1812). The library renders in JavaScript; this
  # endpoint returns the adopted PDF.
  # TDC 1.020 is the Development Code's definitions, in Chapter 1. Same
  # publication as the other two slices, cut to the introductory provisions.
  - id: "1.020.definitions"
    url: https://api.municode.com/PublicationPdfDownload/1813
    title: "TDC 1.020 - Definitions (Chapter 1, Introductory Provisions)"
    start: "INTRODUCTORY PROVISIONS"
    end: "CHAPTER 2"
    # Prose about words carries almost no dimensioned standards, which the
    # thinness guard reads as a landing page. Read 2026-08-18: the slice is
    # the definitions themselves, Lot Area through Lot Width and the street
    # types they lean on.
    allow_thin: true
  - id: "3.zoning-districts"
    url: https://api.municode.com/PublicationPdfDownload/1813
    title: "Chapter 3 - Zoning Districts"
    start: "ZONING DISTRICTS"
    end: "ZONING DISTRICT OVERLAYS"
  - id: "8.development-standards"
    url: https://api.municode.com/PublicationPdfDownload/1813
    title: "Chapter 8 - Development and Design Standards"
    start: "DEVELOPMENT AND DESIGN STANDARDS"
    end: "CHAPTER 9"
  # The chapter Chapter 8 ends at, and the one both other slices point into.
  # 3.235(C): "Off-street parking spaces shall be provided in accordance with
  # the requirements of Chapter 9, Off-Street Parking and Loading, of this
  # Code." 8.320(A)(5): "In addition to the standards of Chapter 9, Off-Street
  # Parking and Loading, off-street parking for attached dwellings on a single
  # lot ...". Chapter 8 states the QUANTITY for a quadplex and its placement
  # and never states a stall or an aisle; this is where those live, if they
  # live anywhere. 3,431 lots here fit the pod and none is drawn on.
  - id: "9.parking"
    url: https://api.municode.com/PublicationPdfDownload/1813
    title: "Chapter 9 - Off-Street Parking and Loading"
    start: "OFF-STREET PARKING AND LOADING"
    end: "CHAPTER 10"
defaults:
  # PARKING AND VEHICLE ACCESS, read 2026-08-29 out of TDC Chapter 9,
  # Off-Street Parking and Loading, and the off-street parking subsections of
  # 8.120, Triplex and Quadplex Dwellings. Chapter 3 sends every zone here --
  # 3.235(C), "Off-street parking spaces shall be provided in accordance with
  # the requirements of Chapter 9" -- and 8.320(A)(5) adds its own standards
  # "in addition to" them. Both chapters were re-adopted whole by the same
  # ordinance, Ord. No. 899 of 6-24-2025, so neither is the later enactment
  # and neither yields to the other on that ground.
  #
  # WHAT THE POD IS HERE, and Troutdale is the one city in this corpus that
  # answers the question with a count instead of leaving it to be argued.
  # 1.020: "Dwelling, Quadplex. A building with four (4) dwelling units on a
  # lot or parcel in any configuration." Two lines above it: "Dwelling,
  # Multi-Family. A building with five (5) or more dwelling units." A
  # quadplex is NOT multifamily in Troutdale. So every multi-family row and
  # section in Chapter 9 belongs to somebody else -- Table 1's multi-family
  # minimum, 9.090's bicycle standards, 9.050's EV conduit -- and the pod
  # takes the Triplex and Quadplex row. Compare West Linn, where the same
  # word is undefined and a quadplex becomes multifamily by elimination: the
  # two cities read opposite ways off the same term.
  # (or/multnomah/troutdale/1.020.definitions.txt#L292,L294)
  #
  # Which also disposes of the one orphan in the new document. Table 1's
  # Multi-Family row prints "1 space per dwelling unit1" -- a footnote marker
  # whose body is nowhere in the slice, so the footnote census reports
  # 9.parking.txt UNRECONCILED with one unbodied marker. It hangs on the row
  # this building is not on, and it is the only marker in the chapter.
  #
  # AND THE MIDDLE-HOUSING INVALIDATION DOES NOT REACH THE GEOMETRY.
  # 8.120.C.1.b.ii voids "the jurisdiction's design standards other than
  # those in this Subsection C. that apply only to triplexes, quadplexes, or
  # multifamily development". 9.115 opens "The following off-street parking
  # development and maintenance shall apply in all cases", and 9.080 governs
  # every driveway to an off-street parking area, carving out single- and
  # two-family dwellings rather than middle housing. Neither applies ONLY to
  # this building, so neither is voided. This is not Milwaukie 19.606, which
  # excepts middle housing from its own aisle table by name.
  # (or/multnomah/troutdale/8.development-standards.txt#L566-L570)

  # HOW MANY. Table 1 of 9.010, Triplex and Quadplex row: the state model
  # bands copied whole, and banded on the LOT's own size the way OAR
  # 660-046-0220(2)(e)(B) bands them. Four bullets, four counts, and the
  # bands meet exactly where the state's do -- the table prints "less than
  # 3,000" and then "less than 5,000" for the second, which is the ordered
  # -bullet way of writing 3,000 to 4,999.
  #
  # NOT ENCODED: the SAME requirement, stated a second time and banded on a
  # different measure. 8.120.B.3.a asks for two spaces "in zones with a
  # minimum lot size of less than five thousand (5,000) square feet", three
  # between 5,000 and 6,999, four per quadplex at 7,000 or greater -- the
  # ZONE's minimum lot size, not the lot's area. No band measure can hold
  # that: LOT_MEASURES is lot_sqft, lot_width_ft and lot_depth_ft, and the
  # zone minimum is a property of the district. It is left out rather than
  # synthesised, and the reason it can be is that the two only disagree on a
  # lot SMALLER than its own zone's minimum -- where 8.120 asks for more
  # than Table 1, it is asking for more than OAR 660-046-0220(2)(e)(B) lets
  # any Large City ask, and the state cap in `or/_state.yaml` already
  # preempts it. Where the zone minimum is the lower of the two, Table 1 is
  # the stricter city standard and is the one encoded.
  # (or/multnomah/troutdale/8.development-standards.txt#L529-L533,L539-L542)
  parking_min_per_unit:
    spaces_total: 4
    cite: TDC 9.010, Table 1, Triplex and Quadplex row, lot of 7,000 sq. ft. or greater
    url: https://api.municode.com/PublicationPdfDownload/1813
    retrieved: '2026-08-29'
    quote: "or/multnomah/troutdale/9.parking.txt#L82,L87,L92-L93"
    variants:
      - spaces_total: 1
        band: {measure: lot_sqft, less_than: 3000}
        cite: TDC 9.010, Table 1, Triplex and Quadplex, lot size of less than 3,000 sq. ft.
        url: https://api.municode.com/PublicationPdfDownload/1813
        retrieved: '2026-08-29'
        quote: "or/multnomah/troutdale/9.parking.txt#L87,L88"
      - spaces_total: 2
        band: {measure: lot_sqft, at_least: 3000, less_than: 5000}
        cite: TDC 9.010, Table 1, Triplex and Quadplex, lot size of less than 5,000 sq. ft.
        url: https://api.municode.com/PublicationPdfDownload/1813
        retrieved: '2026-08-29'
        quote: "or/multnomah/troutdale/9.parking.txt#L87,L89"
      - spaces_total: 3
        band: {measure: lot_sqft, at_least: 5000, less_than: 7000}
        cite: TDC 9.010, Table 1, Triplex and Quadplex, lot size between 5,000 and 6,999 sq. ft.
        url: https://api.municode.com/PublicationPdfDownload/1813
        retrieved: '2026-08-29'
        quote: "or/multnomah/troutdale/9.parking.txt#L87,L90-L91"
  # And no ceiling. Every bullet of the Triplex and Quadplex row prints "No
  # maximum" in the right-hand column, and the column is a real ceiling
  # elsewhere in the same table -- 6.2 spaces per 1,000 sq ft for general
  # retail, 19.1 for a restaurant -- so the words are a reading of an
  # occupied column, not an empty cell. `exempt` rather than absence because
  # a maximum has to beat the broader layers rather than fall through them.
  parking_max_per_unit:
    exempt: true
    cite: TDC 9.010, Table 1, Triplex and Quadplex row, Maximum column
    url: https://api.municode.com/PublicationPdfDownload/1813
    retrieved: '2026-08-29'
    quote: "or/multnomah/troutdale/9.parking.txt#L82,L87,L92"
  # HOW BIG. 9.115 states both halves in one section and states them for
  # everybody: "The following off-street parking development and maintenance
  # shall apply in all cases". A. Size: nine by eighteen, with the area
  # printed beside it as its own check -- 162 square feet is 9 x 18 and
  # nothing else. B. Aisles: twenty-five feet at ninety degrees.
  #
  # TWENTY-FIVE IS THE WIDEST AISLE IN THIS CORPUS. Fairview asks 24, West
  # Linn and Gresham 23, Portland 20. Troutdale asks one figure and does not
  # split it by direction, so a one-way rear court here is dimensioned off
  # the two-way number the way Fairview's and West Linn's are -- 18 + 25 +
  # 18 is a 61-foot court before any driveway reaches it.
  #
  # NOT ENCODED: 9.115(A)(2), compact spaces of eight by sixteen for up to
  # thirty-five percent of the required spaces. A loosening, and one that
  # would have to be elected on a plan rather than read off a parcel. The
  # standard row is what a placement is screened against, which is the same
  # cut Fairview and Gresham take.
  parking_stall_width_ft:
    value: 9
    cite: TDC 9.115(A)(1), Design Requirements for Off-Street Parking, standard size
    url: https://api.municode.com/PublicationPdfDownload/1813
    retrieved: '2026-08-29'
    quote: "or/multnomah/troutdale/9.parking.txt#L574,L576,L578,L580-L581"
  parking_stall_depth_ft:
    value: 18
    cite: TDC 9.115(A)(1), Design Requirements for Off-Street Parking, standard size
    url: https://api.municode.com/PublicationPdfDownload/1813
    retrieved: '2026-08-29'
    quote: "or/multnomah/troutdale/9.parking.txt#L574,L576,L578,L580-L581"
  parking_aisle_one_way_ft:
    value: 25
    cite: TDC 9.115(B)(1), aisles, ninety degree parking
    url: https://api.municode.com/PublicationPdfDownload/1813
    retrieved: '2026-08-29'
    quote: "or/multnomah/troutdale/9.parking.txt#L574,L576,L592,L594"
  parking_aisle_two_way_ft:
    value: 25
    cite: TDC 9.115(B)(1), aisles, ninety degree parking
    url: https://api.municode.com/PublicationPdfDownload/1813
    retrieved: '2026-08-29'
    quote: "or/multnomah/troutdale/9.parking.txt#L574,L576,L592,L594"
  # HOW THE CARS GET THERE. 9.080(A): a driveway to an off-street parking
  # area is improved from the public roadway at 20 feet for a two-way drive
  # and 12 for a one-way. (B) drops it to 10 for "a single-family or
  # two-family dwelling" -- a quadplex is neither, so the pod takes (A). That
  # ties Happy Valley for the second-widest side lane in this corpus, four
  # short of West Linn's 24 and eight more than the 12-foot design lane an
  # unread city falls back to.
  #
  # NOT ENCODED: the second half of the same sentence, "but in either case
  # not less than the full width of the approach for the first twenty (20)
  # feet of the driveway". That is a relation between two fields rather than
  # a value in either -- it says the drive must widen to meet whatever
  # approach is built, up to the 32 feet 8.120.C.5.a allows. The site plan
  # draws the approach and the lane at one width, which satisfies it, but
  # nothing in the model checks that they agree.
  driveway_min_width_two_way_ft:
    value: 20
    cite: TDC 9.080(A), driveway to an off-street parking area, two-way drive
    url: https://api.municode.com/PublicationPdfDownload/1813
    retrieved: '2026-08-29'
    quote: "or/multnomah/troutdale/9.parking.txt#L436,L438-L439"
  driveway_min_width_one_way_ft:
    value: 12
    cite: TDC 9.080(A), driveway to an off-street parking area, one-way drive
    url: https://api.municode.com/PublicationPdfDownload/1813
    retrieved: '2026-08-29'
    quote: "or/multnomah/troutdale/9.parking.txt#L436,L438-L440"
  # The curb cut, and it is the state model code's number: all approaches
  # together, thirty-two feet per frontage, measured at the property line.
  # Word for word what Wilsonville 4.113(.14)D.4 and Clackamas ZDO 845.02
  # state, because all three adopted the same model.
  #
  # Troutdale states NO minimum approach width. Read and absent, not skipped:
  # 9.080 dimensions the driveway and 8.120.C.5 dimensions only the ceiling,
  # so unlike West Linn a pod here may shrink its opening to whatever the
  # lane needs.
  #
  # NOT ENCODED: 8.120.C.5.b and .c, which decide how many approaches and
  # where. Separated approaches "must meet the jurisdiction's driveway
  # spacing standards applicable to local streets"; a lot with more than one
  # frontage "must access the street with the lowest transportation
  # classification", takes access from an improved alley if it abuts one, and
  # on collectors or arterials meets a different standard again. Street
  # classification, alley presence and frontage count are none of them
  # measured for any parcel in this corpus -- the same three site facts that
  # refused West Linn 48.025(B)(3)(a) and Gresham's alley branch.
  driveway_approach_max_width_ft:
    value: 32
    cite: TDC 8.120.C.5.a, total width of all driveway approaches per frontage
    url: https://api.municode.com/PublicationPdfDownload/1813
    retrieved: '2026-08-29'
    quote: "or/multnomah/troutdale/8.development-standards.txt#L501,L606-L608"
  # WHERE THE PARKING MAY SIT. 8.120.C.4.b bans garages and off-street
  # parking between a building and a public street, then excepts a parking
  # area "separated from the street property line by a dwelling" or one whose
  # combined width with all garages and maneuvering areas is at most half the
  # street frontage. The ban is therefore NOT absolute the way Portland's
  # 33.266.120.C.1.a and Milwaukie's 19.505.3.D.4.a are, and encoding it as
  # one would invent a red on a lot the code lets through -- so the fifty
  # percent is what this file carries and `parking_front_prohibited` stays
  # empty.
  #
  # The cross-reference in (b) is broken: it excepts compliance with
  # "Subsections a. and b. of this Subsection C.4.", where a. is "garages and
  # carports are not required" and b. is the ban itself. The exceptions are
  # plainly c. and d. -- Troutdale re-lettered the state model code's a/b
  # pair to c/d and did not update the pointer. Fairview, Wilsonville and
  # unincorporated Clackamas carry the same two sentences correctly
  # numbered, which is how the reading is certain rather than charitable.
  parking_area_max_frontage_pct:
    value: 50
    cite: TDC 8.120.C.4.d, combined width of garages, parking and maneuvering areas
    url: https://api.municode.com/PublicationPdfDownload/1813
    retrieved: '2026-08-29'
    quote: "or/multnomah/troutdale/8.development-standards.txt#L501,L596,L598,L603-L604"
  # AND HOW FAR BACK. 9.095(D): "Parking areas shall be set back from a lot
  # line adjoining a street the same distance as required building setbacks."
  # No number of its own -- the ten feet printed in the same sentence is an
  # industrial-district floor and reaches none of the zones that permit this
  # building -- so it is carried with `same_as` and lives on the zones, where
  # the setback it borrows lives. (B) says the same thing the other way
  # round: required parking may not sit in a required front or street-side
  # setback, "except in industrial districts". Nobody types a number.
  #
  # What it comes to for this building: nothing, the same as Happy Valley.
  # The envelope the site plan lays out in is already inset by the front
  # setback, so a rear court clears it on every lot in the city. It is here
  # because it is the law and because the check it feeds is general.
  #
  # NOT ENCODED: 9.095(A), "Parking areas which abut a residential zoning
  # district shall meet the building setback of the most restrictive
  # adjoining residential zoning district." That is the NEIGHBOUR's standard
  # applying to our lot; `same_as` reaches another field in the same zone,
  # not another zone's field, and what would answer it is the zoning of the
  # parcel next door. Third instance of this exact shape -- Happy Valley
  # 16.43.030.E.3 and Portland's commercial front setback are the others.
  # (or/multnomah/troutdale/9.parking.txt#L524,L526)
  #
  # NOT ENCODED: the CFEC waiver, and it is the largest thing in this chapter
  # left on the table. 9.005 and 9.035 both say it: "no off-street parking is
  # required for developments on a lot or parcel that includes lands within
  # one-half (1/2) mile of a frequent transit corridor", nor within the Town
  # Center Overlay District or a quarter mile of its boundary. A lot inside
  # either owes ZERO stalls and Table 1 does not reach it. Both are read off
  # a map -- the City of Troutdale CFEC Parking Delineated Area Map -- that
  # no parcel record in this corpus carries, so every Troutdale lot is
  # screened against the non-CFEC table. That is the conservative direction
  # and it is also, on the lots it is wrong about, four stalls of site the
  # pod does not owe.
  # (or/multnomah/troutdale/9.parking.txt#L45-L51,L186,L188-L192)
  #
  # NOT ENCODED: 9.040's reductions and 8.120.B.3.b's on-street credit. Ten
  # percent off within 400 feet of a transit route with a stop built; one
  # space per hundred square feet of transit amenity; one space for each
  # abutting on-street parallel space at least 22 feet long. All three loosen
  # and all three turn on facts about the street rather than the lot.
  # (or/multnomah/troutdale/9.parking.txt#L195-L219,
  #  or/multnomah/troutdale/8.development-standards.txt#L547-L558)
  #
  # READ AND NOT A CONSTRAINT ON THIS BUILDING. 9.055(A) landscaping and (B)
  # bay planters both start at twenty spaces and the pod parks eight.
  # 9.060(C) and (D) -- solar panels or forty percent tree canopy -- start at
  # half an acre of new surface parking. 9.090 bicycle parking and 9.050 EV
  # conduit are written for multi-family developments, which by 1.020 means
  # five units or more. 9.120 loading is commercial and industrial. 9.085(B)
  # requires that a group of more than three spaces be served by aisles or
  # turnarounds "so that all vehicles may enter the street in a forward
  # manner" -- which is what the rear-court layout draws, and the reason it
  # draws it. And 8.120.B.1.b invalidates maximum lot coverage, minimum
  # landscape area and minimum open space for a quadplex outright, which is
  # why this layer reserves no open space: read, and voided by name.

zones:
  MU-1:
    section: ["3.210", "3.220"]
    cite_default:
      cite: Troutdale Development Code 3.220, Land Use Table for Mixed-Use Zoning Districts (Municode, through Ord. 899)
      url: https://library.municode.com/or/troutdale/codes/development_code?nodeId=CH3ZODI
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L573,L582,L585,L590"
    notes: >-
      3.220's Quadplex row reads N in MU-1 and P in MU-2 and MU-3, so the one of the three mixed-use districts that refuses this building is the one named first. Townhouse is P in all three, and the split-plat path is not read as an escape here for the reason it is not read as one anywhere in this corpus without the code saying so: 8.130 states townhouse standards, not that a quadplex divided onto four lots stops being a quadplex. The quote carries the legend -- P permitted, C conditional, N not permitted -- so the letter is readable on its own.
  CC:
    section: ["3.310", "3.320"]
    cite_default:
      cite: Troutdale Development Code 3.320, Land Use Table for Commercial Zoning Districts (Municode, through Ord. 899)
      url: https://library.municode.com/or/troutdale/codes/development_code?nodeId=CH3ZODI
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L816,L825,L828,L831"
    notes: >-
      3.320's residential block is two rows: Residential facilities P, and "Other residential uses N". A quadplex is an other residential use in both commercial columns. Live-Work units are P in CC, which is a dwelling attached to a business rather than four attached townhomes on a lot. The quote carries the legend -- P permitted, C conditional, N not permitted -- so the letter is readable on its own.
  GC:
    section: ["3.310", "3.320"]
    cite_default:
      cite: Troutdale Development Code 3.320, Land Use Table for Commercial Zoning Districts (Municode, through Ord. 899)
      url: https://library.municode.com/or/troutdale/codes/development_code?nodeId=CH3ZODI
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L816,L825,L828,L831"
    notes: >-
      3.320's residential block is two rows: Residential facilities P, and "Other residential uses N". General Commercial refuses Live-Work as well, so a residential facility is the only housing of any kind that reaches it. The quote carries the legend -- P permitted, C conditional, N not permitted -- so the letter is readable on its own.
  IP:
    section: ["3.410", "3.420"]
    cite_default:
      cite: Troutdale Development Code 3.420, Use Table for Industrial Zoning Districts (Municode, through Ord. 899)
      url: https://library.municode.com/or/troutdale/codes/development_code?nodeId=CH3ZODI
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L979,L991,L996,L1000"
    notes: >-
      3.420 states one residential permission -- "One Caretaker unit in conjunction with an existing industrial use" -- and then "All other residential uses N" in all three industrial columns. Industrial Park refuses even the caretaker unit. The quote carries the legend -- P permitted, C conditional, N not permitted -- so the letter is readable on its own.
  LI:
    section: ["3.410", "3.420"]
    cite_default:
      cite: Troutdale Development Code 3.420, Use Table for Industrial Zoning Districts (Municode, through Ord. 899)
      url: https://library.municode.com/or/troutdale/codes/development_code?nodeId=CH3ZODI
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L979,L991,L996,L1000"
    notes: >-
      3.420 permits one caretaker unit alongside an existing industrial use and reads "All other residential uses N". One unit tied to an industrial operation is not four attached townhomes, and the row that would carry them says N. The quote carries the legend -- P permitted, C conditional, N not permitted -- so the letter is readable on its own.
  GI:
    section: ["3.410", "3.420"]
    cite_default:
      cite: Troutdale Development Code 3.420, Use Table for Industrial Zoning Districts (Municode, through Ord. 899)
      url: https://library.municode.com/or/troutdale/codes/development_code?nodeId=CH3ZODI
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L979,L991,L996,L1000"
    notes: >-
      3.420 permits one caretaker unit alongside an existing industrial use and reads "All other residential uses N". 153 lots, the largest unread zone in the city, and the answer is one cell. The quote carries the legend -- P permitted, C conditional, N not permitted -- so the letter is readable on its own.
  OS:
    section: ["3.520"]
    cite_default:
      cite: Troutdale Development Code 3.520, OS - Open Space (Municode, through Ord. 899)
      url: https://library.municode.com/or/troutdale/codes/development_code?nodeId=CH3ZODI
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L1271,L1276-L1285"
    notes: >-
      3.520 does not use a land use table at all. It states a closed list -- "The following uses and their accessory uses are permitted in the OS district" -- of nature preserves, passive recreation, restrooms and minor utilities, and a conditional list of active recreation, community services and major utilities. No dwelling of any kind appears on either. A closed list that omits housing is a refusal rather than a silence, and the district exists to apply to publicly owned parkland.
  MU-2:
    max_density_du_per_acre:
      # 3.140.B.4: "Maximum density standards shall not apply to duplex,
      # triplex, quadplex, cottage cluster projects ... on a dwelling units per
      # net acre calculation". The pod on one lot is exempt outright, which is
      # also what disposes of the minimum: 3.140.A.2 states the floor as eighty
      # percent of the maximum number of units per net acre, and eighty percent
      # of a standard this housing type is exempt from has no operand. The
      # mixed-use table sends density to the same section the residential ones
      # do -- row "Density standards: see 3.140".
      exempt: true
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L506,L519-L522,L710"
      measured_on:
        fact: net_developable_area
        cite: TDC 1.020 "Net Area"
        quote: "or/multnomah/troutdale/1.020.definitions.txt#L640-L643"
    section: ["3.210", "3.220", "3.230", "3.235", "3.140"]
    cite_default:
      cite: Troutdale Development Code 3.220, 3.230.B (residential uses) and 3.235 (detailed
        dimensional standards) (Municode, through Ord. 899)
      url: https://library.municode.com/or/troutdale/codes/development_code?nodeId=CH3ZODI
      retrieved: '2026-08-19'
    quadplex_allowed:
      # Table 3.220, Quadplex row: N P P. This is the middle column.
      value: true
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L573,L582,L585,L590"
    min_lot_sqft:
      # 3.230.B prints no number in any of the three columns. It prints "see
      # 3.235.A", and 3.235.A says "The minimum lot size shall be based on the
      # minimum lot width and minimum lot depth standards" -- which is a
      # deferral, not a figure. MU-2 states no lot-area standard of its own:
      # what it asks of a lot is 15 feet of width and 70 of depth, both
      # encoded below and both screened separately, and a lot that clears
      # those clears the area test by construction.
      #
      # Encoded exempt rather than as the product of the two. 15 by 70 is
      # 1,050 square feet, but that number appears nowhere in the Development
      # Code, and writing an arithmetic result into a field the code never
      # printed is how a derived figure becomes a quoted one. It would also
      # never bind: the pod's own footprint is 2,016 square feet, so a
      # 1,050-foot floor cannot decide a single lot either way.
      exempt: true
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L684-L688,L724-L725"
    min_lot_width_ft:
      # 15 feet, the same in all three mixed-use columns. A townhouse-unit
      # width applied to every residential use in the district, which is what
      # a downtown code does when it governs by form rather than by lot.
      value: 15
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L684,L686"
    min_lot_depth_ft:
      # 3.235.B.1: seventy feet "for residential units with a driveway from
      # the public street or with access from an alley within a separate tract
      # from the lot", which is the pod's normal case.
      value: 70
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L684,L687,L727-L729"
      variants:
        # B.2: ninety feet where the alley access runs in an easement that is
        # part of the lot rather than in a tract of its own. Two unmeasured
        # facts at once, so it cannot fire -- recorded so the ninety is not
        # lost.
        - value: 90
          when: [abuts_alley, access_easement]
          quote: "or/multnomah/troutdale/3.zoning-districts.txt#L684,L687,L730-L731"
        # B.3: no minimum depth at all inside the block bounded by the
        # Historic Columbia River Highway and 2nd Street west to 257th. A
        # boundary drawn inside the zone, and nobody holds it.
        - exempt: true
          when: [inside_mapped_use_area]
          quote: "or/multnomah/troutdale/3.zoning-districts.txt#L684,L687,L732-L734"
    min_frontage_ft:
      value: 15
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L684,L688"
    setback_front_ft:
      # The front yard is four numbers, not one, and the pod takes the façade
      # row: 15 feet to the front façade of a residential unit without alley
      # access, 10 with. The porch rows -- 10 and 5 -- are a shallower
      # standard for a projecting porch and are not the building line.
      value: 15
      quote: "or/multnomah/troutdale/3.zoning-districts.txt#L684,L689-L694"
      variants:
        - value: 10
          when: [abuts_alley]
          quote: "or/multnomah/troutdale/3.zoning-districts.txt#L684,L689-L690,L696-L697"
    # 9.095(D), stated as equal to the building setback -- see the note in
    # `defaults:`. `same_as` resolves against the front setback above it, and
    # the only figure the sentence carries is an industrial floor that does
    # not reach this zone, so nothing is typed here.
    parking_street_setback_ft:
      same_as: setback_front_ft
