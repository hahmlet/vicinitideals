    max_density_du_per_acre:
      # 3.140.B.4: "Maximum density standards shall not apply to duplex,
      # triplex, quadplex, cottage cluster projects ... on a dwelling units per
      # net acre calculation". The pod on one lot is exempt outright, which is
      # also what disposes of the minimum: 3.140.A.2 states the floor as eighty
      # percent of the maximum number of units per net acre, and eighty percent
      # of a standard this housing type is exempt from has no operand. No
      # min_density_du_per_acre is encoded here for that reason -- not because
      # the chapter is silent, which it is not.
      exempt: true
