crossrefs:
  "450":
    outcome: later
    note: >-
      Subdivisions and Partitions. Both mentions sit in the sentence after the one this screen
      reads: "There is no minimum lot size or dimension for development of land or creation of new
      lots in commercial zones. Creation of new lots is subject to the regulations of Section
      450." Same split as Portland 33.613 — the development half is the test an existing lot has
      to pass, and the creation half is a plat that produces the lot in the first place. Parked
      rather than closed: no pod in flats/config/pods declares plat: unit_lots, so this screen
      never creates a lot. The day one does, this is a fetch.
  "230.350": >-
    The other half of the same sentence's table. It is the parenthetical under the Landscape
    Buffer rows of Table 230-2 -- "(See Sections 230.350 and 330)" -- and Table 230-2 is the
    development standards table for NC, the neighborhood commercial zone. This screen does not
    place the pod there: Table 230-1 reads CU for the residential row and 230.315.A.1 then allows
    residential only as part of a mixed use development, so `quadplex_allowed` is false at base
    in NC and quadfit's rules.yaml carries no NC entry at all. A landscape buffer in a zone the
    building cannot occupy cannot bind it. Two cautions kept on the record rather than resolved.
    The reference may also be one of this code's stale pointers -- footnote (5) on the same table
    sends a reader to "Section 350 - Landscaping and Screening" and after Ord. 2-2022 Section 350
    is Parking and landscaping is 330, which is the trap already written up under "300" -- and
    woodvillage.municipal.codes answers 403 to a direct request for either 230.350 or 230.330, so
    a 404 was never available to prove the section gone. Neither caution changes the ruling: the
    zone is the reason, not the section number.
  "300": >-
    Additional Use and Development Regulations, and the fourteen mentions are one sentence repeated in
    every use table in the city: "Additional regulations are listed in Section 300." It is a container
    rather than a chapter -- eleven subsections, 310 through 395 -- so the reference cannot be ruled on
    without reading what is in it. Read 2026-08-20. Two subsections reach this building. 350, Parking
    and Loading, is fetched and its Table 350-1A is now this layer''s parking default -- and note that
    this ruling said only that for ten days, which is the Gladstone mistake exactly: a chapter closed
    on the QUANTITY of parking while its geometry sat unread three articles away. 350.030, 350.055
    and 350.065 were stored 2026-08-30 and Table 350-3 is now this layer''s stall and aisle. 390, solid
    waste and recyclables storage, is fetched and does not reach it: 390.020 applies "to new multi-unit
    residential buildings containing five or more units", and this is four. The other nine are other
    use types or other procedures -- home occupations, group living, essential service providers,
    landscaping (330, reached only through the five-or-more-unit table), manufactured homes, mobile
    food units, the planned development district, signs and temporary uses.


    Worth recording that the code''s own pointers went stale in the renumbering. WVDC 230.310 footnote
    (5) reads "See Section 350 - Landscaping and Screening", and after Ord. 2-2022 Section 350 is
    Parking and Loading while landscaping is 330. The footnote names the right subject and the wrong
    number, which is exactly the shape of reference that sends a reader to the wrong chapter and looks
    settled when they get there.
  "640": >-
    Non-conforming uses. Every mention is the third paragraph of a zone''s use section: "Legally
    established uses and development which existed at the time this Code was adopted and would
    otherwise be prohibited, are subject to additional regulations in Section 640." A building that
    already exists, not one this screen places.
  "220.400": >-
    Cottage housing. Its mentions are the asterisk under Table 210-2 and the same reference in Table
    220-2, both hanging off the Cottage Housing row. Cottage housing is a separate housing type in
    those tables from "Attached or Detached Tri- or Quadplex", which carries a bare Y.
  "340.010": >-
    Manufactured homes. The mention is a row label -- "Manufactured Home (See Section 340.010): Y Y" --
    in the same table that lists "Attached or Detached Tri- or Quadplex" as its own row with no
    reference. A factory-built pod is not thereby a manufactured home: the table decides which row a
    building takes, and this one is the quadplex row.
  "340.020": >-
    Manufactured home parks, and the mention is the row for them in Table 220-2. A different housing
    type in the same table, and prohibited in MR4 besides.
  "395": >-
    Accessory dwelling units, cited from the ADU row of Tables 210-2 and 220-2. An accessory dwelling
    is by definition subordinate to a primary one; this building is four primary dwellings.
  "330": >-
    Landscaping and Screening. Its one binding mention is footnote (2) to Table 220-4, and Table 220-4
    is headed "Development Standards for Multi-Dwelling Structures in the MR2 Zone" -- five units and
    up. A quadplex takes Table 220-3, which has no landscaping row. Not fetched for that reason; the
    NC zone''s five percent is encoded from its own table and points here for how rather than how much.
  "660": >-
    Variance. Its mention is WVDC 220.320(B): "In the MR4 & MR2 zones reductions to the minimum lot
    size & dimensions for detached single dwelling units may be approved through the variance process."
    Detached single dwelling units. This pod is four attached ones, so the exception is not available
    to it and the base lot minimum stands.

  # --- surfaced by the three parking documents stored 2026-08-30 -----------
  # Reading a chapter adds references, which is the queue working. These five
  # are what 350.030, 350.055, 350.065 and 720.030 point at that nothing had
  # ruled on before.
  "31":
    outcome: other_building
    note: >-
      Chapter 31 of the Uniform Building Code, cited by WVDC 350.065(D)(3): "Where required by this
      Code, Chapter 31 of the Uniform Building Code or the Americans With Disabilities Act, disabled
      parking spaces must meet the dimension standards stated in Table 350-3." Both halves are now
      decided and neither requires anything of this building. The WVDC half supplies dimensions for
      a requirement stated somewhere else, and no row of Table 350-1A asks Household Living for an
      accessible space. The building-code half was parked from 2026-08 until 2026-09-03 and is now
      closed against the code itself. Oregon's current book is the 2025 Structural Specialty Code
      (IBC 2024 base, mandatory 2026-04-01), and its chain is explicit. OSSC 1106.3 requires
      accessible parking in Groups R-2, R-3 and R-4 only where the building is "required to have
      Accessible, Type A or Type B dwelling units." OSSC 1108.6.2.2.2 makes every unit of a
      four-or-more-unit structure a Type B unit, subject to the reductions in 1108.7. OSSC 1108.7.2
      then says a multistory dwelling unit not provided with elevator service is not required to be
      a Type B unit. Every unit of this pod is two storeys and there is no elevator, so no unit is
      required to be Type B, so 1106.3 never fires and the building owes zero accessible spaces.
      Table 350-3's Disabled row (13 ft against the standard 9) therefore never applies, and would
      have been superseded anyway -- ORS 447.233 and the federal standard put a lone accessible
      space at van-accessible width, 9 ft plus an 8 ft aisle. Closed as other_building rather than
      preempted: the requirement is real and reaches buildings with elevator service or with
      ground-storey units, just not this one. It reopens if the product ever becomes single-storey
      flats, because OSSC 1108.7.1 keeps the ground storey of a non-elevator building on the Type B
      hook. Full reasoning, the city-by-city read, and the sources are in docs/HUMAN_TODO.md item 4.
  "340": >-
    Manufactured Homes, cited by the last sentence of WVDC 350.055(A): "Parking for manufactured home
    parks is regulated in Section 340 - Manufactured Homes." A different tenure and a different
    building from the one this screen places, and it is cited out of the article that does not reach
    the pod in the first place. The same chapter''s .010 and .020 are already ruled on above.
  "49": >-
    Title 49 of the Code of Federal Regulations, reached through the definition of PASSENGER VEHICLE:
    the term "is intended to cover the vehicles defined as passenger cars and multipurpose passenger
    vehicles by the National Highway Traffic Safety Administration". A federal classification of what
    a car is, not a standard about where one may be parked.
  "571.3": >-
    The section of 49 CFR Chapter V that the PASSENGER VEHICLE definition points at, and the same
    ruling: it is the federal motor vehicle safety standard defining vehicle classes. Nothing in it
    dimensions a stall or a lot.
  "730":
    outcome: misread
    note: >-
      Not a cross-reference at all. "Section 720" and "Section 730" are the breadcrumb the codifier
      prints above every page -- the chapter before this one and the chapter after -- and they land
      in the stored text at lines 11 and 13, above the code itself. Recorded rather than left open
      because an unread reference and a reference that never existed look identical in a queue.
  "235.275": >-
    The Community Retail requirement of the Town Center, reached through the definition of LARGE
    SCALE RETAIL: "single retail uses containing 60,000 or more square feet of gross leasable area".
    A commercial standard about a use this screen does not place.

defaults:
  # Table 350-1A is headed "Minimum Required Parking Spaces in All Zones" and
  # is stated by use category rather than by district, so it belongs to the
  # layer rather than to any zone. Household Living, "1 - 4 units": one space
  # per unit. Four units, four stalls, about 1,300 sq ft of a site that also
  # has to hold the pod and its access.
  #
  # The state's OAR 660-046-0220 ceiling is also one per unit, so the resolved
  # number does not move. What moves is what it rests on: until now every Wood
  # Village lot was screened against a state cap on what the city MAY require,
  # with nothing on file about what it does require. A ceiling standing in for
  # a rule is a rule nobody read.
  parking_min_per_unit:
    value: 1
    cite: "WVDC 350.045, Table 350-1A -- Household Living, 1-4 units"
    url: https://woodvillage.municipal.codes/WVDC/350.045
    retrieved: '2026-08-20'
    quote: "or/multnomah/wood-village/350.045.required-spaces.txt#L94-L95,L97"
  # And the ceiling, read 2026-08-30 off the table printed directly under the
  # one above. Table 350-1B is a real apparatus -- it caps a restaurant at 23
  # spaces per 1,000 sq ft, a medical office at 5.9, a college at 0.3, and it
  # states a second, tighter column for anything within a quarter mile of
  # 20-minute transit -- and against Household Living it prints "no maximum" in
  # both columns. Built, and pointed away from this building in words.
  parking_max_per_unit:
    exempt: true
    cite: "WVDC 350.045, Table 350-1B Maximum Parking Ratios -- Household Living, no maximum"
    url: https://woodvillage.municipal.codes/WVDC/350.045
    retrieved: '2026-08-30'
    quote: "or/multnomah/wood-village/350.045.required-spaces.txt#L146,L148-L149"
  #
  # THE GEOMETRY, and which of Section 350's articles states it.
  #
  # Section 350 splits its development standards in two. 350.050-350.055 is
  # "Development Standards for One and Two Unit Dwellings" and 350.060-350.065
  # is "Development Standards for All Other Uses", and the second one says how
  # the split works: its standards reach "all vehicle areas whether required or
  # excess parking, EXCEPT for residential parking areas subject to the
  # standards of Section 350.050 through 350.055". So the question is only
  # whether the first article reaches the pod, and it answers that itself --
  # "The regulations of this section apply to houses, attached houses,
  # duplexes, and manufactured homes."
  #
  # A quadplex is none of the four. WVDC 720.030 defines QUADPLEX as "a
  # structure that contains four (4) primary dwelling units on one (1) lot",
  # HOUSE as "a detached dwelling unit located on its own lot" and TOWNHOUSE as
  # a unit "located on an individual lot or parcel"; Tables 210-2 and 220-3
  # list "Attached or Detached Tri- or Quadplex" as a housing type of its own,
  # beside and not inside Detached House, Duplex and Townhouse. Same elimination
  # West Linn needed, with a defined noun at the end of it instead of a gap.
  #
  # THE STALL COMES OUT THE SAME EITHER WAY, which is worth saying because it
  # is the reason this reading is safe. 350.055(C) sets the one-and-two-unit
  # stall at "9 feet by 19 feet" and Table 350-3's 90-degree Standard row is 9
  # ft wide by 19 ft deep. Whichever article a reviewer thinks reaches this
  # building, the rectangle is the same. What the elimination actually decides
  # is three other things: 350.055 states NO AISLE at all, so on that branch
  # the city could not be laid out; 350.055(B) would ban parking "within the
  # first 10 feet from a front lot line" and cap the front yard at 40 percent
  # paved, and neither reaches; and 350.055(C)'s nine-foot driveway is not the
  # pod's either, which leaves the drive to the design default.
  parking_stall_width_ft:
    value: 9
    cite: "WVDC 350.065(D)(2)(a), Table 350-3, 90 degrees, Standard, Width (B)"
    url: https://woodvillage.municipal.codes/WVDC/350.065
    retrieved: '2026-08-30'
    quote: "or/multnomah/wood-village/350.065.all-other-uses.txt#L60,L97-L98,L111"
  parking_stall_depth_ft:
    value: 19
    cite: "WVDC 350.065(D)(2)(a), Table 350-3, 90 degrees, Standard, Stall Depth (E)"
    url: https://woodvillage.municipal.codes/WVDC/350.065
    retrieved: '2026-08-30'
    quote: "or/multnomah/wood-village/350.065.all-other-uses.txt#L60,L97-L98,L111"
  # STANDARD AND NOT COMPACT, on purpose. 350.065(D)(2)(b) requires only that
  # "at least 50% of required parking spaces" meet the standard dimensions, so
  # two of this building's four stalls could legally be 7 ft 6 in by 15 ft. A
  # court drawn to the standard stall everywhere fits on any lot where the
  # mixed court fits, and the reverse is not true, so the strict branch is the
  # one encoded and the slack is real rather than assumed.
  #
  # The aisle is one figure per direction and the same at every angle in the
  # table -- 12 feet one way, 24 feet two way, from parallel through 90
  # degrees. 24 ties Fairview, Gladstone, Happy Valley, Oregon City and
  # Tualatin; only Troutdale and unincorporated Multnomah ask more.
  parking_aisle_one_way_ft:
    value: 12
    cite: "WVDC 350.065(D)(2)(a), Table 350-3, 90 degrees, 1 Way Aisle Width (D)"
    url: https://woodvillage.municipal.codes/WVDC/350.065
    retrieved: '2026-08-30'
    quote: "or/multnomah/wood-village/350.065.all-other-uses.txt#L60,L97-L98,L111"
  parking_aisle_two_way_ft:
    value: 24
    cite: "WVDC 350.065(D)(2)(a), Table 350-3, 90 degrees, 2 Way Aisle Width (D)"
    url: https://woodvillage.municipal.codes/WVDC/350.065
    retrieved: '2026-08-30'
    quote: "or/multnomah/wood-village/350.065.all-other-uses.txt#L60,L97-L98,L111"
  # FIVE FEET, AND THE CODE OFFERS TEN AS THE ALTERNATIVE. Table 350-2's cell
  # reads "5 ft/L2 10 ft/L1" -- one cell, two compliance paths: five feet if
  # the strip is planted to the L2 standard, ten if only to L1. Five is what
  # the code requires as a minimum and ten is what a developer buys lighter
  # planting with, so five is the number, and this model does not check
  # landscaping standards either way. Nothing turns on the choice here: every
  # residential zone in the city sets the building ten feet off the front lot
  # line, so the envelope is already inset twice this far.
  parking_street_setback_ft:
    value: 5
    cite: "WVDC 350.065(C), Table 350-2, Lot line abutting street, all zones except GM"
    url: https://woodvillage.municipal.codes/WVDC/350.065
    retrieved: '2026-08-30'
    quote: "or/multnomah/wood-village/350.065.all-other-uses.txt#L60,L70,L72-L75"
  # NOT ENCODED: the other two rows of Table 350-2, both of which set a parking
  # area back from a side or rear lot line rather than from a street, and the
  # model holds only the street one. Against an LR or MR neighbour it is five
  # feet with L3 planting; against a commercial or town-centre neighbour it is
  # the same five-or-ten as the street row. Inert, and this time the margin is
  # not thin in the way Tualatin's was: five feet is exactly the side yard in
  # LR 7.5, MR 2 and MR 4, less than LR 12's ten, and a third of every rear
  # yard, so the building envelope is already cut back at least this far on
  # every line a parking area could reach. Recorded because the day a Wood
  # Village zone states a side yard under five feet, this stops being true.
  # (or/multnomah/wood-village/350.065.all-other-uses.txt#L72,L76-L77)
  #
  # NOT ENCODED: the curb cut. WVDC 350.030(D) is the only sentence in the
  # chapter about the width of an access point and it states no width -- "Access
  # points with the street shall be the minimum necessary to provide access
  # while not inhibiting the safe circulation and carrying capacity of the
  # street. Curb cuts shall be designed to established City standards." The
  # second sentence is a redirect that names no document, which is a weaker
  # version of the Clackamas County problem: there, at least, the drawing has a
  # number. There is nothing here to fetch and nothing to refuse a lot with, so
  # the drive and the cut fall to the design defaults, and the nine-foot
  # residential driveway of 350.055(C) is not borrowed for them.
  # (or/multnomah/wood-village/350.030.general-regulations.txt#L66)
  #
  # NOT ENCODED: 350.065(D)(1)(b), forward access, and here it does reach.
  # "All parking areas must be designed to allow vehicles to enter and exit the
  # roadway in a forward motion. However, this does not apply to parking areas
  # with one or two spaces and whose only access is on a non-arterial street."
  # The pod owes four, so the exception is a stall short twice over -- which is
  # the opposite of Gladstone, where the same rule starts at more than four and
  # this building sits exactly on the line. The fourth city to state it flat
  # rather than by street class, after Milwaukie, Happy Valley and Gresham. No
  # field holds it in any of the four, and it is satisfied here the same way it
  # is there: the site plan draws a rear court with a turning bay because the
  # typology says so, not because this layer asked.
  # (or/multnomah/wood-village/350.065.all-other-uses.txt#L85)
  #
  # READ AND DOES NOT REACH, so that nobody re-reads them: 350.065(E), interior
  # parking-area landscaping, which applies to "surface parking areas with more
  # than 10 spaces" and this building has four; the 22-foot garage setback in
  # Tables 210-3 and 220-3, which regulates a garage and the pod's parking is a
  # surface court; and 350.045's on-street-parking credit and its sentence that
  # "no additional parking spaces shall be required for conversion of a
  # detached single-unit dwelling to a triplex or quadplex", both of which can
  # only lower a requirement this screen already satisfies.

