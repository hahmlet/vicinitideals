label: Wood Village
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  This city speaks about housing two ways. Its residential zones list housing types by name in Tables
  210-2 and 220-2, down to "Attached or Detached Tri- or Quadplex". Everything else — commercial,
  town centre, manufacturing, the mixed-use industrial zone — states one row, Household Living, and
  leaves what that covers to WVDC 710.100. Reading only the first kind of table would leave two thirds
  of the city looking silent about dwellings when it is not.


  O, the Open Space zone, is not encoded and is not a gap in the reading. WVDC 260.200 names Table
  260-1 three times — outright uses, conditional uses, prohibited uses — and the table does not come
  down with the page under this extractor, so nothing here can say what it permits. Six lots, and the
  honest state is unread. The section is declared and stored anyway so the absence is checkable rather
  than remembered.


  PARKING, read 2026-08-20 and encoded as a layer default. Table 350-1A is headed "Minimum Required
  Parking Spaces in All Zones" and is stated by use category rather than by district: Household
  Living, "1 - 4 units", one space per unit. Four stalls is roughly 1,300 square feet of a site that
  also has to hold the pod and its access, which on the narrow lots this screen exists to find is
  routinely the difference between fitting and not.


  The resolved number does not move. OAR 660-046-0220 caps a city at one stall per unit and Wood
  Village asks exactly one, so the state row still wins the attribution at equality. What moves is
  what the number rests on: until now every lot in this city was screened against a ceiling on what
  the city MAY require, with nothing on file about what it does require, and a ceiling standing in
  for a rule is a rule nobody read.


  Two things in that table are read and not encoded, both because they can only loosen. The asterisk
  on the Household Living row grants a credit against the minimum for abutting on-street spaces at
  least twenty-two feet long, where the jurisdiction allows parking and clear of a required sight
  distance area -- fewer off-street stalls, never more, and nothing here holds the kerb. The same
  footnote adds that "no additional parking spaces shall be required for conversion of a detached
  single-unit dwelling to a triplex or quadplex", which is a conversion where this is new
  construction. Table 350-1B sets no maximum for Household Living in either column.


  MINIMUM DENSITY, also encoded now. Table 210-3 prints a "Minimum Number of Dwellings Per Net Acre"
  row -- .9 in LR12, 4.6 in LR7.5 -- and Table 220-3 prints 8.7 in its Duplex Triplex Quadplex
  column. A floor is a standard a lot can fail, and all three sat between the lot dimensions and the
  height unread. "Net acre" is defined nowhere in the fetched code, and the parenthesised (25%),
  (80%) and (.80) beside the figures are unexplained, so no denominator is stated: a gross acre is
  never smaller than a net one, so measuring against the lot''s own area computes a lower density,
  which is the stricter reading for a floor.


  The Town Center then had to state its own answer, because `like:` has no field list. Table 235-2
  hands three rows to MR2 by name -- lot size and dimensions, maximum lot coverage, minimum
  landscaping -- and states height and the four setbacks for itself. It prints no density row in
  either column and neither does any other section of Chapter 235, so encoding MR2''s floor would
  otherwise have handed the Town Center a standard its own table does not carry, off a pointer to a
  lot-size row.'
ingest:
  geoid: null
  juris_city_codes:
  - WOOD VILLAGE
  zoning_layer: zoning_wood_village
  zone_field: Labeling
  strip_lowercase_suffix: false
code:
  # The city moved to municipal.codes (woodvillage.municipal.codes), which
  # serves one leaf section per page, server-rendered; article pages are
  # tables of contents only. The cite basis for every zone is WVDC 210/220:
  # .310 housing types allowed, .320 development standards (Tables 210-3 /
  # 220-3/-4), .375/.355 middle-housing design standards. The housing-type
  # and design sections are prose and Y/N tables — number-sparse, so the
  # plausibility gate reads them as thin; read 2026-08-13, they are real.
  - id: "210.310"
    url: https://woodvillage.municipal.codes/WVDC/210.310
    title: "WVDC 210.310 - Housing Types Allowed (LR)"
    allow_thin: true
  - id: "210.320"
    url: https://woodvillage.municipal.codes/WVDC/210.320
    title: "WVDC 210.320 - Development Standards (LR)"
  - id: "210.375"
    url: https://woodvillage.municipal.codes/WVDC/210.375
    title: "WVDC 210.375 - Middle Housing Design Standards (LR)"
    allow_thin: true
  - id: "220.310"
    url: https://woodvillage.municipal.codes/WVDC/220.310
    title: "WVDC 220.310 - Housing Types Allowed (MR)"
    allow_thin: true
  - id: "220.320"
    url: https://woodvillage.municipal.codes/WVDC/220.320
    title: "WVDC 220.320 - Development Standards (MR)"
  - id: "220.355"
    url: https://woodvillage.municipal.codes/WVDC/220.355
    title: "WVDC 220.355 - Middle Housing Design Standards (MR)"
    allow_thin: true
  - id: "230.200"
    url: https://woodvillage.municipal.codes/WVDC/230.200
    title: "WVDC 230.200 - Primary Uses (Commercial Zones, Table 230-1)"
    allow_thin: true
  - id: "235.200"
    url: https://woodvillage.municipal.codes/WVDC/235.200
    title: "WVDC 235.200 - Primary Uses (Town Center Zone, Table 235-1)"
    allow_thin: true
  # Declared and stored ahead of the encoding that will cite it. Table 235-2
  # is printed here rather than in 235.310, and its five notes are captured and
  # deliberately left `unread` -- the Town Center zone is not encoded yet, and
  # a ruling written before the encoding it describes is a claim nobody can
  # check. Storing the document is what makes those five visible at all.
  - id: "235.300"
    url: https://woodvillage.municipal.codes/WVDC/235.300
    title: "WVDC 235.300 - Purpose (Town Center Zone, Table 235-2)"
    allow_thin: true
  - id: "235.310"
    url: https://woodvillage.municipal.codes/WVDC/235.310
    title: "WVDC 235.310 - Lot Size and Dimensional Standards (Town Center)"
    allow_thin: true
  - id: "235.320"
    url: https://woodvillage.municipal.codes/WVDC/235.320
    title: "WVDC 235.320 - Building Setbacks (Town Center)"
    allow_thin: true
  - id: "235.330"
    url: https://woodvillage.municipal.codes/WVDC/235.330
    title: "WVDC 235.330 - Height (Town Center)"
    allow_thin: true
  - id: "235.340"
    url: https://woodvillage.municipal.codes/WVDC/235.340
    title: "WVDC 235.340 - Floor Area Ratios (Town Center)"
    allow_thin: true
  - id: "235.390"
    url: https://woodvillage.municipal.codes/WVDC/235.390
    title: "WVDC 235.390 - Parking and Loading (Town Center)"
    allow_thin: true
  - id: "235.410"
    url: https://woodvillage.municipal.codes/WVDC/235.410
    title: "WVDC 235.410 - Concept Plan Regulating Diagram (Figure 235-1)"
    allow_thin: true
  - id: "235.420"
    url: https://woodvillage.municipal.codes/WVDC/235.420
    title: "WVDC 235.420 - Concept Plan Regulating Diagram Development Standards"
    allow_thin: true
  - id: "235.465"
    url: https://woodvillage.municipal.codes/WVDC/235.465
    title: "WVDC 235.465 - Open Space Requirement (Town Center)"
    allow_thin: true
  - id: "240.200"
    url: https://woodvillage.municipal.codes/WVDC/240.200
    title: "WVDC 240.200 - Primary Uses (Manufacturing Zones, Table 240-1)"
    allow_thin: true
  - id: "250.200"
    url: https://woodvillage.municipal.codes/WVDC/250.200
    title: "WVDC 250.200 - Primary Uses (Commercial/Industrial Mixed Use, Table 250-1)"
    allow_thin: true
  # Section 300 is a container -- eleven subsections of "additional use and
  # development regulations" that every use table in the city points at. Two
  # of them reach this building and both are here.
  - id: "350.045.required-spaces"
    url: https://woodvillage.municipal.codes/WVDC/350.045
    title: "WVDC 350.045 - Number of Required Spaces (Tables 350-1A, 350-1B)"
  - id: "390.020.applicability"
    url: https://woodvillage.municipal.codes/WVDC/390.020
    title: "WVDC 390.020 - Applicability (solid waste and recyclables storage)"
    # One sentence of scope. Fetched to establish an absence rather than
    # assume one: five or more units, and this building is four.
    allow_thin: true
  # Fetched and kept even though nothing is encoded from it. The section's
  # prose names Table 260-1 three times and the table itself does not come
  # down with the page, so the Open Space zone stays unread rather than
  # guessed -- and the document on disk is what makes that checkable.
  - id: "260.200"
    url: https://woodvillage.municipal.codes/WVDC/260.200
    title: "WVDC 260.200 - Primary Uses (Open Space Zone, Table 260-1)"
    allow_thin: true
  # The use category the non-residential tables answer in. Wood Village's
  # residential zones list housing types by name -- "Attached or Detached Tri-
  # or Quadplex" -- and its commercial, manufacturing and town centre zones do
  # not: they state one row, Household Living, and this is what that row means.
  - id: "710.100"
    url: https://woodvillage.municipal.codes/WVDC/710.100
    title: "WVDC 710.100 - Household Living (use category)"
    allow_thin: true
  - id: "230.310"
    url: https://woodvillage.municipal.codes/WVDC/230.310
    title: "WVDC 230.310 - Lot Size and Dimensional Standards (Table 230-2)"
    allow_thin: true
  - id: "230.315"
    url: https://woodvillage.municipal.codes/WVDC/230.315
    title: "WVDC 230.315 - Residential-Commercial Mixed Use Development"
    allow_thin: true
  # Declared and stored, cited by nothing. WVDC 230.390 is the NC design
  # standards chapter: Table 230-5 is required of all new development and
  # Table 230-6 is a menu a development must take ten points from. None of it
  # is a lot standard and none of it can refuse a lot, so nothing here encodes
  # a value from it -- but a GREEN in NC is a fitment answer and this is one of
  # the reasons that is not the same as an approval.
  - id: "230.390"
    url: https://woodvillage.municipal.codes/WVDC/230.390
    title: "WVDC 230.390 - Neighborhood Commercial (NC) Zone Design Standards"
    allow_thin: true
  - id: "230.330"
    url: https://woodvillage.municipal.codes/WVDC/230.330
    title: "WVDC 230.330 - Building Setbacks and Orientation"
    allow_thin: true
  - id: "230.335"
    url: https://woodvillage.municipal.codes/WVDC/230.335
    title: "WVDC 230.335 - Height"
    allow_thin: true
crossrefs:
  "300": >-
    Additional Use and Development Regulations, and the fourteen mentions are one sentence repeated in
    every use table in the city: "Additional regulations are listed in Section 300." It is a container
    rather than a chapter -- eleven subsections, 310 through 395 -- so the reference cannot be ruled on
    without reading what is in it. Read 2026-08-20. Two subsections reach this building. 350, Parking
    and Loading, is fetched and its Table 350-1A is now this layer''s parking default. 390, solid waste
    and recyclables storage, is fetched and does not reach it: 390.020 applies "to new multi-unit
    residential buildings containing five or more units", and this is four. The other nine are other
    use types or other procedures -- home occupations, group living, essential service providers,
    landscaping (330, reached only through the five-or-more-unit table), manufactured homes, mobile
    food units, the planned development district, signs and temporary uses.


    Worth recording that the code''s own pointers went stale in the renumbering. WVDC 230.310 footnote
    (5) reads "See Section 350 - Landscaping and Screening", and after Ord. 2-2022 Section 350 is
    Parking and Loading while landscaping is 330. The footnote names the right subject and the wrong
    number, which is exactly the shape of reference that sends a reader to the wrong chapter and looks
    settled when they get there.
  "640": >-
    Non-conforming uses. Every mention is the third paragraph of a zone''s use section: "Legally
    established uses and development which existed at the time this Code was adopted and would
    otherwise be prohibited, are subject to additional regulations in Section 640." A building that
    already exists, not one this screen places.
  "220.400": >-
    Cottage housing. Its mentions are the asterisk under Table 210-2 and the same reference in Table
    220-2, both hanging off the Cottage Housing row. Cottage housing is a separate housing type in
    those tables from "Attached or Detached Tri- or Quadplex", which carries a bare Y.
  "340.010": >-
    Manufactured homes. The mention is a row label -- "Manufactured Home (See Section 340.010): Y Y" --
    in the same table that lists "Attached or Detached Tri- or Quadplex" as its own row with no
    reference. A factory-built pod is not thereby a manufactured home: the table decides which row a
    building takes, and this one is the quadplex row.
  "340.020": >-
    Manufactured home parks, and the mention is the row for them in Table 220-2. A different housing
    type in the same table, and prohibited in MR4 besides.
  "395": >-
    Accessory dwelling units, cited from the ADU row of Tables 210-2 and 220-2. An accessory dwelling
    is by definition subordinate to a primary one; this building is four primary dwellings.
  "330": >-
    Landscaping and Screening. Its one binding mention is footnote (2) to Table 220-4, and Table 220-4
    is headed "Development Standards for Multi-Dwelling Structures in the MR2 Zone" -- five units and
    up. A quadplex takes Table 220-3, which has no landscaping row. Not fetched for that reason; the
    NC zone''s five percent is encoded from its own table and points here for how rather than how much.
  "660": >-
    Variance. Its mention is WVDC 220.320(B): "In the MR4 & MR2 zones reductions to the minimum lot
    size & dimensions for detached single dwelling units may be approved through the variance process."
    Detached single dwelling units. This pod is four attached ones, so the exception is not available
    to it and the base lot minimum stands.

defaults:
  # Table 350-1A is headed "Minimum Required Parking Spaces in All Zones" and
  # is stated by use category rather than by district, so it belongs to the
  # layer rather than to any zone. Household Living, "1 - 4 units": one space
  # per unit. Four units, four stalls, about 1,300 sq ft of a site that also
  # has to hold the pod and its access.
  #
  # The state's OAR 660-046-0220 ceiling is also one per unit, so the resolved
  # number does not move. What moves is what it rests on: until now every Wood
  # Village lot was screened against a state cap on what the city MAY require,
  # with nothing on file about what it does require. A ceiling standing in for
  # a rule is a rule nobody read.
  parking_min_per_unit:
    value: 1
    cite: "WVDC 350.045, Table 350-1A -- Household Living, 1-4 units"
    url: https://woodvillage.municipal.codes/WVDC/350.045
    retrieved: '2026-08-20'
    quote: "or/multnomah/wood-village/350.045.required-spaces.txt#L94-L95,L97"

zones:
  NC:
    section: ["230.200", "230.310", "230.315", "230.330", "230.335", "710.100"]
    cite_default:
      cite: WVDC 230.200 Table 230-1 (Uses in Commercial Zones); 710.100 (Ord. 3-2021)
      url: https://woodvillage.municipal.codes/WVDC/230.200
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/wood-village/230.200.txt#L72-L75,L117-L118"
      variants:
        # Not a prohibition, and not a bare hearing either. Table 230-1 reads
        # CU, and 230.315.A.1 then says residential is permitted only as part
        # of a mixed use development -- so both have to be held before the use
        # opens. The pod holds neither, which is why the base false is what a
        # screen sees.
        - value: true
          when: [conditional_use, mixed_use]
          quote: "or/multnomah/wood-village/230.200.txt#L72-L75,L117-L118"
    # Table 230-2 states no lot standard at all, twice: 230.310.A in prose --
    # "There is no minimum lot size or dimension for development of land or
    # creation of new lots in commercial zones" -- and then footnote (1) on the
    # table itself, which repeats it for residential uses specifically. Three
    # rows reading None, and the footnote is what makes them a read absence
    # rather than an empty cell.
    min_lot_sqft:
      exempt: true
      quote: "or/multnomah/wood-village/230.310.txt#L60,L64-L67,L84"
    min_lot_width_ft:
      exempt: true
      quote: "or/multnomah/wood-village/230.310.txt#L60,L64-L65,L68,L84"
    min_lot_depth_ft:
      exempt: true
      quote: "or/multnomah/wood-village/230.310.txt#L60,L64-L65,L69,L84"
    # "45 - 55 feet (see Figure 230-3)". The table prints a range and hands the
    # number to a map this system cannot read, so 45 is encoded -- the end of
    # the range that is true everywhere in the zone. A 26-foot pod clears it,
    # and clears the 35-foot step-down too, so the unread figure does not
    # change any verdict here. See the zone notes.
    max_height_ft:
      value: 45
      quote: "or/multnomah/wood-village/230.310.txt#L64-L65,L70,L86"
    # 3 feet minimum and 10 feet maximum, one row. The maximum is the standard
    # that is actually hard to meet: 230.330.B.3.a asks 75 percent of the
    # ground-level street-facing facade to sit within ten feet of the street
    # lot line, which is a facade-length test the screen does not run.
    setback_front_ft:
      value: 3
      quote: "or/multnomah/wood-village/230.310.txt#L64-L65,L73"
    setback_front_max_ft:
      value: 10
      quote: "or/multnomah/wood-village/230.310.txt#L64-L65,L73"
    setback_side_ft:
      exempt: true
      quote: "or/multnomah/wood-village/230.310.txt#L64-L65,L74"
    setback_rear_ft:
      exempt: true
      quote: "or/multnomah/wood-village/230.310.txt#L64-L65,L75"
    min_landscaped_pct:
      value: 5
      quote: "or/multnomah/wood-village/230.310.txt#L64-L65,L78,L88"
    notes: >-
      Table 230-1 reads CU on the Household Living row -- conditional use review required -- against Y for Mixed Use Residential and Commercial. So a pod on an NC lot is not refused; it needs a hearing. That is a different answer from a prohibition and the traffic light can only say so if the code's own distinction survives the encoding, which is why the base is false and the relief carries the true. The row that answers is Household Living, which 710.100 defines as "the residential occupancy of a dwelling unit or a structure by a household" with an average stay of thirty days or more. It names no housing type and excludes none, so a four-unit attached townhome is inside it -- which is how the non-residential zones speak about dwellings at all. The residential zones do the opposite and list types by name. The definition is quoted at or/multnomah/wood-village/710.100.txt#L56,L60.


      Three things in this zone are read and cannot be screened, and they are
      recorded here rather than encoded as numbers nobody can check. Figure
      230-3 is a map: WVDC 230.335.B puts the maximum base height in it and
      Table 230-2 prints the range that map spans, 45 to 55 feet. 230.335.C
      steps that base down -- 35 feet within twenty-five feet of an LR7.5 site,
      45 within twenty-five feet of an MR2 site, 45 within fifteen feet of a
      lot line across a local street or alley from either -- and each applies to
      a PORTION of the site, which is a geometry this field cannot hold. And
      230.335.A sets a minimum height of eighteen feet on Halsey Street. The pod
      is twenty-six feet, so it is over the floor and under every ceiling, which
      is why 45 is safe to encode: no reading of the unread map changes the
      answer for this building.


      Two more limits bind development rather than the lot. 230.315.A.2 caps
      ground-floor residential at fifty percent of a site's Halsey Street
      frontage, and 230.330.B.3.a asks seventy-five percent of the ground-level
      street-facing facade to meet the ten-foot maximum setback. Both are
      facade-length tests against a specific street; neither is a lot standard,
      and a fitment screen that reported GREEN on an NC lot would be reporting
      that the building fits, not that this design of it would be approved.
      WVDC 230.390 is the third of those: every new development in NC must
      meet Table 230-5 and take ten points off the menu in Table 230-6.
  C/I:
    section: ["250.200", "710.100"]
    cite_default:
      cite: WVDC 250.200 Table 250-1 (Uses in Commercial/Industrial Mixed Use Zone); 710.100
      url: https://woodvillage.municipal.codes/WVDC/250.200
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/wood-village/250.200.txt#L86-L89,L128-L132"
    notes: >-
      Table 250-1 has one column and reads N on both residential rows, Household Living and Group Living. The zone exists to hold Metro Title 4 industrial land, and the table's limited-use notes are about how much retail may face the street rather than about housing. The row that answers is Household Living, which 710.100 defines as "the residential occupancy of a dwelling unit or a structure by a household" with an average stay of thirty days or more. It names no housing type and excludes none, so a four-unit attached townhome is inside it -- which is how the non-residential zones speak about dwellings at all. The residential zones do the opposite and list types by name. The definition is quoted at or/multnomah/wood-village/710.100.txt#L56,L60.
  GM:
    section: ["240.200", "710.100"]
    cite_default:
      cite: WVDC 240.200 Table 240-1 (Uses in Manufacturing Zones); 710.100
      url: https://woodvillage.municipal.codes/WVDC/240.200
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/wood-village/240.200.txt#L90-L94,L132-L136"
    notes: >-
      Table 240-1 reads N on Household Living and on Group Living in both manufacturing columns. General Manufacturing permits no dwelling of any kind, not even the caretaker unit some industrial codes carry. The row that answers is Household Living, which 710.100 defines as "the residential occupancy of a dwelling unit or a structure by a household" with an average stay of thirty days or more. It names no housing type and excludes none, so a four-unit attached townhome is inside it -- which is how the non-residential zones speak about dwellings at all. The residential zones do the opposite and list types by name. The definition is quoted at or/multnomah/wood-village/710.100.txt#L56,L60.
  LM:
    section: ["240.200", "710.100"]
    cite_default:
      cite: WVDC 240.200 Table 240-1 (Uses in Manufacturing Zones); 710.100
      url: https://woodvillage.municipal.codes/WVDC/240.200
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/wood-village/240.200.txt#L90-L94,L132-L136"
    notes: >-
      Table 240-1 reads N on Household Living and on Group Living in both manufacturing columns. Light Manufacturing is the looser of the two on retail and office and is no different on housing. The row that answers is Household Living, which 710.100 defines as "the residential occupancy of a dwelling unit or a structure by a household" with an average stay of thirty days or more. It names no housing type and excludes none, so a four-unit attached townhome is inside it -- which is how the non-residential zones speak about dwellings at all. The residential zones do the opposite and list types by name. The definition is quoted at or/multnomah/wood-village/710.100.txt#L56,L60.
  TC:
    section: ["235.200", "235.300", "235.310", "235.320", "235.330", "235.340",
              "235.390", "235.410", "235.420", "235.465", "710.100"]
    cite_default:
      cite: WVDC 235.200 Table 235-1 (Uses in Town Center Zone); 235.300 Table 235-2 (Development Standards in Town Center Zone)
      url: https://woodvillage.municipal.codes/WVDC/235.300
      retrieved: '2026-08-19'
    # Table 235-2's residential column hands lot size, coverage and landscaping
    # to the MR2 zone by name -- "Same as MR2 zone (see Tables 220-3 and
    # 220-4)" -- and states height and setbacks for itself. The reference is
    # the encoding rather than a copy: MR2 amended is TC amended, and every
    # value resolved through this pointer still cites the 220 section it was
    # actually read from.
    like:
      zone: MR 2
      wins: local
      cite: WVDC 235.300 Table 235-2, "Lot size and dimensions" and "Maximum lot coverage" rows
      quote: "or/multnomah/wood-village/235.300.txt#L68-L71,L77"
    quadplex_allowed:
      value: true
      quote: "or/multnomah/wood-village/235.200.txt#L60,L66,L68"
    min_density_du_per_acre:
      # Stated here because the pointer above has no field list. Table 235-2
      # hands three rows to MR2 by name -- lot size and dimensions, maximum lot
      # coverage, minimum landscaping -- and states height and the four
      # setbacks for itself. It has no density row at all, in either column,
      # and neither does any other section of Chapter 235. So the day MR2's
      # density floor was encoded, the Town Center silently acquired a standard
      # its own table does not print, and a lot here would have been measured
      # against 8.7 dwellings to the net acre on the strength of a reference to
      # a lot-size row.
      #
      # The exemption is the table's own list of what a Town Center development
      # is held to. A complete enumeration that omits density is the code
      # saying there is none, which is a different sentence from nobody having
      # looked.
      exempt: true
      cite: "WVDC 235.300, Table 235-2 -- the Town Center's own list of development standards, which has no density row"
      quote: "or/multnomah/wood-village/235.300.txt#L68-L77"
    # 35 feet in the residential column against 115 in the nonresidential one,
    # which is the widest split in this city's tables. Footnote (2) hangs off
    # the 115 and not off the 35.
    max_height_ft:
      value: 35
      quote: "or/multnomah/wood-village/235.300.txt#L68-L69,L72"
    setback_front_ft:
      value: 10
      quote: "or/multnomah/wood-village/235.300.txt#L68-L69,L73"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/multnomah/wood-village/235.300.txt#L68-L69,L74"
    # Five feet, flat. MR2's townhouse column next door allows zero on the
    # attached side and Table 235-2 does not repeat it, so the pod is charged
    # the five on both of its side lot lines here. That costs nothing for a
    # single building on a single lot -- the four units share walls inside one
    # 56-foot structure -- and it is what would bind if the same four units
    # were ever divided onto unit lots.
    setback_side_ft:
      value: 5
      quote: "or/multnomah/wood-village/235.300.txt#L68-L69,L75"
    setback_rear_ft:
      value: 15
      quote: "or/multnomah/wood-village/235.300.txt#L68-L69,L76"
    # 235.465, and it is a Development Plan standard rather than a lot one:
    # twenty percent of the plan area, which may be satisfied on land the
    # applicant holds elsewhere and need not be contiguous. Encoded because a
    # screen that ignores it reports a lot as full when a fifth of it is
    # spoken for; read the zone notes before treating a miss here as fatal.
    open_space_min_pct:
      value: 20
      quote: "or/multnomah/wood-village/235.465.txt#L56,L60"
    notes: >-
      Table 235-1 reads Y on the Household Living row, and 710.100 is what says
      that row covers a four-unit attached townhome: "the residential occupancy
      of a dwelling unit or a structure by a household", thirty days or longer,
      naming no housing type and excluding none.


      This is the one zone in the city that does not work lot by lot, and a
      GREEN here means less than it does anywhere else. WVDC 235.490 runs Town
      Center development through a Development Plan; 235.410 organises every
      existing and future street into one of five types on Figure 235-1, the
      Concept Plan Regulating Diagram, and 235.420 requires intersections,
      gateways and public plazas at locations shown on it. Table 235-5 then
      states building frontage, ground floor height, transparency, entry door
      and weather protection standards by the street type a parcel fronts.
      Figure 235-1 is a diagram and Table 235-5 is keyed to it, so neither is
      readable here, and a parcel's street type -- which decides its frontage
      requirements -- is not a fact this system holds.


      Two more standards belong to the plan rather than the lot. 235.340 asks a
      Development Plan to show a minimum 0.4 floor area ratio can be achieved
      on the areas set aside for NONRESIDENTIAL uses at full build-out, which
      is a phasing test on a mixed programme and not a ratio a residential-only
      lot has to meet. 235.390 hands parking to Section 350 "except as modified
      in an approved Development Plan", and allows on-street, nearby public and
      shared stalls to count -- so the state parking cap this layer inherits is
      a ceiling the zone can and does relax.


      What is encoded here is therefore the dimensional envelope Table 235-2
      states, and nothing about whether a Development Plan would be approved.
      That is the honest half, it is the half a fitment screen exists to
      answer, and 167 lots is too many to leave unread because the other half
      is out of reach.
