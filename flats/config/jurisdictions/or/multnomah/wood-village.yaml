label: Wood Village
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  This city speaks about housing two ways. Its residential zones list housing types by name in Tables
  210-2 and 220-2, down to "Attached or Detached Tri- or Quadplex". Everything else — commercial,
  town centre, manufacturing, the mixed-use industrial zone — states one row, Household Living, and
  leaves what that covers to WVDC 710.100. Reading only the first kind of table would leave two thirds
  of the city looking silent about dwellings when it is not.


  O, the Open Space zone, is not encoded and is not a gap in the reading. WVDC 260.200 names Table
  260-1 three times — outright uses, conditional uses, prohibited uses — and the table does not come
  down with the page under this extractor, so nothing here can say what it permits. Six lots, and the
  honest state is unread. The section is declared and stored anyway so the absence is checkable rather
  than remembered.'
ingest:
  geoid: null
  juris_city_codes:
  - WOOD VILLAGE
  zoning_layer: zoning_wood_village
  zone_field: Labeling
  strip_lowercase_suffix: false
code:
  # The city moved to municipal.codes (woodvillage.municipal.codes), which
  # serves one leaf section per page, server-rendered; article pages are
  # tables of contents only. The cite basis for every zone is WVDC 210/220:
  # .310 housing types allowed, .320 development standards (Tables 210-3 /
  # 220-3/-4), .375/.355 middle-housing design standards. The housing-type
  # and design sections are prose and Y/N tables — number-sparse, so the
  # plausibility gate reads them as thin; read 2026-08-13, they are real.
  - id: "210.310"
    url: https://woodvillage.municipal.codes/WVDC/210.310
    title: "WVDC 210.310 - Housing Types Allowed (LR)"
    allow_thin: true
  - id: "210.320"
    url: https://woodvillage.municipal.codes/WVDC/210.320
    title: "WVDC 210.320 - Development Standards (LR)"
  - id: "210.375"
    url: https://woodvillage.municipal.codes/WVDC/210.375
    title: "WVDC 210.375 - Middle Housing Design Standards (LR)"
    allow_thin: true
  - id: "220.310"
    url: https://woodvillage.municipal.codes/WVDC/220.310
    title: "WVDC 220.310 - Housing Types Allowed (MR)"
    allow_thin: true
  - id: "220.320"
    url: https://woodvillage.municipal.codes/WVDC/220.320
    title: "WVDC 220.320 - Development Standards (MR)"
  - id: "220.355"
    url: https://woodvillage.municipal.codes/WVDC/220.355
    title: "WVDC 220.355 - Middle Housing Design Standards (MR)"
    allow_thin: true
  - id: "230.200"
    url: https://woodvillage.municipal.codes/WVDC/230.200
    title: "WVDC 230.200 - Primary Uses (Commercial Zones, Table 230-1)"
    allow_thin: true
  - id: "235.200"
    url: https://woodvillage.municipal.codes/WVDC/235.200
    title: "WVDC 235.200 - Primary Uses (Town Center Zone, Table 235-1)"
    allow_thin: true
  - id: "240.200"
    url: https://woodvillage.municipal.codes/WVDC/240.200
    title: "WVDC 240.200 - Primary Uses (Manufacturing Zones, Table 240-1)"
    allow_thin: true
  - id: "250.200"
    url: https://woodvillage.municipal.codes/WVDC/250.200
    title: "WVDC 250.200 - Primary Uses (Commercial/Industrial Mixed Use, Table 250-1)"
