label: Wood Village
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  This city speaks about housing two ways. Its residential zones list housing types by name in Tables
  210-2 and 220-2, down to "Attached or Detached Tri- or Quadplex". Everything else — commercial,
  town centre, manufacturing, the mixed-use industrial zone — states one row, Household Living, and
  leaves what that covers to WVDC 710.100. Reading only the first kind of table would leave two thirds
  of the city looking silent about dwellings when it is not.


  O, the Open Space zone, is not encoded and is not a gap in the reading. WVDC 260.200 names Table
  260-1 three times — outright uses, conditional uses, prohibited uses — and the table does not come
  down with the page under this extractor, so nothing here can say what it permits. Six lots, and the
  honest state is unread. The section is declared and stored anyway so the absence is checkable rather
  than remembered.


  PARKING, read 2026-08-20 and encoded as a layer default. Table 350-1A is headed "Minimum Required
  Parking Spaces in All Zones" and is stated by use category rather than by district: Household
  Living, "1 - 4 units", one space per unit. Four stalls is roughly 1,300 square feet of a site that
  also has to hold the pod and its access, which on the narrow lots this screen exists to find is
  routinely the difference between fitting and not.


  The resolved number does not move. OAR 660-046-0220 caps a city at one stall per unit and Wood
  Village asks exactly one, so the state row still wins the attribution at equality. What moves is
  what the number rests on: until now every lot in this city was screened against a ceiling on what
  the city MAY require, with nothing on file about what it does require, and a ceiling standing in
  for a rule is a rule nobody read.


  Two things in that table are read and not encoded, both because they can only loosen. The asterisk
  on the Household Living row grants a credit against the minimum for abutting on-street spaces at
  least twenty-two feet long, where the jurisdiction allows parking and clear of a required sight
  distance area -- fewer off-street stalls, never more, and nothing here holds the kerb. The same
  footnote adds that "no additional parking spaces shall be required for conversion of a detached
  single-unit dwelling to a triplex or quadplex", which is a conversion where this is new
  construction. Table 350-1B sets no maximum for Household Living in either column.


  MINIMUM DENSITY, also encoded now. Table 210-3 prints a "Minimum Number of Dwellings Per Net Acre"
  row -- .9 in LR12, 4.6 in LR7.5 -- and Table 220-3 prints 8.7 in its Duplex Triplex Quadplex
  column. A floor is a standard a lot can fail, and all three sat between the lot dimensions and the
  height unread. "Net acre" is defined nowhere in the fetched code, and the parenthesised (25%),
  (80%) and (.80) beside the figures are unexplained, so no denominator is stated: a gross acre is
  never smaller than a net one, so measuring against the lot''s own area computes a lower density,
  which is the stricter reading for a floor.


  The Town Center then had to state its own answer, because `like:` has no field list. Table 235-2
  hands three rows to MR2 by name -- lot size and dimensions, maximum lot coverage, minimum
  landscaping -- and states height and the four setbacks for itself. It prints no density row in
  either column and neither does any other section of Chapter 235, so encoding MR2''s floor would
  otherwise have handed the Town Center a standard its own table does not carry, off a pointer to a
  lot-size row.


  PARKING GEOMETRY, read 2026-08-30, and the eleventh city the site plan can dimension. The
  2026-08-20 reading above answered how many spaces; this one answers how big, and the gap between
  the two questions is the whole point. Section 350 splits its development standards into an article
  for one and two unit dwellings (350.050-350.055) and one for everything else (350.060-350.065), and
  only the second states an aisle. So which article reaches a quadplex is not a technicality: on one
  branch the city cannot be laid out at all.


  It is settled by elimination with a defined noun at the end of it. 350.065(A) reaches "all vehicle
  areas whether required or excess parking, except for residential parking areas subject to the
  standards of Section 350.050 through 350.055", and 350.055(A) names its own: "houses, attached
  houses, duplexes, and manufactured homes". WVDC 720.030 defines all four and the building. A HOUSE
  is "a detached dwelling unit located on its own lot"; a TOWNHOUSE -- which the same definition says
  is "also commonly called a rowhouse, attached house, or common-wall house" -- has each unit "on an
  individual lot or parcel"; a DUPLEX is two units; a MANUFACTURED HOME is a transportable HUD
  structure. A QUADPLEX is "a structure that contains four (4) primary dwelling units on one (1)
  lot", which is the pod exactly, and a MULTI-DWELLING STRUCTURE does not start until five. Tables
  210-2 and 220-3 list "Attached or Detached Tri- or Quadplex" beside Detached House, Duplex and
  Townhouse rather than inside any of them. Same elimination West Linn needed; there the noun was
  missing, here it is written down.


  The reading is safe because THE STALL COMES OUT THE SAME EITHER WAY. 350.055(C) sets the one and
  two unit stall at "9 feet by 19 feet" and Table 350-3''s 90-degree Standard row is 9 by 19.
  Whichever article a reviewer thinks applies, the rectangle does not move. What the elimination
  decides is the aisle -- 12 feet one way and 24 two way, the same figure at every angle from
  parallel to 90 -- and three rules that turn out not to reach: 350.055(B) would ban parking within
  the first ten feet of a front lot line and cap the front yard at 40 percent paved, and 350.055(C)''s
  nine-foot residential driveway is not this building''s either.


  Nothing states a drive or a cut. 350.030(D) is the only sentence in Section 350 about the width of
  an access point and it states no width: access points "shall be the minimum necessary" and curb
  cuts "shall be designed to established City standards", naming no document. That is a weaker
  version of the Clackamas County problem -- there at least the drawing has a number on it -- so both
  fall to the design defaults, as they do in Fairview, Gladstone, Oregon City and Portland.


  The ceiling is now read rather than borrowed. Table 350-1B is titled "Maximum Parking Ratios",
  caps a restaurant at 23 spaces per 1,000 sq ft, one with a drive-through at 15, a medical office at
  5.9 and a college at 0.3, and states a second tighter column within a quarter mile of 20-minute
  transit. Against Household Living it prints "no maximum" in both columns. Built, and pointed away
  from this building in words.'
