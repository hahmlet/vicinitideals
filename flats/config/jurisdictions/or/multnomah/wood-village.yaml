      # The exemption is the table's own list of what a Town Center development
      # is held to. A complete enumeration that omits density is the code
      # saying there is none, which is a different sentence from nobody having
      # looked.
      exempt: true
      cite: "WVDC 235.300, Table 235-2 -- the Town Center's own list of development standards, which has no density row"
      quote: "or/multnomah/wood-village/235.300.txt#L68-L77"
    # 35 feet in the residential column against 115 in the nonresidential one,
    # which is the widest split in this city's tables. Footnote (2) hangs off
    # the 115 and not off the 35.
    max_height_ft:
