    queue: missed
    outcome: duplicate
    note: >-
      Every statement here is either already held or already refused on the record, which is what
      makes this a bookkeeping card rather than an alarm. Table 350-3's ninety-degree standard row
      is the one this file encodes -- nine feet wide, nineteen deep, twelve-foot one-way and
      twenty-four-foot two-way aisles -- and the uncited rows are the compact, disabled and angled
      alternatives, deliberately not taken: 350.065(D)(2)(b) requires only half the required
      spaces to meet the standard dimensions, so a court drawn to the standard stall everywhere is
      the strict branch and fits wherever the mixed court fits. Table 350-2's third row, the
      parking-area setback against an LR or MR lot line, already carries a NOT ENCODED comment in
      this file with its own reasoning and its own citation to these exact lines. The interior
      landscaping options are for surface parking areas of more than ten spaces and the pod has
      four, which is also already recorded.
    fingerprint: 9288dffabfa60dc1

