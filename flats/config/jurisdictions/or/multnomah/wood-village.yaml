    # Five feet, flat. MR2's townhouse column next door allows zero on the
    # attached side and Table 235-2 does not repeat it, so the pod is charged
    # the five on both of its side lot lines here. That costs nothing for a
    # single building on a single lot -- the four units share walls inside one
    # 56-foot structure -- and it is what would bind if the same four units
    # were ever divided onto unit lots.
    setback_side_ft:
      value: 5
      quote: "or/multnomah/wood-village/235.300.txt#L68-L69,L75"
    setback_rear_ft:
      value: 15
      quote: "or/multnomah/wood-village/235.300.txt#L68-L69,L76"
    # 235.465, and it is a Development Plan standard rather than a lot one:
    # twenty percent of the plan area, which may be satisfied on land the
    # applicant holds elsewhere and need not be contiguous. Encoded because a
    # screen that ignores it reports a lot as full when a fifth of it is
    # spoken for; read the zone notes before treating a miss here as fatal.
    open_space_min_pct:
      value: 20
      quote: "or/multnomah/wood-village/235.465.txt#L56,L60"
    notes: >-
      Table 235-1 reads Y on the Household Living row, and 710.100 is what says
      that row covers a four-unit attached townhome: "the residential occupancy
      of a dwelling unit or a structure by a household", thirty days or longer,
      naming no housing type and excluding none.


      This is the one zone in the city that does not work lot by lot, and a
      GREEN here means less than it does anywhere else. WVDC 235.490 runs Town
      Center development through a Development Plan; 235.410 organises every
      existing and future street into one of five types on Figure 235-1, the
      Concept Plan Regulating Diagram, and 235.420 requires intersections,
      gateways and public plazas at locations shown on it. Table 235-5 then
      states building frontage, ground floor height, transparency, entry door
      and weather protection standards by the street type a parcel fronts.
      Figure 235-1 is a diagram and Table 235-5 is keyed to it, so neither is
      readable here, and a parcel's street type -- which decides its frontage
      requirements -- is not a fact this system holds.


      Two more standards belong to the plan rather than the lot. 235.340 asks a
      Development Plan to show a minimum 0.4 floor area ratio can be achieved
      on the areas set aside for NONRESIDENTIAL uses at full build-out, which
      is a phasing test on a mixed programme and not a ratio a residential-only
      lot has to meet. 235.390 hands parking to Section 350 "except as modified
      in an approved Development Plan", and allows on-street, nearby public and
      shared stalls to count -- so the state parking cap this layer inherits is
      a ceiling the zone can and does relax.


      What is encoded here is therefore the dimensional envelope Table 235-2
      states, and nothing about whether a Development Plan would be approved.
      That is the honest half, it is the half a fitment screen exists to
      answer, and 167 lots is too many to leave unread because the other half
      is out of reach.
