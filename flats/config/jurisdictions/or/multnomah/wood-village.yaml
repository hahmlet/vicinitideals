  # Section 300 is a container -- eleven subsections of "additional use and
  # development regulations" that every use table in the city points at. Two
  # of them reach this building and both are here.
  - id: "350.045.required-spaces"
    url: https://woodvillage.municipal.codes/WVDC/350.045
    title: "WVDC 350.045 - Number of Required Spaces (Tables 350-1A, 350-1B)"
  # SECTION 350 IS FOUR ARTICLES AND ONLY ONE OF THEM DIMENSIONS THIS
  # BUILDING'S PARKING, so all three that decide which are stored. 350.045
  # above answers how many spaces; these answer how big, and until 2026-08-30
  # only the first question had been asked here. That is the split this corpus
  # keeps re-learning: a city can require one space per unit and regulate the
  # size of it in a different article that nothing points at.
  #
  # 350.030 is the chapter's own scope -- "all parking areas in all zones,
  # whether required by the code or put in for the convenience of property
  # owners" -- and holds the curb-cut sentence that goes nowhere.
  - id: "350.030.general-regulations"
    url: https://woodvillage.municipal.codes/WVDC/350.030
    title: "WVDC 350.030 - General Regulations (Motor Vehicle Parking)"
    # Five lettered paragraphs of scope and prose. One dimensioned standard in
    # the whole section (250 feet, for off-site nonresidential parking), which
    # is what the plausibility gate counts. Read 2026-08-30.
    allow_thin: true
  # 350.055 is here to be EXCLUDED, and a document fetched to prove an
  # exclusion has to be as real as one fetched to prove a rule. Its own first
  # sentence is the evidence: "The regulations of this section apply to houses,
  # attached houses, duplexes, and manufactured homes." Storing it is what
  # makes the elimination checkable instead of asserted -- and it also holds
  # the two rules that would have bitten hardest if it did reach: parking
  # banned in the first 10 feet from a front lot line, and a 9-foot driveway.
  - id: "350.055.one-and-two-unit"
    url: https://woodvillage.municipal.codes/WVDC/350.055
    title: "WVDC 350.055 - General Regulations (One and Two Unit Dwellings)"
    allow_thin: true
  # And this is the article that does reach it. Table 350-3 states a stall and
  # both aisle widths by parking angle; Table 350-2 states the setbacks between
  # a parking area and each kind of lot line.
  - id: "350.065.all-other-uses"
    url: https://woodvillage.municipal.codes/WVDC/350.065
    title: "WVDC 350.065 - General Regulations (All Other Uses; Tables 350-2, 350-3)"
  # The city's whole glossary, fetched for one word and kept for the rest.
  # QUADPLEX is defined here as "a structure that contains four (4) primary
  # dwelling units on one (1) lot", which is the pod exactly, and HOUSE and
  # TOWNHOUSE are both defined as one dwelling unit on its own lot -- which is
  # what takes this building out of 350.055 and leaves it in 350.065.
  - id: "720.030.definitions"
    url: https://woodvillage.municipal.codes/WVDC/720.030
    title: "WVDC 720.030 - Definitions"
    # Thin on purpose and read before the flag was set: 53,000 characters of
    # text, of which 16 lines out of 643 carry a section number or a
    # dimension. That is what a glossary looks like -- it is the one chapter
    # in a code whose job is to state no standards at all, so the ratio the
    # plausibility gate measures is the wrong measure for it. The document is
    # the alphabet A through Z with a RESIDENTIAL STRUCTURE TYPES block inside
    # the R's, and every word this layer leans on is in it.
    allow_thin: true
  - id: "390.020.applicability"
    url: https://woodvillage.municipal.codes/WVDC/390.020
    title: "WVDC 390.020 - Applicability (solid waste and recyclables storage)"
    # One sentence of scope. Fetched to establish an absence rather than
    # assume one: five or more units, and this building is four.
