  "230.335.txt#230.335":
    queue: chapter
    outcome: nothing_here
    note: >-
      Wood Village's commercial-zone height section, and it is one of the few places in this
      corpus that states a MINIMUM building height -- eighteen feet or one and a half storeys for
      all new buildings on Halsey Street -- which is the field gap already standing against seven
      jurisdictions. It does not bite here: the pod is 26 feet and two storeys, comfortably over
      both limbs. Nor do the step-downs: 35 feet within 25 feet of a site zoned LR7.5, 45 feet
      within 25 feet of MR2, and 45 within 15 feet of a lot line across a local street or alley
      from either, all of them ceilings well above 26. The projections allowance for skylights and
      steeples relaxes. So this section is inert twice over, and the minimum height is recorded
      rather than encoded because the number that matters about it is the pod's, not the lot's.
    fingerprint: a7d962e80be71cac
  "230.390.txt#230.390":
    queue: chapter
    outcome: nothing_here
    note: >-
      Neighborhood Commercial zone design standards, and the sixteen measuring lines on this card
      are almost all inside Table 230-6, which names itself: "Menu of Options for Additional
      Requirements", with a point value printed against each option. That is the design-menu shape
      -- the applicant buys points however is cheapest -- and the options this card surfaced are
      exactly the ones that would have looked binding out of context: an 800 square foot plaza at
      3 points, an 800 square foot outdoor recreation area with a minimum dimension of 20 by 20 at
      1 point, a 15-foot ground floor at 2 points, a mural of at least 60 square feet, a water
      feature of at least 25. None of them is required of anybody. The ground-floor window
      standards above the table are facade treatments, and the five-foot setback and 25 percent
      glazing they ask of ground-floor dwelling units apply to a residential ground floor in a
      commercial building. Worth noting the zone as well: NC holds quadplex_allowed false at base
      in this layer, with a conditional-use relief carrying the true, so even a binding standard
      here would be reaching a lot the screen does not grade green on its own.
    fingerprint: 38a1a0a6710419a8
  "350.055.one-and-two-unit.txt#350.055":
    queue: chapter
    outcome: nothing_here
    note: >-
      Wood Village's parking standards for one and two unit dwellings, and the applicability
      sentence is the whole ruling: "the regulations of this section apply to HOUSES, ATTACHED
      HOUSES, DUPLEXES, AND MANUFACTURED HOMES." No triplex, no fourplex. THIS IS WORTH MORE THAN
      A CLOSE, because the section is visibly Portland's 33.266.120 copied into a small city's
      code -- same 10-foot exclusion from the front lot line, same 40 percent cap on the land
      between the front lot line and the front building line, same 9-foot private driveway -- and
      Portland's version names fourplexes in its applicability list while Wood Village's stops at
      duplexes. Two codes with the same words and different reach, which is exactly the trap a
      reader falls into by recognising a paragraph instead of reading its first line. The stall it
      states, 9 by 19, is also not ours; this layer's defaults carry Wood Village's stall width,
      stall depth and both aisle widths from the general parking regulations that a quadplex
      actually goes to.
    fingerprint: e76a39c67f1cdf08
  "720.030.definitions.txt#720.030":
    queue: chapter
    outcome: nothing_here
    note: >-
      Two definitions. COTTAGE HOUSING -- "a grouping of no fewer than four detached dwelling
      units per acre, each with a footprint of less than nine hundred square feet" -- is the
      state's cottage cluster wording again, the third city in this corpus to carry it and the
      third time it has been ruled the same way: detached units around a common courtyard is not
      one attached four-unit structure, and the 900-square-foot footprint is a ceiling on a
      building we are not proposing. The other is a floor-area exclusion: roofed porches, exterior
      balconies and similar areas do not count "unless they are enclosed by walls that are more
      than 42 inches in height for 50 percent or more" of their perimeter. That one points the
      loosening way -- it takes area OUT of the count -- and it matters only where a standard is
      written in floor area, which none of Wood Village's residential dimensions are.
    fingerprint: 0db96fda36a08701
  "210.375.txt#210.375":
    queue: chapter
    outcome: nothing_here
    note: >-
      Design Review for all residential development in the LR7.5 and LR12 zones, and it does reach
      this building -- "all residential development", Type I, no housing-type exception. It closes
      on WHAT it asks rather than WHO it asks. Two required elements: the main entry of every
      street-facing unit must face the street or sit within 45 degrees of it, and at least 20
      percent of the street-facing wall area must be windows or entrance doors. Both are facade
      treatments that change no dimension of the rectangle or its place on the lot. Everything
      else is a menu -- "all street-facing facades must include at least FOUR OF THE FOLLOWING" --
      and the items the reader surfaced are the menu's entries: a roof dormer at least four feet
      wide, a bay window projecting at least three, a recessed entryway at least three deep, a
      covered entryway at least four deep, an open porch of at least 36 square feet. Four of a
      list, chosen by the applicant, and several of the options are surface treatments that
      project nothing. That is the design-menu shape this project catalogues as a false positive,
      and the one thing worth watching is that the projecting options would sit in the front yard
      as encroachments if chosen -- which is the applicant's decision to avoid, not the lot's
      problem.
    fingerprint: 6d9ea93d1d615021
  "220.355.txt#220.355":
    queue: chapter
    outcome: nothing_here
    note: >-
      The MR2 and MR4 twin of 210.375, word for word: the same entry orientation within 45 degrees
      of the street, the same 20 percent of street-facing wall area in windows or doors, and the
      same "at least four of the following" menu of dormers, bay windows, recessed and covered
      entryways and 36-square-foot porches. Ruled identically and on the same day, and the
      identity is the useful fact -- Wood Village applies one design vocabulary across its low and
      medium density zones, so a reader who has settled 210.375 has settled this. It reaches our
      building (MR2 and MR4 both permit a quadplex in this layer) and it still states no dimension
      of the lot or of the building's footprint.
    fingerprint: 6d9ea93d1d615021
  "235.330.txt#235.330":
    queue: chapter
    outcome: nothing_here
