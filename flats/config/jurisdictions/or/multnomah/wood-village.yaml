  "350.030.general-regulations.txt#350.030":
    queue: chapter
    outcome: nothing_here
    note: >-
      "Proximity of Parking to Use. Required parking spaces for residential uses must be located
      on the site of the use" -- and off-site allowances follow for nonresidential ones. For this
      building it is the strictest possible reading and it is also what this screen already
      assumes: the pod's stalls are drawn in its own court, on its own lot, and no verdict here
      has ever been earned by parking somewhere else. A rule that forbids what we were not going
      to do changes nothing, which is worth writing down rather than leaving as an open card,
      because the opposite version -- a city that lets residential parking sit within 500 feet, as
      Portland's 33.266.100(C) does -- is a real relaxation this project declines, and the two
      should be findable side by side.
    fingerprint: 5207747f38503b3d
  "235.300.txt#235.300":
    queue: nofield
    outcome: need_a_field
    note: >-
      TWO REAL TIGHTENINGS IN THE TOWN CENTER, BOTH TURNING ON THE NEIGHBOUR'S ZONING, AND BOTH IN
      THE DANGEROUS DIRECTION. Table 235-2's notes say: "(2) For sites abutting a light
      residential zone or abutting right-of-way adjacent to a light residential zone, the maximum
      height is twenty-five (25) feet within the first twenty-five (25) feet from the lot line
      abutting the light residential zone" and "(3) Sites abutting a residential zone shall have a
      side or rear building setback of fifteen (15) feet from the residential zone." This file
      encodes TC at 35 feet of height, a 5-foot side and a 15-foot rear, from the same table. So
      note (3) triples the side setback on an LR-abutting line, from 5 feet to 15; and note (2)
      puts a 25-foot ceiling on a 26-FOOT POD inside a 25-foot band off that line, which this
      design fails by a foot. TC is a zone where the answer can come out GREEN -- quadplex_allowed
      is true here on Table 235-1's Household Living row -- so a lot reported green on the
      strength of five feet and thirty-five could be neither. WHY IT IS NOT ENCODED TODAY RATHER
      THAN WAVED AWAY. The condition itself is available: `abuts_residential_zone` is registered
      in conditions.py and Oregon City already carries eight `when:` variants on it, and
      neighbour-zone adjacency moved onto this project's COMPUTABLE list on 2026-09-08 because it
      can be derived from geometry the inventory already holds. What is missing is narrower. Note
      (3) needs a variant on setback_side_ft, which is straightforward. Note (2) is a height
      limited inside a horizontal band measured from one lot line -- a step back from a property
      line rather than from a street, and the `step_back` form in this model steps up from a
      street frontage. Encoding either re-runs the fit stage, so this is recorded as its own
      change rather than folded into a ruling batch, in the same way as Portland's Eastern Pattern
      Area rear setback and Gresham's 9.0822(A)(6) earlier in this pass. Wood Village is 772 lots
      and only a slice of them are TC, so this is small by land and large by kind: it is the third
      case this week of a real standard hiding in a table NOTE rather than a table cell.
    fingerprint: b29314d813aa614d
