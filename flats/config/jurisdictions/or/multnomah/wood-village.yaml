label: Wood Village
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.'
ingest:
  geoid: null
  juris_city_codes:
  - WOOD VILLAGE
  zoning_layer: zoning_wood_village
  zone_field: Labeling
  strip_lowercase_suffix: false
code:
  # The city moved to municipal.codes (woodvillage.municipal.codes), which
  # serves one leaf section per page, server-rendered; article pages are
  # tables of contents only. The cite basis for every zone is WVDC 210/220:
  # .310 housing types allowed, .320 development standards (Tables 210-3 /
  # 220-3/-4), .375/.355 middle-housing design standards. The housing-type
  # and design sections are prose and Y/N tables — number-sparse, so the
  # plausibility gate reads them as thin; read 2026-08-13, they are real.
  - id: "210.310"
    url: https://woodvillage.municipal.codes/WVDC/210.310
    title: "WVDC 210.310 - Housing Types Allowed (LR)"
    allow_thin: true
  - id: "210.320"
    url: https://woodvillage.municipal.codes/WVDC/210.320
    title: "WVDC 210.320 - Development Standards (LR)"
  - id: "210.375"
    url: https://woodvillage.municipal.codes/WVDC/210.375
    title: "WVDC 210.375 - Middle Housing Design Standards (LR)"
    allow_thin: true
  - id: "220.310"
    url: https://woodvillage.municipal.codes/WVDC/220.310
    title: "WVDC 220.310 - Housing Types Allowed (MR)"
    allow_thin: true
  - id: "220.320"
    url: https://woodvillage.municipal.codes/WVDC/220.320
    title: "WVDC 220.320 - Development Standards (MR)"
  - id: "220.355"
    url: https://woodvillage.municipal.codes/WVDC/220.355
    title: "WVDC 220.355 - Middle Housing Design Standards (MR)"
    allow_thin: true
zones:
  LR 7.5:
    section: ["210."]
    cite_default:
      cite: WVDC 210.310 Table 210-2 (housing types), 210.320 Table 210-3 (development standards),
        210.375 (Ord. 2-2022)
      url: https://www.woodvillageor.gov/wp-content/uploads/20220324_City-Council_Staff-Report_CM_HB-2001_Exhibit-A-1.pdf
      retrieved: '2026-07-24'
    quadplex_allowed: true
    min_lot_sqft:
      value: 7500
      quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L65"
      variants:
        # Footnote (2), which the table marks on lot area, width, depth and
        # side setback: a townhouse lot is 1,500 sq ft with a 20-foot width,
        # no depth requirement and no side yard where units attach.
        - value: 1500
          when: [unit_lots]
          quote: "or/multnomah/wood-village/210.320.txt#L84"
    min_lot_width_ft:
      value: 60
      quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L66"
      variants:
        - value: 20
          when: [unit_lots]
          quote: "or/multnomah/wood-village/210.320.txt#L84"
    min_lot_depth_ft:
      # Stated by Table 210-3 and carried by nothing. 100 feet of lot
      # against a 10-foot front and 15-foot rear yard is what a fixed-length
      # pod is actually measured against.
      value: 100
      quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L67"
      variants:
        - exempt: true
          when: [unit_lots]
          quote: "or/multnomah/wood-village/210.320.txt#L84"
    setback_front_ft:
      value: 10
      quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L71"
    setback_garage_entrance_ft:
      # Footnote (1) adds that a garage may not sit forward of the plane of
      # the street-facing facade, which is a design rule rather than a
      # distance and is not encoded.
      value: 22
      quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L72,L82"
    setback_side_ft:
      value: 5
      quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L73"
      variants:
        # The Corner Lots block: on a corner lot the side yard is 10 in both
        # zones, which only moves LR 7.5.
        - value: 10
          when: [corner_lot]
          quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L75-L78"
        - value: 0
          when: [unit_lots, attached_wall]
          quote: "or/multnomah/wood-village/210.320.txt#L84"
    setback_rear_ft:
      value: 15
      quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L74"
      variants:
        # Corner Lots block again: 20 feet, both zones.
        - value: 20
          when: [corner_lot]
          quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L75-L79"
    setback_street_side_ft:
      value: 10
      quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L75-L77"
    max_coverage_pct:
      value: 45
      quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L80"
      variants:
        - value: 70
          when: [unit_lots]
          quote: "or/multnomah/wood-village/210.320.txt#L84"
    max_height_ft:
      value: 35
      quote: "or/multnomah/wood-village/210.320.txt#L62-L63,L69"
    notes: 'quadfit confidence: verified. Quadplex is allowed outright and the zone minimum lot applies
      to it -- no quadplex-specific larger minimum.

      QUOTED AND EXTENDED 2026-08-16. The side and rear setbacks were bare numbers the ledger flagged
      as stating two numbers each. Both second numbers are the Corner Lots block that Table 210-3
      prints under the ordinary setbacks: on a corner lot the side yard is 10 and the rear 20, so they
      are `corner_lot` variants rather than an unexplained pair.

      ADDED: minimum lot depth and the 22-foot garage setback, both stated by the table and carried by
      nothing, and the whole of footnote (2) behind `unit_lots` -- a townhouse lot is 1,500 sq ft at 20
      feet wide with no depth requirement, no side yard where units attach, and 70 percent coverage.

      The cite named 210.310 and 210.375, the housing-type and design sections, while every number
      quoted here is in 210.320. Corrected, which is 13 of the corpus''s misattribution warnings.

      NOT ENCODED: footnote (3), which gives cottage housing a 10-foot rear and street side yard and
      exempts it from coverage outright. A cottage cluster is not the pod.'
