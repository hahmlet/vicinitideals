definitions:
  # Captured 2026-08-31, and the reason it was not captured before is that
  # nothing here could see it: WVDC 720.030 was fetched for the parking
  # reading, and storing it is what made the corner lot visible to the tagging
  # ledger. Both LR zones state a corner-lot side yard of 10 against an
  # ordinary 5 and a corner-lot rear of 20 against 15, so this term decides ten
  # feet of envelope on every corner lot in the city, and until now it decided
  # them by whatever the geometry guessed a corner was.
  #
  # "CORNER LOT. A lot has frontage on more than one intersecting street. A
  # street that curves with angles that are 120 degrees or less is considered
  # two intersecting streets for the purpose of evaluating whether a lot is a
  # corner lot."
  #
  # Word for word Portland's curve clause, down to the 120 degrees, and no
  # ceiling on the intersection angle at all -- so a fork meeting at 150
  # degrees is a corner here as it is in Portland and is not one in Rivergrove.
  # Silence about the ceiling is read as silence and not as a default.
  #
  # ALLEYS ARE OUT, and the code says so twice: "street does not include
  # alleys" in the STREET definition, and "Street lot line does not include lot
  # lines that abut an alley" in the STREET LOT LINE one.
  #
  # PRIVATE DRIVES ARE IN, which is a reading and worth naming as one. Every
  # other layer in this corpus leaves `drives_count` false except Wilsonville,
  # whose code names a private drive beside a street. Wood Village does not
  # name one -- it defines STREET itself as "a public or private right-of-way
  # that is intended for motor vehicle travel or for motor vehicle access to
  # abutting property", which is broad enough to hold a drive without needing
  # a second noun. The direction of the error decides the doubt: a corner lot
  # read as an interior lot loses five feet of side yard and five of rear, and
  # a setback subtracted by a misreading is the false GREEN this screen exists
  # to avoid.
  #
  # NOT ENCODED: Figure 710-1, which the definition points at. Troutdale has
  # the same shape -- a figure illustrating corner lots with no text stating
  # what it adds -- and the same disposition. The words carry a complete test
  # without it.
  corner_lot:
    test: intersecting_frontages
    count: 2
    curve_at_or_below_deg: 120.0
    drives_count: true
    quote: "or/multnomah/wood-village/720.030.definitions.txt#L250"
    cite: "WVDC 720.030, Lot, Corner Lot"

