      # Stated here because the pointer above has no field list. Table 235-2
      # hands three rows to MR2 by name -- lot size and dimensions, maximum lot
      # coverage, minimum landscaping -- and states height and the four
      # setbacks for itself. It has no density row at all, in either column,
      # and neither does any other section of Chapter 235. So the day MR2's
