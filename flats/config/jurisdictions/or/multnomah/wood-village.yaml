      quote: "or/multnomah/wood-village/240.200.txt#L90-L94,L132-L136"
    notes: >-
      Table 240-1 reads N on Household Living and on Group Living in both manufacturing columns. General Manufacturing permits no dwelling of any kind, not even the caretaker unit some industrial codes carry. The row that answers is Household Living, which 710.100 defines as "the residential occupancy of a dwelling unit or a structure by a household" with an average stay of thirty days or more. It names no housing type and excludes none, so a four-unit attached townhome is inside it -- which is how the non-residential zones speak about dwellings at all. The residential zones do the opposite and list types by name. The definition is quoted at or/multnomah/wood-village/710.100.txt#L56,L60.
  LM:
