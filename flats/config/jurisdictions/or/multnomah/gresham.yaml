    min_density_du_per_acre:
      # Row E of Table 4.0430, which the August encoding of this district
      # skipped along with row F. A bare 12 units per acre, so it reaches
      # a quadplex, and read against the 10,000 sq ft lot-size row it
      # leaves a window rather than a threshold. Note 14 states the same
      # floor for the NE Glisan and NE 162nd corridors, so the corridor
      # and the district agree here even though they disagree on height.
