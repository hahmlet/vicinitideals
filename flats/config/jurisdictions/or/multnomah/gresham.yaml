  # 7.0431 states a stall and says nothing about the aisle it is reached from.
  # That is not a gap the parking chapter quietly fills, and reading it as one
  # was the first version of this entry: 9.0802(F) says the parking lot design
  # standards of 9.0822 through 9.0840 "by definition ... do not apply to
  # single detached dwellings, duplexes, triplexes, quadplexes, cottage
  # clusters, or townhouses on a unit-by-unit basis (see Section 7.0400 for
  # applicable standards)". Taken alone that sentence says this building has
  # no aisle standard at all.
  #
  # The same sentence supplies the other branch. "However, shared separate
  # parking areas ... must comply with the applicable standards of Sections
  # 9.0822 to 9.0827", and 7.0431(B)(5)(a) states the choice from the other
  # side: off-street parking "may be provided on individual lots or in a
  # shared parking area on a common tract". So which standard applies is
  # decided by how the parking is arranged, not by which chapter is opened
  # first. Four units on their own driveways is the unit-by-unit branch and
  # 7.0400 governs; one shared rear court on a common tract is the shared
  # branch and Table 9.0825A governs.
  #
  # The pod is drawn with a shared rear court, so the shared branch is the one
  # it takes, and it is also the binding one -- the other states no aisle at
  # all, and screening against no aisle is screening against nothing. At 90
  # degrees Table 9.0825A asks 23 feet one-way and 24 two-way.
  #
  # WHICH BRANCH IS NOT SETTLED, and the choice is recorded rather than
  # hidden. 9.0802(F) illustrates a shared separate parking area as "visitor
  # or overflow parking lot" -- parking additional to what the units have --
  # and a rear court holding the four residents' own stalls is not obviously
  # that. It is just as readable as the 7.0431(B)(5)(a) option, "a shared
  # parking area on a common tract", which is a sentence inside the chapter
  # 9.0802(F) sends this building to and would keep it there, with no aisle
  # standard at all. Both readings are live. The stricter is encoded because
  # a screen that dimensions a court against nothing is not screening, and
  # because being wrong this way costs lots that would have passed rather
  # than passing lots that cannot be built.
  #
  # 23 IS THE 90-DEGREE NUMBER, not the city's aisle. The one-way column runs
  # 11 to 13 feet at 45 degrees, 14 to 18 at 60, 19 at 75 and 23 at 90 -- the
  # aisle is a function of the parking angle and this field carries no angle.
  # 90 degrees is what the site plan lays out, and it is also the widest of
  # the four, so the number is right for the design and conservative for any
  # other. A shallower angle would buy a narrower aisle at the price of a
  # deeper stall, and nothing here has ever traded that.
  #
  # The two-way figure is different in kind: 24.00 is printed in every row of
  # the matrix, compact and standard, 45 through 90. That one really is the
  # city's aisle and carries no angle with it.
  #
  # NOT the 20 feet in note 1. That note is about emergency vehicle access --
  # "the minimum aisle width may vary to accommodate emergency vehicle access
  # ... for one-way traffic and for emergency vehicle access is 20 feet" -- a
  # different standard reached for a different reason, and three feet narrower
  # than the aisle the table itself requires. Reading it as the parking aisle
  # is what the site plan was doing.
  #
  # NOT Table 9.0861 either. That is the parking STRUCTURE matrix (9.0861,
  # aisle 25 at 90 degrees, stall depth 19), and a rear court is not a garage.
  parking_aisle_one_way_ft:
    value: 23
    cite: GDC Table 9.0825A, Off-Street Surface Parking Matrix (90 degrees, standard stall), reached via 9.0802(F) shared parking area
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-9.0800.pdf
    retrieved: '2026-08-24'
    quote: "or/multnomah/gresham/9.0800.parking.txt#L66-L70,L302,L319-L327,L340-L343"
  parking_aisle_two_way_ft:
