definitions:
  # "Corner Lot. A lot that has frontage on two or more streets. A corner lot
  # also includes a lot abutting the inside curve of a street with a delta
  # angle, as used on plats, of 60 degrees or more."
  #
  # The loosest of the five readings, and the only one under which a through
  # lot is a corner lot: it asks for frontage on two streets and says nothing
  # about where they go. That follows from the text rather than in spite of it.
  #
  # The curve clause is the same bend Portland writes as "120 degrees or less",
  # stated from the other side -- a delta of 60 is an interior angle of 120 --
  # so it is encoded as the interior angle the rest of the module measures.
  #
  # Alleys: 3.0100 defines a lot line abutting an alley as a rear lot line.
  corner_lot:
    test: frontage_count
    count: 2
    curve_at_or_below_deg: 120.0
    quote: "or/multnomah/gresham/3.0100.definitions.txt#L1304-L1305"
    cite: "Gresham Development Code 3.0100, Lot, Corner Lot"

crossrefs:

  # --- two procedural chapters cited in the design district use tables -----
  "8.0100":
    outcome: other_building
    note: >-
      Special Use Review, cited by the sentence that introduces two use tables: "permitted as
      indicated in Table 4.1120 and as provided in Section 8.0100 - Special Use Review", and the
      same for Table 4.1220(A). The chapter governs the rows those tables mark SUR. Table 4.1120''s
      Quadplex row reads P in DRL-1 and DRL-2 and NP elsewhere; the SUR marks in that column belong
      to Elderly Housing. The pod is permitted outright where it is permitted at all, so the
      special-use path is not on its row.
      (or/multnomah/gresham/4.1100.downtown.txt#L239)
  "8.0200":
    outcome: other_path
    note: >-
      Existing and Non-Conforming Uses and Development -- "may continue in existence, subject to
      provisions of Section 8.0200", "and be altered, subject to provisions of Section 8.0200".
      Every mention is about a use or a structure that was lawful when it was built and would not
      be permitted today. This screen places new construction under current standards, which is the
      case the chapter exists to distinguish itself from.
  "7.05":
    outcome: misread
    note: >-
      Section 7.0510 with a line break inside the number -- the sample reads "as described in
      Section 7.05 10". Gresham's Rockwood Design District chapter is held as
      7.0500.rockwood-design.txt, so the whole 7.05xx range is in the store.
  "9.08514":
    outcome: misread
    note: >-
      A parking table cell, not a section. Table 9.0851 prints footnote markers directly against
      the row labels -- "residential4, 5" -- and the extraction runs the table number into the
      marker.
  "10.0420":
    outcome: other_building
    note: >-
      "Conversion of a hotel or motel to an emergency shelter or affordable housing under Section
      10.0420." Every mention is that conversion, and Gresham's affordable housing chapter 10.1700
      is already held. A hotel converted is not a new four-unit building on a vacant lot.
  "7.0100":
    outcome: other_building
    note: >-
      Corridor Design District standards, and the corridor chapter splits the work itself, twice:
      "Design standards in Section 7.0400 for duplexes, triplexes, quadplexes, and townhouses,
      and in Section 7.0100 for new construction and remodels which meet the thresholds described
      in Section 7.0003." 7.0400 is fetched and is where this pod's design standards were read.
      7.0100 takes the commercial and mixed-use buildings on the same street.
  "7.0112":
    outcome: other_building
    note: >-
      The same split stated a third time, in Pleasant Valley. Table 4.1415A routes "Single
      Detached, Duplex, Triplex, Quadplex, Townhouse, Cottage Cluster" to 7.0400 and gives
      7.0112 to "All Other Uses", and note 7 spells out which: "new multi-family, elderly
      housing, residential facilities, mixed-use, and non-residential development". A quadplex is
      on the first list and multi-family here means five or more.
  "7.01":
    outcome: misread
    note: >-
      Not a section. "per Section 7.01 12.A.5.S1 and S2" is 7.0112 with a space dropped into it
      by extraction, and Gresham writes four digits after the point everywhere else in the code.
      Ruled with 7.0112, which is where it points.
  "7.000":
    outcome: misread
    note: >-
      The same shape, losing a digit instead of gaining a space. Pleasant Valley's height
      modifications row reads "Section 7.000 Rear Roof Height Limit Reductions", and the Rear
      Roof Height Limit is 7.0420(G) in the middle housing design chapter this corpus holds and
      reads: 21 feet at the rear setback line, rising a foot per foot of distance from the rear
      property line. Three-digit section numbers do not exist in this code.
  "6.0001":
    outcome: other_path
    note: >-
      "All developments that include townhouses shall receive both land division approval to
      create lots for the townhouses as required in Section 6.0001, and design review approval as
      required in Section 7.0001." Article 6 is land division, and creating a lot per townhouse
      is the split plat -- a path no pod in the catalog declares. Fetch it the day one does, with
      6.0500.
  "7.0001":
    outcome: procedure
    note: >-
      The design review requirement from the same sentence. It is the applicability section for
      Article 7 -- which development needs review -- and the standards that review applies to
      this building are in 7.0400, fetched and encoded. A requirement to be reviewed states no
      dimension.
  "7.0221":
    outcome: other_building
    note: >-
      "See Section 7.0221 - 7.0223 for additional requirements", the last line of 7.0400's
      manufactured dwelling park subsection. The six numbered standards above it are skirting,
      wheels and hitch mechanisms, and fire hydrants inside the park. This pod is factory-built
      and is not a manufactured dwelling sited on a rented space, so the whole subsection is
      about somebody else's building and the sections it points at are too.
  "9.0901":
    outcome: narrows_only
    note: >-
      Reached from one sentence in the rear roof height limit: "Solar energy collection equipment
      may project beyond maximum rear roof height no greater than 18 inches. See Section
      9.0901(B)." A list of what may stand above a height limit can only let a building be
      taller, never shorter, so not reading it screens the pod against the stricter number.
  "10.1520":
    outcome: narrows_only
    note: >-
      Reduction in Minimum Street Frontage, and both mentions ask for one: a Type II Adjustment
      in the flag lot standards, and a note letting LDR-7, LDR-5, TR and TLDR approve less
      frontage than the table states. It is a discretionary route to a smaller number than the
      one already screened against, and a screen that assumed the reduction would be granted
      would be guessing at a decision nobody has made.
  "6.0500":
    outcome: other_path
    note: >-
      Middle housing land division. Both mentions treat it as the procedure that turns one parent
      lot into child lots -- a flag lot driveway may serve two lots, "the parent lot or parcel of
      a middle housing land division (per Section 6.0500) shall be considered one lot". This
      screen places the pod on the lot as it stands; the split plat is a path no pod in the
      catalog declares. Fetch it the day one does.

code:
  # The city hosts the Development Code as one PDF per section series,
  # served plain (no impersonation). Layout extraction is clean (no
  # fusing); 4.0100 and 7.0400 carry rotated figure text pypdf warns
  # about and skips. The dimensional tables (4.0120/4.0130/4.0131) are
  # spatial grids with housing-type rows under lettered group headings
  # -- the housing-type dimension, explicit.
  # Article 3 is the spec the geometry stage has been working without. Every
  # standard in Article 4 is written in terms the city defines here -- corner
  # lot, flag lot, street frontage, lot width at the building line, arterial --
  # and FLATS infers all of them from shape with nothing to check the inference
  # against. A definition is a rule about what a measurement means, and it
  # belongs in the corpus for the same reason a setback does.
  - id: "3.0100.definitions"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-3.0100.pdf
    title: "Section 3.0100 - Definitions"
  - id: "4.0100.residential"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf
    title: "Section 4.0100 - Residential Land Use Districts"
  - id: "4.0200.commercial"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0200.pdf
    title: "Section 4.0200 - Commercial Land Use Districts"
  - id: "4.0300.industrial"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0300.pdf
    title: "Section 4.0300 - Industrial Land Use Districts"
  - id: "4.0400.corridor"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0400.pdf
    title: "Section 4.0400 - Corridor Land Use Districts"
  - id: "4.1100.downtown"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1100.pdf
    title: "Section 4.1100 - Downtown Land Use Districts"
    # Table 4.1130 prints its footnote markers hard against the numbers they
    # mark, and the whole table is built that way: the DRL height row reads
    # "8.71" for 8.7 units per acre with note 1, the DCL density ceiling
    # reads "608" for 60 with note 8, and the maximum front setback reads
    # "1512" for 15 with note 12. Read raw, the corroboration check compares
    # the encoded 8.7 against a line that states 8.71 and calls a correct
    # citation a misquote. Declared rather than guessed, because in a table
    # that really did state 608 the guess would bless an encoding of 60.
    glued_markers: true
  - id: "4.1200.civic-neighborhood"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1200.pdf
    title: "Section 4.1200 - Civic Neighborhood Plan District"
  - id: "4.1300.gresham-butte"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1300.pdf
    title: "Section 4.1300 - Gresham Butte Plan District"
  - id: "4.1400.pleasant-valley"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1400.pdf
    title: "Section 4.1400 - Pleasant Valley Plan District"
    # The setback tables in this chapter print their column headers as
    # rotated text, and layout extraction silently drops rotated text —
    # "Front Facade/Wall", "Front Porch", "Garage", "Interior Side" and the
    # rest never reached the store, leaving eleven columns of numbers with
    # nothing naming them. Plain mode reads them. This is why 4.0100 keeps
    # layout and these two do not: same publisher, different table.
    extraction: plain
  - id: "4.1500.springwater"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1500.pdf
    title: "Section 4.1500 - Springwater Plan District"
    # The setback tables in this chapter print their column headers as
    # rotated text, and layout extraction silently drops rotated text —
    # "Front Facade/Wall", "Front Porch", "Garage", "Interior Side" and the
    # rest never reached the store, leaving eleven columns of numbers with
    # nothing naming them. Plain mode reads them. This is why 4.0100 keeps
    # layout and these two do not: same publisher, different table.
    extraction: plain
  - id: "7.0400.middle-housing-design"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-7.0400.pdf
    title: "Section 7.0400 - Middle Housing Design Standards"
  - id: "7.0500.rockwood-design"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-7.0500.pdf
    title: "Section 7.0500 - Rockwood Design District"
  # Fetched to settle a doubt three zone notes were carrying rather than to
  # supply a number. 9.0602 excludes middle housing from the whole section,
  # and 9.0610(A) would cap a building at 30 ft near the trigger lot line
  # anyway. Neither reaches a 26 ft quadplex; see the OFR note.
  # Clear Vision Area, cited eleven times across the district chapters and
  # never fetched -- "Comply with Section 9.0200 - Clear Vision Area" sits in
  # the development standards of Downtown, Civic Neighborhood and Corridor.
  # A clear vision triangle keeps structures out of the corner of an
  # intersection, which is buildable area this screen counts in full.
  - id: "9.0200.clear-vision"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-9.0200.pdf
    title: "Section 9.0200 - Clear Vision Areas"
  # The chapter Table 4.0130's height cell points at. Every district column in
  # that table prints its maximum height with note 12 stuck to the number --
  # "35 ft.12" -- and note 12 sends a shoreline lot here. The footnote ledger
  # already rules it read-and-waiting-on-data against `protected_water_feature`,
  # a fact nothing in this system measures, so no shoreline lot can come back
  # green on a height. What that ruling could not say is what the chapter
  # actually does to a 26 ft building, because the chapter was never in the
  # store: it was the loudest unfetched reference in Gresham standing beside a
  # distance, and a footnote ruling is a decision about a POINTER, not a
  # reading of what it points at.
  - id: "10.1100.shoreline-height"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-10.1100.pdf
    title: "Section 10.1100 - Shoreline Height Standards"
    # Twenty-six lines is the whole chapter: a purpose sentence and one
    # application section with two lettered limits. Read in full before the
    # override was typed, and the reading is in the ruling below.
    allow_thin: true
    # Genuinely two paragraphs, and every dimension in them is deferred to
    # the Public Works Standards -- see this layer's reading note on 9.0200,
    # which is where the refusal itself is recorded and counted.
    # So it trips the thinness guard, correctly, every single sweep. It was
    # stored once with --allow-thin on the command line and the declaration
    # never recorded that, which left the corpus watch reporting a refusal
    # for a document nobody was going to change their mind about. A flag
    # used at the keyboard and not written down is a flag that has to be
    # remembered forever by whoever runs the sweep next.
    allow_thin: true
  - id: "9.0600.height-transition"
