      retrieved: '2026-07-24'
    quadplex_allowed:
      value: true
      quote: "or/multnomah/gresham/4.0100.residential.txt#L134"
    max_height_ft:
      # Table 4.0130 H, "Maximum Building Height": 35 ft. in the LDR-5 column,
      # on both the Townhouse row and the All-other-uses row, so the pod takes
      # the same number whether it is platted as one lot or four. The header
      # row is quoted with it because the table prints seven districts on one
      # line.
      #
      # The cell reads "35 ft.12" -- the number with a note marker stuck to
      # it. Note 12 sends shoreline lots to Section 10.1100, and it is already
      # ruled in the footnote ledger as read-and-waiting-on-data against the
      # protected_water_feature fact, so a lot that might be one cannot come
      # back GREEN on this number.
      value: 35
      cite: Gresham Development Code Table 4.0130 H; 4.0133
      quote: "or/multnomah/gresham/4.0100.residential.txt#L330,L332"
    setback_front_ft:
      value: 10
      quote: "or/multnomah/gresham/4.0100.residential.txt#L400"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/multnomah/gresham/4.0100.residential.txt#L400"
    setback_side_ft:
      value: 5
      quote: "or/multnomah/gresham/4.0100.residential.txt#L400"
    setback_rear_ft:
      value: 15
      quote: "or/multnomah/gresham/4.0100.residential.txt#L400"
    setback_street_side_ft:
      value: 10
      quote: "or/multnomah/gresham/4.0100.residential.txt#L400"
    min_lot_sqft:
      value: 5000
      quote: "or/multnomah/gresham/4.0100.residential.txt#L243"
      variants:
        - value: 0
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L242"
    min_density_du_per_acre:
      # Table 4.0130 row C, "All uses except Manufactured Dwelling
      # Parks". A floor, and the pod is four units against it.
      value: 6.22
      quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L244-L246"
      # Article 3 computes net density on the parcel less the Natural
      # Resource, Hillside and Geologic Risk overlays, dedicated
      # right-of-way and the rest. Nothing here surveys those, so the lot's
      # own area serves as the bound it is.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list: the longer of the two lists -- Natural Resource Overlay, Hillside
      # and Geologic Risk Overlay, land under either easement, dedicated
      # street, private accessway, the flag pole of a flag lot and the
      # encumbered part of a non-standard lot.
        cite: GDC 3.0100 "Density, Net"; the minimum-density subtraction list
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L796"
    max_density_du_per_acre:
      # Row D prints None against "Duplex, Triplex, Quadplex,
      # Cottage Cluster". The pod on one lot has no ceiling here --
      # exempt, not a large number.
      exempt: true
      quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L250,L254"
      variants:
        # The same building split onto four lots is townhouses, which
        # row D holds separately.
        - value: 25
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L250,L257"
      # Article 3 computes net density on the parcel less the Natural
      # Resource, Hillside and Geologic Risk overlays, dedicated
      # right-of-way and the rest. Nothing here surveys those, so the lot's
      # own area serves as the bound it is.
