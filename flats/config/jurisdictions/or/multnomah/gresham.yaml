      two-foot bay window, a three-foot recessed entry, side walls broken every thirty-five feet,
      upper floors set back four feet over sixty percent of the wall. A factory pod satisfies one
      of those or it does not, and no lot is refused by the choice.
    fingerprint: 857fbb365c7b9ac8
