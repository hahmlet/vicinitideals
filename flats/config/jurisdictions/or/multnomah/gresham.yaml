    notes: 'Table 4.1120 reads NP in this column for Quadplex (L246), and that is the whole screen: the use is out, so the chapter''s dimensional table is not read for this district and none of its standards are encoded. A decided RED and an unread district look identical in a count, so the distinction is worth stating -- this one is decided. Two other rows of the same table were checked before settling it, because either could have reopened the district. Multi-Family is a bare P here (L249), and does not reach this building: GDC 3.0100 defines a Multi-Family Dwelling as five or more units and adds that Multi-Family dwellings are not middle housing (3.0100.definitions.txt L939-L942). Townhouse is also a bare P (L247), and Table 4.1130 prints a whole setback row headed "Townhouse in DCC, DMU, DTM, DEM, and DCL" (L476) -- so the code plainly contemplates attached housing here. What closes it is the definition: a quadplex divided onto individual lots through a Middle Housing Land Division is still "considered a quadplex" (L962-L964), so the split plat does not move the pod into the Townhouse row. The path that is NOT ruled out is a genuine townhouse subdivision -- four lots created first, then four attached units built on them, which the Townhouse definition (L952-L954) reaches on its own terms and which the Downtown row states no minimum lot size for at all. That is a legal reading rather than a sentence in the code, so it is written down here rather than encoded as a variant; a variant on unit_lots would fire off the design catalog and turn 152 lots green on my reading rather than on Gresham''s. DCL is also the one Downtown column that states a maximum residential net density -- 60 units per acre (L441-L443) -- which a four-unit pod would clear on any lot over 2,904 sq ft. Not encoded, because the use flag decides every lot here and a dimensional standard on a barred district is a number nobody reads. It is the first thing to read if the prohibition is ever revisited