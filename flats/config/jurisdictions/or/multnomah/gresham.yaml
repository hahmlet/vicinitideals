          when: [unit_lots]
          quote: "or/multnomah/gresham/4.1500.springwater.txt#L339-L340"
    notes: >-
      Springwater very low density sub-district. Off-street parking is row K,
      "As provided in Section 9.0851", a cross-reference to a chapter not in
      this corpus, so the state minimum stands rather than a number read out of
      this table. Row L, alley access for garage entrances, reads N/A against
      All Other Uses here and is not encoded. Row H sends the quadplex row to
      Section 7.0400 for rear height limits, and that is now read and carried.
      7.0420(G)(1) allows 21 ft of roof at the rear setback line and a foot
      more for every foot further back, so a 26 ft pod stands 25 ft off the
      rear property line rather than the 20 this table prints, and 13 rather
      than 8 with an alley. 7.0420(G)(1)(b) switches the limit off inside the
      Hillside Geological Risk Area or a Resource Area; neither boundary is
      cut against a parcel here, so the step-back binds. It catches the
      split-plat path too: GDC 3.0100 says quadplex units divided through a
      Middle Housing Land Division "are considered a quadplex". The four-unit cap of row J is stated
      for Townhouses only.
