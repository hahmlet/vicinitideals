      quote: "or/multnomah/gresham/4.0100.residential.txt#L332"
    min_frontage_ft:
      value: 45
      quote: "or/multnomah/gresham/4.0100.residential.txt#L314"
      variants:
        # Table 4.0130 G.1 prints None in this district's townhouse cell,
        # not the 16 ft its neighbours carry. Read cell by cell 2026-09-02:
        # L313 aligns seven cells across LDR-5 / LDR-7 / TR / TLDR / MDR-12
        # / MDR-24 / OFR as 16 / 16 / 16 / None / None / 16 / None, and the
        # 16 that used to stand here was the column next door. None means no
