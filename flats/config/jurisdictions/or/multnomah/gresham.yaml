  LDR/GB:
    section: ["4.13"]
    cite_default:
      cite: Gresham Development Code 4.1310 (Gresham Butte)
      url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1300.pdf
      retrieved: '2026-07-24'
    quadplex_allowed:
      # 4.1310 ALLOWED USES adopts LDR-5's permitted uses and then names what
      # the plan district takes back: "the Gresham Butte Plan District
      # specifically prohibits: 1. Triplexes; 2. Quadplexes; ..."
      value: false
      quote: "or/multnomah/gresham/4.1300.gresham-butte.txt#L28-L33"
    # 4.1312: "The Site Development Requirements of LDR-5 shall apply unless
    # modified by this section." An overlay that states its base rather than
    # restating its numbers, so this holds the pointer and the two things the
    # section actually changes.
    #
    # `wins: local` because the sentence says so in its own words -- LDR-5
    # applies *unless modified by this section*, which makes anything written
    # here govern over the reference.
    #
    # The maximum density of Table 4.1311 -- 1 D.U./Acre on gross property
    # area -- is not encoded. Four units on one acre is 4 du/acre and fails
    # it, so this is not a standard to leave out lightly; it is left out
    # because a quadplex is prohibited here outright and the use flag already
    # decides every lot in the district. When the prohibition is ever
    # revisited, that table is the first thing to read.
    like:
      zone: LDR-5
      wins: local
      cite: Gresham Development Code 4.1312 (Gresham Butte)
      quote: "or/multnomah/gresham/4.1300.gresham-butte.txt#L64"
    setback_side_ft:
      # 4.1312.B: "The LDR-5 setback requirements are required except that the
      # side yard setback shall be a minimum of 10 feet to encourage side yard
      # planting." The one dimension the plan district moves, and it moves it
      # tighter -- LDR-5's 5 feet doubled.
      value: 10
      cite: Gresham Development Code 4.1312.B (Gresham Butte)
      quote: "or/multnomah/gresham/4.1300.gresham-butte.txt#L68-L69"
    notes: 'quadfit confidence: verified | Quadplexes explicitly prohibited in Gresham Butte overlay (hillside/fire
      risk); duplex max.'
