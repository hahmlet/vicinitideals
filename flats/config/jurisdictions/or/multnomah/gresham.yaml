    orientation_constraint:
      # 7.0420(J)(1)(a): "A minimum of 50 percent of the site's frontage shall
      # be occupied by buildings oriented to the abutting street", measured
      # "between the minimum and maximum front setback". J.1 scopes it to
      # plexes in the Downtown, Rockwood, Civic and Corridor Design Districts,
      # which is why the quote opens on the scoping sentence rather than the
      # standard: half the frontage built out, in a band a few feet deep, is
      # only reachable with the long axis parallel to the street.
      #
      # Note 16 of Table 4.1130 releases the maximum front setback "once all
      # minimum building frontage requirements of the street type have been
      # satisfied", which is the same standard read from the other end and
      # does not loosen this one.
      value: axis_required
      quote: "or/multnomah/gresham/7.0400.middle-housing-design.txt#L410-L418"
    notes: 'Read against Table 4.1130 on 2026-08-15. The governing row is the one headed "Single-detached, duplex, triplex, and quadplex dwellings in any district; and Townhouse and Cottage Cluster in DRL-1 and DRL-2" (L492), which names this building twice over, and its numbers hold across every street type the row prints -- so nothing here depends on which street the lot fronts. Front is the facade line (10, L495); the garage face is a separate and much deeper standard (20, L497) and is now encoded rather than left to bind invisibly. Side interior is 5 (L499) with a common-wall 0 (L504) as an `attached_wall` variant; rear is 10 without an alley (L506) and 6 with one (L507). Street side is 10 (L500). Lot area 4,000 (L511), width 35 at the building line with 16 on a townhouse unit lot (L514/L517), frontage 35 (L518). The same row states a 70 ft minimum interior-lot DEPTH (L516) and FLATS has no depth field -- the second jurisdiction where that hole has now surfaced, after the sweep found it in Fairview 19.30. Not encodable until the field exists. quadfit confidence: verified | Downtown. MAXIMUM front setback 15-20 ft + >=50% frontage occupancy
      (7.0420(J)) effectively force the long axis parallel to the street — axis_required. Max-front-setback
      placement band not modeled (blind spot).'
