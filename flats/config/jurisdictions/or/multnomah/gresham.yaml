    notes: 'Table 4.0420 reads NP for Quadplex in the Rockwood Town Center column (L148), so the use is out and none of Table 4.0430''s standards are read for this district. Duplex and Triplex read NP here too, which is unusual -- the other Corridor districts that allow anything allow all three -- and it is the town centre being held for larger buildings rather than an oversight: Multi-Family is L3,4 and Townhouse is L3 in the same column. The Townhouse permission is the one to reread if this is ever revisited, and note 3 is what limits it: inside the Rockwood Town Center Mixed-Use Area, buildings on parcels with at least 100 feet of frontage on Stark within 500 feet of the 181st or 187th intersections must put non-residential uses on the ground floor. RTC also states its height in storeys rather than feet, six or ten by area, which is the same shape SC states and the reason max_height_stories exists.'
