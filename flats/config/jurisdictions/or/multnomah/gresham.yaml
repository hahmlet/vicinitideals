label: Gresham
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  Table 4.0131 (Minimum Setbacks in Residential Districts) states the setbacks with the standards across
  the top and the districts down the side, and states each district group twice: once under "Single Detached
  Dwelling, Duplex, Triplex, and Quadplex" and once under "Townhouse". The quadplex row is the one encoded,
  because FLATS screens a four-unit building placed on one lot. The townhouse row is looser for the MDR
  group (rear 10 not 15, street side 8 not 20) and applies to the split plat, where each unit gets its
  own lot. Those setback rows are not yet encoded as `when: [unit_lots]` variants; the lot standards of
  Table 4.0130 are.


  Eleven of that table''s twelve columns are setbacks and most are variants the screen does not use: the
  front porch may stand two feet nearer the street than the wall, the common-wall and zero-lot-line options
  state a party wall rather than an envelope, "Rear With Alley" depends on an alley existing, and "Street
  Side Garage Access" is the garage setback measured from the side street. Only the facade/wall, garage,
  interior side, street-side wall and rear-no-alley columns are encoded.


  Table 4.0130 states a townhouse row beside the quadplex row for every lot standard, and those rows
  are encoded as `when: [unit_lots]` variants on the six zones the table has a column for (LDR-5,
  LDR-7, TLDR, TR, MDR-12, MDR-24). Townhouse minimum lot size is None in every column; width and
  street frontage are 16 ft per lot. The plan districts (LDR-PV, LDR-SW, DRL-1, DRL-2, CMF) are
  governed by their own chapters and get nothing from this table. Table note 7 is not encoded and
  binds the split path everywhere it applies: a townhouse lot under 22 feet wide must take access
  from an alley or a shared access, and 16 ft is always under 22. MDR-24''s min_lot_sqft is a density
  derivation (24.2 u/ac, 4 units) rather than the table''s lot-size row, so the townhouse "None" does
  not displace it — the unit count is what the density counts, and dividing the lot does not change it.
  Footnote 5 on the LDR front setback (a garage or carport entry set at 20 ft.) is carried as
  setback_garage_entrance_ft rather than folded into the front setback.


  READ AND NOT ENCODED: 7.0512, the Rockwood Design District standards. Table 4.0430 sends the RTC,
  SC and SC-RJ street setbacks there -- "Setbacks at Street: See Section 7.0512.A.2" -- which made it
  six binding references, the loudest unfetched thing in this jurisdiction. Fetched and read
  2026-08-21, and it does not reach this building. 7.0502(B): "Section 7.0501-7.0512 do not apply to:
  Single detached dwellings, duplexes, triplexes, and quadplexes (for these developments, see Section
  7.0420)." A quadplex is named in the exception list, so the encoded 5 ft minimum and 20 ft maximum
  from Table 4.0430''s Residential sub-cell stand as this building''s street setbacks in SC and SC-RJ.


  It reaches the split plat. 7.0502(A) lists Townhouses among the uses the section applies to, and
  7.0512(A)(2)(S1) is where the numbers get harder: inside the Rockwood triangle the street setback
  is set by which street the lot fronts -- 0 to 5 ft on Stark and 181st, 10 to 15 ft on Burnside,
  Pine, Oak, Ash, 185th, 187th and the two future avenues -- and outside it by district, 5 ft minimum
  and 20 ft maximum for Multi-Family and Townhouse Style in all three. A unit-lot design would owe a
  street name and a triangle boundary before any of that can be screened, and neither is measured.
  Not encoded as a `unit_lots` variant for that reason: an encoded number here would be a guess about
  which of four bands a lot sits in.


  PARKING, read 2026-08-20 and encoded as a layer default of zero. GDC 9.0802(A): "Vehicle parking
  minimums are not required for any land use type." Table 9.0851 carries no minimum column for auto
  parking -- the heading is AUTO PARKING / MAXIMUM -- and the two plan districts that restate the rule
  say minimum off-street parking for all uses is zero.


  Thirty-four of this layer''s thirty-eight zones had no parking value and were falling through to the
  state''s OAR 660-046-0220 cap of one stall per unit, so every lot in them was screened as owing four
  stalls it does not owe. A ceiling on what a city MAY require is not a reading of what it does, and
  standing in for one it was wrong in the direction that refuses a lot. The four Corridor zones that
  already stated 0 from Table 4.0430 row K keep their own citation: the same answer from the zone''s own
  table is not the same sentence, and if the city ever restores a minimum in one district the zone row is
  where it would appear.


  Bicycle parking is read and not encoded, and the reason is under READ AND NOT ENCODED: 9.0851 below. The short
  version: in eleven named districts the Quadplexes row states None outright, and everywhere else the
  long-term requirement of one space per dwelling unit is satisfiable inside the dwelling under
  9.0831(A)(1) and (A)(4)(f), which costs no site area. Nothing here holds a bicycle rack anyway.


  READ AND NOT ENCODED: 10.1700, Affordable Housing with Height and Density Bonuses. It was the loudest
  unfetched reference in the whole corpus -- thirty-four mentions, eight of them beside a number this
  screen uses, one sentence repeated in every zone chapter: "Affordable housing development is subject
  to the provisions in Section 10.1700." Fetched and read 2026-08-20. It is a bonus and nothing else.
  10.1711(G) and Table 10.1711(B) grant a density bonus of 125 to 200 percent and a height bonus of 12
  to 36 feet, and 10.1711(B)(2) switches the minimum net density off entirely. Every one of those
  loosens.


  It is also elective, and expensively so: 10.1711(A) requires every unit at 80 percent of area median
  income or an average of 60 percent, enforced by a recorded covenant for no less than thirty years. A
  market-rate quadplex does not become subject to this section by being built; an owner opts into it. So
  it is not encoded, on the two grounds this corpus already uses -- a qualifier that can only loosen is
  recorded rather than encoded, and an elective standard is not one a lot can fail.


  READ AND NOT ENCODED: Table 9.0851, Auto and Bicycle Parking Requirements. Twenty-two mentions, five
  beside a number the screen uses, and every one of them is a zone table''s parking row pointing here.
  Fetched and read 2026-08-20, and the answer was not in the table at all -- 9.0802(A) states it in one
  sentence for the whole city, and this layer carries it as a default. See the PARKING note above.


  The bicycle rows are read and not encoded. In the districts 9.0851(A)(1) lists -- LDR-7, LDR-5, LDRGB,
  LDR-PV, MDR-PV, VLDR-SW, LDR-SW, TR, TLDR, MDR-12, OFR and the Glisan and 162nd stretches of CMF --
  the Quadplexes row states None in all three columns. Everywhere else a four-unit building falls to
  (A)(2)(b) and owes one long-term space per dwelling unit and one short-term space per twenty. Neither
  consumes placeable site area: 9.0831(A)(1) says that where long-term bicycle parking is provided in a
  dwelling unit neither racks nor lockers are required, (A)(4)(f) names "contained within a dwelling
  unit" as a compliant security location, and 9.0802(F) exempts quadplexes from the parking-lot design
  standards on a unit-by-unit basis. The code supplies a compliant path that costs no ground. Four units
  against one short-term space per twenty is a fifth of a rack, which is not a fitment question at the
  resolution this screen works at.


  READ AND NOT ENCODED: 9.0200, Clear Vision Area. Eleven mentions, and the development standards of
  Downtown, Civic Neighborhood and Corridor each carry the line "Comply with Section 9.0200 - Clear
  Vision Area." Fetched and read 2026-08-26. The whole section is two paragraphs and neither states a
  dimension. 9.0201 requires a triangular clear vision area on each corner at the intersection of two
  streets or a street and a railroad, restricting sight obstructions in the right of way and on private
  property; 9.0202 requires the same on both sides of every driveway and service drive. Both then say
  the same thing: "The dimensions of the clear vision area and exceptions are described in the Public
  Works Standards (6.04)."


  THE MANUAL WAS FETCHED 2026-09-01 and the numbers are now in the store, so this refusal is no longer
  about a missing document. Public Works Standards 6.04 gives a table, and the row it gives is ours by
  name: "Driveways for Detached and Middle Housing Sites 20", against 25 for multifamily and commercial
  driveways and 40 at a street intersection. It is a triangle, measured from the back of the street
  curb, and 6.04 excludes two different things from it. Sight obstructions between 3 and 10 feet of
  height -- which reaches a STRUCTURE, so on a corner lot a 40-foot triangle is subtracted from the
  building envelope. And, in its own sentence, "No driveway or off-street parking area shall be located
  in the Clear Vision Area", which on EVERY lot puts a pair of 20-foot triangles either side of the curb
  cut where no stall may sit.


  READ AND NOT ENCODED: 7.0420(G)(1)(b), the exemption from the rear roof height limit. The plane
  itself is encoded on all six districts (G)(1) names and, since 2026-09-02, the site-plan pipeline
  derives the 20 ft rear setback from it rather than standing at Table 4.0130''s printed 15. (b) is
  the sentence that switches it off: "This rear roof height limit standard does not apply if any
  portion of the lot is located within the Hillside Geological Risk Area (HGRO) or Resource Area
  (RA)." The direction matters -- this is a refusal that costs lots rather than inventing
  them. A lot inside either overlay owes the printed setback and is being screened five
  feet stricter than the code.

  It is refused rather than deferred because the shape is wrong twice over. There is no condition
  for "inside the hillside or resource overlay", and unlike most site facts in this corpus the data
  exists: quadfit fetches both layers and screens every Gresham lot against them. But the envelope
  is built at s5 and the overlays are measured at s5o, so a setback that varies per lot by overlay
  touch is a stage-ordering change and not a value. And the second half is worse than the first:
  both layers are CARVES, so a lot in either has already had that ground subtracted from its
  envelope. Handing the five feet back to a lot whose resource area was just removed is not obviously
  the code''s arithmetic, and nothing here has read 4.1100 or 4.1200 far enough to say. Two questions
  in one clause, and the conservative answer is the same for both, which is why this waits.
  (or/multnomah/gresham/7.0400.middle-housing-design.txt#L364-L365)


  Still not encoded, and now for a better reason than absence. There is no clear-vision field, and the
  shape is not a setback: a triangle cut across a corner is not an inset from a line, and writing 40
  into a corner setback would take a diagonal off the whole street side. The corner limb also needs the
  corner data this screen does not have -- 9.0201 joins fourteen other cities corner definitions waiting
  on the same computation. The driveway limb is inert for this pod rather than unmeasured: 20 feet from
  the back of curb reaches about the front setback line, and the rear-court typology parks four cars
  behind the building, so the two triangles at the cut contain front yard. A city that let front-yard
  parking in at 7.0420(B)(5)(c) takes some of it back here, and this screen never used it.
  (or/multnomah/gresham/pws.6.03-6.04.txt#L67-L119)'
