      variants:
        - value: 10
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L416,L428"
        - value: 5
          when: [unit_lots, abuts_alley]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L416,L428"
    setback_street_side_ft:
      value: 5
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L332-L336"
    setback_front_max_ft:
      value: 20
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L351-L356"
    min_lot_sqft:
      value: 10000
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L296-L297"
      variants:
        # Note 6: the minimum lot size does not apply to lots created for
        # townhouses. The 10,000 is what a multi-family site owes, and a
        # unit-lots pod is not measured against it.
        - exempt: true
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L445"
    min_frontage_ft:
      value: 100
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L301-L302"
      variants:
        # Note 17, the same shape as the residential chapter's note 10.
        - value: 16
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L460-L462"
        - value: 32
          when: [unit_lots, corner_lot]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L460-L462"
        - value: 25
          when: [unit_lots, corner_lot, abuts_alley]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L460-L462"
    orientation_constraint:
      # 7.0420(J)(1)(a): "A minimum of 50 percent of the site's frontage shall
      # be occupied by buildings oriented to the abutting street", measured
      # "between the minimum and maximum front setback". J.1 scopes it to
      # plexes in the Downtown, Rockwood, Civic and Corridor Design Districts,
      # which is why the quote opens on the scoping sentence rather than the
      # standard: half the frontage built out, in a band a few feet deep, is
      # only reachable with the long axis parallel to the street.
      #
      # Note 16 of Table 4.1130 releases the maximum front setback "once all
      # minimum building frontage requirements of the street type have been
      # satisfied", which is the same standard read from the other end and
      # does not loosen this one.
      value: axis_required
      quote: "or/multnomah/gresham/7.0400.middle-housing-design.txt#L410-L418"
    notes: 'Read against Table 4.0430 on 2026-08-15, and quoted as line ranges because this table is the worst case of the extraction problem in the corpus: seven columns (RTC, SC, SC-RJ, CMF, CMU, CC, MC, header at L359) collapse into one run of words per line, so no single line holds a whole cell and CMF is the fourth value along each of five consecutive lines. Reassembled, the residential row reads "5 feet front and street-side; 15 feet rear; 0 feet interior side" (L332-L336). A reviewer has to read the range and count columns; that is what the range citation is asking them to do, and it is honest about the work rather than pointing at a line that looks decisive and is not. The MAXIMUM front setback, 20 ft (L351-L356), is now encoded rather than living only in this note -- it is the standard that forces the pod forward on the lot and it was previously invisible to the engine. Lot size 10,000 (L296-L297) and frontage 100 (L301-L302) confirmed in the same table. quadfit confidence: verified | Base CMF regime: residential needs 10,000 sf min AND 100 ft
      street frontage; max front setback 20 ft + frontage occupancy — axis_required. NE Glisan/162nd corridors
      follow TLDR standards instead (Table 4.0430 n.14) — NOT split out; base regime applied everywhere
      = conservative.'
  LDR/GB:
    section: ["4.13"]
    cite_default:
      cite: Gresham Development Code 4.1310 (Gresham Butte)
      url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1300.pdf
      retrieved: '2026-07-24'
    quadplex_allowed:
      # 4.1310 ALLOWED USES adopts LDR-5's permitted uses and then names what
      # the plan district takes back: "the Gresham Butte Plan District
      # specifically prohibits: 1. Triplexes; 2. Quadplexes; ..."
      value: false
      quote: "or/multnomah/gresham/4.1300.gresham-butte.txt#L28-L33"
    # 4.1312: "The Site Development Requirements of LDR-5 shall apply unless
    # modified by this section." An overlay that states its base rather than
    # restating its numbers, so this holds the pointer and the two things the
    # section actually changes.
    #
    # `wins: local` because the sentence says so in its own words -- LDR-5
    # applies *unless modified by this section*, which makes anything written
    # here govern over the reference.
    #
    # The maximum density of Table 4.1311 -- 1 D.U./Acre on gross property
    # area -- is not encoded. Four units on one acre is 4 du/acre and fails
    # it, so this is not a standard to leave out lightly; it is left out
    # because a quadplex is prohibited here outright and the use flag already
    # decides every lot in the district. When the prohibition is ever
    # revisited, that table is the first thing to read.
    like:
      zone: LDR-5
      wins: local
      cite: Gresham Development Code 4.1312 (Gresham Butte)
      quote: "or/multnomah/gresham/4.1300.gresham-butte.txt#L64"
    setback_side_ft:
      # 4.1312.B: "The LDR-5 setback requirements are required except that the
      # side yard setback shall be a minimum of 10 feet to encourage side yard
      # planting." The one dimension the plan district moves, and it moves it
      # tighter -- LDR-5's 5 feet doubled.
      value: 10
      cite: Gresham Development Code 4.1312.B (Gresham Butte)
      quote: "or/multnomah/gresham/4.1300.gresham-butte.txt#L68-L69"
    notes: 'quadfit confidence: verified | Quadplexes explicitly prohibited in Gresham Butte overlay (hillside/fire
      risk); duplex max.'
