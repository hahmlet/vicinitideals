      # encumbered part of a non-standard lot.
        cite: GDC 3.0100 "Density, Net"; the minimum-density subtraction list
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L796"
    max_density_du_per_acre:
      # Row D, "Duplex, Triplex, Quadplex, Cottage Cluster". The one
      # district that prints a figure against the pod's own row.
      value: 24.2
      quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L250,L254"
      variants:
        # The same building split onto four lots is townhouses, which
        # row D holds separately.
        - value: 24.2
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L250,L257"
      # Article 3 computes net density on the parcel less the Natural
