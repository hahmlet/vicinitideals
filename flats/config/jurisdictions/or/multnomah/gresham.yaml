      quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L239"
    min_density_du_per_acre:
      # Table 4.0130 row C, "All uses except Manufactured Dwelling
      # Parks". A floor, and the pod is four units against it.
      value: 12.1
      quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L244-L246"
      variants:
        # Note 5: "this does not apply to lots of record less than
        # 11,000 square feet in size". Exempt rather than zero -- the
        # standard does not reach the lot, which is a different
        # sentence from a floor every lot clears. 10,999 is the last
        # whole square foot below 11,000; the band grammar has no
        # exclusive bound and the residual side is the stricter one.
        - exempt: true
          band: {measure: lot_sqft, at_most: 10999}
          quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L244-L246"
      # Article 3 computes net density on the parcel less the Natural
