    min_lot_sqft:
      # Row A, CC column: None.
      exempt: true
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L295-L300"
    min_frontage_ft:
      # Row B, CC column: None.
      exempt: true
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L295,L301-L305"
    min_density_du_per_acre:
      # Row E, CC column: a bare 12 units per acre, no housing-type list, so
      # the floor does reach a four-unit building.
      value: 12
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L295,L316-L321"
      measured_on:
        fact: net_developable_area
        cite: GDC 3.0100 "Density, Net"; the minimum-density subtraction list
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L796"
    max_density_du_per_acre:
      # Row F, CC column: 40 units per acre.
      value: 40
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L325-L327"
      measured_on:
        fact: net_developable_area
        cite: GDC 3.0100 "Density, Net"; the maximum-density subtraction list
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L790,L797-L799"
    setback_front_ft:
      # Row G, CC column: "0 feet front and street-side, interior side, and
      # rear." One cell for all four, and no residential/commercial split.
      value: 0
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L332-L337"
    setback_side_ft:
      value: 0
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L332-L337"
    setback_rear_ft:
      value: 0
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L332-L337"
    setback_street_side_ft:
      value: 0
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L332-L337"
    setback_front_max_ft:
      # Row H reads 10 feet, marked 3b and 3c. Note 3c makes it five feet on a
      # Collector, Community or Local street, for any building; note 3b keeps
      # ten on an arterial or boulevard but only for buildings containing
      # commercial uses. Street class is not read here, so five is taken --
      # this is a maximum, so the small number is the strict one.
      value: 5
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L351-L356,L431,L439-L441"
    parking_min_per_unit:
      value: 0
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L392-L393"
    notes: 'Table 4.0420 reads NP for Quadplex (L148), and here the rest of the residential block reads NP with it -- Duplex, Triplex, Townhouse and Cottage Cluster all prohibited, and Single Detached too. This is a commercial district that admits housing only as Multi-Family above a ground floor of shops (note 6: on arterials and boulevards, half the street-facing frontage within 40 feet of the street must be commercial or institutional), and Gresham''s Multi-Family Dwelling is five units or more and expressly not middle housing. There is no path for a four-unit pod on one lot and none for the split plat either.

      Table 4.0430 is encoded anyway, on 2026-08-21, and the reason recorded for doing so does not survive reading it. It said Table 4.0420 note 2 governs the region the use cell is quoted from and is ruled unmeasured, so the NP was not settled and an unsettled gate owes the standards behind it. Note 2 says nothing about this district: its first sentence is the L2 marker on the CMF column''s own cells and its second limits middle housing land divisions in CMF. It reached this column only because a footnote governs its whole notes block -- the conservative default, and over-scoped here across all seven Corridor columns at once. Narrowed to CMF on 2026-08-26. The NP in this column carries no marker at all, so the gate is shut, settled, and RED before any dimension is read. The column is kept because it was read correctly, and it is the loosest dimensional column in the Corridor table and close to the loosest in the corpus: no minimum lot size, no minimum street frontage, no minimum lot width/depth ratio, zero on all four setbacks, 45 feet of height, no parking required. None of it can move a verdict while the use row reads NP.

      Were the gate ever to open, the density pair is what would bind, and only together. The floor of 12 units per net acre puts four units on no more than about 14,520 sq ft and the ceiling of 40 puts them on no less than about 4,356, so the district is a window rather than a minimum -- and neither row says that on its own. The maximum front setback is the other one to watch: the table cell reads 10 feet, but note 3c drops it to five on a Collector, Community or Local street, and street class is not read here, so five is taken.'
