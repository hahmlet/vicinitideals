        - exempt: true
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L445"
    min_frontage_ft:
      value: 100
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L301-L302"
      variants:
        # Note 17, the same shape as the residential chapter's note 10.
        - value: 16
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L460-L462"
        - value: 32
          when: [unit_lots, corner_lot]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L460-L462"
        - value: 25
          when: [unit_lots, corner_lot, abuts_alley]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L460-L462"
    orientation_constraint:
      # 7.0420(J)(1)(a): "A minimum of 50 percent of the site's frontage shall
      # be occupied by buildings oriented to the abutting street", measured
      # "between the minimum and maximum front setback". J.1 scopes it to
      # plexes in the Downtown, Rockwood, Civic and Corridor Design Districts,
      # which is why the quote opens on the scoping sentence rather than the
      # standard: half the frontage built out, in a band a few feet deep, is
      # only reachable with the long axis parallel to the street.
      #
      # Note 16 of Table 4.1130 releases the maximum front setback "once all
      # minimum building frontage requirements of the street type have been
      # satisfied", which is the same standard read from the other end and
      # does not loosen this one.
      value: axis_required
      quote: "or/multnomah/gresham/7.0400.middle-housing-design.txt#L410-L418"
    notes: 'Read against Table 4.0430 on 2026-08-15, and quoted as line ranges because this table is the worst case of the extraction problem in the corpus: seven columns (RTC, SC, SC-RJ, CMF, CMU, CC, MC, header at L359) collapse into one run of words per line, so no single line holds a whole cell and CMF is the fourth value along each of five consecutive lines. Reassembled, the residential row reads "5 feet front and street-side; 15 feet rear; 0 feet interior side" (L332-L336). A reviewer has to read the range and count columns; that is what the range citation is asking them to do, and it is honest about the work rather than pointing at a line that looks decisive and is not. The MAXIMUM front setback, 20 ft (L351-L356), is now encoded rather than living only in this note -- it is the standard that forces the pod forward on the lot and it was previously invisible to the engine. Lot size 10,000 (L296-L297) and frontage 100 (L301-L302) confirmed in the same table. quadfit confidence: verified | Base CMF regime: residential needs 10,000 sf min AND 100 ft
      street frontage; max front setback 20 ft + frontage occupancy — axis_required. NE Glisan/162nd corridors
      follow TLDR standards instead (Table 4.0430 n.14) — NOT split out; base regime applied everywhere
      = conservative.'
