      measured_on:
        fact: net_developable_area
        # This city's own subtraction list: the shorter list -- High Slope Subarea, dedicated street, private
      # accessway, the flag pole of a flag lot and the encumbered part of
      # a non-standard lot. The two overlays that come out of the minimum
      # acre stay in this one.
        cite: GDC 3.0100 "Density, Net"; the maximum-density subtraction list
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L790,L797-L799"
    notes: 'quadfit confidence: verified. Single-family detached is not permitted here and a quadplex
      is permitted natively rather than by state mandate.

      MINIMUM LOT SIZE CORRECTED 2026-08-16, 7,200 to 11,000. The 7,200 was not a standard the code
      states — it was arithmetic off the maximum density, four units divided by 24.2 units per acre,
      and the old note said as much ("approximation"). Table 4.0130 states an 11,000-square-foot
      minimum SITE size for MDR-24 outright, which is the larger constraint and the one a permit is
      measured against. Both tests still pass at 11,000: four units is 15.8 units per acre, under the
      24.2 maximum and over the 12.1 minimum.

      NOT ENCODED, and it loosens: table note 2 lets a Lot of Record smaller than the required minimum
      LOT size be developed anyway. It is written against section B (Minimum Lot Size), which in
      MDR-24 reads None for all other uses and 3,600 for a duplex, rather than against the section A
      site minimum encoded here. No condition names a lot of record, and a relief nobody can select is
      better left out than assumed.'
    max_height_ft:
      value: 35
      quote: "or/multnomah/gresham/4.0100.residential.txt#L332"
    min_lot_width_ft:
      # Table 4.0130 E.1, interior lot, the Duplex/Triplex/Quadplex row: 16 ft,
      # carrying note 7. Missing before, which meant no width test ran in
      # MDR-24 at all -- a lot too narrow for the pod read as unconstrained.
      value: 16
      quote: "or/multnomah/gresham/4.0100.residential.txt#L274"
      variants:
        - value: 70
          when: [corner_lot]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L279,L283-L285"
        - value: 16
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L277"
        # Note 8 is the only place MDR-24 states a corner townhouse width, and
        # it states three: 16 ft with an alley, 25 with a shared access, 42
        # with neither. The base is the number that binds where nothing is
        # observed, because a shared access is a plat commitment rather than
        # something true of the parcel.
