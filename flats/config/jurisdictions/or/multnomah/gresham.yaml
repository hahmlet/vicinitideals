  MDR-24:
    section: ["4.01", "7.042"]
    cite_default:
      cite: Gresham Development Code Tables 4.0120/4.0130 n.5/4.0131; Sec 3.0103
      url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf
      retrieved: '2026-07-24'
    quadplex_allowed:
      value: true
      quote: "or/multnomah/gresham/4.0100.residential.txt#L134"
    setback_front_max_ft:
      # Note 7 of Table 4.0131: "Maximum front and street-side setbacks apply
      # in MDR-12, MDR-24, OFR, as provided for the Corridor Multi-family
      # (CMF) District in Table 4.0430" (4.0100.residential #L433). The note
      # states no number -- it points -- so the quote is row H of the table it
      # points at, whose CMF column reads "20 feet front and street-side",
      # which is the figure CMF already carries here.
      # The street-side half of that same sentence has nowhere to go: this
      # registry has setback_street_side_ft but no maximum beside it.
      # Found 2026-09-07 by the blind re-read of dismissed footnotes, which
      # flagged a dismissal that had quoted this number and still declined it.
      value: 20
      cite: GDC Table 4.0131 note 7, adopting Table 4.0430 row H (CMF column)
      url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0400.pdf
      retrieved: 2026-07-24
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L351-L356"
    setback_front_ft:
      value: 10
      quote: "or/multnomah/gresham/4.0100.residential.txt#L403"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/multnomah/gresham/4.0100.residential.txt#L403"
    setback_side_ft:
      # Table 4.0131's Townhouse block names this zone in the same breath as
      # OFR -- "MDR-12, OFR, and MDR-24" at L408-L409 -- and prints a looser
      # row than the Duplex/Triplex/Quadplex one above it: interior side 5,
      # street side 8, rear 10 and 8 with an alley. Only OFR carried them.
      # Found 2026-09-07 by the blind second reading, which could not see the
      # column headers from the cited line and went looking for them.
      value: 10
      quote: "or/multnomah/gresham/4.0100.residential.txt#L403"
      variants:
        - value: 5
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L405,L408-L409"
    setback_rear_ft:
      value: 15
      quote: "or/multnomah/gresham/4.0100.residential.txt#L403"
      variants:
        - value: 10
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L405,L408-L409"
        - value: 8
          when: [unit_lots, abuts_alley]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L405,L408-L409"
    setback_street_side_ft:
      value: 20
      quote: "or/multnomah/gresham/4.0100.residential.txt#L403"
      variants:
        - value: 8
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L405,L408-L409"
    min_lot_sqft:
      # Table 4.0130 section A, Minimum Site Size, all other uses: 11,000 sq
      # ft in MDR-24. Seven district columns and seven values in the row, so
      # the column reads positionally, and the multi-family row above it
      # prints the same 11,000 under the same column.
      value: 11000
      quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L239"
    min_density_du_per_acre:
      # Table 4.0130 row C, "All uses except Manufactured Dwelling
      # Parks". A floor, and the pod is four units against it.
      value: 12.1
      quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L244-L246"
      variants:
        # Note 5: "this does not apply to lots of record less than
        # 11,000 square feet in size". Exempt rather than zero -- the
        # standard does not reach the lot, which is a different
        # sentence from a floor every lot clears.
        #
        # This band read `at_most: 10999` and said in writing that the
        # grammar had no exclusive bound. It has one -- `less_than`,
        # and fifty-five bands in this corpus use it -- so the
        # workaround had outlived its reason and was carrying its own
        # justification forward. It cost a square foot: a lot of
        # 10,999.5 is under 11,000 and the code exempts it, and this
        # file applied the floor to it. Found 2026-09-07 by the
        # footnote-application check, which reads a ruling's claim back
        # against the encoding.
        - exempt: true
          band: {measure: lot_sqft, less_than: 11000}
          quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L244-L246"
      # Article 3 computes net density on the parcel less the Natural
      # Resource, Hillside and Geologic Risk overlays, dedicated
      # right-of-way and the rest. Nothing here surveys those, so the lot's
      # own area serves as the bound it is.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list: the longer of the two lists -- Natural Resource Overlay, Hillside
      # and Geologic Risk Overlay, land under either easement, dedicated
      # street, private accessway, the flag pole of a flag lot and the
      # encumbered part of a non-standard lot.
        cite: GDC 3.0100 "Density, Net"; the minimum-density subtraction list
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L796"
    max_density_du_per_acre:
      # Row D, "Duplex, Triplex, Quadplex, Cottage Cluster". The one
      # district that prints a figure against the pod's own row.
      value: 24.2
      quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L250,L254"
      variants:
        # The same building split onto four lots is townhouses, which
        # row D holds separately.
        - value: 24.2
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L250,L257"
      # Article 3 computes net density on the parcel less the Natural
      # Resource, Hillside and Geologic Risk overlays, dedicated
      # right-of-way and the rest. Nothing here surveys those, so the lot's
      # own area serves as the bound it is.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list: the shorter list -- High Slope Subarea, dedicated street, private
      # accessway, the flag pole of a flag lot and the encumbered part of
      # a non-standard lot. The two overlays that come out of the minimum
      # acre stay in this one.
        cite: GDC 3.0100 "Density, Net"; the maximum-density subtraction list
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L790,L797-L799"
    notes: 'quadfit confidence: verified. Single-family detached is not permitted here and a quadplex
      is permitted natively rather than by state mandate.

      MINIMUM LOT SIZE CORRECTED 2026-08-16, 7,200 to 11,000. The 7,200 was not a standard the code
      states — it was arithmetic off the maximum density, four units divided by 24.2 units per acre,
      and the old note said as much ("approximation"). Table 4.0130 states an 11,000-square-foot
      minimum SITE size for MDR-24 outright, which is the larger constraint and the one a permit is
      measured against. Both tests still pass at 11,000: four units is 15.8 units per acre, under the
      24.2 maximum and over the 12.1 minimum.

      NOT ENCODED, and it loosens: table note 2 lets a Lot of Record smaller than the required minimum
      LOT size be developed anyway. It is written against section B (Minimum Lot Size), which in
      MDR-24 reads None for all other uses and 3,600 for a duplex, rather than against the section A
      site minimum encoded here. No condition names a lot of record, and a relief nobody can select is
      better left out than assumed.'
    max_height_ft:
      value: 35
      quote: "or/multnomah/gresham/4.0100.residential.txt#L332"
    min_lot_width_ft:
      # Table 4.0130 E.1, interior lot, the Duplex/Triplex/Quadplex row: 16 ft,
      # carrying note 7. Missing before, which meant no width test ran in
      # MDR-24 at all -- a lot too narrow for the pod read as unconstrained.
      value: 16
      quote: "or/multnomah/gresham/4.0100.residential.txt#L274"
      variants:
        - value: 70
          when: [corner_lot]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L279,L283-L285"
        - value: 16
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L277"
        # Note 8 is the only place MDR-24 states a corner townhouse width, and
        # it states three: 16 ft with an alley, 25 with a shared access, 42
        # with neither. The base is the number that binds where nothing is
        # observed, because a shared access is a plat commitment rather than
        # something true of the parcel.
        - value: 42
          when: [unit_lots, corner_lot]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L279,L286-L287,L382"
        - value: 16
          when: [unit_lots, corner_lot, abuts_alley]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L279,L286-L287,L382"
    min_frontage_ft:
      value: 45
      quote: "or/multnomah/gresham/4.0100.residential.txt#L314"
      variants:
        - value: 45
          when: [corner_lot]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L315,L319"
        - value: 16
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L313"
        # The cell reads "Varies depending on access" and hands the number to
        # note 10: 25 ft measured from the corner radius end point where there
        # is an alley or a shared access, 32 without. 32 is what binds until
        # one of them is observed.
        - value: 32
          when: [unit_lots, corner_lot]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L315,L316-L318,L385"
        - value: 25
          when: [unit_lots, corner_lot, abuts_alley]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L315,L316-L318,L385"
  OFR:
    section: ["4.01", "7.042"]
    cite_default:
      cite: Gresham Development Code Tables 4.0120/4.0130/4.0131; 7.0420
      url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf
      retrieved: '2026-07-24'
    quadplex_allowed:
      # Table 4.0120, Quadplex row: P in every column including this one. The
      # office/residential district permits a single detached dwelling only
      # under a limitation and a quadplex outright.
      value: true
      quote: "or/multnomah/gresham/4.0100.residential.txt#L129,L134"
    min_lot_sqft:
      # Two rows state a size here and the SITE row is the larger: 7,200 sq ft
      # under A, Minimum Site Size, against 3,600 under B, Minimum Lot Size. A
      # development on one lot has to satisfy both, so 7,200 is what binds --
      # the same reading MDR-24 already takes from row A. No `unit_lots`
      # escape: splitting the plat sets each lot's minimum to None but leaves
      # the development site the size it was.
      value: 7200
      quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L239"
    min_density_du_per_acre:
      # Row C, "All uses except Manufactured Dwelling Parks": 8.71 to the
      # acre. Four units meet that up to about 20,000 sq ft of net area, which
      # read against the 7,200 above it makes this district a window rather
      # than a floor.
      value: 8.71
      quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L244-L246"
      measured_on:
        fact: net_developable_area
        cite: GDC 3.0100 "Density, Net"; the minimum-density subtraction list for districts outside the LDR group
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L790,L800-L803"
    max_density_du_per_acre:
      # Row D prints None against "Duplex, Triplex, Quadplex, Cottage
      # Cluster", and Article 3 names OFR in the list of districts where
      # middle housing does not count toward maximum density.
      exempt: true
      quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L250,L254"
      variants:
        - value: 25
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L233-L234,L250,L257"
      measured_on:
        fact: net_developable_area
        cite: GDC 3.0100 "Density, Net"; the maximum-density subtraction list for districts outside the LDR group
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L790,L800-L801,L804"
    min_lot_width_ft:
      # E.1, the "Duplex, Triplex, Quadplex, and Cottage Cluster" line: 60
      # feet at the building line, the widest of the seven columns, and 70 on
      # a corner.
      value: 60
      quote: "or/multnomah/gresham/4.0100.residential.txt#L271-L274"
      variants:
        - value: 16
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L271-L272,L277"
        - value: 70
          when: [corner_lot]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L279,L283-L285"
        - value: 20
          when: [unit_lots, corner_lot]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L279,L286"
    min_lot_depth_ft:
      # F: 100 feet, interior or corner, and the only column of the seven that
      # states a depth at all for this building -- five of the others read
      # None.
      value: 100
      quote: "or/multnomah/gresham/4.0100.residential.txt#L289-L290,L298-L300"
      variants:
        - value: 100
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L289-L290,L301"
        - value: 100
          when: [corner_lot]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L303,L306-L308"
    min_frontage_ft:
      # G reads NA in this column on both the interior and the corner line,
      # and None on the townhouse line. Read, and no frontage standard
      # applies -- which is not the same as nobody having looked.
      exempt: true
      quote: "or/multnomah/gresham/4.0100.residential.txt#L311-L314"
    max_height_ft:
      value: 35
      quote: "or/multnomah/gresham/4.0100.residential.txt#L331,L333"
    max_far:
      # Row J states a ratio for LDR-5, LDR-7 and TR and NA for this column.
      exempt: true
      quote: "or/multnomah/gresham/4.0100.residential.txt#L347-L348"
    setback_front_max_ft:
      # Note 7 of Table 4.0131: "Maximum front and street-side setbacks apply
      # in MDR-12, MDR-24, OFR, as provided for the Corridor Multi-family
      # (CMF) District in Table 4.0430" (4.0100.residential #L433). The note
      # states no number -- it points -- so the quote is row H of the table it
      # points at, whose CMF column reads "20 feet front and street-side",
      # which is the figure CMF already carries here.
      # The street-side half of that same sentence has nowhere to go: this
      # registry has setback_street_side_ft but no maximum beside it.
      # Found 2026-09-07 by the blind re-read of dismissed footnotes, which
      # flagged a dismissal that had quoted this number and still declined it.
      value: 20
      cite: GDC Table 4.0131 note 7, adopting Table 4.0430 row H (CMF column)
      url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0400.pdf
      retrieved: 2026-07-24
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L351-L356"
    setback_front_ft:
      value: 10
      quote: "or/multnomah/gresham/4.0100.residential.txt#L399,L403-L404"
    setback_side_ft:
      # 10 feet, twice what the LDR group asks, and the Common Wall column
      # reads NA on this row -- so the party-wall relief the low-density
      # districts give a quadplex is not stated here.
      value: 10
      quote: "or/multnomah/gresham/4.0100.residential.txt#L399,L403-L404"
      variants:
        - value: 5
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L405,L408-L409"
    setback_rear_ft:
      # 15 feet, and the Rear With Alley column reads NA -- an alley buys
      # nothing here unless the plat is split, where the same table drops the
      # rear to 10 and to 8 with an alley.
      value: 15
      quote: "or/multnomah/gresham/4.0100.residential.txt#L399,L403-L404"
      variants:
        - value: 10
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L405,L408-L409"
        - value: 8
          when: [unit_lots, abuts_alley]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L405,L408-L409"
    setback_street_side_ft:
      # 20 feet, the deepest street side in the chapter, against 8 for a
      # townhouse on the row below.
      value: 20
      quote: "or/multnomah/gresham/4.0100.residential.txt#L399,L403-L404"
      variants:
        - value: 8
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L405,L408-L409"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/multnomah/gresham/4.0100.residential.txt#L399,L403-L404"
    notes: >-
      Office/Residential, the seventh column of the residential tables and the
      only one that was never read. Off-street parking is Table 4.0130 row L,
      "See Section 9.0800", a cross-reference to a chapter not in this corpus,
      so the state minimum stands. Row A's 7,200 sq ft is a minimum SITE size
      and row B's 3,600 a minimum LOT size; both are stated for this column and
      the larger is encoded, because a development on one lot has to satisfy
      both. Row I sends this column to Section 9.0600 for height
      transition, and that section is now in the store and read. It does not
      reach this building, for two independent reasons. 9.0602: "These
      standards also do not apply to single detached dwellings and middle
      housing", and Gresham''s own glossary at 3.0100 defines middle housing
      as "Duplexes, Triplexes, Quadplexes, Townhouses, and Cottage Clusters"
      -- the pod is a quadplex on one lot and townhouses on unit lots, and
      3.0100 says a quadplex divided through a Middle Housing Land Division
      is still a quadplex. And even where it applied, 9.0610(A)(1) caps a
      building at 30 ft within 35 ft of the trigger lot line, which a 26 ft
      pod clears. Recorded rather than encoded because there is nothing to
      encode: the rule exists and cannot bind.
