  #
  # NOT ENCODED: a general minimum driveway width. Gresham prints two and
  # neither is one. 7.0420(B)(2)(c)(vi), "The minimum driveway width is 9
  # feet", is the sixth condition of the paragraph allowing a COMPACTED GRAVEL
  # driveway, and reads as a floor on that concession rather than on driveways
  # at large. 7.0420(B)(2)(d)(iii), "Shared driveways shall not be less than
  # 15 feet wide", is inside the Hillside and Geologic Risk Overlay. Encoding
  # either as the city's driveway minimum would be citing a sentence for a
  # rule it does not state. (or/multnomah/gresham/7.0400.middle-housing-design.txt#L207-L227)
  #
  # NOT ENCODED: 7.0420(B)(3), garages and carports facing the street may not
  # exceed 50 percent of the frontage they face. It is the same 50 percent
  # four other cities in this corpus state, but Gresham states it of GARAGES
  # alone where they state it of garages, parking and maneuvering area
  # together. `parking_area_max_frontage_pct` is defined as the combined
  # figure, and a pod with no garage would read as unconstrained under
  # Gresham's version and constrained under everyone else's. Left out rather
  # than blurred. (or/multnomah/gresham/7.0400.middle-housing-design.txt#L229-L232)
  #
  # NOT ENCODED: 7.0420(B)(1) and 7.0431(B)(1), access shall be taken from an
  # alley where the lot abuts one. Every city in this corpus states it and no
  # parcel record here knows where the alleys are. (or/multnomah/gresham/7.0400.middle-housing-design.txt#L190-L191,L460)
  #
  # NOT ENCODED: Public Works Standards 6.03, where a driveway may meet the
  # street. Table 6.03 sets the minimum distance from a driveway centerline to
  # a curb return by street classification -- 100 feet on a Major or Standard
  # Arterial, 45 on everything else a house fronts -- and the prose adds that
  # no new driveway is allowed within 100 feet of the curb return of an
  # intersecting Major or Standard Arterial at all. Both are true of the lot
  # and neither is a dimension of the building. To apply them this screen
  # would have to know the functional class of the fronting street and where
  # its nearest curb return is, and the inventory holds neither. It is an
  # access question rather than a fitment one, and the kind that moves a
  # driveway to the other frontage rather than ending a project.
  # (or/multnomah/gresham/pws.6.03-6.04.txt#L24-L29,L36-L50)
  #
  # NOT ENCODED: Public Works Standards 6.03 note 2 to Table 6.03, "Corner lot
  # driveways on a frontage that is less than 75-feet shall be located no more
  # than 7-feet from the interior property line and shall be no more than
  # 24-feet wide." A placement rule, not a width this pod fails: 24 feet is
  # more than double the 10-foot ceiling this layer already carries, so the
  # width limb never binds, and the 7-foot limb pushes the cut to the far edge
  # of a frontage on a corner lot the screen cannot identify. Recorded so that
  # when corner lots are computed this is one of the things waiting for them.
  # (or/multnomah/gresham/pws.6.03-6.04.txt#L48-L49)
  #
  # NOT ENCODED: Public Works Standards 6.04, Clear Vision Areas -- 20 feet for
