label: Gresham
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.


  Table 4.0131 (Minimum Setbacks in Residential Districts) states the setbacks with the standards across
  the top and the districts down the side, and states each district group twice: once under "Single Detached
  Dwelling, Duplex, Triplex, and Quadplex" and once under "Townhouse". The quadplex row is the one encoded,
  because FLATS screens a four-unit building placed on one lot. The townhouse row is looser for the MDR
  group (rear 10 not 15, street side 8 not 20) and applies to the split plat, where each unit gets its
  own lot. Those setback rows are not yet encoded as `when: [unit_lots]` variants; the lot standards of
  Table 4.0130 are.


  Eleven of that table''s twelve columns are setbacks and most are variants the screen does not use: the
  front porch may stand two feet nearer the street than the wall, the common-wall and zero-lot-line options
  state a party wall rather than an envelope, "Rear With Alley" depends on an alley existing, and "Street
  Side Garage Access" is the garage setback measured from the side street. Only the facade/wall, garage,
  interior side, street-side wall and rear-no-alley columns are encoded.


  Table 4.0130 states a townhouse row beside the quadplex row for every lot standard, and those rows
  are encoded as `when: [unit_lots]` variants on the six zones the table has a column for (LDR-5,
  LDR-7, TLDR, TR, MDR-12, MDR-24). Townhouse minimum lot size is None in every column; width and
  street frontage are 16 ft per lot. The plan districts (LDR-PV, LDR-SW, DRL-1, DRL-2, CMF) are
  governed by their own chapters and get nothing from this table. Table note 7 is not encoded and
  binds the split path everywhere it applies: a townhouse lot under 22 feet wide must take access
  from an alley or a shared access, and 16 ft is always under 22. MDR-24''s min_lot_sqft is a density
  derivation (24.2 u/ac, 4 units) rather than the table''s lot-size row, so the townhouse "None" does
  not displace it — the unit count is what the density counts, and dividing the lot does not change it.
  Footnote 5 on the LDR front setback (a garage or carport entry set at 20 ft.) is carried as
  setback_garage_entrance_ft rather than folded into the front setback.


  READ AND NOT ENCODED: 7.0512, the Rockwood Design District standards. Table 4.0430 sends the RTC,
  SC and SC-RJ street setbacks there -- "Setbacks at Street: See Section 7.0512.A.2" -- which made it
  six binding references, the loudest unfetched thing in this jurisdiction. Fetched and read
  2026-08-21, and it does not reach this building. 7.0502(B): "Section 7.0501-7.0512 do not apply to:
  Single detached dwellings, duplexes, triplexes, and quadplexes (for these developments, see Section
  7.0420)." A quadplex is named in the exception list, so the encoded 5 ft minimum and 20 ft maximum
  from Table 4.0430''s Residential sub-cell stand as this building''s street setbacks in SC and SC-RJ.


  It reaches the split plat. 7.0502(A) lists Townhouses among the uses the section applies to, and
  7.0512(A)(2)(S1) is where the numbers get harder: inside the Rockwood triangle the street setback
  is set by which street the lot fronts -- 0 to 5 ft on Stark and 181st, 10 to 15 ft on Burnside,
  Pine, Oak, Ash, 185th, 187th and the two future avenues -- and outside it by district, 5 ft minimum
  and 20 ft maximum for Multi-Family and Townhouse Style in all three. A unit-lot design would owe a
  street name and a triangle boundary before any of that can be screened, and neither is measured.
  Not encoded as a `unit_lots` variant for that reason: an encoded number here would be a guess about
  which of four bands a lot sits in.


  PARKING, read 2026-08-20 and encoded as a layer default of zero. GDC 9.0802(A): "Vehicle parking
  minimums are not required for any land use type." Table 9.0851 carries no minimum column for auto
  parking -- the heading is AUTO PARKING / MAXIMUM -- and the two plan districts that restate the rule
  say minimum off-street parking for all uses is zero.


  Thirty-four of this layer''s thirty-eight zones had no parking value and were falling through to the
  state''s OAR 660-046-0220 cap of one stall per unit, so every lot in them was screened as owing four
  stalls it does not owe. A ceiling on what a city MAY require is not a reading of what it does, and
  standing in for one it was wrong in the direction that refuses a lot. The four Corridor zones that
  already stated 0 from Table 4.0430 row K keep their own citation: the same answer from the zone''s own
  table is not the same sentence, and if the city ever restores a minimum in one district the zone row is
  where it would appear.


  Bicycle parking is read and not encoded, and the reason is under READ AND NOT ENCODED: 9.0851 below. The short
  version: in eleven named districts the Quadplexes row states None outright, and everywhere else the
  long-term requirement of one space per dwelling unit is satisfiable inside the dwelling under
  9.0831(A)(1) and (A)(4)(f), which costs no site area. Nothing here holds a bicycle rack anyway.


  READ AND NOT ENCODED: 10.1700, Affordable Housing with Height and Density Bonuses. It was the loudest
  unfetched reference in the whole corpus -- thirty-four mentions, eight of them beside a number this
  screen uses, one sentence repeated in every zone chapter: "Affordable housing development is subject
  to the provisions in Section 10.1700." Fetched and read 2026-08-20. It is a bonus and nothing else.
  10.1711(G) and Table 10.1711(B) grant a density bonus of 125 to 200 percent and a height bonus of 12
  to 36 feet, and 10.1711(B)(2) switches the minimum net density off entirely. Every one of those
  loosens.


  It is also elective, and expensively so: 10.1711(A) requires every unit at 80 percent of area median
  income or an average of 60 percent, enforced by a recorded covenant for no less than thirty years. A
  market-rate quadplex does not become subject to this section by being built; an owner opts into it. So
  it is not encoded, on the two grounds this corpus already uses -- a qualifier that can only loosen is
  recorded rather than encoded, and an elective standard is not one a lot can fail.


  READ AND NOT ENCODED: Table 9.0851, Auto and Bicycle Parking Requirements. Twenty-two mentions, five
  beside a number the screen uses, and every one of them is a zone table''s parking row pointing here.
  Fetched and read 2026-08-20, and the answer was not in the table at all -- 9.0802(A) states it in one
  sentence for the whole city, and this layer carries it as a default. See the PARKING note above.


  The bicycle rows are read and not encoded. In the districts 9.0851(A)(1) lists -- LDR-7, LDR-5, LDRGB,
  LDR-PV, MDR-PV, VLDR-SW, LDR-SW, TR, TLDR, MDR-12, OFR and the Glisan and 162nd stretches of CMF --
  the Quadplexes row states None in all three columns. Everywhere else a four-unit building falls to
  (A)(2)(b) and owes one long-term space per dwelling unit and one short-term space per twenty. Neither
  consumes placeable site area: 9.0831(A)(1) says that where long-term bicycle parking is provided in a
  dwelling unit neither racks nor lockers are required, (A)(4)(f) names "contained within a dwelling
  unit" as a compliant security location, and 9.0802(F) exempts quadplexes from the parking-lot design
  standards on a unit-by-unit basis. The code supplies a compliant path that costs no ground. Four units
  against one short-term space per twenty is a fifth of a rack, which is not a fitment question at the
  resolution this screen works at.


  READ AND NOT ENCODED: 9.0200, Clear Vision Area. Eleven mentions, and the development standards of
  Downtown, Civic Neighborhood and Corridor each carry the line "Comply with Section 9.0200 - Clear
  Vision Area." Fetched and read 2026-08-26. The whole section is two paragraphs and neither states a
  dimension. 9.0201 requires a triangular clear vision area on each corner at the intersection of two
  streets or a street and a railroad, restricting sight obstructions in the right of way and on private
  property; 9.0202 requires the same on both sides of every driveway and service drive. Both then say
  the same thing: "The dimensions of the clear vision area and exceptions are described in the Public
  Works Standards (6.04)."


  THE MANUAL WAS FETCHED 2026-09-01 and the numbers are now in the store, so this refusal is no longer
  about a missing document. Public Works Standards 6.04 gives a table, and the row it gives is ours by
  name: "Driveways for Detached and Middle Housing Sites 20", against 25 for multifamily and commercial
  driveways and 40 at a street intersection. It is a triangle, measured from the back of the street
  curb, and 6.04 excludes two different things from it. Sight obstructions between 3 and 10 feet of
  height -- which reaches a STRUCTURE, so on a corner lot a 40-foot triangle is subtracted from the
  building envelope. And, in its own sentence, "No driveway or off-street parking area shall be located
  in the Clear Vision Area", which on EVERY lot puts a pair of 20-foot triangles either side of the curb
  cut where no stall may sit.


  READ AND NOT ENCODED: 7.0420(G)(1)(b), the exemption from the rear roof height limit. The plane
  itself is encoded on all six districts (G)(1) names and, since 2026-09-02, the site-plan pipeline
  derives the 20 ft rear setback from it rather than standing at Table 4.0130''s printed 15. (b) is
  the sentence that switches it off: "This rear roof height limit standard does not apply if any
  portion of the lot is located within the Hillside Geological Risk Area (HGRO) or Resource Area
  (RA)." Not encoded, and the direction matters -- this is a refusal that costs lots rather than
  inventing them. A lot inside either overlay owes the printed setback and is being screened five
  feet stricter than the code.

  It is refused rather than deferred because the shape is wrong twice over. There is no condition
  for "inside the hillside or resource overlay", and unlike most site facts in this corpus the data
  exists: quadfit fetches both layers and screens every Gresham lot against them. But the envelope
  is built at s5 and the overlays are measured at s5o, so a setback that varies per lot by overlay
  touch is a stage-ordering change and not a value. And the second half is worse than the first:
  both layers are CARVES, so a lot in either has already had that ground subtracted from its
  envelope. Handing the five feet back to a lot whose resource area was just removed is not obviously
  the code''s arithmetic, and nothing here has read 4.1100 or 4.1200 far enough to say. Two questions
  in one clause, and the conservative answer is the same for both, which is why this waits.
  (or/multnomah/gresham/7.0400.middle-housing-design.txt#L364-L365)


  Still not encoded, and now for a better reason than absence. There is no clear-vision field, and the
  shape is not a setback: a triangle cut across a corner is not an inset from a line, and writing 40
  into a corner setback would take a diagonal off the whole street side. The corner limb also needs the
  corner data this screen does not have -- 9.0201 joins fourteen other cities corner definitions waiting
  on the same computation. The driveway limb is inert for this pod rather than unmeasured: 20 feet from
  the back of curb reaches about the front setback line, and the rear-court typology parks four cars
  behind the building, so the two triangles at the cut contain front yard. A city that let front-yard
  parking in at 7.0420(B)(5)(c) takes some of it back here, and this screen never used it.
  (or/multnomah/gresham/pws.6.03-6.04.txt#L67-L119)'
ingest:
  geoid: null
  juris_city_codes:
  - GRESHAM
  zoning_layer: zoning_gresham
  zone_field: ZONE
  strip_lowercase_suffix: false
definitions:
  # "Corner Lot. A lot that has frontage on two or more streets. A corner lot
  # also includes a lot abutting the inside curve of a street with a delta
  # angle, as used on plats, of 60 degrees or more."
  #
  # The loosest of the five readings, and the only one under which a through
  # lot is a corner lot: it asks for frontage on two streets and says nothing
  # about where they go. That follows from the text rather than in spite of it.
  #
  # The curve clause is the same bend Portland writes as "120 degrees or less",
  # stated from the other side -- a delta of 60 is an interior angle of 120 --
  # so it is encoded as the interior angle the rest of the module measures.
  #
  # Alleys: 3.0100 defines a lot line abutting an alley as a rear lot line.
  corner_lot:
    test: frontage_count
    count: 2
    curve_at_or_below_deg: 120.0
    quote: "or/multnomah/gresham/3.0100.definitions.txt#L1304-L1305"
    cite: "Gresham Development Code 3.0100, Lot, Corner Lot"

crossrefs:
  "7.05":
    outcome: misread
    note: >-
      Section 7.0510 with a line break inside the number -- the sample reads "as described in
      Section 7.05 10". Gresham's Rockwood Design District chapter is held as
      7.0500.rockwood-design.txt, so the whole 7.05xx range is in the store.
  "9.08514":
    outcome: misread
    note: >-
      A parking table cell, not a section. Table 9.0851 prints footnote markers directly against
      the row labels -- "residential4, 5" -- and the extraction runs the table number into the
      marker.
  "10.0420":
    outcome: other_building
    note: >-
      "Conversion of a hotel or motel to an emergency shelter or affordable housing under Section
      10.0420." Every mention is that conversion, and Gresham's affordable housing chapter 10.1700
      is already held. A hotel converted is not a new four-unit building on a vacant lot.
  "7.0100":
    outcome: other_building
    note: >-
      Corridor Design District standards, and the corridor chapter splits the work itself, twice:
      "Design standards in Section 7.0400 for duplexes, triplexes, quadplexes, and townhouses,
      and in Section 7.0100 for new construction and remodels which meet the thresholds described
      in Section 7.0003." 7.0400 is fetched and is where this pod's design standards were read.
      7.0100 takes the commercial and mixed-use buildings on the same street.
  "7.0112":
    outcome: other_building
    note: >-
      The same split stated a third time, in Pleasant Valley. Table 4.1415A routes "Single
      Detached, Duplex, Triplex, Quadplex, Townhouse, Cottage Cluster" to 7.0400 and gives
      7.0112 to "All Other Uses", and note 7 spells out which: "new multi-family, elderly
      housing, residential facilities, mixed-use, and non-residential development". A quadplex is
      on the first list and multi-family here means five or more.
  "7.01":
    outcome: misread
    note: >-
      Not a section. "per Section 7.01 12.A.5.S1 and S2" is 7.0112 with a space dropped into it
      by extraction, and Gresham writes four digits after the point everywhere else in the code.
      Ruled with 7.0112, which is where it points.
  "7.000":
    outcome: misread
    note: >-
      The same shape, losing a digit instead of gaining a space. Pleasant Valley's height
      modifications row reads "Section 7.000 Rear Roof Height Limit Reductions", and the Rear
      Roof Height Limit is 7.0420(G) in the middle housing design chapter this corpus holds and
      reads: 21 feet at the rear setback line, rising a foot per foot of distance from the rear
      property line. Three-digit section numbers do not exist in this code.
  "6.0001":
    outcome: other_path
    note: >-
      "All developments that include townhouses shall receive both land division approval to
      create lots for the townhouses as required in Section 6.0001, and design review approval as
      required in Section 7.0001." Article 6 is land division, and creating a lot per townhouse
      is the split plat -- a path no pod in the catalog declares. Fetch it the day one does, with
      6.0500.
  "7.0001":
    outcome: procedure
    note: >-
      The design review requirement from the same sentence. It is the applicability section for
      Article 7 -- which development needs review -- and the standards that review applies to
      this building are in 7.0400, fetched and encoded. A requirement to be reviewed states no
      dimension.
  "7.0221":
    outcome: other_building
    note: >-
      "See Section 7.0221 - 7.0223 for additional requirements", the last line of 7.0400's
      manufactured dwelling park subsection. The six numbered standards above it are skirting,
      wheels and hitch mechanisms, and fire hydrants inside the park. This pod is factory-built
      and is not a manufactured dwelling sited on a rented space, so the whole subsection is
      about somebody else's building and the sections it points at are too.
  "9.0901":
    outcome: narrows_only
    note: >-
      Reached from one sentence in the rear roof height limit: "Solar energy collection equipment
      may project beyond maximum rear roof height no greater than 18 inches. See Section
      9.0901(B)." A list of what may stand above a height limit can only let a building be
      taller, never shorter, so not reading it screens the pod against the stricter number.
  "10.1520":
    outcome: narrows_only
    note: >-
      Reduction in Minimum Street Frontage, and both mentions ask for one: a Type II Adjustment
      in the flag lot standards, and a note letting LDR-7, LDR-5, TR and TLDR approve less
      frontage than the table states. It is a discretionary route to a smaller number than the
      one already screened against, and a screen that assumed the reduction would be granted
      would be guessing at a decision nobody has made.
  "6.0500":
    outcome: other_path
    note: >-
      Middle housing land division. Both mentions treat it as the procedure that turns one parent
      lot into child lots -- a flag lot driveway may serve two lots, "the parent lot or parcel of
      a middle housing land division (per Section 6.0500) shall be considered one lot". This
      screen places the pod on the lot as it stands; the split plat is a path no pod in the
      catalog declares. Fetch it the day one does.

code:
  # The city hosts the Development Code as one PDF per section series,
  # served plain (no impersonation). Layout extraction is clean (no
  # fusing); 4.0100 and 7.0400 carry rotated figure text pypdf warns
  # about and skips. The dimensional tables (4.0120/4.0130/4.0131) are
  # spatial grids with housing-type rows under lettered group headings
  # -- the housing-type dimension, explicit.
  # Article 3 is the spec the geometry stage has been working without. Every
  # standard in Article 4 is written in terms the city defines here -- corner
  # lot, flag lot, street frontage, lot width at the building line, arterial --
  # and FLATS infers all of them from shape with nothing to check the inference
  # against. A definition is a rule about what a measurement means, and it
  # belongs in the corpus for the same reason a setback does.
  - id: "3.0100.definitions"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-3.0100.pdf
    title: "Section 3.0100 - Definitions"
  - id: "4.0100.residential"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf
    title: "Section 4.0100 - Residential Land Use Districts"
  - id: "4.0200.commercial"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0200.pdf
    title: "Section 4.0200 - Commercial Land Use Districts"
  - id: "4.0300.industrial"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0300.pdf
    title: "Section 4.0300 - Industrial Land Use Districts"
  - id: "4.0400.corridor"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0400.pdf
    title: "Section 4.0400 - Corridor Land Use Districts"
  - id: "4.1100.downtown"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1100.pdf
    title: "Section 4.1100 - Downtown Land Use Districts"
    # Table 4.1130 prints its footnote markers hard against the numbers they
    # mark, and the whole table is built that way: the DRL height row reads
    # "8.71" for 8.7 units per acre with note 1, the DCL density ceiling
    # reads "608" for 60 with note 8, and the maximum front setback reads
    # "1512" for 15 with note 12. Read raw, the corroboration check compares
    # the encoded 8.7 against a line that states 8.71 and calls a correct
    # citation a misquote. Declared rather than guessed, because in a table
    # that really did state 608 the guess would bless an encoding of 60.
    glued_markers: true
  - id: "4.1200.civic-neighborhood"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1200.pdf
    title: "Section 4.1200 - Civic Neighborhood Plan District"
  - id: "4.1300.gresham-butte"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1300.pdf
    title: "Section 4.1300 - Gresham Butte Plan District"
  - id: "4.1400.pleasant-valley"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1400.pdf
    title: "Section 4.1400 - Pleasant Valley Plan District"
    # The setback tables in this chapter print their column headers as
    # rotated text, and layout extraction silently drops rotated text —
    # "Front Facade/Wall", "Front Porch", "Garage", "Interior Side" and the
    # rest never reached the store, leaving eleven columns of numbers with
    # nothing naming them. Plain mode reads them. This is why 4.0100 keeps
    # layout and these two do not: same publisher, different table.
    extraction: plain
  - id: "4.1500.springwater"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1500.pdf
    title: "Section 4.1500 - Springwater Plan District"
    # The setback tables in this chapter print their column headers as
    # rotated text, and layout extraction silently drops rotated text —
    # "Front Facade/Wall", "Front Porch", "Garage", "Interior Side" and the
    # rest never reached the store, leaving eleven columns of numbers with
    # nothing naming them. Plain mode reads them. This is why 4.0100 keeps
    # layout and these two do not: same publisher, different table.
    extraction: plain
  - id: "7.0400.middle-housing-design"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-7.0400.pdf
    title: "Section 7.0400 - Middle Housing Design Standards"
  - id: "7.0500.rockwood-design"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-7.0500.pdf
    title: "Section 7.0500 - Rockwood Design District"
  # Fetched to settle a doubt three zone notes were carrying rather than to
  # supply a number. 9.0602 excludes middle housing from the whole section,
  # and 9.0610(A) would cap a building at 30 ft near the trigger lot line
  # anyway. Neither reaches a 26 ft quadplex; see the OFR note.
  # Clear Vision Area, cited eleven times across the district chapters and
  # never fetched -- "Comply with Section 9.0200 - Clear Vision Area" sits in
  # the development standards of Downtown, Civic Neighborhood and Corridor.
  # A clear vision triangle keeps structures out of the corner of an
  # intersection, which is buildable area this screen counts in full.
  - id: "9.0200.clear-vision"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-9.0200.pdf
    title: "Section 9.0200 - Clear Vision Areas"
    # Genuinely two paragraphs, and every dimension in them is deferred to
    # the Public Works Standards -- see this layer's reading note on 9.0200,
    # which is where the refusal itself is recorded and counted.
    # So it trips the thinness guard, correctly, every single sweep. It was
    # stored once with --allow-thin on the command line and the declaration
    # never recorded that, which left the corpus watch reporting a refusal
    # for a document nobody was going to change their mind about. A flag
    # used at the keyboard and not written down is a flag that has to be
    # remembered forever by whoever runs the sweep next.
    allow_thin: true
  - id: "9.0600.height-transition"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-9.0600.pdf
    title: "Section 9.0600 - Height Transition"
  # The two loudest unfetched references in the corpus, not just in this
  # jurisdiction: eight zone tables send their parking row to 9.0851 and
  # eight send an affordable-housing sentence to 10.1700.
  - id: "9.0800.parking"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-9.0800.pdf
    title: "Section 9.0800 - Off-Street Parking and Loading"
  - id: "10.1700.affordable"
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-10.1700.pdf
    title: "Section 10.1700 - Affordable Housing with Height and Density Bonuses"
  # NOT A CODE. The Public Works Standards are an engineering manual adopted
  # by reference, and this corpus had never taken one in -- the layer's own
  # reading note on 9.0200 said so, and said fetching 6.04 was the work the
  # note was asking for. Both clear-vision sections of the Development Code
  # end on the same sentence, "The dimensions of the clear vision area and
  # exceptions are described in the Public Works Standards (6.04)", so the
  # numbers are here or they are nowhere.
  #
  # It answers in WORDS, which is the whole difference between this document
  # and Clackamas County's Drawing P100. Chapter 6 states the driveway
  # approach minimum, the residential approach maximum, and a clear vision
  # table that names Middle Housing as its own row. Standard Details 618A and
  # 618B carry the same widths in a drawing; the prose governs and the
  # drawings are not declared, because nothing needs them.
  #
  # 359 pages of pavement, water mains and sidewalk ramps, sliced to the two
  # sections the Development Code actually points at.
  - id: "pws.6.03-6.04"
    url: https://www.greshamoregon.gov/globalassets/city-departments/environmental-services/public-works-standards/public-works-standards-2026.pdf
    title: "Public Works Standards (July 2026), 6.03 Driveways and 6.04 Clear Vision Areas"
    start: "6.03 DRIVEWAYS"
    end: "6.05 SIDEWALKS"
    # Layout mode cannot even find the section headings here: it fractures the
    # numbers away from their titles across a hundred columns of padding
    # ("6.0                3        DRIVEWAYS"), which would leave the stored
    # slice starting nowhere. Plain mode reads the headings, the prose and
    # both tables -- Table 6.04 lands each measurement at the end of its
    # label's last line, which is what the clear-vision quote cites.
    extraction: plain
defaults:
  # The city says it once, in a sentence, for everything: GDC 9.0802(A),
  # "Vehicle parking minimums are not required for any land use type."
  # Table 9.0851 has no minimum column at all -- auto parking is stated as a
  # MAXIMUM and nothing else -- and the two plan districts that restate it
  # (9.0852(A)(1) Civic Neighborhood, 9.0852(B)(1) Downtown) both say minimum
  # off-street parking for all uses is zero.
  #
  # This is the largest single correction this layer has taken. Four of
  # Gresham's zones read their own Table 4.0430 row K and encoded 0; the other
  # thirty-four had nothing, so they fell through to OAR 660-046-0220's cap
  # of one stall per unit and every lot in them was screened as owing four
  # stalls -- roughly 1,300 square feet of a site that also has to hold the
  # pod and its access. The state row is a ceiling on what a city MAY require.
  # Read as what Gresham DOES require, it was wrong by four stalls a lot.
  parking_min_per_unit:
    value: 0
    cite: GDC 9.0802(A), General Provisions
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-9.0800.pdf
    retrieved: '2026-08-20'
    quote: "or/multnomah/gresham/9.0800.parking.txt#L53"

  # How big a stall is, and it comes from the same row as the aisle below --
  # Table 9.0825A, 90 degrees, standard column: 8.5 wide by 18.5 deep.
  #
  # It used to be 8.5 by 18 from GDC 7.0431(B)(5)(b), the townhouse sentence,
  # while the aisle came from Table 9.0825A. That was one rectangle assembled
  # from two rules, which is the mistake this corpus keeps writing paragraphs
  # against and had just written another one about: 8.5 by 18 with a 23-foot
  # aisle is a stall neither section states. Whichever branch of 9.0802(F) the
  # parking takes (argued below), it takes whole. The shared branch reaches
  # Table 9.0825A and the row says 18.5.
  #
  # The half foot is also the conservative direction if both rules are read as
  # applying at once, which is the other honest reading: 7.0431(B)(5)(b) is a
  # minimum ("at least 8.5 feet wide by 18 feet deep"), so a deeper stall
  # satisfies it and a shallower one fails the table.
  #
  # NOT 15.5. The Figure 9.0825A notes allow overhang (O, three feet at 90
  # degrees) to be subtracted from depth "where appropriate bumper overhang
  # area (extruded curbs) is provided" -- a curb detail no parcel record
  # states, so taking it would be crediting the site with construction nobody
  # has built.
  parking_stall_width_ft:
    value: 8.5
    cite: GDC Table 9.0825A, Off-Street Surface Parking Matrix (90 degrees, standard stall), reached via 9.0802(F) shared parking area
