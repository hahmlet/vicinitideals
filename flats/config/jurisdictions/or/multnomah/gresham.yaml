  DMU:
    section: ["4.11"]
    cite_default:
      cite: Gresham Development Code 4.1100 Tables 4.1120/4.1130 (Downtown); 7.0420(J)
      url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1100.pdf
      retrieved: '2026-07-24'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L241-L242,L246"
    notes: 'Table 4.1120 reads NP in this column for Quadplex (L246), and that is the whole screen: the use is out, so the chapter''s dimensional table is not read for this district and none of its standards are encoded. A decided RED and an unread district look identical in a count, so the distinction is worth stating -- this one is decided. Two other rows of the same table were checked before settling it, because either could have reopened the district. Multi-Family is a bare P here (L249), and does not reach this building: GDC 3.0100 defines a Multi-Family Dwelling as five or more units and adds that Multi-Family dwellings are not middle housing (3.0100.definitions.txt L939-L942). Townhouse is also a bare P (L247), and Table 4.1130 prints a whole setback row headed "Townhouse in DCC, DMU, DTM, DEM, and DCL" (L476) -- so the code plainly contemplates attached housing here. What closes it is the definition: a quadplex divided onto individual lots through a Middle Housing Land Division is still "considered a quadplex" (L962-L964), so the split plat does not move the pod into the Townhouse row. The path that is NOT ruled out is a genuine townhouse subdivision -- four lots created first, then four attached units built on them, which the Townhouse definition (L952-L954) reaches on its own terms and which the Downtown row states no minimum lot size for at all. That is a legal reading rather than a sentence in the code, so it is written down here rather than encoded as a variant; a variant on unit_lots would fire off the design catalog and turn 42 lots green on my reading rather than on Gresham''s. Note 1(a) does name DMU -- plexes on a lot of record 6,500 sq ft or smaller -- and it is not a drafting error and not an opening: the Duplex row one line above (L244) reads L1 in this column where Quadplex reads NP, so the note is serving the row that carries the marker. The table and its note agree.'
