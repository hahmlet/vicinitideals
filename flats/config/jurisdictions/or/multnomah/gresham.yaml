          quote: "or/multnomah/gresham/4.0400.corridor.txt#L416,L428"
    setback_street_side_ft:
      value: 5
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L332-L336"
    setback_front_max_ft:
      value: 20
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L351-L356"
    min_lot_sqft:
      value: 10000
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L296-L297"
      variants:
        # Note 6: the minimum lot size does not apply to lots created for
