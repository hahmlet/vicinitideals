    quote: "or/multnomah/gresham/9.0800.parking.txt#L66-L70,L302,L319-L327,L340-L343"

  # DRIVEWAY, APPROACH AND OPEN SPACE, read 2026-08-27. These are the numbers
  # the site plan generator has been applying to every city in the corpus
  # since it was written, out of a constant with a Gresham section number in
  # the comment beside it. They are encoded here so that Gresham is cited for
  # Gresham and nowhere else -- and reading them properly moved two of them.
  #
  # THE APPROACH IS NOT 18 FEET ON ONE LOT. The 18 the generator carried is
  # 7.0431(B)(2)(b), which is the TOWNHOUSE chapter: "For each set of attached
  # townhouse units, the total width of all driveway approaches on one street
  # frontage may occupy no more than 18 feet or 34 percent of that frontage,
  # whichever is greater." A quadplex on one lot is not a set of townhouses --
  # townhouses are attached units each on their own lot -- so on the plat this
  # screen actually draws, the rule is 7.0420(B)(2)(b): the combined width of
  # all approaches on a parent lot is "the lesser of: i. 30 feet per parent
  # lot, or ii. a maximum of 10 feet of driveway approach width for each
  # parking space located within a garage ... When the building does not
  # contain a garage, a maximum of 10 feet of driveway approach width for each
  # building containing residential unit(s)". The pod is one building with no
  # garage, so its allowance is ten feet, and the lesser of thirty and ten is
  # ten. Nearly half what the generator was drawing, in the strict direction.
  #
  # THE 34 PERCENT LIMB IS NOT ENCODED. "18 feet or 34 percent of that
  # frontage, whichever is greater" is a two-limb allowance and the value
  # model has one number. Eighteen is the printed figure and the conservative
  # limb -- 34 percent only exceeds it above 53 feet of frontage -- so 18 is
  # what the unit-lots variant carries, and a lot wide enough for the other
  # limb is screened tighter than the code requires rather than looser.
  # Public Works Standards 6.03, one sentence for the whole city: "All
  # driveway approach widths shall be a minimum of 9 feet wide." Not a
  # condition on a concession and not an overlay -- the Development Code's two
  # nines are one and the other (see the NOT ENCODED note below on a general
  # driveway minimum), which is why holding the approach apart from the
  # driveway was worth doing. The approach is a public-works dimension and
  # this is the manual public works keeps its numbers in.
  #
  # It pins the cut, because the ceiling directly below is ten: this pod meets
  # the street through an opening between 9 and 10 feet and widens behind the
  # property line. Nine is also exactly the width one car needs, which is what
  # the site-plan generator had been assuming citywide. An assumption that
  # turns out to match the published standard is the cheapest kind of
  # confirmation, and it is still worth writing down, because now it is cited.
  driveway_approach_min_width_ft:
    value: 9
    cite: Gresham Public Works Standards 6.03, minimum driveway approach width
    url: https://www.greshamoregon.gov/globalassets/city-departments/environmental-services/public-works-standards/public-works-standards-2026.pdf
    retrieved: '2026-09-01'
    quote: "or/multnomah/gresham/pws.6.03-6.04.txt#L52"
  driveway_approach_max_width_ft:
    value: 10
    cite: GDC 7.0420(B)(2)(b)(ii), maximum combined driveway approach width, parent lot, building with no garage
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-7.0400.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/gresham/7.0400.middle-housing-design.txt#L198-L206"
    variants:
      - value: 18
        when: [unit_lots]
        cite: GDC 7.0431(B)(2)(b), total driveway approach width per street frontage for a set of attached townhouses
        quote: "or/multnomah/gresham/7.0400.middle-housing-design.txt#L461-L466"
  # 7.0431(B)(3)(a)(iv), and it is the state model code's townhouse branch:
  # front-facade garages, front-yard parking and driveways in front of a
  # townhouse are allowed only where "outdoor off-street parking and
  # maneuvering areas do not exceed 12 feet wide on any lot" and the garage is
  # no wider than 12 feet. Twelve feet around an 8.5-foot stall is a driveway,
  # not a court, which is why the fallback at (b) sends parking to the rear
  # yard or the back facade instead. On one lot Gresham states no equivalent
  # cap at all: 7.0420(B)(3) limits GARAGES and carports facing the street to
  # half the frontage they face, and this pod has neither, so nothing in
  # 7.0420 caps the width of a surface court. Exempt on the parent lot, 12 on
  # unit lots.
  parking_maneuvering_max_width_ft:
    exempt: true
    cite: GDC 7.0420(B), which caps garages and carports facing the street and states no width limit on outdoor parking or maneuvering area
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-7.0400.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/gresham/7.0400.middle-housing-design.txt#L229-L232,L243-L247"
    variants:
      - value: 12
        when: [unit_lots]
        cite: GDC 7.0431(B)(3)(a)(iv), outdoor off-street parking and maneuvering areas on a townhouse lot
        quote: "or/multnomah/gresham/7.0400.middle-housing-design.txt#L473-L482"
  # 7.0420(B)(5)(c) is the reason this is exempt rather than true: "Two
  # parking spaces per unit may be located in a driveway, in the front or
  # street side yard setback, or in the rear yard setback when there is an
  # alley." Gresham affirmatively allows front-yard parking for middle
  # housing on a parent lot, so there is no prohibition to encode. It appears
  # only on the townhouse fallback path -- 7.0431(B)(3)(b)(i), "No off-street
  # parking shall be allowed in the front yard or side yard of a townhouse" --
  # and that path is reached only by a project that fails the five standards
  # at (a), which is a condition about a project rather than a lot and is not
  # encoded.
  parking_front_prohibited:
    exempt: true
    cite: GDC 7.0420(B)(5)(c), two spaces per unit allowed in a driveway in the front or street side yard setback
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-7.0400.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/gresham/7.0400.middle-housing-design.txt#L243-L247"
  # 7.0420(D)(1): "A minimum of 15 percent of the gross area of the parent lot
  # shall be included as private outdoor open space." The townhouse chapter
  # states the same number against a different denominator -- 7.0431(D)(1),
  # "15 percent of the gross lot area of the townhouse project" -- so the
  # figure does not move with the plat and no variant is needed. Both cap
  # hardscape at half the required area and both count porches, balconies,
  # landscaped yard and preserved natural areas toward it; a rear court is not
  # among them, which is why this is subtracted from the lot before a plan is
  # laid out rather than shared with the parking.
  #
  # 7.0420(D)(1)(c) adds one tree per 3,000 sq ft of gross lot area inside the
  # open space. A tree is not a dimension this screen holds and it is not
  # encoded; it does not change the area.
  open_space_min_pct:
    value: 15
    cite: GDC 7.0420(D)(1), private open space, and 7.0431(D)(1) for townhouse projects
    url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-7.0400.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/gresham/7.0400.middle-housing-design.txt#L262-L266,L519-L521"
  #
  # NOT ENCODED: a general minimum driveway width. Gresham prints two and
  # neither is one. 7.0420(B)(2)(c)(vi), "The minimum driveway width is 9
  # feet", is the sixth condition of the paragraph allowing a COMPACTED GRAVEL
  # driveway, and reads as a floor on that concession rather than on driveways
  # at large. 7.0420(B)(2)(d)(iii), "Shared driveways shall not be less than
  # 15 feet wide", is inside the Hillside and Geologic Risk Overlay. Encoding
  # either as the city's driveway minimum would be citing a sentence for a
  # rule it does not state. (or/multnomah/gresham/7.0400.middle-housing-design.txt#L207-L227)
  #
  # NOT ENCODED: 7.0420(B)(3), garages and carports facing the street may not
  # exceed 50 percent of the frontage they face. It is the same 50 percent
  # four other cities in this corpus state, but Gresham states it of GARAGES
  # alone where they state it of garages, parking and maneuvering area
  # together. `parking_area_max_frontage_pct` is defined as the combined
  # figure, and a pod with no garage would read as unconstrained under
  # Gresham's version and constrained under everyone else's. Left out rather
  # than blurred. (or/multnomah/gresham/7.0400.middle-housing-design.txt#L229-L232)
  #
  # NOT ENCODED: 7.0420(B)(1) and 7.0431(B)(1), access shall be taken from an
  # alley where the lot abuts one. Every city in this corpus states it and no
  # parcel record here knows where the alleys are. (or/multnomah/gresham/7.0400.middle-housing-design.txt#L190-L191,L460)
  #
  # NOT ENCODED: Public Works Standards 6.03, where a driveway may meet the
  # street. Table 6.03 sets the minimum distance from a driveway centerline to
  # a curb return by street classification -- 100 feet on a Major or Standard
  # Arterial, 45 on everything else a house fronts -- and the prose adds that
  # no new driveway is allowed within 100 feet of the curb return of an
  # intersecting Major or Standard Arterial at all. Both are true of the lot
  # and neither is a dimension of the building. To apply them this screen
  # would have to know the functional class of the fronting street and where
  # its nearest curb return is, and the inventory holds neither. It is an
  # access question rather than a fitment one, and the kind that moves a
  # driveway to the other frontage rather than ending a project.
  # (or/multnomah/gresham/pws.6.03-6.04.txt#L24-L29,L36-L50)
  #
  # NOT ENCODED: Public Works Standards 6.03 note 2 to Table 6.03, "Corner lot
  # driveways on a frontage that is less than 75-feet shall be located no more
  # than 7-feet from the interior property line and shall be no more than
  # 24-feet wide." A placement rule, not a width this pod fails: 24 feet is
  # more than double the 10-foot ceiling this layer already carries, so the
  # width limb never binds, and the 7-foot limb pushes the cut to the far edge
  # of a frontage on a corner lot the screen cannot identify. Recorded so that
  # when corner lots are computed this is one of the things waiting for them.
  # (or/multnomah/gresham/pws.6.03-6.04.txt#L48-L49)
  #
  # NOT ENCODED: Public Works Standards 6.04, Clear Vision Areas -- 20 feet for
  # a middle housing driveway, 40 at a street intersection. The full reading is
  # in this layer's note on 9.0200 above, which is where the Development Code
  # sent us and where the refusal is counted.
  # (or/multnomah/gresham/pws.6.03-6.04.txt#L67-L119)

