      quote: "or/multnomah/gresham/4.0400.corridor.txt#L143,L148"
    notes: 'Table 4.0420 reads NP for Quadplex (L148), and here the rest of the residential block reads NP with it -- Duplex, Triplex, Townhouse and Cottage Cluster all prohibited, and Single Detached too. This is a commercial district that admits housing only as Multi-Family above a ground floor of shops (note 6: on arterials and boulevards, half the street-facing frontage within 40 feet of the street must be commercial or institutional), and Gresham''s Multi-Family Dwelling is five units or more and expressly not middle housing. There is no path for a four-unit pod on one lot and none for the split plat either, so this is a settled RED rather than an unread district.'
