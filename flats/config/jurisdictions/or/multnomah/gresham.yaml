  CMF:
    section: ["4.04", "7.042"]
    cite_default:
      cite: Gresham Development Code 4.0400 Tables 4.0420/4.0430 (Corridor); 4.0433 and 7.0512.A.2; 7.0420(J)
      url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0400.pdf
      retrieved: '2026-07-24'
    quadplex_allowed:
      value: true
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L148"
    max_height_ft:
      # Table 4.0430 I, the CMF column: 45 feet, and note 18(ii) states the
      # same number for townhouses in as many words -- "Maximum Building
      # Height: 45 feet". Two readings of the row, one number, which is why
      # this cell needs no election between the quadplex and townhouse paths.
      #
      # The variant is the corridor problem this district keeps posing. Note
      # 14 sends "the areas of CMF along the NE Glisan Street and NE 162nd
      # Avenue corridors" to the TLDR standards of Table 4.0130, where the
      # height is 35 feet -- TIGHTER than the district's own 45. That is the
      # opposite direction from the other CMF standards, where the base is the
      # stricter reading, so it is worth saying plainly: here the base is the
      # looser one and the corridor is where the number drops.
      #
      # Encoded on civic_corridor, the registered fact that already governs
      # two other CMF rows, rather than written across all 665 lots. Applying
      # a corridor standard to a district is the error the density ruling on
      # this same note refused to make. The fact is assumed unknown, so every
      # CMF lot reports the corridor as unobserved and none can be certified
      # on the 45 either way.
      #
      # Both numbers clear a 26 ft pod, so nothing about today's verdict turns
      # on which one binds. That is the reason to write the pair down while it
      # is cheap rather than when it is not.
      value: 45
      cite: Gresham Development Code Table 4.0430 I; 4.0434, Table note 18(ii)
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L359,L373,L497"
      variants:
        - value: 35
          when: [civic_corridor]
          # Note 14 states the reference and not the number: it sends these
          # areas to "development standards of Tables 4.0130 and 4.0131 for
          # the TLDR district" and prints no height at all. So the quote is
          # the cell that prints 35 -- Table 4.0130 H, TLDR column, in the
          # residential chapter -- and the corridor note lives in the cite,
          # which is where the reader needs it to know why this column.
          cite: Gresham Development Code Table 4.0430, note 14, adopting Table 4.0130 H (TLDR)
          quote: "or/multnomah/gresham/4.0100.residential.txt#L330,L332"
    setback_front_ft:
      value: 5
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L332-L336"
    setback_side_ft:
      value: 0
      quote: "or/multnomah/gresham/4.0400.corridor.txt#L332-L336"
      variants:
        # Table 4.0430 note 1 states the townhouse yards, and they are tighter
        # than the multi-family row above: a side that is not a party wall owes
        # 5 feet where the base row owes none.
        - value: 5
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L416,L422"
        - value: 0
          when: [unit_lots, attached_wall]
          quote: "or/multnomah/gresham/4.0400.corridor.txt#L416,L423"
    setback_rear_ft:
