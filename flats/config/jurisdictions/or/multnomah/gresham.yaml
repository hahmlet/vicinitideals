    notes: 'Read against Tables 4.0420 and 4.0430 on 2026-08-19. A quadplex is a bare P here (L148), which makes this the loosest use permission left in Gresham -- and the lot standards are what bind: 10,000 sq ft and 100 feet of street frontage for anything residential, against a 5,000 sq ft Downtown and 4,000 in the DRL blocks. Splitting the plat escapes both, which is why note 6 and note 11 ride as unit_lots variants. The setbacks come from the Residential sub-cell of row G (L343-L347), which prints identical numbers in the RTC, SC and SC-RJ columns -- a reviewer has to read the range and count columns, and the range is what asks them to. Two readings of this table were left out on purpose. The minimum-density cell names Townhouses and multi-family and nothing else, and Gresham defines a Multi-Family Dwelling as five units or more that is expressly not middle housing (3.0100.definitions.txt L939-L942) -- so a quadplex on one lot is neither, and the floor is encoded as not applying rather than borrowed from the nearest cell that does. The lot width/depth ratio of row C, 0.5 to 1, is a standard this registry has no field for and cannot be restated as a depth in feet. The height ceiling is ten STOREYS and the chapter prints no figure in feet for this district anywhere; note 18 states 45 feet for townhouses and only for townhouses, so the storey count is what is encoded and max_height_stories exists because of this row. Row H''s maximum front setback is delegated to Section 7.0512.A.2 inside the Rockwood Design District, which the footnote ledger already holds as unmeasured.'
