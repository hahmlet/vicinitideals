  DRL-1:
    section: ["4.11", "7.042"]
    min_density_du_per_acre:
      # The Minimum Residential Net Density row of Table 4.1130, which
      # neither DRL block read when the rest of the table was encoded. A
      # floor stated per acre is not a floor a small lot can fail: four
      # units on 4,000 sq ft is 43 units to the acre. It bites at the other
      # end -- 8.7 units per acre asks five units of a half-acre lot and
      # nine of a full one, and a four-unit pod on either is short. That is
      # the false GREEN this field exists to close, and it was open here.
      value: 8.7
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L435-L437"
      # Article 3 computes net density on the parcel less the Natural
      # Resource, Hillside and Geologic Risk overlays, dedicated
      # right-of-way and the rest. Nothing here surveys those, so the lot's
      # own area serves as the bound it is.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list: the longer of the two lists -- Natural Resource Overlay, Hillside
      # and Geologic Risk Overlay, land under either easement, dedicated
      # street, private accessway, the flag pole of a flag lot and the
      # encumbered part of a non-standard lot.
        cite: GDC 3.0100 "Density, Net"; the minimum-density subtraction list
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L796"
    max_density_du_per_acre:
      # The Maximum Residential Net Density row, and DRL-1 is the only
      # Downtown sub-district that states one for this building: "Townhouse
      # 25; All other uses: 12.45". A quadplex is one of the other uses, so
      # 12.45 units per acre is the ceiling, and read against the floor
      # above it leaves a narrow window -- four units need at least 4/12.45
      # of an acre to satisfy the ceiling and at most 4/8.7 to satisfy the
      # floor, which is roughly 14,000 to 20,000 sq ft of net area. The lot
      # size row asks 4,000. Most of this sub-district is therefore too
      # SMALL for a four-unit pod on one lot, which is the opposite of what
      # every other standard in the chapter suggests, and it was invisible
      # until this row was read.
      value: 12.45
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L441-L444"
      variants:
        # The same four units split onto four lots are townhouses, which
        # the cell holds separately and much more loosely.
        - value: 25
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.1100.downtown.txt#L441-L444"
      # Article 3 computes net density on the parcel less the Natural
      # Resource, Hillside and Geologic Risk overlays, dedicated
      # right-of-way and the rest. Nothing here surveys those, so the lot's
      # own area serves as the bound it is.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list: the shorter list -- High Slope Subarea, dedicated street, private
      # accessway, the flag pole of a flag lot and the encumbered part of
      # a non-standard lot. The two overlays that come out of the minimum
      # acre stay in this one.
        cite: GDC 3.0100 "Density, Net"; the maximum-density subtraction list
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L790,L797-L799"
    max_height_ft:
      value: 35
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L426"
    max_far:
      # The Maximum Floor Area Ratio row, read across the eight columns of
      # Table 4.1130. It applies to the whole sub-district, so unlike
      # Springwater and Pleasant Valley there is no townhouse row to escape
      # into.
      value: 1.0
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L430"
    cite_default:
      cite: Gresham Development Code 4.1100 Tables 4.1120/4.1130 (Downtown); 7.0420(J)
      url: https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1100.pdf
      retrieved: '2026-07-24'
    quadplex_allowed:
      value: true
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L246"
    setback_front_ft:
      value: 10
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L495"
    setback_side_ft:
      value: 5
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L499"
      variants:
        - value: 0
          when: [attached_wall]
          quote: "or/multnomah/gresham/4.1100.downtown.txt#L504"
    setback_rear_ft:
      value: 10
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L506"
      variants:
        - value: 6
          when: [abuts_alley]
          quote: "or/multnomah/gresham/4.1100.downtown.txt#L507"
    setback_street_side_ft:
      value: 10
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L500"
    setback_garage_entrance_ft:
      value: 20
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L497"
    min_lot_sqft:
      value: 4000
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L511"
      variants:
        # "Townhouse: None" -- a standard that does not apply, which is a
        # different answer from one nobody encoded.
        - exempt: true
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.1100.downtown.txt#L513"
    min_lot_width_ft:
      value: 35
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L514"
      variants:
        - value: 16
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.1100.downtown.txt#L517"
        # The corner row is the larger number in both halves of the cell:
        # 40 feet where the interior row asks 35, 20 where it asks 16.
        - value: 40
          when: [corner_lot]
          quote: "or/multnomah/gresham/4.1100.downtown.txt#L515"
        - value: 20
          when: [unit_lots, corner_lot]
          quote: "or/multnomah/gresham/4.1100.downtown.txt#L517"
    min_frontage_ft:
      value: 35
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L518"
      variants:
        - value: 40
          when: [corner_lot]
          quote: "or/multnomah/gresham/4.1100.downtown.txt#L518-L520"
        - value: 16
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.1100.downtown.txt#L521"
        - value: 20
          when: [unit_lots, corner_lot]
          quote: "or/multnomah/gresham/4.1100.downtown.txt#L521"
    min_lot_depth_ft:
      value: 70
      quote: "or/multnomah/gresham/4.1100.downtown.txt#L516"
    orientation_constraint:
      # 7.0420(J)(1)(a): "A minimum of 50 percent of the site's frontage shall
      # be occupied by buildings oriented to the abutting street", measured
      # "between the minimum and maximum front setback". J.1 scopes it to
      # plexes in the Downtown, Rockwood, Civic and Corridor Design Districts,
      # which is why the quote opens on the scoping sentence rather than the
      # standard: half the frontage built out, in a band a few feet deep, is
      # only reachable with the long axis parallel to the street.
      #
      # Note 16 of Table 4.1130 releases the maximum front setback "once all
      # minimum building frontage requirements of the street type have been
      # satisfied", which is the same standard read from the other end and
      # does not loosen this one.
      value: axis_required
      quote: "or/multnomah/gresham/7.0400.middle-housing-design.txt#L410-L418"
    notes: 'Read against Table 4.1130 on 2026-08-15. The governing row is the one headed "Single-detached, duplex, triplex, and quadplex dwellings in any district; and Townhouse and Cottage Cluster in DRL-1 and DRL-2" (L492), which names this building twice over, and its numbers hold across every street type the row prints -- so nothing here depends on which street the lot fronts. Front is the facade line (10, L495); the garage face is a separate and much deeper standard (20, L497) and is now encoded rather than left to bind invisibly. Side interior is 5 (L499) with a common-wall 0 (L504) as an `attached_wall` variant; rear is 10 without an alley (L506) and 6 with one (L507). Street side is 10 (L500). Lot area 4,000 (L511), width 35 at the building line with 16 on a townhouse unit lot (L514/L517), frontage 35 (L518). The same row states a 70 ft minimum interior-lot DEPTH (L516) and FLATS has no depth field -- the second jurisdiction where that hole has now surfaced, after the sweep found it in Fairview 19.30. Not encodable until the field exists. quadfit confidence: verified | Downtown. MAXIMUM front setback 15-20 ft + >=50% frontage occupancy
      (7.0420(J)) effectively force the long axis parallel to the street — axis_required. Max-front-setback
      placement band not modeled (blind spot).'
