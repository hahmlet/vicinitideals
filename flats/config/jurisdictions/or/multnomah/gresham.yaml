      this corpus, so the state minimum stands rather than a number read out of
      this table. Row L, alley access for garage entrances, reads N/A against
      All Other Uses here and is not encoded. Row H sends the quadplex row to
      Section 7.0400 for rear height limits, and that is now read and carried.
      7.0420(G)(1) allows 21 ft of roof at the rear setback line and a foot
      more for every foot further back, so a 26 ft pod stands 25 ft off the
      rear property line rather than the 20 this table prints, and 13 rather
