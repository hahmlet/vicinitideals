        fact: net_developable_area
        # This city's own subtraction list: the shorter list -- High Slope Subarea, dedicated street, private
      # accessway, the flag pole of a flag lot and the encumbered part of
      # a non-standard lot. The two overlays that come out of the minimum
      # acre stay in this one.
        cite: GDC 3.0100 "Density, Net"; the maximum-density subtraction list
        quote: "or/multnomah/gresham/3.0100.definitions.txt#L788-L790,L797-L799"
    notes: 'quadfit confidence: verified | Quadplex P outright. Rear w/ alley 8 ft (not modeled). FAR
      1.0. Height 35 ft.'
    min_frontage_ft:
      value: 35
      quote: "or/multnomah/gresham/4.0100.residential.txt#L314"
      variants:
        - value: 16
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L313"
        # Table 4.0130 G.2, the corner-lot row. The interior number above
        # it is not the standard for a corner, so encoding only the interior one
        # measured corner lots against a number the code does not state for them.
        - value: 40
          when: [corner_lot]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L315,L319"
        # The townhouse row prints None on a corner -- no standard, rather than
        # the interior number carried over. Stated so a corner unit-lots lot
        # resolves one variant rather than two.
        - exempt: true
          when: [unit_lots, corner_lot]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L315,L316"
    min_lot_width_ft:
      value: 35
      quote: "or/multnomah/gresham/4.0100.residential.txt#L274"
      variants:
        - value: 16
          when: [unit_lots]
          quote: "or/multnomah/gresham/4.0100.residential.txt#L277"
        # Table 4.0130 E.2, the corner-lot row. The interior number above
        # it is not the standard for a corner, so encoding only the interior one
