  R7:
    cite_default:
      cite: Portland Zoning Code 33.110 Tables 110-2/110-4/110-5/110-7
      url: https://www.portland.gov/sites/default/files/code/110-sd-zone_2.pdf
      retrieved: '2026-07-24'
    quadplex_allowed:
      value: true
      quote: "or/multnomah/_unincorporated/33.110.txt#L313"
    max_height_ft:
      # Table 110-4, "Maximum Height": 30 ft. in RF, R20, R10, R7 and R5, and
      # 35 ft. in R2.5. The header row is quoted with the standard's row
      # because the table puts all six districts on one printed line.
      #
      # Note [3] hangs on this cell and is already ruled in the footnote
      # ledger: "additional FAR and height may be allowed. See 33.110.265.F"
      # -- a relaxation, and it can only raise the ceiling.
      value: 30
      cite: PCC 33.110 Table 110-4; 33.110.215
      quote: "or/multnomah/_unincorporated/33.110.txt#L435,L454"
    min_density_trigger_lot_sqft:
      # 33.110.205.C.1, one sentence: "In the R7 zone, a minimum of two
      # dwelling units are required on sites that are 14,000 square feet or
      # larger in total site area." A minimum density stated as a count over a
      # lot-size trigger rather than as a rate over an acre, which is why it
      # lands on this pair of fields and not on min_density_du_per_acre.
      #
      # The pod is four units and clears it on every lot in the zone. Encoded
      # anyway: a standard the corpus does not hold is one nobody can see was
      # considered, and 33.110.205.B is the kind of sentence that gets missed
      # -- "the minimum dwelling unit density standard applies to new
      # development when at least one dwelling unit is proposed", with sites
      # in the Constrained Sites overlay zone exempt. That exemption relaxes a
      # floor four units already clear, so declining it costs nothing.
      #
      # Both lines are quoted because the sentence wraps: the zone and the
      # count are printed on one, the trigger on the next.
      value: 14000
      cite: PCC 33.110.205.C.1
      quote: "or/multnomah/_unincorporated/33.110.txt#L421,L422"
    min_units_at_trigger:
      value: 2
      cite: PCC 33.110.205.C.1
      quote: "or/multnomah/_unincorporated/33.110.txt#L421,L422"
    setback_front_ft:
      value: 15
      quote: "or/multnomah/_unincorporated/33.110.txt#L458"
    setback_side_ft:
      value: 5
      quote: "or/multnomah/_unincorporated/33.110.txt#L460"
    setback_rear_ft:
      value: 5
      quote: "or/multnomah/_unincorporated/33.110.txt#L462"
    min_lot_sqft:
      value: 4200
