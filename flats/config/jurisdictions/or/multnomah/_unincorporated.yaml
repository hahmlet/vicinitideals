label: Multnomah Unincorporated
kind: unincorporated
eligible: true
notes: >-
  Ported from quadfit rules.yaml. Every value is `draft` -- quadfit's verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED:
  orientation_constraint='entrance_only'. quadfit justified this in a YAML comment with no
  citation; it needs its own encoding rather than invented provenance.


  PARKING WAS HALF READ ON PURPOSE, AND THE OTHER HALF IS NOW READ -- to the opposite conclusion
  from the one this note predicted. On 2026-08-30 MCC 39.6500 through 39.6600 went into `defaults`
  -- stall, aisle, driveway, street setback, the Apartment row -- and it is the COUNTY's chapter.
  R20, R10, R7, R5 and RF are Portland-administered pockets whose dimensions come from PCC 33.110,
  and 1,489 of this layer's 1,578 pod-fitting lots are in them. This note used to say their parking
  chapter, PCC 33.266, was unfetched and could only ADD greens when read. It was fetched and read
  on 2026-09-01, and it adds nothing.


  What 33.266 states for a fourplex on ONE LOT: a 9 by 18 space (33.266.120.D.1), a 9-foot driveway
  (D.2), and no aisle at any angle -- the word does not appear in the section. Table 266-4's 8.5 by
  16 with a 20-foot aisle belongs to 33.266.130, which 120.B.1 reaches only for parking in a
  parking TRACT, and 33.910 defines a tract as land created by a land division that is "not a lot".
  A court on the same lot as its building is not one. See the Portland layer, where the same
  sentence was read the other way for a week and is now corrected.


  So the two codes AGREE on the rectangle -- 9 by 18 either way -- and where they differ the
  county's number is the stricter one every time: a published 25-foot aisle against Portland's
  silence, a 20-foot drive against 9, and a parking street setback equal to the building setback
  (10 to 20 ft here) against Portland's flat 10. The pockets therefore keep the county's chapter,
  and no pocket zone carries a parking value of its own.


  WHAT IS ACTUALLY OPEN IS NOT THE READING, IT IS THE ADMINISTRATION. Nothing stored says whose
  development code governs parking on this land. MCC 39 has no R5/R7/R10/R20 article at all --
  which is exactly why the dimensions are read from PCC 33.110 -- but MCC's own parking chapter is
  written for every base zone and hands parking to nobody. Until a document says which chapter
  applies, the stricter one stands, which is the only choice that cannot manufacture a green. The
  question is worth an email rather than an argument, and the whole prize is small: of the 2,027
  pocket-area lots this pipeline evaluates, 1,806 die on Portland's Constrained Sites overlay and
  160 on a minimum lot area, leaving 39 that fail only because no site plan fits (18 in R10, 19 in
  R7, 2 in R20). Those 39 lots are what Portland's 9-foot driveway would be worth here.


  What the county's own zones get out of the reading now: LR-7 (89 pod-fitting lots), LR-5,
  LR-10, MR-4 and the rural articles, all of which point at 39.6500 and none of which state a
  dimension.
ingest:
  geoid: null
  juris_city_codes:
  - UNINCORPORATED
  - ''
  zoning_layer: zoning_metro
  zone_field: ZONE
  strip_lowercase_suffix: false
definitions:
  # "Lot (Corner) - A lot which occupies an interior angle of less than 135
  # degrees, formed by the intersection of two streets or a street and an
  # accessway."
  #
  # Indexed under "Corner Lot - See Lot (Corner)" and stated here. The angle is
  # the county's whole test: no count of streets, no requirement that the
  # frontages be adjacent sides, just an interior angle formed by an
  # intersection. Closest to Rivergrove and not the same -- "less than 135"
  # excludes 135 where Rivergrove's "does not exceed 135" includes it, which is
  # why angle_inclusive is written out rather than left to a default.
  #
  # An accessway counts alongside a street, and no layer we hold records
  # accessways, so the definition is marked incomplete: it may answer yes on
  # two streets, and it may never answer no, because an accessway it cannot see
  # could make the answer yes.
  corner_lot:
    test: adjacent_frontages
    max_intersection_angle_deg: 135.0
    angle_inclusive: false
    incomplete: >-
      an intersection formed by a street and an accessway also makes a corner,
      and no layer held records accessways
    quote: "or/multnomah/_unincorporated/39.2000.definitions.txt#L836-L839"
    cite: "MCC 39.2000, Lot (Corner)"

crossrefs:
  "11":
    outcome: fee_in_lieu
    note: >-
      Title 11, Trees, arriving here the same way "0.7" does -- this layer holds Portland's Chapter
      33.110, so Portland's cross-references come with it. Ruled with 11.50 below.
  "11.50":
    outcome: fee_in_lieu
    note: >-
      Trees in Development Situations. The ruling is Portland's, in or/multnomah/portland.yaml, and
      it is not being borrowed by analogy: 11.50.050 A and 11.50.040 A.1 each apply the chapter to
      "sites within the city AND the County Urban Pocket Areas" by name, which is exactly the
      1,489 Portland-administered pockets this layer screens. Same answer -- preservation and
      density both discharge in cash, so the chapter costs money and not buildable ground.
  "0.7":
    outcome: misread
    note: >-
      A figure, not a section: "0.7 to 1" from the Maximum FAR row of Table 110-4. This layer
      holds Portland's Chapter 33.110 -- the file's own metadata records it came from portland.gov
      -- so Portland's table cells arrive here too.
  "004":
    outcome: misread
    note: >-
      "OAR 660, Division 004" broken across the extraction, leaving the division number to match
      the abbreviation branch as a county section. State law is counted separately by state_law()
      and is not a dangling city chapter.
  "39.3140":
    outcome: narrows_only
    note: >-
      "Except as provided in MCC 39.3140(B) and 39.4782(A) and (B), the minimum lot size of a
      single family detached dwelling shall be 10,000 square feet." 39.3140(B) is the Lots of
      Record definition -- an exception letting an undersized existing lot be built on. It can
      only lower the minimum this screen already applies, so leaving it unread keeps the stricter
      test.
  "39.3120":
    outcome: narrows_only
    note: >-
      The same Lots of Record exception in the OCI zone: "Except as provided in MCC 39.3120,
      39.4682, and 39.4685, the minimum lot size shall be one acre." An exception that lets a
      smaller existing lot qualify cannot make the one-acre figure larger.
  "39.3090":
    outcome: narrows_only
    note: >-
      The same Lots of Record exception in the rural residential zones, against a five-acre
      minimum. Reading it could only admit lots this screen already rejects, never reject one it
      admits.
  # Rulings on "39.8045", "39.8040" and "39.8050" stood here for the length of one edit and the
  # ledger now calls all three stale, which is the right answer: MCC 39.8000 through 39.8050 is
  # fetched, so nothing points at an unfetched 39.80-anything any more. Worth saying what they
  # said, because the first of them is why the document is here. MCC 39.6585(A) redirects "the
  # landscaped areas requirements of MCC 39.8045 (C) (3) to (7)" onto every parking area inside
  # 39.6555(A)'s scope -- which is every parking area except one serving a single-family or
  # two-family dwelling. So a section headed "for developments subject to design review plan
  # approval" reaches a building design review may never see. 39.8040 is narrative approval
  # criteria and 39.8050 sells 25 percent off the parking dimensions at a counter; both are
  # refused in `defaults`, beside the numbers 39.8045 produced.
  "29.014":
    outcome: procedure
    note: >-
      Certificate of Occupancy, from 39.6530(A): the parking has to be built before one issues,
      or a performance bond filed instead. A sequencing rule for a permit, not a standard the
      ground has to meet.
  "39.6780":
    outcome: other_path
    note: >-
      Signs. 39.6575 is one sentence long -- "Signs, pursuant to the provisions of this subpart
      shall also meet MCC 39.6780" -- and a sign is not a thing this pod places. It is here
      because the sentence stands inside the parking chapter and would otherwise read as an
      unfetched qualifier on a parking standard.
  "39.9610":
    outcome: other_building
    note: >-
      "The minimum yard and other setbacks for a mobile home park shall be as required under MCC
      39.9610." One sentence under the MR-4 yard table, which is why it stands beside four
      encoded standards. A mobile home park is not the building this screen places.

code:
# R10/R20/RF/R7 are Portland-administered pockets: the standards live in
# PCC 33.110, the same chapter PDF the Portland layer declares. LR7 (MCC
# S-1) and RR (MCC 39.4350) cite the Multnomah County Code, which still
# needs its own declared source.
- id: "33.110"
  url: https://www.portland.gov/sites/default/files/code/110-sd-zone_2.pdf
  title: Chapter 33.110 Single-Dwelling Zones (Portland-administered pockets)
# The county serves MCC Chapter 39 as one 476-page PDF; the slice keeps the
# LR-7 article (39.4848-39.4862, dimensional requirements at 39.4862). LR7's
# encoded values remain Model-Code-derived (OAR 660-046 preemption, see the
# zone notes) — this is the MCC text a reviewer weighs them against.
# MCC 39.2000 is Part 2 of the zoning chapter -- the county's own definitions.
# The same PDF as the LR-7 slice and read plain rather than layout, because
# the chapter is set in two columns and layout mode splits a definition across
# the column break: "Lot (Corner) - A lot which occupies an interior angle of
# less than 135 degrees, formed by the" ends one line range and "intersection
# of two streets or a street and an accessway" opens another forty lines
# earlier in the file. A quote has to be able to state the whole rule.
- id: "39.2000.definitions"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.2000 Definitions (Chapter 39, Part 2)
  extraction: plain
  start: "PART 2"
  end: "PART 3"
  nth: 2
  # A definitions chapter is prose about words, so it carries almost no
  # dimensioned standards -- 36 lines of 1335 -- and the thinness guard reads
  # that as a landing page. It is not one. Read 2026-08-18: the slice runs
  # from "PART 2 - DEFINITIONS" to Part 3 and states the county's own
  # definitions of lot, corner lot, street and alley.
  allow_thin: true
# The Rural Residential article, from the same chapter PDF. RR's use flag was
# the one value in this layer with no citation, on the honest ground that
# nothing stored said it -- so the article was sliced rather than the sentence
# guessed at. Plain for the same two-column reason as the rest.
- id: "39.rural-residential"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4350-39.4395 Rural Residential (RR)
  start: "39.4350- PURPOSE"
  end: "39.4400- PURPOSE"
  extraction: plain
- id: "39.lr-7"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4848-39.4862 Low Density Residential LR-7 (formerly S-1)
  # Two-column PDF: layout mode interleaves the columns; plain mode reads
  # them in order. The double-spaced heading skips the TOC's "39.4848-".
  start: "39.4848  PURPOSE"
  end: "39.4868"
  extraction: plain
# The four resource base zones, sliced out of the same chapter PDF as the
# LR-7 and Rural Residential articles above. Together they carry 305 of the
# 424 lots this layer could not answer, and all four end the same way: a
# closed use list whose only residential entry is a single family dwelling.
# Plain extraction for the two-column reason stated above.
# The two urban low-density articles either side of LR-7. Both are sliced from
# the same chapter PDF, both set their purpose heading with a double space and
# no dash the way MUF does, and between them they answer 19 of the lots this
# layer could not.
# The three articles that close out this layer's MCC labels: the medium
# density zone that permits the pod outright, the urban future holding zone,
# and the retail commercial zone that forbids a residence in one sentence.
# The Orient rural community: a residential zone and a commercial-industrial
# one, sliced from the same chapter PDF as the rest. And the Planned
# Development overlay they both point at, which is the only article in this
# chapter that names an attached dwelling in a residential zone.
# The two Portland chapters this layer needed beyond the single-dwelling one.
# Same pattern as 33.110 above: county land inside Portland's urban planning
# area carries Portland's label, so the standards come from Portland's code and
# the document is fetched into this layer rather than borrowed from that one.
- id: "33.100"
  url: https://www.portland.gov/sites/default/files/code/100-os-zone_0.pdf
  title: PCC Chapter 33.100 Open Space Zone
- id: "33.140"
  url: https://www.portland.gov/sites/default/files/code/140-ind-zones_1.pdf
  title: PCC Chapter 33.140 Employment and Industrial Zones
# The other half of the pocket read. 33.110 gave R20/R10/R7/R5/RF their
