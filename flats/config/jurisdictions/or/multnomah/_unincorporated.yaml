label: Multnomah Unincorporated
kind: unincorporated
eligible: true
notes: >-
  Ported from quadfit rules.yaml. Every value is `draft` -- quadfit's verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED:
  orientation_constraint='entrance_only'. quadfit justified this in a YAML comment with no
  citation; it needs its own encoding rather than invented provenance.


  PARKING WAS HALF READ ON PURPOSE, AND THE OTHER HALF IS NOW READ -- to the opposite conclusion
  from the one this note predicted. On 2026-08-30 MCC 39.6500 through 39.6600 went into `defaults`
  -- stall, aisle, driveway, street setback, the Apartment row -- and it is the COUNTY's chapter.
  R20, R10, R7, R5 and RF are Portland-administered pockets whose dimensions come from PCC 33.110,
  and 1,489 of this layer's 1,578 pod-fitting lots are in them. This note used to say their parking
  chapter, PCC 33.266, was unfetched and could only ADD greens when read. It was fetched and read
  on 2026-09-01, and it adds nothing.


  What 33.266 states for a fourplex on ONE LOT: a 9 by 18 space (33.266.120.D.1), a 9-foot driveway
  (D.2), and no aisle at any angle -- the word does not appear in the section. Table 266-4's 8.5 by
  16 with a 20-foot aisle belongs to 33.266.130, which 120.B.1 reaches only for parking in a
  parking TRACT, and 33.910 defines a tract as land created by a land division that is "not a lot".
  A court on the same lot as its building is not one. See the Portland layer, where the same
  sentence was read the other way for a week and is now corrected.


  So the two codes AGREE on the rectangle -- 9 by 18 either way -- and where they differ the
  county's number is the stricter one every time: a published 25-foot aisle against Portland's
  silence, a 20-foot drive against 9, and a parking street setback equal to the building setback
  (10 to 20 ft here) against Portland's flat 10. The pockets therefore keep the county's chapter,
  and no pocket zone carries a parking value of its own.


  WHAT IS ACTUALLY OPEN IS NOT THE READING, IT IS THE ADMINISTRATION. Nothing stored says whose
  development code governs parking on this land. MCC 39 has no R5/R7/R10/R20 article at all --
  which is exactly why the dimensions are read from PCC 33.110 -- but MCC's own parking chapter is
  written for every base zone and hands parking to nobody. Until a document says which chapter
  applies, the stricter one stands, which is the only choice that cannot manufacture a green. The
  question is worth an email rather than an argument, and the whole prize is small: of the 2,027
  pocket-area lots this pipeline evaluates, 1,806 die on Portland's Constrained Sites overlay and
  160 on a minimum lot area, leaving 39 that fail only because no site plan fits (18 in R10, 19 in
  R7, 2 in R20). Those 39 lots are what Portland's 9-foot driveway would be worth here.


  What the county's own zones get out of the reading now: LR-7 (89 pod-fitting lots), LR-5,
  LR-10, MR-4 and the rural articles, all of which point at 39.6500 and none of which state a
  dimension.
ingest:
  geoid: null
  juris_city_codes:
  - UNINCORPORATED
  - ''
  zoning_layer: zoning_metro
  zone_field: ZONE
  strip_lowercase_suffix: false
