  LR7:
    cite_default:
      cite: MCC 39.4848, 39.4856 (conditional uses), 39.4862 (S-1 2023) + OAR 660-046 Exhibit B Large Cities Model Code §B; OAR 660-046-0010/-0020
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-07-24'
    quadplex_allowed:
      # MCC 39.4856 CONDITIONAL USES, (C): "A multiplex or two-unit dwelling
      # structure, under the provisions of Part 7 of this Chapter, subject to
      # the following findings and conditions" -- the site outside a Developed
      # Neighborhood, comprehensive plan findings, and more. 39.4854, the
      # permitted-use section, does not list a multiplex at all.
      #
      # So the base is false and the relief carries the true. Not the same as
      # a prohibition: an LR-7 lot is not RED, it is a lot whose pod needs a
      # hearing, and the traffic light can only say that if the code's own
      # distinction between permitted and conditional survives the encoding.
      value: false
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L322-L336"
      variants:
        - value: true
          when: [conditional_use]
          quote: "or/multnomah/_unincorporated/39.lr-7.txt#L322-L336"
    max_height_ft:
      # MCC 39.4862(H): "Maximum Structure Height - 35 feet." The county's own
      # article, five feet looser than the Portland-administered pockets in
      # the same layer.
      #
      # The exception below is the one height rule in this corpus a 26 ft pod
      # actually fails: exception (4) drops the ceiling to 25 feet for "a
      # single family, duplex or multiplex dwelling on a flag lot or a lot
      # having sole access from an accessway, private drive or easement". The
      # pod is a multiplex, so the sentence reaches it.
      #
      # Only half of that trigger can be seen. `flag_lot` is a registered site
      # fact; "sole access from an accessway, private drive or easement" is
      # not, and no layer held records private drives or easements at all. So
      # a lot reached only by an easement takes 35 here and should take 25 --
      # the direction this encoding is wrong in, stated where the next person
      # to hold that data will find it.
      #
      # The same exception restores 35 feet where the neighbours are far
      # enough off and the upper windows do not face them. That is a
      # relaxation of a ceiling and it is not encoded: it turns on abutting
      # structures and window placement, neither of which is a fact about this
      # lot, and the strict reading is the one that keeps a false GREEN out.
      value: 35
      cite: MCC 39.4862 Dimensional Requirements and Development Standards, (H)
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L412"
      variants:
        - value: 25
          when: [flag_lot]
          cite: MCC 39.4862, exception (4)
          quote: "or/multnomah/_unincorporated/39.lr-7.txt#L429-L434"
    setback_front_ft:
      value: 20
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L409-L411"
    # 39.6580(A), stated as equal to the building setback -- see the note in
    # `defaults:`. `same_as` resolves against the front setback above it, and
    # the sentence carries no figure of its own for anything to be typed from.
    parking_street_setback_ft:
      same_as: setback_front_ft
      cite: MCC 39.6580(A), no required street yard used for parking, loading or maneuvering
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-30'
      quote: "or/multnomah/_unincorporated/39.parking.txt#L431-L437"
    # THE ONE ZONE IN THIS LAYER WHERE DESIGN REVIEW REACHES THE POD, and the
    # chain is four links with no judgement in any of them. 39.4856(C) makes a
    # multiplex a CONDITIONAL use in LR-7 -- which is why `quadplex_allowed`
    # above is false with a `conditional_use` variant. 39.8020(A): the design
    # review provisions "shall apply to all conditional and community service
    # uses... in any base zone". 39.8020(B) lets a use needing fewer than four
    # new spaces off with four criteria; this one needs six under 39.6590, so
    # 39.8020(C) applies "all of the Design Review Approval Criteria listed in
    # MCC 39.8040 and 39.8045". And 39.8045(A)(2): usable outdoor recreation
    # space for the shared use of residents "in any apartment residential
    # development" -- an Apartment being three or more dwelling units.
    #
    # 300 rather than 200 because the standard bands on a fact about the
    # building this catalog does not hold. One or two-bedroom units take 200
    # square feet each, three or more take 300, and nothing in the design says
    # how many bedrooms a unit of this pod has. The strict limb is the base for
    # the same reason Troutdale takes 20 feet against an unknown neighbour: a
    # reserve encoded too small is a lot passed that should have failed. The day
    # the catalog states a bedroom count this becomes a variant.
    #
    # 1,200 square feet, and no other zone in this layer owes it: MR-4 permits
    # the pod outright so design review never starts, and R20/R10/R7/R5/RF are
    # Portland-administered, where PCC governs and Table 110-4 asks 250.
    open_space_min_sqft:
      per_dwelling: 300
      cite: MCC 39.8045(A)(2)(b) via 39.8020(A) and (C), shared outdoor recreation space
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-30'
      quote: "or/multnomah/_unincorporated/39.design-review.txt#L235-L236,L250-L254,L257-L258"
    setback_side_ft:
      value: 5
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L409-L411"
    setback_rear_ft:
      value: 15
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L409-L411"
    setback_street_side_ft:
      value: 10
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L409-L411"
    max_coverage_pct:
      value: 40
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L407-L408"
    min_lot_width_ft:
      value: 60
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L405-L406"
    min_frontage_ft:
      value: 30
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L403-L404"
    min_lot_sqft:
      # MCC 39.4862(C): 5,000 square feet for EACH dwelling unit in a multiplex
      # dwelling structure. The article states its lot sizes by housing type --
      # (A) single family 7,000, (B) two-unit 10,000, (C) multiplex 5,000 per
      # unit -- and the pod is the third of those. It is not a townhouse
      # question: the word "townhouse" does not appear anywhere in 39.4848
      # through 39.4868.
      #
      # Stated per dwelling because that is what the sentence says. The file
      # carried 20,000 until 2026-08-19, which is the right requirement and a
      # number the article never prints; the multiplication is done at load.
      per_dwelling: 5000
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L397-L399"
    notes: 'County plan areas (Interlachen). CORRECTED: the yards were encoded front 10 / rear 10 from
      the state Model Code Exhibit B, which is not a stored document, while side 5 and street-side 10
      were quoted from MCC 39.4862(H) — two columns read off a row and two overridden from an uncited
      source, in the direction that manufactures a false GREEN. All four now come from the quoted row,
      which reads 20 5 10 15 under Front Side Street Side Rear. Coverage 40 percent, lot width 60 and
      front lot line 30 are quoted from the same section and were simply missing.

      OAR 660-046-0220 does not say what the old note said. (2)(c) bars setbacks GREATER than the
      detached-single-family setbacks in the same zone — a ceiling over MCC''s row, which is itself the
      SFD row, so it binds nothing here. (2)(f) says a city need not apply coverage to a quadplex, but
      if it does it may not set one BELOW the detached-SFD figure, so the 40 percent is the number the
      rule protects rather than one it invalidates.

      MINIMUM LOT SIZE, RESOLVED 2026-08-16 the conservative way. It held 7,000, which was the OAR
      660-046-0220(2)(a)(B)(i) cap and came from a document that is not stored. MCC 39.4862(C) IS
      stored and states 5,000 square feet per unit for a multiplex, so 20,000 for the pod. The gap
      between those decides nearly every LR-7 lot, and the cap only reaches this layer if the county
      is reached at all — 660-046-0220 governs "Large Cities" by its own terms. So the county''s own
      number governs until the statute is fetched and says otherwise, because 7,000 against a real
      20,000 passes lots that cannot be built on. If ORS 197A.420 turns out to reach unincorporated
      county, 7,000 comes back as a preemption on the state layer rather than as this zone''s base.

      WHAT "MULTIPLEX" MEANS HERE. The note below used to say this is "not a townhouse question: the
      word townhouse does not appear anywhere in 39.4848 through 39.4868", which is true of the
      article and not of the code. MCC 39.2000 defines a Multi-Plex Dwelling Structure as "a row
      house or town house apartment structure"; a Row House is "a one-story apartment structure
      having three or more dwelling units", which the two-storey pod is not; and "town house" has no
      entry in the county glossary. The pod reaches this multiplex line through the undefined half
      of that definition. See MR-4 for the same chain stated at length.

      STILL OPEN, and needing a human: MCC 39.4856(C) lists a multiplex as a CONDITIONAL use, not a
      permitted one; quadplex_allowed: true rests on the HB 2001 mandate overriding that, not on the
      county code. Both turn on ORS 197A.420, which is not stored — 660-046-0220 governs "Large Cities"
      by its own terms and this layer is unincorporated county. Fetch the statute before signing
      anything here. quadfit confidence: needs_verification.'
