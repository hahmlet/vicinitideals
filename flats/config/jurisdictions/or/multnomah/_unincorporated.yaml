    cite_default:
      cite: MCC 39.4848, 39.4856 (conditional uses), 39.4862 (S-1 2023) + OAR 660-046 Exhibit B Large Cities Model Code §B; OAR 660-046-0010/-0020
      url: https://multco.us/file/chapter_39_-_zoning_code/download
