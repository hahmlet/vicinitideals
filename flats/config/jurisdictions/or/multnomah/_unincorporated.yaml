    min_lot_width_ft:
      value: 60
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L405-L406"
    min_frontage_ft:
      value: 30
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L403-L404"
    min_lot_sqft:
      # MCC 39.4862(C): 5,000 square feet for EACH dwelling unit in a multiplex
      # dwelling structure. The article states its lot sizes by housing type --
      # (A) single family 7,000, (B) two-unit 10,000, (C) multiplex 5,000 per
      # unit -- and the pod is the third of those. It is not a townhouse
      # question: the word "townhouse" does not appear anywhere in 39.4848
      # through 39.4868.
      #
      # Stated per dwelling because that is what the sentence says. The file
      # carried 20,000 until 2026-08-19, which is the right requirement and a
      # number the article never prints; the multiplication is done at load.
      per_dwelling: 5000
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L397-L399"
    notes: 'County plan areas (Interlachen). CORRECTED: the yards were encoded front 10 / rear 10 from
      the state Model Code Exhibit B, which is not a stored document, while side 5 and street-side 10
      were quoted from MCC 39.4862(H) — two columns read off a row and two overridden from an uncited
      source, in the direction that manufactures a false GREEN. All four now come from the quoted row,
      which reads 20 5 10 15 under Front Side Street Side Rear. Coverage 40 percent, lot width 60 and
      front lot line 30 are quoted from the same section and were simply missing.

      OAR 660-046-0220 does not say what the old note said. (2)(c) bars setbacks GREATER than the
      detached-single-family setbacks in the same zone — a ceiling over MCC''s row, which is itself the
      SFD row, so it binds nothing here. (2)(f) says a city need not apply coverage to a quadplex, but
      if it does it may not set one BELOW the detached-SFD figure, so the 40 percent is the number the
      rule protects rather than one it invalidates.

      MINIMUM LOT SIZE, RESOLVED 2026-08-16 the conservative way. It held 7,000, which was the OAR
      660-046-0220(2)(a)(B)(i) cap and came from a document that is not stored. MCC 39.4862(C) IS
      stored and states 5,000 square feet per unit for a multiplex, so 20,000 for the pod. The gap
      between those decides nearly every LR-7 lot, and the cap only reaches this layer if the county
      is reached at all — 660-046-0220 governs "Large Cities" by its own terms. So the county''s own
      number governs until the statute is fetched and says otherwise, because 7,000 against a real
      20,000 passes lots that cannot be built on. If ORS 197A.420 turns out to reach unincorporated
      county, 7,000 comes back as a preemption on the state layer rather than as this zone''s base.

      WHAT "MULTIPLEX" MEANS HERE. The note below used to say this is "not a townhouse question: the
      word townhouse does not appear anywhere in 39.4848 through 39.4868", which is true of the
      article and not of the code. MCC 39.2000 defines a Multi-Plex Dwelling Structure as "a row
      house or town house apartment structure"; a Row House is "a one-story apartment structure
      having three or more dwelling units", which the two-storey pod is not; and "town house" has no
      entry in the county glossary. The pod reaches this multiplex line through the undefined half
      of that definition. See MR-4 for the same chain stated at length.

      STILL OPEN, and needing a human: MCC 39.4856(C) lists a multiplex as a CONDITIONAL use, not a
      permitted one; quadplex_allowed: true rests on the HB 2001 mandate overriding that, not on the
      county code. Both turn on ORS 197A.420, which is not stored — 660-046-0220 governs "Large Cities"
      by its own terms and this layer is unincorporated county. Fetch the statute before signing
      anything here. quadfit confidence: needs_verification.'
  RR:
