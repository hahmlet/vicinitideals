    max_height_ft:
      # MCC 39.4375: "Maximum Structure Height - 35 feet", printed directly
      # under the minimum yard table.
      #
      # Paragraph (E) lets "barns, silos, windmills, antennae, chimneys, or
      # similar structures" exceed it when they stand 30 feet off every
      # property line. None of those is a dwelling, so it does not reach the
      # pod and no variant carries it.
