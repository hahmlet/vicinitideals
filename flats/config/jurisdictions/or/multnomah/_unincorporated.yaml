# The chapter every base zone in Part 4 points at and none of them states:
# "Off-street parking and loading shall be provided as required by MCC 39.6500
# through 39.6600", printed once in each zone's own parking section. It holds a
# stall, an aisle, a driveway width and a rule about which yard a car may stand
# in, and until 2026-08-30 none of it was read. Markers are the body's uppercase
# headings; the contents page prints the same numbers in title case and is
# therefore not matched.
- id: "39.parking"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.6500-39.6600 Off-Street Parking, Loading and Access
  start: "39.6500- PURPOSE"
  end: "39.6700- PURPOSE"
  extraction: plain
# Reached by a redirect out of the parking chapter, and the redirect is the
# whole reason it is here. MCC 39.6585(A): "The landscaped areas requirements
# of MCC 39.8045 (C) (3) to (7) shall apply to all parking, loading or
# maneuvering areas which are within the scope of design standards stated in
# MCC 39.6555 (A)" -- and 39.6555(A)'s scope is every parking area except one
# serving a single-family or two-family dwelling. So a landscape section
# headed "for developments subject to design review plan approval" reaches a
# building that design review never touches, and it states a ten-foot strip
# between parking and a street and a five-foot strip along every other lot
# line. The applicability half (39.8015, 39.8020) is fetched with it because
# the refusal of 39.8045(A)'s 200 sq ft per unit of shared outdoor recreation
# rests on it: design review applies to conditional and community service
# uses, and (A) carries no redirect of its own.
- id: "39.design-review"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.8000-39.8050 Design Review, incl. 39.8045 Required Minimum Standards
  start: "39.8000- PURPOSES"
  end: "39.8200-  ADJUSTMENTS"
  extraction: plain
# The MUF heading is the one in this chapter the table of contents misprints:
# the body sets it "39.4700  PURPOSES." with two spaces and no dash, while
# the contents page reads "39.4700- PURPOSES". A start marker taken from the
# contents finds nothing.
- id: "39.muf"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4700-39.4732 Multiple Use Forest (MUF)
  start: "39.4700  PURPOSES"
  end: "39.4735 USES"
  extraction: plain
defaults:
  # MCC 39.6500 through 39.6600, the chapter every base zone in Part 4 points at
  # and none of them states. Read 2026-08-30, and it is the first parking
  # geometry this layer has ever held.
  #
  # WHICH BUILDING IT REACHES, which is the question that decided Gladstone
  # yesterday and Troutdale the day before, is answered here without argument.
  # 39.6555(A): the design standards "shall apply to all parking, loading, and
  # maneuvering areas except those serving a single family dwelling on an
  # individual lot in a rural base zone and except those serving a single family
  # or a two-family dwelling in an urban base zone". A quadplex is neither, in
  # neither kind of zone, so the whole subpart applies and no design-review gate
  # stands in front of it.
  #
  # WHICH ROW IT TAKES is answered by counting, and it comes out the opposite way
  # from the last two cities. 39.6590(A) lists Single Family, Two Family and
  # Apartment, and 39.2000 defines an Apartment as "any building or portion
  # thereof used for or containing three or more dwelling units". Three or more,
  # not five or more: where Troutdale and Gladstone both put their multi-unit
  # noun one unit above this building, Multnomah County puts it one unit below.
  # The pod is an Apartment. (39.2000.definitions.txt#L188-L190)
  #
  # THE COUNTY HAS NOT WRITTEN HB 2001 INTO ITS ZONING CODE. The words "middle
  # housing", "quadplex", "triplex" and "fourplex" appear nowhere in Chapter 39 --
  # zero occurrences in the whole 39,456-line document. That is consistent with
  # OAR 660-046-0020(8), which reaches unincorporated county land only where it
  # is "provided with sufficient urban services" inside "an urban service
  # district boundary", a line no parcel record here carries. It is also why the
  # Apartment row is the only row there is.
  #
  # THE PORTLAND POCKETS, RESOLVED 2026-09-01 AND NOT THE WAY THIS COMMENT
  # EXPECTED. R20, R10, R7, R5 and RF are Portland-administered and their
  # dimensions come from PCC 33.110; these defaults are the COUNTY's chapter and
  # they sat under those zones pending a read of PCC 33.266. That read is done
  # -- see the layer notes -- and 33.266.120 states the SAME 9 by 18 rectangle
  # this section states, a narrower driveway, and no aisle whatsoever for a
  # fourplex on one lot. The county's numbers are the stricter ones on every
  # dimension where the two codes differ, so they stand for the pockets too and
  # no pocket zone overrides them. What is unresolved is which code administers
  # this land, not what either code says.
  parking_min_per_unit:
    # 39.6590(A)(3), "Apartment - One and one-half spaces for each dwelling
    # unit". Six spaces for this building, and the state cuts it to four:
    # OAR 660-046-0220(2)(e)(B) is carried in `or/_state.yaml` as `preempts:
    # cap`, so the resolver clips six back to the loosest band's four and to
    # less than that on a lot under 7,000 sq ft.
    #
    # Which is worth stating plainly, because the cap only reaches this land
    # conditionally. If the urban-service-district test in OAR 660-046-0020(8)
    # fails, the true requirement is six and the screen is using four. Encoding
    # the row anyway is still strictly better than leaving it out -- with the
    # field absent the cap resolves alone and the answer is four regardless --
    # and this is the note that says which way the remaining error runs.
    value: 1.5
    cite: MCC 39.6590(A)(3), Apartment
    url: https://multco.us/file/chapter_39_-_zoning_code/download
    retrieved: '2026-08-30'
    quote: "or/multnomah/_unincorporated/39.parking.txt#L474-L478,L483-L484"
  # 39.6565(A)(1): "At least 70% of the required off-street parking spaces shall
  # have a minimum width of nine feet, a minimum length of 18 feet". The 70
  # percent is the other end of the compact allowance below it, not a
  # qualification on the rectangle: seven of ten spaces are this size and the
  # rest may be smaller, so a court drawn entirely at nine by eighteen satisfies
  # the section whatever the ratio.
  parking_stall_width_ft:
    value: 9
    cite: MCC 39.6565(A)(1), minimum width of nine feet
    url: https://multco.us/file/chapter_39_-_zoning_code/download
    retrieved: '2026-08-30'
    quote: "or/multnomah/_unincorporated/39.parking.txt#L240-L247"
  parking_stall_depth_ft:
    value: 18
    cite: MCC 39.6565(A)(1), minimum length of 18 feet
    url: https://multco.us/file/chapter_39_-_zoning_code/download
    retrieved: '2026-08-30'
    quote: "or/multnomah/_unincorporated/39.parking.txt#L240-L247"
  # 39.6565(B)(1), "25 feet for 90 degree parking". One figure, not split by
  # direction, so a one-way rear court is dimensioned off it exactly as
  # Troutdale's and Gladstone's are -- and it TIES Troutdale for the widest
  # aisle in this corpus. Twenty-five feet between two rows of eighteen makes a
  # court sixty-one feet deep before a driveway reaches it.
  parking_aisle_one_way_ft:
    value: 25
    cite: MCC 39.6565(B)(1), aisle width at ninety degrees
    url: https://multco.us/file/chapter_39_-_zoning_code/download
    retrieved: '2026-08-30'
    quote: "or/multnomah/_unincorporated/39.parking.txt#L240,L260-L261"
  parking_aisle_two_way_ft:
    value: 25
    cite: MCC 39.6565(B)(1), aisle width at ninety degrees
    url: https://multco.us/file/chapter_39_-_zoning_code/download
    retrieved: '2026-08-30'
    quote: "or/multnomah/_unincorporated/39.parking.txt#L240,L260-L261"
  # 39.6560(A), and it is written for exactly the case this pod is: "Where a
  # parking or loading area does not abut directly on a public street or private
  # street approved under Part 9 of this Chapter, there shall be provided an
  # unobstructed driveway not less than 20 feet in width for two-way traffic".
  # A rear court behind a building does not abut the street, so the drive that
  # reaches it is twenty feet wide -- eight more than the design lane, and the
  # same number Happy Valley asks, which is the one driveway figure in this
  # corpus that takes lots away.
  #
  # No one-way figure anywhere in the chapter, so the field stays out rather
  # than borrowing the two-way number: the sentence conditions the twenty on
  # two-way traffic and says nothing about a single lane.
  driveway_min_width_two_way_ft:
    value: 20
    cite: MCC 39.6560(A), unobstructed driveway not less than 20 feet for two-way traffic
    url: https://multco.us/file/chapter_39_-_zoning_code/download
    retrieved: '2026-08-30'
    quote: "or/multnomah/_unincorporated/39.parking.txt#L191-L199"
  # NO MAXIMUM, and this one is absence rather than `exempt: true`. The word
  # "maximum" does not occur once in 39.6500 through 39.6600, and the chapter
  # builds no apparatus for one: no ceiling table, no exempt space types, no
  # zone split for the purpose. Gladstone's Table 1 prints "Max: None" against
  # the row and is therefore a reading; Multnomah County simply never had the
  # thought. `or/_state.yaml` holds no `parking_max_per_unit` either, so absence
  # resolves to no ceiling, which is what the code says.
  #
  # PARKING SETS BACK FROM A STREET BY THE BUILDING SETBACK. 39.6580(A): "Any
  # required yard which abuts upon a street lot line shall not be used for a
  # parking or loading space, vehicle maneuvering area or access drive other
  # than a drive connecting directly to a street perpendicularly." No number of
  # its own, so it is carried with `same_as` on the zones, where the setback it
  # borrows lives -- the third city in this corpus to state it this way, after
  # Happy Valley and Troutdale, and the third time it costs nothing because the
  # envelope the site plan lays out in is already inset by the front setback.
  #
  # The redirect out of 39.6585(A) prints a floor for the same rule and it is
  # inert: 39.8045(C)(3)(b) asks a ten-foot landscaped strip between parking and
  # a street lot line, and the smallest front setback in this layer is R5's ten.
  # Equal, not larger, in the one zone where it is closest -- so a `floor_ft` of
  # ten would change no zone's answer, and the test that pins it is the place
  # this stops being true.
  #
  # NOT ENCODED: 39.6570(B)(2), the other setback, and it is measured from every
  # line rather than the street one. "The outer boundary of a parking or loading
  # area shall be provided with a bumper rail or curbing at least four inches in
  # height and at least three feet from the lot line or any required fence." The
  # street half is swallowed whole by 39.6580(A) above. The side and rear halves
  # have no field -- this model holds one parking setback and it is measured from
  # a street -- and they are inert as the layer stands: the smallest side yard
  # here is five feet and the smallest rear yard five. The exception at (3),
  # which lets a five-foot planted strip stand in for the curb, applies only to
  # an area "with fewer than four required parking spaces" and this building owes
  # at least four however the state cap lands.
  #
  # NOT ENCODED: 39.8045(C)(3)(b) via the 39.6585(A) redirect, the same shape one
  # section over: "a parking or loading area shall be separated from any lot line
  # adjacent to a street by a landscaped strip at least 10 feet in width, and any
  # other lot line by a landscaped strip at least 5 feet in width". The street
  # half is the inert floor described above; the other-lot-line half is five feet
  # of planted ground along a side or rear line and there is no field for it. It
  # is exactly equal to the smallest side and rear yards in this layer, which is
  # the narrowest margin any refusal in this corpus rests on.
  #
  # NOT ENCODED: 39.6555(B), forward access, and it binds on every space rather
  # than on a group of five. "After July 26, 1979 it shall be unlawful to locate
  # or construct any parking or loading space so that use of the space requires a
  # vehicle to back into the right-of-way of a public street." Gladstone's version
  # stops one stall short of this building and Gresham's asks it of everyone;
  # this one has no threshold at all. Nothing holds it as a field, and the
  # typology the site plan draws -- a rear court reached by a side drive, cars
  # turning on the lot -- satisfies it by construction rather than by luck.
  #
  # NOT ENCODED: 39.6565(A)(2), compact spaces. Up to 30 percent of the required
  # spaces may be eight-and-a-half by sixteen. A smaller rectangle for some of
  # the stalls can only make a court fit where the full-size one already did.
  #
  # NOT ENCODED: 39.6565(A)(3), "for parallel parking, the length of the parking
  # space shall be 23 feet". A stall at a different angle is a different geometry
  # and this model holds one rectangle. The 90-degree row is the one the site
  # plan draws with and the one encoded.
  #
  # NOT ENCODED: 39.6580(C), what may cross the street yard. "A required yard
  # which abuts a street lot line shall not be paved, except for walkways which
  # do not exceed 12 feet in total width and not more than two driveways which do
  # not exceed the width of their curb cuts for each 150 feet of street frontage
  # of the lot." Two driveways per 150 feet is a count, and this pod draws one.
  # It is the nearest thing in the chapter to a curb-cut ceiling and it is not
  # one: no width is stated, only that the pavement may not exceed the cut.
  #
  # NOT ENCODED: 39.6580(D), the neighbour's standard applying to our lot. In the
  # C-3, LM and MR-4 base zones, parking on a parcel adjoining another base zone
  # along the same street "shall not be located closer to the street property
  # line than the required setback of the adjoining base zone for a distance of
  # 50 feet". MR-4 is in this layer and is the one zone here that permits the pod
  # outright. What the rule needs is the zoning of the lot next door, which is
  # not a fact about this lot -- the same refusal as Troutdale 9.095(A).
  #
  # NOT ENCODED: the five reliefs. 39.6525(B) puts required parking on another
  # site within 350 feet; 39.6560(B) deviates from the driveway width on fire and
  # engineering findings; 39.6570(A)(2) deviates from the paving standard;
  # 39.6600 grants up to 30 percent off the required number of spaces; and
  # 39.8050 grants up to 25 percent off the dimensions. Every one loosens a
  # standard this screen applies, and every one is a thing an applicant asks for
  # at a counter rather than a thing that is true of the ground.
  #
  # NOT ENCODED: 39.8045(C)(1), "a minimum of 15% of the development area shall
  # be landscaped", which arrives with the same redirect as the strips above --
  # except that it does NOT, and that is why it is refused rather than encoded.
  # 39.6585(A) redirects (C)(3) to (7); (C)(1) is outside the redirect and reaches
  # a building only through design review itself. It also states its share of a
  # denominator the code never defines: "development area" appears seven times in
  # Chapter 39 and is defined nowhere, and this corpus has already learned what
  # seven undefined net-acre denominators cost.
  #
  # NOT ENCODED: 39.8045(B), enclosed storage. "Convenient areas shall be
  # provided in residential developments for the storage of articles such as
  # bicycles, barbecues, luggage, outdoor furniture, etc. These areas shall be
  # entirely enclosed." A real standard with no number in it at all, and the
  # enclosure may be inside the building, so nothing is subtracted from the lot
  # by refusing it. Design-review-only, like (A) below.
  #
  # NOT ENCODED: 39.8045(A)(1), 48 square feet of private outdoor space for each
  # ground level living unit. Four ground-level units is 192 square feet on top
  # of the shared reserve encoded on LR7, and this model holds one open-space
  # figure per zone rather than a private one and a shared one. The shared
  # standard is the larger of the two and it is the one carried.
  #
  # READ AND DOES NOT REACH: 39.8045(C)(3)(a) asks 25 square feet of landscaping
  # per space of "a parking or loading area providing ten or more spaces". This
  # court seats at most eight. 39.6595(D) asks Apartment uses for "one loading
  # space for each 50 dwelling units", which is 0.08 of a space for four units,
  # and 39.6550(B) disregards "any fraction up to and including one-half" -- so
  # the pod owes no loading space at all, and the 12 by 25 foot rectangle in
  # 39.6565(C)(1) never has to be drawn.
zones:
  EG2:
    section: ["33.140"]
    cite_default:
      cite: PCC 33.140 Table 140-1 (33.140.100 Primary Uses) and 33.140.100.B.1
      url: https://www.portland.gov/sites/default/files/code/140-ind-zones_1.pdf
      retrieved: '2026-08-20'
    quadplex_allowed:
      # Table 140-1 gives Household Living an L[1] in the EG2 column, and
      # 33.140.100.B.1 is what the bracket means: "Limited use. Household
      # Living and Group Living are allowed uses when an existing hotel or
      # motel is converted to dwelling units". A conversion is not new
      # construction, so the pod does not reach it.
      #
      # Quoted with the footnote rather than from the table cell alone,
      # because an L on its own reads as a yes with conditions and the
      # condition here excludes the whole category of thing being screened.
      value: false
      quote: "or/multnomah/_unincorporated/33.140.txt#L181-L196,L322,L324"
    notes: >-
      Five lots, all with Portland addresses, and the same General Employment
      column Portland's own layer reads. Encoded here rather than left to a
      cross-layer reference because a `like` in this system names a zone in the
      same layer, and duplicating the citation is cheaper than inventing a
      mechanism for three zones.
  IG2:
    section: ["33.140"]
    cite_default:
      cite: PCC 33.140 Table 140-1 (33.140.100 Primary Uses) and 33.140.100.B.2
      url: https://www.portland.gov/sites/default/files/code/140-ind-zones_1.pdf
      retrieved: '2026-08-20'
    quadplex_allowed:
      # Table 140-1 gives Household Living a CU [2] in the IG2 column, which
      # looks like a conditional-use door until the note is read. 33.140.100.B.2
      # is one sentence long in the part that matters: Household and Group
      # Living "in houseboats and houseboat moorages in I zones are regulated
      # by Chapter 33.236, Floating Structures. Household and Group Living in
      # other structures is prohibited."
      #
      # So the conditional use is a conditional use for a houseboat. A
      # factory-built townhome on land is the other structures, and the code
      # says prohibited in as many words.
      value: false
      quote: "or/multnomah/_unincorporated/33.140.txt#L197-L200,L322,L324"
    notes: >-
      Three lots. The reason this zone is worth encoding rather than leaving in
      the ledger is the shape of the refusal: a table cell reading CU is the
      most inviting thing a screen can find, and the footnote under it turns
      the permission into a prohibition. A ledger row saying "unencoded" and a
      value saying "false, and here is why" cost the same to write and are not
      the same fact.
  OS:
    section: ["33.100"]
    cite_default:
      cite: PCC 33.100 Table 100-1 (33.100.100 Primary Uses)
      url: https://www.portland.gov/sites/default/files/code/100-os-zone_0.pdf
      retrieved: '2026-08-20'
    quadplex_allowed:
      # Table 100-1 gives Household Living a bare N in the zone's single
      # column: prohibited, with no bracketed limitation and no conditional
      # use path beside it. Parks, cemeteries and golf courses are what the
      # zone is for.
      #
      # This is the same encoding the Portland layer carries for its own 2,717
      # OS lots, read off the same table. Twenty-eight lots here, twenty-five
      # of them with Portland addresses and four with Gresham ones -- see the
      # note.
      value: false
      quote: "or/multnomah/_unincorporated/33.100.txt#L57,L59"
    notes: >-
      A Portland-administered pocket, the same reading R20, R10, R7, R5 and RF
      get in this layer: land the county administers inside Portland's urban
      planning area carries Portland's zone label, so PCC Chapter 33 is the
      code that answers it.


      Four of the twenty-eight lots carry Gresham mailing addresses rather than
      Portland ones, which is the one loose end. It does not change the answer
      -- Gresham's open space land and Troutdale's OS refuse a dwelling too --
      but it is a label this file has assigned rather than one it read off a
      county map, and if somebody ever needs an OS lot to come back GREEN, that
      is where to start looking.
  OCI:
    section: ["39.oci"]
    cite_default:
      cite: MCC 39.4655 (Uses), 39.4660(A) (Allowed Uses), 39.4675 (Conditional Uses)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # The other half of the Orient rural community, and it answers the way
      # C-3 does. 39.4655 closes the list; 39.4660(A) is "Single-family
      # detached dwelling" and detached is the word that ends it; the review
      # uses are shops, storage and a vehicle repair business; and the two
      # conditional uses are community service uses and a state or regional
      # trail.
      #
      # No planned development entry, which is the difference from the
      # residential zone across the road. The PD is a conditional use where an
      # article lists it, and this article does not.
      value: false
      quote: "or/multnomah/_unincorporated/39.oci.txt#L16-L30,L453-L458"
    notes: >-
      Six lots. The dimensional section (39.4680) sets a one acre minimum lot,
      35 feet of height and the same 30/10/30/30 yard row the rest of rural
      Multnomah prints; none of it is encoded, because the use list settles the
      zone and a dimensional row on a refused zone is a row nobody can act on.


      Worth saying why this zone and OR differ, since they cover the same
      crossroads and were written in the same ordinance. OR lists Planned
      Developments as a conditional use without qualification, which reaches
      MCC 39.5350(A) and its attached dwellings. OCI lists community service
      uses and a trail. The absence is the answer, and the closure sentence
      above the list is what makes an absence usable.
  OR:
    section: ["39.or", "39.pd"]
    cite_default:
      cite: MCC 39.4605 (Uses), 39.4610(A) (Allowed Uses), 39.4620(A) (Conditional
        Uses), 39.4625 (Dimensional Requirements)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # Orient Rural Center Residential, and the base is the usual county
      # shape: 39.4605 closes the list, 39.4610(A) is a single-family detached
      # dwelling, the review uses are farm sales and property line adjustments,
      # and the conditional uses are two entries long.
      #
      # The first of those two is the door. 39.4620(A) is "Planned Developments
      # pursuant to the provisions of MCC 39.5300 through 39.5350" with no
      # narrowing clause after it, and 39.5350 is titled PERMITTED USES: "In a
      # residential zone, the following uses may be permitted in a Planned
      # Development overlay: (A) Housing types may include only duplexes and
      # single family detached or attached dwellings."
      #
      # Single family ATTACHED dwellings, printed, in a zone whose name ends in
      # Residential. That is this building, and it is the only sentence in
      # Chapter 39 outside MR-4 that reaches it. Quoted from the PD article
      # rather than from this one because that is where the words are.
      value: false
      quote: "or/multnomah/_unincorporated/39.or.txt#L20-L33,L385-L390"
      variants:
        - value: true
          when: [planned_development]
          cite: MCC 39.4620(A) with MCC 39.5350(A)
          quote: "or/multnomah/_unincorporated/39.pd.txt#L257-L262"
    min_lot_sqft:
      # 39.4625(A): "Except as provided in MCC 39.3120, 39.4630, and 39.4635,
      # and 39.5300 through 39.5350, the minimum lot size shall be one acre."
      # The exception list names the PD, which matters twice over -- once
      # because a PD may plat smaller lots than an acre, and once because
      # 39.5340(A) turns the same acre into the divisor that caps how many
      # dwellings the site may hold.
      acres: 1
      cite: MCC 39.4625(A)
      quote: "or/multnomah/_unincorporated/39.or.txt#L420-L422"
      variants:
        # Four dwellings, one acre each, four acres of site -- and four acres
        # is a figure neither article prints. 39.5340(A) computes the units a
        # residential PD may hold "by dividing the total site area by the
        # minimum lot area per dwelling unit required by the underlying
        # district", and this district requires an acre. The quote is the
        # sentence that states the acre and names the PD as its exception; the
        # citation carries both sections, because the arithmetic is theirs
        # jointly and neither says it alone.
        - acres_per_dwelling: 1
          when: [planned_development]
          cite: MCC 39.4625(A) with MCC 39.5340(A)
          quote: "or/multnomah/_unincorporated/39.or.txt#L420-L422"
    max_height_ft:
      value: 35
      cite: MCC 39.4625(B)
      quote: "or/multnomah/_unincorporated/39.or.txt#L423,L427"
    setback_front_ft:
      # One printed row again -- "Front Side Street Side Rear / 30 10 30 30" --
      # and the same row EFU, MUA-20 and RR print. Four columns off one line,
      # read across.
      value: 30
      cite: MCC 39.4625(B)
      quote: "or/multnomah/_unincorporated/39.or.txt#L424-L425"
    setback_side_ft:
      value: 10
      cite: MCC 39.4625(B)
      quote: "or/multnomah/_unincorporated/39.or.txt#L424-L425"
    setback_street_side_ft:
      value: 30
      cite: MCC 39.4625(B)
      quote: "or/multnomah/_unincorporated/39.or.txt#L424-L425"
    setback_rear_ft:
      value: 30
      cite: MCC 39.4625(B)
      quote: "or/multnomah/_unincorporated/39.or.txt#L424-L425"
    min_frontage_ft:
      value: 50
      cite: MCC 39.4625(B)
      quote: "or/multnomah/_unincorporated/39.or.txt#L423,L428"
    notes: >-
      THE PLANNED DEVELOPMENT DOOR, and what it does not promise. MCC 39.5320
      says that where a PD standard conflicts with a base zone standard, "the
      standard of the PD shall apply", so every dimension encoded above is
      negotiable inside an approved plan. Nothing in the PD article prints a
      relieved number to put in their place, which is why none is encoded: a
      relief this system can carry is one the code states, and flexible and
      diversified land development standards is not a number.


      The one figure the PD does fix is the count. 39.5340(A) divides the site
      by the underlying acre, so four units want four acres, and 39.5340(B)(1)
      allows the Planning Commission to raise the permitted count by up to 25
      percent on six findings about housing need, energy and land use pattern
      -- which would bring four units within reach of 3.2 acres. That bonus is
      a discretionary finding rather than an entitlement and is not encoded.


      39.4620(A) adds a second condition this file cannot see: if the property
      is outside an "acknowledged unincorporated community", the OAR Chapter
      660 Division 004 planned unit development standards apply as well. Orient
      is an acknowledged rural community, which is what the whole article is
      about, so the clause should not bite here -- but the OAR is not a stored
      document and nobody has checked the acknowledgement.


      Seventeen lots, one acre minimum, and a hearing between them and any
      answer but no.
  C3:
    section: ["39.c-3"]
    cite_default:
      cite: MCC 39.4735 (Uses), 39.4737(H) (Restrictions)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # Two sentences and it is over. 39.4735 closes the list -- 68 enumerated
      # retail uses from antique shop to variety store, none of them a
      # dwelling -- and 39.4737(H) says it outright: "No new residence shall
      # be permitted in this base zone except that related to the business or
      # enterprise allowed in this base zone such as janitor or night
      # watchperson."
      #
      # A caretaker's flat is the exception, and it is the same exception the
      # county's General Industrial zone and Fairview's GI carry. One unit for
      # somebody who works there is not four units for sale.
      value: false
      quote: "or/multnomah/_unincorporated/39.c-3.txt#L1-L8,L203-L206"
    notes: >-
      One lot. Encoded because a closed commercial list with an explicit
      residential prohibition is the cheapest kind of certainty in this corpus
      -- the zone is answered by a sentence rather than by an absence, and
      absences are what take the reading.
  CFU2:
    section: ["39.cfu"]
    cite_default:
      cite: MCC 39.4050(C)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    like:
      zone: CFU
      wins: local
      cite: MCC 39.4050(C) (the CFU base zones and their common standards)
      quote: "or/multnomah/_unincorporated/39.cfu.txt#L24-L30"
    notes: >-
      Not a separate article. 39.4050(C) names six zones -- CFU, CFU-1 through
      CFU-5 -- and says they "may be referred to collectively as the CFU
      because all standards and requirements applicable to the specific CFU
      base zone itself also apply to each of the other zones except as
      expressly stated otherwise". So the incorporation is the code's own
      sentence rather than an inference from the label, which is the whole
      difference between a `like` somebody can check and a `like` somebody
      guessed.


      The two places the article does state otherwise are both in the forest
      practices and siting standards -- 39.4115's fire siting rules read
      differently in CFU-1 and CFU-2 -- and neither touches the use list or
      any dimension encoded here. `wins: local` is set anyway, so a value
      written into this zone later would override the incorporation rather
      than sit beside it.
  MR4:
    section: ["39.mr-4"]
    cite_default:
      cite: MCC 39.4970 (Uses), 39.4975(B) (Primary Uses), 39.4990 (Dimensional
        Requirements)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # The only zone in this layer that permits the pod outright. 39.4975 is
      # PRIMARY USES and (B) is one line: "A multiplex dwelling structure."
      # No conditional use, no locational requirement, no hearing -- where
      # LR-5 four zones up needs 39.4826(C) and 39.4828(A) together, this zone
      # needs nothing at all.
      #
      # 39.4970 is quoted with it for the usual reason: the permission is only
      # readable as a permission because the article closes its list.
      value: true
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L12-L21"
    min_lot_sqft:
      # 39.4990(C): 4,000 square feet for EACH dwelling unit in a multiplex
      # dwelling structure, so 16,000 for the pod. The lowest per-unit figure
      # in the county's own articles -- LR-5 asks 4,500 and LR-7 asks 5,000 --
      # and 16,000 appears in the article nowhere.
      per_dwelling: 4000
      cite: MCC 39.4990(C)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L155-L157"
    max_height_ft:
      value: 35
      cite: MCC 39.4990(J)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L173,L179"
    setback_front_ft:
      # Two printed rows this time, not one -- "Interior Lot 20 5 N/A 15" and
      # "Corner Lot 20 5 10 15" under "Front Side Street Side Rear". Both are
      # inside every citation, because the only column that differs is the
      # street side one and a reader has to be able to see that.
      value: 20
      cite: MCC 39.4990(J)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L173-L178"
    # 39.6580(A), stated as equal to the building setback -- see the note in
    # `defaults:`. `same_as` resolves against the front setback above it, and
    # the sentence carries no figure of its own for anything to be typed from.
    parking_street_setback_ft:
      same_as: setback_front_ft
      cite: MCC 39.6580(A), no required street yard used for parking, loading or maneuvering
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-30'
      quote: "or/multnomah/_unincorporated/39.parking.txt#L431-L437"
    setback_side_ft:
      value: 5
      cite: MCC 39.4990(J)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L173-L178"
    setback_street_side_ft:
      value: 10
      cite: MCC 39.4990(J)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L173-L178"
    setback_rear_ft:
      value: 15
      cite: MCC 39.4990(J)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L173-L178"
    max_coverage_pct:
      value: 40
      cite: MCC 39.4990(I)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L171-L172"
    min_lot_width_ft:
      value: 45
      cite: MCC 39.4990(H)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L168-L170"
      variants:
        - value: 50
          when: [corner_lot]
          cite: MCC 39.4990(H)
          quote: "or/multnomah/_unincorporated/39.mr-4.txt#L168-L170"
    min_frontage_ft:
      value: 20
      cite: MCC 39.4990(G)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L166-L167"
    notes: >-
      WHAT "MULTIPLEX" MEANS HERE, and it is not obvious. MCC 39.2000 defines a
      Multi-Plex Dwelling Structure as "a row house or town house apartment
      structure" and stops. A Row House is "a one-story apartment structure
      having three or more dwelling units" -- the pod is two storeys, so it is
      not that half. An Apartment is "any building or portion thereof used for
      or containing three or more dwelling units", which the pod is. And "town
      house" the county never defines at all.


      So a four-unit, two-storey, attached townhome reaches the multiplex row
      through the undefined half of a two-part definition. That reading is
      almost certainly right -- a town house apartment structure is what this
      building is in any ordinary use of the words, and the row house half
      exists precisely to cover the single-storey case -- but it rests on a
      term with no entry in the county's glossary, and this file says so
      rather than letting the permission look unqualified. The same chain
      decides LR-5 and LR-7.


      39.4990(K) is not encoded and it can bind hard: "in the case of an
      apartment structure in this base zone, a yard equal to the structure
      height shall be provided between the structure in this base zone and any
      adjacent LR base zone lot line". A 26-foot pod next to an LR lot would
      owe a 26-foot yard on that line instead of five or fifteen. Two things
      stop it being encoded rather than one -- the neighbour's zoning is a
      fact nothing here holds, and whether a four-unit multiplex is an
      "apartment structure" for this sentence turns on the same undefined
      vocabulary the use flag does. The Planning Director may modify or waive
      it on design review, which is a relief nobody should count on.


      Two lots carry this label. It is encoded in full anyway, because it is
      the one county zone where the answer can come out GREEN, and a zone that
      can say yes is worth more attention than a zone that says no.
  UF20:
    section: ["39.uf-20"]
    cite_default:
      cite: MCC 39.4750 (Uses), 39.4751(A) (Primary Uses), 39.4752(A)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # A holding zone -- 20-acre minimum lot on land the county expects to
      # urbanise later -- and it holds by keeping the use list short. 39.4750
      # closes it; 39.4751(A) is "residential use consisting of a single-
      # family detached dwelling on a lot"; 39.4752(A) adds a second
      # single-family dwelling for farm help on the same lot as the first.
      # 39.4753's conditional list is mining, feed lots, swine, fur-bearing
      # animals, dog kennels and log rafts. No middle housing of any kind.
      value: false
      quote: "or/multnomah/_unincorporated/39.uf-20.txt#L6-L15,L138-L143"
    notes: >-
      Twenty acres is the minimum lot size, stated in the zone's own first
      sentence rather than in its dimensional section. Not encoded, because
      the use list settles the zone first.


      The name is the thing to notice. This is land the comprehensive plan has
      already earmarked for a future urban designation, which means the answer
      here has a shelf life in a way a resource zone's does not: an EFU parcel
      refuses the pod because it is a farm, and a UF-20 parcel refuses it
      because the county has not rezoned it yet. Four lots today.
  LR5:
    section: ["39.lr-5"]
    cite_default:
      cite: MCC 39.4820 (Uses), 39.4826(C) (Conditional Uses), 39.4828 (Multiplex
        Locational Requirements), 39.4830 (Dimensional Requirements)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # LR-7's twin, and encoded the way LR-7 should have been. 39.4826(C)
      # lists "a multiplex dwelling structure under the provisions of Part 7 of
      # this Chapter" as a conditional use, so the base is false and a hearing
      # carries the true -- an LR-5 lot is not RED, it is a lot whose pod needs
      # an application.
      #
      # The permit alone is not enough. 39.4828(A) is a locational rule with
      # teeth: an approved multiplex "may be located only on" a corner lot, a
      # flag lot, a lot with sole access from an approved accessway, or a lot
      # on a street created under the land division chapters with fewer than 12
      # multiplex units within 250 feet. Two of those four are site facts this
      # system registers, so they are the two variants; the other two are not
      # held by any layer and are recorded in the notes rather than assumed.
      #
      # Both registered facts default to false, which means a batch screen
      # returns the refusal until the geometry layer speaks. That is the
      # correct direction here -- the county wrote this rule to keep multiplex
      # buildings off ordinary interior lots, and an encoding that ignored it
      # would open every lot in the zone.
      value: false
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L13-L19,L259-L270"
      variants:
        - value: true
          when: [conditional_use, corner_lot]
          cite: MCC 39.4826(C) and 39.4828(A)(1)
          quote: "or/multnomah/_unincorporated/39.lr-5.txt#L259-L261,L283-L287"
        - value: true
          when: [conditional_use, flag_lot]
          cite: MCC 39.4826(C) and 39.4828(A)(2)
          quote: "or/multnomah/_unincorporated/39.lr-5.txt#L259-L261,L283-L287"
    min_lot_sqft:
      # 39.4830(C): 4,500 square feet for EACH dwelling unit in a multiplex
      # dwelling structure, so 18,000 for the pod. Stated per dwelling because
      # that is what the sentence says -- the same shape as LR-7's 5,000, and
      # the product appears in the article nowhere.
      per_dwelling: 4500
      cite: MCC 39.4830(C)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L312-L314"
    max_height_ft:
      # 39.4830(H): "Maximum Structure Height - 35 feet", and then exception
      # (4), which is the one height rule in this corpus a 26 ft pod actually
      # fails: 25 feet for "a single family, duplex or multiplex dwelling on a
      # flag lot or a lot having sole access from an accessway, private drive
      # or easement".
      #
      # Read that against the use rule above and the zone says something
      # sharper than either sentence alone. A multiplex may sit on a corner lot
      # or a flag lot; on the flag lot it may be 25 feet tall; the pod is 26.
      # So one of the two doors this zone opens is shut by its own height
      # exception, and the arithmetic is what shuts it rather than an
      # assumption.
      #
      # The exception restores 35 feet where the neighbours are far enough off
      # and the upper windows do not face them. That is a relaxation turning on
      # abutting structures and window placement, neither of which is a fact
      # about this lot, and it is not encoded.
      value: 35
      cite: MCC 39.4830(H)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L325,L329"
      variants:
        - value: 25
          when: [flag_lot]
          cite: MCC 39.4830(H), exception (4)
          quote: "or/multnomah/_unincorporated/39.lr-5.txt#L348-L352"
    setback_front_ft:
      # One printed row -- "Front Side Street Side Rear / 20 5 10 15" -- and
      # all four columns come off it together.
      value: 20
      cite: MCC 39.4830(H)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L325-L327"
    setback_side_ft:
      value: 5
      cite: MCC 39.4830(H)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L325-L327"
    setback_street_side_ft:
      value: 10
      cite: MCC 39.4830(H)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L325-L327"
    setback_rear_ft:
      value: 15
      cite: MCC 39.4830(H)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L325-L327"
    max_coverage_pct:
      value: 50
      cite: MCC 39.4830(G)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L323-L324"
    min_lot_width_ft:
      # 45 for an interior lot and 50 for a corner lot, and the pod's only
      # unconditional door into this zone is the corner lot -- so the variant
      # is the number that will nearly always bind, and the base is the one
      # that almost never can.
      value: 45
      cite: MCC 39.4830(F)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L320-L322"
      variants:
        - value: 50
          when: [corner_lot]
          cite: MCC 39.4830(F)
          quote: "or/multnomah/_unincorporated/39.lr-5.txt#L320-L322"
    min_frontage_ft:
      value: 20
      cite: MCC 39.4830(E)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L318-L319"
    notes: >-
      WHAT "MULTIPLEX" MEANS HERE, and it is not obvious. MCC 39.2000 defines a
      Multi-Plex Dwelling Structure as "a row house or town house apartment
      structure" and stops. A Row House is "a one-story apartment structure
      having three or more dwelling units" -- the pod is two storeys, so it is
      not that half. An Apartment is "any building or portion thereof used for
      or containing three or more dwelling units", which the pod is. And "town
      house" the county never defines at all.


      So a four-unit, two-storey, attached townhome reaches the multiplex row
      through the undefined half of a two-part definition. That reading is
      almost certainly right -- a town house apartment structure is what this
      building is in any ordinary use of the words, and the row house half
      exists precisely to cover the single-storey case -- but it rests on a
      term with no entry in the county's glossary, and this file says so
      rather than letting the permission look unqualified. The same chain
      decides LR-5 and LR-7.


      Two of the four locational paths in 39.4828(A) are not encoded because
      nothing here can see them: "a lot having sole access from an accessway
      approved under MCC 39.9000 through 39.9700", and a lot on a public street
      created under the same chapters where "not more than 12 multiplex
      dwelling units having access from the same public street are located
      within 250 feet of each other". The first needs a private-access layer
      nobody holds; the second needs a count of existing multiplex units within
      250 feet, which is a survey of what has already been built. A lot on
      either path screens as refused here and should not be. That is the
      direction this file errs in, stated where the next person to hold the
      data will find it.


      39.4828(B) caps a multiplex approved this way at six dwelling units. The
      pod is four and clears it, and the number is recorded because a cap that
      binds nothing today is exactly the sort of sentence a larger catalog
      entry would walk into.


      THE PREEMPTION QUESTION, unresolved and shared with LR-7 two zones down.
      That zone carries quadplex_allowed: true on the HB 2001 middle-housing
      mandate rather than on the county code, which lists a multiplex as a
      conditional use there exactly as it does here. This file takes the
      opposite reading -- what the stored document says -- because 660-046-0220
      governs "Large Cities" by its own terms and this layer is unincorporated
      county, and because inventing a state override per zone is how the same
      statute ends up meaning two things inside one layer. If ORS 197A.420 does
      reach unincorporated county, it belongs on the state layer as a
      preemption, where it will reach LR-5, LR-7 and LR-10 together. Fetch the
      statute before signing anything in any of the three.
  LR10:
    section: ["39.lr-10"]
    cite_default:
      cite: MCC 39.4870 (Uses), 39.4872(A) (Primary Uses), 39.4876 (Conditional Uses)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # The same article shape as LR-5 with the multiplex line taken out.
      # 39.4870 closes the list, 39.4872(A) is the primary use -- "single
      # family detached dwelling" -- and 39.4876 is the conditional list, which
      # runs to community service uses, the generic Part 7 conditional uses,
      # farm sales and home occupations. Where LR-5 prints "(C) A multiplex
      # dwelling structure", this zone prints nothing.
      #
      # The ceiling in LR-10 is two units, and it is reached twice under
      # prescribed conditions rather than as a primary use: 39.4874(B) allows a
      # two-unit dwelling as a transitional use within 100 feet of a commercial
      # or industrial zone, and 39.4874(E) allows one on a corner lot outside a
      # Developed Neighborhood. Neither reaches four.
      value: false
      quote: "or/multnomah/_unincorporated/39.lr-10.txt#L13-L19,L22,L242-L256"
    notes: >-
      Minimum lot size 10,000 square feet for a single family detached dwelling
      and 12,000 for a two-unit dwelling; front lot line 30 feet, lot width 70,
      coverage 35 percent, yards 30 front / 10 side / 10 street side / 20 rear,
      height 35 feet. None of it is encoded, because the use list settles the
      zone first and a dimensional row on a refused zone is a row nobody can
      act on. It is recorded so the next reader knows it was read.


      39.4876(B) admits "Conditional Uses under the provisions of Part 7 of
      this Chapter" without listing them, and Part 7 is not a stored document.
      That reference is the one soft spot in this refusal. It is read as the
      county's general conditional-use chapter -- schools, churches, utilities,
      the uses a residential zone hosts rather than the housing types it
      permits -- on the evidence that every article in Part 4 states its own
      housing types explicitly and LR-5 states a multiplex in exactly this
      position. A reader who wants the refusal airtight should fetch Part 7.


      The preemption question stated at length under LR-5 applies here
      identically: LR-7 reads true on an unstored statute and these two read
      false on their own text. If ORS 197A.420 reaches unincorporated county it
      belongs on the state layer, not in three zone blocks disagreeing.
  MUA20:
    section: ["39.mua-20"]
    cite_default:
      cite: MCC 39.4305 (Uses) and 39.4310(A) (Allowed Uses)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # The largest single gap in this corpus -- 251 lots -- and the article
      # closes in eight lines. 39.4305 is the closure, in the county's
      # standard form: "no building, structure or land shall be used ...
      # except for the uses listed in MCC 39.4310 through 39.4320". 39.4310(A)
      # is the entry, and it is the whole of residential use in this zone:
      # "Residential use consisting of a single family dwelling on a Lot of
      # Record."
      #
      # The review uses (39.4315) and the conditional uses (39.4320) were read
      # through. Between them: utility facilities, community service uses,
      # temporary health-hardship dwellings, home occupations, farm stands,
      # wireless facilities, mining, kennels, and an accessory dwelling unit
      # attached to or inside the single family dwelling. An ADU is one unit
      # sharing a wall with one house, which is the nearest this zone comes to
      # the pod and is not it.
      value: false
      quote: "or/multnomah/_unincorporated/39.mua-20.txt#L18-L25,L30-L31"
    notes: >-
      THE PLANNED DEVELOPMENT ENTRY, and why it is not a door here. 39.4320(C)(1)
      lists "Planned Development for single family residences, as provided in
      MCC 39.5300 through MCC 39.5350" as a conditional use on lands not
      predominantly of Agricultural Capability Class I, II or III soils. In
      Rural Residential and in Orient Rural Center Residential that same
      reference reaches 39.5350(A) and its "single family detached or attached
      dwellings", and both zones are encoded with the door open behind a
      hearing. This zone is not, because 39.5350 opens "In a residential zone"
      and Multiple Use Agriculture is an agricultural one -- so what housing
      types a PD may hold here is unstated rather than permitted, and an
      unstated permission is a refusal until somebody finds the sentence.


      Two things would settle it and neither is in hand: a reading of the OAR
      Chapter 660 Division 004 planned unit development standards the entry
      also invokes, and the soils class of the parcel, which is a survey
      nothing in this system holds. Recorded here rather than encoded, because
      a variant behind two unread rules is a permission nobody could check.


      Twenty-acre minimum lot, 35 feet of height, yards of 30 front / 10 side
      / 30 street side / 30 rear, and a 50-foot minimum front lot line
      (39.4325). None of that is encoded, because the use list settles the
      zone before any of it is reached and a dimensional row on a refused zone
      is a row nobody can act on. It is recorded here so the next reader knows
      it was read rather than skipped.


      MUA-20 is a rural zone and nearly all of it lies outside the Metro urban
      growth boundary. A parcel inside the UGB carrying this label deserves an
      individual look -- not because the code reads differently there, but
      because a county zoning map inside a growth boundary is usually a
      pending annexation.
  CFU:
    section: ["39.cfu"]
    cite_default:
      cite: MCC 39.4065 (Uses), 39.4060 (Definitions), 39.4070(B)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # A forest zone, and it says so in the shape of its dwellings. 39.4065
      # closes the list; 39.4070(B) opens the one residential entry, "the
      # following dwellings", and names three: a Large Acreage Dwelling
      # (39.4085), a Template Dwelling (39.4090), a Heritage Tract Dwelling
      # (39.4095). The article's own definitions section settles all three in
      # the same six words -- each is "a type of single family detached
      # dwelling" -- which is why the definitions are inside the citation
      # rather than left to the reader.
      #
      # Detached is the word that ends it. The pod is four units on one
      # foundation sharing three party walls, and a zone whose every dwelling
      # type is defined as detached has no row for it.
      value: false
      quote: "or/multnomah/_unincorporated/39.cfu.txt#L85-L86,L92-L93,L115-L116,L130-L137,L386"
    notes: >-
      The three dwelling types are gated far past the use list -- a large
      acreage dwelling wants an 80-acre tract in one ownership, a template
      dwelling wants a 160-acre square with a stated number of existing
      dwellings inside it, a heritage tract dwelling wants a tract held by the
      same family since 1974. Those are the criteria a single house has to
      clear here, and none of them is encoded, because they cannot make a
      detached dwelling into an attached one.
  EFU:
    section: ["39.efu"]
    cite_default:
      cite: MCC 39.4215 (Uses), 39.4225(D) (Review Uses), 39.4265(C)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # The one resource district in this corpus that prints this building.
      #
      # The base is the ordinary reading. 39.4215 closes the list. The
      # residential entries are all farm-attached: a farm help dwelling for a
      # relative (39.4225(B)), a dwelling customarily provided in conjunction
      # with a farm use (C), accessory farm dwellings (D), a heritage tract
      # dwelling (E). Read at that level, every one of them is a house.
      #
      # 39.4265(C)(2)(d) is where it stops being a house. An accessory farm
      # dwelling on a lot without the primary farm dwelling may be "limited to
      # only attached multi-unit residential structures allowed by the
      # applicable state building code or similar types of farm labor housing"
      # registered with Oregon OSHA under ORS 658.750. That is the pod's form,
      # named, in a zone with an 80-acre minimum lot.
      #
      # So the variant is real and it is expensive: it needs the farm, the
      # primary dwelling on the tract, farm-worker occupancy, and removal or
      # conversion when the housing is no longer required. `review_use`
      # carries the county's procedure, `farm_labor_housing` carries the
      # commitment. Neither is assumed and the base stays false, which is the
      # right answer for an acquisition screen -- but recording the door is
      # the difference between a zone that refuses and a zone nobody read.
      value: false
      quote: "or/multnomah/_unincorporated/39.efu.txt#L175-L186,L621-L633"
      variants:
        - value: true
          when: [farm_labor_housing, review_use]
          cite: MCC 39.4225(D) and 39.4265(C)(2)(d)
          quote: "or/multnomah/_unincorporated/39.efu.txt#L628-L633,L2179-L2198"
    max_height_ft:
      # 39.4245(C), printed under the yard row: "Maximum Structure Height - 35
      # feet." Paragraph (E) lets barns, silos, windmills, antennae and
      # chimneys exceed it when they stand 30 feet off every property line.
      # None of those is a dwelling, so no variant carries the exception --
      # the same reading the Rural Residential zone in this layer takes of the
      # same sentence.
      value: 35
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352,L1356"
    setback_front_ft:
      # One printed row -- "Front Side Street Side Rear / 30 10 30 30" -- and
      # all four columns come off it together, because a row read one column
      # at a time is how a setback gets attributed to the wrong lot line.
      value: 30
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352-L1354"
    setback_side_ft:
      value: 10
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352-L1354"
    setback_street_side_ft:
      value: 30
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352-L1354"
    setback_rear_ft:
      value: 30
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352-L1354"
    min_frontage_ft:
      value: 50
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352,L1358"
    min_lot_sqft:
      # 80 acres, from 39.4245(A). The file states the acreage and the loader
      # multiplies, because 3,484,800 square feet appears in this article
      # nowhere -- the same bargain LR-7's "5,000 square feet for each
      # dwelling unit" strikes two zones down.
      #
      # The reservation is in the words "for new parcels". This is a land
      # DIVISION floor and the county files it under "Dimensional Requirements
      # and Development Standards", which is why it is encoded here -- but an
      # EFU lot of record smaller than 80 acres is not thereby barred from
      # developing, and 39.4250 states the exceptions. So this number reads
      # RED on a 20-acre farm that could in principle host the one use this
      # zone opens to the pod. That is a false red on a handful of the 13 lots
      # in this layer, and it is the direction taken deliberately: the use
      # path here needs a working farm with a primary dwelling already on the
      # tract, and a screen that reported those lots green would be inviting
      # somebody to underwrite farm labor housing as market housing.
      acres: 80
      cite: MCC 39.4245(A)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1339-L1345"
    notes: >-
      The dimensions are encoded here and on none of the other three resource
      zones, because this is the only one of the four with a use path that
      reaches the pod at all. A zone whose use list closes needs no envelope;
      a zone with a door needs the room behind it measured.


      39.4240 attaches a condition of approval to every single family dwelling
      in this zone -- the landowner records a deed document waiving any claim
      alleging injury from farming or forest practices. It binds successors.
      It is not a dimensional standard and nothing here holds it, but anybody
      who reaches this zone with a real deal should know the waiver exists.
  MUF19:
    section: ["39.muf"]
    cite_default:
      cite: MCC 39.4702 (Uses), 39.4705(E), 39.4707(A), 39.4710(C)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # Three doors into residential use in this zone and all three are the
      # same door. 39.4705(E) allows "a single-family dwelling including a
      # mobile or modular home, on a lot of 38 acres or more". 39.4707(A)
      # allows one in conjunction with a primary forest use on ten acres or
      # more. 39.4710(C) allows one NOT in conjunction with a primary use, as
      # a conditional use, on land found incapable of sustaining a farm or
      # forest use. Different acreages, different procedures, one building
      # type.
      #
      # 39.4702 is the closure that makes the absence readable. Nothing in the
      # article is attached, multi-unit or middle housing, and 39.4732 -- the
      # residential development standards these dwellings answer to -- asks
      # for a minimum floor area of 600 square feet and a foundation, which
      # are a house's standards.
      value: false
      quote: "or/multnomah/_unincorporated/39.muf.txt#L22-L28,L54-L58,L69-L72,L231-L235"
    notes: >-
      39.4732 is worth a line even though it changes nothing here. It sites
      the dwelling for fire protection -- as close to an existing road as
      practicable, clustered where more than one is allowed, outside a big
      game habitat area unless ODFW certifies the impact. Those are siting
      rules a geometry layer could hold one day; they sit on a zone that
      refuses the building, so today they are a note.
  R10:
    cite_default:
      cite: Portland Zoning Code 33.110 Tables 110-2/110-4/110-5/110-7 (Portland-administered pockets);
        33.418
      url: https://www.portland.gov/sites/default/files/code/110-sd-zone_2.pdf
      retrieved: '2026-07-24'
    quadplex_allowed:
      value: true
      quote: "or/multnomah/_unincorporated/33.110.txt#L313"
    max_height_ft:
      # Table 110-4, "Maximum Height": 30 ft. in RF, R20, R10, R7 and R5, and
      # 35 ft. in R2.5. The header row is quoted with the standard's row
      # because the table puts all six districts on one printed line.
      #
      # Note [3] hangs on this cell and is already ruled in the footnote
      # ledger: "additional FAR and height may be allowed. See 33.110.265.F"
      # -- a relaxation, and it can only raise the ceiling.
      value: 30
      cite: PCC 33.110 Table 110-4; 33.110.215
      quote: "or/multnomah/_unincorporated/33.110.txt#L435,L454"
    setback_front_ft:
      value: 20
      quote: "or/multnomah/_unincorporated/33.110.txt#L458"
    # 39.6580(A), stated as equal to the building setback -- see the note in
    # `defaults:`. `same_as` resolves against the front setback above it, and
    # the sentence carries no figure of its own for anything to be typed from.
    parking_street_setback_ft:
      same_as: setback_front_ft
      cite: MCC 39.6580(A), no required street yard used for parking, loading or maneuvering
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-30'
      quote: "or/multnomah/_unincorporated/39.parking.txt#L431-L437"
    setback_side_ft:
      value: 10
      quote: "or/multnomah/_unincorporated/33.110.txt#L460"
    setback_rear_ft:
      value: 10
      quote: "or/multnomah/_unincorporated/33.110.txt#L462"
    min_lot_sqft:
      value: 6000
      quote: "or/multnomah/_unincorporated/33.110.txt#L1551"
    coverage_curve:
      # Table 110-5, "Maximum Building Coverage Allowed in the RF through R2.5
      # Zones". Each triple is [lot size at which the row starts, square feet
      # allowed at that size, percent of the excess above it]. The first row
      # prints a flat 50 percent rather than a base-plus-marginal, which is the
      # [0, 0, 50] -- 50 percent of everything up to 3,000.
      value:
      - [0, 0, 50]
      - [3000, 1500, 37.5]
