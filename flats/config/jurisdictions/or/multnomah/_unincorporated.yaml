      # stands, property line adjustments, wireless facilities, mining, kennels,
      # home occupations, and a planned development.
      #
      # That last entry was read as a refusal until 2026-08-20 and it is not
      # one. 39.4370(B)(8) is "Planned Development for single family residences
      # as provided in MCC 39.5300 through 39.5350", and 39.5350 is titled
      # PERMITTED USES: "In a residential zone, the following uses may be
      # permitted in a Planned Development overlay: (A) Housing types may
      # include only duplexes and single family detached or attached
      # dwellings." Rural Residential is a residential zone by its own name and
      # its own purpose section, so the housing-type list reaches it, and
      # single family ATTACHED is this building.
      #
      # No duplex, triplex or quadplex is named anywhere in the article itself.
      # The door is entirely in the overlay it points at.
      value: false
      quote: "or/multnomah/_unincorporated/39.rural-residential.txt#L19-L26,L27-L32,L386-L389,L392-L393,L412-L418"
      cite: "MCC 39.4355, 39.4360(A) and 39.4370(B)(8)"
