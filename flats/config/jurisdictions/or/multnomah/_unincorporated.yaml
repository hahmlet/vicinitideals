    quadplex_allowed:
      # MCC 39.4856 CONDITIONAL USES, (C): "A multiplex or two-unit dwelling
      # structure, under the provisions of Part 7 of this Chapter, subject to
      # the following findings and conditions" -- the site outside a Developed
      # Neighborhood, comprehensive plan findings, and more. 39.4854, the
      # permitted-use section, does not list a multiplex at all.
      #
      # So the base is false and the relief carries the true. Not the same as
      # a prohibition: an LR-7 lot is not RED, it is a lot whose pod needs a
      # hearing, and the traffic light can only say that if the code's own
      # distinction between permitted and conditional survives the encoding.
      value: false
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L322-L336"
      variants:
        - value: true
          when: [conditional_use]
          quote: "or/multnomah/_unincorporated/39.lr-7.txt#L322-L336"
    max_height_ft:
      # MCC 39.4862(H): "Maximum Structure Height - 35 feet." The county's own
      # article, five feet looser than the Portland-administered pockets in
      # the same layer.
      #
      # The exception below is the one height rule in this corpus a 26 ft pod
      # actually fails: exception (4) drops the ceiling to 25 feet for "a
      # single family, duplex or multiplex dwelling on a flag lot or a lot
      # having sole access from an accessway, private drive or easement". The
      # pod is a multiplex, so the sentence reaches it.
      #
      # Only half of that trigger can be seen. `flag_lot` is a registered site
      # fact; "sole access from an accessway, private drive or easement" is
      # not, and no layer held records private drives or easements at all. So
      # a lot reached only by an easement takes 35 here and should take 25 --
      # the direction this encoding is wrong in, stated where the next person
      # to hold that data will find it.
      #
      # The same exception restores 35 feet where the neighbours are far
      # enough off and the upper windows do not face them. That is a
      # relaxation of a ceiling and it is not encoded: it turns on abutting
      # structures and window placement, neither of which is a fact about this
      # lot, and the strict reading is the one that keeps a false GREEN out.
      value: 35
      cite: MCC 39.4862 Dimensional Requirements and Development Standards, (H)
      quote: "or/multnomah/_unincorporated/39.lr-7.txt#L412"
      variants:
        - value: 25
          when: [flag_lot]
          cite: MCC 39.4862, exception (4)
          quote: "or/multnomah/_unincorporated/39.lr-7.txt#L429-L434"
