label: Multnomah Unincorporated
kind: unincorporated
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.'
ingest:
  geoid: null
  juris_city_codes:
  - UNINCORPORATED
  - ''
  zoning_layer: zoning_metro
  zone_field: ZONE
  strip_lowercase_suffix: false
definitions:
  # "Lot (Corner) - A lot which occupies an interior angle of less than 135
  # degrees, formed by the intersection of two streets or a street and an
  # accessway."
  #
  # Indexed under "Corner Lot - See Lot (Corner)" and stated here. The angle is
  # the county's whole test: no count of streets, no requirement that the
  # frontages be adjacent sides, just an interior angle formed by an
  # intersection. Closest to Rivergrove and not the same -- "less than 135"
  # excludes 135 where Rivergrove's "does not exceed 135" includes it, which is
  # why angle_inclusive is written out rather than left to a default.
  #
  # An accessway counts alongside a street, and no layer we hold records
  # accessways, so the definition is marked incomplete: it may answer yes on
  # two streets, and it may never answer no, because an accessway it cannot see
  # could make the answer yes.
  corner_lot:
    test: adjacent_frontages
    max_intersection_angle_deg: 135.0
    angle_inclusive: false
    incomplete: >-
      an intersection formed by a street and an accessway also makes a corner,
      and no layer held records accessways
    quote: "or/multnomah/_unincorporated/39.2000.definitions.txt#L836-L839"
    cite: "MCC 39.2000, Lot (Corner)"

code:
# R10/R20/RF/R7 are Portland-administered pockets: the standards live in
# PCC 33.110, the same chapter PDF the Portland layer declares. LR7 (MCC
# S-1) and RR (MCC 39.4350) cite the Multnomah County Code, which still
# needs its own declared source.
- id: "33.110"
  url: https://www.portland.gov/sites/default/files/code/110-sd-zone_2.pdf
  title: Chapter 33.110 Single-Dwelling Zones (Portland-administered pockets)
# The county serves MCC Chapter 39 as one 476-page PDF; the slice keeps the
# LR-7 article (39.4848-39.4862, dimensional requirements at 39.4862). LR7's
# encoded values remain Model-Code-derived (OAR 660-046 preemption, see the
# zone notes) — this is the MCC text a reviewer weighs them against.
# MCC 39.2000 is Part 2 of the zoning chapter -- the county's own definitions.
# The same PDF as the LR-7 slice and read plain rather than layout, because
# the chapter is set in two columns and layout mode splits a definition across
# the column break: "Lot (Corner) - A lot which occupies an interior angle of
# less than 135 degrees, formed by the" ends one line range and "intersection
# of two streets or a street and an accessway" opens another forty lines
# earlier in the file. A quote has to be able to state the whole rule.
- id: "39.2000.definitions"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.2000 Definitions (Chapter 39, Part 2)
  extraction: plain
  start: "PART 2"
  end: "PART 3"
  nth: 2
  # A definitions chapter is prose about words, so it carries almost no
  # dimensioned standards -- 36 lines of 1335 -- and the thinness guard reads
  # that as a landing page. It is not one. Read 2026-08-18: the slice runs
  # from "PART 2 - DEFINITIONS" to Part 3 and states the county's own
  # definitions of lot, corner lot, street and alley.
  allow_thin: true
# The Rural Residential article, from the same chapter PDF. RR's use flag was
# the one value in this layer with no citation, on the honest ground that
# nothing stored said it -- so the article was sliced rather than the sentence
# guessed at. Plain for the same two-column reason as the rest.
- id: "39.rural-residential"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4350-39.4395 Rural Residential (RR)
  start: "39.4350- PURPOSE"
  end: "39.4400- PURPOSE"
  extraction: plain
- id: "39.lr-7"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4848-39.4862 Low Density Residential LR-7 (formerly S-1)
  # Two-column PDF: layout mode interleaves the columns; plain mode reads
  # them in order. The double-spaced heading skips the TOC's "39.4848-".
  start: "39.4848  PURPOSE"
  end: "39.4868"
  extraction: plain
# The four resource base zones, sliced out of the same chapter PDF as the
# LR-7 and Rural Residential articles above. Together they carry 305 of the
# 424 lots this layer could not answer, and all four end the same way: a
# closed use list whose only residential entry is a single family dwelling.
# Plain extraction for the two-column reason stated above.
# The two urban low-density articles either side of LR-7. Both are sliced from
# the same chapter PDF, both set their purpose heading with a double space and
# no dash the way MUF does, and between them they answer 19 of the lots this
# layer could not.
# The three articles that close out this layer's MCC labels: the medium
# density zone that permits the pod outright, the urban future holding zone,
# and the retail commercial zone that forbids a residence in one sentence.
- id: "39.mr-4"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4968-39.4990 Urban Medium Density Residential - 4 (MR-4)
  start: "39.4968  PURPOSE"
  end: "39.5000- PURPOSES"
  extraction: plain
- id: "39.uf-20"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4748-39.4754 Urban Future (UF-20)
  start: "39.4748 UF-20 ZONE"
  end: "39.4758 AREA AFFECTED"
  extraction: plain
- id: "39.c-3"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4735-39.4739 Retail Commercial (C-3)
  start: "39.4735 USES"
  end: "39.4740 PURPOSES"
  extraction: plain
- id: "39.lr-5"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4818-39.4830 Urban Low Density Residential - 5 (LR-5)
  start: "39.4818  PURPOSE"
  end: "39.4848  PURPOSE"
  extraction: plain
- id: "39.lr-10"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4868-39.4878 Urban Low Density Residential - 10 (LR-10)
  start: "39.4868  PURPOSE"
  end: "39.4900 AREA AFFECTED"
  extraction: plain
- id: "39.mua-20"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4300-39.4345 Multiple Use Agriculture (MUA-20)
  start: "39.4300- PURPOSE"
  end: "39.4350- PURPOSE"
  extraction: plain
- id: "39.cfu"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4050-39.4155 Commercial Forest Use (CFU)
  start: "39.4050- PURPOSES"
  end: "39.4200- PURPOSE"
  extraction: plain
- id: "39.efu"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4200-39.4265 Exclusive Farm Use (EFU)
  start: "39.4200- PURPOSE"
  end: "39.4300- PURPOSE"
  extraction: plain
# The MUF heading is the one in this chapter the table of contents misprints:
# the body sets it "39.4700  PURPOSES." with two spaces and no dash, while
# the contents page reads "39.4700- PURPOSES". A start marker taken from the
# contents finds nothing.
- id: "39.muf"
  url: https://multco.us/file/chapter_39_-_zoning_code/download
  title: MCC 39.4700-39.4732 Multiple Use Forest (MUF)
  start: "39.4700  PURPOSES"
  end: "39.4735 USES"
  extraction: plain
zones:
  C3:
    section: ["39.c-3"]
    cite_default:
      cite: MCC 39.4735 (Uses), 39.4737(H) (Restrictions)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # Two sentences and it is over. 39.4735 closes the list -- 68 enumerated
      # retail uses from antique shop to variety store, none of them a
      # dwelling -- and 39.4737(H) says it outright: "No new residence shall
      # be permitted in this base zone except that related to the business or
      # enterprise allowed in this base zone such as janitor or night
      # watchperson."
      #
      # A caretaker's flat is the exception, and it is the same exception the
      # county's General Industrial zone and Fairview's GI carry. One unit for
      # somebody who works there is not four units for sale.
      value: false
      quote: "or/multnomah/_unincorporated/39.c-3.txt#L1-L8,L203-L206"
    notes: >-
      One lot. Encoded because a closed commercial list with an explicit
      residential prohibition is the cheapest kind of certainty in this corpus
      -- the zone is answered by a sentence rather than by an absence, and
      absences are what take the reading.
  CFU2:
    section: ["39.cfu"]
    cite_default:
      cite: MCC 39.4050(C)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    like:
      zone: CFU
      wins: local
      cite: MCC 39.4050(C) (the CFU base zones and their common standards)
      quote: "or/multnomah/_unincorporated/39.cfu.txt#L24-L30"
    notes: >-
      Not a separate article. 39.4050(C) names six zones -- CFU, CFU-1 through
      CFU-5 -- and says they "may be referred to collectively as the CFU
      because all standards and requirements applicable to the specific CFU
      base zone itself also apply to each of the other zones except as
      expressly stated otherwise". So the incorporation is the code's own
      sentence rather than an inference from the label, which is the whole
      difference between a `like` somebody can check and a `like` somebody
      guessed.


      The two places the article does state otherwise are both in the forest
      practices and siting standards -- 39.4115's fire siting rules read
      differently in CFU-1 and CFU-2 -- and neither touches the use list or
      any dimension encoded here. `wins: local` is set anyway, so a value
      written into this zone later would override the incorporation rather
      than sit beside it.
  MR4:
    section: ["39.mr-4"]
    cite_default:
      cite: MCC 39.4970 (Uses), 39.4975(B) (Primary Uses), 39.4990 (Dimensional
        Requirements)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # The only zone in this layer that permits the pod outright. 39.4975 is
      # PRIMARY USES and (B) is one line: "A multiplex dwelling structure."
      # No conditional use, no locational requirement, no hearing -- where
      # LR-5 four zones up needs 39.4826(C) and 39.4828(A) together, this zone
      # needs nothing at all.
      #
      # 39.4970 is quoted with it for the usual reason: the permission is only
      # readable as a permission because the article closes its list.
      value: true
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L12-L21"
    min_lot_sqft:
      # 39.4990(C): 4,000 square feet for EACH dwelling unit in a multiplex
      # dwelling structure, so 16,000 for the pod. The lowest per-unit figure
      # in the county's own articles -- LR-5 asks 4,500 and LR-7 asks 5,000 --
      # and 16,000 appears in the article nowhere.
      per_dwelling: 4000
      cite: MCC 39.4990(C)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L155-L157"
    max_height_ft:
      value: 35
      cite: MCC 39.4990(J)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L173,L179"
    setback_front_ft:
      # Two printed rows this time, not one -- "Interior Lot 20 5 N/A 15" and
      # "Corner Lot 20 5 10 15" under "Front Side Street Side Rear". Both are
      # inside every citation, because the only column that differs is the
      # street side one and a reader has to be able to see that.
      value: 20
      cite: MCC 39.4990(J)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L173-L178"
    setback_side_ft:
      value: 5
      cite: MCC 39.4990(J)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L173-L178"
    setback_street_side_ft:
      value: 10
      cite: MCC 39.4990(J)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L173-L178"
    setback_rear_ft:
      value: 15
      cite: MCC 39.4990(J)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L173-L178"
    max_coverage_pct:
      value: 40
      cite: MCC 39.4990(I)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L171-L172"
    min_lot_width_ft:
      value: 45
      cite: MCC 39.4990(H)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L168-L170"
      variants:
        - value: 50
          when: [corner_lot]
          cite: MCC 39.4990(H)
          quote: "or/multnomah/_unincorporated/39.mr-4.txt#L168-L170"
    min_frontage_ft:
      value: 20
      cite: MCC 39.4990(G)
      quote: "or/multnomah/_unincorporated/39.mr-4.txt#L166-L167"
    notes: >-
      WHAT "MULTIPLEX" MEANS HERE, and it is not obvious. MCC 39.2000 defines a
      Multi-Plex Dwelling Structure as "a row house or town house apartment
      structure" and stops. A Row House is "a one-story apartment structure
      having three or more dwelling units" -- the pod is two storeys, so it is
      not that half. An Apartment is "any building or portion thereof used for
      or containing three or more dwelling units", which the pod is. And "town
      house" the county never defines at all.


      So a four-unit, two-storey, attached townhome reaches the multiplex row
      through the undefined half of a two-part definition. That reading is
      almost certainly right -- a town house apartment structure is what this
      building is in any ordinary use of the words, and the row house half
      exists precisely to cover the single-storey case -- but it rests on a
      term with no entry in the county's glossary, and this file says so
      rather than letting the permission look unqualified. The same chain
      decides LR-5 and LR-7.


      39.4990(K) is not encoded and it can bind hard: "in the case of an
      apartment structure in this base zone, a yard equal to the structure
      height shall be provided between the structure in this base zone and any
      adjacent LR base zone lot line". A 26-foot pod next to an LR lot would
      owe a 26-foot yard on that line instead of five or fifteen. Two things
      stop it being encoded rather than one -- the neighbour's zoning is a
      fact nothing here holds, and whether a four-unit multiplex is an
      "apartment structure" for this sentence turns on the same undefined
      vocabulary the use flag does. The Planning Director may modify or waive
      it on design review, which is a relief nobody should count on.


      Two lots carry this label. It is encoded in full anyway, because it is
      the one county zone where the answer can come out GREEN, and a zone that
      can say yes is worth more attention than a zone that says no.
  UF20:
    section: ["39.uf-20"]
    cite_default:
      cite: MCC 39.4750 (Uses), 39.4751(A) (Primary Uses), 39.4752(A)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # A holding zone -- 20-acre minimum lot on land the county expects to
      # urbanise later -- and it holds by keeping the use list short. 39.4750
      # closes it; 39.4751(A) is "residential use consisting of a single-
      # family detached dwelling on a lot"; 39.4752(A) adds a second
      # single-family dwelling for farm help on the same lot as the first.
      # 39.4753's conditional list is mining, feed lots, swine, fur-bearing
      # animals, dog kennels and log rafts. No middle housing of any kind.
      value: false
      quote: "or/multnomah/_unincorporated/39.uf-20.txt#L6-L15,L138-L143"
    notes: >-
      Twenty acres is the minimum lot size, stated in the zone's own first
      sentence rather than in its dimensional section. Not encoded, because
      the use list settles the zone first.


      The name is the thing to notice. This is land the comprehensive plan has
      already earmarked for a future urban designation, which means the answer
      here has a shelf life in a way a resource zone's does not: an EFU parcel
      refuses the pod because it is a farm, and a UF-20 parcel refuses it
      because the county has not rezoned it yet. Four lots today.
  LR5:
    section: ["39.lr-5"]
    cite_default:
      cite: MCC 39.4820 (Uses), 39.4826(C) (Conditional Uses), 39.4828 (Multiplex
        Locational Requirements), 39.4830 (Dimensional Requirements)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # LR-7's twin, and encoded the way LR-7 should have been. 39.4826(C)
      # lists "a multiplex dwelling structure under the provisions of Part 7 of
      # this Chapter" as a conditional use, so the base is false and a hearing
      # carries the true -- an LR-5 lot is not RED, it is a lot whose pod needs
      # an application.
      #
      # The permit alone is not enough. 39.4828(A) is a locational rule with
      # teeth: an approved multiplex "may be located only on" a corner lot, a
      # flag lot, a lot with sole access from an approved accessway, or a lot
      # on a street created under the land division chapters with fewer than 12
      # multiplex units within 250 feet. Two of those four are site facts this
      # system registers, so they are the two variants; the other two are not
      # held by any layer and are recorded in the notes rather than assumed.
      #
      # Both registered facts default to false, which means a batch screen
      # returns the refusal until the geometry layer speaks. That is the
      # correct direction here -- the county wrote this rule to keep multiplex
      # buildings off ordinary interior lots, and an encoding that ignored it
      # would open every lot in the zone.
      value: false
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L13-L19,L259-L270"
      variants:
        - value: true
          when: [conditional_use, corner_lot]
          cite: MCC 39.4826(C) and 39.4828(A)(1)
          quote: "or/multnomah/_unincorporated/39.lr-5.txt#L259-L261,L283-L287"
        - value: true
          when: [conditional_use, flag_lot]
          cite: MCC 39.4826(C) and 39.4828(A)(2)
          quote: "or/multnomah/_unincorporated/39.lr-5.txt#L259-L261,L283-L287"
    min_lot_sqft:
      # 39.4830(C): 4,500 square feet for EACH dwelling unit in a multiplex
      # dwelling structure, so 18,000 for the pod. Stated per dwelling because
      # that is what the sentence says -- the same shape as LR-7's 5,000, and
      # the product appears in the article nowhere.
      per_dwelling: 4500
      cite: MCC 39.4830(C)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L312-L314"
    max_height_ft:
      # 39.4830(H): "Maximum Structure Height - 35 feet", and then exception
      # (4), which is the one height rule in this corpus a 26 ft pod actually
      # fails: 25 feet for "a single family, duplex or multiplex dwelling on a
      # flag lot or a lot having sole access from an accessway, private drive
      # or easement".
      #
      # Read that against the use rule above and the zone says something
      # sharper than either sentence alone. A multiplex may sit on a corner lot
      # or a flag lot; on the flag lot it may be 25 feet tall; the pod is 26.
      # So one of the two doors this zone opens is shut by its own height
      # exception, and the arithmetic is what shuts it rather than an
      # assumption.
      #
      # The exception restores 35 feet where the neighbours are far enough off
      # and the upper windows do not face them. That is a relaxation turning on
      # abutting structures and window placement, neither of which is a fact
      # about this lot, and it is not encoded.
      value: 35
      cite: MCC 39.4830(H)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L325,L329"
      variants:
        - value: 25
          when: [flag_lot]
          cite: MCC 39.4830(H), exception (4)
          quote: "or/multnomah/_unincorporated/39.lr-5.txt#L348-L352"
    setback_front_ft:
      # One printed row -- "Front Side Street Side Rear / 20 5 10 15" -- and
      # all four columns come off it together.
      value: 20
      cite: MCC 39.4830(H)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L325-L327"
    setback_side_ft:
      value: 5
      cite: MCC 39.4830(H)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L325-L327"
    setback_street_side_ft:
      value: 10
      cite: MCC 39.4830(H)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L325-L327"
    setback_rear_ft:
      value: 15
      cite: MCC 39.4830(H)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L325-L327"
    max_coverage_pct:
      value: 50
      cite: MCC 39.4830(G)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L323-L324"
    min_lot_width_ft:
      # 45 for an interior lot and 50 for a corner lot, and the pod's only
      # unconditional door into this zone is the corner lot -- so the variant
      # is the number that will nearly always bind, and the base is the one
      # that almost never can.
      value: 45
      cite: MCC 39.4830(F)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L320-L322"
      variants:
        - value: 50
          when: [corner_lot]
          cite: MCC 39.4830(F)
          quote: "or/multnomah/_unincorporated/39.lr-5.txt#L320-L322"
    min_frontage_ft:
      value: 20
      cite: MCC 39.4830(E)
      quote: "or/multnomah/_unincorporated/39.lr-5.txt#L318-L319"
    notes: >-
      WHAT "MULTIPLEX" MEANS HERE, and it is not obvious. MCC 39.2000 defines a
      Multi-Plex Dwelling Structure as "a row house or town house apartment
      structure" and stops. A Row House is "a one-story apartment structure
      having three or more dwelling units" -- the pod is two storeys, so it is
      not that half. An Apartment is "any building or portion thereof used for
      or containing three or more dwelling units", which the pod is. And "town
      house" the county never defines at all.


      So a four-unit, two-storey, attached townhome reaches the multiplex row
      through the undefined half of a two-part definition. That reading is
      almost certainly right -- a town house apartment structure is what this
      building is in any ordinary use of the words, and the row house half
      exists precisely to cover the single-storey case -- but it rests on a
      term with no entry in the county's glossary, and this file says so
      rather than letting the permission look unqualified. The same chain
      decides LR-5 and LR-7.


      Two of the four locational paths in 39.4828(A) are not encoded because
      nothing here can see them: "a lot having sole access from an accessway
      approved under MCC 39.9000 through 39.9700", and a lot on a public street
      created under the same chapters where "not more than 12 multiplex
      dwelling units having access from the same public street are located
      within 250 feet of each other". The first needs a private-access layer
      nobody holds; the second needs a count of existing multiplex units within
      250 feet, which is a survey of what has already been built. A lot on
      either path screens as refused here and should not be. That is the
      direction this file errs in, stated where the next person to hold the
      data will find it.


      39.4828(B) caps a multiplex approved this way at six dwelling units. The
      pod is four and clears it, and the number is recorded because a cap that
      binds nothing today is exactly the sort of sentence a larger catalog
      entry would walk into.


      THE PREEMPTION QUESTION, unresolved and shared with LR-7 two zones down.
      That zone carries quadplex_allowed: true on the HB 2001 middle-housing
      mandate rather than on the county code, which lists a multiplex as a
      conditional use there exactly as it does here. This file takes the
      opposite reading -- what the stored document says -- because 660-046-0220
      governs "Large Cities" by its own terms and this layer is unincorporated
      county, and because inventing a state override per zone is how the same
      statute ends up meaning two things inside one layer. If ORS 197A.420 does
      reach unincorporated county, it belongs on the state layer as a
      preemption, where it will reach LR-5, LR-7 and LR-10 together. Fetch the
      statute before signing anything in any of the three.
  LR10:
    section: ["39.lr-10"]
    cite_default:
      cite: MCC 39.4870 (Uses), 39.4872(A) (Primary Uses), 39.4876 (Conditional Uses)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # The same article shape as LR-5 with the multiplex line taken out.
      # 39.4870 closes the list, 39.4872(A) is the primary use -- "single
      # family detached dwelling" -- and 39.4876 is the conditional list, which
      # runs to community service uses, the generic Part 7 conditional uses,
      # farm sales and home occupations. Where LR-5 prints "(C) A multiplex
      # dwelling structure", this zone prints nothing.
      #
      # The ceiling in LR-10 is two units, and it is reached twice under
      # prescribed conditions rather than as a primary use: 39.4874(B) allows a
      # two-unit dwelling as a transitional use within 100 feet of a commercial
      # or industrial zone, and 39.4874(E) allows one on a corner lot outside a
      # Developed Neighborhood. Neither reaches four.
      value: false
      quote: "or/multnomah/_unincorporated/39.lr-10.txt#L13-L19,L22,L242-L256"
    notes: >-
      Minimum lot size 10,000 square feet for a single family detached dwelling
      and 12,000 for a two-unit dwelling; front lot line 30 feet, lot width 70,
      coverage 35 percent, yards 30 front / 10 side / 10 street side / 20 rear,
      height 35 feet. None of it is encoded, because the use list settles the
      zone first and a dimensional row on a refused zone is a row nobody can
      act on. It is recorded so the next reader knows it was read.


      39.4876(B) admits "Conditional Uses under the provisions of Part 7 of
      this Chapter" without listing them, and Part 7 is not a stored document.
      That reference is the one soft spot in this refusal. It is read as the
      county's general conditional-use chapter -- schools, churches, utilities,
      the uses a residential zone hosts rather than the housing types it
      permits -- on the evidence that every article in Part 4 states its own
      housing types explicitly and LR-5 states a multiplex in exactly this
      position. A reader who wants the refusal airtight should fetch Part 7.


      The preemption question stated at length under LR-5 applies here
      identically: LR-7 reads true on an unstored statute and these two read
      false on their own text. If ORS 197A.420 reaches unincorporated county it
      belongs on the state layer, not in three zone blocks disagreeing.
  MUA20:
    section: ["39.mua-20"]
    cite_default:
      cite: MCC 39.4305 (Uses) and 39.4310(A) (Allowed Uses)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # The largest single gap in this corpus -- 251 lots -- and the article
      # closes in eight lines. 39.4305 is the closure, in the county's
      # standard form: "no building, structure or land shall be used ...
      # except for the uses listed in MCC 39.4310 through 39.4320". 39.4310(A)
      # is the entry, and it is the whole of residential use in this zone:
      # "Residential use consisting of a single family dwelling on a Lot of
      # Record."
      #
      # The review uses (39.4315) and the conditional uses (39.4320) were read
      # through. Between them: utility facilities, community service uses,
      # temporary health-hardship dwellings, home occupations, farm stands,
      # wireless facilities, mining, kennels, and an accessory dwelling unit
      # attached to or inside the single family dwelling. An ADU is one unit
      # sharing a wall with one house, which is the nearest this zone comes to
      # the pod and is not it.
      value: false
      quote: "or/multnomah/_unincorporated/39.mua-20.txt#L18-L25,L30-L31"
    notes: >-
      Twenty-acre minimum lot, 35 feet of height, yards of 30 front / 10 side
      / 30 street side / 30 rear, and a 50-foot minimum front lot line
      (39.4325). None of that is encoded, because the use list settles the
      zone before any of it is reached and a dimensional row on a refused zone
      is a row nobody can act on. It is recorded here so the next reader knows
      it was read rather than skipped.


      MUA-20 is a rural zone and nearly all of it lies outside the Metro urban
      growth boundary. A parcel inside the UGB carrying this label deserves an
      individual look -- not because the code reads differently there, but
      because a county zoning map inside a growth boundary is usually a
      pending annexation.
  CFU:
    section: ["39.cfu"]
    cite_default:
      cite: MCC 39.4065 (Uses), 39.4060 (Definitions), 39.4070(B)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # A forest zone, and it says so in the shape of its dwellings. 39.4065
      # closes the list; 39.4070(B) opens the one residential entry, "the
      # following dwellings", and names three: a Large Acreage Dwelling
      # (39.4085), a Template Dwelling (39.4090), a Heritage Tract Dwelling
      # (39.4095). The article's own definitions section settles all three in
      # the same six words -- each is "a type of single family detached
      # dwelling" -- which is why the definitions are inside the citation
      # rather than left to the reader.
      #
      # Detached is the word that ends it. The pod is four units on one
      # foundation sharing three party walls, and a zone whose every dwelling
      # type is defined as detached has no row for it.
      value: false
      quote: "or/multnomah/_unincorporated/39.cfu.txt#L85-L86,L92-L93,L115-L116,L130-L137,L386"
    notes: >-
      The three dwelling types are gated far past the use list -- a large
      acreage dwelling wants an 80-acre tract in one ownership, a template
      dwelling wants a 160-acre square with a stated number of existing
      dwellings inside it, a heritage tract dwelling wants a tract held by the
      same family since 1974. Those are the criteria a single house has to
      clear here, and none of them is encoded, because they cannot make a
      detached dwelling into an attached one.
  EFU:
    section: ["39.efu"]
    cite_default:
      cite: MCC 39.4215 (Uses), 39.4225(D) (Review Uses), 39.4265(C)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # The one resource district in this corpus that prints this building.
      #
      # The base is the ordinary reading. 39.4215 closes the list. The
      # residential entries are all farm-attached: a farm help dwelling for a
      # relative (39.4225(B)), a dwelling customarily provided in conjunction
      # with a farm use (C), accessory farm dwellings (D), a heritage tract
      # dwelling (E). Read at that level, every one of them is a house.
      #
      # 39.4265(C)(2)(d) is where it stops being a house. An accessory farm
      # dwelling on a lot without the primary farm dwelling may be "limited to
      # only attached multi-unit residential structures allowed by the
      # applicable state building code or similar types of farm labor housing"
      # registered with Oregon OSHA under ORS 658.750. That is the pod's form,
      # named, in a zone with an 80-acre minimum lot.
      #
      # So the variant is real and it is expensive: it needs the farm, the
      # primary dwelling on the tract, farm-worker occupancy, and removal or
      # conversion when the housing is no longer required. `review_use`
      # carries the county's procedure, `farm_labor_housing` carries the
      # commitment. Neither is assumed and the base stays false, which is the
      # right answer for an acquisition screen -- but recording the door is
      # the difference between a zone that refuses and a zone nobody read.
      value: false
      quote: "or/multnomah/_unincorporated/39.efu.txt#L175-L186,L621-L633"
      variants:
        - value: true
          when: [farm_labor_housing, review_use]
          cite: MCC 39.4225(D) and 39.4265(C)(2)(d)
          quote: "or/multnomah/_unincorporated/39.efu.txt#L628-L633,L2179-L2198"
    max_height_ft:
      # 39.4245(C), printed under the yard row: "Maximum Structure Height - 35
      # feet." Paragraph (E) lets barns, silos, windmills, antennae and
      # chimneys exceed it when they stand 30 feet off every property line.
      # None of those is a dwelling, so no variant carries the exception --
      # the same reading the Rural Residential zone in this layer takes of the
      # same sentence.
      value: 35
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352,L1356"
    setback_front_ft:
      # One printed row -- "Front Side Street Side Rear / 30 10 30 30" -- and
      # all four columns come off it together, because a row read one column
      # at a time is how a setback gets attributed to the wrong lot line.
      value: 30
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352-L1354"
    setback_side_ft:
      value: 10
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352-L1354"
    setback_street_side_ft:
      value: 30
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352-L1354"
    setback_rear_ft:
      value: 30
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352-L1354"
    min_frontage_ft:
      value: 50
      cite: MCC 39.4245(C)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1352,L1358"
    min_lot_sqft:
      # 80 acres, from 39.4245(A). The file states the acreage and the loader
      # multiplies, because 3,484,800 square feet appears in this article
      # nowhere -- the same bargain LR-7's "5,000 square feet for each
      # dwelling unit" strikes two zones down.
      #
      # The reservation is in the words "for new parcels". This is a land
      # DIVISION floor and the county files it under "Dimensional Requirements
      # and Development Standards", which is why it is encoded here -- but an
      # EFU lot of record smaller than 80 acres is not thereby barred from
      # developing, and 39.4250 states the exceptions. So this number reads
      # RED on a 20-acre farm that could in principle host the one use this
      # zone opens to the pod. That is a false red on a handful of the 13 lots
      # in this layer, and it is the direction taken deliberately: the use
      # path here needs a working farm with a primary dwelling already on the
      # tract, and a screen that reported those lots green would be inviting
      # somebody to underwrite farm labor housing as market housing.
      acres: 80
      cite: MCC 39.4245(A)
      quote: "or/multnomah/_unincorporated/39.efu.txt#L1339-L1345"
    notes: >-
      The dimensions are encoded here and on none of the other three resource
      zones, because this is the only one of the four with a use path that
      reaches the pod at all. A zone whose use list closes needs no envelope;
      a zone with a door needs the room behind it measured.


      39.4240 attaches a condition of approval to every single family dwelling
      in this zone -- the landowner records a deed document waiving any claim
      alleging injury from farming or forest practices. It binds successors.
      It is not a dimensional standard and nothing here holds it, but anybody
      who reaches this zone with a real deal should know the waiver exists.
  MUF19:
    section: ["39.muf"]
    cite_default:
      cite: MCC 39.4702 (Uses), 39.4705(E), 39.4707(A), 39.4710(C)
      url: https://multco.us/file/chapter_39_-_zoning_code/download
      retrieved: '2026-08-20'
    quadplex_allowed:
      # Three doors into residential use in this zone and all three are the
      # same door. 39.4705(E) allows "a single-family dwelling including a
      # mobile or modular home, on a lot of 38 acres or more". 39.4707(A)
      # allows one in conjunction with a primary forest use on ten acres or
      # more. 39.4710(C) allows one NOT in conjunction with a primary use, as
      # a conditional use, on land found incapable of sustaining a farm or
      # forest use. Different acreages, different procedures, one building
      # type.
      #
      # 39.4702 is the closure that makes the absence readable. Nothing in the
      # article is attached, multi-unit or middle housing, and 39.4732 -- the
      # residential development standards these dwellings answer to -- asks
      # for a minimum floor area of 600 square feet and a foundation, which
      # are a house's standards.
      value: false
      quote: "or/multnomah/_unincorporated/39.muf.txt#L22-L28,L54-L58,L69-L72,L231-L235"
    notes: >-
      39.4732 is worth a line even though it changes nothing here. It sites
      the dwelling for fire protection -- as close to an existing road as
      practicable, clustered where more than one is allowed, outside a big
      game habitat area unless ODFW certifies the impact. Those are siting
      rules a geometry layer could hold one day; they sit on a zone that
      refuses the building, so today they are a note.
