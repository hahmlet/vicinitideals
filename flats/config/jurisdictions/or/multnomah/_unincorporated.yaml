      PLACEMENT STANDARDS AND BOTH ARE INERT FOR A REAR COURT. C.1.a prohibits vehicle area
      between the primary structure and the street, and its second exception expressly permits
      "driveways to parking spaces located entirely behind the front and side street building
      lines" -- which is the pod's court and the drive that reaches it, so the prohibition allows
      exactly what we build. Note the exception BELOW it does not help us and could have been
      misread as if it did: "this standard does not apply to houses on lots that are at least 32
      feet wide" says houses, and a fourplex is not one. C.1.b then caps vehicle area at 40
      percent of the land area between the front lot line and the front building line, 20 percent
      in the side street strip of a corner lot. That one deserves the arithmetic rather than a
      shrug, because it reads like a real constraint on a drive crossing the front yard. It is
      not, and the reason is that the depth of the strip cancels: the strip is lot width times
      setback depth and the drive is drive width times the same depth, so the rule reduces to
      DRIVE WIDTH NOT MORE THAN 40 PERCENT OF LOT WIDTH. A lot that fits this pod at all is at
      least the pod's 56 feet plus two side setbacks plus the drive -- about 86 feet -- and 40
      percent of 86 is 34, against a drive of 20 including the aisle width this project rules must
      be carried. It never binds. Written down because that clearance is arithmetic and not a
      scope argument, so it would change if the pod or the aisle ruling changed. Also on the page:
      C.2.a keeps parking spaces out of the first 10 feet from the front lot line, inert for the
      same rear-court reason; C.3 sends all parking and access to the alley where the lot abuts
      one, which is the alley site fact this project already holds as unmeasured and which relaxes
      rather than tightens; and C.4 sends garages to the base zone's garage setback, which the
      standing ruling that this pod has no garage closes.
