          when: [planned_development]
          cite: MCC 39.4370(B)(8) with MCC 39.5350(A)
          quote: "or/multnomah/_unincorporated/39.pd.txt#L257-L262"
    max_height_ft:
      # MCC 39.4375: "Maximum Structure Height - 35 feet", printed directly
      # under the minimum yard table.
      #
      # Paragraph (E) lets "barns, silos, windmills, antennae, chimneys, or
      # similar structures" exceed it when they stand 30 feet off every
      # property line. None of those is a dwelling, so it does not reach the
      # pod and no variant carries it.
      value: 35
      cite: MCC 39.4375 Dimensional Requirements
      quote: "or/multnomah/_unincorporated/39.rural-residential.txt#L450,L454"
    min_lot_sqft:
      # 39.4375(A) states two minimums in one sentence and a distance decides
      # which: five acres for new parcels, or, "for properties within one mile
      # of the Urban Growth Boundary", whatever OAR Chapter 660 Division 004
      # currently requires -- "20 acre minimum as of October 4, 2000".
      #
      # Nothing here measures distance to the UGB, so the base is the twenty
      # and the five is the variant. That is the strict direction, and it is
      # the right one twice over: the zone note below says RR sits
      # overwhelmingly outside the Metro UGB, which is not the same claim as
      # being a mile from it, and a lot that is near the boundary is exactly
      # the lot somebody would want to build four units on.
      acres: 20
      cite: MCC 39.4375(A)
      quote: "or/multnomah/_unincorporated/39.rural-residential.txt#L440-L445"
      variants:
        - acres: 5
          when: [beyond_ugb_mile]
          cite: MCC 39.4375(A)
          quote: "or/multnomah/_unincorporated/39.rural-residential.txt#L437-L440"
        # Under a Planned Development the minimum becomes the divisor rather
        # than the floor: 39.5340(A) sets the units a site may hold by dividing
        # it by "the minimum lot area per dwelling unit required by the
        # underlying district". Twenty acres each, four dwellings, eighty acres
        # of site -- and eighty is a figure no article in this chapter prints.
        - acres_per_dwelling: 20
          when: [planned_development]
          cite: MCC 39.4375(A) with MCC 39.5340(A)
          quote: "or/multnomah/_unincorporated/39.rural-residential.txt#L440-L445"
        - acres_per_dwelling: 5
          when: [planned_development, beyond_ugb_mile]
          cite: MCC 39.4375(A) with MCC 39.5340(A)
          quote: "or/multnomah/_unincorporated/39.rural-residential.txt#L437-L440"
    setback_front_ft:
      # "Front Side Street Side Rear / 30 10 30 30" -- the row EFU, MUA-20, OR
      # and this zone all print, read across rather than down.
      value: 30
      cite: MCC 39.4375(C)
      quote: "or/multnomah/_unincorporated/39.rural-residential.txt#L450-L452"
    setback_side_ft:
      value: 10
      cite: MCC 39.4375(C)
      quote: "or/multnomah/_unincorporated/39.rural-residential.txt#L450-L452"
    setback_street_side_ft:
      value: 30
      cite: MCC 39.4375(C)
      quote: "or/multnomah/_unincorporated/39.rural-residential.txt#L450-L452"
    setback_rear_ft:
      value: 30
      cite: MCC 39.4375(C)
      quote: "or/multnomah/_unincorporated/39.rural-residential.txt#L450-L452"
    min_frontage_ft:
      value: 50
      cite: MCC 39.4375(C)
      quote: "or/multnomah/_unincorporated/39.rural-residential.txt#L450,L455"
    notes: >-
      quadfit confidence: verified. County RURAL zone, overwhelmingly outside
      the Metro UGB. Any RR parcel inside the UGB needs individual review.


      The use flag was this layer's one unquoted value until 2026-08-19, on the
      ground that MCC 39.4350-.4395 was not a stored document and quoting a
      false from a document that does not state it is worse than leaving the
      debt visible. The article is now sliced out of the same chapter PDF the
      LR-7 slice comes from, and the flag is quoted from the sentence that
      closes the use list.


      THE PLANNED DEVELOPMENT DOOR opened on 2026-08-20, and it was open the
      whole time. The comment above the use flag used to end "a planned
      development for SINGLE FAMILY residences" and treat that as a refusal.
      MCC 39.5350(A) says the housing types a residential PD may hold are
      "duplexes and single family detached or attached dwellings", so single
      family residences is not the narrowing it looked like -- attached is a
      single family form and it is the form this building takes. The same
      correction reaches Orient Rural Center Residential, which lists the PD
      without any narrowing at all.


      What the door costs is the point. A PD is a Planning Commission decision
      on a preliminary and then a final development plan; 39.5320 lets the PD's
      own standards displace the base zone's wherever they conflict, so every
      dimension above is negotiable and none of the replacements is printed;
      and 39.5340(A) turns the base zone minimum into a per-dwelling divisor,
      which is why four units want eighty acres here and only four in OR. The
      OAR Chapter 660 Division 004 planned unit development standards apply as
      well and are not a stored document.


      MUA-20 lists the same entry and is deliberately NOT encoded this way.
      39.5350 opens "In a residential zone", Multiple Use Agriculture is not
      one, and no other sentence in the chapter names an attached dwelling for
      an agricultural zone -- so the housing types a MUA-20 planned development
      may hold are unstated rather than permissive. That reading is the widest
      remaining doubt in this layer and it is a reading, not a quote.
