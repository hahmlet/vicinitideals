    value: 9
    cite: PCC 33.266.120.D.2, minimum driveway width on private property
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L1,L3-L6,L37-L39"
  driveway_min_width_two_way_ft:
    value: 9
    cite: PCC 33.266.120.D.2, minimum driveway width on private property
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L1,L3-L6,L37-L39"
  # 33.266.120.C.1.a: "Vehicle area is prohibited between the primary
  # structure and the street except as follows. This standard does not apply
  # to houses on lots that are at least 32 feet wide: (1) Parking spaces
  # located entirely behind the front and side street building lines of a
  # primary structure are allowed; and (2) Driveways to parking spaces located
  # entirely behind the front and side street building lines of a primary
  # structure are allowed."
  #
  # The 32-foot escape is for HOUSES. A fourplex does not get it however wide
  # the lot, so the prohibition binds on every lot this screen looks at in
  # Portland. What survives it is exactly the arrangement the site plan draws:
  # stalls behind the front building line, reached by a driveway that is
  # allowed to cross the front yard to get to them. A front-yard court is not
  # available here at any width, which is a harder rule than the 50-percent
  # caps Fairview, Wilsonville, Milwaukie and Oregon City state.
  parking_front_prohibited:
    value: true
    cite: PCC 33.266.120.C.1.a, vehicle area prohibited between the primary structure and the street
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L10-L14,L17-L19"
  # 33.266.120.C.1.b: "No more than 40 percent of the land area between the
  # front lot line and the front building line may be paved or used for
  # vehicle areas." The driveway allowed through by C.1.a is what this
  # measures, so the two rules work as a pair: the court goes behind the
  # building and the drive that reaches it may pave up to two fifths of the
  # ground in front of it.
  #
  # The corner half of the same subparagraph, 20 percent between the side
  # street lot line and the side street building line, is
  # `parking_side_street_yard_max_pct` below (FOLLOWUPS 6(b), 2026-11-09).
  # NOT ENCODED: the flag-lot exception allowing "at least a 12-foot wide
  # vehicle area", which is a lot shape nothing measures and only loosens.
  parking_front_yard_max_pct:
    value: 40
    cite: PCC 33.266.120.C.1.b, share of the land between front lot line and front building line usable as vehicle area
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L20-L24"
  # 33.266.120.C.1.b, second sentence: "On corner lots, no more than 20
  # percent of the land area between the side street lot line and the side
  # street building line may be paved or used for vehicle areas." A corner
  # lot's court is fed off the side street here (`corner_access_street`
  # any), so its drive crosses that strip: 20 ft of drive needs 100 ft of
  # side street. Which street is the side street is not recorded, so a
  # drive that fits the shortest street passes, one too wide for the
  # longest fails, and one between is left a question. Stored as printed.
  parking_side_street_yard_max_pct:
    value: 20
    cite: PCC 33.266.120.C.1.b, on corner lots the share of the land between the side street lot line and the side street building line usable as vehicle area
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L20-L23"
  # 33.266.120.C.2 (C.2.a before the 11/1/26 reprint, RICAP 11): "Except as
  # follows, parking spaces are not allowed within the first 10 feet from a
  # front lot line, and on corner lots, parking spaces are not allowed within
  # the side street setback". Stated of SPACES, where C.1 is stated of vehicle
  # area, so a driveway may run through the first ten feet and a stall may not
  # stand in it.
  #
  # The three exceptions at C.2.a-c are not encoded and none could help: a
  # space in a driveway BEHIND a conforming space is tandem parking, which
  # this design does not use, the common-green case is a plat condition
  # nothing measures, and C.2.c (new in the reprint) is a space behind an
  # existing garage being converted to living space; the pod builds new.
  parking_street_setback_ft:
    value: 10
    cite: PCC 33.266.120.C.2, parking spaces not allowed within the first 10 feet from a front lot line
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L25-L26"
  # 33.266.120.C.3: "Vehicle area access. If the lot abuts an alley, all
  # parking and vehicle access to the site must be from the alley." Held as
  # a refusal from 2026-08-27 to 2026-09-13 because no parcel record knew
  # where the alleys were; quadfit's s4 has measured them since 2026-09-12
  # and `abuts_alley` is filled from it, so the sentence is a value now. Read
  # on a lot only under `abuts_alley`; the site plan's mirror of it is
  # `alley_access_required` on the Portland row of footprints.yaml, pinned
  # to this by test_parking_geometry.
  parking_alley_access_required:
    value: true
    cite: PCC 33.266.120.C.3, all parking and vehicle access from the alley where the lot abuts one
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L33-L34"
  # THE ALLEY AS THE AISLE. On a lot C.3 sends to the alley, the cars in the
  # row of stalls along it back straight out into it, so the court is a stall
  # depth plus whatever the alley's MEASURED width leaves short of the room a
  # car needs, not a stall and a 24 ft aisle. 33.266.120 gives the fourplex a
  # 9 x 18 stall and states no aisle and no forward-motion rule; the nearest
  # sentence is the all-other-development chapter's 33.266.130.F.1.b(2): 20
  # ft of manoeuvring "between the end of each parking space and the opposite
  # side of the alley", some of it on-site where the alley is narrower. This
  # value is STEPH'S RULING of 2026-09-13 applying that sentence to the pod,
  # the same ruling quadfit's s6s has drawn since that day (`alley_is_aisle`,
  # `alley_backout_ft: 20` on the Portland footprints row, pinned by
  # test_parking_geometry).
  parking_alley_backout_ft:
    value: 20
    cite: PCC 33.266.130.F.1.b(2), 20 ft of maneuvering from the end of each space to the opposite side of the alley, applied to the fourplex by Steph's ruling 2026-09-13
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.130.txt#L99-L101"
  # WHERE THE PARKING MAY SIT, THE SIDE HALF. `parking_side_prohibited` is the
  # townhouse-branch sentence "No off-street parking shall be allowed in the
  # front yard or side yard of a townhouse", held apart from
  # `parking_front_prohibited` because the two bans reach different ground: a
  # front ban leaves a court beside the building on a wide lot, a side ban
  # does not. The fit reads this prohibition before applying the side-yard
  # reach fields below; it does not change the rear-court layout.
  #
  # 33.266.120.C.1.a(1): "Parking spaces located entirely behind the front and
  # side street building lines of a primary structure are allowed" -- the
  # interior side yard is open, so no side ban. What the sentence DOES say
  # about a corner lot belongs to the drawing: the court must sit behind the
  # side-street building line as well as the front one, and C.1.b caps paving
  # between the side street lot line and that building line at 20 percent.
  # `parking_front_prohibited` already carries the sentence; the site plan
  # does not yet clip the court to the side-street building line on a corner
  # lot (FOLLOWUPS 5).
  parking_side_prohibited:
    exempt: true
    cite: PCC 33.266.120.C.1.a(1), parking spaces behind the front and side street building lines allowed, which leaves the interior side yard open
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L17-L19"
  parking_side_yard_allowed:
    value: lane_and_court
    cite: PCC 33.266.120.C.1.a(1), parking spaces and driveways behind the front and side street building lines are allowed
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L17-L19"
  parking_side_yard_stated:
    value: lane_and_court
    cite: PCC 33.266.120.C.1.a(1), parking spaces and driveways behind the front and side street building lines are allowed
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L17-L19,L26-L27"
  # WHICH STREET THE DRIVEWAY USES on a lot with more than one.
  # `corner_access_street` is read only on such a lot: `side` sends the curb
  # cut to the street the building does not face, `lowest_class` to the street
  # with the lowest functional classification (which nothing measures yet, so
  # a drawing treats it as `any` and says so), `any` names none.
  #
  # C.3 sends everything to the alley where the lot abuts one, and Portland
  # otherwise names no street (whole-document grep of the Portland folder for
  # lowest or lower classification and for corner-lot access, 2026-09-19:
  # nothing). `any`, read after `parking_alley_access_required`.
  corner_access_street:
    value: any
    cite: PCC 33.266.120.C.3, access from the alley where the lot abuts one, and no street named otherwise
    url: https://www.portland.gov/sites/default/files/code/266-parking_2.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L33-L34"
  # WHICH STREET IS THE FRONT on a corner lot. `front_lot_line_corner` is what
  # lets the site plan know whether it may try each street as the front: only
  # `shortest` takes the choice away; `owner`, `entrance` and `both` leave it
  # to the plan, and Steph's ruling of 2026-09-19 (HUMAN_TODO 21: green, then
  # the preferred stall band, then the court least exposed to a street) says
  # how to choose.
  #
  # 33.910, Front Lot Line: "On a corner lot, the front lot line is the
  # shortest of the lot lines that abut a street." The owner chooses only when
  # two are of equal length; a through lot has two front lot lines. Fixed by
  # the plat.
  front_lot_line_corner:
    value: shortest
    cite: PCC 33.910, Front Lot Line, the shortest street lot line on a corner lot
    url: https://www.portland.gov/sites/default/files/code/910-definitions_0.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.910/33.910.030.txt#L541-L546"
  # WHICH STREET IS THE FRONT on a THROUGH lot -- streets along two opposite
  # lines (FOLLOWUPS 6(i), read 2026-09-29 across all fourteen layers). Every
  # street edge is cut as a front unless this names the far one the rear.
  #
  # 33.910, Front Lot Line: "However, a through lot has two front lot lines
  # regardless of whether the street lot lines are of equal or unequal
  # length." No exception.
  front_lot_line_through:
    value: both
    cite: PCC 33.910, Front Lot Line, a through lot has two front lot lines
    url: https://www.portland.gov/sites/default/files/code/910-definitions_0.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.910/33.910.030.txt#L543-L546"
  #
  # NOT ENCODED: 33.266.120.C.4, parking in garages takes the garage setback
  # of the base zone. `setback_garage_entrance_ft` already carries that figure
  # per zone; this design has no garage.
  #
  # NOT ENCODED: Portland states no maximum driveway approach width and no
  # share-of-frontage cap for this building. 33.266.120 caps the vehicle AREA
  # in front of the building and says nothing about the curb cut, and Title 17
  # -- the public works title, where an approach standard would live -- is not
  # in this corpus. Left absent rather than exempt: this is a document that
  # has not been read, not a code that has been read and states nothing.

