      # The tighter half of a split cell, on purpose. Table 120-4's RM4 column
      # prints "FAR of 4 to 1 or 3 to 1" (L515-L516) and 33.120.210.B says
      # which is which: "In the RM4 zone the maximum FAR is 4 to 1, except in
      # Historic Districts and Conservation Districts, where the maximum FAR
      # is 3 to 1." So 3 is the exception, and holding it as the base screens
      # every RM4 lot as though it were inside one of those districts.
