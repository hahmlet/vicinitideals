      down to 25 ft on Map 510-3, 33.510.200.C.3, 210.B) and Marquam Hill
      (heights above sea level on Map 555-2, 33.555.230; none green). RM4,
      RX, CX and EX join the zones because Gateway, Northwest and Central
      City greens stand in them.
      pd2c (2026-11-04) cut the Gateway and East Corridor minimum-FAR areas
      out of the hold, now that the figures are read (gateway_min_far,
      east_corridor_min_far_half and _one), and put back whole the lots
      inside them that a traced rule still holds: Gateway by the batch B
      rule on run 113; East Corridor wider than batch A (two or more street
      faces of any angle, or within 100 ft of the E Burnside centreline),
