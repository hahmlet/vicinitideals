  # NOT ENCODED: an aisle width, because Portland states none for this building.
  # Section 33.266.120 is five subsections -- purpose, structures, locations,
  # space sizes, paving -- and the word "aisle" does not occur in any of them,
  # nor does a pointer to Table 266-4. The table lives in 33.266.130, whose own
  # applicability sentence excludes "residential vehicle areas subject to the
  # standards of 33.266.120".
  #
  # Twenty feet, one way and two way alike, is what 266-4 prints at 90 degrees.
  # It is not borrowed. A number the code excepts this building from is not a
  # clear and objective standard applicable to it (ORS 197A.400), which is the
  # same ground Milwaukie's 22-foot table was refused on -- and refusing the
  # city's own narrower figure costs lots rather than saving them, which is how
  # you can tell it is a reading and not a convenience.
  # (or/multnomah/portland/33.266.txt#L268,L317-L326,L349,L385-L386,L516-L525)
  # DRIVEWAY AND PARKING PLACEMENT, read 2026-08-27. All of it is Section
  # 33.266.120, and 33.266.120.B is why it is in `defaults` rather than in the
  # zones: "The regulations of this section apply to houses, attached houses,
  # duplexes, attached duplexes, triplexes, fourplexes, manufactured homes,
  # and houseboats." That is a test on the STRUCTURE, not on the zone, so it
  # reaches this pod in every zone that allows it -- the six single-dwelling
  # zones, the four multi-dwelling ones and the commercial ones alike.
  #
  # The carve-out at B.1 is already ruled in this file and is the reason the
  # stall geometry above is .120's and not Table 266-4's: parking in a parking
  # TRACT goes to 33.266.130 instead. A rear court on the same lot as the
  # building is not a tract.
  #
  # 33.266.120.D.2: "The minimum driveway width on private property is 9
  # feet." One figure for both directions -- Portland does not distinguish --
  # so both fields carry it, and it is the narrowest driveway minimum in the
  # corpus. Happy Valley asks 20 for the same two-way drive.
  driveway_min_width_one_way_ft:
    value: 9
    cite: PCC 33.266.120.D.2, minimum driveway width on private property
    url: https://www.portland.gov/sites/default/files/code/266-parking_3.pdf
    retrieved: '2026-08-27'
    quote: "or/multnomah/portland/33.266.txt#L268,L271-L274,L317-L319"
  driveway_min_width_two_way_ft:
