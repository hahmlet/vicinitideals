    notes: 'Employment. Table 140-1 shows Household Living as "L [1]", and regulation [1] allows it in one circumstance only -- an existing hotel or motel converted to dwelling units, all of them affordable at 60 percent of area median income under a 30-year covenant -- and then says so in the negative: "Except as specified in Subparagraph B.1.a, Household Living and Group Living use are prohibited." New construction of a pod is not that circumstance. Encoded as a settled false rather than as a conditional use, because the condition is a building that already exists and a covenant, not a review anyone could apply for.'
