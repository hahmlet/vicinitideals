      - [5000, 2250, 15]
      - [20000, 4500, 7.5]
      quote: "or/multnomah/portland/33.110/33.110.225.txt#L9-L10,L12-L16"
      via: "or/multnomah/portland/33.110/33.110.205.txt#L15,L45-L47"
    notes: 'quadfit confidence: verified | Fourplex min lot 12,000 sf (Table 110-7; -10% adjustment allowed until
      2032). No FAR cap on conforming lots (FAR applies only <10,000 sf in R20). Height 30 ft.'
    setback_garage_entrance_ft:
      # 33.110.220.D.9 (D, "Exceptions to the required setbacks"; the note of
