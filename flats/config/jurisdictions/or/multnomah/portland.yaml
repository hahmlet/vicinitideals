    setback_front_max_streets:
      # The row heading is the whole condition, and neither fact is held.
      value: conditional
      quote: "or/multnomah/portland/33.150.txt#L552-L553"
    setback_side_ft:
      # Three rows, one question, and the answer is the neighbour's zoning.
      # 10 ft from a lot line abutting or across the street from an OS,
      # RF-R2.5, RM1-RMP or IR zoned lot; 0 from one abutting a C, CI, E or I
      # zoned lot. The relief set is narrower than the commercial chapter's
      # -- open space buys nothing here -- but the fact is the same unheld
      # one, so the 10 binds either way.
      value: 10
      quote: "or/multnomah/portland/33.150.txt#L537,L546-L549"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.150.txt#L537,L550-L551"
    setback_rear_ft:
      value: 10
      quote: "or/multnomah/portland/33.150.txt#L537,L546-L549"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.150.txt#L537,L550-L551"
    max_height_ft:
      value: 150
      quote: "or/multnomah/portland/33.150.txt#L537,L542-L543"
    max_far:
      value: 3.0
      quote: "or/multnomah/portland/33.150.txt#L537,L538-L539"
    max_coverage_pct:
      value: 85
      quote: "or/multnomah/portland/33.150.txt#L537,L554-L555"
    min_landscaped_pct:
      value: 15
      quote: "or/multnomah/portland/33.150.txt#L537,L558-L559"
    notes: 'Campus Institutional 2. Household Living is a plain Y and there is no minimum lot size of any kind, which makes this 245-lot zone as open on paper as the commercial ones. Height is 150 ft against a 26 ft pod. What is left is the neighbour test at 10 ft and a maximum street setback of 10 ft. NOT ENCODED, on purpose. (1) Note [4]: heights are reduced adjacent to certain zones under 33.150.210.C, and every reduction in that subsection lands at 30 ft or above, so none of them reaches a 26 ft pod. (2) Maps 150-1 through 150-5 supersede both the height and the setback rows of Table 150-2 for the sites they cover; that is a mapped standard this screen does not read, and it is the one thing here that could make a CI2 lot tighter than this file says. (3) The inclusionary housing bonus raises FAR from 3 to 3.75 and is earned.'
    min_far:
      # PCC 33.526.220.C (Gateway) and 33.521.220.C (East Corridor): the
      # minimum FAR for new development is shown on Map 526-3 and Map 521-3,
      # and each map prints it only as the bracketed figure under the 4:1
      # maximum -- (.25:1) in Gateway, (.5:1) and (1:1) in East Corridor.
      # The chapters' text carries no number and the map pages have no text
      # layer, so the variants are drawn figures, read off the 11/1/26 sheets
      # (FOLLOWUPS 109 pd2c). Which lot is in which area is the City's own
      # layer 50 (gateway-min-far, east-corridor-min-far-half/-one), matched
      # to the sheets; a lot the line cuts is unanswered and YELLOW.
      # Outside the mapped areas this zone states no minimum FAR (whole-corpus
      # grep, 2026-11-04: only plan districts and 33.415 do). The other plan
      # district minimums ride the pdx_plan_district_unmeasured hold and the
      # 33.415 Main Street minimum is pdx_overlays.py's, so none rests on this
      # exemption. A miss is YELLOW with the FAR-MIN flag (SOFT_FLOOR_CHECKS,
      # coordinator 2026-10-29): a bigger building could meet it.
      exempt: true
      quote: "or/multnomah/portland/33.526.txt#L179-L180"
      variants:
        - value: 0.25
          when: [pdx_gateway_min_far]
          cite: PCC 33.526.220.C; Map 526-3 Floor Area Ratios, "4:1 (.25:1)"
          url: https://www.portland.gov/sites/default/files/code/526-gateway-pd_2.pdf
          retrieved: '2026-11-04'
          # A drawn figure has no text to quote: the base's quote is not this figure's.
          quote: null
          drawn: true
          read_by: flats-encoder pd2c (Opus)
          read_on: '2026-11-04'
