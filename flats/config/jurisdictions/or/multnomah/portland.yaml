    notes: 'Table 120-4 prints FAR as "4 to 1 or 3 to 1" and base height as "75/100 ft.". 33.120.210.B gives 4 to 1 except in Historic and Conservation Districts, where it is 3 to 1; 33.120.215.B.1 gives a base height of 75 ft, raised to 100 within 500 ft of a 20-minute transit street or 1,000 ft of a transit station. Both encode the tighter half. Neither binds a two-storey pod, so neither is worth a condition until something downstream reads them. Table 120-4 prints side and rear as "5/10 ft.". 33.120.220.B.1 splits it by height: 5 ft for a building up to 55 ft tall, 10 ft above that from a line that is not a street lot line. 10 is the base and 5 is a variant on `low_rise`, so a design that has not stated its height gets the deeper number. A side or rear line that IS a street lot line stays 5 ft in both cases, which is what setback_street_side_ft holds. Garage entrance is a two-band rule rather than a minimum: 33.120.220.E.1.a allows 5 ft or closer OR 18 ft or farther and forbids everything between. 18 is encoded because it is the band that is always available; the near band additionally requires the entrance to sit no closer to the lot line than the residential facade, which is a maximum-shaped standard this field cannot hold. NOT ENCODED, on purpose. Minimum density is now encoded: Table 120-4 states it as an area per unit and `sqft_per_unit` carries that figure, so what is checked against the table is the printed operand and not the units-per-acre quotient nothing prints. The comparison is continuous rather than rounded, which is the conservative reading of a floor -- it never asks for fewer units than the ratio does. Three reliefs in 33.120.213.B are declined, and each lowers a floor: two units off when adding to an existing residential building, the Table 120-7 tree-preservation reduction, and the subtraction of Environmental-zone land from the site area. Group living is exempt and the pod is not group living. NOT ENCODED, on purpose. (1) Maximum front setback: Table 120-4 states one (#L549-L551) but 33.120.220.C.1 applies it only on a transit street or in a Pedestrian District, and a Value carries no condition on its base -- encoding it would bind every lot in the zone to a standard most of them never see. ENCODED 2026-11-01 (FOLLOWUPS 68), both on the City''s own maps: the minimum site frontage of 33.120.206 (#L491-L495; 90 ft on one street for a site more than 160 ft deep on Map 120-2, a short lot held for the unread neighbour exception) and the Eastern Pattern Area rear setback of 33.120.220.B.2 (25 percent of the site depth on Map 120-3, half of it at most vehicle area; corner lots and lots up to 100 ft deep exempt).'
