  # Portland requires no off-street parking anywhere in the city. The chapter
  # is the evidence: it runs from 33.266.100 straight to 33.266.115 Maximum
  # Allowed Parking Spaces with no minimum section between them, and
  # 33.266.110.A regulates carpool and EV spaces only "when parking spaces are
  # provided" -- language that presupposes providing none is allowed. The
  # state's 1 stall/unit ceiling caps what a city MAY require and does not
  # oblige it to require anything, so this passes through it.
  #
  # Four stalls is about 1,300 sq ft of a site that has to hold the pod, its
  # parking and its access. On the narrow lots this screen exists to find, that
  # is routinely the difference between fitting and not, which is why it is
  # worth citing an absence carefully rather than leaving the state ceiling to
  # stand in for a rule Portland does not have.
  # And no maximum either, in most of the city -- but not in all of it, which
  # is the half that had no field to be written in until now. Table 266-1
  # sends OS, R, C, CI, EG, I and IR to Standard B; Standard B's Household
  # Living cell opens "No maximum", and the exception it then states reaches
  # only commercial/mixed use and multi-dwelling zones. Those twelve zones and
  # EX carry their own number; this is what the other fifteen inherit.
  parking_max_per_unit:
    exempt: true
    cite: PCC 33.266.115; Tables 266-1 and 266-2
    url: "https://www.portland.gov/sites/default/files/code/266-parking_2.pdf"
    retrieved: 2026-08-21
    quote: "or/multnomah/portland/33.266/33.266.115.txt#L26,L38-L40,L42,L44"
  parking_min_per_unit:
    # Not a minimum of zero -- there is no minimum. The quote is the chapter's
    # own list of its motor vehicle parking sections, which runs General
    # Regulations, Required Carpool and Electric Vehicle Parking, Maximum
    # Allowed Parking Spaces, and three development-standard sections, with
    # nothing that requires a space. An absence is what the code states here,
    # so an absence is what is encoded.
    exempt: true
    cite: "PCC 33.266 — the chapter's own section list: no minimum-parking section exists between 33.266.100 General Regulations and 33.266.115 Maximum Allowed Parking Spaces"
    url: "https://www.portland.gov/sites/default/files/code/266-parking_2.pdf"
    retrieved: 2026-08-15
    status: draft
    quote: "or/multnomah/portland/33.266.txt#L10-L17"

  # How big a stall is. Portland prints two answers and one sentence deciding
  # between them, and the sentence is easy to walk past.
  #
  # 33.266.120 is titled for this building -- houses, attached houses,
  # duplexes, triplexes, fourplexes -- and D.1 states a 9 x 18 stall and a 9 ft
  # private driveway, with no aisle anywhere in the section. That reads like
  # the whole answer until 33.266.120.B.1: "Parking that is in a parking tract
  # is subject to the standards of Section 33.266.130 instead of the standards
  # of this section." 33.266.130.B agrees from its own side, excluding only
  # "residential vehicle areas subject to the standards of 33.266.120". The two
  # do not overlap and they do not contradict; the plat decides which applies.
  #
  # A tract (33.910) is "a piece of land created and designated as part of a
  # land division that is not a lot, adjusted lot, lot remnant, lot of record,
  # or a public right-of-way". A shared rear court serving four attached houses
  # on fee-simple lots is one. A rear court on the SAME LOT as the building it
  # serves is not one -- it is on a lot, which the definition excludes by name.
  #
  # WHICH BRANCH, RE-READ 2026-09-01, AND THE ANSWER REVERSED. This file stood
  # on Table 266-4 from 2026-08-25 with the reasoning above, and the reasoning
  # describes a product this screen does not model. `plat: one_lot` is what the
  # site plan draws and a SiteplanSpec validator refuses to move off it; on that
  # path there is no land division, so there is no tract, so 33.266.120 applies
  # to "all parking areas" of this fourplex and Table 266-4 is expressly not
  # reached. The paragraph that justified the old choice said so itself --
  # "where the plat is not yet drawn" -- and the plat is drawn.
  #
  # The old note also called 266-4 the deeper court: 8.5 x 16 with a 20 ft aisle
  # is 36 feet against "four 9 x 18 stalls off a 9 ft driveway", 27. That
  # comparison is what made the wrong branch look conservative, and it holds
  # only if a court of eight stalls can be served by a 9-foot driveway with no
  # aisle at all. It cannot. Under 120.D.1's own rectangle and an aisle nobody
  # published, the honest court is 18 + 24 = 42 feet -- deeper than either.
  #
  # This is the Milwaukie shape exactly. A city prints an aisle table, excepts
  # this building from it by name, and dimensions nothing in its place; the
  # excepted table may not be borrowed back (see the Milwaukie 19.606 refusal),
  # and the aisle is assumed to the national engineering floor in quadfit rather
  # than encoded here. What the code states for this building is a rectangle and
  # a driveway, and that is what this layer now holds.
  parking_stall_width_ft:
    value: 9
    cite: PCC 33.266.120.D.1, "A parking space must be at least 9 feet by 18 feet"
    url: "https://www.portland.gov/sites/default/files/code/266-parking_2.pdf"
    retrieved: '2026-09-01'
    quote: "or/multnomah/portland/33.266/33.266.120.txt#L1,L3-L8,L37-L38"
    variants:
      # The other branch, kept because it is real and one plat decision away.
