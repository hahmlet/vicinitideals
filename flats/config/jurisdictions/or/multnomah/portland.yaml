    notes: 'Manufactured Dwelling Park. Table 120-2 is the whole answer here: fourplex is the one "No" in the row, so the pod is barred whatever the lot looks like. The dimensional standards are encoded anyway, so the zone reads as decided rather than as unread and a future product that is not a fourplex already has them. No FAR: 33.120.210.B states floor area ratio is not applicable in RMP. RMP is also the one multi-dwelling zone carrying a MAXIMUM density -- 1 unit per 1,500 sq ft, #L519-L521. NOT ENCODED, on purpose. Minimum density is now encoded: Table 120-4 states it as an area per unit and `sqft_per_unit` carries that figure, so what is checked against the table is the printed operand and not the units-per-acre quotient nothing prints. The comparison is continuous rather than rounded, which is the conservative reading of a floor -- it never asks for fewer units than the ratio does. Three reliefs in 33.120.213.B are declined, and each lowers a floor: two units off when adding to an existing residential building, the Table 120-7 tree-preservation reduction, and the subtraction of Environmental-zone land from the site area. Group living is exempt and the pod is not group living. NOT ENCODED, on purpose. (1) Maximum front setback: Table 120-4 states one (#L549-L551) but 33.120.220.C.1 applies it only on a transit street or in a Pedestrian District, and a Value carries no condition on its base -- encoding it would bind every lot in the zone to a standard most of them never see. (2) Minimum site frontage of 90 ft (#L491-L495) applies only to sites on Map 120-2 that are more than 160 ft deep.'
  CR:
    cite_default:
      cite: PCC 33.130 — Table 130-1 (33.130.100 Primary Uses), 33.130.200 Lot Size, Table 130-2 (Summary of Development Standards in Commercial/Mixed Use Zones), 33.130.215 Setbacks, 33.130.220 Building Coverage, 33.130.225 Landscaped Areas, 33.130.250 General Requirements for Small Housing Types
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_3.pdf
      retrieved: '2026-08-19'
    quadplex_allowed:
      # Table 130-1, "Household Living", read across the header row: Y in
      # every commercial/mixed use zone. The housing type is named too --
      # 33.130.250.B.2.a applies the small-housing standards to "houses,
      # attached houses, manufactured homes, duplexes, attached duplexes,
      # triplexes, and fourplexes in the commercial/mixed use zones", which
      # is the chapter saying in its own words that a fourplex of attached
      # houses is a thing that gets built here.
      value: true
      quote: "or/multnomah/portland/33.130.txt#L341,L343,L1695-L1697"
    min_lot_sqft:
      # "There is no required minimum lot size for development of land in
      # commercial/mixed use zones." Not a minimum of zero -- the standard
      # does not exist. The sentence after it sends lot *creation* to Chapter
      # 33.613, which is a land-division rule and not a test an existing lot
      # has to pass to be built on.
      exempt: true
      quote: "or/multnomah/portland/33.130.txt#L397-L399"
    setback_front_ft:
      # Table 130-2, "Min. Building Setbacks - Street Lot Line": none, in all
      # six zones. The variant is the exception and it runs the other way
      # from the usual one -- the corridor makes the standard TIGHTER, not
      # looser -- so it is worth saying plainly that the base here is the
      # permissive reading. 33.130.215.B.1.a requires 10 ft from a street lot
      # line adjacent to a Civic Corridor shown on Map 130-1, and this screen
      # does not hold that map.
      value: 0
      quote: "or/multnomah/portland/33.130.txt#L618,L640"
      variants:
        - value: 10
          when: [civic_corridor]
          quote: "or/multnomah/portland/33.130.txt#L618,L641"
    setback_front_max_ft:
      # A maximum, not a minimum: the building has to be within 10 ft of the
      # street lot line. This is the standard in the chapter most likely to
      # decide a pod, because it forbids the layout that a rear-court plan
      # reaches for first -- parking at the front, building set back behind
      # it.
      value: 10
      quote: "or/multnomah/portland/33.130.txt#L618,L651-L652"
    setback_side_ft:
      # Two rows, one question, and the answer is the neighbour's zoning
      # rather than this lot's. 10 ft from a lot line abutting an RF through
      # RM4, RMP or IR zone; none from a lot line abutting OS, RX, C, E or I.
      # The 10 is the base because the fact is unmeasured and reading it the
      # other way is how a lot with a house behind it screens as buildable
      # to its own rear line.
      value: 10
      quote: "or/multnomah/portland/33.130.txt#L618,L649"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130.txt#L618,L647"
    setback_rear_ft:
      # The same two rows. 33.130.215.B.2 draws no distinction between a side
      # and a rear lot line -- both are "a lot line that is not a street lot
      # line" -- so the rear standard is the side standard.
      value: 10
      quote: "or/multnomah/portland/33.130.txt#L618,L649"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130.txt#L618,L647"
    max_height_ft:
      # Table 130-2, "Base Height". The row prints all six cells on one line,
      # so the header is quoted with it and position is what names the column
      # -- CR, CM1, CM2, CM3, CE, CX.
      value: 30
      quote: "or/multnomah/portland/33.130.txt#L618,L627"
    max_far:
      value: 1.0
      quote: "or/multnomah/portland/33.130.txt#L618,L619"
    max_coverage_pct:
      # Two rows, and which one applies is a pattern area on Map 130-2 that
      # this screen does not read. The Eastern/Western/River figure is
      # encoded because it is the lower of the two; the Inner Pattern Area
      # allows 85 percent on the same lot.
      value: 75
      quote: "or/multnomah/portland/33.130.txt#L618,L656-L657"
    min_landscaped_pct:
      value: 15
      quote: "or/multnomah/portland/33.130.txt#L618,L659"
    orientation_constraint:
      # 33.130.250.B.3: at least one main entrance must be within 8 feet of
      # the longest street-facing wall, and must face the street, sit at up
      # to 45 degrees from it, or open onto a porch. That binds the entrance
      # and leaves the building's long axis free, which is what
      # `entrance_only` means. Flag lots and lots averaging 20 percent slope
      # or steeper are exempt (#L1711-L1712) -- both are conditions this
      # screen could evaluate and neither is encoded as a variant yet.
      value: entrance_only
      quote: "or/multnomah/portland/33.130.txt#L1713-L1719"
    max_density_du_per_acre:
      # Note [1] under Table 130-2, and it applies to exactly the building
      # this screen places: "On sites that do not have a Retail Sales And
      # Service or Office use, maximum density for Household Living is 1
      # unit per 2,500 square feet of site area." A four-unit pod with no
      # ground-floor commercial needs 10,000 sq ft of site to clear it, which
      # is the tightest density ceiling anywhere in Portland's inventory.
      sqft_per_unit: 2500
      quote: "or/multnomah/portland/33.130.txt#L668-L669"
    notes: 'Commercial/mixed use. Household Living is a plain Y in Table 130-1 and 33.130.200 states there is no required minimum lot size for development, so the two standards that most often decide a small lot do not exist here. What binds instead is the shape: a maximum front setback of 10 ft puts the building at the street, and side and rear setbacks turn on the zoning of the lot next door rather than on anything in this parcel''s record. NOT ENCODED, on purpose. (1) The step-down heights in Table 130-2 (#L628-L635) drop the ceiling to 35 or 45 ft near lower-scale residential zones. Both clear a 26 ft pod, so encoding a fact nobody measures would cost a lookup and move no verdict. (2) The 5/10 ft minimum street setback across a local service street from an RF-RM2 or RMP zone (33.130.215.B.1.b) needs the street''s functional class and the facing zone, neither of which this screen holds; it is also disapplied within 100 ft of a transit street. (3) Bonus FAR and bonus height (Table 130-3) are earned, not given. (4) The garage standards in 33.130.250.D are stated relative to the dwelling''s own street-facing wall rather than to a lot line, so they are a massing rule this field set cannot hold. (5) Maximum building length of 200 ft (33.130.222.B) is far above anything a four-unit pod reaches. CR is also the only one of the six carrying a density ceiling, and it does not survive resolution: OAR 660-046-0220(2)(b) bars a Large City from applying a density maximum to a quadplex, and the state layer exempts the field outright. The number is encoded anyway because the city wrote it and a future building that is not a quadplex is held to it -- and because a ceiling that vanishes should vanish visibly, with both sentences on the record, rather than never having been read.'

