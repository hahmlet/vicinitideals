    # 33.110.220.txt#L88, 33.120.220.B.3.g 33.120.220.txt#L57) and hold
    # it on that field. This chapter has no such sentence: "alley" appears in
    # 33.130 only in the step-down height across a street or alley from a
    # residential zone (33.130.210.txt#L30-L33), a height rule. 33.140 (EX),
    # 33.150 (CI2, IR) and 33.100 (OS) never say "alley" at all -- a
    # whole-document grep of every Portland chapter in the store; the plan
    # districts were not part of that grep and could still say more. What
    # governs the line instead: a street lot line "does not include lot lines
    # that abut an alley" (33.910.030.txt#L559-L562) and a street
    # "does not include alleys" (#L1011), so an alley line is "a lot
    # line that is not a street lot line", and 33.130.215.B.2 sets its
    # setback by the zone it abuts -- the side/rear pair above, one number
    # for either. Where this field is absent the screen cuts a side alley
    # line at max(side, rear) (flats.ingest.quadfit.setbacks_for), which here
    # IS that one B.2 number, so behaviour already matches the code and
    # nothing is added. The zone is read ACROSS the alley
    # (flats.geom.neighbour): an R zone beyond it keeps the ten feet. Reading
    # the alley right-of-way itself as the thing abutted could give zero;
    # that is the relaxing reading, and it is not taken.
    max_height_ft:
      # Table 130-2, "Base Height". The row prints all six cells on one line,
      # so the header is quoted with it and position is what names the column
      # -- CR, CM1, CM2, CM3, CE, CX.
      value: 30
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L74"
    max_far:
      value: 1.0
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65-L66"
    max_coverage_pct:
      # Two rows, and which one applies is a pattern area on Map 130-2 that
      # this screen does not read. The Eastern/Western/River figure is
      # encoded because it is the lower of the two; the Inner Pattern Area
      # allows 85 percent on the same lot.
      value: 75
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L102-L103"
    min_landscaped_pct:
      value: 15
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L105"
    orientation_constraint:
      # 33.130.250.B.3: at least one main entrance must be within 8 feet of
      # the longest street-facing wall, and must face the street, sit at up
      # to 45 degrees from it, or open onto a porch. That binds the entrance
      # and leaves the building's long axis free, which is what
      # `entrance_only` means. Flag lots and lots averaging 20 percent slope
      # or steeper are exempt (#L1711-L1712) -- both are conditions this
      # screen could evaluate and neither is encoded as a variant yet.
      value: entrance_only
      quote: "or/multnomah/portland/33.130/33.130.250.txt#L19-L23"
      via: "or/multnomah/portland/33.130/33.130.250.txt#L10-L11"
    max_density_du_per_acre:
      # Note [1] under Table 130-2, and it applies to exactly the building
      # this screen places: "On sites that do not have a Retail Sales And
      # Service or Office use, maximum density for Household Living is 1
      # unit per 2,500 square feet of site area." A four-unit pod with no
      # ground-floor commercial needs 10,000 sq ft of site to clear it, which
      # is the tightest density ceiling anywhere in Portland's inventory.
      sqft_per_unit: 2500
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L114"
    notes: 'Commercial/mixed use. Household Living is a plain Y in Table 130-1 and 33.130.200 states there is no required minimum lot size for development, so the two standards that most often decide a small lot do not exist here. What binds instead is the shape: a maximum front setback of 10 ft puts the building at the street, and side and rear setbacks turn on the zoning of the lot next door rather than on anything in this parcel''s record. NOT ENCODED, on purpose. (1) The step-down heights in Table 130-2 (#L628-L635) drop the ceiling to 35 or 45 ft near lower-scale residential zones. Both clear a 26 ft pod, so encoding a fact nobody measures would cost a lookup and move no verdict. (2) The 5/10 ft street setback across a local service street from an RF-RM2 or RMP zone (33.130.215.B.1.b) does not reach this zone: "The setbacks do not apply in the CR or CM1 zones" (#L838). (3) Bonus FAR and bonus height (Table 130-3) are earned, not given. (4) The garage standards in 33.130.250.D are stated relative to the dwelling''s own street-facing wall rather than to a lot line, so they are a massing rule this field set cannot hold. (5) Maximum building length of 200 ft (33.130.222.B) is far above anything a four-unit pod reaches. CR is also the only one of the six carrying a density ceiling, and it does not survive resolution: OAR 660-046-0220(2)(b) bars a Large City from applying a density maximum to a quadplex, and the state layer exempts the field outright. The number is encoded anyway because the city wrote it and a future building that is not a quadplex is held to it -- and because a ceiling that vanishes should vanish visibly, with both sentences on the record, rather than never having been read.'

