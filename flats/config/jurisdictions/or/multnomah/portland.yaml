  "33.110.txt#33.110":
    queue: condition
    outcome: cant_tell
    note: >-
      A hundred and eighteen statements, and one of them tightens. Almost the whole card is the
      chapter's exceptions machinery, which runs in the direction that costs nothing: bays and bay
      windows up to 12 feet long projecting into a setback, eaves two feet, stormwater planters
      and decks under two and a half feet above the ground, cisterns six feet, an attached garage
      rebuilt at 15 feet, and four separate exemptions for a lot on a street with an average slope
      of 20 percent or more. A relaxation this screen does not take is a lot measured stricter
      than the code, which is the safe direction and the one the conservative default asks for.
      Another block is the garage rules at lines 1174 to 1266 -- the 50 percent of street-facing
      facade that must be without garage, stated for a fourplex by name at line 1234 -- and this
      building has no garage, settled on 2026-09-08, so every one of them is satisfied by having
      nothing to satisfy. The entrance standards at 830 to 842 are a menu, 45 degrees or a 25
      square foot porch. Table 110-3 at lines 382 to 394 is a land division standard, the size a
      lot must be to be created, not the size it must be to be built on. THE ONE THAT BINDS IS
      33.110.240, Flag Lots, and it is not in this layer. "Large flag lots have required building
      setbacks that are the same along all lot lines" -- 15 feet in RF, R20 and R10; 10 feet in
      R7, R5 and R2.5 -- where R5 and R2.5 hold 10 front and 5 on the side and rear, and R7 holds
      15 front and 5 on the side and rear. On a flag lot in R5 the pod owes ten feet on both sides
      and at the back instead of five: ten feet of lot width and five of depth, on every
      quadplex-allowed zone in the chapter. A landscaped buffer at least five feet deep runs
      around the perimeter of any flag lot of 10,000 square feet or less on top of that. This is
      filed as depending on the site because that is exactly what it is. Whether a parcel is a
      flag lot is a fact about its shape, `flag_lot` is already a name in the site-conditions
      registry, and it is answerable by geometry rather than by more reading -- the same class as
      neighbour-zone adjacency and lot-line bearing, both moved onto the computable list on
      2026-09-08. It must not be written as a `when:` variant: a variant leaves the loose base
      binding until the condition is proved, and the loose base is the wrong answer here, so a
      flag lot would come out green on a five-foot side setback it does not have. It needs the cap
      shape or the measurement. The small flag lot standards beneath it -- a 20-foot height limit
      and 0.5 floor area ratio where the flag portion is under 3,000 square feet -- are argued to
      be unreachable rather than assumed to be: the flag is the buildable part and the pole is the
      driveway, so a flag under 3,000 square feet cannot hold this building's footprint and its
      setbacks whatever its height limit says. Area refuses that lot before height gets a turn.
    fingerprint: e4eb0237be9e6df3
  "33.130.txt#33.130":
    queue: condition
    outcome: never
    note: >-
      Ninety-six statements across Portland's Commercial/Mixed Use chapter, and this is the
      layer's best-encoded corner, so most of the card is a reader meeting standards that are
      already ours. The chapter's shape is carried on every CM and CX zone: a maximum front
      setback of 10 feet, side and rear at 10 with a `abuts_nonresidential_zone` variant relaxing
      to zero, base height 35, a maximum floor area ratio, outdoor area at 48 square feet per
      dwelling banded on site size, and an entrance rule carried as orientation_constraint:
      entrance_only. Working the card came down to four things that could have bound and do not.
      THE STEP-DOWN HEIGHTS are the largest block -- 35 feet within 25 feet of a site zoned RF
      through R2.5, 45 feet within 25 feet of RM1 or RMP, 45 feet within 15 feet of a lot line
      across a local service street or alley from either -- and they are inert by arithmetic. The
      pod is 26 feet, and the lowest step-down on the page is 35. The layer note already says so
      and this ruling agrees with it rather than re-deciding it. THE FIFTY PERCENT is the one that
      looks like Gresham and is not, and it is the reason this card was worth reading rather than
      scoping. 33.130.215.C.1: "at least 50 percent of the length of the ground level
      street-facing facade of the building must meet the maximum setback standard." Gresham's
      7.0420(J)(1)(a) asks that 50 percent of the SITE'S FRONTAGE be occupied by buildings, which
      is what forces the long axis parallel to the street and is carried there as axis_required.
      Portland asks that 50 percent of the BUILDING'S OWN FACADE sit at the setback line, which a
      rectangular pod with a flat street wall meets at a hundred percent whichever way it is
      turned. Same number, same words in three places, opposite consequence -- a keyword reader
      would have taken the wrong one. THE WINDOW SETBACK at 33.130.215.B.2.c does tighten, and its
      own exemption spares this building: dwelling-unit windows must sit five feet back from a lot
      line abutting a C, E, I or CI zone, which is exactly the lot line the zero-setback variant
      releases -- but "windows of dwelling units that also have other windows facing a street lot
      line" are exempt, and every unit in a four-unit attached row facing the street has them. THE
      GROUND-FLOOR RESIDENTIAL STANDARDS are a menu of three: a 12-foot ceiling over an area 25
      feet deep, or a ground floor set back 5 feet from the street lot line with 25 percent
      windows, or a finished floor 2 feet above grade with 25 percent windows. An applicant's
      choice is not a binding standard, and the middle option's 5 feet sits comfortably inside the
      10-foot maximum front setback the zone already charges. Everything else sorts into three
      piles. Relaxations, declined: parapets and railings at 4 feet, rooftop screens at 6,
      elevator machinery at 16, other mechanical at 10, solar panels at 5, high-ceiling bonus
      height at 5, bonus FAR for affordable commercial space, and projections into setbacks at 20
      percent of their depth. Other buildings: the 18-foot setback for structured parking that
      cannot exit forward, the 200-foot maximum building length, the 60,000 square foot retail
      exemption, the 55,000 square foot parking-area division and the 250-foot accessway spacing,
      and every garage standard, which this building has settled it does not have. And
      streetscape: 10-foot sidewalks, trees at 30 feet on centre, pedestrian connections at 200
      feet. Two items on the card are already declared NOT ENCODED in the zone notes with their
      reasons -- the 5 and 10 foot street setback across a local service street from a
      lower-density zone, which needs a street's functional class, and the garage standards stated
      against the dwelling's own wall -- and this ruling does not reopen either.
    fingerprint: ab602bb3aee24dea
  "33.120.txt#33.120":
    queue: condition
    outcome: applies
    note: >-
      A hundred and twenty-one statements in the Multi-Dwelling chapter, and one of them was being
      waved away on a reason that named a third of itself. THE FIND. 33.120.240.B.2.a: "on sites
      that are more than 20,000 square feet in total site area ... at least 10 percent of total
      site area must be provided as common area", at least half of it outdoors. RM1 carried a note
      saying this was not encoded because a four-unit pod is "outside the trigger and inside the
      exemption" -- and the exemption at B.2.b is three conditions joined by AND, of which that
      note named one. Every unit's own entrance within 20 feet of a street lot line, yes; a 3-foot
      hard-surfaced path to each, yes; and each unit holding 200 SQUARE FEET of individual outdoor
      area at a minimum of 10 feet by 10 feet, which nobody had read. Eight hundred square feet
      for four units, against the 48 apiece this field was charging. So on a site over 20,000
      square feet the pod was reserving 192 square feet where the cheaper of the code's two routes
      asks 800, and the dearer asks over 2,000. ENCODED, and the direction was argued rather than
