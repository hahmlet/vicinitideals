    quote: "or/multnomah/portland/33.595.txt#L89,L171-L174,L393-L397,L438-L449"
    cite: PCC 33.521.290.C; 33.530.050; 33.536.210.B, 240.C, 280.C.2, 300.C; 33.538.220.B; 33.545.100.C; 33.550.220; 33.561.270, 300; 33.563.220; 33.595.100.B.1, 210.C, 250.C, 270.B; 33.510.200.C.3, 210.B; 33.515.210, 230, 262; 33.526.340.C; 33.532.220, 230.C, 245; 33.555.230; 33.562.100.B, 210, 220.B, 240.E-F; 33.567.040; 33.575.110; 33.580.110, 130
