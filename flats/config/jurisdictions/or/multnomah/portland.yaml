# Plan districts (FOLLOWUPS 109 Portland part 1, 2026-11-01). A plan
# district's rules control where they conflict with a base or overlay zone
# (33.500.040; 33.700.070.E.2.a). Each outline below answers one site fact
# for the zone blocks that carry the rule; every other lot of those zones
# reads the fact false and keeps the base zone's number. CI1 is listed because
# since 2026-11-01 (RICAP 11, now 33.150.200) a home in CI1 takes RM1's
# standards whole, these holds and this cap with them (like: RM1).
drawn_areas:
  johnson_creek_impervious:
    condition: pdx_johnson_creek_impervious
    zones: [R20, R10, R7, R5, R2.5, RM1, RM2, CR, CM1, CM2, CM3, CE, CI1]
    file: or/multnomah/portland/johnson-creek-impervious-lots.geojson
    source: >-
      Johnson Creek Basin plan district South subdistrict (Portland Maps
      BPS_Zoning_Code_Layers layer 1, plan-subdistricts.geojson), the 1996
      flood inundation area and the FEMA Special Flood Hazard Area (Portland
      Maps Hazard layers 0 and 1, fetched 2026-11-01), and the taxlots the
      screen reads (quadfit_2026-10-30_dd_c6). Drawn provenance in the file's
      source block.
    quote: "or/multnomah/portland/33.537.txt#L43-L54,L323-L325,L384-L386"
    cite: PCC 33.537.020, 33.537.140.D, 33.537.150.E
    note: >-
      Inside means a lot at least one tenth inside the plan district with any
      part in the South subdistrict or in the combined flood hazard area,
      traced whole, because both rules reach the entire site once any
      portion is in (33.537.020, 140.B, 150.B). The combined flood hazard
      area is read as the 33.910 definition gives it, the FEMA flood area
      together with the 1996 flood extent. The cap counts eaves; the pod's
      roof is flat and is taken to have none.
  johnson_creek_unmeasured:
    condition: pdx_johnson_creek_unmeasured
    zones: [R20, R10, R7, R5, R2.5, RM1, RM2, CR, CM1, CM2, CM3, CE, CI1]
    file: or/multnomah/portland/johnson-creek-unmeasured-lots.geojson
    source: >-
      The Springwater Corridor's own land, Portland Parks property
      "Springwater Corridor" (springwater-corridor.geojson, Portland Maps
      Parks_Misc layer 2, fetched 2026-11-09), against the taxlots the screen
      reads; Map 537-1 draws the corridor only as its trail line, which runs
      inside that parcel the whole way through the plan district. Re-traced
      2026-11-09 (FOLLOWUPS 58) from the trail-distance reach of 2026-11-01
      (lots only 33.537.125 reached taken out 2026-11-08, FOLLOWUPS 140; lots
      only South or the Flood Risk Area reached moved to
      johnson_creek_land_division 2026-11-08). Drawn provenance in the file's
      source block.
    quote: "or/multnomah/portland/33.537.txt#L43-L54,L264-L296"
    cite: PCC 33.537.130
    note: >-
      Inside means a lot the Springwater Corridor standards reach, on either
      form: a lot that abuts the corridor parcel (33.537.130.B "sites that
      abut the Springwater Corridor"), any lot within 25 ft of it (not shown
      to be apart), and the corridor's own lots. A lot across a street from
      the corridor does not abut it and is not held. What stays open is the
      fit with the 20 ft (R) or 10 ft (C) landscaped buffer and the 20 ft
      vehicle-area setback on the one lot line that abuts the corridor,
      which the screen does not set per line. The South subdistrict and
      Flood Risk Area reach is johnson_creek_land_division (townhouse form
      only, FOLLOWUPS 58).
  johnson_creek_land_division:
    condition: pdx_johnson_creek_land_division
    zones: [R20, R10, R7, R5, R2.5, RM1, RM2, CR, CM1, CM2, CM3, CE, CI1]
    file: or/multnomah/portland/johnson-creek-land-division-lots.geojson
    source: >-
      The South subdistrict and Flood Risk Area subdistrict outlines
      (plan-subdistricts.geojson) against the taxlots the screen reads
      (quadfit_2026-10-30_dd_c6), cut from the johnson_creek_unmeasured
      tracing of 2026-11-08 with nothing added (FOLLOWUPS 58). Drawn
      provenance in the file's source block.
    quote: "or/multnomah/portland/33.537.txt#L30-L31,L43-L54,L326-L363,L387-L394"
    cite: PCC 33.537.010, 33.537.140.E, 33.537.160
    note: >-
      Inside means a lot with 1 sq ft or more in the South subdistrict or the
      Flood Risk Area. 33.537.140.E sets the density of "Land Divisions and
      Planned Developments" by land class, and 33.537.160 prohibits or
      conditions "land divisions and PDs"; neither reaches the pod built as
      one building on the one lot, so the fact names no standard of its own:
      on the townhouse form (four unit lots, a land division) configure()
      folds it into pdx_johnson_creek_unmeasured and the lot is held there;
      on the one-lot form it is not asked (LAND_DIVISION_FOLDS). South lots
      in the combined flood hazard area answer to 33.537.150 instead of 140
      (33.537.020); 150's housing types and impervious cap are measured
      elsewhere, and they stay inside here, the conservative answer.
  laurelhurst_eastmoreland:
