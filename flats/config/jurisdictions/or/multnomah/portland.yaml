definitions:
  # "Corner Lot. A lot, adjusted lot, lot remnant, or lot of record that has
  # frontage on more than one intersecting street, and where the lot frontages
  # intersect. A street that curves with angles that are 120 degrees or less,
  # measured from the center line of the street, is considered two intersecting
  # streets for the purpose of evaluating whether a lot is a corner lot."
  #
  # Two conditions, not one: more than one street, AND the frontages intersect.
  # A through lot has two street frontages and is not a corner here, which is
  # the clause that separates Portland from Gresham on identical geometry.
  #
  # Alleys are excluded upstream rather than in this sentence: 33.910's street
  # lot line "does not include lot lines that abut an alley".
  corner_lot:
    test: intersecting_frontages
    curve_at_or_below_deg: 120.0
    quote: "or/multnomah/portland/33.910.definitions.txt#L701-L705"
    cite: "PCC 33.910, Lot-Related Definitions, Corner Lot"

crossrefs:

  # --- five chapters the use tables point at, none of them this building ---
  # All five stand beside `quadplex_allowed` because they are cited from the
  # 100s series use tables, a line or two from the row that permits the pod.
  "33.205":
    outcome: other_building
    note: >-
      Accessory Dwelling Units, cited from the use tables as "Detached accessory dwelling units are
      addressed in Chapter 33.205" and "Additional regulations for accessory dwelling units are
      stated in Chapter 33.205". An ADU is a second, subordinate unit on a lot with a house. This
      screen places four attached primary units, so the chapter regulates a building that is not
      here. It could only ever add a fifth unit to a lot, which is not what is being asked.
  "33.236":
    outcome: other_building
    note: >-
      Floating Structures: "houseboat moorages in I zones are regulated by Chapter 33.236, Floating
      Structures." A moorage is not a lot and a houseboat is not a factory-built townhome, and the
      zones it is cited in are industrial ones where the pod is not permitted anyway.
  "33.285":
    outcome: other_building
    note: >-
      Short Term, Mass, and Outdoor Shelters -- "Short term, mass, and outdoor shelters are
      regulated by Chapter 33.285". A different use category from Household Living, with its own
      chapter and, in most zones, a conditional use. The pod is four dwelling units.
  "33.700.060":
    outcome: procedure
    note: >-
      The requirements a recorded covenant has to meet, cited wherever Title 33 asks for one:
      density transfers, structures left standing after a land division or lot confirmation. It
      sets what the document says and how it is recorded with the deed, not what may be built. No
      distance in it.
  "3.75":
    outcome: misread
    note: >-
      Not a reference. Table 150-1 in 33.150 prints "3.75 to 1" in the CI2 column of the Maximum
      FAR with Inclusionary Housing Bonus row; the dotted-number branch reads the figure as a
      section.
  "0.7":
    outcome: misread
    note: >-
      Same shape one chapter over. Table 110-4 prints "0.7 to 1" in the R20 and R10 columns of the
      four-or-more-dwelling-units Maximum FAR row.
  "33.270":
    outcome: other_path
    note: >-
      Planned Developments. Both mentions are Table 110-2 rows -- "Attached Duplex" and
      "Multi-dwelling Development" -- reading "Only in Planned Developments, See Chapter 33.270."
      Neither row is the pod's. The Fourplex row on the same table says Yes in R20 and R10 with no
      planned development, and that is the row this screen reads.
  "33.251":
    outcome: other_building
    note: >-
      Manufactured Dwellings and Manufactured Dwelling Parks. All four mentions are the "(See
      Chapter 33.251)" line printed under those two rows of the 33.120 use tables, which is why
      they land beside the parking geometry read from the same page. The pod is factory-built and
      is neither a manufactured dwelling nor sited in a park.
  "33.613":
    outcome: later
    note: >-
      Lots in Commercial/Mixed Use Zones. The sentence this screen reads -- "There is no required
      minimum lot size for development of land in commercial/mixed use zones" -- is followed by
      one sending lot *creation* to this chapter. Creating a lot is not a test an existing lot has
      to pass to be built on, and CR, CM1, CM2, CM3, CE and CX are encoded on the development
      half of that pair. The campus institutional zones state both halves outright, which is what
      shows the split is the code's and not a reading of it. Parked rather than closed: no pod in
      flats/config/pods declares plat: unit_lots, so this screen never creates a lot. The day one
      does, this is a fetch.
  "33.614":
    outcome: later
    note: >-
      "Lot size regulations are in Chapters 33.614 and 33.615", the whole of what 33.140 says
      about lot size in the employment and industrial zones. Land-division chapters, same shape
      as 33.613 in the commercial chapter: how a lot may be created, not a minimum a built lot
      has to meet. EX is encoded exempt on that sentence. Parked with 33.613 for the same reason:
      no pod declares plat: unit_lots today.

code:
  # Portland's HTML route for a chapter serves navigation furniture; the PDF is
  # the artifact. Whole-chapter, unsliced: this one is already the chapter.
  - id: "33.110"
    url: https://www.portland.gov/sites/default/files/code/110-sd-zone_2.pdf
    title: Chapter 33.110 Single-Dwelling Zones
  - id: "33.120"
    url: https://www.portland.gov/sites/default/files/code/120-md-zones_3.pdf
    title: Chapter 33.120 Multi-Dwelling Zones
  # The commercial/mixed-use chapter. CM1, CM2, CM3, CX and CE are the largest
  # block of fourplex-eligible land in the city this screen had never read --
  # 13,225 lots standing at `zone_missing`, which is a verdict of "we do not
  # know" rather than a verdict.
  - id: "33.130"
    url: https://www.portland.gov/sites/default/files/code/130-c-zones_3.pdf
    title: Chapter 33.130 Commercial/Mixed Use Zones
  # Employment and industrial. EX belongs to this chapter rather than 33.130,
  # and IG1, IG2 and IH are here to be read out honestly: a zone that does not
  # allow the use is a RED with a citation, which is a different thing from a
  # zone nobody looked up.
  - id: "33.140"
    url: https://www.portland.gov/sites/default/files/code/140-ind-zones_1.pdf
    title: Chapter 33.140 Employment and Industrial Zones
  - id: "33.100"
    url: https://www.portland.gov/sites/default/files/code/100-os-zone_0.pdf
    title: Chapter 33.100 Open Space Zone
  # Campus Institutional. CI1 and CI2 are the last two Portland zones the GIS
  # reports and this file did not carry.
  - id: "33.150"
    url: https://www.portland.gov/sites/default/files/code/150-campus-inst-zones_1.pdf
    title: Chapter 33.150 Campus Institutional Zones
  # 33.910 is the spec for every measurement the other three chapters take.
  # Corner lot, through lot, front lot line, lot depth, lot width, street --
  # each is a defined term here, and each is inferred from shape by the
  # geometry stage with nothing to check the inference against. Three cities
  # define "corner lot" three incompatible ways; that is a rule, and a rule
  # needs a citation.
  - id: "33.910.definitions"
    url: https://www.portland.gov/sites/default/files/code/910-definitions_0.pdf
    title: Chapter 33.910 Definitions
  # 33.920 is the other half of 33.910: the definitions chapter says what a
  # word means, this one says which CATEGORY a building falls into, and every
  # zone chapter in the city carries the same bullet -- "The use categories
  # are described in Chapter 33.920" -- above a use table whose rows are
  # categories rather than buildings. Nine mentions, two of them standing
  # beside a minimum lot area, and it was the loudest unfetched reference in
  # the largest jurisdiction in the corpus. Which row a four-unit building
  # takes in six use tables is not a thing to rule on from outside.
  #
  # Read 2026-09-02, and it matters in exactly half the city. The single-
  # dwelling and multi-dwelling tables name the BUILDING -- 33.110's Table
  # 110-1 has a row reading "Fourplex" and the pod's permission is read from
  # it directly. The commercial, employment and campus tables name the
  # CATEGORY: Table 130-1 and Table 140-1 have one row, "Household Living",
  # and nothing in this file had ever said why a four-unit building is in it.
  # 33.920.110.A does: "Household Living is the residential occupancy of a
  # dwelling unit that contains eight or fewer bedrooms", tenancy monthly or
  # longer, with houses, duplexes, apartments and condominiums as its
  # examples. The category is drawn per DWELLING UNIT, not per building, so
  # a four-unit pod is four Household Living occupancies and the count of
  # units never enters. Nothing moves; the chapter states no distance, no
  # area and no height anywhere in its 844 lines. What it settles is the use
  # permission under CR, CM1, CM2, CM3, CE, CX, EG1, EG2, EX, IG1, IG2, IH,
  # CI1, CI2 and IR -- the largest block of fourplex-eligible land in the city --
  # which until today rested on a table row this corpus could not have
  # defended.
  - id: "33.920"
    url: https://www.portland.gov/sites/default/files/code/920-categories_1.pdf
    title: Chapter 33.920 Descriptions of the Use Categories
  # 33.930 is the third of the trio, and the note above 33.910 was wrong about
  # it: the definitions chapter is where a word is *filed*, this one is where a
  # measurement is *taken*. Portland's 296-entry definitions chapter has no
  # entry for "building height" and none for "lot width"; this chapter's
  # 33.930.050 Measuring Height and 33.930.100 Measuring Lot Widths are the
  # code's own answer to both, and until today every setback and height the
  # city holds was measured under rules stored nowhere.
  #
  # It arrives here from the word queue rather than from the reference ledger,
  # which is the whole point of that queue: 33.930 stands beside no standard
  # anywhere in the corpus, so the fetch feed scored it (0, 0, 0, 0) and sat it
  # 69th of 75. What reaches it is being handed the words 186,888 lots' worth
  # of numbers are measured in.
  - id: "33.930"
    url: https://www.portland.gov/sites/default/files/code/930-measurements_0.pdf
    title: Chapter 33.930 Measurements
  - id: "33.266"
    url: https://www.portland.gov/sites/default/files/code/266-parking_3.pdf
    title: Chapter 33.266 Parking, Loading, and Transportation and Parking Demand Management
  # Title 11, Trees. 33.100.230, 33.110, 33.120.237 and 33.120.290 all point
  # here and never say what it costs, and the pointer sits in the same breath
  # as building coverage and minimum landscaped area -- which is why the
  # cross-reference ledger ranked it the largest binding gap in the city. No
  # PDF exists; the HTML page IS the chapter, so it is sliced at its own first
  # and last section headings. Without the slice it swallows a road-closure
  # alert at the top and the whole city-code index at the bottom.
  - id: "11.50"
    url: https://www.portland.gov/code/11/50
    title: Chapter 11.50 Trees in Development Situations
    start: "11.50.010 Purpose."
    end: "Upcoming and recent changes"
defaults:
  # Portland requires no off-street parking anywhere in the city. The chapter
  # is the evidence: it runs from 33.266.100 straight to 33.266.115 Maximum
  # Allowed Parking Spaces with no minimum section between them, and
  # 33.266.110.A regulates carpool and EV spaces only "when parking spaces are
  # provided" -- language that presupposes providing none is allowed. The
  # state's 1 stall/unit ceiling caps what a city MAY require and does not
  # oblige it to require anything, so this passes through it.
  #
  # Four stalls is about 1,300 sq ft of a site that has to hold the pod, its
  # parking and its access. On the narrow lots this screen exists to find, that
  # is routinely the difference between fitting and not, which is why it is
  # worth citing an absence carefully rather than leaving the state ceiling to
  # stand in for a rule Portland does not have.
  # And no maximum either, in most of the city -- but not in all of it, which
  # is the half that had no field to be written in until now. Table 266-1
  # sends OS, R, C, CI, EG, I and IR to Standard B; Standard B's Household
  # Living cell opens "No maximum", and the exception it then states reaches
  # only commercial/mixed use and multi-dwelling zones. Those twelve zones and
  # EX carry their own number; this is what the other fifteen inherit.
  parking_max_per_unit:
    exempt: true
    cite: PCC 33.266.115; Tables 266-1 and 266-2
    url: "https://www.portland.gov/sites/default/files/code/266-parking_3.pdf"
    retrieved: 2026-08-21
    quote: "or/multnomah/portland/33.266.txt#L139,L153-L155,L157,L159"
  parking_min_per_unit:
    # Not a minimum of zero -- there is no minimum. The quote is the chapter's
    # own list of its motor vehicle parking sections, which runs General
    # Regulations, Required Carpool and Electric Vehicle Parking, Maximum
    # Allowed Parking Spaces, and three development-standard sections, with
    # nothing that requires a space. An absence is what the code states here,
    # so an absence is what is encoded.
    exempt: true
    cite: "PCC 33.266 — the chapter's own section list: no minimum-parking section exists between 33.266.100 General Regulations and 33.266.115 Maximum Allowed Parking Spaces"
    url: "https://www.portland.gov/sites/default/files/code/266-parking_3.pdf"
    retrieved: 2026-08-15
    status: draft
    quote: "or/multnomah/portland/33.266.txt#L10-L17"

  # How big a stall is. Portland prints two answers and one sentence deciding
  # between them, and the sentence is easy to walk past.
  #
  # 33.266.120 is titled for this building -- houses, attached houses,
  # duplexes, triplexes, fourplexes -- and D.1 states a 9 x 18 stall and a 9 ft
  # private driveway, with no aisle anywhere in the section. That reads like
  # the whole answer until 33.266.120.B.1: "Parking that is in a parking tract
  # is subject to the standards of Section 33.266.130 instead of the standards
  # of this section." 33.266.130.B agrees from its own side, excluding only
  # "residential vehicle areas subject to the standards of 33.266.120". The two
  # do not overlap and they do not contradict; the plat decides which applies.
  #
  # A tract (33.910) is "a piece of land created and designated as part of a
  # land division that is not a lot, adjusted lot, lot remnant, lot of record,
  # or a public right-of-way". A shared rear court serving four attached houses
  # on fee-simple lots is one. A rear court on the SAME LOT as the building it
  # serves is not one -- it is on a lot, which the definition excludes by name.
  #
  # WHICH BRANCH, RE-READ 2026-09-01, AND THE ANSWER REVERSED. This file stood
  # on Table 266-4 from 2026-08-25 with the reasoning above, and the reasoning
  # describes a product this screen does not model. `plat: one_lot` is what the
  # site plan draws and a SiteplanSpec validator refuses to move off it; on that
  # path there is no land division, so there is no tract, so 33.266.120 applies
  # to "all parking areas" of this fourplex and Table 266-4 is expressly not
  # reached. The paragraph that justified the old choice said so itself --
  # "where the plat is not yet drawn" -- and the plat is drawn.
  #
  # The old note also called 266-4 the deeper court: 8.5 x 16 with a 20 ft aisle
  # is 36 feet against "four 9 x 18 stalls off a 9 ft driveway", 27. That
  # comparison is what made the wrong branch look conservative, and it holds
  # only if a court of eight stalls can be served by a 9-foot driveway with no
  # aisle at all. It cannot. Under 120.D.1's own rectangle and an aisle nobody
  # published, the honest court is 18 + 24 = 42 feet -- deeper than either.
  #
  # This is the Milwaukie shape exactly. A city prints an aisle table, excepts
  # this building from it by name, and dimensions nothing in its place; the
  # excepted table may not be borrowed back (see the Milwaukie 19.606 refusal),
  # and the aisle is assumed to the national engineering floor in quadfit rather
  # than encoded here. What the code states for this building is a rectangle and
  # a driveway, and that is what this layer now holds.
  parking_stall_width_ft:
    value: 9
    cite: PCC 33.266.120.D.1, "A parking space must be at least 9 feet by 18 feet"
    url: "https://www.portland.gov/sites/default/files/code/266-parking_3.pdf"
    retrieved: '2026-09-01'
    quote: "or/multnomah/portland/33.266.txt#L268,L271-L275,L317-L318"
    variants:
      # The other branch, kept because it is real and one plat decision away.
      # Four attached houses on their own lots sharing a court put the parking
      # in a tract, 120.B.1 sends it to 33.266.130, and Table 266-4's 90-degree
      # row is what dimensions it.
      - value: 8.5
        when: [unit_lots]
        cite: PCC Table 266-4, Minimum Parking Space and Aisle Dimensions (90 degrees), reached via 33.266.120.B.1
        url: "https://www.portland.gov/sites/default/files/code/266-parking_3.pdf"
