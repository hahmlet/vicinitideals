    note: >-
      Portland's height exceptions in the single-dwelling zones, and one line on it looked like a
      tightening until it was followed. Three of the four are plainly permissions: a chimney, vent
      or dish under three feet across may stand five feet above the roof; a dormer may project if
      it is no wider than 75 percent of the roof; a roof-mounted solar panel may rise five feet
      above the highest point. The fourth is the steep-lot rule, and it splits three ways.
      Downhill from the street at 20 percent or more, the limit is "the higher of" 23 feet above
      the street's average grade or the normal limit -- higher of, so a floor under the ordinary
      standard rather than a cap on it. Uphill at 20 percent or more, "the alternative height and
      setback standards of Subsection 33.110.220.D apply", which reads like a mandatory swap and
      is not one: D is headed "Exceptions to the required setbacks" and D.4 lets a steep lot
      reduce the front building or garage setback to five feet in exchange for one foot of height
      in the reduced area for every foot of setback given up. A trade the applicant may take. The
      third case, sloping both ways, says the applicant "may" meet the alternative. Every branch
      loosens, and a loosening left unread refuses land the city would allow.
