label: Portland
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a coarser standard
  (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''. quadfit justified
  this in a YAML comment with no citation; it needs its own encoding rather than invented provenance. SUNSET: the min_lot_sqft `adjustment` variants on the Table 110-7 zones are the 10 percent reduction 33.110.240.B.2 allows, and that paragraph ends it — requests are barred from January 1, 2032. Nothing in the model expires a variant on a date, so on that day these five variants become wrong and have to be deleted by hand.'
ingest:
  geoid: null
  juris_city_codes:
  - PORTLAND
  zoning_layer: zoning_portland
  zone_field: ZONE
  strip_lowercase_suffix: true
definitions:
  # "Corner Lot. A lot, adjusted lot, lot remnant, or lot of record that has
  # frontage on more than one intersecting street, and where the lot frontages
  # intersect. A street that curves with angles that are 120 degrees or less,
  # measured from the center line of the street, is considered two intersecting
  # streets for the purpose of evaluating whether a lot is a corner lot."
  #
  # Two conditions, not one: more than one street, AND the frontages intersect.
  # A through lot has two street frontages and is not a corner here, which is
  # the clause that separates Portland from Gresham on identical geometry.
  #
  # Alleys are excluded upstream rather than in this sentence: 33.910's street
  # lot line "does not include lot lines that abut an alley".
  corner_lot:
    test: intersecting_frontages
    curve_at_or_below_deg: 120.0
    quote: "or/multnomah/portland/33.910.definitions.txt#L701-L705"
    cite: "PCC 33.910, Lot-Related Definitions, Corner Lot"

code:
  # Portland's HTML route for a chapter serves navigation furniture; the PDF is
  # the artifact. Whole-chapter, unsliced: this one is already the chapter.
  - id: "33.110"
    url: https://www.portland.gov/sites/default/files/code/110-sd-zone_2.pdf
    title: Chapter 33.110 Single-Dwelling Zones
  - id: "33.120"
    url: https://www.portland.gov/sites/default/files/code/120-md-zones_3.pdf
    title: Chapter 33.120 Multi-Dwelling Zones
  # The commercial/mixed-use chapter. CM1, CM2, CM3, CX and CE are the largest
  # block of fourplex-eligible land in the city this screen had never read --
  # 13,225 lots standing at `zone_missing`, which is a verdict of "we do not
  # know" rather than a verdict.
  - id: "33.130"
    url: https://www.portland.gov/sites/default/files/code/130-c-zones_3.pdf
    title: Chapter 33.130 Commercial/Mixed Use Zones
  # Employment and industrial. EX belongs to this chapter rather than 33.130,
  # and IG1, IG2 and IH are here to be read out honestly: a zone that does not
  # allow the use is a RED with a citation, which is a different thing from a
  # zone nobody looked up.
  - id: "33.140"
    url: https://www.portland.gov/sites/default/files/code/140-ind-zones_1.pdf
    title: Chapter 33.140 Employment and Industrial Zones
  - id: "33.100"
    url: https://www.portland.gov/sites/default/files/code/100-os-zone_0.pdf
    title: Chapter 33.100 Open Space Zone
  # 33.910 is the spec for every measurement the other three chapters take.
  # Corner lot, through lot, front lot line, lot depth, lot width, street --
  # each is a defined term here, and each is inferred from shape by the
  # geometry stage with nothing to check the inference against. Three cities
  # define "corner lot" three incompatible ways; that is a rule, and a rule
  # needs a citation.
  - id: "33.910.definitions"
    url: https://www.portland.gov/sites/default/files/code/910-definitions_0.pdf
    title: Chapter 33.910 Definitions
  - id: "33.266"
    url: https://www.portland.gov/sites/default/files/code/266-parking_3.pdf
    title: Chapter 33.266 Parking, Loading, and Transportation and Parking Demand Management
defaults:
  # Portland requires no off-street parking anywhere in the city. The chapter
  # is the evidence: it runs from 33.266.100 straight to 33.266.115 Maximum
  # Allowed Parking Spaces with no minimum section between them, and
  # 33.266.110.A regulates carpool and EV spaces only "when parking spaces are
  # provided" -- language that presupposes providing none is allowed. The
  # state's 1 stall/unit ceiling caps what a city MAY require and does not
  # oblige it to require anything, so this passes through it.
  #
  # Four stalls is about 1,300 sq ft of a site that has to hold the pod, its
  # parking and its access. On the narrow lots this screen exists to find, that
  # is routinely the difference between fitting and not, which is why it is
  # worth citing an absence carefully rather than leaving the state ceiling to
  # stand in for a rule Portland does not have.
  parking_min_per_unit:
    # Not a minimum of zero -- there is no minimum. The quote is the chapter's
    # own list of its motor vehicle parking sections, which runs General
    # Regulations, Required Carpool and Electric Vehicle Parking, Maximum
    # Allowed Parking Spaces, and three development-standard sections, with
    # nothing that requires a space. An absence is what the code states here,
    # so an absence is what is encoded.
    exempt: true
    cite: "PCC 33.266 — the chapter's own section list: no minimum-parking section exists between 33.266.100 General Regulations and 33.266.115 Maximum Allowed Parking Spaces"
    url: "https://www.portland.gov/sites/default/files/code/266-parking_3.pdf"
    retrieved: 2026-08-15
    status: draft
    quote: "or/multnomah/portland/33.266.txt#L10-L17"
