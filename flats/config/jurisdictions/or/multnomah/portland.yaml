    notes: 'Commercial/mixed use. Household Living is a plain Y in Table 130-1 and 33.130.200 states there is no required minimum lot size for development, so the two standards that most often decide a small lot do not exist here. What binds instead is the shape: a maximum front setback of 10 ft puts the building at the street, and side and rear setbacks turn on the zoning of the lot next door rather than on anything in this parcel''s record. NOT ENCODED, on purpose. (1) The step-down heights in Table 130-2 (#L628-L635) drop the ceiling to 35 or 45 ft near lower-scale residential zones. Both clear a 26 ft pod, so encoding a fact nobody measures would cost a lookup and move no verdict. (2) The 5/10 ft minimum street setback across a local service street from an RF-RM2 or RMP zone (33.130.215.B.1.b) needs the street''s functional class and the facing zone, neither of which this screen holds; it is also disapplied within 100 ft of a transit street. (3) Bonus FAR and bonus height (Table 130-3) are earned, not given. (4) The garage standards in 33.130.250.D are stated relative to the dwelling''s own street-facing wall rather than to a lot line, so they are a massing rule this field set cannot hold. (5) Maximum building length of 200 ft (33.130.222.B) is far above anything a four-unit pod reaches.'
  EX:
    cite_default:
      cite: PCC 33.140 — Table 140-1 (33.140.100 Primary Uses), 33.140.100.B.1 and .B.2, 33.140.200 Lot Size, Table 140-2 (Development Standards), Table 140-3 (Minimum Building Setbacks From Residential Zone Lot Lines)
      url: https://www.portland.gov/sites/default/files/code/140-ind-zones_1.pdf
      retrieved: '2026-08-19'
    quadplex_allowed:
      # Table 140-1, "Household Living": Y in EX, with no bracketed
      # limitation, in a chapter whose other five zones either bar it or
      # send it to a conditional use. EX is Central Employment.
      value: true
      quote: "or/multnomah/portland/33.140.txt#L322,L324"
    min_lot_sqft:
      # "Lot size regulations are in Chapters 33.614 and 33.615." Those are
      # land-division chapters -- how a lot may be created -- and this
      # chapter states no minimum a built lot has to meet. The standard does
      # not exist here rather than being one every lot passes.
      exempt: true
      quote: "or/multnomah/portland/33.140.txt#L451-L452"
    setback_front_ft:
      value: 0
      quote: "or/multnomah/portland/33.140.txt#L590,L600"
    setback_front_max_ft:
      # 10 ft, but only on a transit street or in a Pedestrian District.
      # Table 140-2 prints the condition in the row label, so the number is
      # not a standard every lot in the zone meets -- and unlike the
      # commercial zones, where the maximum is unconditional, this one binds
      # a minority of sites. Encoded at the value the row states, with the
      # condition recorded here rather than silently dropped.
      value: 10
      quote: "or/multnomah/portland/33.140.txt#L590,L606-L608"
    setback_side_ft:
      # Table 140-3, the EG1/EX/IG1 row, "16 or more" band: the pod is 26 ft
      # tall, so the 15-ft-or-less band never applies to it. 10 ft from a
      # side lot line of an R zoned lot, and nothing from a lot line abutting
      # an OS, C, E or I zoned lot.
      value: 10
      quote: "or/multnomah/portland/33.140.txt#L625-L628"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.140.txt#L590,L602-L603"
    setback_rear_ft:
      # The same row and the same band. At 15 ft or less of wall height the
      # rear standard is 0 and the side standard is 5; at 16 or more they
      # are both 10, which is the band a 26 ft pod is in.
      value: 10
      quote: "or/multnomah/portland/33.140.txt#L625-L628"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.140.txt#L590,L602-L603"
    max_height_ft:
      value: 65
      quote: "or/multnomah/portland/33.140.txt#L590,L597"
    max_far:
      value: 3.0
      quote: "or/multnomah/portland/33.140.txt#L590,L591"
    max_coverage_pct:
      value: 100
      quote: "or/multnomah/portland/33.140.txt#L590,L610-L611"
    min_landscaped_pct:
      value: 0
      quote: "or/multnomah/portland/33.140.txt#L590,L613"
    notes: 'Central Employment. The one zone in the employment and industrial chapter where Household Living is allowed outright, and on the dimensions it is among the loosest land in the city: no minimum lot size, 65 ft of height, 100 percent coverage, no landscaped area and no setback from a street lot line. What is left is the neighbour test -- 10 ft from a lot line abutting an R zoned lot, nothing otherwise -- and Table 140-3 makes that height-banded, with the pod always in the taller band. NOT ENCODED, on purpose. (1) The inclusionary-housing bonus raises FAR from 3 to 5 (#L593); it is earned. (2) Table 140-3 note [1] disapplies the residential setbacks against lots in the RX zone (#L631), which is a third state of the neighbour fact this screen does not hold. (3) Ground-floor window standards apply in EX (#L616) and are a facade rule, not a fit one.'
