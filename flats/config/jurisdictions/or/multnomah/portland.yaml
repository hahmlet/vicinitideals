  CM2:
    entrance_faces_street:
      value: required
      cite: "Portland PCC 33.130.250 Main Entrances: facing the street, at up to 45 degrees, or opening onto a porch (FOLLOWUPS 153; the pod's doors stay on its 80 ft face and it takes none of the alternatives, rulings.yaml 2026-11-08-no-porch-end-door)"
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-09-28'
      quote: "or/multnomah/portland/33.130/33.130.250.txt#L11-L14,L17-L32"
      variants:
        # PCC 33.532.250 (Hayden Island plan district, which controls over
        # the base zone, 33.500.040): at least one main entrance faces the
        # street or stands within 45 degrees of it, no porch alternative;
        # on a site with more than one street, the Island Core Access
        # Street of Map 532-3, which is not stored (FOLLOWUPS 153 round 2).
        - value: required_named
          when: [pdx_hayden_island]
          cite: PCC 33.532.250.B-C, Hayden Island main entrance, facing the street or at up to 45 degrees, the Core Access Street on a site with frontage on more than one
          quote: "or/multnomah/portland/33.532.txt#L232-L248"
    entrance_angle_max_deg:
      value: 45
      cite: "Portland PCC 33.130.250 Main Entrances: \"(2) Be at an angle of up to 45 degrees from the street; or\" -- the angle the main entrance may stand off the street (rel4 move-read finding 2)"
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-09-28'
      quote: "or/multnomah/portland/33.130/33.130.250.txt#L23"
    cite_default:
      cite: PCC 33.130 — Table 130-1 (33.130.100 Primary Uses), 33.130.200 Lot Size, Table 130-2 (Summary of Development Standards in Commercial/Mixed Use Zones), 33.130.215 Setbacks, 33.130.220 Building Coverage, 33.130.225 Landscaped Areas, 33.130.250 General Requirements for Small Housing Types
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-08-19'
    # Table 266-1 sends every zone but EX to Standard B, and Standard B states
    # no maximum for Household Living -- "except 1.35 per unit on sites that
    # are in a commercial/mixed use or multi-dwelling zone". This zone is one
    # of the twelve inside that exception: the six multi-dwelling zones listed
    # at 33.120.020 and the six commercial/mixed use zones listed at
    # 33.130.020. Everywhere else in the city there is no ceiling at all,
    # which is what the layer default says.
    #
    # A maximum binds the building rather than the lot, and it is the one
    # direction this screen had no field for. The catalog pod asks 1.5 stalls
    # per unit; 1.35 of four units is five stalls, not six.
    parking_max_per_unit:
      value: 1.35
      cite: PCC 33.266.115; Tables 266-1 and 266-2
      url: "https://www.portland.gov/sites/default/files/code/266-parking_2.pdf"
      retrieved: 2026-08-21
      quote: "or/multnomah/portland/33.266/33.266.115.txt#L26,L38-L40,L42,L44"
      via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65"
      variants:
        # "Houses, attached houses and duplexes are exempt." Four townhouses
        # on four unit lots are four attached houses. The same building on one
        # lot is a fourplex, which that sentence does not name, so the plat
        # decides whether the ceiling exists.
        - exempt: true
          when: [unit_lots]
          quote: "or/multnomah/portland/33.266/33.266.115.txt#L44-L45"
          via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65"
    open_space_min_sqft:
      per_dwelling: 48
      cite: PCC 33.130 Table 130-2, Required Residential Outdoor Area; 33.130.228.B.1
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-08-27'
      quote: "or/multnomah/portland/33.130.txt#L587,L632-L633,L1192-L1197"
      variants:
        # The requirement is BANDED on total site area and this file held only
        # its upper half. 33.130.228.B.1 states both bands: 36 square feet per unit applies at
        # 20,000 sq ft or less, 48 above it -- and a four-unit pod's lot is
        # almost never over 20,000, so the flat 48 was asking nearly every
        # Portland site for a third more outdoor area than the code does.
        # Found 2026-09-07 by the blind second reading.
        - per_dwelling: 36
          band: {measure: lot_sqft, at_most: 20000}
          quote: "or/multnomah/portland/33.130/33.130.228.txt#L7-L8"
          via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65,L109-L110"
    quadplex_allowed:
      # Table 130-1, "Household Living", read across the header row: Y in
      # every commercial/mixed use zone. The housing type is named too --
      # 33.130.250.B.2.a applies the small-housing standards to "houses,
      # attached houses, manufactured homes, duplexes, attached duplexes,
      # triplexes, and fourplexes in the commercial/mixed use zones", which
      # is the chapter saying in its own words that a fourplex of attached
      # houses is a thing that gets built here.
      value: true
      quote: "or/multnomah/portland/33.130.txt#L332,L334,L1598-L1600"
      qualified_by:
        fact: pdx_plan_district_unmeasured
        cite: PCC 33.521.220.C, 33.521.290.C, 33.536.210.B, 33.536.240.C, 33.536.280.C.2, 33.536.300.C, 33.538.220.B, 33.545.100.C, 33.550.220, 33.561.270, 33.561.300, 33.563.220, 33.595.100.B.1, 33.595.210.C, 33.595.250.C, 33.595.270.B, 33.510.200.C.3, 33.510.210.B, 33.515.210, 33.515.230, 33.515.262, 33.526.220.B, 33.526.340.C, 33.532.220, 33.532.230.C, 33.532.245, 33.555.230, 33.562.100.B, 33.562.210, 33.562.220.B, 33.562.240.E and F, 33.567.040, 33.575.110, 33.580.110 and 33.580.130, and 33.530.050 (plan districts, which control over the base zone, 33.500.040) -- parking and driveways kept off named streets and light rail, required building lines, minimum floor area ratios printed only on a map or above the pod's on the lots they reach, residential use prohibited in Hollywood Subdistrict A and the West Portland Employment Focus Area, a rear setback of a quarter of the site depth, Macadam's wall-plane and light rail setbacks, the Linnton Hillside lot-of-record rule, and Glendoveer's flag-lot standards (15 ft on every lot line, 25 ft height); and residential use held to 20 percent of a building in part of Northwest, heights printed only on a map below the pod's, walls set parallel to Sandy Boulevard, Powell Boulevard's 8 ft sound wall, South Auditorium's landscaped street edge and tree rule, Hayden Island's commercial height step and floor area rules, and Columbia South Shore's Airport Way setback and archaeology rule. Nothing measures which street the court and drive face, the building line, the lot's history, or whether a lot is a flag lot; held only on the lots drawn_areas plan_district_unmeasured traces
        quote: "or/multnomah/portland/33.595.txt#L89,L171-L174,L393-L397,L438-L449"
    min_lot_sqft:
      # "There is no required minimum lot size for development of land in
      # commercial/mixed use zones." Not a minimum of zero -- the standard
      # does not exist. The sentence after it sends lot *creation* to Chapter
      # 33.613, which is a land-division rule and not a test an existing lot
      # has to pass to be built on.
      exempt: true
      quote: "or/multnomah/portland/33.130/33.130.200.txt#L1-L3"
      via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65"
    setback_front_ft:
      # Table 130-2 has three "Min. Building Setbacks" rows for a street lot
      # line, and in this zone the binding one is the third: "Street Lot Line
      # across a local street from an RF - RM2 or RMP Zone", 5 or 10 ft.
      # 33.130.215.B.1.b(1) gives the 5 to "buildings that are entirely in a
      # residential use", which the pod is, "from a street lot line facing an
      # RF through RM2 or RMP zone" (the 10 of B.1.b(2) is for all other
      # buildings). It is the base because the screen cannot rule it out for
      # the lot as a whole: the rule turns on the street's Transportation
      # System Plan class ("Local Service Street", 33.910) and on the zone
      # across it, per LINE, and neither the class nor the transit-street
      # exception ("or on or within 100 feet of a transit street") is held,
      # so every street is read as local -- the tight side. The plain row,
      # "Street Lot Line: none", is given back line by line on
      # setback_street_across_nonresidential_ft below. The corridor variant
      # (33.130.215.B.1.a, Map 130-1, flats/geom/corridor.py) still tightens
      # it to 10 on a lot with a street line on a stretch.
      value: 5
      quote: "or/multnomah/portland/33.130.txt#L587,L612-L613,L799-L805"
      via: "or/multnomah/portland/33.130/33.130.215.txt#L19-L23"
      variants:
        - value: 10
          when: [civic_corridor_setback]
          quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L87"
    setback_street_off_corridor_ft:
      # The same row as the base above, held per LINE (FOLLOWUPS 8(d)).
      # Table 130-2 states the corridor number for "Street Lot Line abutting
      # selected Civic Corridors" -- one line -- and the variant above can
      # only hand it to the whole lot: `civic_corridor_setback` is true when
      # ANY street line is on a Map 130-1 stretch, so the side street of a
      # corner lot on Division takes 10 too. That stays the reading for
      # every reader without edges. The envelope reads this field instead
      # on a street line read surely OFF every stretch
      # (flats/geom/corridor.py off_corridor: no point of the line on it by
      # either reading, every point placed on a street that is not the
      # corridor), and cuts that line alone at the zone's street number off
      # the corridor. A line the stretch ends part way along is not off, and
      # keeps 10. In this zone that number is the across-the-street 5 (see
      # setback_front_ft), not the plain "none": a line off the corridor can
      # still face a residential zone across a local street.
      value: 5
      quote: "or/multnomah/portland/33.130.txt#L587,L612-L613,L799-L805"
    setback_street_across_nonresidential_ft:
      # The plain row, "Street Lot Line: none", held per LINE for the one
      # street line it reaches here: off every Map 130-1 stretch AND facing
      # no RF-RM2 or RMP zone across the street (33.130.215.B.1: "Unless as
      # specified below, there is no minimum required setback from a street
      # lot line"). The envelope reads it only on a street edge flagged both
      # off_corridor and across_clear -- five rays square to the line, over
      # the right-of-way, each finding a Portland lot in a zone the
      # neighbours block puts on the false_for side of
      # faces_residential_zone_across_street (flats/geom/neighbour.py
      # street_lines_clear). A ray that finds a split-zone lot, another
      # city's lot, nothing within reach, or a lot nearer than a street's
      # width leaves the line on the 5.
      value: 0
      quote: "or/multnomah/portland/33.130.txt#L587,L609,L795-L796"
    setback_front_max_facade_pct:
      # Half the ground-level street-facing facade must stand within the
      # maximum, not the whole of it (33.130.215.C.1; FOLLOWUPS 147).
      value: 50
      quote: "or/multnomah/portland/33.130/33.130.215.txt#L76-L78"
    setback_front_max_streets:
      # Which streets the maximum reaches (33.130.215.C.2.c): on three or
      # more streets, the two with the highest transit street
      # classification; on a through lot, the one with the highest; on a
      # corner lot, then, both. The transit classification is not held, so
      # only a corner lot is read both ways; any other lot passes within the
      # maximum on every street, fails beyond it on every street, and is a
      # question between (FOLLOWUPS 147).
      value: corner_every
      quote: "or/multnomah/portland/33.130/33.130.215.txt#L76-L78,L84-L87"
    setback_front_max_ft:
      # A maximum, not a minimum: the building has to be within 10 ft of the
      # street lot line. This is the standard in the chapter most likely to
      # decide a pod, because it forbids the layout that a rear-court plan
      # reaches for first -- parking at the front, building set back behind
      # it.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L97-L98"
      variants:
        # The next row of the same table, and it runs the usual way: on a
        # Civic Corridor shown on Map 130-1 the building may stand up to 20
        # ft back instead of 10 (33.130.215.C.1, "except on Civic Corridors
        # shown on Map 130-1, where the maximum set back is 20 feet"). A
        # raised maximum LOOSENS, so it does not hang on
        # `civic_corridor_setback` -- that fact is true when ANY street line
        # is on a stretch, read either way on purpose, and would hand the 20
        # to the side street of a corner lot on Division. It hangs on the
        # EVERY-line partner, read by the street each line abuts; a corner
        # lot with one line off the corridor keeps 10 on both until a
        # per-line field exists. Min 10 and max 20 on the corridor leaves a
        # ten-foot band, and a pod at its minimum setback sits inside it.
        - value: 20
          when: [civic_corridor_setback_all_streets]
          quote: "or/multnomah/portland/33.130.txt#L587,L622-L623,L900-L902"
    setback_side_ft:
      # Two rows, one question, and the answer is the neighbour's zoning
      # rather than this lot's. 10 ft from a lot line abutting an RF through
      # RM4, RMP or IR zone; none from a lot line abutting OS, RX, C, E or I.
      # The 10 is the base because the fact is unmeasured and reading it the
      # other way is how a lot with a house behind it screens as buildable
      # to its own rear line.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L95"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L93"
    setback_rear_ft:
      # The same two rows. 33.130.215.B.2 draws no distinction between a side
      # and a rear lot line -- both are "a lot line that is not a street lot
      # line" -- so the rear standard is the side standard.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L95"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L93"
      qualified_by:
        fact: pdx_johnson_creek_unmeasured
        cite: PCC 33.537.130, 33.537.140.E and 33.537.160 (Johnson Creek Basin plan district, which controls over the base zone, 33.500.040) -- along a lot line abutting the Springwater Corridor a 20 ft landscaped buffer (10 ft in C zones) with no building, parking or paving in it, and no vehicle area within 20 ft of that line; in the South subdistrict a land division's density is cut by the slope class of its land; and where any of a site is in the Flood Risk Area a land division is prohibited (the whole site) or must put that part in a tract. Nothing measures which line abuts the corridor, the slope classes or the Flood Risk Area's share of the site; held on the lots drawn_areas johnson_creek_unmeasured traces (the corridor reach), and on the townhouse form also on those johnson_creek_land_division traces, since 140.E and 160 govern land divisions and planned developments only (33.537.010, density "is limited by applying special regulations to new land division proposals"), so they reach the pod as four unit lots and not as one building on the one lot (FOLLOWUPS 58, 2026-11-08)
        quote: "or/multnomah/portland/33.537.txt#L30-L31,L46-L54,L264-L266,L271-L273,L283-L296,L326-L363,L387-L394"
    parking_lot_line_buffer_ft:
      # FOLLOWUPS 171 (2026-11-09). 33.130.215.B.2.b: the 10 ft setback from a
      # lot line abutting an RF through RM4, RMP or IR zone "must be landscaped
      # to the L3 standard" (33.248.020.C: a 6 ft evergreen screen, trees, and
      # ground cover over the rest), and only "areas paved for pedestrian or
      # bicycle use" may stand in it -- so no court, stall or drive aisle.
      # Table 130-2 prints the same strip for all six zones, "Landscape Buffer
      # Abutting an RF - RM4 or RMP Zoned Lot ... 10 ft. @ L3"; the row leaves
      # IR out and the text puts it in, and the text is the wider. Neither
      # exception lifts it: (2) is for buildings 15 ft or less (the pod is
      # 26), and (3) keeps the first 10 ft landscaped under both. Same fact
      # as the side and rear setbacks: 0 only where EVERY non-street line is
      # read and nothing across it is residential; one residential or unread
      # line keeps the strip on every non-street line, the tightening way to
      # be coarse until the strip is read per line.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L107-L108"
      via: "or/multnomah/portland/33.130/33.130.215.txt#L44-L46,L48-L49"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130/33.130.215.txt#L42"
    # PCC 33.537 (Johnson Creek Basin plan district, FOLLOWUPS 109 part 1):
    # the base zone caps building coverage only; 33.537.140.D and 150.E cap
    # impervious surface (buildings and paving, eaves included) at 50 percent
    # on sites in the South subdistrict or with any portion in the combined
    # flood hazard area, and nowhere else (33.537.020).
    max_impervious_pct:
      exempt: true
      cite: PCC 33.537.020, the plan district's impervious surface limit applies only in the South subdistrict and on sites with any portion in the combined flood hazard area; the base zone states none
      quote: "or/multnomah/portland/33.537.txt#L43-L45,L46-L54"
      variants:
        - value: 50
          when: [pdx_johnson_creek_impervious]
          cite: PCC 33.537.140.D and 33.537.150.E, no more than 50 percent of any site may be developed in impervious surface; building eaves are included
          quote: "or/multnomah/portland/33.537.txt#L323-L325,L384-L386"
    max_height_ft:
      # Table 130-2, "Base Height". The row prints all six cells on one line,
      # so the header is quoted with it and position is what names the column
      # -- CR, CM1, CM2, CM3, CE, CX.
      value: 45
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L74"
    max_far:
      value: 2.5
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65-L66"
    max_coverage_pct:
      # Two rows, and which one applies is a pattern area on Map 130-2 that
      # this screen does not read. The Eastern/Western/River figure is
      # encoded because it is the lower of the two; the Inner Pattern Area
      # allows 100 percent on the same lot.
      value: 85
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L102-L103"
    min_landscaped_pct:
      value: 15
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L105"
    orientation_constraint:
      # 33.130.250.B.3: at least one main entrance must be within 8 feet of
      # the longest street-facing wall, and must face the street, sit at up
      # to 45 degrees from it, or open onto a porch. That binds the entrance
      # and leaves the building's long axis free, which is what
      # `entrance_only` means. Flag lots and lots averaging 20 percent slope
      # or steeper are exempt (#L1711-L1712) -- both are conditions this
      # screen could evaluate and neither is encoded as a variant yet.
      value: entrance_only
      quote: "or/multnomah/portland/33.130/33.130.250.txt#L19-L23"
      via: "or/multnomah/portland/33.130/33.130.250.txt#L10-L11"
    min_density_du_per_acre:
      # Table 130-2 states it as an area per unit rather than a rate, and
      # `sqft_per_unit` carries the printed operand so nothing has to divide
      # to compare. 33.130.207.B applies it to new development proposing at
      # least one dwelling unit. Land within an Environmental zone may be
      # subtracted from the calculation, which lowers the floor and is not
      # encoded -- the overlay is not held here.
      sqft_per_unit: 1450
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L71-L73"
    notes: 'Commercial/mixed use. Household Living is a plain Y in Table 130-1 and 33.130.200 states there is no required minimum lot size for development, so the two standards that most often decide a small lot do not exist here. What binds instead is the shape: a maximum front setback of 10 ft puts the building at the street, and side and rear setbacks turn on the zoning of the lot next door rather than on anything in this parcel''s record. NOT ENCODED, on purpose. (1) The step-down heights in Table 130-2 (#L628-L635) drop the ceiling to 35 or 45 ft near lower-scale residential zones. Both clear a 26 ft pod, so encoding a fact nobody measures would cost a lookup and move no verdict. (2) The 5/10 ft street setback across a local service street from an RF-RM2 or RMP zone (33.130.215.B.1.b) is held per line on its tight side: the 5 ft row (a building entirely in residential use) is the street number on every street line, and the plain none row (setback_street_across_nonresidential_ft) goes back only to a line off the corridor whose five rays across the street all found a Portland zone off the RF-RM2/RMP list. Held back, because each relaxes and needs data this screen lacks: the street''s Transportation System Plan class (only a Local Service Traffic Street triggers the rule, 33.910; RLIS TYPE is Metro''s regional class, not the TSP''s) and the exception on or within 100 ft of a transit street. Refused as well: the same paragraph bars vehicle access through that setback unless the facing street is the site''s only frontage (#L843-L845), and the screen does not yet say which street line the driveway crosses. (3) Bonus FAR and bonus height (Table 130-3) are earned, not given. (4) The garage standards in 33.130.250.D are stated relative to the dwelling''s own street-facing wall rather than to a lot line, so they are a massing rule this field set cannot hold. (5) Maximum building length of 200 ft (33.130.222.B) is far above anything a four-unit pod reaches.'
    min_far:
      # PCC 33.526.220.C (Gateway) and 33.521.220.C (East Corridor): the
      # minimum FAR for new development is shown on Map 526-3 and Map 521-3,
      # and each map prints it only as the bracketed figure under the 4:1
      # maximum -- (.25:1) in Gateway, (.5:1) and (1:1) in East Corridor.
      # The chapters' text carries no number and the map pages have no text
      # layer, so the variants are drawn figures, read off the 11/1/26 sheets
      # (FOLLOWUPS 109 pd2c). Which lot is in which area is the City's own
      # layer 50 (gateway-min-far, east-corridor-min-far-half/-one), matched
      # to the sheets; a lot the line cuts is unanswered and YELLOW.
      # Outside the mapped areas this zone states no minimum FAR (whole-corpus
      # grep, 2026-11-04: only plan districts and 33.415 do). The other plan
      # district minimums ride the pdx_plan_district_unmeasured hold and the
      # 33.415 Main Street minimum is pdx_overlays.py's, so none rests on this
      # exemption. A miss is YELLOW with the FAR-MIN flag (SOFT_FLOOR_CHECKS,
      # coordinator 2026-10-29): a bigger building could meet it.
      exempt: true
      quote: "or/multnomah/portland/33.521.txt#L126-L127"
      variants:
        - value: 0.25
          when: [pdx_gateway_min_far]
          cite: PCC 33.526.220.C; Map 526-3 Floor Area Ratios, "4:1 (.25:1)"
          url: https://www.portland.gov/sites/default/files/code/526-gateway-pd_2.pdf
          retrieved: '2026-11-04'
          # A drawn figure has no text to quote: the base's quote is not this figure's.
          quote: null
          drawn: true
          read_by: flats-encoder pd2c (Opus)
          read_on: '2026-11-04'
        - value: 0.5
          when: [pdx_east_corridor_min_far_half]
          cite: PCC 33.521.220.C; Map 521-3 Floor Area Ratios, "4:1 (.5:1)"
          url: https://www.portland.gov/sites/default/files/code/521-east-corridor-pd_1.pdf
          retrieved: '2026-11-04'
          # A drawn figure has no text to quote: the base's quote is not this figure's.
          quote: null
          drawn: true
          read_by: flats-encoder pd2c (Opus)
          read_on: '2026-11-04'
        - value: 1.0
          when: [pdx_east_corridor_min_far_one]
          cite: PCC 33.521.220.C; Map 521-3 Floor Area Ratios, "4:1 (1:1)"
          url: https://www.portland.gov/sites/default/files/code/521-east-corridor-pd_1.pdf
          retrieved: '2026-11-04'
          # A drawn figure has no text to quote: the base's quote is not this figure's.
          quote: null
          drawn: true
          read_by: flats-encoder pd2c (Opus)
          read_on: '2026-11-04'
  CM3:
    entrance_faces_street:
      value: required
      cite: "Portland PCC 33.130.250 Main Entrances: facing the street, at up to 45 degrees, or opening onto a porch (FOLLOWUPS 153; the pod's doors stay on its 80 ft face and it takes none of the alternatives, rulings.yaml 2026-11-08-no-porch-end-door)"
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-09-28'
      quote: "or/multnomah/portland/33.130/33.130.250.txt#L11-L14,L17-L32"
      variants:
        # PCC 33.532.250 (Hayden Island plan district, which controls over
        # the base zone, 33.500.040): at least one main entrance faces the
        # street or stands within 45 degrees of it, no porch alternative;
        # on a site with more than one street, the Island Core Access
        # Street of Map 532-3, which is not stored (FOLLOWUPS 153 round 2).
        - value: required_named
          when: [pdx_hayden_island]
          cite: PCC 33.532.250.B-C, Hayden Island main entrance, facing the street or at up to 45 degrees, the Core Access Street on a site with frontage on more than one
          quote: "or/multnomah/portland/33.532.txt#L232-L248"
    entrance_angle_max_deg:
      value: 45
      cite: "Portland PCC 33.130.250 Main Entrances: \"(2) Be at an angle of up to 45 degrees from the street; or\" -- the angle the main entrance may stand off the street (rel4 move-read finding 2)"
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-09-28'
      quote: "or/multnomah/portland/33.130/33.130.250.txt#L23"
    cite_default:
      cite: PCC 33.130 — Table 130-1 (33.130.100 Primary Uses), 33.130.200 Lot Size, Table 130-2 (Summary of Development Standards in Commercial/Mixed Use Zones), 33.130.215 Setbacks, 33.130.220 Building Coverage, 33.130.225 Landscaped Areas, 33.130.250 General Requirements for Small Housing Types
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-08-19'
    # Table 266-1 sends every zone but EX to Standard B, and Standard B states
    # no maximum for Household Living -- "except 1.35 per unit on sites that
    # are in a commercial/mixed use or multi-dwelling zone". This zone is one
    # of the twelve inside that exception: the six multi-dwelling zones listed
    # at 33.120.020 and the six commercial/mixed use zones listed at
    # 33.130.020. Everywhere else in the city there is no ceiling at all,
    # which is what the layer default says.
    #
    # A maximum binds the building rather than the lot, and it is the one
    # direction this screen had no field for. The catalog pod asks 1.5 stalls
    # per unit; 1.35 of four units is five stalls, not six.
    parking_max_per_unit:
      value: 1.35
      cite: PCC 33.266.115; Tables 266-1 and 266-2
      url: "https://www.portland.gov/sites/default/files/code/266-parking_2.pdf"
      retrieved: 2026-08-21
      quote: "or/multnomah/portland/33.266/33.266.115.txt#L26,L38-L40,L42,L44"
      via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65"
      variants:
        # "Houses, attached houses and duplexes are exempt." Four townhouses
        # on four unit lots are four attached houses. The same building on one
        # lot is a fourplex, which that sentence does not name, so the plat
        # decides whether the ceiling exists.
        - exempt: true
          when: [unit_lots]
          quote: "or/multnomah/portland/33.266/33.266.115.txt#L44-L45"
          via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65"
    open_space_min_sqft:
      per_dwelling: 48
      cite: PCC 33.130 Table 130-2, Required Residential Outdoor Area; 33.130.228.B.1
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-08-27'
      quote: "or/multnomah/portland/33.130.txt#L587,L632-L633,L1192-L1197"
      variants:
        # The requirement is BANDED on total site area and this file held only
        # its upper half. 33.130.228.B.1 states both bands: 36 square feet per unit applies at
        # 20,000 sq ft or less, 48 above it -- and a four-unit pod's lot is
        # almost never over 20,000, so the flat 48 was asking nearly every
        # Portland site for a third more outdoor area than the code does.
        # Found 2026-09-07 by the blind second reading.
        - per_dwelling: 36
          band: {measure: lot_sqft, at_most: 20000}
          quote: "or/multnomah/portland/33.130/33.130.228.txt#L7-L8"
          via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65,L109-L110"
    quadplex_allowed:
      # Table 130-1, "Household Living", read across the header row: Y in
      # every commercial/mixed use zone. The housing type is named too --
      # 33.130.250.B.2.a applies the small-housing standards to "houses,
      # attached houses, manufactured homes, duplexes, attached duplexes,
      # triplexes, and fourplexes in the commercial/mixed use zones", which
      # is the chapter saying in its own words that a fourplex of attached
      # houses is a thing that gets built here.
      value: true
      quote: "or/multnomah/portland/33.130.txt#L332,L334,L1598-L1600"
      variants:
        # Northwest plan district, Map 562-2 (FOLLOWUPS 109 batch B, ruled by
        # the coordinator 2026-11-04 under the three-tier rule): "up to 20
        # percent of the net building area may be in Residential uses. More
        # than 20 percent is prohibited." A four-home building is all
        # Residential, so a flat prohibition: RED on a lot inside, YELLOW on
        # one the line cuts (the drawn fact is unanswered there).
        - value: false
          when: [pdx_nw_residential_limited]
          cite: PCC 33.562.100.B (plan districts control over the base zone, 33.500.040)
          url: https://www.portland.gov/sites/default/files/code/562-northwest-pd_0.pdf
          retrieved: '2026-10-22'
          quote: "or/multnomah/portland/33.562.txt#L62-L63"
      qualified_by:
        fact: pdx_plan_district_unmeasured
        cite: PCC 33.521.220.C, 33.521.290.C, 33.536.210.B, 33.536.240.C, 33.536.280.C.2, 33.536.300.C, 33.538.220.B, 33.545.100.C, 33.550.220, 33.561.270, 33.561.300, 33.563.220, 33.595.100.B.1, 33.595.210.C, 33.595.250.C, 33.595.270.B, 33.510.200.C.3, 33.510.210.B, 33.515.210, 33.515.230, 33.515.262, 33.526.220.B, 33.526.340.C, 33.532.220, 33.532.230.C, 33.532.245, 33.555.230, 33.562.100.B, 33.562.210, 33.562.220.B, 33.562.240.E and F, 33.567.040, 33.575.110, 33.580.110 and 33.580.130, and 33.530.050 (plan districts, which control over the base zone, 33.500.040) -- parking and driveways kept off named streets and light rail, required building lines, minimum floor area ratios printed only on a map or above the pod's on the lots they reach, residential use prohibited in Hollywood Subdistrict A and the West Portland Employment Focus Area, a rear setback of a quarter of the site depth, Macadam's wall-plane and light rail setbacks, the Linnton Hillside lot-of-record rule, and Glendoveer's flag-lot standards (15 ft on every lot line, 25 ft height); and residential use held to 20 percent of a building in part of Northwest, heights printed only on a map below the pod's, walls set parallel to Sandy Boulevard, Powell Boulevard's 8 ft sound wall, South Auditorium's landscaped street edge and tree rule, Hayden Island's commercial height step and floor area rules, and Columbia South Shore's Airport Way setback and archaeology rule. Nothing measures which street the court and drive face, the building line, the lot's history, or whether a lot is a flag lot; held only on the lots drawn_areas plan_district_unmeasured traces
        quote: "or/multnomah/portland/33.595.txt#L89,L171-L174,L393-L397,L438-L449"
    min_lot_sqft:
      # "There is no required minimum lot size for development of land in
      # commercial/mixed use zones." Not a minimum of zero -- the standard
      # does not exist. The sentence after it sends lot *creation* to Chapter
      # 33.613, which is a land-division rule and not a test an existing lot
      # has to pass to be built on.
      exempt: true
      quote: "or/multnomah/portland/33.130/33.130.200.txt#L1-L3"
      via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65"
    setback_front_ft:
      # Table 130-2 has three "Min. Building Setbacks" rows for a street lot
      # line, and in this zone the binding one is the third: "Street Lot Line
      # across a local street from an RF - RM2 or RMP Zone", 5 or 10 ft.
      # 33.130.215.B.1.b(1) gives the 5 to "buildings that are entirely in a
      # residential use", which the pod is, "from a street lot line facing an
      # RF through RM2 or RMP zone" (the 10 of B.1.b(2) is for all other
      # buildings). It is the base because the screen cannot rule it out for
      # the lot as a whole: the rule turns on the street's Transportation
      # System Plan class ("Local Service Street", 33.910) and on the zone
      # across it, per LINE, and neither the class nor the transit-street
      # exception ("or on or within 100 feet of a transit street") is held,
      # so every street is read as local -- the tight side. The plain row,
      # "Street Lot Line: none", is given back line by line on
      # setback_street_across_nonresidential_ft below. The corridor variant
      # (33.130.215.B.1.a, Map 130-1, flats/geom/corridor.py) still tightens
      # it to 10 on a lot with a street line on a stretch.
      value: 5
      quote: "or/multnomah/portland/33.130.txt#L587,L612-L613,L799-L805"
      via: "or/multnomah/portland/33.130/33.130.215.txt#L19-L23"
      variants:
        - value: 10
          when: [civic_corridor_setback]
          quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L87"
      qualified_by:
        fact: pdx_special_building_setback
        cite: PCC 33.540.030 (Laurelhurst/Eastmoreland plan district, which controls over the base zone, 33.500.040) -- the required building setbacks are on the Special Building Setbacks maps at the Development Services Center, which are not published, so the setback that governs here is unread; held only inside the two districts (drawn_areas laurelhurst_eastmoreland)
        quote: "or/multnomah/portland/33.540.txt#L23-L25"
    setback_street_off_corridor_ft:
      # The same row as the base above, held per LINE (FOLLOWUPS 8(d)).
      # Table 130-2 states the corridor number for "Street Lot Line abutting
      # selected Civic Corridors" -- one line -- and the variant above can
      # only hand it to the whole lot: `civic_corridor_setback` is true when
      # ANY street line is on a Map 130-1 stretch, so the side street of a
      # corner lot on Division takes 10 too. That stays the reading for
      # every reader without edges. The envelope reads this field instead
      # on a street line read surely OFF every stretch
      # (flats/geom/corridor.py off_corridor: no point of the line on it by
      # either reading, every point placed on a street that is not the
      # corridor), and cuts that line alone at the zone's street number off
      # the corridor. A line the stretch ends part way along is not off, and
      # keeps 10. In this zone that number is the across-the-street 5 (see
      # setback_front_ft), not the plain "none": a line off the corridor can
      # still face a residential zone across a local street.
      value: 5
      quote: "or/multnomah/portland/33.130.txt#L587,L612-L613,L799-L805"
    setback_street_across_nonresidential_ft:
      # The plain row, "Street Lot Line: none", held per LINE for the one
      # street line it reaches here: off every Map 130-1 stretch AND facing
      # no RF-RM2 or RMP zone across the street (33.130.215.B.1: "Unless as
      # specified below, there is no minimum required setback from a street
      # lot line"). The envelope reads it only on a street edge flagged both
      # off_corridor and across_clear -- five rays square to the line, over
      # the right-of-way, each finding a Portland lot in a zone the
      # neighbours block puts on the false_for side of
      # faces_residential_zone_across_street (flats/geom/neighbour.py
      # street_lines_clear). A ray that finds a split-zone lot, another
      # city's lot, nothing within reach, or a lot nearer than a street's
      # width leaves the line on the 5.
      value: 0
      quote: "or/multnomah/portland/33.130.txt#L587,L609,L795-L796"
    setback_front_max_facade_pct:
      # Half the ground-level street-facing facade must stand within the
      # maximum, not the whole of it (33.130.215.C.1; FOLLOWUPS 147).
      value: 50
      quote: "or/multnomah/portland/33.130/33.130.215.txt#L76-L78"
    setback_front_max_streets:
      # Which streets the maximum reaches (33.130.215.C.2.c): on three or
      # more streets, the two with the highest transit street
      # classification; on a through lot, the one with the highest; on a
      # corner lot, then, both. The transit classification is not held, so
      # only a corner lot is read both ways; any other lot passes within the
      # maximum on every street, fails beyond it on every street, and is a
      # question between (FOLLOWUPS 147).
      value: corner_every
      quote: "or/multnomah/portland/33.130/33.130.215.txt#L76-L78,L84-L87"
    setback_front_max_ft:
      # A maximum, not a minimum: the building has to be within 10 ft of the
      # street lot line. This is the standard in the chapter most likely to
      # decide a pod, because it forbids the layout that a rear-court plan
      # reaches for first -- parking at the front, building set back behind
      # it.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L97-L98"
      variants:
        # The next row of the same table, and it runs the usual way: on a
        # Civic Corridor shown on Map 130-1 the building may stand up to 20
        # ft back instead of 10 (33.130.215.C.1, "except on Civic Corridors
        # shown on Map 130-1, where the maximum set back is 20 feet"). A
        # raised maximum LOOSENS, so it does not hang on
        # `civic_corridor_setback` -- that fact is true when ANY street line
        # is on a stretch, read either way on purpose, and would hand the 20
        # to the side street of a corner lot on Division. It hangs on the
        # EVERY-line partner, read by the street each line abuts; a corner
        # lot with one line off the corridor keeps 10 on both until a
        # per-line field exists. Min 10 and max 20 on the corridor leaves a
        # ten-foot band, and a pod at its minimum setback sits inside it.
        - value: 20
          when: [civic_corridor_setback_all_streets]
          quote: "or/multnomah/portland/33.130.txt#L587,L622-L623,L900-L902"
    setback_side_ft:
      # Two rows, one question, and the answer is the neighbour's zoning
      # rather than this lot's. 10 ft from a lot line abutting an RF through
      # RM4, RMP or IR zone; none from a lot line abutting OS, RX, C, E or I.
      # The 10 is the base because the fact is unmeasured and reading it the
      # other way is how a lot with a house behind it screens as buildable
      # to its own rear line.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L95"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L93"
    setback_rear_ft:
      # The same two rows. 33.130.215.B.2 draws no distinction between a side
      # and a rear lot line -- both are "a lot line that is not a street lot
      # line" -- so the rear standard is the side standard.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L95"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L93"
      qualified_by:
        fact: pdx_johnson_creek_unmeasured
        cite: PCC 33.537.130, 33.537.140.E and 33.537.160 (Johnson Creek Basin plan district, which controls over the base zone, 33.500.040) -- along a lot line abutting the Springwater Corridor a 20 ft landscaped buffer (10 ft in C zones) with no building, parking or paving in it, and no vehicle area within 20 ft of that line; in the South subdistrict a land division's density is cut by the slope class of its land; and where any of a site is in the Flood Risk Area a land division is prohibited (the whole site) or must put that part in a tract. Nothing measures which line abuts the corridor, the slope classes or the Flood Risk Area's share of the site; held on the lots drawn_areas johnson_creek_unmeasured traces (the corridor reach), and on the townhouse form also on those johnson_creek_land_division traces, since 140.E and 160 govern land divisions and planned developments only (33.537.010, density "is limited by applying special regulations to new land division proposals"), so they reach the pod as four unit lots and not as one building on the one lot (FOLLOWUPS 58, 2026-11-08)
        quote: "or/multnomah/portland/33.537.txt#L30-L31,L46-L54,L264-L266,L271-L273,L283-L296,L326-L363,L387-L394"
    parking_lot_line_buffer_ft:
      # FOLLOWUPS 171 (2026-11-09). 33.130.215.B.2.b: the 10 ft setback from a
      # lot line abutting an RF through RM4, RMP or IR zone "must be landscaped
      # to the L3 standard" (33.248.020.C: a 6 ft evergreen screen, trees, and
      # ground cover over the rest), and only "areas paved for pedestrian or
      # bicycle use" may stand in it -- so no court, stall or drive aisle.
      # Table 130-2 prints the same strip for all six zones, "Landscape Buffer
      # Abutting an RF - RM4 or RMP Zoned Lot ... 10 ft. @ L3"; the row leaves
      # IR out and the text puts it in, and the text is the wider. Neither
      # exception lifts it: (2) is for buildings 15 ft or less (the pod is
      # 26), and (3) keeps the first 10 ft landscaped under both. Same fact
      # as the side and rear setbacks: 0 only where EVERY non-street line is
      # read and nothing across it is residential; one residential or unread
      # line keeps the strip on every non-street line, the tightening way to
      # be coarse until the strip is read per line.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L107-L108"
      via: "or/multnomah/portland/33.130/33.130.215.txt#L44-L46,L48-L49"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130/33.130.215.txt#L42"
    # PCC 33.537 (Johnson Creek Basin plan district, FOLLOWUPS 109 part 1):
    # the base zone caps building coverage only; 33.537.140.D and 150.E cap
    # impervious surface (buildings and paving, eaves included) at 50 percent
    # on sites in the South subdistrict or with any portion in the combined
    # flood hazard area, and nowhere else (33.537.020).
    max_impervious_pct:
      exempt: true
      cite: PCC 33.537.020, the plan district's impervious surface limit applies only in the South subdistrict and on sites with any portion in the combined flood hazard area; the base zone states none
      quote: "or/multnomah/portland/33.537.txt#L43-L45,L46-L54"
      variants:
        - value: 50
          when: [pdx_johnson_creek_impervious]
          cite: PCC 33.537.140.D and 33.537.150.E, no more than 50 percent of any site may be developed in impervious surface; building eaves are included
          quote: "or/multnomah/portland/33.537.txt#L323-L325,L384-L386"
    max_height_ft:
      # Table 130-2, "Base Height". The row prints all six cells on one line,
      # so the header is quoted with it and position is what names the column
      # -- CR, CM1, CM2, CM3, CE, CX.
      value: 65
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L74"
    max_far:
      value: 3.0
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65-L66"
    max_coverage_pct:
      # Two rows, and which one applies is a pattern area on Map 130-2 that
      # this screen does not read. The Eastern/Western/River figure is
      # encoded because it is the lower of the two; the Inner Pattern Area
      # allows 100 percent on the same lot.
      value: 85
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L102-L103"
    min_landscaped_pct:
      value: 15
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L105"
    orientation_constraint:
      # 33.130.250.B.3: at least one main entrance must be within 8 feet of
      # the longest street-facing wall, and must face the street, sit at up
      # to 45 degrees from it, or open onto a porch. That binds the entrance
      # and leaves the building's long axis free, which is what
      # `entrance_only` means. Flag lots and lots averaging 20 percent slope
      # or steeper are exempt (#L1711-L1712) -- both are conditions this
      # screen could evaluate and neither is encoded as a variant yet.
      value: entrance_only
      quote: "or/multnomah/portland/33.130/33.130.250.txt#L19-L23"
      via: "or/multnomah/portland/33.130/33.130.250.txt#L10-L11"
    min_density_du_per_acre:
      # Table 130-2 states it as an area per unit rather than a rate, and
      # `sqft_per_unit` carries the printed operand so nothing has to divide
      # to compare. 33.130.207.B applies it to new development proposing at
      # least one dwelling unit. Land within an Environmental zone may be
      # subtracted from the calculation, which lowers the floor and is not
      # encoded -- the overlay is not held here.
      sqft_per_unit: 1000
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L71-L73"
    notes: 'Commercial/mixed use. Household Living is a plain Y in Table 130-1 and 33.130.200 states there is no required minimum lot size for development, so the two standards that most often decide a small lot do not exist here. What binds instead is the shape: a maximum front setback of 10 ft puts the building at the street, and side and rear setbacks turn on the zoning of the lot next door rather than on anything in this parcel''s record. NOT ENCODED, on purpose. (1) The step-down heights in Table 130-2 (#L628-L635) drop the ceiling to 35 or 45 ft near lower-scale residential zones. Both clear a 26 ft pod, so encoding a fact nobody measures would cost a lookup and move no verdict. (2) The 5/10 ft street setback across a local service street from an RF-RM2 or RMP zone (33.130.215.B.1.b) is held per line on its tight side: the 5 ft row (a building entirely in residential use) is the street number on every street line, and the plain none row (setback_street_across_nonresidential_ft) goes back only to a line off the corridor whose five rays across the street all found a Portland zone off the RF-RM2/RMP list. Held back, because each relaxes and needs data this screen lacks: the street''s Transportation System Plan class (only a Local Service Traffic Street triggers the rule, 33.910; RLIS TYPE is Metro''s regional class, not the TSP''s) and the exception on or within 100 ft of a transit street. Refused as well: the same paragraph bars vehicle access through that setback unless the facing street is the site''s only frontage (#L843-L845), and the screen does not yet say which street line the driveway crosses. (3) Bonus FAR and bonus height (Table 130-3) are earned, not given. (4) The garage standards in 33.130.250.D are stated relative to the dwelling''s own street-facing wall rather than to a lot line, so they are a massing rule this field set cannot hold. (5) Maximum building length of 200 ft (33.130.222.B) is far above anything a four-unit pod reaches.'
    min_far:
      # PCC 33.526.220.C (Gateway) and 33.521.220.C (East Corridor): the
      # minimum FAR for new development is shown on Map 526-3 and Map 521-3,
      # and each map prints it only as the bracketed figure under the 4:1
      # maximum -- (.25:1) in Gateway, (.5:1) and (1:1) in East Corridor.
      # The chapters' text carries no number and the map pages have no text
      # layer, so the variants are drawn figures, read off the 11/1/26 sheets
      # (FOLLOWUPS 109 pd2c). Which lot is in which area is the City's own
      # layer 50 (gateway-min-far, east-corridor-min-far-half/-one), matched
      # to the sheets; a lot the line cuts is unanswered and YELLOW.
      # Outside the mapped areas this zone states no minimum FAR (whole-corpus
      # grep, 2026-11-04: only plan districts and 33.415 do). The other plan
      # district minimums ride the pdx_plan_district_unmeasured hold and the
      # 33.415 Main Street minimum is pdx_overlays.py's, so none rests on this
      # exemption. A miss is YELLOW with the FAR-MIN flag (SOFT_FLOOR_CHECKS,
      # coordinator 2026-10-29): a bigger building could meet it.
      exempt: true
      quote: "or/multnomah/portland/33.521.txt#L126-L127"
      variants:
        - value: 0.25
          when: [pdx_gateway_min_far]
          cite: PCC 33.526.220.C; Map 526-3 Floor Area Ratios, "4:1 (.25:1)"
          url: https://www.portland.gov/sites/default/files/code/526-gateway-pd_2.pdf
          retrieved: '2026-11-04'
          # A drawn figure has no text to quote: the base's quote is not this figure's.
          quote: null
          drawn: true
          read_by: flats-encoder pd2c (Opus)
          read_on: '2026-11-04'
        - value: 0.5
          when: [pdx_east_corridor_min_far_half]
          cite: PCC 33.521.220.C; Map 521-3 Floor Area Ratios, "4:1 (.5:1)"
          url: https://www.portland.gov/sites/default/files/code/521-east-corridor-pd_1.pdf
          retrieved: '2026-11-04'
          # A drawn figure has no text to quote: the base's quote is not this figure's.
          quote: null
          drawn: true
          read_by: flats-encoder pd2c (Opus)
          read_on: '2026-11-04'
        - value: 1.0
          when: [pdx_east_corridor_min_far_one]
          cite: PCC 33.521.220.C; Map 521-3 Floor Area Ratios, "4:1 (1:1)"
          url: https://www.portland.gov/sites/default/files/code/521-east-corridor-pd_1.pdf
          retrieved: '2026-11-04'
          # A drawn figure has no text to quote: the base's quote is not this figure's.
          quote: null
          drawn: true
          read_by: flats-encoder pd2c (Opus)
          read_on: '2026-11-04'
  CE:
    entrance_faces_street:
      value: required
      cite: "Portland PCC 33.130.250 Main Entrances: facing the street, at up to 45 degrees, or opening onto a porch (FOLLOWUPS 153; the pod's doors stay on its 80 ft face and it takes none of the alternatives, rulings.yaml 2026-11-08-no-porch-end-door)"
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-09-28'
      quote: "or/multnomah/portland/33.130/33.130.250.txt#L11-L14,L17-L32"
      variants:
        # PCC 33.532.250 (Hayden Island plan district, which controls over
        # the base zone, 33.500.040): at least one main entrance faces the
        # street or stands within 45 degrees of it, no porch alternative;
        # on a site with more than one street, the Island Core Access
        # Street of Map 532-3, which is not stored (FOLLOWUPS 153 round 2).
        - value: required_named
          when: [pdx_hayden_island]
          cite: PCC 33.532.250.B-C, Hayden Island main entrance, facing the street or at up to 45 degrees, the Core Access Street on a site with frontage on more than one
          quote: "or/multnomah/portland/33.532.txt#L232-L248"
    entrance_angle_max_deg:
      value: 45
      cite: "Portland PCC 33.130.250 Main Entrances: \"(2) Be at an angle of up to 45 degrees from the street; or\" -- the angle the main entrance may stand off the street (rel4 move-read finding 2)"
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-09-28'
      quote: "or/multnomah/portland/33.130/33.130.250.txt#L23"
    cite_default:
      cite: PCC 33.130 — Table 130-1 (33.130.100 Primary Uses), 33.130.200 Lot Size, Table 130-2 (Summary of Development Standards in Commercial/Mixed Use Zones), 33.130.215 Setbacks, 33.130.220 Building Coverage, 33.130.225 Landscaped Areas, 33.130.250 General Requirements for Small Housing Types
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-08-19'
    # Table 266-1 sends every zone but EX to Standard B, and Standard B states
    # no maximum for Household Living -- "except 1.35 per unit on sites that
    # are in a commercial/mixed use or multi-dwelling zone". This zone is one
    # of the twelve inside that exception: the six multi-dwelling zones listed
    # at 33.120.020 and the six commercial/mixed use zones listed at
    # 33.130.020. Everywhere else in the city there is no ceiling at all,
    # which is what the layer default says.
    #
    # A maximum binds the building rather than the lot, and it is the one
    # direction this screen had no field for. The catalog pod asks 1.5 stalls
    # per unit; 1.35 of four units is five stalls, not six.
    parking_max_per_unit:
      value: 1.35
      cite: PCC 33.266.115; Tables 266-1 and 266-2
      url: "https://www.portland.gov/sites/default/files/code/266-parking_2.pdf"
      retrieved: 2026-08-21
      quote: "or/multnomah/portland/33.266/33.266.115.txt#L26,L38-L40,L42,L44"
      via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65"
      variants:
        # "Houses, attached houses and duplexes are exempt." Four townhouses
        # on four unit lots are four attached houses. The same building on one
        # lot is a fourplex, which that sentence does not name, so the plat
        # decides whether the ceiling exists.
        - exempt: true
          when: [unit_lots]
          quote: "or/multnomah/portland/33.266/33.266.115.txt#L44-L45"
          via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65"
    open_space_min_sqft:
      per_dwelling: 48
      cite: PCC 33.130 Table 130-2, Required Residential Outdoor Area; 33.130.228.B.1
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
      retrieved: '2026-08-27'
      quote: "or/multnomah/portland/33.130.txt#L587,L632-L633,L1192-L1197"
      variants:
        # The requirement is BANDED on total site area and this file held only
        # its upper half. 33.130.228.B.1 states both bands: 36 square feet per unit applies at
        # 20,000 sq ft or less, 48 above it -- and a four-unit pod's lot is
        # almost never over 20,000, so the flat 48 was asking nearly every
        # Portland site for a third more outdoor area than the code does.
        # Found 2026-09-07 by the blind second reading.
        - per_dwelling: 36
          band: {measure: lot_sqft, at_most: 20000}
          quote: "or/multnomah/portland/33.130/33.130.228.txt#L7-L8"
          via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65,L109-L110"
    quadplex_allowed:
      # Table 130-1, "Household Living", read across the header row: Y in
      # every commercial/mixed use zone. The housing type is named too --
      # 33.130.250.B.2.a applies the small-housing standards to "houses,
      # attached houses, manufactured homes, duplexes, attached duplexes,
      # triplexes, and fourplexes in the commercial/mixed use zones", which
      # is the chapter saying in its own words that a fourplex of attached
      # houses is a thing that gets built here.
      value: true
      quote: "or/multnomah/portland/33.130.txt#L332,L334,L1598-L1600"
      qualified_by:
        fact: pdx_plan_district_unmeasured
        cite: PCC 33.521.220.C, 33.521.290.C, 33.536.210.B, 33.536.240.C, 33.536.280.C.2, 33.536.300.C, 33.538.220.B, 33.545.100.C, 33.550.220, 33.561.270, 33.561.300, 33.563.220, 33.595.100.B.1, 33.595.210.C, 33.595.250.C, 33.595.270.B, 33.510.200.C.3, 33.510.210.B, 33.515.210, 33.515.230, 33.515.262, 33.526.220.B, 33.526.340.C, 33.532.220, 33.532.230.C, 33.532.245, 33.555.230, 33.562.100.B, 33.562.210, 33.562.220.B, 33.562.240.E and F, 33.567.040, 33.575.110, 33.580.110 and 33.580.130, and 33.530.050 (plan districts, which control over the base zone, 33.500.040) -- parking and driveways kept off named streets and light rail, required building lines, minimum floor area ratios printed only on a map or above the pod's on the lots they reach, residential use prohibited in Hollywood Subdistrict A and the West Portland Employment Focus Area, a rear setback of a quarter of the site depth, Macadam's wall-plane and light rail setbacks, the Linnton Hillside lot-of-record rule, and Glendoveer's flag-lot standards (15 ft on every lot line, 25 ft height); and residential use held to 20 percent of a building in part of Northwest, heights printed only on a map below the pod's, walls set parallel to Sandy Boulevard, Powell Boulevard's 8 ft sound wall, South Auditorium's landscaped street edge and tree rule, Hayden Island's commercial height step and floor area rules, and Columbia South Shore's Airport Way setback and archaeology rule. Nothing measures which street the court and drive face, the building line, the lot's history, or whether a lot is a flag lot; held only on the lots drawn_areas plan_district_unmeasured traces
        quote: "or/multnomah/portland/33.595.txt#L89,L171-L174,L393-L397,L438-L449"
    min_lot_sqft:
      # "There is no required minimum lot size for development of land in
      # commercial/mixed use zones." Not a minimum of zero -- the standard
      # does not exist. The sentence after it sends lot *creation* to Chapter
      # 33.613, which is a land-division rule and not a test an existing lot
      # has to pass to be built on.
      exempt: true
      quote: "or/multnomah/portland/33.130/33.130.200.txt#L1-L3"
      via: "or/multnomah/portland/33.130/33.130.210.txt#L64-L65"
    setback_front_ft:
      # Table 130-2 has three "Min. Building Setbacks" rows for a street lot
      # line, and in this zone the binding one is the third: "Street Lot Line
      # across a local street from an RF - RM2 or RMP Zone", 5 or 10 ft.
      # 33.130.215.B.1.b(1) gives the 5 to "buildings that are entirely in a
      # residential use", which the pod is, "from a street lot line facing an
      # RF through RM2 or RMP zone" (the 10 of B.1.b(2) is for all other
      # buildings). It is the base because the screen cannot rule it out for
      # the lot as a whole: the rule turns on the street's Transportation
      # System Plan class ("Local Service Street", 33.910) and on the zone
      # across it, per LINE, and neither the class nor the transit-street
      # exception ("or on or within 100 feet of a transit street") is held,
      # so every street is read as local -- the tight side. The plain row,
      # "Street Lot Line: none", is given back line by line on
      # setback_street_across_nonresidential_ft below. The corridor variant
      # (33.130.215.B.1.a, Map 130-1, flats/geom/corridor.py) still tightens
      # it to 10 on a lot with a street line on a stretch.
      value: 5
      quote: "or/multnomah/portland/33.130.txt#L587,L612-L613,L799-L805"
      via: "or/multnomah/portland/33.130/33.130.215.txt#L19-L23"
      variants:
        - value: 10
          when: [civic_corridor_setback]
          quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L87"
    setback_street_off_corridor_ft:
      # The same row as the base above, held per LINE (FOLLOWUPS 8(d)).
      # Table 130-2 states the corridor number for "Street Lot Line abutting
      # selected Civic Corridors" -- one line -- and the variant above can
      # only hand it to the whole lot: `civic_corridor_setback` is true when
      # ANY street line is on a Map 130-1 stretch, so the side street of a
      # corner lot on Division takes 10 too. That stays the reading for
      # every reader without edges. The envelope reads this field instead
      # on a street line read surely OFF every stretch
      # (flats/geom/corridor.py off_corridor: no point of the line on it by
      # either reading, every point placed on a street that is not the
      # corridor), and cuts that line alone at the zone's street number off
      # the corridor. A line the stretch ends part way along is not off, and
      # keeps 10. In this zone that number is the across-the-street 5 (see
      # setback_front_ft), not the plain "none": a line off the corridor can
      # still face a residential zone across a local street.
      value: 5
      quote: "or/multnomah/portland/33.130.txt#L587,L612-L613,L799-L805"
    setback_street_across_nonresidential_ft:
      # The plain row, "Street Lot Line: none", held per LINE for the one
      # street line it reaches here: off every Map 130-1 stretch AND facing
      # no RF-RM2 or RMP zone across the street (33.130.215.B.1: "Unless as
      # specified below, there is no minimum required setback from a street
      # lot line"). The envelope reads it only on a street edge flagged both
      # off_corridor and across_clear -- five rays square to the line, over
      # the right-of-way, each finding a Portland lot in a zone the
      # neighbours block puts on the false_for side of
      # faces_residential_zone_across_street (flats/geom/neighbour.py
      # street_lines_clear). A ray that finds a split-zone lot, another
      # city's lot, nothing within reach, or a lot nearer than a street's
      # width leaves the line on the 5.
      value: 0
      quote: "or/multnomah/portland/33.130.txt#L587,L609,L795-L796"
    setback_front_max_facade_pct:
      # Half the ground-level street-facing facade must stand within the
      # maximum, not the whole of it (33.130.215.C.1; FOLLOWUPS 147).
      value: 50
      quote: "or/multnomah/portland/33.130/33.130.215.txt#L76-L78"
    setback_front_max_ft:
      # A maximum, not a minimum: the building has to be within 10 ft of the
      # street lot line. This is the standard in the chapter most likely to
      # decide a pod, because it forbids the layout that a rear-court plan
      # reaches for first -- parking at the front, building set back behind
      # it.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L97-L98"
      variants:
        # The next row of the same table, and it runs the usual way: on a
        # Civic Corridor shown on Map 130-1 the building may stand up to 20
        # ft back instead of 10 (33.130.215.C.1, "except on Civic Corridors
        # shown on Map 130-1, where the maximum set back is 20 feet"). A
        # raised maximum LOOSENS, so it does not hang on
        # `civic_corridor_setback` -- that fact is true when ANY street line
        # is on a stretch, read either way on purpose, and would hand the 20
        # to the side street of a corner lot on Division. It hangs on the
        # EVERY-line partner, read by the street each line abuts; a corner
        # lot with one line off the corridor keeps 10 on both until a
        # per-line field exists. Min 10 and max 20 on the corridor leaves a
        # ten-foot band, and a pod at its minimum setback sits inside it.
        - value: 20
          when: [civic_corridor_setback_all_streets]
          quote: "or/multnomah/portland/33.130.txt#L587,L622-L623,L900-L902"
    setback_side_ft:
      # Two rows, one question, and the answer is the neighbour's zoning
      # rather than this lot's. 10 ft from a lot line abutting an RF through
      # RM4, RMP or IR zone; none from a lot line abutting OS, RX, C, E or I.
      # The 10 is the base because the fact is unmeasured and reading it the
      # other way is how a lot with a house behind it screens as buildable
      # to its own rear line.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L95"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L93"
    setback_rear_ft:
      # The same two rows. 33.130.215.B.2 draws no distinction between a side
      # and a rear lot line -- both are "a lot line that is not a street lot
      # line" -- so the rear standard is the side standard.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L95"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L93"
      qualified_by:
        fact: pdx_johnson_creek_unmeasured
        cite: PCC 33.537.130, 33.537.140.E and 33.537.160 (Johnson Creek Basin plan district, which controls over the base zone, 33.500.040) -- along a lot line abutting the Springwater Corridor a 20 ft landscaped buffer (10 ft in C zones) with no building, parking or paving in it, and no vehicle area within 20 ft of that line; in the South subdistrict a land division's density is cut by the slope class of its land; and where any of a site is in the Flood Risk Area a land division is prohibited (the whole site) or must put that part in a tract. Nothing measures which line abuts the corridor, the slope classes or the Flood Risk Area's share of the site; held on the lots drawn_areas johnson_creek_unmeasured traces (the corridor reach), and on the townhouse form also on those johnson_creek_land_division traces, since 140.E and 160 govern land divisions and planned developments only (33.537.010, density "is limited by applying special regulations to new land division proposals"), so they reach the pod as four unit lots and not as one building on the one lot (FOLLOWUPS 58, 2026-11-08)
        quote: "or/multnomah/portland/33.537.txt#L30-L31,L46-L54,L264-L266,L271-L273,L283-L296,L326-L363,L387-L394"
    parking_lot_line_buffer_ft:
      # FOLLOWUPS 171 (2026-11-09). 33.130.215.B.2.b: the 10 ft setback from a
      # lot line abutting an RF through RM4, RMP or IR zone "must be landscaped
      # to the L3 standard" (33.248.020.C: a 6 ft evergreen screen, trees, and
      # ground cover over the rest), and only "areas paved for pedestrian or
      # bicycle use" may stand in it -- so no court, stall or drive aisle.
      # Table 130-2 prints the same strip for all six zones, "Landscape Buffer
      # Abutting an RF - RM4 or RMP Zoned Lot ... 10 ft. @ L3"; the row leaves
      # IR out and the text puts it in, and the text is the wider. Neither
      # exception lifts it: (2) is for buildings 15 ft or less (the pod is
      # 26), and (3) keeps the first 10 ft landscaped under both. Same fact
      # as the side and rear setbacks: 0 only where EVERY non-street line is
      # read and nothing across it is residential; one residential or unread
      # line keeps the strip on every non-street line, the tightening way to
      # be coarse until the strip is read per line.
      value: 10
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L107-L108"
      via: "or/multnomah/portland/33.130/33.130.215.txt#L44-L46,L48-L49"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130/33.130.215.txt#L42"
    # PCC 33.537 (Johnson Creek Basin plan district, FOLLOWUPS 109 part 1):
    # the base zone caps building coverage only; 33.537.140.D and 150.E cap
    # impervious surface (buildings and paving, eaves included) at 50 percent
    # on sites in the South subdistrict or with any portion in the combined
    # flood hazard area, and nowhere else (33.537.020).
    max_impervious_pct:
      exempt: true
      cite: PCC 33.537.020, the plan district's impervious surface limit applies only in the South subdistrict and on sites with any portion in the combined flood hazard area; the base zone states none
      quote: "or/multnomah/portland/33.537.txt#L43-L45,L46-L54"
      variants:
        - value: 50
          when: [pdx_johnson_creek_impervious]
          cite: PCC 33.537.140.D and 33.537.150.E, no more than 50 percent of any site may be developed in impervious surface; building eaves are included
          quote: "or/multnomah/portland/33.537.txt#L323-L325,L384-L386"
    max_height_ft:
      # Table 130-2, "Base Height". The row prints all six cells on one line,
      # so the header is quoted with it and position is what names the column
      # -- CR, CM1, CM2, CM3, CE, CX.
      value: 45
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L74"
    max_far:
      value: 2.5
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65-L66"
    max_coverage_pct:
      # Two rows, and which one applies is a pattern area on Map 130-2 that
      # this screen does not read. The Eastern/Western/River figure is
      # encoded because it is the lower of the two; the Inner Pattern Area
      # allows 85 percent on the same lot.
      value: 75
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L102-L103"
    min_landscaped_pct:
      value: 15
      quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L105"
    orientation_constraint:
      # 33.130.250.B.3: at least one main entrance must be within 8 feet of
      # the longest street-facing wall, and must face the street, sit at up
      # to 45 degrees from it, or open onto a porch. That binds the entrance
      # and leaves the building's long axis free, which is what
      # `entrance_only` means. Flag lots and lots averaging 20 percent slope
      # or steeper are exempt (#L1711-L1712) -- both are conditions this
      # screen could evaluate and neither is encoded as a variant yet.
      value: entrance_only
      quote: "or/multnomah/portland/33.130/33.130.250.txt#L19-L23"
      via: "or/multnomah/portland/33.130/33.130.250.txt#L10-L11"
    notes: 'Commercial/mixed use. Household Living is a plain Y in Table 130-1 and 33.130.200 states there is no required minimum lot size for development, so the two standards that most often decide a small lot do not exist here. What binds instead is the shape: a maximum front setback of 10 ft puts the building at the street, and side and rear setbacks turn on the zoning of the lot next door rather than on anything in this parcel''s record. NOT ENCODED, on purpose. (1) The step-down heights in Table 130-2 (#L628-L635) drop the ceiling to 35 or 45 ft near lower-scale residential zones. Both clear a 26 ft pod, so encoding a fact nobody measures would cost a lookup and move no verdict. (2) The 5/10 ft street setback across a local service street from an RF-RM2 or RMP zone (33.130.215.B.1.b) is held per line on its tight side: the 5 ft row (a building entirely in residential use) is the street number on every street line, and the plain none row (setback_street_across_nonresidential_ft) goes back only to a line off the corridor whose five rays across the street all found a Portland zone off the RF-RM2/RMP list. Held back, because each relaxes and needs data this screen lacks: the street''s Transportation System Plan class (only a Local Service Traffic Street triggers the rule, 33.910; RLIS TYPE is Metro''s regional class, not the TSP''s) and the exception on or within 100 ft of a transit street. Refused as well: the same paragraph bars vehicle access through that setback unless the facing street is the site''s only frontage (#L843-L845), and the screen does not yet say which street line the driveway crosses. (3) Bonus FAR and bonus height (Table 130-3) are earned, not given. (4) The garage standards in 33.130.250.D are stated relative to the dwelling''s own street-facing wall rather than to a lot line, so they are a massing rule this field set cannot hold. (5) Maximum building length of 200 ft (33.130.222.B) is far above anything a four-unit pod reaches.'
