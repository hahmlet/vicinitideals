    notes: 'Campus Institutional 1 as RICAP 11 left it (in force 2026-11-01, reprinted in Title 33): homes allowed, on the RM1 zone''s standards. Imported whole through `like: RM1` -- minimum lot 4,000 sq ft and 33 ft wide, setbacks 10/5/5, height 35 ft, FAR 1 to 1, coverage 50 percent, landscaping 30 percent, minimum density, outdoor area per unit, the garage-entrance band and the 1.35-per-unit parking maximum -- with RM1''s variants and RM1''s citations. None of CI1''s own Table 150-2 figures (15 ft setbacks, 75 ft height, 0.5 FAR, 25 percent landscaping) applies to a home.

