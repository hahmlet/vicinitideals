      the Map 526-3 .25 to 1 minimum-FAR areas whole; Northwest CM2 lots and CM3 lots within 240 ft
      of a Map 562-7 main street or streetcar centreline (1.5 to 1 minimum
      FAR, 220.B; the pod's 4,032 sq ft meets it only on 2,688 sq ft or
      less), CM3 lots in the Map 562-2 area (residential use at most 20
      percent of a building, 100.B), lots on a main street or the streetcar
      with two or more street faces or over 10,000 sq ft (240.E-F), and the
      Map 562-4 0 ft height area whole (210); Sandy lots within 75 ft of the
      NE Sandy Blvd centreline (walls parallel to Sandy, 33.575.110);
