      value: 75
      quote: "or/multnomah/portland/33.150.txt#L531,L536-L537"
    max_far:
      # 0.5 to 1, the tightest floor-area ratio in the corpus, and in this zone
      # the standard that supplies the lot minimum 33.150.200 refuses to.
      value: 0.5
      quote: "or/multnomah/portland/33.150.txt#L531,L532-L533"
    max_coverage_pct:
      value: 50
      quote: "or/multnomah/portland/33.150.txt#L531,L548-L549"
    min_landscaped_pct:
      value: 25
      quote: "or/multnomah/portland/33.150.txt#L531,L552-L553"
    notes: 'Campus Institutional 1. Table 150-1 reads N for Household Living, so the use gate closes and nothing behind it is reached.

      Table 150-2 is encoded anyway, on 2026-08-21. Table 150-2 note [3] sits in the region the use cell is quoted from and is ruled unmeasured, so the N is not a settled N, and a gate that might open owes the standards behind it.

      The setback rows are the reading to keep. CI1 states three minimums by what the lot line faces -- 15 ft against OS or RF-R2.5, 10 against RM1-RMP or IR, 0 against a C, CI, E or I lot -- and states no residual, so every line takes one of the three and the answer is the neighbour''s zoning rather than this lot''s. Nothing here reads that, so 15 is taken on all four sides. IR, one column over, escapes this: its column is a single merged cell measured off the building instead.

      The other difference from IR and CI2 is quieter. CI1''s maximum building setback reads None, and note [5] removes the minimum setback only on frontages where a maximum applies -- so in CI1 it never fires, and the transit-street and Pedestrian District relief the other two campus zones get does not exist here.

      0.5 to 1 is the tightest FAR in the corpus and it is what makes this zone bind. There is no minimum lot size at all, but four units of a 56 by 36 ft pod over two floors is roughly 4,000 sq ft of floor area, which at 0.5 asks for roughly 8,000 sq ft of site -- a lot minimum arriving by the back door. Coverage is 50 percent, landscaped area 25 percent.

      NOT ENCODED, on purpose: Maps 150-1 through 150-5 supersede the Table 150-2 setback and height rows where they apply and this screen does not read them; and note [1] treats an entire CI zone as one site for Colleges and Medical Centers, measuring setbacks from the zone perimeter, which is a different applicant than this one.'
  CI2:
