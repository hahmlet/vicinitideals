  "33.150.txt#33.150":
    queue: condition
    outcome: never
    note: >-
      Nineteen statements out of Portland's industrial chapter, and the chapter is the answer.
      33.150 governs IG1, IG2, IH and IR; this project places dwellings in the residential,
