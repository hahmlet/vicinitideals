      common outdoor area); all of Macadam (setbacks by wall-plane area from
      every lot line and 40 ft from the future light rail centreline); and
      Lombard Subdistrict B corner lots (no surface parking within 40 ft of
      the corner); and Glendoveer R7 lots of geometry tier C (concave,
      many-sided or pole-shaped), the lots a flag lot can be among, because
      33.530.050 sets 15 ft on every lot line and a 25 ft height on a flag
      lot and no lot is read as one (34 on run 113, none green). Kenton's 1 to 1 minimum-FAR areas and the Northwest Hills
      Linnton Hillside subarea are held whole, untraced; no lot in either was
      green on run 113. East Corridor's Map 521-3 minimum-FAR areas (0.5 to
      1 and 1 to 1) were held whole too until pd2c (2026-11-04) read the
      figures off the sheet; see east_corridor_min_far_half and _one. The minimums are held, not computed against the
      pod's 4,032 sq ft. CI1 because RICAP 11 builds a CI1 home to RM1's
