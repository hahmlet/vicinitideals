code:
  # Portland's HTML route for a chapter serves navigation furniture; the PDF is
  # the artifact. Whole-chapter, unsliced: this one is already the chapter.
  - id: "33.110"
    url: https://www.portland.gov/sites/default/files/code/110-sd-zone_3.pdf
    title: Chapter 33.110 Single-Dwelling Zones
  # Land division in the single-dwelling zones. Read for one number: Table
  # 110-3 lets a house stand on an RF lot that meets Table 610-2's minimum
  # lot area, and the state's middle housing law caps a fourplex's minimum lot
  # at the house's (OAR 660-046-0220(2)(a)(B)) -- so RF's figure for the
  # state path lives here (Steph 2026-09-30, FOLLOWUPS 21(b)).
  # The Constrained Sites overlay (map letter "z"): on a lot any part of
  # which is mapped, 33.418.040 switches off the triplex/fourplex allowance
  # in R20 through R2.5. Read for that one sentence (FOLLOWUPS 42(a)).
  - id: "33.418"
    url: https://www.portland.gov/sites/default/files/code/418-constrained_0.pdf
    title: Chapter 33.418 Constrained Sites Overlay Zone
    # The 11/1/26 reprint's layout extraction moves list labels and heading
    # numbers off their text ("418.020 33.Map Symbol", "constraintsWhen");
    # the plain extraction reads in order (pdx-drift, 2026-11-09).
    extraction: plain
  - id: "33.610"
    url: https://www.portland.gov/sites/default/files/code/610-rf-r2.5-lots.pdf
    title: Chapter 33.610 Lots in the RF through R2.5 Zones
    # Re-uploaded with the 11/1/26 packet, text unchanged (still printed
    # 1/1/25). Its layout extraction reorders "R2.5" as "R5 ... 2." and glues
    # headings to titles ("33.610.100Density"); plain reads in order
    # (pdx-drift, 2026-11-09). Plain prints Table 610-2 a column at a time
    # (RF's cells, then R20's, ...), not row by row.
    extraction: plain
  - id: "33.120"
    url: https://www.portland.gov/sites/default/files/code/120-md-zones_2.pdf
    title: Chapter 33.120 Multi-Dwelling Zones
  # The commercial/mixed-use chapter. CM1, CM2, CM3, CX and CE are the largest
  # block of fourplex-eligible land in the city this screen had never read --
  # 13,225 lots standing at `zone_missing`, which is a verdict of "we do not
  # know" rather than a verdict.
  - id: "33.130"
    url: https://www.portland.gov/sites/default/files/code/130-c-zones_2.pdf
    title: Chapter 33.130 Commercial/Mixed Use Zones
  # Employment and industrial. EX belongs to this chapter rather than 33.130,
  # and IG1, IG2 and IH are here to be read out honestly: a zone that does not
  # allow the use is a RED with a citation, which is a different thing from a
