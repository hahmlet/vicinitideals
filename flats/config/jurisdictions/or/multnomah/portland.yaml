      # so the header is quoted with it and position is what names the column
      # -- CR, CM1, CM2, CM3, CE, CX.
      value: 45
      quote: "or/multnomah/portland/33.130.txt#L618,L627"
    max_far:
      value: 2.5
      quote: "or/multnomah/portland/33.130.txt#L618,L619"
    max_coverage_pct:
      # Two rows, and which one applies is a pattern area on Map 130-2 that
      # this screen does not read. The Eastern/Western/River figure is
      # encoded because it is the lower of the two; the Inner Pattern Area
      # allows 85 percent on the same lot.
      value: 75
      quote: "or/multnomah/portland/33.130.txt#L618,L656-L657"
    min_landscaped_pct:
      value: 15
      quote: "or/multnomah/portland/33.130.txt#L618,L659"
    orientation_constraint:
      # 33.130.250.B.3: at least one main entrance must be within 8 feet of
      # the longest street-facing wall, and must face the street, sit at up
      # to 45 degrees from it, or open onto a porch. That binds the entrance
      # and leaves the building's long axis free, which is what
      # `entrance_only` means. Flag lots and lots averaging 20 percent slope
      # or steeper are exempt (#L1711-L1712) -- both are conditions this
      # screen could evaluate and neither is encoded as a variant yet.
      value: entrance_only
      quote: "or/multnomah/portland/33.130.txt#L1713-L1719"
    notes: 'Commercial/mixed use. Household Living is a plain Y in Table 130-1 and 33.130.200 states there is no required minimum lot size for development, so the two standards that most often decide a small lot do not exist here. What binds instead is the shape: a maximum front setback of 10 ft puts the building at the street, and side and rear setbacks turn on the zoning of the lot next door rather than on anything in this parcel''s record. NOT ENCODED, on purpose. (1) The step-down heights in Table 130-2 (#L628-L635) drop the ceiling to 35 or 45 ft near lower-scale residential zones. Both clear a 26 ft pod, so encoding a fact nobody measures would cost a lookup and move no verdict. (2) The 5/10 ft minimum street setback across a local service street from an RF-RM2 or RMP zone (33.130.215.B.1.b) needs the street''s functional class and the facing zone, neither of which this screen holds; it is also disapplied within 100 ft of a transit street. (3) Bonus FAR and bonus height (Table 130-3) are earned, not given. (4) The garage standards in 33.130.250.D are stated relative to the dwelling''s own street-facing wall rather than to a lot line, so they are a massing rule this field set cannot hold. (5) Maximum building length of 200 ft (33.130.222.B) is far above anything a four-unit pod reaches.'
  CX:
    cite_default:
      cite: PCC 33.130 — Table 130-1 (33.130.100 Primary Uses), 33.130.200 Lot Size, Table 130-2 (Summary of Development Standards in Commercial/Mixed Use Zones), 33.130.215 Setbacks, 33.130.220 Building Coverage, 33.130.225 Landscaped Areas, 33.130.250 General Requirements for Small Housing Types
      url: https://www.portland.gov/sites/default/files/code/130-c-zones_3.pdf
      retrieved: '2026-08-19'
    quadplex_allowed:
      # Table 130-1, "Household Living", read across the header row: Y in
      # every commercial/mixed use zone. The housing type is named too --
      # 33.130.250.B.2.a applies the small-housing standards to "houses,
      # attached houses, manufactured homes, duplexes, attached duplexes,
      # triplexes, and fourplexes in the commercial/mixed use zones", which
      # is the chapter saying in its own words that a fourplex of attached
      # houses is a thing that gets built here.
      value: true
      quote: "or/multnomah/portland/33.130.txt#L341,L343,L1695-L1697"
    min_lot_sqft:
      # "There is no required minimum lot size for development of land in
      # commercial/mixed use zones." Not a minimum of zero -- the standard
      # does not exist. The sentence after it sends lot *creation* to Chapter
      # 33.613, which is a land-division rule and not a test an existing lot
      # has to pass to be built on.
      exempt: true
      quote: "or/multnomah/portland/33.130.txt#L397-L399"
    setback_front_ft:
      # Table 130-2, "Min. Building Setbacks - Street Lot Line": none, in all
      # six zones. The variant is the exception and it runs the other way
      # from the usual one -- the corridor makes the standard TIGHTER, not
      # looser -- so it is worth saying plainly that the base here is the
      # permissive reading. 33.130.215.B.1.a requires 10 ft from a street lot
      # line adjacent to a Civic Corridor shown on Map 130-1, and this screen
      # does not hold that map.
      value: 0
      quote: "or/multnomah/portland/33.130.txt#L618,L640"
      variants:
        - value: 10
          when: [civic_corridor]
          quote: "or/multnomah/portland/33.130.txt#L618,L641"
    setback_front_max_ft:
      # A maximum, not a minimum: the building has to be within 10 ft of the
      # street lot line. This is the standard in the chapter most likely to
      # decide a pod, because it forbids the layout that a rear-court plan
      # reaches for first -- parking at the front, building set back behind
      # it.
      value: 10
      quote: "or/multnomah/portland/33.130.txt#L618,L651-L652"
    setback_side_ft:
      # Two rows, one question, and the answer is the neighbour's zoning
      # rather than this lot's. 10 ft from a lot line abutting an RF through
      # RM4, RMP or IR zone; none from a lot line abutting OS, RX, C, E or I.
      # The 10 is the base because the fact is unmeasured and reading it the
      # other way is how a lot with a house behind it screens as buildable
      # to its own rear line.
      value: 10
      quote: "or/multnomah/portland/33.130.txt#L618,L649"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130.txt#L618,L647"
    setback_rear_ft:
      # The same two rows. 33.130.215.B.2 draws no distinction between a side
      # and a rear lot line -- both are "a lot line that is not a street lot
      # line" -- so the rear standard is the side standard.
      value: 10
      quote: "or/multnomah/portland/33.130.txt#L618,L649"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/portland/33.130.txt#L618,L647"
    max_height_ft:
      # Table 130-2, "Base Height". The row prints all six cells on one line,
      # so the header is quoted with it and position is what names the column
      # -- CR, CM1, CM2, CM3, CE, CX.
      value: 75
      quote: "or/multnomah/portland/33.130.txt#L618,L627"
    max_far:
      value: 4.0
      quote: "or/multnomah/portland/33.130.txt#L618,L619"
    max_coverage_pct:
      # Two rows, and which one applies is a pattern area on Map 130-2 that
      # this screen does not read. The Eastern/Western/River figure is
      # encoded because it is the lower of the two; the Inner Pattern Area
      # allows 100 percent on the same lot.
      value: 100
      quote: "or/multnomah/portland/33.130.txt#L618,L656-L657"
    min_landscaped_pct:
      value: 0
      quote: "or/multnomah/portland/33.130.txt#L618,L659"
    orientation_constraint:
      # 33.130.250.B.3: at least one main entrance must be within 8 feet of
      # the longest street-facing wall, and must face the street, sit at up
