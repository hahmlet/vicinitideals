        # allowance away again on any lot it touches in any portion: 33.418.040.B
        # switches off 33.110.265.E, "which allows triplexes and fourplexes in
        # the R20 through R2.5 zones". The state path does not bring it back --
        # ORS 197A.420(5)(b) as HB 2138 words it (or/hb.2138.2025.txt#L106-L107)
        # lets a city "regulate middle housing to comply with protective measures
        # adopted pursuant to statewide land use planning goals", the purpose
        # 33.418.010 states -- so a mapped lot is RED with no relief (FOLLOWUPS 42(a)).
        - value: false
          when: [constrained_sites_overlay]
          cite: PCC 33.418.030 and 33.418.040.B
          url: https://www.portland.gov/sites/default/files/code/418-constrained_0.pdf
          retrieved: '2026-10-04'
          quote: "or/multnomah/portland/33.418.txt#L22-L24,L40-L49"
        # The way round, logged and not taken (Steph 2026-10-04, "red, way in
        # noted"): 33.418.040 does not reach the attached house, which Table
        # 110-2 allows here -- four units on four lots after a land division.
