  RM1:
    cite_default:
      cite: PCC 33.120 — Table 120-2 (33.120.200 Housing Types Allowed), Table 120-3 (33.120.205 When Primary Structures are Allowed), Table 120-4 (printed at the end of 33.120.206), 33.120.210 Floor Area Ratio, 33.120.215 Height, 33.120.220 Setbacks, 33.120.225 Building Coverage, 33.120.235 Landscaped Areas
      url: https://www.portland.gov/sites/default/files/code/120-md-zones_3.pdf
      retrieved: '2026-08-15'
    # Table 266-1 sends every zone but EX to Standard B, and Standard B states
    # no maximum for Household Living -- "except 1.35 per unit on sites that
    # are in a commercial/mixed use or multi-dwelling zone". This zone is one
    # of the twelve inside that exception: the six multi-dwelling zones listed
    # at 33.120.020 and the six commercial/mixed use zones listed at
    # 33.130.020. Everywhere else in the city there is no ceiling at all,
    # which is what the layer default says.
    #
    # A maximum binds the building rather than the lot, and it is the one
    # direction this screen had no field for. The catalog pod asks 1.5 stalls
    # per unit; 1.35 of four units is five stalls, not six.
    parking_max_per_unit:
      value: 1.35
      cite: PCC 33.266.115; Tables 266-1 and 266-2
      url: "https://www.portland.gov/sites/default/files/code/266-parking_3.pdf"
      retrieved: 2026-08-21
      quote: "or/multnomah/portland/33.266.txt#L139,L153-L155,L157,L159-L162"
      variants:
        # "Houses, attached houses and duplexes are exempt." Four townhouses
        # on four unit lots are four attached houses. The same building on one
        # lot is a fourplex, which that sentence does not name, so the plat
        # decides whether the ceiling exists.
        - exempt: true
          when: [unit_lots]
          quote: "or/multnomah/portland/33.266.txt#L159,L163-L164"
    # 33.120.240.B.1 states the multi-dwelling zones' outdoor area per DWELLING
    # UNIT rather than per lot, so a fourplex owes four of them. RM1 and RM2
    # ask 48 sq ft each. RM3 and RM4 ask 36 on sites of 20,000 sq ft or less
    # and 48 above, and this file carries 48 in all four zones: the two
    # figures differ by 12 sq ft a unit, 48 across the pod, and encoding the
    # larger screens a small site about a rounding error tighter rather than
    # letting a large one through unmeasured.
    #
    # THE REQUIRED COMMON AREA at 33.120.240.B.2 is now carried, and the
    # sentence that used to stand here was thin. It said the pod was "outside
    # the trigger and inside the exemption", naming one of the exemption's
    # three limbs. Re-read 2026-09-09 off the condition queue.
    #
    # B.2.a asks 10 percent of total site area as common area on sites that
    # are MORE THAN 20,000 square feet, at least half of it outdoors. A pod is
    # four dwelling units and no community room, so it has no indoor common
    # area to trade against the outdoor half and would owe the whole ten
    # percent as ground.
    #
    # B.2.b is the exemption and it is three things at once, not one: every
    # unit's own entrance within 20 feet of a street lot line, a 3-foot
    # hard-surfaced path to each, AND 200 square feet of individual outdoor
    # area per unit at a minimum of 10 feet by 10 feet. Only the first was on
    # the record. The third is the expensive one: 800 square feet for four
    # units, against the 48 apiece this field was charging.
    #
    # Two routes and the applicant picks, so the cheaper one is what binds --
    # the same shape as a design menu. Above the trigger the exemption is
    # always the cheaper: 10 percent of anything over 20,000 square feet is
    # over 2,000, and the exemption is 800 flat. So 200 per dwelling is the
    # least this code will accept on a site over 20,000 square feet, and it is
    # encoded as a band rather than left to the 48.
    #
    # Two things it does not carry. The 10-by-10 minimum DIMENSION is a shape
    # test no field here holds, which is already written against this field in
    # the registry. And the entrance limb is a placement rather than an area:
    # a layout that puts the pod behind its parking, or turns it, loses the
    # exemption and falls back to the ten percent. That is the one way this
    # number is too low, and it is a layout the fit stage chooses rather than
    # a fact about the lot.
    open_space_min_sqft:
      per_dwelling: 48
      cite: PCC 33.120.240.B.1.a, required outdoor area per dwelling unit
      url: https://www.portland.gov/sites/default/files/code/120-md-zones_3.pdf
      retrieved: '2026-08-27'
      quote: "or/multnomah/portland/33.120.txt#L1487-L1491,L1497-L1508"
      variants:
        - per_dwelling: 200
          band: {measure: lot_sqft, more_than: 20000}
          cite: PCC 33.120.240.B.2.b(3), individual outdoor area under the common-area exemption
          quote: "or/multnomah/portland/33.120.txt#L1509-L1523"
    quadplex_allowed:
      value: true
      quote: "or/multnomah/portland/33.120.txt#L394-L404"
    min_lot_sqft:
      value: 4000
      quote: "or/multnomah/portland/33.120.txt#L458-L460"
    min_lot_width_ft:
      value: 33
      quote: "or/multnomah/portland/33.120.txt#L458-L460"
    setback_front_ft:
      value: 10
      quote: "or/multnomah/portland/33.120.txt#L541-L542"
    setback_side_ft:
      value: 5
      quote: "or/multnomah/portland/33.120.txt#L543-L544"
    setback_rear_ft:
      value: 5
      quote: "or/multnomah/portland/33.120.txt#L543-L544"
    setback_garage_entrance_ft:
      # 33.120.283.E.1.b: "No setback is required from a lot line abutting an
      # alley." Unconditional, and this file held only Table 120-4's flat 18.
      # The bureau may still ask for turning radius, which is a review, not a
      # dimension. Found 2026-09-07 by the reading queue.
      value: 18
      quote: "or/multnomah/portland/33.120.txt#L545-L546"
      variants:
        - exempt: true
          when: [abuts_alley]
          quote: "or/multnomah/portland/33.120.txt#L1228-L1230"
    max_height_ft:
      value: 35
      quote: "or/multnomah/portland/33.120.txt#L529"
    max_far:
      value: 1.0
      quote: "or/multnomah/portland/33.120.txt#L517-L518"
    max_coverage_pct:
      value: 50
      quote: "or/multnomah/portland/33.120.txt#L553-L554"
    min_landscaped_pct:
      value: 30
      quote: "or/multnomah/portland/33.120.txt#L558-L559"
    min_density_du_per_acre:
      sqft_per_unit: 2500
      quote: "or/multnomah/portland/33.120.txt#L513-L515,L526-L528"
    max_density_du_per_acre:
      exempt: true
      quote: "or/multnomah/portland/33.120.txt#L519,L810-L811"
    notes: 'Lowest-intensity multi-dwelling zone, and the only one that still allows cottage clusters and manufactured dwelling parks. Side and rear are a flat 5 ft here: the 5/10 step in 33.120.220.B.1 is written for RM3 and RM4 only. Garage entrance is a two-band rule rather than a minimum: 33.120.220.E.1.a allows 5 ft or closer OR 18 ft or farther and forbids everything between. 18 is encoded because it is the band that is always available; the near band additionally requires the entrance to sit no closer to the lot line than the residential facade, which is a maximum-shaped standard this field cannot hold. NOT ENCODED, on purpose. Minimum density is now encoded: Table 120-4 states it as an area per unit and `sqft_per_unit` carries that figure, so what is checked against the table is the printed operand and not the units-per-acre quotient nothing prints. The comparison is continuous rather than rounded, which is the conservative reading of a floor -- it never asks for fewer units than the ratio does. Three reliefs in 33.120.213.B are declined, and each lowers a floor: two units off when adding to an existing residential building, the Table 120-7 tree-preservation reduction, and the subtraction of Environmental-zone land from the site area. Group living is exempt and the pod is not group living. NOT ENCODED, on purpose. (1) Maximum front setback: Table 120-4 states one (#L549-L551) but 33.120.220.C.1 applies it only on a transit street or in a Pedestrian District, and a Value carries no condition on its base -- encoding it would bind every lot in the zone to a standard most of them never see. (2) Minimum site frontage of 90 ft (#L491-L495) applies only to sites on Map 120-2 that are more than 160 ft deep.'
