  IR:
    cite_default:
      cite: PCC 33.150 — Table 150-1 (33.150.100 Primary Uses), 33.150.202 Lot Size, Table 150-2 (Summary of Development Standards in Campus Institutional Zones), 33.150.215 Setbacks, 33.150.220 Building Coverage, 33.150.240 Landscaped Areas
      url: https://www.portland.gov/sites/default/files/code/150-campus-inst-zones_0.pdf
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: true
      quote: "or/multnomah/portland/33.150.txt#L342,L344"
    min_lot_sqft:
      # "There is no required minimum lot size for development of land or for
      # the creation of new lots in campus institution zones." Stronger than
      # the commercial chapter's sentence, which exempts development and
      # sends lot creation to 33.613; this one exempts both.
      exempt: true
      quote: "or/multnomah/portland/33.150.txt#L406-L408"
    setback_front_ft:
      # IR's column of the three minimum-setback rows is ONE merged cell, so
      # unlike CI1 and CI2 the neighbour's zoning does not change the answer
      # and there is no variant for it. Front, side and rear are the same
      # standard here; the rows reach a street lot line because each is headed
      # "Lot line abutting or ACROSS THE STREET FROM" a zone.
      per_height_ft: 2
      floor_ft: 10
      quote: "or/multnomah/portland/33.150.txt#L537,L544-L551"
      variants:
        # Note [5], as in CI2: no minimum where the maximum applies, and the
        # maximum applies only on a transit street or in a Pedestrian
        # District. Neither map is read here.
        - exempt: true
          when: [on_transit_street]
          quote: "or/multnomah/portland/33.150.txt#L580"
    setback_front_max_ft:
      # Table 150-2, "Maximum Building Setbacks Street Lot Line, Transit
      # Street or Pedestrian District" -- and the row heading is the whole
      # condition. Held EXEMPT at the base and 10 only on that frontage,
      # corrected 2026-09-02, because stated flat it made this zone
      # impossible to build in.
      #
      # IR is the only zone in the corpus whose minimum front setback exceeds
      # its maximum, and it is the only one that states the minimum as a
      # function of building height: 1 ft per 2 ft of height, floor 10, which
      # is 13 ft for the 26 ft pod against a 10 ft ceiling. Every other zone
      # with a maximum prints a flat minimum at or below it -- CI2 is 10 and
      # 10 -- so the clash could only show up here.
      #
      # Note [5] is what dissolves it, and it was already read onto the
      # minimum one field above: "For frontages where the maximum building
      # setback applies, there is no minimum setback." The two standards are
      # one rule with two limbs, and reading the note onto only one limb
      # produced a lot that could satisfy neither. Off a transit street the
      # minimum is 13 and NO maximum applies; on one the minimum is nothing
      # and the building must stand within 10 ft. Both are buildable. What
      # was encoded was neither.
      #
      # The base is the branch this screen can see. Neither Map 150-1 through
      # 150-5 nor the Pedestrian District map is read here, and a maximum
      # front setback has no column in the pipeline at all, so nothing moves
      # today either way. When a column arrives, the transit-street frontage
      # is what has to be read first -- a 10 ft ceiling on the front setback
      # is the standard most likely to decide a pod, because it forbids the
      # front-parking layout outright.
      exempt: true
      quote: "or/multnomah/portland/33.150.txt#L537,L552-L553,L580"
      variants:
        - value: 10
          when: [on_transit_street]
          quote: "or/multnomah/portland/33.150.txt#L537,L552-L553"
    # "1 ft. for every 2 ft. of building height but not less than 10 ft." --
    # the only standard in the corpus measured off the BUILDING rather than
    # off the lot. Both printed figures are in the file and the 13 ft it comes
    # to for a 26 ft pod is not, which is the same bargain every other derived
    # form here strikes: `per_height_ft` carries the 2, `floor_ft` carries the
    # 10, and DESIGN_HEIGHT_FT supplies the height.
    #
    # Held as encoding debt with no quote until now, on the reading that a
    # Value holds a number and not a function of the design. That was true of
    # the model and not of the code: the ratio and the floor are both printed,
    # and it is the product that was unquotable.
    setback_side_ft:
      per_height_ft: 2
      floor_ft: 10
      quote: "or/multnomah/portland/33.150.txt#L537,L544-L551"
    setback_rear_ft:
      # No `setback_alley_side_ft` in CI2 or IR: 33.150 never says "alley",
      # and Table 150-2 keys every non-street line to the zone it abuts, so
      # a side alley line takes this same number -- the ruling is under
      # CR's setback_rear_ft (FOLLOWUPS 12(c)).
      per_height_ft: 2
      floor_ft: 10
      quote: "or/multnomah/portland/33.150.txt#L537,L544-L551"
    parking_lot_line_buffer_ft:
      # FOLLOWUPS 171 (2026-11-09). Table 150-2, IR column, "Landscaping
      # Abutting an R zoned lot ... 10 ft. @L3", and 33.150.240.C:
      # "Landscaping is required in minimum building setbacks from lot lines
      # abutting ... a residential zoned lot" (L3, 33.248.020.C: a 6 ft
      # evergreen screen, trees, ground cover over the rest) -- no court or
      # drive aisle in it. No variant: "R zoned" is not the neighbour list
      # this layer declares (that list puts RX on the relaxing side, and RX
      # is a residential zone), so the strip stays on every non-street line.
      value: 10
      quote: "or/multnomah/portland/33.150.txt#L537,L560-L561"
      via: "or/multnomah/portland/33.150.txt#L684-L686"
    max_height_ft:
      value: 75
      quote: "or/multnomah/portland/33.150.txt#L537,L542-L543"
    max_far:
      value: 2.0
      quote: "or/multnomah/portland/33.150.txt#L537,L538-L539"
    max_coverage_pct:
      value: 70
      quote: "or/multnomah/portland/33.150.txt#L537,L554-L555"
    min_landscaped_pct:
      value: 20
      quote: "or/multnomah/portland/33.150.txt#L537,L558-L559"
    notes: 'Institutional Residential. Sixty lots, and the only zone in the corpus whose setback is measured off the building instead of the lot: 1 ft for every 2 ft of height, floored at 10, which for a 26 ft pod is 13 ft. Its column of Table 150-2''s three minimum-setback rows is one merged cell, so unlike CI1 and CI2 the neighbour''s zoning changes nothing -- and the rows are headed "Lot line abutting or across the street from", so the front lot line owes the same 13. The one frontage that does not is a transit street or a street lot line in a Pedestrian District, where note [5] removes the minimum outright; neither map is read here. No minimum lot size, 75 ft of height, 70 percent coverage, 20 percent landscaped. NOT ENCODED, on purpose: Maps 150-1 through 150-5 supersede the Table 150-2 setback and height rows where they apply, and this screen does not read them; and note [1] treats an entire CI zone as one site for Colleges and Medical Centers, which is a different applicant than this one.'
    min_far:
      # PCC 33.526.220.C (Gateway) and 33.521.220.C (East Corridor): the
      # minimum FAR for new development is shown on Map 526-3 and Map 521-3,
      # and each map prints it only as the bracketed figure under the 4:1
      # maximum -- (.25:1) in Gateway, (.5:1) and (1:1) in East Corridor.
      # The chapters' text carries no number and the map pages have no text
      # layer, so the variants are drawn figures, read off the 11/1/26 sheets
      # (FOLLOWUPS 109 pd2c). Which lot is in which area is the City's own
      # layer 50 (gateway-min-far, east-corridor-min-far-half/-one), matched
      # to the sheets; a lot the line cuts is unanswered and YELLOW.
      # Outside the mapped areas this zone states no minimum FAR (whole-corpus
