    setback_front_ft:
      # Table 130-2 has three "Min. Building Setbacks" rows for a street lot
      # line, and in this zone the binding one is the third: "Street Lot Line
      # across a local street from an RF - RM2 or RMP Zone", 5 or 10 ft.
      # 33.130.215.B.1.b(1) gives the 5 to "buildings that are entirely in a
      # residential use", which the pod is, "from a street lot line facing an
      # RF through RM2 or RMP zone" (the 10 of B.1.b(2) is for all other
      # buildings). It is the base because the screen cannot rule it out for
      # the lot as a whole: the rule turns on the street's Transportation
      # System Plan class ("Local Service Street", 33.910) and on the zone
      # across it, per LINE, and neither the class nor the transit-street
      # exception ("or on or within 100 feet of a transit street") is held,
      # so every street is read as local -- the tight side. The plain row,
      # "Street Lot Line: none", is given back line by line on
      # setback_street_across_nonresidential_ft below. The corridor variant
      # (33.130.215.B.1.a, Map 130-1, flats/geom/corridor.py) still tightens
      # it to 10 on a lot with a street line on a stretch.
      value: 5
      quote: "or/multnomah/portland/33.130.txt#L587,L612-L613,L799-L805"
      via: "or/multnomah/portland/33.130/33.130.215.txt#L19-L23"
      variants:
        - value: 10
          when: [civic_corridor_setback]
          quote: "or/multnomah/portland/33.130/33.130.210.txt#L65,L87"
    setback_street_off_corridor_ft:
      # The same row as the base above, held per LINE (FOLLOWUPS 8(d)).
      # Table 130-2 states the corridor number for "Street Lot Line abutting
      # selected Civic Corridors" -- one line -- and the variant above can
      # only hand it to the whole lot: `civic_corridor_setback` is true when
      # ANY street line is on a Map 130-1 stretch, so the side street of a
      # corner lot on Division takes 10 too. That stays the reading for
      # every reader without edges. The envelope reads this field instead
      # on a street line read surely OFF every stretch
      # (flats/geom/corridor.py off_corridor: no point of the line on it by
      # either reading, every point placed on a street that is not the
      # corridor), and cuts that line alone at the zone's street number off
      # the corridor. A line the stretch ends part way along is not off, and
      # keeps 10. In this zone that number is the across-the-street 5 (see
      # setback_front_ft), not the plain "none": a line off the corridor can
      # still face a residential zone across a local street.
      value: 5
      quote: "or/multnomah/portland/33.130.txt#L587,L612-L613,L799-L805"
    setback_street_across_nonresidential_ft:
      # The plain row, "Street Lot Line: none", held per LINE for the one
      # street line it reaches here: off every Map 130-1 stretch AND facing
      # no RF-RM2 or RMP zone across the street (33.130.215.B.1: "Unless as
      # specified below, there is no minimum required setback from a street
      # lot line"). The envelope reads it only on a street edge flagged both
      # off_corridor and across_clear -- five rays square to the line, over
      # the right-of-way, each finding a Portland lot in a zone the
      # neighbours block puts on the false_for side of
      # faces_residential_zone_across_street (flats/geom/neighbour.py
      # street_lines_clear). A ray that finds a split-zone lot, another
      # city's lot, nothing within reach, or a lot nearer than a street's
      # width leaves the line on the 5.
      value: 0
      quote: "or/multnomah/portland/33.130.txt#L587,L609,L795-L796"
    setback_front_max_facade_pct:
