        fact: pdx_plan_district_unmeasured
        cite: PCC 33.521.220.C, 33.521.290.C, 33.536.210.B, 33.536.240.C, 33.536.280.C.2, 33.536.300.C, 33.538.220.B, 33.545.100.C, 33.550.220, 33.561.270, 33.561.300, 33.563.220, 33.595.100.B.1, 33.595.210.C, 33.595.250.C, 33.595.270.B, 33.510.200.C.3, 33.510.210.B, 33.515.210, 33.515.230, 33.515.262, 33.526.220.B, 33.526.340.C, 33.532.220, 33.532.230.C, 33.532.245, 33.555.230, 33.562.100.B, 33.562.210, 33.562.220.B, 33.562.240.E and F, 33.567.040, 33.575.110, 33.580.110 and 33.580.130, and 33.530.050 (plan districts, which control over the base zone, 33.500.040) -- parking and driveways kept off named streets and light rail, required building lines, minimum floor area ratios printed only on a map or above the pod's on the lots they reach, residential use prohibited in Hollywood Subdistrict A and the West Portland Employment Focus Area, a rear setback of a quarter of the site depth, Macadam's wall-plane and light rail setbacks, the Linnton Hillside lot-of-record rule, and Glendoveer's flag-lot standards (15 ft on every lot line, 25 ft height); and residential use held to 20 percent of a building in part of Northwest, heights printed only on a map below the pod's, walls set parallel to Sandy Boulevard, Powell Boulevard's 8 ft sound wall, South Auditorium's landscaped street edge and tree rule, Hayden Island's commercial height step and floor area rules, and Columbia South Shore's Airport Way setback and archaeology rule. Nothing measures which street the court and drive face, the building line, the lot's history, or whether a lot is a flag lot; held only on the lots drawn_areas plan_district_unmeasured traces
        quote: "or/multnomah/portland/33.595.txt#L89,L171-L174,L393-L397,L438-L449"
    max_height_ft:
      # Table 110-4, "Maximum Height": 30 ft. in RF, R20, R10, R7 and R5, and
      # 35 ft. in R2.5. The header row is quoted with the standard's row
      # because the table puts all six districts on one printed line.
      #
      # Note [3] hangs on this cell and is already ruled in the footnote
      # ledger: "additional FAR and height may be allowed. See 33.110.265.F"
      # -- a relaxation, and it can only raise the ceiling.
      value: 30
      cite: PCC 33.110 Table 110-4; 33.110.215
      quote: "or/multnomah/portland/33.110/33.110.205.txt#L15,L32"
    setback_front_ft:
      value: 20
      quote: "or/multnomah/portland/33.110/33.110.205.txt#L36"
    setback_side_ft:
      value: 10
      quote: "or/multnomah/portland/33.110/33.110.205.txt#L38"
    setback_rear_ft:
      value: 10
      quote: "or/multnomah/portland/33.110/33.110.205.txt#L40"
