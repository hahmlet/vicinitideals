      # rear standard is 0 and the side standard is 5; at 16 or more they
      # are both 10, which is the band a 26 ft pod is in. No
      # `setback_alley_side_ft` here: 33.140 never says "alley", and a side
      # alley line takes this one number -- the ruling is under CR's
      # setback_rear_ft (FOLLOWUPS 12(c)).
