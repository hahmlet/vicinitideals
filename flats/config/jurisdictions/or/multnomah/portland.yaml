    notes: 'Central Employment. The one zone in the employment and industrial chapter where Household Living is allowed outright, and on the dimensions it is among the loosest land in the city: no minimum lot size, 65 ft of height, 100 percent coverage, no landscaped area and no setback from a street lot line. What is left is the neighbour test -- 10 ft from a lot line abutting an R zoned lot, nothing otherwise -- and Table 140-3 makes that height-banded, with the pod always in the taller band. NOT ENCODED, on purpose. (1) The inclusionary-housing bonus raises FAR from 3 to 5 (#L593); it is earned. (2) Table 140-3 note [1] disapplies the residential setbacks against lots in the RX zone (#L631), which is a third state of the neighbour fact this screen does not hold. (3) Ground-floor window standards apply in EX (#L616) and are a facade rule, not a fit one.'
    min_far:
      # PCC 33.526.220.C (Gateway) and 33.521.220.C (East Corridor): the
      # minimum FAR for new development is shown on Map 526-3 and Map 521-3,
