    # EX is the one zone Table 266-1 sends to Standard A, and Standard A's
    # Household Living cell reads "1 per 2 units" -- two stalls for the pod,
    # against a catalog target of six. The tightest parking ceiling in the
    # corpus, and it is stated in a zone that allows the building outright.
