  # --- five chapters the use tables point at, none of them this building ---
  # All five stand beside `quadplex_allowed` because they are cited from the
  # 100s series use tables, a line or two from the row that permits the pod.
  "33.205":
    outcome: other_building
    note: >-
      Accessory Dwelling Units, cited from the use tables as "Detached accessory dwelling units are
      addressed in Chapter 33.205" and "Additional regulations for accessory dwelling units are
      stated in Chapter 33.205". An ADU is a second, subordinate unit on a lot with a house. This
      screen places four attached primary units, so the chapter regulates a building that is not
      here. It could only ever add a fifth unit to a lot, which is not what is being asked.
  "33.236":
    outcome: other_building
    note: >-
      Floating Structures: "houseboat moorages in I zones are regulated by Chapter 33.236, Floating
      Structures." A moorage is not a lot and a houseboat is not a factory-built townhome, and the
      zones it is cited in are industrial ones where the pod is not permitted anyway.
  "33.285":
    outcome: other_building
    note: >-
      Short Term, Mass, and Outdoor Shelters -- "Short term, mass, and outdoor shelters are
      regulated by Chapter 33.285". A different use category from Household Living, with its own
      chapter and, in most zones, a conditional use. The pod is four dwelling units.
  "3.75":
    outcome: misread
    note: >-
      Not a reference. Table 150-1 in 33.150 prints "3.75 to 1" in the CI2 column of the Maximum
      FAR with Inclusionary Housing Bonus row; the dotted-number branch reads the figure as a
      section.
  "0.7":
    outcome: misread
    note: >-
      Same shape one chapter over. Table 110-4 prints "0.7 to 1" in the R20 and R10 columns of the
      four-or-more-dwelling-units Maximum FAR row.
  "33.270":
    outcome: other_path
    note: >-
      Planned Developments. Both mentions are Table 110-2 rows -- "Attached Duplex" and
      "Multi-dwelling Development" -- reading "Only in Planned Developments, See Chapter 33.270."
      Neither row is the pod's. The Fourplex row on the same table says Yes in R20 and R10 with no
      planned development, and that is the row this screen reads.
  "33.251":
    outcome: other_building
    note: >-
      Manufactured Dwellings and Manufactured Dwelling Parks. All four mentions are the "(See
      Chapter 33.251)" line printed under those two rows of the 33.120 use tables, which is why
      they land beside the parking geometry read from the same page. The pod is factory-built and
      is neither a manufactured dwelling nor sited in a park.
  "33.613":
    outcome: later
    note: >-
      Lots in Commercial/Mixed Use Zones. The sentence this screen reads -- "There is no required
      minimum lot size for development of land in commercial/mixed use zones" -- is followed by
      one sending lot *creation* to this chapter. Creating a lot is not a test an existing lot has
      to pass to be built on, and CR, CM1, CM2, CM3, CE and CX are encoded on the development
      half of that pair. The campus institutional zones state both halves outright, which is what
      shows the split is the code's and not a reading of it. Parked rather than closed: no pod in
      flats/config/pods declares plat: unit_lots, so this screen never creates a lot. The day one
      does, this is a fetch.
  "33.614":
    outcome: later
    note: >-
      "Lot size regulations are in Chapters 33.614 and 33.615", the whole of what 33.140 says
      about lot size in the employment and industrial zones. Land-division chapters, same shape
      as 33.613 in the commercial chapter: how a lot may be created, not a minimum a built lot
      has to meet. EX is encoded exempt on that sentence. Parked with 33.613 for the same reason:
      no pod declares plat: unit_lots today.
  "33.612":
    outcome: later
    note: >-
      Lots in Multi-Dwelling Zones. 33.120.205 says only "The creation of new lots is subject to
      the lot size standards listed in Chapter 33.612" -- the multi-dwelling twin of the 33.613
      sentence above, and parked for the same reason: it is how a lot may be made, not a minimum
      a built lot has to meet, and no pod declares plat: unit_lots. (FOLLOWUPS 105, 2026-11-08.)

  # --- FOLLOWUPS 105 (2026-11-08): every remaining binding reference followed one layer down ---
  "33.248":
    outcome: design
    note: >-
      Landscaping and Screening, fetched and read 2026-11-08
      (https://www.portland.gov/sites/default/files/code/248-landscape_0.pdf). Every number in the
      chapter says what fills a landscaped area: L1 trees per 30, 22 or 15 linear feet by tree
