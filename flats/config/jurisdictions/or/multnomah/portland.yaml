  CI1:
    cite_default:
      cite: PCC 33.150 — Table 150-1 (33.150.100 Primary Uses), 33.150.200 Lot Size, Table 150-2 (Summary of Development Standards in Campus Institutional Zones), 33.150.215 Setbacks, 33.150.220 Building Coverage, 33.150.240 Landscaped Areas
      url: https://www.portland.gov/sites/default/files/code/150-campus-inst-zones_1.pdf
      retrieved: '2026-08-19'
    quadplex_allowed:
      # Table 150-1, "Household Living": N in CI1, Y in CI2 and IR. A bare N
      # with no bracket and no conditional-use column, in the one campus zone
      # written to sit against single-family neighbourhoods.
      value: false
      quote: "or/multnomah/portland/33.150.txt#L340,L342"
    min_lot_sqft:
      # 33.150.200: no required minimum lot size for development or for the
      # creation of new lots anywhere in the campus institutional zones.
      exempt: true
      quote: "or/multnomah/portland/33.150.txt#L401-L403"
    setback_front_ft:
      # Table 150-2 states the CI1 minimum in three rows by what the lot line
      # faces: 15 ft against OS or RF-R2.5, 10 ft against RM1-RMP or IR, 0 ft
      # against a C, CI, E or I lot. There is no residual row, so every line
      # takes one of the three and which one depends on the neighbour's zoning,
      # which is not read here. Fifteen is the figure that cannot turn a RED
      # lot green. The rows are headed "abutting or across the street from",
      # so the front line owes the same as the others.
      value: 15
      quote: "or/multnomah/portland/33.150.txt#L531,L538-L545"
    setback_side_ft:
      value: 15
      quote: "or/multnomah/portland/33.150.txt#L531,L538-L545"
    setback_rear_ft:
