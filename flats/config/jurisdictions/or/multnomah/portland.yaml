# Which of this city's zones lie on which side of a lot line, for the
# commercial chapters' "abuts an OS, RX, C, E or CI zone" / "abuts an RF
# through RM4, RMP, or IR zone" -- the fact quadfit's s4 now reads off the
# taxlot fabric across every non-street lot line (neighbour_zones_json),
# turned into `abuts_nonresidential_zone` by flats/geom/neighbour.py against
# these lists. Declared here and not per zone: CR through CX, EX and the
# CI zones all turn on the same fact. A code in neither list -- another
# city's, a split-zone neighbour, a park drawn as right-of-way -- leaves the
# line unresolved and the lot UNKNOWN on the fact, as before 2026-09-21.
neighbours:
  faces_residential_zone_across_street:
    true_for: [RF, R20, R10, R7, R5, R2.5, RM1, RM2, RMP]
    false_for: [RM3, RM4, RX, IR, OS, CR, CM1, CM2, CM3, CE, CX, EG1, EG2, EX, IG1, IG2, IH, CI1, CI2]
    quote: "or/multnomah/portland/33.130.txt#L587,L612-L613,L799-L805"
    cite: PCC 33.130.215.B.1.b (Required setbacks from a street lot line); Table 130-2
      (Min. Building Setbacks - Street Lot Line across a local street)
    note: >-
      33.130.215.B.1.b: setbacks "from a street lot line on the portion of the
      site that is across a local service street from an RF through RM2 or RMP
      zone", 5 ft for a building entirely in residential use "from a street lot
      line facing an RF through RM2 or RMP zone". RF through RM2 is the
      residential ladder in the order the code prints it -- RF, R20, R10, R7,
      R5, R2.5 (33.110), then RM1, RM2 (33.120) -- and RMP is named on its own,
      so true_for is those nine. Everything past RM2 on the ladder (RM3, RM4,
      RX), IR, OS and every C, E, I and CI zone is a zone the sentence does not
      name, and a street line facing one takes Table 130-2's plain "Street Lot
      Line: none" -- so they are false_for, the relaxing side. Read PER STREET
      LINE only (flats/geom/neighbour.py street_lines_clear), never answered
      for the lot: a line is clear when every one of five rays across the
      street found a Portland lot on the false_for side; one residential ray,
      a split-zone lot, another city's lot or nothing within reach keeps the
      line on the 5. The street's class and the transit-street exception are
      not read, so the list is applied as if every street were local -- the
      tight side of both. No caps.json entry reaches this layer's commercial
      zones, so declaring the list lifts no cap.
  abuts_nonresidential_zone:
    true_for: [OS, RX, CR, CM1, CM2, CM3, CE, CX, EG1, EG2, EX, IG1, IG2, IH, CI1, CI2]
    false_for: [RF, R20, R10, R7, R5, R2.5, RM1, RM2, RM3, RM4, RMP, IR]
    quote: "or/multnomah/portland/33.130.txt#L615-L619,L829-L835"
    cite: PCC 33.130.215.B.2.a-b (Required setbacks from a lot line that is not a
      street lot line); Table 130-2 (Min. Building Setbacks rows); PCC 33.140.215.B
      and Table 140-2 for the E zones; PCC 33.150 Table 150-2 for the CI zones
    note: >-
      33.130.215.B.2.a: "no minimum setback required from a lot line that
      abuts an OS, RX, C, E or CI zone"; B.2.b: "from a lot line that abuts
      an RF through RM4, RMP, or IR zone is 10 feet". Table 130-2's row spells
      the first list "OS, RX, C, E, or I Zoned Lot" -- the text names CI and
      the table names I, and both are on the same page, so both families are
      on the true_for side. C = CR, CM1, CM2, CM3, CE, CX; E = EG1, EG2, EX; I =
      IG1, IG2, IH. RX is on the true_for side in both chapters: 33.140.215.B.2
      reads "Lot line abutting R-zoned lot, except RX" and footnote [1] to
      Table 140-2 says the R row "does not apply to lot lines that abut lots
      in the RX zone". IR is on the false_for side because 33.130 puts it with the
      residential zones (10 ft) and 33.140's R row does not name it either
      way -- the tightening reading. The map's lowercase suffixes (R5a, CM2d)
      are stripped before the lookup (ingest.strip_lowercase_suffix). The
      one zone whose own chapter sorts differently is CI: 33.150 Table 150-2
      gives a CI lot 10 ft against an OS lot (not none), so OS on the true_for
      side over-relaxes a CI1/CI2 home lot next to a park; both CI zones are
      capped on site_specific_limitation (caps.json) and never certify, and
      the guard in flats/tests/test_neighbour.py holds that pairing until CI
      gets its own list. The condition is true of a lot only when EVERY
      non-street line is fully read and everything across it is on the true_for
      side; one residential point anywhere settles it false.

# Whether a private drive the lot abuts is a street here (FOLLOWUPS 4,
# 2026-09-29): s4 reads a line within 50 ft of a private road as a street line.
private_drives:
  street: true
  quote: "or/multnomah/portland/33.910/33.910.030.txt#L846-L850"
  says: "or it may be privately owned"
  cite: "PCC 33.910 (Right-of-Way; Street Types: Street; Tract)"
  note: >-
    A street is "a right-of-way that is intended for motor vehicle ... access to
    abutting property" (L1373), and a right-of-way "may be privately owned" and
    "will be in a tract" where not deeded to the public (L1157-L1159); a tract's
    examples include "private street or alley tracts" (L1430). So a private
    street on its own tract is a street for the corner lot and the front lot
    line. A shared driveway on an easement across a neighbour is a driveway
    (33.266), not a right-of-way: s4 reads that as a drive on other land and it
    is screened both ways.

# Clear-vision areas at corners and drives (FOLLOWUPS 161; flats/geom/sight_triangle.py).
clear_vision:
  corner:
    status: none
    source: data/flats/books/sight-manuals/portland/trn_2_09.txt#L12
    cite: PBOT TRN-2.09
    note: 'Portland''s corner sight rule keeps the right of way clear only; nothing on the lot (rulings.yaml
      2026-11-09-portland-driveway-clear-zone-note: corners stay right-of-way only).'
  driveway:
    status: read
    kind: edge
    legs_ft: 15
    basis: pavement_edge
    note_only: true
    exempt_at_lot_line: true
    source: data/flats/books/sight-manuals/portland/trn_10_40_full.txt#L112-L116
    cite: PBOT TRN-10.40 7.a
    ruling: 2026-11-09-portland-driveway-clear-zone-note
    note: '''a 15-foot by 15-foot clear sight triangle ... on each side of the driveway surface, measured
      along the near edge of the pavement''; ''buildings built at the property line'' exempt. A street-permit
      rule: GREEN with a note, colour unchanged (Steph 2026-11-09).'
