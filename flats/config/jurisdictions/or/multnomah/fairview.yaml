      # FMC 19.30.040.B, reached from note (5) on the Quadplex row of Table
      # 19.30.020.A. At least one main entrance of a quadplex must sit within
      # eight feet of the longest street-facing wall and must face the street,
      # be angled up to 45 degrees off it, face a common open space adjacent
      # to the street, or open onto a porch. That binds the door and not the
      # building: the four ways of satisfying it include a 45-degree entry and
      # a porch, so the 56-foot wall is not made to face the street and the
      # fit stage keeps both orientations.
      value: entrance_only
      quote: "or/multnomah/fairview/19.30.txt#L515,L517,L519-L531"
    setback_front_ft:
      # Table 19.30.030.A row 8, and the table is not the whole rule. 19.30.030(D)
      # governs every zone in this chapter: in an "established residential area"
      # -- one platted before 17 November 2001 -- the front setback of new infill
      # must come within five feet of the nearest single-unit dwelling's on the
      # same street, or the average of two flanking ones, floored at 10 feet and
      # capped at 40. The 10 in the table is the floor of that range, not the
      # standard, and holding it flat is holding the loosest end of a band four
      # times as deep. Neither trigger is answerable here: the plat date is not
      # in the parcel data and the neighbour's setback would need a building
      # footprint measured to a lot line. Qualified rather than banded, the way
      # this zone's height already is for 19.30.030(E), so the value cannot
