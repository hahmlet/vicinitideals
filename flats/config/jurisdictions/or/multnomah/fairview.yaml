    notes: >-
      Fairview counts differently from its neighbours. FMC 19.13 defines a "multi-unit dwelling" as "a building containing five or more dwelling units", so the P on that row is not this building's P -- a quadplex is four. The same chapter defines "quadplex" as "four dwelling units on a lot or parcel in any configuration" and "single-unit attached housing (townhouses)" as "two or more single-unit dwellings with common end-walls", which the pod is. Read the five-or-more row as the permission and every village zone in this city screens green on a standard that does not apply to the building.


      Which row the pod lands on turns on whether the four units sit on one lot or four. On four they are unambiguously attached single-unit dwellings and the answer is a conditional use. On one they are a quadplex, which is its own defined term here and is on no village list at all -- the TCC chapter next door gives quadplexes their own table row, so the code plainly distinguishes them. The variant therefore asks for the land division as well as the permit, which is the conservative of the two readings and the one a reviewer can argue with.


      Two standards here are read and left out because they describe the
      building rather than the lot, and both would refuse a pod that arrived in
      the wrong shape. 19.145.040 requires hipped, gambrel or gabled roofs at a
      pitch of no less than 4:12 and does not permit flat roofs except over
      mechanical equipment. 19.145.020 asks that primary entries be reached
      directly from a public street and that every other unit on a block
      frontage have a front porch. A factory-built pod is a fixed design; these
      are the standards on which a fixed design either qualifies for this zone
      or does not, and no lot geometry will answer them.


      19.125.040(E) also bars direct motor vehicle access to apartment parking
      lots from NE Halsey Street, and 19.145.090 requires access to come from
      the alley on any lot that abuts one. Both are access rules for the
      geometry layer rather than dimensions of the lot.


      The front setback encoded here is the strict end of a sentence that
      offers three answers. "Front facades shall be set back from right-of-way
      a distance of either zero feet or 10 feet or 15 feet" is a menu the
      applicant picks from, so off Halsey the front costs nothing; the
      exception that follows it puts twenty feet on the Halsey Street frontage
      of any VA lot adjacent to that street. Which street a lot fronts is not
      a fact this system holds, so the exception is the base -- and on a lot
      that is not on Halsey the encoded twenty is twenty feet this zone does
      not actually ask for.
