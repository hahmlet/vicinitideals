  R/CSP:
    section: ["19.108"]
    cite_default:
      cite: FMC 19.108.010 (Community Service/Parks Overlay - Uses)
      url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19108.html
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/fairview/19.108.txt#L9,L11,L13-L25"
    notes: >-
      A Metro layer label, not a Fairview zone, and the shortest chapter in
      this code answers it. 19.108.010 is one sentence and seven items: a
      government building, a park or playground, open space and green way, a
      library, a school, a power substation, telecommunications. No dwelling
      of any kind. The overlay is additive -- those uses "may be permitted in
      ANY zoning district when approved at a public hearing" -- so it does not
      by itself take away whatever the base district allows.


      What settles these 55 lots is the sentence after the list: "The district
      is to be applied only to public property (lands owned by public agencies)
      or utilities." The city applied the district, so the land is public. That
      is an ownership fact rather than a use prohibition, and it is stated here
      rather than inferred because the distinction matters: nothing in this
      chapter forbids housing on land somebody else owns, and if one of these
      parcels were ever sold the answer would come from the base district
      instead.


      Which base district that is remains unknown, and deliberately so. The
      label reads "R/" and this city has R-6, R-7.5 and R-10; the Metro label
      does not say which, exactly as with R/SFLD and RM/TOZ elsewhere in this
      layer. Guessing one would put a number on 55 parcels on the strength of
      a slash. The refusal encoded here does not need the guess -- a screen
      that reported these lots green would be pointing an acquisition team at
      a city park.
