      that "the VMU area shall be occupied by townhomes and commercial uses",
      which is a programme for the district rather than a standard for a lot
      and is the reason the conditional use is worth applying for here. Two
      standards are read and left out because they are mapped or facade-shaped:
      (A)(2)(f) restricts residential to the second and third floors in the
      "four corners area" delineated on Figure V-1, and (A)(2)(c) asks retail
      facades to reach the lot line -- retail, not this building. Chapters
      19.140 and 19.150 add pedestrian ways, bicycle parking, landscaping,
      blank wall, entry, roof and materials standards, none of which is a
      dimension of the lot.
