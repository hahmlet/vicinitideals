  TCC:
    section: ["19.65"]
    cite_default:
      cite: FMC 19.65.020 Table 19.65.020(A) (Land Uses and Building Types Permitted in the Town Center Commercial District), row 1.h Quadplexes; FMC 19.65.030 through 19.65.060
      url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview1965.html
      retrieved: '2026-08-19'
    # Row h reads `Quadplexes P` -- the only outright permission for this
    # building in any of Fairview's commercial districts, and the base here is
    # still false. 19.65.030 designates a Halsey Street storefront district as
    # a SUBAREA of this zone, and inside it "residential uses shall be
    # permitted only when part of a mixed use development". The boundary is a
    # figure this system cannot read, so whether a given TCC lot sits inside
    # it is unmeasured, and the conservative reading is that it does.
    #
    # Electing the mixed use satisfies the requirement whether or not the lot
    # is in the subarea, so `mixed_use` alone is the variant -- unlike Wood
    # Village NC across the city line, which needs a conditional use as well
    # because its table never permits the building outright. The two cities
    # are running the same storefront programme: 19.65.030.A says the concept
    # "is applied to multiple areas on Halsey Street across Fairview, Wood
    # Village, and Troutdale".
    quadplex_allowed:
      value: false
      quote: "or/multnomah/fairview/19.65.txt#L45,L47-L48,L57,L101,L109,L111"
      variants:
        - value: true
          when: [mixed_use]
          quote: "or/multnomah/fairview/19.65.txt#L45,L47-L48,L57,L109,L111,L115,L117"
    # 19.65.100(A)(1), in words: "There is no minimum or maximum residential
    # density standard. Density shall be controlled by the applicable floor
    # area and building height standards." The chapter then states no floor
    # area ratio and no lot coverage, so height and the setbacks below are the
    # whole of the envelope. Read and empty, not unread.
    min_lot_sqft:
      exempt: true
      quote: "or/multnomah/fairview/19.65.txt#L699,L701"
    # 45 feet, and 19.65.070 will sell another 20 on top of it. The step-downs
    # in 19.65.060(B) reduce the limit on a PORTION of a site within 25 feet
    # of a residential zone -- 35 feet next to R, R-7.5, R-10 or VSF -- and
    # the 26-foot pod clears even that, so the unmeasured adjacency cannot
    # change this pod's answer.
    max_height_ft:
      value: 45
      quote: "or/multnomah/fairview/19.65.txt#L241,L245,L247,L249,L251"
    # "There is no minimum front setback required." The zone wants buildings
    # at the sidewalk, not away from it, which is why the binding front number
    # here is the MAXIMUM.
    setback_front_ft:
      value: 0
      quote: "or/multnomah/fairview/19.65.txt#L155,L161,L163"
    # Ten feet, and this is a real constraint on a fixed-dimension building:
    # at least 50 percent of the ground level street-facing facade must sit
    # within it (75 percent inside a storefront district). A 56-foot pod set
    # back further than 10 feet fails the zone even though it fits the lot.
    setback_front_max_ft:
      value: 10
      quote: "or/multnomah/fairview/19.65.txt#L155,L165,L177,L179"
    # Zero, except fifteen when the building abuts a residential district --
    # and which of those applies is the neighbour's zoning, which this system
    # does not hold. The fifteen is the base for the same reason Portland's
    # side setback is: reading it the other way is how a lot with houses
    # behind it screens as buildable to its own line.
    setback_side_ft:
      value: 15
      quote: "or/multnomah/fairview/19.65.txt#L155,L207"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/fairview/19.65.txt#L155,L207"
    # The same sentence pair on the rear line, with an extra step in the
    # middle: zero on street-access lots, eight on alley-access lots so a car
    # can park parallel behind the building, fifteen against a residential
    # district. Both reliefs are recorded and neither can fire, because both
    # facts they turn on are unmeasured or assumed absent.
    setback_rear_ft:
      value: 15
      quote: "or/multnomah/fairview/19.65.txt#L155,L201,L203"
      variants:
        - value: 0
          when: [abuts_nonresidential_zone]
          quote: "or/multnomah/fairview/19.65.txt#L155,L201,L203"
        - value: 8
          when: [abuts_nonresidential_zone, abuts_alley]
          quote: "or/multnomah/fairview/19.65.txt#L155,L201,L203"
    notes: >-
      This is the one Fairview district that permits the pod outright, and
      the encoding still opens with a refusal. The reason is a subarea:
      19.65.030 draws a Halsey Street storefront district inside the TCC zone
      and requires every development there to include a nonresidential use.
      The chapter is generous about what counts -- 1,000 square feet of
      enclosed commercial space, a food cart pod of four or more carts, or a
      micro retail pod of three retailers in prefabricated buildings under 600
      square feet each -- but the pod on its own is none of them, and the
      boundary is Figure 19.65.030(B), a map. A second storefront limit,
      19.65.030(D)(2), caps ground-floor residential at 50 percent of a site's
      Halsey Street frontage; it needs the same unread map and a frontage
      measurement besides.


      What the zone does NOT state is as load-bearing as what it does. There
      is no minimum lot size, no density standard, no floor area ratio and no
      lot coverage limit -- 19.65.100(A)(1) says density is controlled by
      floor area and building height instead. So the envelope is four numbers:
      45 feet of height, a 10-foot MAXIMUM front setback, and the side and
      rear lines. A screen that treats a missing lot-size row as unread would
      hold this zone open forever waiting for a number the code does not have.


      Three standards are read and deliberately left out of the fields. The
      design standards of 19.65.090 -- including a five-foot front setback for
      ground-floor dwelling units under option R3(b) and an eight-foot entrance
      setback under R4 -- apply by 19.65.090(A) to three or more attached
      townhomes on their own lots, to quadplex developments with MORE THAN ONE
      building, and to multi-unit housing. A single four-unit building on a
      single lot is none of the three, so they do not reach this pod; divide
      the same four units onto unit lots and they all do. 19.65.080(B) caps
      building length within 20 feet of a street lot line at 150 feet, which a
      56-foot building cannot approach. And 19.65.100(A)(2) requires off-street
      parking to be oriented to an alley, underground, above the ground floor,
      or behind or beside the building, with corner side yards barred from
      surface parking -- a siting rule for the stalls rather than a dimension
      of the lot, and one the geometry layer will have to answer when it can
      see a parcel's alley and street edges.
