      or utilities." The city applied the district, so the land is public. That
      is an ownership fact rather than a use prohibition, and it is stated here
      rather than inferred because the distinction matters: nothing in this
      chapter forbids housing on land somebody else owns, and if one of these
      parcels were ever sold the answer would come from the base district
      instead.


      Which base district that is remains unknown, and deliberately so. The
      label reads "R/" and this city has R-6, R-7.5 and R-10; the Metro label
      does not say which, exactly as with R/SFLD and RM/TOZ elsewhere in this
      layer. Guessing one would put a number on 55 parcels on the strength of
      a slash. The refusal encoded here does not need the guess -- a screen
      that reported these lots green would be pointing an acquisition team at
      a city park.
