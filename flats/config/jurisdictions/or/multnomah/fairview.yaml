      url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19163.html
      retrieved: '2026-08-26'
      quote: "or/multnomah/fairview/19.163.txt#L73,L75"
    notes: >-
      Quadplex outright, and the minimum lot is the detached-dwelling minimum:
      6,000 sq ft buys four units here. Maximum FAR is 0.7, and it is close:
      the pod's 4,032 sq ft of floor over a 6,000 sq ft lot is 0.67, which
      passes on the smallest lot the zone allows and by too little to ignore
      if a lot is ever smaller.


      This paragraph used to refuse that FAR, on the grounds that the registry
      had no floor-area field to put it in. Both halves were true when it was
      written and neither is now: `max_far` was added and encoded here and on
      four sibling zones, and nobody went back to the sentence saying it could
      not be. A refusal is a claim about the present tense, and this one
      outlived its subject by weeks while reading like a live constraint.


      BUILDING HEIGHT TRANSITION, READ WIDE. Row 17 of Table 19.30.030.A gives
      this zone its height, and 19.30.030(E) makes that conditional: taller
      buildings "shall 'step-down' to create a building height transition to
      adjacent single-story building(s)", triggered "within 20 feet (as
      measured horizontally) of an existing single-story building with a height
      of 20 feet or less". At 26 ft the pod is the taller building, and the
      standard is met only where the separation buys the height — so on a
      close-built established street it can refuse the building outright rather
      than move it.


      Two facts decide it and nothing here holds either: the neighbouring
      structure's height and storey count, and a horizontal distance between
      two buildings rather than between a building and a line. Carried as
      `qualified_by` so the unqualified figure cannot certify a lot on its own.


