    like: RM
    notes: 'Metro layer label, not a Fairview zone: the RM base district with the townhouse overlay
      mapped onto it. Adopted by reference rather than restated, so every number still cites the RM
      row it was read from and an amendment to Table A moves this zone with it. What the TOZ overlay
      itself changes at parcel level is unconfirmed — the overlay is townhouse-oriented, and if it
      turns out to move a standard, that standard belongs here as a local value overriding the
      reference. quadfit confidence: needs_verification.'
  R/SFLD:
    cite_default:
      cite: 'Mapping inference: Metro ''R/SFLD'' = old Lower Density Residential overlay -> current R-10;
        standards per amended 19.30.030'
      url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview1930.html
      retrieved: '2026-07-24'
    like: R-10
    notes: 'Metro layer label, not a Fairview zone. The label predates the 2024 recodification and the
      R-10 row is applied to it by inference — which is the part that needs a person, and the reason
      the inference is in the cite where a reviewer will read it rather than buried in a number.
      Adopted by reference rather than restated: the six standards that were hand-copied here matched
      R-10 exactly and cited nothing, and would have gone on matching a superseded table forever.
      quadfit confidence: needs_verification.'
  VSF:
    cite_default:
      cite: FMC 19.115 Village Single-Family (.020 uses, .040 dimensional)
      url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19115.html
      retrieved: '2026-07-24'
    min_lot_depth_ft:
      value: 70
      quote: "or/multnomah/fairview/19.115.txt#L37"
    quadplex_allowed: true
    setback_front_ft:
      value: 10
      quote: "or/multnomah/fairview/19.115.txt#L47"
    setback_side_ft:
      # 19.115.040(E)(1)(d) is four feet on one side and five on the opposite,
      # combined at least nine. The field carries one number for both sides,
      # so the five governs: it clears both stated minimums and the combined
      # test at ten. The four is one lot line's worth and a pod that wants it
      # has to say which side, which is a site-plan question rather than a
      # rules one.
      value: 5
      quote: "or/multnomah/fairview/19.115.txt#L53"
    setback_rear_ft:
      value: 15
      quote: "or/multnomah/fairview/19.115.txt#L55"
    setback_street_side_ft:
      value: 10
      quote: "or/multnomah/fairview/19.115.txt#L53"
    min_lot_sqft:
      value: 4000
      quote: "or/multnomah/fairview/19.115.txt#L35"
    max_coverage_pct:
      value: 60
      quote: "or/multnomah/fairview/19.115.txt#L39"
    notes: 'quadfit confidence: needs_verification. Quadplex use flows in via the amended 19.30.020
      linkage, which is the needs_verification part; village design standards apply on top.

      SIDE SETBACK CORRECTED 2026-08-16. It held 4.5, which is not a number the code states — it was
      the average of the four-foot side and the five-foot side, chosen for the widest building
      envelope, and it puts a wall six inches inside the five-foot line. Now 5, quoted.

      Front is encoded at 10 because 19.115.040(E)(1)(a) states "either 10 or 15 feet" and the choice
      is the developer''s, so 10 is a number the code allows rather than the loose end of a range.

      NOT ENCODED: the townhouse lot size. 19.115.040(A) exempts townhomes from the 4,000-square-foot
      minimum and sends them to FMC 19.30.030, whose Table 19.30.030.A has columns for R-6, R-7.5,
      R-10, the Townhouse Overlay and RM — and none for VSF. The cross-reference lands nowhere, so
      the encoded 4,000 stands and the exemption is left for a person.'
