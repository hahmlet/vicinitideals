  "19.13.definitions.txt#19.13.020":
    queue: condition
    outcome: cant_tell
    note: >-
      Fairview's height datum, and it is a genuine site condition rather than a nuisance. The
      definition sets the point building height is measured from: normally the higher of the
      adjoining grades, but on a site that falls more than ten feet across it, the lowest grade
      plus ten feet. On a steeply falling lot the reference point moves and the effective ceiling
      changes. The pod stands 26 feet against Fairview ceilings that leave roughly nine feet of
      slack, so this is not obviously fatal -- but slack of nine feet against a datum shift of up
      to ten is exactly the range where the answer depends on the parcel. Nothing in this pipeline
      measures a lot's fall. Filed as depending on the site: it belongs with the unmeasured site
      facts alongside slope, and it is answerable by data rather than by more reading.
    fingerprint: 47ffe244eb6ce6b3
