defaults:
  # Chapter 19.164, Off-Street Parking, read 2026-08-26. The cross-reference
  # ledger ordered it because Fairview's maximum was unread and a maximum below
  # four would stop a pod that needs four stalls. The chapter answers both ends
  # and the answer is the same at each: nothing.
  #
  # 19.164.030(A) is one sentence -- "There is no minimum off-street parking
  # requirements for new developments." Every zone in this city had been
  # resolving parking_min_per_unit to 1.0 off OAR 660-046-0220, which is the
  # ceiling the state puts on what a city may require of middle housing, not a
  # requirement of its own. Fairview requires none, so none is what binds, and
  # four stalls -- roughly 1,300 square feet of a site that also has to hold a
  # 56 by 36 pod and its access -- come back to every lot in Fairview.
  parking_min_per_unit:
    value: 0
    cite: FMC 19.164.030(A) (Vehicle parking standards)
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19164.html
    retrieved: '2026-08-26'
    quote: "or/multnomah/fairview/19.164.txt#L25"
  # And no maximum. Every residential row of Table 19.164.030(A) -- accessory
  # dwelling, manufactured home, manufactured home park, "Multi-Unit Including
  # Duplex, Triplex, Cottage Clusters and Townhouses", rooming house, single
  # unit detached -- prints None in both maximum columns. The column reads as a
  # ceiling rather than a prohibition because the same table gives banks 5.4,
  # restaurants 19.1 and fast food with a drive-through 12.4, and prints None
  # for hospitals and hotels beside them.
  parking_max_per_unit:
    exempt: true
    cite: FMC 19.164.030(C) and Table 19.164.030(A), Residential Uses rows
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19164.html
    retrieved: '2026-08-26'
    quote: "or/multnomah/fairview/19.164.txt#L31-L32,L43-L45,L155"
  # How big a stall is, from the 90-degree standard row of the Minimum Parking
  # Space and Aisle Dimensions table in 19.164.030(D). Fairview asks for a
  # wider aisle than anybody else in this corpus -- 24 feet where Gresham asks
  # 23 and Portland 20 -- and the same 24 whether the court runs one way or
  # two, so a rear court here is dimensioned off the widest figure in the file.
  # Compact stalls are permitted up to 40 percent of the spaces provided; the
  # standard row is what a placement is screened against.
  parking_stall_width_ft:
    value: 9
    cite: FMC 19.164.030(D), Minimum Parking Space and Aisle Dimensions, 90 degrees, standard
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19164.html
    retrieved: '2026-08-26'
    quote: "or/multnomah/fairview/19.164.txt#L161-L162,L167"
  parking_stall_depth_ft:
    value: 19
    cite: FMC 19.164.030(D), Minimum Parking Space and Aisle Dimensions, 90 degrees, standard
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19164.html
    retrieved: '2026-08-26'
    quote: "or/multnomah/fairview/19.164.txt#L161-L162,L167"
  parking_aisle_one_way_ft:
    value: 24
    cite: FMC 19.164.030(D), Minimum Parking Space and Aisle Dimensions, 90 degrees, standard
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19164.html
    retrieved: '2026-08-26'
    quote: "or/multnomah/fairview/19.164.txt#L161-L162,L167"
  parking_aisle_two_way_ft:
    value: 24
    cite: FMC 19.164.030(D), Minimum Parking Space and Aisle Dimensions, 90 degrees, standard
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19164.html
    retrieved: '2026-08-26'
    quote: "or/multnomah/fairview/19.164.txt#L161-L162,L167"
  # ------------------------------------------------------------------------
  # Chapter 19.162, Access and Circulation, read the same day and NOT ENCODED,
  # in two places, for two different reasons.
  #
  # 19.162.020(O), Vision Clearance: "No signs, structures or vegetation in
  # excess of three feet in height shall be placed in 'vision clearance areas,'
  # as shown above." This is the exemption's qualifier -- FMC 19.70.020.A.3
  # waives the side setback "except that buildings shall conform to the vision
  # clearance standards in Chapter 19.162 FMC" -- and it states a height, not
  # an extent. The triangle itself is a picture: the text says "as shown
  # above", and 19.13's definition closes the loop by saying "'Vision clearance
  # area' means the shaded area as shown on the following figure is the vision
  # clearance area." Two documents, no number. This is the Gresham 9.0200 shape
  # one step worse -- there the dimension lived in an engineering manual the
  # corpus does not hold, here it lives in a drawing no extractor reads. It
  # bites corner lots only and it takes buildable area this screen counts in
  # full, so it is a known under-count, deliberately taken.
  #
  # 19.162.020(L), Driveway Openings, was transcribed here as an unencodable
  # rule until 2026-08-27 and is now in `defaults` below. The reading that
  # took the ten-foot doubt out of it is written up there rather than here.
  #
  # Chapter 19.163, Landscaping, read the same day and mostly encoded.
  # 19.163.030(C) states a landscape minimum for six named district types and
  # the numbers are written into the zones they reach: 20 percent across the
  # residential districts, five in the town center. Four zones that the list
  # does reach were left alone on purpose -- LI, GI, CC and VO are settled
  # refusals with no relief in them, and this file's convention, pinned in
  # test_fairview_closes, is that a district which refuses the use never
  # reaches a setback. Writing a landscape percentage into a district where
  # the pod cannot go is work that can never bind and one more value to keep
  # true. The village zones take their percentages from their own article
  # instead; see the comments on VSF and VMU for the two that take none.
  #
  # 19.163.030(E)(3)(b), the four-foot separation between a parking or
  # maneuvering area and the building it serves, was transcribed here as
  # unencodable and is now `parking_building_buffer_ft` in `defaults` below.
  #
  # ------------------------------------------------------------------------
  # DRIVEWAY, APPROACH AND PARKING PLACEMENT, transcribed 2026-08-26 as the
  # largest single hole this city had, encoded 2026-08-27 once the registry
  # grew a field family for it. This screen's product will be built with
  # parking whether or not the code asks for it, and Fairview regulates
  # parking fully while requiring none of it -- the pairing that made this
  # gap invisible to every ledger that counts fields.
  #
  # The pod takes one of two branches, the same split this layer already
  # records for the use question: on one lot it is a quadplex and reaches
  # 19.30.040; on four it is townhouses and reaches 19.30.050.
  #
  # WHICH ROW OF 19.162.020(L) THIS BUILDING IS ON, settled. L.1 gives
  # "single-unit dwelling, duplex, triplex, quadplex, and townhouse uses" a
  # minimum driveway width of 10 feet and a maximum of 24. L.2 gives
  # "multiple-unit uses and cottage clusters with between four and seven
  # dwelling units" a minimum of 20 and a maximum of 24. Both reach a
  # four-unit building on their face and they are ten feet apart at the
  # minimum. L.1 is the one encoded, because it names the quadplex and because
  # this layer has already established, for the use question, that Fairview's
  # "multi-unit dwelling" means five dwellings or more -- which puts the
  # four-to-seven row of L.2 at odds with the definition and L.1 squarely on
  # this building. The maximum is 24 either way, so only the floor is at
  # stake, and the floor is not what a site plan is screened against.
  driveway_approach_min_width_ft:
    value: 10
    cite: FMC 19.162.020(L)(1), driveway openings, single-unit/duplex/triplex/quadplex/townhouse uses
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19162.html
    retrieved: '2026-08-27'
    quote: "or/multnomah/fairview/19.162.txt#L103-L107"
  # The 24-foot ceiling of the same row. Fairview states a second approach
  # figure in a different chapter -- 19.30.040(F)(1), "The total width of all
  # driveway approaches must not exceed 32 feet per frontage, as measured at
  # the property line", the state model code's number and the same one
  # Wilsonville and unincorporated Clackamas print -- and the two do not
  # conflict: 32 feet is the budget for every approach on a frontage together,
  # 24 is the ceiling on any single opening. This design draws one approach,
  # so 24 is the figure that binds it and 32 is slack it cannot use.
  #
  # NOT ENCODED, from the rest of (F): (F)(3)(c) allows a quadplex fronting
  # only local streets to take two approaches totalling 32 feet on one
  # frontage, or one 16-foot approach per frontage -- a second-frontage
  # allowance no lot record here can be tested against; and (F)(3)(a) requires
  # access from an improved alley where one abuts, otherwise from the street
  # of lowest classification, which is street class and alley presence, two
  # site facts nothing measures.
  driveway_approach_max_width_ft:
    value: 24
    cite: FMC 19.162.020(L)(1), maximum driveway width; FMC 19.30.040(F)(1) caps all approaches on a frontage at 32 ft
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19162.html
    retrieved: '2026-08-27'
    quote: "or/multnomah/fairview/19.162.txt#L103-L107"
  # 19.30.040(E)(2). Garages and off-street parking areas may not sit between
  # a building and a public street other than an alley, "except in compliance
  # with" three subsections, of which (2) is the one a pod with no garage can
  # reach: "Garages do not exceed a total of 50 percent of the front facade of
  # the building and the total garage and outdoor on-site parking and
  # maneuvering areas do not exceed 50 percent of the property street
  # frontage." Fifty percent of the frontage, counting the drive and the
  # manoeuvring with the stalls -- the model-code figure, and the same
  # sentence Wilsonville, Milwaukie and Oregon City print.
  parking_area_max_frontage_pct:
    value: 50
    cite: FMC 19.30.040(E)(2), total garage and outdoor on-site parking and maneuvering areas as a share of property street frontage
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview1930.html
    retrieved: '2026-08-27'
    quote: "or/multnomah/fairview/19.30.txt#L567-L571"
  # The other limb of the same sentence, (E)(1), is why this is exempt rather
  # than true: a garage or parking area IS allowed between the building and
  # the street where it "is separated from the street property line by a
  # dwelling". Fairview caps front-yard parking; it does not ban it. The ban
  # exists only on the townhouse fallback path at 19.30.050(D)(2)(a) -- "No
  # off-street parking shall be allowed in the front yard or side yard of a
  # townhouse" -- reached only by a project that fails all four standards at
  # (D)(1), which is a condition about a project rather than a lot.
  parking_front_prohibited:
    exempt: true
    cite: FMC 19.30.040(E)(1) and (E)(2), which permit parking between a building and the street subject to two conditions
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview1930.html
    retrieved: '2026-08-27'
    quote: "or/multnomah/fairview/19.30.txt#L567-L571"
  # 19.30.050(D)(1)(c), on unit lots only: front-facade garages, front-yard
  # parking and front driveways are allowed for townhouses only where every
  # lot has 15 feet of local-street frontage, there is at most one approach
  # per townhouse, "outdoor on-site parking and maneuvering areas do not
  # exceed 12 feet wide on any lot", and no garage is wider than 12 feet.
  # Twelve feet is a driveway and not a court, which is the same finding as
  # Gresham's twelve, Wilsonville's twelve, Oregon City's twelve and
  # Milwaukie's ten. On one lot 19.30.040 caps the share of the frontage and
  # not the width, so there is nothing here to hold.
  parking_maneuvering_max_width_ft:
    exempt: true
    cite: FMC 19.30.040(E), which caps outdoor parking and maneuvering as a share of street frontage and states no width
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview1930.html
    retrieved: '2026-08-27'
    quote: "or/multnomah/fairview/19.30.txt#L567-L571"
    variants:
      - value: 12
        when: [unit_lots]
        cite: FMC 19.30.050(D)(1)(c), outdoor on-site parking and maneuvering areas on a townhouse lot
        quote: "or/multnomah/fairview/19.30.txt#L655-L665"
  # 19.163.030(E)(3)(b): "Where a parking or maneuvering area, or driveway, is
  # adjacent to a building, the area shall be separated from the building by a
  # raised pathway, plaza, or landscaped buffer no less than four feet in
  # width." The sentence after it closes the cheap option for this product --
  # "When parking areas are located adjacent to residential ground-floor
  # living space, a landscape buffer is required to fulfill this requirement"
  # -- so the four feet cannot be paved and counted with the court. A rear
  # court here is four feet deeper than its stalls and aisle, on top of an
  # aisle already the widest in the corpus.
  parking_building_buffer_ft:
    value: 4
    cite: FMC 19.163.030(E)(3)(b), separation between a parking or maneuvering area and an adjacent building
    url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview19163.html
    retrieved: '2026-08-27'
    quote: "or/multnomah/fairview/19.163.txt#L175"
  #
  # NOT ENCODED: any private open space standard. Fairview states one --
  # 19.30.090(B)(2), ground-floor units get patios or decks of at least 48
  # square feet -- and it is inside 19.30.090, "Residential medium density (RM)
  # district", under the heading "Multi-Unit Housing Development Standards",
  # opening "New multi-unit developments shall comply with all of the
  # following standards". Two things put this building outside it: the
  # standard is a district standard for RM and not a citywide one, and this
  # layer has already settled that a Fairview multi-unit dwelling is five
  # dwellings or more. Neither the 10 percent common open space of
  # 19.30.090(B)(1) nor the 48 square feet of (B)(2) is encoded, which means
  # a Fairview site plan reserves no open space at all -- and that is the code
  # as read, not an omission. (or/multnomah/fairview/19.30.txt#L923-L933)
  #
  # NOT ENCODED, the rest of what applies once a stall exists: 5 percent of
  # the combined parking area landscaped with at least one tree per five
  # spaces (19.163.030(E)(2)(a)); a wall, arcade, trellis or evergreen hedge
  # where a parking or maneuvering area runs adjacent and parallel to a street
  # or driveway (19.163.030(E)(3)(a)); 13 ft 6 in of vertical clearance over
  # every drive, aisle and turnaround (19.162.020(N)); 50 ft of separation
  # between a driveway and the next driveway or intersection on a local street
  # (19.162.020(G)(1)); and compact stalls capped at 40 percent of the spaces
  # provided (19.164.030(D)). Nothing here needs an EV conduit or a bicycle
  # space -- both thresholds start at five units and this building has four
  # (19.164.030(H), 19.164.040(B)).

zones:
  LI:
    section: ["19.80"]
    cite_default:
      cite: FMC 19.80.020 Table 19.80.020.A (Land Use Types Permitted in the Light Industrial District); FMC 19.80.020.C
      url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview1980.html
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/fairview/19.80.txt#L43,L45-L46,L80"
    notes: >-
      Table 19.80.020.A has four use categories -- Industrial, Commercial,
      Civic and Semi-Public, Other -- and no residential one at all. The
      district does not refuse the pod by leaving it off a list; it refuses it
      twice. 19.80.020.C states the prohibition in words: "The following uses
      are expressly prohibited: new housing, and similar facilities, and
      nonvocational schools." Fairview writes closed lists. Every commercial and industrial chapter opens the same way -- "Only land uses that are specifically listed in Table 19.xx.020.A, and land uses that are approved as 'similar' to those in Table 19.xx.020.A, may be permitted" -- so a use missing from the table is refused rather than unaddressed. That sentence is what makes an absence readable, and it is quoted with every refusal here.
  GI:
    section: ["19.85"]
    cite_default:
      cite: FMC 19.85.020 Table 19.85.020.A (Land Uses Types Permitted in the General Industrial District), row 2 Residential
      url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview1985.html
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/fairview/19.85.txt#L35,L37-L41,L61-L63"
    notes: >-
      This table does have a Residential category and it is one row: "One
      caretaker unit shall be permitted for each development, subject to the
      standards in FMC 19.85.070(B). Other residential uses are not permitted,
      except that residences existing prior to the effective date of the
      ordinance codified in this section may continue." A real residential
      permission, marked P, reaching a single unit tied to an industrial
      development -- and the same sentence closes the district to everything
      else. Read the P alone and the zone looks open. Fairview writes closed lists. Every commercial and industrial chapter opens the same way -- "Only land uses that are specifically listed in Table 19.xx.020.A, and land uses that are approved as 'similar' to those in Table 19.xx.020.A, may be permitted" -- so a use missing from the table is refused rather than unaddressed. That sentence is what makes an absence readable, and it is quoted with every refusal here.
  CC:
    section: ["19.70"]
    cite_default:
      cite: FMC 19.70.020 Table 19.70.020.A (Land Uses and Building Types Permitted in the Corridor Commercial District), row 4 Residential
      url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview1970.html
      retrieved: '2026-08-19'
    quadplex_allowed:
      value: false
      quote: "or/multnomah/fairview/19.70.txt#L31,L33-L34,L62-L65"
    notes: >-
      Row 4 of Table 19.70.020.A is Residential and it lists three things:
      residential mixed use, manufactured homes on individual lots where the
      housing already exists, and residential care homes and facilities. A
      stand-alone four-unit townhome is none of them. Unlike Wood Village's NC
      zone next door -- where the table's own row is the broad Household Living
      category and a later section then limits it to mixed use developments --
      this district never admits the use category at all, so there is no
      relief to record: the pod cannot elect its way onto a list it is not on.


      What the district admits is a different use. FMC 19.70.090.E.1 asks
      nonresidential uses to occupy the ground floor along 75 percent of the
      street-facing facade width, which a fixed-dimension two-storey townhome
      cannot supply, and E.2 prohibits residential mixed-use development
      anywhere in the corridor commercial zone east of NE 223rd Avenue except
      one corner at Sandy Boulevard. Both are recorded here rather than encoded
      -- the first is a facade-length test and the second is a line on a map --
      because neither can change this pod's answer, which is already no.
      Fairview writes closed lists. Every commercial and industrial chapter opens the same way -- "Only land uses that are specifically listed in Table 19.xx.020.A, and land uses that are approved as 'similar' to those in Table 19.xx.020.A, may be permitted" -- so a use missing from the table is refused rather than unaddressed. That sentence is what makes an absence readable, and it is quoted with every refusal here.
  R-6:
    min_density_du_per_acre:
      # Table 19.30.030.A row 3.b, "Duplex, Triplex, Quadplex, Cottage
      # Cluster". A floor, and it is the pod that trips it: note [1] applies
      # minimum density "when new primary dwelling units are added to a
      # property", which is what placing four of them is. The quote names the
      # row heading, the row label and this zone's cell, because the five
      # cells of a row are five different numbers and a range that swallowed
      # them all would let a citation check pass on a neighbour's.
      value: 5.8
      quote: "or/multnomah/fairview/19.30.txt#L292,L299,L300"
      # The acre this rate is per is a net one.
      # Table 19.30.030.A names rows 3 and 4 "Minimum Net Density" and
      # "Maximum Net Density", and FMC 19.13 defines net density as units
      # per acre "based on net site area". Nothing here surveys what comes
      # out of a site to make it net, so the figure is right and the
      # denominator is absent.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list: street right-of-way and nothing else -- "Net site area means the
      # square footage of land after subtracting street right-of-way".
      # The loosest net acre in this corpus, and the closest to the lot's
      # own area.
        cite: FMC 19.13 "Net density"; "Net site area"
        quote: "or/multnomah/fairview/19.13.definitions.txt#L399,L405"
      variants:
        # Row 3.c, Townhouse. The same figure in this zone; carried anyway
        # because the split-plat path reads a different row and a reader
        # should not have to know they coincide here.
        - value: 5.8
          when: [unit_lots]
          quote: "or/multnomah/fairview/19.30.txt#L292,L305,L306"
    max_density_du_per_acre:
      # Row 4.b prints "None" for this zone -- no ceiling on duplex, triplex,
      # quadplex or cottage cluster density. Exempt rather than a large
      # number: the code states no maximum here.
      exempt: true
      quote: "or/multnomah/fairview/19.30.txt#L317,L324,L325"
      # The acre this rate is per is a net one.
      # Table 19.30.030.A names rows 3 and 4 "Minimum Net Density" and
      # "Maximum Net Density", and FMC 19.13 defines net density as units
      # per acre "based on net site area". Nothing here surveys what comes
      # out of a site to make it net, so the figure is right and the
      # denominator is absent.
      measured_on:
        fact: net_developable_area
        # This city's own subtraction list: street right-of-way and nothing else -- "Net site area means the
      # square footage of land after subtracting street right-of-way".
      # The loosest net acre in this corpus, and the closest to the lot's
      # own area.
        cite: FMC 19.13 "Net density"; "Net site area"
        quote: "or/multnomah/fairview/19.13.definitions.txt#L399,L405"
      variants:
        # Row 4.c, Townhouse, which does carry one.
        - value: 25
          when: [unit_lots]
          quote: "or/multnomah/fairview/19.30.txt#L317,L330,L331"
    min_building_separation_ft:
      value: 10
      quote: "or/multnomah/fairview/19.30.txt#L405"
    cite_default:
      cite: FMC 19.30.020 Table A / 19.30.030 Table A (2023-41-TA amendments, PC Final Review Draft 12-5-2023)
      url: https://www.codepublishing.com/OR/Fairview/html/Fairview19/Fairview1930.html
      retrieved: '2026-07-24'
    max_height_ft:
      # Table 19.30.030.A row 17, "Maximum Building Height". The table prints
      # one cell per line, so the row label is quoted with the cell -- the
      # cell's position in the run is what says which column it is, and the
      # column order is R-6, R-7.5, R-10, Townhouse Overlay, RM.
      #
      # The cell states two standards at once: "2.5 stories, but not more than 35 ft.". Only the feet are
      # encoded, because storeys are not a field here and the pod is two of
      # them -- well inside 2.5, and a check that cannot fail is not
      # worth a field that cannot be measured.
      value: 35
      cite: FMC Table 19.30.030.A, row 17
      quote: "or/multnomah/fairview/19.30.txt#L439,L440"
      qualified_by:
        fact: adjacent_single_story_building
        cite: FMC 19.30.030(E), Building Height Transition
        quote: "or/multnomah/fairview/19.30.txt#L481-L486"
    max_far:
      # Table 19.30.030.A row 14, "Maximum Floor Area Ratio (FAR)", stated
      # as a ratio to one. Read across from the row label, because the table
      # prints one cell per line and position is what names the column.
      #
      # The cell carries its own carve-out, "Cottage clusters none", and a
      # quadplex is not one: row 1 of this table lists Quadplex and Cottage
      # Cluster as separate housing types with separate lot minimums. So the
      # ratio binds.
      #
