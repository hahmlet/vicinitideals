      and their accessory uses are permitted in a VO zone" and then three
      headings -- Office Uses, Service Commercial Uses, Institutional Uses --
      running from law firms and dental clinics to coffee shops inside office
      buildings and galleries seating up to 500. The conditional list is one
      sentence: "Other uses when found similar to those above by planning
      commission." A four-unit townhome is not similar to an office, so unlike
      Village Commercial next door this refusal carries no relief at all.


      The zone is otherwise the loosest in the city -- 55 feet of height, tower
      elements to 70, and "there are no setback requirements in the VO zone" --
      which is exactly why the use answer has to be read carefully. A screen
      that reached the dimensions before the list would find nothing here to
      stop a building this zone never admits.
