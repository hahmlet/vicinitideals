label: Fairview
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.'
ingest:
  geoid: null
  juris_city_codes:
  - FAIRVIEW
  zoning_layer: zoning_metro
  zone_field: ZONE
  strip_lowercase_suffix: false
crossrefs:
  "19.170":
    outcome: other_path
    note: >-
      Signs, and both mentions are the same list entry in a use chapter: "H. Signs - see Chapter
      19.170 FMC." It counts as binding because that list is printed a few lines under the
      dimensional table its zone was read from. This screen places no sign.
  "19.480":
    outcome: procedure
    note: >-
      Reached only from the last row of Fairview's use tables -- "Uses similar to those listed
      above ... Determination made following procedures in Chapter 19.480 FMC." It is the
      similar-use determination process, and a process states no dimension. Whether a quadplex is
      a listed use in a given zone is read from the table itself and recorded per zone.
  "19.245":
    outcome: other_path
    note: >-
      Wireless communication equipment -- antennas and monopoles, two rows of the use tables and
      one paragraph of 19.65 permitting them. Eleven mentions, none of them about a dwelling.
  "19.490.200":
    outcome: other_building
    note: >-
      Home occupation permits, reached from the permitted-use list for a manufactured home park:
      "Home occupations shall comply with FMC 19.490.200." The pod is not a manufactured home
      park and nobody is running a business out of it.
  "19.520":
    outcome: procedure
    note: >-
      Variances. Both mentions are the same sentence offering a Class B or C variance where
      topography or another physical constraint makes a standard hard to meet. A route to being
      let off a standard is not a standard, and a screen that assumed the variance would be
      granted would be guessing at a decision nobody has made.
  "19.530":
    outcome: other_path
    note: >-
      Nonconforming uses and development, cited once from the definition of the term. This screen
      asks whether a new building conforms, so the chapter governing ones that already do not is
      a branch it never takes.

