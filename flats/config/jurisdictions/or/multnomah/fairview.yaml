label: Fairview
kind: city
eligible: true
notes: 'Ported from quadfit rules.yaml. Every value is `draft` — quadfit''s verification was against a
  coarser standard (one citation per row) and does not carry over. UNPORTED: orientation_constraint=''entrance_only''.
  quadfit justified this in a YAML comment with no citation; it needs its own encoding rather than invented
  provenance.

  READ AND NOT ENCODED: Chapter 19.165, Transportation Standards. Twelve mentions, three of them beside a number
  this screen uses, and 19.162.030 sends street work here by name — "Public and private streets shall also
  conform to FMC 19.165.020, Transportation standards". Fetched and read 2026-09-02. Two things came out of it
  and neither is a value. The first is that the driveway question the ledger flagged is not asked here:
  19.165.025 P sends "curb cuts, wheelchair, bicycle ramps and driveway approaches" straight back to Chapter
  19.162, which this layer already holds — the reference stood beside a driveway width by proximity, not by
  content. The second does reach and has no number in it. 19.165.025 M: "Whenever existing rights-of-way
  adjacent to or within a tract are of less than standard width, additional rights-of-way shall be provided at
  the time of subdivision or development." That is a rule that takes ground off the front of a lot, and it
  applies to development and not only to a land division, so it can reach a fourplex on a lot that already
  exists. What it cannot supply is how much: 19.165.025 F says rights-of-way "shall be the widths as required in
  the ''Standards'' section of the Fairview transportation system plan", a separate document that is not part of
  this code, and 19.165.010 D makes any dedication a condition of approval that must be shown "roughly
  proportional to the impact of development". The citation chain is complete and ends outside the code, the same
  shape as Clackamas County''s Standard Drawing P100 — except a drawing can be read and a plan we do not hold
  cannot. Recorded rather than encoded, and it is a real risk to a Fairview green rather than an academic one: a
  lot fronting a street the TSP widens loses depth before anything is built on it.

  READ AND NOT ENCODED: Chapter 19.155, Village Trail System Plan. Seven mentions and the loudest unread reference
  left in this layer, standing beside the front, rear and side setbacks the Village tables state. Fetched 2026-09-02
  because it was the last hole in a contiguous range: 19.115.010 makes a Village lot comply with "any other applicable
  Fairview Village standards in Chapters 19.110 through 19.155", and 19.108 through 19.150 were all stored while the
  first and last of the range never had been. It is a trail plan, and it states no dimension a lot is measured by.
  What it does state reaches development and cannot be held here: 19.155.040 requires the developer to build "the
  portion of the trail system located on the site for new development" before occupancy, against a system development
  charge credit, and 19.155.050 requires that portion to be dedicated, easemented or paid for in lieu. Whether a given
  lot carries any of it is decided by Figure V-10, a map printed after the chapter and not part of the text. Same
  shape as 19.165.025 M above and the same answer: an exaction whose amount lives in a document this store does not
  hold. Recorded as a cost risk on a Fairview lot, not as a constraint on its envelope.

  Chapter 19.110, Village General Provisions, fetched the same day and the other half of that range. No standard in it
  binds this pod, and three things in it are worth having. 19.110.040 is a HIDDEN GLOSSARY of ten terms nobody had —
  the layer''s definitions came from 19.13 and this second one was never opened — and it is now declared as a
  `definitions_at` span rather than re-fetched, so the terms are readable where they already sit. The one that matters
  is F, "Net acre means all area within a private development zone excluding public rights-of-way", which is the
  denominator the Village density floor divides by. It AGREES with 19.13''s "Net site area means the square footage of
  land after subtracting street right-of-way", so 19.110.050''s conflict clause — "Within the Village when there is a
  conflict between the Village regulations and base zone ... the Village regulations control. All regulations of the
  base zone still apply except where expressly written otherwise" — never fires on the denominator. That clause is
  also the written authority for how this layer already stacks the Village chapters on top of 19.30, which had been
  assumed. Third: 19.110.040 D dimensions the front porch that 19.145.020 B requires on every other unit in a block
  frontage (minimum six feet deep, twelve wide), and it costs this pod nothing, because 19.145.020 C says in as many
  words that "front porches may encroach into front setback and are not subject to lot coverage limitations". A
  required feature that is exempt from both standards it would otherwise consume.

  Chapter 19.106, Natural Resource Regulations, fetched 2026-09-02 to verify a screening layer rather than to encode a
  value. The pipeline carves Fairview resource corridors out of the buildable area on this chapter''s authority and
  had been doing it from code-page snippets, because the chapter itself answered 403 — a fetch strategy, as it turned
  out, not a wall. The reading corroborates the widths in use: 19.106.040 B states a riparian resource protection area
  of "either 35, 40, 55, or 80 feet ... measured from the centerline of the creek in each direction", 19.106.030 S
  adds a 50-foot wetland buffer and a 50-foot Fairview Lake buffer, and the same subsection exempts water features
  "enclosed in pipes, culverts, or similar structures" — the West Linn piped-channel shape again. Table 19.106.040 B
  permits nothing resembling a dwelling inside a protection area, which is what makes a carve the right action rather
  than a flag. Two things the snippets had blurred. The 37.5 feet in the screening config is real but belongs to a
  DIFFERENT rule: 19.106.050 A''s Fairview Village conservation easement, "not less than 50 feet from Fairview Creek
  centerline and not less than 37.5 feet from Clear Creek centerline", with 19.106.050 B forbidding development
  within 70 feet of the corridor centered on Fairview Creek and 19.106.050 C within 45 feet of the Clear Creek
  corridor centerline. B is the wider of the pair and was the half a blind reader raised on 2026-09-08, so it is
  quoted here beside its twin rather than left to be found again. And 19.106.040 C says the general development
  standards "do not
  apply to Fairview Lake or natural resources located within Fairview Village" — an exception that looks like it
  loosens and does not, because 19.106.050 puts a wider easement over the same ground. None of this is encoded here: a
  resource corridor is geometry, it is screened by the overlay layer, and this layer holds the zoning standards it
  stands beside.

  Chapter 19.105, Floodplain Overlay, fetched alongside 19.106 and read the same day. It is the chapter the
  pipeline''s FEMA floodway carve has been citing for Fairview, and that citation now rests on stored text rather than
  on a chapter title. 19.105.070 B 5 a prohibits "encroachments, including fill, new construction, substantial
  improvements, and other development within the adopted regulatory floodway" unless a no-rise certification or a FEMA
  map revision issues -- so a carve is the right action inside the floodway. Outside it the chapter is a construction
  standard and not a prohibition: 19.105.060 forbids only "any use otherwise prohibited in the base zone" and
  uncontained hazardous materials, while 19.105.070 A asks for anchoring, flood-resistant materials and elevated
  service equipment. That is a cost and a detail, which is why the flood fringe is flagged rather than carved. Nothing
  encoded here either; both halves are geometry the overlay layer screens.'
ingest:
  geoid: null
  juris_city_codes:
  - FAIRVIEW
  zoning_layer: zoning_metro
  zone_field: ZONE
  strip_lowercase_suffix: false
