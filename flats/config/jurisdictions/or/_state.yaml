# Oregon statewide preemption layer.
#
# Values here apply to every jurisdiction below unless a more specific layer
# overrides them — except where marked `preempts: true`, which a local standard
# may not exceed. Everything is `draft` until confirmed against the adopted rule
# text; nothing in this file has been verified.
label: Oregon
kind: state
notes: >-
  HB 2001 / OAR 660-046 middle-housing mandate. ORS 197A.400 (renumbered from
  ORS 197.307(4), operative 2025-07-01) requires local governments to apply only
  clear and objective standards to housing development, which is what makes this
  screen tractable at all.
code:
# oregon.public.law serves each OAR rule as one page. 660-046-0220 is the
# Large City siting standard: its (2)(e)(B) parking tier caps what any Large
# City may require for a quadplex at 1/2/3/4 total spaces by lot size — the
# preempting ceiling encoded below, banded the way the rule bands it.
- id: oar.660-046-0220
  url: https://oregon.public.law/rules/oar_660-046-0220
  title: OAR 660-046-0220 Middle Housing Siting Standards in Large Cities
# The Applicability rule for Division 46, and the one that says where none of
# this reaches. -0010(2) lists what the division does not apply to, and (a) is
# lots and parcels "not zoned for residential use, including but not limited
# to" ones zoned primarily for commercial, industrial, agricultural or public
# use. Stored so the limit is quotable; see the refusal beside
# `max_density_du_per_acre` below for why nothing yet enforces it.
#
# Applicability is prose about scope rather than a table of dimensions, so it
# reads thin to the plausibility guard the same way -0020 does.
- id: oar.660-046-0010
  url: https://oregon.public.law/rules/oar_660-046-0010
  title: OAR 660-046-0010 Purpose and Applicability
  allow_thin: true
# The middle housing land division statute, from the Legislature's own ORS
# chapter page rather than a restatement — oregon.public.law is an unknown
# authority, and nothing citing it may ever be signed. Sliced from the section
# heading to the next section; the ORS chapter page is one long HTML document.
# The definitions rule for Division 46. Needed because 660-046-0220 addresses
# "Large Cities" throughout, and whether the jurisdictions in this corpus are
# ones is a question about a term, not about a number. -0010 was tried first
# and is Applicability, not Definitions; the term is defined in -0020.
#
# "Large City" means a city with a certified PSU estimated population of
# 25,000 or more OR a city with a population over 1,000 within a metropolitan
# service district, and includes unincorporated areas of counties within a
# metropolitan service district that are provided with sufficient urban
# services. Every city encoded here is inside Metro and over 1,000 except
# Johnson City, Rivergrove and Maywood Park -- and none of those three states
# a density maximum, nor does either county layer, so the exemption below
# cancels nothing it was not written for.
#
# Definitions pages read as thin to the plausibility guard: prose about words,
# almost nothing dimensioned. Read 2026-08-19 before storing.
- id: oar.660-046-0020
  url: https://oregon.public.law/rules/oar_660-046-0020
  title: OAR 660-046-0020 Definitions
  allow_thin: true
- id: ors.92.031
  url: https://www.oregonlegislature.gov/bills_laws/ors/ors092.html
  title: ORS 92.031 Middle housing land division; conditions of approval
  start: "92.031 Middle housing land division"
  end: "92.040 Application for approval"
  # One section of statute is prose, not a table of dimensions, so it does not
  # read like code to the plausibility check. Read before storing.
  allow_thin: true
defaults:
  # Splitting the four units onto four lots does not create four lots that each
  # have to meet the zone. ORS 92.031(2)(b) requires the plan to comply with the
  # land use regulations "applicable to the original lot or parcel", and
  # 92.031(4)(c) bars a city from adding approval criteria of its own, naming
  # driveways, vehicle access, parking and street frontage. So the split-plat
  # path is measured against the same standards as the one-lot path, and a
  # zone's minimum lot area is emphatically not multiplied by four.
  #
  # This is a statement about which standards apply, not a number, which is why
  # it preempts: a city may not answer it differently. What a city MAY still do
  # is state its own townhouse lot standards for a conventional subdivision —
  # a different path to the same building, encoded per zone where it exists.
  land_division_parent_standards:
    value: true
    preempts: true
    cite: "ORS 92.031(2)(b), (4)(c)"
    url: "https://www.oregonlegislature.gov/bills_laws/ors/ors092.html"
    retrieved: 2026-08-14
    status: draft
    quote: "or/ors.92.031.txt#L7"
  # NOT ENCODED, and looked for: Oregon's climate-friendly parking reform
  # (OAR 660-012-0400 through -0450) removes parking mandates near frequent
  # transit, which is a per-PARCEL question this file cannot answer and the
  # screen currently never asks. Searched 2026-08-16 -- oregon.public.law
  # serves no parking rule under Division 12, and four candidate slugs
  # (-0400, -0430, -0435, -0440, -0445) all return the division landing page
  # rather than rule text. Whether the rules were amended, renumbered or
  # repealed is unsettled from here, so nothing is encoded: no citation, no
  # rule. Encoding it needs (1) the current rule text from a source we trust,
  # (2) a `near_frequent_transit` site fact in the conditions registry, and
  # (3) something that measures distance to a stop per parcel -- which does
  # not exist for ANY site fact yet. Until then the 1.0 stall/unit ceiling
  # stands everywhere a city has not repealed its own minimum, which fails
  # lots IN rather than out.
  # OAR 660-046-0220(2)(e)(B) caps quadplex parking as a total per lot, tiered
  # by lot size: 1 space under 3,000 sq ft, then 2, 3, and 4 at 7,000 and up.
  # Encoded as the loosest tier — one space per unit — because that ceiling
  # holds at every lot size, and a screen that assumes more parking than a city
  # could demand fails the pod in, never out. The tighter tiers are real and
  # would help small lots; encoding them as bands is deferred, because a band
  # cannot be chosen without a lot area and would make every jurisdiction
  # resolve ambiguous anywhere a lot has not been measured.
  #
  # `cap`, not `true`. The rule bars a city from asking for MORE than this; it
  # does not oblige one to ask for this much. Portland repealed its parking
  # minimums outright, and an unconditional lock would hand every Portland lot
  # a requirement for four stalls the city does not impose — roughly 1,300
  # square feet of a site that has to fit a pod, its parking and its access.
  # OAR 660-046-0220(2)(b), one sentence: "If a Large City applies density
  # maximums in a zone, it may not apply those maximums to the development of
  # Quadplex and Triplexes."
  #
  # Most cities in this corpus restated it in their own words and it is
  # encoded from their text -- Milwaukie's table note 4, Troutdale's
  # 3.140.B.4, Tualatin's "None" against the Quadplex row, Gresham's row D,
  # Oregon City's exception B.2. West Linn did not, and prints 8.7 dwelling
  # units per net acre against R-5; four units on a 5,000 sq ft lot is four
  # times that, so without this the zone reads as a wall the state says it is
  # not. Encoding it here rather than city by city is what the preemption
  # layer is for.
  #
  # `exempt`, not a large number: what the rule states is that the standard is
  # not applied, and a ceiling of 999 would be a lie a screen could not tell
  # from a reading. `always`, because a city may not decide it differently --
  # and an exemption that did not lock would be written by the state and
  # overwritten by the first city that prints a density row, which is the
  # standard the rule exists to remove.
  #
  # `unless: [unit_lots]`, because the same rule at (3)(c) leaves a Large City
  # a townhouse ceiling -- four times the detached maximum or 25 units per
  # acre, whichever is LESS. That guarantee cannot be computed here (the
  # detached maximum is not encoded, and "whichever is less" means 25 is not a
  # safe floor), so the state stands down on the split-plat path and the
  # city's own townhouse row stands. Silence rather than an exemption: the
  # rule addresses a different building there, and cancelling a standard it
  # never spoke to would be answering a question nobody asked.
  #
  # Minimum density is untouched. (2)(b) is about maximums, and no part of
  # -0220 relieves a quadplex of a floor.
  #
  # NOT ENCODED, and it is the boundary around everything in this file: OAR
  # 660-046-0010(2) says a Large City "need not comply with this division" for
  # (a) "Lots or Parcels that are not zoned for residential use, including but
  # not limited to Lots or Parcels zoned primarily for commercial, industrial,
  # agricultural, or public uses", and (b) lots zoned for residential use that
  # do not allow a detached single-family dwelling. This layer applies its
  # defaults to every zone below it without asking which kind it is, so the
  # exemption reaches commercial columns the rule never entered. The rule is
  # stored (oar.660-046-0010.txt#L30-L31, L33-L34) so the limit is quotable;
  # nothing enforces it.
  #
  # Measured on 2026-08-26 rather than guessed at. The exemption cancels a
  # density maximum in 88 zones. In 62 the city stated no number of its own,
  # so it cancels nothing. Of the 26 where a real ceiling is struck out, seven
  # sit in zones this rule arguably never reached -- Gresham CC, MC and RTC,
  # Fairview VA, VC and VMU, Portland RMP -- and all seven prohibit the
  # quadplex outright, so the use gate answers RED before any density row is
  # read. The other nineteen permit the quadplex outright, which is what being
  # zoned for residential use looks like from inside a use table. So the gap
  # moves no verdict as the corpus stands. That is a fact about the corpus,
  # not about the rule, and it is written here so the next commercial zone
  # somebody encodes does not quietly inherit a preemption.
  #
  # Closing it needs something this model does not have: a per-zone answer to
  # "is this zone residential", which is a judgement about a column of a use
  # table rather than a number in one. `quadplex_allowed: false` is not that
  # answer and must not be pressed into service as one -- a residential zone
  # that prohibits quadplexes is a city out of compliance, and overturning
  # exactly that is what the preemption is for.
  max_density_du_per_acre:
    exempt: true
    preempts: always
    unless: [unit_lots]
    cite: "OAR 660-046-0220(2)(b)"
    url: "https://oregon.public.law/rules/oar_660-046-0220"
    retrieved: 2026-08-19
    status: draft
    quote: "or/oar.660-046-0220.txt#L55"
  parking_min_per_unit:
    # (2)(e)(B) is a ceiling on what a city may ASK, not a thing the state
    # asks -- hence `preempts: cap` -- and it is BANDED by lot size, which the
    # first encoding of it flattened. A quadplex on a 4,000 sq ft lot may be
    # asked for two spaces in total, not four: the cap a small lot carries is
    # half the one a large lot carries, and reading the flat figure onto a
    # small lot overstates by two stalls what any Oregon city is allowed to
    # demand.
    #
    # The base is the widest band because it is the band a lot of unknown size
    # has to be assumed into: the loosest cap is the most a city could ask, and
    # this field feeds a screen that may not clear a lot it cannot measure.
    # The four bands together cover every lot size, so any lot whose area IS
    # known lands on a variant and the base never fires for it.
    spaces_total: 4
    preempts: cap
    cite: "OAR 660-046-0220(2)(e)(B)(iv)"
    url: "https://oregon.public.law/rules/oar_660-046-0220"
    retrieved: 2026-08-12
    status: draft
    quote: "or/oar.660-046-0220.txt#L79,L90-L91"
    variants:
      - spaces_total: 1
        band: {measure: lot_sqft, less_than: 3000}
        cite: "OAR 660-046-0220(2)(e)(B)(i)"
        quote: "or/oar.660-046-0220.txt#L79,L81-L82"
      - spaces_total: 2
        band: {measure: lot_sqft, at_least: 3000, less_than: 5000}
        cite: "OAR 660-046-0220(2)(e)(B)(ii)"
        quote: "or/oar.660-046-0220.txt#L79,L84-L85"
      - spaces_total: 3
        band: {measure: lot_sqft, at_least: 5000, less_than: 7000}
        cite: "OAR 660-046-0220(2)(e)(B)(iii)"
        quote: "or/oar.660-046-0220.txt#L79,L87-L88"

  # NOT ENCODED: OAR 660-046-0220(2)(e)(E), which says a Large City "must apply
  # the same off-street parking surfacing, dimensional, landscaping, access,
  # and circulation standards that apply to single-family detached dwellings in
  # the same zone." That is a redirect, and it points AWAY from every parking
  # dimension this corpus holds: the stall widths, stall depths and aisle
  # widths encoded from each city's general parking table are the standards
  # that apply to parking lots, and this sentence says the ones that bind a
  # quadplex are whatever binds a house on the same ground. Where a city's
  # single-family standards are looser -- and they usually are, a driveway
  # beside a house being neither a lot nor an aisle -- our geometry is
  # over-strict, and where they are tighter it is wrong the other way.
  #
  # Not encodable as a value: there is no field for "read a different chapter",
  # and no zone in this corpus records what its single-family parking standards
  # are, because until now nothing asked. Same shape as Gresham 9.0802(F) and
  # the Portland aisle -- a rule whose content is a pointer -- and the fourth
  # instance of it. Recorded so the next reader knows the encoded stall
  # geometry has a live question over it in every Large City, rather than
  # finding out from a site plan.
  #
  # NOT ENCODED: OAR 660-046-0220(2)(e)(D), "A Large City may allow, but may
  # not require, off-street parking to be provided as a garage or carport."
  # This one binds nothing we screen -- the pod is a factory-built box with
  # surface parking beside it and no city may force a structure over the
  # stalls -- but it is the sentence that guarantees that, so it is written
  # down rather than passed over as irrelevant. Quote:
  # or/oar.660-046-0220.txt#L96-L97, and (E) at
  # or/oar.660-046-0220.txt#L99-L100.
  #
  # NOT ENCODED: OAR 660-046-0220(2)(e)(C), on-street parking credits. A city
  # MAY let a space at the kerb count against the requirement, which can only
  # ever help a lot and never hurt it, so leaving it out is the conservative
  # direction. Quote: or/oar.660-046-0220.txt#L93-L94.
