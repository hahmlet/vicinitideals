definitions:
  # Read 2026-09-29 from CDC 12.01.500, which is on disk whole
  # (cdc.12.01.general.txt runs from the Subchapter 12.01 heading to the
  # Subchapter 12.10 heading).
  #
  # THE NOUN. "Quadplex. A residential structure containing 4 dwelling units
  # attached on a common wall, floor or ceiling. All 4 units of a quadplex
  # must be built on a single lot or parcel, or attached on a common wall and
  # located on 4 child lots created through a middle housing land division"
  # (L910-L912). The pod is a Quadplex. A Multiple Dwelling Structure starts
  # at "5 or more dwelling units", and 3 to 4 units fall into it only "if the
  # development cannot otherwise meet the definition of middle housing"
  # (L902-L909), which the pod does. Townhouse (L921-L923) is the unit-lot
  # path. The Triplex definition is printed as "4 dwelling units ... All 4
  # units of a triplex" (L924-L926), a copy of the Quadplex sentence; it
  # decides nothing for the pod and is recorded as a doubt in the handoff.
  #
  # FRONT LOT LINE. "The property line(s) separating a lot ... from a street,
  # alley, or access tract. Interior lots have 1 front lot line; corner lots
  # have 2 front lot lines; multiple frontage lots have 3 or more" (L1009-
  # L1011), and "Corner lots, double frontage lots and multiple frontage lots
  # do not have a rear lot line, but may have multiple side lot lines"
  # (L1016-L1019). Encoded as front_lot_line_corner: both under defaults.
  # The alley in the same sentence is NOT ENCODED: the envelope reads an
  # alley line as a rear or side line, and this definition makes it a front
  # line. On an alley-backed lot that puts the front setback on the alley,
  # which is stricter than any rear figure in this layer; recorded as a doubt.
  #
  # NET ACRE. "Acreage, Net" subtracts right-of-way and access easements,
  # stormwater facilities, park dedications, "Delineated wetlands, vegetated
  # corridors and buffers as required by Clean Water Services", slopes of 25%
  # or more and the 1% floodplain (L440-L452). Every minimum and maximum
  # density in this layer is per net acre (du/na), so each carries
  # measured_on: net_developable_area. The Clean Water Services corridors in
  # item 5 are overlay data and local work.
  #
  # DENSITY. 12.50.120 B.2: "The minimum or maximum number of dwellings
  # permitted for a project is calculated by multiplying the minimum or
  # maximum density standard by the net residential acres within the
  # development site" (cdc.12.50.100-270.lot-and-site.txt#L247-L251).
  corner_lot:
    # "A lot abutting 2 streets intersecting at an angle not greater than 135
    # degrees. Exception: lots with frontage on both a street and an alley
    # are not considered corner lots." Not greater than includes 135; the
    # alley exception is the default alleys_count: false. A street is "a
    # right-of-way or tract" (L1428), and a private street sits on a tract
    # (12.50.540), so a private street counts: drives_count (2026-09-30,
    # with the private_drives ruling below).
    test: intersecting_frontages
    max_intersection_angle_deg: 135.0
    drives_count: true
    quote: "or/washington/hillsboro/cdc.12.01.general.txt#L961-L962"
    cite: "Hillsboro CDC 12.01.500, Lot, Corner"

# Whether a private road or drive the lot abuts is a street here (FOLLOWUPS
# 17(b); Steph's rule of 2026-09-30: a private road is a way in for the
# parking everywhere, and governs the yards only where the city's code
# makes it a street, as this one does).
private_drives:
  street: true
  quote: "or/washington/hillsboro/cdc.12.01.general.txt#L798-L799"
  says: "or platted Private street or alley"
  cite: "Hillsboro CDC 12.01.500 (Frontage; Street; Tract; Lot Line, Front)"
  note: >-
    Frontage is the front lot line that "abuts a public street or alley, or
    platted Private street or alley" (L798-L799). A street is "a
    right-of-way or tract intended for motor vehicle, pedestrian or bicycle
    travel and/or access to abutting property" (L1428), and a tract is land
    set aside for "a specific use, including but not limited to access"
    (L1513-L1514). A right-of-way alone is public-only ("dedicated, deeded
    or granted to the public", L1338), but the "or tract" limb takes in the
    private street, and 12.50.540 requires a private street to sit on a
    "private street tract" (circulation L880). The front lot line reaches
    even further, to the line separating a lot "from a street, alley, or
    access tract" (L1009-L1010), and a corner lot has two front lot lines
    (L1010). A shared driveway on an easement, with no tract, is none of
    these.

defaults:
  # PARKING COUNT. 12.50.310 A.2: "The City of Hillsboro does not have
  # standards which require mandate the provision of parking" (the doubled
  # verb is the code's). Encoded as zero rather than left out, because an
  # omitted minimum lets the state cap resolve as though it were a
  # requirement.
  parking_min_per_unit:
    value: 0
    cite: Hillsboro CDC 12.50.310 A.2, no standards mandating the provision of parking
    url: https://api.municode.com/PublicationPdfDownload/4450
    retrieved: '2026-09-29'
    quote: "or/washington/hillsboro/cdc.12.50.300.parking.txt#L10,L16-L20"
  # PERIMETER PLANTER STRIP, encoded 2026-10-02. 12.50.360.F.1: "These
  # standards apply to parking lots serving nonresidential uses and common
  # parking areas serving 3 or more dwelling units" -- the pod's shared court
  # serves four. Table 12.50.360-1 asks a planter strip "At any other
  # perimeter location 4 feet"; the wall-or-fence alternative in 3.a.iii is
  # stated only along a right-of-way, so off the side and rear lines the
  # strip is the only way to meet it. The screen lets the court share the
  # rear yard up to the rear line (`paper.behind_wall_ft`); this keeps it
  # four feet off. 3.c's exception between parking lots that share a common
  # line is a neighbour nothing measures.
  parking_lot_line_buffer_ft:
    value: 4
    cite: Hillsboro CDC 12.50.360.F.1 and Table 12.50.360-1, perimeter planter strip 4 ft at any perimeter location not on a street
    url: https://api.municode.com/PublicationPdfDownload/4450
    retrieved: '2026-09-29'
    quote: "or/washington/hillsboro/cdc.12.50.300.parking.txt#L586-L588,L617,L621"
  # PARKING MAXIMUM. Table 12.50.320-1 prints "Quadplex 2" in the Zone A
  # column and nothing in the Zone B column, where every neighbouring row
  # prints "None". 12.50.320 D puts a whole site in Zone A if any part of it
  # is, and the zone map (Figure 12.50.320-A) is a figure nothing reads. Two
  # per unit is the Zone A answer and the conservative one; the blank Zone B
  # cell is a doubt. Four stalls sit under eight either way.
  parking_max_per_unit:
    value: 2
    cite: Hillsboro CDC Table 12.50.320-1, Quadplex maximum (Zone A)
    url: https://api.municode.com/PublicationPdfDownload/4450
    retrieved: '2026-09-29'
    quote: "or/washington/hillsboro/cdc.12.50.300.parking.txt#L58-L60,L79-L85,L102"
  # PARKING SHARE OF FRONTAGE. 12.50.715 applies to "all new triplexes,
  # quadplexes, 3 or more unit townhouses, and cottage cluster projects ...
  # in all zones" (B), and C.1 caps "The combined width of all garages and
  # outdoor on-site parking and maneuvering areas" at "50% of any street
  # frontage (other than an alley)".
  parking_area_max_frontage_pct:
    value: 50
    cite: Hillsboro CDC 12.50.715 C.1, garages and parking areas no more than 50% of any street frontage
    url: https://api.municode.com/PublicationPdfDownload/4450
    retrieved: '2026-09-29'
    quote: "or/washington/hillsboro/cdc.12.50.700-920.design.txt#L158,L163-L165,L170-L173"
  # DRIVEWAY APPROACH. C.2.a: "The total width of all driveway approaches must
  # not exceed 32 feet per frontage". NOT ENCODED from the rest of C.2: the
  # separation rule for local streets (b), the collector and arterial
  # spacing (c.ii) and the local-street options (c.iii: two approaches
  # totalling 32 feet on one frontage, or one 16-foot approach per
  # frontage). Each turns on the class of the abutting street, which nothing
  # measures.
  driveway_approach_max_width_ft:
    value: 32
    cite: Hillsboro CDC 12.50.715 C.2.a, total driveway approach width per frontage
    url: https://api.municode.com/PublicationPdfDownload/4450
    retrieved: '2026-09-29'
    quote: "or/washington/hillsboro/cdc.12.50.700-920.design.txt#L158,L170,L179-L182"
  # CORNER ACCESS AND THE ALLEY. C.2.c.i: "Lots or parcels must access the
  # street with the lowest functional classification for vehicle traffic.
  # For lots or parcels abutting an alley that is improved according to the
  # Hillsboro Design and Construction Standards, access must be taken from
  # the alley." Both sentences sit under "lots or parcels with more than 1
  # frontage" (c), and this code's front lot line includes an alley, so an
  # alley-backed lot is a lot with more than one frontage. Whether the alley
  # is improved to city standard is not measured; the alley rule is encoded
  # on every alley, which is the stricter reading and a doubt.
  corner_access_street:
    value: lowest_class
    cite: Hillsboro CDC 12.50.715 C.2.c.i, access from the street of lowest functional classification
    url: https://api.municode.com/PublicationPdfDownload/4450
    retrieved: '2026-09-29'
    quote: "or/washington/hillsboro/cdc.12.50.700-920.design.txt#L158,L170,L186-L188"
  parking_alley_access_required:
    value: true
    cite: Hillsboro CDC 12.50.715 C.2.c.i, access must be taken from an improved abutting alley
    url: https://api.municode.com/PublicationPdfDownload/4450
    retrieved: '2026-09-29'
    quote: "or/washington/hillsboro/cdc.12.50.700-920.design.txt#L158,L170,L186-L190"
  front_lot_line_corner:
    value: both
    cite: Hillsboro CDC 12.01.500, Lot Line, Front (corner lots have 2 front lot lines) and Lot Line, Rear
    url: https://api.municode.com/PublicationPdfDownload/4450
    retrieved: '2026-09-29'
    quote: "or/washington/hillsboro/cdc.12.01.general.txt#L1009-L1011,L1016-L1018"

# THE LAYER-WIDE REFUSALS, one per standard, read 2026-09-29. Each applies
# in every zone below unless the zone says otherwise.
#
# NOT ENCODED: stall and aisle dimensions. 12.50.360 C.2 sends "minimum
# dimensions and configurations for parking spaces, access aisles and
# maneuvering areas" to Figure 12.50.360-B (cdc.12.50.300.parking.txt
# #L491-L497), which is a drawing. The compact size in C.3 (16 by 8 feet,
# up to half the stalls) and the universal size in C.4 (17.5 by 8.75 feet
# with a 25-foot aisle, Review Authority approval) are alternatives to the
# figure, not the standard (L498-L509). Read the figure by hand; local work.
#
# NOT ENCODED: surface parking placement in the standard zones. 12.50.350
# C.1 lets front- and side-yard parking stand only on a driveway to a garage
# or, without one, in "a paved area that accommodates no more than 2 parking
# spaces per unit" (cdc.12.50.300.parking.txt#L326-L330). The pod parks in a
# rear court, so the sentence does not reach it.
#
# 12.50.350 D.1, "Parking for free-standing residential structures in the
# SCC-DT zone shall be incorporated within the structure"
# (cdc.12.50.300.parking.txt#L338-L340). The pod parks in an open court and
# is a free-standing residential structure, so SCC-DT refuses it: encoded
# as quadplex_allowed false in the SCC-DT block (no field says "surface
# parking prohibited", and the refusal is the whole of the answer).
#
# NOT ENCODED: setbacks subordinate to utility easements. 12.50.130 D.2:
# "setbacks are subordinate to such easements if the easement is wider than
# the required setback" (cdc.12.50.100-270.lot-and-site.txt#L372-L377), and
# most station-community tables repeat it. It pushes a building further in
# by an amount no table states; `utility_easement` is registered and no
# number hangs on it.
#
# NOT ENCODED: 12.50.130 J, increased setbacks beside substandard
# right-of-way (cdc.12.50.100-270.lot-and-site.txt#L515-L528). J.1: beside
# an alley under 20 feet wide, the setback is at least 10 feet from the
# alley's centerline. J.2: on the streets named in Table 12.50.130-1
# (L529-L576, about fifty street segments, 27 to 61 feet), "the front
# setback shall be increased by the distance specified, measured from the
# center of the street right-of-way" -- the future right-of-way the TSP
# plans. Both need a lot's street by name or the alley's width, which
# nothing measures, and both only push the building back. The same kind of
# rule as right-of-way dedication in the county layer; a doubt.
#
# THE STORY IS TEN FEET (Steph 2026-09-29: "Yes, that math holds").
# 12.50.140 B.6 measures height in the single-dwelling and multi-dwelling
# zones in stories, and "a residential 'story' is considered to be not more
# than 10 feet" (cdc.12.50.100-270.lot-and-site.txt#L612-L615). So "2 ½
# stories or 35 feet, whichever is less" is 25 feet in R-10, R-8.5, R-7,
# R-6, R-4.5, SCR-LD, SCR-DNC (elsewhere) and MR-1, and SCR-OTC's "2
# stories or 35 feet" is 20 feet (both limbs held, the stricter). The
# quotes point at each table cell; the ten-foot story is B.6, cited in each
# `cite`. The pod's height is a dial (flats.encode.height); these are the
# first ceilings in the corpus under 26 feet. B.6 names residential zones
# only, so the commercial "35 feet or 2½ stories" row keeps its feet.
#
# NOT ENCODED: 12.50.210 usable open space, "Variable" in the zone tables
# (cdc.12.50.100-270.lot-and-site.txt#L744-L850), with an exemption list at
# D (L756-L769) and a per-zone table at F (L783-L844). Only MU-N and MU-C
# encode it: MU-N its own table's 100 square feet a unit, MU-C the 200 a
# unit Table 12.50.210-1 asks of MU-C development with residential, which
# is more than its own table's 100. The rest is a reading for the reviewer,
# and the D exemption (small middle housing developments near a park) is a
# relief on facts nobody measures.
#
# NOT ENCODED: 12.40.104 B.3 lets "middle housing in middle housing zones"
# exceed the maximum lot coverage "by up to 10%" (cdc.12.40.special-uses.txt
# #L169-L172). It sits in the accessory-structures section and counts
# primary and accessory footprints together; the pod has no accessory
# structure, and whether the 10% also lifts a plex with none is a doubt.
# Every coverage figure below is the table's own.
#
# FLAG LOTS. 12.40.160 C.2: "multi-dwelling structures and townhouses with
# more than 3 units are prohibited on flag lots", and Table 12.40.160-1
# gives "1 triplex, quadplex or cottage cluster on 1 flag lot" a 25-foot
# minimum frontage/flagpole width (cdc.12.40.special-uses.txt#L672-L676,
# L679-L684,L700-L702). A quadplex on one flag lot is allowed. Every zone
# below that states a minimum frontage under 25 feet carries a
# `flag_lot` variant of 25; a zone whose table states no frontage row does
# not, which is a doubt.
#
# NOT ENCODED: variation of lot areas, widths and yards "permitted in some
# subdivisions" (12.50.110, 12.50.130 E). A land-division proceeding, not a
# lot fact, and a relief in every case.
#
# NOT ENCODED: the plan districts (Subchapters 12.61 to 12.68). Each sits
# on top of base zones and mostly sends the reader back to them. What they
# add for this building, read 2026-09-29:
# - Downtown (12.61): SCC-DT's front setbacks, frontage widths and heights
#   are figures (12.61.400, Figures 12.61.400-A to -D); its interior setback
#   against SCR zones is encoded in the SCC-DT block. SCR-MD and SCR-HD
#   lots abutting SCC-DT and SCR-DNC's Arterial Exception Area are named
#   there too (cdc.12.60-61.downtown.txt#L449-L455, L477-L533).
# - Orenco (12.62): no quadplex on an SCR-OTC lot under 7,500 square feet
#   (cdc.12.62.orenco.txt#L93-L97), which the SCR-OTC minimum lot already
#   says.
# - AmberGlen (12.64): Table 12.64.320-1 gives "Triplexes and quadplexes"
#   a vehicle maximum of 2 per unit, the same as the default above
#   (cdc.12.64.amberglen.txt#L622-L630); height transitions (L1536-L1547);
#   and the Retail Focus Frontage Areas that gate the UC zones' use rows
#   (encoded in UC-AC, UC-NC and UC-OR).
# - South Hillsboro (12.65): defers to the base zones (cdc.12.65.south-
#   hillsboro.txt#L430-L458), adds solar orientation for lots under 50
#   feet wide (L815-L817), and applies 12.50.715 C to plexes unless it
#   conflicts with 12.65.710 (L1302-L1304). Its alley-access rule is for
