zone_rulings:
  ANX:
    outcome: unencodable
    note: >-
      "Recent Annexation", the label the city's zoning layer (LandUseGallery_Prod
      MapServer layer 23, coded-value domain D_LU_ZoningDesc) gives 7 polygons
      on 2026-09-29, 13.75 acres between them by the layer's own area field
      (the largest 5.44 acres, the smallest 0.24). The layer's own
      description says it "expands as tax lots are
      annexed into City Limits to Comprehensive Plan Designations"; ANX is the
      lot that has been annexed and not yet given one. The CDC has no ANX zone
      and no interim-zoning rule: 12.80.010 D (cdc.12.80.applications.txt
      L76-L94) processes a zone change concurrently with the annexation and
      says nothing of land annexed without one. Which code governs these lots
      is a question of state law, not of this code -- ORS 215.130(2)(a), as
      this reader understands it and without having read it this session,
      keeps the county's plan and zoning in force on annexed land until the
      city provides otherwise, which would make these a pocket of
      or/washington/_unincorporated read off the county's map (zone: map). Not
      ruled that way on an unread statute; left unencodable and put to Steph.
  CO:
    outcome: pocket
    of: or/washington/_unincorporated
    zone: map
    note: >-
      "County", the label the city's zoning layer gives 26 polygons on
      2026-09-29, and no district code at all. The label says the county
      zones the land, so a lot the county's JURIS_CITY field puts in
      Hillsboro and the city's map calls "County" screens under the
      unincorporated layer, whose district has to be read off the county's
      own zoning map lot by lot. The Oregon City "County" pocket is the
      precedent. How many of the 26 fall inside the JURIS_CITY footprint was
      not measured here; whether a lot the county still zones after
      annexation is governed by the county code is the ANX question above,
      and is in the handoff.
  SID I-P:
    outcome: alias
    of: I-P
    note: >-
      "Industrial Park with a Special Industrial District Overlay": I-P under
      the 12.27.600 SID overlay, which the code calls an "overlay zone
      supplementing the provisions of the underlying I-P Industrial Park
      zone" and whose lots conform to the I-P standards with a one-acre
      minimum lot (cdc.12.27.overlay-zones.txt L1742-L1743, L1765-L1769).
      The overlay adds nothing that admits a dwelling; the use row is I-P's,
      Quadplex N.
  SC-BP:
    outcome: alias
    of: SCBP
    note: >-
      "Station Community Commercial - Business Park", the map's spelling of the
      zone Table 12.01.200-1 lists as SCBP, Station Community Business Park,
      a light-rail zone (cdc.12.01.general.txt L132-L133, L167). One zone, two
      spellings; the block is SCBP.
