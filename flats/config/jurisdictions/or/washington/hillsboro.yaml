  # ------------------------------------------------------------------
  # SUBCHAPTER 12.24, mixed-use and urban center zones.
  #
  # Read across the whole subchapter, 2026-09-29:
  # - 12.24.030 G.2: "Except in the UC zones, density calculation formulas
  #   ... are set forth in Section 12.50.120" (cdc.12.24.mixed-use-urban-
  #   center-zones.txt#L187-L190). The UC zones state du/na and name no
  #   formula; each UC density below is measured on the 12.01.500 net acre
  #   like every other zone, which is a doubt.
  # - 12.24.030 G.4 (L193-L210): in the UC zones minimum residential density
  #   applies to parcels "containing only residential development", which is
  #   the pod's case, and minimum FAR to parcels with only non-residential
  #   development. The MU-C, MU-VTC and SCR-V minimum FARs carry no such
  #   carve-out; no field holds a minimum FAR, so none is encoded, a doubt.
  # - NOT ENCODED: "Front Property Line Coverage" (UC-RM, UC-MU, UC-AC,
  #   UC-NC, UC-OR), a share of the primary street frontage the first two
  #   or three stories of the front facade must occupy. No field holds a
  #   frontage-occupancy share.
  # - NOT ENCODED: 12.50.140 C, the MU-N and MU-C height transition: within
  #   20 feet of an existing single detached or middle housing building 30
  #   feet or less in height, one foot of height per foot of separation
  #   (cdc.12.50.100-270.lot-and-site.txt#L620-L630). It measures to a
  #   building on the neighbour's lot; the MU-N and MU-C side yard rows
  #   ("additional required", "more if required" next to a single detached
  #   and middle housing zone) point at it and state no figure.
  # - NOT ENCODED: the plan districts these zones sit in, AmberGlen (12.64)
  #   for the UC zones and South Hillsboro (12.65) for MU-VTC, per the
  #   layer-wide plan-district comment.
  # ------------------------------------------------------------------
