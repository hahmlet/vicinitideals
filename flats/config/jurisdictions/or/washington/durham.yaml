label: Durham
kind: city
eligible: true
notes: >-
  DRAFT, cloud session 2026-09-29. Read from the City of Durham Development
  Code, revised November 13, 2025, the whole-code PDF the city publishes
  (durham-oregon.us, 137 pages). Every value is draft. Durham has no GIS of
  its own; its lots reach this layer by the taxlots' JURIS_CITY DURHAM, and
  their zoning comes from Metro's regional zoning layer (CITY 'Durham'),
  which carries SDR, MDR, IP, OP and NR and none of the three overlays.
ingest:
  geoid: null
  juris_city_codes:
  - DURHAM
# The references the binding ledger stood beside an encoded value, read
# 2026-09-29. One, and it is the page header.
crossrefs:
  "11.13.2025":
    outcome: misread
    note: >-
      Not a reference: the running header "DURHAM DEVELOPMENT CODE Rev.
      11.13.2025", the code's revision date, printed under every page
      footer (117 times across the stored chapters, e.g.
      ddc.3.site-design.txt L37, L345, L419), and so beside the yards, the
      driveway widths and the parking table.
code:
# The whole Development Code is one PDF, revised 11/13/2025. Each chapter
# heading prints twice -- once in the table of contents with dot leaders,
# once over the chapter -- so each slice starts at the second occurrence of
# its chapter title and ends at the next chapter's title, which is printed
# once after the contents. Chapter 1 (purpose and administration), 6 (signs)
# and 11 (time limits and enforcement) are not stored: nothing in them
# places a building. Printed page number = PDF page number.
- id: "ddc.2.zoning-districts"
  url: https://durham-oregon.us/wp-content/uploads/2025/11/Development-Code-Revised-11.13.2025.pdf
  title: "Durham Development Code Chapter 2 - Zoning Districts (SDR 2.8, MDR 2.9, overlays, Table 2.18)"
  start: "ZONING DISTRICTS"
  nth: 2
  end: "SITE AND DESIGN STANDARDS"
- id: "ddc.3.site-design"
  url: https://durham-oregon.us/wp-content/uploads/2025/11/Development-Code-Revised-11.13.2025.pdf
  title: "Durham Development Code Chapter 3 - Site and Design Standards (residential 3.1, access and parking 3.7, streets 3.9)"
  start: "SITE AND DESIGN STANDARDS"
  nth: 2
  end: "APPLICATION AND APPROVAL CRITERIA FOR LAND USE"
- id: "ddc.4.applications"
  url: https://durham-oregon.us/wp-content/uploads/2025/11/Development-Code-Revised-11.13.2025.pdf
