  # ------------------------------------------------------------------
  # TMU, Triangle Mixed-Use. 18.660 "appl[ies] in lieu of other provisions
  # in this title" (18.660.030.A, L132), and 18.280 does not apply
  # (18.280.020.C). Residential Use A (Table 18.660.4); the chapter has no
  # housing type table and limits none. Review is development review on
  # clear standards (18.660.040).
  #
  # THE FIRST STOREY. Table 18.660.7: "First story 12 feet (min.) and 25
  # feet (max.)", middle stories 14 max, top story 18 max (L945-L949). Not
  # a whole-building minimum, so not min_building_height_ft: held as
  # min_ground_story_ft, against the pod's ground_story_ft. Steph,
  # 2026-10-01, asked whether the pod's ground floor is at least 12 ft:
  # "Yes, 12 ft or more." The catalog pods state 12, so they meet it.
  #
  # NOT ENCODED: the first storey's 25 ft maximum and the top storey's
  # 18 ft maximum. No field holds a storey ceiling, and the pod states no
  # top-storey figure. A 26 ft two-storey building whose ground storey is
  # at least 12 ft has at most 14 ft above it.
  #
  # Height is held in storeys: six, or four on lots Map 18.660.A marks
  # (L943). The map is not held, so 4. The pod is 2. No coverage, no
  # landscape area and no density are printed. Parking: no minimum, Table
  # 18.410.3's maximums (18.660.070.D.1); 7.5 by 17.5 ft spaces (D.2);
  # "behind a building or at least 35 feet away from all street property
  # lines" (D.3), held as the 35, the stricter (the rear court is behind
  # the building; on a corner lot it is not behind it from the side
  # street). No aisle width: 18.410's table does not reach TMU. Driveways
  # for rowhouses "must be 10 feet or less in width" (G.2). Vision
  # clearance (18.930) does not apply (B.3).
  #
  # THE ONE-LANE DRIVE, ruled 2026-10-01. G.2's 10 ft is a ceiling on every
  # rowhouse driveway, not a condition of a front-parking branch, and the
  # pod draws a 12 ft lane to its rear court, which breaches it. No two-way
  # minimum is printed. Steph, 2026-10-01: in the Triangle a 10 ft one-lane
  # drive works -- the court may be reached by a single 10 ft drive, cars
  # taking turns. Held as driveway_one_lane_ft 10, the G.2 figure: the
  # screen draws the lane beside the building at 10, not 12. The court's
  # own aisle is not the drive and is not narrowed by it.
  # ------------------------------------------------------------------
