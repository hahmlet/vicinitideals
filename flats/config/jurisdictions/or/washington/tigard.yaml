  # ------------------------------------------------------------------
  # MUR, Mixed-Use Residential. Residential Use A (Table 18.120.1) and
  # Rowhouses Y (Table 18.120.2); 18.280 applies (18.280.020.A). Table
  # 18.280.1 prints two columns, MUR-1 and MUR-2, for one zone: 18.120.020
  # and 18.670 know only "MUR". Which lots were MUR-1 is not on any map
  # held. Each figure is the stricter of the two columns: front 10 (MUR-1
  # 0), street side 10 (5), rear 15 (both), height 45 (MUR-1 75). A doubt
  # and a question for Steph.
  #
  # Inside the Washington Square Regional Center plan district, Table
