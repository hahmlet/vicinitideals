# THE MAP'S OTHER CODES. Metro's regional zoning layer (CITY 'Tigard') prints
# the code's own names (RES-A to RES-E, COM, MUC, MUE, MUR, MU-CBD, TMU, IND,
# PR), and on the 2026-10-12 weekly copy two polygons under tax lots
# 2S105BC04000 and 2S105BD02200 (about 1.4 and 1.5 acres) print R-15.
zone_rulings:
  R-15:
    outcome: unencodable
    note: >-
      Washington County's R-15 district (15 units per acre), two polygons
      on Metro's zoning layer under CITY 'Tigard' on the 2026-10-12 weekly
      copy, beside the county's own R-15 land. Not a Tigard district: the
      Tigard map names RES-A to RES-E (Chapter 18.110). Annexed land takes a
      city zone, not the county's: "The comprehensive plan designation and
      the zoning designation placed on the property is the city's base zone
      that most closely implements the city's or county's comprehensive plan
      map designation" (18.720.030 (B)), and Table 18.720.1 converts the
      county's R-15 to RES-E (18.720.030.txt L34). The table is
      a guide to the zone an annexation application receives, not a
      statement that this lot holds it, and the map prints the county code,
      so the lot's Tigard zone is not printed and is not guessed here (RES-E
      admits the pod; a guess could turn a county sliver green). Unencodable,
      as Cornelius treats its county codes. Both lots are public land on the
      Washington roll (code 990) and were already RED in run 73, so this
      ruling moves no lot.

# THE PLAN DISTRICTS THE ZONING LAYER DOES NOT CARRY (FOLLOWUPS 109, districts
# chunk 5, 2026-10-29). Metro's layer prints MUR and MUC; whether a lot is in
# the Washington Square Regional Center, its Apartment Subdistrict, or
# Bridgeport Village is drawn elsewhere.
drawn_areas:
  wsrc_apartment_subdistrict:
    condition: inside_mapped_use_area
    zones: [MUR]
    file: or/washington/tigard/wsrc-apartment-subdistrict.geojson
    source: >-
      Traced from Tigard CDC Map 18.670.A (the image attached to 18.670.020 on
      ecode360, sha256 in the file), registered to the city's Washington
      Square plan district outline; the hatched Apartment Subdistrict, grown
      15 ft onto the map's boundary line. Drawn provenance in the file's
      source block.
    quote: "or/washington/tigard/18.670/18.670.020.txt#L13,L17-L18"
    cite: Tigard CDC 18.670.020.A.2 and B, 18.670.060.E.2
    note: >-
      18.670.060.E.2 allows only apartments and mixed-use development in the
      MUR Apartment Subdistrict, and the subdistricts are drawn on Map
      18.670.A and nowhere else ("except for the subdistricts" on the zoning
      map). This area answers MUR's `inside_mapped_use_area` lever: inside
      it the pod is refused; outside it MUR reads on the rowhouse chapter.
      On the 2026-10-22 taxlots 94 MUR lots fall inside, 254 outside, and 12
      the line cuts, which stay unanswered and screen unknown on the fact.
  wsrc_plan_district:
    condition: inside_mapped_use_area
    zones: [MUC]
    file: or/washington/tigard/wsrc-plan-district.geojson
    source: >-
      City of Tigard GIS, Framework/Tigard_Planning MapServer layer 1
      (Community Plan Areas), the Washington Square feature, fetched
      2026-10-22 (docs/flats/ingest_c2_2026-10-22.md).
    quote: "or/washington/tigard/18.670/18.670.060.txt#L36-L37,L44,L52-L67"
    cite: Tigard CDC 18.670.020.B, Table 18.670.2, 18.670.060.E.1
    note: >-
      Inside the Washington Square Regional Center, MUC admits rowhouses only
      in the Design Review Subdistrict, where residential development must be
      four storeys (18.670.090.B.4), and the Metzger Business Subdistrict
      admits mixed use only; elsewhere in WSRC's MUC rowhouses are not among
      the limited types allowed. So for MUC the plan district alone decides,
      and the subdistrict lines do not need tracing. The plan district is on
      the city's zoning map (18.670.020.B) and its Community Plan Areas
      layer. On the 2026-10-22 taxlots 88 MUC lots fall inside and 33 out.
  bridgeport_village:
    condition: tigard_bridgeport_village
    zones: [MUC]
    file: or/washington/tigard/bridgeport-village.geojson
    source: >-
      City of Tigard GIS, Framework/Tigard_Planning MapServer layer 1
      (Community Plan Areas), the Bridgeport Village feature, fetched
      2026-10-22 (docs/flats/ingest_c2_2026-10-22.md).
    quote: "or/washington/tigard/tdc.18.620.bridgeport.txt#L17,L25,L29"
    cite: Tigard CDC 18.620.010, 18.620.020
    note: >-
      Bridgeport Village is zoned MUC and its own chapter's standards apply
      to all development in it and govern in a conflict (18.620.020.B): a
      residential density floor of 25 units per net acre, a 20 ft maximum
      front setback, 90% coverage, 10% landscape, 70 ft height and parking
      off the street side, read into MUC's variants. The boundary is on the
      official zoning map and Map 18.620.A; the city's plan-area layer draws
      it. One MUC lot on the 2026-10-22 taxlots, about seven acres.
