notes: >-
  DRAFT, cloud session 2026-09-30. Read from Title 18 of the Tigard Municipal
  Code, the Community Development Code, on eCode360 (TI5024), current through
  Ordinance 26-13 of July 14, 2026. Every value is draft. Tigard's lots reach
  this layer by the taxlots' JURIS_CITY TIGARD, and their zoning comes from
  Metro's regional zoning layer, whose ZONE values are the code's own names
  (RES-A to RES-E, COM, MUC, MUE, MUR, MU-CBD, TMU, IND, PR) and which draws
  no plan district subarea or subdistrict. THE POD IS A ROWHOUSE here: a
  "Quad" is two units stacked over two (18.30), and "Apartments" exclude
  rowhouses, so four side-by-side units sharing sidewalls are a rowhouse
  development (18.280).
