private_drives:
  street: true
  quote: "or/washington/tigard/tdc.18.30.definitions.txt#L1585"
  says: "A public or private accessway that is created to provide ingress or egress for vehicles to three or more lots"
  cite: "Tigard CDC 18.30, Street; Driveway; Frontage"
  note: >-
    18.30 defines a Street as "A public or private accessway that is created
    to provide ingress or egress for vehicles to three or more lots"
    (L1585), and Frontage as the part of a site "that abuts a public or
    private street" (L1143-L1144). A private accessway serving three or more
    lots is therefore a street here, and a lot on one takes its front and
    its corner from it. One serving one or two units of land is a
    "Driveway" (L978-L979), not a street. Nothing held counts how many lots
    a private way serves, so the ruling is read as the definition's general
    case: a private road is a street. 18.805.030.C asks frontage "on a
    public or private right-of-way" in the same words.

defaults:
  # PARKING COUNT. Tigard prints vehicle parking MAXIMUMS only: 18.410.030.A
  # "The ratios for the maximum number of off-street vehicle parking spaces
  # allowed are provided in Table 18.410.3" (L77-L81), and the table's
  # Residential row says "See applicable housing type development standards
  # chapters in Part 18.200" (L397-L401). The rowhouse chapter says only that
  # 18.410 applies (18.280.040.D, tdc.18.280.rowhouses.txt L93). Neither
  # states a minimum or a maximum for a rowhouse: zero required, none capped.
  # Zero is encoded rather than left absent so the state layer's banded cap
  # is not read as a requirement (Hillsboro's precedent).
  parking_min_per_unit:
    value: 0
    cite: Tigard CDC 18.410.030.A.1 and Table 18.410.3 (maximum ratios only; Residential Use sent to the housing type chapters, which state no minimum)
    url: https://ecode360.com/print/TI5024?guid=43706464
    retrieved: '2026-09-30'
    quote: "or/washington/tigard/tdc.18.410.parking.txt#L77-L81,L397-L401"
  parking_max_per_unit:
    exempt: true
    cite: Tigard CDC Table 18.410.3, Residential Use, See applicable housing type development standards chapters in Part 18.200 (18.280 states no maximum)
    url: https://ecode360.com/print/TI5024?guid=43706464
    retrieved: '2026-09-30'
    quote: "or/washington/tigard/tdc.18.410.parking.txt#L385-L401"
  # WHICH STREET IS THE FRONT on a corner lot. 18.30, Front lot line: "in the
  # case of a corner lot, the shortest of the two property lines that abut
  # the street, except a property owner may choose which property line to
  # identify as the front lot line where both street property lines are 75
  # feet or more in length" (L1244-L1245). `shortest`; the owner's choice on
  # a corner with two long frontages is a relaxation nothing measures, and
  # the shortest line is the stricter reading. A corner lot is at an
  # intersection whose interior angle "does not exceed 135" degrees
  # (L1236-L1237).
  front_lot_line_corner:
    value: shortest
    cite: Tigard CDC 18.30, Front lot line (on a corner lot the shortest street line; the owner chooses where both are 75 feet or more)
    url: https://ecode360.com/print/TI5024?guid=43704988
    retrieved: '2026-09-30'
    quote: "or/washington/tigard/tdc.18.30.definitions.txt#L1244-L1245"
  # NOT ENCODED: front_lot_line_through. 18.30: "in the case of a through lot,
  # the property line that abuts the street with the lowest classification"
  # (L1245). The field holds both, both_unless_no_access and owner; none of
  # them is "the street of lowest class", and nothing measures street class.
  # Left unread, which the screen takes as the worst reading.
  #
  # WHICH STREET THE DRIVEWAY USES. No rule names one for a rowhouse
  # development: 18.920 sends rowhouses to 18.280 (Table 18.920.1,
  # tdc.18.920.access.txt L133-L141), and 18.280.040.D.1 lets access be
  # taken through tandem driveways, shared access or an alley without
  # naming a street (L97). 18.920.030's discouragement of access to arterial
  # and collector streets is written for small form residential lots
  # (L101).
  corner_access_street:
    value: any
    cite: Tigard CDC 18.280.040.D.1 (access by tandem driveways, shared access or an alley; no street named) and Table 18.920.1
    url: https://ecode360.com/print/TI5024?guid=43706147
    retrieved: '2026-09-30'
    quote: "or/washington/tigard/tdc.18.280.rowhouses.txt#L93-L97"

# THE LAYER-WIDE REFUSALS, one per standard, read 2026-09-30.
#
# NOT ENCODED: the rowhouse maximum shared access width, "the maximum width
# is 24 feet" (18.280.040.D.1.b, tdc.18.280.rowhouses.txt L123). A ceiling
# on the drive, not the approach; no field holds a maximum drive width. The
# pod's drive is narrower than 24.
#
# NOT ENCODED: tandem driveways (18.280.040.D.1.a, L101-L117): a driveway
# per two units, 15 ft minimum and 18 ft maximum, 18 ft apart. The pod
# parks in a shared rear court, which is the shared-access path (D.1.b).
#
# NOT ENCODED: S-3 screening of side and rear parking from adjacent
# properties in RES-A through RES-C (18.280.040.D.4, L159-L161; Table
# 18.420.2). A planted buffer of a width Chapter 18.420 sets; not stored
# beyond the chapter, and no field holds a parking-area buffer from an
# interior lot line. A doubt: on a tight lot it can take court width.
#
# NOT ENCODED: detached garages 40 ft from a street (18.280.040.D.3.a,
# L147-L157). The pod has none.
#
# NOT ENCODED: the rowhouse design standards, 18.280.040.E to I: a
# pedestrian path only at five or more units (L165), service areas out of
# setbacks (L185), a dormer, balcony, bay or 2 ft offset per unit (L189-L205),
# and a 48 sq ft porch per unit, no dimension under 6 ft (L213). Design
# items on the building, not where it stands. The porch can sit in the
# front yard only as far as 18.210.030.B.5 lets an unroofed porch project
# (3 ft).
#
# NOT ENCODED: vision clearance (18.930): a 30 ft triangle where a street
# or driveway 24 ft or wider meets a non-arterial street, 35 ft on
# arterials (tdc.18.930.vision-clearance.txt L53-L67). Obstructions above
# a height; it can push a corner building back, and nothing draws it. TMU
# is exempt (18.660.070.B.3).
#
# NOT ENCODED: 18.920.030 driveway spacing, 150 ft from a collector or
# arterial intersection (tdc.18.920.access.txt L117), and the 150 ft
# access drive turnaround (L156-L168). Nothing measures street class; the
# pod's drive is far shorter than 150 ft.
#
# NOT ENCODED: River Terrace (18.640). The plan district applies in
# addition to the base zones. Its funding gate (18.640.030.B,
# tdc.18.640.river-terrace.txt L59) reaches "subdivisions, partitions,
# planned developments, site development reviews, and conditional uses",
# not a rowhouse development on one lot. Its River Terrace Boulevard
# standards (18.640.060) reach rowhouse lots abutting the Boulevard (no
# parking within 40 ft of it, no direct access, L299-L371); the Boulevard's
# alignment is not held. Table 18.640.1's smaller lots are an elective
# density bonus. A doubt for lots along the Boulevard.
#
# NOT ENCODED: 18.210.030.B.9, a front setback reduced to the average of
# the abutting lots (tdc.18.210.residential-general.txt). A relief the
# neighbours' houses decide.
