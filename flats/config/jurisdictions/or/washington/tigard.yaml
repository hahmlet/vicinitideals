  # ------------------------------------------------------------------
  # MUC, Mixed-Use Commercial. Residential Use A (Table 18.120.1),
  # Rowhouses Y (Table 18.120.2), and 18.280 "appl[ies] to rowhouse
  # development in the ... MUC ... zones" (18.280.020.A). But Table
  # 18.280.1 has no MUC column (RES-A and RES-B, RES-C and RES-D, RES-E,
  # MUR-1, MUR-2), and Table 18.805.1's MUC column is blank on the
  # Rowhouse rows (the HTML has the cell, empty; the stored text drops
  # empty cells -- a reader doubt). Steph, 2026-10-01: "Empty means no
  # limit." So MUC's lot size, lot width, yards and height are held exempt,
  # each cite naming the ruling; nothing is carried across from another
  # column (Happy Valley MURX). Coverage, landscape area and the maximum
  # front setback come from the same missing column and are left absent,
  # which reads the same. The 15 ft rowhouse frontage (18.805.030.C.1) is
  # stated for every rowhouse lot, not by column, and is held.
  # 18.805.040's "no minimum lot size ... for nonresidential or mixed-use
  # development" is not the pod's path. Table 18.320.1 is for
  # nonresidential and mixed-use development (18.320.020.A-B).
  #
  # Two places draw MUC differently. Bridgeport Village (18.620) is zoned
  # MUC and its 18.620.040.B prints residential figures (no minimum lot, no
  # minimum setback, 20 ft maximum front, 20 ft minimum height), "Except as
  # determined in the architectural review process"; rowhouses there take
  # 18.620 (18.280.020.B). Inside the Washington Square Regional Center,
  # Table 18.670.2 makes Rowhouses L and 18.670.060.E.1.a allows them "only
  # in the Design Review Subdistrict", where residential development must
  # be "a minimum four stories" and 20% affordable (18.670.090.B.3-4) or
  # take a development design review (18.670.040.B.3.b); the Metzger
  # Business Subdistrict allows only mixed use. A two-storey pod meets
  # none of that: the variant below. Neither plan district nor subdistrict
  # is on Metro's map; the city's own Community Plan Areas layer draws the
  # plan district, and it answers `inside_mapped_use_area` for MUC
  # (`drawn_areas` below, districts chunk 5, 2026-10-29). Inside it the
  # subdistrict does not matter: no MUC lot in WSRC admits a two-storey
  # pod, in a subdistrict or out of one. The development design review is a
  # discretionary alternative to a clear path the pod fails, so the lot
  # stays refused rather than flagged. Outside it MUC reads on the base
  # chapter: the Tigard Triangle chapter does not reach MUC
  # (18.660/18.660.020.txt L15) and River Terrace sends MUC to 18.120 and
  # 18.320 (18.640/18.640.050.txt L3).
  # ------------------------------------------------------------------
  MUC:
