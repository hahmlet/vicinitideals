  # ------------------------------------------------------------------
  # MU-CBD, Mixed-Use Central Business District, governed by 18.650 (18.280
  # "does not apply", 18.280.020.C). Residential Use A/R (Table 18.650.1;
  # the R is 18.650.050.B.1, residential and nonresidential on one site
  # outside a mixed-use development, which the pod is not), Rowhouses Y
  # (Table 18.650.2). All new development takes a Type II site development
  # review whose criterion is compliance with the chapter's standards
  # (18.650.030.B.2.a, 18.650.040.B.1): clear and objective.
  #
  # Table 18.650.3 prints four subareas, Main Street (MS), 99W/Hall (99H),
  # Scoffins/Commercial (SC) and Fanno/Burnham (FB), drawn on Map 18.650.A
  # only. Every figure below is the strictest of the four, so a lot in any
  # subarea is held to at least its own standard. The one row that can
  # refuse the pod is "First story minimum 15 ft." in MS and 99H: a
  # fifteen-foot ground floor inside a 26-foot two-storey building leaves
  # eleven feet for the floor above and the roof (the ZDO 1005.09 reading).
  # The pod states its ground storey as 12 ft "or more" (Steph,
  # 2026-10-01), which does not reach 15, so it rides on the use: false
  # where the subarea is MS or 99H (`inside_mapped_use_area`, unknown). The
  # 20 ft height minimum is held; the pod clears it.
  #
  # Min density 25 is MS, 99H and SC's (FB 15), "residential-only
  # development" (note [4]): four units on at most 6,969 sq ft. Max density
  # 50 (80 in the station area overlay) the state layer strikes on one lot.
  # ------------------------------------------------------------------
