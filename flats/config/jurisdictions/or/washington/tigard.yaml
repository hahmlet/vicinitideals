definitions:
  # Read 2026-10-01 from 18.30, which is on disk whole
  # (tdc.18.30.definitions.txt).
  #
  # THE NOUN. "Rowhouse" - "A type of attached housing that shares a common
  # sidewall with one or more dwelling units, but excluding apartments,
  # courtyard units, and quads. A rowhouse is considered the same as a
  # townhouse within the meaning of state law" (L1032-L1033), and state law
  # puts each townhouse "on an individual lot or parcel" (ORS
  # 197A.420(1)(h)): the ruling above `zones:`. A "Quad" is two units on a
  # first story over two on a second (L1028-L1029), so the pod, four units
  # side by side, is a rowhouse development.
  #
  # CORNER LOT. "A unit of land situated at the intersection of two streets
  # where the interior angle of such intersection does not exceed 135º"
  # (L1236-L1237): the frontages meet, and "does not exceed" includes 135.
  # A "Street" is "A public or private accessway that is created to provide
  # ingress or egress for vehicles to three or more lots" (L1585), so a
  # private way serving three or more lots makes a corner (drives_count),
  # read as the definition's general case because nothing counts the lots a
  # way serves. An "Alley" is "A minor way that is used primarily for
  # vehicular service access to the back or side of properties otherwise
  # abutting on a street" (L1557): not a street, so the default alleys_count
  # false.
  corner_lot:
    test: intersecting_frontages
    max_intersection_angle_deg: 135.0
    drives_count: true
    quote: "or/washington/tigard/18.30/18.30.020.txt#L485-L486"
    cite: "Tigard CDC 18.30, Corner lot; Street; Alley"

private_drives:
  street: true
  quote: "or/washington/tigard/18.30/18.30.020.txt#L860-L862"
  says: "A public or private accessway that is created to provide ingress or egress for vehicles to three or more lots"
  cite: "Tigard CDC 18.30, Street; Driveway; Frontage"
  note: >-
    18.30 defines a Street as "A public or private accessway that is created
    to provide ingress or egress for vehicles to three or more lots"
    (L1585), and Frontage as the part of a site "that abuts a public or
    private street" (L1143-L1144). A private accessway serving three or more
    lots is therefore a street here, and a lot on one takes its front and
    its corner from it. One serving one or two units of land is a
    "Driveway" (L978-L979), not a street. Nothing held counts how many lots
    a private way serves, so the ruling is read as the definition's general
    case: a private road is a street. 18.805.030.C asks frontage "on a
    public or private right-of-way" in the same words.

defaults:
  # PARKING COUNT. Tigard prints vehicle parking MAXIMUMS only: 18.410.030.A
  # "The ratios for the maximum number of off-street vehicle parking spaces
  # allowed are provided in Table 18.410.3" (L77-L81), and the table's
  # Residential row says "See applicable housing type development standards
  # chapters in Part 18.200" (L397-L401). The rowhouse chapter says only that
  # 18.410 applies (18.280.040.D, 18.280.040.txt L38). Neither
  # states a minimum or a maximum for a rowhouse: zero required, none capped.
  # Zero is encoded rather than left absent so the state layer's banded cap
  # is not read as a requirement (Hillsboro's precedent).
  parking_min_per_unit:
    value: 0
    cite: Tigard CDC 18.410.030.A.1 and Table 18.410.3 (maximum ratios only; Residential Use sent to the housing type chapters, which state no minimum)
    url: https://ecode360.com/print/TI5024?guid=43706464
    retrieved: '2026-09-30'
    quote: "or/washington/tigard/tdc.18.410.parking.txt#L77-L81,L397-L401"
  parking_max_per_unit:
    exempt: true
    cite: Tigard CDC Table 18.410.3, Residential Use, See applicable housing type development standards chapters in Part 18.200 (18.280 states no maximum)
    url: https://ecode360.com/print/TI5024?guid=43706464
    retrieved: '2026-09-30'
    quote: "or/washington/tigard/18.410/18.410.060.txt#L1-L19"
  # WHICH STREET IS THE FRONT on a corner lot. 18.30, Front lot line: "in the
  # case of a corner lot, the shortest of the two property lines that abut
  # the street, except a property owner may choose which property line to
  # identify as the front lot line where both street property lines are 75
  # feet or more in length" (L1244-L1245). `shortest`; the owner's choice on
  # a corner with two long frontages is a relaxation nothing measures, and
  # the shortest line is the stricter reading. A corner lot is at an
  # intersection whose interior angle "does not exceed 135" degrees
  # (L1236-L1237).
  front_lot_line_corner:
    value: shortest
    cite: Tigard CDC 18.30, Front lot line (on a corner lot the shortest street line; the owner chooses where both are 75 feet or more)
    url: https://ecode360.com/print/TI5024?guid=43704988
    retrieved: '2026-09-30'
    quote: "or/washington/tigard/18.30/18.30.020.txt#L494-L495"
  # NOT ENCODED: front_lot_line_through. 18.30: "in the case of a through lot,
  # the property line that abuts the street with the lowest classification"
  # (L1245). The field holds both, both_unless_no_access and owner; none of
  # them is "the street of lowest class", and nothing measures street class.
  # Left unread, which the screen takes as the worst reading.
  #
  # WHICH STREET THE DRIVEWAY USES. No rule names one for a rowhouse
  # development: 18.920 sends rowhouses to 18.280 (Table 18.920.1,
  # 18.920.030.txt L108-L116), and 18.280.040.D.1 lets access be
  # taken through tandem driveways, shared access or an alley without
  # naming a street (L97). 18.920.030's discouragement of access to arterial
  # and collector streets is written for small form residential lots
  # (L101).
  corner_access_street:
    value: any
    cite: Tigard CDC 18.280.040.D.1 (access by tandem driveways, shared access or an alley; no street named) and Table 18.920.1
    url: https://ecode360.com/print/TI5024?guid=43706147
    retrieved: '2026-09-30'
    quote: "or/washington/tigard/18.280/18.280.040.txt#L38-L43"

  # SETBACKS FROM THE ULTIMATE RIGHT-OF-WAY (FOLLOWUPS 81). 18.210.030.A.1:
  # "Where the ultimate right-of-way width, as shown in the Transportation
  # System Plan, is wider than the current right-of-way width, required
  # setbacks are measured from the ultimate right-of-way width"
  # (18.210.030.txt#L3-L9). Chapter 18.210 governs
  # "all residential development in residential and commercial zones"
  # (18.210.010, L17), so it is held layer-wide. The yards stay; they are measured from
  # a line the ultimate width puts back from the lot line -- the added-
  # setback form of flats/geom/dedication.py (Sherwood, Milwaukie).
  #
  # THE WIDTHS. The 2040 TSP (adopted January 2022) shows the functional
  # classes (Table 5, Figure 11) but no cross-section: "Title 18 of Tigard's
  # Municipal Code (Development Code), developed by the City Engineering
  # Department, identifies the design standards for roadway cross-section
  # elements based on the street functional class" (tsp.2040.4.7.motor-
  # vehicle.txt#L3-L13; 8.1.1 names "Subsection 910", tsp.2040.8.1.code-
  # changes.txt#L19-L21). That is Table 18.910.1, whose rows are keyed to
  # "The type of road as provided in the comprehensive plan transportation
  # chapter - functional street classification" (18.910.030.E.1). It prints
  # ranges -- Arterial 64-128, Collector 58-96, Neighborhood Route 50-58,
  # Local Residential up to 54 (Industrial/Commercial 50) -- with the width
  # in a range "determined by the decision-making authority based upon
  # anticipated average daily traffic" (E). Nothing measures that traffic
  # or the lane count the Arterial and Collector rows send to the TSP, so
  # each class holds the TOP of its range, the widest the street may be
  # made (the Oregon City precedent, FOLLOWUPS 77), and half of it is the
  # distance from the centre line (row_to_centerline_stated_as_width).
  #
  # THE CLASS comes from the city's own TSP layer (street_class_tigard).
  # Principal Arterial (99W, Barbur Blvd) and the Special Transportation
  # Area stretch of Hall Blvd take the Arterial row, the only one printed
  # for them (Upper Hall's own 94 ft row is narrower and "shall not be
  # considered final", note [7]). A private street ranks local. A Freeway, a
  # street the city leaves unclassed ("Other") and an unread line take the
  # deepest, 64 feet; a line no centreline reaches gives up the whole
  # distance.
  #
  # NOT ENCODED: "plus additional right-of-way as needed for slopes,
  # retaining walls, etc." (18.640.080.A.1, River Terrace): no width is stated.
  # The Downtown street character rows (Table 18.910.1, Downtown Mixed Use 1
  # to 4, Urban Residential) are keyed to a map in the TSP's Technical
  # Appendix that is not held; MU-CBD below holds their widest row instead.
  row_to_centerline_class_by:
    value: tigard
    cite: Tigard CDC 18.210.030.A.1, required setbacks are measured from the ultimate right-of-way width as shown in the Transportation System Plan
    url: https://ecode360.com/print/TI5024?guid=43705636
    retrieved: '2026-10-15'
    quote: "or/washington/tigard/18.210/18.210.030.txt#L3-L9"
  row_to_centerline_stated_as_width:
    value: true
    cite: Tigard CDC 18.910.030.E and Table 18.910.1, right-of-way width by the functional street classification (the whole width of the street)
    url: https://ecode360.com/print/TI5024?guid=43709279
    retrieved: '2026-10-15'
    quote: "or/washington/tigard/18.910/18.910.030.txt#L141-L152,L194-L215"
  row_to_centerline_arterial_ft:
    value: 128
    cite: Tigard CDC Table 18.910.1, Arterial, right-of-way width 64-128 ft (the top of the range)
    url: https://ecode360.com/print/TI5024?guid=43709279
    retrieved: '2026-10-15'
    quote: "or/washington/tigard/18.910/18.910.030.txt#L214-L215,L224-L225"
  row_to_centerline_collector_ft:
    value: 96
    cite: Tigard CDC Table 18.910.1, Collector, right-of-way width 58-96 ft (the top of the range)
    url: https://ecode360.com/print/TI5024?guid=43709279
    retrieved: '2026-10-15'
    quote: "or/washington/tigard/18.910/18.910.030.txt#L214-L215,L234-L235"
  row_to_centerline_neighborhood_route_ft:
    value: 58
    cite: Tigard CDC Table 18.910.1, Neighborhood Route, right-of-way width 50-58 ft (the top of the range)
    url: https://ecode360.com/print/TI5024?guid=43709279
    retrieved: '2026-10-15'
    quote: "or/washington/tigard/18.910/18.910.030.txt#L214-L215,L244-L245"
  row_to_centerline_local_ft:
    value: 54
    cite: Tigard CDC Table 18.910.1, Local Residential under 1500 ADT, right-of-way width 54 ft (the widest local row; Local Industrial/Commercial 50 ft)
    url: https://ecode360.com/print/TI5024?guid=43709279
    retrieved: '2026-10-15'
    quote: "or/washington/tigard/18.910/18.910.030.txt#L214-L215,L254-L255,L264-L266"
  # River Terrace Boulevard, a Collector on the TSP layer, is held by its
  # own standard: "Right-of-way width must be 110 feet", wider
  # than the Collector row (18.640.080.A.1).
  row_to_centerline_named_ft:
    value:
      - ["River Terrace Boulevard", 110]
    cite: Tigard CDC 18.640 (River Terrace Plan District), 18.640.080.A.1, design standards for River Terrace Boulevard, right-of-way width must be 110 feet
    url: https://ecode360.com/print/TI5024?guid=43707570
    retrieved: '2026-10-15'
    quote: "or/washington/tigard/18.640/18.640.080.txt#L1-L17"

# THE LAYER-WIDE REFUSALS, one per standard, read 2026-09-30.
#
# NOT ENCODED: the rowhouse maximum shared access width, "the maximum width
# is 24 feet" (18.280.040.D.1.b, 18.280.040.txt L72). A ceiling
# on the drive, not the approach; no field holds a maximum drive width. The
# pod's drive is narrower than 24.
#
# NOT ENCODED: tandem driveways (18.280.040.D.1.a, L101-L117): a driveway
# per two units, 15 ft minimum and 18 ft maximum, 18 ft apart. The pod
# parks in a shared rear court, which is the shared-access path (D.1.b).
#
# NOT ENCODED: S-3 screening of side and rear parking from adjacent
# properties in RES-A through RES-C (18.280.040.D.4, L159-L161; Table
# 18.420.2). A planted buffer of a width Chapter 18.420 sets; not stored
# beyond the chapter, and no field holds a parking-area buffer from an
# interior lot line. A doubt: on a tight lot it can take court width.
#
# NOT ENCODED: detached garages 40 ft from a street (18.280.040.D.3.a,
# L147-L157). The pod has none.
#
# NOT ENCODED: the rowhouse design standards, 18.280.040.E to I: a
# pedestrian path only at five or more units (L165), service areas out of
# setbacks (L185), a dormer, balcony, bay or 2 ft offset per unit (L189-L205),
# and a 48 sq ft porch per unit, no dimension under 6 ft (L213). Design
# items on the building, not where it stands. The porch can sit in the
# front yard only as far as 18.210.030.B.5 lets an unroofed porch project
# (3 ft).
#
# NOT ENCODED: vision clearance (18.930): a 30 ft triangle where a street
# or driveway 24 ft or wider meets a non-arterial street, 35 ft on
# arterials (18.930.040.txt L5-L22). Obstructions above
# a height; it can push a corner building back, and nothing draws it. TMU
# is exempt (18.660.070.B.3).
#
# NOT ENCODED: 18.920.030 driveway spacing, 150 ft from a collector or
# arterial intersection (18.920.030.txt L86-L91), and the 150 ft
# access drive turnaround (L156-L168). Nothing measures street class; the
# pod's drive is far shorter than 150 ft.
#
# NOT ENCODED: River Terrace (18.640). The plan district applies in
# addition to the base zones. Its funding gate (18.640.030.B,
# 18.640.030.txt L9) reaches "subdivisions, partitions,
# planned developments, site development reviews, and conditional uses",
# not a rowhouse development on one lot. Its River Terrace Boulevard
# standards (18.640.060) reach rowhouse lots abutting the Boulevard (no
# parking within 40 ft of it, no direct access, L299-L371); the Boulevard's
# alignment is not held. Table 18.640.1's smaller lots are an elective
# density bonus. A doubt for lots along the Boulevard.
#
# NOT ENCODED: 18.210.030.B.9, a front setback reduced to the average of
# the abutting lots (tdc.18.210.residential-general.txt). A relief the
# neighbours' houses decide.
#
# NOT ENCODED: 18.805.030.B, lot shape. "Each lot for quad, rowhouse, or
# small form residential development must be rectilinear in shape"
# (18.805.030.txt L175-L176). Found by the step-10 prohibition
# grep, 2026-10-01. 18.805.020 applies the chapter "to new lots that are
# created through a partition or subdivision and to existing lots that are
# reconfigured" (L23); 18.280.040.B brings in only "the dimensional lot
# standards for the base zone" (18.280.040.txt L10-L12), Table
# 18.805.1. So it does not reach the pod on an existing lot, and no field
# holds a shape test. It would reach a lot the pod needs created.
#
# THE LARGEST LOT, ruled 2026-10-01 (Steph: "Read Tigard's definition of
# 'townhome'. If it's split lots, then that's our answer."). Tigard defines
# no townhouse or townhome. Its Rowhouse is "considered the same as a
# townhouse within the meaning of state law" (18.30,
# 18.30.020.txt L261-L263), and state law's Townhouse is a
# unit "located on an individual lot or parcel" (ORS 197A.420(1)(h),
# hb.2138.2025.txt L57-L59). Split lots. Table 18.805.1 states its
# standards "for lots created or configured for residential development"
# (18.805.030.A, 18.805.030.txt L5), so its Rowhouse rows
# are the sizes of the rowhouses' own lots, and the MAXIMUM lot (3,000 /
# 3,000 / 1,750 / 1,250 / 1,000 / 870 sq ft, L139-L146) bounds each of
# those, not the lot four rowhouses stand on. The one-lot density floor
# 18.40.130.B would read from it is not held.
#
# The MINIMUM lot is kept on the one lot because Tigard's own text carries
# it there: 18.40.130.B makes the rowhouse maximum density "determined by
# the minimum and maximum lot sizes" (18.40.130.txt L10-L11), and
# 18.280.040.B allows rowhouse development only on lots that "meet the
# dimensional lot standards for the base zone" (tdc.18.280.rowhouses.txt
# L67). On the split path it is the `unit_lots` variant: each rowhouse's own
# lot, four of them side by side (Durham's and Hillsboro's pattern).
#
# NOT ENCODED: the Rowhouse maximum lot as a ceiling on each rowhouse's own
# lot (Table 18.805.1, L139-L146). No field holds a maximum lot area, and
# where the unit lots' lines fall is the plat's choice, not the lot's.
#
# A doubt the ruling settles, recorded: 18.40.130.B states the minimum
# density in the same sentence as the maximum, and 18.840.030.B holds a
# sublot plat's sublots and tracts to be "a single lot" to which "Lot
# standards such as size" and the "Allowed number of dwelling units"
# continue to apply (18.840.030.txt L10-L24), and an 18.30
# Sublot "is not considered a lot" (L1308-L1309). Read alone, Tigard's own
# text would keep the floor on the parent lot.
zones:
  RES-A:
    cite_default:
      cite: Tigard CDC 18.110 (Residential Zones), 18.280 (Rowhouses) and 18.805 (Lot Standards)
      url: https://ecode360.com/print/TI5024?guid=43706147
      retrieved: '2026-09-30'
    quadplex_allowed:
      value: true
      cite: Tigard CDC 18.110.030 Table 18.110.2, Residential Use A in RES-A and 18.110.040 Table 18.110.3, Rowhouses L[2] (up to 5 units per grouping; the pod's grouping is 4); a rowhouse shares a common sidewall (18.30)
      quote: "or/washington/tigard/tdc.18.110.residential-zones.txt#L74-L76,L201,L208,L215"
    min_lot_sqft:
      per_dwelling: 1500
      cite: Tigard CDC Table 18.805.1, Rowhouse minimum lot size 1,500 sq ft in the RES-A column, applied per rowhouse through 18.40.130.B and 18.280.040.B
      quote: "or/washington/tigard/18.805/18.805.030.txt#L5,L25-L33,L67-L68"
      variants:
