      quote: "or/washington/hillsboro/12.50/12.50.715.txt#L1,L4,L7-L8"
    parking_alley_access_required:
      value: true
      only_when: [east_hillsboro_city_standards]
      cite: "East Hillsboro Community Plan Reedville / TV Highway overlay (FOLLOWUPS 138): Hillsboro CDC 12.50.715 C.2.c.i, access must be taken from an improved abutting alley"
      quote: "or/washington/hillsboro/12.50/12.50.715.txt#L1,L7,L16-L18"
