  # --- Pedestrian-Oriented Mixed-Use Districts (Section 392) --------------
  #
  # 392-4's table lists "Attached Dwelling Unit (see Section 392-7 for density
  # requirements)" as Type II in both districts. 106-70.1 B defines an
  # Attached Dwelling Unit as "Two or more primary dwelling units with a
  # common building wall and/or ceiling, on individual lots or on a single
  # shared lot" (cdc.106.definitions.txt#L490-L492), which is the pod on one
  # lot or on four. Type II is read as allowed, as for Middle Housing
  # elsewhere in this layer. 392-2 lets Community Plan subareas and Areas of
  # Special Concern prevail; refused above the zones with the Community Plans.
  #
  # ENCODED 2026-10-21 (FOLLOWUPS 109): the 392-8 street frontage occupancy
  # standard ("At least 50% of a site's street frontage(s) must be occupied
  # by a building located no further than the maximum 20-foot setback",
  # 392-8.txt#L31-L33), on every frontage of a corner lot and
  # one of a through lot (392-9.5), as `building_frontage_min_pct` in each
  # zone. The pod fills at most its own width of a street, so a lot with
  # more than about twice that of one street fails it. Detached dwellings in
  # NMU owe the same share, so the state's middle-housing design limits do
  # not lift it.
  #
  # NOT ENCODED: the 392-9 development standards (entrances, 25 percent
  # ground-floor transparency for residential, weather protection, a 2-foot
  # plane change every 30 feet of facade, multiple frontages, prominent
  # corners; cdc.392.mixed-use.txt#L337-L581). They are design standards on
  # a factory pod's facade, which may not meet them. A doubt in the handoff.
  #
  # NOT ENCODED: the higher density ranges of 392-7 (2) to (4), which need a
  # public plaza and extra open space (392-7.txt#L13-L21,
  # L245-L268). The (1) range is held below.
  #
  # NOT ENCODED: the Required Outdoor Area on which even the (1) range
  # depends. It is allowed "when the development provides Required Outdoor
  # Area that complies with the requirements of Section 307-7.5" (L241-L242):
  # 250 contiguous square feet a dwelling, no dimension under 10 feet
  # (307-7.txt#L149-L151). No field holds a per-dwelling outdoor
  # area.
  #
  # Interior side and rear yards are owed in both districts, not held at
  # zero. 392-8 prints "Zero feet (3)", and (3) reads "No minimum interior
  # yard setbacks are required except where abutting a residential
  # district. Where abutting a residential district, the side and/or rear
  # yard shall be no less than that required by the abutting district"
  # (392-8.txt#L29-L30,L37-L39). Zero needs "does not abut
  # a residential district", a negation `when:` cannot say, and the abutting
  # district's yard is a number from another zone.
