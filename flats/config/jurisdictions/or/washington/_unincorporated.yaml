# Standards" (cdc.106.definitions.txt#L1130-L1134), and 300-3.1 counts
# Water Quality Sensitive Areas and Vegetated Corridors as unbuildable
# (300-3.txt#L3-L14), which is the "buildable area" the
# Type I Middle Housing test in each R district measures. The corridors
# themselves are overlay data and local work.
zones:
  R-5:
    cite_default:
      cite: Washington County CDC 302 (R-5 District), 302-7.1 Middle Housing dimensional requirements
      url: https://api.municode.com/PublicationPdfDownload/3090
      retrieved: '2026-09-28'
    row_to_centerline_local_ft:
      # Middle Housing on a public street gives up right-of-way to this
      # distance from the centre line before its first building permit;
      # the yards then run from the new line, and no strip is due where
      # the street is already that wide (flats/geom/dedication.py). The
      # same four distances are printed in 303 through 306 (R-6 to R-24).
      value: 25
      cite: Washington County CDC 302-2.14 C(1)(a), local street, 25 feet to centerline
      quote: "or/washington/_unincorporated/302/302-2.txt#L47-L53"
    row_to_centerline_neighborhood_route_ft:
      value: 30
      cite: Washington County CDC 302-2.14 C(1)(b), neighborhood route, 30 feet to centerline
      quote: "or/washington/_unincorporated/302/302-2.txt#L47-L53"
    row_to_centerline_collector_ft:
      value: 37
      cite: Washington County CDC 302-2.14 C(1)(c), collector, 37 feet to centerline
      quote: "or/washington/_unincorporated/302/302-2.txt#L47-L53"
    row_to_centerline_arterial_ft:
      value: 45
      cite: Washington County CDC 302-2.14 C(1)(d), arterial, 45 feet to centerline
      quote: "or/washington/_unincorporated/302/302-2.txt#L47-L53"
    quadplex_allowed:
      # 302-2 permits Middle Housing (430-84) on an existing lot through a
      # Type I procedure, and 302-3 takes the rest through Type II; both
      # are headed "Uses Permitted", neither is the Type III list. The pod is
      # a Quadplex (106-173), and 106-124 names this district as one where a
      # Quadplex is Middle Housing. Type II approval "may be further
      # conditioned" (207-5): YELLOW where the lot is past the Type I gates
      # below (Steph 2026-10-14, FOLLOWUPS 79), no longer a handoff doubt.
      value: true
      cite: Washington County CDC 302-2 and 302-3 (Middle Housing through Type I and Type II) + 106-124, 106-173
      quote: "or/washington/_unincorporated/cdc.302.r-5.txt#L14,L87-L93,L124,L174-L183"
    type_i_max_buildable_sqft:
      value: 16500
      cite: 'Washington County CDC 302-2.14 A and 302-3.15 A, Type I Middle Housing up to this buildable area; past it Type II, on which "Approval may be further conditioned by the Review Authority pursuant to Section 207-5" (Steph 2026-10-14: a review on measurable standards whose decider may add conditions is YELLOW, FOLLOWUPS 79)'
      quote: "or/washington/_unincorporated/cdc.302.r-5.txt#L87-L93,L124-L129,L174-L179"
    type_i_density_escape_du_per_acre:
      value: 4
      cite: Washington County CDC 302-2.14 A and 302-3.15 A, past the size limit Type I only where the Middle Housing units "meet or exceed the minimum density required for other housing types in the district"
      quote: "or/washington/_unincorporated/cdc.302.r-5.txt#L87-L93,L124-L129,L174-L179"
    max_units:
      value: 4
      cite: Washington County CDC 302-6.1 A(3), Quadplex - maximum four units per lot
      quote: "or/washington/_unincorporated/302/302-6.txt#L2-L3,L6"
    max_density_du_per_acre:
      # 302-6.1 A: "Density is not a consideration" for a Quadplex; the
      # parent-lot unit cap above is the whole limit. The townhouse path
      # (units on lots of their own) has a maximum density.
      exempt: true
      cite: Washington County CDC 302-6.1 A, density is not a consideration for Middle Housing plexes
      quote: "or/washington/_unincorporated/302/302-6.txt#L2-L3"
      variants:
        - value: 20
          when: [unit_lots]
          cite: Washington County CDC 302-6.1 C(3), Townhouses provided as Middle Housing
          quote: "or/washington/_unincorporated/302/302-6.txt#L14,L17"
        - value: 17.4
          when: [east_hillsboro_city_standards, unit_lots]
          cite: "East Hillsboro Community Plan Reedville / TV Highway overlay (FOLLOWUPS 138): Hillsboro CDC Table 12.21.150-1 (R-10), maximum density for townhouses, the lowest of the Low Density Residential zones"
          quote: "or/washington/hillsboro/12.21/12.21.150.txt#L4,L17"
    min_density_du_per_acre:
      exempt: true
      cite: Washington County CDC 302-6.1 A (plexes) and C(2) (townhouses), minimum density does not apply
      quote: "or/washington/_unincorporated/302/302-6.txt#L2-L3,L14,L16"
      variants:
        - value: 6.0
          when: [east_hillsboro_city_standards]
          cite: "East Hillsboro Community Plan Reedville / TV Highway overlay (FOLLOWUPS 138): Hillsboro CDC Table 12.21.450-1 (R-6), minimum density, the highest of the Low Density Residential zones (read on the whole lot, which can only ask more of a floor than net acres would)"
          quote: "or/washington/hillsboro/12.21/12.21.450.txt#L4,L16"
    min_lot_sqft:
      # 302-7.1 A measures the parent lot before any right-of-way
      # dedication. Townhouse lots are an average, not a floor on each lot;
      # the variant holds the average.
      value: 7000
      cite: Washington County CDC 302-7.1 A(3), Quadplex minimum lot area (parent lot)
      quote: "or/washington/_unincorporated/302/302-7.txt#L2-L3,L6"
      variants:
        - value: 1500
          when: [unit_lots]
          cite: Washington County CDC 302-7.1 A(5), townhouse lots must average no less than 1,500 square feet
          quote: "or/washington/_unincorporated/302/302-7.txt#L8-L9"
        - value: 10000
          when: [east_hillsboro_city_standards]
          cite: "East Hillsboro Community Plan Reedville / TV Highway overlay (FOLLOWUPS 138): Hillsboro CDC Table 12.21.150-1 (R-10), minimum lot size, the largest of the Low Density Residential zones"
          quote: "or/washington/hillsboro/12.21/12.21.150.txt#L4-L5,L7"
        - value: 1500
          when: [east_hillsboro_city_standards, unit_lots]
          cite: "East Hillsboro Community Plan Reedville / TV Highway overlay (FOLLOWUPS 138): Hillsboro CDC Table 12.21.150-1 (R-10), townhouse lots average minimum lot size (the county says the same, 302-7.1 A(5))"
          quote: "or/washington/hillsboro/12.21/12.21.150.txt#L4,L7-L8"
    setback_front_ft:
      # To the front building wall. The 12-foot figure for a porch or
      # other covered or enclosed entryway is one of the layer-wide refusals
      # listed above the zones.
      value: 15
      cite: Washington County CDC 302-7.1 B(1), front yard to front building wall
      quote: "or/washington/_unincorporated/302/302-7.txt#L10-L11,L13-L14"
      variants:
        - value: 20
          when: [east_hillsboro_city_standards]
          cite: "East Hillsboro Community Plan Reedville / TV Highway overlay (FOLLOWUPS 138): Hillsboro CDC Table 12.21.150-1 (R-10), minimum front setback (20 in every Low Density Residential zone)"
          quote: "or/washington/hillsboro/12.21/12.21.150.txt#L4,L29,L37"
      qualified_by:
        fact: washington_local_street_connectivity
        cite: Raleigh Hills - Garden Home, Bull Mountain, Aloha - Reedville - Cooper Mountain, Cedar Hills - Cedar Mill, Sunset West, Bethany and Metzger - Progress Community Plans (CDC 300-1), Local Street Connectivity -- development on the lands each plan's Local Street Connectivity map shows provides on-site streets connecting to the existing system, which take ground nothing measures; held only on those lands (drawn_areas washington_local_street_connectivity, coordinator ruling 2026-10-30)
        quote: "or/washington/_unincorporated/community-plan.bull-mountain.txt#L1136-L1142"
    setback_garage_entrance_ft:
      value: 20
      cite: Washington County CDC 302-7.1 B(2)(a), garage vehicle entrance from front or street side yard
      quote: "or/washington/_unincorporated/302/302-7.txt#L16-L17"
      qualified_by:
        fact: washington_plan_rule_unmeasured
        cite: Raleigh Hills - Garden Home, Bull Mountain, Aloha - Reedville - Cooper Mountain, Cedar Hills - Cedar Mill, Sunset West, Bethany, Metzger - Progress and East Hillsboro Community Plans (CDC 300-1), access-point caps and access bars on named streets, the commercial-strip Type 1 buffer, old case conditions, the city of Hillsboro's development standards, Area of Special Concern outlines whose rule the text does not name and pedestrian connectivity facilities that bind a pod and that nothing measures -- held only on the lots the plan maps put them on (drawn_areas washington_plan_rule_unmeasured)
        quote: "or/washington/_unincorporated/community-plan.raleigh-hills-garden-home.txt#L1218-L1223"
    setback_street_side_ft:
      value: 8
      cite: Washington County CDC 302-7.1 B(3), street side yard
      quote: "or/washington/_unincorporated/302/302-7.txt#L19"
    setback_side_ft:
      # Five feet where the yard abuts offsite land, which on the pod's own
      # lot every side line does. The three-foot figure in B(4)(c) is for a
      # line that does not abut offsite land -- a line inside one site --
      # and on this building the only such lines carry the party walls,
      # which B(4)(a) already puts at zero.
      value: 5
      cite: Washington County CDC 302-7.1 B(4)(b), non-street side yard abutting offsite land
      quote: "or/washington/_unincorporated/302/302-7.txt#L20,L22-L23"
      variants:
        - value: 0
          when: [attached_wall]
          cite: Washington County CDC 302-7.1 B(4)(a), zero feet where units attach
          quote: "or/washington/_unincorporated/302/302-7.txt#L20-L21"
        - value: 10
          when: [east_hillsboro_city_standards]
          cite: "East Hillsboro Community Plan Reedville / TV Highway overlay (FOLLOWUPS 138): Hillsboro CDC Table 12.21.150-1 (R-10), minimum side setback, the largest of the Low Density Residential zones"
          quote: "or/washington/hillsboro/12.21/12.21.150.txt#L4,L29,L38"
        - value: 10
          when: [east_hillsboro_city_standards, attached_wall]
          cite: "East Hillsboro Community Plan Reedville / TV Highway overlay (FOLLOWUPS 138): Hillsboro CDC Table 12.21.150-1 (R-10) states one side setback and no zero for an attached wall"
          quote: "or/washington/hillsboro/12.21/12.21.150.txt#L4,L29,L38"
    setback_rear_ft:
