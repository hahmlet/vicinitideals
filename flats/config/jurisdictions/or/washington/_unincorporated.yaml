definitions:
  # Read 2026-09-29 from CDC Section 106, which is on disk whole
  # (cdc.106.definitions.txt runs from 106-1 to the Section 107 heading).
  #
  # CORNER LOT: SILENT. Section 106 defines no corner lot. The CDC uses the
  # term -- 106-113.1 names the front lot line "for corner lots", the
  # commercial and industrial districts give "a corner lot" a 20-foot street
  # yard, 430-84.3 B(3) adds a facade feature "on a corner lot" -- and never
  # says what one is. A grep of all 34 stored chapters for "corner lot",
  # "lot, corner" and "corner parcel" finds uses and no definition. 418-3
  # defines a "street corner" for the vision triangle only (the point where
  # two road edges meet), which is a point and not a class of lot. So the
  # term is left out: a corner question in this layer answers UNKNOWN, and no
  # other jurisdiction's test is borrowed.
  #
  # THE NOUN. 106-173: a Quadplex is "Four primary dwelling units each of
  # which, unless Middle Housing Quadplex units, shares at least one common
  # building wall or a common floor/ceiling with another dwelling unit". The
  # pod is a Quadplex. 106-143 Multi-Dwelling Structure starts at "Five or
  # more attached primary dwelling units", so the pod is outside it. 106-211
  # Townhouses ("attached dwelling units on separate lots") is the unit-lot
  # path. 106-124 makes Middle Housing a district list: "Residential
  # development in the R-5, R-6, R-9, R-15, R-24, R-25+, R-6 NB, R-9 NB,
  # R-15 NB, TO: R9-12, TO: R12-18 or TO: R18-24 district". 430-84 says the
  # same thing from the other side: in any other district a four-unit
  # building "is not Middle Housing", so its use gate is read from that
  # district's own list (usually an "Attached Dwelling Units" row).
  # (or/washington/_unincorporated/cdc.106.definitions.txt#L676-L686,L782-L786,L852-L857,L1104-L1107)
  #
  # SUFFICIENT INFRASTRUCTURE. 106-124 B lets a Quadplex be Middle Housing
  # only where "Sufficient Infrastructure" exists or the applicant provides
  # it; 106-210 defines that as connection to public sewer and public water
  # (L1086-L1092). The applicant may provide it, so it is not a use-gate
  # condition here; it is a doubt in the handoff for lots far from a main.
  #
  # FRONT LOT LINE. 106-113.1: "For corner lots, the line separating the
  # narrowest frontage from the street right-of-way" (L627-L629) -- encoded
  # as front_lot_line_corner: shortest under defaults.
  #
  # HEIGHT. 106-101.1 measures from "the adjoining curb level" to the mean
  # height between eaves and ridge of a pitched roof, and from building grade
  # where the building sits back further than required (L594-L601). The
  # design height is a dial (fields.DESIGN_HEIGHT_FT); nothing here bakes it.
  #
  # NET ACRE. 300-2.1 counts site size net of land "currently dedicated for
  # public right-of-way" (cdc.300.introduction.txt#L59-L60) -- an existing
  # lot's own area already is. Middle Housing density "is not a
  # consideration" in the residential districts, but five floors still bind
  # the pod (TO:R24-40, TO:R40-80, NMU, CCMU, CBD), and 300-2.8 lets "only
  # categories of land listed in Section 300-3.1" come out of the acreage a
  # minimum is figured on (L93-L98). Since 2026-10-04 (FOLLOWUPS 30) those
  # five carry measured_on: net_developable_area. 300-3.1 speaks of the
  # "unbuildable portion" within each category and 300-2.8 says "may", so
  # nothing comes off for certain: the floodplain (A), wetland (C),
  # resource (E) and vegetated-corridor (I) maps all go on `may_less`, and a
  # lot with any of them holds as a question rather than passing on the
  # smaller net. The rest of the list nothing here maps, so it is assumed
  # absent (Steph's option A). Maxima stay on the whole lot: 300-2.8 lets
  # the same land be counted "when calculating maximum allowed densities".
  # North Bethany's two floors (R-9 NB 7, R-24 NB 19) stay on the whole lot
  # too -- "Section 300-2.8 and Section 300-3 are not applicable in the North
  # Bethany Subarea" (L96-L98).

# Whether a private road or drive the lot abuts is a street here (FOLLOWUPS
# 17(b); Steph's rule of 2026-09-30: a private road is a way in for the
# parking everywhere, and governs the yards only where the city's code
# makes it a street, as this one does).
private_drives:
  street: true
  quote: "or/washington/_unincorporated/cdc.302.r-5.txt#L419"
  says: "Minimum frontage on a public or private street"
  cite: "CDC 302-7.1 E (and 303-307 E); CDC 106-93, 106-113.1, 106-183, 501-8.1"
  note: >-
    Section 106 defines no Street (whole-folder grep for a Street, Road or
    Corner Lot definition finds only Street Plug and Street Tree, L1070,
    L1073). A front lot line is "a line separating the lot from the street
    right-of-way" (106-113.1, L627), a right-of-way is "the area between the
    platted boundary lines of a street or public easement" (L931), and
    frontage is the portion of a lot "which abuts a street or road" (L587).
    The code's own usage makes a private street a street: every urban
    residential district sets "Minimum frontage on a public or private
    street" for middle housing (R-5 L419; R-6 L421, R-9 L389, R-15 L383,
    R-24 L368, R-25+ L398), and 501-8.1 speaks of a site that "fronts only
    private street(s)" (501 L443). So a line on a private street is a
    street line. Yards are measured from the property line, sidewalk "or
    easement for public travel, whichever is closest" (106-221, L1169), and
    such an easement includes a "private street, or private drive"
    (106-71.1, L508-L510).

defaults:
  # PARKING COUNT. 413-6.1 is headed "Minimum Off-Street Parking Spaces
  # Required outside the UGB" and says in the heading itself: "Development
  # inside the UGB is exempt from minimum parking standards". Every district
  # that can take the pod is an urban district inside the UGB, and the rural
  # districts are refused at the use gate below, so the layer default is the
  # inside-the-UGB answer. Encoded as zero rather than left out, because an
  # omitted minimum lets the state cap resolve as though it were a
  # requirement.
  parking_min_per_unit:
    value: 0
    cite: Washington County CDC 413-6.1, development inside the UGB is exempt from minimum parking standards
    url: https://api.municode.com/PublicationPdfDownload/3090
    retrieved: '2026-09-28'
    quote: "or/washington/_unincorporated/cdc.413.parking.txt#L223-L226,L232-L233"
  # NOT ENCODED: a parking maximum. 413-6.3 caps surface parking inside the
  # UGB and its residential rows are "Studio Unit 1.2" and "Non-studio
  # residential unit in a multi-unit housing development with 5 or more units
  # 2.0" (cdc.413.parking.txt#L409-L420). The pod is four non-studio units,
  # so neither row reaches it. 413-6 sends an unlisted use to "the most
  # similar listed use as determined by the Review Authority", which is a
  # discretionary choice, not a stated number. Either candidate row would
  # allow at least 1.2 per unit, above the four-stall floor the pod charges,
  # so the absence costs no lot a colour.
  #
  # STALL AND AISLE. 413-3: "All off-street parking lots ... shall be
  # designed in accordance with County standards for stalls and aisles
  # dimensions as set forth in the following drawings and tables". The
  # standard 90-degree row reads 8.5 ft stall width, 18 ft stall depth and
  # 24 ft aisle; 413-3.2 makes 24 ft the minimum two-way aisle. 413-3.2's
  # 15-foot one-way figure is for emergency vehicles ("The minimum aisle width
  # for emergency vehicle (one-way traffic) is 15 feet"), and the 90-degree
  # row prints 24 for its aisle regardless of direction, so the one-way aisle
  # is held at 24 too. Figure 1 is "for illustrative purposes only" and is
  # not read.
  parking_stall_width_ft:
    value: 8.5
    cite: Washington County CDC 413-3, standard 90-degree row, stall width
    url: https://api.municode.com/PublicationPdfDownload/3090
    retrieved: '2026-09-28'
    quote: "or/washington/_unincorporated/cdc.413.parking.txt#L55-L58,L65-L76,L97"
  parking_stall_depth_ft:
    value: 18
    cite: Washington County CDC 413-3, standard 90-degree row, stall depth
    url: https://api.municode.com/PublicationPdfDownload/3090
    retrieved: '2026-09-28'
    quote: "or/washington/_unincorporated/cdc.413.parking.txt#L55-L58,L65-L76,L97"
  parking_aisle_two_way_ft:
    value: 24
    cite: Washington County CDC 413-3.2, minimum two-way aisle, and the 90-degree row of 413-3
    url: https://api.municode.com/PublicationPdfDownload/3090
    retrieved: '2026-09-28'
    quote: "or/washington/_unincorporated/cdc.413.parking.txt#L65-L76,L97,L103-L105"
  parking_aisle_one_way_ft:
    value: 24
    cite: Washington County CDC 413-3, 90-degree row aisle width (the 15-foot figure in 413-3.2 is an emergency-vehicle lane)
    url: https://api.municode.com/PublicationPdfDownload/3090
    retrieved: '2026-09-28'
    quote: "or/washington/_unincorporated/cdc.413.parking.txt#L65-L76,L97,L103-L105"
  # DRIVEWAY APPROACH. 430-84.3 B(4)(a) is the state model code's sentence:
  # "The total width of all driveway approaches must not exceed 32 feet per
  # total frontage of the parent lot". B(4)(d) makes it prevail over 413.
  # NOT ENCODED from the rest of B(4): separated approaches must meet the
  # 501-8.5 spacing for the road class; a lot fronting only collectors or
  # arterials meets 501-8.5 B spacing; a lot fronting only local streets or
  # neighborhood routes may have two approaches totalling 32 feet on one
  # frontage or one 16-foot approach per frontage. Each turns on the class of
  # the abutting street, which nothing measures.
  driveway_approach_max_width_ft:
    value: 32
    cite: Washington County CDC 430-84.3 B(4)(a), total width of all driveway approaches per total frontage of the parent lot
    url: https://api.municode.com/PublicationPdfDownload/3090
    retrieved: '2026-09-28'
    quote: "or/washington/_unincorporated/cdc.430-84.middle-housing.txt#L219-L224,L246-L247"
  # CORNER ACCESS. The CDC names no street for a corner lot's driveway. What
  # it says is conditional on street class: 430-84.3 B(4)(c)(iii) lets a lot
  # fronting only local streets or neighborhood routes put approaches on
  # either frontage, (c)(ii) sends a lot fronting only collectors or
  # arterials to the 501-8.5 B spacing, and 501-8.5 B(3) grants direct
  # collector access only to "commercial, industrial and institutional uses
  # with 150 feet or more of frontage". A lot on one local street and one
  # collector is therefore steered to the local street. `lowest_class` is
  # the reading that holds in every combination; `any` would be right only
  # where both streets are local, which nothing measures.
  #
  # RE-READ 2026-10-06 (FOLLOWUPS 41), and kept. 501-8.5's opening says
  # its "access spacing requirements" reach middle housing only in the
  # 430-84.3 B(4) cases -- the spacing, not B's opening "No use will be
  # permitted to have direct access to a street or road except as specified
  # below", so the use gates stand. B(4) adds the arterial: access to one
  # "shall be from collector or other arterial streets". B(2) lets a
  # neighbourhood route serve a use with 70 ft of frontage. Each gate sends
  # the driveway down a class, so on a lot of two classes the lower one
  # serves; (c)(iii) leaves the choice open between two locals. Measured
  # from the county's TSP map (street_class_washington).
  corner_access_street:
    value: lowest_class
    cite: Washington County CDC 430-84.3 B(4)(c) + 501-8.5 B(3), collector access only for non-residential uses with 150 ft of frontage
    url: https://api.municode.com/PublicationPdfDownload/3090
    retrieved: '2026-09-28'
    quote: "or/washington/_unincorporated/cdc.430-84.middle-housing.txt#L229-L245"
  front_lot_line_corner:
    value: shortest
    cite: Washington County CDC 106-113.1, Front Lot Line, the narrowest frontage on a corner lot
    url: https://api.municode.com/PublicationPdfDownload/3090
    retrieved: '2026-09-28'
    quote: "or/washington/_unincorporated/cdc.106.definitions.txt#L627-L629"
  # PARKING PLACEMENT, left absent on purpose. 430-84.3 (Triplex and
  # Quadplex Standards) regulates entry orientation, windows, a corner-lot
  # facade feature and driveway approaches (cdc.430-84.middle-housing.txt
  # #L90-L247), and says nothing about where on the lot parking may stand.
  # 413-4 and 413-3 dimension a lot and its landscaping without a front- or
  # side-yard ban. The townhouse rules in 430-84.4 B(5) keep front-yard
  # parking off lots fronting only collectors or arterials, which is the
  # unit-lot path on a street class nothing measures; recorded as a doubt.

# THE LAYER-WIDE REFUSALS, one per standard, read 2026-09-29. Each applies in
# every urban R district below (R-5 to R-25+) and, where noted, beyond.
#
# NOT ENCODED: the porch figure in each district's front-yard rule (12 ft in
# R-5 and R-6, 9 in R-9, 6 in R-15, R-24 and R-25+ "to porch or other covered
# or enclosed entryway"). It is a lesser setback for an entry feature, and
# the front-wall figure is the one that places the building.
#
# NOT ENCODED: where yards are measured from. Each district's 7.1 B says
# "Yards shall be measured from the property line, sidewalk, or easement
# for public travel, whichever is closest to the building line" (R-5 at
# cdc.302.r-5.txt#L352-L354). Where a sidewalk or public-travel easement
# runs inside the lot, every yard starts at its edge. No easement layer is
# held; the `sidewalk_easement` condition names the fact and nothing measures
# it. A doubt in the handoff.
#
# NOT ENCODED: right-of-way dedication. 30X-2 C (Type I) requires, on a
# public street, right-of-way of 25 ft to centreline on a local street, 30 on
# a neighborhood route, 37 on a collector and 45 on an arterial, or a Type II
# exemption under 501-8.4 (R-5 at cdc.302.r-5.txt#L94-L111). Lot area is
# measured before the dedication (7.1 A), but yards run from the new line.
# How much a lot gives up depends on the existing half-width, which nothing
# measures. 418-2's future-right-of-way setback does not apply to Middle
# Housing (cdc.418-419.setbacks-height.txt#L34-L36).
#
# NOT ENCODED: 419-1, "Within 20 feet of another primary district with a
# lower height restriction, the height restriction of the adjacent district
# shall apply", with a 1:1 slope beyond (419-2)
# (cdc.418-419.setbacks-height.txt#L116-L121). A neighbour-height condition
# no registered site fact names. Every urban R district allows 35 ft and the
# design height is 26, so it bites only beside a district capped under 26.
#
# NOT ENCODED: 419-7, airport heights under FAA regulations
# (cdc.418-419.setbacks-height.txt#L147-L149). Overlay data.
#
# NOT ENCODED: 30X-5.6, which prohibits "high density residential
# development in airport approach zones" and says such uses "shall be
# avoided within any existing June, 1983 airport year 2000 LDN 55 contour"
# (R-5 at cdc.302.r-5.txt#L236-L239). The CDC does not define "high density
# residential" and no airport-approach layer is held. Overlay data and a
# doubt.
#
# NOT ENCODED: the future-development plan. A Type II Middle Housing
# application on a large lot must show that it "will not preclude feasible
# future development of the subject lot or parcel to the minimum density of
# the district" (430-37.1 B(1), reached through 30X-3 and 430-84.3 A(7)),
# with a shadow plat of the lots that could follow. It can push the pod
# toward one end of a big lot; it states no dimension of its own, and
# 430-37 is not stored.
#
# NOT ENCODED: the Community Plans. 300-1 makes "all development" comply
# with the applicable Community Plan's subarea provisions, "including the
# Design Elements and Area of Special Concern" (cdc.300.introduction.txt
# #L7-L14). The county has eleven community plans; none is stored or read,
# and nothing maps an Area of Special Concern to a lot. A per-area standard
# would be a variant behind a condition nothing measures; which standards
# they change is unknown until the plans are read. Owed locally, and a
# question for Steph.
#
# NOT ENCODED: the Bonny Slope West Subarea Overlay District (Section 391).
# It reaches only the Bonny Slope West Subarea of the Cedar Hills - Cedar
# Mill Community Plan (cdc.391.bonny-slope-west.txt#L11-L14), where "the
# standards of this district shall control" over the rest of the code
# (L33-L36) and the Community Plan controls over both (L18-L23). Its edge
# rule prohibits street stubs and driveways at the subarea boundary beside
# rural farm or forest land north of NW Laidlaw Road, Area of Special
# Concern 18 (L43-L49), and its landslide provisions work from Community
# Plan maps. Nothing marks which lots are in the subarea or in ASC 18; the
# base zone's standards are screened there as everywhere else. Overlay work.
#
# Prohibition grep (rulebook step 10), 2026-09-29: all 34 stored chapters
# searched for "prohibit", "not permitted", "not allowed". Beyond the
# entries in this layer, one reaches toward the pod and stops short: every
# R district's X-5.2 prohibits "the use of a manufactured dwelling ... as a
# residence" (R-5 at cdc.302.r-5.txt#L224-L227), and 106-131 defines a
# manufactured dwelling as a structure "constructed for movement on the
# public highways", built before 1962, to Oregon mobile home law, or to the
# federal manufactured housing standards (cdc.106.definitions.txt
# #L718-L734). The pod is factory-built but is none of those, so X-5.2 does
# not reach it. The rest are uses the pod is not (temporary uses, signs,
# vehicle storage, livestock) or are recorded where they bind.
#
# Clean Water Services. The CDC points at CWS twice in what is stored:
# 106-214 defines a Vegetated Corridor by the CWS "Design and Construction
# Standards" (cdc.106.definitions.txt#L1130-L1134), and 300-3.1 counts
# Water Quality Sensitive Areas and Vegetated Corridors as unbuildable
# (cdc.300.introduction.txt#L105-L117), which is the "buildable area" the
# Type I Middle Housing test in each R district measures. The corridors
# themselves are overlay data and local work.
