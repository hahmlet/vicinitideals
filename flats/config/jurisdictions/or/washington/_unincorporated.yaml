          quote: "or/washington/hillsboro/12.40/12.40.160.txt#L16-L18,L20-L25,L38-L39"
        - value: 15
          when: [east_hillsboro_city_standards, unit_lots]
          cite: "Washington County CDC 302-7.1 E(1), 15 feet for each townhouse lot, more than the 12 Hillsboro asks (FOLLOWUPS 138 overlay)"
          quote: "or/washington/_unincorporated/302/302-7.txt#L49-L50"
        - value: 25
          when: [east_hillsboro_city_standards, unit_lots, flag_lot]
          cite: "East Hillsboro Community Plan Reedville / TV Highway overlay (FOLLOWUPS 138): Hillsboro CDC 12.40.160 C.2 and Table 12.40.160-1, a 25-foot flagpole, more than the county 15"
