  # --- Transit Oriented Districts (Section 375) ----------------------------
  #
  # Table A is the use table for all nine TO districts; Tables B(1) and C(1)
  # hold Middle Housing, which 375 and 106-124 allow only in TO:R9-12,
  # TO:R12-18 and TO:R18-24; B(2) and C(2) hold "all Other Development".
  # Table A's key sends Middle Housing to the design standards of 430-84, not
  # Section 431 (375-10.txt#L253-L255). Everything else in
  # a TO district is reviewed against 431, which is not stored.
  #
  # The pod in the three denser residential districts and TO:BUS is not
  # Middle Housing, and Table A has no row for four units on one lot there:
  # "Duplexes and Triplexes that are not Middle Housing" stops at three, and
  # the apartment rows are multi-dwelling structures, which 106-143 starts at
  # five ("Examples include apartments and condominiums"). 375-5.2 prohibits
  # "Structures or uses not specifically authorized by the applicable Transit
  # Oriented District" unless the Review Authority finds them similar under
  # 202-2.2, a discretionary finding. What those districts do list is
  # "Townhouses and Rowhouses that are not Middle Housing" (Type II), which is
  # the pod split onto lots of its own: the `unit_lots` variant.
  #
  # NOT ENCODED: the 40-foot (TO:R9-12, TO:R12-18) and 50-foot (TO:R18-24)
  # Middle Housing height. Table B(1) gives those figures "or 35 feet if
  # abutting R-5 or R-6" (L941-L942). The lenient figure needs "does not abut
  # R-5 or R-6", a negation `when:` cannot say, so every lot is held at 35.
  # The design height is 26, so the pod does not feel the difference.
  #
  # NOT ENCODED: minimum floor area ratio. C(2) sets a minimum FAR for TO:RC,
  # TO:BUS and TO:EMP (0.25 to 1.0 by distance from a station platform or
  # transit center) and offers FAR as the alternative to minimum density in
  # the residential districts ("24 d.u./ac. or .65 FAR"). No minimum-FAR
  # field is held, and the distance to a station platform is not measured.
  # Where the residential districts carry a minimum density below, the
  # density figure is held and the FAR alternative is not, which can only
  # refuse a lot the FAR route would have saved. A doubt in the handoff.
  #
  # Section 431 (stored 2026-10-22, cdc.431.transit-design.txt) holds the
  # design standards for the non-Middle-Housing paths (375-4.1, 375-4.2: a
  # Type I or II use that misses them is heard as Type III). ENCODED: common
  # open space (431-7.2) on the townhouse path in TO:R24-40, TO:R40-80 and
  # TO:BUS, and TO:BUS's build-to share (431-5.1 B(1)). NOT ENCODED: parking
  # and garages kept 40 ft from a street corner (431-6.1 B(3)); the setback
  # to an R-5 or R-6 lot line equal to that district's rear yard and the
  # 35 ft height within 100 ft of one (431-8.2 E, G); Section 411 buffers;
  # facade, window and entry details (a design checklist, Steph 2026-10-14).
  # A flat roof with a parapet and cornice is allowed in every TO residential
  # district but TO:R9-12 (431-5.3 B(11)(e)), which is Middle Housing only and
  # outside 431. Section 411 is not stored. B(2) prints "None" for the
  # frontage minimum in TO:R24-40 and TO:R40-80; other yard questions remain
  # owed because the footnotes refer to Section 418 and Sections 411 and 431
  # (L1025, L1030-L1032).
