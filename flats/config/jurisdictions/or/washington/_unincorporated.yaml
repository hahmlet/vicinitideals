  #
  # NOT ENCODED: 390-20, Building Design and Variety, which reaches every NB
  # district except residential development in R-6 NB, NCMU NB, and R-24 NB
  # and R-25+ NB facades facing Kaiser Road in ASC 2 (L3054-L3075). Window
  # and door shares of each townhouse front, garage frontage set 8 feet
  # behind the front wall, blocks of at most ten townhouses, and siding
  # materials, T-111 and plain plywood prohibited (L3302-L3304). Facade
  # rules on a factory design; nothing in the screen describes a facade.
  #
  # NOT ENCODED: 390-22.1, dark or mirrored ground-floor windows prohibited
  # and roof equipment screened (L3471-L3478). Facade rules again.
  #
  # NOT ENCODED: 390-18.5 and 390-19.2 A. On the Density Restricted Lands
  # of the Community Plan map, density transfers and development inside the
  # Natural Features Buffer are prohibited (L2649-L2655), and street stubs
  # and driveways are prohibited at every NB boundary that abuts Rural
  # Reserves (L2673-L2677). Both are drawn on the plan's maps; no map is
  # held. Overlay work.
