    # EAST HILLSBORO OVERLAY (FOLLOWUPS 138; rulings.yaml
    # 2026-10-31-east-hillsboro-city-standards-are-an-overlay). The plan's
    # Reedville and TV Highway design elements make development proposals
    # "address the city of Hillsboro's development standards"
    # (community-plan.east-hillsboro.txt#L854, L883). The variants above and
    # the fields below hold, on those lots only (drawn_areas
    # east_hillsboro_city_standards), the strictest figure of Hillsboro's Low
    # Density Residential zones (R-10, R-8.5, R-7, R-6, the zones that
    # implement that plan designation, 12.21.110 A, 210 A, 310 A, 410 A)
    # wherever it is stricter than the county's. The fields below state a
    # standard this district does not, so they apply only_when the lot is
    # inside: outside, the district says nothing about them, as before.
    # NOT LAID OVER: R-7's 13-foot combined side yards, which R-10's 10 on
    # each side already exceeds; Hillsboro's procedures (12.80) -- the plan
    # names development standards, and the application stays the county's.
