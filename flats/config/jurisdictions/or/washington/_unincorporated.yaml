# FOLLOWUPS 129. The North Bethany Subarea Plan's maps (Chapter 2 maps,
# 11-2024 edition, printed 04/20/2021), traced 2026-10-30 from the GeoPDF's
# own registered vector strokes. Each file's source block says how.
drawn_areas:
  north_bethany_special_setbacks:
    condition: north_bethany_special_setbacks
    zones: [R-15 NB, R-24 NB]
    file: or/washington/_unincorporated/north-bethany-special-setbacks.geojson
    source: >-
      North Bethany Subarea Plan Map 8, Special Setbacks (Chapter 2 maps
      11-2024, page 8, retrieved 2026-10-30). The map marks street segments;
      the file holds the R-15 NB and R-24 NB lots that front a marked segment
      (whole lot) and, as half-lot markers, the lots a mapped future street
      runs through or that sit too near a segment end to call. Drawn
      provenance in the file's source block.
    quote: "or/washington/_unincorporated/community-plan.north-bethany-subarea.txt#L621-L626,L631-L632,L842-L846"
    cite: North Bethany Subarea Plan General Design Element 7 and the Special Setbacks Map (CDC 390-3)
    note: >-
      Inside means the lot fronts a Park Blocks or Linear Park segment of
      the Special Setbacks Map, so the build-to front yard of Design Element
      7 governs; outside means the map reaches no frontage of the lot and
      the district's own yards govern; a cut lot is left unanswered.
  north_bethany_park_blocks_asc_5:
    condition: north_bethany_park_blocks
    zones: [R-6 NB, R-9 NB, R-15 NB, R-24 NB]
    file: or/washington/_unincorporated/north-bethany-park-blocks-asc-5-lots.geojson
    source: >-
      North Bethany Subarea Plan Map 17, Areas of Special Concern (Chapter 2
      maps 11-2024, page 17, retrieved 2026-10-30), the ASC 5 outline as
      FOLLOWUPS 129 traced it (north-bethany-park-blocks-asc-5.geojson, 55.2
      acres), narrowed by FOLLOWUPS 132 to the lots inside it on which ASC 5
      item 4 or item 5 reaches the pod, plus the lots the outline cuts.
      Drawn provenance in the file's source block.
    quote: "or/washington/_unincorporated/community-plan.north-bethany-subarea.txt#L1156-L1158,L2291-L2293,L2299,L2355-L2364"
    cite: North Bethany Subarea Plan ASC 5, Park Blocks, items 4 and 5 (CDC 390-3)
    note: >-
      ASC 5's six requirements "apply in the Park Blocks ASC" (L2299).
      Items 1, 2, 3 and 6 set block lengths, the P11/P12 couplet and its
      170 ft median, and a pedestrian accessway between the Park Blocks and
      P4: street and block layout, which a pod on an existing lot does not
      change. Item 4 bars vehicle access from the Park Blocks to residential
      property adjacent to them; the screen cannot bar a driveway from one
      named street, so a lot within 60 ft of a median tract or fronting a
      Map 8 Park Blocks stroke is inside and held. Item 5 bars a parking lot
      between the street and the adjacent buildings; the pod parks in a
      court behind the building, which stands between a street and the
      building only on a lot with street right-of-way on two opposite sides,
      so such a lot is inside and held. Every other lot in ASC 5 is outside
      and reads its district's own standards. A lot the ASC 5 outline cuts
      is unanswered.
  north_bethany_kaiser_main_street:
    condition: north_bethany_kaiser_main_street
    zones: [R-24 NB]
    file: or/washington/_unincorporated/north-bethany-kaiser-main-street.geojson
    source: >-
      North Bethany Subarea Plan Map 17, Areas of Special Concern (Chapter 2
      maps 11-2024, page 17, retrieved 2026-10-30), the ASC 2 Main Street
      outline either side of Kaiser Road, read with the county's Kaiser Road
      centreline. No R-24 NB lot lies wholly inside and fronts Kaiser; the
      file holds the two the outline cuts. Drawn provenance in the file's
      source block.
    quote: "or/washington/_unincorporated/community-plan.north-bethany-subarea.txt#L1251-L1258,L1378-L1383"
    cite: North Bethany Subarea Plan ASC Road Corridor 2, North Bethany Main Street (CDC 390-3)
    note: >-
      Inside means an R-24 NB lot in the Main Street ASC with Kaiser Road
      frontage, whose Kaiser-facing elevation the corridor standards bind;
      outside means a lot outside ASC 2 or with no Kaiser frontage; the two
      lots the ASC 2 line cuts are unanswered.
  bethany_asc_1:
    condition: bethany_asc_1
    zones: [R-9, R-15, R-24, CBD, OC]
    file: or/washington/_unincorporated/bethany-asc-1.geojson
    source: >-
      Bethany Community Plan Map 5, Areas of Special Concern (Chapter 1 text
      and maps 09-2026, page 42, printed 2/9/2023, retrieved 2026-10-30), the
      ASC 1 outline of Central Bethany, with the one lot it cuts added whole.
      Drawn provenance in the file's source block.
    quote: "or/washington/_unincorporated/community-plan.bethany.txt#L870-L872,L876-L877,L1035-L1037"
    cite: Bethany Community Plan, Central Bethany Subarea, Area of Special Concern 1, design element 9
    note: >-
      Inside means a lot in ASC 1, where all development must comply with
      the conditions of approval of the 1994 Central Bethany Planned
      Development, including the design guidelines of Exhibit G of R&O
      94-104, which are not held. Steph 2026-10-30 (rulings.yaml
      2026-10-30-bethany-asc1-green-with-flag): green with a flag below the
      yellow line, so inside moves no colour and only carries
      BETHANY-ASC1-PD-CONDITIONS. The outline cuts one lot (1N120DA20300, a
      1,322 sf R-9 lot 39 percent inside); it is added whole and carries
      the flag too, because a flag below the yellow line costs a half-inside
      lot nothing. Items 10 to 12 of the same list are a Providence building
      rule (ASC 1A 4.d), an 860-unit minimum for the whole planned
      development (built out) and a bar on new commercial designations; none
      is a lot standard the pod meets or misses.
  bethany_asc_1a:
    condition: bethany_asc_1a
    zones: [R-9, R-15, R-24, CBD]
    file: or/washington/_unincorporated/bethany-asc-1a.geojson
    source: >-
      Bethany Community Plan Map 5, Areas of Special Concern (Chapter 1 text
      and maps 09-2026, page 42), the five ASC 1A outlines (Parcels 1 to 5)
      inside ASC 1. Drawn provenance in the file's source block.
    quote: "or/washington/_unincorporated/community-plan.bethany.txt#L1047-L1048,L1055-L1058"
    cite: Bethany Community Plan, Area of Special Concern 1A, design element 2
    note: >-
