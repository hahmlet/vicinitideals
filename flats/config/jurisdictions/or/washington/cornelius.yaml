definitions:
  # Read 2026-09-30 from CMC 18.195, which is on disk whole
  # (cmc.18.195.definitions.txt).
  #
  # THE NOUN. "Dwelling, quadplex" means "a building containing four
  # attached or detached dwelling units located on a single parcel or lot"
  # (L215-L216), and "Dwelling, middle housing" means "a duplex, triplex,
  # quadplex, townhouse, or cottage cluster" (L191-L192). The pod is a
  # quadplex and so middle housing. "Dwelling, multi-unit" starts at "five
  # or more dwelling units on a single lot or parcel" (L209-L210), so a
  # prohibition of multi-unit dwellings (R-10 18.25.040 (B)) does not reach
  # the pod. A townhouse is "two or more dwelling units, separated by common
  # walls on the property lines" (L218-L219): the unit-lot path. "Multi-family"
  # is not defined; A-2 and CR use it beside "single-family" for the yards
  # and the density floor, and the pod, which is not single-family, is read
  # as multi-family there.
  #
  # FRONT LOT LINE. Defined only "for purposes of the solar access
  # regulations": "For corner lots, the front lot line is that with the
  # narrowest frontage" (L291-L292). The zone chapters speak of "the front"
  # and of "the side yard facing the street" on a corner lot without naming
  # either line. Held as front_lot_line_corner: shortest under defaults, the
  # one rule the code prints; a doubt and a question for Steph.
  #
  # STREET. "every way which provides for public use for the purpose of
  # vehicular and pedestrian traffic" (L705-L706). "Street side lot line" is
  # "a lot line which abuts a public street, alley or way" (L708-L709). See
  # private_drives below.
  #
  # SETBACK. Measured from "the lot line following any required dedication"
  # (L645-L646). Dedication takes ground nothing measures; recorded, not
  # encoded, as in the other Washington layers.
  #
  # HEIGHT. To "the point midway between the ridge and the eaves of a pitch
  # or hip roof" (L323-L324).
  #
  # LOT COVERAGE. Buildings "including covered parking areas" (L139-L140).
  #
  # NET ACRE. "Acre, gross" is 43,560 square feet (L35-L36); "Acreage, net"
  # takes out street dedications, private streets and common driveways,
  # environmentally constrained lands and land set aside in tracts
  # (L41-L54). R-10 and CR measure their density floors on this acreage
  # (CR says so: 18.70.050, "as defined in Chapter 18.195"). R-7 and A-2 do
  # not: each defines its own net acre in its own section -- "A net acre is
  # equal to 32,670 square feet, and excludes roads, common open space,
  # floodplains, riparian setbacks, and slopes over 25 percent" (18.20.050
  # (A), 18.35.050) -- which is three quarters of a gross acre and a
  # different subtraction list. Each zone cites its own sentence.
  #
  # PARKING SPACE. "a rectangle not less than 20 feet long and eight and
  # one-half feet wide" (L520-L521). 18.145.050 (A) prints nine by 20
  # "Except as otherwise defined in this code". See the stall below.
  corner_lot:
    # "a lot abutting on two intersecting streets other than an alley;
    # provided, that the streets do not intersect at an angle greater than
    # 135 degrees." The alley exception is the default alleys_count: false;
    # a street is a way for public use, so a private drive does not make a
    # corner (drives_count stays false).
    test: intersecting_frontages
    max_intersection_angle_deg: 135.0
    quote: "or/washington/cornelius/cmc.18.195.definitions.txt#L417-L418"
    cite: "Cornelius CMC 18.195.120, Lot, corner"

# Whether a private road or drive the lot abuts is a street here (FOLLOWUPS
# 17(b); Steph's rule of 2026-09-30: a private road is a way in for the
# parking everywhere, and governs the yards only where the city's code
# makes it a street).
private_drives:
  street: false
  quote: "or/washington/cornelius/cmc.18.195.definitions.txt#L705-L706"
  says: "which provides for public use"
  cite: "Cornelius CMC 18.195 (Street; Street side lot line; Lot, corner; Access; Road) and 18.150.070 (B)"
  note: >-
    "Street" means "the entire width between the boundary lines of every way
    which provides for public use" (L705-L706), and a street side lot line
    abuts "a public street, alley or way" (L708-L709). A private access is
    "an access not in public ownership or control by means of deed,
    dedication or easement" (L26-L27): not for public use, so not a street.
    "Road" does reach "a public or private way" (L629-L630), but no yard
    rule is measured from a road. Where the code wants a private way treated
    as a street it says so, and only for one section: "A private access
    shall be treated as a public street for the purpose of this section"
    (18.150.070 (B), cmc.18.150.special-use.txt L215), the clear vision
    zone, which is not encoded.

defaults:
  # PARKING COUNT. 18.145.030 (A), Table: "Middle Housing 1.0/DU none none",
  # the minimum and the Zone A and Zone B maximums (cmc.18.145.parking.txt
  # L111-L135). The table applies "regardless of the parking zone in which
  # the use is located" (L99). One stall per unit; the state layer caps the
  # total for a quadplex below four on lots under 7,000 square feet, and no
  # zone here admits the pod below 7,000.
  parking_min_per_unit:
    value: 1
    cite: Cornelius CMC 18.145.030 (A) Table, Middle Housing (1.0/DU minimum)
    url: https://ecode360.com/print/CO4396?guid=47339373
    retrieved: '2026-09-30'
    quote: "or/washington/cornelius/cmc.18.145.parking.txt#L111-L112,L131-L132"
  parking_max_per_unit:
    exempt: true
    cite: Cornelius CMC 18.145.030 (A) Table, Middle Housing (maximum none in Zone A and Zone B)
    url: https://ecode360.com/print/CO4396?guid=47339373
    retrieved: '2026-09-30'
    quote: "or/washington/cornelius/cmc.18.145.parking.txt#L113-L114,L118-L119,L131,L133-L134"
  # THE STALL. 18.145.050 (A): "Except as otherwise defined in this code,
  # 'one standard parking space' means a minimum of a parking stall of nine
  # feet in width and 20 feet in length" (L501). 18.195 defines "Parking
  # space" as "not less than 20 feet long and eight and one-half feet wide"
  # (definitions L520-L521). Read literally, the exception hands the width
  # to the definition and the stall is 8.5; read as the parking chapter's
  # own standard, it is 9. The code does not say which governs. Held at 9,
  # the stricter, and put to Steph. The length is 20 on both readings.
  #
  # NOT ENCODED: the compact stalls of the same sentence, "up to 25 percent
  # of the available parking spaces may have a minimum dimension of eight
  # feet in width and 16 feet in length" -- for four stalls, one. An
  # allowance; the standard stall is held, as in the other layers.
  #
  # NOT ENCODED: an aisle. 18.145.050 (E): "Parking space configuration,
  # stall and access aisles shall be of sufficient width for all vehicles
  # turning and maneuvering" (L517). No figure anywhere in the chapter; the
  # site plan draws its assumed aisle and marks the lot geometry_assumed.
  # 050 (B), (F) and (G) -- service drives, striping and street-standard
  # paving -- each except "middle housing residences" (L505, L521, L525).
  parking_stall_width_ft:
    value: 9
    cite: Cornelius CMC 18.145.050 (A), one standard parking space (nine feet in width; 18.195 Parking space prints eight and one-half, read the stricter way)
    url: https://ecode360.com/print/CO4396?guid=47339373
    retrieved: '2026-09-30'
    quote: "or/washington/cornelius/cmc.18.145.parking.txt#L501"
  parking_stall_depth_ft:
    value: 20
    cite: Cornelius CMC 18.145.050 (A), one standard parking space (20 feet in length)
    url: https://ecode360.com/print/CO4396?guid=47339373
    retrieved: '2026-09-30'
    quote: "or/washington/cornelius/cmc.18.145.parking.txt#L501"
  # WHICH STREET IS THE FRONT on a corner lot. The only rule the code prints
  # is the solar-access definition's, "the front lot line is that with the
  # narrowest frontage" (see the definitions comment). Held as shortest; a
  # doubt. The yards themselves only name "the front" and "the side yard
  # facing the street", one of each, so the corner lot has one front.
  front_lot_line_corner:
    value: shortest
    cite: Cornelius CMC 18.195.060, Front lot line (corner lots, the narrowest frontage; stated for the solar access regulations, read for the yards the stricter way)
    url: https://ecode360.com/print/CO4396?guid=47339847
    retrieved: '2026-09-30'
    quote: "or/washington/cornelius/cmc.18.195.definitions.txt#L291-L292"
  # NOT ENCODED: front_lot_line_through. A through lot is "a lot other than a
  # corner lot with frontage on more than one street" (definitions
  # L757-L758), and nothing says which frontage is the front. Left unread,
  # and so screened at the worst end.
  #
  # WHICH STREET THE DRIVEWAY USES. The same sentence in all four residential
  # zones: "Access to individual lots shall be primarily from local streets
  # or alleyways ... Direct lot access to arterials or collector streets
  # shall not be permitted, unless there is no alternative as determined by
  # the city engineer" (R-7 18.20.060 (B)(1), L256; R-10 18.25.060 (B)(1)
  # L231; A-2 18.35.060 (D)(1) L294; CR 18.70.060 (B)(1) L296), and
  # 18.143.050 (C)(5): "Direct access to a collector street shall only be
  # considered if there is no alternative way to access the site"
  # (cmc.18.143.transportation.txt L179). The lowest class first.
  corner_access_street:
    value: lowest_class
    cite: Cornelius CMC 18.20.060 (B)(1) (and 18.25.060 (B)(1), 18.35.060 (D)(1), 18.70.060 (B)(1)), access to individual lots primarily from local streets or alleys
    url: https://ecode360.com/print/CO4396?guid=47337420
    retrieved: '2026-09-30'
    quote: "or/washington/cornelius/cmc.18.20.r-7.txt#L256"
  # NOT ENCODED: parking_side_prohibited and parking_front_prohibited. No
  # sentence bans parking beside or in front of the building; 18.145.010 (B)
  # keeps required parking out of the required YARDS, which is a setback
  # (parking_street_setback_ft in each zone) and, on the side and rear, a
  # rule no field holds (below).

# THE LAYER-WIDE REFUSALS, one per standard, read 2026-09-30.
#
# NOT ENCODED, A DOUBT THAT CAN MOVE A VERDICT: 18.145.010 (B), "Unless
# otherwise provided, required parking and loading spaces shall not be
# located in a required yard" (cmc.18.145.parking.txt#L23). The front yard
# is held (parking_street_setback_ft, same_as the front setback, in each
# zone). The rear and side yards are not: no field keeps a parking court out
# of a rear or interior side yard, and the site plan lets the court overlap
# the rear yard. In R-7 the four stalls may not sit in the rear 10 feet; in
# R-10, the rear 25. The screen is loose by up to the rear setback on every
# lot the court binds. Owed a field; in the handoff.
#
# NOT ENCODED: 18.145.070 (A) and (B), a five-foot landscaped strip between
# a parking area and an abutting right-of-way, and between a parking area
# and an abutting property where no building screens it (L637, L641). The
# street strip is inside the front yard parking already keeps out of; the
# strip to a neighbour is a parking setback from an interior lot line, which
# no field holds. 070 (C) and (D) (L645, L649) reach a nonresidential zone's
# lot and every tenth stall. 060's landscaping requirements exempt "Parking
# areas serving single- and two-family uses and multi-family uses with not
# more than four units in the core residential zone" (L609).
#
# NOT ENCODED: covered parking. All four residential zones: "One covered
# parking space shall be provided for each home either on an individual lot
# or in an off-street parking bay within 100 feet from the dwelling being
# served" (R-7 L312; R-10 L283; A-2 L378; CR L380). The pod parks in an open
# court. A carport over it is an accessory structure under 18.150.010: not
# in a required front yard, not within six feet of the main building unless
# attached to it, three feet from any lot line (cmc.18.150.special-use.txt
# L39, L43, L47). The court is drawn five feet off the wall, inside that six.
# A design question, not a number; put to Steph.
#
# NOT ENCODED: 18.150.070, clear vision zones: a triangle of 15 feet along
# each leg from the projected curb lines at street intersections and at a
# driveway "providing vehicular access to a public street", clear of
# structures that would impede visibility (cmc.18.150.special-use.txt
# L207-L211). Measured from curb lines nothing holds; at 15 feet it stays
# inside the front and street side yards wherever the lot line is at least
# a few feet behind the curb. Recorded.
#
# NOT ENCODED: 18.143.050 (C)(1), driveway spacing "in accordance with
# adopted public works standards" (cmc.18.143.transportation.txt L163); and
# in A-2 and CR, "No entrance or exit shall be located closer than 100 feet
# to any intersection of a public street, unless there is no reasonable
# alternative" (A-2 L302, CR L304). A curb-return distance nothing measures;
# on a corner lot short of 100 feet along a street it leaves that street no
# drive except by the city's finding. A doubt.
#
# NOT ENCODED: 18.100.070, the design features a detached house or middle
# housing must pick from (Type I site design review, 18.100.030 (A)(2),
# cmc.18.100.site-design.txt L89). Design, not placement.
#
# NOT ENCODED: "All setbacks shall be measured from Clean Water Services
# (CWS) required buffer areas, where applicable" (R-7 18.20.050 (D)(6),
# L208). Overlay data; the CWS buffers are local work, as in Hillsboro.
#
# NOT ENCODED: the open space of 300 square feet a unit "Within residential
# developments containing 20 or more lots or units" (R-7 L328, A-2 L250).
# Four units.
#
# NOT ENCODED: the perimeter strips a reviewing body "may require" along an
# arterial or a nonresidential area (R-7 L240-L244, A-2 L258-L262). A
# discretion on a subdivision, not a standard on a lot.
#
# NOT ENCODED: the affordable-housing height and density bonus (R-7 L180,
# A-2 L188). Relief the pod does not take.
#
# NOT ENCODED: Chapter 18.90, Floodplain District. Flood construction and
# no-net-loss standards over the special flood hazard area, with no use list
# of its own; the flood layers are local work.
#
# NOT ENCODED: 18.05.040, similar uses determined by the community
# development director (cmc.18.05.general.txt L108). Not a standard on a lot.
zones:
  # ------------------------------------------------------------------
  # R-7, Low-Density Residential, 18.20. 18.20.020: "The following uses and
  # their accessory uses are permitted outright in an R-7 zone ... (B)
  # Middle housing" (L23, L31), and a detached dwelling may be "site built,
  # manufactured off site, or prefabricated" (L27). Middle housing site
  # plans are a Type I design review (18.100.030 (A)(2),
  # cmc.18.100.site-design.txt L89).
  #
  # A DOUBT, AND A QUESTION FOR STEPH. 18.20.040 (B) prohibits "More than one
  # dwelling unit on a single lot, except for an accessory dwelling unit or a
  # duplex as approved through CMC § 18.20.030" (L123), and 18.05.070 (C)
  # makes the more restrictive provision govern (cmc.18.05.general.txt
  # L232). Read alone that bars the pod. It is left over: the duplex path it
  # points to, 18.20.030 (D), was "Repealed by Ord. 2022-03" (L77), the same
  # ordinance that made middle housing a permitted use; the zone's own lot
  # table prints "Quadplex and cottage cluster 7,000 square feet" (L159) and
  # its middle housing land division rule names the quadplex (L228); and
  # Cornelius is a Large City under OAR 660-046-0020, which must allow a
  # quadplex where a detached house is allowed. The specific permission is
  # read over the stale prohibition. Admitted.
  #
  # THE DIMENSIONS, 18.20.050:
  # - DENSITY. Maximum "five dwellings per net acre for detached single-unit
  #   dwellings and 20 dwellings per net acre for townhouses. Maximum density
  #   does not apply to duplexes, triplexes, quadplexes, or cottage
  #   clusters. A net acre is equal to 32,670 square feet" (L151). Minimum
  #   "four dwellings per net acre" (L168), on the same net acre: held with
  #   acre_sqft 32670, which comes to 5.33 per 43,560 square feet, so the
  #   pod's four units need no more than 32,670 net square feet. The
  #   townhouse maximum is a variant and variants cannot carry acre_sqft:
  #   held at 20 as printed, which reads it on the larger acre and is a
  #   quarter stricter than the code. It reaches only a townhouse plat.
  # - LOT SIZE. Quadplex 7,000, townhouse 1,500 (L157-L160). The flag
  #   pole does not count toward area (L164); NOT ENCODED, nothing measures
  #   a pole.
  # - HEIGHT 35 (L172).
  # - FRONT 10 "as measured from the furthest extension of the home,
  #   including porch or decks"; garages and carports 20 (L188).
  # - REAR 10 (L192). SIDE 5, street side 10 on a corner lot, zero on a
  #   townhouse's common wall (L196).
  # - LOT SHAPE 60 wide and 60 deep, townhouse lots 20 wide (L216). NOT
  #   ENCODED: the commission's in-fill reduction to 50 (L220) and to 20 or
  #   30 at the street (L224); discretions, and looser.
  # - DRIVEWAY. "minimum pavement width of 12 feet and shall not be more
  #   than 25 feet in width at the curb" (18.20.060 (C)(2), L280).
  # ------------------------------------------------------------------
  R-7:
    cite_default:
      cite: Cornelius CMC Chapter 18.20 (R-7 Low-Density Residential)
      url: https://ecode360.com/print/CO4396?guid=47337420
      retrieved: '2026-09-30'
    quadplex_allowed:
      value: true
      cite: Cornelius CMC 18.20.020 (B), middle housing permitted outright (18.20.040 (B) read as superseded; see the zone comment)
      quote: "or/washington/cornelius/cmc.18.20.r-7.txt#L23,L31"
    min_lot_sqft:
      value: 7000
      cite: Cornelius CMC 18.20.050 (A)(1), minimum lot size, quadplex and cottage cluster
      quote: "or/washington/cornelius/cmc.18.20.r-7.txt#L157,L159"
      variants:
        - value: 1500
