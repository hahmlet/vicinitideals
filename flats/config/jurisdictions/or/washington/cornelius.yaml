# THE LAYER-WIDE REFUSALS, one per standard, read 2026-09-30.
#
# FLAGGED, NOT MEASURED, IN R-7 AND R-10: Chapter
# 18.160, Solar Balance Point. It "applies to an application for a building
# permit for all structures in all single-family zones"
# (cmc.18.160.solar-balance-point.txt L23), and R-10 and R-7 are the code's
# two "Single-Family" districts (cmc.18.05.general.txt L53-L54). The shade
# point -- the peak of a roof pitched 5 in 12 or steeper, the eave of a
# flatter one (definitions L652) -- may stand no higher than
# H = (2 x SRL - N + 150) / 5, SRL being its distance from the northern lot
# line and N the north-south lot dimension, counted at most 90 (L33-L46).
# A 26 ft shade point must then be 35 ft from the northern lot line on a lot
# 90 ft or more north to south, and 20 ft on a lot 60 ft north to south.
# Where the street is on the lot's north side, R-7's 10 ft front yard does
# not hold the roof that far back. Exemptions, (C) L286-L332: a lot created
# under Chapter 18.155 and "not subject to the provisions of CMC
# 18.155.020(E)" -- a subsection the stored 18.155.020 does not have
# (cmc.18.155.solar-access.txt L21-L23) -- shade already cast by a building,
# landform or kept tree, a slope over 20 percent facing away from south,
# and shade falling only on an unheated wall or under 20 sq ft of south
# glass. (G), L566-L592, cuts the yards by up to half where that is needed
# to comply. No field holds a height that grows with the distance from one
# named lot line, and the screen does not know which line faces north.
# Steph, 2026-10-01: flag every R-7 and R-10 lot for now, build no shade
# check. Held as `qualified_by: solar_shade_point` on each zone's height --
# a site fact nothing measures -- so every lot there leans on it and comes
# back UNKNOWN ("needs a closer look") with the fact named, never GREEN.
# There is no milder honest mark: YELLOW is a definite miss with an
# application path, and nothing here is known to miss.
#
# Chapter 18.165, the solar access permit, protects a solar feature from
# vegetation only (cmc.18.165.solar-access-permit.txt L17); 18.155 governs
# the layout of a development (cmc.18.155.solar-access.txt L29, 65 percent
# of lots under 10,000 sq ft solar-oriented).
#
# NOT ENCODED: 18.145.070 (A) and (B), a five-foot landscaped strip between
# a parking area and an abutting right-of-way, and between a parking area
# and an abutting property where no building screens it (L637, L641). The
# street strip is inside the front yard parking already keeps out of; the
# strip to a neighbour is a parking setback from an interior lot line, which
# no field holds. 070 (C) and (D) (L645, L649) reach a nonresidential zone's
# lot and every tenth stall. 060's landscaping requirements exempt "Parking
# areas serving single- and two-family uses and multi-family uses with not
# more than four units in the core residential zone" (L609).
#
# COVERED PARKING (parking_covered_required, in each zone). All four
# residential zones and GMU: "One covered parking space shall be provided
# for each home [dwelling unit] either on an [the] individual lot or in an
# off-street parking bay within 100 feet" (R-7 L312; R-10 L283; A-2 L378;
# CR L380; GMU L671). Steph, 2026-10-01: the pod has no covered parking, so
# where the requirement holds the lot fails on it. It does not hold for the
# one-lot quadplex: OAR 660-046-0220(2)(e)(D), "A Large City may allow, but
# may not require, off-street parking to be provided as a garage or
# carport" (oar.660-046-0220.txt L96-L97), and Cornelius is inside Metro.
# The townhouse rules in (3) carry no such sentence, so on the unit-lot
# path the city's sentence stands. GMU prohibits detached houses, so the
# state rule does not reach it and it holds on every path. (MHP asks the
# same of a manufactured home, L425; MHP refuses the pod.) A carport, were
# one added, is an accessory structure under 18.150.010: not in a required
# front yard, not within six feet of the main building unless attached to
# it, three feet from any lot line (cmc.18.150.special-use.txt L39, L43,
# L47).
#
# NOT ENCODED: 18.150.070, clear vision zones: a triangle of 15 feet along
# each leg from the projected curb lines at street intersections and at a
# driveway "providing vehicular access to a public street", clear of
# structures that would impede visibility (cmc.18.150.special-use.txt
# L207-L211). Measured from curb lines nothing holds; at 15 feet it stays
# inside the front and street side yards wherever the lot line is at least
# a few feet behind the curb. Recorded.
#
# NOT ENCODED: 18.143.050 (C)(1), driveway spacing "in accordance with
# adopted public works standards" (cmc.18.143.transportation.txt L163); and
# in A-2 and CR, "No entrance or exit shall be located closer than 100 feet
# to any intersection of a public street, unless there is no reasonable
# alternative" (A-2 L302, CR L304). A curb-return distance nothing measures;
# on a corner lot short of 100 feet along a street it leaves that street no
# drive except by the city's finding. A doubt.
#
# NOT ENCODED: 18.100.070, the design features a detached house or middle
# housing must pick from (Type I site design review, 18.100.030 (A)(2),
# cmc.18.100.site-design.txt L89). Design, not placement.
#
# NOT ENCODED: "All setbacks shall be measured from Clean Water Services
# (CWS) required buffer areas, where applicable" (R-7 18.20.050 (D)(6),
# L208). Overlay data; the CWS buffers are local work, as in Hillsboro.
#
# NOT ENCODED: the open space of 300 square feet a unit "Within residential
# developments containing 20 or more lots or units" (R-7 L328, A-2 L250).
# Four units.
#
# NOT ENCODED: the perimeter strips a reviewing body "may require" along an
# arterial or a nonresidential area (R-7 L240-L244, A-2 L258-L262). A
# discretion on a subdivision, not a standard on a lot.
#
# NOT ENCODED: the affordable-housing height and density bonus (R-7 L180,
# A-2 L188). Relief the pod does not take.
#
# NOT ENCODED: Chapter 18.90, Floodplain District. Flood construction and
# no-net-loss standards over the special flood hazard area, with no use list
# of its own; the flood layers are local work.
#
# NOT ENCODED: 18.05.040, similar uses determined by the community
# development director (cmc.18.05.general.txt L108). Not a standard on a lot.
zones:
  # ------------------------------------------------------------------
  # R-7, Low-Density Residential, 18.20. 18.20.020: "The following uses and
  # their accessory uses are permitted outright in an R-7 zone ... (B)
  # Middle housing" (L23, L31), and a detached dwelling may be "site built,
  # manufactured off site, or prefabricated" (L27). Middle housing site
  # plans are a Type I design review (18.100.030 (A)(2),
  # cmc.18.100.site-design.txt L89).
  #
  # RULED 2026-10-01 (Steph: cancelled by state law). 18.20.040 (B)
  # prohibits "More than one dwelling unit on a single lot, except for an accessory dwelling unit or a
  # duplex as approved through CMC § 18.20.030" (L123), and 18.05.070 (C)
  # makes the more restrictive provision govern (cmc.18.05.general.txt
  # L232). Read alone that bars the pod. It is left over: the duplex path it
  # points to, 18.20.030 (D), was "Repealed by Ord. 2022-03" (L77), the same
  # ordinance that made middle housing a permitted use; the zone's own lot
  # table prints "Quadplex and cottage cluster 7,000 square feet" (L159) and
  # its middle housing land division rule names the quadplex (L228); and
  # Cornelius is a Large City under OAR 660-046-0020, which must allow a
  # quadplex where a detached house is allowed. The specific permission is
  # read over the stale prohibition. Admitted.
  #
  # THE DIMENSIONS, 18.20.050:
  # - DENSITY. Maximum "five dwellings per net acre for detached single-unit
  #   dwellings and 20 dwellings per net acre for townhouses. Maximum density
  #   does not apply to duplexes, triplexes, quadplexes, or cottage
  #   clusters. A net acre is equal to 32,670 square feet" (L151). Minimum
  #   "four dwellings per net acre" (L168), on the same net acre: held with
  #   acre_sqft 32670, which comes to 5.33 per 43,560 square feet, so the
  #   pod's four units need no more than 32,670 net square feet. The
  #   townhouse maximum is a variant and variants cannot carry acre_sqft:
  #   held at 20 as printed, which reads it on the larger acre and is a
  #   quarter stricter than the code. It reaches only a townhouse plat.
  # - LOT SIZE. Quadplex 7,000, townhouse 1,500 (L157-L160). The flag
  #   pole does not count toward area (L164); NOT ENCODED, nothing measures
  #   a pole.
  # - HEIGHT 35 (L172).
  # - FRONT 10 "as measured from the furthest extension of the home,
  #   including porch or decks"; garages and carports 20 (L188).
  # - REAR 10 (L192). SIDE 5, street side 10 on a corner lot, zero on a
  #   townhouse's common wall (L196).
  # - LOT SHAPE 60 wide and 60 deep, townhouse lots 20 wide (L216). NOT
  #   ENCODED: the commission's in-fill reduction to 50 (L220) and to 20 or
  #   30 at the street (L224); discretions, and looser.
  # - DRIVEWAY. "minimum pavement width of 12 feet and shall not be more
  #   than 25 feet in width at the curb" (18.20.060 (C)(2), L280).
  # ------------------------------------------------------------------
