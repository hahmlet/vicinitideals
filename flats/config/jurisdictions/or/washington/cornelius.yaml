definitions:
  # Read 2026-09-30 from CMC 18.195, which is on disk whole
  # (cmc.18.195.definitions.txt).
  #
  # THE NOUN. "Dwelling, quadplex" means "a building containing four
  # attached or detached dwelling units located on a single parcel or lot"
  # (L215-L216), and "Dwelling, middle housing" means "a duplex, triplex,
  # quadplex, townhouse, or cottage cluster" (L191-L192). The pod is a
  # quadplex and so middle housing. "Dwelling, multi-unit" starts at "five
  # or more dwelling units on a single lot or parcel" (L209-L210), so a
  # prohibition of multi-unit dwellings (R-10 18.25.040 (B)) does not reach
  # the pod. A townhouse is "two or more dwelling units, separated by common
  # walls on the property lines" (L218-L219): the unit-lot path. "Multi-family"
  # is not defined; A-2 uses it beside "single-family" for the side yards
  # and the density floor. The draft read the pod, which is not
  # single-family, as multi-family there. Steph, 2026-10-01: the fourplex
  # is NOT multi-family in Cornelius, so A-2 holds the figures that are not
  # the multi-family ones. CR's density floor does not use the word ("all
  # other dwelling types", 18.70.050 (B)(1)) and is not moved by the ruling.
  #
  # FRONT LOT LINE. Defined only "for purposes of the solar access
  # regulations": "For corner lots, the front lot line is that with the
  # narrowest frontage" (L291-L292). The zone chapters speak of "the front"
  # and of "the side yard facing the street" on a corner lot without naming
  # either line. Held as front_lot_line_corner: shortest under defaults, the
  # one rule the code prints. Steph, 2026-10-01: keep it.
  #
  # STREET. "every way which provides for public use for the purpose of
  # vehicular and pedestrian traffic" (L705-L706). "Street side lot line" is
  # "a lot line which abuts a public street, alley or way" (L708-L709). See
  # private_drives below.
  #
  # SETBACK. Measured from "the lot line following any required dedication"
  # (L645-L646). Dedication takes ground nothing measures; recorded, not
  # encoded, as in the other Washington layers.
  #
  # HEIGHT. To "the point midway between the ridge and the eaves of a pitch
  # or hip roof" (L323-L324).
  #
  # LOT COVERAGE. Buildings "including covered parking areas" (L139-L140).
  #
  # NET ACRE. "Acre, gross" is 43,560 square feet (L35-L36); "Acreage, net"
  # takes out street dedications, private streets and common driveways,
  # environmentally constrained lands and land set aside in tracts
  # (L41-L54). R-10 and CR measure their density floors on this acreage
  # (CR says so: 18.70.050, "as defined in Chapter 18.195"). R-7 and A-2 do
  # not: each defines its own net acre in its own section -- "A net acre is
  # equal to 32,670 square feet, and excludes roads, common open space,
  # floodplains, riparian setbacks, and slopes over 25 percent" (18.20.050
  # (A), 18.35.050) -- which is three quarters of a gross acre and a
  # different subtraction list. Each zone cites its own sentence.
  #
  # PARKING SPACE. "a rectangle not less than 20 feet long and eight and
  # one-half feet wide" (L520-L521). 18.145.050 (A) prints nine by 20
  # "Except as otherwise defined in this code". See the stall below.
  corner_lot:
    # "a lot abutting on two intersecting streets other than an alley;
    # provided, that the streets do not intersect at an angle greater than
    # 135 degrees." The alley exception is the default alleys_count: false;
    # a street is a way for public use, so a private drive does not make a
    # corner (drives_count stays false).
    test: intersecting_frontages
    max_intersection_angle_deg: 135.0
    quote: "or/washington/cornelius/cmc.18.195.definitions.txt#L417-L418"
    cite: "Cornelius CMC 18.195.120, Lot, corner"

# Whether a private road or drive the lot abuts is a street here (FOLLOWUPS
# 17(b); Steph's rule of 2026-09-30: a private road is a way in for the
# parking everywhere, and governs the yards only where the city's code
# makes it a street).
private_drives:
  street: false
  quote: "or/washington/cornelius/cmc.18.195.definitions.txt#L705-L706"
  says: "which provides for public use"
  cite: "Cornelius CMC 18.195 (Street; Street side lot line; Lot, corner; Access; Road) and 18.150.070 (B)"
  note: >-
    "Street" means "the entire width between the boundary lines of every way
    which provides for public use" (L705-L706), and a street side lot line
    abuts "a public street, alley or way" (L708-L709). A private access is
    "an access not in public ownership or control by means of deed,
    dedication or easement" (L26-L27): not for public use, so not a street.
    "Road" does reach "a public or private way" (L629-L630), but no yard
    rule is measured from a road. Where the code wants a private way treated
    as a street it says so, and only for one section: "A private access
    shall be treated as a public street for the purpose of this section"
    (18.150.070 (B), cmc.18.150.special-use.txt L215), the clear vision
    zone, which is not encoded.

defaults:
  # PARKING COUNT. 18.145.030 (A), Table: "Middle Housing 1.0/DU none none",
  # the minimum and the Zone A and Zone B maximums (cmc.18.145.parking.txt
  # L111-L135). The table applies "regardless of the parking zone in which
  # the use is located" (L99). One stall per unit; the state layer caps the
  # total for a quadplex below four on lots under 7,000 square feet, and no
  # zone here admits the pod below 7,000.
  parking_min_per_unit:
    value: 1
    cite: Cornelius CMC 18.145.030 (A) Table, Middle Housing (1.0/DU minimum)
    url: https://ecode360.com/print/CO4396?guid=47339373
    retrieved: '2026-09-30'
    quote: "or/washington/cornelius/cmc.18.145.parking.txt#L111-L112,L131-L132"
  parking_max_per_unit:
    exempt: true
    cite: Cornelius CMC 18.145.030 (A) Table, Middle Housing (maximum none in Zone A and Zone B)
    url: https://ecode360.com/print/CO4396?guid=47339373
    retrieved: '2026-09-30'
    quote: "or/washington/cornelius/cmc.18.145.parking.txt#L113-L114,L118-L119,L131,L133-L134"
  # THE STALL. 18.145.050 (A): "Except as otherwise defined in this code,
  # 'one standard parking space' means a minimum of a parking stall of nine
  # feet in width and 20 feet in length" (L501). 18.195 defines "Parking
  # space" as "not less than 20 feet long and eight and one-half feet wide"
  # (definitions L520-L521). Read literally, the exception hands the width
  # to the definition and the stall is 8.5; read as the parking chapter's
  # own standard, it is 9. The code does not say which governs. Held at 9,
  # the stricter; Steph, 2026-10-01: keep 9. The length is 20 on both
  # readings.
  #
  # NOT ENCODED: the compact stalls of the same sentence, "up to 25 percent
  # of the available parking spaces may have a minimum dimension of eight
  # feet in width and 16 feet in length" -- for four stalls, one. An
  # allowance; the standard stall is held, as in the other layers.
  #
  # NOT ENCODED: an aisle. 18.145.050 (E): "Parking space configuration,
  # stall and access aisles shall be of sufficient width for all vehicles
  # turning and maneuvering" (L517). No figure anywhere in the chapter; the
  # site plan draws its assumed aisle and marks the lot geometry_assumed.
  # 050 (B), (F) and (G) -- service drives, striping and street-standard
  # paving -- each except "middle housing residences" (L505, L521, L525).
  parking_stall_width_ft:
    value: 9
    cite: Cornelius CMC 18.145.050 (A), one standard parking space (nine feet in width; 18.195 Parking space prints eight and one-half, read the stricter way)
    url: https://ecode360.com/print/CO4396?guid=47339373
    retrieved: '2026-09-30'
    quote: "or/washington/cornelius/cmc.18.145.parking.txt#L501"
  parking_stall_depth_ft:
    value: 20
    cite: Cornelius CMC 18.145.050 (A), one standard parking space (20 feet in length)
    url: https://ecode360.com/print/CO4396?guid=47339373
    retrieved: '2026-09-30'
    quote: "or/washington/cornelius/cmc.18.145.parking.txt#L501"
  # WHICH STREET IS THE FRONT on a corner lot. The only rule the code prints
  # is the solar-access definition's, "the front lot line is that with the
  # narrowest frontage" (see the definitions comment). Held as shortest;
  # Steph, 2026-10-01: keep it. The yards themselves only name "the front"
  # and "the side yard facing the street", one of each, so the corner lot
  # has one front.
  front_lot_line_corner:
    value: shortest
    cite: Cornelius CMC 18.195.060, Front lot line (corner lots, the narrowest frontage; stated for the solar access regulations, read for the yards the stricter way)
    url: https://ecode360.com/print/CO4396?guid=47339847
    retrieved: '2026-09-30'
    quote: "or/washington/cornelius/cmc.18.195.definitions.txt#L291-L292"
  # NOT ENCODED: front_lot_line_through. A through lot is "a lot other than a
  # corner lot with frontage on more than one street" (definitions
  # L757-L758), and nothing says which frontage is the front. Left unread,
  # and so screened at the worst end.
  #
  # WHICH STREET THE DRIVEWAY USES. The same sentence in all four residential
  # zones: "Access to individual lots shall be primarily from local streets
  # or alleyways ... Direct lot access to arterials or collector streets
  # shall not be permitted, unless there is no alternative as determined by
  # the city engineer" (R-7 18.20.060 (B)(1), L256; R-10 18.25.060 (B)(1)
  # L231; A-2 18.35.060 (D)(1) L294; CR 18.70.060 (B)(1) L296), and
  # 18.143.050 (C)(5): "Direct access to a collector street shall only be
  # considered if there is no alternative way to access the site"
  # (cmc.18.143.transportation.txt L179). The lowest class first.
