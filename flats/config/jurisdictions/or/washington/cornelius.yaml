# THE MAP'S OTHER CODES. Metro's regional zoning layer (CITY 'Cornelius'),
# counted 2026-09-30: R7 2,126 polygons, A2 1,259, CR 147, C2 87, CMU 70, M1
# 62, MHP 45, CC 20, GMU 18, LI 5, FD-20 3, AF-5 1, FD-10 1. The city's
# Zoning Map (April 2025) labels the same districts with their hyphens and
# adds R-10 on one parcel Metro's layer does not carry.
#
# THE COUNTY CODES. FD-20, FD-10 and AF-5 are Washington County districts on
# four small polygons (about 1.2, 0.9 and 0.8 acres). A lot reaches this
# layer only through JURIS_CITY CORNELIUS, so a lot under one of them is in
# the city on the taxlots while the map still paints a county district.
# Nothing in the code keeps county zoning after annexation: an annexation
# petition states "The existing county zoning for the territory, and the
# proposed city zoning for the territory" (16.10.030, cmc.16.annexation.txt
# L67), and the city zones it on approval, consistent with its plan
# (16.10.040 (F), L101). So the county district does not govern and the
# city district is not printed. Unencodable, as in Sherwood.
zone_rulings:
  R7:
    outcome: alias
    of: R-7
    note: >-
      "R7", 2,126 polygons on Metro's zoning layer (CITY 'Cornelius') on
      2026-09-30. The map's spelling of R-7, Urban Low Density, in the
      18.05.030 district list (cmc.18.05.general.txt L54) and on the city's
      2025 map. One district, two spellings; the block is R-7.
  A2:
    outcome: alias
    of: A-2
    note: >-
      "A2", 1,259 polygons on Metro's zoning layer (CITY 'Cornelius') on
      2026-09-30. The map's spelling of A-2, Urban Medium Density, in the
      18.05.030 district list (cmc.18.05.general.txt L55) and on the city's
      2025 map. The block is A-2.
  C2:
    outcome: alias
    of: C-2
    note: >-
      "C2", 87 polygons on Metro's zoning layer (CITY 'Cornelius') on
      2026-09-30. The map's spelling of C-2, Highway Commercial, in the
      18.05.030 district list (cmc.18.05.general.txt L63). The block is C-2.
  M1:
    outcome: alias
    of: M-1
    note: >-
      "M1", 62 polygons on Metro's zoning layer (CITY 'Cornelius') on
      2026-09-30. The map's spelling of M-1, General Industrial, in the
      18.05.030 district list (cmc.18.05.general.txt L66). The block is M-1.
  FD-20:
    outcome: unencodable
    note: >-
      Washington County's Future Development 20-acre district, three
      polygons of about 1.2 acres on Metro's zoning layer under CITY
      'Cornelius' on 2026-09-30. Not a Cornelius district (18.05.030,
      cmc.18.05.general.txt L49-L70). The code keeps no county zoning after
      annexation (16.10.030 and 16.10.040 (F), cmc.16.annexation.txt L67,
      L101); the city district the land takes is not printed on Metro's
      layer. See the comment above zone_rulings.
  FD-10:
    outcome: unencodable
    note: >-
      Washington County's Future Development 10-acre district, one polygon
      of about 0.9 acres on Metro's zoning layer under CITY 'Cornelius' on
      2026-09-30. Not a Cornelius district (cmc.18.05.general.txt L49-L70);
      unencodable for the reason given for FD-20.
  AF-5:
    outcome: unencodable
    note: >-
      Washington County's Agriculture and Forest 5-acre district, one polygon
      of about 0.8 acres on Metro's zoning layer under CITY 'Cornelius' on
      2026-09-30. Not a Cornelius district (cmc.18.05.general.txt L49-L70);
      unencodable for the reason given for FD-20.
