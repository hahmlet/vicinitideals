label: Cornelius
kind: city
eligible: true
notes: >-
  DRAFT, 2026-09-30. Read from the Cornelius Municipal Code, Title 18
  (Zoning), Title 16 (Annexation) and Title 17 (Subdivisions), as eCode360
  publishes it (client CO4396), printed chapter by chapter. Every value is
  draft. Lots reach this layer by the taxlots' JURIS_CITY CORNELIUS. Their
  zoning comes from Metro's regional zoning layer (CITY 'Cornelius'), which
  spells four districts without the hyphen (R7, A2, C2, M1), carries three
  Washington County codes on four small slivers (FD-20, FD-10, AF-5) and has
  no R-10; the city's own Zoning Map (April 2025, DocumentCenter View/1542)
  paints R-10 on one small parcel at the east end and otherwise agrees on
  the districts. Four districts admit the pod: R-7, R-10, A-2 and CR. Two
  density rules are printed per a "net acre" of 32,670 square feet (R-7
  and A-2) and are carried with acre_sqft; A-2's rear yard grows per story
  and is carried with plus_per_story_ft. Steph, 2026-10-01: the fourplex is
  not multi-family here, and required parking stays out of every required
  yard (parking_required_yard_prohibited). Further rulings the same day:
  the stall stays 9 ft; CC stays refused away from Adair and Baseline; the
  corner front is the narrower street side; every R-7 and R-10 lot is held
  for a closer look on the solar balance point (18.160); GMU opens only to
  townhouses, behind an untraced subdistrict figure; and the pod has no
  covered parking, which fails the townhouse path wherever the code asks
  for it (parking_covered_required; the state spares the quadplex).
ingest:
  geoid: null
  juris_city_codes:
  - CORNELIUS
