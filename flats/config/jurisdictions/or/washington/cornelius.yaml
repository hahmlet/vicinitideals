  # ------------------------------------------------------------------
  # GMU, Gateway Mixed Use, 18.75. Steph, 2026-10-01: four homes on one lot
  # stays NO -- the fourplex is not multi-family, and 18.75.020 permits
  # "Multi-family dwelling units" and "Single-family attached dwelling
  # units" (L55, L59) and no middle housing; 18.75.040 admits "Only uses
  # specifically listed ... and uses similar to these" (L135). The
  # TOWNHOUSE path is open: "Single-family attached dwelling units, subject
  # to CMC § 18.75.065" (L59), on lots of their own (065 (H), L563).
  #
  # Held behind a fact nothing measures (`inside_mapped_use_area`), so it is
  # never GREEN. 065 (B): "Single-family attached residential uses
  # (townhouses) shall only be permitted within subdistrict A" (L475), and
  # the subdistricts are drawn on Figure 18.75.065-1 (L471), an image no map
  # layer carries; subdistrict C has no ground-floor residential at all
  # (L469). The figure is to be traced later, as Tigard's maps are
  # (handoff section 8). Detached single-family is prohibited (L163), so
  # OAR 660-046 does not reach this zone and nothing state-side helps.
  #
  # 065 governs "In lieu of compliance with CMC § 18.75.050, § 18.75.060
  # and § 18.75.070" for ground-floor residential (L453), so the standards
  # below are 065's, not the commercial ones.
  #
  # - LOT. "Single-family attached dwellings on individual lots": 2,000 sq
  #   ft, 20 wide (L567, L571), per child lot (`unit_lots` variants); four
  #   of them side by side is 8,000 and 80 ft. The one-lot defaults are the
  #   zone's general "No minimum lot size" (050 (A), L199) and are moot:
  #   the one-lot path is refused on the use row.
  # - DENSITY. "Minimum density for ground-floor residential uses is 18
  #   units per net acre. There is no maximum density" (L479). GMU prints no
  #   net acre of its own, so it is 18.195's: net acreage on the 43,560 sq ft
  #   acre ("Acre, gross", definitions L35-L36, L41-L54), not R-7's and A-2's
  #   32,670. Four homes at 18 an acre may spread over no more than
  #   4 / 18 x 43,560 = 9,680 net sq ft.
  # - HEIGHT 35 (L575). FRONT 5, garages and carports 20 (L579). REAR 10
  #   (L583). SIDE 5, none where the structures are attached (L587).
  # - LANDSCAPING. "A minimum of 15 percent of each lot ... landscaped and
  #   maintained free of buildings, pavement" (065 (E), L487).
  # - DRIVES. Internal roadways and drives 24 two-way, 15 one-way (065
  #   (I)(3), L603-L611), as in A-2 and CR; driveways "not more than 25 feet
  #   in width at the curb" (065 (J)(2), L631).
  # - COVERED PARKING. "One covered parking space shall be provided for each
  #   dwelling unit either on the individual lot or in an off-street parking
  #   bay within 100 feet from the lot being served" (065 (N)(1)(a), L671).
  #   The pod has none (Steph, 2026-10-01), and nothing state-side cancels
  #   it here: True on both paths, so the townhouse path fails on it.
  #
  # OWED, with the reason:
  # - THE 50 PERCENT CAP. "In subdistrict A, up to 50 percent of a lot or
  #   multiple lots if developed concurrently may be developed as
  #   single-family attached residential uses, including parking,
  #   infrastructure, and open space to serve those uses" (L475). No field
  #   holds a share of the lot one use may occupy, and whether the other
  #   half must be developed at all the sentence does not say. Behind the
  #   unmeasured subdistrict it moves nothing today; once the figure is
  #   traced it is the next standard to encode.
  # - STREET SIDE YARD. (H) states "side yards" and no street side, which
  #   18.195 defines as a yard of its own (definitions L711-L712). Unread.
  # - LOT DEPTH and COVERAGE. (H) states neither; not claimed exempt,
  #   because 065 is "in lieu of" the chapter that would otherwise say.
  # - THE CORNER FRONT. 050 (B) names the higher-classified street the
  #   front (L203), but 065 replaces 050; the layer's narrowest-frontage
  #   reading is held.
