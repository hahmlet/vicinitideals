  # ------------------------------------------------------------------
  # A-2, Multi-Unit Residential, 18.35. 18.35.020 (B) "Middle housing
  # developments" permitted outright (L23, L31). 18.35.040 (H) prohibits
  # "More than one single-family detached or common-wall single-family
  # dwelling unit on a single lot or parcel" (L147): not a quadplex. 18.35.060
  # sends "All multi-family developments" to design review under 18.100
  # (L246), and 18.100.030 (A)(2) makes a middle housing site plan Type I.
  #
  # - NET ACRE. "Lot area and density requirements shall be calculated based
  #   on net acreage. A net acre is equal to 32,670 square feet" (L153), the
  #   preamble to the whole section.
  # - DENSITY. Maximum: "This maximum density does not apply to middle
  #   housing"; townhouses 25 per net acre (L157). Minimum "eight dwellings
  #   per net acre for single-family, and 11 for multi-family development"
  #   (L176). The fourplex is not multi-family (Steph, 2026-10-01), so 8, on
  #   the 32,670 acre: no more than 16,335 net square feet for four units.
  #   The draft held 11 (11,880 sq ft). The townhouse maximum is held at 25
  #   as printed, a quarter strict, for the reason given in R-7.
  # - LOT SIZE. Quadplex 7,000, townhouse 1,500 (L161-L167).
  # - HEIGHT 45 (L180).
  # - FRONT 10, garages and carports 20 (L200).
  # - REAR "No rear yard shall be less than 10 feet in depth for a
  #   single-story structure, plus five feet per additional story" (L204):
  #   every structure, not only multi-family, so plus_per_story_ft, 15 for
  #   the two-story pod. SIDE: "For single-family residences ... not less
  #   than five feet", and "For multi-family residences ... five feet in
  #   depth for a single story structure, plus five feet per additional
  #   story" (L208). The fourplex is not multi-family (Steph, 2026-10-01),
  #   so 5; the draft held the multi-family 10. Street side 10 on a corner
  #   (L208). No zero-side rule is printed for a townhouse here, so a
  #   townhouse plat keeps the 5.
  # - LOT DIMENSIONS. "No ... quadplex ... lot shall be less than 30 feet in
  #   width abutting a public street, nor less than 60 feet in depth" (L232);
  #   townhouse lots 20 abutting a public street and 60 deep (L240). The
  #   width is measured where the lot abuts a public street, which is
  #   frontage: min_frontage_ft.
  # - DRIVES. 18.35.060 (D)(3): "All internal roadways and drives ... shall
  #   have the following minimum unobstructed pavement width: (a) Two-way
  #   traffic: 24 feet; (b) One-way traffic: 15 feet" (L302-L310). The pod's
  #   drive to its court is an internal drive; held over (E)(2)'s 12 feet
  #   for every driveway (L330), the stricter. Not more than 25 feet at the
  #   curb (L330).
  # - NOT ENCODED: building separation, "within a complex" (L212), one
  #   building; the five-foot landscaped buffer "at the perimeter of all
  #   parking lot areas" (L394), a parking setback from every line no field
  #   holds (see the layer-wide refusals); screening of parking lots abutting
  #   low density residential development (L362, L414), a fence.
  # ------------------------------------------------------------------
