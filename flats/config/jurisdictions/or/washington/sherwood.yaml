  allow_thin: true
- id: "ord.2022-004.16.14.030"
  url: https://www.sherwoodoregon.gov/wp-content/uploads/2025/03/ordinance-2022-004-amending-code-housing-choices.pdf
  title: "Ordinance 2022-004 Exhibit 1 - SZCDC 16.14.030 Additional Triplex and Quadplex Design Standards"
  start: "16.14.030 - Additional Triplex and Quadplex Design Standards"
