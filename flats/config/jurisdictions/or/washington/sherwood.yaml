definitions:
  # Read 2026-09-29 from SZCDC 16.10.020, which is on disk whole
  # (sdc.16.10.definitions.txt runs from 16.10.010 to the Chapter 16.12
  # heading).
  #
  # THE NOUN. "Quadplex: Four (4) attached dwelling units, in any
  # configuration, located on a single lot or parcel" (L221-L222). The pod
  # is a Quadplex. A Multi-Family dwelling starts at "five (5) or more
  # dwelling units" (L206-L209), and a Townhome is a unit "located on an
  # individual lot or parcel" (L210-L212), the unit-lot path. Middle Housing
  # names quadplexes (L568-L569).
  #
  # FRONT LOT LINE. "The line separating a lot from any street, provided
  # that for corner lots, there shall be as many front lines as there are
  # street frontages" (L505-L506). Encoded as front_lot_line_corner: both
  # under defaults. The residential table still prints a "Corner lot street
  # side" setback, 15 feet in MDRL, MDRH and HDR against a 14-foot front
  # yard; both are held, and the envelope gives a corner lot's street lines
  # the stricter of the two. A street includes an alley ("Categories of
  # streets include: A. Alley", L885-L888), so by these words an alley line
  # is a front line as well. NOT ENCODED, as in Hillsboro: the envelope
  # reads an alley line as a rear or side line. A doubt.
  #
  # REAR LOT LINE. The line "opposite and most distant from the front lot
  # line"; on an irregular lot a ten-foot line inside the lot; "On a corner
  # lot, the shortest lot line abutting adjacent property that is not a
  # street" (L507-L510). The residential table's footnote sends irregular
  # lots here (sdc.16.12.residential.txt#L441-L442). The envelope's own rear.
  #
  # DENSITY. "the number of dwelling units per net buildable acre", net of
  # "present and future rights-of-way and environmentally constrained areas"
  # (L154-L156; Net Buildable Acre, L583-L589). No density figure reaches
  # the pod: 16.12.010 F sets middle housing apart (see the zones).
  #
  # HEIGHT. Measured to the highest point of a flat roof, the deck line of a
  # mansard roof, or the average height of the highest gable of a pitched
  # roof (L77-L81). Story and Half Story at L873-L884.
  corner_lot:
    # "A lot situated at the intersection of two or more streets, other than
    # an alley." A street is "A public or private road, easement or
    # right-of-way that is created to provide access to one (1) or more
    # lots" (L885-L886), so a private drive counts; the alley is excluded by
    # the definition's own words, which is the default alleys_count: false.
    test: intersecting_frontages
    drives_count: true
    quote: "or/washington/sherwood/sdc.16.10.definitions.txt#L488,L885-L886"
    cite: "Sherwood SZCDC 16.10.020, Lot, Corner; Street"

defaults:
  # PARKING COUNT. Table 1 of 16.94.020 counts a quadplex's stalls by lot
  # area: "1 space total" under 3,000 square feet, 2 under 5,000, 3 under
  # 7,000 and "4 spaces total" at 7,000 or more, with "None" as the maximum
  # in both Metro parking zones. Every zone below asks 7,000 square feet or
  # more of a quadplex lot, so a lot that can hold the pod is on the last
  # row: one stall a unit.
  #
  # NOT ENCODED: the Climate-Friendly and Equitable Communities relief in
  # 16.94.020 A. "Per OAR 660-012-0440 Parking Reform Near Transit Corridors
  # no off-street parking is required for developments on a lot or parcel
  # that includes lands within one-half (1/2) mile of a frequent transit
  # corridor", and per OAR 660-012-0435 none "within the Sherwood Town
  # Center and one-quarter mile of the area (see CFEC Parking Delineated
  # Area Map at the end of this section)" (sdc.16.94.parking.txt#L354-
  # L367). Table 1 is headed "for lots or parcels not within the CFEC
  # Parking Delineated Area" (L368-L370). No registered condition carries
  # either distance and the map is a figure, so the stricter figure is held
  # everywhere. The handoff proposes a condition.
  parking_min_per_unit:
    value: 1
    cite: Sherwood SZCDC 16.94.020 Table 1, Quadplex on a lot of 7,000 SF or more (4 spaces total)
    url: https://api.municode.com/PublicationPdfDownload/3865
    retrieved: '2026-09-29'
    quote: "or/washington/sherwood/sdc.16.94.parking.txt#L368-L370,L375-L398,L490,L502-L525,L560-L571"
  parking_max_per_unit:
    exempt: true
    cite: Sherwood SZCDC 16.94.020 Table 1, Quadplex maximum permitted parking (None in Zone A and Zone B)
    url: https://api.municode.com/PublicationPdfDownload/3865
    retrieved: '2026-09-29'
    quote: "or/washington/sherwood/sdc.16.94.parking.txt#L368-L370,L490,L502-L525,L560-L571"
  # DRIVEWAY APPROACH. 16.14.030 A: "Each individual driveway approach must
  # not exceed 12 feet in width per dwelling served by the driveway" (A.1);
  # shared driveways, "a single driveway serving two units", are required
  # unless access comes from a public alley, and "A shared driveway approach
  # must not exceed 20 feet in width unless a minimum of 20 feet of spacing
  # can be achieved between driveways" (A.3). Four units take two shared
  # driveways, and 20 is the width that holds without the spacing, which
  # nothing measures. 16.96.050 A.4 sends a quadplex's on-site vehicle
  # circulation to the same section (sdc.16.96.circulation.txt#L162,L180).
  # The Municode PDF prints A.1 and A.2 and drops the rest with page
  # 296.18.1 (sdc.16.14.residential-design.txt#L443-L448); the ordinance
  # prints all of it.
  #
  # NOT ENCODED: A.2, "Total width of all driveways shall not exceed 50
  # percent of the street frontage". A driveway share of frontage, which is
  # not parking_area_max_frontage_pct (garages, parking and maneuvering
  # area); no field holds it. Two 20-foot approaches on the 25-foot minimum
  # frontage are over it, and one shared 20-foot approach needs 40 feet of
  # frontage. The handoff proposes a field.
  #
  # NOT ENCODED: A.4, "applicable driveway spacing standards for local
  # streets", and A.5.b, the collector and arterial access standards. Both
  # turn on the street's class and the neighbours' driveways.
  driveway_approach_max_width_ft:
    value: 20
    cite: Sherwood SZCDC 16.14.030 A.3, shared driveway approach no wider than 20 feet (Ordinance 2022-004 Exhibit 1)
    url: https://www.sherwoodoregon.gov/wp-content/uploads/2025/03/ordinance-2022-004-amending-code-housing-choices.pdf
    retrieved: '2026-09-29'
    quote: "or/washington/sherwood/ord.2022-004.16.14.030.txt#L1-L11"
  # CORNER ACCESS AND THE ALLEY. A.5: "lots or parcels with more than one
  # frontage must comply with the following: a. Lots or parcels must access
  # the street with the lowest classification. For lots or parcels abutting
  # an alley, access must be taken from the alley." An alley is a street in
  # this code (16.10.020 Street, A), so an alley-backed lot is a lot with
  # more than one frontage, and A.3 already excuses the shared driveway
  # where "access is obtained from a public alley".
  corner_access_street:
    value: lowest_class
    cite: Sherwood SZCDC 16.14.030 A.5.a, access from the street with the lowest classification (Ordinance 2022-004 Exhibit 1)
    url: https://www.sherwoodoregon.gov/wp-content/uploads/2025/03/ordinance-2022-004-amending-code-housing-choices.pdf
    retrieved: '2026-09-29'
    quote: "or/washington/sherwood/ord.2022-004.16.14.030.txt#L1-L3,L13-L16"
  parking_alley_access_required:
    value: true
    cite: Sherwood SZCDC 16.14.030 A.5.a, access must be taken from an abutting alley (Ordinance 2022-004 Exhibit 1)
    url: https://www.sherwoodoregon.gov/wp-content/uploads/2025/03/ordinance-2022-004-amending-code-housing-choices.pdf
    retrieved: '2026-09-29'
    quote: "or/washington/sherwood/ord.2022-004.16.14.030.txt#L1-L3,L7-L8,L13-L16"
  # FRONT-YARD PARKING. 16.14.010 F: "Off-street parking is not allowed
  # within the front yard of a dwelling except within a designated driveway
  # or garage or per the provisions of 16.14.020 and 16.14.030", and a front
  # yard runs "between the front lot line and the nearest line or point of
  # the building" (16.10.020 Yard, A; sdc.16.10.definitions.txt#L1051-
  # L1052), which is the whole ground in front of the building, not the
  # setback. 16.14.030 grants no front-yard parking of its own. 16.14.010
  # applies "to all new residential development" (C.1), and the guideline
  # printed beside the standard is the discretionary Type IV design review
  # (B.3), not a right.
  parking_front_prohibited:
    value: true
    cite: Sherwood SZCDC 16.14.010 F, Limitation on parking (front yard per 16.10.020 Yard, A)
    url: https://api.municode.com/PublicationPdfDownload/3865
    retrieved: '2026-09-29'
    quote: "or/washington/sherwood/sdc.16.14.residential-design.txt#L9-L11,L33-L35,L285-L288"
  front_lot_line_corner:
    value: both
    cite: Sherwood SZCDC 16.10.020, Lot Line, Front (as many front lines as there are street frontages)
    url: https://api.municode.com/PublicationPdfDownload/3865
    retrieved: '2026-09-29'
    quote: "or/washington/sherwood/sdc.16.10.definitions.txt#L505-L506"

# THE LAYER-WIDE REFUSALS, one per standard, read 2026-09-29. Each applies
# in every zone below unless the zone says otherwise.
#
# NOT ENCODED: Sufficient Infrastructure. 16.12.030 B.3: before a building
# permit for "any new middle housing structure", the applicant "must submit
# a request for verification of Sufficient lnfrastructure ... and receive
# approval from the City Engineer or designee" (ord.2022-004.16.12.030.txt
# #L15-L18, the ordinance's OCR). 16.10.020 defines it as public sewer,
# public water, street access meeting emergency vehicle standards, and storm
# drainage (sdc.16.10.definitions.txt#L978-L988). As in the county layer,
# the applicant may provide it; not a use gate. A doubt for lots far from a
# main.
#
# NOT ENCODED: 16.14.010 B.2, "The width of all garages on the
# street-facing elevation shall not exceed 60 percent of the total width of
# that elevation" (sdc.16.14.residential-design.txt#L110-L125). A share of
# the building's own elevation, not of the lot's frontage; no field holds
# it, and the pod parks in a rear court. The rest of Table 16.14-1
# (windows, entrances, detailed design) is design, not placement.
#
# NOT ENCODED: note 2 of the residential table, "Minimum lot width at the
# building line on cul-de-sac lots may be less than that required in this
# Code if a lesser width is necessary to provide for a minimum rear yard"
# (sdc.16.12.residential.txt#L446-L447). It states no figure; the table's
# width is held on every lot.
#
# NOT ENCODED: 16.58.010, the clear vision area: 20 feet along each street
# line from a corner, and "the minimum distance from corner curb to any
# driveway shall be twenty-five (25) feet" (sdc.16.58.vision-clearance.txt
# #L5-L24). The triangle's hypotenuse runs from 20 feet up one line to 20
# up the other, and the smallest pair of street yards below (14 and 15)
# puts the building corner 29 feet out along that diagonal, so the triangle
# never reaches the pod. The 25-foot driveway spacing places the curb cut,
# which nothing draws.
#
# NOT ENCODED: 16.68.020 and 16.68.050, the infill relaxations of lot area,
# lot dimensions and yards to 85 percent of the zone's standard, and of the
# front yard by up to six feet. Each is an Approval Authority's finding on
# a land division, not a right (sdc.16.68.infill.txt#L19-L39,L133-L162).
#
# THE INFILL BUILDING STANDARDS ARE HELD, the stricter reading. 16.68.030:
# "Structures exceeding twenty four (24) feet in height shall conform to
# the following standards" -- a floor area ratio by zone (A: LDR 50%, MDRL
# 55%, MDRH 60%, HDR 65% of lot area) and an interior side setback plane (B:
# five feet, plus half a foot for every foot over 24) (sdc.16.68.infill.txt
# #L74-L85,L89-L95). The section is headed "Building Design on Infill Lots"
# and 16.68.020 A.5 names it for lots under the zone's minimum area, which
# reads narrower; but its first sentence names every structure over 24
# feet, and the residential table sends multi-family side yards over 24
# feet to "§ 16.68 Infill" in MDRH and HDR with no infill test
# (sdc.16.12.residential.txt#L273-L286). The pod is 26 feet. Held as
# max_far in LDR, MDRL, MDRH and HDR and as a step-back on the interior
# side setback in every residential zone. At the 7,000-square-foot minimum
# lot the ratio allows 3,500 square feet of floor in LDR and 3,850 in MDRL.
# A doubt and a question for Steph. NOT ENCODED from the same section:
# B.2's 750-square-foot side elevation planes and C's garage orientation on
# lots 60 feet wide or less, which are design.
#
# NOT ENCODED: 16.106 right-of-way dedication and street improvements on
# frontage (sdc.16.106.transportation.txt). They push the building back by
# a width the TSP sets per street, which nothing measures; the same kind of
# rule as in the county layer. A doubt.
#
# NOT ENCODED: 16.50 projections into yards. Note 5 of the residential
# table refuses front-yard reductions for architectural features in MDRL,
# MDRH and HDR (sdc.16.12.residential.txt#L452-L453), and nothing here
# reads a projection allowance in any zone.
zones:
  # ------------------------------------------------------------------
  # CHAPTER 16.12, the five residential districts and the VLDR-PUD column.
  # 16.12.020 A prints "Triplex and Quadplex P" in every one (the use table
  # has no VLDR-PUD column; the VLDR row governs it). The dimensional table
  # of 16.12.030 C runs over four printed pages; the Municode PDF drops the
  # first two (296.1 and 296.2), so its lot-area rows print without their
  # heading. Ordinance 2022-004 prints that heading, "Minimum lot areas",
  # over the same figures (ord.2022-004.16.12.030-c.txt), and the lot area
  # values quote it; the column order is the Municode reprint's header,
  # "VLDR VLDR-PUD LDR MDRL MDRH HDR" (sdc.16.12.residential.txt#L132-
  # L135). In the setback rows a leading digit is a note marker, not a
  # column: "5 30 20 20 14 14 14" is note 5 and six front yards.
  #
  # Height is "30 feet or 2 stories" and note 3 reads "Maximum height is the
  # lesser of feet or stories", so both are held. MDRH's "35 feet or 2.5
  # stories" holds the feet only: max_height_stories takes whole numbers,
  # and the pod is two stories (the Hillsboro and Fairview precedent).
  #
  # DENSITY. Each district's range is stated "except middle housing types
  # pursuant to 16.12.010.F", and F.1 reads "Maximum density standards
  # shall not be applied to duplex, triplex, quadplex or cottage cluster
  # development"; F sets a minimum for cottage clusters only. Both density
  # fields are exempt.
  # ------------------------------------------------------------------
