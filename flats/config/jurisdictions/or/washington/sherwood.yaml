label: Sherwood
kind: city
eligible: true
notes: >-
  DRAFT, cloud session 2026-09-29. Read from the Sherwood Zoning and
  Community Development Code (Municipal Code Title 16) as Municode publishes
  it, publication 3865, Supplement No. 24 (updated 2026-05-05, through
  Ordinance 2026-001). The Municode PDF leaves out printed pages 296.1-296.2
  and 296.18.1-296.18.10; the text they carry (16.12.030 A and B, and the
  rest of 16.14.030 A) is read from Ordinance 2022-004, Exhibit 1, the
  ordinance that adopted it, as the city publishes it. Every value is
  draft. The zone keys are the codes of the city's own zoning layer
  (services5.arcgis.com/ikEzR7lqVIlrcVFn Planning FeatureServer layer 2,
  field CODE); lots reach this layer by the taxlots' JURIS_CITY SHERWOOD.
  The map's codes that are not districts of 16.04.010 -- Old Town, OS, UGA,
  Unannex and the county and neighbouring-city codes on unannexed land --
  are ruled under zone_rulings at the end of the file.
ingest:
  geoid: null
  juris_city_codes:
  - SHERWOOD
# The unfetched references the crossrefs ledger ranked BINDING on
# 2026-09-29, each read where it is printed. None is on the pod's path in a
# way that moves a figure the layer holds; the floodplain chapter is the
# one that can take ground from a lot, and it only narrows.
crossrefs:
  "16.46":
    outcome: other_building
    note: >-
      Manufactured Home Parks. The 16.12.020 use table prints "Manufactured
      Home Park-subject to Chapter 16.46" (sdc.16.12.residential.txt
      L120-L122), and 16.14 names the chapter for manufactured homes
      (sdc.16.14.residential-design.txt L37). A park of manufactured homes
      is not a factory-built quadplex on one lot; it ranked beside the
      height and lot rows only because the use table sits above them.
  "16.68.020A":
    note: >-
      In the store. "the development conforms to Section 16.68.020A, above"
      (sdc.16.68.infill.txt L63-L66) points at the same slice: 16.68.020 is
      printed at L19, and its A is the landscape plan an undersized infill
      lot owes before a building permit. The ledger did not match the
      letter to the heading. The reduction the sentence allows (16.68.020 B,
      lot dimensions below the zone's minimum through a land division) is a
      relief the layer does not take, a layer-wide NOT ENCODED comment.
  "46":
    outcome: preempted
    note: >-
      OAR 660 Division 46, the state's middle housing rule, named in the
      16.94.020 parking table: "ADU standards are per OAR Division 46"
      (sdc.16.94.parking.txt L371-L373). The rule is state law, which the
      ledger counts apart, and it caps what a city may require; the table's
      own quadplex row (1 space a unit, no maximum) is read in the layer and
      is no stricter than the state's cap on a lot this size.
  "2022106.13.2022":
    outcome: misread
    note: >-
      Not a reference: a file path in the page header of the scanned
      ordinance, "Sherwood City Council Electronic Packets 2022\06.13.2022
      WIP", printed on every page of Ordinance 2022-004 and read by OCR as
      a number (ord.2022-004.16.14.030.txt).
  "06.13.2022":
    outcome: misread
    note: >-
      Not a reference: the date in the file path of the scanned ordinance's
      page header ("Electronic Packets 2022\06.13.2022 WIP"), the council
      meeting of 13 June 2022, read as a section number.
  "16.134.020":
    outcome: narrows_only
    note: >-
      The floodplain standards of the Special Resource Zones. 16.12.050
      applies them to residential land (sdc.16.12.residential.txt L485-L486),
      and the VLDR density bonus asks for floodplains to be dedicated (L27).
      They reach only land inside the floodplain and can only take ground or
      permission away; the layer's density figures are exempt for middle
      housing anyway (16.12.010 F). The screen's hazard constraints are
      read from their own layers, not this code.
  "16.88":
    outcome: procedure
    note: >-
      Use Classifications and Interpretations. The use tables send a use
      the table does not list to a case-by-case determination under Chapter
      16.88 (sdc.16.22.commercial.txt L41-L56). It is a process with no
      figure in it; the refusals stand on the table's own rows, which
      permit multi-family housing in the commercial districts only above a
      ground floor non-residential use, and the conservative reading takes
      no interpretation the city has not made.
  "16.89":
    outcome: procedure
    note: >-
      The Residential Design Checklist, the review process an applicant may
      use instead of meeting a 16.14 design standard as written
      (sdc.16.14.residential-design.txt). The layer holds the standards as
      written (front-yard parking, the 20-foot approach); the checklist can
      only relax them case by case, so ignoring it cannot pass a lot the
      code would refuse.
  "16.89.020":
    outcome: procedure
    note: >-
      The checklist's own review criteria, "these standards per 16.14.010.C
      and 16.89.020.A through D" (sdc.16.14.residential-design.txt). The
      same discretionary path as Chapter 16.89: a relief an applicant can
      ask for, with no figure the screen would hold.
  "16.90":
    outcome: other_building
    note: >-
      Site Plan Review, named in 16.14 to exclude "Multi-Family Housing that
      is Subject to the Provisions of Chapter 16.90" from the residential
      design standards (sdc.16.14.residential-design.txt). Sherwood defines
      a quadplex apart from multi-family housing (16.10.020), so 16.14 is
      the pod's chapter and the exclusion is another building's.
  "16.82":
    outcome: procedure
    note: >-
      Conditional Uses, named in the definition of the term
      (sdc.16.10.definitions.txt L127-L128). The layer admits the pod only
      where a table prints P and refuses it where it prints C or N, so the
      conditional-use process is never the path taken.
  "16.90.020":
    outcome: other_building
    note: >-
      The commercial design review matrix of Site Plan Review, which the
      Light Industrial zone applies to hotels and motels
      (sdc.16.31.industrial.txt L326-L332). A hotel is not the pod, and LI
      refuses the pod.
  "16.22.080":
    outcome: misread
    note: >-
      Not a reference: the editor's note on Chapter 16.22's derivation,
      "Former Ch. 16.22, §§ 16.22.010-16.22.080, pertained to the Office
      Commercial district" (sdc.16.22.commercial.txt L62-L69). A repealed
      chapter's history.
  "16.31.100":
    outcome: misread
    note: >-
      Not a reference: the editor's note on the industrial chapter's
      derivation, "Former Ch. 16.31, §§ 16.31.010-16.31.100, pertained to
      the Employment Industrial district" (sdc.16.31.industrial.txt). A
      repealed chapter's history.
