# Map codes that are not districts of this code. The city's zoning layer
# (services5.arcgis.com/ikEzR7lqVIlrcVFn Planning FeatureServer layer 2,
# field CODE) was counted on 2026-09-29; acreages are the layer's own
# Shape__Area in square feet over 43,560. Eleven codes carry the layer's
# own DESCRIPTION "Unannexed Area-Inside UGB": land the city has planned
# and not annexed. 16.04.040 (sdc.16.04.districts.txt L50-L59) puts that
# land under the Urban Planning Area Agreement, not this code, and gives an
# annexed lot an interim city zone "consistent with the Official Plan and
# Zoning Map" -- which this map does not print. So a lot the county's
# JURIS_CITY field calls Sherwood and this map calls unannexed is either
# not in the city (the county's field and the city's map disagree) or in it
# under an interim zone nobody has drawn. Neither is a pocket of the county
# layer: unlike Beaverton (BDC 10.40.1), Sherwood's code does not keep the
# county's zoning after annexation. All eleven are unencodable, and the
# disagreement is in the handoff.
zone_rulings:
  Old Town:
    outcome: unencodable
    note: >-
      "Old Town Overlay", one feature of 44.7 acres on the city's zoning
      layer on 2026-09-29. OT is an overlay district of 16.04.010
      (sdc.16.04.districts.txt L25), not a base zone: 16.162.030 A permits
      the uses "permitted outright in the RC zone ... the HDR zone ... and
      the MDRL zone ... limited to those permitted in the underlying zoning
      district" (sdc.16.162.old-town.txt L49-L53), and 16.162.060 applies
      "the dimensional standards of the underlying RC, HDR and MDRL zones"
      with exceptions (L102-L104). The map paints the overlay over its
      whole area and prints no underlying zone, so which of the three
      governs a lot cannot be read from it. Chapter 16.162 is stored whole
      (16.162.010-16.162.100), but none of its use, height or design
      exceptions is encoded; a lot here stays open until the base zone is
      mapped.
  OS:
    outcome: unencodable
    note: >-
      "Open Space-OS", one feature of 4.3 acres on the city's zoning layer
      on 2026-09-29. OS is not among the districts 16.04.010 lists
      (sdc.16.04.districts.txt L10-L25) and no chapter of the code sliced
      here sets its uses or standards. The list is printed from a 2007
      supplement and is stale (it also omits EI, which Chapter 16.31
      creates), so OS may be a district the code adds elsewhere; it was
      not found this session and is not guessed.
  UGA:
    outcome: unencodable
    note: >-
      "Urban Growth Area-Concept Plan Required", two features of 14.0 acres
