# ordinance that adopted both, and the Municode history notes name it as
# their latest amendment (16.12.030 and 16.14.010). The PDF is a scan with
# an OCR text layer, so quotes carry OCR artefacts ("lnfrastructure",
# "sta¡rs"); the words are the ordinance's. Each slice starts on a section
# heading printed once and ends on the next heading.
- id: "ord.2022-004.16.12.030"
  url: https://www.sherwoodoregon.gov/wp-content/uploads/2025/03/ordinance-2022-004-amending-code-housing-choices.pdf
  title: "Ordinance 2022-004 Exhibit 1 - SZCDC 16.12.030 A and B (Generally; Development Standards; Sufficient Infrastructure)"
  start: "16.12.030 - Residential Land Use Development Standards"
  end: "C. Development Standards per Residential Zone"
  extraction: plain
  # Two paragraphs of prose; few numbers is what this slice is.
  allow_thin: true
- id: "ord.2022-004.16.12.030-c"
  url: https://www.sherwoodoregon.gov/wp-content/uploads/2025/03/ordinance-2022-004-amending-code-housing-choices.pdf
