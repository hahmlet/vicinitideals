# Municode client King City, publication 3913 (the King City Municipal
# Code, Title 16 the Community Development and Zoning Code), Supplement 16.
# The unsigned publication endpoint, per flats/provenance/municode.py.
# Plain extraction throughout. The PDF prints the whole municipal code;
# Title 16 starts near page 270. Plain chapter numbers are not unique --
# the definitions cite "Chapter 16.114" before the chapter prints and the
# Kingston Terrace chapter cites 16.132 -- so several slices start and end
# on a chapter's title line, which is printed once.
- id: "kcc.16.24.definitions"
  url: https://api.municode.com/PublicationPdfDownload/3913
  title: "KCMC Chapter 16.24 - Definitions"
  start: "Chapter 16.24"
  end: "Chapter 16.28"
  extraction: plain
  # A glossary: 1,602 lines of quoted terms and few section numbers, which
  # the thin-text check reads as a landing page. Read whole on 2026-09-29.
  allow_thin: true
  # The alphabetical glossary is 16.24.020 alone, from the line after its
  # heading to its closing ordinance history. 16.24.030 (L1118 on) sorts
  # the land use types into categories -- accessory, residential,
  # commercial, community -- in the codifier's order, not the alphabet's,
  # and the chapter ends in the OCR text of a solar-access figure. Read as
  # one alphabet the three made 15 of 199 entries "out of order" and the
  # chapter read as skimmed. Every word the layer's fields are measured in
  # (lot, lot line, lot width and depth, setback, height, coverage,
  # density) is in 16.24.020; the use-type nouns the layer quotes (Fourplex,
  # Dwelling multi, Triplex) are cited in the definitions comment below.
  # The cost, measured: the words ledger now reads multifamily, quadplex,
  # duplex and triplex as "silent" (unbounded, they were "defined" at
  # L1204, L1268, L1229 and L1348). The code defines them; the span cannot
  # say so, because definitions_at holds one range. Handed on, not hidden.
  definitions_at: L20-L1117
