definitions:
  # Read 2026-09-29 from KCMC 16.24.020 and 16.24.030, which are on disk
  # whole (kcc.16.24.definitions.txt runs from the Chapter 16.24 heading to
  # the Chapter 16.28 heading).
  #
  # THE NOUN. 16.24.030 C, Residential Use Types: "Fourplex" means "a
  # structure that contains four primary dwelling units on one lot. The
  # units may share common walls, floors or ceilings" (L1268-L1270). The pod
  # is a Fourplex. "Dwelling, multi" starts at "five or more dwelling units"
  # (L1204-L1208), so a use row that says multi-dwelling or multi-family is
  # not the pod's row; a single-family attached dwelling is "located on its
  # own lot" (L1209-L1214), the unit-lot path. Triplex at L1348-L1350,
  # duplex at L1229-L1231. Kingston Terrace's use table points its housing
  # rows at these words ("As defined by 16.24.030.C",
  # 16.114.040.txt#L56).
  #
  # FRONT LOT LINE. "A 'front lot line' is a lot line that abuts a street"
  # (L464-L465), with no exception for a corner, so a corner lot has as many
  # front lines as streets; the rear "shall only correspond with one of the
  # front lot lines" (L466-L472). Encoded as front_lot_line_corner: both
  # under defaults.
  #
  # SETBACK. "the shortest horizontal distance between the wall or
  # foundation of a building and property line"; the garage setback runs
  # "from a street lot line to the entrance to a garage or carport,
  # following the center of the driveway" (L595-L603).
  #
  # HEIGHT. "the vertical distance between the highest point of a structure
  # and the average grade along the front foundation" (L67-L69). To the
  # ridge, not the midpoint of a gable: stricter than most codes read here.
  #
  # LOT COVERAGE. "the percentage of a lot that may be covered by impervious
  # surface including buildings, driveways, sidewalks and parking areas"
  # (L453-L456). See the coverage comment in the Kingston Terrace zones.
  #
  # DENSITY. "dwelling units per gross acre" (L108-L110) -- but Kingston
  # Terrace defines its own net density (16.114.050 B) and exempts itself
  # from 16.146 (Table 16.114-1), so the gross figure reaches only the
  # older districts, which refuse the pod anyway.
  #
  # LOT WIDTH AND DEPTH. Only averages are defined: width "measured from the
  # midpoint of the front and rear lot lines" (L479-L481), depth "from the
  # midpoint of the opposing side lot lines" (L457-L459). Kingston Terrace's
  # table prints "Minimum lot width" without saying which, and 20 feet
  # cannot bind a lot that holds a 56-foot pod, so it is held as the plain
  # min_lot_width_ft.
  corner_lot:
    # "A lot that is located at the intersection of two or more public
    # street rights-of-way." Public, so a private drive does not make a
    # corner (drives_count stays false). The code names an alley apart from
    # a street ("the end or side of a street or alley", Reserve strip,
    # L575-L577), and Kingston Terrace draws the alley as its own street
    # section (Figure 16.114.24), so an alley is left out: the default
    # alleys_count: false.
    test: intersecting_frontages
    quote: "or/washington/king-city/kcc.16.24.definitions.txt#L448-L450,L575-L577"
    cite: "King City KCMC 16.24.020, Lot, corner; Reserve strip"

# Whether a private road or drive the lot abuts is a street here (FOLLOWUPS
# 17(b); Steph's rule of 2026-09-30: a private road is a way in for the
# parking everywhere, and governs the yards only where the city's code
# makes it a street, as this one does).
private_drives:
  street: true
  quote: "or/washington/king-city/kcc.16.24.definitions.txt#L589-L591"
  says: "means a public or private"
  cite: "KCMC 16.24.020 (Road or street; Lot line; Setback)"
  note: >-
    "'Road' or 'street' means a public or private way that is created to
    provide access for persons to one or more lots, parcels or tracts of
    land" (L589-L591). A front lot line is "a lot line that abuts a street"
    (L464-L465), and the "Street setback" is measured "from a side lot line
    which abuts a street" (L608-L609), so a private way sets both the front
    and the street-side setbacks. A corner lot is narrower: it must sit at
    the intersection of two or more "public street rights-of-way"
    (L448-L450), and the corner_lot block keeps drives_count false.
    Through lots follow access: where a lot has street frontage on opposing
    sides, the rear lot line is the one "where vehicular access is not
    allowed or provided" (L470-L472).
    Recorded, not held: the through-lot rule (L470-L472) makes the line
    with no vehicle access the rear, which the model cannot follow when the
    car comes in off the private way; and the corner test stays public-only.

defaults:
  # ADDITIONAL YARD FROM THE CENTRE LINE (16.80.060 A; see the note above
  # the zones). Pacific Highway (99W) is "as determined by the Oregon
  # Department of Transportation" (L5-L6): the code names the street and
  # prints no figure, so the row holds none (null) and a line on 99W takes
  # the deepest figure the section does print, 33 feet -- the field's rule
  # for a street it cannot read (flats/geom/dedication.py). Until
  # 2026-10-25 it held Sherwood's 61 feet for the same highway, borrowed;
  # Steph's page check (1087): "Pacific Highway does not say 61' on this
  # page." No lot moves on 99W today: every district that fronts it (LC,
  # CBD, INST, the older residential districts) refuses the pod. Before one
  # of them opens, ODOT's figure has to be found, not approximated.
  # The three "between X and Y" stretches (c, e, f) are held in brackets
  # after the street, the code's words otherwise as printed: a line read
  # off its stretch takes "All other city streets", 25 feet; one the bridge
  # cannot place stays at the row's figure (FOLLOWUPS 77,
  # flats/geom/dedication.py stretch_of).
  row_to_centerline_named_ft:
    value:
      - [Pacific Highway, null]
      - [Beef Bend Road, 33]
      - [131st Avenue (between Beef Bend Road and Fischer Road), 33]
      - [Fischer Road, 33]
      - [116th Avenue (between Queen Elizabeth and Pacific Highway), 30]
      - [Royalty Parkway (between Pacific Highway and 116th Avenue), 30]
    cite: King City KCC 16.80.060 A.2.a-f, right-of-way from centerline by street (Pacific Highway as determined by ODOT, no figure printed)
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/16.80/16.80.060.txt#L1-L12"
  row_to_centerline_other_ft:
    value: 25
    cite: King City KCC 16.80.060 A.2.g, all other city streets twenty-five feet from centerline
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/16.80/16.80.060.txt#L3-L4,L12"
  # EVERY VALUE BELOW IS KINGSTON TERRACE'S. Only the four Kingston Terrace
  # zones admit the pod, and Table 16.114-1 sends new development there to
  # 16.114.130 instead of the citywide parking chapter: "Parking and Loading
  # 16.132 Exempt. Superseded by Section 16.114.130"
  # (16.114.020.txt#L16-L17). If an older district is ever
  # opened to the pod, 16.132 (kcc.16.132.parking.txt) has to be read for
  # it and these values moved into the Kingston Terrace zones. The count
  # would not change -- 16.132 has no minimum since Ordinance O-2024-01
  # deleted the old 16.132.030 (L201-L207), and 16.132.040 prints
  # "Triplex/Quadplex Not applicable" as the maximum (L219-L222) -- but the
  # stall table would: 16.132.050's figures lost their foot and inch marks
  # in the Municode PDF (ten replacement characters, L268-L277).
  #
  # PARKING COUNT. 16.114.130 C.1: "There are no minimum vehicle parking
  # requirements in the Kingston Terrace District." Table 16.114-13 prints
  # "Duplex, Triplex, Fourplex Not Applicable" as the maximum. Zero is
  # encoded because the code says none, not because it is silent.
  # Citywide, not only Kingston Terrace (Steph asked, page check 1076,
  # 2026-10-25): Ordinance O-2024-01 deleted the old 16.132.030 "Minimum
  # off-street parking requirements", and the section that replaced it sets
  # maximums only (16.132/16.132.030.txt#L1-L4,L33-L35). The state layer
  # neither raises nor lowers this: OAR 660-046-0220(2)(e)(B) caps what a
  # city may ASK (or/_state.yaml, preempts: cap), and the Climate-Friendly
  # parking rules (OAR 660-012-0400 to -0450) are shown on the lot page and
  # not screened (rulings.yaml 2026-09-30-transit-show-not-screen). The
  # city's zero governs, and the pod draws its four stalls either way.
  parking_min_per_unit:
    value: 0
    cite: King City KCMC 16.114.130 C.1, no minimum vehicle parking in the Kingston Terrace District (and none citywide since Ord. O-2024-01 deleted the minimums of 16.132.030)
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/16.114/16.114.130.txt#L5-L10"
  parking_max_per_unit:
    exempt: true
    cite: King City KCMC 16.114.130 C.2 and Table 16.114-13, Duplex, Triplex, Fourplex (Not Applicable)
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/16.114/16.114.130.txt#L16-L21"
  # PLACEMENT. C.4.c: "Surface parking areas shall occur to the side or rear
  # of buildings." Every surface stall, not only a lot of them; the pod's
  # rear court is the rear. C.4.d (surface parking no closer to the street
  # than the building) names mixed-use, multi-family and commercial
  # buildings, not a fourplex, and says the same thing less strictly.
  #
  # NOT ENCODED: C.4.e, "no backing movements or other maneuvering within a
  # street or right-of-way". A rear court served by a drive does not back
  # into the street; nothing measures a design that would.
  parking_front_prohibited:
    value: true
    cite: King City KCMC 16.114.130 C.4.c, surface parking to the side or rear of buildings
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/16.114/16.114.130.txt#L49,L53"
  # SIDE-YARD PARKING, ROUND 4 (FOLLOWUPS 146, 2026-11-06; Chapter 16.124 now
  # stored). SILENT. A setback runs from "the wall or foundation of a building"
  # (16.24), and no chapter places parking in or out of an interior side yard:
  # 16.132 names no yard, and 16.114.130 C.4.c puts surface parking "to the
  # side or rear of buildings" without saying a required yard may hold it.
  # YELLOW at best (ruling 2026-11-05-side-yard-parking-silent-codes).
  #
  # THE 16.124.110 BUFFER (FOLLOWUPS 146, kc-buffer, 2026-11-13; replaces the
  # round-4 "no strip" note). 16.114.020 applies Chapter 16.124 in Kingston
  # Terrace (16.114/16.114.020.txt#L14), and 16.124.110 reads, left column of
  # kcc.16.124.landscaping.txt: C, "A buffer/screening area shall be provided
  # between different types of land use zones (for example, between
  # single-family and multi-family residential, and between residential and
  # commercial) on all portions of the lot abutting a lesser zone" (L193-L198);
  # C.1 ten feet "on a commercial property abutting a residential zone"
  # (L199-L201); C.2 five feet "on a multi-family property abutting a
  # single-family zone" (L203-L205); C.3 ten feet "on a multi-family property
  # abutting a commercial zone" (L206-L208). Right column: A, a buffer is "an
  # area within a required interior setback adjacent to a property line"
  # (L180-L183); B, "No building, accessways or parking areas shall be allowed
  # in a buffer area accept where an accessway has been approved by the city"
  # (L184-L188) -- so neither the drive lane nor the court may stand in it
  # (approval is relief, and no variance is taken: ruling
  # 2026-10-02-no-variances).
  #
  # READ BY THE ZONE, the conservative reading. C sorts "types of land use
  # zones", so "multi-family property" is read as a lot in a zone that admits
  # multi-dwellings: R-12, R-15, R-24 and AT (16.84.010 "Multi-dwelling N P P
  # P N P", 16.84/16.84.010.txt#L4,L14; 16.80.020 names R-15 and R-24
  # "Multi-family Residential", 16.80/16.80.020.txt#L7-L12) and the four
  # Kingston Terrace zones (Table 16.114-2, "Dwelling, multi Y Y Y CU",
  # 16.114/16.114.040.txt#L37). The use reading -- a fourplex or a
  # townhouse row is not "dwelling, multi" (five units, 16.24) -- would owe
  # nothing, and would be the GREEN this field exists to prevent if it is
  # wrong; it is a question for Steph in the kc-buffer hand-off. R-9 admits no
  # multi-dwelling and holds no buffer (zone level). F (Kingston Terrace
  # parking serving "dwelling, multi", mixed-use, commercial or institutional
  # development) does not reach a fourplex's stalls; C does.
  #
  # ONE FIGURE OFF EVERY LINE. The bridge says whether ANY non-street line
  # abuts a lesser zone (`abuts_lower_density_zone`, the `neighbours:` block),
  # not which, and the strip is kept off every non-street line
  # (flats/ingest/quadfit.py, "No line named"). Single-family (C.2, 5 ft) and
  # commercial (C.3, 10 ft) neighbours share the one fact, so the larger
  # printed figure, 10, is held for both: a lot with SF only along one side
  # is charged 10 where the code asks 5 (Sandy's 17.98.50 A bargain, the
  # same direction). A planted strip that alone sinks a fit makes the lot
  # YELLOW PARKING-STRIP-UNCONFIRMED (ruling 2026-10-04-planted-strips-yellow),
  # never GREEN; a neighbour the list cannot place leaves the fact unread.
  parking_lot_line_buffer_ft:
    exempt: true
    cite: King City KCMC 16.124.110 C, a buffer is owed only on the portions of a lot abutting a lesser zone
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/kcc.16.124.landscaping.txt#L193-L198"
    variants:
      - value: 10
        when: [abuts_lower_density_zone]
        cite: King City KCMC 16.124.110 C.3, a ten-foot buffer on a multi-family property abutting a commercial zone (C.2's five feet abutting a single-family zone is inside it), held off every non-street line; 16.124.110 A-B, no building, accessways or parking areas in a buffer
