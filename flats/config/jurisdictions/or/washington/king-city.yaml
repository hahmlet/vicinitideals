# Clear-vision areas at corners and drives (FOLLOWUPS 161; flats/geom/sight_triangle.py).
neighbours:
  abuts_lower_density_zone:
    true_for: [SF, R-9, LC, NMU]
    false_for: [R-12, R-15, R-24, AT, KTC, KTRC]
    quote: "or/washington/king-city/16.80/16.80.020.txt#L1-L28"
    cite: King City KCMC 16.80.020 zoning classification districts, read with 16.84.010 and Table 16.114-2 for 16.124.110 C
    note: >-
      Read only by `parking_lot_line_buffer_ft` (16.124.110 C.2 and C.3, the
      defaults): the "lesser zone" a multi-family property owes a buffer
      against is a single-family zone or a commercial zone. Single-family:
      SF ("Single-family Residential") and R-9, the one other older district
      that admits no multi-dwelling (16.84.010, Multi-dwelling N in R-9 and SF,
      16.84/16.84.010.txt#L4,L14). Commercial: LC ("Limited Commercial") and
      NMU. False: the districts that admit multi-dwellings and are not
      commercial -- R-12, R-15, R-24, AT, and the Central and Rural Character
      Neighborhoods (Table 16.114-2: no retail, no office,
      16.114/16.114.040.txt#L37-L41). KTTC and KTBB admit retail and offices
      and multi-dwellings, so they may be a commercial zone to a lot beside
      them and are on neither list; CF, ROS and the county pockets are not
      sorted by C either. A line against any of them, another jurisdiction,
      unzoned land or a split neighbour leaves the fact unread and the lot
      out of GREEN unless it clears the buffer anyway.
  abuts_residential_zone:
    true_for: [SF, R-9, R-12, R-15, R-24, AT, KTC, KTRC]
    false_for: [LC, NMU, CF, ROS]
    quote: "or/washington/king-city/16.80/16.80.020.txt#L1-L28"
    cite: King City KCMC 16.80.020 zoning classification districts, read with Table 16.114-2 for 16.124.110 C.1
    note: >-
      Read only by `parking_lot_line_buffer_ft` in KTTC and KTBB (16.124.110
      C.1, ten feet on a commercial property abutting a residential zone).
      True: the six older residential districts named Residential in
      16.80.020 (SF, R-9, R-12, R-15, R-24 and AT, Apartments and Townhouses)
      and the two Kingston Terrace neighbourhoods that admit no retail or
      office (KTC, KTRC; 16.114/16.114.040.txt#L39-L41). False: Limited
      Commercial, Neighborhood Mixed-Use, Community Facilities and Recreation
      Open Space. KTTC and KTBB are mixed (dwellings and shops), on neither
      list, so a line against one is unread and held to the buffer.

clear_vision:
  corner:
    status: unsettled
    legs_ft:
    - 15
    - 20
    - 35
    basis: curb
    quote: or/washington/king-city/kcc.16.144.vision-clearance.txt#L21-L28
    says: formed using the curb line or pavement edge
    cite: KCC 16.144.030
    note: '15 ft (35 on six named streets, 20 in Kingston Terrace) from the curb or pavement edge; (B)
      bars a ''vehicle, hedge, planting, fence, wall, sign or any similar permanent obstruction'', (C)
      names buildings only on curves: whether a building is barred is unclear. Unsettled: the conservative
      default (rulings.yaml 2026-11-09-sight-triangle-corner-check): the area bars buildings at its largest
      plausible size, measured with the curb at the lot line; a corner lot it reaches is YELLOW, never
      GREEN and never RED on it, until the rule is read.'
    ruling: 2026-11-09-sight-triangle-corner-check
  driveway:
    status: unsettled
    kind: edge
