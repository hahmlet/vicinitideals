# THE LAYER-WIDE REFUSALS, one per standard, read 2026-09-29.
#
# NOT ENCODED: 16.144.030 A.2, "all intersections within the Kingston
# Terrace District shall have a visual clearance area of not less than
# twenty feet on each side of the intersection", excepting only "driveways
# serving no more than two residences"; B keeps it clear of any "permanent
# obstruction which is between three feet and eight feet in height"
# (16.144.030.txt#L3-L4,L12,L17-L18). The triangle
# is measured from "the curb line or pavement edge", not the lot line, so
# how much of it falls on the lot depends on the width of the planting
# strip and sidewalk, which nothing holds. At a street corner the smallest
# street yards (10 front, 8 street side) put the building corner 18 feet
# along each line from the lot corner, inside a 20-foot triangle drawn at
# the lot lines; at the pod's own driveway, which serves four homes, the
# triangle reaches the building face wherever the lot line sits within ten
# feet of the curb. A doubt; the handoff has it.
#
# SUBSTANDARD RIGHT-OF-WAY. 16.80.060 A: "Where a yard or setback abuts a
# street having insufficient right-of-way width, the minimum yard or
# setback requirement shall be increased by the amount of right-of-way,
# measured from the street centerline, necessary" -- 33 feet on Beef Bend
# Road, 131st Avenue and Fischer Road, 30 on 116th Avenue and Royalty
# Parkway, 25 on "All other city streets" (16.80.060.txt#L1-L12).
# Encoded in the defaults as row_to_centerline_named_ft and _other_ft. The
# "between X and Y" stretches of 131st, 116th and Royalty are read where the
# bridge can place a lot line on or off them (FOLLOWUPS 77); where it cannot,
# the distance holds along the whole street, which can only push a yard back.
# Pacific Highway (99W) is "as determined by the Oregon Department of
# Transportation", which states no number; held as a row with no figure
# (null), read like a street the screen cannot name: the deepest figure the
# section prints. It borrowed Sherwood's 61 feet until 2026-10-25.
# The county-zoned "(WC)" districts read the county's dedication instead.
#
# NOT ENCODED: 16.80.060 B, projections into yards (L130-L149). An
# allowance; nothing here reads one in any zone.
#
# NOT ENCODED: Chapter 16.82, the unlisted-use procedure. 16.82.030 A: "The
# city manager shall maintain a list by zoning district of unlisted uses
# approved by the planning commission and the list shall have the same
# effect as an amendment to the use provisions of the applicable zone"
# (16.82.030.txt#L1-L2). The list is not published with the code
# and was not found; if it names a fourplex in an older district, that
# district's refusal below is wrong. A doubt. A new request could not
# succeed: 16.82.040 A requires that "The use is not specifically listed in
# another zone as either a permitted use or a conditional use" (L36-L41),
# and Table 16.114-2 lists the fourplex in all four Kingston Terrace zones.
zones:
  # ------------------------------------------------------------------
  # THE OLDER RESIDENTIAL DISTRICTS, 16.84 to 16.100. 16.84.010 is the
  # housing-type table for all six: "R-9 R-12 R-15 R-24 SF AT", with rows for
  # single dwelling detached and attached, accessory dwelling, duplex,
  # manufactured home and "Multi-dwelling N P P P N P"
  # (16.84.010.txt#L1-L15). There is no triplex and
  # no fourplex row, and multi-dwelling is five or more units by definition.
  # Each district's own permitted-use list (16.84.020 for R-9; 16.88.020 SF,
  # 16.92.020 AT, 16.94.020 R-12, 16.96.020 R-15, 16.100.020 R-24) names
  # residential homes, manufactured home parks, family care, residential
  # facilities, duplexes (AT) and accessory dwellings, and no fourplex
  # (kcc.16.88-16.100.residential-zones.txt#L13-L23,L61-L75,L112-L126,
  # L250-L265,L302-L317). Their conditional-use lists name no dwelling of
  # three or four units either. Refused.
  #
  # QUESTION FOR THE OWNER, not answered here. King City is inside Metro
  # and over a thousand people, a Large City under OAR 660-046-0020 (see
  # or/_state.yaml), and every one of these six districts permits a
  # detached single dwelling. The code itself names quadplexes three times
  # outside Kingston Terrace -- "Density maximums may not apply to
  # duplexes, quadplexes, triplexes, or cottage clusters" (16.146.030 A,
  # 16.146.030.txt#L1-L3) and "Triplex/Quadplex Not applicable" as
  # a parking maximum (16.132.040, 16.132.040.txt#L4-L12) -- and
  # never admits one in a use table. Whether the state's model code applies
  # directly where a Large City's own table is silent is a legal question.
  # The conservative reading is the city's printed table: refused, and put
  # to Steph in the handoff. The state layer cannot overturn it today; it
  # carries no quadplex_allowed, and quadplex_allowed: false is not how a
  # zone says "not residential" (or/_state.yaml, the -0010(2) comment).
  #
  # THE TOWNHOUSE PATH, ENCODED 2026-10-28 (FOLLOWUPS 109 chunk 4; page check
  # 1092, 1095, 1098, 2026-10-25: Steph answered "differs" on AT, R-24 and
  # R-9). The same table prints "Single dwelling attached P P P P N P" --
  # permitted in R-9, R-12, R-15, R-24 and AT, not SF (16.84.010.txt#L7-L8)
  # -- and 16.24.030 defines it as a dwelling "located on its own lot, that
  # shares one or more common or abutting walls ... Also referred to as a
  # townhome or townhouse" (kcc.16.24.definitions.txt#L1209-L1214).
  # 16.84.050 caps a row at "Maximum number of attached single-family units
  # 4 units", and 16.84.040 prints townhouse lots of 1,500 square feet and
  # 20 feet wide (its notes 1 and 2). That is the pod on four unit lots. The
  # fourplex on one lot stays refused, as above. The unit-lot path wants
  # `quadplex_allowed: true when [unit_lots]` in those five zones AND their
  # 16.84.040 dimensions, 16.84.050's entrance rule and 16.132's parking
  # (9 by 18 foot stalls and 24-foot aisles, 16.132.050 -- not the Kingston
  # Terrace 9 by 16 and 20 in the defaults), read as one piece. Done
  # 2026-10-28: each of the five zones opens `quadplex_allowed` on
  # [unit_lots] and carries its 16.84.040 column, its outdoor area and
  # entrance, 16.132's count and stalls, and 16.136.030 A's 30-foot
  # access strip for three to six attached lots, at zone level so the
  # Kingston Terrace defaults do not reach them. SF stays refused (N).
  #
  # Two copying slips in the source, recorded so a reader does not stop on
  # them: 16.96.020 (R-15) and 16.100.020 (R-24) both open "Permitted uses in
  # the AT zone are" (residential-zones.txt L255-L256, L307-L308), under
  # their own chapter headings. Read as their own districts.
  # ------------------------------------------------------------------
