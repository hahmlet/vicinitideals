definitions:
  # Read 2026-09-29 from KCMC 16.24.020 and 16.24.030, which are on disk
  # whole (kcc.16.24.definitions.txt runs from the Chapter 16.24 heading to
  # the Chapter 16.28 heading).
  #
  # THE NOUN. 16.24.030 C, Residential Use Types: "Fourplex" means "a
  # structure that contains four primary dwelling units on one lot. The
  # units may share common walls, floors or ceilings" (L1268-L1270). The pod
  # is a Fourplex. "Dwelling, multi" starts at "five or more dwelling units"
  # (L1204-L1208), so a use row that says multi-dwelling or multi-family is
  # not the pod's row; a single-family attached dwelling is "located on its
  # own lot" (L1209-L1214), the unit-lot path. Triplex at L1348-L1350,
  # duplex at L1229-L1231. Kingston Terrace's use table points its housing
  # rows at these words ("As defined by 16.24.030.C",
  # kcc.16.114.kingston-terrace.txt#L172).
  #
  # FRONT LOT LINE. "A 'front lot line' is a lot line that abuts a street"
  # (L464-L465), with no exception for a corner, so a corner lot has as many
  # front lines as streets; the rear "shall only correspond with one of the
  # front lot lines" (L466-L472). Encoded as front_lot_line_corner: both
  # under defaults.
  #
  # SETBACK. "the shortest horizontal distance between the wall or
  # foundation of a building and property line"; the garage setback runs
  # "from a street lot line to the entrance to a garage or carport,
  # following the center of the driveway" (L595-L603).
  #
  # HEIGHT. "the vertical distance between the highest point of a structure
  # and the average grade along the front foundation" (L67-L69). To the
  # ridge, not the midpoint of a gable: stricter than most codes read here.
  #
  # LOT COVERAGE. "the percentage of a lot that may be covered by impervious
  # surface including buildings, driveways, sidewalks and parking areas"
  # (L453-L456). See the coverage comment in the Kingston Terrace zones.
  #
  # DENSITY. "dwelling units per gross acre" (L108-L110) -- but Kingston
  # Terrace defines its own net density (16.114.050 B) and exempts itself
  # from 16.146 (Table 16.114-1), so the gross figure reaches only the
  # older districts, which refuse the pod anyway.
  #
  # LOT WIDTH AND DEPTH. Only averages are defined: width "measured from the
  # midpoint of the front and rear lot lines" (L479-L481), depth "from the
  # midpoint of the opposing side lot lines" (L457-L459). Kingston Terrace's
  # table prints "Minimum lot width" without saying which, and 20 feet
  # cannot bind a lot that holds a 56-foot pod, so it is held as the plain
  # min_lot_width_ft.
  corner_lot:
    # "A lot that is located at the intersection of two or more public
    # street rights-of-way." Public, so a private drive does not make a
    # corner (drives_count stays false). The code names an alley apart from
    # a street ("the end or side of a street or alley", Reserve strip,
    # L575-L577), and Kingston Terrace draws the alley as its own street
    # section (Figure 16.114.24), so an alley is left out: the default
    # alleys_count: false.
    test: intersecting_frontages
    quote: "or/washington/king-city/kcc.16.24.definitions.txt#L448-L450,L575-L577"
    cite: "King City KCMC 16.24.020, Lot, corner; Reserve strip"

# Whether a private road or drive the lot abuts is a street here (FOLLOWUPS
# 17(b); Steph's rule of 2026-09-30: a private road is a way in for the
# parking everywhere, and governs the yards only where the city's code
# makes it a street, as this one does).
private_drives:
  street: true
  quote: "or/washington/king-city/kcc.16.24.definitions.txt#L589-L591"
  says: "means a public or private"
  cite: "KCMC 16.24.020 (Road or street; Lot line; Setback)"
  note: >-
    "'Road' or 'street' means a public or private way that is created to
    provide access for persons to one or more lots, parcels or tracts of
    land" (L589-L591). A front lot line is "a lot line that abuts a street"
    (L464-L465), and the "Street setback" is measured "from a side lot line
    which abuts a street" (L608-L609), so a private way sets both the front
    and the street-side setbacks. A corner lot is narrower: it must sit at
    the intersection of two or more "public street rights-of-way"
    (L448-L450), and the corner_lot block keeps drives_count false.
    Through lots follow access: where a lot has street frontage on opposing
    sides, the rear lot line is the one "where vehicular access is not
    allowed or provided" (L470-L472).
    Recorded, not held: the through-lot rule (L470-L472) makes the line
    with no vehicle access the rear, which the model cannot follow when the
    car comes in off the private way; and the corner test stays public-only.

defaults:
  # EVERY VALUE BELOW IS KINGSTON TERRACE'S. Only the four Kingston Terrace
  # zones admit the pod, and Table 16.114-1 sends new development there to
  # 16.114.130 instead of the citywide parking chapter: "Parking and Loading
  # 16.132 Exempt. Superseded by Section 16.114.130"
  # (kcc.16.114.kingston-terrace.txt#L68). If an older district is ever
  # opened to the pod, 16.132 (kcc.16.132.parking.txt) has to be read for
  # it and these values moved into the Kingston Terrace zones. The count
  # would not change -- 16.132 has no minimum since Ordinance O-2024-01
  # deleted the old 16.132.030 (L201-L207), and 16.132.040 prints
  # "Triplex/Quadplex Not applicable" as the maximum (L219-L222) -- but the
  # stall table would: 16.132.050's figures lost their foot and inch marks
  # in the Municode PDF (ten replacement characters, L268-L277).
  #
  # PARKING COUNT. 16.114.130 C.1: "There are no minimum vehicle parking
  # requirements in the Kingston Terrace District." Table 16.114-13 prints
  # "Duplex, Triplex, Fourplex Not Applicable" as the maximum. Zero is
  # encoded because the code says none, not because it is silent.
  parking_min_per_unit:
    value: 0
    cite: King City KCMC 16.114.130 C.1, no minimum vehicle parking in the Kingston Terrace District
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/kcc.16.114.kingston-terrace.txt#L2536-L2544"
  parking_max_per_unit:
    exempt: true
    cite: King City KCMC 16.114.130 C.2 and Table 16.114-13, Duplex, Triplex, Fourplex (Not Applicable)
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/kcc.16.114.kingston-terrace.txt#L2563-L2568"
  # PLACEMENT. C.4.c: "Surface parking areas shall occur to the side or rear
  # of buildings." Every surface stall, not only a lot of them; the pod's
  # rear court is the rear. C.4.d (surface parking no closer to the street
  # than the building) names mixed-use, multi-family and commercial
  # buildings, not a fourplex, and says the same thing less strictly.
  #
  # NOT ENCODED: C.4.e, "no backing movements or other maneuvering within a
  # street or right-of-way". A rear court served by a drive does not back
  # into the street; nothing measures a design that would.
  parking_front_prohibited:
    value: true
    cite: King City KCMC 16.114.130 C.4.c, surface parking to the side or rear of buildings
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/kcc.16.114.kingston-terrace.txt#L2612,L2624-L2625"
  # STALLS AND AISLES. C.9.a sends every off-street stall to Table
  # 16.114-14; the 90-degree Standard row reads "9.0 ft. 8.5 ft. 16.0 ft.
  # 20.0 ft. 16.0 ft." -- stall width, curb length, one-way aisle, two-way
  # aisle, and a stall depth the header says "Includes bumper overhang".
  # C.9.d lets a curb or wheel stop count up to two feet of overhang toward
  # that depth; 16 is the depth with no allowance taken, as the field asks.
  # A curb length of 8.5 under a 9.0 stall at 90 degrees cannot be a
  # dimension of the same rectangle; the width row is held and the curb
  # length is not encoded (a doubt). C.9.b allows up to half the stalls
  # compact (8.0 by 15.0); the standard stall is held, the stricter reading,
  # as in the other layers.
  parking_stall_width_ft:
    value: 9
    cite: King City KCMC 16.114.130 C.9.a and Table 16.114-14, 90 degrees, Standard
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/kcc.16.114.kingston-terrace.txt#L2683-L2690,L2712-L2724,L2733"
  parking_stall_depth_ft:
    value: 16
    cite: King City KCMC 16.114.130 C.9.a and Table 16.114-14, 90 degrees, Standard (stall depth including bumper overhang)
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/kcc.16.114.kingston-terrace.txt#L2683-L2690,L2696-L2699,L2712-L2724,L2733"
  parking_aisle_one_way_ft:
    value: 16
    cite: King City KCMC 16.114.130 C.9.a and Table 16.114-14, 90 degrees, 1-Way Aisle Width
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/kcc.16.114.kingston-terrace.txt#L2712-L2724,L2733"
  parking_aisle_two_way_ft:
    value: 20
    cite: King City KCMC 16.114.130 C.9.a and Table 16.114-14, 90 degrees, 2-Way Aisle Width
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/kcc.16.114.kingston-terrace.txt#L2712-L2724,L2733"
  # NOT ENCODED: Table 16.114-12, Minimum Vehicle Access Standards
  # (kcc.16.114.kingston-terrace.txt#L2467-L2472). It prints a row for
  # "Dwelling, single detached or attached" (one driveway, 10 feet) and one
  # for "Dwellings, multi" (one driveway, 30 feet of access, 15 feet paved
  # one-way or 20 two-way, curbs and a five-foot walkway) and none for a
  # duplex, triplex or fourplex. Neither row names the pod; a doubt.
  front_lot_line_corner:
    value: both
    cite: King City KCMC 16.24.020, Lot line (a front lot line is a lot line that abuts a street)
    url: https://api.municode.com/PublicationPdfDownload/3913
    retrieved: '2026-09-29'
    quote: "or/washington/king-city/kcc.16.24.definitions.txt#L462-L465"

# THE LAYER-WIDE REFUSALS, one per standard, read 2026-09-29.
#
# NOT ENCODED: 16.144.030 A.2, "all intersections within the Kingston
# Terrace District shall have a visual clearance area of not less than
# twenty feet on each side of the intersection", excepting only "driveways
# serving no more than two residences"; B keeps it clear of any "permanent
# obstruction which is between three feet and eight feet in height"
# (kcc.16.144.vision-clearance.txt#L21-L28,L44-L46,L52-L58). The triangle
# is measured from "the curb line or pavement edge", not the lot line, so
# how much of it falls on the lot depends on the width of the planting
# strip and sidewalk, which nothing holds. At a street corner the smallest
# street yards (10 front, 8 street side) put the building corner 18 feet
# along each line from the lot corner, inside a 20-foot triangle drawn at
# the lot lines; at the pod's own driveway, which serves four homes, the
# triangle reaches the building face wherever the lot line sits within ten
# feet of the curb. A doubt; the handoff has it.
#
# NOT ENCODED: 16.80.060 A, "Where a yard or setback abuts a street having
# insufficient right-of-way width, the minimum yard or setback requirement
# shall be increased" by the right-of-way needed -- 33 feet from the
# centerline on Beef Bend Road, 131st Avenue and Fischer Road, 25 on "All
# other city streets" (kcc.16.80.general.txt#L105-L129). It pushes a yard
# back by a width nothing measures. The same kind of rule as in the county
# and Sherwood layers.
#
# NOT ENCODED: 16.80.060 B, projections into yards (L130-L149). An
# allowance; nothing here reads one in any zone.
#
# NOT ENCODED: Chapter 16.82, the unlisted-use procedure. 16.82.030 A: "The
# city manager shall maintain a list by zoning district of unlisted uses
# approved by the planning commission and the list shall have the same
# effect as an amendment to the use provisions of the applicable zone"
# (kcc.16.82.unlisted.txt#L26-L31). The list is not published with the code
# and was not found; if it names a fourplex in an older district, that
# district's refusal below is wrong. A doubt. A new request could not
# succeed: 16.82.040 A requires that "The use is not specifically listed in
# another zone as either a permitted use or a conditional use" (L36-L41),
# and Table 16.114-2 lists the fourplex in all four Kingston Terrace zones.
zones:
  # ------------------------------------------------------------------
  # THE OLDER RESIDENTIAL DISTRICTS, 16.84 to 16.100. 16.84.010 is the
  # housing-type table for all six: "R-9 R-12 R-15 R-24 SF AT", with rows for
  # single dwelling detached and attached, accessory dwelling, duplex,
  # manufactured home and "Multi-dwelling N P P P N P"
  # (kcc.16.84.single-use-residential.txt#L12-L31). There is no triplex and
  # no fourplex row, and multi-dwelling is five or more units by definition.
  # Each district's own permitted-use list (16.84.020 for R-9; 16.88.020 SF,
  # 16.92.020 AT, 16.94.020 R-12, 16.96.020 R-15, 16.100.020 R-24) names
  # residential homes, manufactured home parks, family care, residential
  # facilities, duplexes (AT) and accessory dwellings, and no fourplex
  # (kcc.16.88-16.100.residential-zones.txt#L13-L23,L61-L75,L112-L126,
  # L250-L265,L302-L317). Their conditional-use lists name no dwelling of
  # three or four units either. Refused.
  #
  # QUESTION FOR THE OWNER, not answered here. King City is inside Metro
  # and over a thousand people, a Large City under OAR 660-046-0020 (see
  # or/_state.yaml), and every one of these six districts permits a
  # detached single dwelling. The code itself names quadplexes three times
  # outside Kingston Terrace -- "Density maximums may not apply to
  # duplexes, quadplexes, triplexes, or cottage clusters" (16.146.030 A,
  # kcc.16.146.density.txt#L22-L31) and "Triplex/Quadplex Not applicable" as
  # a parking maximum (16.132.040, kcc.16.132.parking.txt#L214-L222) -- and
  # never admits one in a use table. Whether the state's model code applies
  # directly where a Large City's own table is silent is a legal question.
  # The conservative reading is the city's printed table: refused, and put
