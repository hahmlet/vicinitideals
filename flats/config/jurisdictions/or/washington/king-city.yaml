label: King City
kind: city
eligible: true
notes: >-
  DRAFT, cloud session 2026-09-29. Read from the King City Community
  Development and Zoning Code (Municipal Code Title 16) as Municode
  publishes it, publication 3913, Supplement No. 16 (August 2026, through
  Ordinance O-2025-02). Every value is draft. Two maps paint the city. The
  city's zoning layer (services8.arcgis.com/NsUn9YuPFCjrkDe3,
  King_City_Current_and_Future_Zoning_Map_WFL1 FeatureServer layer 1, field
  ZONECLASS) carries the older districts and five county codes marked
  "(WC)"; the Kingston Terrace neighbourhoods are on layer 4 of the same
  service (field Zoning_Designations), under their names, not their codes.
  The zone keys are the district designations of 16.80.020; the layer-1
  spellings R9 and R12 and the four layer-4 names are aliases, and the (WC)
  codes are county pockets under 16.80.050 A. Lots reach this layer by the
  taxlots' JURIS_CITY KING CITY. Only the four Kingston Terrace zones
  admit the pod: the older districts' housing-type table (16.84.010) has no
  triplex or fourplex row, which is a question for the owner.
ingest:
  geoid: null
  juris_city_codes:
  - KING CITY
# The references the binding ledger stood beside an encoded value, read
