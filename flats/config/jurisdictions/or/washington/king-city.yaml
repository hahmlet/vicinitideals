  # ------------------------------------------------------------------
  # KINGSTON TERRACE, Chapter 16.114 (Ordinance 2023-04). Four
  # neighbourhood zones in 16.80.020: KTTC Town Center, KTBB Beef Bend,
  # KTC Central, KTRC Rural Character. Table 16.114-2 prints "Duplex,
  # Triplex, Fourplex1 Y Y Y Y", Y meaning "Uses Allowed Outright"
  # (16.114.040 A), and 16.114.150 B.2: "Middle housing development on an
  # existing lot is allowed outright subject to design and dimensional
  # standards and HCA standards but exempt from development plan review",
  # a Type I decision (C.3). Table 16.114-1 leaves only 16.80, 16.82,
  # 16.84.060 and 16.114 of Article III in force here, so the older
  # districts' tables do not reach these zones.
  #
  # THE DIMENSIONAL TABLE, 16.114-4, "Residential Use Types" block. Column
  # order "Town Center, Beef Bend, Central, Rural Character" on both pages.
  # Footnote markers are glued to the figures: "1,50016" is 1,500 with note
  # 16, "2017" is 20 with note 17. The notes print without a period
  # ("16 The minimum lot size...").
  #
  # - LOT AREA. 1,500 / 1,500 / 2,400 / 2,400. Note 16 (Town Center and
  #   Beef Bend): the minimum for "Dwelling, single-family attached,
  #   Duplex, Triplex, and Fourplex ... may be reduced to 1,000 square
  #   feet". Held at the printed figure, the stricter reading of "may be";
  #   the pod's own footprint is 2,000 square feet, so neither can bind.
  # - LOT WIDTH 20, note 17 (15 for the same types), all four; DEPTH 45 /
  #   45 / 60 / 60.
  # - FRONT "10/26", a minimum and a maximum, both held
  #   (setback_front_max_ft). NOT ENCODED: the porch row, "5/15" and
  #   "6/15"; the pod carries no porch in the catalog, and the minimum is
  #   looser than the building's.
  # - GARAGE 18 from the front and 18 on a corner.
  # - CORNER. "Corner lot setback -- front yard/side yard, minimum 8" and
  #   "Side yard -- to public street, minimum 5". The 8 is held as the street
  #   side (the stricter of the two rows that reach a street side yard). It
  #   would also let a corner lot's front come in to 8; that relief is NOT
  #   ENCODED, and with front_lot_line_corner: both the envelope gives each
  #   street line the stricter of the front (10) and the street side (8).
  # - INTERIOR SIDE "0 or 3" (Town Center, Beef Bend, Central). Note 18:
  #   "There is no minimum setback for zero foot setback buildings. In all
  #   cases, zero foot setback buildings shall either: (1) be attached at the
  #   property line; or (2) have a total minimum separation of 6 feet
  #   between buildings." The pod is attached to nothing across its lot
  #   line, and the separation turns on a neighbour's building, which
  #   nothing holds; 3 is held. Rural Character prints "5" with note 19:
  #   "Side yard of 5 feet for a single-story structure, and 10 feet for
  #   two-story structures." The pod is two stories: 10.
  # - REAR 10 (note 20 is an accessory building's). NOT ENCODED: the alley
  #   rows, 3 feet to a building on an alley and "0-6" to a garage entry
  #   (note 21, "or greater than 18"); the envelope reads an alley line as
  #   a rear or side line and holds the 10.
  # - HEIGHT N/A / 45 / 35 / 35; Town Center's N/A is held as an exemption.
  #   Measured to the highest point (16.24.020), so the pod's 26 feet is its
  #   ridge.
  # - COVERAGE. "Maximum coverage of buildings and impervious surfaces 90%
  #   90% 90% 80%", note 24 (not cottage clusters), and 16.24.020 counts
  #   "buildings, driveways, sidewalks and parking areas": max_impervious_pct,
  #   read against the pod's footprint plus the court and drive the screen
  #   draws (2026-09-30). Walks it does not draw are not counted, a few
  #   square feet looser than the code.
  # - NOT ENCODED: note 14, "building setbacks for each type of structure
  #   must comply with the current Oregon Building Code". A building-code
  #   separation, not a zoning yard.
  #
  # DENSITY. Table 16.114-3, "Minimum net density assigned to each
  # development (dwelling units per net acre) 22 18 10 8", with net density
  # "gross area less streets (public and private), parks and open space,
  # storm facilities, natural resources, and uses that are not residential"
  # (16.114.050 B). Held as min_density_du_per_acre. The state layer
  # relieves maximums only ("Minimum density is untouched", or/_state.yaml).
  # Four homes at 22 an acre cap a Town Center lot near 7,900 square feet
  # (18: 9,680; 10: 17,424; 8: 21,780), before any natural-resource area is
  # netted out, which would shrink the net acre and loosen the cap. Whether
  # "each development" reaches a single fourplex on an existing lot, which
  # B.2 sends straight to a building permit, is read the stricter way; a
  # doubt. NOT ENCODED: the second row, the neighbourhood-wide unit
  # targets (1,870 / 1,260 / 350 / 320), which bind no lot. No maximum is
  # printed.
  #
  # NOT ENCODED, all four zones: 16.114.060, the design standards (Table
  # 16.114-5 applies articulation, eyes on the street, main entrance,
  # detailed design and transitional space to a fourplex's street-facing
  # elevations; the main entrance must face the street within eight feet
  # of the longest street-facing wall). Design, not placement.
  # 16.114.080-16.114.090, the Habitat Conservation Area standards: a
  # per-area overlay nothing measures (the handoff has it); 16.114.090's
  # own relief (lot size down by up to 1,000 square feet, yards by up to
  # half, height up ten feet for a smaller footprint) is looser and is not
  # encoded either. 16.114.120 streets and dedication, which take ground
  # from a lot nothing measures.
  # ------------------------------------------------------------------
