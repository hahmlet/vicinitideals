  "5.05":
    outcome: other_building
    note: >-
      Liquor license review, for retail sales and service: Table 16.114-2
      note 3 (16.114.040.txt L57) and 16.102.020 F and
      16.102.030 B in NMU (kcc.16.102.nmu.txt L34-L37, L61-L64). A shop, not
      a dwelling.
  "16.156":
    outcome: other_path
    note: >-
      Conditional Uses. 16.114.040 B sets the approval criteria for a
      conditional use in Kingston Terrace there (L119-L122), and Table
      16.114-2's notes 4 to 12 send individual non-dwelling uses to
