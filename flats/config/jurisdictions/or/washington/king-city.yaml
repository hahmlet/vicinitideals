# THE MAP'S OTHER CODES. Layer 1 spells two districts without their hyphen
# and carries five county codes marked "(WC)"; layer 4 names the Kingston
# Terrace zones instead of coding them, and paints one area "Neighborhood
# Mixed Use" that is no Kingston Terrace zone. Counted on 2026-09-29.
#
# THE (WC) CODES ARE POCKETS. 16.80.050 A: "Zoning regulations applicable
# to an area prior to annexation to the city shall continue to apply and
# shall be enforced by the city until a zone change for the area has been
# adopted by the city council" (kcc.16.80.general.txt L84-L99). Unlike
# Beaverton's 10.40.1 no city chapter supersedes any part of it, so a lot
# the map marks with a county code screens under the county's layer and
# that district, as the Beaverton WAcnty pocket does. Each label names its
# county district, so the pocket names it too rather than reading the map.
zone_rulings:
  R9:
    outcome: alias
    of: R-9
    note: >-
      "R9", "Residental 9 units/acre", 25 features on the city's zoning
      layer (ZONECLASS) on 2026-09-29. The map's spelling of R-9, Small Lot
      and Attached Residential, in the 16.80.020 district list
      (kcc.16.80.general.txt L32). One district, two spellings; the block is
      R-9.
  R12:
    outcome: alias
    of: R-12
    note: >-
      "R12", "Attached Residential 12 units/acre", 14 features on the
      city's zoning layer (ZONECLASS) on 2026-09-29. The map's spelling of
      R-12, Attached Residential, in the 16.80.020 district list
      (kcc.16.80.general.txt L33). One district, two spellings; the block is
      R-12.
  Town Center:
    outcome: alias
    of: KTTC
    note: >-
      "Town Center", three features on the Kingston Terrace Zone
      Designations layer (layer 4, Zoning_Designations) on 2026-09-29. The
      map's name for KTTC, Kingston Terrace Town Center Mixed-Use, in
      16.80.020 (kcc.16.80.general.txt L45-L47) and the "Town Center"
      column of Tables 16.114-2 to 16.114-4.
  Beef Bend Neighborhood:
    outcome: alias
    of: KTBB
    note: >-
      "Beef Bend Neighborhood", one feature on the Kingston Terrace Zone
      Designations layer (layer 4, Zoning_Designations) on 2026-09-29. The
      map's name for KTBB, Kingston Terrace Beef Bend Neighborhood, in
      16.80.020 (kcc.16.80.general.txt L48-L50) and the "Beef Bend
      Neighborhood" column of Tables 16.114-2 to 16.114-4.
  Central Neighborhood:
    outcome: alias
    of: KTC
    note: >-
      "Central Neighborhood", four features on the Kingston Terrace Zone
      Designations layer (layer 4, Zoning_Designations) on 2026-09-29. The
      map's name for KTC, Kingston Terrace Central Neighborhood, in
      16.80.020 (kcc.16.80.general.txt L51) and the "Central Neighborhood"
      column of Tables 16.114-2 to 16.114-4.
  Rural Character Neighborhood:
    outcome: alias
    of: KTRC
    note: >-
      "Rural Character Neighborhood", two features on the Kingston Terrace
      Zone Designations layer (layer 4, Zoning_Designations) on 2026-09-29.
      The map's name for KTRC, Kingston Terrace Rural Character
      Neighborhood, in 16.80.020 (kcc.16.80.general.txt L52-L54) and the
      "Rural Character Neighborhood" column of Tables 16.114-2 to 16.114-4.
  Neighborhood Mixed Use:
    outcome: unencodable
    note: >-
      "Neighborhood Mixed Use", one small feature (OBJECTID 23) on the
      Kingston Terrace Zone Designations layer (layer 4) on 2026-09-29. Not
      one of the four Kingston Terrace zones 16.114.030 A names
      (kcc.16.114.kingston-terrace.txt L107-L110) and not a column of any
      Kingston Terrace table. The city's NMU district (Chapter 16.102) has
      the same name, but Table 16.114-1 leaves only 16.80, 16.82, 16.84.060
      and 16.114 of Article III in force inside the plan district (L57-L62),
      so reading the feature as NMU would apply a chapter the district
      exempts. Left open, not guessed; the handoff asks.
  R-6 (WC):
    outcome: pocket
    of: or/washington/_unincorporated
    zone: R-6
    note: >-
      "R-6 (WC)", "County Zoning Residental - 6 units/acre", one feature on
      the city's zoning layer (ZONECLASS) on 2026-09-29. Washington County's
      R-6 kept on annexed land: 16.80.050 A continues the county's zoning,
      enforced by the city, until the council adopts a zone change
      (kcc.16.80.general.txt L84-L99). See the comment above zone_rulings.
