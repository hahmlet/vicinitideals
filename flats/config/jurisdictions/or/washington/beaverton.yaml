  # ------------------------------------------------------------------
  # BDC Chapter 70, Downtown Design District (RC-BC, RC-OT, RC-MU,
  # RC-DT). 70.05.15.7 exempts Downtown development from Chapter 20
  # except 20.25 and from 60.05 except lighting, so none of the 20.xx or
  # 60.05 rules above reach these four zones; 60.30 (parking ratios and
  # stall and aisle dimensions) still does. Each zone prints a height and
  # density table and a setback table; the pod has ground-floor units, so
  # the "with ground floor residential units" rows are read. Surface
  # parking is Table 70.20.05.7.A S5: not along the primary frontage
  # between facade and street (a), not in the front minimum setback (b),
  # 5 feet from all property lines (c), alleys exempt (d). NOT ENCODED:
  # S5.c on side and rear lines (no field); the street-facing side
  # maximums; minimum FAR (no field); the reduced minimums for small
  # pre-1999 sites (70.15.10.5). RC-BC, RC-OT and RC-MU owe their side
  # and rear setback beside "property zoned residential and/or Downtown
  # Transition (DT)"; that stricter row is the base value and the interior
  # 0 is the variant (see RC-BC). RC-DT's own row names only residential.
  # ------------------------------------------------------------------
  RC-BC:
    cite_default:
      cite: "Beaverton BDC 70.15.10 (RC-BC Beaverton Central), Tables 70.15.10.1.A and 70.15.10.1.B"
