definitions:
  # Read 2026-09-29 from BDC Chapter 90, which is on disk whole.
  #
  # THE NOUN. "Quadplex. Four dwelling units total on a single lot in any
  # configuration ... The units may also be located on four child lots
  # created through a middle housing land division" (L790-L792). The pod is
  # a Quadplex, and "Dwelling, Attached" names "attached configurations of
  # duplexes, triplexes, and quadplexes" (L728-L729). In MR, CM-MR, the
  # Commercial districts and the Multiple Use districts a Multi-Dwelling is
  # "attached dwellings in any number or configuration" (L781-L787), so the
  # pod is also a multi-dwelling there; in RMA, RMB, RMC and CM-RM a
  # multi-dwelling starts at five units, so the pod is only a Quadplex.
  # Each zone below cites the use-table row that names it.
  #
  # FRONT LOT LINE. "for a corner lot, a lot line abutting either street, as
  # determined by the applicant at the time of initial construction"
  # (L1420-L1422). Encoded as front_lot_line_corner: owner under defaults.
  #
  # NET ACRE. "Acreage, Net" deducts street dedications and common
  # driveways, "Environmentally constrained lands, such as open water areas,
  # floodplains, water quality facilities, wetlands, natural resource
  # areas", public tracts, and steep landslide-hazard slopes (L41-L53).
  # 20.25.05.1.A multiplies the net acreage by the zone's figure, so every
  # minimum and maximum density in this layer carries measured_on:
  # net_developable_area. The water quality facilities and wetlands are
  # Clean Water Services' ground; overlay data and local work.
  corner_lot:
    # "A lot located at the intersection of two or more streets. A lot
    # abutting on a curved street or streets shall be considered a corner lot
    # if straight lines drawn from the foremost points of the side lot lines
    # to the foremost point of the lot meet at an interior angle of less than
    # 135 degrees." "Less than 135" excludes 135 itself; the field takes the
    # figure as at-or-below, a one-degree gap recorded as a doubt. The
    # definition says nothing of alleys; alleys_count stays at its default.
    test: intersecting_frontages
    curve_at_or_below_deg: 135.0
    quote: "or/washington/beaverton/bdc.90.definitions.txt#L1412-L1414"
    cite: "Beaverton BDC Chapter 90, Lot, Corner"

defaults:
  # PARKING COUNT. 60.30.10.3.A.1: "No minimum parking is required for any
  # use." Encoded as zero rather than left out, because an omitted minimum
  # lets the state cap resolve as though it were a requirement.
  parking_min_per_unit:
    value: 0
    cite: Beaverton BDC 60.30.10.3.A.1, no minimum parking is required for any use
    url: https://online.encodeplus.com/regs/beaverton-or/export2doc.aspx?pdf=1&tocid=001&file=doc-001-pid-607.pdf
    retrieved: '2026-09-29'
    quote: "or/washington/beaverton/bdc.60.30.parking.txt#L59-L60,L63-L64"
  # PARKING MAXIMUM. Table 60.30.10.5.A row 4.A, "Duplex, Triplex, Quadplex,
  # or Townhouse in Other Zone - One bedroom (per unit)", 1.8 in Zone A and
  # Zone B alike. Rows 4.B onward raise the figure with bedroom count, and
  # the pod's bedroom count is not a site fact: the one-bedroom row is the
  # lowest and the conservative reading. The RMA, RMB, RMC and CM-RM zones
  # print N/A (row 2) and override this below. 1.8 per unit is 7.2 stalls
  # for four units; a doubt for the pod's parking count.
  parking_max_per_unit:
    value: 1.8
    cite: Beaverton BDC Table 60.30.10.5.A, row 4.A Quadplex in Other Zone, one bedroom
    url: https://online.encodeplus.com/regs/beaverton-or/export2doc.aspx?pdf=1&tocid=001&file=doc-001-pid-607.pdf
    retrieved: '2026-09-29'
    quote: "or/washington/beaverton/bdc.60.30.parking.txt#L105,L109-L116,L129-L132"
  # STALLS. 60.30.10.7: "For all residential uses, any provided parking
  # space shall not be less than 8 1/2 feet wide and 18 1/2 feet long", which
  # is also the 90-degree row of the 60.30.15 table.
  parking_stall_width_ft:
    value: 8.5
    cite: Beaverton BDC 60.30.10.7, Residential Parking Dimensions; 60.30.15 table, 90 degrees
    url: https://online.encodeplus.com/regs/beaverton-or/export2doc.aspx?pdf=1&tocid=001&file=doc-001-pid-607.pdf
    retrieved: '2026-09-29'
    quote: "or/washington/beaverton/bdc.60.30.parking.txt#L583-L584,L652,L689,L693"
  parking_stall_depth_ft:
    value: 18.5
    cite: Beaverton BDC 60.30.10.7, Residential Parking Dimensions; 60.30.15 table, 90 degrees
    url: https://online.encodeplus.com/regs/beaverton-or/export2doc.aspx?pdf=1&tocid=001&file=doc-001-pid-607.pdf
    retrieved: '2026-09-29'
    quote: "or/washington/beaverton/bdc.60.30.parking.txt#L583-L584,L652,L689,L693"
  # AISLES. 60.30.15 note 5: "The minimum aisle width for two-way traffic
  # ... is 24 feet. The minimum aisle width for emergency vehicle access
  # (one way traffic) is 20 feet. Except as permitted in Section 60.30.15.
  # Note 8(c)." Note 8(c) (22 two-way, 20 one-way) governs middle housing
  # in RMA, RMB, RMC and CM-RM and overrides these below.
  parking_aisle_two_way_ft:
    value: 24
    cite: Beaverton BDC 60.30.15 note 5 and table, 90 degrees
    url: https://online.encodeplus.com/regs/beaverton-or/export2doc.aspx?pdf=1&tocid=001&file=doc-001-pid-607.pdf
    retrieved: '2026-09-29'
    quote: "or/washington/beaverton/bdc.60.30.parking.txt#L652,L674-L676,L689,L693"
  parking_aisle_one_way_ft:
    value: 20
    cite: Beaverton BDC 60.30.15 note 5, one-way aisle
    url: https://online.encodeplus.com/regs/beaverton-or/export2doc.aspx?pdf=1&tocid=001&file=doc-001-pid-607.pdf
    retrieved: '2026-09-29'
    quote: "or/washington/beaverton/bdc.60.30.parking.txt#L652,L674-L676"
  front_lot_line_corner:
    value: owner
    cite: Beaverton BDC Chapter 90, Lot Line, Front (corner lot, either street, as determined by the applicant)
    url: https://online.encodeplus.com/regs/beaverton-or/export2doc.aspx?pdf=1&tocid=001&file=doc-001-pid-607.pdf
    retrieved: '2026-09-29'
    quote: "or/washington/beaverton/bdc.90.definitions.txt#L1420-L1422"

# THE LAYER-WIDE REFUSALS, one per standard, read 2026-09-29. Each applies
# in every zone below unless the zone says otherwise.
#
# NOT ENCODED: minimum FAR. The Multiple Use table prints a minimum floor
# area ratio (row B.1, 0.30 to 0.60; bdc.20.20.multiple-use.txt#L106-L108)
# and the Cooper Mountain table one for CM-CS and CM-HDR (row I.1, 0.4;
# bdc.20.22.cooper-mountain.txt#L111). No field holds a floor on FAR. A
# four-unit pod on a large lot can fall under it; a doubt.
#
# NOT ENCODED: the frontage occupancy of 60.05.15.6.A, "At least 60
# percent of the site's Primary Frontage ... shall be occupied by a
# building" (bdc.60.05.design-review-standards.txt#L272-L273), and the
# lower percentages that follow. No field holds a building share of
# frontage. The pod's 26-foot-deep building across a 30-to-40-foot
# frontage may meet it; nothing checks it.
#
# THE MINIMUM-DENSITY ESCAPE. 20.25.05.1.A lets a project below minimum
# density proceed if it shows "how, in all aspects, future intensification
# of the site to the minimum density or greater can be achieved"
# (bdc.20.25-30.density-height.txt#L6-L13), and D.2 gives RMA, RMB, RMC and
# CM-RM three ways through, one of them a plan for future partitioning
# (L47-L61). No field holds a "may fall short if it shows" path. Every
# minimum density is encoded as a hard floor, the conservative reading; a
# doubt and a question for Steph, because on a large lot it turns the pod
# RED where the code may allow it.
#
# NOT ENCODED: rounding. The minimum unit count is net acres times the
# figure, "rounded up" at 0.5 and down below (L20-L24). The engine compares
# density, not a rounded unit count; on small lots the rounding can lower
# the floor below what the density figure implies.
#
# NOT ENCODED: 60.05.11.3, the choice between the design STANDARDS
# (60.05.15 to 60.05.30) and the GUIDELINES (60.05.35 to 60.05.50)
# (bdc.60.05.design-review-standards.txt#L46-L56). The guidelines track has
# no numbers to encode; the standards track is encoded, the stricter one.
#
# NOT ENCODED: garage setbacks. The residential tables print separate
# garage setbacks (F.1.c and the like); the pod has no garage.
#
# NOT ENCODED: the middle housing design rules of 60.05.60 beyond the
# figures encoded in the RMA, RMB, RMC and CM-RM zones (entry orientation,
# windows, articulation). They are design review items nothing measures.
#
# NOT ENCODED: unit lots. A quadplex divided by a middle housing land
# division keeps the parent lot's standards: "the development standards that
# are applicable to the lot shall apply to the middle housing parent lot,
# not to the middle housing child lots" (bdc.20.05.residential.txt
# #L382-L384; bdc.20.22.cooper-mountain.txt#L245-L247). The townhouse
# minimum lots (B.3 of each table) are a different path and are not encoded
# as variants; the pod is screened as a quadplex on one lot.
#
# NOT ENCODED: the overlays of 10.32, Historic (HO), Resource (RO) and
# Cooper Mountain Parks (CMPO) (bdc.10.general-provisions.txt#L244-L253).
# They are not in ZONE_NAME; each is overlay data and local work.
#
# CLEAN WATER SERVICES. The net acreage definition deducts water quality
# facilities, wetlands and natural resource areas
# (bdc.90.definitions.txt#L44-L46); the vegetated corridors behind them are
# Clean Water Services' Design and Construction Standards, not the BDC.
# Overlay work.
#
# THE ANNEXATION CONDITION (UPAA §V.D). "When partially completed
# developments ... are annexed to the CITY after receiving development
# approval from the COUNTY, the CITY may, at its discretion, continue to
# apply the COUNTY's development standards relating to setbacks, lot sizes,
# lot coverage and heights for buildings and accessory structures for any
# new construction taking place after annexation" (wc.beaverton-upaa.txt
# #L282-L287). The first draft qualified every setback, minimum lot and
# height in the city by it, so no Beaverton lot could come back green.
# Steph ruled 2026-09-29 that the BDC governs: the clause is discretionary
# ("may"), it reaches only developments that were part-built when the city
# took them over, and this screen is looking for new projects on finished
# ground. The qualification is removed. Recorded, because the clause's own
# words do say "any new construction": a lot inside a county-approved
# subdivision annexed mid-build could still be held to county yards. A
# known unknown, not a hold.
#
# STEP 10, the prohibition grep: every stored document was searched for
# "quadplex", "plex" and "middle housing". The hits are the use tables
# (20.05, 20.10, 20.20, Chapter 70), the definitions, the parking tables
# and yard rules of 60.30, the middle housing standards of 20.22 and 60.05,
# and the land-division and design-review procedures of 40.21 and 40.45.
# None prohibits the pod in a zone this layer admits it in; the one "N" is
# the use-table cell each refusing zone below cites.

zones:
  # ------------------------------------------------------------------
  # BDC 20.05, Residential Zoning Districts. Table 20.05.15 (site
  # development standards, columns MR RMA RMB RMC) and Table 20.05.20.A
  # (land uses). The tables print footnote markers hard against the
  # numbers ("158" is 15 feet with note 8), which the code entry declares.
  # The side setback rows (F.2) are written for townhouses and for land
  # divisions; a quadplex on one lot has no row of its own, and the
  # perimeter figure (5) is taken as the conservative reading. A doubt.
  # ------------------------------------------------------------------
  MR:
    cite_default:
      cite: "Beaverton BDC 20.05 (MR Multi-Unit Residential), Tables 20.05.15 and 20.05.20.A"
      url: https://online.encodeplus.com/regs/beaverton-or/export2doc.aspx?pdf=1&tocid=001&file=doc-001-pid-607.pdf
      retrieved: '2026-09-29'
    quadplex_allowed:
      # P8: note 8, "In the MR zone, all units of a duplex, triplex, or
      # quadplex must be attached". The pod is attached.
      value: true
      cite: "Beaverton BDC Table 20.05.20.A, 2.D Residential Dwellings - Triplex and Quadplex (MR P8)"
      quote: "or/washington/beaverton/bdc.20.05.residential.txt#L461,L469,L474,L533"
    min_lot_sqft:
      exempt: true
      cite: "Beaverton BDC Table 20.05.15, B.2 Minimum Lot Area - Triplex and Quadplex (MR N/A)"
      quote: "or/washington/beaverton/bdc.20.05.residential.txt#L41,L44-L45,L50-L52"
    min_density_du_per_acre:
      value: 34
      cite: "Beaverton BDC Table 20.05.15, D. Minimum Residential Density"
      quote: "or/washington/beaverton/bdc.20.05.residential.txt#L41,L44-L45,L62"
      measured_on:
        fact: net_developable_area
        cite: "Beaverton BDC Chapter 90, Acreage, Net; 20.25.05.1.A, minimum density is the net acreage times the zone's figure"
        quote: "or/washington/beaverton/bdc.90.definitions.txt#L41-L53"
    min_lot_width_ft:
      value: 14
      cite: "Beaverton BDC Table 20.05.15, E. Minimum Lot Width"
      quote: "or/washington/beaverton/bdc.20.05.residential.txt#L41,L44-L45,L63"
    setback_front_ft:
      value: 10
      cite: "Beaverton BDC Table 20.05.15, F.1.a Front Yard Minimum"
      quote: "or/washington/beaverton/bdc.20.05.residential.txt#L41,L44-L45,L64"
    setback_front_max_ft:
      # Note 18: the maximum applies to all development other than
      # townhouses, on the portion of the site subject to the frontage
      # requirement of 60.05.15.6.
      value: 20
      cite: "Beaverton BDC Table 20.05.15, F.1.b Front Yard Maximum (MR 20, note 18)"
      quote: "or/washington/beaverton/bdc.20.05.residential.txt#L41,L44-L45,L65,L415-L417"
    setback_side_ft:
      # MR prints "0 internal, 5 external" for townhouses and N/A for
      # land divisions; 5 is the external figure.
      value: 5
      cite: "Beaverton BDC Table 20.05.15, F.2.a Side Yard Minimum (MR, 5 external)"
      quote: "or/washington/beaverton/bdc.20.05.residential.txt#L41,L44-L45,L66-L69"
    setback_rear_ft:
      value: 15
      cite: "Beaverton BDC Table 20.05.15, F.3 Rear Yard Minimum"
      quote: "or/washington/beaverton/bdc.20.05.residential.txt#L41,L44-L45,L84"
    max_height_ft:
      # G.1 prints N/A for MR and G.2 applies the 60.05.15.7 transition,
      # encoded as the variant. Neither binds a 26-foot building.
      exempt: true
      cite: "Beaverton BDC Table 20.05.15, G.1 Building Height - Maximum (MR N/A)"
      quote: "or/washington/beaverton/bdc.20.05.residential.txt#L87-L88,L113-L116"
      variants:
        - value: 60
          when: [abuts_residential_zone]
          cite: "Beaverton BDC 60.05.15.7.A, height transition within 30 feet of RMA, RMB or RMC (60 feet or the abutting zone's maximum, whichever is greater)"
          quote: "or/washington/beaverton/bdc.60.05.design-review-standards.txt#L328-L333"
    max_far:
      # 20.05.16: 6.0 near Frequent Transit Service, 4.0 otherwise, and in
      # the Allen Boulevard quarter mile 6.0 only with 30 percent regulated
