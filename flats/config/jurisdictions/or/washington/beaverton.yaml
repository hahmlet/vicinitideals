zone_rulings:
  WAcnty:
    outcome: pocket
    of: or/washington/_unincorporated
    zone: map
    note: >-
      "WAcnty", the value the city's zoning layer (pubZoning layer 0,
      ZONE_NAME) gives 90 features on 2026-09-29, 646.4 acres between them
      by the layer's own area field. It is not a Beaverton district: it marks land annexed to
      the city that still carries the county's zoning. BDC 10.40.1: "Any
      area annexed to the City shall retain the zoning classification of its
      former jurisdiction until changed by the City. In the interim period,
      the City shall enforce the zoning regulations of the former
      jurisdiction ... except that the provisions of Chapters 30 through 80
      of this Code shall supersede comparable provisions"
      (bdc.10.general-provisions.txt L284-L290); 10.40.3.A quotes UPAA §V.B,
      under which the city rezones "corresponding as closely as possible to
      designations already adopted by the County" (L297-L300). So the lot
      screens under the unincorporated layer, with the district read off the
      county's own map. Two doubts go with it. First, the supersession: the
      city's Chapter 60 (parking, design review) replaces the county's
      comparable rules on these lots, and the unincorporated layer carries
      the county's; which of its parking and design figures give way is not
