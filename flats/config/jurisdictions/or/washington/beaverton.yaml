label: Beaverton
kind: city
eligible: true
notes: >-
  DRAFT, cloud session 2026-09-29. Read from the Beaverton Development Code
  (BDC) as the city's encodeplus host exports it whole ("Date Printed:
  September 28, 2026"), with the Washington County - Beaverton Urban
  Planning Area Agreement (UPAA) for the annexation rules. Every value is
  draft. The zone keys are the district abbreviations of BDC 10.25 and
  Chapter 20 as the city's own zoning layer spells them
  (gisweb.beavertonoregon.gov Public_SharedServices/pubZoning MapServer
  layer 0, field ZONE_NAME); lots reach this layer by the taxlots'
  JURIS_CITY BEAVERTON. The two layer values that are not districts,
  WAcnty and ROW, are ruled under zone_rulings at the end of the file.
ingest:
  geoid: null
  juris_city_codes:
  - BEAVERTON
