# Wide/shallow pod -- 4 x 20 x 25 ft units, 500 sqft ground each.
#
# The one design FLATS screens (Steph, 2026-11-12, rulings.yaml
# 2026-11-12-single-design-80x25-20ft): four attached townhomes in a row,
# each 20 ft wide and 25 ft deep, two storeys, flat roof, each front door on
# the home's 20 ft wall, so the building is 80 x 25 with every door along
# the 80 ft face. width_ft is that face, parallel to the front lot line
# before any rotation. Parking, roof and doors are the 2026-11-08 single-
# design ruling's, unchanged; only the size and the heights moved.
#
# Version 3, 2026-11-12: the same footprint as pod80x25@2 at a new height
# (20 ft overall, 9 ft 2 in storeys, where @2 was 26 ft with a 12 ft ground
# storey). A height change is dimensional, so the version moved; @2 stays
# loadable as pod80x25_v2.yaml because run results name it. It replaced
# pod80x30@1, archived the same day.
version: 3
label: "Pod 80 x 25 — 4 x 20 ft units"
typology: townhome_rear_court
footprint: {width_ft: 80, depth_ft: 25}
units: 4
stories: 2
# Steph, 2026-11-12: "Yes: 20x25, 20 ft tall" ("We're gunna be 20ft tall
# unless we go to a pitched roof"). The overall height to the top of the
# flat roof.
height_ft: 20
# Steph, 2026-11-12: "Each floor is 8' wall with 14" truss for either the
# ceiling of the ground floor or for the roof of the top floor" -- 8 ft +
# 14 in = 9 ft 2 in floor to floor, the ground storey and the upper alike,
# 18 ft 4 in of structure inside the 20 ft. 9 ft 2 in is 9.1667 ft; it is
# held a hair under (9.1666) so a code minimum of exactly 9 ft 2 in is not
# claimed met by rounding. This replaces the 12 ft ground storey Steph
# stated 2026-10-01: a code minimum first-storey height above 9 ft 2 in
# (Tigard TMU's 12 ft) now misses.
ground_story_ft: 9.1666
# Steph, 2026-10-21, asked whether the roof is flat: "the intent is to. So
# this would be a red flag" (rulings.yaml 2026-10-21-pod-roof-flat). A code
# that sets a minimum pitch or prohibits flat roofs misses on it.
roof_pitch_in_12: 0
# Every front door is on the 80 ft face (Steph 2026-11-08, rulings.yaml
# 2026-11-08-single-design-80x30, standing under 2026-11-12). A code that
# makes the main entrance face the street then decides whether the
# building may stand turned, its 25 ft end to the street
# (entrance_faces_street, FOLLOWUPS 153).
door_face: width
parking:
  # The county map's bands: floor charged, target sells, preferred is where
  # the seat count stops. Unchanged (see pod56x36.yaml).
  stalls_per_unit: {floor: 1.0, target: 1.5, preferred: 2.0}
  config: rear_court
delivery:
  method: panelized
notes: >-
  The single screened design since 2026-11-12. 20 ft homes put two bedrooms
  side by side; 500 sqft a floor, 1,000 a home. Its 80 ft frontage is the
  binding constraint on most narrow city lots; its 25 ft depth leaves more
  rear yard for the parking court than pod80x30 did, and its 20 ft height
  clears more ceilings and height planes but misses more height floors.
assumptions:
  - "height_ft 20: the overall height, flat roof (Steph, 2026-11-12,
     rulings.yaml 2026-11-12-single-design-80x25-20ft). Product intent, not
     a drawing set."
  - "ground_story_ft 9.1666: each storey, ground and upper, is 9 ft 2 in
     floor to floor -- an 8 ft wall plus a 14 in truss (Steph, 2026-11-12).
     Product intent, not a drawing set."
  - "roof_pitch_in_12 0: the roof is flat (Steph, 2026-10-21). Product
     intent, not a drawing set."
  - "footprint 80 x 25 and the door on each home's 20 ft wall: Steph,
     2026-11-08 (doors) and 2026-11-12 (size). Product intent, not a drawing
     set."
  - "Delivery method is the product intent (factory-built); module dimensions
     and crane needs are unspecified until the set-access stage (Phase 4)."
