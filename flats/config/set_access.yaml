      quote: "books/street-standards/multnomah-county/dcm.pdf p.30 (table, image; dcm.txt#L1034)"
      url: https://multco.us/file/multnomah_county_design_and_construction_manual/download
    or/washington/cornelius:
      pieces: [6, 5]
      label: Cornelius PWS 5.04(a) Local Street
      cite: >-
