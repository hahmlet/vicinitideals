  size: "10 x 8"
  weight_lb: "4,100-4,600"

# Whole trailer loads (spec 4.5, the 45 t only): lifted off the trailer and
# landed where the trailer stood (Steph 2026-11-14), then set piece by piece
# from the ground. `stack_lb` and `length_ft` as printed; `landing` from
