    stack_lb: "4,138"
    length_ft: "25"
    landing: "26 x 9"
    within_ft: "~50"
  roof_cassettes:
    label: Roof-cassette stack (load 4, 2 a load)
    stack_lb: "4,918"
    length_ft: "25"
    landing: "26 x 9"
    within_ft: "~50"

# The street's pavement width where no source records it (FOLLOWUPS 145
# part B, Steph 2026-11-15: "estimate the rest, always labelled as
# estimated"; and, 2026-11-15, "Each city's standard"). Read by
# flats/geom/street_width.py for the 45 t's street set-up and the delivery
# truck at the curb in front of it, and nowhere else (no lot colour, no fire
# hose). The right-of-way is the gap between the private lots either side of
# the centreline, read square to it. Then, by place (a key is a
# jurisdiction layer; the nearest one up the path governs, else `default`):
#
# 1. `sections`: where the place's street standard ties a right-of-way width
#    (or a printed range of them) to a pavement width, a right-of-way within
#    1 ft of a section's takes that section's pavement (curb to curb). Where
#    several sections match, the NARROWEST pavement is taken, and a printed
#    pavement range takes its narrow end (the cautious pick). Alternative
#    sections a city engineer may approve are listed too: they are built,
#    and only ever narrow the pick. Commercial / industrial, rural, hillside
#    and superseded sections are left out (none is a residential lot's
#    street, or still adopted).
# 2. Otherwise the pavement is the gap less `allowance_ft` (sidewalk,
#    planter strip, curb, the strip behind the walk) on EACH side: the
#    place's own where its standard prints the pieces, else the widest strip
#    a side of its tied sections (the loader derives it), else `default`.
# 3. No wider than `cap_ft`: the place's own, else the widest pavement its
#    standard prints (the loader derives it).
#
# Every figure is the standard's printed figure and cites where it is
# printed: stored code as `path#Lnn` (flats/provenance/docs/), a downloaded
# standard as `books/street-standards/<place>/<file>` with its page (the
# books are gitignored under data/flats/books/; the line where the text
# layer holds it), or is marked [est]. Places left on the default: Portland
# (PBOT's Development Review Manual is marked DRAFT UPDATES 5.11.22),
# Troutdale (only the 1994 Construction Standards were found; Resolution
# 1229 adopted a 1996 edition, not found), Milwaukie (PWS 5.0030 prints
# right-of-way and part ranges only, in a 2026 "for review" copy), and every
# place with no standard read.
street_width:
  allowance_ft:
    default:
      value: 12
      cite: >-
        [est] no street standard read for the place: a 6 ft sidewalk, a
        5.5 ft planter strip and 0.5 ft behind the walk, a little wider than
        most standards read (11-12 ft), so the estimate errs narrow
    or/clackamas/oregon-city:
      value: 11
      label: OCMC 16.12 Local/Residential
      cite: >-
        OCMC 16.12 street design standards, Local / Residential: 54 ft
        right-of-way, 32 ft pavement; 0.5 ft public access + 5 ft sidewalk
        + 5.5 ft landscape strip each side (54 - 32 = 2 x 11)
      quote: "or/clackamas/oregon-city/16.12.streets.txt#L411"
      header: "or/clackamas/oregon-city/16.12.streets.txt#L394-L395"
    or/clackamas/canby:
      pieces: [6, "0-8"]
      label: Canby PWDS Att. A (TSP Fig 7-6)
      cite: >-
        Canby Public Works Design Standards (rev. Dec 2019), Attachment A,
        TSP Figure 7-6, Standard and Low-Volume Local Street: 6 ft sidewalk
        and a 0-8 ft buffer each side; the wider end taken (14 ft). The
        figure prints right-of-way RANGES (50-62, 40-60 ft), so no width
        ties to one section.
      quote: "books/street-standards/canby/2020_public_works_standards.pdf p.42 (figure, image)"
      url: https://www.canbyoregon.gov/sites/default/files/fileattachments/streets_and_sewer/page/22533/2020_public_works_standards.pdf
    or/clackamas/gladstone:
      pieces: [6, "5-6"]
      label: Gladstone TSP 2017 Table 19
      cite: >-
        Gladstone TSP (Adoption Draft Dec 2017; GMC 17.50.040 defers to its
        Table 16), Table 19 Local Street Cross Section Standards: sidewalks
        6 ft, landscape strips 5-6 ft (the wider end taken: 12 ft a side).
        Table 16 prints one right-of-way range for every local street
        (34-64 ft) and Exhibit 8 titles the pavements only (34, 28, 24 ft),
        so no width ties to a section.
      quote: "books/street-standards/gladstone/gladstone_tsp_2017_vol1.txt#L2830-L2840 (PDF p.80, printed p.59)"
      header: "books/street-standards/gladstone/gladstone_tsp_2017_vol1.txt#L2730-L2737"
      url: https://digitalcollections.library.oregon.gov/assets/downloadwiz/342270
    or/clackamas/sandy:
      pieces: [6.5, 5.5]
      label: Sandy TSP 2023 Fig 17
      cite: >-
        Sandy TSP 2023 (Ord. 2023-24, adopted 6/21/2023), Table 4 / Figure 17
        Local: 54 ft right-of-way (also SDC 17.100.60), 6.5 ft sidewalk and
        5.5 ft planter strip / curb each side
      quote: "books/street-standards/sandy/tsp-2023-exhibit-a.txt#L1780 (PDF p.59, Figure 17)"
      header: "or/clackamas/sandy/sdc.17.100.txt#L1324"
      url: https://www.ci.sandy.or.us/sites/default/files/exhibit_a._2023_sandy_transportation_system_plan.pdf
    or/clackamas/wilsonville:
      value: "10.5-12"
      label: Wilsonville PWS RD-1015
      cite: >-
        Wilsonville Public Works Standards drawing RD-1015 Residential Street
        (4/2/14): "10.5' - 12'" back of curb to right-of-way each side (5 ft
        minimum walk, 5.5 ft planter); the wider end taken
      quote: "books/street-standards/wilsonville/rd-residential-street.pdf p.1 (drawing, image)"
      url: https://wilsonvilleoregon.gov/773/Detail-Drawings
    or/multnomah/_unincorporated:
