# Set access: where a mobile crane can set up on a lot and whether it can make
# every lift of the pod (FOLLOWUPS 145; flats/fit/set_access.py).
#
# HUMAN-OWNED. Every product figure below is Steph's, stored AS PRINTED in
# docs/followups/145-set-access-crane-truck.md ("Steph 2026-11-11"); the
# loader parses the printed text (8'1" -> 8.083 ft, "711-724" -> 711..724 lb)
# and takes the HIGH end of every range. An agent does not move one without a
# new ruling quoted here. A field left null is UNMEASURED: the solver reports
# it and never passes on it.
#
# NOT WIRED. Nothing here reaches the colour, the bound or a reason word yet:
# Steph has not set a colour policy and no load chart is in. The hook point is
# flats/ingest/quadfit.py slope_checked(), after the site grade is read (the
# drawing's building and court are final there and the Terrain is open):
# call flats.fit.set_access.solve(Site(...), grade_of=...) on the drawing.
#
# ---------------------------------------------------------------------------
# Conventions the solver relies on (prior art searched 2026-11-11: no open-
# source crane lift-planning library worth adopting -- four unlicensed hobby
# repos and paid tools only -- so these are taken from the standards and
# built here):
#
# * RADIUS is the horizontal distance from the crane's axis of rotation to the
#   centre of the hoist line with the load on it, i.e. over the load's centre
#   of gravity. ASME B30.5-2004 5-1.1.1(b)(2)
#   https://law.resource.org/pub/us/cfr/ibr/002/asme.b30.5.2004.pdf
#   The axis of rotation is taken at the centre of the setup pad unless a
#   chart's crane says otherwise (crane.rotation_offset_ft).
# * A load's radius is the LONGEST one at which it is handled: ASME B30.5
#   5-3.2.1.1(c), "the weight of the load does not exceed the crane ratings at
#   the maximum radius at which the load is to be handled". So each load's
#   governing radius = max(pick-up radius, set radius), over every piece of
#   that load.
# * GROSS LOAD = piece + rigging + hook block + whatever the chart says to
#   deduct (a stowed jib, a headache ball). ASME B30.5 5-1.1.1(b)(4): "The
#   weight of all auxiliary handling devices such as lower load block, hooks,
#   and slings shall be considered as part of the load."
# * BETWEEN TWO LISTED RADII the capacity is the NEXT LONGER radius's row,
#   never an interpolation: manufacturers' chart notes ("For a load radius not
#   shown, use rated load of next longer listed radius", P&H; "use the next
#   longer radius", US Army TM 5-3810-307-10,
#   https://constructioncranes.tpub.com/TM-5-3810-307-10/0776290152.htm --
#   both seen in search results, not opened; NCCCO rigger study guide "do not
#   create a higher interpolated capacity",
#   https://open-exam-prep.com/study-guides/nccer-rigger/complex-lift-planning-multi-crane/reading-mobile-crane-load-charts).
#   Past the last listed radius the capacity is zero. Closer than the first
#   listed radius the chart says nothing: the lift is unmeasured.
# * RATED CAPACITY is the ceiling: 29 CFR 1926.1417(o)(1), "The equipment
#   must not be operated in excess of its rated capacity."
#   https://www.osha.gov/laws-regs/regulations/standardnumber/1926/1926.1417
#   lifts.max_pct_of_chart lowers it for planning (null = 100).
#   1926.1417(o)(3)(ii) requires the load's weight be VERIFIED when it is over
#   75% of the rated capacity at the longest radius used: such lifts are
#   marked verify_weight, not failed. No federal "critical lift" definition
#   exists (USACE EM 385-1-1 16.H.01 and DOE-STD-1090-2020 2.1.2(E) use 75%).
# * OVERHEAD POWER LINES: 29 CFR 1926.1408 (20 ft for lines up to 350 kV under
#   (a)(2)(ii); Table A by voltage). Not checked in this slice -- the line and
#   pole layers are FOLLOWUPS 144. Reported unmeasured.
#   https://www.osha.gov/laws-regs/regulations/standardnumber/1926/1926.1408
# * GROUND: 1926.1402 wants ground "firm, drained, and graded" to the
#   manufacturer's specification. Steph: raw dirt OK. The slope limit is
#   crane.max_pad_slope_pct, unset until Steph or a chart gives it.
#   https://www.osha.gov/laws-regs/regulations/standardnumber/1926/1926.1402
# ---------------------------------------------------------------------------

version: 1
source: "Steph 2026-11-11 (docs/followups/145-set-access-crane-truck.md)"
pieces_status: "drawn for 30 ft depth; to be superseded"

crane:
  # Steph 2026-11-11: "100 in (8.33 ft) wide, 40 ft long".
  body: {width_in: 100, length_ft: 40}
  # Steph 2026-11-11: "28 x 40 ft setup pad (raw dirt OK) near the home".
  # Width x length; the crane body lies along the pad's 40 ft length.
  pad: "28 x 40"
  surface: raw dirt OK
  # Steph 2026-11-11: "may enter/leave temporarily from any side with room,
  # setbacks ignored; must be able to leave once the pod is up". The path is
  # as wide as the body (8.33 ft) and is checked with the building in place.
  setbacks_ignored: true
  # Pad and drive on the street right of way (a street-use permit). Steph to
  # decide (FOLLOWUPS 145 "Open for Steph"); off until then.
  street_setup_allowed: false
  # Steepest ground a pad may stand on, percent. UNSET: no figure from Steph
  # or a chart yet, so the pad's slope is reported and its check unmeasured.
  max_pad_slope_pct: null
  # Axis of rotation relative to the pad centre, along / across the pad's
  # length. 0/0 until a crane's spec says otherwise.
  rotation_offset_ft: {along: 0, across: 0}

search:
  # Solver choices, not product figures (agent, 2026-11-11). Pads are tried
  # on a square grid this fine, at every angle this step from the building's
  # long axis. Landing spots likewise.
  pad_grid_ft: 4
  pad_angle_step_deg: 15
  landing_grid_ft: 2
  landing_angle_step_deg: 15
  # Only this many pads -- those whose truck and set radii (which no landing
  # spot can shorten) are least, straight drives first -- get the landing
  # search and an envelope. The best pad is chosen among them.
  pads_kept: 40
  # A straight drive along the pad's length from a street lot line is a
  # MEASURED way in and out. A path that exists only with bends is
  # unmeasured: the 40 ft vehicle's turning search (flats/fit/turning.py) is
  # minutes to an hour per shape and is not run here (TODO).
  bends: unmeasured

pod:
  # Steph confirmed 2026-11-11 (via the coordinator): the pod stays 80 x 25,
  # homes 20 x 25, as in flats/config/pods/pod80x25.yaml. The solver reads the
  # pod's length and depth (and any height) off the PLACED design, never from
  # here or from the piece list; only the home count is taken from here.
  # (Steph's first note, "30 x 80 ft, 4 homes 20 x 30", is superseded.)
  homes: 4

truck:
  # Where a load stands on the delivery truck: on the street, at the street
  # lot line point nearest the crane, this far out past the lot line (the
  # sidewalk/planter strip plus half the truck's width). UNSET: with null the
  # radius is measured AT the lot line, which is the least it can be -- a lift
  # that fails there fails; one that passes there is unmeasured.
  bed_centre_past_lot_line_ft: null

landing:
  # Stacks come off the truck to a landing spot on open ground on the lot
  # (not the building, not the pad); single pieces are picked from there.
  # The spot chosen is the one whose FARTHEST corner is nearest the crane:
  # a piece may sit anywhere in its stack, so the pick radius is taken to the
  # stack's far corner (conservative), the stack's own set radius to its
  # centre. A stack's plan footprint is its two longest printed dimensions
  # (it may lie either way). Stacks land one after another, so one spot may
  # serve several.
  rule: nearest_far_corner
  # Where no spot on the lot holds a stack: null = that stack's lifts are
  # unmeasured; "truck" = the pieces are picked straight off the parked truck.
  # Steph to decide.
  fallback_when_no_room: null

rigging:
  # Steph 2026-11-11: "Rigging per lift: lifting frame 1,000-1,500 lb, long
  # beam 800-1,100 lb, plus hook." The HIGH figure is used (conservative).
  # The hook block's weight comes with each chart (charts.*.hook_block_lb).
  frame_lb: "1,000-1,500"
  beam_lb: "800-1,100"
  use: high
  # Which rigging rides on which lift. Steph gave it per lift for the stacks
  # (his totals, 14,500-15,000 walls and 7,000-8,500 cassettes, are the stack
  # plus frame plus beam). For single picks and the site container he did not
  # say: both are charged (conservative), Steph to confirm.
  per_lift: [frame, beam]

lifts:
  # Planning ceiling as a percent of the chart's rated capacity. null = 100
  # (1926.1417(o)(1)). Steph may lower it (75 is the common critical-lift line).
  max_pct_of_chart: null
  # Above this percent of the chart a lift is marked verify_weight
  # (1926.1417(o)(3)(ii)).
  verify_weight_over_pct: 75

# THE PIECE LIST BELOW IS STEPH'S 2026-11-11 FIGURES, DRAWN FOR A 30 FT DEEP
# DESIGN; TO BE SUPERSEDED. The factory is redrawing it for the 25 ft pod and
# the sizes and weights will change. Sizes here feed only landing footprints
# and the cassette end inset (a piece's WIDTH); no set point is derived from a
# piece's length -- set points come from the placed design's footprint.
#
# Whole-stack loads: truck -> landing spot. `size` and `weight_lb` as printed
# (length x width x height, feet and inches). `with` lists what Steph said
# ships with the stack; it is charged to the stack's lift (conservative --
# Steph to confirm it is lifted together), and a part with no weight makes the
# stack's gross a lower bound. `count` is how many identical stacks.
stacks:
  ground_walls:
    label: Ground-floor walls
    count: 1
    size: 40 x 8'1" x 6'1"
    weight_lb: "12,074"
  floor_cassettes_h12:
    label: Floor cassettes, homes 1-2
    count: 1
    size: 30 x 4'4" x 7'9"
    weight_lb: "4,414"
  floor_cassettes_h34:
    label: Floor cassettes, homes 3-4
    count: 1
    size: 30 x 4'4" x 7'9"
    weight_lb: "4,414"
    with:
      - {label: stair kits, count: 4, each_lb: "508"}
      - {label: loose trusses, count: 1, each_lb: null}
  upper_walls:
    label: Upper-floor walls
    count: 1
    # Steph gave no size for this stack; the ground-wall stack's is used for
    # its landing footprint (same pieces, one storey up).
    size: null
    size_like: ground_walls
    weight_lb: "11,625"
  roof_cassettes:
    label: Roof cassettes
    count: 2
    size: 30 x 6'4" x 7'9"
    weight_lb: "5,895"
  # Steph: "+ site container ~4,100 lb lifted separately" -- off the truck to
  # its own spot, not one of the six stacks.
  site_container:
    label: Site container
    count: 1
    size: 10 x 8 x 8.5
    weight_lb: "~4,100"
    whole_stack: false
# Steph 2026-11-11: "+6 in blocking" per stack. Height only; it moves no
# radius and Steph gave no weight for it.
blocking_in_per_stack: 6

# Single picks: landing spot (`from`, the stack they ship in) -> final place.
# `set_at` says where in the pod the piece's centre ends up:
#   long_walls   one per home on each long wall, at the wall line;
#   short_walls  each home's two short walls, on the pod's centreline;
#   centreline   anywhere along the pod's long centreline, spanning the depth
#                (cassettes: inset half the narrowest printed width from each
#                end -- which home a stack serves is not used, conservative);
#   footprint    anywhere in the building (taken at its corners).
singles:
  ground_long_walls:
    label: Front/back wall, ground
    count: 8
    size: 20 x 8'1"
    weight_lb: "774"
    from: ground_walls
    set_at: long_walls
  ground_short_walls:
    label: Wall between homes, ground
    count: 8
    size: 29'1" x 8'1"
    weight_lb: "725"
    from: ground_walls
    set_at: short_walls
  upper_long_walls:
    label: Front/back wall, upper
    count: 8
    size: 20 x 8'1"
    weight_lb: "711-724"
    from: upper_walls
    set_at: long_walls
  upper_short_walls:
    label: Wall between homes, upper
    count: 8
    size: 29'1" x 8'1"
    weight_lb: "725"
    from: upper_walls
    set_at: short_walls
  floor_cassettes_h12:
    label: Floor cassette, homes 1-2
    count: 6
    size: 30 x 4'-4'3.5" x 15.5"
    weight_lb: "648-786"
    from: floor_cassettes_h12
    set_at: centreline
  floor_cassettes_h34:
    label: Floor cassette, homes 3-4
    count: 6
    size: 30 x 4'-4'3.5" x 15.5"
    weight_lb: "648-786"
    from: floor_cassettes_h34
    set_at: centreline
  stair_kits:
    label: Stair kit
    count: 4
    size: null
    weight_lb: "508"
    from: floor_cassettes_h34
    set_at: footprint
  roof_cassettes:
    label: Roof cassette
    count: 12
    # Stair-side cassettes are 6'3.5" wide.
    size: 30 x 4-6'
    weight_lb: "864-1,194"
    from: roof_cassettes
    set_at: centreline

# Load charts, one per crane configuration. EMPTY until Steph supplies them;
# with none, every lift is unmeasured. Never write a chart here that is not a
# manufacturer's printed chart. Schema (all figures as printed on the chart):
#
#   <chart_id>:                      # e.g. grove_tms9000e_ob_full_360
#     crane: "<make model>"
#     source: "<document, page>"     # where the chart is printed
#     configuration: "<outriggers fully extended, 360 deg, counterweight ...>"
#     hook_block_lb: <lb>            # required; null = gross a lower bound
#     deductions_lb: {<item>: <lb>}  # anything the chart says to deduct
#                                    # (stowed jib, headache ball)
#     max_pct_of_chart: <pct>        # optional, overrides lifts.max_pct_of_chart
#     booms:                         # one per boom-length column
#       - boom_ft: <ft>
#         rows: [[<radius_ft>, <capacity_lb>], ...]   # gross rated capacity
#
# The capacity at a radius is the best boom column's next-longer row. A
# column's capacity may not rise with radius (the loader refuses it).
charts: {}
