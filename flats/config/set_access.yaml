      quote: "books/street-standards/cornelius/pws.txt#L858-L869 (PDF p.24; the text layer jumbles the rows, read off the page)"
      url: https://www.corneliusor.gov/DocumentCenter/View/429/City-of-Cornelius-Public-Works-Standards-PDF
  cap_ft:
    or/clackamas/oregon-city:
      value: 32
      cite: >-
        OCMC 16.12 street design standards, Local / Residential pavement
        width 32 ft (the narrowest class; a wider street is capped to it,
        which only narrows the estimate)
      quote: "or/clackamas/oregon-city/16.12.streets.txt#L411"
      header: "or/clackamas/oregon-city/16.12.streets.txt#L394-L395"
    or/clackamas/canby:
      value: 34
      cite: Canby TSP Figure 7-6, Standard Local Street "Paved = 34'"
