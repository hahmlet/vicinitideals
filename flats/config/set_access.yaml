# Set access: can a crane set the pod on this lot, and which one
# (FOLLOWUPS 145; flats/fit/set_access.py).
#
# A REPORT, NOT A SCREEN CHECK (Steph 2026-11-14: "Don't flag any lots by
# color yet, we're just starting something from scratch"). Nothing here
# reaches the colour, a reason code, a flag or the bound. The entry point is
# flats.fit.set_access.report(); scripts/flats_set_access_sample.py runs it
# over a sample of a finished bridge run.
#
# HUMAN-OWNED. Every product figure below is stored AS PRINTED in Steph's
# crane spec, Factory-Sim docs/research/S3e-crane-20x25.md (rewritten
# 2026-11-14 after Steph's crane decision, DECISIONS L3; "the spec"), with
# the spec's own label: [vendor] maker or dealer document, [code] a
# regulation, [calc] worked in the spec, [est] estimate, [Steph] Steph's
# figure or decision. The loader parses the printed text (6 ft 6 in -> 6.5
# ft, "556-723" -> 556..723 lb) and takes the HIGH end of a range unless the
# field says otherwise. An agent does not move one without a new ruling
# quoted here. A field left null is UNMEASURED: the report says so and
# never answers "works" on it.
#
# Supersedes version 2 (S3f, the 28 t Manitex 2892C first). Steph
# 2026-11-14: the 28 t is DROPPED (spec section 2). Primary crane: an owned
# Broderson IC-80-3H carry-deck crane. Secondary: a hired 45 t National
# NBT45-2 boom truck, used only where the IC-80 cannot set the pod.
#
# ---------------------------------------------------------------------------
# The viability order (spec section 5, Steph's rule), followed exactly:
#   1. the IC-80 from one long face (front or back);
#   2. the IC-80 from both long faces;
#   3. the 45 t, first set up on the lot, then in the street in front;
#   4. neither: the site is not viable for this product.
# The first that passes is the answer. A step the data cannot decide is
# "unmeasured" and the ladder goes on.
#
# Conventions the solver relies on:
# * RADIUS is the horizontal distance from the crane's centre of rotation to
#   the hook over the load's centre (ASME B30.5-2004 5-1.1.1(b)(2)). A
#   lift's radius is the LONGEST at which it is handled (B30.5 5-3.2.1.1(c)):
#   max(pick-up, set).
# * BETWEEN TWO LISTED RADII the capacity is the NEXT LONGER radius's row,
#   never an interpolation (spec 3.2: "Between rows, this note reads the
#   next longer radius"; 4.2: "Between listed values use the lower
#   neighbour"). Past the last row the capacity is zero.
# * PLANNING LINE: 75% of chart (spec 3.3, [est]): "Anything above that is a
#   critical lift and needs its own lift plan." A lift above it FAILS here
#   (the report names it a critical lift). Rated capacity is the ceiling
#   (29 CFR 1926.1417(o)(1)).
# * OVERHEAD POWER LINES ARE NOT CHECKED, for either crane (Steph
#   2026-11-14: a later job, depending on these results). Every set-up
#   carries "power lines not checked".
# ---------------------------------------------------------------------------

version: 5
source: "Factory-Sim docs/research/S3e-crane-20x25.md (rewritten 2026-11-14; level 5dcd917; carry and power lines 9985b64), Steph 2026-11-14/15"

lifts:
  # Spec 3.3: "Planning line: 75% of chart. Anything above that is a
  # critical lift and needs its own lift plan." [est]. Used for both cranes
  # (spec 4.4 and 4.5 read "Farthest within 75%").
  max_pct_of_chart: 75

# ===========================================================================
# PRIMARY: Broderson IC-80-3H carry-deck crane, owned [Steph] (spec 3)
# ===========================================================================
ic80:
  label: IC-80-3H
  # Spec 3.1 [vendor]: "12 ft 9.75 in long (chassis), 6 ft 6 in wide, 7 ft
  # 3 in high"; "~17 ft 9 in overall [est, read off the drawing]".
  body: {length: "12 ft 9.75 in", overall_length: "17 ft 9 in", width: "6 ft 6 in", height: "7 ft 3 in"}
  # Spec 3.1 [vendor]: "IC-80-3H: 16,750 lb (2-wheel drive), 17,600 lb
  # (4-wheel drive)".
  weight_lb: "16,750-17,600"
  # Spec 3.1 [vendor]: "Spread 9 ft 7 in wide; pads 9 x 12 in. Pad centres
  # about 5 ft 9.5 in ahead of and 5 ft 10.25 in behind the centre of
  # rotation (11 ft 7.75 in apart)". The outrigger footprint is taken as the
  # spread wide by the pad-centre span long, about the centre of rotation.
  outriggers: {spread: "9 ft 7 in", ahead: "5 ft 9.5 in", behind: "5 ft 10.25 in", pad: "9 x 12 in"}
  # Spec 3.1 [vendor]: "Turning radius 10 ft 0 in"; "A 90 deg turn needs an
  # aisle 9 ft 6 in wide."
  turning: {radius: "10 ft 0 in", aisle_at_90_deg: "9 ft 6 in"}
  # Spec 3.1 [vendor]: "Single part to 9,000 lb: downhaul weight 90 lb ...
  # All our picks are single part".
  hook_lb: 90

  # Spec 3.2, IC-80-3H load chart, pounds [vendor]. "Capacities apply on a
  # firm, level surface. They include the hook and downhaul, rigging and
  # everything on the hook." "Rows 32-40 ft are on the 10 ft boom
  # extension." Columns as printed: 360 deg on rubber, 360 deg on
  # outriggers, over front on rubber, over front on outriggers.
  chart:
    source: "S3e 3.2, Broderson IC-80-3H, Form CC111H (02/11), lb [vendor]"
    columns: [rubber_360, outriggers_360, rubber_front, outriggers_front]
    extension_rows_from_ft: 32
    rows:
      - [5, 9400, 17000, 11400, 18000]
      - [6, 7550, 14000, 10000, 14000]
      - [8, 5600, 10000, 8100, 10000]
      - [10, 4300, 7700, 6100, 7700]
      - [12, 3200, 6100, 4450, 6100]
      - [14, 2550, 5200, 3400, 5200]
      - [16, 2050, 4400, 2700, 4400]
      - [18, 1650, 3900, 2200, 3900]
      - [20, 1350, 3400, 1800, 3400]
      - [22, 1150, 3050, 1550, 3050]
      - [24, 1000, 2750, 1350, 2800]
      - [26, 850, 2450, 1200, 2550]
      - [28, 750, 2200, 1100, 2350]
      - [30, 650, 1950, 1000, 2150]
      - [32, 450, 1750, 900, 1950]
      - [34, 350, 1600, 800, 1800]
      - [36, 250, 1450, 700, 1650]
      - [38, 200, 1300, 600, 1500]
      - [40, 150, 1150, 500, 1400]
    # Spec 3.2: "10 ft extension caps, lb, by main boom angle. The extension
    # may not exceed the main-boom figure above." Stored as printed; the
    # lightest cap (2,250 lb) is above every gross set pick here (<= 1,486
    # lb), so the solver reads the main chart only.
    extension_caps:
      main_boom_angle_deg: [0, 30, 45, 60, 70]
      offset_0_deg: [2250, 2600, 3200, 5000, 7000]
      offset_15_deg: [null, 2400, 2700, 3500, 4200]
      offset_30_deg: [null, 2250, 2500, 3000, 3300]
    # Spec 3.2 chart rules [vendor]: "With the extension stowed on the base
    # boom, deduct 100 lb from every figure."; "No pick-and-carry with a
    # load on the boom extension."
    extension_stowed_deduct_lb: 100

  # Spec 3.3 [Steph, DECISIONS L-outrig]: "Every set lift is made on
  # outriggers, on the 360 deg column. Carrying stays on the rubber,
  # over-front column (section 3.7)."
  set_column: outriggers_360
  carry_column: rubber_front
  # Spec 3.7: past ~3% cross fall on a carry route, "read the 360 deg
  # on-rubber column instead".
  carry_column_cross: rubber_360

  # Spec 3.3 [est]: "Gross pick = piece + rigging + 90 lb downhaul";
  # "Rigging is taken as ~400 lb: a 16-20 ft spreader plus slings". How a
  # flat-shipped wall is turned upright is not designed (FOLLOWUPS 215):
  # every report names the heaviest wall rigging its plan holds (3.6).
  rigging_lb: "~400"

  # Spec 3.4 [est, from the range diagram]: hook height by radius. "The hook
  # is taken as about 3 ft below the sheave, rounded down to be safe." A
  # radius between two columns reads the NEXT LONGER one (the lower hook);
  # past the last column the hook height is not printed and the radius is
  # not used for setting.
  hook_height_ft:
    radius: [14, 16, 18, 20, 22, 24, 26, 28, 30, 32, 34, 36]
    main_30: [31, 29, 28, 26, 24, 22, 19, 15, null, null, null, null]
    with_extension_40: [41, 41, 40, 39, 37, 36, 34, 33, 30, 28, 25, 21]
  # Spec 3.4 (updated a780573, Steph 2026-11-14) "Hook needed, every piece
  # [est]": "Hook height = the top of whatever the piece must pass over,
  # plus ~2 ft clear ..., plus the piece's hanging height, plus the
  # rigging". The table's "Hook needed" column, by piece:
  #   Ground walls ~14-16 ft; Site container ~16-18 ft; Floor cassettes,
  #   all three types ~21-22 ft; Floor-level closing trusses ~22-23 ft;
  #   Stair trusses ~20-21 ft; Stair kits "~20-21 ft at most; ~10 ft on the
  #   ground"; Upper walls ~25 ft; Roof cassettes ~31 ft; Roof closing
  #   trusses ~31-32 ft.
  # The high end of each is used. "Off the trailer: a piece only has to
  # clear the rest of its stack ..., so hook height does not limit the pick
  # off the trailer": the hook need is checked at the SET radius only.
  hook_needed_ft:
    ground_walls: "~14-16"
    floor_cassettes: "~21-22"
    floor_closing_trusses: "~22-23"
    stair_trusses: "~20-21"
    stair_kits: "~20-21"
    upper_walls: "~25"
    roof_cassettes: "~31"
    roof_closing_trusses: "~31-32"
  # Spec 3.4 [est]: "the hook can come no closer than about 10 ft on the 30
  # ft main boom, or about 14 ft with the extension up. Pieces on the near
  # face are therefore set from at least ~14 ft away". Every panel is set
  # and picked with the extension up (the spec's 3.5 table reads rows to 32
  # ft with no stowed-extension deduction): 14 ft.
  min_radius_ft: {main_30: "~10", with_extension: "~14"}

  # Spec 3.5 [calc] "Where it stands": "Centre of rotation about 6-7 ft off
  # the face. The outrigger pads are then about 1-2 ft from the slab edge."
  # The HIGH end is used (the longer radius to the far face).
  centre_off_face_ft: "6-7"
  # Spec 3.5: "End walls, party walls, all cassettes ... A 24-25 ft piece
  # points at the crane, so the crane stands ~10 ft along the face from the
  # piece's line, keeping it from passing under the boom (S3h section 9)".
  along_from_piece_line_ft: "~10"
  # Spec 3.5 [Steph]: "about one spot per home per stage, so roughly 16-20
  # outrigger set-ups a pod, each in single minutes". Reported, not used.
  setups_per_pod: "16-20"
  # Spec 3.5, the three reaches, as printed, for the hand checks in the
  # tests: far-face walls "~31 ft, read at 32 ft"; end walls, party walls,
  # all cassettes "~21 ft, read at 22 ft"; near-face walls "~14 ft".
  printed_reaches_ft: {far_face_walls: 32, middle_pieces: 22, near_face_walls: 14}
  # Spec 3.5 "Picking off the trailer": "The trailer parks so each piece is
  # within reach of a crane spot that also reaches its landing place: walls
  # within ~32 ft; cassettes within ~28 ft (FULL4) to ~32 ft (the rest)."
  # The solver reads each piece's reach off the chart at the planning line;
  # these printed figures are its hand check. "Picking off the trailer
  # counts as one pick with the set: no carrying."
  trailer_reach_ft: {walls: "~32", cassettes: "~28-32"}

  # Spec 3.6 [calc], how far out the IC-80 sets each wall at 75% of chart,
  # by wall rigging weight. Stored as printed for the hand check; the solver
  # works the same figure from the chart for every plan (the heaviest wall
  # rigging the plan holds). "The far walls sit ~31 ft out, so the one-face
  # set needs the wall rigging at about 400-500 lb or less"; "With 800 lb or
  # more, the IC-80 has to work from both faces".
  rigging_reach_ft:
    rigging_lb: [400, 800, 1300]
    ground_front_wall: [32, 26, 22]
    upper_front_wall: [32, 28, 22]
    back_walls: ["34-36", "28-30", 24]
    end_and_party_walls: [34, 28, 24]
  one_face_wall_rigging_lb: "~400-500"
  # The two wall-gear cases the sample reports side by side (coordinator,
  # slice 3c: "light wall-lifting gear (the spec's <=400-500 lb, one face
  # enough)" and "heavy gear (~800 lb)"): spec 3.6's 400 lb and 800 lb
  # columns. Only the WALLS take the case; every other piece keeps
  # rigging_lb (spec 3.3).
  wall_gear_lb: {light: 400, heavy: 800}

  # Spec 3.7 pick and carry [vendor, calc] (S3e at 9985b64, L318-389; the
  # crane agent's figures to the coordinator 2026-11-15). Rules: "Carry on
  # the over-front, on-rubber column only, boom straight ahead (about +-2
  # deg), at creep speed, 2 mph or less"; "No carrying on the extension:
  # stow it (deduct 100 lb) or take it off" (taken off here: the
  # extension rows are dropped and nothing deducted). "The load's centre
  # must sit ahead of the front bumper (~6.6 ft from the centre of
  # rotation ...) plus ~1.5 ft clearance, plus half the load's depth in the
  # direction of travel." The table (L338-345):
  #   "Ground front wall, upright, lengthwise (edge-on) | 6.5 ft | 18.1 ft (20)"
  #   "End and party walls (24 ft), upright, lengthwise | 6.5 ft | 20.2 ft (22)"
  #   "Cassettes flat, lengthwise (25 ft ahead) | 8 ft | 20.6 ft (22) | 1,550 | 79-102%"
  #   "Cassettes flat, crosswise (25 ft across the path), 64-72 in wide | ~27 ft
  #    | 10.8-11.1 ft (12) | 4,450 | 27-30%"
  #   "Roof cassette FULL4 flat, crosswise, 96 in wide | ~27 ft | 12.1 ft (14)
  #    | 3,400 | 47%"
  # "Cassettes can be carried, crosswise. Earlier versions of this note said
  # they could not; that only held for carrying them lengthwise". Lengthwise
  # (79-102%) is the spec's no and is not tried. "An upright wall cannot go
  # crosswise". "The cargo deck (14,000 lb, 53 sq ft) is too small for a
  # panel. It suits bundles, mats and tools."
  carry:
    hook_radius_ft:
      wall_20_ft: "18.1"
      wall_24_ft: "20.2"
      cassette_crosswise: "10.8-11.1"  # 64-72 in wide; the high end read
      cassette_crosswise_96_in: "12.1"  # FULL4
      wall_flat_crosswise: "12.1"  # only with walls_flat_crosswise
    extension: removed
    path_width: "6 ft 6 in"  # an upright wall, edge-on
    path_width_crosswise: "~27"  # "the 25 ft panel plus ~1 ft each side"
    speed_mph: "2"
    deck_lb: "14,000"
    # Spec 3.7: "Walls carried flat, crosswise, like a cassette would be
    # 35-41% (12.1 ft, reads 14) ... Whether that works depends on how walls
    # are turned upright and with what gear (FOLLOWUPS 215 a)." Not in the
    # plan yet (crane agent 2026-11-15): a switch, OFF.
    walls_flat_crosswise: false
    # CARRYING ON A REAL SITE [est] (spec 3.7 L364-389), in place of the
    # chart's "smooth, level, paved" (the spec no longer asks for paving,
    # so no paving switch and no paving data is needed):
    # - "Firm: the loaded crane leaves no ruts deeper than ~1 in. Dry firm
    #   lawn or compacted gravel is fine. Soft or wet ground gets
    #   ground-protection mats or a few inches of compacted gravel" and
    #   "Even: no holes, kerbs or bumps over ~2 in on the route": no data,
    #   reported as not checked, never a fail.
    # - "Slope along the route: ... Allow ~3% of the chart for each 1% of
    #   downhill slope with the load ahead [calc on est]" -- the crane agent:
    #   "usable chart = chart x (1 - 0.03 x downhill %)", read on the
    #   route's ground. The fall is the plane fitted along the route, taken
    #   as downhill with the load ahead (the spec's "Where possible drive so
    #   the load is on the uphill side" is not taken).
    slope_chart_lost_per_pct: 0.03
    # - "Slope across the route: ... At ~3% the wall carry uses up the +-2
    #   deg straight-ahead allowance; beyond that, read the 360 deg on-rubber
    #   column instead". The fitted plane's whole fall is taken as across
    #   too (cautious).
    cross_fall_pct: "~3"
    # The pads' ~3% (spec 3.9) is the outrigger pads' only; no carry rule
    # borrows it (crane agent 2026-11-15).
    # Spec 3.10 (L453-499): "A load means 1926.1408 applies: 20 ft from the
    # line, or 10 ft if the utility confirms 50 kV or less"; "A crane
    # travelling with a load is treated as lifting (1926.1411(a) sends it
    # to 1926.1408)"; "The pick off a trailer parked under the line is
    # blocked for the same reason"; "De-energised and grounded ... the
    # IC-80 may carry under the line with physical clearance only";
    # "Covered only ... the line still counts as live". FLATS holds no
    # power-line data: every plan that carries, or uses a street trailer,
    # says so, and names the ways a street plan still works; never a block
    # (Steph 2026-11-14).
    power_line_clearance_ft: "20, or 10 with the utility's <=50 kV confirmation"
    # Bundles (stair kits, truss bundles) ride the cargo deck ("It suits
    # bundles, mats and tools"), nothing on the hook: they need the IC-80's
    # own way in only.

  # Spec 3.8 [calc, est]: "The container weighs ~4,100-4,600 lb [est]. Add
  # ~150 lb of chain sling [est] and the 90 lb hook"; "the crane lifts the
  # container off load 1 and sets it down within ~10 ft of its centre of
  # rotation"; "The container's final spot has to be next to a crane spot";
  # "Keep the extension stowed for this pick (deduct 100 lb)". NOT in the
  # viability rule (spec section 5): reported beside the answer only.
  # Steph 2026-11-14 (set-access-3 question 1, "yes"): the IC-80 may step
  # into the street for this one lift; "power lines not checked" still.
  container: {sling_lb: "~150", within_ft: "~10", extension: stowed, street_allowed: true}

  # Spec 3.9 (updated 5dcd917), "Level applies to the crane, not the
  # strip" [vendor wording, est reading]: "the requirement falls only on
  # the four pad spots at each set-up"; "Until it is known, plan the ground
  # across the pads within ~3% (about 3-4 in over the 9 ft 7 in spread)
  # [est]"; "Between spots: the strip only has to be firm and drivable for
  # the empty crane." Section 5 step 1: "The strip does not have to be
  # level: only each set-up spot's four pads must be firm and within what
  # the legs and mats can level (~3% across the pads until Broderson's
  # figure is known, more with cribbing; 3.9)." Read as the fall of the
  # plane fitted to the ground under each spot's outrigger footprint. The
  # cribbing allowance is not taken (no figure).
  pad_level_pct: "~3"

  # Spec section 5, step 1 (Steph's rule; checks est unless marked).
  site:
    # "Working strip: a firm, drained, drivable strip along the full 80 ft
    # of one long face, about 10 ft wide, with the crane's centre ~6-7 ft
    # off the face. The strip does not have to be level" (level: pads only,
    # pad_level_pct above). The outrigger footprint at the crane line is checked as
    # well (it reaches past 10 ft: 7 + 9 ft 7 in / 2 = 11.8 ft).
    strip_width_ft: "~10"
    # "Swing room: 10-12 ft beyond each wall end. Clear of trees, neighbours
    # and walls already set. Boom tip up to ~41 ft." Taken beyond each end
    # of the pod, across the pod and the working strip(s), inside the lot.
    swing_beyond_end_ft: "10-12"
    boom_tip_ft: "~41"
    # "Trailer: a 53 ft trailer can get in and park within ~28-32 ft of a
    # crane spot, or the IC-80 carries from where it parks (3.7): cassettes
    # flat and crosswise on a firm route ~27 ft wide (up to ~5% slope);
    # upright walls only on a near-level route; walls flat if the wall
    # rigging allows (215 a)." (S3e at 9985b64, L693-695.)
    trailer_within_ft: "~28-32"
    # "Getting the IC-80 in: a route 6 ft 6 in wide, 9 ft 6 in at turns,
    # firm enough for ~17,600 lb."
    route_width: "6 ft 6 in"
    route_width_at_turns: "9 ft 6 in"
    # TREES (slice 4, Steph 2026-11-14: "trees matter more" than the curb).
    # Spec 5 step 1, swing room: "Clear of trees, neighbours and walls
    # already set. Boom tip up to ~41 ft." A tree is read off a public
    # canopy map (the sample's --canopy: Metro RLIS Canopy 2019, LiDAR +
    # imagery, summer 2019) as crown cover, never as a trunk or a species.
    # Any canopy cell inside the IC-80's swing room, its working strip and
    # outrigger band, or on a carry path, is an obstruction, its own reason
    # ("trees"), whatever its height (cautious: the boom tip reaches ~41 ft
    # and a carried wall's ~19-21 ft, spec 3.10). The map's cell value is
    # the crown's top height (canopy2019.xml: "Value: Tree height"; cells
    # read 10 ft and up), not the clearance under it, so no height clears
    # a tree. A lot outside the map's data extent, or with no crown within
    # 500 ft (no LiDAR there), has its trees unmeasured. This is a set-access
    # REPORT item only: rulings 2026-11-01-trees-ignored-entered-per-lot
    # (no tree limit holds a lot's colour) is not touched.
    trees: canopy_blocks

# ===========================================================================
# SECONDARY: 45 t boom truck, National NBT45-2 class, hired with its
# operator (spec 4). Used only where the IC-80 cannot set the pod.
# ===========================================================================
nbt45:
  label: 45 t NBT45-2
  # Spec 4.1: "Width travelling 8 ft 4.3 in (100.3 in) [vendor]";
  # "Length travelling about 40-45 ft [est]"; "Height travelling about 13
  # ft [est]".
  body: {length: "40-45", width: "100.3 in", height: "13"}
  # Spec 4.1: "Set-up area: plan about 28 x 42 ft with the outriggers out
  # [est, S3b]". Width x length; the truck lies along the 42 ft length.
  pad: "28 x 42"
  # Spec 4.1: "Front stabilizer (SFO) standard on the NBT45-2, for 360 deg
  # working". The centre of rotation is taken at the pad's centre (no
  # turntable position is printed).
  rotation_offset_ft: {along: 0, across: 0}
  # Spec 4.1 (updated a780573): "Single line up to 11,250 lb, with a 7 US
  # ton overhaul ball (250 lb). Heavier lifts use a multi-part block: 329 /
  # 640 / 600 / 796 lb for 1 / 2 / 3 / 4 sheaves". Spec 4.3: "Overhaul ball,
  # single line | 250 lb [vendor, current guide] (the older chart's ball was
  # 171 lb)"; "Boom extension (jib) folded on the boom | ~300-450 lb off
  # every figure [vendor, older NBT45 chart]; this note allows 450 lb".
  # Steph 2026-11-14 (set-access-3 question 4): whether a hire unit has the
  # jib depends on the truck; it is never needed for this pod; the plan
  # assumes it is on (450 lb off), the cautious case.
  ball_lb: 250
  single_line_lb: "11,250"
  block_1_sheave_lb: 329
  deductions_lb: {jib_stowed: "~300-450"}
  # Spec 4.4: "Gross = piece + rigging + 250 lb ball + 450 lb folded-jib
  # allowance", tabled at 400 lb and 1,300 lb rigging. The high end.
  rigging_lb: "400-1,300"
  # Spec 4.5 (updated a780573): "Gross = stack + lifting frame 1,000-1,500
  # lb + spreader ~1,100 lb + the hook (a 329 lb one-sheave block for the
  # wall stacks, over the 11,250 lb single-line limit; the 250 lb ball for
  # the rest) + 450 lb folded-jib allowance. The container is taken with
  # ~300 lb of slings [est]." The hook is the ball, or the one-sheave block
  # where the lift with the ball is over the single-line limit.
  whole_load_rigging_lb: {frame: "1,000-1,500", spreader: "~1,100"}
  container_sling_lb: "~300"
  # Spec section 5 step 3: "Reach: within ~80 ft of the farthest piece."
  max_piece_radius_ft: "~80"
  # Spec 4.2 load chart, NBT45127-2, 4,000 lb counterweight, outriggers
  # 100%, 360 deg, pounds [vendor]. "The figures include the hook block,
  # slings, spreader and lifting frame. Between listed values use the lower
  # neighbour." Columns: boom length ft; rows [radius ft, lb]; "-" left out.
  chart:
    source: "S3e 4.2, National NBT45127-2, 4,000 lb counterweight, outriggers 100%, 360 deg, lb [vendor]"
    booms:
      - boom_ft: 31
        rows: [[10, 71100], [12, 62950], [15, 53350], [20, 37150], [25, 27600]]
      - boom_ft: 43
        rows: [[10, 41800], [12, 41800], [15, 41800], [20, 38250], [25, 28750], [30, 22500],
               [35, 18050]]
      - boom_ft: 55
        rows: [[10, 41800], [12, 41050], [15, 38350], [20, 34500], [25, 28950], [30, 22700],
