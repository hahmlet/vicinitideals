    hook: floor_cassettes
    loads: [2]
    group: cassette
  floor_cassette_full4f:
    label: Floor cassette FULL4F
    count: 4
    size: "25 x 5 ft 4 in-5 ft 11 in"
    weight_lb: "701"
    place: centreline
    points_at_crane: true
    hook: floor_cassettes
    loads: [2]
    group: cassette
  floor_cassette_stair4f:
    label: Floor cassette STAIR4F
    count: 4
    size: "25 x 5 ft 4 in-5 ft 11 in"
    weight_lb: "632"
    place: centreline
    points_at_crane: true
    hook: floor_cassettes
    loads: [2]
    group: cassette
  # "Roof cassette FULL4 (stair side, with batts) | 4 | 25 ft x 8 ft | 996
  # lb (heaviest panel)".
  roof_cassette_full4:
    label: Roof cassette FULL4
    count: 4
    size: "25 x 8"
    weight_lb: "996"
    place: centreline
    points_at_crane: true
    hook: roof_cassettes
    loads: [4]
    group: cassette
  # "Roof cassettes FULL3 / WET3 | 4 each | 25 ft x 5 ft 10 in-6 ft | 742 /
  # 721 lb".
  roof_cassette_full3:
    label: Roof cassette FULL3
    count: 4
    size: "25 x 5 ft 10 in-6 ft"
    weight_lb: "742"
    place: centreline
    points_at_crane: true
    hook: roof_cassettes
    loads: [4]
    group: cassette
  roof_cassette_wet3:
    label: Roof cassette WET3
    count: 4
    size: "25 x 5 ft 10 in-6 ft"
    weight_lb: "721"
    place: centreline
    points_at_crane: true
    hook: roof_cassettes
    loads: [4]
    group: cassette
  # "Stair kits | 4 | bundle not sized | 593 lb".
  stair_kit:
    label: Stair kit
    count: 4
    size: null
    weight_lb: "593"
    place: centreline
    hook: stair_kits
    loads: [2]
    group: bundle
  # "Truss bundles | 2-3 | 25 ft closing trusses; stair pieces | 350 lb each
  # closing bundle; 637 lb stair pieces". The bundle count is not split by
  # kind (count null). Spec 3.4 splits the closing trusses into a floor-level
# bundle (load 2) and a roof bundle (load 4), each one 350 lb bundle.
  floor_closing_trusses:
    label: Floor closing truss bundle
    count: null
    size: "25"
    weight_lb: "350"
    place: centreline
    hook: floor_closing_trusses
    loads: [2]
    group: bundle
  # Spec 3.4: "Roof closing trusses, 25 ft bundle | 4 | Upper-wall tops,
  # between the roof cassettes | ... | ~31-32 ft"; "Set them from no more
  # than ~28 ft out (33 ft of hook), the same limit as the FULL4 roof
  # cassette."
  roof_closing_trusses:
    label: Roof closing truss bundle
    count: null
    size: "25"
    weight_lb: "350"
    place: centreline
    hook: roof_closing_trusses
    loads: [4]
    group: bundle
  stair_truss_pieces:
    label: Stair truss pieces
    count: null
    size: null
    weight_lb: "637"
    place: centreline
    hook: stair_trusses
    loads: [2]
    group: bundle

# Spec 3.3: "Site container, 10 ft, packed | 1 | 10 x 8 x 8 ft 6 in | 4,100
# lb [est, product model]; ~4,600 lb with FOLLOWUPS 208's contents [est]".
# Spec 3.8: lifted off load 1. Its place on the trailer is not printed: it
# may stand anywhere on load 1's deck (conservative).
container:
  label: Site container
  size: "10 x 8"
  weight_lb: "4,100-4,600"

# Whole trailer loads (spec 4.5, the 45 t only): lifted off the trailer and
# landed where the trailer stood (Steph 2026-11-14), then set piece by piece
# from the ground. `stack_lb` and `length_ft` as printed; `landing` from
# 4.5, "Landing area: firm and level, about 42 x 10 ft for a wall stack and
# 26 x 9 ft for a cassette stack [est], within ~35 ft (walls) or ~50 ft
# (cassettes) of the crane"; section 5 step 3: "Whole loads: within ~35 ft
# of the wall-stack landing and ~50 ft of the cassette-stack landing."
whole_loads:
  ground_walls:
    label: Ground-wall stack (load 1)
    stack_lb: "10,339"
    length_ft: "40"
    landing: "42 x 10"
    within_ft: "~35"
  upper_walls:
    label: Upper-wall stack (load 3)
    stack_lb: "10,273"
    length_ft: "40"
    landing: "42 x 10"
    within_ft: "~35"
