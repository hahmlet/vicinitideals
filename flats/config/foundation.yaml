    value: 18
    source: "[FLATS pass 2] footing bottom below the ground beside it: frost 12 in, Gresham 18 in; one 18 in depth for every lot (FD6 section 3 default); with use_frost_register, the depth for a lot whose register depth is not held. The answer keys keep 18 in written out (FD8 2e)"
