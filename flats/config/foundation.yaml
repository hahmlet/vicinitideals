  long_stair_over_ft:
    value: 8
    source: "[est] challenge: a stair running more than 8 ft out from the wall (FD6 section 8 reports the share at 8 ft)"
  guard_doors_min:
    value: 1
    source: "[est] challenge: a guard at this many doors or more"
  near_flat_relief_ft:
    value: 1
    source: "[est] easy: relief under the building (sampled, with the lump allowance) 1 ft or less"
  low_wall_max_ft:
    value: 4
    source: "[est] easy: every B wall 4 ft or under (FD6 section 8 bin)"
  shallow_fill_max_in:
