  bridge_pad_extra_w_ft:
    value: 1.5
    source: "[est] FD7_infill_cases.py remedies(): the footing widened (to 3 ft) beside the gap: 1.5 ft of extra width, footing thickness as raised.footing_t_in"
  bridge_pad_len_ft:
    value: 6
    source: "[est] FD7_infill_cases.py remedies(): the widened footing runs 6 ft beside the gap (one side at a corner, both sides in a run)"
  year_band_1:
    value: 1940
    source: "FD7 section 2, FD7_basement_share.py BANDS: 'before 1940' is a year below this"
  year_band_2:
