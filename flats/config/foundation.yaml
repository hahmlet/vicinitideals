    value: true
    source: "coordinator 2026-11-19 (slice 2): each lot's own frost depth from the FLATS frost register (lot file frost_register_in, stored in the measured record) sets B's footing depth; false = embed_in on every lot (the FD6 section 8 reference)"
  bar_lb_per_ft:
    value: 0.668
    source: FD3 (No. 4 bar weight)
  lap:
    value: 1.10
    source: FD3 (bar laps and hooks)
  concrete_waste:
    value: 1.07
    source: FD3 (concrete over-order)
  rock_ton_per_yd3:
    value: 1.9
    source: "[est] rock, compacted"

# A: 4 in slab with a turned-down edge, on rock; the low side built up in rock
# behind a deeper edge.
slab:
  slab_top_in:
    value: 8
    source: FD3 (slab top above the highest ground)
  slab_t_in:
    value: 4
    source: FD3 (4 in slab)
  edge_w_in:
    value: 15
    source: "[code Table R403.1], FD3 (edge on a flat lot, 15 in wide)"
  edge_d_in:
    value: 26
    source: "[calc] footing depth 18 in + slab top 8 in (move with embed_in and slab_top_in); [code R403.1.4, 2023 ORSC] sets the depth, 12 in below undisturbed ground and frost; Table R403.1 gives the width only (FD8 2e)"
  edge_extra_t_in:
    value: 8
    source: "FD6 section 5.6 (the low-side edge goes deeper by 8 in x fill depth; the reference model uses the B outside wall thickness)"
  fill_limit_in:
    value: 24
    source: "[code R506.2.1, 2023 ORSC, read on up.codes 2026-11-19] fill not over 24 in of clean sand or gravel, 8 in of earth, except where approved (FD8 2e); a flag only"
  unbalanced_limit_in:
    value: 48
    source: "[code R404.1.4.2, R404.1.3.2.2] deepest fill an edge may hold back without an engineer: 4 ft"
  uprights_fill_over_in:
    value: 24
    source: "FD6 section 5.6 (uprights every 4 ft on an outside line where the fill is over 24 in)"
  fill_flag_with_strip:
    value: true
    source: "FD8 2d [code R506.2.1, 2023 ORSC, read on up.codes 2026-11-19]: the fill test counts all the rock between the stripped ground and the slab, deepest fill + flat_lot.strip_soil_in + slab top - slab thickness over 24 in [est strip depth]; false = without the strip (FD6)"

# Doors and steps (A and B).
doors:
  landing_drop_in:
    value: 8
    source: "[code R311.3.1 exception and R311.3.2, 2023 ORSC] floor up to 8 in above the landing outside a door; doors swing inward [Steph] (FD8 2a, confirmed)"
  riser_in:
    value: 7.25
    source: "[vendor listing] the precast unit's own riser (Hampton Concrete Products, priunit.html, read 2026-11-20); within the 8 in of [code R311.7.5.1, 2023 ORSC] (FD8 2a; was 7.75). The step from the platform into the home stays under landing_drop_in"
  tread_in:
    value: 11
    source: "[vendor listing] a unit runs 42 in out at one riser and 11 in more per riser, 97 in at six (FD8 2a; was 10 [est])"
  landing_depth_in:
    value: 42
    source: "[vendor listing] the 42 in platform, the shallowest on the list that meets the 36 in landing of [code R311.3, 2023 ORSC] (FD8 2a; was 36)"
  guard_over_in:
    value: 30
    source: "[code R312.1.1, 2023 ORSC] guard where the platform is more than 30 in above the lowest ground within 36 in of its open edges (FD8 2d, 2e: read, no longer recalled). Exactly 30 in takes no guard"
  handrail_risers:
    value: 4
    source: "[code R311.7.8, 2023 ORSC] handrail at four risers or more: one railing side where the unit has four risers (FD8 2a, 2e: read)"
  steps_rule:
    value: precast
    source: "[Steph] FD8 2a: each door is one precast unit with its platform and railing, priced by the unit from the table under prices; per_riser = the rule FLATS ran before FD8 (by the riser and the foot of rail), the --as-flats-built override only"
  cap_risers:
    value: 6
    source: "[Steph] FD8 2a, rulings.yaml 2026-11-20-foundation-six-step-cap-red: a method is not used on a lot where any door needs more than six unit risers, floor or slab top more than 8 + 6 x 7.25 = 51.5 in above the ground where the stair lands [calc]. Six risers, 43.5 in, is the tallest unit on the list [vendor listing]. Exactly 51.5 in is six steps, not over"
  near_cap_in:
    value: 2
    source: "[Steph] rulings.yaml 2026-11-20-foundation-near-cap-yellow: the best method's worst door over the cap by this much or less is YELLOW, never GREEN and not RED; under the cap by this much or less is a note. The ground at a door is known to an inch or two at best (FD8 2a [est])"
  precast_markup:
    value: 0.1
    source: "[Steph] FD8 2a: door cost = (unit + installation + sides x railing) x 1.10. Delivery is not included (FD8 2a; asked of the foundation agent 2026-11-20)"
  stair_ground:
    value: true
    source: "FD8 2d [calc; unit run vendor listing]: H is taken at the foot of the unit, 42 in + 11 in x (k - 1) out from the wall on a line straight out from the door, raising k until the unit reaches; false = H at the wall (the FD8 section 3 table)"
  guard_box:
    value: true
    source: "FD8 2d [code R312.1.1, 2023 ORSC]: the guard is tested to the lowest ground in a box out from the wall and to either side of the door centre; false = the platform's own height, k x 7.25 in (the FD8 section 3 table)"
  guard_box_out_ft:
    value: 6
    source: "FD8 2d [code R312.1.1, 2023 ORSC; est box]: the guard box runs 6 ft out from the wall (the 42 in platform and 36 in beyond it); changing it needs a re-measure"
  guard_box_side_ft:
    value: 5
    source: "FD8 2d [code R312.1.1, 2023 ORSC; est box]: the guard box runs 5 ft either side of the door centre; changing it needs a re-measure"

