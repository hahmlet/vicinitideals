    source: "[est] FD7_infill_cases.py DEEP_STEM_FT: the deepened wall is at or over the 8 ft limit (as FD6's engineered wall)"
  bridge_run_ft:
    value: 12.61
    source: "[calc] FD7_infill_cases.py bridge(29 in wall, 2 No. 5 bars) span_ft = 12.608: the longest gap a 29 in wall bridges in a run (strength only; FD7 section 5 working figure 8-10 ft)"
