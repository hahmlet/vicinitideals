# Foundation model settings (FOLLOWUPS 209; design: Factory-Sim
# docs/research/FD6-foundation-model-spec.md, sections 4 and 6).
#
# A NOTE for the lot report, never a colour: nothing the screen, a check or a
# flag reads comes from here (flats/foundation/ never imports flats.score).
#
# Every value is research, not engineering: a code minimum, a hand calculation
# or an estimate that a licensed engineer will replace. Each one sits here once,
# with its source label, so it can be replaced in one place. No number from
# FD6 sections 4 or 6 is written in the Python; the loader
# (flats/foundation/settings.py) refuses a file where any entry lacks a value
# or a source, or where an expected entry is missing or an unknown one appears.
#
# Labels (FD6 header): [code] read in the 2023 ORSC; [code, recalled] a code
# rule written from memory and not yet re-read -- kept exactly so until the
# code agent re-reads it (FOLLOWUPS 209 Open); [calc] arithmetic from labelled
# inputs; [est] estimate; [Steph] decided by Steph; [guide], [vendor listing],
# [bid data] public prices of that kind; FD3 / FD4 / FD6 the research note or
# its reference script. Nothing here is a quote.
#
# Shape: every setting is {value, source}; every price is {low, high, unit,
# source}. Low and high are carried separately all the way through and never
# averaged (FD6 section 6).

spec: FD6-foundation-model-spec.md (Factory-Sim, 2026-11-19)

# The screen places the pod as its finished faces, 80 x 25 ft trim to trim. The
# foundation carries the FRAMING, 79 ft 8-3/4 in x 24 ft 8-15/16 in, centred
# inside that drawn box (about 1-5/8 in in from each end, 1-17/32 in from front
# and back: the skin). Measured and priced on the framing (Steph 2026-11-19).
building:
  finished_length_ft:
    value: 80
    source: DECISIONS N-finished (80 x 25 ft trim face to trim face; the drawn pod)
  finished_width_ft:
    value: 25
    source: DECISIONS N-finished (80 x 25 ft trim face to trim face; the drawn pod)
  length_ft:
    value: 79.72916666666667
    source: "DECISIONS N-finished, Factory-Sim FOLLOWUPS 238(i): framing 956.75 in (79 ft 8-3/4 in) = 4 x 238-1/4 in + 3 x 1-1/4 in [calc]"
  width_ft:
    value: 24.744791666666668
    source: "DECISIONS N-finished, Factory-Sim FOLLOWUPS 238(i): framing 296.9375 in (24 ft 8-15/16 in) [calc]"
  party_x_ft:
    value: [19.90625, 39.864583333333336, 59.822916666666664]
    source: "DECISIONS N-finished, FOLLOWUPS 238(i): party-line centres 238.875, 478.375 and 717.875 in from the framing's end (238-1/4 in homes, 1-1/4 in gaps) [calc]"
  door_x_ft:
    value: [9.966145833333334, 29.8984375, 49.83072916666667, 69.76302083333334]
    source: "[est] the plan's door positions have not been read (front and back of each home); 10, 30, 50, 70 ft on 80 ft, scaled to the 956.75 in framing (FOLLOWUPS 238(i))"

