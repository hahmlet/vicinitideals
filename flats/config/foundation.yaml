    value: 18
    source: "[FLATS pass 2] footing bottom below the ground beside it: frost 12 in, Gresham 18 in; one 18 in depth for every lot (FD6 section 3 default); with use_frost_register, the depth for a lot whose register depth is not held"
  use_frost_register:
    value: true
    source: "coordinator 2026-11-19 (slice 2): each lot's own frost depth from the FLATS frost register (lot file frost_register_in, stored in the measured record) sets B's footing depth; false = embed_in on every lot (the FD6 section 8 reference)"
