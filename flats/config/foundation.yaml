# How the ground and the walls are sampled.
sampling:
  station_ft:
    value: 1
    source: "- (FD6 section 4: station spacing along a wall)"
  high_point_along_ft:
    value: 2
    source: "FD6 reference model (high point sampled every 2 ft along the footprint)"
  high_point_across_ft:
    value: 2.5
    source: "FD6 reference model (high point sampled every 2.5 ft across the footprint)"
  fill_cell_ft:
    value: 1
    source: "FD6 section 5.6 (fill added up over the footprint in 1 ft cells)"
  lump_share:
    value: 0.5
    source: "FD6 section 5.1 reference model [est]: lump allowance = half of (relief inside the footprint minus the range of the six readings), never below zero; an engineer's call"
  grid_step_ft:
    value: 1
    source: "[build] a ground grid is sampled every 1 ft in the building's own frame (FD6 section 3: grid in the building frame); changing it needs a re-measure"
  grid_margin_ft:
    value: 10
    source: "coordinator 2026-11-19 (slice 2): the grid takes in the footprint plus a 10 ft margin all round"
  coarse_cell_over_m:
    value: 3
    source: "FD6 section 7 (coarse ground model: cell over 3 m; relief understated) [FLATS pass 1]"
  front_face_guess_over_deg:
    value: 45
    source: "FD6 section 3 (front_face_turn_deg over 45 marks lots where the front face is a guess)"
  tolerance_in:
    value: 0.000001
    source: "[build] numerical tolerance on every threshold test, so floating-point noise never adds a riser or a flag"

# What the measured record keeps beyond FD6 section 2 (Steph 2026-11-19: "get
# what data you can ... so we can run cheap analysis").
record:
  fill_bands_in:
    value: [12, 24, 48]
    source: "Steph 2026-11-19 via the coordinator: footprint area with fill over 12, 24 and 48 in (measured; changing it needs a re-measure)"
  wall_bands_ft:
    value: [3, 4, 5, 6, 8]
    source: "Steph 2026-11-19 via the coordinator: length of wall in each height band (under 3, 3-4, 4-5, 5-6, 6-8, over 8 ft); the FD6 section 8 bins"

