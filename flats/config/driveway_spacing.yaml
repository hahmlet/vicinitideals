  or/clackamas/milwaukie:
    map: street_class_milwaukie
    # RoadwayClassification verbatim; the Proposed values are left unnamed:
    # unread. The map draws local streets too.
    #
    # MMC 12.16.040(B)(1) spaces accessways along arterial (600 ft) and
    # collector (300 ft) streets "as identified in the Milwaukie
    # Transportation System Plan", measured between driveway aprons: no map
    # holds driveways, so those frontages are barred. On local and
    # neighborhood streets the only figure is (B)(5)(a)'s 45 ft from an
    # intersection for plex development and townhouses of four or fewer
    # units, and its own next sentence relieves an existing lot ("located
    # as far from the nearest intersection street face of curb as
    # practicable; in such cases a formal modification is not required",
    # 12.16.040.txt#L64-L65): every taxlot is an existing lot (Steph
    # 2026-10-21, lots are legal), so a local or Neighborhood Route
    # frontage holds no spacing rule. (B)(5)(c)-(d) (300 / 600 ft or beyond
    # the peak-hour queue) fall on frontages already barred.
    classes:
      Local Street: local
      Neighborhood Routes: neighborhood_route
      Collector: collector
      Arterial: arterial
      Local Access Arterial: arterial
      Multimodal Travel Priority Arterial: arterial
      Through Movement Priority Arterial: arterial
    frontage:
