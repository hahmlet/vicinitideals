  or/washington/sherwood:
    map: street_class_sherwood
    # kai_func_class verbatim (the TSP update's webmap); a street the map
    # does not draw ranks local only where Metro and OpenStreetMap both call
    # it residential (the map's `unlisted`).
    #
    # SZCDC 16.106.040.M.2: a local-street access not within 10 ft of
    # Point "B" (25 ft of Point "A" where no radius exists), and beyond the
    # standing queues of an intersection with a Neighborhood Route,
    # collector or arterial (AASHTO, not measured); a Neighborhood Route
    # spaces driveways 50 ft apart except for middle housing on residential
    # lots in a recorded subdivision (which the screen does not read) and
    # adds the queue rule; a collector refuses direct access within 100 ft
    # of Point "A" and spaces driveways 100 ft apart (and refuses uses with
    # less than 150 ft of frontage unless no alternative exists); an
    # arterial or 99W grants middle housing no permanent driveway. The
    # access diagram that places Points A, B and C is a drawing the stored
    # text does not hold: Point B is read as the end of the right-of-way
    # radius at the corner, so the pass bound measures 10 ft past the cross
    # street's right-of-way line plus the 35 ft return allowance
    # (`curb_return`, which also covers 25 ft from Point A at the P.I.) and
    # the fail bound centreline to centreline (a judgement, hand-off).
    classes:
      Local: local
      Neighborhood: neighborhood_route
      Collector: collector
      Arterial: arterial
      Principal Arterial: arterial
    unlisted: local
    frontage:
      collector:
        figure_ft: 100
        cite: SZCDC 16.106.040.M.2.c, no direct access to a Collector within 100 feet of any present Point A; minimum spacing between driveways (Point C to Point C) 100 feet; uses with less than 150 feet of frontage not permitted direct access unless no other alternative exists
        quote: or/washington/sherwood/16.106/16.106.040.txt#L88-L92
      arterial:
        cite: SZCDC 16.106.040.M.2.d(1), middle housing dwellings on individual residential lots shall not be granted permanent driveway ingress or egress from Highway 99W or arterials
        quote: or/washington/sherwood/16.106/16.106.040.txt#L95-L99
    unread:
      neighborhood_route:
        cite: SZCDC 16.106.040.M.2.b, driveways 50 feet apart (Point C to Point C) except middle housing on residential lots in a recorded subdivision (not read), and beyond the influence of standing queues of an intersection with a Neighborhood Route, Collector or Arterial (not measured)
        quote: or/washington/sherwood/16.106/16.106.040.txt#L79-L84
    from_intersections:
      - driveway_on: [local]
        cross: [local, neighborhood_route, collector, arterial]
        figure_ft: 10
        basis: curb_return
        cite: SZCDC 16.106.040.M.2.a, on Local Streets access not permitted within 10 feet of Point B, or within 25 feet of Point A where no radius exists; distances measured to the nearest edge of the access
        quote: or/washington/sherwood/16.106/16.106.040.txt#L75-L78
        quote_also: or/washington/sherwood/16.106/16.106.040.txt#L63-L67
        unread_cross: [neighborhood_route, collector, arterial]
        unread_cite: SZCDC 16.106.040.M.2.a, access points near an intersection with a Neighborhood Route, Collector or Arterial located beyond the influence of standing queues of the intersection (AASHTO; not measured)
        unread_quote: or/washington/sherwood/16.106/16.106.040.txt#L77-L78

