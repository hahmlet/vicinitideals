# or/clackamas/lake-oswego: NOT CUT (2026-10-24). Its headings take one clean
# rule ('^§ (?P<n>50\.\d+\.\d+)\.\s+[A-Z]', front: both documents), but its
# tables print one cell to a line, and readable text joins a cell that runs to
# the margin onto the next: R-6's "Maximum (units/acre)" landed on the line of
# the subdivision densities above it ("... 14 units/acre Maximum (units/acre)").
# Switched off (eligible: false) besides; left whole until readable text can
# tell a table cell from a wrapped sentence.

or/washington/beaverton:
  # encodeplus PDF print: "20.05.15. Site Development Standards" at the
  # margin, number and stop, a capital (or "[Repealed]"), printed over the
  # text and -- in Chapters 10 and 70 -- once before in a "Contents:" list.
  # The section's own two-part title ("20.05. Residential Zoning Districts",
  # "10.05. Title.") is a heading too: Chapter 10's sections are two-part,
  # and elsewhere the two-part line opens the section's subsections. A table
  # caption repeats the number with no stop ("20.05.15 Residential Site
  # Development Standards") and does not cut. Chapter 70 prints its headings
  # over the text with no stop ("70.05.05 Purpose") and with one in its
  # contents lists, and so does 40.21.05 ("40.21.05 Purpose").
  heading: '^(?P<n>\d{2}\.\d{2}(?:\.\d{2})?)(?:\.|(?<=^70\.\d\d)|(?<=^70\.\d\d\.\d\d)|(?<=^40\.21\.05))\s+(?:[A-Z]|\[Repealed\])'
  # References wrapped to the margin that read as a heading: "40.97. The
  # overlay maps ..." (Chapter 10), "60.20.20. In Cooper Mountain districts
  # ..." (20.22) and "70.20.10. Building Design guidelines and standards
  # except for the ..." (Chapter 70, a third printing).
  furniture: '^(?:40\.97\.|60\.20\.20\.\s+In Cooper|70\.20\.10\.\s+Building Design guidelines)'
  front: [bdc.10.general-provisions, bdc.70.downtown]
  # 20.10, 20.20, 60.30 and 70 were left whole until FOLLOWUPS 123: each holds
  # a value whose one citation names two of its sections, which stays on the
  # proof copy, and a proof-copy citation was joined to no footnote. The join
  # now follows such a citation into its sections (qualified.over), so they
  # are cut (2026-10-29).
  page_head: '^(?:Beaverton Development Code|Date Printed: \w+ \d+, \d{4} Chapter \d+, [A-Z]+-\d+)\s*$'
  page_furniture: '^(?:Beaverton Development Code|Date Printed: \w+ \d+, \d{4} Chapter \d+, [A-Z]+-\d+)\s*$'

or/washington/hillsboro:
  # Municode PDF print: "12.21.150  Development Standards." at the margin,
  # TWO spaces, a capital. The subchapter's contents list and each zone's own
  # list print the same numbers with one space ("12.21.150 Development
  # Standards"), and so does the running header ("12.21.150 HILLSBORO
  # COMMUNITY DEVELOPMENT CODE"), so one space never cuts. Measured
  # 2026-10-28: every number printed with two spaces is printed so once, in
  # number order, in all 23 extracts; "12.27.145 Reserved" is listed and
  # never printed over text.
  heading: '^(?P<n>12\.\d{2}\.\d{3,4})\s{2,}[A-Z]'
  # Each extract opens "SUBCHAPTER 12.21 / SINGLE DETACHED AND MIDDLE HOUSING
  # RESIDENTIAL ZONES" over its contents list; the three 12.50 extracts cut
  # mid-subchapter open on a section heading.
  front: [cdc.12.01.general, cdc.12.10.use-categories, cdc.12.21.middle-housing-zones,
          cdc.12.22.multi-dwelling-zones, cdc.12.23.commercial-zones,
          cdc.12.24.mixed-use-urban-center-zones, cdc.12.25.industrial-zones,
          cdc.12.26.institutional-zones, cdc.12.27.overlay-zones, cdc.12.40.special-uses,
          cdc.12.50.100-270.lot-and-site, cdc.12.60-61.downtown, cdc.12.62.orenco,
          cdc.12.63.hawthorn-farm, cdc.12.64.amberglen, cdc.12.65.south-hillsboro,
          cdc.12.66.north-hillsboro-industrial, cdc.12.67.witch-hazel-village,
          cdc.12.68.witch-hazel-village-south, cdc.12.80.applications]
  # The Municode footer "CDC12.21:5", "CDC12.01:22.1Supp. No. 1", and the
  # running header -- the section on the page, then the code's name or the
  # subchapter's title, glued or spaced ("12.21.030 HILLSBORO COMMUNITY
  # DEVELOPMENT CODE", " 12.21.030SINGLE DETACHED ...", " MIXED-USE AND URBAN
  # CENTER ZONES"). Measured 2026-10-28 on every page start of the 23
  # extracts: every capitals-only line in the band is one of these titles.
  page_furniture: '^\s*(?:CDC\s?\d+\.\d+:\d+(?:\.\d+)?(?:\s?Supp\. No\. \d+)?|(?:\d+\.\d+\.\d+\s?)?(?:HILLSBORO COMMUNITY DEVELOPMENT CODE|GENERAL PROVISIONS|USE CATEGORIES|SINGLE DETACHED AND MIDDLE HOUSING RESIDENTIAL ZONES|MULTI-DWELLING RESIDENTIAL ZONES|COMMERCIAL ZONES|MIXED-USE AND URBAN CENTER ZONES|INDUSTRIAL ZONES|INSTITUTIONAL AND OPEN SPACE ZONES|OVERLAY ZONES|SPECIAL USE STANDARDS|DEVELOPMENT AND DESIGN STANDARDS|PLAN DISTRICTS GENERALLY|DOWNTOWN PLAN DISTRICT|ORENCO PLAN DISTRICT|HAWTHORN FARM/FAIR COMPLEX PLAN DISTRICT|AMBERGLEN PLAN DISTRICT|SOUTH HILLSBORO PLAN DISTRICT|NORTH HILLSBORO INDUSTRIAL AREA PLAN DISTRICT|WITCH HAZEL VILLAGE(?: SOUTH)? PLAN DISTRICT|APPLICATIONS))\s*$'
  # "SUBCHAPTER 12.61 / DOWNTOWN PLAN DISTRICT" over its contents list,
  # below the last section of 12.60, and each extract's own above its first.
  opens:
    - {kind: Subchapter, line: '^\s*(?P<kind>SUBCHAPTER)\s+(?P<n>12\.\d+)\s*$'}

or/clackamas/wilsonville:
  # Municode PDF print of Chapter 4, one extract: "Section 4.113.  Standards
  # Applying to ..." at the margin, printed once in the chapter's contents
  # list and again over the text -- with or without the stop, one space or
  # two ("Section 4.007 Lawfully Existing Development.").
  heading: '^Section\s+(?P<n>4\.\d{3}(?:\.\d+)?)\.?\s+[A-Z]'
  # References wrapped to the margin that read as a heading -- a section
  # number, its stop, a capital -- found as the printings out of number order
  # (measured 2026-10-28: nine, every one a sentence that carries on).
  furniture: '^Section\s+4\.(?:035\.\s+(?:All parties|Site plans|The Director)|012\.\s+The notice|232\.\s+Additionally|600\.\s+This report|137\.\s+If Section|137\.3\.\s+The fee|196\.\s+Except)'
  # The extract opens "PLANNING AND LAND DEVELOPMENT" over the contents list.
  front: [4.planning]
  # The Municode footer "CD4:5Supp. No. 5", "CD4:12.1Supp. No. 3", and the
  # running header -- "§ 4.001 WILSONVILLE CODE" on the left page, "§
  # 4.001PLANNING AND LAND DEVELOPMENT" on the right, either without its
  # number on a contents page. Measured 2026-10-28 on every page start.
  page_furniture: '^\s*(?:CD\s?4:\d+(?:\.\d+)?(?:\s?Supp\. No\. \d+)?|(?:§\s?4\.\d+(?:\.\d+)?\s?)?(?:WILSONVILLE CODE|PLANNING AND LAND DEVELOPMENT))\s*$'
  page_head: '^\s*(?:§\s?4\.\d+(?:\.\d+)?\s?)?(?:WILSONVILLE CODE|PLANNING AND LAND DEVELOPMENT)\s*$'
  # A division's title in capitals over its first section: "ZONING", "LAND
  # DIVISIONS", "WILLAMETTE RIVER GREENW A Y" (letter-spaced as printed).
  # Measured 2026-10-28: 10, each over the section the contents list opens
  # the division with.
  opens:
    - {kind: Division, line: '^\s*(?P<title>[A-Z][A-Z ,&/-]{4,}[A-Z])\s*$', above: true}

or/clackamas/oregon-city:
  # Scanned Municode print: "16.12.021 Same--Grades and curves." at the
  # margin over its text; the chapter's contents list prints the numbers
  # bare, and the running header is the bare number at the page's top.
  # The scan can space a heading's number apart ("16.12 .01 5 Street
  # design--Generally."); the spaces are not part of the number.
  heading: '^(?P<n>16\s?\.\s?12\s?\.\s?\d(?:\s?\d)*)\s+[A-Z]'
  # 16.12 opens on the tail of its contents list ("16.12.030 / 16.12.031").
  front: [16.12.streets]
  # Title 17 is a scan whose headings do not take a rule: the flood chapter
  # prints its numbers spaced apart ("17 . 42 . 090", "17.42 .060"), six
  # sections (17.24.035, 17.29.050, 17.34.080, 17.39.040, 17.50.070,
  # 17.65.080) print a bare number with the title scattered below it, and
  # the bare running header also falls mid-page. Where those sections start
  # is a reading, so the chapter stays whole (measured 2026-10-28).
  uncut: [17.zoning]
  # The scan's footer in all its spellings -- "Oregon City Supp. No. 44 250",
  # "2 51 Oreg on City Supp. No. 44", "266 . 1 Oreg on City Supp. No . 40",
  # "Or e gon Ci ty Supp. No. 46 266.4" -- and the bare running header
  # ("16.12.011", "16.12 . 01 6").
  page_furniture: '^\s*(?:(?:[\d .]+\s?)?O\s?r\s?e\s?g\s?o\s?n\s?C\s?i\s?t\s?y\s?S\s?u\s?p\s?p\s?\.?\s?N\s?o\s?\.?\s?\d+(?:\s?[\d .]+)?|16\s?\.\s?12\s?\.\s?\d(?:\s?\d)*)\s*$'
  page_head: '^\s*16\s?\.\s?12\s?\.\s?\d(?:\s?\d)*\s*$'

or/multnomah/gresham:
  # "4.0101                    PURPOSE" -- the number at the margin, then its
  # title in capitals. The plain-extracted chapters and a few layout pages
  # space the number apart ("4.14 01  PURPOSE", "4. 1410", "4.141 7",
  # "4.12  30", "9  .0201", "9.082  0"); the spaces are not part of it. Two
  # part headings print their title in mixed case ("10.1730 Affordable
  # Housing on Commercial Land", "10.1740 Affordable Housing Developed by
  # Religious"). A title can be letter-spaced ("G EOT H E R M A L"). The
  # contents list prints titles in mixed case, so it does not cut, and a
  # reference wrapped to the margin ("3.0150   Employees" beside a definitions
  # column, "5.0700 Natural Resource Overlay):") is not in capitals.
  # Measured 2026-10-29 on all 17 cut documents: every contents entry has
  # exactly one heading over the text, in number order, and none other cuts.
  heading: '^(?P<n>\d{1,2}\s*\.\s*\d(?:\s*\d){3}[A-Z]?)\s+(?:[A-Z]\s?[A-Z]|Affordable Housing )'
  # The document's own title ("4.1100 DOWNTOWN PLAN DESIGN DISTRICT" on line
  # 1) and the running heading a long section reprints on each page
  # ("4.1242 CIVIC NEIGHBORHOOD STREET TYPE STANDARDS, CONTINUED").
  furniture: '^(?:\d{1,2}\.\d{2}00\s|.*, CONTINUED\s*$)'
  # Each document opens "SECTION 4.0100 / RESIDENTIAL LAND USE DISTRICTS"
  # over its contents list. pws.6.03-6.04 is the Public Works Standards'
  # numbering ("6.03 DRIVEWAYS"), which this rule does not take: it stays
  # whole.
  front: [3.0100.definitions, 4.0100.residential, 4.0200.commercial, 4.0300.industrial,
          4.0400.corridor, 4.1100.downtown, 4.1200.civic-neighborhood, 4.1300.gresham-butte,
          4.1400.pleasant-valley, 4.1500.springwater, 7.0400.middle-housing-design,
          7.0500.rockwood-design, 9.0200.clear-vision, 9.0600.height-transition,
          9.0800.parking, 10.1100.shoreline-height, 10.1700.affordable]
  # 4.0100 was left whole until FOLLOWUPS 123: note 6 of Table 4.0131 wraps
  # onto a line that starts "10 feet in between major structures", which the
  # cut section text read as a note 10 of its own. The census now reads a
  # jump out of a note that stops mid-sentence as the same wrap, so it is cut
  # (2026-10-29).
  # The footer "[4.1100]- 39" in all its spacings ("[4.0100] -12",
  # "[3.0100- 12]", "[10. 1700 ]-3", "[4.1100]- 12 3") and the header "City
  # of Gresham Development Code (06/26)" (its date on a line of its own on
  # two corridor pages). Measured 2026-10-29 on every page start of the 18
  # documents; "Continued on following page." is printed text and stays.
  page_furniture: '^\s*(?:\[\s*\d{1,2}\s*\.\s*\d{4}\s*(?:\]\s*-|-)\s*\d[\d ]*\]?|City of Gresham Development Code(?:\s*\(\d{2}/\d{2,4}\))?|\(\d{2}/\d{4}\))\s*$'
  # The plain-extracted chapters put that footer and header on the page's
  # own first lines, and the three plan districts print their running head
  # there ("4.1152          DOWNTOWN PLAN DESIGN DISTRICT", indented).
  page_head: '^\s*(?:\[\s*\d{1,2}\s*\.\s*\d{4}\s*(?:\]\s*-|-)\s*\d[\d ]*\]?|City of Gresham Development Code(?:\s*\(\d{2}/\d{2,4}\))?|\s\d{1,2}\.\d{4}\s+(?:DOWNTOWN PLAN DESIGN DISTRICT|CIVIC NEIGHBORHOOD PLAN DISTRICT|ROCKWOOD DESIGN DISTRICT)|\s+\d{1,2}\.\d{4})\s*$'

or/multnomah/portland:
  # "33.110.220 Setbacks" -- title, chapter and section, then a capitalised
  # title. Printed twice: indented in the chapter's contents list ("
  # 33.110.220 Setbacks", 8-18 spaces in), and over the text, mostly at the
  # margin but indented in a few layout pages ("                  33.130.200
  # Lot Size", 18 spaces). The layout extraction spaces some numbers apart
  # ("33. 418.020", "33.266.21             0 Bicycle"); the spaces are not
  # part of it. A reference wrapped into an indented paragraph sits deeper
  # (33.415 prints "33.130.242 Transit Street Main Entrance." 28 spaces in)
  # and one with a subsection ("33.705.020.A.") or in lower case ("33.910.030
  # below") is not a heading. Chapter 11.50 is a web print: "11.50.010
  # Purpose." at the margin, printed once. Measured 2026-10-29 on all 21
  # documents: every contents entry has exactly one heading over the text,
  # in number order, and none other cuts.
  heading: '^\s{0,18}(?P<n>(?:33\s*\.\s*\d(?:\s*\d){2}|11\.50)\s*\.\s*\d(?:\s*\d){2})\s+[A-Z]'
  # Each chapter opens with its running header and its title ("Title 33,
  # Planning and Zoning / 10/1/24 / 33.110 Single-Dwelling Zones") over its
  # contents list.
  front: ['33.100', '33.110', '33.120', '33.266', '33.610', 33.910.definitions, '33.920',
          '33.930']
  # Left whole: these nine PDF chapters have no page map (fetched for one
  # rule each, never declared), so the readable text could not take their
  # running headers out and a moved citation could not be checked to name
  # the same printed page.
  #
  # And three base-zone chapters whose cut would unhook a footnote from a
  # value (the FOLLOWUPS 123 trap), measured 2026-10-29: 33.150, where the
  # unmeasured PCC Sylvania note (Table 150-2 note 3) caps CI1, CI2 and IR
  # min_lot_sqft and quadplex_allowed only while their sections are one
  # document -- cut, those two caps fall off; 33.140, whose EG1/EG2
  # quadplex_allowed citation takes in a page header and so stays on the
  # proof copy, where no footnote census reads it, losing the two encoded
  # limitations it rests on (Table 140-1 notes 1 and 2); and 33.130, whose
  # CM/CE/CR/CX citations run from Table 130-2's zone row to text in other
  # sections and lose encoded note 1 of Table 130-2 the same way.
  uncut: ['33.218', '33.415', '33.418', '33.420', '33.445', '33.526', '33.700', '33.825', '33.846',
          '33.130', '33.140', '33.150']
  # The footer "110-12" in its spacings ("110-      2", "120-"), in the
  # lines just above a page start. Measured 2026-10-29 on every page start of
  # the 11 page-mapped chapters; a figure caption there ("Figure 110-8") is
  # printed text and stays.
  page_furniture: '^\s*\d{3}-\s*\d{0,3}\s*$'
  # The running header on a page's own first two lines: "Chapter 33.110
  # ... Title 33, Planning and Zoning" over "Single-Dwelling Zones ...
  # 10/1/24", or the facing page's "Title 33, Planning and Zoning ...
  # Chapter 33.110" over "3/1/25 ... Single-Dwelling Zones"; two pages print
  # the footer there.
  page_head: '^\s*(?:Chapter\s+33\.[\d ]+\s{2,}Title 33, Plann\s*ing and Zoning|Title 33, Plann\s*ing and Zoning\s{2,}Chapter\s+33\.[\d ]+|\d{1,2}/\d{1,2}/\d{2}\s{2,}\S.*|\S.*\S\s{2,}\d{1,2}/\d{1,2}/\d{2}|\d{3}-\s*\d{0,3})\s*$'
