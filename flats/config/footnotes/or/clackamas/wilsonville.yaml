  # --- Section 4.132 Table 1 and Table 2, the Town Center Zone --------
  #
  # Eight notes on a zone this layer does not hold, and this is a gap rather
  # than a curiosity. The Town Center Zone is 4.132; it is one of Wilsonville's
  # ten zones and it permits housing -- Table 2 sets a MINIMUM residential
  # density of 40 units per acre in MSD, MU and C-MU and 16 in N-MU, a minimum
  # of two storeys everywhere, and a maximum front setback of 10 or 20 feet.
  # Every one of those is a field this registry has.
  #
  # Nothing in this corpus can see the omission. Wilsonville contributes no
  # observed lots to the coverage ledger at all, so there is no zone_missing
  # row for TC the way there was none for Lake Oswego's six residential zones
  # -- a missing zone is invisible to a ledger that counts fields. Gresham's
  # unheld districts were safe because no lot claimed them; that check cannot
  # be run here, and the honest statement is that TC is unencoded, not that it
  # is empty. The V Village Zone at 4.125 is the same story: Villebois is a
  # built master-planned neighborhood, its Table V-2 is in this document, and
