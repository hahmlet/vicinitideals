  - quote: "or/clackamas/wilsonville/4.planning.txt#L8677"
    digest: "9ab685488fe9"
    state: dismissed
    reason: >-
      note 1 of Table 1 counts the landscaping area inside the sidewalk width
      and requires root barriers or structural soils in tree wells. A public
      realm standard about what goes in the right of way, not a standard on
      the lot, and Table 1 belongs to a zone this layer does not hold

  - quote: "or/clackamas/wilsonville/4.planning.txt#L8680"
    digest: "335b4fab39a2"
    state: dismissed
    reason: >-
      note 2 permits at most two parklets per block per side of street. A
      parklet occupies on-street parking spaces, which are not the off-street
      stalls this screen fits, and Table 1 belongs to the Town Center Zone

  - quote: "or/clackamas/wilsonville/4.planning.txt#L8740"
    digest: "6e789cafee3d"
    state: dismissed
    reason: >-
      note 1 of Table 2 exempts existing development and binds all new
      buildings in the district. It is an applicability sentence, and it says
      the standards apply in full to exactly what this screen places -- which
      is the reason the zone being unencoded is a gap rather than a
      non-question

  - quote: "or/clackamas/wilsonville/4.planning.txt#L8742"
    digest: "01cdc76bc62e"
    state: dismissed
    reason: >-
      note 2 splits the maximum front and street side setback by use -- 10 ft
      for commercial, 20 ft front for mixed-use and residential-only -- and
      then permits front setbacks used for seating or other active frontage.
      A maximum setback is a real constraint on a building placed by fixed
      dimensions, and setback_front_max_ft exists to hold one. Not encoded
      because the zone is not

  - quote: "or/clackamas/wilsonville/4.planning.txt#L8747"
    digest: "4c5ef80a9aad"
    state: dismissed
    reason: >-
      note 3 requires second and higher storeys to be useable and forbids
      false fronts. It polices a design dodge around the two-storey minimum
      rather than stating a dimension, and the minimum it protects belongs to
      a zone this layer does not hold

  - quote: "or/clackamas/wilsonville/4.planning.txt#L8749"
    digest: "3119d5e4524b"
    state: dismissed
    reason: >-
      note 4 grants one extra storey in MSD, MU and C-MU where a quarter of
      the bonus floor area is affordable for ten years at 80 percent of median
      family income. A height bonus is relief, and this two-storey building
      does not need it -- but max_height_stories is a field, and the note is
      the sort that has to be read again the day TC is encoded

  - quote: "or/clackamas/wilsonville/4.planning.txt#L8754"
    digest: "a1c54d894de5"
    state: dismissed
    reason: >-
      note 5 exempts residential-only buildings from the 12 or 15 foot ground
      floor height minimum. That exemption is what makes a residential
      building possible in the district at all, since a 15 ft ground floor
      under a two-storey minimum would put the roof above this pod's 26 feet.
      It relieves rather than binds, and the zone is unencoded

  - quote: "or/clackamas/wilsonville/4.planning.txt#L8755"
    digest: "8bc467ec570b"
    state: dismissed
    reason: >-
      note 6 applies the minimum residential density to residential-only
      development and waives it for mixed-use. The floor it governs is 40
      units per acre in three of the four sub-districts, which is the
      standard in this table most likely to refuse a four-unit building: four
      units at 40 per acre needs a lot no larger than 4,356 sq ft.
      min_density_du_per_acre and min_units_at_trigger both exist. Not encoded
      because the Town Center Zone is not encoded

