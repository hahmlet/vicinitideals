# Wilsonville -- Development Code Chapter 4 footnotes.
#
# Fifty-one notes are captured here and twenty-seven of them sit over a value
# this corpus encodes. The other twenty-four belong to Table 8B and Table 8C
# (the Frog Pond East and South neighborhoods), to the Town Center
# sub-districts MSD, N-MU, MU and C-MU, and to the parking maximums in
# Section 4.155. None of them reaches a value here, and they stay unread
# rather than being waved through.
#
# Nearly all of what follows is Table 8A, the Frog Pond West lot standards,
# whose notes run A through P and were invisible to this system until the
# census learned to read a letter. Every RN dimension in the corpus is read
# off that table. Four of its sixteen notes are carried in the encoding, ten
# are dismissed, and two are unmeasured -- both because the code moves the
# line a setback is measured from onto an easement nobody here holds.
#
# Two dismissals are worth stating plainly, because neither is clean:
#
# Note C states 7,000 sq ft for a quadplex in the R-5 and R-7 sub-districts.
# It is dismissed only because this zone is encoded on the R-10 column, where
# the note is silent and the 8,000 single-family base governs. If the
# sub-district a lot sits in ever becomes knowable, note C is an encoding and
# not a dismissal.
#
# Note O limits a lot with front-loaded garages to one shared driveway per
# street however many units are on it. That is a real constraint and it is
# dismissed on the pod rather than on the code: the design this screen exists
# to place takes a single shared driveway to a rear court. A site plan that
# gave each unit its own apron would fail this note, and this file would be
# the wrong place to notice.
#
# The parking table's note is the one dismissal that is purely about scope.
# Section 4.125 Table V-2 sits between the setback provisions of 4.113 and the
# zone tables that cite them, so the block's region reaches 137 values printed
# pages earlier under different tables. Wilsonville encodes no parking
# standard at all; if one is ever read off Table V-2, this ruling has to be
# revisited rather than inherited.
notes:
  # --- Section 4.125 Table V-2, off-street parking -------------------
  - quote: "or/clackamas/wilsonville/4.planning.txt#L5290"
    digest: "f3d1324c295a"
    state: dismissed
    reason: >-
      the notes to the off-street parking table -- a higher minimum for court
      facilities, and no additional parking where middle housing is created by
      converting or adding to an existing single-family dwelling. This layer
      encodes no parking standard, and the values the block's region reaches
      are setbacks and lot dimensions read from Sections 4.113, 4.122 and
      4.123, printed pages earlier under different tables

  # --- Section 4.127 Table 6B, the middle-housing unit mix -----------
  #
  # One reason, said ten times on purpose: it is a class, and deleting the
  # reason returns all ten to unread at once. Table 6B sets minimum numbers of
  # middle housing, small and mobility-ready units a Stage I Master Plan must
  # deliver across a subdistrict. Its notes say what counts toward those
  # minimums and when a neighbouring subdistrict's surplus may be borrowed.
  # The value they are joined to is RN's quadplex permission, which is `false`
  # and comes from 4.127(.02)B.1.a.ii -- "quadplexes are not permitted". A
  # note about how a master plan meets a minimum cannot permit a use the zone
  # prohibits.
  - quote: "or/clackamas/wilsonville/4.planning.txt#L6807"
    digest: "ae0097e7a0bb"
    state: dismissed
    reason: >-
      Table 6B counts middle housing toward a Stage I Master Plan's minimum
      unit mix; nothing in its notes permits a use, and the value they govern
      is a prohibition stated in 4.127(.02)B.1.a.ii

