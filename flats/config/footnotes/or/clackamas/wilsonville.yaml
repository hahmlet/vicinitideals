  # --- Section 4.127 Tables 8B and 8C, Frog Pond East and South -------
  #
  # Read 2026-08-22. Fourteen notes on two tables that govern land inside a
  # zone this layer holds, which is what makes them different from Gresham's
  # standards-waiting-for-land and worth stating carefully.
  #
  # 4.127(.08)C splits the RN zone in two: Frog Pond West is governed by Table
  # 8A and "lot and development standards for the Frog Pond East and South
  # Neighborhoods are established by Table 8B". This layer encodes RN entirely
  # off Table 8A, R-10 Large Lot column, because nothing published says which
  # neighborhood -- let alone which sub-district -- a lot is in. Tables 8B and
  # 8C are the other two thirds of the same zone.
  #
  # Nothing is encoded from them, on three grounds stated in order of weight:
  #
  # 1. RN's use gate is a settled prohibition. 4.127(.02)B.1.a.ii shuts
  #    quadplexes out of Frog Pond West during initial development, the zone
  #    carries that false with nothing levering it, and a settled false ends
  #    the reading before any dimension is reached.
  #
  # 2. Table 8B's rows are Urban Form Types 1, 2 and 3, whose boundaries are
  #    described in prose at 4.127(.07)B and drawn in Figure A-7. Same problem
  #    as Table 8A's three sub-districts and one step worse: the type is a
  #    designation applied to parts of a subdistrict, and no published layer
  #    carries it.
  #
  # 3. The stored extraction of Table 8B is positionally ambiguous. Type 1's
  #    row reads "10 50, 4 story See Table 8C. None 10 E 5F"; Type 3's reads
  #    "15 100 15 H", with no height cell where Types 1 and 2 have one. Eleven
  #    columns, three rows and at least one that does not line up. A number
  #    read out of that is a guess wearing a citation.
  #
  # WHAT WOULD CHANGE IF THE USE GATE OPENED. Worth writing down rather than
  # discovering later. 4.127(.02)B.2 does NOT prohibit quadplexes in East and
  # South -- it says the mix of unit types there is "limited and controlled by
  # the variety standards in Subsection (.06)C.-E." So the settled false this
  # zone carries is a Frog Pond West sentence applied to all three
  # neighborhoods because a lot cannot be placed in one of them. It is the
  # conservative direction (a lot that might be buildable is called RED, never
  # the reverse), and it costs this layer whatever quadplex capacity East and
  # South hold.
  #
  # And if it opened, Table 8A's R-10 column would not be strict enough. On
  # every field the two tables share, 8A R-10 is the binding one -- lot size
  # 8,000 against "sized to accommodate", width 40 against 10 or 15, rear 20
  # against 10 or 15, coverage 40 against 80. With one exception: Table 8B
  # gives Urban Form Type 3 a side setback of "5 for structures up to 25 feet
  # in height, 10 for structures over 25 feet in height", and the pod stands
  # 26. The encoded 5 ft would be half the required yard on an ordinary Type 3
  # lot. Table 8C's note E is the same shape on the front and lands in the
  # same place the encoding already sits, at 20 ft.
  #
  # THE OTHER HALF OF THE ZONE, unencodable for a second reason: Tables 8B and
  # 8C both state MAXIMUM setbacks -- front and street side -- and this layer
  # holds no maximum for RN at all. setback_front_max_ft exists in the
  # registry and is unused here. That is not an oversight to fix in this file;
  # it is the same Urban Form Type question, because the maximum is 10 ft in
  # Type 1, 25 ft in Type 2 and none at all in Type 3.

  - quote: "or/clackamas/wilsonville/4.planning.txt#L7425"
    digest: "e189e647d3f2"
    state: dismissed
    reason: >-
      note A sets the corner-lot street side minimum equal to the front
      minimum and applies the front MAXIMUM to it as well. The minimum half
      would be an encoding if this table were reachable -- RN's street side is
      10 ft from Table 8A note M and the front is 20 ft, so on an East or
      South corner lot the street side would double. The maximum half has no
      field here at all. Neither is made, because the zone's quadplex row is a
      settled false and the Urban Form Type is not a thing this system can
      look up

  - quote: "or/clackamas/wilsonville/4.planning.txt#L7427"
    digest: "46324fcfec77"
    state: dismissed
    reason: >-
      note B waives the side setback at a shared wall between townhouse units,
      which is the zero-lot-line allowance the split-plat path needs and the
      one thing in Table 8B that would loosen rather than tighten. Table 8A
      grants no such waiver -- its townhouse notes give a lot size and a width
      and stop -- so the two thirds of RN this note covers are screened
      against a side yard the code does not ask for there. Declining it costs
      a lot called too narrow, never a lot called buildable that is not

  - quote: "or/clackamas/wilsonville/4.planning.txt#L7428"
    digest: "202389e0afee"
    state: dismissed
    reason: >-
      note C exempts cottage clusters and accessory dwelling units from the
      maximum lot coverage standard. Neither is the housing type this screen
      places, and an exemption is a relief besides

  - quote: "or/clackamas/wilsonville/4.planning.txt#L7429"
    digest: "6896378388dc"
    state: dismissed
    reason: >-
      note D computes townhouse lot coverage across the combined lots a single
      building sits on rather than lot by lot. It is a measurement rule for
      the split-plat path and it loosens the ceiling -- a 2,000 sq ft building
      on four 1,500 sq ft unit lots is over 100 percent on any one of them and
      33 percent across the four. The unit-lot geometry this screen models
      already tests the parent footprint, so the note describes what is
      already done rather than changing it

  - quote: "or/clackamas/wilsonville/4.planning.txt#L7431"
    digest: "630c2a9fdd6c"
    state: dismissed
    reason: >-
      note E is Table 8B's garage setback rule and it is stricter than the one
      encoded from Table 8A note G: 20 ft for a street-loaded garage, 18 ft
      alley-loaded with an exterior driveway, and 3 to 5 ft alley-loaded
      without one. RN carries 20 ft with an 18 ft variant when the lot abuts
      an alley, which is the same pair of numbers. The third branch -- a
      3-to-5 ft setback where there is no exterior driveway, which is to say
      no apron to stand a car on -- is a shape setback_garage_entrance_ft
      cannot hold, since it is a maximum and a minimum at once and it depends
      on a site plan rather than on the lot

