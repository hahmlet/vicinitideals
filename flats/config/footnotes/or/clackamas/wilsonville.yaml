    digest: "e947bb3a9564"
    state: dismissed
    reason: >-
      a higher off-street parking minimum for court facilities, in the Village
      Zone's Table V-2. Not a use this screen places, not a zone this layer
      holds, and the values the block's region reaches are setbacks and lot
      dimensions read from Sections 4.113, 4.122 and 4.123, printed pages
      earlier under different tables
  - quote: "or/clackamas/wilsonville/4.planning.txt#L5291"
    digest: "5631c7a4ff61"
    state: dismissed
    reason: >-
      no additional off-street parking where middle housing is created by
      converting or adding to an existing single-family dwelling. It is a
      parking standard, which the screen does read -- but it relieves a
      conversion, and the pod is new construction on a lot, so the relief
      never reaches it. Nothing left to relieve either: the row it sits on
      reads NR for middle housing, and Section 4.155 Table 5 states the same
      absence citywide, which this layer now carries as an exempt
      parking_min_per_unit rather than as silence

  # --- Section 4.127 Table 6B, the middle-housing unit mix -----------
  #
  # One reason, said ten times on purpose: it is a class, and deleting the
  # reason returns all ten to unread at once. Table 6B sets minimum numbers of
  # middle housing, small and mobility-ready units a Stage I Master Plan must
  # deliver across a subdistrict. Its notes say what counts toward those
  # minimums and when a neighbouring subdistrict's surplus may be borrowed.
  # The value they are joined to is RN's quadplex permission, which is `false`
  # and comes from 4.127(.02)B.1.a.ii -- "quadplexes are not permitted". A
  # note about how a master plan meets a minimum cannot permit a use the zone
  # prohibits.
