# Oregon City -- Title 17 footnotes.
#
# Ruled on 2026-08-19. All eleven, in two piles.
#
# Four are dismissed, every one on the same ground: it can only *relax* a
# standard this screen enforces, so ignoring it can produce a lot we called
# too small or too tight, never one we called buildable and is not.
#
# The other seven are unmeasured. Each of them *tightens* placement on a fact
# nobody measures yet -- a utility easement, the zone across the line, a
# protected water feature. Dismissing them for tidiness is exactly the move
# that turns a read qualifier into a false GREEN, so they name the site fact
# they need instead: read, understood, and waiting on data. They stop blocking
# the encoding and go on capping the verdict.
