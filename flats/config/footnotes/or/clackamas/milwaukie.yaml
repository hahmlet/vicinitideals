  # Notes 1 and 2 print the same sentences as 19.301.4's notes 2 and 4 and are
  # ruled by those digests. What follows is what only R-HD prints.
  - quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L511"
    digest: "938212bc2d9d"
    state: dismissed
    reason: >-
      note 3 counts four single room occupancy rooms as one dwelling unit for
      density purposes. It changes the arithmetic for a housing type this
      screen does not place, and in the direction that fits more of it

  - quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L512"
    digest: "e12f4a926291"
    state: encoded
    encoded_as: "setback_street_side_ft variant, when [unit_lots], 5 ft"
    reason: >-
      note 4 sets the townhouse street side yard at 5 ft against the table's
      15, and it was already carried as the unit_lots variant when the value
      was quoted

