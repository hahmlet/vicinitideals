  # --- Table 19.303.2, the commercial mixed-use use table -------------
  #
  # Eight notes that sat under a heading the reader walked away from: the
  # table prints "Notes:", then eight lines of permission legend, then the
  # footnotes. They reach one encoded value, R-HD's side yard, and only
  # because the block's region runs back four hundred lines to the end of
  # the last block. Every one of them speaks to GMU, NMU or SMU.
  #
  # Note 1 is worth reading anyway. It says the four-consecutive-townhouse
  # limit of 19.505.5 does not apply in GMU -- which is the code confirming
  # that the limit binds everywhere else, and 19.505.5 prints it twice: no
  # more than 4 consecutive townhouses in the High Density Zone, and a
  # maximum of 4 in R-MD. The pod is four attached units. It is exactly at
  # that limit, not over it, and a fifth would not be placeable in either
  # zone on the townhouse path.
  - quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L921"
    digest: "d78fa7eb669e"
    state: dismissed
    reason: >-
      note 1 lifts the four-consecutive-townhouse limit of 19.505.5 in the GMU
      zone only. This layer encodes no GMU zone. The limit itself binds R-MD
      and the High Density Zone at 4, and the pod is 4, so the relief this
      note grants is relief the screen has no use for

  - quote: "or/clackamas/milwaukie/19.300.base-zones.txt#L923"
