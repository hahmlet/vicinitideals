# Lake Oswego -- LOC 50.03.002 (use table) and LOC 50.04 (dimensions).
#
# Sixty notes captured, twenty-eight of them over a value this corpus encodes.
# They fall into four groups and one of the four is the reason this layer will
# not go green on any lot.
#
# **Density.** Every residential table prints the same pair of sentences:
# middle housing is exempt from maximum density, and a townhouse project gets
# four dwellings per the lot area one single-family dwelling would need. Both
# halves are encoded. The first is why a pod fits a 7,500 sq ft R-7.5 lot at
# all; the second closes the split-plat path below 7,500 in R-7.5 and 5,000 in
# R-5, which is land four 1,500 sq ft townhouse lots do not add up to.
#
# **Minimum density.** The same tables ask a subdivision to deliver 80 percent
# of the theoretical yield -- or, in R-0, twenty units an acre -- computed on
# *net developable area*. That is a survey of the parcel, not an attribute of
# it, and nothing here holds one. Read, understood, and resting on a lot fact
# nobody measures: `unmeasured`, which caps the verdict without pretending
# somebody still has to read the sentence.
#
# **Site-specific standards.** The R-0 column of both the use table and the
# dimensional table carries "see LOC 50.02.002.2.c", a list of named
# properties carrying conditions from past approvals. A parcel on that list
# can be barred from a use its zone permits, and the list is not held either.
#
# **The rest** are other housing types, other zones, height rules for sloping
# ground, and relaxations -- dismissed, with the reason written down.
notes:
  # --- Table 50.03.002-1, the residential use table ------------------
