      here reads one zone per parcel

  - quote: "or/clackamas/lake-oswego/50.03.002.use-table.txt#L492"
    digest: "e8635f7f8c27"
    state: unmeasured
    fact: site_specific_limitation
    reason: >-
      note 4 stamps the R-0 column: "site-specific use limitations, see LOC
      50.02.002.2.c". That section is a list of named properties carrying
      conditions from past approvals, and a parcel on it can be barred from a
      use the zone permits. The list is not held

  # --- Table 50.04.001-1/-2, the R-7.5 zone ---------------------------
  - quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L235"
    digest: "8382d0fb9594"
    state: unmeasured
    fact: net_developable_area
    reason: >-
      note 1 is minimum density: a subdivision must produce the net
      developable area divided by the minimum lot size, times 0.8, rounded.
      Four units on land that could hold six is short of a floor rather than
      over a ceiling, and the quantity the floor is computed on is a survey of
      what the parcel loses to sensitive lands and dedications

  - quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L237"
    digest: "12b82f5551e3"
    state: encoded
    encoded_as: >-
      R-7.5 max_density_du_per_acre exempt; R-7.5 quadplex_allowed false when
      [unit_lots] under 7,500 sq ft
    reason: >-
      note 2 in both halves. Duplexes, triplexes, quadplexes and cottage
      clusters are exempt from maximum density, which is what lets the pod sit
      on one lot -- and it is an exemption rather than a large number, because
      the table's Maximum row prints the marker and nothing else. Townhouse
      projects get four dwellings per the lot area one single-family dwelling
      needs, which in R-7.5 is the 7,500 on L59, so the split-plat path closes
      below that figure. No per-lot number is written: 7,500 divided by four
      is a number the code does not print, and what the note withholds under
      it is permission

  - quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L239"
    digest: "1c0207f1d714"
    state: dismissed
    reason: >-
      a 25% cut in minimum lot area to relocate a designated historic
      landmark. A relaxation, granted for moving a landmark onto the site;
      declining it can only cost a lot that would have qualified

  - quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L241"
    digest: "3839f3e55683"
    state: dismissed
    reason: >-
      a foot of extra height for every five extra feet of setback on all
      sides. A relaxation of a standard this layer does not encode for R-7.5,
      and one bought with yard the pod is trying to fit inside

  - quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L243"
    digest: "deeb8fc51849"
    state: dismissed
    reason: >-
      how base height is measured on sloping ground -- a flat plane 28 ft over
