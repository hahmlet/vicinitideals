  # --- Table 50.04.001-1/-2, the R-7.5 zone ---------------------------
  - quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L235"
    digest: "8382d0fb9594"
    state: unmeasured
    fact: net_developable_area
    reason: >-
      note 1 is minimum density: a subdivision must produce the net
      developable area divided by the minimum lot size, times 0.8, rounded.
      Four units on land that could hold six is short of a floor rather than
      over a ceiling, and the quantity the floor is computed on is a survey of
      what the parcel loses to sensitive lands and dedications

  - quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L237"
    digest: "12b82f5551e3"
    state: encoded
    encoded_as: >-
      R-7.5 max_density_du_per_acre exempt; R-7.5 quadplex_allowed false when
      [unit_lots] under 7,500 sq ft
    reason: >-
      note 2 in both halves. Duplexes, triplexes, quadplexes and cottage
      clusters are exempt from maximum density, which is what lets the pod sit
      on one lot -- and it is an exemption rather than a large number, because
      the table's Maximum row prints the marker and nothing else. Townhouse
      projects get four dwellings per the lot area one single-family dwelling
      needs, which in R-7.5 is the 7,500 on L59, so the split-plat path closes
      below that figure. No per-lot number is written: 7,500 divided by four
      is a number the code does not print, and what the note withholds under
      it is permission

