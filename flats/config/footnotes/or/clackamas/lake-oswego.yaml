  # === The commercial half of Lake Oswego, read 2026-08-22 =============
  #
  # Thirty-three notes, and every one of them is a note on the half of this
  # city this layer does not hold. Ten sit under Table 50.03.002-2, the
  # commercial, mixed use, industrial and special purpose use table; nineteen
  # under Table 50.04.001-14, its dimensional twin; two under the EC height
  # table; two under the general height exceptions.
  #
  # THIS IS A GAP, and it has a size. Three of those zones carry observed lots
  # in the coverage ledger and none of the three is encoded: NC/R-0 with 84
  # lots over 18.4 acres, PNA with 5 lots over 50.1 acres, and NC with 4 lots
  # over 13.9 acres. Ninety-three lots, reported zone_missing, contributing
  # nothing to any verdict. That is different from Gresham's four unbuilt
  # sub-districts, which no lot claimed, and different again from Wilsonville's
  # Town Center, which nothing in the corpus could see at all.
  #
  # WHAT WAS LEARNED READING THEM, and the reason it is written here rather
  # than left for the next reader to re-derive. Both tables extract as a
  # header block followed by a flat run of cells with no column attached, and
  # a row with fewer cells than columns is a row with invisible blanks in it.
  # Table 50.04.001-14 has eleven columns -- NC, GC, HC, OC, EC, FMU, WLG,
  # CR&D, MC, I, IP -- and its height row prints ten cells. The notes are what
  # resolve it, because four of them name their own zone:
  #
  #   [18] is FMU State Street Height, [11] points at 50.04.001.4.c.ii which
  #   is headed CR&D Zone Height Measurement, [13] points at 4.c.iv which is
  #   headed MC Zone Height Measurement, and the fifth cell is the bare
  #   cross-reference "50.04.001.4.c.i", headed EC Zone Height Measurement.
  #
  # Line those four up and the row reads NC 35, GC 45, HC 60, OC 45, EC by
  # cross-reference, FMU 45 near State Street and 90 elsewhere, WLG by
  # cross-reference to 4.b, CR&D by cross-reference, MC 95, I 60, IP 45 -- one
  # blank, at WLG, whose header cell already says "See 50.04.001.4.b". The
  # left edge is anchored independently in the use table, where three
  # different rows put note [10] -- expressly a GC note -- in the second cell.
  #
  # So NC is readable: 35 ft, FAR 0.25:1, lot coverage 100 percent, setbacks
  # nothing except 25 ft from a structure on a lot zoned R-5 through R-15,
  # 10 ft from R-0, R-2 or R-3, and zero where the lot is not next to a
  # residential zone. It is not encoded here because encoding a zone is a
  # different act from ruling a footnote, and because the use gate needs
  # LOC 50.03.003.2 read first -- the use-specific standards the residential
  # cell in NC, GC, EC and CI is subject to, which this corpus has not fetched.
  # Named as the next piece of work rather than left implicit.
  #
  # The tail of both tables stays ambiguous and stays unencoded with it. In
  # the setback rows the cells run out before the columns do and no note
  # anchors the last three, so I, IP and MC could each be holding a figure
  # printed one column over. A number read out of that is a guess wearing a
  # citation.

