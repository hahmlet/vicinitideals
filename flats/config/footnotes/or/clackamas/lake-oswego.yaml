  - quote: "or/clackamas/lake-oswego/50.03.002.use-table.txt#L491"
    digest: "57cac05edacf"
    state: unmeasured
    fact: split_zone
    reason: >-
      note 3 stamps the R-3 and R-0 column heads: "if lot has multiple zones,
      e.g., R-0/EC, see LOC 50.02.002.2.e". Each zone then governs the part of
      the lot it covers, so on a split lot the pod is bound by whichever zone
