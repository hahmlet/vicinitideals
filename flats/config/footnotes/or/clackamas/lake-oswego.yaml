  # --- Table 50.04.001-13, R-2 Yard Setbacks ---
  # Live from 2026-08-21, when R-2 was encoded. Nothing quoted this region
  # before, because the zone the table is written for was not in the funnel.

  - quote: "or/clackamas/lake-oswego/50.04.dimensional.txt#L1597"
    digest: "b3ea94a3b22d"
    state: unmeasured
    fact: abuts_lower_density_zone
    reason: >-
      the note itself is a relief for a building this is not -- a multi-story
      DETACHED dwelling may reduce its cumulative side yard by stepping the
      upper floor back. The marker sits in the Detached Dwelling row; the
      Quadplex row states 7 ft with no marker on it. But the body runs past
      the note and takes the three subsections printed under the table with
      it, and one of them binds: "Abutting Low Density Residential" requires a
      lot zoned R-0, R-2 or R-3 that abuts R-6, R-7.5, R-10 or R-15 to set the
      building back from the common line by the greater of the table setback
      or the HEIGHT of the building. On a 26 ft pod against a 7 ft side yard
      that is nearly four times the standard, and it turns on the neighbour's
      zoning, which nothing here reads. The other two subsections loosen or do
      not reach: an 18 ft front setback on steeply sloped lots, and ten ft of
      separation between cottages
