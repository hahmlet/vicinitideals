# Sandy -- Development Code (Title 17) footnotes.
#
# Fifteen notes, none of which changes whether or how a row house or a
# multi-family building sits on a lot in R-1, R-2 or R-3. Three shared
# reasons carry most of them: zero-lot-line carve-outs (the printed side yard
# is kept), vision clearance (a corner-lot triangle nothing here draws, queued
# as a follow-up), and notes on commercial/industrial tables (those zones are
# refused). Dismissals bind to the words, not the line.
notes:
  - quote: "or/clackamas/sandy/sdc.17.34.txt#L163"
    digest: "210125f94b77"
    state: dismissed
    reason: >-
      the note points to the vision-clearance triangle at street corners (17.74.30): no obstruction between 3 ft and 8.5 ft inside a triangle measured off the curb lines. It is a corner-lot restriction that nothing in this screen draws; it is listed as NOT ENCODED in sandy.yaml and queued in FOLLOWUPS. Dismissed here, not resolved: a building set exactly at the street setback of a small corner lot could in principle clip the triangle

  - quote: "or/clackamas/sandy/sdc.17.34.txt#L165"
    digest: "783b700f15c2"
    state: dismissed
    reason: >-
      single room occupancies are a use this building is not; the note sends them to the single-detached standards

  - quote: "or/clackamas/sandy/sdc.17.36.txt#L179"
    digest: "49489447607a"
    state: dismissed
    reason: >-
      the note carves zero-lot-line development OUT of the standard it sits on (the side yard). Reading it would only relax a yard for lots that share a wall; this screen keeps the printed side yard, which can only cost a lot a false RED, never certify one that does not fit

