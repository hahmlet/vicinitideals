# Happy Valley -- Land Development Code Chapter 16.22 footnotes.
#
# Fifty-six notes under eleven tables, none of them read until now, and the
# largest single block of unread footnotes in the corpus -- 42 percent of
# everything holding a jurisdiction short of GREEN.
#
# Reading them found five standards the layer did not carry, which is the
# argument for the census in one line. Four of the five turn on the same word.
# Every residential table in this chapter prints a *townhome* row beside the
# row a quadplex is named in, and the townhome row is the looser one:
#
#   * a lot minimum of 1,500 square feet against R-40's 40,000;
#   * no lot width requirement at all;
#   * twenty feet of street frontage against a hundred;
#   * an interior side yard of zero.
#
# The first of those is the expensive one. A four-unit building platted as
# townhouses needs 6,000 square feet in every one of these zones; the file
# held R-40 to 40,000, and a lot the code permits this building on screened
# RED for missing a standard it is not held to.
#
# The fifth is the opposite direction, and worse. The note over all three use
# tables reads "Applies to a parent lot. Duplexes, triplexes, quadplexes, and
# cottage clusters are not permitted on a child lot" -- a qualification on the
# *permission*, not on a dimension. Nothing in the file said so, so a child
# lot of a middle housing land division screened GREEN for a building the code
# forbids there outright.
#
# Two shared reasons carry most of the dismissals and are meant to:
#
# * "a footnote is scoped to the table it sits under" -- Tables 16.22.050 and
#   16.22.060 state the standards for the SFA, MUR-A, VTH, MUR-M and MUR-X
#   districts, and none of those districts is encoded yet. Fifteen notes are
#   ruled on that sentence alone. They are dismissed as *out of scope*, not as
#   harmless: encoding those districts is an open item in the layer notes, and
#   the day it happens these fifteen return to the queue by deleting the
#   reason they share.
#
# * "the note loosens a standard for a building this is not" -- the height
#   note raises the side and rear limit for single-family residential, the
#   coverage notes exempt cottage clusters. Neither reaches a four-unit pod,
#   and both would only ever add room.

notes:
  # --- the use permission, qualified ---------------------------------------

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L271"
    digest: "80e1c0d8440b"
    state: encoded
    encoded_as: >-
      quadplex_allowed variant `value: false when: [middle_housing_child_lot]`
      in R40, R20, R15, R10, R8.5, R7, R5 and MURS -- every zone whose use
      table carries the note.
    reason: >-
      The note sits over all three residential use tables and qualifies the
      permission itself: on a child lot of a middle housing land division a
      quadplex is not a smaller building, it is no building. The fact is
      registered assumed-false, because middle housing land divisions date
      from 2022 and are a small share of any county's lots, and because the
      answer is in the plat record rather than out of reach. The assumption
      comes back with the answer as FACT_ASSUMED rather than disappearing
      into it.

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L307"
    digest: "3ea72b60c393"
    state: dismissed
    reason: >-
      "If a duplex, triplex, fourplex, or cottage cluster has been divided by a
      middle housing land division... the development standards that are
      applicable to the lot shall apply to the middle housing parent lot, not
      to the middle housing child lot." It directs the standards at a different
      lot rather than changing any of them, and this screen tests one lot at a
      time against the standards as printed. The only case it governs -- a
      child lot -- is already closed by the note above, which forbids the
      building there.

  # --- the townhome column, four standards deep ----------------------------

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L303"
    digest: "d18c11411223"
    state: encoded
    encoded_as: >-
      min_lot_width_ft variant `exempt: true when: [unit_lots]` in R40, R20,
      R15, R10, R8.5 and R7.
    reason: >-
      "Townhomes are exempt from the lot width requirements." An exemption
      rather than a smaller number: the code switches the standard off for this
      building instead of loosening it, and `exempt` is how that is said.

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L675"
    digest: "e2ac779b56bd"
    state: encoded
    encoded_as: "min_lot_width_ft variant `exempt: true when: [unit_lots]` in R5."
    reason: >-
      The same exemption as the note above with a sentence added -- "Street
      frontage controls lot width for townhomes" -- which is not a second
      standard but a pointer to the frontage row, itself encoded with its own
      townhome variant of twenty feet. Held as a separate ruling because the
      wording differs and a digest that matched both would be lying about
      which sentence was read.

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L305"
    digest: "efd4892dc931"
    state: encoded
    encoded_as: >-
      setback_side_ft variant `value: 0 when: [attached_wall, unit_lots]` in
      R40, R20, R15, R10, R8.5, R7 and R5.
    reason: >-
      "Interior side yard setbacks for townhomes may be reduced to zero in
      compliance with applicable sections of the adopted Uniform Building
      Code." This is the sentence the `15/0`, `10/0`, `7/0` and `5/0` cells
      abbreviate; the row alone does not say what the zero is for. Conditioned
      on unit lots as well as the party wall, because a townhome in this code
      sits on its own lot -- the table gives it a lot minimum of its own two
      rows up.

  # --- the note the whole census paid for ----------------------------------
  #
  # Not a footnote at all in the file's shape: the townhome lot minimum is a
  # table row. It is recorded here because the notes are what sent a reader to
  # the row, and because the size of the correction is the case for reading
  # them.

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L302"
    digest: "8b8e073952a0"
    state: dismissed
    reason: >-
      "Density calculations for single-family detached shall be made pursuant
      to Section 16.63.020(F). Cottage clusters must meet a minimum density of
      four units per gross acre." Two rows, neither of them this building's:
      the density this layer encodes is the townhome maximum on the row below,
      which states its own net-acre denominator and carries it as
      `measured_on`. The 16.63.020(F) pointer is read and cited there.

  # --- landscaping ---------------------------------------------------------

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L679"
    digest: "c48a98cc9b06"
    state: encoded
    encoded_as: "min_landscaped_pct = 20 on every zone in the layer."
    reason: >-
      "Pursuant to Section 16.42.030, 20% of the net developable area must be
      usable open space." The city's own gloss on the standard encoded from
      16.42.030(B)(1), and it disagrees with the chapter about two words: the
      chapter says "gross developable lot area... shall be landscaped", the
      footnote says net developable area and usable open space. Both
      denominators are smaller than the lot, so the value is held against the
      lot's own area, which asks for at least as much as either reading does.
      The share is the same twenty percent in both.

  # --- loosenings this building cannot use ---------------------------------

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L308"
    digest: "ad1e465e2a88"
    state: dismissed
    reason: >-
      "Maximum lot coverage for townhomes is the greater of the percentage
      identified in the table or up to 1,000 square feet of buildings, decks,
      stairways and entry bridges that are more than 30 inches above grade."
      A floor under the allowance rather than a percentage, and there is no
      form for the greater of a rate and an area. Leaving it out can only cost
      a GREEN on a small townhome lot; it can never make one, which is the
      direction that decides whether an unencodable note may be dismissed.

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L118"
    digest: "0919e0e581b5"
    state: dismissed
    reason: >-
      "The single-family residential building height maximum is 45 feet at the
      front elevation; side and rear elevations may not exceed 49 feet." It
      raises the limit, for single-family residential, from the 45 the table
      already prints. The pod is a four-unit building and it is 26 feet tall,
      so neither half reaches it.

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L304"
    digest: "61ad8aa1880d"
    state: dismissed
    reason: >-
      "Cottage cluster housing is exempt from lot coverage requirements." A
      cottage cluster is a different building type with its own rows in every
      one of these tables, and the pod is not one.

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L494"
    digest: "11266f317e33"
    state: dismissed
    reason: >-
      "Cottage clusters are exempt from lot coverage requirements." The same
      exemption as the note above in different words -- this table drops
      "housing" -- and dismissed for the same reason: the pod is not a cottage
      cluster. Ruled separately because the wording differs, and a shared
      ruling would claim a sentence was read that was not.

  - quote: "or/clackamas/happy-valley/16.22.residential.txt#L677"
    digest: "54234f903021"
    state: dismissed
    reason: >-
      "Standards may be proposed for amendment by Master Plan, PUD or Design
      Review land use applications." A relief path rather than a standard, and
      relief is held in the relief policy where a screen can say which
      application a miss would need. It states no dimension to encode.

