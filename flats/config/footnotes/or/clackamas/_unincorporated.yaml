    digest: "11f6c6281d46"
    state: dismissed
    reason: >-
      the affordable-housing door, and it is the one sentence in either
      of this county's urban use tables that can admit a dwelling type the
      district prohibits: a dwelling "not otherwise permitted" is permitted
      anyway if it is developed as affordable housing as defined in ORS
      197A.445(1) and subject to Section 846. What it turns on is the
      development and not the lot. This product is market rate, so the door
      is shut by what is being placed rather than by anything about the
      land, and a screen that opened it would be answering a question it was
      not asked.

      Rewritten 2026-09-08, and the rewrite is the point. The same sentence
      is note 6 of Table 315-1 and note 11 of Table 510-1, so one ruling
      answers both -- and the reason first written for it here was "a
      quadplex is already permitted outright in all nine districts, so the
      door is one this building has no need of". True of Section 315. False
      of Section 510, where NC and C-2 prohibit a quadplex and this is the
      only way back in. A digest match carries a reason into a table the
      reason was never about, so a reason has to be about the sentence

  - quote: "or/clackamas/_unincorporated/zdo.315.txt#L1076"
    digest: "f2a1c4b237bd"
    state: dismissed
    reason: >-
      note 7 IS on the Quadplexes cell, and it is the one-primary-building
      rule: apart from an accessory dwelling unit or a temporary permit, a
      lot of record may hold only ONE of cottage cluster, detached
      single-family dwelling, duplex, manufactured home, prefabricated
      structure, quadplex, single room occupancy, townhouse or triplex. It
      bars combining types, not building one. This screen places a single
      quadplex as the development of the lot, which is exactly one of the
      listed types, so the rule is satisfied by the thing being screened.
      What it would refuse is a quadplex ADDED beside a dwelling that
      stays -- a redevelopment question about what is already standing,
      which is not a dimensional standard and is not what this layer
      decides

