  # --- Table 510-1, the urban commercial use table, read 2026-09-08 --------
  #
  # Forty-four notes, thirty-six of them new here; the other eight are
  # sentences the county also prints under Table 315-1, and a ruling is a
  # statement about a sentence, so those were already answered. One of those
  # eight had to be rewritten on the spot, and it is the most useful thing
  # this block found. Note 11 -- "Dwellings not otherwise permitted in the
  # applicable zoning district may nonetheless be permitted if they are
  # developed as affordable housing" -- is word for word Section 315's note 6,
  # and the reason written for it there was "a quadplex is already permitted
  # outright in all nine districts, so the door is one this building has no
  # need of". That is true of Section 315 and false here, where NC and C-2
  # prohibit a quadplex and this note is the only way back in. A digest match
  # carries a reason into a table the reason was never about.
  #
  # Every marker in this table was walked back up its column to its row before
  # it was ruled, which is the check Section 316 taught. The result is short
  # enough to write out: of the forty-four, six reach a dwelling row at all.
  # Note 11 is printed on the group heading "Dwellings[11], including:", which
  # the county repeats once per column above Congregate Housing Facilities,
  # Duplexes, Multifamily Dwellings, Quadplexes, Townhouses and Triplexes.
  # Notes 12, 14 and 15 are on the Quadplexes row itself. Note 13 is on
  # congregate housing and note 16 on townhouses. The other thirty-eight are
  # printed on commercial rows -- drive-thrus, hotels, manufacturing, parking
  # structures, marijuana processing -- and reach this building only because
  # the whole notes block governs a value quoted from its region.
  #
  # Tables 510-2 and 510-3 are a different matter and are deliberately NOT
  # ruled here. See the jurisdiction file: nothing is encoded from either, so
  # neither block governs anything, and eleven of Table 510-2's notes are live
  # site conditions on a setback or a height ("If the rear lot line abuts a
  # residential zoning district, the minimum shall be 15 feet"). Dismissing
  # those today would be an amnesty collected by whoever encodes a dimension
  # here tomorrow. Left unread, they block, which is what unread is for.

