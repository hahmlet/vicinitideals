# Clackamas County unincorporated -- ZDO Section 315 footnotes.
#
# Three hundred and five markers, and until now not one of them had a body.
# This is the document every value in the layer cites, and the gate that holds
# a value back when an unread note governs it had nothing to hold: it reported
# the whole layer clean because it could not see a single note.
#
# Two readers were blind in series. The county writes each table's notes as an
# HTML ordered list, where the numbers are the browser's and never appear in
# the text, so the extractor stored ten bodies stripped of the only thing tying
# them to a marker. The notes that DID carry their numbers -- Table 315-3
# prints them as superscripts -- arrived as "9 Except for middle housing", one
# space and no heading, which is the one run shape the census declined. Fixing
# the extractor and teaching the census that shape is what produced this file.
#
# Then a third reader, one level down. Table 315-1's note 1 introduces its
# own criteria and they restart at 1, so the block headed where the INNER
# list did and read four sub-criteria as notes 1 to 4 -- stopping before
# notes 7 and 8, which are the two printed on the Quadplexes cell itself.
# The whole permission for this building in nine districts was governed by
# a pair of notes nobody had read. And a fourth: an HTML table puts every
# cell on its own line, so that cell arrives as the four characters "P7,8"
# and the marker reader, which asks a line to carry more than one
# permission code before believing it is a row, declined it.
#
# Seventy-seven notes over four blocks, every one of them read. They fall
# into seven groups.
#
# **Other housing types.** Most of the relief in this chapter names detached
# single-family dwellings, duplexes, manufactured homes, prefabricated
# structures and single room occupancies. Four attached dwellings are none of
# those, so the relief is not available -- which is the direction that keeps
# the encoded number.
#
# **Other application paths.** A planned unit development has no minimum lot
# size, no minimum rear or side setback and 65 percent coverage; a zero-lot-line
# development has no rear or side minimum either. Neither is a standard a
# by-right lot is measured against.
#
# **The split plat.** Six notes describe what happens on a middle housing lot:
# no minimum lot size, a third or a quarter of the DLA, coverage and setbacks
# measured from the parent lot. This layer screens the parent lot and carries
# the density half as `unless: [unit_lots]`.
#
# **A boundary nobody measures.** Three notes re-label a lot line, and only
# one of them can hurt. Frontage on a pedestrian connection becomes a SIDE
# line at five feet, which is the side setback already encoded, so those two
# cannot move a value. Frontage on an accessway becomes a FRONT line, which
# turns a five foot side into a ten foot front on whichever face it lands --
# and an accessway is not a street, so no street layer answers it. That one is
# `unmeasured` against a new condition, `abuts_accessway`.
#
# **The relief that looked like one and is not.** Note 12 ends "The maximum
# setback standards do not apply to cottage clusters developed pursuant to
# Section 845, Triplexes, Quadplexes, Townhouses, and Cottage Clusters" -- and
# read as a list of building types that lifts the 18 foot maximum front setback
# off this pod entirely. It is not a list. It is the TITLE of Section 845, and
# this document prints it that way nine times, in sentences where it cannot be
# anything else: "subject to Section 845, Triplexes, Quadplexes, Townhouses,
# and Cottage Clusters" (L1078), "For townhouses developed pursuant to Section
# 845, Triplexes, Quadplexes, Townhouses, and Cottage Clusters, there is no
# minimum lot size" (L1253) -- a sentence whose subject is townhouses and which
# would be self-contradicting if the trailing four were its scope. The relief
# runs to cottage clusters and to nothing else. A quadplex is not a cottage
# cluster, and the maximum binds.
#
# Which makes notes 18, 19 and 20 live rules rather than dead ones: each
# relaxes that same maximum, and each is declined here because a relief this
# screen does not take can only ever refuse a lot the county would pass.
#
# **Another use.** Table 315-1 is a use table for the whole chapter, so most
# of its twenty-three notes condition uses this screen never places --
# hotels, towers, swimming pools, recyclable drop-off sites, single room
# occupancies. Two of them state setbacks large enough to matter if they
# ever reached a dwelling (45 feet and 30 feet from any other residential
# lot), and they are written down rather than waved off for that reason.
# They govern here only because the region rule is deliberately blunt: a
# note in the region a value's quote falls in governs that value, whether
# or not the cell carries its marker.
#
# **Another district's table.** Table 315-4 covers PMD, MR-1, MR-2, HDR,
# VA, SHD and RCHDR. This layer holds none of them -- its nine zones are
# the eight urban low density districts and the two village districts --
# so its sixteen notes are read and dismissed as a block.
#
# **The two on the cell.** Note 7 is the one-primary-building rule: apart
# from an ADU or a temporary permit, a lot of record may hold only one of
# nine dwelling types. It bars combining them, and this screen places a
# single quadplex, which is one of the nine. Note 8 sends a quadplex to
# Section 845 -- the document this layer already reads its 7,000 square
# foot minimum lot size and its design standards from, which is the only
# thing that lets a pointer be called read.
#
# Nothing in this file loosens a standard. That is worth saying plainly: the
# gate went from governing nothing in this layer to governing sixty-four
# values under seventy-seven notes, and not one encoded number moved.
