# Clackamas County unincorporated -- ZDO Section 315 footnotes.
#
# Three hundred and five markers, and until now not one of them had a body.
# This is the document every value in the layer cites, and the gate that holds
# a value back when an unread note governs it had nothing to hold: it reported
# the whole layer clean because it could not see a single note.
#
# Two readers were blind in series. The county writes each table's notes as an
# HTML ordered list, where the numbers are the browser's and never appear in
# the text, so the extractor stored ten bodies stripped of the only thing tying
# them to a marker. The notes that DID carry their numbers -- Table 315-3
# prints them as superscripts -- arrived as "9 Except for middle housing", one
# space and no heading, which is the one run shape the census declined. Fixing
# the extractor and teaching the census that shape is what produced this file.
#
# Forty-one notes over four blocks. They fall into five groups.
#
# **Other housing types.** Most of the relief in this chapter names detached
# single-family dwellings, duplexes, manufactured homes, prefabricated
# structures and single room occupancies. Four attached dwellings are none of
# those, so the relief is not available -- which is the direction that keeps
# the encoded number.
#
# **Other application paths.** A planned unit development has no minimum lot
# size, no minimum rear or side setback and 65 percent coverage; a zero-lot-line
# development has no rear or side minimum either. Neither is a standard a
# by-right lot is measured against.
#
# **The split plat.** Six notes describe what happens on a middle housing lot:
# no minimum lot size, a third or a quarter of the DLA, coverage and setbacks
# measured from the parent lot. This layer screens the parent lot and carries
# the density half as `unless: [unit_lots]`.
#
# **A boundary nobody measures.** Three notes re-label a lot line, and only
# one of them can hurt. Frontage on a pedestrian connection becomes a SIDE
# line at five feet, which is the side setback already encoded, so those two
# cannot move a value. Frontage on an accessway becomes a FRONT line, which
# turns a five foot side into a ten foot front on whichever face it lands --
# and an accessway is not a street, so no street layer answers it. That one is
# `unmeasured` against a new condition, `abuts_accessway`.
#
# **One relief this building can actually take.** Note 12 states that the
# maximum setback standards do not apply to quadplexes developed under Section
# 845, so the 18 foot maximum front setback encoded on both village zones does
# not bind this pod. It is dismissed rather than encoded here because declining
# a relief is the safe direction -- a maximum nobody enforces can only ever
# have been satisfied -- and because taking it changes a value, which is a
# separate change with its own citation.
#
# Nothing in this file loosens a standard. That is worth saying plainly: the
# gate went from governing nothing in this layer to governing sixty-four
# values, and not one encoded number moved as a result.
