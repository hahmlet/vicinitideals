  # --- bdc.20.22.cooper-mountain.txt ---
  - quote: "or/washington/beaverton/bdc.20.22.cooper-mountain.txt#L242"
    digest: "51b6d466011f"
    state: encoded
    encoded_as: "CM-RM min_lot_sqft 4,000 (the Triplex and Quadplex row of B)"
    reason: >-
      Note 1 says the minimum lot area rows govern land divisions and also set
      the minimum lot needed to build each middle housing type on an existing
      lot, which is how the layer reads the quadplex row.
  - quote: "or/washington/beaverton/bdc.20.22.cooper-mountain.txt#L245"
    digest: "de9b3956e1de"
    state: dismissed
    reason: >-
      The note sends the standards of a middle housing land division to the
      parent lot, not the child lots. The pod is screened as a quadplex on one
      lot, which is the parent lot; the unit-lot path is a layer-wide NOT
      ENCODED comment.
  - quote: "or/washington/beaverton/bdc.20.22.cooper-mountain.txt#L248"
    digest: "eb174c7ac406"
    state: dismissed
    reason: >-
      The note points at 20.25.05.D, the exceptions to minimum density. An
      exception relaxes a floor the layer holds as a hard minimum, so ignoring
      it can only turn a lot RED that the code might pass, never the reverse.
      The minimum-density escape is a layer-wide comment and a doubt in the
      handoff.
  - quote: "or/washington/beaverton/bdc.20.22.cooper-mountain.txt#L249"
    digest: "881dbedb2727"
    state: dismissed
    reason: >-
      The note confines CM-RM's 6,000 square foot maximum lot area to lots
      with small-scale commercial uses. The pod is residential, so no maximum
      lot area reaches it.
  - quote: "or/washington/beaverton/bdc.20.22.cooper-mountain.txt#L250"
    digest: "baba7f6d3545"
    state: dismissed
    reason: >-
      The note says corner lots "may need" a greater minimum width for the
      sight clearance areas of the Engineering Design Manual. It states no
      figure, the Engineering Design Manual was not fetched, and `corner_lot`
      is a registered fact the screen assumes false rather than one it leaves
      open (the Lake Oswego corner rulings take the same line). A doubt in the
      handoff: the sight triangle may reach into the pod's footprint on a
      small corner lot.
  - quote: "or/washington/beaverton/bdc.20.22.cooper-mountain.txt#L252"
    digest: "6cf95a1a5d09"
    state: dismissed
    reason: >-
      A repealed or reserved note: the number is kept and the text is gone.
      Nothing to apply.
  - quote: "or/washington/beaverton/bdc.20.22.cooper-mountain.txt#L253"
    digest: "b1c6abb5525e"
    state: unmeasured
    fact: utility_easement
    zones: [CM-MR, CM-RM]
    reason: >-
      Note 7 sets the side setbacks: 5 feet (read in the layer for CM-MR and
      CM-RM), zero on a townhouse's attached side, 3 feet internal to a land
      division. And it says "In no case shall a building encroach into a
      Public Utility Easement (PUE)", which moves the building off an easement
      of whatever width the plat records, and no easement layer is held for
      Washington County. Ruled as 20.05's note 7 and Oregon City's easement
      notes were: it tightens placement on a fact nobody measures, so it caps
      the verdict. The side rows print N/A for CM-CS and CM-HDR, so it is
      narrowed to the two columns it governs.
  - quote: "or/washington/beaverton/bdc.20.22.cooper-mountain.txt#L258"
    digest: "20179c631198"
    state: dismissed
    reason: >-
