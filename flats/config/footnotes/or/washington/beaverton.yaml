# Beaverton Development Code (encodeplus export, printed 2026-09-28). Draft,
# cloud session 2026-09-29. Nothing here is verified.
#
# The census finds 305 notes in the Beaverton documents, 254 distinct
# sentences. One ruling covers every printing of its sentence, so a reason
# below is written to be true of all of them; the first printing is the
# quote. Four reader changes to flats/encode/footnotes.py brought most of
# these in (the handoff, Reader changes, has the before and after): the
# encodeplus heading "Footnotes:", the page footer, a lead line that names
# the section instead of the table, and a note number wrapped to the start
# of a line (Table 20.05.15 notes 16 to 23).
#
# Four are unmeasured. Two sentences carry "In no case shall a building
# encroach into a Public Utility Easement" (20.05 note 7, 20.22 note 7) and
# are ruled as Oregon City's easement notes were, on `utility_easement`;
# the NS district's 50 percent residential share and the Cooper Mountain
# Nature Park setback sit on `site_specific_limitation`, the nearest fact
# registered. Each caps the zones it names.
#
# WHAT THE CENSUS STILL MISSES, none of which reaches the pod:
# - bdc.20.15.employment-industrial L286-L312: use notes 15 to 26. Note 14
#   runs across a page and restarts its own list at "1. Routine check", and
#   the block ends there. They qualify transit centres, private recreation,
#   ancillary uses, food carts and vehicle camping in OI, OI-NC and IND,
#   where there is no dwelling row. The markers show as unbodied (17, 18,
#   24, 26).
# - bdc.70.downtown L645-L646: use notes 14 (emergency shelters) and 15
#   (exempt from minimum FAR) of Table 70.15.20.A, after note 13's lettered
#   list. Note 16, which the ADU row cites, is not printed at all.
# - wc.beaverton-upaa L389: "Page II ofl2", a page number read as a marker.
#
# AND WHAT IT OVER-CAPTURES. The encodeplus export runs a notes list
# straight into the next heading, so several bodies carry text past the
# note's end: figure captions, "C.Setbacks", the next district's purpose
# statement (Chapter 70), the opening of 70.15.10.5, ordinance histories,
# and the headings of 20.22.25 and 70.20.10.11. The rulings name the extra
# text where it is there and say why it sets no standard the screen holds.
