      larger site four units fall under the encoded minimum density of every
      district that admits the pod (at 7 units per net acre, the lowest of
      them, four units need no more than 0.57 net acres), so the note cannot
      pass a lot the layer would otherwise refuse, unless nearly all of a
      15-acre site is undevelopable.
