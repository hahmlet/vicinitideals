    fact: site_specific_limitation
    zones: [NS]
    reason: >-
      Note 1 lets only 50 percent of the contiguous area of any NS zone be
      developed residentially, except units above non-residential uses. It is
      a share of the whole district, so whether a given NS lot may still take
      a residential building depends on what its neighbours have built, which
      nothing here holds. No registered fact names a district-wide share;
      `site_specific_limitation` (a limitation on this parcel in particular,
      from outside its zone's own figures) is the nearest, and it leaves the
      lot UNKNOWN rather than GREEN, which is the direction this note must
      fail in. A registry fact is owed locally (handoff).
