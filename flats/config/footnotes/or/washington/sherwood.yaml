# Sherwood Zoning and Community Development Code (Municode publication 3865,
# Supplement No. 24) and Ordinance 2022-004, Exhibit 1. Draft, cloud session
# 2026-09-29. Nothing here is verified.
#
# The census finds one notes block in the Sherwood documents: the seven
# notes under the 16.12.030 residential standards table. Their markers are
# printed at the head of the row they qualify ("5 30 20 20 14 14 14" is the
# front yard row under note 5), so the census counts the bodies as unmarked;
# the rows each note sits on were read off the table by eye and are named
# in the rulings.
#
# WHAT THE CENSUS STILL MISSES, none of which reaches the pod:
# - sdc.16.22.commercial L448-L469 and L606-L622: the notes of the
#   commercial use table and the commercial dimensional table. The use-table
#   markers are glued to the column heads ("OCNC1RC GC") and the rows, and
#   the census sees neither block. Note 1 sends NC to the NC special
#   criteria (16.22.050); the others qualify non-dwelling uses and the
#   commercial heights. The multi-family row the layer quotes carries its
#   own numbered conditions in the cell and is read there.
# - sdc.16.31.industrial: the industrial use table's notes. Read since the
#   section cut (16.31/16.31.020.txt, ruled below); the proof copy's census
#   found no bodies. No dwelling row carries one.
# - sdc.16.14.residential-design L169: "D. Detailed design1", a heading's
#   footnote marker in the design standards. The standards the layer holds
#   from 16.14 are 16.14.010 F (front-yard parking) and the garage limit
#   comment; neither is under D.
# - ord.2022-004.16.14.030 L42 and L101: "{X1+X2}" and "width x1 width x2"
#   in the driveway figure, read as markers. They are the figure's labels.
notes:

  # --- sdc.16.12.residential.txt (16.12.030 table notes) ---
  - quote: "or/washington/sherwood/sdc.16.12.residential.txt#L444"
    digest: "be33eb6c0d9a"
    state: dismissed
    reason: >-
      Note 1 sits on the Townhome row of minimum lot area and lets interior
      townhome lots differ in size so long as the lots average no more than
      1,500 square feet. Townhomes, each unit on its own lot, are not the
      pod, which is screened as a quadplex on one lot under the Quadplex row.
  - quote: "or/washington/sherwood/sdc.16.12.residential.txt#L446"
    digest: "97f6f4355a04"
    state: dismissed
    reason: >-
      Note 2 sits on the minimum lot width at the building line and lets a
      cul-de-sac lot be narrower where that is needed for the rear yard. It
      relaxes a minimum the layer holds as a hard figure, so ignoring it can
      only turn a lot RED that the code might pass, never the reverse. The
      layer has no cul-de-sac fact; the note is a layer-wide NOT ENCODED
      comment.
  - quote: "or/washington/sherwood/sdc.16.12.residential.txt#L448"
    digest: "4575ae5dddf0"
    state: encoded
    encoded_as: >-
      max_height_ft and max_height_stories held together in VLDR, VLDR_PUD,
      LDR, MDRL and HDR (30 feet or 2 stories; 40 feet or 3 stories), each
      of which the screen applies, so the lesser governs; MDRH holds the 35
      feet only, since its story figure is two and a half and the stories
      field takes whole numbers
    reason: >-
      Note 3 says the maximum height is the lesser of the feet and the
      stories the row prints.
  - quote: "or/washington/sherwood/sdc.16.12.residential.txt#L449"
    digest: "7378fe85f9a6"
    state: dismissed
    reason: >-
      Note 4 sits on the row for chimneys, solar or wind devices and aerials
      and lets such structures exceed the height limits with a conditional
      use permit under Chapter 16.62. Not the pod; the dwelling height row
      is read in the layer.
  - quote: "or/washington/sherwood/sdc.16.12.residential.txt#L452"
    digest: "c781e9defaf7"
    state: dismissed
    reason: >-
      Note 5 sits on the front yard row and bars, in MDRL, MDRH and HDR, the
      reductions for architectural features that 16.50.050 would otherwise
      allow. The layer encodes no projection allowance in any zone, so the
      front setback is already held whole; the note takes away a relief the
      layer never gives.
  - quote: "or/washington/sherwood/sdc.16.12.residential.txt#L454"
    digest: "4d725cdb32ef"
    state: encoded
    encoded_as: >-
      setback_side_ft 5 in the six residential zones, whose quote carries
      this note beside the row
    reason: >-
      Note 6 sits on the interior side yard row and says no adjustment or
      variance to it is allowed. The screen applies neither anywhere, so the
      note changes nothing the layer does; it is quoted so a reviewer sees
      the 5 feet cannot be argued down.
  - quote: "or/washington/sherwood/sdc.16.12.residential.txt#L456"
    digest: "75e933a0690d"
    state: dismissed
    reason: >-
      Note 7 sits on the Townhome row of the interior side yard and waives
      the side yard between attached townhomes in one townhome block. The
      pod is a quadplex on one lot, whose side yard is the row above it (5
      feet), and a quadplex has no neighbouring unit on another lot to be
      attached to.

  # --- 16.31/16.31.020.txt (industrial use table notes) ---
  # The section cut takes the page furniture out of the table's foot, so the
  # census now reads this block; on the proof copy it found no bodies. The
  # table's only dwelling row is "Single dwelling unit ... for one (1)
  # security person employed on the premises", P in all three columns and
  # carrying no marker; the layer refuses the pod in LI, GI and EI on that
  # row and on B, unlisted uses prohibited. Note 10 is printed on the same
  # readable line as note 9 and is read with it.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L140"
    digest: "ad275183f781"
    state: dismissed
    reason: >-
      Note 1 is printed on the EI column head and sends the EI zone to its
      special criteria (16.31.050) and the Tonquin Employment Area to its
      commercial node rules (16.31.060). Both limit retail, service and
      commercial floor area; neither lists a dwelling, so the column's one
      dwelling row (the security dwelling) is unchanged and the pod is still
      refused in EI.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L141"
    digest: "47aa1ea280e7"
    state: dismissed
    reason: >-
      Note 2 lets a use mixed with another, such as a restaurant, count as
      secondary and permitted under half the floor area. It qualifies a
      commercial row; no dwelling row carries it.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L142"
    digest: "a5f941fc1172"
    state: dismissed
    reason: >-
      Note 3 caps a retail or service outlet at 5,000 square feet (20,000 in
      one project). A floor-area limit on commercial rows; no dwelling row
      carries it.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L143"
    digest: "daf30519cc97"
    state: dismissed
    reason: >-
      Note 4 allows its use on constrained land where structures would not
      otherwise be permitted, if no wetland or floodplain is impacted. It
      qualifies a non-dwelling row; no dwelling row carries it.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L144"
    digest: "1ab198affc6b"
    state: dismissed
    reason: >-
      Note 5 limits fueling to cardlock, wholesale or facilities serving an
      associated use, with no public retail fuel sales. A fuel-station row,
      not a dwelling.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L145"
    digest: "6522f5a418c2"
    state: dismissed
    reason: >-
      Note 6 sends marijuana facilities to the special criteria of Chapter
      16.38. Not a dwelling.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L146"
    digest: "c6b5b77cb3f0"
    state: dismissed
    reason: >-
      Note 7 caps the sales and rental area of an outlet at 5,000 square feet
      (20,000 in one project). A rental and sales row, not a dwelling.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L147"
    digest: "539a3ad57a7d"
    state: dismissed
    reason: >-
      Note 8 says animal boarding, kennels and pet daycare inside a building
      count as "other personal service". A service row, not a dwelling.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L148"
    digest: "47f8b8546586"
    state: dismissed
    reason: >-
      Note 9 applies the warehousing row to standalone warehousing and
      distribution only. Its captured text runs on into note 10, printed on
      the same line, which describes business-to-business supply firms whose
      sales are mostly off site. Both qualify non-dwelling rows.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L154"
    digest: "56eaf53aebef"
    state: dismissed
    reason: >-
      Note 11 prohibits towers within 1,000 feet of the Old Town District. A
      tower row, not a dwelling.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L155"
    digest: "b1593afadbb8"
    state: dismissed
    reason: >-
      Note 12 sends hospitality and lodging uses in LI to the special
      criteria of 16.31.040. A hotel is not the pod, as the LI comment in the
      layer already says.
  - quote: "or/washington/sherwood/16.31/16.31.020.txt#L156"
    digest: "a3669a7f51ed"
    state: dismissed
    reason: >-
      Note 13 sends psilocybin service centers and manufacturing to the
      special criteria of 16.38.040. Not a dwelling.
