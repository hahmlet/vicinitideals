# Hillsboro CDC (Municode publication 4450). Draft, cloud session 2026-09-29.
#
# The CDC prints its standards as three-column tables (Standard, Requirement,
# Clarifications) and says in the Clarifications cell what another code would
# put in a footnote, so the census finds almost nothing to rule. What it does
# capture is below: three rows of a table that begin with a digit, which is
# the shape of a numbered note. None is a note.
#
# The census also reports markers with no body in three documents, and none
# of those is a note either (recorded here because nothing else rules them):
# - 12.40.special-uses L416-L423: Table 12.40.107-1, Shelter Separation and
#   Density Standards, whose last column (maximum beds per shelter) is a
#   figure glued to its row ("SCR-DNC 500 feet 50").
# - 12.50.100-270.lot-and-site L535-L562: Table 12.50.130-1, Special
#   Street-Facing Setback Requirements, whose rows end in the feet
#   ("north 510 feet 27"). The table is a layer-wide NOT ENCODED comment.
# - 12.65.south-hillsboro L1874-L1947: street cross-section labels ("L3",
#   "C5") in the South Hillsboro figure list.
notes:
  - quote: "or/washington/hillsboro/cdc.12.40.special-uses.txt#L690"
    digest: "75e87c1e1879"
    state: dismissed
    reason: >-
      Not a note: the first row of Table 12.40.160-1, Flag Lot Access
