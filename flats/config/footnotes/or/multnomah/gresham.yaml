# Gresham -- Development Code footnotes.
#
# Gresham prints 213 footnotes across seven chapters, and 150 of them sit over
# a value this corpus encodes. This file is the pass over 4.0100, the
# residential districts. The other six chapters -- corridor, downtown,
# Springwater, Pleasant Valley, Gresham Butte, middle-housing design -- are
# still unread, and their notes go on blocking, which is the point.
#
# Two classes are ruled here, and both are ruled on where the marker sits
# rather than on what the sentence says:
#
# Table 4.0120 is the use table. Every note in it qualifies a cell, and the
# Quadplex and Townhouse rows print a bare P in all seven districts -- no
# marker, no limitation. Fifteen notes therefore say nothing about the use
# this screen encodes, however much they say about hotels, shelters, biomass
# generators or cottage clusters.
#
# Table 4.0130 states the dimensions. Six of its notes only ever relax a
# standard we enforce, so ignoring them can cost a lot we called too small,
# never one we called buildable and is not.
#
# Table 4.0131 states the setbacks, and four of its notes are the reason no
# Gresham setback can be certified today. Each is plain English nobody has to
# read twice, and each turns on something about the lot nothing measures: a
# sidewalk easement the setback is measured from, a second street frontage
# that turns the rear yard into a front one, the class of the street out
# front, and how close the water is. They are ruled `unmeasured` rather than
# dismissed, which stops them blocking the encoding and keeps them capping the
# verdict.
notes:
  # --- Table 4.0120, the use table -----------------------------------
