  # --- read, and resting on a fact nobody holds ------------------------
  - quote: "or/multnomah/gresham/4.0100.residential.txt#L419"
    digest: "dd93fa507971"
    state: unmeasured
    fact: sidewalk_easement
    reason: >-
      where sidewalk access is carried by an easement the setback is measured
      from the easement line rather than the property line, and no easement
      layer is held for Gresham

  - quote: "or/multnomah/gresham/4.0100.residential.txt#L421"
    digest: "bfc8f2b4c1fb"
    state: unmeasured
    fact: through_lot
    reason: >-
      on a double frontage lot every street frontage is a front yard, which
      turns the rear setback into a second front one; nothing yet decides
      whether a parcel has street on two opposite sides

  - quote: "or/multnomah/gresham/4.0100.residential.txt#L428"
    digest: "f733ca818d64"
    state: unmeasured
    fact: local_street
    reason: >-
      states a 25-foot maximum and a 5-foot minimum setback from the end of a
      Minor Access Street, which is one of Gresham's street classes; nothing
      holds the functional classification of the street a parcel fronts

  - quote: "or/multnomah/gresham/4.0100.residential.txt#L388"
    digest: "705b5032c7a2"
    state: unmeasured
    fact: protected_water_feature
    reason: >-
      sends the height standard to Section 10.1100 for shoreline lots, and the
      water layer that would say whether this is one is not held
