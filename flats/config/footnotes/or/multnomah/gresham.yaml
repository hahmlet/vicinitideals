  - quote: "or/multnomah/gresham/4.1100.downtown.txt#L309"
    digest: "ec8356cb36c6"
    state: encoded
    encoded_as: DCC quadplex_allowed variant (lot_sqft at most 7,600, inside_mapped_use_area + narrow_frontage); DTM quadplex_allowed variant (lot_sqft at most 6,500, narrow_frontage)
    reason: >-
      note 1 is the whole content of the L1 marking the Quadplex cell in DCC and DTM: a plex is allowed on a lot of record 6,500 sq ft or smaller in DTM and DMU, or 7,600 sq ft or smaller in DCC north of NE 8th Street, in either case with 70 feet of street frontage or less, and provided density standards are met. Encoded as a variant on each of the two districts whose Quadplex cell carries the marker, with the lot-area gate as a band because that one is measured, and the frontage maximum and the NE 8th Street line as registered facts that nothing measures yet -- so the base false is what binds and the permission opens on the right lots the day they are. DMU is named in the note and takes nothing from it here: its Quadplex cell reads NP, and the L1 in that column belongs to the Duplex row above

