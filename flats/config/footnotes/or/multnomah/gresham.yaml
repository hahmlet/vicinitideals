  # and quadplex dwellings in any district; and Townhouse and Cottage
  # Cluster in DRL-1 and DRL-2", and it carries two markers: note 10, which
  # defines the column headings, and note 12 on the maximum setback cell.
  # Everything else in the chapter is somebody else's row.
  #
  # Widened 2026-08-19, when DCC, DTM, DMU, DEM and DCL were encoded. The
  # governing row does not change -- its heading says "in any district" and
  # its numbers are identical across all six street-type columns -- but the
  # rulings below were written when this layer held only DRL-1 and DRL-2,
  # and four of them turned on that. Notes 1, 2, 3 and 13 are re-reasoned
  # against the districts now held; the rest were already reasoned from the
  # row rather than from the district and stand as written. Table 4.1120's
  # own note 1 joins them: it is the L1 that limits the Quadplex cell in
  # DCC and DTM, and it is encoded rather than dismissed.
  - quote: "or/multnomah/gresham/4.1100.downtown.txt#L528"
    digest: "3c036597fca8"
    state: dismissed
    reason: >-
      note 1 limits height and floor area ratio on the strip within 110 feet of the N Main Avenue centre line and sends it to the DCC -- N Main Avenue column, which is the table's second column and not a district of its own. It did not reach this layer while only DRL-1 and DRL-2 were held; it reaches DCC now. What the strip states is 45 feet and a ratio of 1.5 against the district's 85 and 3.0 -- a real cut, and still far above what a 26 ft four-unit pod asks of either. No lot changes colour on which side of the 110 feet it falls, so the strip is ruled here rather than carried as a variant on an unmeasured line

  - quote: "or/multnomah/gresham/4.1100.downtown.txt#L532"
    digest: "db5da3c91d2f"
    state: dismissed
    reason: >-
      note 2 lets buildings exceed the maximum height by up to 8 feet for parapets and pitched roofs in every Downtown sub-district except DRL-1 and DRL-2. It excluded the whole of this layer when only the two DRL districts were held and now reaches DCC and DTM, which changes nothing: it only ever raises a ceiling, and the ceiling it raises is already three times the pod

  - quote: "or/multnomah/gresham/4.1100.downtown.txt#L534"
    digest: "b5860ff4afbd"
    state: dismissed
    reason: >-
