  - quote: "or/multnomah/gresham/4.0100.residential.txt#L426"
    digest: "c624796e294a"
    state: dismissed
    reason: >-
      the zero lot line option is only available on a lot a land division
      designated as one; the pod is screened against the ordinary side yards,
      which is a compliance path that needs no designation

