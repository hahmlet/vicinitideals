      standards, which are looser than the CMF ones encoded here; applying
      the base CMF regime to the whole district is the stricter reading and
      the one this layer takes.

      That holds for every standard encoded in CMF and not for the one it
      does not encode. The same note states a density regime -- "minimum net
      density for middle housing shall be 12 units per acre and maximum
      density shall be 25 units per acre for townhouses and 24 units per acre
      for all other middle housing uses" -- and CMF carries no density at
      all, so on that row the base regime is the LOOSER reading rather than
      the stricter one. It is still not encoded, because the note reaches
      only "the areas of CMF along the NE Glisan Street and NE 162nd Avenue
      corridors" and nothing here decides which parcels are in them. Writing
      the floor against all 665 CMF lots would apply a corridor standard to a
      district, which is a worse error than a check that does not run

