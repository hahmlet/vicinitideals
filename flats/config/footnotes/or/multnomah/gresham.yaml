  # --- Table 4.0130, the dimensions ----------------------------------
  - quote: "or/multnomah/gresham/4.0100.residential.txt#L373"
    digest: "22aaf7bd0b1e"
    state: dismissed
    reason: >-
      note 1, and it is about when a manufactured dwelling park must meet the
      site minimum; the pod is neither

  - quote: "or/multnomah/gresham/4.0100.residential.txt#L374"
    digest: "be0e306681cb"
    state: dismissed
    reason: >-
      note 2 lets an undersized lot of record be developed anyway; it can only
      relax the minimum lot size this screen enforces, so ignoring it costs
      lots we called too small and never the other way

  - quote: "or/multnomah/gresham/4.0100.residential.txt#L376"
    digest: "3aad28e9d598"
    state: dismissed
    reason: >-
      note 3 switches off the minimum density for affordable housing -- a
      relaxation, and one that turns on an election nobody has made

  - quote: "or/multnomah/gresham/4.0100.residential.txt#L377"
    digest: "27621538e5ed"
    state: dismissed
    reason: >-
      note 4 switches off the minimum density on small partitions; a
      relaxation of a standard the pod meets anyway at four units

  - quote: "or/multnomah/gresham/4.0100.residential.txt#L379"
    digest: "c94bfb390c6e"
    state: dismissed
    reason: >-
      note 5 exempts lots of record under 11,000 square feet from the TR
      minimum density column it marks; a relaxation

  - quote: "or/multnomah/gresham/4.0100.residential.txt#L383"
    digest: "2914b8813131"
    state: dismissed
    reason: >-
      note 9 offers a discretionary reduction of the minimum street frontage
      under Section 10.1520; relief is priced after a standard is missed, not
      folded into which standard applies

  # Read, and it constrains platting rather than fit. The four units share one
  # driveway to a rear court by construction -- that is the typology, not an
  # aspiration -- so a townhouse lot narrower than 22 feet has the shared
  # access this note requires. Nothing dimensional follows from it.
  - quote: "or/multnomah/gresham/4.0100.residential.txt#L381"
    digest: "c76b9f715dd4"
    state: dismissed
    reason: >-
      note 7 requires townhouse lots under 22 feet wide to take access from an
      alley or a shared access; the pod's four units are served by one shared
      driveway to a rear court, so it is satisfied by the design rather than
      by the parcel

  # --- notes 8 and 10, encoded with the corner-lot rows they belong to ---
  #
  # Both were the only place MDR-24 states a corner number, and both were read
  # while encoding Table 4.0130 E.2 and G.2 across the residential zones.
  - quote: "or/multnomah/gresham/4.0100.residential.txt#L382"
    digest: "f9d282159d16"
    state: encoded
    encoded_as: "MDR-24 min_lot_width_ft variants, when [unit_lots, corner_lot] 42 ft and with abuts_alley 16 ft"
    reason: >-
      the corner townhouse width cell in MDR-24 reads "See table note 8", and
      the note states three numbers by access; 42 is the one that binds until
      an alley is observed, because a shared access is a plat commitment and
      not a fact about the parcel

  - quote: "or/multnomah/gresham/4.0100.residential.txt#L385"
    digest: "c39eff4953c2"
    state: encoded
    encoded_as: "MDR-24 min_frontage_ft variants, when [unit_lots, corner_lot] 32 ft and with abuts_alley 25 ft"
    reason: >-
      the corner townhouse frontage cell in MDR-24 reads "Varies depending on
      access" and hands the number to this note; 32 binds without an alley or
      shared access, 25 with one

