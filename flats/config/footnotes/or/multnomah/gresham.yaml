# Gresham -- Development Code footnotes.
#
# Gresham prints 213 footnotes across seven chapters, and 189 of them sit over
# a value this corpus encodes. All seven chapters are now read: 4.0100 the
# residential districts, 4.0400 the corridor, 4.1100 Downtown, 4.1300 Gresham
# Butte, 4.1400 Pleasant Valley, 4.1500 Springwater, and 7.0400 the
# middle-housing design standards. The 24 notes still unread govern no value
# here -- they belong to TC-PV, NC-PV, ME-PV and NC-SW, districts this layer
# does not encode -- and they stay unread rather than being waved through.
#
# One note is ruled `dismissed` for a reason worth stating twice, because it
# is the one dismissal in the file that is not clean. Downtown note 6 takes
# the flag pole out of the site area a floor area ratio is measured against.
# That shrinks the denominator rather than changing the ratio, so there is no
# number for the ratio field to hold; the layer assumes no flag lot and the
# smaller site area, where one is detected, has to come from geometry.
#
# Two classes are ruled here, and both are ruled on where the marker sits
# rather than on what the sentence says:
#
# Table 4.0120 is the use table. Every note in it qualifies a cell, and the
# Quadplex and Townhouse rows print a bare P in all seven districts -- no
# marker, no limitation. Fifteen notes therefore say nothing about the use
# this screen encodes, however much they say about hotels, shelters, biomass
# generators or cottage clusters.
#
# Table 4.0130 states the dimensions. Six of its notes only ever relax a
# standard we enforce, so ignoring them can cost a lot we called too small,
# never one we called buildable and is not.
#
# Table 4.0131 states the setbacks, and four of its notes are the reason no
# Gresham setback can be certified today. Each is plain English nobody has to
# read twice, and each turns on something about the lot nothing measures: a
# sidewalk easement the setback is measured from, a second street frontage
# that turns the rear yard into a front one, the class of the street out
# front, and how close the water is. They are ruled `unmeasured` rather than
# dismissed, which stops them blocking the encoding and keeps them capping the
# verdict.
#
# **Table 4.1120, the Downtown use table.** Its twenty-four notes sit under a
# heading with one sentence of scope between it and note 1 -- "The following
# describe limitations on use categories marked as limited or special use
# review in Table 4.1120" -- and the block reader walked away from the whole
# list because the first line under a heading was not numbered. Note 1 had
# been read by hand and encoded anyway; it is re-quoted here at the body's own
# line now that there is a body to point at. The other twenty-three are
# commercial, industrial, institutional and renewable-energy rows, plus the
# multi-family and cottage-cluster rows that the pod is not.
