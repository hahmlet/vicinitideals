# Portland -- PCC 33.100 (open space), 33.110 (single-dwelling), 33.120
# (multi-dwelling), 33.130 (commercial/mixed use), 33.140 (employment and
# industrial), 33.150 (campus institutional), 33.266 (parking).
#
# A hundred and eighteen notes captured, a hundred and four of them ruled, and
# not one of them moves a number this layer encodes. That is a real finding
# rather than a shrug, and it is worth reading twice, because for most of this
# corpus's life the ledger said forty -- and the seventy-eight it did not say
# were the ones over Portland's whole non-residential half.
#
# **How they were hidden.** Portland prints no notes block under a use table.
# The limitations are numbered subsections of the Primary Uses section --
# ordinary prose, ordinary layout, nothing on the page that says "footnote" --
# and each one names its own marker in its first sentence: "This regulation
# applies to all parts of Table 120-1 that have a [4]." Six chapters are
# written that way. Until the census learned to read a body that declares
# itself, those chapters carried a hundred and seventy-three markers with
# nothing to answer them, and the gate that holds a value back when an unread
# note governs it had nothing to hold.
#
# **What the seventy-eight say.** Two of them decide a zone, and both were
# already read when the zone was encoded: 33.140's note [1] allows Household
# Living in EG1 and EG2 only where an existing hotel is converted to
# affordable units under a 30-year covenant, and its note [2] prohibits
# Household Living in the I zones outside a houseboat moorage. Every other one
# is a limitation on a use this screen does not place -- retail floor area,
# industrial size caps, agriculture, basic utilities, radio frequency
# transmission, commercial parking, waste, bulk fossil fuel. Portland's use
# tables give Household Living a bare letter in every zone this layer holds.
#
# Four groups account for all hundred and four.
#
# **Another use.** Seventy-eight of them, described above. They reach a value
# at all because the permission is quoted from a cell of the table the note
# marks, and the region rule governs by table rather than by row -- which is
# the deliberately wide reading, and the reason there are so many.
#
# **Other tables.** Chapter 33.110's institutional development standards and
# 33.120's carry seven and three notes about campuses, towers and spires, and
# conditional use review. Chapter 33.120's FAR bonus table carries three about
# transfers and bonuses. Chapter 33.266's maximum-parking table carries two.
#
# **Other buildings.** Congregate housing, accessory dwellings, manufactured
# dwellings in a manufactured dwelling park.
#
# **Relief.** Table 110-3's notes are grandfathering, every one of them: a
# primary structure stays allowed on a lot condemnation, a zone change or an
# old lot confirmation left undersized. They widen where the pod may go, and
# declining a widening can only cost a lot that would have qualified.
#
# What is NOT here, and worth saying because it is what a reader will look
# for: nothing in these notes is a hidden condition on the numbers this layer
# encodes. Portland's conditions -- the civic corridor coverage bonus, the
# deeper setbacks on a narrow lot -- are in the section text, and they are
# encoded as variants where they were read.
notes:
  # --- 33.110 Table 110-3, minimum lot dimensions --------------------
  #
  # Five notes, all of them grandfathering or measurement. They govern the
  # single-dwelling zones' `quadplex_allowed`, which is read a page earlier.
  - quote: "or/multnomah/portland/33.110.txt#L396"
    digest: "e209d90b8439"
    state: dismissed
    reason: >-
      a primary structure stays allowed on a lot that met Table 110-3 until a
      condemnation or a right-of-way dedication shrank it. A grandfathering
      clause: it keeps a use on land the table would now refuse, and declining
      it can only cost a lot that would have qualified.
      The digest moved because the body used to carry the page footer it
      was printed under; Portland's frame is recognised now -- this one
      ended on the page stamp "110-8"

  - quote: "or/multnomah/portland/33.110.txt#L404"
    digest: "00088d83a572"
    state: dismissed
    reason: >-
      the R5 minimums for adjusted lots and lot remnants approved through a
      property line adjustment -- 36 ft wide and 1,600 sq ft. A relaxation, and
      one that attaches to a lot's paperwork history rather than to the lot

  - quote: "or/multnomah/portland/33.110.txt#L407"
    digest: "f3ac38f83c8d"
    state: dismissed
    reason: >-
      grandfathering in R20 for lots made non-conforming solely by the zone
      change of 24 May 2018. A relaxation with a date on it

  - quote: "or/multnomah/portland/33.110.txt#L410"
    digest: "4af25bbc8812"
    state: dismissed
    reason: >-
      grandfathering for lots separated through a lot confirmation finalised
      before 11 September 2020. A relaxation with a date on it

  - quote: "or/multnomah/portland/33.110.txt#L413"
    digest: "bf24d1f629bf"
    state: dismissed
    reason: >-
      "lot width for a flag lot is measured at the midpoint of the flag
      portion of the lot". It says where to measure, not what is required, so
      there is no number here to encode -- and measuring a flag lot's width
      across the pole rather than the flag is a geometry question this
      layer cannot answer in a rule file. `flag_lot` is registered and assumed
      false, which is where that gap is carried

  # --- 33.110, the summary of development standards -----------------
