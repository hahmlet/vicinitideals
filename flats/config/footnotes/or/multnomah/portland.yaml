  - quote: "or/multnomah/portland/33.120.txt#L723"
    digest: "bc6bd50b2144"
    state: dismissed
    reason: >-
      "the lower FAR applies in the RM4 zone in Historic and Conservation
      districts". It picks between the two figures in a bonus table cell, and
      the bonus table is not encoded. Were it encoded, this is a
      `historic_resource` variant rather than a footnote -- that condition is
      registered and assumed false, so it would be written as a variant on the
      bonus figure and not left to a ruling

  # --- 33.266 Table 266-1/-2, maximum allowed parking spaces --------
  - quote: "or/multnomah/portland/33.266.txt#L149"
    digest: "83a3c1f59710"
    state: dismissed
    reason: >-
      "regulations in a plan district or overlay zone may supersede the
      standards of this table". The table is 33.266.115's maximum allowed
      parking spaces -- a ceiling on stalls, not a floor -- and what this
      layer encodes from the chapter is the absence of any minimum, read from
      the chapter's own section list

  - quote: "or/multnomah/portland/33.266.txt#L150"
    digest: "f7ef893b01f9"
    state: dismissed
    reason: >-
      uses subject to a Conditional Use, Impact Mitigation Plan or
      Transportation Impact review may set different parking requirements
      through the review. Three review paths, none of which a by-right
      fourplex enters

  # --- 33.130 Commercial/Mixed Use Zones -----------------------------
  #
  # Three notes, and the first is the only one in this whole ledger that turns
  # out to be a standard rather than a pointer to one.
  - quote: "or/multnomah/portland/33.130.txt#L668"
    digest: "eb2d154becf6"
    state: encoded
    encoded_as: >-
      CR max_density_du_per_acre sqft_per_unit 2500
    reason: >-
      note [1] under Table 130-2, and it describes exactly the building this
      screen places: "on sites that do not have a Retail Sales And Service or
      Office use, maximum density for Household Living is 1 unit per 2,500
      square feet of site area". A four-unit pod with no ground-floor
      commercial is such a site, so the note is the standard for it and the
      table's blank CR density cell is not. Encoded on the value rather than
      dismissed -- and then removed at resolution by OAR 660-046-0220(2)(b),
      which is a separate sentence and belongs on a separate record.
      The digest moved because the body used to carry the page footer it
      was printed under; Portland's frame is recognised now, though this
      one now runs on into the caption of the illustration below it. The
      list ends at the page break and nothing on the far side says so;
      ending a block at a page break instead cost sixteen bodies in
      Gresham's downtown chapter and three in Troutdale, so the noise
      stays

  - quote: "or/multnomah/portland/33.130.txt#L736"
    digest: "b05a55a3a9f8"
    state: dismissed
    reason: >-
      bonus height in CM2 is allowed only inside a Historic District,
      Conservation District or Design Overlay with a Mixed Use - Urban Center
      plan designation. A bonus is earned, and what is encoded is the base
      height from Table 130-2; declining a bonus can only cost a site that
      would have qualified for one

  - quote: "or/multnomah/portland/33.130.txt#L742"
    digest: "677f0dfe063a"
    state: dismissed
    reason: >-
      the larger overall maximum in Table 130-3 is reachable only through the
      Planned Development bonus and its review. Same table, same reason: a
      bonus nobody is entitled to, over a figure this layer does not encode

  # --- 33.140 Employment and Industrial Zones ------------------------
  - quote: "or/multnomah/portland/33.140.txt#L631"
    digest: "6794b92cbbb4"
    state: dismissed
    reason: >-
      Table 140-3's residential setbacks "do not apply to lot lines that abut
      lots in the RX zone". A relief, and one that rests on the neighbour's
      zoning rather than on this lot -- the same unheld fact the EX side and
      rear setbacks already stand at 10 ft for. Declining it keeps the 10;
      taking it would need the abutting parcel's zone, which this screen does
      not read. Not `unmeasured`, because the standard the note relieves is
      already encoded at its binding value and no verdict waits on the note.
      The digest moved because the body used to carry the page footer it
      was printed under; Portland's frame is recognised now -- this one
      ended on "Title 33, Planning and Zoning"

  - quote: "or/multnomah/portland/33.140.txt#L1196"
    digest: "6e74a267a5f1"
    state: dismissed
    reason: >-
      a reading instruction for the screening table -- setback first, then
      landscaping standard. It tells a reader how to parse a cell, and the
      cell is in 33.140.235 Screening, which this layer does not encode

  - quote: "or/multnomah/portland/33.140.txt#L1198"
    digest: "66da0ed46ddd"
    state: dismissed
    reason: >-
      an F2 screen alone suffices where parking sits between exterior storage
      and the street. Exterior storage is not a fourplex, and screening is not
      encoded

  - quote: "or/multnomah/portland/33.140.txt#L1200"
    digest: "330298c96374"
    state: dismissed
    reason: >-
      where the F2 + L2 option is used the fence goes on the interior side of
      the landscaped area. A construction detail inside a standard this layer
      does not encode

  # --- 33.150 Table 150-2, campus institutional standards ------------
  #
  # Five notes, and one of them breaks this ledger's clean record: note [3] is
  # a mapped condition that makes a standard TIGHTER, which is the shape every
  # other Portland note has managed to avoid.
  - quote: "or/multnomah/portland/33.150.txt#L565"
    digest: "0f6941d0781c"
    state: dismissed
    reason: >-
      for Colleges and Medical Centers the entire CI zone counts as one site
      regardless of ownership, and FAR, setbacks, building length, facade
      articulation, windows and the transit-street entrance are then measured
      from the perimeter of the zone. A different applicant and a different
      site: the pod is neither a college nor a medical centre, and reading a
      lot's standards off a campus perimeter is what this note exists to let
      a campus do

  - quote: "or/multnomah/portland/33.150.txt#L569"
    digest: "8e4715494aec"
    state: dismissed
    reason: >-
      maximum FAR inside the Legacy Good Samaritan campus boundary on Map
      150-3 is 3.7 to 1 rather than 3. A relaxation, on a mapped boundary
      nothing here reads; declining it can only cost a site that sits inside
      it

  - quote: "or/multnomah/portland/33.150.txt#L571"
    digest: "b0b1dfa3fbb5"
    state: unmeasured
    fact: site_specific_limitation
    reason: >-
      maximum FAR inside the PCC Sylvania campus boundary on Map 150-5 is
      .75 to 1, not 3 to 1 -- a quarter of the zone's own ceiling, and the
      only Portland note in this ledger that tightens a standard on a fact
      nobody measures. At 0.75 a 5,000 sq ft lot carries 3,750 sq ft of floor
      area, which a four-unit pod can exceed, so this is not a difference that
      stays below the verdict. Whether a CI2 lot is inside that boundary is a
      line on a map this screen does not hold, so the note caps rather than
      resolves

  - quote: "or/multnomah/portland/33.150.txt#L573"
    digest: "22c261d2f980"
    state: dismissed
    reason: >-
      heights are reduced next to certain zones under 33.150.210.C. Every
      reduction that subsection states lands at 30 ft or above -- 30 within 60
      ft of an OS or RF-R2.5 line, 45 within 40 ft of an RM1-RMP or
      commercial line -- and the pod is 26 ft. A tightening that cannot reach
      this building, which is a different reason for dismissing it than the
      usual one and worth writing down as such

  - quote: "or/multnomah/portland/33.150.txt#L574"
    digest: "ecb44e00d391"
    state: dismissed
    reason: >-
      where the maximum building setback applies there is no minimum setback.
      A relief, and one this file already takes the conservative side of: the
      street minimum is encoded at 0 from the table's own rows, so the note
      cannot loosen anything further.
      The digest moved because the body used to carry the page footer it
      was printed under; Portland's frame is recognised now

