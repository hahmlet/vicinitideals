  - quote: "or/multnomah/portland/33.110.txt#L477"
    digest: "527b8487fca1"
    state: dismissed
    reason: >-
      additional FAR and height may be allowed under 33.110.265.F. A
      relaxation of two standards, and it can only raise the ceiling.
      The digest moved because the body used to carry the page footer it
      was printed under; Portland's frame is recognised now -- this one
      ended on the edition date "1/1/25"

  # --- 33.110.240 and 33.120, institutional development standards ---
  #
  # These two tables state what an institution -- a school, a church, a
  # community centre -- may build in a residential zone. They are not this
  # pod's standards and are not encoded. Each note is dismissed on that scope,
  # with what it actually says recorded so the dismissal is checkable.
  - quote: "or/multnomah/portland/33.110.txt#L1999"
    digest: "95476b5293ee"
    state: dismissed
    reason: >-
      "the standards of this table are minimums or maximums as indicated;
      compliance with the conditional use approval criteria might preclude
      development to the maximum intensity". The institutional development
      standards tables of 33.110.240 and 33.120.240 both print it, and neither
      table is encoded here -- an institution in a residential zone is a
      conditional use, and the pod is not one

  - quote: "or/multnomah/portland/33.110.txt#L2001"
    digest: "019d85304fe5"
    state: dismissed
    reason: >-
      campus-type developments are treated as one site, and the table's
      setbacks supersede Table 110-4's only at the campus perimeter. An
      institutional standard, on a table this layer does not encode

  - quote: "or/multnomah/portland/33.110.txt#L2004"
    digest: "614f56b5c613"
    state: dismissed
    reason: >-
      towers, spires, elevator equipment and stairwell enclosures may exceed
      the height limit. A relaxation, on the institutional table's height

  - quote: "or/multnomah/portland/33.110.txt#L2010"
    digest: "d66aa950a2c5"
    state: dismissed
    reason: >-
      required landscaping counts toward the landscaped area standard. A
      relaxation of the institutional table's minimum landscaped area

  - quote: "or/multnomah/portland/33.110.txt#L2012"
    digest: "f5fe0824e9ba"
    state: dismissed
    reason: >-
      vehicle areas are subject to the parking lot setback and landscaping
      standards of Chapter 33.266. A cross-reference on the institutional
      table; what 33.266 requires of this pod is encoded from 33.266 itself

  - quote: "or/multnomah/portland/33.110.txt#L2014"
    digest: "8e5edafcda00"
    state: dismissed
    reason: >-
      setbacks for structures accessory to recreational fields for organized
      sports are in Chapter 33.279. A different chapter for a different use

  - quote: "or/multnomah/portland/33.110.txt#L2016"
    digest: "26ae2529f3ab"
    state: dismissed
    reason: >-
      "the maximum building setbacks are described in 33.110.270.C". A
      cross-reference on the institutional table's maximum-setback row. A
      maximum setback is a real standard and `setback_front_max_ft` exists to
      hold one, but the sentence carries no number and the row it marks is not
      this pod's; reading 33.110.270.C for the single-dwelling zones is
      encoding work, not a footnote ruling

  - quote: "or/multnomah/portland/33.120.txt#L1939"
    digest: "ac6afd806e59"
    state: dismissed
    reason: >-
      campus-type developments are treated as one site, and the table's
      setbacks supersede Table 120-4's only at the campus perimeter. The
      multi-dwelling half of the same institutional table

  - quote: "or/multnomah/portland/33.120.txt#L1942"
    digest: "80780ca626c8"
    state: dismissed
    reason: >-
      towers and spires under 200 sq ft may exceed the height limit but must
      still meet the setback. A relaxation, on the institutional table.
      The digest moved because the body used to carry the page footer it
      was printed under; Portland's frame is recognised now -- this one
      ended on the page stamp "120-  47"

