  # --- 33.120 Table 120-6, the FAR bonus table ----------------------
  - quote: "or/multnomah/portland/33.120.txt#L721"
    digest: "6451e19699cf"
    state: dismissed
    reason: >-
      the overall maximum FAR includes FAR received from a transfer. A note on
      the bonus table of 33.120.211; the FAR this layer encodes is the base
      figure from the summary of development standards, and a transfer can
      only raise it

  - quote: "or/multnomah/portland/33.120.txt#L722"
    digest: "05356b149648"
    state: dismissed
    reason: >-
      names the other bonuses -- Inclusionary Housing, Three-Bedroom Units,
