# Lots the county's own tax roll says nobody can buy for a house: RED and
# never scanned, like the institutional land of institutional.yaml.
#
# Steph RULED 2026-10-09 (FOLLOWUPS 59), "All red": HOA tracts, common areas,
# open space, golf courses and parcels the county values at $0 land + $0
# building are red; so are the public county codes. Churches and charities
# STAY CHECKED (FOLLOWUPS 47), so no tier reads codes 91x or 98x.
#
# Code book: Oregon's statewide property class codes, OAR 150-308-0310
# "Basic property classes" (the first digit is the class: 0 miscellaneous,
# 1 residential, 2 commercial, 3 industrial, 4 tract, 5 farm, 6 forest,
# 7 multi-family, 8 recreation, 9 exempt). Its exempt codes, by second digit:
# 90 student housing, 91 church, 92 school, 93 cemetery, 94 city, 95 county,
# 96 state, 97 federal, 98 benevolent or fraternal, 99 port or other public
# body. Its miscellaneous codes end in 5 for open space. A "tract" in that
# book (class 4) is rural acreage, NOT an HOA tract: no tier reads class 4.
#
# Only Washington County's roll carries 9xx codes (read 2026-10-09 against
# the whole lot table); Multnomah and Clackamas rolls hold none, so the
# public-code tier names its counties. Multnomah marks exempt land only by an
# assessed value of 0 beside a real market value, which cannot tell a city
# park from a church, so the roll alone reads nothing there: its public land
# is read by owner of record (the public_owner tier, FOLLOWUPS 205).
#
# A "zero value" lot has land, building, total and assessed value all
# exactly 0 (a lot whose value is not on the roll is not zero). Land and
# building alone would catch farm and forest lots the county assesses
# specially.
#
# Measured against live run 69 (non-red lots): see FOLLOWUPS 59.

version: 1

tiers:
  public_land:
    enabled: true
    # code: 920 school, 930 cemetery, 940 city, 950 county, 960 state,
    # 970 federal, 990 port or other public body. The x1 variants (921, 941,
    # 943, 951, 961, 971, 991, 993) carry values, buildings and addresses
    # and stay screened (Steph RULED 2026-10-09).
    pattern: '^9[2-79]0$'
    counties: [washington]
    words: public land
  public_owner:
    # FOLLOWUPS 205 (2026-11-18): Multnomah's public land, which the roll's
    # codes cannot name. Steph RULED 2026-10-06 public and institutional land
    # RED; Washington County's roll applies it by code (public_land above).
    # This tier gives Multnomah the same answer by another road: the lot's
    # owner of record is a public body -- on the checked-in `list`, drawn
    # from the region's public taxlot layer by the `owners` patterns below --
    # AND the roll shows the lot not taxed (no assessed value above 0) AND
    # bare: the assessor's class is a vacant one (ending 00: 100, 700, 800)
    # or the roll shows no building (no building value or building area
    # above 0). That is Washington's
    # vacant exempt code (940 city, 950 county ...): its improved x1 codes
    # "carry values, buildings and addresses and stay screened" (ruled
    # 2026-10-09), so a public lot with a building stays screened here too,
    # and so does one the roll shows taxed (leased out, or sold since the
    # list was drawn). A value the roll does not carry counts as neither
    # taxed nor built: the lot is red. Churches, charities, private schools
    # and colleges are on no pattern: they STAY CHECKED (FOLLOWUPS 47).
    #
    # The list: scripts/flats_public_owners.py redraws it (run it at each
    # county refresh). Source: PortlandMaps "Regional Taxlots",
    # https://www.portlandmaps.com/arcgis/rest/services/Public/Taxlots/MapServer/0
    # (Metro RLIS taxlots with the assessor's owner of record), COUNTY = M,
    # retrieved 2026-11-18. It holds public bodies' names only.
    enabled: true
    counties: [multnomah]
    list: public_owners_multnomah.csv
    # THE SWITCH (one line): does housing-authority land (Home Forward, the
    # Housing Authority of Portland) count as public? `true` is the cautious
    # answer, taken until Steph rules (FOLLOWUPS 205 question); `false`
    # leaves those lots screened like any private lot.
    housing_authority_is_public: true
    # Owner-of-record names, upper case, as the assessor abbreviates them
    # (35 characters). Anchored: "CHEVRON USA INC" and "SUSAN ..." are not
    # the United States.
    owners:
      government:
        - '^(THE )?(PORTLAND|GRESHAM|TROUTDALE|FAIRVIEW|WOOD VILLAGE|MAYWOOD PARK|LAKE OSWEGO|MILWAUKIE|BEAVERTON) CITY OF\b'
        - '^CITY OF (PORTLAND|GRESHAM|TROUTDALE|FAIRVIEW|WOOD VILLAGE|MAYWOOD PARK|LAKE OSWEGO|MILWAUKIE|BEAVERTON)\b'
        - '^PORTLAND WATER BUREAU'
        - '^(MULTNOMAH|CLACKAMAS|WASHINGTON|COLUMBIA) COUNTY\b'
        - '^OREGON STATE OF\b'
        - '^STATE OF OREGON\b'
        - '^OREGON STATE DEPT\b'
        - '^DEPT OF TRANSPORTATION'
        - '^OREGON STATE UNIVERSITY'
        - '^OREGON HEALTH & SCIENCE UNIVERSITY'
        - '^UNIVERSITY OF OREGON'
        - '^PORTLAND STATE UNIVERSITY'
        - '^UNITED STATES OF AMERICA'
        - '^UNITED STATES POSTAL SERVICE'
        - '^U S (DEPT|POSTAL|GOVERNMENT|FOREST)'
        - '^FEDERAL GOVERNMENT'
        - '^BONNEVILLE POWER'
        - '^METRO( ET AL| PROPERTY MANAGEMENT)?$'
        - '^METRO ?[-(&]'
        - '^(THE )?PORT OF PORTLAND'
        - '^TRI[- ]COUNTY METRO'
        - '\bSCHOOL DIST'
        - '^PORTLAND PUBLIC SCHOOLS'
        - '\bCOMMUNITY COLLEGE'
        - '\b(WATER|DRAINAGE|SANITARY|FIRE|FIRE PROTECTION|LIBRARY) DIST'
        - "PEOPLE'S UTILITY D"
        - 'SOIL & WATER CONSERV'
        - '^TUALATIN VALLEY FIRE & RESCUE'
        - '^URBAN FLOOD SAFETY AND WATER QUALIT'
        - '^PDC\b'
        - '^PROSPER PORTLAND'
        - '^PORTLAND DEVELOPMENT COMMISSION'
      housing_authority:
        - '^(THE )?HOUSING AUTHORITY OF'
        - '^HOME FORWARD'
    # Words no public body's name carries ("CITY OF PORTLAND PROPERTY LLC",
    # "CLACKAMAS COUNTY BANK", "METRO 425 CONDOMINIUM OWNERS' ASSOC").
    not_owners: '\b(LLC|L L C|LP|LLP|INC|CORP|CONDO\w*|ASSN|ASSOC\w*|BANK|CHURCH|CLUB|ACADEMY)\b'
    words: public land
  tract:
    enabled: true
    words: a tract or common parcel the county values at $0
  condo_common:
    # Steph RULED 2026-11-18 (rulings.yaml 2026-11-18-condo-common-ground-red,
    # FOLLOWUPS 201): "Condo shared ground is red". A condominium's common
    # element is owned in shares by the unit owners; it cannot be bought and
    # built on. Two readings, either one:
    # (1) the intake's own mark (flats/normalize/condo.py): a Multnomah
    #     condominium property code (102, 122, 132, 202) on a parcel of
    #     2,000 sq ft or more -- the common-element land, stored by normalize
    #     as condo_reason SUSPECT_CONDO_COMMON_AREA. Before this tier nothing
    #     in scoring read the mark (class hunt round 4: 3 greens, 18 yellows).
    # (2) property code 702 (Multnomah; class 7 multi-family, the same x02
    #     ending as the condominium codes, and its siblings on the roll are
    #     "UNIT #n" records) where the roll shows exactly the common-element
    #     pattern of the marked lots: land, building, total and assessed value
    #     all $0, no building square feet, and the county's common-element lot
    #     number 6xxxx or 7xxxx (1N1E22DD -70000). 702 is NOT added to the
    #     intake's code list, which would drop small 702 parcels as air units.
    enabled: true
    condo_reasons: [SUSPECT_CONDO_COMMON_AREA]
    pattern: '^702$'
    counties: [multnomah]
    lot_pattern: '^[67]\d{4}$'
    words: a condominium's shared (common-element) ground, owned by the unit owners
  open_space:
    enabled: true
    # 8xx recreation; 0x5 miscellaneous open space.
    pattern: '^(8\d\d|0\d5)$'
    words: recreation or open space the county values at $0
  no_address:
    enabled: true
    words: a parcel the county values at $0 with no street address
    # Stays screened when new houses stand around it (Steph RULED 2026-10-09):
    # a lot platted this year looks exactly like this. "Around it" is: on the
    # same county tax map page (the parcel number less its last five
    # characters) AND within `within_ft` feet, edge to edge, of the bare lot.
    # "Built" is YEARBUILT on that county's assessor roll, a year from `since`
    # to 2100. The lot's own year does not count. No year, no geometry, no
    # exemption: the lot stays red. Lot geometry is Oregon State Plane feet.
    keep_checked_when_block_built:
      since: 2021
      lots: 3
      within_ft: 500
# A $0 parcel WITH a real street address is screened normally, no red and no
# flag (Steph RULED 2026-10-09): new lots the county has not valued yet look
# exactly like this.
