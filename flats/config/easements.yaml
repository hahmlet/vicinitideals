# Utility easements nobody maps (FOLLOWUPS 43, 17(e); flats/fit/easement.py).
#
# HUMAN-OWNED. Every number below is Steph's ruling; an agent does not add a
# city or move a number without a new ruling quoted here.
#
# Some codes forbid building on a public utility easement of whatever width
# the plat records -- Beaverton BDC 20.05 and 20.22 note 7: "In no case shall
# a building encroach into a Public Utility Easement (PUE)". No county
# publishes an easement layer, so the footnote holds `utility_easement`
# unanswered and caps the lot out of GREEN (Beaverton had no green lot).
#
# Steph, 2026-10-01, on Beaverton: drop the dedication-deed points; the rule
# is the building fits with a 10 ft yard on every STREET line ("just the side
# on a street") -> green; fits at 5 ft but not 10 -> yellow; not even at
# 5 -> red.
#
# Steph, 2026-10-05, on Oregon City (its zone table notes, 17.zoning.txt
# L4161/L4351/L4619, "Public utility easements may supersede the minimum
# setback"): the same rule.
#
# So for a city listed here the bridge fits the building with every street
# yard floored at `green_ft` and, where it fits, answers the easement
# question (the lot is then held only by what else it waits on, and carries
# the UTILITY-EASEMENT-ASSUMED flag, below the yellow line). Where it fits
# only at `yellow_ft` the question stays open (yellow) and the plan is the
# one fitted at `yellow_ft`; where it fits at neither, that plan's fit miss
# is the answer (red). A lot whose fit already misses at the code's own
# yards keeps its answer: the easement changes nothing there.
#
# Side and rear lines take no easement yard (Steph: "just the side on a
# street"); an alley is not a street.

utility_easement:
  or/washington/beaverton:
    green_ft: 10.0
    yellow_ft: 5.0
    ruled: "Steph 2026-10-01 (FOLLOWUPS 17(e))"
  or/clackamas/oregon-city:
    green_ft: 10.0
    yellow_ft: 5.0
    ruled: "Steph 2026-10-05 (FOLLOWUPS 43)"
