# Precast steps in a required yard (FOLLOWUPS 214; flats/rules/step_projections.py).
#
# The stair-room build (FOLLOWUPS 213; rulings 2026-11-20-stair-room-reserved
# and 2026-11-20-stair-no-room-red-flag) keeps every door's precast unit on the
# lot and off the court and lane. This file says how far into each REQUIRED
# yard a city lets those steps stand. A city, zone or yard not listed here lets
# them stand in none of it: the unit is kept out of the setback. That is the
# answer for a place whose projections section is not stored, a judgement left
# open, and a yard a code that names the steps leaves out.
#
# Read 2026-11-27 from the stored text, every encoded jurisdiction (the
# hand-off ../vicinitideals-worktrees/step-setbacks.handoff.md holds the
# per-city table, the searches behind every "none", and what is left out as a
# judgement for Steph). Steph 2026-11-27 (rulings.yaml):
#   - 2026-11-27-steps-count-as-porch: an UNCOVERED porch, deck, patio,
#     terrace, landing or "similar feature" a code lets into a yard counts for
#     the steps (kind: porch). A roofed or covered porch does not.
#   - 2026-11-27-steps-allowed-where-silent: a code that names none of steps,
#     stairs, stoops, porches or decks as a projection lets the steps into the
#     whole setback (kind: silent, every yard entire), on the whole-document
#     search the row's comment names. A section not stored is not silence.
# Every row that holds for a unit is a permission of its own: the most generous
# stands (flats/rules/step_projections.py Kept.yard_ft). Where a code names the
# steps and also a general feature (Gresham 9.0901.A.1 against A.2, Troutdale
# 5.020.B.1 against B.2), only the steps' own sentence is encoded: the
# specific governs, the cautious side.
#
# Each row:
#   zones:    the zone codes it reaches ("all" = every zone of the city)
#   up_to / over: the unit's height band, as printed. A unit is k risers of
#             the precast riser (flats/config/foundation.yaml doors.riser_in).
#   measured: "surface" where the code measures the stair's surface; else the
#             unit is read twice -- at its platform, and, where it carries a
#             railing (doors.handrail_risers and up), as taller than any
#             figure (the railing's top is not on the vendor page) -- and the
#             tighter answer stands.
#   yards:    front / street_side / side / rear -> {into, from_line}, as
#             printed. into: "entire" or a length or "N percent of the depth
#             of the setback"; from_line: the least distance left to the lot
#             line. A yard not named takes no steps. Each figure must appear in
#             the cited text (flats/tests/test_step_projections.py).
#   kind:     steps (the default) / porch / silent, as above.
#   cite:     the stored text, path under flats/provenance/docs#Lnn.
#   quote:    the deciding words, verbatim (whitespace aside).
#
# The steps never enter a utility easement the screen assumes
# (flats/config/easements.yaml) nor a sidewalk easement: the street yards are
# floored at both after the allowance.

jurisdictions:
  or/multnomah/portland:
    - id: pdx-33.110-low
      zones: [RF, R20, R10, R7, R5, R2.5]
      up_to: "2-1/2 feet"
      yards:
        front: {into: entire}
        street_side: {into: entire}
        side: {into: entire}
        rear: {into: entire}
      cite: "or/multnomah/portland/33.110.txt#L628-L629,L635"
      quote:
        - "The following minor features of a building may extend into the entire required building setbacks:"
        - "Decks, stairs and ramps that are no more than 2-1/2 feet above the ground."
    - id: pdx-33.110-high
      zones: [RF, R20, R10, R7, R5, R2.5]
      over: "2-1/2 feet"
      yards:
        front: {into: "20 percent of the depth of the setback", from_line: "three feet"}
        street_side: {into: "20 percent of the depth of the setback", from_line: "three feet"}
        side: {into: "20 percent of the depth of the setback", from_line: "three feet"}
        rear: {into: "20 percent of the depth of the setback", from_line: "three feet"}
      cite: "or/multnomah/portland/33.110.txt#L610-L612,L616-L617,L635"
      quote:
        - "may extend into a required building setback up to 20 percent of the depth of the setback. However, the feature must be at least three feet from a lot line:"
        - "Decks, stairways, wheelchair ramps and uncovered balconies that do not meet the standards of Paragraph C.3"
        - "no more than 2-1/2 feet above the ground"
    - id: pdx-33.120-low
      zones: [RM1, RM2, RM3, RM4, RX, RMP]
      up_to: "2-1/2 feet"
      yards:
        front: {into: entire}
        street_side: {into: entire}
        side: {into: entire}
        rear: {into: entire}
      cite: "or/multnomah/portland/33.120.txt#L1215,L1227-L1228"
      quote:
        - "The following minor features may extend into entire required building setbacks:"
        - "Attached decks, stairs, and ramps that are no more than 2-1/2 feet above the ground."
    - id: pdx-33.120-high
      zones: [RM1, RM2, RM3, RM4, RX, RMP]
      over: "2-1/2 feet"
      yards:
        front: {into: "20 percent of the depth of the setback", from_line: "3 feet"}
        street_side: {into: "20 percent of the depth of the setback", from_line: "3 feet"}
      cite: "or/multnomah/portland/33.120.txt#L1193-L1196,L1200-L1201,L1227-L1228"
      quote:
        - "may extend into a required building setback up to 20 percent of the depth of the setback, except as indicated. However, the feature must be at least 3 feet from a lot line"
        - "Decks, stairways, and uncovered balconies that do not meet the standard for Paragraph D.4, but only along a street lot line"
        - "no more than 2-1/2 feet above the ground"
    # 33.130's 5 ft is owed only on a line abutting an RF - RM4 or RMP zoned
    # lot; it is kept here on every line (no line's neighbour is read).
    - id: pdx-33.130-low
      zones: [CR, CM1, CM2, CM3, CE, CX]
      up_to: "2-1/2 feet"
      measured: surface
      yards:
        front: {into: entire, from_line: "5 feet"}
        street_side: {into: entire, from_line: "5 feet"}
        side: {into: entire, from_line: "5 feet"}
        rear: {into: entire, from_line: "5 feet"}
      cite: "or/multnomah/portland/33.130.txt#L882-L886"
      quote:
        - "are allowed to fully extend into required building setbacks, but may not extend closer than 5 feet to a lot line abutting an RF – RM4 or RMP zoned lot."
        - "Uncovered decks, stairways, and wheelchair ramps with surfaces that are no more than 2-1/2 feet above the ground;"
    - id: pdx-33.130-high
      zones: [CR, CM1, CM2, CM3, CE, CX]
      over: "2-1/2 feet"
      measured: surface
      yards:
        front: {into: "20 percent of the depth of the setback", from_line: "5 feet"}
        street_side: {into: "20 percent of the depth of the setback", from_line: "5 feet"}
        side: {into: "20 percent of the depth of the setback", from_line: "5 feet"}
        rear: {into: "20 percent of the depth of the setback", from_line: "5 feet"}
      cite: "or/multnomah/portland/33.130.txt#L863-L866,L869-L870,L885-L886"
      quote:
        - "may extend into a required building setback up to 20 percent of the depth of the setback. However, except for building eaves and stormwater planters, they may not extend closer than 5 feet to a lot line abutting an RF – RM4 or RMP zoned lot."
        - "Stairways and wheelchair ramps that do not meet the standard of Subparagraph B.3.b below"
        - "no more than 2-1/2 feet above the ground"

