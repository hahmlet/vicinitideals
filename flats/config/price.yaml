# Price per home (FOLLOWUPS 66, Steph's rulings 2026-10-10).
#
# A label, never a screen: it does not change a lot's colour. Every number
# here is a setting a person can override on the Lots page; none is buried in
# code.
#
# pod_sqft       One pod plus its parking plus its share of yard.
# road_share_pct What new roads take, on lots big enough for road_from_pods or
#                more pods. Smaller lots take no road share.
# road_from_pods Gross pods (lot area / pod_sqft) at which the road share starts.
# homes_per_pod  Every pod design is four attached townhomes.
# default_per_home_max
#                The Lots page filter's starting amount ($ per home).
pod_sqft: 4500
road_share_pct: 25
road_from_pods: 3
homes_per_pod: 4
default_per_home_max: 30000
