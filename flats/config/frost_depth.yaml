# Frost depth per jurisdiction (FOLLOWUPS 197). A NOTE on the lot report and the
# lot page for the foundation-design reader downstream: it never changes a
# lot's colour, a check or a flag.
#
# Stored as printed: every `figure` is the token the source prints, and it must
# appear inside its `quote`; the loader (flats/frost.py) derives the inches.
# `cite` is the stored copy (gitignored, under data/flats/books/frost/) and the
# page or `html` where the quote sits; `url` is where it was fetched.
#
# Outcome of each place:
#   found    - the place's own department prints a figure (its `kind` says
#              whether it is adopted code text or department practice: a
#              handout, checklist or design-criteria sheet).
#   silent   - we read where the figure would be stated and it states none.
#              Steph's ruling 2026-11-18-frost-depth-silent-falls-back: the
#              county department's figure, else the state figure, is used and
#              is valid, flagged with its level.
#   not_read - the document could not be obtained. No fallback is claimed: the
#              note says so and shows the state figure for reference only.
# A lot whose jurisdiction has no row here (a `juris_city:` lot) is not_read.
#
# Elevation: no lot elevation is held, so a figure is shown for the lowest
# elevation band and every higher band is listed as a caveat on the note.

read_on: 2026-11-18

state:
  # Oregon Residential Specialty Code (ORSC) Table R301.2, the county table the
  # 4-unit townhouse is designed under (R403.1.4.1: footings meet the frost
  # depth of Table R301.2). Read in BCD's own 2023 ORSC Summary of Amendments.
  edition: 2023 Oregon Residential Specialty Code, Table R301.2
  document: BCD, 2023 ORSC Summary of Amendments (errata April 2024), p.29
  url: https://www.oregon.gov/bcd/codes-stand/Documents/23orsc-summaryofamendments.pdf
  cite: data/flats/books/frost/state-baseline/orsc/23orsc-summaryofamendments.pdf#p29
  minimum_depth:
    figure: 12 inches
    quote: >-
      R403.1.4 Minimum depth. Exterior footings shall be placed not less than
      12 inches (305 mm) below finished grade on the undisturbed ground surface.
    cite: data/flats/books/frost/state-baseline/orsc/23orsc-summaryofamendments.pdf#p88
  next_edition: >-
    The 2026 ORSC (in force since 2026-10-01, mandatory 2027-04-01; either
    edition may be used until then) adopts a new Oregon table aligned with the
    2025 OSSC. BCD's 2025 OSSC matrix (item 18-8, 1809.5) records Clackamas
    moving from 12 to 18 inches, with 12 inches below 2,500 ft and 24 inches
    above 4,000 ft. The 2026 ORSC table itself is not yet published (read
    2026-11-18).
  next_edition_cite: data/flats/books/frost/state-baseline/ossc/2025-ossc-matrix.pdf#p19
  counties:
    multnomah:
      bands:
        - below_ft: 2500
          figure: 12 inches
          quote: >-
            e. The frost line depth for site elevations below 2,500 feet in
            Jackson, Josephine and Multnomah Counties is 12 inches.
        - from_ft: 2500
          figure: 18e
          quote: Multnomah Note a 98 98 Note c Moderate 18e Moderate ≤ 1,500
    clackamas:
      bands:
        - figure: "12"
          quote: Clackamas Note a 98 98 Note c Moderate 12 Moderate ≤ 1,500
      higher_ground_next_edition: >-
        Under the 2026 ORSC / 2025 OSSC: 18 inches from 2,500 ft, 24 inches
        above 4,000 ft.
    washington:
      bands:
        - figure: "12"
          quote: Washington Note a 97 - Note c Moderate 12 Moderate ≤ 1,500

