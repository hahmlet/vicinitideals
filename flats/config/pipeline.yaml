    fields: [FLD_ZONE, ZONE_SUBTY, SFHA_TF, STATIC_BFE]
    where: '"DFIRM_ID" IN (''41051C'', ''41005C'', ''41067C'')'
    serves: [or/multnomah, or/clackamas, or/washington]
    notes: >-
      NFHL rejects the unquoted form of the where clause intermittently — keep
      the quoting exactly as written. DFIRM_ID is the county FIPS: 41051C
      Multnomah, 41005C Clackamas, 41067C Washington (added 2026-09-30). The clause named Multnomah alone until the
      first acquire snapshot (2026-09-18) showed 3,476 features for a dataset
      serving both counties; a third county needs its ID added here in the
      same breath as its jurisdictions.

