    label: Wilsonville significant resource overlay zone impact area
    provides: overlay
    url: https://gis.wilsonvillemaps.com/server/rest/services/LandUseDataset/SROZ_ImpactArea/MapServer/166
    fields: [SROZ_ID, SIG, ACRES, BUFF_DIST]
    serves: [or/clackamas/wilsonville]
    notes: >-
      The city publishes the ring, not the resource: each polygon is an
      exterior boundary with one hole and the hole is the SROZ. quadfit fills
      the holes on load (overlays.yaml `fill_holes`); the fetched shape is
