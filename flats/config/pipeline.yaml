    provides: overlay
    url: https://services5.arcgis.com/fuVQ9NIPGnPhCBXp/arcgis/rest/services/NaturalResourceOZ/FeatureServer/1
    fields: [Id]
    serves: [or/clackamas/happy-valley]

  overlay_happy_valley_slope:
