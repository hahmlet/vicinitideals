    url: https://gis.greshamoregon.gov/ext/rest/services/GME/Environmental/MapServer/8
    fields: [OBJECTID]
    serves: [or/multnomah/gresham]

  overlay_troutdale_veco:
    kind: arcgis
    label: Troutdale Title 3 vegetated corridor
    provides: overlay
    url: https://maps.troutdaleoregon.gov/server/rest/services/Public_Web/City_GIS/MapServer/77
    fields: [flood96, fema, wetbuf, riparian, title3]
    serves: [or/multnomah/troutdale]

  overlay_fairview_nrl:
    kind: arcgis
    label: Fairview natural resource layer
    provides: overlay
    url: https://services5.arcgis.com/3DoY8p7EnUTzaIE7/arcgis/rest/services/Natural_Resource_Layer/FeatureServer/0
    fields: [TYPE]
    serves: [or/multnomah/fairview]
    notes: These polygons are already the buffered corridors, not the stream lines.

  overlay_metro_title3:
    kind: arcgis
    label: Metro Title 3 water quality and flood management
    provides: overlay
    url: https://services2.arcgis.com/McQ0OlIABe29rJJy/arcgis/rest/services/Title_3_Land/FeatureServer/0
    fields: [FLOOD96, FEMA, WETBUF, RIPARIAN, TITLE3]
    serves: [or/multnomah, or/clackamas]
    notes: Regional fallback for jurisdictions with no local corridor layer.

  overlay_metro_title13:
    kind: arcgis
    label: Metro Title 13 habitat conservation areas
    provides: overlay
    url: https://services2.arcgis.com/McQ0OlIABe29rJJy/arcgis/rest/services/Title_13_Habitat_Conservation_Areas/FeatureServer/0
    fields: [HCA_VALUE]
    serves: [or/multnomah, or/clackamas]

  overlay_metro_wetlands:
    kind: arcgis
    label: Metro wetlands
    provides: overlay
    url: https://services2.arcgis.com/McQ0OlIABe29rJJy/arcgis/rest/services/Wetlands/FeatureServer/0
    fields: [SOURCE]
    serves: [or/multnomah, or/clackamas]

  overlay_fema_flood:
    kind: arcgis
    label: FEMA National Flood Hazard Layer
    provides: overlay
    url: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28
    fields: [FLD_ZONE, ZONE_SUBTY, SFHA_TF, STATIC_BFE]
    where: '"DFIRM_ID" IN (''41051C'', ''41005C'')'
    serves: [or/multnomah, or/clackamas]
    notes: >-
      NFHL rejects the unquoted form of the where clause intermittently — keep
      the quoting exactly as written. DFIRM_ID is the county FIPS: 41051C
      Multnomah, 41005C Clackamas. The clause named Multnomah alone until the
      first acquire snapshot (2026-09-18) showed 3,476 features for a dataset
      serving both counties; a third county needs its ID added here in the
      same breath as its jurisdictions.

  # --- Clackamas city overlays ---------------------------------------------
  # The environmental layers quadfit's s5o screens against, registered here
  # so a snapshot carries every layer the measurement reads (they were
  # fetched by quadfit's s0 alone until 2026-09-19 and stayed at their July
  # vintage undated). Kill / flag / carve is decided in
  # `Lot Analysis/quadfit/config/overlays.yaml`, not here; s0_acquire.py holds
  # the code readings behind each one.

  overlay_west_linn_wra_stream:
    kind: arcgis
    label: West Linn water resource area streams
    provides: overlay
    geometry: polyline
    url: https://geo.westlinnoregon.gov/server/rest/services/Operational/RiparianCI/MapServer/2
    fields: [NAME, TYPE]
    where: TYPE = 'STREAM'
    serves: [or/clackamas/west-linn]
    notes: One service, three TYPE values, three registry entries -- the code gives each type a different width.

  overlay_west_linn_wra_ephemeral:
    kind: arcgis
    label: West Linn water resource area ephemeral streams
    provides: overlay
    geometry: polyline
    url: https://geo.westlinnoregon.gov/server/rest/services/Operational/RiparianCI/MapServer/2
    fields: [NAME, TYPE]
    where: TYPE = 'EPHEMERAL'
    serves: [or/clackamas/west-linn]

  overlay_west_linn_wra_piped:
