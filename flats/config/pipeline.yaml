# FLATS data sources — one declared dataset per thing we fetch.
#
# Every county GIS endpoint the screen depends on lives here rather than inside
# a downloader, for three reasons. A URL that rots is a config edit, not a code
# change. A jurisdiction can be switched off without touching anything that
# runs. And the registry itself is auditable: it is possible to ask "what is
# Gresham's zoning read from" and get an answer without reading Python.
#
# Every dataset arrives in the working CRS. Where a service publishes something
# else, `native_srid` records that and the fetch reprojects server-side — a
# silent CRS mismatch would put every lot in the wrong place with no error.
#
# Field lists are not decoration: a layer fetched without its attributes yields
# geometry nobody can zone.

version: 1

#: NAD83(HARN) / Oregon North, in FEET. Everything the screen measures —
#: setbacks, envelope, fit — is in feet, so the working CRS is a foot CRS and
#: no unit conversion happens anywhere downstream.
working_srid: 2913
#: WGS84, for map display and the centroid stored on flats.lots.
display_srid: 4326

defaults:
  #: Distance from a lot line to a street centerline that counts as frontage.
  #: Taxlots exclude right-of-way, so this is about half a local ROW width.
  street_threshold_ft: 40.0
  #: Boundary simplification before edge classification — merges the collinear
  #: vertex runs that survey data is full of.
  simplify_tolerance_ft: 1.0
  #: Raster cell for the fit stage. Matches the fit_ft tolerance in slack.yaml.
  grid_resolution_ft: 0.5

#: Jurisdictions the run covers. Setting one false stops it being fetched and
#: scored without deleting its rules, its history, or anyone's review
#: decisions — toggling a city back on re-runs only that city.
jurisdictions:
  or/multnomah/portland: true
  or/multnomah/gresham: true
  or/multnomah/troutdale: true
  or/multnomah/fairview: true
  or/multnomah/wood-village: true
  or/multnomah/maywood-park: false      # no multi-dwelling zoning of interest
  or/multnomah/_unincorporated: true
  or/clackamas/happy-valley: true
  or/clackamas/milwaukie: true
  or/clackamas/oregon-city: true
  or/clackamas/gladstone: true
  or/clackamas/canby: true
  or/clackamas/sandy: true
  or/clackamas/estacada: true
  or/clackamas/west-linn: true
  or/clackamas/tualatin: true
  or/clackamas/wilsonville: true
  or/clackamas/lake-oswego: true        # north edge crosses into Multnomah
  or/clackamas/johnson-city: false      # manufactured-home park, no fourplex land
  or/clackamas/rivergrove: false        # ~500 people, no multi-dwelling zones
  or/clackamas/_unincorporated: true
  # Washington County, first mapped 2026-09-30 (FOLLOWUPS 17(d)). The eight
  # layers the corpus holds. Tigard and Cornelius are encoded (item 17) and
  # were switched on 2026-10-07 (item 51); their zoning is Metro's regional
  # layer. Forest Grove is not encoded yet and stays off (an unknown
  # jurisdiction is off); Tualatin, Portland, Wilsonville and Lake Oswego lots
  # in the county reach the layers those cities already have by their
  # JURIS_CITY.
  or/washington/_unincorporated: true
  or/washington/hillsboro: true
  or/washington/beaverton: true
  or/washington/sherwood: true
  or/washington/king-city: true
  or/washington/durham: true
  or/washington/tigard: true
  or/washington/cornelius: true

datasets:

  # --- regional base layers ------------------------------------------------

  rlis_taxlots:
    kind: rlis_zip
    label: Metro RLIS regional taxlots
    provides: lots
    url: https://drcmetro.maps.arcgis.com/sharing/rest/content/items/3949bc39e980444384312a8c4d7bdb08/data
    member: TAXLOTS/taxlots_public.shp
    serves: [or/multnomah, or/clackamas, or/washington]
    filter: COUNTY in (M, C, W)
    fields:
      [TLID, SITEADDR, SITECITY, SITEZIP, JURIS_CITY, COUNTY, PROP_CODE,
       STATECLASS, LANDUSE, YEARBUILT, BLDGSQFT, LANDVAL, BLDGVAL, TOTALVAL,
       ASSESSVAL, SALEDATE, SALEPRICE]
    notes: >-
      The regional shapefile carries the three Metro counties; the filter keeps
      the ones FLATS covers (Washington from 2026-09-30). Holes must be read through pyshp's
      __geo_interface__ — the delta helper's own converter splits interior rings
      into separate polygons, which inflates lot areas.

  rlis_taxlot_change:
    kind: rlis_zip
    label: Metro RLIS taxlot changes since the last quarterly release
    provides: changelog
    url: https://drcmetro.maps.arcgis.com/sharing/rest/content/items/3949bc39e980444384312a8c4d7bdb08/data
    member: TAXLOTS/taxlot_change.dbf
    geometry: table
    serves: [or/multnomah, or/clackamas, or/washington]
    fields: [TLID, ORTAXLOT, ADDCHANGE]
    notes: >-
      Metro's own list of lots ADDED, DELETED or CHANGED in the quarter (the
      2026_08 release held 127,407 rows). Read by the refresh delta to check
      our July-vs-now diff against the county's account; never used to build
      the lot table. ORTAXLOT's first two digits name the county (03
      Clackamas, 26 Multnomah, 34 Washington) -- there is no COUNTY field to
      filter on; the delta keeps the counties it was asked for.

  rlis_streets:
    kind: rlis_zip
    label: Metro RLIS street centerlines
    provides: streets
    url: https://drcmetro.maps.arcgis.com/sharing/rest/content/items/3949bc39e980444384312a8c4d7bdb08/data
    member: STREETS/streets.shp
    geometry: polyline
    serves: [or/multnomah, or/clackamas, or/washington]
    fields: [LOCALID, STREETNAME, PREFIX, FTYPE, TYPE, F_ZLEV, T_ZLEV]
    notes: Frontage is inferred from distance to these lines. Without them every lot reads landlocked.

  rlis_zoning_metro:
    kind: rlis_zip
    label: Metro regional zoning (fallback)
    provides: zoning
    url: https://drcmetro.maps.arcgis.com/sharing/rest/content/items/3949bc39e980444384312a8c4d7bdb08/data
    member: LAND/zoning.shp
    zone_field: ZONE
    serves: [or/multnomah/_unincorporated, or/clackamas/_unincorporated, or/multnomah/fairview, or/washington/durham, or/washington/tigard, or/washington/cornelius]
    notes: >-
      Covers the jurisdictions that publish no zoning service of their own —
      Fairview's code is PDF-only, neither Multnomah nor Clackamas publishes
      unincorporated zoning through ArcGIS, and Durham publishes none (its
      21 polygons here are CITY 'Durham': SDR, MDR, OP, IP, NR).
      Tigard and Cornelius are read from it too (2026-10-07): each lot takes
      the Metro polygon covering most of it.

  rlis_orca:
    kind: rlis_zip
    label: Metro RLIS Outdoor Recreation and Conservation Areas (ORCA)
    provides: overlay
    url: https://drcmetro.maps.arcgis.com/sharing/rest/content/items/3949bc39e980444384312a8c4d7bdb08/data
    member: LAND/orca.shp
    serves: [or/multnomah, or/clackamas, or/washington]
    filter: COUNTY in (Multnomah, Clackamas, Washington)
    fields: [SITENAME, UNITTYPE, OWNER, OWNLEV1, OWNLEV2, MANAGER, CITYMUNI, COUNTY, STATUS, RECREATION]
    notes: >-
      Metro's regional inventory of parks, natural areas, golf courses,
      cemeteries, HOA tracts, school land and trail parcels, registered to the
      taxlots (the 2026_08 release: 15,932 units, Multnomah 6,327, Clackamas
      4,129, Washington 5,476; COUNTY is spelled
      out here, not M/C as on the taxlots). UNITTYPE is the reading: Park,
      Natural Area, Home Owners Association, Other, School Land, Cemetery,
      Golf Course, defined in the member's own metadata (LAND/orca.shp.xml).
      quadfit's s4 looks the point across each non-street lot line up in it
      (`park_across_json`), and a layer's `parks:` block says which unit types
      are a park in its own code's words (flats/geom/park.py) -- Troutdale's
      MU-3 owes 10 ft "when abutting a park (regardless of zoning district)".
      The sibling LAND/orca_sites.shp is the same land dissolved into named
      sites; the unit layer is the one that carries UNITTYPE per parcel.

  osm_land_use:
    kind: overpass
    label: OpenStreetMap -- institutional, utility and transport land
    provides: land_use
    url: https://overpass-api.de/api/interpreter
    geometry: mixed
    bbox_4326: [-123.49, 44.88, -121.65, 45.86]
    serves: [or/multnomah, or/clackamas, or/washington]
    fields: [name, amenity, healthcare, office, leisure, sport, place, aeroway, man_made, landuse, power, public_transport, railway, park_ride, shop, operator, access, service, usage, tunnel, "plant:source", religion, denomination]
    query: |
      nwr["amenity"~"^(school|college|university|hospital|townhall|courthouse|police|fire_station|library|prison|bus_station|waste_transfer_station)$"]({bbox});
      nwr["healthcare"="hospital"]({bbox});
      nwr["office"="government"]({bbox});
      nwr["leisure"~"^(park|marina|water_park)$"]({bbox});
      nwr["leisure"="sports_centre"]["sport"="swimming"]({bbox});
      nwr["place"="square"]({bbox});
      nwr["aeroway"="aerodrome"]({bbox});
      nwr["man_made"~"^(wastewater_plant|water_works|reservoir_covered|water_tower|pumping_station)$"]({bbox});
      nwr["landuse"~"^(landfill|railway)$"]({bbox});
      nwr["power"~"^(substation|plant)$"]({bbox});
      nwr["public_transport"="station"]({bbox});
      nwr["railway"~"^(station|rail|light_rail)$"]({bbox});
      nwr["amenity"="parking"]["park_ride"~"^(yes|bus|train|tram)$"]({bbox});
      nwr["shop"="mall"]({bbox});
    notes: >-
      The land Steph ruled RED and out of the scan on 2026-10-06 (FOLLOWUPS
      47): schools, hospitals, municipal sites, parks, water treatment and
      heavy infrastructure, airports, marinas, transit hubs, rail, public
      pools and plazas, waste treatment, malls -- and NOT churches or
      charities, which sell land and stay screened (no place_of_worship
      selector, on purpose; `religion` is kept so a church's school can be
      told apart). No county publishes this: Washington's roll
      marks public land (LANDUSE PUB), Multnomah's only tax-exempt land
      (churches included), Clackamas neither. Which tags mean which category
      is flats/config/institutional.yaml; this is the superset fetched. The
      box is the three counties. overpass-api.de sheds load at busy hours
      (a 504 after a long queue); the fetch retries, and a cut-short answer
      is refused, never written. 2026-10-06: 9,266 elements.

  ugb_metro:
    kind: arcgis
    label: Urban growth boundary
    provides: boundary
    url: https://gis.oregonmetro.gov/arcgis/rest/services/OpenData/BoundaryDataWebMerc/MapServer/6
    fields: [UGB]
    native_srid: 3857
    serves: [or/multnomah, or/clackamas, or/washington]
    notes: >-
      HB 2001's fourplex mandate follows the UGB, not city population. Was the
      RLIS ZIP member BOUNDARY/ugb.shp until the first acquire snapshot
      (2026-09-18) found the quarterly archive no longer carries it (426
      members, PLANNING/ugb_history.shp is amendments not the boundary); Metro's
      own boundary service publishes the one polygon in Web Mercator.

  # --- authoritative city zoning -------------------------------------------

  zoning_portland:
    kind: arcgis
    label: Portland Maps zoning
    provides: zoning
    url: https://www.portlandmaps.com/arcgis/rest/services/Public/Zoning/MapServer/0
    zone_field: ZONE
    fields: [ZONE, ZONE_DESC, OVRLY, MAPLABEL, UNINC]
    serves: [or/multnomah/portland]
    notes: OVRLY carries overlay letters as text; the environmental overlay geometry is a separate layer.

  zoning_gresham:
    kind: arcgis
    label: Gresham planning zoning
    provides: zoning
    url: https://gis.greshamoregon.gov/ext/rest/services/GME/Planning/MapServer/4
    zone_field: ZONE
    fields: [ZONE, DISTRICT, DESCRIPT]
    serves: [or/multnomah/gresham]

  zoning_troutdale:
    kind: arcgis
    label: Troutdale zoning
    provides: zoning
    url: https://maps.troutdaleoregon.gov/server/rest/services/Public_Web/City_GIS/MapServer/74
    zone_field: zonecode
    fields: [zonecode, description]
    serves: [or/multnomah/troutdale]

  zoning_wood_village:
    kind: arcgis
    label: Wood Village zoning
    provides: zoning
    url: https://services7.arcgis.com/5Loh3xXKWLd2M7xA/arcgis/rest/services/Zoning/FeatureServer/9
    zone_field: Labeling
    fields: [Labeling, Name]
    serves: [or/multnomah/wood-village]

  zoning_lake_oswego:
    kind: arcgis
    label: Lake Oswego zoning
    provides: zoning
    url: https://maps.ci.oswego.or.us/server/rest/services/Layers_Geocortex/MapServer/68
    zone_field: LAYER
    fields: [LAYER, INFO, LINK]
    serves: [or/clackamas/lake-oswego]
    notes: The city's north edge crosses the county line into Multnomah — roughly 1,450 lots.

  zoning_happy_valley:
    kind: arcgis
    label: Happy Valley zoning
    provides: zoning
    url: https://services5.arcgis.com/fuVQ9NIPGnPhCBXp/arcgis/rest/services/Zoning_public_view/FeatureServer/0
    zone_field: ZONE
    fields: [ZONE, ZOVER]
    serves: [or/clackamas/happy-valley]

  zoning_milwaukie:
    kind: arcgis
    label: Milwaukie zoning
    provides: zoning
    url: https://services6.arcgis.com/8e6aYcxt8yhvXvO9/ArcGIS/rest/services/COM_Zoning_SDE/FeatureServer/11
    zone_field: ZONE
    fields: [ZONE]
    serves: [or/clackamas/milwaukie]

  zoning_oregon_city:
    kind: arcgis
    label: Oregon City zoning
    provides: zoning
    url: https://maps.orcity.org/arcgis/rest/services/LandUseAndPlanning_PUBLIC/MapServer/62
    zone_field: ZONE
    fields: [ZONE]
    serves: [or/clackamas/oregon-city]

  zoning_gladstone:
    kind: arcgis
    label: Gladstone zoning
    provides: zoning
    url: https://maps.orcity.org/arcgis/rest/services/GLADSTONE/Gladstone_LandUseAndPlanning/MapServer/7
    zone_field: ZONE
    fields: [ZONE, CITY]
    where: CITY = 'Gladstone'
    serves: [or/clackamas/gladstone]
    notes: >-
      The layer on Gladstone's service is the regional zoning fabric with a CITY
      column (18,258 polygons, Forest Grove to Canby); the where clause keeps
      Gladstone's 35. Without it the first acquire snapshot (2026-09-18) took
      312 MB of other cities' zoning under Gladstone's name.
    notes: >-
      Oregon City hosts this on Gladstone's behalf and the service is
      countywide. Gladstone lots pick their own polygons in the majority-area
      join because they sit inside the city.

  zoning_canby:
    kind: arcgis
    label: Canby zoning
    provides: zoning
    url: https://maps.orcity.org/arcgis/rest/services/GLADSTONE/Gladstone_LandUseAndPlanning/MapServer/7
    zone_field: ZONE
    fields: [ZONE, CITY]
    where: CITY = 'Canby'
    serves: [or/clackamas/canby]
    notes: >-
      The same regional zoning fabric Gladstone reads (it carries a CITY
      column); the where clause keeps Canby's 49 polygons. Spellings are the
      fabric's (R1, R1.5, CR); the layer's zone_rulings alias them.

  zoning_sandy:
    kind: arcgis
    label: Sandy zoning
    provides: zoning
    url: https://maps.orcity.org/arcgis/rest/services/GLADSTONE/Gladstone_LandUseAndPlanning/MapServer/7
    zone_field: ZONE
    fields: [ZONE, CITY]
    where: CITY = 'Sandy'
    serves: [or/clackamas/sandy]
    notes: >-
      The same regional zoning fabric Gladstone and Canby read; the where
      clause keeps Sandy's 128 polygons. Spellings are the fabric's (R1, R2,
      R3, C1, SFR); the layer's zone_rulings alias them.

  zoning_estacada:
    kind: arcgis
    label: Estacada zoning
    provides: zoning
    url: https://maps.orcity.org/arcgis/rest/services/GLADSTONE/Gladstone_LandUseAndPlanning/MapServer/7
    zone_field: ZONE
    fields: [ZONE, CITY]
    where: CITY = 'Estacada'
    serves: [or/clackamas/estacada]
    notes: >-
      The same regional zoning fabric Gladstone, Canby and Sandy read; the
      where clause keeps Estacada's polygons. Spellings are the fabric's
      (R1, R2, R3, C1, C2, RC, HC, OC, M1, AP, OS); the layer's zone_rulings
      alias them.

  zoning_west_linn:
    kind: arcgis
    label: West Linn zoning
    provides: zoning
    url: https://geo.westlinnoregon.gov/server/rest/services/Operational/ZoningComPlan/MapServer/8
    zone_field: DESIGNATION
    fields: [DESIGNATION]
    serves: [or/clackamas/west-linn]
    notes: DESIGNATION carries the canonical hyphenated code (R-5, R-10); the sibling ZONE field is a compressed alias.

  zoning_tualatin:
    kind: arcgis
    label: Tualatin planning districts
    provides: zoning
    url: https://tualgis.ci.tualatin.or.us/server/rest/services/LandusePlanningExplorer/MapServer/6
    zone_field: PLANDIST.CZONE
    fields: [PLANDIST.CZONE]
    serves: [or/clackamas/tualatin]
    notes: The zone code is a joined-table qualified field name, dot and all.

  zoning_wilsonville:
    kind: arcgis
    label: Wilsonville zoning
    provides: zoning
    url: https://gis.wilsonvillemaps.com/server/rest/services/Map___WilsonvilleMaps_MIL1/FeatureServer/40
    zone_field: ZONE_CODE
    fields: [ZONE_CODE]
    serves: [or/clackamas/wilsonville]

  # Washington County, 2026-09-30. Every distinct code on each layer was read
  # against the corpus that day and resolves to a zone, an alias, a pocket or
  # a ruling -- none unruled.

  zoning_washington_county:
    kind: arcgis
    label: Washington County land use districts
    provides: zoning
    url: https://gispub.co.washington.or.us/server/rest/services/Open_Data/Open_Data_AGOL/MapServer/2
    zone_field: LUD
    fields: [LUD, Urban]
    serves: [or/washington/_unincorporated]
    notes: >-
      The county's own Land Use Districts layer, the whole county, city land
      included. Unincorporated lots are routed to it by JURIS_CITY, so the
      city polygons are never read for them. LUD carries the CDC's own
      spellings (R-5, R-6 NB, TO:R9-12, FD-20, EFU).

  zoning_hillsboro:
    kind: arcgis
    label: Hillsboro zoning
    provides: zoning
    url: https://services1.arcgis.com/eQ2vvbCvmxlIgo3a/arcgis/rest/services/Community_Development/FeatureServer/2
    zone_field: DESCRIPTIO
    fields: [DESCRIPTIO]
    serves: [or/washington/hillsboro]
    notes: The field name is truncated in the service (DESCRIPTIO); it holds the zone code, not a description.

  zoning_beaverton:
    kind: arcgis
    label: Beaverton zoning
    provides: zoning
    url: https://gisweb.beavertonoregon.gov/server/rest/services/Public_SharedServices/pubZoning/MapServer/0
    zone_field: ZONE_NAME
    fields: [ZONE_NAME]
    serves: [or/washington/beaverton]
    notes: WAcnty is county zoning kept after annexation -- a pocket the corpus rules, not a Beaverton zone.

  zoning_sherwood:
    kind: arcgis
    label: Sherwood zoning
    provides: zoning
    url: https://services5.arcgis.com/ikEzR7lqVIlrcVFn/arcgis/rest/services/Planning/FeatureServer/2
    zone_field: CODE
    fields: [CODE]
    serves: [or/washington/sherwood]

  zoning_king_city:
    kind: arcgis
    label: King City zoning (current districts and Kingston Terrace)
    provides: zoning
    url: https://services8.arcgis.com/NsUn9YuPFCjrkDe3/arcgis/rest/services/King_City_Current_and_Future_Zoning_Map_WFL1/FeatureServer/1
    zone_field: ZONECLASS
    fields: [ZONECLASS]
    parts:
      - url: https://services8.arcgis.com/NsUn9YuPFCjrkDe3/arcgis/rest/services/King_City_Current_and_Future_Zoning_Map_WFL1/FeatureServer/4
        fields: [Zoning_Designations]
        zone_field: Zoning_Designations
    serves: [or/washington/king-city]
    notes: >-
      Two layers of one service, disjoint: layer 1 the older districts (and
      five county "(WC)" pockets), layer 4 the Kingston Terrace
      neighbourhoods under their names ("Town Center" for KTTC). Written into
      one file with layer 4's name copied into ZONECLASS, so every reader
      sees one zone field.

  # --- environmental overlays ----------------------------------------------

  overlay_pdx_ezone_p:
    kind: arcgis
    label: Portland environmental protection zone
    provides: overlay
    url: https://www.portlandmaps.com/arcgis/rest/services/Public/BPS_Zoning_Code_Layers/MapServer/117
    fields: [OVRLY, ZONE, PLDIST]
    serves: [or/multnomah/portland]
    notes: The overlay geometry, not the OVRLY letters printed on the base zoning layer.

  overlay_pdx_ezone_c:
    kind: arcgis
    label: Portland environmental conservation zone
    provides: overlay
    url: https://www.portlandmaps.com/arcgis/rest/services/Public/BPS_Zoning_Code_Layers/MapServer/118
    fields: [OVRLY, ZONE, PLDIST]
    serves: [or/multnomah/portland]

  overlay_pdx_ezone_v:
    kind: arcgis
    label: Portland river/greenway overlay
    provides: overlay
    url: https://www.portlandmaps.com/arcgis/rest/services/Public/BPS_Zoning_Code_Layers/MapServer/116
    fields: [OVRLY, ZONE, PLDIST]
    serves: [or/multnomah/portland]

  # --- mapped corridors (flats/geom/corridor.py) ----------------------------

  corridors_pdx:
    kind: arcgis
    label: Portland Civic and Neighborhood Corridors (Map 120-1 / 130-3)
    provides: overlay
    url: https://www.portlandmaps.com/arcgis/rest/services/Public/BPS_Zoning_Code_Layers/MapServer/24
    geometry: polyline
    fields: [StreetName, MapLabel]
    serves: [or/multnomah/portland]
    notes: >-
      Street centerlines, 158 segments. Answers civic_corridor -- RM2 coverage
      70 percent on a site that abuts one (33.120.225.B).

  corridor_setbacks_pdx:
    kind: arcgis
    label: Portland Civic Corridors with Required Setbacks (Map 130-1)
    provides: overlay
    url: https://www.portlandmaps.com/arcgis/rest/services/Public/BPS_Zoning_Code_Layers/MapServer/78
    geometry: polyline
    fields: [STREETNAME, SETBACK, SETBACK_DESC, ORDINANCE]
    serves: [or/multnomah/portland]
    notes: >-
      Five stretches (Barbur, Division, 122nd x2, Stark). Answers
      civic_corridor_setback -- the 10 ft minimum from a street lot line on
      one in the commercial zones (33.130.215.B.1.a). A different map from
      corridors_pdx; the code names them separately. Also answers
      civic_corridor_setback_all_streets (every street line on a stretch,
      read by the street each abuts), which carries the 20 ft maximum front
      setback the same map allows in place of 10 (33.130.215.C.1).

  # --- street functional class (flats/geom/street_class.py) -----------------

  street_class_milwaukie:
    kind: arcgis
    label: Milwaukie TSP roadway classification
    provides: streets
    url: https://services6.arcgis.com/8e6aYcxt8yhvXvO9/arcgis/rest/services/TS_Roadway_Classification_Service/FeatureServer/0
    geometry: polyline
    fields: [PREFIX, STREETNAME, FTYPE, JURISDIC, RoadwayClassification]
    parts:
      - url: https://services6.arcgis.com/8e6aYcxt8yhvXvO9/arcgis/rest/services/TS_Roadway_Classification_Service/FeatureServer/1
        fields: [PREFIX, STREETNAME, FTYPE, JURISDIC, RoadwayClassification]
    serves: [or/clackamas/milwaukie]
    notes: >-
      The city's TSP street map (layer 0 the city's streets, layer 1 the
      county's, the state's and the joint ones), drawn on Metro's 2026-03-18
      centrelines. RoadwayClassification: Local Street, Neighborhood Routes,
      Collector, and four kinds of arterial, plus Proposed Local and
      Proposed Neighborhood Routes. It reflects the 2023-25 TSP update the
      planning commission recommended on 2026-01-28. Answers local_street,
      which carries MMC 12.16.040.E.3's driveway apron (12 ft on local or
      neighborhood streets, 16 on collector or arterial).

  street_class_wilsonville:
    kind: arcgis
    label: Wilsonville TSP functional classification (Streets_OMS)
    provides: streets
    url: https://www.wilsonvillemaps.com/server/rest/services/Map___TransportationService_MIL1/MapServer/180
    geometry: polyline
    fields: [PREFIX, STREETNAME, FTYPE, Jurisdiction, Functional_Class]
    serves: [or/clackamas/wilsonville]
    notes: >-
      The city's own street layer (last edited 2026-09-23). Functional_Class
      holds the TSP's four classes -- Major Arterial, Minor Arterial,
      Collector, Local Street -- of the 2013 TSP as amended through Ord. 877
      (2023), whose Figure 3-2 is the legal map. Layer 170 on the same server
      ("Streets_Functional2012", COW_FuncClass) is an older scheme with a
      catch-all "Road" class: not this one. Answers local_street, which
      carries the Villebois front and street-side yards (Table V-1 note 6:
      20 ft and 15 ft on a Collector Avenue, 12 and 5 otherwise) -- False
      only: the Collector Avenues are the Villebois Village Master Plan's
      (Figure 7 Street Plan, 2013), which draws Minor Collectors on streets
      this layer calls Local Street. Also ranks the classes for PWS
      201.2.23(f)'s "lower classification street" (corner_access_street).

  # The four below only rank street lines for a corner lot's lowest-class
  # driveway rule (corner_access_street: lowest_class, FOLLOWUPS 41(i)).
  street_class_oregon_city:
    kind: arcgis
    label: Oregon City TSP functional classification
    provides: streets
    url: https://maps.orcity.org/arcgis/rest/services/Transportation_PUBLIC/MapServer/4
    geometry: polyline
    fields: [PREFIX, STREETNAME, FTYPE, IN_CITY, FunctionalClass]
    serves: [or/clackamas/oregon-city]
    notes: >-
      The city's street lines (8,224, edited 2026-06-03). FunctionalClass is
      the 2013 TSP as amended: Local, Collector, Minor Arterial, Major
      Arterial, Expressway, Freeway, and two Unclassified values.
      FunctionalClass_Old disagrees on 473 in-city segments and is not
      read: the plan's own fact sheets agree with the current field.

  street_class_west_linn:
    kind: arcgis
    label: West Linn TSP functional classification
    provides: streets
    url: https://geo.westlinnoregon.gov/server/rest/services/Operational/RoadFCs/MapServer/4
    geometry: polyline
    fields: [CITYCLASS]
    serves: [or/clackamas/west-linn]
    notes: >-
      "Functional Classes from TSP adopted 2016" (the service). CITYCLASS is
      a number code, decoded from the map legend (9 Local, 7 Neighborhood
      Route, 6 Collector, 5 Minor Arterial, 3 Major Arterial, 1/99 Freeway,
      11 Alley, 20 Misc, 10 unlabelled). No street names: lines are matched
      to Metro's by where they run.

  street_class_fairview:
    kind: arcgis
    label: Fairview TSP functional classification
    provides: streets
    url: https://services5.arcgis.com/3DoY8p7EnUTzaIE7/arcgis/rest/services/Streets_20230124/FeatureServer/1
    geometry: polyline
    fields: [PREFIX, STREETNAME, FTYPE, OWNER, FClassification]
    serves: [or/multnomah/fairview]
    notes: >-
      The 2016 TSP's classes (adopted January 2017), about one line per
      street (311, edited 2023-08): Local, Neighborhood Collector, Major
      Collector, Minor Arterial, Major Arterial, Interstate. 182 of the
      Local lines are private roads.

  street_class_beaverton:
    kind: arcgis
    label: Beaverton TSP functional classification
    provides: streets
    url: https://gisweb.beavertonoregon.gov/server/rest/services/Public_SharedServices/pubStreetsPlan/MapServer/1
    geometry: polyline
    fields: [STREETFULL, FUNC_CLASS, IN_OUT, STATUS]
    where: STATUS = 2
    serves: [or/washington/beaverton]
    notes: >-
      The 2010 TSP's classes as a coded domain (9 Local, 7 Neighborhood
      Route, 5 Collector, 3 Arterial, 2 Principal Arterial, 1 Freeway; 4, 6,
      8 Proposed; 10 NA), existing streets only (STATUS 2; updated
      2026-09-25). A TSP update is under way: re-read the codes when it is
      adopted.

  street_class_washington:
    kind: arcgis
    label: Washington County TSP functional classification
    provides: streets
    url: https://gispub.co.washington.or.us/server/rest/services/LUT_PDS/TSP_Layers/MapServer/4
    geometry: polyline
    fields: [UrbRur, F_Label, FClass2]
    serves: [or/washington/_unincorporated]
    notes: >-
      The county TSP's functional classification (3,609 lines, read
      2026-10-06), its classified roads only: FClass2 1 Freeway, 2
      Principal Arterial, 3 Arterial, 4 Collector, 5 Neighborhood Route,
      and 30/40/50 Proposed Arterial / Collector / Neighborhood Route. No
      local street is drawn and no line is named: a lot line is matched by
      where the line runs, and a street the map leaves out ranks local only
      where Metro types it a minor residential street. For CDC 501-8.5 B's
      access gates (corner_access_street: lowest_class).

  # --- curbs and pavement widths (flats/geom/curbs.py) ----------------------
  # Where the fire truck stands (FOLLOWUPS 29): the hose's 150 ft
  # (OFC 503.1.1) is measured from 10 ft out from the near curb (Steph
  # 2026-10-05, "stricter"). RLIS holds no street width; these are the
  # published curb lines and pavement widths found 2026-10-04. Washington and
  # Clackamas counties keep theirs in pavement systems they do not publish.
  # A street none of these reach is taken as the narrowest a truck may use
  # (20 ft; Steph 2026-10-05, "assume narrow"), and the bridge refuses a
  # snapshot missing any of the four.

  curbs_portland:
    kind: arcgis
    label: Portland PBOT curb and shoulder lines
    provides: streets
    url: https://www.portlandmaps.com/od/rest/services/COP_OpenData_Transportation/MapServer/74
    geometry: polyline
    where: CurbType IN (3110, 3120, 3140)
    fields: [CurbType, CurbStyle]
    serves: [or/multnomah/portland]
    notes: >-
      115k lines; the layer pages at 200 rows a request. CurbType 3110
      Blockface, 3120 Corner, 3140 Shoulder (the pavement's edge where no
      curb is built); 3130 Island and 3150 Parking Block are not a street's
      edge and are not fetched. CurbStyle INSIDE (a property-side curb) is
      fetched and skipped by the reader. No id joins a curb to a street:
      the reader finds the curb a lot line's straight line to the
      centreline crosses.

  pave_width_portland:
    kind: arcgis
    label: Portland PBOT Pavement Management System segments
    provides: streets
    url: https://www.portlandmaps.com/od/rest/services/COP_OpenData_Transportation/MapServer/71
    geometry: polyline
    where: PaveWidth >= 10
    fields: [Streetname, PaveWidth, RoadWidth, Curb, LastInspectionDate]
    serves: [or/multnomah/portland]
    notes: >-
      PaveWidth (ft) on 29,523 segments, inspected mostly 2016-2025; the
      1,027 under 10 ft are not street widths and are not fetched. Drawn
      down the street's middle; matches the drawn curbs within 2 ft on 92%
      of curbed streets (checked 2026-10-04).

  road_width_multnomah:
    kind: arcgis
    label: Multnomah County Road Width (county roads)
    provides: streets
    url: https://www3.multco.us/gisagspublic/rest/services/RoadServices/TransportationLayers/MapServer/17
    geometry: polyline
    where: RoadWidth >= 10
    fields: [RoadName, RoadWidth, ROWwidth, SquareYards, BeginPoint, EndPoint]
    serves: [or/multnomah]
    notes: >-
      486 county roads. RoadWidth is the paved width: SquareYards x 9 over
      the section's length gives it back within 4% on 80% of sections
      (median 1.00, checked 2026-10-05). ROWwidth is the right-of-way.

  street_width_wilsonville:
    kind: arcgis
    label: Wilsonville Streets pavement width
    provides: streets
    url: https://gis.wilsonvillemaps.com/server/rest/services/Map___WilsonvilleMaps_MIL1/MapServer/80
    geometry: polyline
    where: Width >= 10 AND Life_Cycle_Status = 'In Service'
    fields: [STREETNAME, Width, Life_Cycle_Status]
    serves: [or/clackamas/wilsonville]
    notes: >-
      Width (ft) on 1,608 of 1,609 segments, edited 2026; one Proposed and
      one Out of Service street are not fetched.

  # --- transit (flats/geom/transit.py) ---------------------------------------
  # Measured once per transit release into a per-lot distance file
  # (flats/ingest/transit.py), not once per screen. Metro republishes these
  # with each RLIS quarter; the probe compares each layer's dataLastEditDate
  # so an edited stop or a flipped frequent flag is noticed without a
  # download. TriMet only: SMART, CAT, SAM and SCTD are not in these layers.
  # Never county-filtered: a stop across a county line serves the lot.

  transit_rail_stations:
    kind: arcgis
    label: Metro RLIS Rail Transit Stations (MAX, Streetcar, WES)
    provides: transit
    url: https://services2.arcgis.com/McQ0OlIABe29rJJy/arcgis/rest/services/Light_rail_stations/FeatureServer/0
    geometry: point
    where: STATUS = 'Existing'
    fields: [STATION, STATUS, TYPE, LINE, SYMB_CAT]
    serves: [or/multnomah, or/clackamas, or/washington]
    notes: >-
      169 existing stations of 189; the 20 "Planned MAX" are filtered out --
      a station not built is not one a code measures to. TYPE is MAX,
      Street Car or WES. One point per station, near the platform's middle.

  transit_stops:
    kind: arcgis
    label: Metro RLIS TriMet Bus System stops
    provides: transit
    url: https://services2.arcgis.com/McQ0OlIABe29rJJy/arcgis/rest/services/TriMet_Bus_System_stops/FeatureServer/0
    geometry: point
    fields: [RTE, DIR, LOC_ID, TYPE, FREQUENT]
    serves: [or/multnomah, or/clackamas, or/washington]
    notes: >-
      One row per route and stop (7,735 rows), so a stop two routes serve
      appears twice. TYPE BUS, MAX, SC (streetcar), CR (WES), AT (tram);
      FREQUENT is TriMet's Frequent Service flag.

  transit_routes:
    kind: arcgis
    label: Metro RLIS TriMet Bus System routes
    provides: transit
    url: https://services2.arcgis.com/McQ0OlIABe29rJJy/arcgis/rest/services/TriMet_Bus_System_routes/FeatureServer/0
    geometry: polyline
    fields: [RTE, DIR, RTE_DESC, TYPE, FREQUENT]
    serves: [or/multnomah, or/clackamas, or/washington]
    notes: >-
      178 route lines by direction; FREQUENT on 49. TriMet's Frequent Service
      (every 15 minutes or better most of the day) is narrower than the
      state's "four times an hour during peak service" (OAR 660-012-0440(3)),
      so it can only under-count a corridor the state rule reaches.

