  # --- terrain -------------------------------------------------------------

  dem_3dep:
    kind: tnm_dem
    label: USGS 3DEP 1 m DEM
    provides: terrain
    url: https://tnmaccess.nationalmap.gov/api/v1/products
    native_srid: 4326
    bbox_4326: [-123.20, 45.26, -122.24, 45.65]
    serves: [or/multnomah, or/clackamas, or/washington]
    notes: >-
      Per-lot slope. The bbox covers urban Multnomah plus the eight Clackamas
      urban cities down to Wilsonville and Tualatin at about 45.27 N, and
      from 2026-09-30 urban Washington County west to Forest Grove (-123.15). Two lidar
      projects overlap the area (OR_OLCMetro_2019, OR_PortlandMetro); newest
      tile wins per cell.
