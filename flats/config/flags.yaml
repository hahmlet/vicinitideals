    approved_on: null
    raised_from: [CLOSER_LOOK_SPLIT_ZONE]
  # --- Portland's overlays (flats/geom/pdx_overlays.py, FOLLOWUPS 109) ------
  PDX-MAIN-STREET-TRANSIT:
    description: "The townhouse form on a lot in Portland's Centers Main Street overlay (\"m\"): PCC 33.415.300.B bars \"Houses, attached houses, and duplexes\" within 100 ft of a transit street, and four homes each on its own lot are attached houses unless the lots come from a middle housing land division (33.910). No map of the city's transit streets is held, so every street is taken as one. The apartment form (a fourplex) is not barred."
    kind: categorical
    risk: possible
    severity: 5
    absorbs: null
    resolution: measurement
    scope: per_lot
    key: [lot]
    path: "Acquire the Transportation System Plan's transit street classes (Major Transit Priority, Transit Access, Community Transit) and measure 100 ft from them; or plat the four homes by a middle housing land division"
    priority: next
    status: pending
    approved_by: null
    approved_on: null
    raised_from: [PDX_MAIN_STREET_TRANSIT]
  PDX-MAIN-STREET-VEHICLE-AREA:
    description: "Portland's Centers Main Street overlay caps the frontage of any transit street used for vehicle areas (the driveway and the parking court): 30% in the Inner pattern area, 50% in the Eastern and Western (PCC 33.415.330.B). The drawn plan's lane and court face more than that of one of the lot's streets, or there is no drawing to measure; no map of transit streets is held, so every street was taken as one."
