    status: pending
    approved_by: null
    approved_on: null
    raised_from: [ZONE_REFERENCE_MISSING]
  ZONE-REFERENCE-CYCLE:
    description: "Two zones adopt each other's standards, so neither resolves"
    kind: categorical
    risk: possible
    severity: 8
    absorbs: null
    resolution: document_review
    scope: shared
    key: [jurisdiction, zone]
