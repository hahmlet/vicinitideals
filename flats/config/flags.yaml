# The flag type registry -- every kind of unknown a lot can carry.
# (flats/score/flags.py; Steph's flag plan, "Flag type (registry)".)
#
# A flag is an unknown. It has no colour: the colour comes from the rule set
# in colour.yaml. Every field below is required and checked on load.
#
# HUMAN-OWNED FIELDS: risk, severity, resolution, scope, priority. An agent
# proposes a type with its estimates filled in and `status: pending`; a
# pending type counts at its proposed values until Steph approves it, which
# sets status: approved, approved_by and approved_on.
#
#   kind        parametric (the instance carries low/high bounds) | categorical
#   risk        remote | unlikely | possible | likely | near_certain
#               (the number for each band is in colour.yaml)
#   severity    1-10: the chance the lot goes red if the answer goes against
#               us (10 = 100%). A lot may carry a LOWER one -- 0 where it
#               clears even at the flag's worst reading.
#   absorbs     the pod dimension that could absorb a bad answer, or null
#   resolution  external_inquiry | document_review | per_lot_review |
#               measurement (a map layer we acquire or a measure we take).
#               Steph 2026-10-03: measurement is THE PREFERRED way; the
#               other three are "the failure mode" -- propose them only
#               where no layer or measure could answer.
#   scope       shared (one answer, every lot with the key) | per_lot
#   key         what the resolution key is made of
#   priority    now | next | later | parked
#   raised_from the screen reason code(s) this type replaced
#
# Every value below was PROPOSED by an agent on 2026-10-02 from the screen's
# existing reason codes; none is approved yet.

