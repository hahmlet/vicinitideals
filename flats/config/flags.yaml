  PDX-COMMUNITY-DESIGN-STANDARDS:
    description: "The lot is in a Portland Conservation District, where a new building needs historic resource review or must meet the Community Design Standards, the clear and objective alternative (PCC 33.445.210.D, 33.445.500, 33.218). Those standards place the building and its parking -- the front setback between the neighbours' and never more than 25 ft (exactly 25 ft in Piedmont), the car in off an alley where there is one, no parking in the front setback -- and none of it is measured."
