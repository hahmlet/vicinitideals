  DRIVEWAY-SECOND-APPROACH:
    description: "The code asks one driveway approach for every two dwelling units (Oregon City 16.12.035.F, a requirement: Steph 2026-09-30), which is two for the four-unit pod, and the plan draws one shared drive; no second approach's width, spacing or offset is held to prove it fits (the bounds are the approaches the plan draws and the approaches the code asks)"
    kind: parametric
    risk: possible
    severity: 5
    absorbs: null
    resolution: measurement
    scope: per_lot
    key: [lot, design]
    path: "Draw a second approach on the lot's street frontage that meets the approach width, the 5 ft offset from the lot line and the spacing (FOLLOWUPS 25), or ask the city engineer whether one shared approach is accepted"
    priority: next
    status: pending
    approved_by: null
    approved_on: null
    raised_from: [CLOSER_LOOK_SECOND_APPROACH]
  DRIVEWAY-STATE-OVERRIDE:
    description: "The city's code asks one driveway approach for every N dwelling units (Oregon City 16.12.035.F: every two, which is two for the four-unit pod), and state law overrides it: a Large City may not scale a design standard, driveways included, by the number of dwelling units (OAR 660-046-0225(1)(c), 660-046-0020(4)), so the plan's one shared drive stands. A record of the city's rule, below the yellow line; it returns as DRIVEWAY-SECOND-APPROACH if the override is ever removed"
    kind: parametric
    risk: remote
    # Records the override, never holds a green: below the yellow line.
    severity: 1
    absorbs: null
    resolution: document_review
    scope: shared
    key: [jurisdiction]
    path: "Whether the city has filed alternative standards with the state (OAR 660-046-0235); none was found for Oregon City Ord. 22-1001"
    priority: later
    status: pending
    approved_by: null
    approved_on: null
    raised_from: [DRIVEWAY_STATE_OVERRIDE]
  RESOURCE-PERMIT:
    description: "Part of the lot is a mapped stream, wetland, habitat or flood area where the code lets a house go up only with a permit: a report, mitigation planting or a raised floor (FOLLOWUPS 42)"
    kind: categorical
    risk: possible
    severity: 5
    absorbs: null
    resolution: per_lot_review
    scope: per_lot
    key: [lot, fact]
    path: "Read the city's resource or flood chapter against where the area lies on the lot; price the permit and any mitigation"
    priority: next
    status: pending
    approved_by: null
    approved_on: null
    raised_from: [CLOSER_LOOK_RESOURCE]
  REVIEW-CONDITIONS:
    description: "The pod is taken here only through a review whose standards are clear and measurable but whose decider may add conditions, or whose criteria also weigh judgement words (\"compatible\", \"character\"). The fact says which: `conditions` or `judgement` (the zone's review, named in the citation), or, in Washington County, `buildable_area` (the lot is past the quick Type I review's size limit and four homes miss the district's minimum density) or `standard_plat` (the Type I path needs a lot made by a standard subdivision or partition plat, which nothing here holds), either of which leaves the Type II review, on which the county may add conditions (CDC 207-5). Steph 2026-10-14: \"If it's otherwise clear and measurable, but there is a 'may add conditions', yellow.\" Never red, never green."
    kind: categorical
    risk: possible
    severity: 5
    absorbs: null
    resolution: external_inquiry
    scope: per_lot
    key: [lot, design, fact]
    path: "Ask the city or county what conditions the review would put on four homes here, or apply. In Washington County, where the fact is the plat, the county's plat records may show the lot came from a standard subdivision or partition, which keeps it on the Type I path"
    priority: next
    status: pending
    approved_by: null
    approved_on: null
    raised_from: [CLOSER_LOOK_REVIEW_CONDITIONS]
  CLEAR-OBJECTIVE:
    description: "State law voids the judgement test; the city may refuse at first and an appeal may be needed. The pod's path here was a conditional use, a review decided on judgement words, or a review that may add conditions -- the fact says which (`conditional_use`, `judgement_review`, `conditions`, `judgement`, or Washington County's `buildable_area` / `standard_plat`). ORS 197A.400 lets a city or county apply only clear and objective standards to housing inside an urban growth boundary (East Park v. Salem, LUBA 2022), so the lot is judged on its measured standards alone, and any condition the review adds must itself be clear and objective. Steph 2026-10-15 (FOLLOWUPS 85): GREEN with this flag. Not raised outside a UGB, in the statute's own exceptions (Portland's central city and Gateway, historic areas), for a use the code does not list, or where a measured standard is missed."
    kind: categorical
    risk: unlikely
    # Steph 2026-10-15: "the flag sits below the yellow line" -- severity 2,
    # so a lot otherwise GREEN stays GREEN with the flag beside it.
    severity: 2
    absorbs: null
    resolution: external_inquiry
    scope: per_lot
    key: [lot, design, fact]
    path: "Apply on the clear and objective standards, citing ORS 197A.400; if the city refuses on a judgement criterion, appeal to LUBA (East Park v. Salem)"
    priority: later
    status: pending
    approved_by: null
    approved_on: null
    raised_from: [CLEAR_OBJECTIVE]
  LAND-DIVISION:
    description: "Needs a land division into 4 unit lots. The pod clears this lot only as four townhouses, each home on its own lot; as one apartment building on the one lot it does not. The lot was screened against the zone's townhouse standards for each unit lot (area, width and frontage four times over along the street, the townhouse setbacks), so the colour stands once the division is approved. Steph 2026-10-15: \"'Townhomes' will have separate lots. If we build a 4 unit apartment building, they would not.\""
    kind: categorical
    risk: unlikely
    # Steph 2026-10-15: a low flag, severity below 3, so a lot GREEN as
    # townhouses stays GREEN with the flag beside it.
    severity: 2
    absorbs: null
    resolution: external_inquiry
    scope: per_lot
    key: [lot]
    path: "Apply for the land division (a subdivision, or a middle housing land division where the city offers one) creating four unit lots, with or before the building permit"
    priority: later
    status: pending
    approved_by: null
    approved_on: null
    raised_from: [TOWNHOUSE_PLAT]

