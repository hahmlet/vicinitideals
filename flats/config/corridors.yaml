# Corridors a code names by their streets rather than drawing on a map
# (flats/geom/corridor.py, NamedCorridor). Portland's corridors are maps the
# city publishes and live in pipeline.yaml (corridors_pdx,
# corridor_setbacks_pdx); these are read off the street network by name.
#
# Per lot of `zones` on a layer `serves` names:
#   true   a street lot line on one of `streets` (the street the line abuts,
#          read from the RLIS centrelines -- the same test as Portland's), or
#          the lot's land touches one of them, a corner included (within
#          TOUCH_REACH_FT, 75 ft, of the centreline: half a right-of-way);
#   false  the lot lies in no block of the zone (contiguous zoning area, from
#          the `blocks` dataset) that reaches a named street;
#   behind_frontage  a lot in a block that reaches the corridor whose own land
#          does not touch it. null = unanswered (the lot stays out of GREEN);
#          true or false once ruled -- no code change.
# Missing data (no street network, no blocks dataset in the snapshot, a named
# street the network does not carry) leaves every lot unanswered.

corridors:
  gresham_cmf:
    condition: civic_corridor
    serves: [or/multnomah/gresham]
    zones: [CMF]
    # GDC Table 4.0420 note 2 (4.0400.corridor.txt#L217) and Table 4.0430
    # note 14 (#L485): "the areas of CMF along the NE Glisan Street and NE
    # 162nd Avenue corridors". RLIS spells 162nd north of Burnside "NE"; SE
    # 162nd is not on the corridor. Steph 2026-10-20: "Yes, map it"
    # (rulings.yaml 2026-10-20-gresham-cmf-corridor-mapped).
    streets: [NE GLISAN ST, NE 162ND AVE]
    blocks: corridor_blocks_gresham
    zone_field: ZONE
    # Lots in a CMF block that reaches Glisan or 162nd whose own land does not
    # touch either (NE 183rd, lots behind the frontage, the NE Halsey strip
    # east of its 162nd corner lot). Steph 2026-10-21: "only lots actually
    # touching the street count as 'along'. If it touches, it's along."
    # (rulings.yaml 2026-10-20-gresham-cmf-corridor-mapped).
    behind_frontage: false

  rockwood_stark:
    condition: rockwood_stark_frontage
    serves: [or/multnomah/gresham]
    zones: [RTC]
    # GDC Table 4.0420 note 3 (4.0400.corridor.txt#L219-L222), the L3 limit
    # on a townhouse in the Rockwood Town Center: "all buildings on parcels
    # with at least 100 feet of frontage on Stark that are within 500 feet of
    # the center lines of the intersections of Stark and 181st or 187th
    # Avenues shall have non-residential uses at the ground floor frontages".
    # Read wider than the note (FOLLOWUPS 109 chunk 4, 2026-10-28): any RTC
    # lot touching SE Stark, whatever its frontage or distance from the
    # intersections, so the fact can only keep a lot closed.
    streets: [SE STARK ST]
    blocks: corridor_blocks_gresham
    zone_field: ZONE
    # An RTC lot in a block that reaches Stark whose own land does not touch
    # it has no frontage on Stark at all, so note 3 cannot reach it.
    behind_frontage: false
