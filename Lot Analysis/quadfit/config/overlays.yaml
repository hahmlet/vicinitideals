    action: kill
    jurisdictions: [milwaukie]
    citation: "MMC 19.401.3 — 'All land use actions and any change or intensification of use, or development permitted in the underlying zone, are conditional uses, subject to the provisions of Section 19.905'; 19.401.5.D requires a greenway conditional use for all development; 19.401.5.B's thirteen exemptions from Greenway review do not include a new dwelling; 19.401.4 defines 'develop' as 'to construct or alter a structure'"
    confidence: verified
    coverage:
      milwaukie: {grade: A, note: "WG boundary from the city's own Zoning Map service, which is where 19.401.2 says it lives; 2 polygons along the Willamette. Killed rather than flagged because a conditional use is discretionary and this screen only reports what can be built by right"}
  - key: milwaukie_hca
    name: "Milwaukie Habitat Conservation Area (NR Map)"
    action: flag
    jurisdictions: [milwaukie]
    citation: "MMC 19.402.5.A prohibits new structures and development within a WQR or HCA 'other than those allowed by Section 19.402'; Table 19.402.3.K routes activities within an HCA meeting the nondiscretionary standards of 19.402.11.D to Type I review; 19.402.11.D.2 sets mitigation planting by disturbance area; 19.402.3.C adopts the NR Map by reference"
    confidence: verified
    coverage:
      milwaukie: {grade: A, note: "adopted NR Map HCA layer, 1 multipart polygon, published with a Link attribute pointing at ecode360 19.402. Under-flags: 19.402.3.A reaches 100 ft beyond the resource and this fires on touch"}
  - key: milwaukie_wqr
