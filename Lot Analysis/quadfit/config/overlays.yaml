    action: flag
    jurisdictions: [milwaukie]
    citation: "MMC 19.402.3.A applies Section 19.402 to properties containing 'any locally significant Goal 5 wetlands or habitat areas identified by the City of Milwaukie'; 19.402.3.D.2 designates significant Goal 5 wetlands as HCAs"
    confidence: needs_verification
    coverage:
      milwaukie: {grade: B, note: "26 polygons across ten SOURCE values (MILWAUKIE, GOAL 5, NWI, ESA, TRIMET, NCPRD, PHS, GIVENS, blank, null). Only the Goal 5 subset is adopted into the NR Map as HCA; the rest are consultant and federal delineations the code never adopted. Kept whole because a surveyed wetland carries DSL removal-fill jurisdiction regardless of who paid for the survey. Over-flags"}

