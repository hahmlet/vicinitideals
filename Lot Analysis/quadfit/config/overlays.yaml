    action: flag
    jurisdictions: [milwaukie]
    citation: "MMC 19.402.3.D.1 — water quality resources 'include protected water features and their associated vegetated corridors'; 19.402.5.A prohibits new development within a WQR other than as allowed by Section 19.402; Table 19.402.3.K routes 'limited WQR disturbance for new dwelling units' under 19.402.6.B to Type I review"
    confidence: verified
    coverage:
      milwaukie: {grade: A, note: "61 vegetated-corridor polygons off the NR Map. 19.402.3.D.1 calls the map 'a general indicator ... the specific location of vegetated corridors must be determined in the field', which is the flag's justification in the city's own words. Over-flags piped reaches, which 19.402.3.I exempts and this layer does not separate"}
