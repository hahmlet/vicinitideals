    # Municode current through Ord. 899 (6-24-2025); the city-hosted PDF is a
    # superseded 2022 hearing draft.
    orientation_constraint: entrance_only
    # Lot depth, TDC 1.020: "The horizontal distance measured midway between
    # the front and rear lot lines."
    #   or/multnomah/troutdale/1.020.definitions.txt#L528
    # Front lot line, TDC 1.020: "Front lot lines on corner lots may face
    # either street".
    #   or/multnomah/troutdale/1.020.definitions.txt#L548
    # Not encoded, and deliberately: the same entry makes a continuously
    # curved corner frontage the front lot line and leaves such a lot with no
    # rear property line at all. `mid_width` needs no rear so it measures
    # them anyway; the case is flagged here rather than silently handled.
    lot_depth_measure: mid_width
    front_lot_line_rule: applicant_choice
    # Lot width, TDC 1.020: "the horizontal distance between the side lot
    # lines, measured at right angles to the lot depth at a point midway
