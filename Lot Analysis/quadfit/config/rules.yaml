    # from, one or more lots"; the front lot line is "any boundary line
    # separating a lot from a County, public, state, or private road, or
    # from an access drive". ZDO 845.03 then says it outright, "a front lot
    # line that separates the lot from an improved alley". So an alley edge
    # keeps its street classification in the county: it is frontage, it is
    # a candidate front, and it takes the front setback. Every city in the
    # corpus that defines the term reads the other way; see the
    # `alley_is_street` field in common.py for the list.
    #   or/clackamas/_unincorporated/zdo.202.definitions.txt#L283
    #   or/clackamas/_unincorporated/zdo.202.definitions.txt#L445
