    # optional sustainable-design menu item. Design districts (DRL/CMF) carry a
    # per-zone axis_required override via 7.0420(J) frontage-occupancy + max
    # front setback.
    orientation_constraint: entrance_only
    zones:
      # No lot-coverage percentage caps on quadplexes anywhere in Gresham; the
      # envelope controls are FAR (never binds a 1,000 sf building) and the 15%
      # private-open-space minimum (7.0420(D)) — not modeled, noted as blind
      # spot. min_lot values are the zone minimum lot size (same as SFD).
      - zone: LDR-5
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 5
        setback_rear_ft: 15
        setback_street_side_ft: 10
        min_lot_sqft: 5000
        source: "Gresham Development Code Tables 4.0120/4.0130/4.0131; 7.0420"
        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf"
        confidence: verified
        notes: "Quadplex P outright. Rear w/ alley 8 ft (not modeled). FAR 1.0. Height 35 ft."
      - zone: LDR-7
        quadplex_allowed: true
        setback_front_ft: 10
