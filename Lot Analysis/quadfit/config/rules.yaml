    # Lot depth, WC 4.001: "The lot depth is the mean average distance between
    # the front lot line and rear lot line of a lot measured within the lot
    # boundaries."
    #   or/clackamas/wilsonville/4.planning.txt#L801
    # Front lot line, WC 4.001 item 161: on a corner lot "the shortest lot line
    # along a tract with a pathway, street, or private drive is the front lot
    # line."  Item 121 states a DIFFERENT rule and opens "For purposes of the
    # solar access regulations" -- scoped to them, and not this.
    #   or/clackamas/wilsonville/4.planning.txt#L804
