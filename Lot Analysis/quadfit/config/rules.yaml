    eligible: true
    juris_city_codes: [TUALATIN]
    zoning_layer: zoning_tualatin
    zone_field: PLANDIST.CZONE
    orientation_constraint: entrance_only
    # Lot width, TDC 31.060: "at the center of the lot", parallel to the
    # front lot line. Same shape as Oregon City -- the number is a width,
    # not a street edge -- and not the same measurement, because 31.060
    # draws its line parallel to the street and 17.04.700 draws it between
