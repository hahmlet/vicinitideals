        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1300.pdf"
        confidence: verified
        notes: "Quadplexes explicitly prohibited in Gresham Butte overlay (hillside/fire risk); duplex max."
      - zone: THR-SW
        quadplex_allowed: false
        source: "Gresham Development Code Table 4.1507 (Springwater)"
        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1500.pdf"
        confidence: verified
        notes: "Quadplex NP and detached SFD also NP — OAR mandate does not attach (townhouse/cottage-cluster zone)."

  troutdale:
    eligible: true
    juris_city_codes: [TROUTDALE]
    zoning_layer: zoning_troutdale
    zone_field: zonecode
