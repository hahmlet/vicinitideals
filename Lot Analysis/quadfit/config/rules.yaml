        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf"
        confidence: verified
        notes: "Min lot 7,000 sf. FAR 0.7 (tightest in city; still >1,000 sf building on min lot)."
      - zone: TLDR
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 5
        setback_rear_ft: 15
        setback_street_side_ft: 10
        source: "Gresham Development Code Tables 4.0120/4.0130/4.0131; 7.0420"
        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf"
        confidence: verified
        notes: "NO minimum lot size, no FAR, no max density — most permissive LDR-family zone."
      - zone: TR
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 5
        setback_rear_ft: 15
        setback_street_side_ft: 10
        min_lot_sqft: 4000
        source: "Gresham Development Code Tables 4.0120/4.0130/4.0131; 7.0420"
        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf"
        confidence: verified
        notes: "Min lot 4,000 sf. FAR 1.0."
      - zone: LDR-PV
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 5
        setback_rear_ft: 10
        setback_street_side_ft: 10
        min_lot_sqft: 5000
        source: "Gresham Development Code Tables 4.1413/4.1415A/4.1415B (Pleasant Valley); 7.0420"
        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1400.pdf"
        confidence: verified
        notes: "Pleasant Valley plan district. Rear 10 ft (vs 15 in base LDR)."
      - zone: LDR-SW
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 5
        setback_rear_ft: 15
        setback_street_side_ft: 10
        min_lot_sqft: 5000
        source: "Gresham Development Code Tables 4.1507/4.1508 (Springwater); 7.0420"
        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.1500.pdf"
        confidence: verified
        notes: "Springwater. Min lot width 45 ft, min depth 80 ft (not separately modeled — envelope test dominates)."
      - zone: MDR-12
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 10
        setback_rear_ft: 15
        setback_street_side_ft: 20
        min_lot_sqft: 3600
        source: "Gresham Development Code Tables 4.0120/4.0130/4.0131; 7.0420"
        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf"
        confidence: verified
        notes: "Interior side 10 ft; street-side wall 20 ft (corner lots modeled at max(F, street-side))."
      - zone: MDR-24
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 10
        setback_rear_ft: 15
        setback_street_side_ft: 20
        min_lot_sqft: 11000
        source: "Gresham Development Code Tables 4.0120/4.0130 n.5/4.0131; Sec 3.0103"
        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf"
        confidence: verified
        notes: "SFD is NP — quadplex permitted natively. Min lot is Table 4.0130's stated 11,000 sq ft minimum SITE size for MDR-24. This file carried 7,200, which was never a standard the code prints -- it was four units divided by the 24.2 units-per-acre maximum density, and the old note called it an approximation. The corpus retired that arithmetic on 2026-08-16 and this follows it. Both density tests still pass at 11,000: four units is 15.8 per acre, under the 24.2 ceiling and over the 12.1 floor. Table note 2 does let a Lot of Record smaller than the minimum LOT size build anyway, but it is written against section B (which reads None here), not against the section A site minimum, and nothing in the screen selects for a lot of record."
      - zone: DRL-1
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 5
        setback_rear_ft: 10
        setback_street_side_ft: 10
