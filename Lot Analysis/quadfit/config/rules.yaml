        confidence: needs_verification
        notes: "Quadplex permitted OUTRIGHT. Detached SFD NOT outright - only within a flexible-lot subdivision (TDC 36.410). Coverage: quadplex 60%. Min lot/width (3,000 sf / 26 ft) apply to flexible-lot subdivision only - verify base quadplex min lot before relying."
