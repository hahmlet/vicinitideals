        setback_rear_ft: 15
        setback_street_side_ft: 5
        min_lot_sqft: 10000
        min_frontage_ft: 100
        orientation_constraint: axis_required
        source: "Gresham Development Code Tables 4.0420/4.0430 (Corridor); 7.0420(J)"
        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0400.pdf"
        confidence: verified
        notes: "Base CMF regime: residential needs 10,000 sf min AND 100 ft street frontage; max front setback 20 ft + frontage occupancy — axis_required. NE Glisan/162nd corridors follow TLDR standards instead (Table 4.0430 n.14) — NOT split out; base regime applied everywhere = conservative."
      - zone: "LDR/GB"
        quadplex_allowed: false
