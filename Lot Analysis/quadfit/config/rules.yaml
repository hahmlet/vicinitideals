  gresham:
    eligible: true
    juris_city_codes: [GRESHAM]
    zoning_layer: zoning_gresham
    zone_field: ZONE
    # GDC 7.0420(A) binds entrance placement only; the E-W long-axis rule is an
    # optional sustainable-design menu item. Design districts (DRL/CMF) carry a
    # per-zone axis_required override via 7.0420(J) frontage-occupancy + max
    # front setback.
    orientation_constraint: entrance_only
    # Lot depth, GDC 3.0100: "The perpendicular distance measured from the
    # mid-point of the front lot lines to the mid-point of the opposite,
    # usually the rear, lot line."
    #   or/multnomah/gresham/3.0100.definitions.txt#L1328
    # Front lot line, GDC 3.0100 -- the city describes this module's own
    # selection rule: "For a corner lot where there is no existing building,
    # the front lot line is determined by the orientation necessary to achieve
    # minimum required lot depth. If lot depth may be met in both directions,
    # then the applicant may determine which lot line is the front lot line."
    #   or/multnomah/gresham/3.0100.definitions.txt#L1332
    lot_depth_measure: midpoints
    front_lot_line_rule: applicant_choice
    # Lot width, taken AT THE BUILDING LINE and not between the side
    # midpoints, and the reason is worth a paragraph because the glossary
    # reads the other way. GDC 3.0100 defines Lot Width as "the
    # perpendicular distance measured between the mid-points of the two
    # principal opposite side lot lines" (#L1367). But every table that
    # states the standard -- 4.0130 E, downtown's 4.1130, Springwater's
    # 4.1508 D -- heads its row "Width at building line", and 3.0100
    # defines Building Line as "a line parallel to the front lot line and
    # passing through the most forward point or plane of a building"
    # (#L665). The table is the specific statement about where THIS number
    # is taken; on a vacant lot the most forward legal building line is the
    # front setback, the same line Milwaukie measures at. The two forms
    # agree on a rectangle and on a wedge the table's line is the stricter.
    #   or/multnomah/gresham/4.0100.residential.txt#L272
    #   or/multnomah/gresham/3.0100.definitions.txt#L665
    lot_width_measure: building_line
    zones:
      # No lot-coverage percentage caps on quadplexes anywhere in Gresham; the
      # envelope controls are FAR (never binds a 1,000 sf building) and the 15%
      # private-open-space minimum (7.0420(D)) — not modeled, noted as blind
      # spot. min_lot values are the zone minimum lot size (same as SFD).
      # Street frontage, Table 4.0130 G.1 "Minimum Street Frontage: Interior
      # lots", the "All other uses" row -- townhouses have their own row at
      # 16, and a townhouse is a unit-lot building. Corner lots owe 40 in every
      # district under G.2, and that is not carried: s4's `frontage_ft` is the
      # SUM of a lot's street edges, so a corner lot reads long, and holding
      # the interior number against that sum fails only a lot whose street
      # edges TOGETHER fall short of it. Every red it makes is a true one; the
      # corner lots it lets through are the lenient direction. Note 9 lets an
      # applicant in LDR-7, LDR-5, TR and TLDR ask for a reduction under
      # 10.1520 -- an option to ask is not a standard. Blank in all ten
      # districts until 2026-09-11, when the mirror's unfilled-cell ledger
      # asked why; the downtown, Pleasant Valley and Springwater tables state
      # the same row and are cited on their zones.
      #   or/multnomah/gresham/4.0100.residential.txt#L312-L314,L383
      - zone: LDR-5
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 5
        setback_rear_ft: 15
        # Table 4.0131, the quadplex row: "Rear No Alley" 15 ft, "Rear With Alley" 8
        # ft. The lot line abutting an alley is a rear lot line (3.0100), and
        # 7.0420(B)(1) sends the driveway to it; s5 cuts the envelope to this number
        # on a class-A edge (`effective_setback_alley_ft`).
        #   or/multnomah/gresham/4.0100.residential.txt#L393-L397,L399-L400
        setback_alley_ft: 8
        # 7.0420(G)(1) applies to VLDR-SW, LDR-SW, LDR-PV, LDR-7, LDR-5 and TR:
        # the roof may be 21 ft at the rear setback line and rises a foot for
        # every foot further back. The 15 ft above is what Table 4.0130 prints;
        # a 26 ft pod stands at 20. Derived, not typed — see common.StepBack.
        step_back_rear: {height_ft: 21, rise_per_ft: 1, cite: "Gresham Development Code 7.0420(G)(1) — max roof height 21 ft at the rear setback line, rising 1 ft per 1 ft further back"}
        setback_street_side_ft: 10
        min_lot_sqft: 5000
        min_frontage_ft: 35  # or/multnomah/gresham/4.0100.residential.txt#L314
        min_lot_depth_ft: 70
        # Table 4.0130 E.1 "Width at building line: Interior lot", on the "Duplex, Triplex,
        # Quadplex, and Cottage Cluster" row. The corner-lot line (E.2) asks more and is a
        # site fact this file has no slot for -- interior figure carried, same as every
        # other corner row here.
        #   or/multnomah/gresham/4.0100.residential.txt#L274
        min_lot_width_ft: 35
        min_density_du_per_acre: 6.22  # per NET developable area; the lot's gross area bounds it
        source: "Gresham Development Code Tables 4.0120/4.0130/4.0131; 7.0420"
        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf"
        confidence: verified
        notes: "Quadplex P outright. Rear w/ alley 8 ft (setback_alley_ft, 2026-09-12). FAR 1.0. Height 35 ft."
