      # one it can honestly use. Where the corpus states no minimum lot area,
      # no frontage minimum or no coverage cap, the field is OMITTED rather
      # than invented -- silence in the code is silence here.
      #
      # All are `needs_verification`, which is not a hedge: s7 routes an
