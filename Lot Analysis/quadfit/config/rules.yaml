# Quadfit rules table — per (jurisdiction, zone) middle-housing siting rules.
#
# Compiled from municipal codes; every numeric row carries a source citation and
# a confidence flag. `needs_verification` rows are preliminary values and MUST
# be verified against the adopted code text before the final run (Phase 5).
# Schema: Lot Analysis/quadfit/common.py (RulesConfig).
#
# Legal frame: OAR 660-046-0205 — Large Cities and county urban unincorporated
# areas inside the Metro UGB must allow quadplexes in residential zones that
# allow detached single-family dwellings. OAR 660-046-0235 caps middle-housing
# siting standards (incl. setbacks) at what applies to detached single-family in
# the same zone. Metro membership (any city over 1,000 pop inside Metro) is the
# decisive hinge and overrides the 25k population threshold.
#   Multnomah jurisdictions: Portland, Gresham, Troutdale, Fairview,
#     Wood Village, + multnomah_unincorporated.
#   Clackamas jurisdictions: Oregon City, Happy Valley, West Linn, Tualatin,
#     Milwaukie, Gladstone, Wilsonville, + clackamas_unincorporated (ZDO-282).
# Exempt (eligible:false): Maywood Park, Rivergrove, Johnson City (pop <=1,000);
# Lake Oswego (owner decision). Rural land outside the UGB is exempt.
#
# min_lot_sqft caveat: values are the adopted code text. Substandard existing
# lots of record may still carry quadplex rights under OAR 660-046-0205 (a lot
# that allows a detached house must allow a quadplex); the funnel counts these
# drops separately (lot_below_zone_min_area) so the effect is visible.

meta:
  compiled_at: "2026-07-24"
  clackamas_added: "2026-07-28"
  note: >
    Portland and Gresham rows verified against current code text by research
    agents 2026-07-24. Multi-dwelling zones (Portland RM*, Gresham MDR-PV/
    HDR-PV/VLDR-SW, etc.) are out of scope — the analysis covers the
    single-dwelling zones subject to the OAR 660-046 quadplex mandate plus
    zones where the code itself permits quadplexes outright.
    Clackamas County jurisdictions added 2026-07-28 (7 eligible cities +
    unincorporated county via ZDO-282). City zone tables verified from adopted
    codes / city GIS; clackamas_unincorporated setbacks/coverage are the adopted
    ZDO Section 315 figures (Tables 315-2/315-3, amended 9/9/2024, extracted from
    the source PDF). Only VR-4/5's quadplex-by-right allowance remains
    needs_verification.

defaults:
  street_threshold_ft: 50
  sliver_min_lot_sqft: 1000
  grid_resolution_ft: 0.5
  simplify_tolerance_ft: 1.5

jurisdictions:
  portland:
    eligible: true
    juris_city_codes: [PORTLAND]
    zoning_layer: zoning_portland
    zone_field: ZONE
    strip_lowercase_suffix: true # R5a → R5 (overlay letters)
    # PCC 33.110.230.C binds main-entrance placement only (face street or
    # within 45°) — no long-axis constraint. Corner lots: the SHORTEST street
    # line is the front; the longer street side takes only the ordinary side
    # setback, so no street-side elevation needed.
    orientation_constraint: entrance_only
    # Lot depth, PCC 33.930.103: "Lot depths are measured from the midpoints
    # of opposite lot lines."
    #   or/multnomah/portland/33.930.txt#L384
    # Front lot line, PCC 33.910: "On a corner lot, the front lot line is the
    # shortest of the lot lines that abut a street."
    #   or/multnomah/portland/33.910.definitions.txt#L754
    lot_depth_measure: midpoints
    front_lot_line_rule: narrowest
    # Lot width, PCC 33.930.100.B -- every zone but the single-dwelling
    # ones: "measured from the midpoints of opposite lot lines". Only the
    # RM zones state a width; the single-dwelling zones' rectangle test
    # (33.930.100.A) is a form lotdims.py holds and no zone here yet asks
    # for.
    #   or/multnomah/portland/33.930.txt#L367-L368
    lot_width_measure: side_midpoints
    zones:
      # Citywide building-coverage formula (Table 110-5), all residential
      # zones: <3,000 sf lot -> 50%; 3,000-4,999 -> 1,500 + 37.5% over 3,000;
      # 5,000-19,999 -> 2,250 + 15% over 5,000; >=20,000 -> 4,500 + 7.5% over.
      # Opened 2026-09-30 by the state middle housing law (FOLLOWUPS 21(b),
      # Steph chose A): PCC still refuses the fourplex here, the corpus reads
      # it as allowed only through the `state_middle_housing` relief, so the
      # row is measured and capped at review, never green.
      - zone: RF
        quadplex_allowed: true
        setback_front_ft: 20
        setback_side_ft: 10
        setback_rear_ft: 10
        #   or/multnomah/portland/33.110.txt#L746-L747
        setback_alley_ft: 0
        # Table 610-2, "All other lots", RF: the house's minimum, which the
        # state rule caps the quadplex's at.
        #   or/multnomah/portland/33.610.txt#L162-L168
        min_lot_sqft: 52000
        coverage_curve: [[0, 0, 50], [3000, 1500, 37.5], [5000, 2250, 15], [20000, 4500, 7.5]]
        source: "PCC 33.110.200 Table 110-2 (fourplex prohibited in RF); 33.610 Table 610-2; ORS 197A.420 / OAR 660-046 (state middle housing path)"
        source_url: "https://www.portland.gov/sites/default/files/code/110-sd-zone_2.pdf"
        confidence: needs_verification
        notes: "The city's code allows only a house/ADU/manufactured home/houseboat/congregate here. Measured since 2026-09-30 because the state middle housing law requires a quadplex wherever a detached house is allowed in a city this size; FLATS reads that as a discretionary relief (yellow at best). needs_verification caps every lot at review."
      - zone: R20
        quadplex_allowed: true
        setback_front_ft: 20
        setback_side_ft: 10
        setback_rear_ft: 10
        # PCC 33.110.220.D.9: "No side, rear, or garage entrance setback is
        # required from a lot line abutting an alley." The alley edge (s4 class
        # A) is otherwise a rear lot line and takes setback_rear_ft.
        #   or/multnomah/portland/33.110.txt#L746-L747
        setback_alley_ft: 0
        min_lot_sqft: 12000
        coverage_curve: [[0, 0, 50], [3000, 1500, 37.5], [5000, 2250, 15], [20000, 4500, 7.5]]
        source: "PCC 33.110 Tables 110-2/110-4/110-5/110-7; 33.110.265.E"
        source_url: "https://www.portland.gov/sites/default/files/code/110-sd-zone_2.pdf"
        confidence: verified
        notes: "Fourplex min lot 12,000 sf (Table 110-7; -10% adjustment allowed until 2032). No FAR cap on conforming lots (FAR applies only <10,000 sf in R20). Height 30 ft."
      - zone: R10
        quadplex_allowed: true
        setback_front_ft: 20
        setback_side_ft: 10
        setback_rear_ft: 10
        # PCC 33.110.220.D.9: "No side, rear, or garage entrance setback is
