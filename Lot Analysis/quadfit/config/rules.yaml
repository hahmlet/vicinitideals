  milwaukie:
    eligible: true
    juris_city_codes: [MILWAUKIE]
    zoning_layer: zoning_milwaukie
    zone_field: ZONE
    # Lot depth, MMC 19.200: "the average horizontal distance between the
    # front lot line and the rear lot line."  Averaged, so it is sampled
    # across the frontage rather than taken on one line.
    #   or/clackamas/milwaukie/19.200.definitions.txt#L462
    # Front lot line, MMC 19.200: on a corner lot "a line separating the lot
    # from the street on which the existing or contemplated development will
    # face" -- the applicant chooses.
    #   or/clackamas/milwaukie/19.200.definitions.txt#L469
    lot_depth_measure: average
    front_lot_line_rule: applicant_choice
    # Lot width, MMC 19.200: "the horizontal distance between side lot
    # lines measured at the Building line" -- at the front setback, not
    # the kerb. Checked against an independent implementation on 4,212
    # parcels (lotdims.py records the run).
    #   or/clackamas/milwaukie/19.200.definitions.txt#L483
    lot_width_measure: building_line
    zones:
      - zone: R-MD
        # Table 19.301.4 is one zone in four columns of LOT AREA. A 3,000-6,999
        # sq ft lot gets 35% coverage and a 15 ft street side yard; only a lot
        # of 7,000 and up gets the 30% and 20 ft this row used to carry alone.
        # The 1,500-2,999 column is real and unreachable -- 19.301.4 sets the
        # R-MD minimum lot at 3,000 unless the plat is unit lots, which is not
        # how this pod is built -- so it is deliberately not mirrored.
        quadplex_allowed: true
        setback_front_ft: 20
        setback_side_ft: 5
        # The table prints 5 ft and four rows below prints a side yard height
        # plane: 20 ft of height at the minimum side yard, sloping up at 45
        # degrees. MMC 19.200 puts the plane's start "horizontally offset from
        # the side lot line by the required side yard depth" — at the yard, not
        # at the lot line — so a 26 ft wall stands at 11 ft. 19.501.3's two
        # exceptions are chimneys and 30-inch eaves; neither is a wall.
        step_back_side: {height_ft: 20, slope_degrees: 45, cite: "MMC Table 19.301.4, Side yard height plane limit"}
        setback_rear_ft: 20
        setback_street_side_ft: 15
        min_lot_sqft: 3000
        # Table 19.301.4 row B.3.b, "Standard lot", four columns of LOT AREA:
        # 35 / 30 / 35 / 35 -- the one row in the table that is not monotonic,
        # so the 30 at 3,000-4,999 sq ft is the scalar (the smallest reachable
        # column; 1,500-2,999 is below the zone's own minimum lot) and 35 from
        # 5,000 is the band. The townhouse row (20) is a unit-lot figure; the
        # flag-lot rows (25) are relaxations nothing here can see. This was the
        # blank audit_zone_mirror.py carried as prose for a day before the
        # unfilled-cell ledger existed to hold it.
        #   or/clackamas/milwaukie/19.300.base-zones.txt#L151,L154-L158
        min_frontage_ft: 30
        min_lot_depth_ft: 80
        # Table 19.301.4 row B.1, four columns of LOT AREA: 30 ft at
        # 3,000-4,999 sq ft, 50 at 5,000-6,999, 60 at 7,000 and up. The
        # 1,500-2,999 column (20 ft) is below the zone's own minimum lot and
        # is not mirrored, exactly as the coverage band above it is not. The
        # scalar is the smallest reachable column; the band steps it up.
        #   or/clackamas/milwaukie/19.300.base-zones.txt#L142-L145
        min_lot_width_ft: 30
        max_coverage_pct: 35
        lot_size_bands:
          setback_street_side_ft: [[7000, 20]]
          max_coverage_pct: [[7000, 30]]
          min_lot_width_ft: [[5000, 50], [7000, 60]]
          min_frontage_ft: [[5000, 35]]
        source: "MMC 19.301 Moderate Density Residential, Table 19.301.4; use table 19.301.2"
        source_url: "https://ecode360.com/43860500"
        confidence: verified
        notes: "Milwaukie consolidated former R-5/R-7/R-10 SF zones into R-MD; this is the by-right quadplex zone. Table 19.301.4 is four columns of lot area and this row now carries the band: a 3,000-6,999 sf lot gets 35% coverage and a 15 ft corner street side, a lot of 7,000 and up gets 30% and 20 ft. Side yard 5 ft + 10 ft (asymmetric); height 35 ft. The 1,500-2,999 column is unreachable at a 3,000 sf minimum lot. Min lot 3,000 sf: Table 19.301.4 bands permitted dwelling type by lot size and the quadplex starts at the 3,000-4,999 band, not the 5,000 this file carried. Middle housing allowed on any SFD lot (density cap waived)."
      - zone: R-HD
        quadplex_allowed: true
        setback_front_ft: 20
        setback_side_ft: 5
        # The table prints 5 ft and four rows below prints a side yard height
        # plane: 25 ft of height at the minimum side yard, sloping up at 45
        # degrees. MMC 19.200 puts the plane's start "horizontally offset from
        # the side lot line by the required side yard depth" — at the yard, not
        # at the lot line — so a 26 ft wall stands at 6 ft. 19.501.3's two
        # exceptions are chimneys and 30-inch eaves; neither is a wall.
        step_back_side: {height_ft: 25, slope_degrees: 45, cite: "MMC Table 19.302.4, Side yard height plane limit"}
        setback_rear_ft: 15
        # Table 19.302.4, street side yard: 15 (5 on a unit lot, not this
        # building). Front is 20, so on a corner lot s5 already holds every
        # street edge to 20 and this changes no envelope; carried so the row
        # is not blank against a code that states it.
        #   or/clackamas/milwaukie/19.300.base-zones.txt#L497
        setback_street_side_ft: 15
        min_lot_sqft: 3000
        # Table 19.302.4 A, minimum street frontage, standard lot: 35 (townhouse
        # 20, a unit-lot figure).
        #   or/clackamas/milwaukie/19.300.base-zones.txt#L488,L490
        min_frontage_ft: 35
        min_lot_depth_ft: 70
        # Table 19.302.4, minimum lot width.
        #   or/clackamas/milwaukie/19.300.base-zones.txt#L486
        min_lot_width_ft: 20
        max_coverage_pct: 50
        source: "MMC 19.302 High Density Residential, Table 19.302.4"
        source_url: "https://ecode360.com/43860500"
        confidence: needs_verification
        notes: "Multi-dwelling zone (min density 25 units/acre) — apartments allowed outright, so quadplex trivially permitted. Verified: side 5 ft (0 for townhouse common wall), coverage 50%, height 45 ft. The front, rear and minimum lot were all wrong and are now Table 19.302.4's own rows: front 20 (the 5 ft this file carried applies only to properties mapped in Fig 19.302.4), rear 15 (20 was an admitted assumption), and minimum lot 3,000 -- the table floor is 1,500 for a townhouse and the chapter permits a quadplex from 3,000 up, while the 5,000 this file carried is the 'all other uses' line."
      # ported 2026-10-08 (zone gaps, FOLLOWUPS 52a) by port_from_flats.zone_row: Milwaukie GMU/DMU: pod allowed only on the unit-lots path (DMU also only inside the mapped area), encoded 2026-10-08; ported so the pod is measured. FLATS keeps the verdict.
      - zone: "GMU"
