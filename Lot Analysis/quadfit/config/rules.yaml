    # street-facing wall, face street/<=45 deg) — no long-axis rule. Source:
    # Municode current through Ord. 899 (6-24-2025); the city-hosted PDF is a
    # superseded 2022 hearing draft.
    orientation_constraint: entrance_only
    zones:
      # TDC 8.120.B.1.b declares lot-coverage standards INVALID for tri/quad-
      # plexes — no coverage caps. Min street frontage 20 ft everywhere.
      # Street-side setback 10 ft (20 if street-side driveway — not modeled).
      # Hard cap 4 units/lot INCLUDING ADUs (8.120.B.2).
      - zone: LDR-1
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 10
        setback_rear_ft: 10
        setback_street_side_ft: 10
        min_lot_sqft: 10000
        min_frontage_ft: 20
        source: "Troutdale Development Code 3.120, 3.130.B, 8.120 (Municode, through Ord. 899)"
        source_url: "https://library.municode.com/or/troutdale/codes/development_code?nodeId=CH3ZODI"
        confidence: verified
        notes: "Quadplex-specific setbacks (SFD is 20 front / 15-20 rear). Min lot 10,000 sf, min width 70 ft. Height 35 ft."
      - zone: LDR-2
        quadplex_allowed: true
        setback_front_ft: 10
