      - zone: MDR
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 5
        setback_rear_ft: 10
        setback_street_side_ft: 10
        min_lot_sqft: 5000
        min_frontage_ft: 20
        source: "Troutdale Development Code 3.120, 3.130.B, 8.120 (Municode, through Ord. 899)"
        source_url: "https://library.municode.com/or/troutdale/codes/development_code?nodeId=CH3ZODI"
        confidence: verified
        notes: "ADOPTED min lot 5,000 sf / width 50 (2022 hearing-draft PDF says 4,000/40 — superseded). Town Center frontage 16 ft not split out."
      - zone: HDR
        quadplex_allowed: false
        source: "Troutdale Development Code 3.120 (Quadplex = N in HDR)"
        source_url: "https://library.municode.com/or/troutdale/codes/development_code?nodeId=CH3ZODI"
        confidence: verified
        notes: "Multifamily/townhouse zone — no detached SFD, no quadplex; OAR mandate does not attach. Inside the Town Center overlay quadplex IS permitted, but the GIS zonecode does not distinguish HDR-TC — treated as excluded (conservative; 369 lots)."
      # UPAR-10 (1 lot): unincorporated UPA parcel, annexation required first —
      # left absent (falls out as zone_not_in_rules).

