    # Lot depth, HVMC 16.12: "The distance of a line measured from the
    # midpoint of the front lot line to the midpoint of the rear lot line."
    #   or/clackamas/happy-valley/16.12.definitions.txt#L873
    # Front lot line: the city says two things and they are in tension. The
