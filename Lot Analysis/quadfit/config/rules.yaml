  gresham:
    eligible: true
    juris_city_codes: [GRESHAM]
    zoning_layer: zoning_gresham
    zone_field: ZONE
    # GDC 7.0420(A) binds entrance placement only; the E-W long-axis rule is an
    # optional sustainable-design menu item. Design districts (DRL/CMF) carry a
    # per-zone axis_required override via 7.0420(J) frontage-occupancy + max
    # front setback.
    orientation_constraint: entrance_only
    zones:
      # No lot-coverage percentage caps on quadplexes anywhere in Gresham; the
      # envelope controls are FAR (never binds a 1,000 sf building) and the 15%
      # private-open-space minimum (7.0420(D)) — not modeled, noted as blind
      # spot. min_lot values are the zone minimum lot size (same as SFD).
      - zone: LDR-5
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 5
        setback_rear_ft: 15
        # 7.0420(G)(1) applies to VLDR-SW, LDR-SW, LDR-PV, LDR-7, LDR-5 and TR:
        # the roof may be 21 ft at the rear setback line and rises a foot for
        # every foot further back. The 15 ft above is what Table 4.0130 prints;
        # a 26 ft pod stands at 20. Derived, not typed — see common.StepBack.
        step_back_rear: {height_ft: 21, rise_per_ft: 1, cite: "Gresham Development Code 7.0420(G)(1) — max roof height 21 ft at the rear setback line, rising 1 ft per 1 ft further back"}
        setback_street_side_ft: 10
        min_lot_sqft: 5000
        min_density_du_per_acre: 6.22  # per NET developable area; the lot's gross area bounds it
        source: "Gresham Development Code Tables 4.0120/4.0130/4.0131; 7.0420"
        source_url: "https://www.greshamoregon.gov/globalassets/government/city-codes-and-policies/development-code/dc-section-4.0100.pdf"
        confidence: verified
        notes: "Quadplex P outright. Rear w/ alley 8 ft (not modeled). FAR 1.0. Height 35 ft."
      - zone: LDR-7
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 5
        setback_rear_ft: 15
        # 7.0420(G)(1) applies to VLDR-SW, LDR-SW, LDR-PV, LDR-7, LDR-5 and TR:
        # the roof may be 21 ft at the rear setback line and rises a foot for
        # every foot further back. The 15 ft above is what Table 4.0130 prints;
        # a 26 ft pod stands at 20. Derived, not typed — see common.StepBack.
        step_back_rear: {height_ft: 21, rise_per_ft: 1, cite: "Gresham Development Code 7.0420(G)(1) — max roof height 21 ft at the rear setback line, rising 1 ft per 1 ft further back"}
        setback_street_side_ft: 10
        min_lot_sqft: 7000
