      # TC (167 lots, town center) not covered — falls out as zone_not_in_rules.
      # ---- ported from the FLATS corpus 2026-09-02 -------------------------
      # These zones permit a quadplex and this file had never heard of them, so
      # every lot in them was dropped at `zone_not_in_rules` before anything was
      # measured. The two files had been checked against each other number by
      # number for five weeks and never once as a LIST, which is how 1 zones
      # and 167 lots stayed invisible: a lot the screen never looks at cannot
      # come back green by mistake, so nothing complained.
      #
      # Every figure below is the corpus's BASE limb -- the number that binds
      # when no condition is assumed. The corpus also holds variants keyed to
      # `unit_lots`, `abuts_alley`, `attached_wall`, `corner_lot`,
      # `civic_corridor` and `abuts_nonresidential_zone`, and not one of those
      # is measured by this pipeline, so the unconditioned number is the only
      # one it can honestly use. Where the corpus states no minimum lot area,
      # no frontage minimum or no coverage cap, the field is OMITTED rather
      # than invented -- silence in the code is silence here.
      #
      # All are `needs_verification`, which is not a hedge: s7 routes an
      # unverified zone to REVIEW, so these lots become work to do rather than
      # lots to buy. That is the correct destination for a number nobody has
      # read on the page yet.
      - zone: TC
        quadplex_allowed: true
        setback_front_ft: 10
        # WVDC Table 235-2: 5 ft, or 15 from a residential zone (note 3), or
        # 25 ft of roof within 25 ft of a Light Residential line rising a foot
        # per two (note 2) -- 27 ft for a 26 ft pod. s5 carves the sides with
        # this figure and nothing widens them afterwards, so the port carries
        # the larger limb (as Oregon City's commercial side and Clackamas MR-1
        # / MR-2 do); FLATS resolves the neighbour per lot.
        #   or/multnomah/wood-village/235.300.txt#L75,L81,L83
        setback_side_ft: 27
        setback_rear_ft: 15
        min_lot_sqft: 7500
        min_lot_depth_ft: 80
        # WVDC 220.320 Table 220-3.
        #   or/multnomah/wood-village/220.320.txt#L64-L68
        min_lot_width_ft: 60
        max_coverage_pct: 45
        source: "WVDC 235.200 Table 235-1 (Uses in Town Center Zone); 235.300 Table 235-2 (Development Standards in Town Center Zone)"
        source_url: "https://woodvillage.municipal.codes/WVDC/235.300"
        confidence: needs_verification
        notes: "Corpus zone or/multnomah/wood-village/TC, base limbs only. The corpus states no setback_street_side_ft and no min_frontage_ft here, so nothing gates on them. This file also has no column for min_lot_depth_ft, min_lot_width_ft, setback_garage_entrance_ft, which the corpus does hold here -- carried across as nothing, which is why the row is needs_verification."

  multnomah_unincorporated:
    eligible: true
    reason: "Urban unincorporated inside Metro UGB must meet Large City standards"
    juris_city_codes: [UNINCORPORATED, ""]
    county_codes: [M] # blank JURIS_CITY is shared with Clackamas unincorporated
    zoning_layer: zoning_metro # Metro regional zoning (compiled from county code)
    zone_field: ZONE
    require_inside_ugb: true
    # Two regimes: west-county pockets (Dunthorpe-Riverdale, Sylvan) are
    # administered by Portland under PCC 33 — Metro codes R10/R20/RF/R7 are
    # Portland zones, and the 33.418 z-overlay gate applies (s3). County plan
    # areas (Interlachen, Pleasant Valley) run MCC 39, which has no middle-
    # housing code — the OAR 660-046 Large Cities Model Code applies directly.
    orientation_constraint: entrance_only
    # States a lot WIDTH and no lot depth (39.2000 Lot Width, L867), so
    # there is no depth measure to encode. Left unset rather than given a
    # neighbour's definition.
    # Lot width, MCC 39.2000: "the horizontal distance between the side
    # lot lines, measured at right angles to the lot depth at a point
    # midway between the front and rear lot lines."
    #   or/multnomah/_unincorporated/39.2000.definitions.txt#L867
    # Front lot line, MCC 39.2000: on a corner lot, "a line separating the
    # narrowest frontage of the lot from a street."
