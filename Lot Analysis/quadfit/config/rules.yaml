    #
    # 31.060 also switches definition entirely on a corner lot, to the
    # distance between the front lot line and a side lot line, and that is a
    # different pair of lines on a different axis. Corner lots are declined
    # rather than measured wrong, and since 2026-09-11 a declined lot in a
    # width-stating zone is held for review rather than judged on its
    # street frontage.
    #   or/clackamas/tualatin/31.definitions.txt#L22
    lot_width_measure: center_parallel
    # States a lot WIDTH and an AVERAGE lot width (TDC 31.060) and no lot
    # depth, so there is no depth measure to encode.
    zones:
      - zone: RL
        quadplex_allowed: true
        setback_front_ft: 15
        setback_side_ft: 5
        setback_rear_ft: 15
        # TDC Table 40-3, "Secondary Frontage on Corner Lot": 10 feet, one
        # number. The notes line below had it as orientation-dependent (garage
        # ~20 / house ~12) from a secondary source and left it blank; the city's
        # own table states 10. Front is 15, so s5 already holds a corner lot's
        # second street edge to 15 and this changes no envelope.
        #   or/clackamas/tualatin/40-41.residential.txt#L213-L214
        setback_street_side_ft: 10
        min_lot_sqft: 6500
        min_lot_width_ft: 50
        # Table 40.220, MINIMUM LOT WIDTH, the quadplex row: "50 feet. May be
        # reduced to 30 feet if on a cul-de-sac." Applied by s7 only to a lot
        # s4 read on a bulb (`fronts_cul_de_sac`); every other lot keeps the
        # 50. Width, not frontage: Tualatin measures it at the centre of the
        # lot (`lot_width_measure` above), and the bulb lots this city has
        # are mostly wedges that measurement declines, so the row holds them
        # for review as the interior row did. 81 Tualatin lots were on a bulb
        # in the 2026-09-15 run, 4 with a width taken, one under 50 -- and
        # that one is already below the minimum lot area.
        #   or/clackamas/tualatin/40-41.residential.txt#L190-L193
        min_lot_width_cul_de_sac_ft: 30
        max_coverage_pct: 60
        source: "Tualatin Development Code Ch.40 (RL), Tables 40-2/40-3; detached SFD permitted P/L, quadplex permitted P"
        source_url: "https://www.zoneomics.com/code/tualatin-OR/chapter_11"
        confidence: verified
        notes: "Detached SFD outright -> mandate attaches; quadplex outright. Coverage 60% for quadplex (SFD base 45%). Front 15 ft (12 ft to porch). Min lot 6,500 sf avg. Min width 50 ft (30 ft on cul-de-sac bulb). Corner/street-side is front-door-orientation based (garage ~20 / house ~12) - omitted as single value."
      - zone: RML
        quadplex_allowed: true
        setback_front_ft: 10
        setback_side_ft: 5
        setback_rear_ft: 10
        setback_street_side_ft: 10
        # TDC 41.220: "Quadplex 4,500 square feet" (1,400 on a unit lot). RML
        # has no mapped lots, so this reaches nothing today; filled so the row
        # is not blank against a code that states it.
        #   or/clackamas/tualatin/40-41.residential.txt#L478
        min_lot_sqft: 4500
        max_coverage_pct: 60
        # No lot width, deliberately. TDC 41.220 heads its row "Minimum
        # AVERAGE lot width" (50 ft for a quadplex), and 31.060 defines that
        # as "the sum of the length of the front lot line and the rear lot
        # line divided by 2" -- a seventh form lotdims.py does not take, on
