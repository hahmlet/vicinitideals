  # ======================================================================
  # Clackamas County jurisdictions (Metro UGB -> HB 2001 quadplex mandate)
  # ----------------------------------------------------------------------
  # ORS 197.758 / OAR 660-046: any city over 1,000 pop inside Metro is a
  # "Large City" and must allow quadplexes in residential zones that allow
  # detached single-family; the county owes the same for urban unincorporated
  # land inside the Metro UGB (implemented via Ordinance ZDO-282, eff.
  # 2022-07-01). Rivergrove and Johnson City (pop <1,000) are statutorily
  # EXEMPT despite Metro membership (eligible:false). Lake Oswego's Clackamas
  # land is out by owner decision (see the entry above). Environmental
  # overlays (slope/flood/sewer) are Multnomah-only this phase; Clackamas lots
  # get those fields blank. County-aware routing: blank/UNINCORPORATED
  # JURIS_CITY collides with Multnomah's unincorporated bucket, so
  # county_codes: [C] disambiguates it from county_codes: [M].
  # ======================================================================

  clackamas_unincorporated:
    eligible: true
    reason: "Urban unincorporated inside Metro UGB owes Large City standards (ZDO-282)"
    juris_city_codes: [UNINCORPORATED, ""]
    county_codes: [C]
    zoning_layer: zoning_metro
    zone_field: ZONE
    require_inside_ugb: true
    orientation_constraint: entrance_only
    # Metro regional-zoning ZONE literals verified against the downloaded layer
    # (CITY='Clackamas Co.'): R5 R7 R8.5 R10 R15 R20 R30 VR57 VR45 — the nine
    # ZDO-282 quadplex-eligible urban residential districts. Multi-family
