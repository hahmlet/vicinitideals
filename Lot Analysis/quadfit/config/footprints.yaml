# Candidate building footprints + fit parameters.
#
# PRODUCT (Steph, 2026-07-24): 1,000 sqft 2-story townhomes, ~500 sqft ground
# footprint each, built as PODS OF 4 side-by-side — so the rectangle we must
# fit is the WHOLE POD: (4 x unit width) wide x unit depth deep, ~2,000 sqft
# ground coverage. A lone 500 sqft rectangle fitting proves nothing.
#
# width_ft = dimension parallel to the front lot line (before any 90° flip);
# both orientations are tested unless the jurisdiction is axis_required.

orientations: [width_facing, depth_facing]

footprints:
  # 4 x 14x36 units (504 sqft each) — skinny/deep pod
  - { name: "pod56x36", width_ft: 56, depth_ft: 36 }
  # 4 x 20x25 units (500 sqft each) — wide/shallow pod
  - { name: "pod80x25", width_ft: 80, depth_ft: 25 }

# Fixed-area aspect-ratio optimizer: pod area held constant at 2,000 sqft
# (4 x 500 sqft units, identical upper/lower floor plates), depth = area /
# width. Pod width step 2 ft = unit width step 0.5 ft; unit width = pod / 4.
# Reports the unlock-% curve and statistically optimal pod (and thus unit)
# dimensions.
constant_area_sweeps:
  - { area_sqft: 2000, width_min_ft: 56, width_max_ft: 140, step_ft: 2 }

# Per-lot max-depth-per-width frontier (answers arbitrary WxD queries without
# re-running the pipeline). Extends to 145 ft to cover the widest pod.
frontier:
  width_min_ft: 12
  width_max_ft: 145
  step_ft: 0.5

# Large-lot subdivision screen (attribute math only — any change here needs
# just an s7 re-run, seconds). Each carved pod lot must supply
# quad_ground_sqft of buildable envelope (the 2,000 sqft pod) plus
# units_per_quad * parking_slots_per_unit * parking_sqft_per_slot for parking
# (stalls only, no travel lanes — stated approximation), and must satisfy the
# zone's quadplex minimum lot area. Non-split (1 SFR -> pod-of-4 conversion)
# lots carry NO parking requirement (street parking assumed to absorb).
split:
  quad_ground_sqft: 2000
  parking_slots_per_unit: 1.5
  parking_sqft_per_slot: 162 # 9x18 stall
  units_per_quad: 4
  min_quads: 2 # >= this many carved lots to count as a split candidate

# Current-use + value + acquisition-economics screen (s7-only, seconds to re-run).
# Current use tagged from assessor property class: existing multifamily and
# commercial/industrial lots are excluded from the headline by default (team
# won't replace those uses) — a counted, reversible funnel step. TOTALVAL is
# the county Real Market Value (land+building market estimate — NOT the
# Measure-50 capped assessed value, which is ~45% of it and unused here), so
# value is a reported finance_tier slice (vacant / teardown_candidate /
# improved), never a hidden kill — filter the CSVs to your own price tolerance.
#
# Acquisition economics = land cost per door. Acquisition estimate is a
# post-COVID arm's-length sale where recorded, else TOTALVAL (RMV).
# land_cost_per_unit = acquisition / doors (doors = 4 for a 1-lot conversion,
# 4 x carved pods for a split — split door counts are the theoretical maximum,
# so per-door cost there is a floor). Preferred <= $30k, ceiling <= $45k. A
# slice, not a gate — see viable_candidates.csv (cheapest dirt first).
screen:
  exclude_current_use: [multifamily, commercial]
  teardown_max_improvement_share: 0.5 # building <= 50% of total market value
  vacant_max_improvement_value: 5000 # <= this improvement $ = virtually vacant
  recent_sale_min_year: 2020    # sales this year or later are trusted; older -> RMV
  recent_sale_min_price: 10000  # below this = nominal/intra-family transfer, ignore
  preferred_land_cost_per_unit: 30000 # target dirt cost per door
  max_land_cost_per_unit: 45000       # hard ceiling per door

# Procedural site-plan generator (s6s stage). Lays out a REAL plan per lot —
# building at the front, driveway to a parking court, 90° stalls counted by
# geometry, and a mandatory private open-space reservation — then tightens the
# 1-lot conversion verdict in s7 (a bare pod rectangle fitting no longer counts
# as buildable; a building + parking + driveway must lay out). Scoped to a
# single pilot cell (Gresham LDR-5); every other lot passes through untouched.
#
# Parking counts are Steph's marketability target, NOT a legal floor: Gresham
# LDR-5 requires ZERO parking (CFEC citywide elimination, §9.0802(A)) and sets
# NO maximum (Table 9.0851A), so all three tiers are legal.
#
# Product = attached townhomes (fee-simple lots) → Gresham §7.0431 governs
# parking, not the quadplex §7.0420. Off-street parking sits in the REAR yard,
# reached by ONE consolidated driveway down a SIDE (never across the front,
# §7.0431(B)(3)(b)); combined curb cut ≤ max(18 ft, 34% of frontage),
# §7.0431(B)(2)(b). Cars pull in and out forward, so nothing backs onto the
# street — which the code bans only on arterials (Appendix A5.404). One
# typology: townhome_rear_court.
#
# Setbacks/height/FAR/min-lot come from the verified rules.yaml gresham/LDR-5
# row (front 10 / side 5 / rear 15 / street-side 10, min lot 5,000, FAR 1.0).
siteplan:
  enabled: true
  # Every city whose own code states a stall AND an aisle gets laid out.
  # Eleven do as of 2026-08-30, Wood Village being the newest; two more
  # state a stall and no aisle and are declined by name below; the rest have
  # not been read and pass through as `not_evaluated`. Narrow to `pilot_cell`
  # to re-run Gresham LDR-5 alone after a layout change.
  scope: every_city_it_can_dimension
  pilot_jurisdiction: gresham
  pilot_zone: LDR-5
  # Four units on ONE lot — the verdict s7 reports and the path the FLATS
  # design catalog defaults to. It decides which chapter reaches the building
  # in Oregon City; see its entry.
  plat: one_lot
  # Marketability tiers — spaces per townhome unit (pod = 4 units).
  parking_per_unit_min: 1.0        # 4/pod  (tight-lot floor)
  parking_per_unit_target: 1.5     # 6/pod  (design target)
  parking_per_unit_preferred: 2.0  # 8/pod  (preferred; legal — no LDR-5 ceiling)
  units_per_pod: 4
  layout_methods: [townhome_rear_court]
  # Stall + aisle, per city, mirroring the FLATS corpus defaults for each
  # (flats/config/jurisdictions/or/multnomah/*.yaml). A drift test asserts they
  # still match, so change the corpus and re-run it — not this file alone.
  #
  # The one-way aisle is 23 ft, NOT the 20 that used to sit here: Table 9.0825A
  # gives 23 at 90° with a standard stall; the 20 is note 1's emergency-vehicle
  # access figure, which answers a different question. Reading it as the aisle
  # made a 38 ft court look deep enough when a stall row and its drive need 41.
  geometry:
    # 9.0802(F) excludes quadplexes and townhouses parked unit-by-unit from
    # the parking-lot design standards and sends them to 7.0400, which states
    # a stall and no aisle. The same sentence sends a SHARED parking area back
    # to 9.0822-9.0827, where Table 9.0825A is. The pod parks in a shared rear
    # court, so it takes that branch -- and takes the 90-degree standard row
    # whole rather than pairing 7.0431's 18 ft stall with the table's aisle,
    # which is a rectangle neither section states.
    gresham:
      stall_width_ft: 8.5          # Table 9.0825A, 90°, standard column
      stall_depth_ft: 18.5         # the table's own depth, not 7.0431's 18
      parallel_stall_ft: [8, 24]   # 9.0825(D); 7.0431(B)(5)(b) says the same
      aisle_one_way_ft: 23         # 90° only: 19 at 75°, 14-18 at 60°
      aisle_two_way_ft: 24         # printed in every row, at every angle
      cite: GDC Table 9.0825A, 90 degrees standard, reached via 9.0802(F)
    # Portland prints two stalls and one sentence deciding between them.
    # 33.266.120.D.1 says 9 x 18 with a 9 ft driveway and states no aisle;
    # 33.266.120.B.1 then sends parking that is in a parking TRACT to
    # 33.266.130 instead, and Table 266-4's 90° row is 8'6" x 16 with a 20 ft
    # aisle. A shared rear court serving four attached houses on fee-simple
    # lots is a tract, so the table is the branch this product reaches — and
    # the deeper court (36 ft vs 27) is the conservative one where the plat is
    # not yet drawn.
    portland:
      stall_width_ft: 8.5          # Table 266-4, 90°
      stall_depth_ft: 16.0
      aisle_one_way_ft: 20         # the table prints 20 in BOTH aisle columns
      aisle_two_way_ft: 20
      cite: PCC Table 266-4 (90 degrees), reached via 33.266.120.B.1 parking tract
      # PCC 33.266.115 exempts this building from the maximum tables. The 1.35
      # per unit in Tables 266-1/266-2 is real and belongs to RM1-RM4, RX,
      # RMP and the commercial zones — none of which is in this inventory,
      # which carries RF, R20, R10, R7, R5 and R2.5 only. Read, not omitted.
      max_per_unit: null
    # Fairview requires ZERO stalls and caps none, and still dimensions them
    # completely — the whole point of the "required vs regulated" split. 24 ft
    # is the widest aisle anybody in this corpus asks for, which makes Fairview
    # the deepest court and the hardest city to seat two rows in.
    fairview:
      stall_width_ft: 9
      stall_depth_ft: 19
      aisle_one_way_ft: 24         # one figure, printed for both directions
      aisle_two_way_ft: 24
      cite: FMC 19.164.030, off-street parking dimensions, 90 degrees standard
      max_per_unit: null
    # Happy Valley answers every part of the question in one chapter: one
    # space per dwelling required, no maximum, 9 x 18.5 off a 24 ft aisle. The
    # module figure in its table is the check on the reading — 18.5 + 24 + 18.5
    # is the 61 ft the table prints.
    #
    # NOT MODELLED HERE, and it is the rule that would change these drawings:
    # LDC 16.43.030.E.4 sets parking back from a street lot line by the
    # BUILDING setback, twenty feet in its residential zones. A rear court is
    # the arrangement that survives that, which is the one this stage draws —
    # but the side driveway running from the street is not obviously exempt,
    # and nothing here checks it. Happy Valley's numbers are therefore the
    # loose end of this run rather than a verdict.
    happy_valley:
      stall_width_ft: 9
      stall_depth_ft: 18.5
      aisle_one_way_ft: 24
      aisle_two_way_ft: 24
      cite: HV LDC 16.43.030.F.2, Table 16.43.030-2, standard vehicle at 90 degrees
      max_per_unit: null
    # Oregon City states this geometry for a QUADPLEX and states none at all
    # for townhouses: OCMC 17.52.010 excludes "single-family detached
    # residential dwellings, duplexes, townhouses, and cottage clusters" from
    # the whole parking chapter and leaves triplexes and quadplexes in it. So
    # these dimensions govern four units on one lot and evaporate the moment
    # the same building is platted onto four. `plat: one_lot` above is what
    # keeps them in play; flip it and s6s declines this city instead.
    oregon_city:
      stall_width_ft: 9
      stall_depth_ft: 19           # the table's "Stall to Curb" column
      aisle_one_way_ft: 24
      aisle_two_way_ft: 24
      cite: OCMC 17.52.030.D.1, Parking Angle Space Dimensions, 90 degrees standard
      stands_down_on: [unit_lots]
      # How MANY spaces is refused in the corpus: Table 17.52.020 asks a
      # triplex/quadplex for "2.00" and "4" and states no unit for either.
      max_per_unit: null
    # The sixth city, read 2026-08-27, and the largest one this stage has
    # gained: 6,791 West Linn lots fit the pod and none of them has ever been
    # drawn on. CDC 46.150(A)(1) states three stall sizes and 46.150(E)'s
    # Figure 2 states the aisle by angle -- 23 ft at 90 degrees drive-in, in
    # both stall-width columns, and no one-way row anywhere in the chapter, so
    # one figure answers both questions the way Fairview's does.
    #
    # Nine by eighteen and not nine by twenty. The third size in that sentence
    # -- "when multifamily parking stalls back onto a driveway, as opposed to
    # a drive aisle within a parking lot" -- is the layout this stage does NOT
    # draw: the side lane and the court aisle are separate pavement here, and
    # the stalls back onto the aisle. If the catalog ever gains a plan whose
    # stalls open straight onto the entry drive, West Linn's depth is 20.
    #
    # The ceiling is a real number rather than a null, which makes West Linn
    # the third city carrying one: 46.090(A) allows multifamily non-studio
    # units 2.0 spaces each. Eight stalls for the pod -- the preferred
    # marketability tier exactly, so it costs nothing and it is still the law.
    west_linn:
      stall_width_ft: 9
      stall_depth_ft: 18
      aisle_one_way_ft: 23         # Figure 2, 90 degrees, DRIVE-IN (back-in is 22)
      aisle_two_way_ft: 23         # the chapter states no two-way figure
      cite: West Linn CDC 46.150(A)(1) stall; 46.150(E) Figure 2, 90 degrees drive-in
      max_per_unit: 2
    # The seventh city, read 2026-08-29, and the strictest geometry in the
    # file. TDC 9.115 answers both halves in one section and answers them for
    # everybody -- "The following off-street parking development and
    # maintenance shall apply in all cases" -- so the middle-housing
    # invalidation in 8.120.C.1.b.ii, which voids standards applying ONLY to
    # triplexes, quadplexes and multifamily, never reaches it.
    #
    # TWENTY-FIVE FEET IS THE WIDEST AISLE IN THIS CORPUS: Fairview asks 24,
    # Gresham and West Linn 23, Portland 20. One figure, not split by
    # direction, so a one-way court is dimensioned off it too. A stall row,
    # its aisle and a second stall row come to 61 feet of depth before any
    # driveway reaches them.
    #
    # And the pod is NOT multifamily here, which is why the Triplex and
    # Quadplex row is the one that binds and why `max_per_unit` is null: TDC
    # 1.020 defines a multi-family dwelling as "a building with five (5) or
    # more dwelling units" and a quadplex as four on a lot. Troutdale is the
    # only city in this corpus that settles the question by counting.
    troutdale:
      stall_width_ft: 9
      stall_depth_ft: 18            # 9.115(A)(1) prints 162 sq ft beside it
      aisle_one_way_ft: 25          # 9.115(B)(1), 90 degrees; no one-way row
      aisle_two_way_ft: 25
      cite: TDC 9.115(A)(1) stall size; 9.115(B)(1) aisles at ninety degrees
      # Table 1 of 9.010 prints "No maximum" against every band of the
      # Triplex and Quadplex row, in a column that caps general retail at 6.2
      # and a restaurant at 19.1. A read ceiling that is not there.
      max_per_unit: null
    # The eighth city, read 2026-08-29, and the widest stall in the file.
    # GMC 17.48.040(2)(f) sends every parking space and access aisle to the
    # chapter's dimension tables and the 90-degree row of the standard table
    # reads 9.5 by 18.0 with a 24.0 aisle. Nine and a half feet is half a foot
    # more than any other city here asks and a full foot more than Gresham or
    # Portland: four stalls across a rear court is two feet of lot width
    # Gladstone charges and nobody else does.
    #
    # The section that states it opens "All structures and developments subject
    # to design review", and 17.48.020 bridges middle housing to 17.48.030 for
    # the QUANTITY without a matching sentence for these dimensions. The
    # chapter's own applicability section is broader than both -- the standards
    # "shall apply to all development permits", and any parking built anywhere
    # in the city "must meet the standards of this chapter" -- and that is the
    # encoding. It is also the safe half of the doubt: this is the largest
    # rectangle in the corpus, so a lot that fits it could not fail a looser
    # rule, and the alternative was 2,371 lots nobody can draw on.
    #
    # `max_per_unit` is null on a read ceiling, not an unread one. Table 1
    # prints "Max: None" against this row in Zone A and "Not Applicable" in
    # Zone B, in a chapter that splits the city in two for the purpose, lists
    # five kinds of space exempt from the maxima and gives a variance path out
    # of one. Gladstone built the whole apparatus and pointed none of it here.
    gladstone:
      stall_width_ft: 9.5           # Table 2, 90 degrees, standard column
      stall_depth_ft: 18
      aisle_one_way_ft: 24          # one figure, not split by direction
      aisle_two_way_ft: 24
      cite: GMC 17.48.040, Standard Parking Dimensions in Feet, 90 degrees
      max_per_unit: null
    # The ninth entry and the first that is not a city. MCC 39.6565(A)(1) and
    # (B)(1): nine by eighteen, with 25 feet of aisle at ninety degrees --
    # tying Troutdale for the widest aisle in this file and making a court
    # sixty-one feet deep before a drive reaches it.
    #
    # Scope needed no argument here, which is the exception in this file.
    # 39.6555(A) applies the design standards to every parking area "except
    # those serving a single family dwelling on an individual lot in a rural
    # base zone and except those serving a single family or a two-family
    # dwelling in an urban base zone". A quadplex is neither, in neither kind
    # of zone, and no design-review gate stands in front of the sentence.
    #
    # THESE ARE THE COUNTY'S NUMBERS AND FOUR OF THE SIX ZONES BELOW THEM ARE
    # PORTLAND'S. R20, R10, R7, R5 and RF are Portland-administered pockets
    # inside the county, and 1,489 of this jurisdiction's 1,578 pod-fitting
    # lots are in them. PCC 33.266 has not been read into that layer yet, so
    # every lot here is laid out on MCC: 9 x 18 with a 25 ft aisle is stricter
    # than 33.266's 8.5 x 16 with 20, so a pocket lot that fits on these could
    # not fail on Portland's own. It costs plans rather than inventing them,
    # and it is the whole of what reading 33.266 into the pockets would buy.
    #
    # `max_per_unit` is null on an absence, not on a read ceiling. The word
    # "maximum" occurs nowhere in MCC 39.6500 through 39.6600, and the chapter
    # builds no apparatus for one -- no table, no exempt space types, no zone
    # split. Gladstone above prints "Max: None" and is a reading; this is a
    # code that never had the thought.
    multnomah_unincorporated:
      stall_width_ft: 9
      stall_depth_ft: 18
      aisle_one_way_ft: 25          # one figure, not split by direction
      aisle_two_way_ft: 25
      cite: MCC 39.6565(A)(1) stall size; 39.6565(B)(1) aisle at ninety degrees
      max_per_unit: null
    # The tenth, and the one that answers the question Clackamas County
    # could not. TDC 73C.030(1) states no dimension of its own -- off-street
    # parking lot design "must comply with the dimensional standards set forth
    # in Figure 73-1" -- and Figure 73-1 is in Appendix B at the back of the
    # code. Same sentence as ZDO 1015.02(A)(4) pointing at Standard Drawing
    # P100, and the opposite outcome, because this drawing carries its numbers
    # as a table and they extract.
    #
    # WHICH OF THE FIGURE'S TWO GRIDS IS THE STANDARD SPACE IS NOT IN THE
    # TEXT: the captions are drawn into the images. The larger is taken, and
    # the reason is the direction of the error rather than confidence -- nine
    # by eighteen and a half with a 24-foot aisle is the stricter rectangle,
    # so a lot that lays out on it lays out on either grid. The corroboration
    # is good anyway: 73C.030(8) regulates "sub-compact vehicles", the smaller
    # grid's parallel stall is 20 feet where a standard parallel space is 24,
    # and eight by sixteen is a sub-compact stall in any parking manual.
    #
    # `max_per_unit` is null on a reading, like Gladstone's and unlike the
    # county's. Table 73C-1 is a ceiling table -- its heading is MAXIMUM
    # PERMITTED VEHICLE PARKING and it gives multi-family 1.2 and 2.0 -- and
    # it prints None against the Middle Housing row that lists Quadplexes by
    # name. The same row is why nothing is required either: the table has no
    # minimum column for vehicles at all.
    tualatin:
      stall_width_ft: 9
      stall_depth_ft: 18.5
      aisle_one_way_ft: 24          # one figure per angle, not split by direction
      aisle_two_way_ft: 24
      cite: TDC 73C.030(1) and Figure 73-1 (Appendix B), standard space at 90 degrees
      max_per_unit: null
    # The eleventh, and the last one the backlog could reach: of the four
    # jurisdictions still holding lots and no layout, Clackamas County's aisle
    # is refused into a CAD drawing and Milwaukie and Wilsonville state a stall
    # and no aisle at all.
    #
    # Section 350 splits its development standards into one article for
    # "One and Two Unit Dwellings" and one for "All Other Uses", and 350.065(A)
    # says which is which: it reaches every vehicle area "except for
    # residential parking areas subject to the standards of Section 350.050
    # through 350.055". 350.055(A) then names its own: "houses, attached
    # houses, duplexes, and manufactured homes". A quadplex -- WVDC 720.030,
    # "four (4) primary dwelling units on one (1) lot" -- is none of the four,
    # and Tables 210-2 and 220-3 list it as a housing type of its own.
    #
    # THE STALL IS THE SAME ON BOTH BRANCHES, which is what makes the reading
    # safe: 350.055(C) says 9 by 19 for a house and Table 350-3's 90-degree
    # Standard row says 9 by 19 too. The elimination decides the AISLE, and
    # only the "All Other Uses" article has one -- without it this city could
    # not be drawn at all.
    #
    # Standard and not compact: 350.065(D)(2)(b) lets half the required spaces
    # be 7 ft 6 in by 15 ft, and a court drawn to the standard stall fits
    # wherever the mixed court fits.
    #
    # `max_per_unit` is null on a reading. Table 350-1B caps a restaurant at 23
    # spaces per 1,000 sq ft and a college at 0.3, states a tighter column near
    # 20-minute transit, and prints "no maximum" against Household Living in
    # both.
    wood_village:
      stall_width_ft: 9
      stall_depth_ft: 19
      aisle_one_way_ft: 12
      aisle_two_way_ft: 24
      cite: WVDC 350.065(D)(2)(a) Table 350-3, 90 degrees, Standard
      max_per_unit: null
    # --- states a stall and no aisle: laid out on an ASSUMED aisle ---------
    # Both of these dimension a space and never dimension the drive that
    # reaches it. Until 2026-08-31 that meant declined, and 6,091 lots between
    # them carried no site plan at all -- not "does not fit", but "never
    # attempted", which is the least useful thing a screen can say.
    #
    # What changed is that the search for a published number was finished
    # rather than abandoned. OAR 660-046-0220(2)(e)(E) orders a Large City to
    # apply to middle housing "the same off-street parking surfacing,
    # dimensional, landscaping, access, and circulation standards that apply to
    # single-family detached dwellings in the same zone", so the state itself
    # says where to look next. Both cities were read down that path:
    #
    #   Milwaukie  19.607.1's own scope sentence covers "single detached
    #              dwellings, duplexes, triplexes, quadplexes, townhouses,
    #              cottage clusters, and residential homes in all zones" -- one
    #              sentence, both buildings. The redirect lands back on the
    #              section already read, which states no aisle. There is no
    #              second place to look.
    #   Wilsonville  files residential standards by structure type (C all
    #              structures, D triplex/quadplex, E townhouse, F cottage
    #              cluster, G cluster housing). C is facade and articulation
    #              only. All seven "aisle" sentences in Chapter 4 say WHERE an
    #              aisle may go; none says how wide. 4.155's review criteria
    #              send "drive aisle design" to a person, not a number.
    #
    # So the number does not exist to be found, and the choice is between no
    # site plan and an honest assumption. The assumption:
    #
    #   24 ft, one-way and two-way, 90 degrees.
    #
    # Iowa SUDAS Design Manual 8B-1 Table 8B-1.02, "Adapted from Urban Land
    # Institute, National Parking Association" -- i.e. The Dimensions of
    # Parking, the US reference both ULI and NPA publish. Its design vehicle is
    # stated: the 85th percentile vehicle, 6 ft 7 in wide by 17 ft 3 in long,
    # within an inch or two of that since 1999. Three properties of that table
    # are why 24 is the right number rather than a cautious one:
    #
    #   * Note 1 says aisle width "may be increased up to 3 feet to provide a
    #     higher level of comfort". 24 is the floor; 25-27 is the padding.
    #   * The 90-degree column has no one-way entry. One-way reductions exist
    #     at 60 and 45 degrees only, because backing out of a perpendicular
    #     stall sweeps the same path whichever way traffic runs. So one-way is
    #     24 here too, and a narrower one would be invented rather than eased.
    #   * Stall width does not move it: "the only dimension that varies by
    #     stall width is the interlock dimension". 8'6" and 9'0" both take 24.
    #
    # It also happens to be what Oregon says. Of the eleven jurisdictions in
    # this corpus that publish a two-way aisle, the median is 24.0 and the mode
    # is 24.0 (8 of 11); the range is 20 (Portland, off the smallest stall in
    # the corpus at 8.5 x 16) to 25 (Troutdale, unincorporated Multnomah). And
    # both of these cities already publish a 9 x 18 stall, which is exactly
    # ULI/NPA's recommended stall for moderate-to-high turnover at its
    # recommended 18 ft length. The stall is theirs; only the lane is ours.
    #
    # NOT TAKEN, and worth saying so: Milwaukie's own Table 19.606.1 gives 9 x
    # 18 with a 22 ft aisle at 90 degrees, one-way or two -- narrower than the
    # national floor and sitting in this city's own code. It is not used,
    # because 19.606's purpose paragraph excepts middle housing from everything
    # in that section and Table 19.605.1 files quadplexes there. Reaching into
    # a table the city took off this building, to get a number that yields more
    # lots than the engineering minimum does, is the borrowed dimension this
    # file exists to refuse. The assumption is allowed to be honest; it is not
    # allowed to be convenient.
    #
    # NOT TAKEN either: SUDAS note 2 allows 23 ft "in lots where at least 30%
    # of stalls have curbs". A four-stall residential court with wheel stops
    # would qualify and the foot is real, but it is an assumption stacked on an
    # assumption to buy lots, and one assumed number per city is the limit.
    #
    # None of this can produce a GREEN. `aisle_assumed` rides through s6s onto
    # every lot drawn this way and s7 folds it into REVIEW.
    milwaukie:
      stall_width_ft: 9
      stall_depth_ft: 18
      aisle_one_way_ft: 24
      aisle_two_way_ft: 24
      aisle_assumed: true
      aisle_cite: >-
        ASSUMED. Iowa SUDAS Design Manual 8B-1 Table 8B-1.02 (adapted from
        Urban Land Institute / National Parking Association, The Dimensions of
        Parking), 90 degrees, two-way, 85th-percentile design vehicle.
        Milwaukie publishes no aisle for this building: 19.606's aisle table is
        excepted from middle housing by its own purpose paragraph, and
        19.607 -- which OAR 660-046-0220(2)(e)(E)'s single-family redirect
        lands back on, since 19.607.1 names houses and quadplexes in one
        sentence -- states none.
      cite: MMC 19.607.1.A (Residential Driveways and Vehicle Parking Areas)
      # The tightest ceiling in this corpus: Table 19.605.1 caps a quadplex at
      # one space per unit, which is four — the same as the marketability
      # FLOOR. Every legal Milwaukie plan is a minimum-tier plan, and the 1.5
      # and 2.0 tiers are not on offer in this city at any lot size. Carried
      # even though Milwaukie is declined for want of an aisle, because the
      # day an aisle turns up this is the number that decides its lots.
      max_per_unit: 1
    # Section 19.606's aisle table (22 ft at 90 degrees) is NOT Milwaukie's
    # answer here: that section's purpose paragraph excepts middle housing
    # from everything in it bar the quarter-acre parking-lot rules, and
    # Table 19.605.1 files quadplexes under Middle Housing.
    wilsonville:
      stall_width_ft: 9
      stall_depth_ft: 18
      aisle_one_way_ft: 24
      aisle_two_way_ft: 24
      aisle_assumed: true
      aisle_cite: >-
        ASSUMED. Iowa SUDAS Design Manual 8B-1 Table 8B-1.02 (adapted from
        Urban Land Institute / National Parking Association, The Dimensions of
        Parking), 90 degrees, two-way, 85th-percentile design vehicle.
        Wilsonville publishes no aisle for any residential structure: Chapter 4
        files its standards by structure type, the "all residential structures"
        block is facade and articulation, and every aisle sentence in the
        chapter states where an aisle may go rather than how wide it is.
      cite: WC 4.113(.14)D, off-street parking, stall dimensions in the definitions
      max_per_unit: null
  # Driveway, parking placement and open space, per city, mirroring the FLATS
  # corpus defaults for each. Same rules as `geometry` above: a city missing
  # from this map is a city nobody has read, a field missing from a city that
  # IS here is a city that states no such rule, and the drift test tells the
  # two apart. Change the corpus and re-run it — not this file alone.
  #
  # These are the ONE-LOT values (`plat: one_lot`). Every city here states a
  # different approach width and a different maneuvering cap for townhouses on
  # their own lots, and the loader refuses the unit-lot plat while this block
  # is populated rather than draw one to the other's numbers.
  #
  # WHAT THIS REPLACED, and it is worth reading before trusting any earlier
  # run: five constants taken from Gresham GDC 7.0431 and charged to every
  # city — an 18 ft approach, a 34% frontage share, a 12 ft lane, a 5 ft gap
  # and a 15% open-space reserve. 7.0431 is the TOWNHOUSE chapter. On the
  # one-lot plat this stage draws, Gresham's own cap is 7.0420(B)(2)(b)(ii) and
  # it is TEN feet, not eighteen. And the 15 percent was Gresham's alone: four
  # of the seven cities that can be dimensioned state no private open space
  # standard for this building at all.
  driveway:
    # GDC 7.0420(B)(2)(b)(ii), Driveway Approach Width, a fourplex with no
    # garage: ten feet. (With a garage it is the garage's width; with an
    # improved alley the approach comes off the alley.) 7.0431's 18 ft / 34%
    # is the townhouse figure and reaches this pod only on four lots.
    #
    # Gresham states no general minimum driveway width for this building — the
    # 9 ft in 7.0420 is a gravel-surface condition and the 15 ft in the
    # Hillside overlay is not a citywide standard — and 7.0420(B)(3)'s 50% of
    # frontage counts GARAGES only, so neither the width nor the frontage
    # fields can hold anything here.
    gresham:
      approach_max_ft: 10
      open_space_pct: 15
      cite: GDC 7.0420(B)(2)(b)(ii) approach width; 7.0420(D)(1) private open space
    # Portland is the only city that bans front parking outright AND caps the
    # front yard AND sets a stall back from the street — 33.266.120.C.1.a,
    # .C.2 and .C.1.b. All three are satisfied by a rear court, and the ban
    # carves out "driveways to parking areas behind the building line" in the
    # same sentence, which is exactly the side lane this stage draws.
    #
    # Open space is stated by ZONE and by nobody else in this corpus: Table
    # 110-4 asks 250 sq ft of outdoor area per unit in most residential zones
    # and 200 in R2.5. Only the five residential zones quadfit carries for
    # Portland are mirrored; the corpus also holds RF, the RM zones at 48 sq ft
    # per dwelling and most commercial zones at the same, and RX / RMP / CX
    # exempt, none of which are in this inventory.
    #
    # Portland states NO maximum approach width. Absent rather than null: the
    # chapter was read and the ceiling is not there.
    portland:
      drive_min_one_way_ft: 9
      drive_min_two_way_ft: 9
      parking_front_prohibited: true
      parking_front_yard_max_pct: 40
      parking_street_setback_ft: 10
      open_space_sqft_by_zone:
        R20: 250
        R10: 250
        R7: 250
        R5: 250
        R2.5: 200
      cite: PCC 33.266.120.C; Table 110-4 outdoor area
    # FMC 19.162.020(L)(1): a residential driveway approach is 10 ft minimum
    # and 24 ft maximum. 19.30.040(F)(1)'s 32 ft is the per-frontage budget for
    # all approaches together, so 24 is the ceiling on this single opening.
    # 19.163.030(E)(3)(b) asks 4 ft between a building and a parking area.
    #
    # No private open space: 19.30.090(B) is an RM-district, multi-unit
    # standard and does not reach this building. A Fairview site plan reserves
    # none, which is the code as read and not an omission.
    fairview:
      approach_min_ft: 10
      approach_max_ft: 24
      parking_max_frontage_pct: 50
      building_buffer_ft: 4
      cite: FMC 19.162.020(L)(1) approach; 19.30.040(E)(2); 19.163.030(E)(3)(b)
    # The hardest number in this family, and the only one that takes lots away.
    # LDC 16.41.030.B.1: a driveway to an off-street parking area is improved a
    # minimum of 20 ft for a two-way drive, 12 ft for a one-way. The lane this
    # stage draws is two-way, so Happy Valley's side lane is 20 ft where every
    # other city's is 12 — eight feet of side yard, for the depth of the lot.
    #
    # Happy Valley states no approach maximum (the approach is a public works
    # drawing) and no private open space for this building. What it DOES state
    # and this mirror cannot hold is 16.43.030.E.4, which sets parking back
    # from a street lot line by the ZONE'S BUILDING SETBACK — twenty feet in
    # its residential zones. The rear court clears it; the side lane's status
    # is the open question flagged in `geometry` above.
    happy_valley:
      drive_min_one_way_ft: 12
      drive_min_two_way_ft: 20
      # 16.43.030.E.4, now encoded and no longer refused. It states no number
      # of its own -- parking sets back from a street lot line by "the same
      # distance as the required building setbacks", floored at ten feet -- so
      # there is no citywide figure to mirror and this carries what the corpus
      # resolved zone by zone. Every one of them is at least twenty, the
      # envelope this stage lays out in is already inset by that same building
      # setback, and so a rear court clears it on every lot in the city. It is
      # here because it is the law and because the check it feeds is general.
      parking_street_setback_by_zone:
        R40: 22
        R20: 22
        R15: 22
        R10: 22
        R8.5: 22
        R7: 22
        R5: 20
        MURS: 20
        R20CC: 22
      cite: HV LDC 16.41.030.B.1, minimum improved driveway width; 16.43.030.E.4, parking setback
    # Table 16.12.035.D, the widest approach any city here allows this
    # building: 10 ft minimum, 36 ft maximum on the triplex/quadplex row (a
    # townhouse gets 24). 17.16.060.D.1 caps outdoor parking and maneuvering at
    # forty feet OR half the frontage, whichever is less — both limbs, so the
    # screen can take the lesser.
    #
    # No private open space. The 75 percent quadfit used to carry for Oregon
    # City was a cottage cluster courtyard rule about IMPERVIOUS cover, and
    # Chapter 17.16's quadplex requirements state none.
    oregon_city:
      approach_min_ft: 10
      approach_max_ft: 36
      parking_max_frontage_pct: 50
      parking_max_width_ft: 40
      cite: OCMC Table 16.12.035.D approach sizes; 17.16.060.D.1 parking width
    # Declined for want of an aisle (see `geometry`), carried because it was
    # read. 19.505.3.D.4.a bans parking directly between the facade and the
    # street; 19.607.1.D caps uncovered parking and maneuvering at half the
    # front yard AREA. Both bind a quadplex on one lot and both stand down on
    # unit lots, which 19.505.3.B says in as many words.
    #
    # Table 19.505.3.D.1 asks 96 sq ft of private open space for each
    # ground-floor unit. Every unit of a two-storey attached fourplex is a
    # ground-floor unit, so the pod owes 384 — the largest flat reserve in this
    # corpus. Milwaukie states no driveway approach width at all: 19.607.1.E.1
    # holds the drive to "the approved approach", which is a public works
    # decision rather than a code dimension.
    milwaukie:
      parking_front_prohibited: true
      parking_front_yard_max_pct: 50
      open_space_sqft: 384
      cite: MMC 19.505.3.D.4.a; 19.607.1.D; Table 19.505.3.D.1 private open space
    # Declined for want of an aisle, carried because it was read.
    # 4.113(.14)D.4: all driveway approaches together, 32 ft per frontage. D.3:
    # garages plus outdoor parking and maneuvering, 50% of ANY street frontage
    # — on a corner lot it binds twice. No private open space: Section
    # 4.125(.08) is the Village Zone, which is Villebois.
    wilsonville:
      approach_max_ft: 32
      parking_max_frontage_pct: 50
      cite: Wilsonville Development Code 4.113(.14)D.3 and D.4
    # No stall geometry read at all, so this city is not laid out; the driveway
    # half was read and is recorded so the mirror does not report it unread.
    # ZDO 845.02 is Fairview's and Wilsonville's shape word for word, because
    # all three are the state middle-housing model code. Note the applicability
    # trap: the flat front-parking ban in this chapter is 845.04 and governs
    # COTTAGE CLUSTERS — what 845.02 gives a quadplex is the 50 percent cap.
    clackamas_unincorporated:
      approach_max_ft: 32
      parking_max_frontage_pct: 50
      cite: Clackamas ZDO 845.02, driveway entries and parking between building and street
    # Chapter 48, fetched with 46 because 46 dimensions a court and never the
    # drive into it. 48.030(E): a multifamily access or service drive is 24 ft
    # two-way, 15 ft one-way. The lane this stage draws is two-way, so West
    # Linn's side lane is 24 ft -- four wider than Happy Valley's 20, which
    # was the hardest number in this family until now, and twice the 12 ft
    # design lane every unread city falls back to. That is a real cost in side
    # yard for the depth of the lot, and it is the code as written.
    #
    # 48.060 states BOTH ends of the curb cut, 16 ft to 36 ft, and the floor is
    # the unusual half: most cities here cap an approach and let it shrink to
    # nothing, so West Linn is the only one where a pod cannot economise its
    # opening down to a single-car width. The Highway 43 exception raises the
    # ceiling to 40 on one highway and is left out as a looser number nothing
    # could select.
    #
    # No private open space, no front-parking ban, no frontage share and no
    # maneuvering cap: read and absent, which is the fourth city of six to
    # state no open-space reserve for this building.
    west_linn:
      approach_min_ft: 16
      approach_max_ft: 36
      drive_min_one_way_ft: 15
      drive_min_two_way_ft: 24
      cite: West Linn CDC 48.030(E) service drive widths; 48.060(A) and (B) curb cut
    # Read with the geometry above, out of two chapters. TDC 9.080(A): a
    # driveway to an off-street parking area is improved at 20 feet two-way
    # and 12 one-way. (B) drops it to 10 for "a single-family or two-family
    # dwelling" and a quadplex is neither, so the pod takes (A) -- level with
    # Happy Valley, four short of West Linn's 24, and eight more than the
    # 12-foot design lane an unread city falls back to.
    #
    # The curb cut is the state model code's 32 feet per frontage, word for
    # word what Wilsonville and unincorporated Clackamas carry. Troutdale
    # states NO minimum approach width -- read and absent -- so unlike West
    # Linn a pod here may shrink its opening to whatever the lane needs.
    #
    # 8.120.C.4 bans parking between a building and a public street and then
    # excepts a parking area at half the street frontage or less, so the ban
    # is a CAP here and `parking_front_prohibited` stays empty. (The
    # cross-reference in the ban points at itself: Troutdale re-lettered the
    # model code's a/b pair to c/d and left the pointer behind. Fairview,
    # Wilsonville and Clackamas carry the same two sentences numbered right.)
    #
    # No private open space, and not by omission: 8.120.B.1.b invalidates
    # maximum lot coverage, minimum landscape area and minimum open space for
    # a quadplex by name. Fifth city of seven to reserve none.
    troutdale:
      drive_min_one_way_ft: 12
      drive_min_two_way_ft: 20
      approach_max_ft: 32
      parking_max_frontage_pct: 50
      # 9.095(D), the same shape as Happy Valley's: parking sets back from a
      # street lot line "the same distance as required building setbacks".
      # No citywide figure to mirror -- the ten feet printed in the sentence
      # is an industrial-district floor -- so this carries what the corpus
      # resolved zone by zone, and every one of them equals its own building
      # setback. The rear court is drawn inside that envelope already, so it
      # costs nothing and it is still the law.
      parking_street_setback_by_zone:
        LDR-1: 10
        LDR-2: 10
        MDR: 10
        HDR: 20
        MU-2: 15
        MU-3: 20
      cite: TDC 9.080(A) driveway widths; 8.120.C.5.a approach; 8.120.C.4.d frontage; 9.095(D) setback
    # One rule, and the interesting part is everything absent around it. GMC
    # 17.48.040(2)(e): parking spaces along the outer boundaries of a parking
    # lot are "contained by a curb at least four inches high and set back a
    # minimum of five feet from the property line". Five feet of real ground,
    # and unlike Portland's or Happy Valley's it is not a street-only rule --
    # it says property line. Only the street half is mirrored because only the
    # street half has a field; the side and rear halves are refused in the
    # corpus, where R-7.2's 7.5 ft side yard and both zones' 15 ft rear already
    # swallow the five.
    #
    # NO DRIVEWAY WIDTH AND NO CURB-CUT CEILING, read rather than unlooked-for.
    # "Driveway" appears five times in Chapter 17.48 and every one is about
    # something else -- a half-acre tree canopy plan, a school's passenger lane,
    # the no-backing rule -- and neither dimensional chapter states one. So the
    # pod is drawn with the design lane and nothing narrows it at the street.
    #
    # No private open space either: Gladstone's residential chapters state none
    # for this building. Fifth city of eight to reserve nothing.
    gladstone:
      parking_street_setback_ft: 5
      cite: GMC 17.48.040(2)(e), parking spaces set back five feet from the property line
    # MCC 39.6560(A), and it is written for exactly the plat this stage draws:
    # "where a parking or loading area does not abut directly on a public
    # street... there shall be provided an unobstructed driveway not less than
    # 20 feet in width for two-way traffic". A rear court does not abut the
    # street, so the side lane is twenty feet -- eight more than the design
    # lane, matching Happy Valley and four short of West Linn. No one-way
    # figure anywhere in the chapter, so that field stays empty rather than
    # borrowing the two-way number.
    #
    # 39.6580(A) sets parking back from a street by the ZONE'S required yard,
    # so it is a map rather than a number, the third city in this file to
    # state it that way. The redirect at 39.6585(A) prints a ten-foot floor for
    # the same rule -- 39.8045(C)(3)(b)'s landscaped strip -- and every zone in
    # the map is at or above it.
    #
    # THE OPEN SPACE IS ONE ZONE'S ONLY, and it is the first entry in this file
    # where a reserve turns on how a use is APPROVED rather than on what it is.
    # A multiplex is a conditional use in LR-7 (MCC 39.4856(C)), design review
    # applies to conditional uses (39.8020(A)), and design review carries
    # 39.8045(A)(2): 300 square feet per unit of shared outdoor recreation for
    # an apartment development of three-bedroom units, which is 1,200 for this
    # pod. MR-4 permits the pod outright so review never starts, and the four
    # Portland pockets are governed by PCC, where Table 110-4 asks 250 -- not
    # mirrored here, because the corpus reads that number into the Portland
    # layer and not into this one.
    #
    # No approach ceiling, no frontage share, no maneuvering cap and no front
    # parking ban: read and absent. 39.6580(C) comes closest -- "not more than
    # two driveways which do not exceed the width of their curb cuts for each
    # 150 feet of street frontage" -- and states a count, never a width.
    multnomah_unincorporated:
      drive_min_two_way_ft: 20
      parking_street_setback_by_zone:
        R20: 20
        R10: 20
        R7: 15
        LR7: 20
      open_space_sqft_by_zone:
        R20: null
        R10: null
        R7: null
        LR7: 1200
      cite: MCC 39.6560(A) driveway width; 39.6580(A) street setback; 39.8045(A)(2) shared outdoor recreation
    # TWO RULES, AND THE CODE SAYS WHICH IS WHICH. Figure 73-1's last two
    # rows dimension the driveway inside a parking lot -- 12 feet one way, 22
    # two way, identical in both grids -- and 73C.090(1)(a) dimensions what
    # meets the street, saying so in the sentence: "driveway widths must be
    # measured at the right-of-way line". So the side lane is the figure's 22
    # and the cut is 73C.090's, which is a floor of ten feet and a ceiling of
    # 24. The lane is narrower than the ceiling, so the cut is the lane.
    #
    # 73C.090(1)(a) NAMES THE BUILDING, which no other city in this file does:
    # "Ingress and egress for single-family residential uses and middle
    # housing types (duplexes, triplexes quadplexes, townhouses, and cottage
    # clusters)". No noun to argue and no row to choose. The table underneath
    # it starts at five dwelling units and is not this building's.
    #
    # The parking setback is per zone because only one zone has one. RML's
    # Table 41.300 carries a row of its own -- "Parking and Vehicle
    # Circulation Areas / 10 feet" -- and RL states the same ten feet inside
    # its Conditional Uses row, where a quadplex, permitted outright by TDC
    # 40.210, never lands. Every one of Tualatin's lots in the parcel universe
    # is RL.
    #
    # NOT MIRRORED AND NOT INERT: RML's ten feet is measured from any lot
    # line, and only the street half has a field. RML's side yard is five, so
    # a court drawn to the envelope would stand five feet closer to each side
    # line than the code allows. RML holds no lots today; the day one appears,
    # this city comes off the list above. No open space anywhere -- neither
    # residential chapter states a private reserve, and 73C.220's landscape
    # setback and transition govern "Multi-family residential uses (as defined
    # in TDC 31.060)", which TDC 31.060 defines as five or more units.
    tualatin:
      approach_min_ft: 10
      approach_max_ft: 24
      drive_min_one_way_ft: 12
      drive_min_two_way_ft: 22
      parking_street_setback_by_zone:
        RL: null
        RML: 10
      cite: TDC 73C.030(1) and Figure 73-1 driveway rows; 73C.090(1)(a) approach; TDC 41.300 parking setback
    # NO DRIVE AND NO CUT, and the code says so twice. The only sentence in
    # Section 350 about the width of an access point is 350.030(D): "Access
    # points with the street shall be the minimum necessary... Curb cuts shall
    # be designed to established City standards" -- a redirect naming no
    # document, which is a weaker version of Clackamas County's Standard
    # Drawing P100, because there at least the drawing has a number on it. And
    # 350.055(C)'s nine-foot residential driveway belongs to the article that
    # does not reach this building, so it is not borrowed. Both fall to the
    # design defaults, which is the same place Fairview, Gladstone, Oregon City
    # and Portland land.
    #
    # The parking setback is five feet from a street lot line. Table 350-2
    # prints "5 ft/L2 10 ft/L1" in one cell -- five feet if the strip is
    # planted to the L2 standard, ten if only to L1 -- and five is the minimum
    # the code requires. It is inert either way: every residential zone here
    # sets the building ten feet off the front lot line.
    #
    # NOT MIRRORED AND INERT: the other two rows of Table 350-2 set a parking
    # area back from a side or rear lot line, five feet against an LR or MR
    # neighbour. Five feet is exactly the side yard in LR 7.5, MR 2 and MR 4,
    # less than LR 12's ten, and a third of every rear yard. No open space:
    # neither residential chapter states a private reserve, and 350.065(E)'s
    # interior landscaping applies to parking areas "with more than 10 spaces".
    wood_village:
      parking_street_setback_ft: 5
      cite: WVDC 350.065(C) Table 350-2, lot line abutting street, all zones except GM
  # The three engineering constants left after the law came out of this block.
  # Not one is a citation. A car needs a lane and a wall needs a standoff
  # whatever the code says; where a city asks for more, the city wins.
  driveway_lane_design_ft: 12
  driveway_cut_min_design_ft: 9
  building_parking_gap_ft: 5
