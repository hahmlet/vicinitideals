# Candidate building footprints + fit parameters.
#
# PRODUCT (Steph, 2026-07-24): 1,000 sqft 2-story townhomes, ~500 sqft ground
# footprint each, built as PODS OF 4 side-by-side — so the rectangle we must
# fit is the WHOLE POD: (4 x unit width) wide x unit depth deep, ~2,000 sqft
# ground coverage. A lone 500 sqft rectangle fitting proves nothing.
#
# width_ft = dimension parallel to the front lot line (before any 90° flip);
# both orientations are tested unless the jurisdiction is axis_required.

orientations: [width_facing, depth_facing]

footprints:
  # 4 x 14x36 units (504 sqft each) — skinny/deep pod
  - { name: "pod56x36", width_ft: 56, depth_ft: 36 }
  # 4 x 20x25 units (500 sqft each) — wide/shallow pod
  - { name: "pod80x25", width_ft: 80, depth_ft: 25 }

# Fixed-area aspect-ratio optimizer: pod area held constant at 2,000 sqft
# (4 x 500 sqft units, identical upper/lower floor plates), depth = area /
# width. Pod width step 2 ft = unit width step 0.5 ft; unit width = pod / 4.
# Reports the unlock-% curve and statistically optimal pod (and thus unit)
# dimensions.
constant_area_sweeps:
  - { area_sqft: 2000, width_min_ft: 56, width_max_ft: 140, step_ft: 2 }

# Per-lot max-depth-per-width frontier (answers arbitrary WxD queries without
# re-running the pipeline). Extends to 145 ft to cover the widest pod.
frontier:
  width_min_ft: 12
  width_max_ft: 145
  step_ft: 0.5

# Large-lot subdivision screen (attribute math only — any change here needs
# just an s7 re-run, seconds). Each carved pod lot must supply
# quad_ground_sqft of buildable envelope (the 2,000 sqft pod) plus
# units_per_quad * parking_slots_per_unit * parking_sqft_per_slot for parking
# (stalls only, no travel lanes — stated approximation), and must satisfy the
# zone's quadplex minimum lot area. Non-split (1 SFR -> pod-of-4 conversion)
# lots carry NO parking requirement (street parking assumed to absorb).
split:
  quad_ground_sqft: 2000
  parking_slots_per_unit: 1.5
  parking_sqft_per_slot: 162 # 9x18 stall
  units_per_quad: 4
  min_quads: 2 # >= this many carved lots to count as a split candidate

# Current-use + value + acquisition-economics screen (s7-only, seconds to re-run).
# Current use tagged from assessor property class: existing multifamily and
# commercial/industrial lots are excluded from the headline by default (team
# won't replace those uses) — a counted, reversible funnel step. TOTALVAL is
# the county Real Market Value (land+building market estimate — NOT the
# Measure-50 capped assessed value, which is ~45% of it and unused here), so
# value is a reported finance_tier slice (vacant / teardown_candidate /
# improved), never a hidden kill — filter the CSVs to your own price tolerance.
#
# Acquisition economics = land cost per door. Acquisition estimate is a
# post-COVID arm's-length sale where recorded, else TOTALVAL (RMV).
# land_cost_per_unit = acquisition / doors (doors = 4 for a 1-lot conversion,
# 4 x carved pods for a split — split door counts are the theoretical maximum,
# so per-door cost there is a floor). Preferred <= $30k, ceiling <= $45k. A
# slice, not a gate — see viable_candidates.csv (cheapest dirt first).
screen:
  exclude_current_use: [multifamily, commercial]
  teardown_max_improvement_share: 0.5 # building <= 50% of total market value
  vacant_max_improvement_value: 5000 # <= this improvement $ = virtually vacant
  recent_sale_min_year: 2020    # sales this year or later are trusted; older -> RMV
  recent_sale_min_price: 10000  # below this = nominal/intra-family transfer, ignore
  preferred_land_cost_per_unit: 30000 # target dirt cost per door
  max_land_cost_per_unit: 45000       # hard ceiling per door

# Procedural site-plan generator (s6s stage). Lays out a REAL plan per lot —
# building at the front, driveway to a parking court, 90° stalls counted by
# geometry, and a mandatory private open-space reservation — then tightens the
# 1-lot conversion verdict in s7 (a bare pod rectangle fitting no longer counts
# as buildable; a building + parking + driveway must lay out). Scoped to a
# single pilot cell (Gresham LDR-5); every other lot passes through untouched.
#
# Parking counts are Steph's marketability target, NOT a legal floor: Gresham
# LDR-5 requires ZERO parking (CFEC citywide elimination, §9.0802(A)) and sets
# NO maximum (Table 9.0851A), so all three tiers are legal.
#
# Product = attached townhomes (fee-simple lots) → Gresham §7.0431 governs
# parking, not the quadplex §7.0420. Off-street parking sits in the REAR yard,
# reached by ONE consolidated driveway down a SIDE (never across the front,
# §7.0431(B)(3)(b)); combined curb cut ≤ max(18 ft, 34% of frontage),
# §7.0431(B)(2)(b). Cars pull in and out forward, so nothing backs onto the
# street — which the code bans only on arterials (Appendix A5.404). One
# typology: townhome_rear_court.
#
# Setbacks/height/FAR/min-lot come from the verified rules.yaml gresham/LDR-5
# row (front 10 / side 5 / rear 15 / street-side 10, min lot 5,000, FAR 1.0).
siteplan:
  enabled: true
  pilot_jurisdiction: gresham
  pilot_zone: LDR-5
  # Marketability tiers — spaces per townhome unit (pod = 4 units).
  parking_per_unit_min: 1.0        # 4/pod  (tight-lot floor)
  parking_per_unit_target: 1.5     # 6/pod  (design target)
  parking_per_unit_preferred: 2.0  # 8/pod  (preferred; legal — no LDR-5 ceiling)
  units_per_pod: 4
  layout_methods: [townhome_rear_court]
  stall_width_ft: 8.5              # §7.0431(B)(5)(b): 8.5 x 18 (90°)
  stall_depth_ft: 18.0
  parallel_stall_ft: [8, 24]       # §7.0431(B)(5)(b) parallel option
  aisle_width_two_way_ft: 24       # double-loaded court aisle / OFC emergency access
  aisle_width_one_way_ft: 20       # single-loaded court aisle
  driveway_approach_min_ft: 18     # §7.0431(B)(2)(b): combined curb cut =
  driveway_approach_frontage_pct: 34  #   max(18 ft, 34% of frontage) — see note
  driveway_min_travel_ft: 12       # single side travel lane width to the rear
  building_parking_gap_ft: 5
  private_open_space_pct: 15       # §7.0431(D)(1), of gross parent lot
